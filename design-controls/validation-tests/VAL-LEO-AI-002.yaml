# -- VAL-LEO-AI-002 -- Human-in-the-Loop Review Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-002"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs:
      - "UN-LEO-AI-010"
      - "UN-LEO-AI-002"
    design_inputs:
      - "DI-LEO-AI-015"
      - "DI-LEO-AI-016"
    risks:
      - "R-LEO-AI-006"
      - "R-LEO-AI-001"
    verification_tests:
      - "VT-LEO-AI-009"
      - "VT-LEO-AI-010"

  metadata:
    title: "Human-in-the-Loop Review Validation"
    validation_phase: "alpha"
    test_type: "user_acceptance"
    automation_level: "manual"
    participants:
      user_type: "internal_qa"
      count: 5
      selection_criteria: "QA staff with clinical coding experience or anchor review training"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "All linked verification tests (VT-LEO-AI-009, VT-LEO-AI-010) have passed"
      - "Staging environment deployed with review UI and API"
      - "Pre-populated review queue with mixed-quality coding proposals (correct, incorrect, partial)"
      - "Pre-populated anchor assignments with known correct and incorrect entries"
      - "Participants trained on review interface and acceptance/rejection workflow"
    infrastructure: "Azure Container Apps staging environment with review UI, core API, and Redis"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Clinical coder reviews coding proposals"
      user_role: "Clinical Coder"
      user_goal: "Review system-generated SNOMED CT coding proposals and confirm correct codes, reject incorrect codes, and edit partial codes"
      preconditions:
        - "Review queue contains at least 50 coding proposals with known correctness labels"
        - "Proposals include a mix of correct (60%), incorrect (20%), and partial (20%) codes"
        - "Reviewer is logged in with clinical-coder role"
      steps:
        - step_number: 1
          action: "Open the coding review queue and select the first batch of proposals"
          expected_result: "Review interface displays coding proposals with patient context, encounter text, and proposed SNOMED codes"
          success_criteria: "All required context is visible without needing to navigate away"
        - step_number: 2
          action: "Review a correct coding proposal and confirm it"
          expected_result: "Proposal status changes to confirmed; confirmation is recorded with reviewer ID and timestamp"
          success_criteria: "Confirmation persists on page refresh and appears in audit trail"
        - step_number: 3
          action: "Review an incorrect coding proposal and reject it with a reason"
          expected_result: "Proposal status changes to rejected; rejection reason is recorded"
          success_criteria: "Rejection reason is mandatory and stored with audit metadata"
        - step_number: 4
          action: "Review a partial coding proposal, edit the SNOMED code, and confirm the amended version"
          expected_result: "Original proposal is replaced by the amended version; edit history is preserved"
          success_criteria: "Both original and amended codes are retained in the audit trail"
        - step_number: 5
          action: "Complete the full review batch and check summary statistics"
          expected_result: "Summary shows counts of confirmed, rejected, and edited proposals"
          success_criteria: "Summary totals match the number of individual review actions taken"
      postconditions:
        - "All proposals in the batch have a review decision (confirmed, rejected, or edited)"
        - "Audit trail contains reviewer ID, timestamp, and decision for each proposal"
      success_metrics:
        - metric: "Review decision accuracy"
          target: ">= 90% of review decisions match the known correctness labels"
          measurement_method: "Compare reviewer decisions against pre-labelled ground truth"
        - metric: "Review throughput"
          target: ">= 20 proposals reviewed per hour"
          measurement_method: "Count completed reviews divided by elapsed time"
        - metric: "Edit quality"
          target: ">= 85% of edits produce a correct final code"
          measurement_method: "Compare edited codes against gold-standard labels"
      evidence_to_capture:
        - "Per-reviewer decision log with timestamps"
        - "Accuracy breakdown by proposal type (correct, incorrect, partial)"
        - "Time-per-review measurements"
        - "Screenshots of review interface at key steps"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Anchor reviewer validates milestone assignments"
      user_role: "Clinical Audit Reviewer"
      user_goal: "Review system-assigned clinical milestones (anchors) and validate or correct anchor placement on patient timelines"
      preconditions:
        - "Anchor review queue contains at least 30 anchor assignments with known correctness"
        - "Assignments include diagnosis anchors, referral anchors, and treatment-start anchors"
        - "Reviewer is logged in with audit-reviewer role"
      steps:
        - step_number: 1
          action: "Open the anchor review queue and select a patient timeline"
          expected_result: "Timeline view displays encounters with assigned anchors highlighted"
          success_criteria: "Anchor positions are clearly visible on the timeline with type labels"
        - step_number: 2
          action: "Validate a correctly placed diagnosis anchor"
          expected_result: "Anchor status changes to validated; validation is recorded"
          success_criteria: "Validated anchor is visually distinguished from unreviewed anchors"
        - step_number: 3
          action: "Reject an incorrectly placed referral anchor and reassign it to the correct encounter"
          expected_result: "Original anchor is removed; new anchor is placed at the selected encounter"
          success_criteria: "Anchor reassignment is recorded in audit trail with both old and new positions"
        - step_number: 4
          action: "Add a missing treatment-start anchor that the system did not detect"
          expected_result: "New anchor is created at the specified encounter with correct type"
          success_criteria: "Manually added anchor is flagged as human-assigned in metadata"
      postconditions:
        - "All anchors in the review set have a review decision"
        - "Audit trail captures every anchor validation, rejection, and manual addition"
      success_metrics:
        - metric: "Anchor review accuracy"
          target: ">= 90% of review decisions match the known correct anchor positions"
          measurement_method: "Compare reviewer decisions against pre-labelled ground truth"
        - metric: "Anchor review throughput"
          target: ">= 20 anchor reviews per hour"
          measurement_method: "Count completed anchor reviews divided by elapsed time"
      evidence_to_capture:
        - "Per-reviewer anchor decision log with timestamps"
        - "Before/after anchor positions for reassigned anchors"
        - "Screenshots of timeline view during review"

  acceptance_criteria:
    - criterion: "Reviewers complete review tasks correctly"
      target: ">= 90% of review decisions match ground truth labels"
      measurement_method: "Compare reviewer decisions against pre-labelled correctness data"
    - criterion: "Review throughput meets operational requirements"
      target: ">= 20 items reviewed per hour per reviewer"
      measurement_method: "Total items reviewed divided by total reviewer-hours"
    - criterion: "Audit trail completeness"
      target: "100% of review actions have a recorded audit entry"
      measurement_method: "Count audit trail entries vs count of review actions"

  user_feedback:
    feedback_methods: ["survey", "observation"]
    usability_metrics:
      task_completion_target: ">=90%"
      time_on_task_target: "<= 3 minutes per coding proposal; <= 3 minutes per anchor review"

  evidence_bundle:
    bundle_id: "VAL-002-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-002/"
    artifacts:
      - type: "user_acceptance_results"
        description: "Review accuracy and throughput results per participant"
      - type: "task_completion_data"
        description: "Per-item review decisions with timestamps and accuracy labels"
      - type: "audit_provenance_snapshot"
        description: "Complete audit trail for all review actions during validation"
    immutability: true

  execution_history: []
