# -- DI-LEO-AI-146 -- Wave E Phase 2a-iv: GoldLabelDetailDialog chrome redesign
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-146"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    The dialog opened when a reviewer clicks a card in the Training
    Data tab (Candidates and Verified gold sub-tabs) SHALL be
    restructured around a single primary action and progressive
    disclosure of destructive / power-user actions.
    The legacy MUI DialogTitle ("Review this example" + secondary
    line + close icon), the always-visible "Recommended links"
    info-tinted box, the inline Delete confirm panel, and the
    legacy DialogActions footer (Close + Delete + Skip + Accept-all
    + Mark-as-gold) SHALL be replaced with four sub-components
    living under
    services/ui/src/components/gold-dataset/GoldLabelDetailDialog/:
      - DialogTitleStrip: compact two-line strip with status pill
        (uncoded count + suggested count) and ToolbarActions for
        copy / annotation guidelines / shortcuts / close.
      - SuggestionsPanel: collapsible "Recommended links" with a
        single "Accept all" primary affordance and per-row
        Accept / Reject as tertiary buttons.
      - DeleteConfirmPanel: slide-in confirmation strip with
        suppress-on-delete toggle.
      - DialogActionsBar: single primary action ("Mark as gold")
        whose label morphs to "Accept N + mark as gold" when
        suggestions are pending; Skip-to-next as tertiary text;
        Delete behind a kebab overflow menu.
    All existing handlers (relation suggestion accept / reject /
    undo, mark-as-gold, accept-all-suggestions, delete-with-suppress,
    skip-to-next, copy-sentence, annotation guidelines toggle,
    keyboard shortcut help) MUST continue to work without behaviour
    change.
  rationale: >
    Reviewer feedback on 2026-04-17: "the dialog has two green
    buttons in the footer, a loud orange info box at the top, and
    nothing tells me what's actually outstanding". The dialog was
    the worst remaining offender in the Training Data tab after
    the row redesign in DI-LEO-AI-144 -- a 2,080 LOC inline
    component with five footer buttons, two competing primary
    actions ("Mark as gold" and "Accept all and mark as gold"
    side by side, both green), and a saturated info box that
    visually outweighed the entity terms below it. The dialog is
    where reviewers spend the most time, so calming it has the
    highest UX leverage of any remaining Phase 2 surface.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: The footer renders exactly ONE primary contained
          button ("Mark as gold"). All other actions are either
          text/secondary, or hidden behind the kebab.
      - type: "functional"
        spec: >
          AC-002: The title strip shows a status pill that
          summarises uncoded entities (N need code) and pending
          suggestions (N suggested) in one glance, OR a green
          "Ready to mark gold" pill when both counts are zero.
      - type: "functional"
        spec: >
          AC-003: Delete is rendered behind a kebab overflow menu
          (data-testid: dialog-more-actions / dialog-delete-menu-item).
          Direct delete buttons MUST NOT appear in the footer.
      - type: "functional"
        spec: >
          AC-004: SuggestionsPanel renders nothing when the
          relationSuggestions list is empty; when present it is
          collapsible (default open) with a single "Accept all"
          primary action and per-row Accept/Reject as tertiary
          text buttons.
      - type: "functional"
        spec: >
          AC-005: When at least one suggestion is pending AND the
          uncoded count is non-zero, the primary button label
          MORPHS to "Accept N + mark as gold" (data-morph
          attribute set to "accept-and-mark"); otherwise it
          renders as "Mark as gold" (data-morph "mark"). The
          underlying handler differs accordingly (accept-all then
          flush-and-mark vs. flush-and-mark only).
      - type: "functional"
        spec: >
          AC-006: All pre-existing handlers in the legacy
          GoldLabelDetailDialog continue to be wired:
          handleAcceptRelationSuggestion, handleRejectRelationSuggestion,
          handleUndoRejectedRelation, handleAcceptAllSuggestions,
          flushTermDraftsAndMarkGold, onDeleteCandidate (with
          suppress flag), onNextCandidate, copyToClipboard, and
          the showShortcutHelp / showGuidelines toggles.
    constraints:
      - type: "safety"
        spec: >
          The redesign MUST NOT silently drop any reviewer-controlled
          action. In particular: the "Skip to next" affordance MUST
          remain reachable for queue continuity, and the suppress-
          on-delete checkbox MUST remain available so reviewers can
          permanently block a bad sentence from the pipeline.
      - type: "safety"
        spec: >
          The dialog MUST continue to render correctly when
          annotationGuidelines is null and when onDeleteCandidate /
          onNextCandidate / onMarkGold are undefined (these are
          optional in the props contract).
    dependencies: ["DI-LEO-AI-142", "DI-LEO-AI-144"]
    downstream_impacts:
      - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/"
    technical_details:
      language: "TypeScript"
      framework: "React + MUI + Framer Motion + @leo/design-system"
      file_structure:
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DialogTitleStrip.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DialogActionsBar.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/SuggestionsPanel.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DeleteConfirmPanel.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/AddTermPopover.tsx"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      estimated_loc: 700

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-144 passes: 9 test cases covering panel-import
      assertions, status-pill semantics, single-primary-action
      footer, primary-action morph, suggestions-panel collapse,
      and delete-confirm panel toggling.
    test_protocol: "VT-LEO-AI-144"

  safety_class: "B"
  risks: ["R-LEO-AI-099"]
  tags:
    - "knowledge"
    - "training-data"
    - "design-system"
    - "progressive-disclosure"
    - "wave-e"
    - "phase-2a-iv"
