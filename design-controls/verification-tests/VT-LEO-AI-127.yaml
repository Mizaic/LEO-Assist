# -- VT-LEO-AI-127 -- Motion layer reduced-motion gate
# IEC 62304 Verification Test

- id: "VT-LEO-AI-127"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-131"]
    risks: ["R-LEO-AI-090"]

  metadata:
    title: "useMotion() collapses transitions when reduced motion is requested"
    description: >
      Verifies that the MotionProvider + useMotion hook from
      @leo/design-system/motion observes the prefers-reduced-motion
      media query and that transitions have duration 0 when it is
      reducing. Satisfies WCAG 2.1 SC 2.3.3.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/design-system-motion.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "jsdom matchMedia is stubbed to return the media query under test"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-127-TC-001"
      case_name: "Default motion state"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render a component using useMotion() inside MotionProvider with matchMedia.matches === false"
          expected_result: "useMotion() returns { reducedMotion: false, transitions: { default: { duration: 180 }, ... } }"
      verification_method: "automated"
      acceptance_criteria:
        - "transitions.default.duration === 180"
        - "transitions.spring has mass, stiffness, damping fields"

    - case_id: "VT-127-TC-002"
      case_name: "Reduced-motion state"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render a component using useMotion() inside MotionProvider with matchMedia.matches === true"
          expected_result: "useMotion() returns reducedMotion: true and transitions.default.duration === 0"
      verification_method: "automated"
      acceptance_criteria:
        - "reducedMotion === true"
        - "transitions.default.duration === 0"
        - "transitions.spring.duration === 0"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-127/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-127-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-1-foundation"
      environment: "development"
      result: "pass"
      notes: >
        jest src/__tests__/design-system-motion.test.tsx -> 2 passed.
        Covers TC-001 default motion transitions and TC-002 reduced-motion
        collapse (matchMedia(prefers-reduced-motion: reduce) matches=true).
