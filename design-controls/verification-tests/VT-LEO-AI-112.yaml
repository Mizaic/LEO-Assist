# -- VT-LEO-AI-112 -- SpanResolver unit tests
# IEC 62304 Verification Test

- id: "VT-LEO-AI-112"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-112"]
    risks: ["R-LEO-AI-003"]

  metadata:
    title: "SpanResolver resolves absolute character offsets for LLM-extracted terms"
    description: >
      Verifies that SpanResolver assigns correct spans for single and
      repeated mentions, handles case-insensitivity, advances the
      encounter cursor, and falls back gracefully when a sentence lookup
      fails.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_span_resolver.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-112-TC-001"
      case_name: "single mention resolves to correct offsets"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Instantiate SpanResolver with encounter 'Patient reports chest pain today.'"
          expected_result: "encounter_text loaded"
        - step_number: 2
          action: "Call resolve('chest pain')"
          expected_result: "returns (16, 26); encounter_text[16:26] == 'chest pain'"
      verification_method: "automated"
      acceptance_criteria:
        - "resolved offsets match actual substring position"

    - case_id: "VT-112-TC-002"
      case_name: "repeated mentions advance encounter cursor"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call resolve('cough') twice on encounter containing 'cough ... cough'"
          expected_result: "second call returns offsets strictly after the first"
      verification_method: "automated"
      acceptance_criteria:
        - "second.start > first.end"

    - case_id: "VT-112-TC-003"
      case_name: "case-insensitive matching"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Resolve 'Diabetes' in encounter containing lowercase 'diabetes'"
          expected_result: "returns offsets of the lowercase substring"
      verification_method: "automated"
      acceptance_criteria:
        - "case difference does not prevent resolution"

    - case_id: "VT-112-TC-004"
      case_name: "sentence lookup fallback"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Resolve a term with a sentence_id that is not registered"
          expected_result: "falls back to encounter-wide search, returns valid offsets"
      verification_method: "automated"
      acceptance_criteria:
        - "no exception; offsets returned from encounter search"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-112/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_date: "2026-04-16"
      executor: "automated-pytest"
      result: "pass"
      notes: "4/4 cases pass as part of the session fixing character offsets for LLM-extracted entities."
