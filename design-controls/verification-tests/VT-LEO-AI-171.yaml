    - case_id: "VT-171-TC-002"
      case_name: "Playwright spec iterates the eight Knowledge tabs"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/e2e/knowledge-tabs.spec.ts"
          expected_result: >
            Contains a KNOWLEDGE_TABS array of eight tab keys
            (training-data, surface-forms, context-rules,
            ai-instructions, clinical-guidelines, pathways, domains,
            terminology) and at least one test case using AxeBuilder
            with WCAG 2.0/2.1 AA tags.
          verification_method: "automated"
      acceptance_criteria:
        - "All eight tab keys referenced"
        - "AxeBuilder + WCAG AA tags present"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
