# -- DI-LEO-AI-221 -- POST /patients/.../coded-links/sync-from-gold (dual save)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-221"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-088"
  requirement: >
    The system SHALL expose POST
    /patients/{patient_id}/encounters/{encounter_id}/coded-links/sync-from-gold
    that takes the entities saved from the shared dialog and the
    `expected_baseline_concept_ids` last seen by the dialog and,
    in a single transactional unit, (a) refuses the write with HTTP
    409 if the live encounter's current concept_id set has drifted
    from the expected baseline, (b) adds, removes, and updates the
    live :DOCUMENTS coded links so that the encounter exactly
    matches the saved entity set, and (c) mirrors the same entity
    array onto the linked GoldLabel via UPDATE_GOLD_LABEL_ENTITIES.
    The response MUST report counts of links added, removed, and
    updated, plus the new `baseline_concept_ids` so the dialog can
    use them as the next optimistic-concurrency baseline.
  rationale: >
    Live coded data drives downstream pipelines (dashboards, safety
    alerts, escalation parity). A reviewer who has the dialog open
    in one tab while a pipeline run finishes writing in another
    must not be allowed to silently overwrite that work. Optimistic
    concurrency by `concept_id` set is sufficient because the
    dialog seeded itself from the same set, and the editor cannot
    add a concept it did not see in the seed.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          The endpoint MUST require the caller to be in patient
          scope and 404 when the encounter does not exist; the
          gold mirror step MUST 404 when the linked label does not
          exist (returned to the dialog as a 502 with explanatory
          message).
      - type: "functional"
        spec: >
          When the current `baseline_concept_ids` on the encounter
          differ from `expected_baseline_concept_ids` the endpoint
          MUST return HTTP 409 with `detail` describing the drift
          and MUST NOT make any writes (live or gold).
      - type: "functional"
        spec: >
          Live writes MUST go through `PatientGraphWriter` so that
          existing audit/event logging applies; entities without a
          concept_id MUST be skipped on the live path (they remain
          in the gold mirror as user-curated drafts).
      - type: "functional"
        spec: >
          `body_site_concept_id` and `body_site_term` MUST be
          embedded in the `modifiers` JSON object on the
          `SemanticLinkPayload` so the existing `_upsert_query` can
          persist them without schema changes.
      - type: "functional"
        spec: >
          The gold mirror MUST overwrite `entities_json` on the
          linked label with the full saved entity array (no merge);
          this matches the dialog's "what you see is what you save"
          contract.
      - type: "functional"
        spec: >
          The response MUST include `gold_label_id`,
          `live_links_added`, `live_links_removed`,
          `live_links_updated`, and `baseline_concept_ids`.
    constraints:
      - type: "safety"
        spec: >
          The dialog's expected baseline MUST be required (empty
          string label_id is rejected with 422). This prevents a
          malformed client from skipping the concurrency check.
      - type: "safety"
        spec: >
          Live writes and the gold mirror MUST share a single Neo4j
          session; a failure on the gold mirror MUST surface as an
          error response so the dialog can retry, and the dialog
          MUST treat any non-2xx as "no save happened" for UX
          purposes.
    dependencies:
      - "DI-LEO-AI-220"
    downstream_impacts:
      - "Reviewer corrections on /care/* now flow into both live coded data and the gold training dataset"
      - "Pipeline writes that touch coded links must continue to update concept_id atomically (no behavioural change required)"
    technical_details:
      language: "Python"
      framework: "FastAPI + Neo4j + PatientGraphWriter"
      file_structure:
        - "services/api/app/routers/patients.py"
      estimated_loc: 260

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-212 covers the happy path (add/remove/update +
      mirror), the optimistic-concurrency 409, the empty-entities
      no-op, the no-concept-id skip, the empty-label-id 422, and
      the missing-gold-label 502.
    test_protocol: "VT-LEO-AI-212"

  safety_class: "B"
  risks:
    - "R-LEO-AI-206"
    - "R-LEO-AI-207"
  tags:
    - "live-encounters"
    - "training-data"
    - "gold-mirror"
    - "concurrency"
