# -- R-LEO-AI-211 -- Reviewer picks the wrong patient in PatientFinder
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-211"
  title: "A reviewer using the PatientFinder dialog selects a different patient from the one they intended and runs an SBAR or downstream tool against the wrong record"

  hazard:
    description: >
      The shared PatientFinder primitive (DI-LEO-AI-230) lets a
      reviewer search and pick any patient in scope. If the result row
      shows only a generated display name, two patients with similar
      names (or two test patients seeded from the same template) can
      look identical in the picker. The reviewer selects the wrong
      row, the SBAR Playground (or any other consumer of the
      primitive) runs a real pipeline job against the wrong patient
      id, and a real :Assessment node is created on the wrong patient.
    category: "clinical_safety"

  hazardous_situation: >
    A QA reviewer wants to test a prompt change for "John Smith born
    1962". They open the PatientFinder, type "smith", and the
    typeahead returns five matches. Two are seeded with the same
    surname and similar first names. With only the display name
    visible the reviewer clicks the wrong row, kicks off an SBAR run,
    and the orchestrator persists an Assessment on the wrong patient.
    The reviewer now compares the SBAR output to the source record of
    the intended patient, sees a mismatch, and either (a) misreads it
    as a prompt regression or (b) shares the wrong-patient summary
    with a colleague who treats it as a real clinical artefact.

  harm:
    description: >
      Wrong-patient :Assessment in the graph (data integrity harm)
      and -- if the output is shared off-platform -- a wrong-patient
      clinical summary that could influence a coding or care
      decision. Severity is serious because the playground writes to
      production patient nodes.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Every PatientFinder result row MUST display NHS number AND
        date of birth alongside the display name. The card layout
        renders these as separate, prominent secondary lines so the
        reviewer must look at three independent identifiers before
        clicking. The same rule applies to the search, filter and
        cohort tabs.
      implemented_by: ["DI-LEO-AI-230"]
      verified_by: ["VT-LEO-AI-230"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The SBAR Playground confirmation chip after a patient is
        selected echoes the same NHS number and DOB so the reviewer
        gets a second look at the identifier before pressing
        "Generate SBAR".
      implemented_by: ["DI-LEO-AI-230", "DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-230", "VT-LEO-AI-188"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        QA reviewer onboarding documentation states that any wrong-
        patient :Assessment created in the playground must be
        reported and removed via the existing assessment cleanup
        script. (Follow-up procedural control; not blocking this
        risk closure.)
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: []
      effectiveness: "pending"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Three independent identifiers visible on every row (display
      name + NHS number + DOB) plus a pre-submit echo chip make
      mis-selection require three concurrent confirmation failures
      by the same reviewer in a row. The page is admin-only and the
      QSIR-aligned Concern field gives a fourth implicit "is this
      the patient I am worried about?" check. Procedural cleanup
      covers the rare residual mis-select.

  monitoring:
    monitoring_plan: >
      Banner of identifiers checked on every UI release by
      VT-LEO-AI-230 (jest static-source) and the e2e Playwright
      journey for the playground. Watch for any post-deploy support
      ticket mentioning "wrong patient" against /admin/ai-summarisation.
    metrics:
      - "VT-LEO-AI-230 status (must be 'pass' on every release)"
      - "Reviewer-reported wrong-patient incidents on /admin/ai-summarisation (target 0)"
    review_frequency: "Per release + quarterly QA review"

  metadata:
    identified_by: "Plan workshop 2026-04-18 (SBAR playground UX rework)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "sbar"
      - "playground"
      - "patient-finder"
      - "admin-ui"
      - "patient-safety"
