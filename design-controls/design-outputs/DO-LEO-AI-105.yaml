# -- DO-LEO-AI-105 -- Multi-label NER Span Classification
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-105"
  version: "1.1.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-107"]
    user_needs: ["UN-LEO-AI-061"]
    risks_addressed: ["R-LEO-AI-073"]
    verification_tests: ["VT-LEO-AI-107"]

  specification:
    title: "Multi-label NER - spancat component, layer 5 nesting refinement, prompt preservation"
    description: |
      Eight coordinated changes to support multi-label span classification:

      1. base.cfg: pipeline switched from ["transformer","ner"] to
         ["transformer","spancat"]. NER component block replaced with
         SpanCategorizer.v1 using ngram_range_suggester (min_size=1,
         max_size=10) and TransformerListener. Score weights updated to
         spans_sc_f. Suggester upgraded from ngram_suggester sizes=[1..5]
         to ngram_range_suggester max_size=10 to cover entity spans up to
         10 tokens (p95 of gold-label corpus), recovering 11.6% of training
         spans that were silently dropped by the 5-token cap.

      2. label_exporter._record_to_spacy_doc(): seen_tokens dedup guard
         removed. doc.ents assignment replaced with doc.spans["sc"] so
         overlapping and co-located spans are all written to DocBin.

      3. evaluator._build_per_label(): reads spans_sc_per_type instead
         of ents_per_type. Score threshold checks updated to spans_sc_f.

      4. model_inference /extract: iterates doc.spans.get("sc", []) for
         post-spancat models; falls back to doc.ents with a logged warning
         for pre-spancat model artifacts (backward compatibility).

      5. post_processing.normalise_entity_types(): same-label nesting
         suppression now only fires when both spans share an identical
         normalized lookup term. Spans with the same label but different
         normalized terms are both preserved.

      6. extraction_v1.py: SEMANTIC TAG RULES section updated to clarify
         "one semantic_tag per output entry; do not emit multiple entries
         for the same text span."

      7. label_verification_v2.py: explicit multi-label preservation rule
         added so the LLM verifier does not reduce a dual-labelled span to
         a single semantic type during gold-label review.

      8. Shared annotation guidelines: annotation_guidelines PromptConfig v1
         is composed into extraction, label_verification, extraction_check,
         coding_check, and relation_linking prompt paths, and the same text is
         exposed in the Gold Dataset reviewer UI.
    acceptance_criteria:
      - criterion: "Multi-label span export"
        type: "functional"
        measurement: "Test"
        target: "Two entities at identical char range both written to doc.spans['sc'] without dedup"
      - criterion: "Spancat inference returns multi-label"
        type: "functional"
        measurement: "Test"
        target: "/extract returns two EntityOut entries for the same span position"
      - criterion: "Layer 5 nesting refined"
        type: "functional"
        measurement: "Test"
        target: "Shorter span with different normalized term survives alongside containing span"
      - criterion: "Inference backward compat"
        type: "safety"
        measurement: "Test"
        target: "Old model without 'sc' spans falls back to doc.ents; no exception raised"
      - criterion: "Shared annotation guidance parity"
        type: "safety"
        measurement: "Test"
        target: "Extraction, verification, extraction_check, coding_check, and relation_linking prompt paths all include annotation_guidelines v1"
      - criterion: "Reviewer guidance visibility"
        type: "usability"
        measurement: "Test"
        target: "Gold dataset page and review dialog render canonical annotation_guidelines text"

  implementation:
    artifacts:
      - artifact_type: "configuration"
        location: "services/training_worker/app/config/base.cfg"
        description: "spancat component definition, ngram_range_suggester (min_size=1, max_size=10), spans_sc_f score weight"
      - artifact_type: "source_code"
        location: "services/training_worker/app/label_exporter.py"
        description: "_record_to_spacy_doc() - removed seen_tokens, uses doc.spans['sc']"
      - artifact_type: "source_code"
        location: "services/training_worker/app/evaluator.py"
        description: "_build_per_label() reads spans_sc_per_type; thresholds use spans_sc_f"
      - artifact_type: "source_code"
        location: "services/model_inference/app/main.py"
        description: "extract() reads doc.spans.get('sc', []) with doc.ents fallback"
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "normalise_entity_types() - nesting suppression conditioned on identical normalized value"
      - artifact_type: "source_code"
        location: "libs/prompts/extraction_v1.py"
        description: "SEMANTIC TAG RULES - clarified one-entry-per-span rule"
      - artifact_type: "source_code"
        location: "libs/prompts/label_verification_v2.py"
        description: "Multi-label preservation rule added"
      - artifact_type: "source_code"
        location: "libs/prompts/annotation_guidelines_v1.py"
        description: "Canonical shared annotation guideline block"
      - artifact_type: "source_code"
        location: "libs/prompts/registry.py"
        description: "Prompt composition helper injects shared annotation guidelines for target prompt families"
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "Read-only endpoint exposes canonical annotation guidelines to reviewer UI"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "Reviewer-visible annotation guideline accordion and in-dialog guidance panel"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 80
      key_functions:
        - "_record_to_spacy_doc"
        - "normalise_entity_types"
        - "extract"
        - "_build_per_label"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Inference backward compatibility prevents service failure when old model artifact is loaded"
      - "Layer 5 nesting refinement preserves clinically distinct overlapping concepts"
    risk_control_measures:
      - "doc.ents fallback with warning prevents inference 503 when a pre-spancat model is active"
      - "LLM prompt rules prevent LLM from independently generating or stripping multi-label annotations"

  verification_status:
    verification_method: "Test"
    verification_complete: true
