# -- DO-LEO-AI-149 -- Pathways list on @leo/design-system
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-149"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-153"]
    user_needs: ["UN-LEO-AI-071"]
    risks_addressed: ["R-LEO-AI-105"]
