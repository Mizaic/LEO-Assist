# -- DI-LEO-AI-516 -- /care/encounters timeline brush + jump (lift drawer scrubber)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-516"
  type: "Usability"
  derived_from:
    - "UN-LEO-AI-096"
  requirement: >
    The /care/encounters search-results surface SHALL render a
    sticky timeline panel above the result list that mirrors the
    `EncounterTimelineScrubber` already shipped in the
    /care/patients side drawer (DI-LEO-AI-179). The panel SHALL
    render a stacked-bar histogram of the loaded result rows
    binned by encounter date with auto-granularity (day / week /
    month / quarter / year) selected from the visible date span,
    and a draggable focus-band brush below the bars.

    Dragging the brush SHALL filter the result table to encounters
    whose `encounter_date` falls inside the brush window, in
    addition to any active bucket / score filters. Clicking a bar
    that holds a single encounter SHALL open the preview dialog
    for that encounter; clicking a bar that holds multiple
    encounters SHALL open the existing bin popover so the
    reviewer can pick one. A "Reset zoom" affordance SHALL clear
    the brush filter.

    The encounter currently shown in the preview dialog SHALL
    appear with the active-ring treatment on the timeline, and
    its row in the results table SHALL receive the existing
    highlighted-row style (already supported via
    `highlightedEncounterId`).

    On /care/encounters there is no episode context, so:
      - `linkedEncounterIds` SHALL be the empty set (no blue
        "linked" sub-stack)
      - `episodeFrom` / `episodeTo` SHALL be null (no episode
        window band)
      - `milestones` SHALL be the empty list (no milestone tabs)
    so the panel collapses to a single-colour histogram + brush.

    The panel SHALL render only when at least
    `MIN_ENCOUNTERS_FOR_SCRUBBER` (5) result rows have a parseable
    `encounter_date`. When fewer rows are loaded the panel SHALL
    render nothing so the surface stays clean for tiny result
    sets.

    A new module
    `services/ui/src/components/mission-control/EncounterResultsTimeline.tsx`
    SHALL host the adapter, mapping `EncounterListItem[]` to the
    `ScrubberEncounter[]` shape consumed by
    `EncounterTimelineScrubber` (renaming `encounter_date` to
    `date`, dropping rows whose date is null), and translating
    the scrubber's `onJumpToEncounter` callback into the host's
    `setActivePreview` action.

  rationale: >
    Reviewers told us the patient drawer's histogram brush is the
    fastest way to navigate a long encounter list. /care/encounters
    is currently a flat 1,200-row scroll with no temporal
    affordance: reviewers cannot see at a glance whether their
    search hits cluster around a referral year, a winter spike, or
    a recent burst. Lifting the existing
    `EncounterTimelineScrubber` (already verified for safety in
    VT-LEO-AI-173) onto /care/encounters reuses a battle-tested
    primitive instead of inventing a second one, and keeps the
    "navigate by clicking the time histogram" muscle memory the
    same on both surfaces.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          A new module
          `services/ui/src/components/mission-control/EncounterResultsTimeline.tsx`
          MUST default-export a React component
          `EncounterResultsTimeline` that takes `rows`,
          `activeEncounterId`, `visibleFromMs`, `visibleToMs`,
          `onVisibleRangeChange`, and `onJumpToEncounter` props
          and renders `EncounterTimelineScrubber` with
          `linkedEncounterIds = new Set()`, `episodeFrom = null`,
          `episodeTo = null`, and `milestones = []`.
      - type: "functional"
        spec: >
          The wrapper MUST map each input row to
          `{ encounter_id, date, text, coded_count }`, dropping
          rows whose `encounter_date` does not parse to a finite
          timestamp, before forwarding to the scrubber. The
          mapping MUST be memoised (`useMemo`) so the scrubber
          does not see a fresh array reference on every render.
      - type: "functional"
        spec: >
          The wrapper MUST render `null` when fewer than 5 input
          rows have a parseable `encounter_date`, matching the
          drawer scrubber's `MIN_ENCOUNTERS_FOR_SCRUBBER` gate.
      - type: "functional"
        spec: >
          `EncounterMissionControl` MUST hold a controlled
          `timelineRange: { fromMs: number; toMs: number } | null`
          state, MUST pass it into the new wrapper, and MUST clear
          it on every fresh `load()` call so a new search starts
          unfiltered.
      - type: "functional"
        spec: >
          `EncounterMissionControl` MUST apply the brush range to
          `filteredRows` BEFORE pagination so the result table and
          pagination footer reflect the brushed window. When
          `timelineRange` is null the rows MUST be unchanged.
        # The host already filters by `bucketFilter` here; the
        # brush filter MUST compose with bucket filter and rank
        # filter (intersection, not union).
      - type: "functional"
        spec: >
          When the wrapper's `onJumpToEncounter` fires the host
          MUST call `setActivePreview(row)` with the matching row
          from the loaded result set so the preview dialog opens
          on that encounter; if the row is not present in the
          loaded result set (e.g. trimmed by a current bucket
          filter) the host MUST be a no-op.
      - type: "functional"
        spec: >
          The host MUST pass `activePreview?.encounter_id ?? null`
          as `highlightedEncounterId` to `EncounterResultsTable`
          and as `activeEncounterId` to the new timeline wrapper
          so the active encounter receives the active-row style
          in the table and the active-ring on the histogram bar.
    constraints:
      - type: "performance"
        spec: >
          The wrapper MUST reuse the existing scrubber component
          unchanged. No new histogram code MAY be written -- this
          DI is purely an adapter + integration into the
          /care/encounters host.
      - type: "safety"
        spec: >
          The brush filter MUST NOT change the underlying loaded
          result set, only the slice rendered in the table. The
          batch-bar "select all" MUST continue to operate on the
          currently-visible (post-brush) page so the reviewer
          cannot accidentally batch-recode encounters that were
          hidden by a brush filter.
    dependencies:
      - "DI-LEO-AI-179"
      - "DI-LEO-AI-514"
    downstream_impacts:
      - "EncounterMissionControl gains timelineRange state + filter"
      - "EncounterResultsTable receives highlightedEncounterId from active preview"
      - "EncounterResultsTimeline.tsx new module"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16 + @leo/design-system"
      file_structure:
        - "services/ui/src/components/mission-control/EncounterResultsTimeline.tsx"
        - "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-515 verifies the new wrapper module, its
      adapter contract, the host wiring (timelineRange state +
      filter intersection + jump-to-preview + highlighted row),
      and the gate that hides the panel for tiny result sets.
    test_protocol: "VT-LEO-AI-515"

  safety_class: "B"
  risks:
    - "R-LEO-AI-063"
    - "R-LEO-AI-174"
    - "R-LEO-AI-206"
  tags:
    - "ui"
    - "encounters"
    - "search"
    - "timeline"
    - "consistency"
