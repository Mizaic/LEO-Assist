# -- DI-LEO-AI-226 -- Ingest OPCS-4 data files and extend SNOMED map loader for OPCS-4
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-226"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-089"
  requirement: >
    The terminology service SHALL ingest the NHS OPCS-4 data files
    release (TRUD pack 10, item 119) and materialise it as
    `(:OpcsCode {code, title, chapter, block, level, edition})`
    nodes plus `[:IS_A]` edges representing the chapter -> block ->
    3-character category -> 4-character code hierarchy. The
    existing `services/terminology/scripts/loaders/snomed_map.py`
    SHALL be extended to recognise the SNOMED -> OPCS-4 procedural
    map refset (refset id `1126491000000109`) and create
    `(:Concept)-[:MAPS_TO_OPCS4]->(:OpcsCode)` edges using the same
    BatchWriter pattern as the existing ICD-10 path. The TRUD sync
    orchestrator SHALL expose this as a new package called `opcs4`
    whose phases include the new OPCS-4 loader phase.
  rationale: >
    OPCS-4 is the UK procedural classification used by SUS, HRG
    grouping and PbR coding. NHS finance and downstream payers
    consume procedure data in OPCS-4 even when source coding is
    SNOMED. TRUD publishes both the OPCS-4 reference data and a
    SNOMED -> OPCS-4 map, but neither is loaded today. Wiring both
    in lets the system express any SNOMED-coded procedure as an
    OPCS-4 code with a human-readable title, which is the minimum
    bar for coding-revenue and HRG analysis features further down
    the road.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          A new loader module `services/terminology/scripts/loaders/opcs4.py`
          MUST parse the OPCS-4 chapter, category and code data
          files, batch upserts in groups of <=5000, and complete an
          end-to-end load in under 2 minutes against an empty graph
          and under 1 minute on a re-run (idempotent MERGE on
          `code`).
      - type: "functional"
        spec: >
          OpcsCode nodes MUST be merged on `code` so that the
          loader can run before or after the SNOMED -> OPCS-4 map
          extension and converge on the same node set. Properties
          `title`, `chapter`, `block`, `level`, `edition` MUST be
          set with `SET`.
      - type: "functional"
        spec: >
          `services/terminology/scripts/loaders/snomed_map.py` MUST
          gain a public function `load_opcs4_map(driver, filepath,
          batch_size)` that streams the simple-map refset,
          filtering on refsetId `1126491000000109`, and creates
          `(:Concept)-[:MAPS_TO_OPCS4]->(:OpcsCode)` edges. The
          loader MUST follow the same active=1 / non-empty
          mapTarget filtering as the existing ICD-10 path.
      - type: "functional"
        spec: >
          The phase orchestrator (`run_all.py`) MUST run the
          SNOMED -> OPCS-4 map loader from inside phase 2 (existing
          maps phase) and the OPCS-4 reference data loader as a
          new phase 7. Phase 7 MUST run AFTER phase 2 if both are
          requested in the same invocation, so map edges land on
          OpcsCode nodes that already have titles.
      - type: "functional"
        spec: >
          The OPCS-4 loader MUST emit a structured summary log
          line at the end of every run including counts of nodes
          upserted, IS_A edges created, codes that gained titles
          for the first time (i.e. previously bare nodes from the
          SNOMED map), and codes whose title differs from a prior
          load.
    constraints:
      - type: "safety"
        spec: >
          The OPCS-4 loader MUST NOT delete OpcsCode nodes. Old
          codes remain in the graph so historical SNOMED -> OPCS-4
          map edges are preserved across edition upgrades.
      - type: "safety"
        spec: >
          `load_opcs4_map` MUST NOT touch the existing
          `load_extended_map` or `load_simple_map` Cypher
          statements. The new function is additive so we cannot
          regress the ICD-10 or Read mappings.
    dependencies:
      - "DI-LEO-AI-049"
      - "DI-LEO-AI-228"
    downstream_impacts:
      - "OPCS-4 codes become available for downstream HRG / PbR features"
      - "Settings -- Terminology page gains an `opcs4` package card and an `opcs4_maps` count tile"
      - "Surfaces showing coded procedures can show the OPCS-4 equivalent next to the SNOMED concept"
    technical_details:
      language: "Python"
      framework: "neo4j async driver"
      file_structure:
        - "services/terminology/scripts/loaders/opcs4.py"
        - "services/terminology/scripts/loaders/snomed_map.py"
        - "services/terminology/scripts/loaders/file_finder.py"
        - "services/terminology/scripts/loaders/run_all.py"
        - "services/terminology/scripts/loaders/schema.py"
        - "services/api/app/services/trud_sync.py"
        - "services/api/app/models/neo4j_schema.py"
        - "services/ui/src/app/settings/terminology/page.tsx"
        - "services/ui/src/components/TermSearch.tsx"
        - "services/ui/src/lib/types.ts"
        - "services/ui/src/lib/api/legacy.ts"
      estimated_loc: 280

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-218 verifies the OPCS-4 reference data loader
      against a fixture data-file snippet (chapter, category,
      4-character code), asserts idempotent MERGE behaviour,
      asserts IS_A edge creation, verifies that the extended
      `snomed_map.py` creates `MAPS_TO_OPCS4` edges only for the
      OPCS-4 refset id and not for the existing CTV3 refset, and
      verifies the UI surfaces an OPCS-4 chip alongside the
      SNOMED concept where one exists.
    test_protocol: "VT-LEO-AI-218"

  safety_class: "B"
  risks:
    - "R-LEO-AI-210"
  tags:
    - "terminology"
    - "opcs4"
    - "trud"
    - "knowledge-graph"
    - "snomed-map"
