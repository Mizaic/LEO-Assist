        _every_source +
        test_partitioner_no_record_dropped_invariant_under_record
        _split), TC-003 (intra-record split,
        test_partitioner_splits_one_oversize_record_across_slices),
        TC-004 / TC-010 (too_many_parts refusal,
        test_partitioner_refuses_when_too_many_parts_needed +
