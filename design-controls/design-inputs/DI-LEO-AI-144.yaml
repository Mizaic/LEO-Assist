# -- DI-LEO-AI-144 -- Wave E Phase 2a-ii: Knowledge page width variants + CandidateReviewList
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-144"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    (A) The shared KnowledgePageLayout primitive in @leo/design-system
    SHALL expose a `width` prop accepting three named variants --
    "reading" (1280px, current default), "wide" (1600px), and "fluid"
    (edge-to-edge with the 24px gutters) -- so that data-heavy
    Knowledge tabs (Training Data, Surface Forms, Context Rules,
    Domains, Terminology, Pathways) can opt into the wider column
    while intro-heavy tabs (AI Instructions, Clinical Guidelines)
    remain at the reading column width.

    (B) The Training Data candidate list in
    services/ui/src/components/gold-dataset/ SHALL render each
    candidate through the shared ReviewListCard primitive, with a
    single primary action ("Mark gold"), a kebab overflow menu for
    Edit and Delete (progressive disclosure), a tone accent that
    reflects review status, and a density mode that follows the
    existing DensityContext. The legacy CandidateCard.tsx component
    SHALL be removed to eliminate tech debt.

  rationale: >
    Reviewer feedback on 2026-04-17: "the sides have too much empty
    space, and the cards feel like the old spreadsheet while the
    header is the new design". Training Data is a high-throughput
    review surface -- long clinical sentences wrap poorly at 1280px
    and reviewers lose scanning context. Meanwhile the legacy
    CandidateCard cluster (three competing action buttons, saturated
    "Needs review" pill, inline MUI colours) clashes with the softer
    tone of the redesigned StatHero / ProgressStrip above it. Both
    issues are addressable in the same small change because they
    share the same file touch-set.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          KnowledgePageLayout accepts `width?: "reading" | "wide" |
          "fluid"` and renders its container with maxWidth 1280px,
          1600px, or 100% respectively. Default remains "reading" so
          existing callers are unaffected.
      - type: "functional"
        spec: >
          services/ui/src/app/admin/knowledge/page.tsx maps each tab
          key to its chosen width variant; Training Data uses
          "wide"; AI Instructions and Clinical Guidelines use
          "reading".
      - type: "functional"
        spec: >
          services/ui/src/components/gold-dataset/CandidateReviewList.tsx
          exists and renders via <ReviewListCard>. It reads density
          from @/context/DensityContext and forwards it as the
          ReviewListCard `density` prop.
      - type: "functional"
        spec: >
          Each candidate row exposes exactly one primary button
          labelled "Mark gold" plus one overflow kebab menu;
          destructive Delete only appears inside the kebab.
      - type: "functional"
        spec: >
          services/ui/src/components/gold-dataset/CandidateCard.tsx
          no longer exists; GoldDatasetPanel.tsx imports
          CandidateReviewList instead.
      - type: "functional"
        spec: >
          ReviewListCard primitive accepts an optional
          `density: "comfortable" | "compact"` prop; compact
          tightens row padding from 14/20 to 8/16 and list gap from
          8 to 6. Default remains "comfortable".
    constraints:
      - type: "safety"
        spec: >
          No candidate review handler may be lost in the refactor:
          openCandidateLabelEditor, markCandidateAsGold, and
          requestDeleteCandidate MUST still fire on their respective
          user interactions after the swap.
      - type: "safety"
        spec: >
          Width variants MUST default to "reading" so that any
          existing KnowledgePageLayout caller that does not pass the
          new prop keeps its current 1280px layout. No silent layout
          shift on pages outside Knowledge.
    dependencies: ["DI-LEO-AI-142", "DI-LEO-AI-143", "DI-LEO-AI-119"]
    downstream_impacts:
      - "services/design-system/src/primitives/KnowledgePageLayout.tsx"
      - "services/design-system/src/primitives/ReviewListCard.tsx"
      - "services/ui/src/app/admin/knowledge/page.tsx"
      - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      - "services/ui/src/components/gold-dataset/CandidateReviewList.tsx"
      - "services/ui/src/components/gold-dataset/EntityChipView.tsx"
      - "services/ui/src/components/gold-dataset/CandidateRowActions.tsx"
    technical_details:
      language: "TypeScript (React 18, framer-motion 11)"
      framework: "@leo/design-system + services/ui"
      file_structure:
        - "services/design-system/src/primitives/KnowledgePageLayout.tsx"
        - "services/design-system/src/primitives/ReviewListCard.tsx"
        - "services/ui/src/app/admin/knowledge/page.tsx"
        - "services/ui/src/components/gold-dataset/CandidateReviewList.tsx"
        - "services/ui/src/components/gold-dataset/EntityChipView.tsx"
        - "services/ui/src/components/gold-dataset/CandidateRowActions.tsx"
      estimated_loc: 520

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-143 passes: (a) KnowledgePageLayout width-variant
      render test covering reading/wide/fluid; (b)
      CandidateReviewList static scan + render test confirming
      ReviewListCard wiring, Mark gold button, kebab menu,
      density-from-context forwarding; (c) file-system scan
      confirming CandidateCard.tsx is removed.
    test_protocol: "VT-LEO-AI-143"

  safety_class: "B"
  risks: ["R-LEO-AI-099"]
  tags:
    - "knowledge"
    - "training-data"
    - "design-system"
    - "density"
    - "progressive-disclosure"
