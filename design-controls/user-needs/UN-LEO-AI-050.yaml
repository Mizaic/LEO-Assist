# -- UN-LEO-AI-050 -- NER Model Training Data Collection
# User Need covering Loop 3 (de-identified evidence collection, holdout set, training export)

- id: "UN-LEO-AI-050"
  title: "NER team needs a de-identified, labelled training corpus with a protected holdout set to train and evaluate future clinical NER models."
  description: |
    Every confirmed coding decision stored in the knowledge graph is a
    potential training example for a dedicated clinical NER model. The NER
    team needs a mechanism to collect these examples as de-identified sentences
    with character-level span annotations, filter out unreviewed or incorrect
    examples, and export them in a standard format (spaCy JSONL) for model
    training.

    A separate set of encounters -- never used for training -- must be held
    back so the team can measure whether training actually improved the model.
    Without this holdout set, there is no way to know if a new model is better
    or just over-fitted to training data.

    All collected data must be de-identified before storage and again before
    export. No patient-linkable identifier may appear in any output file.

  stakeholder:
    type: "internal_user"
    role: "NLP Engineer / Clinical AI Quality Lead"
    organization: "LEO AI Engineering"

  priority: "MUST"

  rationale: |
    The current NER pipeline is built on surface form matching and LLM
    extraction. A trained neural NER model would be faster, more consistent,
    and less dependent on expensive LLM calls. But training a clinical NER
    model requires thousands of labelled examples and a rigorous evaluation
    methodology.

    Patient data (special-category health data under UK GDPR Article 9) is
    being repurposed for a new processing purpose (AI model training). This
    must be done under a documented lawful basis, with de-identification
    controls, a data protection impact assessment, and retention limits. The
    system must enforce these controls technically, not just procedurally.

  benefit: |
    The NER team can train and rigorously evaluate a clinical NER model using
    real, labelled encounter data. The holdout set provides an unbiased
    measure of model improvement. PII controls are enforced at the point of
    collection and export, not left to individual engineers.

  use_case: |
    1. As encounter DOCUMENTS relationships are written, the pipeline stores
       the de-identified sentence and character offsets for each coded span.
    2. 500 encounters are reserved as holdout and marked accordingly.
       They are never included in training exports.
    3. A clinician validates the holdout encounter codings (ground truth).
    4. When the NER team is ready to train, they run the export script.
    5. The script queries confirmed (gold) and reviewed (silver) DOCUMENTS
       relationships, groups them by encounter, and outputs spaCy JSONL.
    6. Encounter IDs are stripped from the output.
    7. A PII gate scans every sentence before writing. If any PII is found,
       the export aborts.
    8. The stratification report flags any entity category with fewer than
       50 examples (or 20 for safety-critical categories).
    9. After training, the model is evaluated against the holdout set.
       Results are stored as a DriftMetric with metric_type "training_eval".

  current_solution: |
    No training data collection mechanism. NER is entirely surface form and
    LLM-based. No holdout set exists. No de-identification pipeline for
    training data.

  pain_points:
    - "No mechanism to collect labelled training data from production encounters"
    - "No holdout set -- impossible to measure if training improves the model"
    - "PII de-identification for training data is an unsolved engineering problem"
    - "Training data export would include encounter_id, risking patient re-identification"
    - "No stratification reporting -- class imbalance in training data undetected"

  acceptance_criteria:
    - "De-identified sentence and character offsets stored on every DOCUMENTS relationship"
    - "500 encounters marked as holdout and never included in any training export"
    - "Training export produces valid spaCy JSONL with no encounter_id or patient_id"
    - "PII gate aborts export and logs offending records if any PII is detected"
    - "Stratification report flags safety-critical categories with fewer than 20 examples"
    - "Training is blocked if any safety-critical category has fewer than 20 examples"

  success_metrics:
    - metric: "PII detection rate in exported training files"
      target: "Zero PII tokens in 100% of 500-record validation sample"
      baseline: "No current process -- PII controls not enforced"
    - metric: "Gold label volume before first training run"
      target: "5,000 entity annotations (gold source only)"
      baseline: "Zero labelled examples currently collected"
    - metric: "Holdout set contamination rate"
      target: "Zero holdout encounters in any training export"
      baseline: "Not applicable -- holdout set does not exist"

  regulatory_impact: "data_protection_gdpr_article9"
  safety_impact: "high"
  safety_class: "B"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "IEC 62304:2006+A1:2015 clause 5.1 (software development planning)"
    - "UK GDPR Article 9(2)(j) -- research with appropriate safeguards"

  related_standards:
    - "IEC 62304:2006+A1:2015"
    - "ISO 13485:2016"
    - "ISO 14971:2019"
    - "UK GDPR / Data Protection Act 2018"
    - "DCB0129 Clinical Risk Management"

  metadata:
    created_by: "Quality Lead"
    created_date: "2026-04-03"
    status: "draft"
    evidence_source: "Three Learning Loops Production Plan v3.0 (Pre-Sprint)"

  design_inputs: [
    "DI-LEO-AI-077",
    "DI-LEO-AI-078",
    "DI-LEO-AI-079"
  ]
  validation_tests: []
  tags: ["ner-training", "de-identification", "holdout-set", "pii", "training-data", "loop3", "gdpr"]
