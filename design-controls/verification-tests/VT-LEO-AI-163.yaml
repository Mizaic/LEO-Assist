# -- VT-LEO-AI-163 -- Confirmed-cancer cohort regression (in_progress + closed_benign)
# IEC 62304 / ISO 13485 Verification Test

- id: "VT-LEO-AI-163"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-134"]
    design_outputs: ["DO-LEO-AI-131"]
    risks: ["R-LEO-AI-092"]

  metadata:
    title: "Confirmed-cancer cohort: in_progress counted, closed_benign excluded"
    description: >
      Regression suite for the 2026-04-17 refinement of the canonical
      NCDA 'confirmed cancer' cohort definition. The previous
      definition required ep.status = 'completed', which silently
      excluded patients who had been told they have cancer but had not
      yet started treatment (in_progress with a diagnosis_confirmed
      milestone). The refinement drops that precondition and instead
      enumerates the statuses that disqualify an episode from the
      cohort: merged, closed_phantom, closed_related, and
      closed_benign. The latter is added explicitly because legacy
      data contains 8 closed_benign episodes that carry a spurious
      diagnosis_confirmed milestone (historic-cancer mentions in
      encounter text); these must NEVER count as confirmed cancer.
      This test pins both behaviours so future refactors of
      libs/analytics/cohorts.py cannot silently regress the
      headline-cohort numbers shown to clinical reviewers.
    test_level: "unit"
    test_type: "regression"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_analytics_cohorts.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic_text_only"
      cleanup_required: false

  test_cases:
    - case_id: "VT-163-TC-001"
      case_name: "in_progress is not in the excluded-statuses list"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render confirmed_cancer_where() and inspect the status block."
          expected_result: >
            'in_progress' is not present in the excluded-statuses
            literal. (test_in_progress_status_is_not_excluded)
          verification_method: "automated"
      acceptance_criteria:
        - "in_progress + diagnosis_confirmed milestone passes the cohort filter."

    - case_id: "VT-163-TC-002"
      case_name: "completed is not in the excluded-statuses list"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render confirmed_cancer_where() and inspect the status block."
          expected_result: >
            'completed' is NOT in the excluded-statuses literal (the
            cohort is inclusive of any non-administrative,
            non-benign episode that carries a dx milestone). The
            previous 'must be completed' rule has been removed.
          verification_method: "automated"
      acceptance_criteria:
        - "Removing the status='completed' precondition is asserted."

    - case_id: "VT-163-TC-003"
      case_name: "closed_benign IS excluded from the cohort"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render confirmed_cancer_where() and inspect the status block."
          expected_result: >
            'closed_benign' appears in the excluded-statuses literal.
            (test_confirmed_cancer_where_excludes_invalid_and_benign_statuses)
          verification_method: "automated"
      acceptance_criteria:
        - "closed_benign + spurious dx milestone is excluded from the cohort."

    - case_id: "VT-163-TC-004"
      case_name: "merged / closed_phantom / closed_related are still excluded"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render confirmed_cancer_where() and check the status block."
          expected_result: >
            All four statuses (merged, closed_phantom, closed_related,
            closed_benign) appear in the excluded-statuses literal.
            (test_confirmed_cancer_where_excludes_invalid_and_benign_statuses)
          verification_method: "automated"
      acceptance_criteria:
        - "Administrative-invalid statuses remain excluded."

    - case_id: "VT-163-TC-005"
      case_name: "Alias substitution honours the new status block"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call confirmed_cancer_where('episode')."
          expected_result: >
            Returned clause uses 'NOT episode.status IN' (not
            'ep.status'). (test_confirmed_cancer_where_honours_alias)
          verification_method: "automated"
      acceptance_criteria:
        - "Alias is templated through the new clause shape."

    - case_id: "VT-163-TC-006"
      case_name: "letter_inferred_benign filter still active"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render confirmed_cancer_where() and search for the benign coalesce."
          expected_result: >
            'coalesce(ep.letter_inferred_benign, false) = false'
            present. (test_confirmed_cancer_where_contains_benign_filter)
          verification_method: "automated"
      acceptance_criteria:
        - "Letter-inferred-benign defence-in-depth filter preserved."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-163/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-163-EXEC-2026-04-17"
      executed_at: "2026-04-17"
      executed_by: "automation"
      result: "pass"
      notes: >
        16/16 cases in tests/test_analytics_cohorts.py passed.
        Live-DB parity check confirmed the headline 'Confirmed cancers'
        tile for the 2024-01-01 .. 2026-01-01 window moved from 47 to
        50 (3 in_progress patients with diagnosis_confirmed milestones
        now correctly counted) and all-time from 80 to 83. The 8
        closed_benign episodes carrying a spurious diagnosis_confirmed
        milestone remain excluded as designed (tracked separately in
        improvements-backlog.md).
