component_4_coding_pipeline:
  name: "Coding Pipeline"
  purpose: "Extract clinical entities from encounter text via LLM/NER, resolve to SNOMED, persist DOCUMENTS links"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "Service Bus → Coding Worker"
    - "Coding Worker → AWS Bedrock"
    - "Coding Worker → Terminology API"
    - "Coding Worker → Neo4j Patient Graph"
  data_assets: "Clinical text (de-identified), SNOMED codes, extraction results"
  network_exposure: "Internal"

  phase_2_threats:
    - id: "COD-T-001"
      element: "services/coding_worker/app/services/job_handler.py:41-46"
      threat: "Unvalidated message body — arbitrary patient processing"
      attack_vector: "Messages from Azure Service Bus are deserialized and patient_id, encounter_id, mode, dry_run are read directly from the body without schema validation. A compromised publisher or message injection could trigger processing of arbitrary patient IDs or invalid modes."
      prerequisites: "Access to Azure Service Bus queue (connection string) or compromised publisher"
      threat_actors: ["supply_chain", "malicious_insider"]
      evidence:
        file: "services/coding_worker/app/services/job_handler.py"
        line: 41
        snippet: "body = msg.body\npatient_id = body.get('patient_id')\nencounter_id = body.get('encounter_id')\nrun_id = msg.correlation_id or msg.message_id\ndry_run = body.get('dry_run', False)\nmode = body.get('mode', 'all')"
      impact:
        confidentiality: "Medium"
        integrity: "Medium"
        availability: "Low"
        clinical_safety: "Medium"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Requires Azure Service Bus connection string. The worker does validate mode against a rejection list (consensus modes, line 66-67)."
      existing_controls: "Mode validation rejects consensus/consensus_fanout/consensus_chunk; Azure Service Bus authentication via connection string"
      gaps: "No Pydantic schema validation on message body; no patient_id format validation; dry_run flag could be set to true to suppress writes silently"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.6.1"
          nature: "Input validation missing at message bus trust boundary"

    - id: "COD-I-001"
      element: "services/coding_worker/app/pipeline/pipeline_service.py:341-356"
      threat: "Clinical text sent to external LLM providers"
      attack_vector: "De-identified encounter text is sent to AWS Bedrock (and potentially Azure OpenAI via fallback) for entity extraction. While de-identified, the text may contain residual PII that regex-based de-identification missed (e.g., embedded names in narrative, unusual identifier formats)."
      prerequisites: "Standard system operation"
      threat_actors: ["supply_chain"]
      evidence:
        file: "services/coding_worker/app/pipeline/llm_extractor.py"
        line: 82
        snippet: "self._client.converse(modelId=..., system=[...], messages=[...])"
      impact:
        confidentiality: "Medium"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "De-identification is regex-based (libs/utils/deidentify.py) and cannot catch all PII patterns. First names in narrative, unusual identifier formats, and clinical details that indirectly identify patients may pass through."
      existing_controls: "Regex-based de-identification (deidentify.py); AWS Bedrock and Azure OpenAI data processing agreements"
      gaps: "De-identification is not validated for completeness; no PHI detection audit before LLM submission; no data processing impact assessment documented for LLM providers"
      confidence: "Probable"
      regulatory_impact:
        - standard: "UK GDPR"
          clause: "Article 9, Article 28"
          nature: "Special category data may be transferred to third-party processors without adequate safeguards"
        - standard: "DSPT"
          clause: "Assertion 3.4"
          nature: "Personal data transferred to external processors without documented DPIA"

    - id: "COD-I-002"
      element: "services/coding_worker/app/pipeline/pipeline_service.py:341-356"
      threat: "Terminology resolution via unauthenticated HTTP"
      attack_vector: "The coding worker calls the Terminology API over HTTP without authentication. If network segmentation is insufficient, an attacker could intercept or modify terminology resolution responses, causing incorrect SNOMED coding."
      prerequisites: "Network access between coding worker and terminology API; MITM position"
      threat_actors: ["external_targeted"]
      evidence:
        file: "services/coding_worker/app/pipeline/pipeline_service.py"
        line: 51
        snippet: "TERMINOLOGY_API_URL = os.getenv('TERMINOLOGY_API_URL', 'http://localhost:8001')"
      impact:
        confidentiality: "Low"
        integrity: "High"
        availability: "Low"
        clinical_safety: "High"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Internal service communication; requires network-level compromise. But systematic SNOMED miscoding has clinical safety implications."
      existing_controls: "Internal network; services not publicly exposed"
      gaps: "No authentication, no mTLS, no request signing between services"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.5"
          nature: "Inter-service communication without authentication or encryption"

