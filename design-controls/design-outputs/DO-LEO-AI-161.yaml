# -- DO-LEO-AI-161 -- Episode-builder problem-list code recognition + stale tightening
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-161"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-161"]
    user_needs: ["UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-163"]
    verification_tests: ["VT-LEO-AI-161"]

  specification:
    title: "Problem-list Read code recognition, site reconciliation, and stale-close guard"
    description: |
      Implements DI-LEO-AI-161. Five coordinated changes that stop the
      episode builder mis-classifying patients with coded clinical
      outcomes as "lost to follow-up":

      1. libs/domains/code_inventories.py introduces a single source of
         truth for malignancy CTV3 codes, benign-explanation codes,
         fast-track-referral codes, benign investigation phrases, and
         letter-stub regexes, plus typed lookup helpers.
      2. anchor_detector._classify_text_encounters consumes those
         helpers to emit diagnosis_confirmed / benign_closure anchors
         with explicit diagnosis_source / benign_source provenance, and
         to tag site_key + site_source on referral anchors when an
         explicit 2WW code is present.
      3. _site_resolution._extract_condition_key_from_anchor prefers
         site_source in {explicit_2ww_code, explicit_malignancy_code}
         over generic surface-form / SNOMED resolution.
      4. _cypher.STALE_CLOSE_Q gains an EXISTS guard so episodes with
         a diagnosis or benign / treatment milestone are never
         auto-stamped stale.
      5. outcome_inference extends POST_CANCER and POST_BENIGN with
         the new code/phrase signals, with explicit overlap filtering
         to preserve the inference engine's tie-break behaviour.

    acceptance_criteria:
      - criterion: "Code inventories registered"
        type: "functional"
        measurement: "Test"
        target: "All helper functions importable and return correct hits on the deep-read fixtures."
      - criterion: "Anchor emission for problem-list codes"
        type: "functional"
        measurement: "Test"
        target: "Diagnosis and benign anchors carry diagnosis_source / benign_source and the corresponding code or phrase."
      - criterion: "Explicit-site precedence"
        type: "functional"
        measurement: "Test"
        target: "_extract_condition_key_from_anchor returns the explicit site when site_source in {explicit_2ww_code, explicit_malignancy_code}."
      - criterion: "Stale guard"
        type: "safety"
        measurement: "Test"
        target: "STALE_CLOSE_Q never sets status to stale_* on an episode with diagnosis_confirmed / diagnosis / benign_closure / treatment_started milestones."
      - criterion: "Live-corpus impact"
        type: "performance"
        measurement: "Live rebuild"
        target: "stale_post_specialist + stale_no_diagnosis distinct patients <= 12 (was 36); benign-closure patients up by >= 25."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "MALIGNANCY_READ_CODES, BENIGN_EXPLANATION_READ_CODES, FAST_TRACK_REFERRAL_READ_CODES, BENIGN_INVESTIGATION_PHRASES, LETTER_STUB_PATTERNS plus find_* helpers."
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_classify_text_encounters extended to read code-inventory hits and emit annotated anchors."
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_site_resolution.py"
        description: "_extract_condition_key_from_anchor explicit-site precedence."
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        description: "STALE_CLOSE_Q EXISTS guard for diagnosis / benign / treatment milestones."
      - artifact_type: "source_code"
        location: "libs/pipeline/outcome_inference.py"
        description: "POST_CANCER / POST_BENIGN extension with overlap filtering."
      - artifact_type: "operational_script"
        location: "scripts/_wipe_episodes_and_rebuild.py"
        description: "Wipe-and-rebuild orchestration for retroactive application."
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 380
      key_functions:
        - "find_malignancy_code"
        - "find_benign_explanation_code"
        - "find_fast_track_referral_site"
        - "match_benign_investigation_phrase"
        - "_classify_text_encounters"
        - "_extract_condition_key_from_anchor"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Episode-status classification (drives the stale-episode dashboard reviewers act on)"
      - "Cancer-site resolution (drives NCDA pathway split)"
    risk_control_measures:
      - "Code inventories curated only from clinically reviewed deep-read evidence"
      - "Site-source provenance recorded on every anchor for traceability"
      - "STALE_CLOSE_Q EXISTS guard short-circuits any auto-close on episodes with a real outcome milestone"
      - "Outcome-inference overlap filter preserves balanced HITL behaviour"

  verification_status:
    verification_method: "Test"
    verification_complete: true
