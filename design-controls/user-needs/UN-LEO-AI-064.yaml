# -- UN-LEO-AI-064 -- Observable Entity Value Completeness
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-064"
  title: "Clinical NLP pipeline must completely capture test result values for observable entities, including string results and values that precede the entity span"
  description: |
    The post-processing pipeline attaches numeric values (e.g. "7.2 mmol/L")
    to observable entities during Layer 6 value-unit linking. However, two
    common clinical patterns are not captured:

    1. String-based results - A test result expressed as "positive",
       "negative", or "borderline" is reclassified as a qualifier_value
       entity but is never formally linked to its parent observable entity.
       Downstream analytics cannot query "eGFR result = negative" without
       this link.

    2. Value before entity - When a numeric or string result appears before
       the observable name in the encounter text (e.g. "7.2 mmol/L HbA1c"
       or "negative -- Urine culture"), no value is attached because the
       pipeline relies only on extracted measurement entities and does not
       scan the raw text window preceding the observable.

    Both gaps mean that observable entities leave the pipeline with
    obs["value"] = None even when a result is clearly present in the
    encounter text, degrading the quality of clinical data extracted for
    audit and pathway analysis.

  stakeholder:
    type: "internal_user"
    role: "Clinical NLP Engineer / Quality Lead"
    organization: "LEO AI Engineering"

  priority: "MUST"

  rationale: |
    Observable entity values are used in abnormal result detection
    (UN-LEO-AI-003), QOF coding accuracy, and pathway analytics. A missing
    or absent value field causes these downstream checks to treat the result
    as unknown, increasing the risk of missed abnormal findings and reducing
    coding accuracy. String results such as "positive" and "negative" are
    extremely common in microbiology, virology, and pregnancy testing
    encounter entries. Pre-entity value ordering is common in structured
    GP system templates.

  acceptance_criteria:
    - "Observable entities with a nearby string result (positive, negative, borderline, reactive, non-reactive) have obs.value set to the string and obs.unit set to empty string"
    - "Observable entities where the value span appears before the entity in character order are linked when within 60 characters"
    - "Observable entities where neither a measurement entity nor a raw-text match exists are not affected"
    - "All four new test cases in VT-LEO-AI-111 pass"

  regulatory_impact: "medium"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-04-15"
    status: "draft"

  design_inputs: ["DI-LEO-AI-111"]
  validation_tests: []

  tags: ["observable-entity", "value-unit-linking", "pipeline", "post-processing"]
