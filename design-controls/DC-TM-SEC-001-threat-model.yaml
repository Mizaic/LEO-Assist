# ---------------------------------------------------------------------------
# 4.1 VALIDATION
# ---------------------------------------------------------------------------
validation:
  upgraded_from_investigate:
    - threat: "PAT-T-001"
      action: "Retained as Investigate — f-string Cypher label construction is mitigated by _label_for_tag but pattern is fragile"
      requires: "Review _label_for_tag to confirm all possible inputs are handled"

  insufficient_evidence:
    - threat: "TERM-T-001"
      finding: "Lucene injection risk mitigated by _escape_lucene() — retained as Investigate"
      requires: "Fuzz testing of _escape_lucene with Neo4j Lucene edge cases"

# ---------------------------------------------------------------------------
# 4.2 GAP SUMMARY
# ---------------------------------------------------------------------------
gaps:
  - id: "GAP-001"
    title: "Identity accepted from unauthenticated HTTP header"
    category: "Authentication"
    severity: "Critical"
    affected_threats: ["AUTH-S-001", "AUTH-S-002", "AUTH-E-001", "PAT-S-001"]
    evidence:
      file: "libs/auth/org_scope.py"
      line: 196
      snippet: "x_user_email: Optional[str] = Header(default=None, alias='X-User-Email')"
    remediation: "Remove X-User-Email header and ?email= query parameter acceptance. All identity resolution must derive from the authenticated session cookie. For internal service-to-service calls, implement service authentication (mTLS or signed JWTs)."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.2"
      - standard: "UK GDPR"
        clause: "Article 32(1)(b)"
      - standard: "DSPT"
        clause: "Assertion 4.3.1"
    exploitability: "Trivial"

  - id: "GAP-002"
    title: "No JWT signature verification on Azure AD tokens"
    category: "Authentication"
    severity: "High"
    affected_threats: ["AUTH-T-001"]
    evidence:
      file: "services/api/app/routers/auth.py"
      line: 125
      snippet: "payload_b64 = token.split('.')[1]"
    remediation: "Implement JWKS-based JWT signature verification using python-jose[cryptography] (already in requirements). Fetch Azure AD v2.0 JWKS from https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys and validate both id_token and access_token signatures."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.3"
    exploitability: "Difficult"

  - id: "GAP-003"
    title: "Unauthenticated model registry endpoints"
    category: "Authentication"
    severity: "Critical"
    affected_threats: ["API-S-001"]
    evidence:
      file: "services/api/app/routers/model_registry.py"
      line: 1
      snippet: "router = APIRouter(prefix='/model-registry', tags=['model-registry'])"
    remediation: "Add CallerScope dependency to all model registry endpoints. Restrict upload/promote/rollback to platform admin role."
    regulatory_impact:
      - standard: "IEC 62304"
        clause: "5.8"
      - standard: "IEC 81001-5-1"
        clause: "5.7.1"
    exploitability: "Trivial"

  - id: "GAP-004"
    title: "Unauthenticated terminology write endpoints"
    category: "Authentication"
    severity: "High"
    affected_threats: ["API-S-002"]
    evidence:
      file: "services/api/app/routers/terminology.py"
      line: 100
      snippet: "@router.post('/writeback')"
    remediation: "Add CallerScope dependency to POST /writeback, POST /surface-forms/upsert-mapping, DELETE /surface-forms/*. Restrict to authorized roles."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.6"
    exploitability: "Trivial"

  - id: "GAP-005"
    title: "Session cookie secure flag hardcoded False"
    category: "Encryption"
    severity: "High"
    affected_threats: ["AUTH-I-001"]
    evidence:
      file: "services/api/app/routers/auth.py"
      line: 177
      snippet: "secure=False,"
    remediation: "Make secure flag configurable via environment variable (e.g., COOKIE_SECURE=true). Default to True in production. Set to False only for local development."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.5"
      - standard: "UK GDPR"
        clause: "Article 32(1)(a)"
    exploitability: "Moderate"

  - id: "GAP-006"
    title: "No rate limiting on any endpoint"
    category: "Configuration"
    severity: "High"
    affected_threats: ["API-D-001"]
    evidence:
      file: "services/api/app/main.py"
      line: 69
      snippet: "app = FastAPI()"
    remediation: "Add rate limiting middleware (e.g., slowapi) with per-IP and per-user limits. Critical endpoints (pipeline/run, training/verify-all) should have lower limits."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.5.1"
    exploitability: "Trivial"

  - id: "GAP-007"
    title: "Inter-service communication without authentication"
    category: "Authentication"
    severity: "High"
    affected_threats: ["COD-I-002", "FHIR-S-001", "ANLAPI-S-001"]
    evidence:
      file: "services/coding_worker/app/pipeline/pipeline_service.py"
      line: 51
      snippet: "TERMINOLOGY_API_URL = os.getenv('TERMINOLOGY_API_URL', 'http://localhost:8001')"
    remediation: "Implement service-to-service authentication: either mTLS between containers, shared secret in Authorization header, or service mesh (e.g., Istio). Internal APIs should validate incoming auth."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.5"
    exploitability: "Moderate"

  - id: "GAP-008"
    title: "Incomplete de-identification before LLM submission"
    category: "SBOM"
    severity: "High"
    affected_threats: ["DEID-I-001", "COD-I-001", "TRN-I-001", "ANL-I-001"]
    evidence:
      file: "libs/utils/deidentify.py"
      line: 28
      snippet: "NOTE — first names in free-text narrative are not catchable by regex alone"
    remediation: "Add NER-based name detection (spaCy PERSON model) as a second pass after regex de-identification. Implement a PHI audit check that flags text with potential residual PII before LLM submission. Document Data Processing Impact Assessment for LLM providers."
    regulatory_impact:
      - standard: "UK GDPR"
        clause: "Article 9, Article 28, Article 35"
      - standard: "DSPT"
        clause: "Assertion 3.3, Assertion 3.4"
    exploitability: "Moderate"

  - id: "GAP-009"
    title: "No CSRF protection"
    category: "Configuration"
    severity: "Medium"
    affected_threats: ["UI-T-001"]
    evidence:
      file: "services/api/app/routers/auth.py"
      line: 176
      snippet: "samesite='lax'"
    remediation: "Add CSRF token to state-changing endpoints, or require a custom header (e.g., X-Requested-With) that cannot be set by cross-origin forms."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.6.2"
    exploitability: "Difficult"

  - id: "GAP-010"
    title: "OAuth state parameter not CSRF-protected"
    category: "Authentication"
    severity: "Medium"
    affected_threats: ["AUTH-T-002"]
    evidence:
      file: "services/api/app/routers/auth.py"
      line: 68
      snippet: "state = next_url"
    remediation: "Generate a cryptographic nonce, store it in a short-lived cookie, and include it in the OAuth state parameter. Validate the nonce on callback before processing the redirect."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.4"
    exploitability: "Moderate"

  - id: "GAP-011"
    title: "Excessive session TTL without rotation"
    category: "Configuration"
    severity: "Medium"
    affected_threats: ["AUTH-I-002"]
    evidence:
      file: "services/api/app/services/session_store.py"
      line: 20
      snippet: "SESSION_TTL = 60 * 60 * 24 * 7"
    remediation: "Reduce session TTL to 8-12 hours (aligned with NHS working day). Implement sliding session renewal with new session ID on each renewal. Add absolute session lifetime cap."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.4"
      - standard: "DSPT"
        clause: "Assertion 4.2.2"
    exploitability: "Moderate"

  - id: "GAP-012"
    title: "No durable security audit log"
    category: "Logging"
    severity: "High"
    affected_threats: ["AUTH-R-001"]
    evidence:
      file: "services/api/app/routers/auth.py"
      line: 156
      snippet: "save_session(session_id, {...})"
    remediation: "Implement a durable, append-only security audit log (e.g., Neo4j AuditEvent nodes or Azure Monitor). Log: authentication events, authorization decisions, data access, clinical data modifications, model lifecycle events."
    regulatory_impact:
      - standard: "IEC 62304"
        clause: "5.2"
      - standard: "IEC 81001-5-1"
        clause: "5.4.2"
      - standard: "DSPT"
        clause: "Assertion 6.3"
    exploitability: "N/A"

  - id: "GAP-013"
    title: "CORS origins not configurable for production"
    category: "Configuration"
    severity: "Medium"
    affected_threats: ["API-T-001"]
    evidence:
      file: "services/api/app/main.py"
      line: 81
      snippet: "allow_origins=['http://localhost:3000', 'http://127.0.0.1:3000']"
    remediation: "Make CORS origins configurable via ALLOWED_ORIGINS environment variable. Reject '*' wildcard in production."
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.3.5"
    exploitability: "Moderate"

  - id: "GAP-014"
    title: "Deployment-specific de-identification config hardcoded"
    category: "Configuration"
    severity: "Medium"
    affected_threats: ["DEID-I-002"]
    evidence:
      file: "libs/utils/deidentify.py"
      line: 46
      snippet: "_LOCAL_ORGS: tuple[str, ...] = ('Loughborough Urgent Treatment Centre', ...)"
    remediation: "Move _LOCAL_ORGS to a configuration source (environment variable, config file, or database) that can be updated per deployment without code changes."
    regulatory_impact:
      - standard: "UK GDPR"
        clause: "Article 32"
    exploitability: "Moderate"

