# -- VT-LEO-AI-186 -- SBAR queue contract (SBARRequestPayload)
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-186"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-188"]
    risks: ["R-LEO-AI-181"]

  metadata:
    title: "SBARRequestPayload validation: minimal happy path, situation artefact id-or-text rules, background source enum gates, JSON round-trip"
    description: >
      Pins libs/sbar/events.py: SBARRequestPayload + SBARSituationInput
      + SBARArtifactRef + SBARBackgroundSourceRef. Verifies that the
      Pydantic 2 contract accepts the producer-side shapes used by the
      UI playground and the (future) referral / encounter producers,
      and rejects malformed shapes with the expected error path.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_sbar_events.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest 8+ / pydantic 2"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-186-TC-001"
      case_name: "Minimal valid payload (patient + one fixed-text situation artefact + one encounter background source) is accepted"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build the payload and call SBARRequestPayload.model_validate"
          expected_result: "No error; required fields populated"
          verification_method: "automated"
      acceptance_criteria:
        - "Payload validates"

    - case_id: "VT-186-TC-002"
      case_name: "Situation artefact requires id when type is referral_request, procedure_request, or patient_context"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build SBARArtifactRef with type=referral_request and no id; expect Pydantic ValidationError"
          expected_result: "ValidationError raised on the SBARArtifactRef"
          verification_method: "automated"
      acceptance_criteria:
        - "id-or-text rule fires for the right artefact types"

    - case_id: "VT-186-TC-003"
      case_name: "Situation artefact accepts text and rejects id when type is fixed_text"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Build SBARArtifactRef with type=fixed_text and only text"
          expected_result: "Validates; accompanying id=None"
          verification_method: "automated"
      acceptance_criteria:
        - "fixed_text path is text-only"

    - case_id: "VT-186-TC-004"
      case_name: "BackgroundSourceType enum gate rejects unknown source kinds"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Submit payload with background[].type='not_a_thing'"
          expected_result: "ValidationError"
          verification_method: "automated"
      acceptance_criteria:
        - "Strict enum"

    - case_id: "VT-186-TC-005"
      case_name: "JSON round trip is idempotent"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "model_dump(mode='json') -> SBARRequestPayload.model_validate"
          expected_result: "Round-tripped object equals original"
          verification_method: "automated"
      acceptance_criteria:
        - "Equality preserved across the round trip"

    - case_id: "VT-186-TC-006"
      case_name: "event_type literal is locked to 'sbar_requested'"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Submit payload with event_type='something_else'"
          expected_result: "ValidationError"
          verification_method: "automated"
      acceptance_criteria:
        - "Wire contract guarded"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-186/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-186-EXEC-001"
      executed_at: "2026-04-17"
      executor: "automated-pytest"
      command: "python3 -m pytest tests/test_sbar_events.py -v"
      result: "pass"
      summary: "All SBARRequestPayload cases passed"
