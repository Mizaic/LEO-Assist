# ============================================================================
# VERIFICATION TEST SCHEMA - IEC 62304 / FDA 21 CFR Part 820 Compliant
# ============================================================================
# This schema defines the structure for verification test protocols used to
# verify Design Inputs are correctly implemented.
#
# KEY DISTINCTION:
# - Verification: "Did we build the product right?" (Design Outputs meet Design Inputs)
# - Validation: "Did we build the right product?" (System meets User Needs)
#
# Regulatory References:
# - IEC 62304:2006 Section 5.5-5.7 (Software Unit/Integration/System Testing)
# - FDA 21 CFR Part 820.30(f) (Design Verification)
# - ISO 13485:2016 Section 7.3.6 (Design and Development Verification)
# - FDA Guidance: General Principles of Software Validation
#
# Version: 1.0
# Created: 2026-01-07
# Owner: Quality & Engineering
# ============================================================================

meta:
  schema_version: "1.0"
  schema_name: "Verification Test Protocol Schema"
  purpose: "Define machine-readable structure for IEC 62304/FDA-compliant verification tests"
  intended_use: "All verification test protocols for Design Inputs"
  regulatory_compliance:
    - "IEC 62304:2006 - Medical Device Software Lifecycle (Sections 5.5-5.7)"
    - "FDA 21 CFR Part 820.30(f) - Design Verification"
    - "ISO 13485:2016 - Medical Device Quality Management (Section 7.3.6)"
    - "FDA Guidance: General Principles of Software Validation (2002)"
  change_history:
    - version: "1.0"
      date: "2026-01-07"
      change: "Initial schema creation"
      author: "Quality Engineering"

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

schema:
  verification_test:
    description: "A single verification test protocol"
    required: true
    fields:
      
      # --- IDENTIFICATION ---
      id:
        type: string
        required: true
        format: "VT-{PROJECT}-###"
        description: "Unique verification test identifier"
        example: "VT-EFORMS-001"
        pattern: "^VT-[A-Z]+-\\d{3}$"
        
      version:
        type: string
        required: true
        format: "semantic versioning (major.minor)"
        description: "Test version number"
        example: "1.0"
        
      status:
        type: enum
        required: true
        values: ["draft", "review", "approved", "active", "passed", "failed", "obsolete"]
        description: "Current lifecycle status of verification test"
        state_transitions:
          - "draft → review → approved → active → passed/failed"
          - "Any state → obsolete (with justification)"
          
      # --- TRACEABILITY ---
      traceability:
        type: object
        required: true
        description: "Links to Design Inputs, Risks, and related artifacts"
        fields:
          design_inputs:
            type: array
            required: true
            item_type: string
            format: "DI-{PROJECT}-###"
            description: "Design Input(s) being verified"
            min_items: 1
            example: ["DI-EFORMS-001"]
            
          risks:
            type: array
            required: false
            item_type: string
            format: "R-{PROJECT}-###"
            description: "Risks mitigated by this verification"
            example: ["R-EFORMS-001"]
            
          user_needs:
            type: array
            required: false
            item_type: string
            format: "UN-{PROJECT}-###"
            description: "User Needs indirectly verified"
            example: ["UN-EFORMS-001"]
            
          related_tests:
            type: array
            required: false
            item_type: string
            format: "VT-{PROJECT}-###"
            description: "Related verification tests"
            example: ["VT-EFORMS-002"]
            
          validation_tests:
            type: array
            required: false
            item_type: string
            format: "VAL-{PROJECT}-###"
            description: "Validation tests that require this verification to pass"
            example: ["VAL-EFORMS-001"]
            
      # --- METADATA ---
      metadata:
        type: object
        required: true
        fields:
          title:
            type: string
            required: true
            max_length: 200
            description: "Human-readable verification test title"
            example: "FormTemplate Data Model Verification"
            
          description:
            type: string
            required: true
            max_length: 2000
            description: "Detailed description of what is being verified"
            example: "Verifies that FormTemplate model correctly stores and retrieves form definitions"
            
          test_level:
            type: enum
            required: true
            values: ["unit", "integration", "system", "regression"]
            description: "Level of testing per IEC 62304"
            definitions:
              unit: "Tests individual software units in isolation"
              integration: "Tests interfaces between software units"
              system: "Tests complete system against Design Inputs"
              regression: "Tests to ensure changes don't break existing functionality"
              
          test_type:
            type: enum
            required: true
            values: ["functional", "performance", "security", "boundary", "negative", "stress", "compatibility"]
            description: "Type of verification testing"
            definitions:
              functional: "Verifies correct functionality per requirements"
              performance: "Verifies performance requirements (response time, throughput)"
              security: "Verifies security controls and data protection"
              boundary: "Tests edge cases and boundary conditions"
              negative: "Tests error handling and invalid inputs"
              stress: "Tests behavior under extreme load"
              compatibility: "Tests compatibility with specified environments"
              
          safety_class:
            type: enum
            required: true
            values: ["A", "B", "C"]
            description: "Software safety classification per IEC 62304"
            definitions:
              A: "No injury or damage to health is possible"
              B: "Non-serious injury is possible"
              C: "Death or serious injury is possible"
              
          automation_status:
            type: enum
            required: true
            values: ["automated", "semi-automated", "manual"]
            description: "Degree of test automation"
            
          automation_framework:
            type: string
            required: false
            description: "Test automation framework used"
            example: "Vitest, Playwright, Cypress"
            
          test_file_path:
            type: string
            required: false
            description: "Path to automated test file in repository"
            example: "src/lib/models/__tests__/FormTemplate.test.ts"
            
          created_by:
            type: string
            required: true
            description: "Person/role who created the test"
            example: "Quality Engineer"
            
          created_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            
          reviewed_by:
            type: string
            required: false
            description: "Person who reviewed the test"
            
          reviewed_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          approved_by:
            type: string
            required: false
            description: "Quality Manager who approved test"
            
          approved_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          estimated_duration:
            type: string
            required: false
            description: "Estimated execution time"
            example: "30 seconds (automated), 15 minutes (manual)"
            
      # --- TEST ENVIRONMENT ---
      test_environment:
        type: object
        required: true
        description: "Environment requirements for test execution"
        fields:
          environment_type:
            type: enum
            required: true
            values: ["local", "ci_cd", "staging", "production"]
            description: "Target execution environment"
            
          prerequisites:
            type: array
            required: true
            item_type: string
            description: "Conditions that must be met before test execution"
            min_items: 1
            example:
              - "Database seeded with test data"
              - "Environment variables configured"
              - "Dependencies installed"
              
          dependencies:
            type: array
            required: false
            item_type: string
            description: "External dependencies required"
            example:
              - "Neo4j 5.x running on localhost:7687"
              - "Redis cache available"
              
          test_data:
            type: object
            required: false
            description: "Test data requirements"
            fields:
              data_type:
                type: enum
                values: ["synthetic", "anonymized", "fixture", "generated"]
                description: "Type of test data"
              setup_script:
                type: string
                description: "Script to set up test data"
                example: "scripts/seed-test-data.ts"
              cleanup_required:
                type: boolean
                description: "Whether cleanup is needed after test"
                
          infrastructure:
            type: string
            required: false
            description: "Infrastructure details"
            example: "Docker Compose with Neo4j, Redis, Next.js"
            
      # --- TEST CASES ---
      test_cases:
        type: array
        required: true
        item_type: object
        min_items: 1
        description: "Individual test cases within this verification"
        fields:
          case_id:
            type: string
            required: true
            description: "Unique test case identifier"
            example: "VT-001-TC-001"
            
          case_name:
            type: string
            required: true
            description: "Descriptive test case name"
            example: "Create FormTemplate with valid data"
            
          description:
            type: string
            required: false
            description: "Detailed description of test case"
            
          priority:
            type: enum
            required: true
            values: ["critical", "high", "medium", "low"]
            description: "Test case priority"
            definitions:
              critical: "Must pass for release - safety-critical"
              high: "Must pass for release - core functionality"
              medium: "Should pass - important but not blocking"
              low: "Nice to have - edge cases"
              
          preconditions:
            type: array
            required: true
            item_type: string
            description: "Conditions before test case starts"
            example:
              - "User authenticated with valid session"
              - "Database in known initial state"
              
          test_steps:
            type: array
            required: true
            item_type: object
            min_items: 1
            description: "Step-by-step test procedure"
            fields:
              step_number:
                type: integer
                required: true
                description: "Sequential step number"
                
              action:
                type: string
                required: true
                description: "Action to perform"
                example: "Call createFormTemplate() with valid payload"
                
              input_data:
                type: string
                required: false
                description: "Input data for this step"
                example: "{ title: 'Test Form', sections: [...] }"
                
              expected_result:
                type: string
                required: true
                description: "Expected outcome"
                example: "FormTemplate created with generated ID"
                
              verification_method:
                type: string
                required: true
                description: "How to verify the result"
                example: "Assert returned object matches expected schema"
                
          postconditions:
            type: array
            required: false
            item_type: string
            description: "Expected state after test case completes"
            
          acceptance_criteria:
            type: array
            required: true
            item_type: string
            description: "Criteria for test case to pass"
            example:
              - "Function returns FormTemplate object"
              - "Object has valid UUID"
              - "All required fields populated"
              - "Audit event created"
              
          cleanup:
            type: string
            required: false
            description: "Cleanup steps after test case"
            example: "Delete created FormTemplate from database"
            
      # --- PASS/FAIL CRITERIA ---
      pass_fail_criteria:
        type: object
        required: true
        description: "Overall criteria for test to pass"
        fields:
          pass_threshold:
            type: string
            required: true
            description: "Minimum pass rate for overall pass"
            example: "100% of critical cases, 95% of all cases"
            
          critical_cases:
            type: array
            required: false
            item_type: string
            description: "Test cases that must pass"
            example: ["VT-001-TC-001", "VT-001-TC-002"]
            
          blocking_on_failure:
            type: boolean
            required: true
            description: "Whether failure blocks release"
            
          deviation_handling:
            type: string
            required: false
            description: "How to handle deviations"
            example: "Document deviation, assess risk, QM approval required"
            
      # --- EVIDENCE SPECIFICATION ---
      evidence:
        type: object
        required: true
        description: "Evidence collection and storage"
        fields:
          evidence_types:
            type: array
            required: true
            item_type: enum
            values:
              - "test_report"
              - "code_coverage"
              - "console_output"
              - "screenshot"
              - "video"
              - "log_file"
              - "database_snapshot"
              - "api_response"
              - "manual_checklist"
            description: "Types of evidence to collect"
            
          storage_location:
            type: string
            required: true
            format: "blob path or repository path"
            description: "Where evidence is stored"
            example: "/evidence-bundles/EFORMS/verification/VT-001/"
            
          retention_period:
            type: string
            required: true
            description: "How long to retain evidence"
            example: "7 years"
            
          immutability:
            type: boolean
            required: true
            description: "Whether evidence must be immutable"
            
      # --- EXECUTION HISTORY ---
      execution_history:
        type: array
        required: true
        item_type: object
        description: "Record of all test executions"
        fields:
          execution_id:
            type: string
            required: true
            description: "Unique execution identifier"
            example: "VT-001-EXEC-20260107-143022"
            
          executed_by:
            type: string
            required: true
            description: "Person or system that executed test"
            example: "CI/CD Pipeline" or "Quality Engineer"
            
          executed_date:
            type: datetime
            required: true
            format: "ISO 8601 (YYYY-MM-DDTHH:MM:SSZ)"
            
          build_version:
            type: string
            required: true
            description: "Software version tested"
            example: "1.2.3-beta.1"
            
          commit_sha:
            type: string
            required: false
            description: "Git commit SHA tested"
            example: "abc123def456"
            
          environment:
            type: string
            required: true
            description: "Environment where test ran"
            example: "CI/CD - GitHub Actions"
            
          result:
            type: enum
            required: true
            values: ["Pass", "Fail", "Blocked", "Skipped"]
            description: "Overall test result"
            
          cases_executed:
            type: integer
            required: true
            description: "Number of test cases executed"
            
          cases_passed:
            type: integer
            required: true
            description: "Number of test cases passed"
            
          cases_failed:
            type: integer
            required: true
            description: "Number of test cases failed"
            
          duration_seconds:
            type: number
            required: false
            description: "Execution duration in seconds"
            
          code_coverage:
            type: object
            required: false
            description: "Code coverage metrics"
            fields:
              line_coverage:
                type: number
                description: "Percentage of lines covered"
              branch_coverage:
                type: number
                description: "Percentage of branches covered"
              function_coverage:
                type: number
                description: "Percentage of functions covered"
                
          failures:
            type: array
            required: false
            item_type: object
            description: "Details of failed cases"
            fields:
              case_id:
                type: string
                required: true
              failure_message:
                type: string
                required: true
              stack_trace:
                type: string
                required: false
              screenshot_path:
                type: string
                required: false
                
          defects_raised:
            type: array
            required: false
            item_type: string
            description: "Defect IDs raised from failures"
            example: ["DEF-123", "DEF-124"]
            
          evidence_bundle_uri:
            type: string
            required: true
            description: "URI to evidence bundle"
            format: "Azure Blob Storage URI"
            
          notes:
            type: string
            required: false
            max_length: 5000
            description: "Execution notes"
            
          neo4j_record_id:
            type: string
            required: false
            description: "Neo4j node ID for traceability"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "design_input_exists"
    description: "Every design_input must exist in design_inputs.yaml"
    
  - rule: "unique_test_id"
    description: "Test ID must be unique across all verification tests"
    
  - rule: "unique_case_id"
    description: "Test case ID must be unique within the test"
    
  - rule: "class_c_requires_critical"
    description: "Safety Class C tests must have at least one critical test case"
    
  - rule: "automated_requires_path"
    description: "Automated tests must have test_file_path specified"
    
  - rule: "blocking_requires_approval"
    description: "Blocking tests require QM approval before release"
    
  - rule: "evidence_required"
    description: "Each execution must have evidence bundle URI"
    
  - rule: "coverage_threshold"
    description: "Class C code coverage must be ≥90%, Class B ≥80%"

# ============================================================================
# IEC 62304 TEST LEVEL GUIDANCE
# ============================================================================

iec_62304_guidance:
  unit_testing:
    section: "5.5.5"
    description: "Verify each software unit implements its detailed design"
    activities:
      - "Test each unit against its detailed design"
      - "Test interfaces between units"
      - "Test boundary conditions"
      - "Document test results"
    coverage_requirement:
      class_a: "Not required"
      class_b: "Representative coverage"
      class_c: "≥90% line coverage"
      
  integration_testing:
    section: "5.6"
    description: "Verify software integration is correct"
    activities:
      - "Test interfaces between software items"
      - "Test data flow between components"
      - "Test error handling across boundaries"
      - "Document integration test results"
    coverage_requirement:
      class_a: "Not required"
      class_b: "All interfaces tested"
      class_c: "All interfaces, boundary conditions, error paths"
      
  system_testing:
    section: "5.7"
    description: "Verify system meets software requirements"
    activities:
      - "Test system against software requirements"
      - "Test complete workflows"
      - "Test performance requirements"
      - "Test security requirements"
      - "Document system test results"
    coverage_requirement:
      class_a: "All requirements tested"
      class_b: "All requirements with traceability"
      class_c: "All requirements with full traceability and risk coverage"

# ============================================================================
# SAFETY CLASS REQUIREMENTS
# ============================================================================

safety_class_requirements:
  class_a:
    description: "No injury or damage to health is possible"
    testing_requirements:
      - "Unit testing optional"
      - "Integration testing optional"
      - "System testing required"
    documentation:
      - "Test plan optional"
      - "Test results required"
    coverage_target: "N/A"
    
  class_b:
    description: "Non-serious injury is possible"
    testing_requirements:
      - "Unit testing required (representative)"
      - "Integration testing required (all interfaces)"
      - "System testing required (all requirements)"
    documentation:
      - "Test plan required"
      - "Test procedures required"
      - "Test results required with traceability"
    coverage_target: "≥80% line coverage"
    
  class_c:
    description: "Death or serious injury is possible"
    testing_requirements:
      - "Unit testing required (comprehensive)"
      - "Integration testing required (comprehensive)"
      - "System testing required (comprehensive)"
      - "Boundary condition testing required"
      - "Negative testing required"
    documentation:
      - "Detailed test plan required"
      - "Detailed test procedures required"
      - "Full test results with complete traceability"
      - "Coverage analysis required"
    coverage_target: "≥90% line coverage, ≥80% branch coverage"

# ============================================================================
# TEMPLATE
# ============================================================================

template: |
  - id: VT-PROJECT-###
    version: "1.0"
    status: "draft"
    
    traceability:
      design_inputs: [DI-PROJECT-###]
      risks: [R-PROJECT-###]
      user_needs: [UN-PROJECT-###]
    
    metadata:
      title: "Brief descriptive title"
      description: "Detailed description of what is being verified"
      test_level: "unit"
      test_type: "functional"
      safety_class: "B"
      automation_status: "automated"
      automation_framework: "Vitest"
      test_file_path: "src/path/to/__tests__/Component.test.ts"
      created_by: "Quality Engineer"
      created_date: "2026-01-07"
    
    test_environment:
      environment_type: "ci_cd"
      prerequisites:
        - "Node.js 20.x installed"
        - "Dependencies installed via npm"
      test_data:
        data_type: "fixture"
        setup_script: "src/test/fixtures/setup.ts"
        cleanup_required: true
    
    test_cases:
      - case_id: "VT-###-TC-001"
        case_name: "Descriptive test case name"
        priority: "high"
        preconditions:
          - "Component initialized"
        test_steps:
          - step_number: 1
            action: "Perform action"
            input_data: "{ example: 'data' }"
            expected_result: "Expected outcome"
            verification_method: "Assert condition"
        acceptance_criteria:
          - "Criterion 1"
          - "Criterion 2"
    
    pass_fail_criteria:
      pass_threshold: "100% critical, 95% all"
      blocking_on_failure: true
    
    evidence:
      evidence_types: ["test_report", "code_coverage"]
      storage_location: "/evidence-bundles/PROJECT/verification/VT-###/"
      retention_period: "7 years"
      immutability: true
    
    execution_history: []

# ============================================================================
# EXAMPLES
# ============================================================================

examples:
  - example_name: "Unit Test"
    description: "Unit testing a data model"
    file_reference: "verification_tests/models.yaml - VT-EFORMS-001"
    
  - example_name: "Integration Test"
    description: "Testing service integration"
    file_reference: "verification_tests/services.yaml - VT-EFORMS-020"
    
  - example_name: "System Test"
    description: "End-to-end workflow verification"
    file_reference: "verification_tests/workflows.yaml - VT-EFORMS-050"
    
  - example_name: "Security Test"
    description: "Security control verification"
    file_reference: "verification_tests/security.yaml - VT-EFORMS-070"

# ============================================================================
# VERIFICATION VS VALIDATION
# ============================================================================

verification_vs_validation:
  verification:
    question: "Did we build the product right?"
    focus: "Design Outputs meet Design Inputs"
    when: "During development (continuous)"
    environment: "Development, CI/CD, Staging"
    participants: "Developers, QA team (internal)"
    tests: "Unit, Integration, System tests"
    evidence: "Test results, code coverage, defect logs"
    automation: "High - majority automated"
    frequency: "Every commit, every build"
    
  validation:
    question: "Did we build the right product?"
    focus: "System meets User Needs and intended use"
    when: "After verification (phased: alpha, beta, production)"
    environment: "Production-like, Beta, Production"
    participants: "Real users (internal QA, beta customers, production users)"
    tests: "End-to-end scenarios, UAT, Usability, Field testing"
    evidence: "User feedback, satisfaction surveys, real-world usage data"
    automation: "Low - primarily manual with user involvement"
    frequency: "Milestone-based, release-based"

# ============================================================================
# AUTOMATION INTEGRATION
# ============================================================================

automation_integration:
  ci_cd_integration:
    description: "How verification tests integrate with CI/CD"
    triggers:
      - "Pull request opened"
      - "Push to main branch"
      - "Nightly scheduled build"
      - "Release tag created"
    workflow:
      - step: "Checkout code"
      - step: "Install dependencies"
      - step: "Run unit tests"
      - step: "Run integration tests (if staging available)"
      - step: "Generate coverage report"
      - step: "Upload evidence bundle"
      - step: "Update test status in traceability system"
      
  test_frameworks:
    unit:
      typescript: "Vitest"
      python: "pytest"
      configuration: "vitest.config.ts"
    integration:
      api: "Supertest"
      e2e: "Playwright"
    coverage:
      tool: "c8 / nyc"
      report_formats: ["json", "lcov", "html"]
      
  evidence_capture:
    automated:
      - "JUnit XML test results"
      - "Coverage reports (lcov)"
      - "Console output logs"
      - "Screenshot on failure (E2E)"
    storage:
      location: "Azure Blob Storage"
      path_pattern: "/evidence-bundles/{project}/verification/{test_id}/{execution_id}/"
      retention: "7 years"
      immutability: "WORM policy"

# ============================================================================
# CHANGE CONTROL
# ============================================================================

change_control:
  test_changes:
    minor_changes: "Clarifications, typo fixes - QA review required"
    major_changes: "Changes to test cases, criteria - QA approval required"
    new_tests: "New tests require traceability verification"
    version_increment: "Minor: +0.1, Major: +1.0"
    
  design_input_changes:
    impact: "Changes to DI may require test updates"
    process: "Review all linked VTs, update as needed"
    regression: "Run regression suite after changes"
    
  evidence_retention:
    duration: "7 years minimum (FDA requirement)"
    location: "Azure Blob Storage with WORM policy"
    format: "Original format (XML, JSON, HTML, images)"

# ============================================================================
# METRICS & REPORTING
# ============================================================================

metrics:
  test_coverage:
    line_coverage:
      class_c_target: "≥90%"
      class_b_target: "≥80%"
      class_a_target: "Not specified"
    branch_coverage:
      class_c_target: "≥80%"
      class_b_target: "≥70%"
      class_a_target: "Not specified"
    requirement_coverage:
      all_classes: "100% of Design Inputs must have linked verification tests"
      
  execution_metrics:
    pass_rate:
      target: "≥99% for automated tests"
      threshold: "≥95% acceptable with deviation"
    execution_time:
      unit_tests: "≤5 minutes"
      integration_tests: "≤15 minutes"
      system_tests: "≤30 minutes"
    flakiness:
      target: "<1% flaky tests"
      
  traceability_metrics:
    di_coverage: "% of Design Inputs with linked VTs"
    risk_coverage: "% of Risks with linked VTs"
    orphan_tests: "Tests without DI linkage"
