# -- DI-LEO-AI-504 -- Episode Engine: Reconciler Agent (Sonnet)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-504"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-090"
  requirement: >
    The reconciler agent SHALL take all classified candidate windows
    (with their extracted milestones) for a single patient and emit
    a final list of ReconciledEpisode records. The reconciler SHALL
    use Bedrock Claude Sonnet (tier="big") because cross-window
    reasoning benefits materially from the larger model. The agent
    SHALL be allowed to: merge multiple windows into one episode
    (multi-site referrals to the same diagnosis); split a window
    into multiple episodes; drop low-confidence non_cancer windows;
    keep benign and separate cancer episodes intact. The agent
    SHALL preserve every milestone passed in (no silent drops) and
    SHALL set ``merged_from`` to the source window_ids on every
    episode it emits. A forced ``submit_episodes`` tool SHALL
    return JSON conforming to ReconcilerResult.
  rationale: >
    Patients can receive a 2WW referral to two body sites for the
    same eventual diagnosis (e.g. lower-GI + upper-GI for FIT-
    positive, ultimately one colorectal cancer). Two windows from
    the segmenter must collapse to one episode in this case; in
    other cases two windows really are two distinct episodes (BCC
    and colorectal in the same year). Only a model that sees the
    whole candidate payload at once can safely make that call.
    Sonnet is chosen over Haiku because spike runs showed Haiku
    occasionally over-merged distinct cancers when the window
    payload exceeded 4 candidates.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "submit_episodes tool MUST be forced via toolChoice."
      - type: "functional"
        spec: "Single-window inputs MUST round-trip to a single ReconciledEpisode without merging."
      - type: "functional"
        spec: "Multi-window inputs MAY produce a multi_site episode with merged_from listing the input window_ids."
      - type: "functional"
        spec: "Candidates payload MUST be serialised as JSON and embedded verbatim in the user prompt so the model sees the same structure the writer will consume."
      - type: "safety"
        spec: "ReconciledEpisode confidence MUST be in [0, 1] (Pydantic enforced)."
      - type: "safety"
        spec: "Merged episodes MUST set merged_from to the originating window_ids (audit trail)."
      - type: "safety"
        spec: "needs_human_review MUST propagate true if any source window had milestone_review_flag set."
      - type: "performance"
        spec: "Reconciler input tokens SHALL stay under 8,000 in 95% of cases on cohort-typical patients."
    constraints:
      - type: "safety"
        spec: "The reconciler MUST NOT invent new milestones; it can only operate on the milestones already extracted upstream."
    dependencies:
      - "DI-LEO-AI-502"
      - "DI-LEO-AI-503"
    downstream_impacts:
      - "Writer materialises one EpisodeOfCare per ReconciledEpisode"
      - "UI displays ``merged_from`` to show the audit trail"
    technical_details:
      language: "Python"
      framework: "libs.llm_client.factory.LLMClient (Bedrock Sonnet) + Pydantic"
      file_structure:
        - "services/analysis_worker/app/episode_engine/agents/reconciler.py"
        - "libs/prompts/episode_engine/reconciler_v1.py"
      estimated_loc: 130

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-504 must pass on all critical and total cases:
      single-episode parse, JSON-payload-in-user-message
      verification, and multi-window merge with merged_from.
    test_protocol: "VT-LEO-AI-504"

  safety_class: "B"
  risks:
    - "R-LEO-AI-504"
  tags:
    - "episode-engine"
    - "reconciler"
    - "sonnet"
    - "merge-split"
