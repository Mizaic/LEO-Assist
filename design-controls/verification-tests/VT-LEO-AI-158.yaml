# -- VT-LEO-AI-158 -- Pathway probe registry parity + popover safety (Phase 6b-v)
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-158"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-160"]
    risks: ["R-LEO-AI-162"]

  metadata:
    title: "Pathway probe registry parity and ProbeMonitor popover safety"
    description: >
      Static-source verification that closes the registry-drift gap between
      libs/pipeline_graph/registry.py and the UI canvas configuration for
      the four in-scope subgraphs (encounter_loader, staging_enrichment,
      human_review_gate, encounter_coding_agent), and that the ProbeMonitor
      popover dismisses on Escape and exposes role="dialog" with an
      aria-label naming the source and target steps.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathway-canvas-edges.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-158-TC-001"
      case_name: "Python registry yields a non-empty subgraph list"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Parse libs/pipeline_graph/registry.py for registry.register(...) calls"
          expected_result: "More than 15 unique subgraph IDs are discovered"
          verification_method: "automated"
      acceptance_criteria:
        - "pythonRegisteredSubgraphs() returns at least 16 IDs"

    - case_id: "VT-158-TC-002"
      case_name: "Every in-scope subgraph has a SUBGRAPH_IO entry"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/config/subgraphs.ts"
          expected_result: >
            Each python-registered ID (excluding documented opt-outs) has
            a SUBGRAPH_IO entry of the form `<id>: { ... }`.
          verification_method: "automated"
      acceptance_criteria:
        - "missing array is empty"

    - case_id: "VT-158-TC-003"
      case_name: "Every in-scope subgraph appears in SUBGRAPH_OPTIONS_RAW"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Scan SUBGRAPH_OPTIONS_RAW for { id: \"<id>\" } entries"
          expected_result: "Each in-scope ID is present"
          verification_method: "automated"
      acceptance_criteria:
        - "missing array is empty"

    - case_id: "VT-158-TC-004"
      case_name: "Phase 6b-v subgraphs have a PROBE_STRATEGIES entry"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/edges/probeStrategies.tsx"
          expected_result: >
            encounter_loader, staging_enrichment, human_review_gate, and
            encounter_coding_agent each appear as keys in PROBE_STRATEGIES.
          verification_method: "automated"
      acceptance_criteria:
        - "all four IDs match the `<id>:` pattern inside PROBE_STRATEGIES"

    - case_id: "VT-158-TC-005"
      case_name: "Four newly-added IDs are wired end-to-end"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "For each of the four IDs, assert SUBGRAPH_OPTIONS_RAW + SUBGRAPH_IO + PROBE_STRATEGIES presence"
          expected_result: "All three checks pass for every ID"
          verification_method: "automated"
      acceptance_criteria:
        - "no expectation in the loop fails"

    - case_id: "VT-158-TC-006"
      case_name: "encounter_coding_agent declares its config-injected fields"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read CONFIG_INJECTED_FIELDS in probeStrategies.tsx"
          expected_result: "encounter_coding_agent: appears as a key"
          verification_method: "automated"
      acceptance_criteria:
        - "regex /encounter_coding_agent\\s*:/ matches the CONFIG_INJECTED_FIELDS body"

    - case_id: "VT-158-TC-007"
      case_name: "ProbeMonitor installs a window-level Escape handler"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/edges/PortEdge.tsx"
          expected_result: "addEventListener(\"keydown\", ...) and matching removeEventListener present"
          verification_method: "automated"
      acceptance_criteria:
        - "src includes addEventListener(\"keydown\")"
        - "src guards on event.key !== \"Escape\""
        - "src includes removeEventListener(\"keydown\")"

    - case_id: "VT-158-TC-008"
      case_name: "Escape closes the inspector drawer first, then the popover"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect the useEffect block surrounding the keydown handler"
          expected_result: "Block contains both setDrawerOpen(false) and onClose()"
          verification_method: "automated"
      acceptance_criteria:
        - "setDrawerOpen(false) precedes onClose() in the handler body"

    - case_id: "VT-158-TC-009"
      case_name: "Popover root exposes role=\"dialog\" with an aria-label"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect the ProbeMonitor function body in PortEdge.tsx"
          expected_result: "role=\"dialog\" and aria-label naming source/target/Escape are present"
          verification_method: "automated"
      acceptance_criteria:
        - "regex /role=\"dialog\"/ matches"
        - "regex /aria-label=\\{`Probe[\\s\\S]*?Escape/ matches"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-158/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-16"
      executed_by: "agent"
      environment: "development"
      framework: "jest 30.2.0"
      command: "npx jest --config jest.config.js src/__tests__/pathway-canvas-edges.test.tsx --no-coverage"
      result: "pass"
      cases_passed: 9
      cases_failed: 0
      cases_total: 9
      notes: >
        All 9 test cases pass. The four Phase 6b-v subgraphs have full
        registry parity (SUBGRAPH_OPTIONS_RAW + SUBGRAPH_IO + PROBE_STRATEGIES),
        ProbeMonitor installs a window-level Escape handler that closes the
        drawer first, and the popover root exposes role="dialog" with a
        descriptive aria-label. Pre-existing legacy drift for extraction /
        terminology / verification / persist / sbar / compliance is documented
        in UI_OPT_OUT and tracked under Phase 6b-vi cleanup.
