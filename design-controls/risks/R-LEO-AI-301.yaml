# -- R-LEO-AI-301 -- Stale or missing ICD-10/OPCS-4 reference data leads to incorrect downstream interpretation
# ISO 14971 / IEC 62304 Risk
#
# NOTE: Originally drafted at R-LEO-AI-209 but reassigned to the next
# free ID after Pattern N5 (off-pathway Problem-header guard) claimed
# R-LEO-AI-209 in the same change window.

- id: "R-LEO-AI-301"
  title: "Stale, missing, or partially-loaded ICD-10 or OPCS-4 reference data causes UI surfaces to show wrong or no titles for codes that drive coding-revenue and downstream payer submissions"

  hazard:
    description: >
      The system MERGEs ICD-10 / OPCS-4 nodes on `code` from two
      independent sources: the SNOMED ExtendedMap and SimpleMap
      refsets (loaded from the SNOMED package) and the standalone
      NHS ICD-10 / OPCS-4 reference data packages (loaded from
      separate TRUD items). If the standalone packages are absent,
      stale, or only partially loaded, downstream surfaces can
      either (a) display a bare code with no title and no chapter,
      (b) display the title from a previous edition that no longer
      matches the current TRUD release, or (c) display a code
      whose mapped target no longer exists in the active edition.
      Either failure mode can mislead a clinical coder reviewing
      a patient encounter or a finance team running coding-revenue
      submissions.
    category: "data_integrity"

  hazardous_situation: >
    A clinical coder reviews a coded encounter on /care/patients
    and sees `ICD-10: I50.0` next to a SNOMED concept. The
    standalone NHS ICD-10 package has not been loaded, so no title
    is shown. The coder mis-reads the code as I50.9 (heart
    failure, unspecified) instead of I50.0 (congestive heart
    failure) and signs off the encounter. The downstream HRG
    grouping is wrong and the encounter is submitted to SUS with
    the wrong diagnosis category. A second hazardous situation
    arises when the standalone package is loaded but stale: the
    title shown is from the previous edition and no longer
    reflects the current NHS guidance, but the SNOMED ExtendedMap
    refset already maps to a code that has been retired.

  harm:
    description: >
      Incorrect downstream interpretation of coded encounters by
      clinical coders, finance teams, or downstream payer systems.
      Concrete harms include (a) incorrect HRG grouping leading to
      wrong PbR income and possible audit findings; (b) coder
      sign-off on the wrong diagnosis or procedure category
      reaching SUS; (c) loss of trust in the platform when titles
      are absent or stale, leading reviewers to bypass the UI and
      revert to the legacy spreadsheet workflow.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-228 / DI-LEO-AI-226: both loaders MERGE on `code`
        and SET title with overwrite-on-rerun semantics. Both
        loaders emit a structured summary log line at the end of
        every run including the count of nodes that gained titles
        for the first time and the count of titles that drifted
        from a prior load. QA can spot edition drift in the loader
        logs without bisecting the graph.
      implemented_by:
        - "DI-LEO-AI-228"
        - "DI-LEO-AI-226"
      verified_by:
        - "VT-LEO-AI-301"
        - "VT-LEO-AI-302"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-228 / DI-LEO-AI-226: the Settings -- Terminology
        page already shows Up to date / Update available / Not on
        disk status cards for SNOMED and dm+d using the existing
        TRUD freshness comparator. New `icd10` and `opcs4`
        packages plug into the same comparator so an out-of-date
        or absent package is visible to operators on every visit
        to the page, and the page surfaces the local extracted
        version next to the TRUD latest version.
      implemented_by:
        - "DI-LEO-AI-228"
        - "DI-LEO-AI-226"
      verified_by:
        - "VT-LEO-AI-301"
        - "VT-LEO-AI-302"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-228 / DI-LEO-AI-226: UI surfaces that consume
        ICD-10 / OPCS-4 (TermSearch dropdown, surface-forms admin
        page, future coded-finding chips) MUST degrade gracefully
        when the title is absent: render the bare code only and
        do NOT throw or hide the code. This means an unloaded
        package is a missing-title problem, never a missing-code
        problem -- the SNOMED ExtendedMap edge still resolves and
        the user still sees the code they need.
      implemented_by:
        - "DI-LEO-AI-228"
        - "DI-LEO-AI-226"
      verified_by:
        - "VT-LEO-AI-301"
        - "VT-LEO-AI-302"
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Operations: a quarterly review of the Settings --
        Terminology page is added to the maintenance plan
        (DC-SMP-001). The reviewer checks that every package shows
        Up to date, runs Sync from TRUD if any package shows
        Update available, and notes the outcome in the maintenance
        log. This catches stale-edition risk independent of any
        automated alerting.
      implemented_by:
        - "DI-LEO-AI-228"
        - "DI-LEO-AI-226"
      verified_by:
        - "VT-LEO-AI-301"
        - "VT-LEO-AI-302"
      effectiveness: "pending"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The MERGE-on-code design eliminates the worst failure mode
      (mismatched node sets between the SNOMED map loader and the
      standalone reference data loader). The Settings -- Terminology
      status cards make staleness visible to operators on every
      visit. The UI degrades gracefully when titles are absent so
      a missing standalone package never blocks a coding workflow.
      Residual risk is limited to (a) operators ignoring an Update
      available indicator for an extended period and (b) a TRUD
      release introducing edition drift between the SNOMED map and
      the standalone package -- both visible in the loader summary
      log and addressable by re-running Sync from TRUD.

  monitoring:
    monitoring_plan: >
      Track per-loader summary metrics across each Sync from TRUD
      run: nodes upserted, IS_A edges created, codes that gained
      a title for the first time, codes whose title drifted. Spike
      in drift count is an early signal of edition mis-match
      between the SNOMED map and the standalone package and MUST
      be investigated within one working day.
    metrics:
      - "Count of Icd10Code nodes that gained a title in the last sync"
      - "Count of Icd10Code titles that drifted from the prior sync"
      - "Count of OpcsCode nodes that gained a title in the last sync"
      - "Count of OpcsCode titles that drifted from the prior sync"
      - "Number of days since the last successful sync per package"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Rob Smith - design review of UN-LEO-AI-089 multi-classification ingest (April 2026)"
    identified_date: "2026-04-18"
    status: "analyzed"
    tags:
      - "terminology"
      - "icd10"
      - "opcs4"
      - "reference-data"
      - "data-integrity"
      - "coding-revenue"
