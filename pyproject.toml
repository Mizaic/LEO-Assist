[project]
name = "primary-care-audit"
version = "1.0.0"
description = "Production clinical audit platform — mono-repo"
requires-python = ">=3.12"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: tests that need live external systems (Neo4j, Service Bus)",
    "asyncio: async test coroutine",
]
