# -- R-LEO-AI-037 -- Tool-Informed Incorrect SNOMED Recommendation in Audit
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-037"
  title: "Haiku sub-agent returns incorrect SNOMED recommendations that are incorrectly applied to training labels"

  hazard:
    description: >
      The Haiku sub-agent, when calling the Terminology API on behalf of
      Opus, may interpret API results incorrectly or hallucinate concept
      information not present in the API response. Opus, relying on these
      results, may produce a confident but incorrect SNOMED recommendation
      for a training label entity.
    category: "clinical_safety"

  hazardous_situation: >
    During pass 2 of the agentic audit, Haiku misinterprets terminology
    API results and returns a recommendation pairing an incorrect SNOMED
    concept with the entity. Opus accepts the recommendation at high
    confidence. If a subsequent code change were to relax the READONLY_FIELDS
    constraint, or if a human reviewer approves the proposal without
    adequate verification, the incorrect SNOMED code could enter training
    data and ultimately bias the production NLP pipeline toward incorrect
    clinical coding.

  harm:
    description: >
      Incorrect clinical coding in production NLP pipeline output,
      potentially affecting downstream clinical audit metrics and pathway
      coding accuracy for primary care patients.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        SNOMED fields (snomed_concept_id, snomed_term, read_code,
        snomed_score) are members of READONLY_FIELDS in the auditor script.
        The _classify_fixes() function converts any fix suggestion for a
        READONLY_FIELDS member to a needs_review proposal regardless of
        Opus's verdict or confidence. This is a code-level enforcement
        that cannot be bypassed by prompt instructions.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Tool-use pass (pass 2) results are always classified as proposals
        for human review. The _agentic_audit_record() function returns
        enriched needs_review verdicts, not fixable verdicts. The auto-fix
        pipeline never processes pass-2 results for SNOMED fields.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        All terminology API response content passes through
        sanitise_for_prompt() before being included in a toolResult
        block sent back to Opus. This prevents prompt injection via
        malformed API responses and ensures content is within safe limits.
      implemented_by: ["DI-LEO-AI-054", "DI-LEO-AI-045"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        All tool calls, inputs, and results are recorded in the JSONL
        audit trail. Human reviewers can inspect the full chain of
        reasoning (Opus verdict → tool call → Haiku result → Opus
        recommendation) before accepting any SNOMED change proposal.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        The audit report and HITL workflow clearly label tool-informed
        proposals as "requires terminology verification" to guide human
        reviewers to independently check proposed SNOMED codes before
        accepting them.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The code-level READONLY_FIELDS enforcement makes it structurally
      impossible for SNOMED codes to be auto-fixed, regardless of what
      Opus or Haiku recommend. All SNOMED changes require explicit human
      approval. The full audit trail enables human reviewers to verify
      the reasoning chain independently. Residual risk is low and
      acceptable given the mandatory human review gate for all SNOMED
      proposals.

  monitoring:
    monitoring_plan: >
      Monitor the proposals section of audit reports for SNOMED-related
      proposals. On a quarterly basis, sample 10% of accepted SNOMED
      proposals and verify against the authoritative SNOMED CT browser.
      Track the proportion of tool-informed SNOMED proposals rejected by
      human reviewers as a quality metric.
    metrics:
      - "SNOMED proposal rejection rate by human reviewers"
      - "Tool-informed proposal acceptance rate"
      - "False positive rate: proposals confirmed incorrect by SNOMED CT browser"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review -- agentic architecture threat modelling"
    identified_date: "2026-03-05"
    status: "analyzed"
    tags:
      - "llm"
      - "snomed"
      - "clinical-safety"
      - "training-data"
      - "agentic"
      - "audit"
