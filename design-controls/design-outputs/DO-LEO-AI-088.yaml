# -- DO-LEO-AI-088 -- Stage-at-diagnosis enrichment implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-088"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-090"]
    user_needs: ["UN-LEO-AI-052"]
    risks_addressed: ["R-LEO-AI-064"]
    verification_tests: ["VT-LEO-AI-090"]

  specification:
    title: "Stage-at-diagnosis enrichment modules and audit surfacing"
    description: |
      Implements a first-class stage-at-diagnosis capability: rule ingestion from
      NHS staging-sheet outputs, TNM parser, deterministic staging engine,
      post-episode enrichment subgraph, EpisodeOfCare staging fields, analytics
      aggregation, and audit UI rendering of early/late distribution plus
      source and coverage.
    acceptance_criteria:
      - criterion: "Rule ingestion"
        type: "functional"
        measurement: "Test"
        target: "StagingRulesEngine loads site rules, site index, and non-TNM mappings from configs/staging_rules"
      - criterion: "Priority cascade"
        type: "functional"
        measurement: "Test"
        target: "Explicit stage resolves before TNM derivation when both are present"
      - criterion: "TNM derivation"
        type: "functional"
        measurement: "Test"
        target: "TNM triplets parse into T/N/M components and derive early/late where a matching site rule exists"
      - criterion: "Episode persistence"
        type: "functional"
        measurement: "Inspection"
        target: "EpisodeOfCare nodes contain staging fields with safe defaults"
      - criterion: "Analytics output"
        type: "functional"
        measurement: "Inspection"
        target: "Cancer stage endpoint returns rows, by_stage_group_detail, by_system, by_source, and coverage_pct"
      - criterion: "UI surfacing"
        type: "functional"
        measurement: "Inspection"
        target: "CancerStageSection no longer uses external feed placeholder and shows pipeline-derived data"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/staging/tnm_parser.py"
        description: "TNM parser and TNMComponents dataclass"
      - artifact_type: "source_code"
        location: "libs/staging/engine.py"
        description: "StagingRulesEngine with explicit>TNM>unknown cascade and non-TNM mapping"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/staging_enrichment.py"
        description: "Post-episode staging enrichment subgraph and EpisodeOfCare field writes"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder.py"
        description: "EpisodeOfCare staging field defaults"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/audit.py"
        description: "Cancer stage aggregates with source/system/detail/coverage fields"
      - artifact_type: "source_code"
        location: "services/ui/src/components/audit/CancerStageSection.tsx"
        description: "Pipeline-derived cancer stage UI section"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/analyticsApi.ts"
        description: "Audit cancer stage response types updated"
    storage_location: "git"
    technical_details:
      language: "Python/TypeScript"
      loc: 500
      key_functions:
        - "parse_tnm_triplet"
        - "StagingRulesEngine.resolve_stage"
        - "enrich_staging"
        - "_q_cancer_stage"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Deterministic stage derivation and persistence for episode-level audit metrics"
    risk_control_measures:
      - "Priority cascade prevents lower-confidence TNM from overriding explicit stage"
      - "Unknown fallback prevents unsupported mappings from forcing a stage value"
      - "Source and confidence fields expose evidence quality to reviewers"

  verification_status:
    verification_method: "Test"
    verification_complete: false
