# -- DO-LEO-AI-202 -- Care obstruction anchor + HITL escalation implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-202"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-204"
    user_needs:
      - "UN-LEO-AI-005"
      - "UN-LEO-AI-007"
    risks_addressed:
      - "R-LEO-AI-194"
    verification_tests:
      - "VT-LEO-AI-198"

  specification:
    title: "care_obstruction milestone: regex anchor + episode-level HITL signal"
    description: |
      Adds a new first-class milestone bucket and HITL
      escalation path for care-pathway obstructions:

        - _RE_CARE_OBSTRUCTION (anchor_detector.py): single
          compiled regex with seven alternations covering
          DNA + reason, refusal of named investigation,
          safeguarding, "avoidable delay", "best interest
          meeting", failed-to-attend / unable-to-reach,
          family-aggression / terminated-call, and hospital
          retraction / cancellation of a referral.

        - "care_obstruction" entry in _TEXT_SENTINEL with
          SNOMED concept_id 182888003.

        - _AnchorBuckets expanded from 8-tuple to 9-tuple to
          carry care_obstructions as the 9th element.

        - AnchorResult.care_obstruction_anchors field +
          merge logic in detect_anchors().

        - Builder helpers
          _care_obstruction_link_anchors (window-claim) and
          _care_obstruction_hitl (HITL flag + reason) wired
          into both _build_closed_episode and
          _build_open_episode.

      An encounter that contains both a workflow signal
      (rejection, marked-in-error) and an obstruction
      signal emits BOTH anchors -- the new bucket is
      independent of referral / diagnosis classification.

    acceptance_criteria:
      - criterion: "dna_due_to_mobility_emits_care_obstruction"
        type: "functional"
        measurement: "Test"
        target: "_classify_text_encounters returns one care_obstruction anchor for 'referred to 2WW clinic but not attended due to mobility issues - cannot get into car'"
      - criterion: "hospital_retracted_referral_emits_care_obstruction"
        type: "functional"
        measurement: "Test"
        target: "Encounter text 'we have decided to retract this Referral today' emits one care_obstruction anchor"
      - criterion: "family_aggressive_terminated_call_emits_care_obstruction"
        type: "functional"
        measurement: "Test"
        target: "Encounter text containing son 'refusing to bring dad to LRI ... Told Sam to F off' emits one care_obstruction anchor"
      - criterion: "safeguarding_concern_emits_care_obstruction"
        type: "functional"
        measurement: "Test"
        target: "Encounter text 'safeguarding concern raised' emits one care_obstruction anchor"
      - criterion: "normal_attendance_does_not_emit_care_obstruction"
        type: "safety"
        measurement: "Test"
        target: "Encounter text 'Patient attended fast track clinic on 18 Dec 2024 as planned' emits zero care_obstruction anchors"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_CARE_OBSTRUCTION, _TEXT_SENTINEL[care_obstruction], _AnchorBuckets 9-tuple, AnchorResult.care_obstruction_anchors, _classify_text_encounters care_obstruction emission, detect_anchors merge"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        description: "_care_obstruction_link_anchors, _care_obstruction_hitl, integration in _build_closed_episode and _build_open_episode"
      - artifact_type: "test_code"
        location: "tests/test_patient_4643293950_patterns.py"
        description: "TestPatternGCareObstruction"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 110
      key_functions:
        - "_RE_CARE_OBSTRUCTION"
        - "_classify_text_encounters"
        - "_care_obstruction_link_anchors"
        - "_care_obstruction_hitl"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Surfacing blocked / refused / safeguarding-flagged pathways for QA review BEFORE the stale-close pass swallows them"
    risk_control_measures:
      - "care_obstruction is independent of referral and diagnosis classification (an encounter can be both a rejection and an obstruction)"
      - "Anchors are claimed only within [referral_date, end_date + 90 days] to prevent cross-pathway contamination"
      - "HITL flag/reason combine with any existing reason via OR semantics (do not overwrite prior status logic)"

  verification_status:
    verification_method: "Test"
    verification_complete: true
