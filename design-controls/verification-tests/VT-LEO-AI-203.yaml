# -- VT-LEO-AI-203 -- Boilerplate lab-report referral guidance suppression (Pattern I)
# IEC 62304 Verification Test

- id: "VT-LEO-AI-203"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-211"
    risks:
      - "R-LEO-AI-199"

  metadata:
    title: "Boilerplate lab-report referral guidance: text_generic suppressed for auto-filed result drops"
    description: >
      Verifies the DI-LEO-AI-211 boilerplate-guidance + auto-filed
      suppression. Standard laboratory disclaimer text ("If the
      PSA value remains elevated above the age specific threshold,
      refer as a 2WW", "should be referred", "Consider 2WW
      referral if ...", "referrals made at the time of UTI will
      be rejected") and the EMR auto-file prefix MUST suppress
      text_generic referrals when no structural artefact is
      present. Active referral instructions ("Refer this patient
      via 2WW today for suspected lung cancer") MUST still fire,
      and a real referral that happens to carry a lab disclaimer
      MUST keep its anchor.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_patient_4842019832_patterns.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-203-TC-001"
      case_name: "PSA disclaimer 'If the PSA value remains elevated above the age specific threshold, refer as a 2WW' MUST match _RE_BOILERPLATE_REFERRAL_GUIDANCE"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_RE_BOILERPLATE_REFERRAL_GUIDANCE.search(<PSA disclaimer>)"
          expected_result: "Match object returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex matches PSA disclaimer"

    - case_id: "VT-203-TC-002"
      case_name: "'should be referred as a 2WW' MUST match"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_RE_BOILERPLATE_REFERRAL_GUIDANCE.search('If raised the patient should be referred as a 2WW.')"
          expected_result: "Match object returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex matches passive 'should be referred' guidance"

    - case_id: "VT-203-TC-003"
      case_name: "'Consider a 2WW referral if calprotectin is above 250' MUST match"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_RE_BOILERPLATE_REFERRAL_GUIDANCE.search('Consider a 2WW referral if calprotectin is above 250.')"
          expected_result: "Match object returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex matches conditional 'Consider 2WW referral if' wording"

    - case_id: "VT-203-TC-004"
      case_name: "'referrals made at the time of UTI will be rejected' MUST match"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_RE_BOILERPLATE_REFERRAL_GUIDANCE.search('Please note that referrals made at the time of UTI will be rejected.')"
          expected_result: "Match object returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex matches UTI-rejection disclaimer"

    - case_id: "VT-203-TC-005"
      case_name: "Active referral instruction 'Refer this patient via 2WW today for suspected lung cancer' MUST NOT match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_RE_BOILERPLATE_REFERRAL_GUIDANCE.search('Refer this patient via 2WW today for suspected lung cancer.')"
          expected_result: "None returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex returns None for active referral instruction"

    - case_id: "VT-203-TC-006"
      case_name: "_RE_AUTO_FILED_PREFIX matches '11:47 - Surgery: Auto-filed'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_RE_AUTO_FILED_PREFIX.search('11:47 - Surgery: Auto-filed\\nProstate-specific antigen level (XE25C) 0.77 ng/ml')"
          expected_result: "Match object returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Auto-filed prefix recognised"

    - case_id: "VT-203-TC-007"
      case_name: "Patient 4842019832-style auto-filed PSA disclaimer encounter MUST NOT emit text_generic referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters([{auto-filed PSA encounter with disclaimer + FH context}], set())"
          expected_result: "Returned referrals contain no entry with referral_subtype='text_generic'"
          verification_method: "automated"
      acceptance_criteria:
        - "No text_generic referral emitted"

    - case_id: "VT-203-TC-008"
      case_name: "Real referral 'Outbound referral (XaY59) Fast track referral for suspected prostate cancer' with lab disclaimer attached MUST keep referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters([{structural referral + disclaimer encounter}], set())"
          expected_result: "len(referrals) >= 1"
          verification_method: "automated"
      acceptance_criteria:
        - "At least one referral anchor emitted"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types:
      - "automated_test_run"
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-203/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-LEO-AI-203-EXEC-001"
      executed_at: "2026-04-18T12:00:00Z"
      executor: "automated"
      result: "pass"
      summary: >
        8 test cases (5 positive boilerplate-shape detection, 1
        negative active-referral guard, 1 end-to-end auto-filed
        suppression, 1 keep-list cross-check) executed via
        TestPatternIBoilerplateLabGuidance in
        tests/test_patient_4842019832_patterns.py. 8/8 passed.
      pass_count: 8
      fail_count: 0
      notes: "Test command: pytest tests/test_patient_4842019832_patterns.py::TestPatternIBoilerplateLabGuidance -v"
