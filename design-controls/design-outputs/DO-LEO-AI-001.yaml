# -- DO-LEO-AI-001 -- Hybrid Encounter Retrieval Module
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-001"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-001", "DI-LEO-AI-002"]
    user_needs: ["UN-LEO-AI-001"]
    risks_addressed: ["R-LEO-AI-002", "R-LEO-AI-018"]
    verification_tests: ["VT-LEO-AI-001"]
    validation_tests: []

  specification:
    title: "Hybrid Encounter Retrieval Module"
    description: |
      Retrieves patient encounters from FHIR R4 and ranks them using three
      complementary search strategies: keyword matching against domain concept
      sets, full-text search via Neo4j indexes, and vector similarity using
      Bio_ClinicalBERT embeddings. Produces a scored shortlist of encounters
      relevant to configured clinical domains.
    purpose: "Maximise recall of relevant encounters while maintaining precision by combining keyword, full-text, and semantic search strategies"
    technical_approach: "Three-stage retrieval pipeline with configurable score combination weights, backed by Neo4j graph store and domain-specific concept set registry"
    acceptance_criteria:
      - criterion: "Recall >= 95% against gold-standard shortlisting labels"
        type: "functional"
        measurement: "pytest with gold-standard labelled dataset"
        target: ">= 95% recall"
      - criterion: "Single patient shortlisting completes within time limit"
        type: "performance"
        measurement: "Wall-clock timing in integration tests"
        target: "<= 10 seconds per patient"
      - criterion: "No encounters silently dropped"
        type: "safety"
        measurement: "Audit log inspection for excluded encounters"
        target: "100% of exclusions logged with reason"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/services/neo4j_store.py"
        description: "Neo4j graph store client for encounter retrieval and full-text/vector search"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/domain_config/registry.py"
        description: "Domain configuration registry for clinical programme setup"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/domains/ncda_concept_sets.py"
        description: "NCDA concept sets used for keyword matching against encounter text"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Encounter exclusion logging", "Score combination accuracy"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed as part of the core-api container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-001 and DI-LEO-AI-002"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["encounter-retrieval", "hybrid-search", "core-pipeline"]
    priority: "high"
    complexity: "complex"
