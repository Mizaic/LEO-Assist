# -- DI-LEO-AI-027 -- Analytics Dashboard API
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-027"
  type: "Functional"
  derived_from: ["UN-LEO-AI-019"]
  requirement: "The system SHALL provide REST API endpoints that serve aggregated pathway metrics, waiting time performance, alert summaries, IMD deprivation analysis, and benchmarking data, supporting configurable date ranges, organisation scoping, and drill-down from aggregate to individual episodes"
  rationale: "Dashboard data must be served via API to support the frontend. Aggregation at the API layer enables efficient data retrieval and consistent metric calculation across all UI views."

  machine_spec:
    agent_prompt: |
      Implement analytics dashboard API (~250 LOC).

      SINGLE PURPOSE: Serve aggregated analytics data via REST endpoints
      for dashboard consumption with drill-down capability.

      REQUIREMENTS:
      1. Provide endpoints for pathway metrics (volumes, outcomes, timelines)
      2. Provide endpoints for waiting time performance against targets
      3. Provide endpoints for alert summaries (safety-net, screening gaps)
      4. Provide endpoints for IMD deprivation analysis
      5. Provide endpoints for benchmarking against peer organisations
      6. Support configurable date ranges on all endpoints
      7. Enforce organisation scoping on all queries
      8. Enable drill-down from aggregate metrics to individual episodes

      METHODS:
      - get_pathway_metrics(org, date_range): Aggregated pathway data
      - get_waiting_times(org, date_range): Waiting time performance
      - get_alert_summary(org, date_range): Alert counts and breakdown
      - get_imd_analysis(org, date_range): Deprivation quintile analysis
      - get_benchmarks(org, date_range): Peer comparison data
      - drill_down(metric, filters): Individual episode detail

      CODE CLARITY:
      - Each endpoint is a separate router function
      - Date range and org scope are common query parameters
      - Aggregation logic is testable independent of HTTP layer

    acceptance_criteria:
      - type: "test"
        spec: "Dashboard API returns correct metrics for known test data"
      - type: "test"
        spec: "Response time <= 3 seconds for all dashboard endpoints"
      - type: "test"
        spec: "Drill-down from aggregate to individual episodes works correctly"
      - type: "test"
        spec: "Organisation scoping enforced on all queries"

    constraints:
      - type: "performance"
        spec: "All dashboard API responses returned in <= 3 seconds"
      - type: "security"
        spec: "Organisation scoping mandatory on all analytics queries"

    dependencies: []

    downstream_impacts:
      - "services/ui -- dashboard components consume these endpoints"
      - "services/api -- analytics data available for reporting"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/analytics_api/app/routers/dashboards.py"
        - "services/analytics_api/app/routers/imd.py"
        - "services/analytics_api/app/routers/benchmarks.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Dashboard API returns correct metrics; response time <= 3 seconds; drill-down works correctly"
    test_protocol: "VT-LEO-AI-027"

  safety_class: "A"
  risks: []
  tags: ["analytics", "dashboard", "api", "reporting"]
