# -- DI-LEO-AI-072 -- Loop 1: Automated Audit Execution
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-072"
  type: "Functional"
  derived_from: ["UN-LEO-AI-049"]
  requirement: >
    The system SHALL execute an automated weekly audit of NER coding quality
    by running the audit LLM (Claude Sonnet via AWS Bedrock eu-west-2) against
    all encounters ingested in the preceding 7 days, recording results as
    immutable AuditRun and DriftMetric nodes in the patient graph, and
    supporting a deterministic run_id scheme that prevents overwriting of
    completed runs on restart.
  rationale: >
    Automated weekly audit is the primary post-market surveillance mechanism
    for the NER coding pipeline. Without it, coding regressions remain
    undetected until a manual clinical audit, potentially months later.
    Immutable audit records are required as quality evidence under ISO 13485
    and DCB0129.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "Audit script accepts --since-days N flag; computes since_date = today - N days at runtime"
      - type: "functional"
        spec: "Deterministic run_id: audit-YYYY-WNN for scheduled runs, UUID for manual runs"
      - type: "safety"
        spec: "Completed AuditRun nodes (status=complete) cannot be overwritten; retry creates suffixed run_id"
      - type: "functional"
        spec: "AuditRun records: run_id, triggered_by, since_date, until_date, status, encounter_count, pct_clean, critical_count, auditor_model_version, cost_usd"
      - type: "functional"
        spec: "DriftMetric records: pct_clean, pct_clean_by_domain (JSON), critical_count, overcoded_count, auditor_model_version, model_version_changed, metric_type='audit'"
      - type: "performance"
        spec: "Audit completes within 75 minutes for up to 5,000 encounters using 5 parallel workers"
      - type: "safety"
        spec: "Per-run cost cap: if estimated cost_usd exceeds $100, pause run and create SafetyNetAlert"
      - type: "functional"
        spec: "SQLite checkpoint persisted to Azure Files volume; crash-restart resumes from last completed encounter"
    constraints:
      - type: "safety"
        spec: "Audit LLM must use eu-west-2 (London) region; no cross-border data transfer"
      - type: "safety"
        spec: "AuditRun with status=complete is write-protected; any retry appends -retry-N suffix"
    dependencies: []
    downstream_impacts:
      - "DriftMetric used by drift detection and alerting (DI-LEO-AI-073)"
      - "AuditRun surface_form_gaps feed Loop 2 (DI-LEO-AI-075)"
      - "Overcoded findings feed remediation queue (DI-LEO-AI-074)"
    technical_details:
      language: "Python"
      framework: "FastAPI / Azure Container Apps Job"
      file_structure:
        - "scripts/investigations/audit_encounter_coding.py"
        - "libs/cypher/schema_constraints.py"
        - "infra/jobs/audit-quality-job.yaml"
      estimated_loc: 300

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-072 test cases pass: immutability guard, deterministic run_id,
      AuditRun/DriftMetric schema, per-domain breakdown, cost cap enforcement,
      and crash-resume via SQLite checkpoint.
    test_protocol: "VT-LEO-AI-072"

  safety_class: "B"
  risks: ["R-LEO-AI-047"]
  tags: ["loop1", "audit", "coding-quality", "auditrun", "driftmetric", "post-market-surveillance"]
