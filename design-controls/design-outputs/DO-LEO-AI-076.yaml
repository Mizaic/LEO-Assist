# -- DO-LEO-AI-076 -- Loop 3: Holdout Set Integrity Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-076"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-078"]
    user_needs: ["UN-LEO-AI-050"]
    risks_addressed: ["R-LEO-AI-053"]
    verification_tests: ["VT-LEO-AI-078"]

  specification:
    title: "Holdout Set Selection Script and Export Contamination Guard"
    description: |
      Implements select_holdout_set.py: stratified selection of 500 encounters
      across clinical domains with minimum 20 per safety-critical category.
      Sets holdout=true on DOCUMENTS relationships. Export query enforces
      WHERE r.holdout IS NULL OR r.holdout = false. Post-training evaluation
      stores results as DriftMetric with metric_type='training_eval'.
    acceptance_criteria:
      - criterion: "Selection stratification"
        type: "functional"
        measurement: "Test"
        target: "500 encounters selected; minimum 20 per safety-critical category (cancer, safeguarding, mental health crisis)"
      - criterion: "Export exclusion"
        type: "safety"
        measurement: "Test"
        target: "Training export JSONL contains zero encounters with holdout=true"
      - criterion: "Holdout manifest"
        type: "functional"
        measurement: "Test"
        target: "Manifest JSON lists: encounter count by domain, category minimums met flag, stratification breakdown"
      - criterion: "Training eval DriftMetric"
        type: "functional"
        measurement: "Test"
        target: "Post-training evaluation creates DriftMetric with metric_type='training_eval'"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "scripts/select_holdout_set.py"
        description: "Stratified holdout selection with category minimums and manifest output"
      - artifact_type: "source_code"
        location: "libs/cypher/documents_queries.py"
        description: "holdout flag on DOCUMENTS; export query WHERE clause for holdout exclusion"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 100
      key_functions:
        - "select_holdout_set"
        - "mark_holdout_encounters"
        - "generate_holdout_manifest"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Holdout exclusion in export query is the technical barrier to training/test contamination"
      - "Category minimums ensure holdout set can produce meaningful per-category F1 for safety-critical categories"
    risk_control_measures:
      - "Holdout flag on DOCUMENTS relationships is the enforcement mechanism; export query cannot omit it"
      - "Manifest documents stratification so reviewers can confirm category minimums are met"

  verification_status:
    verification_method: "Test"
    verification_complete: false
