# -- DI-LEO-AI-179 -- Encounter timeline scrubber for Mission Control patient detail
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-179"
  type: "Usability"
  derived_from: ["UN-LEO-AI-077"]
  requirement: >
    The Mission Control patient detail Encounter text tab SHALL
    expose a persistent, sticky encounter timeline that:
    (a) renders every encounter in the patient's history as a
    stacked-bar histogram on a linear date axis (oldest left,
    newest right), where each bar bins encounters by an
    auto-selected granularity (day | week | month | quarter | year)
    chosen from the patient's FULL history range -- day for ranges
    <= 60 days, week for <= 180 days, month for <= 730 days, quarter
    for <= 1825 days, year otherwise -- so dense histories are
    legible rather than overlapping dots, and the histogram bars
    stay visually stable while the focus filter is adjusted (the
    bars do NOT re-bin or shift when the brush window changes);
    (b) splits each bar into a "linked-to-focused-episode" segment
    (saturated brand colour, drawn at the base of the bar) and an
    "other-encounter" segment (neutral colour, stacked on top), so
    the reviewer can see linked density vs total density at a
    glance;
    (c) draws the episode window (referral_date to end_date) as a
    tinted band underneath the bars on the full date axis;
    (d) provides a focus-window filter: a slim rail below the
    histogram exposes two draggable handles that mark a focus
    window inside the patient's full history; the same window is
    overlaid on the histogram itself as a visible "focus band" so
    the brush position and the histogram are spatially linked;
    bars that fall fully outside the focus window are dimmed
    (opacity ~0.35) but remain present and clickable; the focus
    band itself is a draggable element (mouse drag, plus keyboard
    Arrow keys with Shift for larger steps) so reviewers can pan
    the focus window along the histogram without resizing it; a
    "Reset zoom" affordance appears whenever the focus window is
    narrower than the patient's full history;
    (e) supports hover, keyboard focus, and click on every bar:
    hover/focus reveals a floating preview card with the bin label,
    the total count, the linked count, and the date range it
    covers; click on a bar containing one encounter jumps directly
    to that encounter card; click on a bar containing more than one
    encounter opens an AnimatePresence popover listing each
    encounter (date, coded count, linked badge, first 80 chars
    preview) as a clickable chip, each of which jumps to its
    encounter on click;
    (f) on jump, auto-widens scope to "All encounters" when
    needed, scrolls the card into view, expands it, and marks the
    bin containing the active encounter as the active indicator
    using framer-motion shared-layout
    (`layoutId="timeline-active-bin"`); transitions collapse to
    instant when prefers-reduced-motion is set;
    (g) follows scroll: as the user scrolls the encounter list,
    the active indicator tracks the bin containing the encounter
    currently centred in the viewport via IntersectionObserver;
    (h) is sticky to the top of the scrollable tab panel
    (position: sticky; top: 0; with raised z-index and a soft
    shadow when scrolled) so the timeline remains visible while
    the reviewer scrolls the encounter list;
    (i) drives the encounter list filter: whenever the focus
    window is narrower than the patient's full history (the user
    has dragged a handle or panned the band), the encounter cards
    rendered below SHALL be filtered to only those encounters whose
    date falls within the focus window, and an "Encounters filtered
    to timeline window <from> - <to>" banner SHALL appear above the
    scope chips with a Clear control that resets the focus window
    back to the full history; clicking a bar that jumps to an
    encounter SHALL also clear the focus filter so the target
    encounter is always visible after the jump;
    (j) auto-hides when fewer than 5 encounters exist for the
    patient (the existing scope chip row is sufficient for short
    histories);
    (k) is fully keyboard-accessible: bars and brush handles are
    reachable by Tab, Arrow keys step between bars (and resize the
    visible range when focused on a brush handle), Enter / Space
    activates a bar (jump or open popover), Escape closes the
    popover and returns focus to the activating bar; every bar has
    an aria-label of the form "Bin <label>, <total> encounters
    (<linked> linked to focused episode), from <start date> to
    <end date>".
  rationale: >
    UN-LEO-AI-077 demonstrates that surrounding-context encounters
    are clinically important but currently buried behind a scope
    toggle plus manual scroll. A persistent spatial timeline turns
    that multi-step interaction into a single glance and a single
    click, which is the standard idiom for time-axis navigation in
    EHR review tooling. Anchoring the timeline to real dates (not
    indices) preserves the temporal density signal -- clusters and
    gaps in care -- which is a known clinical safety cue.
    The first iteration plotted one dot per encounter, which broke
    down for high-volume patients (e.g. the 2026-04-17 review
    surfaced a 315-encounter patient where dots overlapped to the
    point of illegibility and the linked-vs-other distinction was
    lost). Switching to a stacked histogram with auto-binning
    restores the density signal while preserving the
    linked-vs-other distinction in the same visual; adding zoom and
    sticky positioning means the timeline remains useful both for
    short focused checks and for long-history sweeps without the
    reviewer having to leave the encounter text tab.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          timelineBins.ts pickGranularity(rangeMs) returns "day" for
          ranges <= 60 days, "week" for <= 180 days, "month" for
          <= 730 days, "quarter" for <= 1825 days, and "year"
          otherwise.
      - type: "functional"
        spec: >
          timelineBins.ts buildBins(encounters, linkedIds, from, to,
          granularity) returns one bin per granularity step covering
          [from, to]; each bin reports startMs, endMs, label, total,
          linked, other, encounters[], and is sorted ascending.
      - type: "functional"
        spec: >
          EncounterTimelineScrubber computes bins from the patient's
          FULL date range (fullMinMs..fullMaxMs) at a single
          granularity selected by pickGranularity(fullMaxMs - fullMinMs)
          and does NOT re-bin when the focus window changes. The
          histogram stays visually stable while the focus filter is
          adjusted.
      - type: "functional"
        spec: >
          EncounterTimelineScrubber renders bins as stacked bars: a
          base segment whose height encodes the linked count, and an
          upper segment whose height encodes the other count, each
          bar's total height proportional to the bin total relative
          to the maximum bin total across the full range.
      - type: "functional"
        spec: >
          When episode.referral_date and episode.end_date are both
          present, a tinted background band is drawn between those
          two dates on the same axis across the full range.
      - type: "functional"
        spec: >
          When the focus window is narrower than the full history, a
          "timeline-focus-band" overlay is drawn on top of the
          histogram showing the focus window position. Bars whose
          bin range falls entirely outside the focus window receive
          data-in-focus="false" and are dimmed (opacity ~0.35) but
          remain present and clickable.
      - type: "functional"
        spec: >
          Hovering or focusing a bar shows a floating preview card
          (AnimatePresence) anchored above the bar, containing the
          bin label, total count, linked count, and the bin's date
          range.
      - type: "functional"
        spec: >
          Clicking a bar with bin.total === 1 calls the supplied
          onJumpToEncounter handler with that encounter id;
          clicking a bar with bin.total > 1 opens an
          AnimatePresence popover listing every encounter in the
          bin (date, coded count, linked badge, 80-char preview),
          each row clickable to invoke onJumpToEncounter.
      - type: "functional"
        spec: >
          The bar containing the active encounter id is wrapped in
          a motion.div with layoutId="timeline-active-bin" so the
          active indicator moves smoothly between bars when the
          active id changes.
      - type: "functional"
        spec: >
          A range-brush rail below the bars exposes two draggable
          handles bound to the focus [from, to] window; dragging a
          handle updates the focus window only (the histogram is
          NOT re-binned). Between the two handles, a "timeline-range
          -band" element is rendered and is itself draggable: mouse
          drag pans both ends together while preserving the window
          width, and Arrow keys (with Shift for larger steps) pan
          the band by 1% / 5% of the full range. The band clamps
          against fullMinMs / fullMaxMs so it can never leave the
          full history axis.
      - type: "functional"
        spec: >
          When the visible range is narrower than the full encounter
          history, a "Reset zoom" button is rendered which restores
          the visible range to [oldestEncounter, newestEncounter].
      - type: "functional"
        spec: >
          The scrubber root uses position: sticky; top: 0; with a
          z-index above encounter cards, so it remains visible while
          the encounter list scrolls inside the tab panel.
      - type: "functional"
        spec: >
          When the parent supplies onVisibleRangeChange, the scrubber
          becomes a controlled component: brush drags call
          onVisibleRangeChange(fromMs, toMs) and the Reset zoom
          control calls onVisibleRangeChange(null, null). The parent
          uses these values to filter the encounter list (encounters
          whose date falls outside the visible range are hidden) and
          renders a "timeline-filter-banner" Alert above the scope
          chips when a filter is active, with a Clear control wired
          back to onVisibleRangeChange(null, null).
      - type: "functional"
        spec: >
          jumpToEncounter MUST clear the timeline filter (set the
          parent's timelineRange state to null) before scrolling, so
          the target encounter is always rendered after a milestone
          chip click, a single-bin bar click, or a popover row click.
      - type: "safety"
        spec: >
          When useMotion().reducedMotion is true, all framer-motion
          transitions in the scrubber collapse to {duration: 0}.
      - type: "usability"
        spec: >
          Scrubber returns null when encounters.length < 5 so it does
          not add visual noise to short histories.
      - type: "usability"
        spec: >
          Each bar exposes role="button", tabIndex=0, an aria-label
          of the form "Bin <label>, <total> encounters (<linked>
          linked to focused episode), from <start date> to <end
          date>", aria-pressed reflecting active state, and
          Enter/Space/Arrow-key handlers; brush handles expose
          role="slider" with aria-valuemin/aria-valuemax/aria-valuenow.

  constraints:
    - type: "safety"
      spec: >
        Scrubber MUST NOT mutate encounter data; jump handler is
        purely a navigation cue passed back to the parent.
    - type: "performance"
      spec: >
        Render must remain under 16ms for up to 500 encounters; use
        useMemo for bin and axis calculations.
    - type: "accessibility"
      spec: >
        All interactive elements MUST meet WCAG 2.5.5 AA target size
        (>= 24x24 px hit area, achieved via padding around the
        visual bar / handle) and WCAG 2.1 AA colour contrast on the
        bar fill, the brush handle, and any text rendered inside
        the popover.

