# -- DI-LEO-AI-010 -- Episode Builder
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-010"
  type: "Functional"
  derived_from: ["UN-LEO-AI-006"]
  requirement: "The system SHALL construct ClinicalEpisode objects by grouping related encounters, linking them to detected milestones, and classifying episode status (confirmed, excluded, inconclusive) using rule-based classification with LLM fallback for edge cases"
  rationale: "The clinical episode is the primary unit of audit analysis. Automated episode construction from coded encounters and milestones replaces the most time-consuming manual audit task. LLM fallback handles ambiguous cases where rule-based classification is insufficient."

  machine_spec:
    agent_prompt: |
      Implement the EpisodeBuilder class (~300 LOC).

      SINGLE PURPOSE: Construct ClinicalEpisode objects from coded encounters
      and detected milestones.

      REQUIREMENTS:
      1. Group related encounters by temporal proximity, shared SNOMED domains,
         and milestone linkage.
      2. Link each encounter to relevant milestones within the episode timeline.
      3. Classify episode status (confirmed, excluded, inconclusive) using
         rule-based logic.
      4. Route low-confidence classifications to LLM fallback for additional
         reasoning.
      5. Generate a complete episode timeline with all linked encounters,
         milestones, and metadata.

      METHODS:
      - build_episodes(patient_id): Construct all episodes for a patient.
      - group_encounters(encounters): Group encounters into candidate episodes.
      - classify_episode(episode): Apply rule-based classification.
      - llm_fallback(episode): Route ambiguous episodes to LLM for classification.
      - build_timeline(episode): Assemble the complete episode timeline.

      CODE CLARITY:
      - Use guard clauses to flatten nesting.
      - Keep functions under 30 lines.
      - Use type hints throughout.

    acceptance_criteria:
      - type: "test"
        spec: "Episode classification accuracy >= 85% against expert consensus dataset"
      - type: "test"
        spec: "All encounters assigned to exactly one episode"
      - type: "test"
        spec: "LLM fallback triggered only when rule-based confidence < threshold"
      - type: "test"
        spec: "Complete timeline generated for each episode with correct temporal ordering"

    constraints:
      - type: "performance"
        spec: "Episode construction for a single patient completes in < 5 seconds"
      - type: "safety"
        spec: "All LLM-generated classifications marked as proposals requiring human review"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "episode_consolidator"
      - "quality_checker"
      - "kpi_calculator"
      - "review_service"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_builder.py"
        - "libs/prompts/episode_builder_v1.py"
      estimated_loc: 300

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Episode classification accuracy >= 85% against expert consensus"
    test_protocol: "VT-LEO-AI-010"

  safety_class: "B"
  risks: ["R-LEO-AI-021", "R-LEO-AI-001"]
  tags: ["episode-building", "clinical-episode", "analysis"]
