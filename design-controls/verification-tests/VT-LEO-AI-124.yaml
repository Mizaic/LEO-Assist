- id: "VT-LEO-AI-124"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-125", "DI-LEO-AI-126"]
    risks: ["R-LEO-AI-085", "R-LEO-AI-086"]

  metadata:
    title: "NCDA ground-truth regression harness"
    description: >
      Pins the curated 117-episode NCDA ground-truth dataset to the
      current baseline so any pipeline change that alters episode
      cardinality, milestone parity, or interval KPI math is caught at
      test time. Verifies three invariants: (1) cardinality and join
      integrity between clean_episode_ground_truth.json and
      ncda_export.json, (2) distribution tripwires on cancer/benign
      outcomes, episode status, referral type, and cancer-type mix,
      (3) libs.metrics.compute_interval_kpis recomputed from the
      ground-truth milestones matches the days_* fields baked into the
      NCDA export, for every episode where both anchors are present.
    test_level: "integration"
    test_type: "regression"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_ground_truth_regression.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "data/ground_truth/clean_episode_ground_truth.json present and tracked"
      - "data/ground_truth/ncda_export.json present and tracked"
    test_data:
      data_type: "curated_ground_truth"
      cleanup_required: false

  test_cases:
    - case_id: "VT-124-TC-001"
      case_name: "Episode and patient cardinality locked to baseline"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Load ground truth and NCDA export JSON"
          expected_result: "Record counts and unique patient counts match frozen baselines"
          verification_method: "automated"
      acceptance_criteria:
        - "117 episodes in clean_episode_ground_truth.json"
        - "117 episodes in ncda_export.json"
        - "90 unique patients"
        - "Join key (patient_id, cancer_type, referral) is 1:1 across both files"

    - case_id: "VT-124-TC-002"
      case_name: "Schema validity enforced on every record"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Validate each record has required fields and valid enum values"
          expected_result: "diagnosis_outcome, expected_status, referral_type in closed vocabularies; patient_id non-empty"
          verification_method: "automated"

    - case_id: "VT-124-TC-003"
      case_name: "Distribution tripwires match baseline"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Count records grouped by outcome, status, referral type, cancer type"
          expected_result: "All counts equal frozen baselines (31 cancer, 31 benign, 55 unknown; 114 gp_initiated, 3 ae_initiated; cancer-type mix locked)"
          verification_method: "automated"

    - case_id: "VT-124-TC-004"
      case_name: "Interval KPI parity across ground truth and NCDA export"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Recompute days_presentation_to_referral, days_referral_to_diagnosis, days_diagnosis_to_treatment via libs.metrics.compute_interval_kpis on ground-truth dates"
          expected_result: "Every recomputed value matches the value baked into ncda_export.json (None values skipped)"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-124/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-124-EXEC-20260416-001"
      executed_on: "2026-04-16"
      executed_by: "ci-pytest"
      environment: "local-dev"
      result: "pass"
      total_cases: 17
      passed: 17
      failed: 0
      notes: >
        pytest tests/test_ground_truth_regression.py -v produced 17/17
        passes across cardinality, schema, distribution, and interval
        KPI parity classes. Full sprint regression (Packages 1-7, 147
        tests) also green.
