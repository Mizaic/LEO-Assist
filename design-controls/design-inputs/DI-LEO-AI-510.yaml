# -- DI-LEO-AI-510 -- Evaluator returns matched_concept_ids; SBAR snapshot carries them
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-510"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-093"
  requirement: >
    services/terminology_api/app/services/guideline_evaluator.py
    ::_annotate_logic_tree SHALL, for every CONCEPT leaf, populate
    a new ``matched_concept_ids`` list with the SNOMED string ids
    of every patient code that intersects the leaf bitmap (mapped
    back via the ``seed_concept_ids`` echo from the compiler when
    available, otherwise the int-id reverse-lookup). The
    evaluator's per-rule response SHALL also carry an aggregated
    ``matched_concept_ids`` list deduplicated across all matched
    leaves, ordered by first appearance. The diagnose endpoint
    SHALL surface the same field on every concept leaf in its
    annotated logic tree. libs/sbar/assessment_formatter.py
    ::_rule_snapshot SHALL include the per-rule matched_concept_ids
    and a per-leaf ``matched_via`` list of
    ``{leaf_term, matched_concept_id, matched_term, primary_concept_id}``
    objects so the Recommendation prompt and any downstream
    renderer can name the matched code in plain English.

  rationale: >
    Today the SBAR Assessment names the rule that fired but cannot
    explain WHICH patient code matched. With synonym sets and
    descendant expansion now possible, that ambiguity widens (a
    "Smoker" rule can fire on Cigarette smoker, Pipe smoker, etc.)
    Surfacing matched_concept_ids closes the loop so reviewers can
    verify the match, downstream LLM prompts can produce more
    specific narrative, and clinical safety review can confirm
    that exclusion carve-outs are actually being respected.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: When a CONCEPT leaf bitmap intersects a patient
          bitmap on int ids [i1, i2], _annotate_logic_tree returns
          matched_concept_ids = the SNOMED string ids that map to
          [i1, i2], in the order they appear in the patient's
          original code list.
      - type: "functional"
        spec: >
          AC-002: Each matched rule object in evaluate_patient and
          diagnose responses carries an aggregated
          matched_concept_ids list deduplicated across all matched
          CONCEPT leaves in that rule's logic tree.
      - type: "functional"
        spec: >
          AC-003: _rule_snapshot in libs/sbar/assessment_formatter.py
          includes the new fields when present on the input rule
          dict; legacy rule dicts without the field are accepted
          and produce a snapshot with matched_concept_ids = [] and
          matched_via = [].
      - type: "safety"
        spec: >
          AC-004: The aggregated matched_concept_ids field MUST NOT
          contain any concept id present in the criterion's
          excluded_concept_ids list (a defence-in-depth check that
          catches a future regression where the compiler forgets to
          subtract exclusions).
      - type: "functional"
        spec: >
          AC-005: libs/prompts/sbar_recommendation_v1 system prompt
          (or its successor) is updated to instruct the model:
          "When a rule fired on a descendant code (for example
          'Cigarette smoker' rather than the headline 'Smoker'),
          mention the matched term in plain English and explain it
          is a kind of the headline. Do not mention raw SNOMED IDs."
    constraints:
      - type: "safety"
        spec: >
          Adding matched_concept_ids to the evaluator response
          SHALL NOT change the matched / not-matched verdict for
          any rule (the field is purely informational; the bitmap
          intersection still drives the verdict).
      - type: "performance"
        spec: >
          The reverse-lookup from int ids to SNOMED string ids
          MUST NOT issue any new Cypher queries at evaluation time
          (the compiler echo MUST be sufficient).
    dependencies:
      - "DI-LEO-AI-509"
    downstream_impacts:
      - "SBAR Assessment narrative"
      - "Diagnose UI rule preview"
      - "Test patient replay reports"
    technical_details:
      language: "Python"
      framework: "FastAPI + pyroaring"
      file_structure:
        - "services/terminology_api/app/services/guideline_evaluator.py"
        - "libs/sbar/assessment_formatter.py"
        - "libs/prompts/sbar_recommendation_v1.py"
      estimated_loc: 220

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-510 covers (a) per-leaf matched_concept_ids
      population, (b) per-rule aggregated list, (c) diagnose
      endpoint surfaces the field, (d) _rule_snapshot includes the
      field with safe defaults for legacy callers, (e) the
      Recommendation prompt mentions matched-term framing.
    test_protocol: "VT-LEO-AI-510"

  safety_class: "B"
  risks:
    - "R-LEO-AI-508"
  tags:
    - "guideline-evaluator"
    - "sbar"
    - "matched-concept-ids"
