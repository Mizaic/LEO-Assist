# -- R-LEO-AI-181 -- LLM hallucinated content in SBAR Situation/Background/Recommendation
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-181"
  title: "LLM-generated SBAR sections (Situation, Background, Recommendation) introduce facts, drugs, dates, or recommendations that are not present in the resolved source data"

  hazard:
    description: >
      The Situation, Background, and Recommendation sections of an
      Assessment are produced by LLM calls. Even with strict system
      prompts and JSON schemas, an LLM can invent or paraphrase
      clinical facts (a drug, a date, a finding), or generate a
      recommendation that is not justified by the rules surfaced by
      the deterministic Assessment formatter.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician opens an SBAR generated for a referral. The Background
    bullet list says "Patient on warfarin since 2020" but no warfarin
    encounter or document is present in the source data; or the
    Recommendation says "Refer to colorectal 2WW" when the rules
    surfaced only routine pathways. The clinician acts on the SBAR
    without re-checking the underlying record.

  harm:
    description: >
      Wrong clinical decision -- inappropriate referral, missed
      referral, wrong medication action, or missed safety-net follow-
      up. Severity is bounded by the fact that an SBAR is a decision-
      support artefact and the clinician retains responsibility, but
      the harm potential is serious because clinicians are time-
      pressured and the SBAR is presented as a structured summary.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 4
    rpn: 48
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        12 hardening rules embedded in every SBAR system prompt
        require: source attribution on every factual claim, no
        inference beyond the supplied CONTEXT, explicit "missing"
        markers when expected data is absent, conflict surfacing,
        plain-English reading age, no PII smuggling, and JSON-only
        output.
      implemented_by: ["DI-LEO-AI-192"]
      verified_by: ["VT-LEO-AI-189"]
      effectiveness: "partially_effective"
    - control_type: "design_feature"
      description: >
        Recommendation prompt is grounded against the rule_ids
        surfaced by the deterministic Assessment formatter; structured
        actions[] each carry a rule_ids[] reference so reviewers can
        audit whether each action maps to a rule.
      implemented_by: ["DI-LEO-AI-192", "DI-LEO-AI-193"]
      verified_by: ["VT-LEO-AI-189"]
      effectiveness: "partially_effective"
    - control_type: "design_feature"
      description: >
        Assessment section itself is rendered DETERMINISTICALLY from
        the rule evaluator output -- no LLM in the loop -- so the
        clinical-decision substrate that drives the Recommendation is
        verifiable rule-by-rule (R-LEO-AI-181 + DI-LEO-AI-193).
      implemented_by: ["DI-LEO-AI-193"]
      verified_by: ["VT-LEO-AI-189"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        SBAR Playground and any consumer surface MUST display a
        prominent banner that the Assessment is decision-SUPPORT and
        does not replace clinician judgement. The /admin playground
        carries a "test only" banner enforced by VT-LEO-AI-188.
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-188"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"
    acceptability: "conditionally_acceptable"
    justification: >
      The deterministic Assessment substrate caps the worst-case
      drift on the SBAR's clinical recommendations. Hallucination on
      the Situation/Background sides remains possible at low
      probability because the prompts are hardened and the JSON
      schemas reject empty markdown. Conditional acceptance: SBAR
      remains gated to admin / pilot reviewers (R-LEO-AI-185) until
      the golden-set VT (VT-LEO-AI-189) is run against ten manually
      curated cases and recorded as passed; broader rollout requires
      a VAL with clinical reviewers.
  monitoring:
    monitoring_plan: >
      Per-stage error capture in Assessment.errors plus golden-set
      regression VT (VT-LEO-AI-189) before any wording change to the
      SBAR prompts. Ad-hoc reviewer flags from the playground feed
      back into the prompt-config rollback flow.
    metrics:
      - "Golden-set fail rate per prompt change (target 0)"
      - "Reviewer-reported hallucinations per 100 SBARs (target <1)"
    review_frequency: "Per release of any SBAR prompt or before broader rollout"

  metadata:
    identified_by: "Plan workshop 2026-04-17"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "sbar"
      - "llm-safety"
      - "decision-support"
