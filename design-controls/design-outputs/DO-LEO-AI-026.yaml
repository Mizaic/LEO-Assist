- id: "DO-LEO-AI-026"
  version: "1.0.0"
  type: "Source_Code"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-039"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-026"]
    verification_tests: ["VT-LEO-AI-024"]

  specification:
    title: "CodingDecision Audit Trail Queries"
    description: |
      Cypher query definitions for the CodingDecision node schema in Neo4j.
      Every autonomous-mode coding decision is recorded as a CodingDecision
      node with full provenance: entity, assertion, tier, decision, reason,
      terminology score, consensus verdict, and model IDs. MERGE semantics
      ensure idempotent writes. Queries support per-encounter retrieval,
      aggregate statistics, and audit flag counting.
    acceptance_criteria:
      - criterion: "Idempotent writes"
        type: "data"
        measurement: "Test"
        target: "MERGE by decision_id prevents duplicates"
      - criterion: "Immutable created_at"
        type: "regulatory"
        measurement: "Test"
        target: "ON CREATE SET ensures created_at is never overwritten"
      - criterion: "Complete parameter set"
        type: "functional"
        measurement: "Test"
        target: "All 12 audit parameters present in UPSERT query"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/cypher/coding_decision_queries.py"
        description: "UPSERT_CODING_DECISION, GET_CODING_DECISIONS_FOR_ENCOUNTER, GET_CODING_DECISION_STATS, COUNT_AUDIT_FLAGGED"
        storage_location: "git"
    technical_details:
      language: "Cypher / Python"
      loc: 30

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Audit trail for every autonomous coding decision"
      - "Immutable created_at timestamp for regulatory compliance"
    risk_control_measures:
      - "MERGE idempotency prevents duplicate records"
      - "decision_id uniqueness constraint at Neo4j schema level"

  verification_status:
    verification_method: "Test"
    verification_complete: true
