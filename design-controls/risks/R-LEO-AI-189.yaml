# -- R-LEO-AI-189 -- PHI leakage into gold dataset via dry-run correction path
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-189"
  title: "Raw encounter text from a dry-run reviewer click leaks PHI into the gold training dataset"

  hazard:
    description: >
      The /admin/console dry-run review surface holds raw GP
      encounter text in the browser (it is sent to the model
      inference endpoint to produce the dry-run extraction). When a
      curator clicks 'Open in gold editor' that text is POSTed to a
      new endpoint that persists a TrainingCandidate. If the
      endpoint were to persist the raw text (or hash it without
      de-identification) the candidate row, the candidate_id, and
      the seeded GoldLabel would all carry direct identifiers
      (patient name, NHS number, dates of birth, postcodes,
      addresses) into a graph that is exported wholesale into model
      training corpora.
    category: "data_protection"

  hazardous_situation: >
    A curator inspects a dry-run row containing residual PHI
    (clinician name, scanned letter header, address block) and
    clicks the new IconButton. The endpoint persists the raw text
    on the TrainingCandidate node. The next nightly export builds
    a training manifest that ships the PHI-bearing sentence into
    the medspaCy training set and (via the candidate's draft
    GoldLabel) into the verified-gold export downstream of
    reviewer approval.

  harm:
    description: >
      UK GDPR Article 9 special-category data leak: identifiable
      patient data flows from the patient graph (locked, scoped to
      org_id) into the knowledge graph (training pool) and onward
      into model weights. Notification, retraining, and possible
      ICO disclosure costs.
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 3
    detectability: 4
    rpn: 48
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        candidate_from_dry_run de-identifies the encounter text
        server-side via libs.utils.deidentify.deidentify_text(text,
        ner=True) BEFORE either hashing it or persisting it. The
        candidate_id is sha256 of the de-identified text, matching
        the existing _candidate_id contract used by
        libs/pipeline_graph/subgraphs/persist.py, so dry-run
        corrections cannot produce a node that the rest of the
        pipeline does not already produce by the same de-identified
        path.
      implemented_by: ["DI-LEO-AI-198"]
      verified_by: ["VT-LEO-AI-191"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        TrainingCandidate is upserted with
        source='dry_run_correction'. The existing gold-label
        existing-entities audit
        (tests/test_gold_label_existing_entities_audit.py and
        scripts/audit_gold_label_entities.py) flags any candidate
        text that contains residual identifiers; the dedicated
        source string lets the audit segment dry-run-sourced rows
        for separate review and lets ops bulk-purge them via the
        existing DELETE_TRAINING_CANDIDATE_AND_ARTIFACTS path if a
        de-identifier regression is ever discovered.
      implemented_by: ["DI-LEO-AI-198"]
      verified_by: ["VT-LEO-AI-191"]
      effectiveness: "partially_effective"
    - control_type: "information_for_safety"
      description: >
        source_hint is truncated to 64 characters server-side and
        is the only provenance string carried into the candidate
        (no encounter_id payload, no patient_id). The endpoint is
        gated by get_caller_scope so anonymous callers cannot use
        it as a PHI laundering channel.
      implemented_by: ["DI-LEO-AI-198"]
      verified_by: ["VT-LEO-AI-191"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Server-side de-identification on every request closes the
      direct leak path and matches the controls already trusted by
      the pipeline-produced candidates. The audit tooling and
      source-tagged rows give ops a quick recovery path if the
      de-identifier ever regresses. Residual risk is bounded by
      the de-identifier's own miss rate, which is monitored by the
      separate de-identifier validator
      (libs/ner/deid_validator.DeIdValidator) used in the synthetic
      generation flow.

  monitoring:
    monitoring_plan: >
      Run scripts/audit_gold_label_entities.py weekly with a
      filter on source='dry_run_correction' and alert if any
      candidate row matches the residual-PHI patterns. Re-run the
      audit on every de-identifier release. Track
      candidate_from_dry_run call volume in the API metrics so a
      sudden spike (potential bulk-PHI ingestion) is visible.
    metrics:
      - "training_candidate_count where source='dry_run_correction' (weekly)"
      - "audit_gold_label_entities residual-PHI hits where source='dry_run_correction' (weekly, target zero)"
      - "candidate_from_dry_run requests per hour (rolling)"
    review_frequency: "Weekly"

  metadata:
    identified_by: "Rob Smith - 2026-04-18 dry-run-to-gold-editor design review"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "gdpr"
      - "phi-leak"
      - "training-data-quality"
      - "dry-run-corrections"
