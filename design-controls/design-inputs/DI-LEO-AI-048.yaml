# -- DI-LEO-AI-048 -- Intended-Use Scope Guard
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-048"
  type: "Safety"
  derived_from: ["UN-LEO-AI-001"]
  requirement: >
    The coding pipeline SHALL enforce intended-use boundaries by preventing
    treatment recommendations, safety-netting advice, and hedged diagnostic
    interpretations from being coded as confirmed present clinical findings.
    Specifically:
    (a) Entities extracted from safety-netting / contingency sentences SHALL
        be reclassified from "present" to "hypothetical".
    (b) Entities from treatment recommendation context (e.g. "consider starting",
        "recommend starting", "suggest initiating", "should be started on")
        SHALL be reclassified from "present" to "hypothetical". The regex
        SHALL NOT match ambiguous UK GP phrases like "will start" or "to start"
        which commonly describe actions the GP performed during the consultation.
    (c) Disorder entities from hedged diagnostic language (e.g. "consistent with",
        "suggestive of", "cannot exclude") SHALL be reclassified from "present"
        to "possible" unless an explicit confirmed diagnosis is also stated.
    (d) The extraction prompt SHALL include explicit intended-use boundaries
        stating the system is a coding tool that must not make diagnoses,
        recommend treatment, interpret results, or generate safety advice.
  rationale: >
    The system's intended use is retrospective clinical coding — it codes what
    the clinician wrote, not what should be done. If the pipeline codes planned
    treatments as current prescriptions, safety-netting symptoms as present
    findings, or speculative diagnoses as confirmed conditions, it exceeds its
    intended purpose and creates patient safety risks. This also risks pushing
    the product into a higher regulatory classification.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "Extraction prompt contains 'Intended Use Boundaries' section forbidding diagnosis, treatment, interpretation, and safety-netting"
      - type: "safety"
        spec: "Extraction prompt self-check includes 'Am I coding what was written, or am I making a clinical interpretation?'"
      - type: "safety"
        spec: "Scope guard detects safety-netting sentences (11+ patterns including 'if develops', 'call 999', 'attend A&E', 'red flag')"
      - type: "safety"
        spec: "Scope guard detects treatment recommendation language (10+ patterns including 'consider starting', 'recommend referral', 'will start')"
      - type: "safety"
        spec: "Scope guard detects hedged diagnostic language (10+ patterns including 'consistent with', 'suggestive of', 'cannot exclude')"
      - type: "safety"
        spec: "Hedged diagnosis detection is overridden when explicit confirmed diagnosis is present in the same sentence"
      - type: "safety"
        spec: "Scope guard reclassifies safety-netting and recommendation entities from 'present' to 'hypothetical'"
      - type: "safety"
        spec: "Scope guard reclassifies hedged disorder entities from 'present' to 'possible'"
      - type: "safety"
        spec: "Scope guard does NOT modify entities with non-present assertions (absent, historical, hypothetical, etc.)"
      - type: "safety"
        spec: "Normal clinical text (diagnoses, current medications, completed procedures) is not affected by the scope guard"
      - type: "safety"
        spec: "Scope guard is Layer 3 in the unified post-processing stack (libs/pipeline/post_processing.py), applied identically to both training and runtime pipelines after lab-value guard (Layer 2) and before ConText detection (Layer 7)"

    constraints:
      - type: "safety"
        spec: >
          The system codes what is written, never what is inferred or
          recommended. Planned actions, safety-netting advice, and speculative
          diagnoses must never be coded as confirmed present findings.
      - type: "defence_in_depth"
        spec: >
          The fix is implemented at two layers: (1) extraction prompt intended-use
          boundaries and (2) deterministic scope guard. Both must fail for a
          recommendation or safety-netting entity to be coded as present.

    dependencies: ["DI-LEO-AI-044", "DI-LEO-AI-040"]

    downstream_impacts:
      - "Coding pipeline assertion accuracy"
      - "Tier classifier input quality"
      - "HITL review queue quality"
      - "Autonomous mode coding safety"
      - "Regulatory classification compliance"

    technical_details:
      language: "Python"
      framework: "Unified post-processing stack (libs/pipeline/post_processing.py) — scope guard is Layer 3, applied identically to training and runtime pipelines (DI-LEO-AI-050)"
      file_structure:
        - "libs/pipeline/post_processing.py"
        - "libs/prompts/extraction_v1.py"
        - "libs/ner/scope_guard.py"
        - "services/coding_worker/app/pipeline/pipeline_service.py"
        - "services/api/app/services/label_verifier.py"
        - "tests/test_scope_guard.py"
        - "tests/test_post_processing_pipeline.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 44 test cases pass covering: safety-netting detection (11 cases),
      treatment recommendation detection (11 cases), hedged diagnosis
      detection (10 cases), and integrated reclassification logic (12 cases).
    test_protocol: "VT-LEO-AI-040"

  safety_class: "B"
  risks: ["R-LEO-AI-029", "R-LEO-AI-033"]
  tags:
    - "clinical-safety"
    - "scope-guard"
    - "intended-use-enforcement"
    - "treatment-recommendation"
    - "safety-netting"
    - "hedged-diagnosis"
    - "defence-in-depth"
    - "regulatory-classification"
