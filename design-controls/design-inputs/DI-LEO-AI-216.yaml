# -- DI-LEO-AI-216 -- Self-narrated past-referral guard (Pattern L)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-216"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-005"
    - "UN-LEO-AI-006"
  requirement: >
    The text-anchor referral suppression regex
    _RE_NARRATIVE_REFERRAL_REFERENCE SHALL match retrospective
    self-narration of a past referral including, but not limited
    to:
      - "Referred by me on 2WW earlier this year"
      - "I referred her last month"
      - "we referred him in Jan"
      - "GP referred via 2WW back in March 2024"
      - "previously referred"
    so that follow-up / cancer-care-review notes that narrate the
    original referral do NOT generate fresh text_generic referral
    anchors and do NOT open phantom EpisodeOfCare nodes.
  rationale: >
    Patient 4802892365's 2025-09-24 cancer-care-review encounter
    contained "Referred by me on 2ww earlier this year, confirmed
    breast cancer". The detector matched the structural referral
    cue "referred by me on 2ww" and emitted a fresh text_generic
    referral on 2025-09-24, which then opened a phantom episode
    (47c987c92e50e545) six months after the real referral on
    2025-03-26. The narrative-referral-reference regex MUST
    recognise these retrospective narrations as references to
    prior referrals, not new ones, otherwise every cancer-care
    review will fragment the pathway and inflate referral counts.
    A cohort scan found this shape in at least one other patient.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "Encounter text 'Referred by me on 2ww earlier this year, confirmed breast cancer' MUST emit zero referral anchors"
      - type: "functional"
        spec: "Encounter text 'I referred her last month' MUST emit zero referral anchors"
      - type: "functional"
        spec: "Encounter text 'we referred him in Jan' MUST emit zero referral anchors"
      - type: "functional"
        spec: "Encounter text 'GP referred via 2WW back in March 2024' MUST emit zero referral anchors"
      - type: "functional"
        spec: "Encounter text 'previously referred' MUST emit zero referral anchors"
      - type: "safety"
        spec: "A fresh referral encounter ('Fast track referral for suspected breast cancer (XaMeC)') MUST still emit a referral anchor (no over-suppression)"
    constraints:
      - type: "safety"
        spec: "Pattern L extension only matches narrative shapes; structural PRISM/EMIS referral codes (XaMeC, XaMeH etc.) on the SAME encounter still fire a referral"
    dependencies:
      - "DI-LEO-AI-159"
      - "DI-LEO-AI-203"
    downstream_impacts:
      - "Anchor detector (text path)"
      - "EpisodeOfCare graph (eliminates phantom episodes from cancer-care-review notes)"
      - "Cohort referral counts (suppresses double-counting)"
    technical_details:
      language: "Python"
      framework: "Anchor detector (regex layer)"
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 18

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-208 must pass with 100% on all critical and total
      cases, including all five Pattern L narrative shapes and the
      no-over-suppression sanity case.
    test_protocol: "VT-LEO-AI-208"

  safety_class: "B"
  risks:
    - "R-LEO-AI-203"
  tags:
    - "anchor-detector"
    - "referral-classification"
    - "narrative-suppression"
    - "patient-4802892365"
