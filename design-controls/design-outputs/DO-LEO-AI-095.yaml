- id: "DO-LEO-AI-095"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-097"]
    user_needs: ["UN-LEO-AI-049", "UN-LEO-AI-050"]
    risks_addressed: ["R-LEO-AI-067"]
    verification_tests: ["VT-LEO-AI-097"]

  specification:
    title: "Extraction quality LLM check before terminology"
    description: |
      Adds a relation-linking stage and a single-turn extraction quality check
      before terminology resolution. The quality check can drop noisy entities,
      correct assertion and semantic tag fields, add missed clinically explicit
      mentions, and correct/add relation links for body-site and qualifier
      context. The check uses a constrained JSON contract and attaches
      provenance markers for retraining. Referral procedure phrases are
      protected from uncertain assertion downgrades by a deterministic guard.
      Conditional routing sends changed extraction payloads to HITL queue.
    acceptance_criteria:
      - criterion: "Single-turn check"
        type: "functional"
        measurement: "Test"
        target: "extraction_check subgraph executes one llm.converse call and parses JSON response"
      - criterion: "Correction scope"
        type: "safety"
        measurement: "Test"
        target: "Only drop/correct_assertion/correct_label/add operations are applied"
      - criterion: "Relation linking"
        type: "functional"
        measurement: "Test"
        target: "relation_linking subgraph adds __relations and relation-suppressed markers"
      - criterion: "Relation correction scope"
        type: "safety"
        measurement: "Test"
        target: "Extraction check relation updates are limited to correct_relation/add_relation operations"
      - criterion: "Provenance tags"
        type: "functional"
        measurement: "Test"
        target: "Modified entities include _llm_check_source markers"
      - criterion: "Referral procedure assertion safety"
        type: "safety"
        measurement: "Test"
        target: "Procedure referral phrases are normalised to present when an extraction check suggests possible"
      - criterion: "Gold-training gating"
        type: "functional"
        measurement: "Test"
        target: "Gold-training write is skipped unless an entity includes extraction-check provenance markers"
      - criterion: "Candidate entity payload persistence"
        type: "functional"
        measurement: "Test"
        target: "TrainingCandidate persists entities_json so mention and semantic_tag are retained for manual gold editing"
      - criterion: "Unsafe terminology mapping blocklist"
        type: "safety"
        measurement: "Test"
        target: "Configured unsafe term-to-concept pairs are blocked and returned as terminology_unresolved"
      - criterion: "Conditional routing"
        type: "functional"
        measurement: "Test"
        target: "has_extraction_changes=true branches to hitl_ner_queue, pass-through branches to terminology"
      - criterion: "Side-effect counselling suppression"
        type: "safety"
        measurement: "Test"
        target: "Medication side-effect counselling lists are suppressed and not persisted as current findings"
      - criterion: "Shared annotation guideline composition"
        type: "safety"
        measurement: "Test"
        target: "extraction_check, coding_check, and relation_linking prompt resolvers compose canonical annotation_guidelines v1 even when prompt_config is provided in state or literal fallback is used"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/relation_linking.py"
        description: "Relation linking execution and finding-site lookup-term synthesis"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/llm_check.py"
        description: "Extraction check execution and patch application"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "Referral procedure assertion guard and scope-guard integration"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/ner/scope_guard.py"
        description: "Side-effect counselling suppression and advice-context assertion reclassification"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/nlp/sentence_splitter.py"
        description: "Shared referral procedure phrase detector"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/extraction_check_v1.py"
        description: "Extraction check v2 prompt and example library with relation corrections"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/relation_linking_v1.py"
        description: "Relation linking prompt and example library"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/annotation_guidelines_v1.py"
        description: "Canonical shared annotation guideline block composed into quality-check and relation-linking prompt paths"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/registry.py"
        description: "Prompt composition helper applies annotation_guidelines to extraction_check/coding_check/relation_linking families"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/registry.py"
        description: "Registers relation_linking and extraction_check subgraphs"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/workflow/engine.py"
        description: "Condition edge execution without sequence fallback when graph edges exist"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/persist.py"
        description: "Gates gold-training writes on extraction-check provenance and persists relation-aware candidate metadata"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/training_candidate_queries.py"
        description: "TrainingCandidate upsert and read queries include entities_json payload"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/terminology.py"
        description: "Terminology merge blocklist for unsafe generic term to specific concept mappings"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_prompt_configs.py"
        description: "Seeds extraction_check v2 and relation_linking PromptConfig"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_plan_definitions.py"
        description: "Adds relation_linking and extraction condition-route actions in pd-gp-encounter-coding"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 260
      key_functions:
        - "relation_linking"
        - "extraction_check"
        - "_run_check"
        - "_apply_extraction_check"
        - "_apply_relation_updates"
        - "build_extraction_check_subgraph"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Prevent persistence of non-evidence and template-derived entities"
      - "Recover missed clinically explicit mentions with provenance"
      - "Route extraction changes to HITL queue before autonomous coding"
    risk_control_measures:
      - "Strict JSON output contract"
      - "Constrained correction operations"
      - "Prompt examples for screening/exclusion no-inference behavior"

  verification_status:
    verification_method: "Test"
    verification_complete: false
