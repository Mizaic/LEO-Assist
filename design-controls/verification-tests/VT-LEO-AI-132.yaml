# -- VT-LEO-AI-132 -- Role-first Knowledge primitives
# IEC 62304 Verification Test

- id: "VT-LEO-AI-132"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-136"]
    risks: ["R-LEO-AI-094"]

  metadata:
    title: "IntroCard, StatHero, ProgressiveReveal, KnowledgePageLayout"
    description: >
      Verifies that the four role-first primitives in @leo/design-system
      export correctly, honour prefers-reduced-motion, persist their
      collapse state, expose correct aria attributes, and that their
      default copy grades <= 9 on Flesch-Kincaid.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/design-system-knowledge-primitives.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: true

  test_cases:
    - case_id: "VT-132-TC-001"
      case_name: "All four primitives export from @leo/design-system"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "import { IntroCard, StatHero, ProgressiveReveal, KnowledgePageLayout } from '@leo/design-system'"
          expected_result: "All four are defined functions/components"
          verification_method: "automated"
      acceptance_criteria:
        - "typeof IntroCard === 'function'"
        - "typeof StatHero === 'function'"
        - "typeof ProgressiveReveal === 'function'"
        - "typeof KnowledgePageLayout === 'function'"

    - case_id: "VT-132-TC-002"
      case_name: "IntroCard role prop switches copy block"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Render IntroCard with roleCopy={ clinician: {title:'A'...},
            staff: {title:'B'...} } and role='staff'.
          expected_result: "Visible title is 'B' not 'A'"
          verification_method: "automated"
      acceptance_criteria:
        - "Title text matches staff block"

    - case_id: "VT-132-TC-003"
      case_name: "prefers-reduced-motion sets 0ms transitions"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Mock matchMedia(prefers-reduced-motion: reduce) to match,
            render IntroCard inside MotionProvider, toggle collapse.
          expected_result: >
            No framer-motion transition duration greater than 0 is
            observed; body region swaps without animating.
          verification_method: "automated"
      acceptance_criteria:
        - "Motion profile.duration === 0"

    - case_id: "VT-132-TC-004"
      case_name: "IntroCard collapse persists in localStorage"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Toggle IntroCard to collapsed; unmount; remount"
          expected_result: "Body remains collapsed after remount"
          verification_method: "automated"
      acceptance_criteria:
        - "localStorage['leo-introcard-test'] === 'collapsed'"

    - case_id: "VT-132-TC-005"
      case_name: "IntroCard aria-expanded and aria-controls"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Query the toggle button"
          expected_result: >
            button has aria-expanded matching collapse state and
            aria-controls referencing the body id.
          verification_method: "automated"
      acceptance_criteria:
        - "aria-expanded reflects state"
        - "aria-controls references a real element id"

    - case_id: "VT-132-TC-006"
      case_name: "StatHero renders 1-5 stat tiles with labels and delta"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Render StatHero with 3 stats"
          expected_result: "3 tiles rendered, each with label, value, optional delta"
          verification_method: "automated"
      acceptance_criteria:
        - "Number of tiles matches stats.length"

    - case_id: "VT-132-TC-007"
      case_name: "ProgressiveReveal toggles hidden content"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Render ProgressiveReveal, click Show advanced"
          expected_result: "Children become visible in DOM"
          verification_method: "automated"
      acceptance_criteria:
        - "Children rendered after click"

    - case_id: "VT-132-TC-008"
      case_name: "Default intro copy grade <= 9"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Compute readingAgeGrade() on every default block shipped in the library"
          expected_result: "All grades <= 9"
          verification_method: "automated"
      acceptance_criteria:
        - "max grade <= 9"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-132/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-132-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-3-knowledge-primitives"
      environment: "development"
      result: "pass"
      notes: >
        jest src/__tests__/design-system-knowledge-primitives.test.tsx
        -> 13 passed. Covers exports, role block selection,
        prefers-reduced-motion gate (0ms transitions), localStorage
        persistence under leo-introcard-<screenId>, aria-expanded /
        aria-controls wiring, StatHero tile rendering, ProgressiveReveal
        toggle, and FK grade <= 9 on default intro copy.
