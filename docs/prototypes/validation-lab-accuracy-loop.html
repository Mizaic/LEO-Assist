<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validation Lab - two modes (prototype)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 15px; line-height: 1.5; color: #0f172a; background: #cbd5e1;
    }

    .shell {
      max-width: 960px; margin: 0 auto; min-height: 100vh;
      background: #fff; box-shadow: 0 0 48px rgba(15, 23, 42, 0.12);
      display: flex; flex-direction: column;
    }
    .shell.wide { max-width: 1280px; }

    .top {
      padding: 14px 18px; border-bottom: 1px solid #e2e8f0; background: #f8fafc;
      display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap;
    }
    .top h1 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; }
    .top p { margin: 4px 0 0; font-size: 12px; color: #64748b; }
    .mode-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
      background: #dbeafe; color: #1e40af;
    }
    .mode-pill.clinical { background: #fce7f3; color: #9d174d; }
    .mode-pill.synthetic { background: #dbeafe; color: #1e40af; }
    .mode-pill.production { background: #fef3c7; color: #92400e; }

    .context-strip {
      padding: 10px 18px; background: #eff6ff; border-bottom: 1px solid #bfdbfe;
      font-size: 13px;
    }
    .context-strip.clinical { background: #fdf2f8; border-color: #fbcfe8; }
    .context-strip strong { display: block; font-size: 14px; }
    .context-strip span { color: #475569; font-size: 12px; }

    .stepper-wrap { overflow-x: auto; border-bottom: 1px solid #e2e8f0; }
    .stepper { display: flex; gap: 6px; padding: 8px 14px; min-width: max-content; }
    .step-pill {
      padding: 6px 12px; border-radius: 999px; border: 1px solid #e2e8f0;
      background: #fff; font-size: 11px; font-weight: 600; color: #64748b;
      cursor: pointer; white-space: nowrap;
    }
    .step-pill.active { background: #1e40af; color: #fff; border-color: #1e40af; }
    .step-pill.done { background: #f0fdf4; color: #166534; border-color: #86efac; }
    .step-pill.skipped { opacity: 0.4; text-decoration: line-through; cursor: default; }

    .main { flex: 1; padding: 18px; padding-bottom: 80px; }
    .main.review-layout { padding: 0; display: flex; flex-direction: column; min-height: 560px; }

    h2 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    .lead { margin: 0 0 16px; color: #475569; font-size: 14px; }

    .mode-grid { display: grid; gap: 14px; }
    @media (min-width: 640px) { .mode-grid { grid-template-columns: 1fr 1fr; } }

    .mode-card {
      padding: 20px; border: 2px solid #e2e8f0; border-radius: 14px;
      cursor: pointer; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .mode-card:hover { border-color: #93c5fd; box-shadow: 0 4px 16px rgba(30, 64, 175, 0.08); }
    .mode-card h3 { margin: 0 0 6px; font-size: 17px; }
    .mode-card p { margin: 0 0 12px; font-size: 13px; color: #64748b; }
    .mode-card ul { margin: 0; padding-left: 18px; font-size: 12px; color: #475569; }
    .mode-card li { margin-bottom: 4px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .btn {
      padding: 10px 16px; border-radius: 10px; border: 1px solid #cbd5e1;
      background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; color: #334155;
    }
    .btn:hover { background: #f1f5f9; }
    .btn-primary { background: #1e40af; color: #fff; border-color: #1e40af; }
    .btn-success { background: #047857; color: #fff; border-color: #047857; }
    .btn-ghost { border: none; background: none; color: #64748b; }

    .card {
      border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    }
    .card-head {
      padding: 10px 14px; background: #f8fafc; font-size: 13px; font-weight: 700;
      border-bottom: 1px solid #e2e8f0;
    }
    .card-body { padding: 14px; font-size: 14px; }

    .rule-list { list-style: none; margin: 0; padding: 0; }
    .rule-item {
      padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px;
      margin-bottom: 8px; cursor: pointer;
    }
    .rule-item:hover { border-color: #93c5fd; }
    .rule-item.selected { border-color: #1e40af; background: #eff6ff; }
    .rule-item .id { font-size: 11px; font-family: ui-monospace, monospace; color: #64748b; }
    .rule-item .title { font-weight: 600; margin: 4px 0; }
    .rule-item .concepts { font-size: 12px; color: #475569; }

    .patient-list { list-style: none; margin: 0; padding: 0; }
    .patient-item {
      padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 10px;
      margin-bottom: 8px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
    }
    .patient-item:hover { border-color: #f9a8d4; }
    .patient-item.selected { border-color: #be185d; background: #fdf2f8; }
    .patient-item .avatar {
      width: 40px; height: 40px; border-radius: 10px; background: #fce7f3;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #9d174d; flex-shrink: 0;
    }

    .chip { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
    .chip-bad { background: #fee2e2; color: #991b1b; }
    .chip-ok { background: #dcfce7; color: #166534; }
    .chip-warn { background: #fef3c7; color: #92400e; }
    .chip-info { background: #dbeafe; color: #1e40af; }

    .status-hero {
      text-align: center; padding: 18px; border-radius: 12px; margin-bottom: 14px;
    }
    .status-hero.issue { background: #fff7ed; border: 1px solid #fed7aa; }
    .status-hero.ok { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .status-hero.neutral { background: #f8fafc; border: 1px solid #e2e8f0; }

    /* -- Generate episode tabs -- */
    .tab-row { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
    .tab-btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; color: #64748b;
    }
    .tab-btn.active { background: #1e40af; color: #fff; border-color: #1e40af; }

    .toggle-row { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0; }
    .toggle {
      display: flex; align-items: center; gap: 8px; font-size: 13px;
      padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer;
    }
    .toggle.on { border-color: #1e40af; background: #eff6ff; }
    .toggle input { margin: 0; }

    .doc-preview {
      border: 1px solid #e2e8f0; border-radius: 8px; padding: 14px;
      background: #fff; font-size: 13px; white-space: pre-wrap; line-height: 1.55;
      font-family: ui-monospace, monospace;
    }

    /* -- Shared review layout -- */
    .review-toolbar {
      padding: 10px 14px; border-bottom: 1px solid #e2e8f0;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #fff;
    }
    .review-body { flex: 1; display: flex; min-height: 480px; }
    .review-left {
      width: 36%; min-width: 280px; border-right: 1px solid #e2e8f0;
      overflow: auto; padding: 12px; background: #fafafa;
    }
    .review-right { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }

    /* -- Process-mining stage wizard -- */
    .stage-wizard { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .stage-wizard-head {
      padding: 12px 16px; border-bottom: 1px solid #e2e8f0;
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .stage-wizard-head h3 { margin: 0; font-size: 16px; flex: 1; min-width: 180px; }
    .stage-wizard-nav { display: flex; gap: 6px; }
    .stage-wizard-nav .btn { padding: 6px 12px; font-size: 12px; }

    .pipeline-track {
      display: flex; gap: 4px; padding: 10px 16px; border-bottom: 1px solid #e2e8f0;
      overflow-x: auto; background: #f8fafc;
    }
    .pipeline-dot {
      flex: 1; min-width: 72px; padding: 8px 6px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: #fff; font-size: 10px; font-weight: 600; color: #64748b; cursor: pointer;
      text-align: center; line-height: 1.3;
    }
    .pipeline-dot.active { background: #1e40af; color: #fff; border-color: #1e40af; }
    .pipeline-dot.done { background: #f0fdf4; color: #166534; border-color: #86efac; }
    .pipeline-dot.issue { background: #fff7ed; color: #9a3412; border-color: #fdba74; }
    .pipeline-dot .num { display: block; font-size: 9px; opacity: 0.8; margin-bottom: 2px; }

    .stage-wizard-body { flex: 1; overflow: auto; padding: 16px; }

    .flow-stack { display: flex; flex-direction: column; gap: 0; max-width: 720px; }
    .flow-section {
      border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #fff;
    }
    .flow-section-head {
      padding: 8px 12px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.04em; border-bottom: 1px solid #e2e8f0;
    }
    .flow-section.in .flow-section-head { background: #f1f5f9; color: #475569; }
    .flow-section.process .flow-section-head { background: #eff6ff; color: #1e40af; }
    .flow-section.out .flow-section-head { background: #f0fdf4; color: #166534; }
    .flow-section-body { padding: 10px 12px; font-size: 12px; }

    .flow-arrow {
      text-align: center; padding: 6px 0; color: #94a3b8; font-size: 18px; line-height: 1;
    }
    .flow-meta { font-size: 11px; color: #64748b; margin-bottom: 8px; }

    .flow-item {
      display: flex; gap: 8px; align-items: flex-start; padding: 7px 0;
      border-bottom: 1px solid #f1f5f9; font-size: 12px;
    }
    .flow-item:last-child { border-bottom: none; }
    .flow-item.dimmed { opacity: 0.35; }
    .flow-item.dropped { opacity: 0.55; text-decoration: line-through; color: #991b1b; }
    .flow-item.changed { background: #fffbeb; margin: 0 -12px; padding: 7px 12px; }
    .flow-item.error { background: #fef2f2; margin: 0 -12px; padding: 7px 12px; }

    .flow-status {
      flex-shrink: 0; font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; text-transform: uppercase; min-width: 52px; text-align: center;
    }
    .flow-status.pass { background: #f1f5f9; color: #64748b; }
    .flow-status.added { background: #dbeafe; color: #1e40af; }
    .flow-status.changed { background: #fef3c7; color: #92400e; }
    .flow-status.dropped { background: #fee2e2; color: #991b1b; }
    .flow-status.error { background: #fee2e2; color: #991b1b; }

    .flow-item-main { flex: 1; min-width: 0; }
    .flow-item-main .mono { font-family: ui-monospace, monospace; font-size: 11px; color: #047857; }
    .flow-item-main .sub { font-size: 11px; color: #64748b; margin-top: 2px; }

    .process-step { padding: 5px 0; border-bottom: 1px dashed #e2e8f0; font-size: 12px; }
    .process-step:last-child { border-bottom: none; }
    .process-step strong { color: #1e40af; }

    .handoff-bar {
      margin-top: 14px; padding: 10px 14px; border-radius: 8px;
      background: #f8fafc; border: 1px dashed #cbd5e1; font-size: 12px; color: #475569;
    }
    .handoff-bar strong { color: #0f172a; }

    .fix-tool-card {
      border: 2px solid #e2e8f0; border-radius: 12px; padding: 16px;
      margin-bottom: 14px; background: #fff;
    }
    .fix-tool-card.fix-tool-code { border-color: #93c5fd; background: #f8faff; }
    .fix-tool-card.fix-tool-eng { border-color: #fcd34d; background: #fffbeb; }

    .fix-tool-head {
      display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px;
    }
    .fix-tool-icon {
      flex-shrink: 0; font-size: 20px; width: 36px; height: 36px;
      background: #dbeafe; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .fix-tool-icon.fix-tool-icon-warn { background: #fef3c7; }
    .fix-tool-head strong { font-size: 14px; }

    .sf-search-wrap { margin-bottom: 10px; }
    .sf-search-input {
      width: 100%; padding: 9px 12px; border: 2px solid #93c5fd; border-radius: 8px;
      font-size: 14px; font-family: ui-monospace, monospace; color: #1e293b;
      outline: none; box-sizing: border-box;
    }
    .sf-search-input:focus { border-color: #2563eb; }
    .sf-no-result {
      padding: 12px 14px; background: #f8fafc; border: 1px dashed #cbd5e1;
      border-radius: 8px; font-size: 13px; color: #64748b; margin-bottom: 8px;
    }
    .sf-saved-bar {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
      padding: 8px 0; font-size: 12px; color: #64748b;
    }
    .sf-saved-chip {
      background: #dcfce7; color: #166534; padding: 2px 10px; border-radius: 10px;
      font-size: 12px; font-weight: 600; font-family: ui-monospace, monospace;
    }
    .sf-mapping-row.sf-ok { background: #f0fdf4; border: 1px solid #bbf7d0; }

    .sf-mapping-row {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; margin-bottom: 8px; font-size: 13px;
    }
    .sf-mapping-row.sf-wrong { background: #fef2f2; border: 1px solid #fecaca; }
    .sf-mapping-row.sf-proposed { background: #f0fdf4; border: 1px solid #bbf7d0; }
    .sf-mapping-term { font-family: ui-monospace, monospace; font-weight: 600; min-width: 70px; color: #1e293b; }
    .sf-arrow { color: #94a3b8; font-size: 16px; }
    .sf-mapping-code { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .code-badge {
      padding: 2px 8px; border-radius: 6px; font-family: ui-monospace, monospace;
      font-size: 11px; font-weight: 700;
    }
    .code-badge.wrong { background: #fecaca; color: #991b1b; }
    .code-badge.ok { background: #bbf7d0; color: #166534; }
    .sf-badge-wrong {
      padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 700;
      background: #fee2e2; color: #991b1b;
    }
    .sf-badge-ok {
      padding: 2px 7px; border-radius: 10px; font-size: 11px; font-weight: 700;
      background: #dcfce7; color: #166534;
    }

    .fix-tool-actions {
      display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap;
    }
    .fix-applied-bar {
      margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
      font-size: 13px; font-weight: 600;
    }

    .eng-detail {
      background: #fff; border: 1px solid #fde68a; border-radius: 8px;
      padding: 12px 14px; margin-bottom: 12px;
    }
    .eng-file-row { display: flex; align-items: center; gap: 10px; }
    .eng-file-label {
      font-size: 11px; font-weight: 700; color: #92400e;
      text-transform: uppercase; min-width: 90px;
    }
    .eng-file-path {
      font-family: ui-monospace, monospace; font-size: 12px;
      background: #fef9c3; padding: 2px 8px; border-radius: 4px; color: #78350f; flex: 1;
    }

    .scenario-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-top: 2px;
    }
    .scenario-card {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 12px 14px; border: 2px solid #e2e8f0; border-radius: 10px;
      background: #fff; cursor: pointer; transition: border-color 0.15s;
    }
    .scenario-card input[type=radio] { display: none; }
    .scenario-card:hover { border-color: #93c5fd; }
    .scenario-card.selected { border-color: #2563eb; background: #eff6ff; }
    .scenario-card strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .scenario-card p { margin: 0; font-size: 12px; color: #475569; line-height: 1.4; }
    .sc-icon {
      flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%;
      background: #dcfce7; color: #166534; font-size: 16px; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-top: 2px;
    }
    .sc-icon.sc-warn { background: #fff7ed; color: #9a3412; }

    .safety-rail {
      padding: 8px 16px; background: #f0fdf4; border-bottom: 1px solid #bbf7d0;
      font-size: 12px; color: #166534; font-weight: 600; letter-spacing: 0.01em;
    }

    .focus-question {
      padding: 10px 14px; background: #eff6ff; border-radius: 8px;
      border-left: 3px solid #3b82f6; font-size: 13px; color: #1e3a8a;
      margin-bottom: 12px; font-weight: 500;
    }

    .ask-leo-strip {
      margin: 10px 0;
    }
    .ask-leo-btn {
      font-size: 12px; padding: 6px 12px; background: #fff;
      border: 1px solid #a5b4fc; color: #4338ca; border-radius: 8px;
      cursor: pointer; font-weight: 600;
    }
    .ask-leo-btn:hover { background: #eef2ff; }
    .ask-leo-btn.ask-leo-quiet {
      color: #64748b; border-color: #e2e8f0;
    }
    .ask-leo-btn.ask-leo-quiet:hover { color: #4338ca; border-color: #a5b4fc; }
    .ask-leo-response {
      display: flex; gap: 10px; margin-top: 10px; padding: 12px 14px;
      background: #f5f3ff; border: 1px solid #c4b5fd; border-radius: 10px;
      font-size: 13px; line-height: 1.6; color: #1e1b4b;
    }
    .leo-avatar {
      flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%;
      background: #6d28d9; color: #fff; font-size: 11px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
    }
    .leo-text { flex: 1; }

    .issue-callout {
      margin-bottom: 14px; padding: 12px 14px; border-radius: 10px;
      background: #fff7ed; border: 1px solid #fed7aa; font-size: 13px;
    }
    .issue-callout strong { display: block; margin-bottom: 4px; color: #9a3412; }

    .count-strip {
      display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px;
    }
    .count-strip span { color: #64748b; }
    .count-strip .bad { color: #991b1b; font-weight: 700; }
    .count-strip .warn { color: #854d0e; font-weight: 700; }
    .count-strip .ok { color: #166534; font-weight: 700; }

    .chunk-list { list-style: none; margin: 0 0 10px; padding: 0; }
    .chunk-item {
      padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 8px;
      margin-bottom: 6px; cursor: pointer; background: #fff; font-size: 12px;
    }
    .chunk-item:hover { border-color: #93c5fd; }
    .chunk-item.active { border-color: #1e40af; background: #eff6ff; }
    .chunk-item .ord { font-size: 10px; color: #64748b; }
    .chunk-item .codes { font-size: 10px; color: #047857; margin-top: 4px; }

    .doc-block {
      border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px;
      background: #fff; font-size: 13px; white-space: pre-wrap; line-height: 1.5;
      margin-bottom: 10px;
    }
    .doc-block .label { font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
    .doc-block .hl { background: #fef08a; padding: 0 2px; border-radius: 2px; }
    .doc-block .hl-active {
      background: #fb923c; padding: 0 2px; border-radius: 2px;
      box-shadow: 0 0 0 2px #fdba74; font-weight: 600;
    }

    .flow-item.clickable { cursor: pointer; }
    .flow-item.clickable:hover { background: #f8fafc; }
    .flow-item.source-focus { background: #fff7ed; outline: 1px solid #fdba74; }

    .filter-banner {
      padding: 6px 10px; margin-bottom: 8px; border-radius: 8px;
      background: #eff6ff; border: 1px solid #93c5fd; font-size: 11px; color: #1e40af;
    }
    .filter-banner button {
      margin-left: 6px; padding: 2px 8px; font-size: 10px; border-radius: 6px;
      border: 1px solid #93c5fd; background: #fff; cursor: pointer; color: #1e40af;
    }

    .telemetry-strip {
      display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 12px;
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      margin-bottom: 12px; font-size: 12px;
    }
    .telemetry-strip span { color: #64748b; }
    .telemetry-strip strong { color: #0f172a; }

    .io-box {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;
      padding: 10px; margin-bottom: 8px; font-size: 12px;
    }
    .io-box h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; color: #64748b; }

    .entity-row {
      padding: 6px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px;
    }
    .entity-row.dimmed { opacity: 0.35; }
    .entity-row .code { font-family: ui-monospace, monospace; font-size: 11px; color: #047857; }

    .compare-grid { display: grid; gap: 12px; }
    @media (min-width: 640px) { .compare-grid { grid-template-columns: 1fr 1fr; } }

    .checklist { list-style: none; margin: 0; padding: 0; }

    /* -- Left context tabs (source + guideline + outcome in one place) -- */
    .context-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .ctx-tab {
      padding: 6px 10px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: #fff; font-size: 11px; font-weight: 600; cursor: pointer; color: #64748b;
    }
    .ctx-tab.active { background: #1e40af; color: #fff; border-color: #1e40af; }

    .mapping-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px;
      border-radius: 999px; border: 1px solid #bbf7d0; background: #ecfdf5;

    .mapping-pill.flagged { border-color: #f87171; background: #fef2f2; }

    .problem-group { margin-bottom: 12px; }
    .problem-group h4 { margin: 0 0 6px; font-size: 12px; color: #475569; }

  </style>
</head>
<body>

<div class="shell" id="shell">
  <header class="top">
    <div style="flex:1">
      <h1>Validation Lab</h1>

</footer>

<div class="proto-note">

<script>
(function () {

    "Encounter: GP consultation 2026-01-14\n" +

  var STAGE_IDS = ["extract", "post", "coding", "compliance", "completeness", "sbar"];

  var STAGES = [
    {
      id: "extract", name: "Reading the letter",
      plain: "The system reads each section of the referral and picks out clinical facts.",
      question: "Does every important fact appear here? Click any item to see where it came from."
    },
    {
      id: "post", name: "Cleaning the facts",
      plain: "The system applies rules to remove noise and tag each fact with context (e.g. past history vs current problem).",
      question: "Did the cleaning remove anything it should have kept? Count in vs count out."
    },
    {
      id: "coding", name: "Adding medical codes",
      plain: "Each fact is matched to a standard medical code (SNOMED CT) so rules can act on it.",
      question: "Is each fact matched to the right code? Click an item to check the source text."
    },
    {
      id: "compliance", name: "Checking the guideline",
      plain: "The system checks whether the coded facts trigger the guideline rule.",
      question: "Did the right codes arrive here? If a rule did not fire, trace back to which code was wrong or missing."
    },
    {
      id: "completeness", name: "Checking for gaps",
      plain: "The system checks whether the referral is missing information the guideline expects.",
      question: "Are the missing items genuinely absent from the letter, or were they extracted but lost earlier?"
    },
    {
      id: "sbar", name: "Draft assessment",
      plain: "The system writes a draft clinical summary based on everything above.",
      question: "Does the assessment reflect the correct urgency and pathway? If not, the problem is usually in an earlier stage."
    }
  ];

  function askLeoText(stageId) {
    if (stageId === "extract") {
      return "I looked at the referral letter section by section. I picked out 9 clinical facts across 3 sections. " +
        "Each fact is linked back to the section it came from so you can check it. " +
        "If something important is missing here, it may not have been clear enough in the letter for me to spot.";
    }
    if (stageId === "post") {
      if (isPostDropScenario()) {
        return "The cleaning step removed 'weight loss' because a rule called the scope guard decided it looked like " +
          "general lifestyle context rather than a specific symptom. " +
          "This is a silent removal -- the fact was in the letter but never reached the coding step. " +
          "To fix this, the scope guard rule needs to be updated to allow weight loss in a referral narrative.";
      }
      return "The cleaning step checked every fact for context -- past history versus current problem, " +
        "and whether values were meaningful. All 9 facts passed through unchanged. " +
        "COPD was correctly tagged as past history.";
    }
    if (stageId === "coding") {
      if (isCodingErrorScenario()) {
        return "I matched each fact to a standard medical code. Most matched well, " +
          "but 'suspicious left upper lobe opacity' was matched to pneumonia (an infection) " +
          "rather than an imaging finding. This is because the phrase 'opacity' can mean either. " +
          "The guideline rule is looking for an imaging finding code, so it did not fire. " +
          "Flagging this will let you update the matching rules.";
      }
      return "I matched each fact to a standard medical code. All matched correctly here. " +
        "If a rule did not fire, the problem is likely in the cleaning step -- " +
        "a fact was removed before it reached me.";
    }
    if (stageId === "compliance") {
      return "I checked whether the coded facts triggered the guideline rule NG12-1.3. " +
        "This rule needs: cough present, weight loss present, and a suspicious imaging finding. " +
        (state.fixed
          ? "All three were present -- the rule fired and the urgent pathway was triggered."
          : "The rule did not fire. A required code was either wrong or missing. " +
            "Look back at the coding or cleaning steps.");
    }
    if (stageId === "completeness") {
      return "I checked whether the referral contained everything the guideline expects. " +
        "Two items were not found: smoking history in pack-years, and performance status. " +
        "These may have been in the letter but not clearly stated, or genuinely missing.";
    }
    if (stageId === "sbar") {
      return "I wrote a draft summary based on everything above. " +
        (state.fixed
          ? "The summary correctly includes the urgent 2-week referral recommendation."
          : "The summary does not mention the urgent referral because the guideline rule did not fire. " +
            "Fix the rule issue first, then the summary will update automatically.");
    }
    return "I do not have specific guidance for this stage yet.";
  }

  function isHappyPath() {
    return state.failureScenario === "happy";
  }

  function isPostDropScenario() {
    return state.mode === "rule" && state.failureScenario === "post_drop" && !state.fixed && !isHappyPath();
  }

  function isCodingErrorScenario() {
    return state.mode === "rule" && state.failureScenario === "coding_error" && !state.fixed && !isHappyPath();
  }

  function isWeightLoss(label) {
    return label === "weight loss";
  }

  function opacityCode() {
    if (state.fixed || isPostDropScenario()) return "168731009";
    return "233604007";
  }

  function opacityTerm() {
    if (state.fixed || isPostDropScenario()) return "Chest X-ray abnormal";
    return "Pneumonia";
  }

  function buildEntityItems(withCodes) {
    var items = [];
    CHUNKS.forEach(function (ch) {
      (ch.entities || []).forEach(function (e) {
        var isOpacity = e.text.indexOf("opacity") >= 0;
        var code = withCodes ? (isOpacity ? opacityCode() : e.code) : null;
        var term = withCodes ? (isOpacity ? opacityTerm() : e.term) : null;
        var status = "pass";
        var note = "chunk " + ch.ordinal + " -- click to view source";
        if (!withCodes) status = "added";
        if (isOpacity && withCodes && isCodingErrorScenario()) {
          status = "error";
          note = "Wrong SNOMED -- click to view source in chunk " + ch.ordinal;
        }
        if (withCodes && isPostDropScenario() && isWeightLoss(e.text)) {
          return;
        }
        if (state.mode === "clinical" && state.selectedPatient && state.selectedPatient.id === "pat-7103") {
          if (e.text === "COPD" && withCodes) {
            status = "changed";
            note = "Assertion present -- should be history (chunk " + ch.ordinal + ")";
          }
        }
        items.push({
          label: e.text,
          code: code,
          term: term,
          status: status,
          note: note,
          chunk: ch.ordinal,
          chunkId: ch.id,
          highlightTerm: sourceHighlightFor(ch, e.text)
        });
      });
    });
    return items;
  }

  function postOutItems(entities) {
    return entities.map(function (e) {
      var copy = Object.assign({}, e, { status: "pass" });
      if (e.label === "COPD" && state.mode === "clinical" && state.selectedPatient && state.selectedPatient.id === "pat-7103") {
        copy.status = "changed";
        copy.note = "Assertion flipped to present (incorrect)";
      }
      if (isPostDropScenario() && isWeightLoss(e.label)) {
        copy.status = "dropped";
        copy.note = "Scope guard removed -- silent drop (chunk 1). Click to view source.";
      }
      return copy;
    });
  }

  function entitiesAfterPost(entities) {
    return postOutItems(entities).filter(function (e) { return e.status !== "dropped"; });
  }

  function complianceFailReason() {
    if (isPostDropScenario()) {
      return "NG12-1.3 did not fire -- weight loss was removed by the cleaning step and never reached here";
    }
    return "NG12-1.3 did not fire -- the imaging finding code was wrong (pneumonia instead of imaging finding)";
  }

  function fullLetterText() {
    return CHUNKS.map(function (c) { return c.text; }).join("\n\n");
  }

  function allHighlights() {
    var terms = [];
    CHUNKS.forEach(function (c) { terms = terms.concat(c.highlights || []); });
    return terms;
  }

  function sbarPreviewText() {
    if (state.fixed) {
      return "Situation: 68M referred with cough and weight loss.\n\n" +
        "Background: COPD (history), CXR LUL opacity.\n\n" +
        "Assessment: Suspected lung cancer. NG12-1.3 matched.\n\n" +
        "Recommendation: Urgent 2WW respiratory referral.";
    }
    return "Situation: 68M referred with cough and weight loss.\n\n" +
      "Background: COPD, CXR finding.\n\n" +
      "Assessment: Respiratory symptoms under investigation.\n\n" +
      "Recommendation: Routine follow-up suggested.";
  }

  function problemLists() {
    var coded = buildEntityItems(true);
    var conditions = [];
    var findings = [];
    coded.forEach(function (it) {
      var entry = {
        id: it.label,
        text: it.label,
        code: it.code,
        term: it.term,
        chunk: it.chunk,
        chunkId: it.chunkId,
        status: it.status,
        kind: it.label === "COPD" || it.label === "hypertension" ? "condition" : "finding"
      };
      if (entry.kind === "condition") conditions.push(entry);
      else findings.push(entry);
    });
    return { conditions: conditions, findings: findings };
  }

  function flaggedCount() {
    return Object.keys(state.flagged).length;
  }

  function itemKey(it) {
    return (it.id || it.label || "") + "|" + (it.code || "");
  }

  function filterByChunk(items) {
    if (!state.selectedChunk) return items;
    return items.filter(function (it) {
      return !it.chunkId || it.chunkId === state.selectedChunk;

  function renderFlowItems(items, showFlag) {
    return filterByChunk(items).map(function (it) {
      var cls = "flow-item";
      if (it.chunkId) cls += " clickable";
      if (it.chunkId && state.selectedChunk === it.chunkId &&

        cls += " source-focus";

      if (it.status === "dropped") cls += " dropped";
      else if (it.status === "error") cls += " error";
      else if (it.status === "changed") cls += " changed";
      if (state.selectedChunk && it.chunkId && it.chunkId !== state.selectedChunk) cls += " dimmed";
      var codeLine = it.code
        ? "<span class=\"mono\">" + it.code + " " + (it.term || "") + "</span>"

      var canFlag = showFlag && (it.status === "error" || it.status === "changed" || it.status === "dropped");

          (it.highlightTerm || it.label).replace(/"/g, "&quot;") + "\""

      return "<div class=\"" + cls + "\"" + jumpAttrs + " title=\"" +
        (it.chunkId ? "Show source in chunk " + it.chunk : "") + "\">" +
        "<span class=\"flow-status " + it.status + "\">" + it.status + "</span>" +
        "<div class=\"flow-item-main\">" + it.label + (codeLine ? " " + codeLine : "") +
        (it.note ? "<div class=\"sub\">" + it.note + "</div>" : "") +
        "</div>" + flagBtn + "</div>";
    }).join("");
  }

  function renderProblemListsPanel() {
    var lists = problemLists();
    function pills(items) {
      return items.map(function (it) {
        var key = itemKey(it);
        var flagged = state.flagged[key];
        return "<span class=\"mapping-pill" + (flagged ? " flagged" : "") + "\" data-map-chunk=\"" + it.chunkId +

      "<div class=\"problem-group\"><h4>Diagnoses</h4>" + pills(lists.conditions) + "</div>" +

  function countStatuses(items) {

    var stage = STAGES[index];
    var entities = buildEntityItems(false);

    var codeCount = snomedIn.length;

    var flows = {
      extract: {
        issue: null,
        counts: { in: 3, out: 9, dropped: 0, changed: 0, error: 0 },
        inLabel: "Referral letter (3 sections)",
        inItems: CHUNKS.map(function (ch) {
          return {
            label: "Chunk " + ch.ordinal + ": " + ch.preview.slice(0, 48) + "...",

            chunkId: ch.id,
            highlightTerm: (ch.highlights && ch.highlights[0]) || null
          };
        }),
        process: [
          { text: "AI reads each section and pulls out clinical facts (9.6k words processed, cost $0.03)" },
          { text: "Each section is read separately so the source of every fact is tracked" },
          { text: "9 clinical facts found across 3 sections" }
        ],
        outLabel: "9 facts passed to the cleaning step",
        outItems: entities,
        handoff: "9 facts (each linked to its source section) -> Cleaning"
      },
      post: {
        issue: isPostDropScenario() ? "rule" : null,
        counts: isPostDropScenario()
          ? { in: 9, out: 8, dropped: 1, changed: 0, error: 0 }
          : { in: 9, out: 9, dropped: 0, changed: 0, error: 0 },
        inLabel: "9 facts from the reading step",
        inItems: entities.map(function (e) {
          return Object.assign({}, e, { status: "pass" });
        }),
        process: isPostDropScenario()
          ? [
            { text: "9 facts checked against cleaning rules -- 1 removed" },

  function escapeRegex(text) {
    return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function sourceHighlightFor(ch, label) {
    if (!ch) return label;
    var lower = (label || "").toLowerCase();
    var match = null;
    (ch.highlights || []).forEach(function (h) {
      if (lower.indexOf(h.toLowerCase()) >= 0) match = h;
    });
    if (match) return match;
    (ch.highlights || []).forEach(function (h) {
      if (h.toLowerCase().indexOf(lower) >= 0) match = h;
    });
    return match || label;
  }

  function highlightChunkText(ch) {
    var out = ch.text;
    if (state.sourceHighlight) {
      var activeRe = new RegExp(escapeRegex(state.sourceHighlight), "gi");
      out = out.replace(activeRe, function (m) {
        return "<span class=\"hl-active\">" + m + "</span>";
      });
    }
    (ch.highlights || []).forEach(function (t) {
      if (state.sourceHighlight && t.toLowerCase() === state.sourceHighlight.toLowerCase()) return;
      var re = new RegExp(escapeRegex(t), "gi");
      out = out.replace(re, function (m) {
        return "<span class=\"hl\">" + m + "</span>";
      });
    });
    return out;
  }

  function highlightText(text, terms) {
    var out = text;
    (terms || []).forEach(function (t) {
      var re = new RegExp(escapeRegex(t), "gi");
      out = out.replace(re, function (m) { return "<span class=\"hl\">" + m + "</span>"; });
    });
    return out;
  }

  function bindReviewEvents() {
    document.querySelectorAll("[data-chunk]").forEach(function (el) {
      el.onclick = function () {
        var id = el.getAttribute("data-chunk");
        if (state.selectedChunk === id && !state.sourceHighlight) {
          state.selectedChunk = null;
          state.sourceHighlight = null;
        } else {
          state.selectedChunk = id;
          state.sourceHighlight = null;
        }
        render();
      };
    });
    var clearBtn = document.getElementById("clear-chunk-filter");
    if (clearBtn) {
      clearBtn.onclick = function () {
        state.selectedChunk = null;
        state.sourceHighlight = null;
        render();
      };
    }
    document.querySelectorAll("[data-stage-idx]").forEach(function (btn) {
      btn.onclick = function () {
        state.stageIndex = parseInt(btn.getAttribute("data-stage-idx"), 10);
        render();
      };
    });
    var prev = document.getElementById("stage-prev");
    var next = document.getElementById("stage-next");
    if (prev) {
      prev.onclick = function () {
        if (state.stageIndex > 0) { state.stageIndex--; render(); }
      };
    }
    if (next) {
      next.onclick = function () {
        if (state.stageIndex < STAGES.length - 1) { state.stageIndex++; render(); }
      };
    }
    STAGES.forEach(function (s) {
      var leoBtn = document.getElementById("ask-leo-" + s.id);
      if (leoBtn) {
        leoBtn.onclick = function () {
          state.askLeoOpen = state.askLeoOpen === s.id ? null : s.id;
          render();
        };
      }
    });
    document.querySelectorAll("[data-flag]").forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var key = btn.getAttribute("data-flag");
        if (state.flagged[key]) delete state.flagged[key];
        else state.flagged[key] = true;
        render();
      };
    });
    document.querySelectorAll("[data-source-jump]").forEach(function (row) {
      row.onclick = function (e) {
        if (e.target.closest(".flag-btn")) return;
        focusSource(
          row.getAttribute("data-chunk-id"),
          row.getAttribute("data-source-term")
        );
      };
    });
    document.querySelectorAll("[data-map-chunk]").forEach(function (pill) {
      pill.onclick = function () {
        focusSource(

          pill.getAttribute("data-source-term")

      };

    }

  function renderStepper() {
    var wrap = document.getElementById("stepper-wrap");
    var nav = document.getElementById("stepper");
    if (state.step === "home") {
      wrap.classList.add("hidden");
      return;
    }
    wrap.classList.remove("hidden");
    nav.innerHTML = "";
    var list = steps();
    var idx = list.findIndex(function (s) { return s.id === state.step; });
    var happySkip = isHappyPath() && state.mode === "rule";
    list.forEach(function (s, i) {
      var skipped = happySkip && (s.id === "fix" || s.id === "retest");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "step-pill" +
        (s.id === state.step ? " active" : "") +
        (i < idx ? " done" : "") +
        (skipped ? " skipped" : "");
      btn.textContent = skipped ? s.label + " (skipped)" : (i + 1) + ". " + s.label;
      btn.onclick = function () {
        if (!skipped && (i <= idx || s.id === "review")) { state.step = s.id; render(); }
      };
      nav.appendChild(btn);
    });
  }

    var strip = document.getElementById("context-strip");
    var pill = document.getElementById("mode-pill");
    var homeBtn = document.getElementById("btn-home");
    if (state.step === "home") {
      strip.classList.add("hidden");
      pill.classList.add("hidden");
      homeBtn.classList.add("hidden");
      return;
    }
    strip.classList.remove("hidden");
    pill.classList.remove("hidden");
    homeBtn.classList.remove("hidden");
    strip.classList.toggle("clinical", state.mode === "clinical");
    pill.className = "mode-pill";
    if (state.mode === "rule") {
      pill.classList.add("synthetic");
      pill.textContent = "Testing a rule";
    } else {
      pill.classList.add("clinical", "production");
      pill.textContent = "Investigating a clinical case";

      document.getElementById("ctx-title").textContent = state.selectedRule.id + " - " + state.selectedRule.title;

  function renderFixToolSurfaceForm() {
    var term = state.sfSearch || "opacity";
    var result = sfLookup(term);
    var savedKeys = Object.keys(state.sfSaved);
    var anyUnsaved = result && result.proposed && result.proposed.status !== "ok" && !state.sfSaved[term.toLowerCase().trim()];
    var allApplied = state.fixApplied;

    var mappingRows = "";
    if (result) {
      if (result.current) {
        var curCls = result.current.status === "ok" ? "sf-ok" : "sf-wrong";
        var curBadge = result.current.status === "ok"
          ? "<span class=\"sf-badge-ok\">Correct</span>"
          : "<span class=\"sf-badge-wrong\">Wrong</span>";
        mappingRows +=
          "<div class=\"sf-mapping-row " + curCls + "\">" +
          "<div class=\"sf-mapping-term\">" + term + "</div>" +
          "<div class=\"sf-arrow\">&#8594;</div>" +
          "<div class=\"sf-mapping-code\"><span class=\"code-badge " + (result.current.status === "ok" ? "ok" : "wrong") + "\">" +
          result.current.code + "</span> " + result.current.term + " " + curBadge + "</div>" +
          "</div>";
      }
      if (result.proposed) {
        var saved = state.sfSaved[term.toLowerCase().trim()];
        var propBadge = saved
          ? "<span class=\"sf-badge-ok\">Saved</span>"
          : (result.proposed.status === "new" ? "<span class=\"sf-badge-ok\">New mapping</span>" : "<span class=\"sf-badge-ok\">Proposed fix</span>");
        mappingRows +=
          "<div class=\"sf-mapping-row sf-proposed\">" +
          "<div class=\"sf-mapping-term\">" + term + "</div>" +
          "<div class=\"sf-arrow\">&#8594;</div>" +
          "<div class=\"sf-mapping-code\"><span class=\"code-badge ok\">" +
          result.proposed.code + "</span> " + result.proposed.term + " " + propBadge +
          (!saved
            ? " <button type=\"button\" class=\"btn\" style=\"padding:3px 10px;font-size:11px;margin-left:6px\" data-sf-save=\"" + term.toLowerCase().trim() + "\">Save</button>"
            : "") +
          "</div>" +
          "</div>";
      }
    } else if (term.length > 0) {
      mappingRows =
        "<div class=\"sf-no-result\">" +
        "No mapping found for <strong>" + term + "</strong>. " +
        "<button type=\"button\" class=\"btn\" style=\"padding:3px 10px;font-size:11px;margin-left:4px\" data-sf-create=\"" + term + "\">Create mapping</button>" +
        "</div>";
    }

    var savedBar = savedKeys.length > 0
      ? "<div class=\"sf-saved-bar\">Saved: " +
        savedKeys.map(function (k) { return "<span class=\"sf-saved-chip\">" + k + "</span>"; }).join("") +
        "</div>"
      : "";

    return (
      "<div class=\"fix-tool-card fix-tool-code\">" +
      "<div class=\"fix-tool-head\">" +
      "<div class=\"fix-tool-icon\">&#x1F3F7;</div>" +
      "<div><strong>Fix: update the medical code matching</strong>" +
      "<p style=\"margin:2px 0 0;font-size:12px;color:#475569\">The same tool as Knowledge hub &rsaquo; Medical code matching. Search any term, save fixes, then retest.</p></div>" +
      "</div>" +
      "<div class=\"sf-search-wrap\">" +
      "<input type=\"search\" class=\"sf-search-input\" id=\"sf-search-input\" value=\"" + term.replace(/"/g, "&quot;") + "\" placeholder=\"Search a term...\" autocomplete=\"off\">" +
      "</div>" +
      mappingRows +
      savedBar +
      (savedKeys.length > 0 && !allApplied
        ? "<div class=\"fix-tool-actions\">" +
          "<button type=\"button\" class=\"btn btn-primary\" id=\"btn-apply-fix\">Apply " + savedKeys.length + " saved change" + (savedKeys.length > 1 ? "s" : "") + " and retest</button>" +
          "<span style=\"font-size:12px;color:#64748b\">Tested against the full suite before going live</span>" +
          "</div>"
        : "") +
      (allApplied
        ? "<div class=\"fix-applied-bar\">" +
          "<strong>Surface form updated.</strong> " +
          savedKeys.map(function (k) {
            var r = sfLookup(k);
            var newCode = r && r.proposed ? r.proposed.code : "new";
            var newTerm = r && r.proposed ? r.proposed.term : k;
            return "<span style=\"font-family:ui-monospace,monospace\">" + k + "</span> &rarr; " + newCode + " " + newTerm;
          }).join("; ") +
          ". Click <strong>Retest</strong> above to confirm the guideline now fires correctly." +
          "</div>"
        : "") +
      "</div>"
    );

      "<div style=\"font-size:13px;color:#1e293b;line-height:1.5\">" +
      "<strong>Safety-netting suppression</strong> &mdash; the sentence matched a lifestyle/advice pattern.<br>" +
      "<span style=\"font-family:ui-monospace,monospace;font-size:11px;color:#64748b\">_SAFETY_NETTING_RE (libs/ner/scope_guard.py)</span>" +
      "</div>" +
      "</div>" +

      "<div style=\"margin-top:16px\">" +
      "<p style=\"margin:0 0 6px;font-size:13px;font-weight:600\">In which document section should 'weight loss' be kept?</p>" +
      "<p style=\"margin:0 0 8px;font-size:12px;color:#64748b\">Scope guard rules are section-aware. The suppression will still run everywhere else.</p>" +
      "<select id=\"sg-section-select\" style=\"width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff\">" +
      "<option value=\"\">-- Choose a section --</option>" +
      sectionOptions +
      "</select>" +
      "</div>" +

      "<div style=\"margin-top:12px;padding:10px 14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;font-size:13px;line-height:1.5\">" +
      "<span style=\"font-size:11px;font-weight:600;color:#1d4ed8;text-transform:uppercase;letter-spacing:.04em\">Rule preview</span><br>" +
      rulePreview +
      "</div>" +

      "<div style=\"margin-top:10px;font-size:11px;color:#64748b\">" +
      "Scope guard rules follow the same pattern as context rules: saved to Neo4j, loaded at runtime. No deployment needed." +
      "</div>" +

      (savedBar ? "<div style=\"margin-top:12px\">" + savedBar + "</div>" : "") +

      (!saved && selectedSection
        ? "<div class=\"fix-tool-actions\" style=\"margin-top:14px\">" +
          "<button type=\"button\" class=\"btn btn-primary\" id=\"btn-apply-fix\">Save rule and retest</button>" +
          "<span style=\"font-size:12px;color:#64748b\">This updates Neo4j immediately -- no restart needed</span>" +
          "</div>"
        : "") +

      "</div>"
    );
  }

  function renderRetest() {
    var runA = isPostDropScenario()
      ? "<p><strong>Cleaning:</strong> weight loss removed (9 facts in, 8 out)</p>" +
        "<p><strong>Coding:</strong> 8 codes assigned (looked fine)</p>" +
        "<p><strong>Guideline check:</strong> NG12-1.3 did not fire</p>"
      : "<p><strong>Guideline check:</strong> NG12-1.3 did not fire</p>" +
        "<p><strong>Coding problem:</strong> opacity matched to pneumonia (wrong code)</p>" +
        "<p><strong>Draft assessment:</strong> no urgent pathway mentioned</p>";
    var runB = isPostDropScenario()
      ? "<p><strong>Cleaning:</strong> weight loss kept (9 facts in, 9 out)</p>" +
        "<p><strong>Coding:</strong> 9 codes including weight loss (89362005)</p>" +
        "<p><strong>Guideline check:</strong> NG12-1.3 fired correctly</p>"
      : "<p><strong>Guideline check:</strong> NG12-1.3 fired correctly</p>" +
        "<p><strong>Coding:</strong> opacity matched to imaging finding (correct code)</p>" +
        "<p><strong>Draft assessment:</strong> urgent 2-week referral included</p>";
    document.getElementById("main").innerHTML =
      "<h2>Check whether the fix worked</h2>" +
      "<p class=\"lead\">Same referral letter, same case. Only the rules changed between the two runs. Compare the results.</p>" +
      "<div class=\"compare-grid\">" +
      "<div class=\"compare-col run-a\"><div class=\"head\">Before the fix</div><div class=\"body\">" + runA + "</div></div>" +
      "<div class=\"compare-col run-b\"><div class=\"head\">After the fix</div><div class=\"body\">" + runB + "</div></div></div>" +
      "<div class=\"btn-row\"><button type=\"button\" class=\"btn\" id=\"btn-view-run-b\">Step through the fixed run</button>" +
      "<a href=\"validation-lab-run-review.html?compare=ab\" class=\"btn\">Compare both runs side by side</a></div>";
    document.getElementById("btn-view-run-b").onclick = function () {
      state.fixed = true; state.runLabel = "Run B"; state.step = "review";
      state.stageIndex = state.failureScenario === "post_drop" ? 1 : 3;
      render();
    };
    document.getElementById("btn-forward").textContent = "Save as gold";
  }

  function renderGold() {
    document.getElementById("main").innerHTML =
      "<h2>Save as a gold test case</h2>" +
      "<p class=\"lead\">This saves the case and the correct results. The automated tests will re-run it every time the rules change to make sure it still works.</p>" +
      "<div class=\"gold-box\">" +
      "<p style=\"margin:0 0 10px\"><strong>What gets saved</strong></p>" +
      "<ul class=\"checklist\">" +
      "<li" + (state.savedGold ? " class=\"done\"" : "") + ">Test case linked to rule " + state.selectedRule.id + "</li>" +
      "<li" + (state.savedGold ? " class=\"done\"" : "") + ">The referral letter and sections (no patient identifiers)</li>" +
      "<li" + (state.savedGold ? " class=\"done\"" : "") + ">The correct answers: which rule should fire, which codes are expected, what the draft assessment should say</li>" +
      "<li" + (state.savedGold ? " class=\"done\"" : "") + ">Results from the fixed run -- these become the pass/fail standard</li>" +
      "<li" + (state.savedGold ? " class=\"done\"" : "") + ">Automated testing will re-run this every time rules are updated</li>" +
      "</ul></div>" +
      (state.savedGold ? "<div class=\"status-hero ok\" style=\"margin-top:16px\"><strong>Saved.</strong> This case is now part of the automated test suite. The pipeline will be re-checked against it on every update.</div>" : "");
    document.getElementById("btn-forward").textContent = state.savedGold ? "Done" : "Save gold case";
  }

  function renderPatientPick() {
    document.getElementById("main").innerHTML =
      "<h2>Select patient to review</h2>" +
      "<p class=\"lead\">These are cases where a clinician flagged the AI assessment as wrong. Pick one to see what happened.</p>" +
      "<input type=\"search\" placeholder=\"Search by name or patient ID...\" />" +
      "<ul class=\"patient-list\">" +
      PATIENTS.map(function (p) {
        return "<li class=\"patient-item" + (state.selectedPatient && state.selectedPatient.id === p.id ? " selected" : "") + "\" data-patient=\"" + p.id + "\">" +
          "<div class=\"avatar\">" + p.name.charAt(0) + "</div>" +
          "<div><strong>" + p.name + "</strong> <span style=\"color:#64748b;font-size:12px\">" + p.age + "y " + p.sex + "</span>" +
          " <span class=\"chip chip-bad\">bad review</span>" +
          "<div style=\"font-size:12px;margin-top:4px\">" + p.review + "</div>" +
          "<div style=\"font-size:11px;color:#64748b;margin-top:4px\">Run " + p.runId + " -- " + p.date + "</div></div></li>";
      }).join("") + "</ul>";
    document.querySelectorAll("[data-patient]").forEach(function (el) {
      el.onclick = function () {
        state.selectedPatient = PATIENTS.find(function (p) { return p.id === el.getAttribute("data-patient"); });
        render();
      };
    });
    document.getElementById("btn-forward").disabled = !state.selectedPatient;
  }

  function renderClinicalContext() {
    var p = state.selectedPatient;
    document.getElementById("main").innerHTML =
      "<h2>Understand the issue</h2>" +
      "<p class=\"lead\">Read what the clinician said, then step through the saved pipeline results to find where it went wrong.</p>" +
      "<div class=\"card\"><div class=\"card-head\">What the clinician said</div><div class=\"card-body\">" + p.review + "</div></div>" +
      "<div class=\"card\"><div class=\"card-head\">Where to look</div><div class=\"card-body\">" + p.issue + "</div></div>" +
      (p.ruleMissed
        ? "<div class=\"card\"><div class=\"card-head\">Guideline that may not have fired</div><div class=\"card-body\">" +
          p.ruleMissed + " -- if you want to test this rule on a synthetic case instead:" +
          " <button type=\"button\" class=\"btn\" style=\"padding:4px 10px;font-size:12px;margin-left:8px\" id=\"btn-jump-rule\">Test this rule</button></div></div>"
        : "") +
      "<div class=\"card\" style=\"border-left:3px solid #3b82f6\"><div class=\"card-head\">About this view</div><div class=\"card-body\" style=\"font-size:13px\">" +
      "You are looking at the saved results from run <code>" + p.runId + "</code>. " +
      "Nothing will change in the live system. The pipeline is not re-run -- you are reviewing what already happened.</div></div>";
    document.getElementById("btn-forward").textContent = "Step through the pipeline";
    var jump = document.getElementById("btn-jump-rule");
    if (jump) {
      jump.onclick = function () {
        state.mode = "rule";
        state.step = "pick-rule";
        state.selectedRule = RULES.find(function (r) { return r.id === p.ruleMissed; }) || null;
        render();
      };
    }
  }

  function renderCapture() {
    document.getElementById("main").innerHTML =
      "<h2>Record what you found</h2>" +
      "<p class=\"lead\">Use this real case to make the pipeline stronger. Choose how.</p>" +
      "<div class=\"card\"><div class=\"card-body\" style=\"font-size:14px\">" +
      "<p style=\"margin:0 0 14px\"><strong>Option 1 -- save this case as a test</strong><br>" +
      "The referral is de-identified and saved with the correct expected results. " +
      "The automated tests will re-run it every time the pipeline is updated.</p>" +
      "<p style=\"margin:0\"><strong>Option 2 -- find and fix the underlying rule</strong><br>" +
      "Switch to rule-testing mode for " + (state.selectedPatient.ruleMissed || "the relevant rule") + ". " +
      "Build a synthetic case, find the fault, fix it, and save gold.</p>" +
      "</div></div>" +
      "<div class=\"btn-row\">" +
      "<button type=\"button\" class=\"btn btn-success\" id=\"btn-save-cap\">Save as test case</button>" +
      "<button type=\"button\" class=\"btn\" id=\"btn-to-rule\">Find and fix the rule</button>" +
      "</div>" +
      (state.savedGold ? "<div class=\"status-hero ok\" style=\"margin-top:16px\"><strong>Saved.</strong> This real case is now part of the automated test suite.</div>" : "");
    document.getElementById("btn-save-cap").onclick = function () { state.savedGold = true; render(); };
    document.getElementById("btn-to-rule").onclick = function () {
      state.mode = "rule";
      state.step = "pick-rule";
      if (state.selectedPatient.ruleMissed) {
        state.selectedRule = RULES.find(function (r) { return r.id === state.selectedPatient.ruleMissed; }) || null;
      }
      render();
    };
    document.getElementById("btn-forward").disabled = true;
  }

  function initialReviewStageIndex() {
    if (state.mode === "clinical" && state.selectedPatient) {
      if (state.selectedPatient.id === "pat-7103") return 1;
      if (state.selectedPatient.id === "pat-2291") return 5;
      if (state.selectedPatient.id === "pat-8842") return 3;
    }
    if (isHappyPath()) return 0;
    if (state.fixed) return 3;
    if (state.failureScenario === "post_drop") return 1;
    return 2;
  }

  function goForward() {
    if (state.step === "home") return;
    if (state.mode === "rule") {
      var ri = RULE_STEPS.findIndex(function (s) { return s.id === state.step; });
      if (state.step === "gold") {
        if (!state.savedGold) { state.savedGold = true; render(); return; }
        state.step = "home"; state.mode = null; state.savedGold = false; state.fixed = false;
        state.runLabel = "Run A"; state.selectedChunk = null; render(); return;
      }
      if (state.step === "review" && isHappyPath()) {
        state.step = "gold";
      } else {
        state.step = RULE_STEPS[Math.min(ri + 1, RULE_STEPS.length - 1)].id;
      }
      if (state.step === "review") state.stageIndex = initialReviewStageIndex();
    } else {
      if (state.step === "capture") return;
      var ci = CLINICAL_STEPS.findIndex(function (s) { return s.id === state.step; });
      state.step = CLINICAL_STEPS[Math.min(ci + 1, CLINICAL_STEPS.length - 1)].id;
      if (state.step === "review") state.stageIndex = initialReviewStageIndex();
    }
    render();
  }

  function goBack() {
    if (state.step === "home") return;
    if (state.mode === "rule") {
      var ri = RULE_STEPS.findIndex(function (s) { return s.id === state.step; });
      if (ri <= 0) { state.step = "home"; state.mode = null; }
      else state.step = RULE_STEPS[ri - 1].id;
    } else {
      var ci = CLINICAL_STEPS.findIndex(function (s) { return s.id === state.step; });
      if (ci <= 0) { state.step = "home"; state.mode = null; }
      else state.step = CLINICAL_STEPS[ci - 1].id;
    }
    render();
  }

  function render() {
    renderContext();
    renderStepper();

    if (state.step === "home") { renderHome(); return; }

    document.getElementById("btn-back").disabled = false;
    document.getElementById("btn-forward").disabled = false;

    if (state.mode === "rule") {
      if (state.step === "pick-rule") renderRulePick();
      else if (state.step === "generate") renderGenerate();
      else if (state.step === "run") renderRun();
      else if (state.step === "review") renderReview();
      else if (state.step === "fix") renderFix();
      else if (state.step === "retest") renderRetest();
      else if (state.step === "gold") renderGold();
    } else {
      if (state.step === "pick-patient") renderPatientPick();
      else if (state.step === "context") renderClinicalContext();
      else if (state.step === "review") renderReview();
      else if (state.step === "capture") renderCapture();
    }

    var list = steps();
    var idx = list.findIndex(function (s) { return s.id === state.step; });
    document.getElementById("footer-label").textContent =
      (state.mode === "rule" ? "Rule test" : "Clinical review") + " -- step " + (idx + 1) + " of " + list.length;
  }

  document.getElementById("btn-forward").onclick = goForward;
  document.getElementById("btn-back").onclick = goBack;
  document.getElementById("btn-home").onclick = function () {
    state.step = "home"; state.mode = null; state.fixed = false;
    state.runLabel = "Run A"; state.selectedChunk = null; state.stageIndex = 0; render();
  };

  render();
})();
</script>
</body>
</html>
