# -- UN-LEO-AI-059 -- Intelligence Console
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-059"
  title: "Clinical informaticians and technical admins need a unified Intelligence Console that makes the AI learning loop visible, actionable, and self-guiding from encounter to deployed model"
  description: |
    Admins managing the LEO AI pipeline currently navigate 12+ separate admin
    pages with no logical flow. They cannot quickly see the current health of
    the pipeline, the highest-value action to take, or training progress without
    digging through multiple pages. The console must replace fragmented pages
    with a single view showing the 6-stage learning loop (Discover, Curate,
    Train, Evaluate, Deploy, Monitor), surface one contextual nudge pointing to
    the highest-value action, and provide a persistent training progress banner
    visible across all admin pages. The interface must be usable by clinical
    informaticians who have no software engineering background.

  stakeholder:
    type: "end_user"
    role: "Clinical Informatician / Platform Administrator"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    Fragmented admin navigation causes the learning loop to stall: admins
    do not know when to act, what action to take, or whether training succeeded.
    This delays model improvement and reduces coding accuracy over time.
    A unified, self-guiding console eliminates decision paralysis and ensures
    the model is continuously improved.

  acceptance_criteria:
    - "Console page at /admin/console shows 6 stage pills in a health bar"
    - "Clicking a stage pill expands the stage management panel inline"
    - "A contextual nudge banner shows the single highest-value action for current system state"
    - "When a training job is running, a slim banner appears at the top of every admin page"
    - "The navigation reduces from 16 items to 8: Console, Knowledge, Clinical, Platform, Users, Portal, Support"
    - "All 10 deprecated admin URLs return 301 redirects to their new consolidated location"

  regulatory_impact: "low"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-04-12"
    status: "draft"

  design_inputs: ["DI-LEO-AI-105"]
  validation_tests: []

  tags: ["console", "ux", "admin", "navigation", "learning-loop"]
