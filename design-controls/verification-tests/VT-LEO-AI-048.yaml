# -- VT-LEO-AI-048 -- ODS Nightly Sync Job Verification Protocol
# IEC 62304 Verification Test
# Schema: design-controls/templates/vt_schema.yaml

id: "VT-LEO-AI-048"
title: "ODS Nightly Sync Job — Functional and Safety Verification"
description: >
  Verification protocol for the services/ods_sync/ Azure Container Apps Job
  and supporting libs/ods/client.py shared ODS FHIR client.
  Covers all 8 risk mitigations identified in R-LEO-AI-038 through R-LEO-AI-045.

test_approach: "automated_unit_and_integration"
test_file: "tests/test_ods_sync.py"
framework: "pytest + unittest.mock"
risk_references:
  - "R-LEO-AI-038"
  - "R-LEO-AI-039"
  - "R-LEO-AI-040"
  - "R-LEO-AI-041"
  - "R-LEO-AI-042"
  - "R-LEO-AI-043"
  - "R-LEO-AI-044"
  - "R-LEO-AI-045"

test_cases:

  - id: "TC-001"
    title: "Name mismatch detected and written to Neo4j"
    priority: "critical"
    risk_mitigates: ["R-LEO-AI-043"]
    description: >
      ODS returns a different name than what is stored in LEO.
      The sync service must write ods_sync_status = "mismatch" and
      ods_discrepancy = {name: {ods: <ods_value>, leo: <leo_value>}} to the org node.
    preconditions:
      - "Org node exists with name = 'Springfield Medical Centre'"
      - "ODS returns name = 'Springfield Medical Practice' for same ODS code"
    steps:
      - "Mock httpx.Client to return FHIR JSON with name = 'Springfield Medical Practice'"
      - "Mock Neo4j to return org with name = 'Springfield Medical Centre'"
      - "Run sync_service.process_org()"
      - "Assert UPDATE_ORG_ODS_SYNC called with status='mismatch'"
      - "Assert discrepancy dict contains name: {ods: 'Springfield Medical Practice', leo: 'Springfield Medical Centre'}"
    expected_result: >
      UPDATE_ORG_ODS_SYNC is called exactly once with ods_sync_status="mismatch"
      and ods_discrepancy containing the name field comparison.
    acceptance_criterion: "Pass"

  - id: "TC-002"
    title: "Inactive ODS status flags org as closed and emits closure alert"
    priority: "critical"
    risk_mitigates: ["R-LEO-AI-040"]
    description: >
      ODS returns status = Inactive for an org. The sync service must set
      ods_sync_status = "closed" and call emit_ods_closure_alert() without
      auto-suspending or deleting the org.
    preconditions:
      - "Org node exists and is Active in LEO"
      - "ODS returns active = false (Inactive) for that ODS code"
    steps:
      - "Mock httpx.Client to return FHIR JSON with active = false"
      - "Mock emit_ods_closure_alert"
      - "Run sync_service.process_org()"
      - "Assert UPDATE_ORG_ODS_SYNC called with status='closed'"
      - "Assert emit_ods_closure_alert called once with correct org_id"
      - "Assert DETACH DELETE is NOT called"
      - "Assert org.active is NOT modified in Neo4j"
    expected_result: >
      Closure status is written; alert is emitted; org node is not deleted or suspended.
    acceptance_criterion: "Pass"

  - id: "TC-003"
    title: "ODS 404 flags org as closed (same as Inactive)"
    priority: "critical"
    risk_mitigates: ["R-LEO-AI-038", "R-LEO-AI-040"]
    description: >
      ODS returns HTTP 404 for an ODS code. This is treated identically to
      an Inactive status — ods_sync_status = "closed", closure alert emitted.
    steps:
      - "Mock httpx.Client to return status_code=404"
      - "Mock emit_ods_closure_alert"
      - "Run sync_service.process_org()"
      - "Assert OdsNotFoundError is caught"
      - "Assert UPDATE_ORG_ODS_SYNC called with status='closed'"
      - "Assert emit_ods_closure_alert called"
    expected_result: "404 treated as closure; no exception propagates."
    acceptance_criterion: "Pass"

  - id: "TC-004"
    title: "Org type mismatch flagged as discrepancy — type not auto-corrected"
    priority: "critical"
    risk_mitigates: ["R-LEO-AI-044"]
    description: >
      ODS returns a different org type code (e.g. PCN) than what LEO has (e.g. ICB).
      The sync job must record the discrepancy but must NOT change the org's type,
      labels, or relationships in Neo4j.
    steps:
      - "Mock ODS to return org_type = 'pcn' for an org LEO has as type = 'icb'"
      - "Run sync_service.process_org()"
      - "Assert ods_discrepancy contains type: {ods: 'pcn', leo: 'icb'}"
      - "Assert UPDATE_ORG_ODS_SYNC does not include any label change"
      - "Assert no MERGE/SET on node labels is called"
    expected_result: "Type mismatch recorded; no label or relationship changes made."
    acceptance_criterion: "Pass"

  - id: "TC-005"
    title: "No write on exact ODS match — only ods_sync_last_checked updated"
    priority: "high"
    risk_mitigates: ["R-LEO-AI-043"]
    description: >
      ODS returns data that exactly matches the LEO record (name, status, type).
      The sync must not write ods_sync_status or ods_discrepancy — only the
      timestamp should be updated via BATCH_UPDATE_ODS_CHECKED.
    steps:
      - "Mock ODS to return data matching LEO org exactly"
      - "Run sync_service.process_org()"
      - "Assert UPDATE_ORG_ODS_SYNC is NOT called (no mismatch write)"
      - "Assert org is added to the batch list for BATCH_UPDATE_ODS_CHECKED"
    expected_result: "Only ods_sync_last_checked is updated; no status/discrepancy fields written."
    acceptance_criterion: "Pass"

  - id: "TC-006"
    title: "Circuit breaker aborts sync after 5 consecutive OdsApiError exceptions"
    priority: "critical"
    risk_mitigates: ["R-LEO-AI-038"]
    description: >
      Five consecutive calls to the ODS API raise OdsApiError. The circuit breaker
      must abort the sync, emit an OdsSyncFailed AuditEvent, and leave remaining
      orgs unprocessed.
    steps:
      - "Create a list of 10 orgs"
      - "Mock ODS to raise OdsApiError for orgs 1-5"
      - "Mock emit_ods_sync_summary (audit emitter)"
      - "Run sync_service.run()"
      - "Assert sync aborts after org 5"
      - "Assert orgs 6-10 are NOT processed"
      - "Assert emit_ods_sync_summary called with aborted=True"
    expected_result: "Sync aborts at circuit breaker threshold; remaining orgs skipped; audit event emitted."
    acceptance_criterion: "Pass"

  - id: "TC-007"
    title: "Single per-org OdsApiError does not stop the rest of the sync"
    priority: "high"
    risk_mitigates: ["R-LEO-AI-042"]
    description: >
      One org (org 3 of 10) raises OdsApiError. Processing must continue for
      orgs 4-10. Org 3 gets ods_sync_status = "error".
    steps:
      - "Create list of 10 orgs"
      - "Mock ODS: orgs 1,2 = Active; org 3 = raises OdsApiError; orgs 4-10 = Active"
      - "Run sync_service.run()"
      - "Assert UPDATE_ORG_ODS_SYNC called for org 3 with status='error'"
      - "Assert orgs 4-10 are all processed"
      - "Assert circuit breaker count resets after successful calls"
    expected_result: "Isolated error is handled; processing continues; 9 of 10 orgs processed successfully."
    acceptance_criterion: "Pass"

  - id: "TC-008"
    title: "HTTP 429 triggers exponential backoff and retry — success on second attempt"
    priority: "high"
    risk_mitigates: ["R-LEO-AI-039"]
    description: >
      First ODS call returns 429. After backoff delay, second call succeeds.
      The result must be processed correctly.
    steps:
      - "Mock httpx.Client: first call returns 429, second call returns Active org"
      - "Mock time.sleep to verify delay is applied"
      - "Run sync_service.process_org()"
      - "Assert time.sleep called at least once with delay >= 1 second"
      - "Assert the successful result is processed (ods_sync_last_checked written)"
    expected_result: "Backoff applied; retry succeeds; org processed correctly."
    acceptance_criterion: "Pass"

  - id: "TC-009"
    title: "Organisations without ods_code are skipped entirely"
    priority: "medium"
    risk_mitigates: ["R-LEO-AI-043"]
    description: >
      An org with ods_code = null must never trigger an ODS API call.
    steps:
      - "Include one org with ods_code=None in LIST_ORGS_WITH_ODS_CODE result"
      - "Assert that the Mizaic platform org (no ODS code) is excluded by the query"
      - "Confirm: zero ODS API calls for orgs without ODS codes"
    expected_result: "No ODS API call made for orgs without ods_code."
    acceptance_criterion: "Pass"

  - id: "TC-010"
    title: "Batch summary audit event emitted on sync completion with correct counts"
    priority: "high"
    risk_mitigates: ["R-LEO-AI-038"]
    description: >
      After processing all orgs, emit_ods_sync_summary() must be called with
      accurate counts of checked, mismatches, closures, and errors.
    steps:
      - "Run sync with 10 orgs: 6 no-change, 2 mismatch, 1 closed, 1 error"
      - "Assert emit_ods_sync_summary called once"
      - "Assert summary: checked=10, mismatches=2, closures=1, errors=1"
    expected_result: "Summary audit event contains exact counts matching the run."
    acceptance_criterion: "Pass"

  - id: "TC-011"
    title: "Malformed (non-JSON) ODS response handled gracefully"
    priority: "medium"
    risk_mitigates: ["R-LEO-AI-042"]
    description: >
      ODS returns a non-JSON body (e.g. HTML error page). The ODS client must
      raise OdsApiError; the sync service must catch it and write
      ods_sync_status = "error"; processing must continue.
    steps:
      - "Mock httpx.Client to return status=200 with body='<html>Service Unavailable</html>'"
      - "Assert libs.ods.client raises OdsApiError"
      - "Assert sync service catches OdsApiError"
      - "Assert UPDATE_ORG_ODS_SYNC called with status='error'"
      - "Assert next org is processed"
    expected_result: "Non-JSON response raises OdsApiError; org marked as error; sync continues."
    acceptance_criterion: "Pass"

  - id: "TC-012"
    title: "BATCH_UPDATE_ODS_CHECKED used for no-change orgs in batches of ≤500"
    priority: "medium"
    risk_mitigates: ["R-LEO-AI-045"]
    description: >
      When 100+ orgs have no ODS changes, the sync must use BATCH_UPDATE_ODS_CHECKED
      with batches of ≤500 rows rather than 100+ individual UPDATE_ORG_ODS_SYNC calls.
    steps:
      - "Run sync with 600 no-change orgs"
      - "Assert BATCH_UPDATE_ODS_CHECKED called exactly 2 times (500 + 100)"
      - "Assert UPDATE_ORG_ODS_SYNC called 0 times for no-change orgs"
    expected_result: "Batch Cypher used; no individual writes for no-change orgs; exactly 2 batch calls."
    acceptance_criterion: "Pass"

execution_history:
  - date: "2026-03-06"
    executed_by: "Automated CI — pytest 9.0.2 / Python 3.13.1"
    result: "PASS"
    notes: >
      All 14 test cases passed (TC-009 split into 2 sub-tests).
      tests/test_ods_sync.py — 14 passed in 6.44s.
