# -- VT-LEO-AI-115 -- AppShell and primitive a11y baseline tests
# IEC 62304 Verification Test

- id: "VT-LEO-AI-115"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-120"]
    risks: ["R-LEO-AI-080", "R-LEO-AI-078"]

  metadata:
    title: "AppShell + ConfirmDialog + StatusDot + TermSearch meet the WCAG 2.1 AA baseline and a representative patient-reachable route passes axe-core"
    description: >
      Verifies that AppShell rail exposes aria-current='page' on
      the active item, renders the logo as a button element,
      labels the OrgSelect, that ConfirmDialog carries
      aria-labelledby and aria-describedby, that StatusDot
      encodes status via shape in addition to colour, and that
      @axe-core/playwright returns zero critical/serious
      violations on the AppShell rendered around the home route.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/components/__tests__/AppShell.test.tsx"
      - "services/ui/src/__tests__/confirmdialog-a11y.test.tsx"
      - "services/ui/src/__tests__/statusdot-a11y.test.tsx"
      - "services/ui/e2e/a11y-baseline.spec.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "UI unit test environment configured (jest + jest-axe)"
      - "Playwright auth.setup fixture available"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-115-TC-001"
      case_name: "AppShell rail has exactly one aria-current page"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render AppShell with pathname '/care/audit' in rail mode"
          expected_result: "Exactly one element has aria-current='page' and its accessible name contains 'Clinical Audit'"
      verification_method: "automated"
      acceptance_criteria:
        - "One aria-current='page' match"

    - case_id: "VT-115-TC-002"
      case_name: "AppShell logo is a button with accessible name"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render AppShell rail and query getByRole('button', { name: /leo|home/i })"
          expected_result: "The logo is returned"
      verification_method: "automated"
      acceptance_criteria:
        - "Logo found as role='button'"

    - case_id: "VT-115-TC-003"
      case_name: "OrgSelect has an accessible label"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render AppShell full drawer with mock organisations and query getByRole('combobox', { name: /organisation/i })"
          expected_result: "Select is returned"
      verification_method: "automated"
      acceptance_criteria:
        - "Combobox found with organisation label"

    - case_id: "VT-115-TC-004"
      case_name: "ConfirmDialog exposes aria-labelledby and aria-describedby"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render ConfirmDialog with title='Remove?' body='This will remove the item.'"
          expected_result: "Dialog root has aria-labelledby and aria-describedby both pointing at in-DOM ids"
      verification_method: "automated"
      acceptance_criteria:
        - "Both attributes point to valid element ids"

    - case_id: "VT-115-TC-005"
      case_name: "StatusDot encodes status with shape in addition to colour"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render StatusDot status='error' and StatusDot status='healthy'"
          expected_result: "Each dot has a data-shape attribute; error!==healthy; aria-label includes the status word"
      verification_method: "automated"
      acceptance_criteria:
        - "data-shape differs between statuses; aria-label contains status"

    - case_id: "VT-115-TC-006"
      case_name: "axe-core e2e scan returns zero critical/serious violations on the AppShell shell"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run Playwright e2e/a11y-baseline.spec.ts: navigate to '/care/dashboard', run @axe-core/playwright analyse"
          expected_result: "violations filtered by impact in ('critical','serious') is empty"
      verification_method: "automated"
      acceptance_criteria:
        - "Zero critical or serious violations"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run", "screen_reader_walkthrough_notes"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-115/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-115-EXEC-20260416-JEST"
      executed_at: "2026-04-16"
      executor: "ui-design-system-wave-a"
      environment: "development"
      command: "npx jest src/components/__tests__/AppShell.test.tsx src/__tests__/confirmdialog-a11y.test.tsx src/__tests__/statusdot-a11y.test.tsx --no-coverage"
      result: "partial_pass"
      cases_passed: 5
      cases_failed: 0
      cases_deferred: 1
      notes: >
        TC-001 (aria-current='page'), TC-002 (logo as button via
        Main navigation landmark), TC-003 (OrgSelect combobox),
        TC-004 (ConfirmDialog aria-labelledby/describedby), and
        TC-005 (StatusDot shape encoding) all passed in Jest.
        TC-006 (@axe-core/playwright scan on /care/dashboard) is
        scheduled to run in the CI workflow where a Next.js dev
        server is available. The Playwright spec is implemented at
        services/ui/e2e/a11y-baseline.spec.ts and will be wired
        into ci-build.yml as part of Wave A.10.
