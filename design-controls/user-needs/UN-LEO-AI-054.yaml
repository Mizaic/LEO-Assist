# -- UN-LEO-AI-054 -- Specialist outcome correspondence in cancer audit episodes
# IEC 62304 User Need

- id: "UN-LEO-AI-054"
  title: "Detect specialist letters and infer benign pathway completion when appropriate"
  description: >
    Quality leads auditing cancer investigation pathways need the system to
    recognise when a specialist clinic letter or discharge correspondence has
    arrived back at the practice after a 2WW referral and specialist visit,
    even when full letter text is not stored. When no treatment is coded in the
    following months, the pathway should be able to close as completed with a
    clear human-review flag rather than remaining indefinitely in a stale state.
  stakeholder: "quality_manager"
  priority: "high"
  rationale: >
    Many GP records store document transfers as short filing notes
    ("Dermatology to practice") without codable narrative. The true outcome may
    sit in nearby encounters or never be coded. Without a specialist-outcome
    milestone, episodes incorrectly stay stale_post_specialist and distort
    audit KPIs. Incorrect closure is guarded by HITL review and treatment-window
    checks.
  acceptance_criteria:
    - "document_transfer encounters tagged clinic_letter yield specialist_outcome_letter anchors"
    - "SNOMED record-artifact concepts in the configured subdomain classify into the same milestone bucket"
    - "Open referral-only episodes with specialist_seen, a qualifying letter, no treatment in the post-letter window, and past the post-specialist stale threshold can be written completed with hitl_flag true"
  metadata:
    created_date: "2026-04-07"
    status: "draft"
  design_inputs: ["DI-LEO-AI-087"]
