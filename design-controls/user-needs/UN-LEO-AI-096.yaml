# -- UN-LEO-AI-096 -- One visual language and search experience across encounter surfaces
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-096"
  title: "Reviewers see one consistent encounter row + search experience across /care/encounters, the /care/patients side drawer, and the dry-run candidates queue, so muscle memory transfers between surfaces"

  description: |
    Today, three different surfaces show the reviewer "a list of
    encounters / sentences with a search box on top":

      - /care/encounters (mission-control table) -- bespoke MUI
        Table with columns for date, patient, match, codes, status,
        and text; search bar with no clear button; empty state does
        not echo the query.
      - /care/patients side drawer (Encounter text tab) -- inline
        expandable cards with client-side text search and a slightly
        bolder amber highlight (#fde68a).
      - /admin/training "Candidates" tab (the dry-run review queue)
        -- @leo/design-system ReviewListCard with a coloured tone
        strip on the left, rich chip taxonomy (AI-suggested,
        entity, "needs a code", rare-label), progressive-disclosure
        kebab, and a debounced server-side search box that echoes
        the query in the empty state.

    The three surfaces look and behave differently enough that
    reviewers have to relearn each one. The dry-run surface is the
    cleanest visual template -- tone strip + chip taxonomy + clear
    empty state -- and reviewers told us they wanted that look on
    /care/encounters too. The patient drawer's amber highlight
    token is the most readable; we want one shared
    <HighlightedText> primitive used by all three surfaces so the
    visual treatment for "why this matched" is identical
    everywhere.

  stakeholder: "Clinical reviewers, training data curators, QA / RA lead"

  priority: "SHOULD"

  rationale: >
    Reviewers spend most of their day moving between these three
    surfaces. Every cosmetic difference (different row layout,
    different highlight colour, different empty-state copy,
    no-clear-button vs has-clear-button search) costs a little
    cognitive load and makes the product feel less trustworthy.
    Converging on the dry-run row template + the patient-drawer
    amber highlight token gives us one mental model and one set of
    components to maintain.

  acceptance_criteria:
    - "/care/encounters renders search results using the @leo/design-system ReviewListCard primitive (the same primitive as /admin/training Candidates), with a tone strip that maps to coding status (positive when codes >= 1, warning when matched but no codes, danger when batch run failed, neutral otherwise)"
    - "/care/encounters search box has a clear (X) end-adornment that resets the query when present, mirroring the dry-run search box"
    - "/care/encounters empty state echoes the query (e.g. 'Nothing matches \"chest pain\". Try different words.') when the reviewer has searched, mirroring the dry-run copy"
    - "Match-type, coded count, and match_rationale terms are surfaced as chips in the row's `chips:` slot (not in a separate column), mirroring the dry-run chip taxonomy"
    - "A single shared <HighlightedText> primitive (with collectHighlightTerms helper) is consumed by EncounterPreviewDialog, EncounterCard (drawer), and the new encounter row title -- all three surfaces use the same amber token (#fde68a) and the same minimum-token-length / longest-first matching rules"
    - "No regression in selection (checkbox), pagination, batch actions, or live-threshold drift indicator on /care/encounters"
    - "/care/encounters renders a sticky histogram + brush timeline above the result list (the same EncounterTimelineScrubber primitive as the /care/patients drawer), so reviewers can see the temporal distribution of search hits and brush a date window to filter the table; clicking a histogram bar opens the preview dialog for that encounter"
    - "The /care/patients drawer's free-text encounter search uses the same deterministic typo correction and synonym vocabulary as the /care/encounters host search (a query for 'lump' also surfaces encounters mentioning 'mass', 'swelling', or 'nodule'); when at least one expanded synonym is found in an encounter, that encounter renders a 'why this matched' chip row using the same outlined chip token and 4-term cap as the host row"
    - "The /admin/training Candidates, Verified gold, and Synthetic gold sub-tabs render their row titles through the shared <HighlightedText> primitive and surface the same outlined 'why this matched' chip row when the reviewer's debounced query expands to terms that hit the sentence text, so the dry-run review queue speaks the same vocabulary as /care/encounters and the /care/patients drawer"
    - "The /admin/training Candidates and Gold-label list endpoints (`GET /api/training/candidates`, `GET /api/training/gold-labels`) expand the reviewer's free-text query into the same typo-corrected, synonym-expanded term list used by the host encounter search and the cypher OR-matches across the term list (e.g. a query for 'lump' returns rows whose text contains 'mass', 'swelling', or 'nodule') so the dry-run review queue actually fetches the same rows the host page would, not just decorates the substring matches"
    - "The 'Apply to similar candidates' batch dialog that opens after a reviewer marks a row as gold renders each row's encounter text using the same shared <HighlightedText> primitive and the same outlined 'why this matched' chip row as the host page and the dry-run review queue, with stable data-testid='similar-candidate-row-*' attributes so end-to-end specs can assert the parity"

  design_inputs:
    - "DI-LEO-AI-514"
    - "DI-LEO-AI-516"
    - "DI-LEO-AI-520"
    - "DI-LEO-AI-523"
    - "DI-LEO-AI-526"
    - "DI-LEO-AI-527"

