# -- DI-LEO-AI-127 -- SafetyNetAlert persistence, Patient edge, and canonical alert_id
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-127"
  type: "Safety"
  derived_from: ["UN-LEO-AI-019"]
  requirement: >
    Per-patient safety-net signals produced by detect_safety_net_signals
    SHALL be persisted as SafetyNetAlert nodes linked to their Patient
    via a HAS_SAFETY_NET_ALERT edge and, when the signal is
    episode-scoped, to the EpisodeOfCare via a FOR_EPISODE edge. Every
    SafetyNetAlert node SHALL carry a stable alert_id property set by
    the caller; all read, update, and acknowledgement queries SHALL
    match alerts by alert_id exclusively. The analytics dashboards
    router SHALL stop referencing a.id and SHALL use a.alert_id
    (aliased in the projection when an external API contract expects
    an "id" field).
  rationale: >
    The safety-net detection subgraph currently returns signals that
    are discarded at the end of the subgraph state, so the /safety-
    netting/alerts dashboard can never return them. The analytics
    router also matches by a.id, but every SafetyNetAlert writer in
    the codebase (audit escalation, cost-cap, migration) uses
    alert_id as the canonical key. A silent key mismatch means all
    acknowledge and action requests succeed with zero rows updated.
    Persisting signals with the expected Patient edge and unifying on
    alert_id closes both gaps.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          persist_safety_net_alerts(patient_id, signals, patient_client)
          MERGEs a SafetyNetAlert node keyed on alert_id, sets the
          standard properties (alert_type, severity, description,
          status, actioned, created_at), and MERGEs a
          (Patient)-[:HAS_SAFETY_NET_ALERT]->(alert) edge.
      - type: "functional"
        spec: >
          When a signal carries an episode_id, a FOR_EPISODE edge is
          MERGEd from the alert to the matching EpisodeOfCare.
      - type: "functional"
        spec: >
          The safety-net subgraph calls persist_safety_net_alerts
          after detect_safety_net_signals so every episode-based run
          writes its signals to the graph.
      - type: "safety"
        spec: >
          Every dashboard query that reads a SafetyNetAlert by id
          matches on {alert_id: $aid} and projects a.alert_id AS id
          for the API contract.
    constraints:
      - type: "performance"
        spec: >
          persist_safety_net_alerts is idempotent -- running the same
          signal set twice must not create duplicate nodes or edges.
    dependencies: []
    downstream_impacts:
      - "services/analysis_worker/app/analyzers/safety_net_persistence.py"
      - "libs/pipeline_graph/subgraphs/safety_net.py"
      - "services/analytics_api/app/routers/dashboards.py"
    technical_details:
      language: "Python"
      framework: "FastAPI + Neo4j async driver"
      file_structure:
        - "services/analysis_worker/app/analyzers/safety_net_persistence.py"
        - "libs/pipeline_graph/subgraphs/safety_net.py"
        - "services/analytics_api/app/routers/dashboards.py"
      estimated_loc: 140

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-122 cases pass: persistence creates alert + Patient
      edge + optional FOR_EPISODE edge; repeated persistence is
      idempotent; dashboards router SELECT and MATCH use alert_id;
      acknowledge / action requests affect the intended row.

    test_protocol: "VT-LEO-AI-122"

  safety_class: "B"
  risks: ["R-LEO-AI-087"]
  tags:
    - "safety-netting"
    - "persistence"
    - "alert-id"
