# -- VT-LEO-AI-146 -- AI Instructions list on @leo/design-system
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-146"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-148"]
    risks: ["R-LEO-AI-101"]

  metadata:
    title: "AI Instructions list redesign on @leo/design-system"
    description: >
      Verifies the AI Instructions list page
      (services/ui/src/app/admin/prompts/page.tsx) consumes the
      shared design-system chrome (StatHero, FilterBar,
      SegmentedTabs, ToolbarActions) plus the ReviewListCard body
      primitive; that the legacy bespoke chrome (h4 page title, raw
      TextField search, raw chip-strip filter, custom PromptCard
      grid with CardActionArea) is gone; that all pre-existing
      handlers are still wired (api.get('/api/prompts'),
      router.push to /admin/prompts/:id and /admin/prompts/new,
      sortByIsoDateDesc); that grouped vs filter modes are
      preserved; that exactly one ToolbarAction has variant
      'primary'; that loading / empty / no-match states are
      reachable; that the four canonical stat-tile labels are
      present; and that SegmentedTabs is wired with the
      design-system API (tabs / value / onChange / aria-label),
      not the legacy items / activeId shape.

      The test does a deterministic static-source scan because the
      page hits /api/prompts on mount, which makes a unit-scoped
      live render fragile. A live render is reserved for the Phase
      7 Playwright sweep.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/prompts-list-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node >= 20"
      - "npm install run in services/ui"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-146-TC-001"
      case_name: "Imports the right design-system primitives"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read prompts/page.tsx as text"
          expected_result: >
            Import block from @leo/design-system contains StatHero,
            FilterBar, SegmentedTabs, ToolbarActions and
            ReviewListCard, plus the type aliases ReviewListItem,
            StatTile and ToolbarAction.
      verification_method: "automated"
      acceptance_criteria:
        - "All five primitives plus three type aliases imported"

    - case_id: "VT-146-TC-002"
      case_name: "Legacy chrome removed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search prompts/page.tsx source for legacy components"
          expected_result: >
            No <Typography variant="h4">; no PromptCard function;
            no <CardActionArea>; no <TextField>.
      verification_method: "automated"
      acceptance_criteria:
        - "Legacy chrome is fully replaced"

    - case_id: "VT-146-TC-003"
      case_name: "Pre-existing data + routing handlers preserved"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search prompts/page.tsx source for handler calls"
          expected_result: >
            api.get<{ prompts: PromptConfig[] }>('/api/prompts');
            router.push to /admin/prompts/:id and /admin/prompts/new;
            sortByIsoDateDesc still wired.
      verification_method: "automated"
      acceptance_criteria:
        - "All legacy handlers preserved"

    - case_id: "VT-146-TC-004"
      case_name: "Grouped browse + flat filter modes preserved"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search prompts/page.tsx for prompts-grouped testid and isFiltering branch"
          expected_result: >
            data-testid='prompts-grouped' present; isFiltering
            ternary still drives mode switch.
      verification_method: "automated"
      acceptance_criteria:
        - "Both modes preserved"

    - case_id: "VT-146-TC-005"
      case_name: "Single primary ToolbarAction (New instructions)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search prompts/page.tsx for ToolbarAction ids and variants"
          expected_result: >
            id 'new-instructions' present; variant 'primary' appears
            exactly once.
      verification_method: "automated"
      acceptance_criteria:
        - "Exactly one primary action wires to /admin/prompts/new"

    - case_id: "VT-146-TC-006"
      case_name: "Loading + empty + no-match states reachable"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search prompts/page.tsx for state markers"
          expected_result: >
            <SkeletonList rendered when loading;
            data-testid='prompts-skeleton-list',
            data-testid='prompts-empty', and
            data-testid='prompts-no-match' all present.
      verification_method: "automated"
      acceptance_criteria:
        - "All three async states reachable"

    - case_id: "VT-146-TC-007"
      case_name: "Four canonical stat-tile labels present"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Search for stat-tile labels"
          expected_result: >
            'Instruction sets', 'Categories covered', 'With
            double-check', 'With examples' all present as label
            strings on StatTile entries.
      verification_method: "automated"
      acceptance_criteria:
        - "Catalogue health visible at a glance"

    - case_id: "VT-146-TC-008"
      case_name: "SegmentedTabs wired with the design-system API"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Extract <SegmentedTabs ... /> tag and inspect props"
          expected_result: >
            tabs={...}, value={activeCategory}, aria-label=...
            present; legacy activeId and items props absent.
      verification_method: "automated"
      acceptance_criteria:
        - "API matches DI-148 AC-008"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-146/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-17"
      executed_by: "Wave E Phase 4 automation"
      result: "pass"
      notes: "All 8 test cases pass under jest 30; 0 failures."
