# -- DI-LEO-AI-168 -- Pathway probe surface decomposition + MUI guard (Phase 6b-vi cleanup)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-168"
  type: "Functional"
  derived_from: ["UN-LEO-AI-072"]
  requirement: >
    The pathway editor's edge probe surface SHALL be decomposed so that
    no module exceeds 500 lines of code, the legacy probeStrategies
    monolith SHALL be split into focused per-domain probe modules under
    a probes/ subdirectory, the legacy panel/* tabs that no longer back
    any UI route SHALL be removed, and pathway/** components SHALL be
    guarded by an ESLint rule that warns on direct @mui/* imports so
    the canvas migrates to @leo/design-system primitives over time.
  rationale: >
    Phase 6b-v added probe parity for four backend subgraphs but left
    PortEdge.tsx (1781 LOC) and probeStrategies.tsx (1048 LOC) above
    the 500 LOC hard limit and left four panel/*.tsx files dead in the
    tree. Reviewers cannot safely modify a 1700-LOC component without
    risking unrelated regressions, and dead modules confuse onboarding
    engineers. Splitting the surface into focused modules and adding
    an ESLint guard prevents the file from regrowing under future work.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "PortEdge.tsx is a thin barrel (<=20 LOC) re-exporting the edge component from PortEdge/index.tsx; the implementation lives in PortEdge/{utils,diff,TreeNode,SemanticSection,ProbeInspectorDrawer,ProbeMonitor,ProbeMonitorBanners,ProbeMonitorChanges,ProbeMonitorData,ProbeMonitorValidate,index}.tsx, each <=500 LOC."
      - type: "functional"
        spec: "probeStrategies.tsx is a thin barrel (<=200 LOC) re-exporting strategies from probes/{_shared,extraction,verification,persist,connectors,guidance}.tsx, each <=500 LOC."
      - type: "functional"
        spec: "services/ui/src/components/pathway/panel/{InputsTab,OverviewTab,ReviewTab,TriggerContextPanel}.tsx no longer exist and no remaining file imports them."
      - type: "functional"
        spec: "services/ui/eslint.config.mjs registers a no-restricted-imports rule (severity warn) targeting services/ui/src/components/pathway/** that flags any direct @mui/* import."
      - type: "functional"
        spec: "Importing PortEdge from @/components/pathway/edges/PortEdge continues to resolve to the edge component without consumer changes."
    constraints:
      - type: "safety"
        spec: "Behaviour of the probe surface MUST be byte-equivalent to the pre-decomposition implementation - no UX, accessibility (role=dialog, Escape handler), or telemetry behaviour may regress."
    dependencies:
      - "DI-LEO-AI-156"
      - "DI-LEO-AI-157"
    downstream_impacts:
      - "Pathway editor probe popover and inspector drawer"
      - "ESLint CI feedback loop for pathway/** imports"
      - "Static-source verification VT-LEO-AI-167"
    technical_details:
      language: "TypeScript"
      framework: "Next.js 16, React 19, React Flow"
      file_structure:
        - "services/ui/src/components/pathway/edges/PortEdge.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/utils.ts"
        - "services/ui/src/components/pathway/edges/PortEdge/diff.ts"
        - "services/ui/src/components/pathway/edges/PortEdge/TreeNode.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/SemanticSection.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeInspectorDrawer.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeMonitor.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeMonitorBanners.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeMonitorChanges.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeMonitorData.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/ProbeMonitorValidate.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge/index.tsx"
        - "services/ui/src/components/pathway/edges/probeStrategies.tsx"
        - "services/ui/src/components/pathway/edges/probes/_shared.tsx"
        - "services/ui/src/components/pathway/edges/probes/extraction.tsx"
        - "services/ui/src/components/pathway/edges/probes/verification.tsx"
        - "services/ui/src/components/pathway/edges/probes/persist.tsx"
        - "services/ui/src/components/pathway/edges/probes/connectors.tsx"
        - "services/ui/src/components/pathway/edges/probes/guidance.tsx"
        - "services/ui/eslint.config.mjs"
      estimated_loc: 2200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-167 statically asserts: every PortEdge/* and probes/*
      module is <=500 LOC, the four legacy panel/* files no longer
      exist, the ESLint guard exists, and the four Phase 6b-v subgraphs
      remain wired in PROBE_STRATEGIES. Playwright + axe baseline
      (e2e/pathway-editor.spec.ts) confirms the editor route still
      mounts with zero critical/serious WCAG violations.
    test_protocol: "VT-LEO-AI-167"

  safety_class: "B"
  risks:
    - "R-LEO-AI-167"
  tags:
    - "pathways"
    - "knowledge"
    - "design-system"
    - "code-quality"
    - "phase-6b-vi"
