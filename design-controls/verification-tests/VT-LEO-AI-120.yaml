- id: "VT-LEO-AI-120"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-125"]
    risks: ["R-LEO-AI-085"]

  metadata:
    title: "Episode KPI persistence verification"
    description: >
      Verifies calculate_kpis correctly computes and persists the four
      NCDA interval KPIs on EpisodeOfCare nodes, handles missing
      milestones, is idempotent, and cannot create orphan nodes.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_episode_kpi_persistence.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-120-TC-001"
      case_name: "All four KPIs persisted for complete milestone set"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run calculate_kpis on a patient with all prerequisite milestones"
          expected_result: "Four KPI properties persisted on the EpisodeOfCare"
          verification_method: "automated"
      acceptance_criteria:
        - "days_presentation_to_referral set"
        - "consultations_before_referral set"
        - "days_referral_to_diagnosis set"
        - "days_diagnosis_to_treatment set"

    - case_id: "VT-120-TC-002"
      case_name: "Missing milestones produce no KPI writes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run calculate_kpis on a patient missing the diagnosis milestone"
          expected_result: "No KPI properties written for the missing interval"
          verification_method: "automated"
      acceptance_criteria:
        - "days_referral_to_diagnosis absent"

    - case_id: "VT-120-TC-003"
      case_name: "Idempotency on re-run"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run calculate_kpis twice on same episode set"
          expected_result: "Identical property values"
          verification_method: "automated"

    - case_id: "VT-120-TC-004"
      case_name: "build_episodes invokes calculate_kpis on every path"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call build_episodes end-to-end; assert kpi_calculator patched-spy invoked"
          expected_result: "calculate_kpis called once with the built episode_ids"
          verification_method: "automated"

    - case_id: "VT-120-TC-005"
      case_name: "Unknown episode_id cannot create orphan node"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run calculate_kpis with an episode_id that does not exist"
          expected_result: "No EpisodeOfCare node created"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-120/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-120-EXEC-20260416-001"
      executed_on: "2026-04-16"
      executed_by: "ci-pytest"
      environment: "local-dev"
      result: "pass"
      notes: >
        pytest tests/test_episode_kpi_persistence.py -v ran green.
