      confidence: 1.0

reviewer_expectations:
  required_section_headings:
    - "## Situation"
    - "## Background"
    - "## Assessment"
    - "## Recommendation"
  required_phrases_in_assessment:
    - "R-SARCOMA-001"
    - ["increasing in size", "growing", "enlarging"]
  required_phrases_in_recommendation:
    - ["2WW", "two-week wait", "two week wait"]
    - ["sarcoma", "soft-tissue sarcoma", "soft tissue sarcoma"]
  banned_phrases:
    - "as an AI"
    - "I cannot"
    - "lipoma confirmed"           # not imaged yet
    - "biopsy in primary care"     # contraindicated
    - "stable in size"             # the lump is enlarging
  expected_pathway_hints:
    rtr: "yes"
    stt_contains: "two-week wait"
    stt_evidence_contains: "R-SARCOMA-001"
  expected_action_priority: "2ww"
  reviewer_focus: |
    1. The transcript MUST state that the lump is increasing in
       size -- a static lump of the same dimensions would not
       trigger 2WW under NG12.
    2. The transcript MUST advise against biopsy in primary care.
    3. The 2WW pathway must dominate; "review in 6 weeks" is a
       fail.
