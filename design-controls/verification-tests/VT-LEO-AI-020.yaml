# -- VT-LEO-AI-020 -- Screening Gap and Programme Config Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-020"
  version: "1.0"
  status: "partial"

  traceability:
    design_inputs: ["DI-LEO-AI-026", "DI-LEO-AI-017"]
    risks: ["R-LEO-AI-025"]
    user_needs: ["UN-LEO-AI-018", "UN-LEO-AI-011"]

  metadata:
    title: "Audit Domain and Subdomain Configuration Verification"
    description: >
      Verifies that the analytics domain configuration API (services/analytics_api/app/routers/domains.py)
      correctly manages the AuditDomain → Subdomain (ValueSet) → SNOMED concept hierarchy.
      Note: the original DI described a 'screening eligibility matcher' that selects patients
      against configurable programme rules. This feature is not implemented — patient scoping
      is performed by preset NHS cohort definitions seeded at deployment (libs/domain_config/registry.py).
      TC-001 is therefore converted to inspection of the preset cohort seeding logic. TC-002 and
      TC-003 remain automated and test domain/subdomain CRUD and validation.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "semi-automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_domain_config.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 with project dependencies"
      - "services/analytics_api/app/routers/domains.py importable with mocked KnowledgeGraphClient"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-020-TC-001"
      case_name: "Inspect: NHS preset cohort definitions seeded correctly"
      priority: "critical"
      automation_status: "inspection"
      preconditions:
        - "libs/domain_config/registry.py defines the preset NHS cohort registry"
      test_steps:
        - step_number: 1
          action: "Review libs/domain_config/registry.py — inspect all registered cohorts and their domain mappings"
          expected_result: "Expected NHS cohorts present (e.g. colorectal, lung, breast cancer pathways)"
          verification_method: "Code inspection — list all registered cohort IDs and confirm completeness against the NHS NCDA programme list"
        - step_number: 2
          action: "Confirm preset cohorts map to the correct SNOMED concept sets in libs/domains/ncda_concept_sets.py"
          expected_result: "Each cohort's domain maps to the expected CANCER_TYPE_IDS or FAST_TRACK_REFERRAL_IDS sets"
          verification_method: "Code inspection — record mapping in evidence bundle"
      acceptance_criteria:
        - "All required NHS audit programme cohorts present in the registry"
        - "Each cohort correctly maps to SNOMED concept sets for detection"
      note: >
        A dynamic screening eligibility matcher (run-time patient-level eligibility scoring
        against configurable age/sex criteria) is not implemented. Patient scoping is preset
        at deployment. This TC satisfies the intent of DI-LEO-AI-026 via inspection of the
        static cohort configuration rather than automated test execution.

    - case_id: "VT-020-TC-002"
      case_name: "Audit domain configuration created without code changes via API"
      priority: "critical"
      automation_status: "automated"
      preconditions:
        - "KnowledgeGraphClient mocked via pytest patch"
      test_steps:
        - step_number: 1
          action: "Call create_domain() with a DomainCreateRequest payload"
          expected_result: "Domain created — KG client.run called with CREATE Cypher and domain properties"
          verification_method: "Assert mock KG run called once with correct params (test_creates_domain in test_domain_config.py)"
        - step_number: 2
          action: "Call create_subdomain() with a valid SubdomainCreateRequest under the new domain"
          expected_result: "Subdomain node created in KG with correct milestoneType and semanticTags"
          verification_method: "Assert mock KG run called with subdomain Cypher"
      acceptance_criteria:
        - "Domain and subdomain CRUD operations succeed without code deployment"
        - "KG writes use correct Cypher and parameter binding"

    - case_id: "VT-020-TC-003"
      case_name: "Domain API raises 404 for unknown domain on subdomain operations"
      priority: "high"
      automation_status: "automated"
      preconditions:
        - "KnowledgeGraphClient mocked to return empty result for domain lookup"
      test_steps:
        - step_number: 1
          action: "Call create_subdomain() referencing a domain_id that does not exist in the KG"
          expected_result: "HTTPException raised with status_code 404"
          verification_method: "Assert pytest.raises(HTTPException) with status 404"
        - step_number: 2
          action: "Call list_subdomains() for a non-existent domain_id"
          expected_result: "Empty list returned or 404 depending on API contract"
          verification_method: "Assert result is empty or HTTPException raised"
      acceptance_criteria:
        - "Non-existent domain references return 404 not 500"
        - "No partial write occurs when domain lookup fails"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-020/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-020-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "partial"
      cases_executed: 2
      cases_passed: 2
      cases_failed: 0
      duration_seconds: 1
      notes: "VT remapped from screening eligibility matcher (not implemented) to audit domain CRUD API. TC-001 converted to inspection of preset cohort registry — pending manual review against NHS NCDA programme list. TC-002 and TC-003 covered by tests/test_domain_config.py (automated, passing)."
