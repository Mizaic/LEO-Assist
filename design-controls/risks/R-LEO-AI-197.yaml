# -- R-LEO-AI-197 -- AI first-pass overwrite corrupts curated training labels
# ISO 14971 / IEC 62304 Risk
#
# NOTE on numbering: replaces a now-clobbered R-LEO-AI-191 used briefly
# during development; that ID went to a parallel-shipping feature.

- id: "R-LEO-AI-197"
  title: "AI first-pass overwrites entities_json on a candidate that was actually correct, degrading the labelled-data pool the NER model trains on"

  hazard:
    description: >
      The AI first-pass workflow rewrites the entities_json field on
      every candidate it classifies as 'pre_done', replacing the
      previously stored entity list (which may have been hand-curated
      or seeded with high-confidence rules) with whatever Haiku
      proposed. If the AI silently drops a real entity, mis-labels its
      type, or attaches a wrong assertion that the validator still
      accepts, the candidate looks finished but is in fact a regression
      in the gold pool the NER model retrains on, and the reviewer who
      "confirms" the pre-done candidate may not notice.
    category: "clinical_safety"

  hazardous_situation: >
    A reviewer trusts a pre_done badge and rapidly clicks
    "approve / move to gold" on a long queue of AI-pre-done
    candidates without inspecting each one; the AI dropped a finding
    or mis-asserted a disorder; the resulting GoldLabel ships into
    the next NER training run; the model learns to omit / mis-assert
    that pattern; downstream coding decisions on real patient
    documents miss the same entity in production.

  harm:
    description: >
      Degraded NER recall or a systematic mis-assertion on disorders
      that were silently rewritten, leading to missed coding
      opportunities (omitted SNOMED codes), mis-coded encounters
      (wrong assertion), and ultimately a missed clinical signal
      visible to a clinician reviewing pathway data.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Write-once entities_json_original audit copy:
        UPSERT_AI_FIRST_PASS_ENTITIES sets entities_json_original
        from entities_json ONLY when entities_json_original is
        currently NULL, so the human-curated baseline is preserved
        across any number of AI passes and can be inspected or
        restored.
      implemented_by: ["DI-LEO-AI-208"]
      verified_by: ["VT-LEO-AI-200"]
      effectiveness: "effective"

    - control_type: "design_feature"
      description: >
        Reviewer UI marks every AI-suggested entity with an
        "AI suggested" chip (data-testid 'ai-suggested-chip') and
        offers a "show original" toggle that flips the dialog between
        entities_json and entities_json_original, so the curator can
        always see what the AI changed before approving the
        candidate.
      implemented_by: ["DI-LEO-AI-209"]
      verified_by: ["VT-LEO-AI-201"]
      effectiveness: "effective"

    - control_type: "procedural_control"
      description: >
        Safety rails in classify_candidate force 'review' (no
        writeback) for any candidate where any entity carries an
        _AUTO_CODE_BLOCKED assertion (absent / refuted / declined /
        cancelled / planned / hypothetical / possible / historical /
        family) or whose source startswith 'manual_gold_seed', so
        sensitive seeded or assertion-laden cases are never
        overwritten by the AI.
      implemented_by: ["DI-LEO-AI-208"]
      verified_by: ["VT-LEO-AI-200"]
      effectiveness: "effective"

    - control_type: "design_feature"
      description: >
        status='completed' candidates are excluded at fetch time AND
        TOCTOU-rechecked immediately before any write or delete, so a
        gold candidate marked completed mid-run is never modified.
      implemented_by: ["DI-LEO-AI-208"]
      verified_by: ["VT-LEO-AI-200"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The write-once audit copy makes any AI rewrite reversible at
      the data layer; the AI-suggested chip plus show-original toggle
      makes the rewrite visible at the UI layer; the assertion and
      source rails keep the most sensitive cases out of the AI loop
      entirely; and the gold-completed defence layers prevent the
      rewrite from ever touching a candidate that has been finalised.
      A reviewer who actually opens a pre_done candidate cannot miss
      that it was AI-touched, and even a fast approval can be undone
      by reading entities_json_original.

  monitoring:
    monitoring_plan: >
      After each backlog run, log the count of pre_done candidates
      whose entities_json now differs from entities_json_original by
      more than half their entity count, and the count of pre_done
      candidates whose AI pass dropped at least one entity present
      in the original. Surface in the post-run summary panel and in
      data/audit/ai_first_pass_<UTC>.summary.json.
    metrics:
      - "pre_done_with_majority_rewrite_count"
      - "pre_done_with_dropped_original_entity_count"
      - "manual_restore_from_entities_json_original_count"
    review_frequency: "Per-run + monthly aggregate"

  metadata:
    identified_by: "Hazard analysis during AI first-pass design (UN-LEO-AI-085)"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "training-data"
      - "ai-assist"
      - "data-integrity"
      - "ner-quality"
