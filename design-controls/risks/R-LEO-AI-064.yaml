# -- R-LEO-AI-064 -- Incorrect Stage Derivation at Diagnosis
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-064"
  title: "Incorrect episode stage assignment from explicit stage or TNM evidence"

  hazard:
    description: >
      Stage-at-diagnosis derivation may map explicit stage text or TNM components
      to the wrong stage group (early vs late) because of unsupported patterns,
      ambiguous evidence, or incorrect site-rule matching.
    category: "clinical_safety"

  hazardous_situation: >
    A confirmed-diagnosis episode is assigned an incorrect stage group by the
    enrichment pass. Audit dashboards then misstate the early-stage diagnosis
    rate, leading quality teams to infer inaccurate pathway performance.

  harm:
    description: >
      Inaccurate quality improvement decisions and delayed corrective actions
      for late diagnosis patterns at programme level.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Enforce deterministic priority cascade (explicit stage over TNM),
        site-specific TNM rule matching via _site_index, and unknown fallback
        when evidence does not match known rules.
      implemented_by: ["DI-LEO-AI-090"]
      verified_by: ["VT-LEO-AI-090"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        Persist staging_source and staging_confidence on EpisodeOfCare so lower
        confidence records are visible for review and targeted validation.
      implemented_by: ["DI-LEO-AI-090"]
      verified_by: ["VT-LEO-AI-090"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Residual risk is acceptable because unsupported or ambiguous evidence
      resolves to unknown rather than forced staging, and source/confidence
      metadata enables focused review of lower-certainty cases.

  monitoring:
    monitoring_plan: >
      Monitor monthly proportion of unknown stage assignments and periodically
      sample derived stages for manual review against source evidence.
    metrics:
      - "Unknown stage rate among confirmed-diagnosis episodes"
      - "Manual review agreement rate for derived stage samples"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review - stage-at-diagnosis engine 2026-04-08"
    identified_date: "2026-04-08"
    status: "analyzed"
    tags:
      - "staging"
      - "tnm"
      - "episode-enrichment"
