# -- VT-LEO-AI-402 -- Cancer-care-review restatement guard verification
#
# NOTE: Created in the 4xx ID range alongside VT-401 (Pattern N1) to escape
# the recurring ID collisions in the 21x range during the parallel
# ICD-10 / OPCS-4 work stream.

- id: "VT-LEO-AI-402"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-402"]
    risks: ["R-LEO-AI-402"]

  metadata:
    title: "Pattern N4 -- cancer-care-review restatement guard"
    description: >
      Verifies that the ``encounter_is_cancer_care_review_restatement``
      and ``encounter_has_new_episode_marker`` helpers in
      ``libs/domains/code_inventories.py`` correctly classify the
      documented cancer-care-review and known-cancer narrative
      shapes, and that the ``_dx_cancer_review_blocked`` gate in
      ``services/analysis_worker/app/analyzers/anchor_detector.py``
      suppresses the ``diagnosis_confirmed`` anchor on the
      canonical patient 4802892365 2025-09-24 phantom while
      preserving genuine fresh diagnoses (including those marked
      with "(New Episode)" / "newly diagnosed" / etc.).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_pattern_n4_cancer_care_review_restatement_guard.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.13"
      - "pytest"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    # ---- helper unit tests: encounter_is_cancer_care_review_restatement ----
    - case_id: "VT-402-TC-001"
      case_name: "test_cancer_care_review_template_marker_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on the canonical 'Cancer care review and general catch up given recent events' template phrase."
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper recognises the EMIS XaKHe / XaKI4 long-name 'cancer care review' template."

    - case_id: "VT-402-TC-002"
      case_name: "test_cancer_review_short_marker_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Annual cancer review completed today.'"
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper recognises the short 'cancer review' phrase variant."

    - case_id: "VT-402-TC-003"
      case_name: "test_known_breast_ca_narrative_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Phone consult. Patient has known breast ca, on tamoxifen.'"
          expected_result: "Returns True (via the N1 known-cancer narrative regex)."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper inherits N1's known-X-cancer narrative coverage for non-template restatements."

    - case_id: "VT-402-TC-004"
      case_name: "test_post_mastectomy_recovery_review_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Post mastectomy recovery review going well, no new symptoms.'"
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper recognises post-treatment recovery-review phrasing."

    - case_id: "VT-402-TC-005"
      case_name: "test_referred_by_me_earlier_this_year_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on the canonical patient 4802892365 narrative ('Referred by me on 2ww earlier this year, confirmed breast cancer.')."
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper recognises the 'referred by me ... confirmed X cancer' restatement shape."

    - case_id: "VT-402-TC-006"
      case_name: "test_pmhx_history_of_cancer_matches"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'PMHx: history of breast carcinoma 2023.'"
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Helper recognises 'PMHx ... history of X carcinoma' shape."

    - case_id: "VT-402-TC-007"
      case_name: "test_history_of_prostate_cancer_matches"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'History of prostate cancer.'"
          expected_result: "Returns True."
          verification_method: "automated"

    - case_id: "VT-402-TC-008"
      case_name: "test_previously_diagnosed_with_colorectal_matches"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Previously diagnosed with colorectal cancer in 2022.'"
          expected_result: "Returns True."
          verification_method: "automated"

    - case_id: "VT-402-TC-009"
      case_name: "test_recovering_from_breast_cancer_matches"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Recovering from breast cancer surgery.'"
          expected_result: "Returns True."
          verification_method: "automated"

    - case_id: "VT-402-TC-010"
      case_name: "test_post_chemotherapy_recovery_matches"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Post chemotherapy recovery review.'"
          expected_result: "Returns True."
          verification_method: "automated"

    # ---- helper inert / negative cases ----
    - case_id: "VT-402-TC-011"
      case_name: "test_empty_text_is_inert"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper with empty string."
          expected_result: "Returns False."
          verification_method: "automated"

    - case_id: "VT-402-TC-012"
      case_name: "test_none_is_inert"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper with None."
          expected_result: "Returns False (no exception)."
          verification_method: "automated"

    - case_id: "VT-402-TC-013"
      case_name: "test_routine_bp_check_is_inert"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'BP 132/85, weight stable, no concerns.'"
          expected_result: "Returns False -- no template phrase, no known-cancer narrative."
          verification_method: "automated"

    - case_id: "VT-402-TC-014"
      case_name: "test_2ww_referral_text_is_inert"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Refer 2ww breast. Lump on left breast. Fast track referral for suspected breast cancer.'"
          expected_result: "Returns False -- 2WW referral encounters MUST NOT be suppressed."
          verification_method: "automated"
      acceptance_criteria:
        - "2WW referral encounters are unaffected by N4."

    - case_id: "VT-402-TC-015"
      case_name: "test_sicknote_alone_is_inert"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'eMED3 (2010) new statement issued, not fit for work.'"
          expected_result: "Returns False -- sick-notes alone are NOT a trigger for N4 (N1 floating-group filter handles them)."
          verification_method: "automated"
      acceptance_criteria:
        - "Sick-note-only encounters are deliberately excluded from N4 to preserve fresh diagnoses recorded inside sick-note encounters."

    # ---- new-episode-marker exception (the safety override) ----
    - case_id: "VT-402-TC-016"
      case_name: "test_new_episode_marker_keeps_guard_inert"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Cancer care review completed. Major: Invasive carcinoma of breast (Ya0ln) (New Episode). Plan: refer to oncology.'"
          expected_result: "Returns False -- '(New Episode)' marker overrides the cancer-care-review template."
          verification_method: "automated"
      acceptance_criteria:
        - "A genuine fresh diagnosis recorded inside a review-template encounter is preserved."

    - case_id: "VT-402-TC-017"
      case_name: "test_newly_diagnosed_keeps_guard_inert"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Annual cancer review. Newly diagnosed prostate cancer found on PSA screening today.'"
          expected_result: "Returns False -- 'newly diagnosed' marker overrides."
          verification_method: "automated"

    - case_id: "VT-402-TC-018"
      case_name: "test_diagnosis_confirmed_today_keeps_guard_inert"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Cancer review. Diagnosis confirmed today: invasive ductal carcinoma per histology report.'"
          expected_result: "Returns False -- 'diagnosis confirmed today' overrides."
          verification_method: "automated"

    # ---- helper unit tests: encounter_has_new_episode_marker ----
    - case_id: "VT-402-TC-019"
      case_name: "test_new_episode_parenthetical_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Major: Carcinoma of breast (X78WM) (New Episode).'"
          expected_result: "Returns True -- the EMIS '(New Episode)' parenthetical is the canonical fresh-diagnosis marker."
          verification_method: "automated"

    - case_id: "VT-402-TC-020"
      case_name: "test_newly_diagnosed_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Newly diagnosed type 2 diabetes; refer to diabetes nurse.'"
          expected_result: "Returns True."
          verification_method: "automated"

    - case_id: "VT-402-TC-021"
      case_name: "test_new_diagnosis_of_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call helper on 'New diagnosis of asthma confirmed by spirometry.'"
          expected_result: "Returns True."
          verification_method: "automated"

    - case_id: "VT-402-TC-022"
      case_name: "test_no_marker_returns_false"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper on 'Routine review, BP stable.'"
          expected_result: "Returns False."
          verification_method: "automated"

    - case_id: "VT-402-TC-023"
      case_name: "test_empty_text_returns_false"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call helper with empty string and None."
          expected_result: "Returns False (no exception)."
          verification_method: "automated"

    # ---- anchor detector integration tests ----
    - case_id: "VT-402-TC-024"
      case_name: "test_canonical_4802892365_2025_09_24_suppressed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build the canonical patient 4802892365 2025-09-24
            cancer-care-review encounter (Problem header with
            Ya0ln + X78WM + XacLJ active-care code; History
            "Cancer care review and general catch up given
            recent events. Referred by me on 2ww earlier this
            year, confirmed breast cancer. Post mastectomy
            recovery review.") and pass it through
            ``_classify_text_encounters``.
          expected_result: >
            Zero ``diagnosis_confirmed`` anchors emitted for the
            encounter (the phantom 2025-09-24 anchor is
            suppressed by ``_dx_cancer_review_blocked``).
          verification_method: "automated"
      acceptance_criteria:
        - "The canonical patient-4802892365 phantom diagnosis_confirmed regression is fixed."

    - case_id: "VT-402-TC-025"
      case_name: "test_pure_cancer_care_review_template_suppressed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Cancer-care-review template encounter with active cancer code and no fresh-diagnosis marker."
          expected_result: "Zero diagnosis_confirmed anchors emitted."
          verification_method: "automated"

    - case_id: "VT-402-TC-026"
      case_name: "test_post_mastectomy_recovery_review_suppressed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Post-mastectomy recovery review encounter."
          expected_result: "Zero diagnosis_confirmed anchors emitted."
          verification_method: "automated"

    - case_id: "VT-402-TC-027"
      case_name: "test_known_breast_ca_narrative_suppressed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Known-breast-ca narrative encounter without template phrase."
          expected_result: "Zero diagnosis_confirmed anchors emitted (helper covers narrative shape via N1 regex)."
          verification_method: "automated"

    # ---- safety: fresh diagnoses are NOT suppressed ----
    - case_id: "VT-402-TC-028"
      case_name: "test_fresh_diagnosis_NOT_suppressed_by_new_episode_marker"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Encounter combines cancer-care-review template
            phrase AND a fresh-diagnosis '(New Episode)'
            problem-list line for invasive carcinoma.
          expected_result: >
            One diagnosis_confirmed anchor is emitted -- the
            '(New Episode)' marker keeps N4 inert and Pattern K
            fires normally.
          verification_method: "automated"
      acceptance_criteria:
        - "Genuine fresh diagnoses recorded inside review-template encounters are preserved."

    - case_id: "VT-402-TC-029"
      case_name: "test_fresh_diagnosis_NOT_suppressed_by_newly_diagnosed_phrase"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Cancer-review encounter with 'newly diagnosed' fresh-diagnosis phrase."
          expected_result: "One diagnosis_confirmed anchor emitted -- N4 inert."
          verification_method: "automated"

    - case_id: "VT-402-TC-030"
      case_name: "test_genuine_first_diagnosis_unaffected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Plain fresh-diagnosis encounter with no review template, no known-cancer narrative."
          expected_result: "Diagnosis_confirmed anchor emitted normally."
          verification_method: "automated"

    - case_id: "VT-402-TC-031"
      case_name: "test_2ww_referral_unaffected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "2WW referral encounter (lump, fast-track suspected cancer)."
          expected_result: "N4 does not fire (no diagnosis_confirmed expected on a 2WW referral encounter; Pattern K does not match either)."
          verification_method: "automated"

    - case_id: "VT-402-TC-032"
      case_name: "test_routine_repeat_prescription_unaffected"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Routine repeat-prescription encounter, no cancer references."
          expected_result: "N4 does not fire; no diagnosis_confirmed anchor (none expected anyway)."
          verification_method: "automated"

    # ---- N4 / N1 interaction ----
    - case_id: "VT-402-TC-033"
      case_name: "test_n4_takes_precedence_over_n1_tagging"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Cancer-care-review encounter that would have been
            tagged by N1 as ``is_narrative_restatement``. Verify
            that with N4 in place the diagnosis_confirmed anchor
            is suppressed entirely (the N1 tag becomes moot for
            that case but the N1 floating-group filter remains
            the safety net for sick-note-only restatements that
            N4 deliberately ignores).
          expected_result: "Zero diagnosis_confirmed anchors emitted."
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-402/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-402-EXEC-2025-04-18-001"
      executed_by: "Pattern N4 implementation session"
      executed_date: "2025-04-18"
      environment: "development"
      result: "pass"
      notes: >
        pytest tests/test_pattern_n4_cancer_care_review_restatement_guard.py
        -v ran with 33/33 cases passing. Subsequent broad regression
        sweep across N-pattern, episode_builder, and patient-pattern
        tests (203 total) all passed after N1 and patient-4802892365
        test updates were made to reflect N4's emission suppression.
        Cohort wipe-and-rebuild after N4 lands reduced total
        EpisodeOfCare count from 248 to 244 (delta -4); patient
        4802892365 still has exactly one episode (1ecfb55618c2a6d2)
        with the phantom 2025-09-24 diagnosis_confirmed milestone
        eliminated.
