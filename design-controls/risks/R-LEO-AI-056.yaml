# -- R-LEO-AI-056 -- Incorrect automated remediation changes clinical coding
# ISO 14971 Risk

- id: "R-LEO-AI-056"
  title: "Automated audit remediation applies an incorrect SNOMED coding change to a patient record"

  hazard:
    description: >
      The remediation script misinterprets an audit finding or the LLM
      verification agrees with an incorrect proposed change, resulting in
      a DOCUMENTS relationship being deleted, added, or updated incorrectly.
    category: "clinical_safety"

  hazardous_situation: >
    A patient encounter record has a SNOMED code incorrectly deleted
    (removing a genuine active diagnosis), incorrectly added (creating a
    false diagnosis), or has its assertion changed incorrectly (e.g.,
    active condition marked as historical). A clinician subsequently views
    the record and makes a decision based on the incorrect coding.

  harm:
    description: >
      Incorrect clinical coding may cause a patient to receive inappropriate
      treatment, miss preventive care, or be incorrectly triaged. In safety-
      critical categories (cancer, mental health, safeguarding), this could
      delay diagnosis or treatment.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Dual LLM gate: the original audit LLM first identifies the issue;
        a second independent Sonnet call verifies the proposed fix. Changes
        are only applied when both agree and Sonnet confidence >= 0.80.
      implemented_by: ["DI-LEO-AI-082"]
      verified_by: ["VT-LEO-AI-082"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Full audit trail: every applied change is logged with before/after
        state, encounter_id, concept_id, action type, Sonnet confidence,
        and timestamp. Disputes (rejected changes) are also logged.
      implemented_by: ["DI-LEO-AI-082"]
      verified_by: ["VT-LEO-AI-082"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Re-audit: the full coding audit is re-run after remediation to
        detect any residual issues or new errors introduced by the fixes.
        Any remaining issues surface in the review queue.
      implemented_by: ["DI-LEO-AI-072"]
      verified_by: ["VT-LEO-AI-072"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        The disputes log is reviewed by the clinical operations lead before
        the re-audit is declared complete. Any pattern of systematic disputes
        triggers a manual review of the remediation logic.
      implemented_by: ["DI-LEO-AI-082"]
      verified_by: ["VT-LEO-AI-082"]
      effectiveness: "pending"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After dual LLM verification and re-audit, the probability of an
      undetected incorrect change is very low. The re-audit will surface
      any systematic error within one weekly cycle. Manual review of the
      disputes log provides an additional check.

  monitoring:
    monitoring_plan: >
      Monitor the ratio of disputes to applied changes after each remediation
      run. A dispute rate > 20% indicates the audit findings may be
      unreliable and should trigger a review of the audit prompts.
      Review the re-audit pct_clean delta to confirm remediation improved
      coding quality.
    metrics:
      - "Dispute rate per remediation run (disputes / total proposed changes)"
      - "Re-audit pct_clean delta (should be positive)"
      - "Count of changes applied per action type (delete, add, update_assertion)"
    review_frequency: "Per remediation run"

  metadata:
    identified_by: "Design review of DI-LEO-AI-082 automated remediation"
    identified_date: "2026-04-04"
    status: "analyzed"
    tags: ["loop1", "remediation", "auto-fix", "clinical-safety"]
