# -- DI-LEO-AI-194 -- AI Summarisation Playground (admin UI)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-194"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-081"
  requirement: >
    The admin Knowledge hub SHALL include an "AI Summarisation" tab
    at /admin/knowledge?tab=ai-summarisation that lets a reviewer
    assemble an SBAR payload (patient id, situation artefacts,
    background sources, optional guideline ids), submit it via the
    existing UI proxy to POST /api/sbar/jobs, and watch each stage
    of the run stream back via Server-Sent Events. The page SHALL
    show a permanent "test only" banner so output is never mistaken
    for production guidance.
  rationale: >
    The playground turns an opaque pipeline into a verifiable surface
    for prompt and rule changes, while keeping reviewers a click
    away from the rest of the admin Knowledge tooling.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          /admin/knowledge?tab=ai-summarisation renders the
          SbarPlayground component with a "Test only" banner, fields
          for patient id, situation artefacts (with the four
          SituationArtifactType options), background sources (with
          the three BackgroundSourceType options), optional guideline
          ids, and a Submit button.
      - type: "functional"
        spec: >
          Submit is disabled until patient_id is non-empty and at
          least one background source has a non-empty id.
      - type: "functional"
        spec: >
          On submit the playground POSTs to /api/sbar/jobs and opens
          an EventSource on /api/sbar/jobs/{run_id}/events; per-stage
          previews appear as sbar_stage_completed events arrive.
      - type: "functional"
        spec: >
          On sbar_completed the page fetches
          /api/sbar/assessments/{assessment_id} and renders the full
          composed Markdown.
      - type: "functional"
        spec: >
          Three Next.js Route Handlers proxy the Core API endpoints
          and stream SSE through with text/event-stream and
          X-Accel-Buffering: no headers.
    constraints:
      - type: "safety"
        spec: >
          The "Test only" banner MUST be rendered above the form on
          first paint and persist while results are visible -- it is
          the primary mitigation for R-LEO-AI-185.
      - type: "safety"
        spec: >
          The page MUST require admin role (gated by the existing
          /admin/* auth path) -- the underlying API endpoints also
          enforce require_admin.
    dependencies:
      - "DI-LEO-AI-188"
      - "DI-LEO-AI-191"
    downstream_impacts:
      - "services/ui/src/app/admin/knowledge/page.tsx (new tab key)"
      - "services/ui/src/lib/knowledgeCopy.ts (new copy block)"
    technical_details:
      language: "TypeScript"
      framework: "Next.js + MUI"
      file_structure:
        - "services/ui/src/app/admin/ai-summarisation/page.tsx"
        - "services/ui/src/app/admin/ai-summarisation/SbarPlayground.tsx"
        - "services/ui/src/hooks/useSbarStream.ts"
        - "services/ui/src/app/api/sbar/jobs/route.ts"
        - "services/ui/src/app/api/sbar/jobs/[runId]/events/route.ts"
        - "services/ui/src/app/api/sbar/assessments/[assessmentId]/route.ts"
        - "services/ui/src/app/admin/knowledge/page.tsx"
        - "services/ui/src/lib/knowledgeCopy.ts"
      estimated_loc: 800

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-188 covers static-source registration, hook contract
      and proxy routes via jest. VT-LEO-AI-188 also covers live
      render, submit-enable behaviour and axe baseline via Playwright.
    test_protocol: "VT-LEO-AI-188"

  safety_class: "B"
  risks:
    - "R-LEO-AI-185"
  tags:
    - "ui"
    - "sbar"
    - "playground"
    - "admin"
