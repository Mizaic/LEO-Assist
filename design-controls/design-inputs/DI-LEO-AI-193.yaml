# -- DI-LEO-AI-193 -- Deterministic Assessment formatter from rule evaluator
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-193"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-080"
  requirement: >
    The SBAR Assessment section SHALL be produced by a deterministic
    formatter that takes the matched_rules array returned by the
    Terminology API `/terminology/guidelines/evaluate` endpoint and
    renders a Markdown narrative without any further LLM
    interpretation. The formatter SHALL also derive the pathway
    hint properties (stt, stt_evidence, alternative_pathway,
    alternative_pathway_evidence, rtr, rtr_evidence) by inspecting
    rule strength and action priority, never by asking an LLM.
  rationale: >
    The Assessment is the section that grounds the SBAR in evidence:
    it must be exactly traceable to the rule outputs. Allowing the
    LLM to paraphrase rule text would erode that traceability and
    let drift creep in. Pathway hints (e.g. "rtr=yes" for a 2WW)
    are the trigger that downstream systems use, so they must be a
    pure function of the rule input.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs.sbar.assessment_formatter.format_assessment returns an
          AssessmentNarrative with markdown, rules, codes and
          pathway_hints fields. Pathway hints are derived from rule
          action priority (2ww/urgent -> rtr=yes) and never from
          an LLM call.
      - type: "functional"
        spec: >
          When matched_rules is empty the narrative explicitly says
          no rules matched, and pathway hints are
          rtr=no/stt=null/alternative_pathway=null.
      - type: "functional"
        spec: >
          Rules in the narrative are sorted by priority
          (2ww > urgent > routine) and each row carries the
          rule_id, guideline_title and recommendation_verbatim from
          the evaluator response.
      - type: "functional"
        spec: >
          libs.sbar.assessment_formatter.evaluate_codes_against_guidelines
          calls the Terminology API endpoint with httpx and returns
          the response unchanged so the formatter has authoritative
          input.
    constraints:
      - type: "safety"
        spec: >
          The Assessment section MUST NOT include any text that did
          not originate from the evaluator response or from a fixed
          template -- this is a Class B safety boundary that prevents
          the LLM from "improving" the rule wording.
    dependencies:
      - "DI-LEO-AI-188"
    downstream_impacts:
      - "Recommendation prompt context (sees assessment_rules verbatim)"
      - "Pathway hint properties on Assessment"
    technical_details:
      language: "Python"
      framework: "httpx"
      file_structure:
        - "libs/sbar/assessment_formatter.py"
      estimated_loc: 350

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-189 covers the empty-match narrative, the 2WW
      pathway hint derivation, the routine-only rtr=no case,
      priority sort order and the snapshot trim/serialisation.
    test_protocol: "VT-LEO-AI-189"

  safety_class: "B"
  risks:
    - "R-LEO-AI-181"
    - "R-LEO-AI-183"
  tags:
    - "sbar"
    - "assessment"
    - "rules-engine"
    - "deterministic"
