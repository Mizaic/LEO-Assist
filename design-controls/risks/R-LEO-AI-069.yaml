# -- R-LEO-AI-069 -- Double-Negation Assertion Inversion on Pre-Negated SNOMED Situations
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-069"
  title: "ConText double-negation inverts assertion on pre-negated SNOMED situation concepts"

  hazard:
    description: >
      ConText assigns assertion=absent to a SNOMED situation concept whose
      preferred term already encodes a negative (e.g. "No suicidal thoughts",
      "No thoughts of deliberate self harm"), inverting the clinical meaning.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician documents a negative mental health risk screen using a Read
    or SNOMED situation code whose preferred term begins with "No" (e.g.
    134420004 "No suicidal thoughts", 401228008 "No thoughts of deliberate
    self harm"). The pipeline extracts the span, ConText detects the
    preceding "No" as a negation cue and sets assertion=absent. The SNOMED
    concept is then resolved. The persisted coded record now carries
    assertion=absent on a concept that already means absent -- semantically
    equivalent to "suicidal thoughts are present". A reviewer reading the
    coded output or a downstream system consuming the coded data may
    interpret this as active suicidal ideation.

  harm:
    description: >
      Coded patient record incorrectly implies active suicidal ideation or
      active self-harm ideation where the clinician documented their absence.
      Could cause a downstream system or reviewer to over-escalate risk, or
      alternatively fail to record the documented negative screen, removing
      evidence of risk assessment from the coded record.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Post-SNOMED double-negation guard compares the resolved preferred
        term against a negative-prefix pattern and restores assertion=present
        when a situation concept PT starts with "No ", "Absence of ", "Not ",
        "Unable to ", or "Never ". Applied in both the runtime terminology
        step and the training-path Layer 7d.
      implemented_by: ["DI-LEO-AI-101"]
      verified_by: ["VT-LEO-AI-101"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        HITL review gate: all coded entities are presented to a human
        reviewer before any coded output is used for clinical decisions.
        Assertion is visible in the review UI, providing a last line of
        defence for any assertion errors that pass automated guards.
      implemented_by: ["DI-LEO-AI-005"]
      verified_by: ["VT-LEO-AI-005"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The deterministic guard eliminates the failure mode for any situation
      concept whose PT matches the negative-prefix pattern, covering the
      known high-severity cases (suicidal thoughts, self-harm). The HITL
      review gate provides an additional catch for any edge cases not covered
      by the pattern. Residual probability is very low because the guard is
      applied before persist and is covered by automated regression tests.

  monitoring:
    monitoring_plan: >
      Monitor the _assertion_guard="double_negated_situation" audit tag in
      production to track how frequently the guard fires. Quarterly review of
      any new SNOMED situation concepts with negative PTs added to the UK
      edition; extend the prefix pattern or a concept allowlist if new
      patterns are identified outside the current regex.
    metrics:
      - "Count of double_negated_situation corrections per month"
      - "Reviewer assertion correction rate for situation entities"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review -- ConText pipeline analysis 2026-04-13"
    identified_date: "2026-04-13"
    status: "analyzed"
    tags: ["assertion", "double-negation", "mental-health", "safety-guard", "situation"]
