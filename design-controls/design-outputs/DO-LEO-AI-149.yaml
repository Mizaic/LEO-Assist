  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Preserve api.put status patch so retire / reactivate / publish remain reachable"
      - "Preserve api.delete + type-the-name confirm gate so destructive deletes stay behind a deliberate barrier"
      - "Preserve api.post template-payload contract so all four starter templates round-trip to the FHIR API correctly"
    risk_control_measures:
      - "Single primary ToolbarAction reduces accidental destructive clicks (R-105 mitigation)"
      - "Delete dialog requires the user to type the pathway name verbatim (R-105 mitigation, kept from the legacy implementation)"
      - "Publish dialog stays behind an explicit confirmation step with optional version notes"

