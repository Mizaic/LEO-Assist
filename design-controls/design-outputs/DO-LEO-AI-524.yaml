        location: "services/analysis_worker/app/episode_engine/agents/audit_relevance_filter.py"
        description: >
          Public entry: run(window, encounters, guard_input, llm)
          -> FocusedSet. Internal helpers: _apply_guards,
          _batch_unguarded, _call_relevance_triage,
          _merge_decisions. Returns FocusedSet plus
          AuditFilterReport for the audit trace.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/episode_engine/audit_relevance_filter_v1.py"
        description: >
          SYSTEM + USER_TEMPLATE + JSON Schema for the
          submit_relevance tool. Plain-English KEEP / DROP
          rules; reading age 9-11.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/chain.py"
        description: >
          _node_audit_relevance_filter wires the new agent
          before _node_milestone_extractor. Records audit
          trace fields on the EoC and writes LLMUsage with
          stage = audit_relevance_filter.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/schemas.py"
        description: >
          New FocusedSet, FocusedEncounter, AuditFilterReport
          Pydantic models; new audit fields on
          EpisodeOfCareTrace.
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 380
      key_functions:
        - "run"
        - "_apply_guards"
        - "_batch_unguarded"
        - "_call_relevance_triage"
        - "_merge_decisions"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "always-keep guards (cancer-coded, anchor, deterministic-hint encounters cannot be dropped)"
      - "fail-open on Haiku error (transient LLM outage never silently drops an encounter)"
      - "no-duplicate, chronological-order invariant on focused set"
    risk_control_measures:
      - "Pure-function guard layer with unit-tested invariants"
      - "Fallback path on Haiku error keeps every encounter in the focused set"
      - "Per-EoC audit trace exposes every dropped encounter with a plain-English reason for clinician review"

  verification_status:
    verification_method: "Test"
    verification_complete: false
