# -- R-LEO-AI-009 -- De-identification Failure
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-009"
  title: "Protected health information not removed from encounter text before processing"

  hazard:
    description: "De-identification step fails to remove patient-identifiable information from clinical text"
    category: "data_corruption"

  hazardous_situation: "Patient names, NHS numbers, or other identifiers remain in encounter text that is displayed to reviewers or stored in logs, exposing PHI beyond authorised access"

  harm:
    description: "Patient confidentiality breach; regulatory violation under UK GDPR"
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 2
    detectability: 2
    rpn: 16
    risk_level: "high"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "De-identification pipeline step strips identifiers before text is displayed or logged"
      implemented_by: ["DI-LEO-AI-023"]
      verified_by: ["VT-LEO-AI-014"]
      effectiveness: "highly_effective"
    - control_type: "inherent_safety"
      description: "Source encounter text never written to Coding graph"
      implemented_by: ["DI-LEO-AI-023"]
      verified_by: ["VT-LEO-AI-014"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "De-identification validation test suite with known PHI patterns"
      implemented_by: ["DI-LEO-AI-023"]
      verified_by: ["VT-LEO-AI-014"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 1
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Multiple layered controls prevent PHI exposure; source text excluded from coding graph and de-identification tested against known patterns"

  monitoring:
    monitoring_plan: "Regular scanning of outputs and logs for PHI patterns"
    metrics: ["De-identification coverage rate", "PHI pattern scan results"]
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["data-governance", "patient-safety", "gdpr", "de-identification"]
