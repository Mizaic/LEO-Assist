# -- UN-LEO-AI-014 -- Audit Trail and Regulatory Compliance
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-014"
  title: "System maintains complete immutable audit trail for all actions and decisions"
  description: |
    Regulatory affairs need a complete, immutable audit trail for all
    pipeline actions, human review decisions, data changes, configuration
    updates, and system events. The audit trail must capture who did what,
    when, and why -- supporting FDA 21 CFR Part 11 electronic records
    requirements and enabling full reconstruction of the decision history
    for any audit finding. Audit records must be tamper-evident and
    retained for at least 7 years.

  stakeholder:
    type: "regulatory"
    role: "Regulatory Affairs Specialist"
    organization: "Medical Device Manufacturer"

  priority: "MUST"

  rationale: |
    IEC 62304 and ISO 13485 require documented evidence of all decisions
    affecting medical device software. The audit trail is the primary
    evidence source for regulatory inspections and post-market
    surveillance. Without immutable audit logging, the system cannot
    demonstrate compliance.

  benefit: "Complete regulatory evidence chain from pipeline execution through human review to final audit data"

  use_case: |
    1. Auditor triggers a pipeline run for a patient cohort.
    2. System logs pipeline start event with actor identity, timestamp,
       and cohort parameters.
    3. Each pipeline stage (shortlisting, coding, analysis) logs its
       execution events and outputs.
    4. Reviewer opens a coding proposal and confirms the AI suggestion.
       System logs the decision with reviewer identity, rationale, and
       the original AI output.
    5. Releaser approves the final batch. System logs the approval event.
    6. Six months later, a regulatory inspector requests the decision
       history for a specific patient finding.
    7. System reconstructs the full chain: pipeline execution, AI output,
       reviewer decision, releaser approval -- all with timestamps and
       actor identities.

  current_solution: "Paper-based sign-off sheets and spreadsheet logs with no tamper protection or structured query capability"

  pain_points:
    - "Paper audit trails are easily lost or damaged"
    - "No structured search across historical decisions"
    - "Impossible to verify whether records have been altered"
    - "Regulatory inspections require weeks of manual evidence gathering"

  acceptance_criteria:
    - "System shall log all pipeline execution events with timestamps and actor identity"
    - "System shall log all human review decisions (confirm, edit, reject) with rationale"
    - "System shall log all configuration changes"
    - "Audit records shall be immutable (append-only)"
    - "System shall retain audit records for minimum 7 years"
    - "Audit trail shall support full reconstruction of decision history"

  success_metrics:
    - metric: "Auditable event capture rate"
      target: "100% of auditable events captured"
      baseline: "Current: estimated 60-70% captured in spreadsheets"
    - metric: "Audit trail gaps"
      target: "Zero gaps in audit trail"
      baseline: "Current: not measured"
    - metric: "Audit record query response time"
      target: "<=5 seconds for any audit record"
      baseline: "Current: manual search, hours to days"

  regulatory_impact: "critical"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "FDA 21 CFR Part 11 electronic records requirements"
    - "ISO 13485:2016 Section 4.2.5 (Control of Records)"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "FDA 21 CFR Part 11"
    - "ISO 14971:2019"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-022"]
  validation_tests: ["VAL-LEO-AI-012"]

  tags: ["audit-trail", "compliance", "regulatory", "cross-cutting", "21-cfr-part-11"]
