# -- DO-LEO-AI-525 -- Episode Engine: Window Partitioner safety net implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-525"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-525"]
    user_needs: ["UN-LEO-AI-097"]
    risks_addressed:
      - "R-LEO-AI-513"
    verification_tests: ["VT-LEO-AI-523"]

  specification:
    title: "Episode Engine Window Partitioner + deterministic milestone merge (safety net)"
    description: |
      Implements DI-LEO-AI-525 as a pure-function partitioner plus
      a deterministic Python merge layer in the Episode Engine
      chain. Mirrors the SBAR Background partition + map +
      deterministic-stitch pattern (DI-LEO-AI-522) but adapted
      for the milestone extractor output schema.

      partition_window() bin-packs the focused encounter set into
      the smallest N <= 8 partitions whose serialised user
      message fits inside the per-part token budget. Oversized
      single encounters are split across consecutive parts with
      part_in_encounter metadata so the LLM treats the halves as
      one source. The chain calls the milestone extractor once
      per partition (sequentially), and merge_milestones_
      deterministic concatenates the per-part
      MilestoneExtractorResults: milestones de-duplicated on
      (type, date, encounter_id) keeping the highest-confidence
      instance, safety_netting unioned, disruptions concatenated
      with the same de-duplication rule, needs_human_review
      any-true across parts, and reasoning concatenated as
      "Part i of N: ..." lines.

      No second LLM call merges the partials -- the merge is
      pure Python so no pathway fact can be dropped or invented
      during merging (R-LEO-AI-513). When bin-packing would
      need more than 8 parts the partitioner refuses with
      too_many_parts = True; the chain creates the EoC with
      needs_human_review = true and audit_filter_overflow = true
      and surfaces the friendly audit_partition_overflow_error,
      with zero LLM invocations on the extractor for that EoC.

      Single-partition runs are byte-for-byte identical to the
      legacy single-call milestone extractor: no per-part
      headings on the prompt, no part-merge prefixes on the
      reasoning, no audit_parts field beyond the value 1 on the
      EoC.

    acceptance_criteria:
      - criterion: "no_focused_encounter_dropped_invariant"
        type: "safety"
        measurement: "Test"
        target: >
          Every input focused encounter_id appears in at least
          one Partition for any N <= 8 split, including when
          one or more encounters are intra-encounter split.
      - criterion: "single_partition_legacy_pass_through"
        type: "safety"
        measurement: "Test"
        target: >
          When the focused set fits one partition the milestone
          extractor is invoked exactly once with no part-merge
          metadata, and the EoC carries audit_parts = 1 with
          no per-part trace prefix on reasoning.
      - criterion: "deterministic_merge_dedup_rule"
        type: "functional"
        measurement: "Test"
        target: >
          Multi-part milestones with the same
          (type, date, encounter_id) merge to the
          highest-confidence single instance with the longest
          evidence_quote; safety_netting unions; disruptions
          de-duplicate on the same key.
      - criterion: "no_reduce_call_invariant"
        type: "safety"
        measurement: "Test"
        target: >
          The LLM invoker is called exactly once per Partition;
          no second call to a "merge" prompt is ever made.
      - criterion: "per_part_failure_containment"
        type: "safety"
        measurement: "Test"
        target: >
          When one MAP call fails the failed part contributes
          an empty milestone list with
          needs_human_review = true and a structured error on
          the audit trace; surviving parts still contribute
          their milestones to the merged result.
      - criterion: "too_many_parts_refusal"
        type: "safety"
        measurement: "Test"
        target: >
          When bin-packing would need more than 8 parts the
          partitioner refuses with too_many_parts = True and
          the chain creates the EoC with needs_human_review =
          true and audit_filter_overflow = true; zero LLM
          invocations on the extractor for that EoC.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/window_partitioner.py"
        description: >
          Public entries: partition_window(focused_set, budget)
          -> (List[Partition], PartitionReport);
          merge_milestones_deterministic(per_part_results) ->
          MilestoneExtractorResult. _SourceSlice carries
          1-based focused-encounter index; Partition carries
          (start, end) record_range used for trace logging.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/chain.py"
        description: >
          _node_milestone_extractor wires partition_window
          before invoking the extractor. When N == 1 it falls
          through to the legacy single-call path.
          merge_milestones_deterministic stitches per-part
          results before handing off to the reconciler.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/schemas.py"
        description: >
          New WindowPartition, PartitionReport, audit_parts and
          per-part trace Pydantic models on the EpisodeOfCare
          trace.
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/timeline_loader.py"
        description: >
          _FULL_SNIPPET_CHARS demoted to a corner-case fallback
          only; the loader exposes full encounter text to the
          focus + partitioner pipeline so the partitioner is
          the single point of token-budget control.
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 320
      key_functions:
        - "partition_window"
        - "merge_milestones_deterministic"
        - "_pack_partitions"
        - "_intra_encounter_split"
        - "_node_milestone_extractor (chain wiring)"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "no-encounter-dropped invariant during partition"
      - "no-LLM-merge-call invariant during deterministic stitch"
      - "per-part failure containment"
      - "too_many_parts refusal with zero LLM invocations"
    risk_control_measures:
      - "Pure-function partitioner with unit-tested invariants"
      - "Deterministic Python merge removes the LLM merge step that R-LEO-AI-513 identifies as a fact-loss / hallucination vector"
      - "Hard cap at 8 parts; refusal returns a friendly 'ask a clinician to review' EoC"

  verification_status:
    verification_method: "Test"
    verification_complete: false
