# -- UN-LEO-AI-041 -- Pathway Segment Decomposition

- id: "UN-LEO-AI-041"
  title: "Clinical leads, pathway coordinators, and information analysts need the system to decompose total pathway durations into named segments -- from referral receipt to triage, triage to first appointment, appointment to investigation, investigation to MDT, and MDT to treatment decision -- so that the specific segment causing a breach or delay can be identified and addressed."
  description: |
    Current pathway performance monitoring measures end-to-end durations:
    total days from referral to diagnosis, or referral to treatment. When a
    pathway breaches the national standard, the monitoring data shows that
    it breached but not where in the journey the time was lost. Clinical leads
    and information analysts cannot distinguish a triage bottleneck from a
    diagnostic capacity problem from a treatment planning delay without manual
    case-by-case investigation.

    The system must record a structured timestamp at every defined milestone
    transition, calculate the duration of each named segment, and make segment-
    level data available in analytics dashboards and exports. Segment durations
    must be aggregatable to identify the typical delay distribution across
    a population of referrals.

  stakeholder:
    type: "nhs_user"
    role: "Clinical Lead / Information Analyst / Pathway Coordinator"
    organization: "NHS Acute Trust / ICB"

  priority: "MUST"

  rationale: |
    End-to-end pathway monitoring without segment decomposition produces data
    that confirms a problem exists but provides no information about where to
    intervene. Multiple user interviews confirmed that information analysts
    and clinical leads can report breach rates but cannot explain causation.
    Segment decomposition is the minimum level of analytical granularity
    required to direct quality improvement activity and to make evidence-based
    arguments for capacity or resource investment in a specific part of the
    pathway.

  benefit: |
    Clinical leads can direct improvement activity to the correct pathway
    segment rather than intervening broadly. ICBs can commission targeted
    capacity increases based on evidence rather than assumption. Pathway
    coordinators can spot segment-level delays in individual cases before
    they accumulate into a breach. Reporting to boards and commissioners
    gains specificity.

  use_case: |
    1. Information analyst opens pathway segment analytics.
    2. They select a pathway, specialty, and time period.
    3. The dashboard shows a box-and-whisker plot (or equivalent) of the
       duration distribution for each named segment across all referrals
       in the selected population.
    4. They can see: median, mean, 75th percentile, 90th percentile, and
       maximum for each segment.
    5. They can identify which segment has the widest distribution or the
       longest tail -- indicating the primary source of variability.
    6. Drill-down shows individual referrals with unusually long segment
       durations for case review.
    7. They can export segment-level data for further analysis.

  current_solution: |
    None. Only end-to-end pathway duration is calculated. Segment boundaries
    are not defined or tracked systematically. Causation of breaches is
    determined by manual case investigation.

  pain_points:
    - "Breach reporting shows that breaches occur but not where in the pathway time is lost"
    - "Improvement activity is directed based on assumption rather than evidence"
    - "Capacity investment decisions cannot be evidenced at the segment level"
    - "Individual case investigation to find delay cause takes half a day per case"
    - "Cannot compare segment performance across different specialties or time periods"

  acceptance_criteria:
    - "Configurable segment definitions cover at minimum: referral-to-triage, triage-to-appointment, appointment-to-investigation, investigation-to-MDT, MDT-to-decision"
    - "Timestamp is recorded at every segment transition"
    - "Segment durations are calculated and stored for every referral"
    - "Segment analytics show duration distribution statistics per segment, per specialty, per time period"
    - "Individual referrals with outlier segment durations are surfaced for case review"
    - "Segment-level data is exportable in CSV and PDF formats"

  success_metrics:
    - metric: "Time to identify which pathway segment is causing most breaches"
      target: "Under 5 minutes from opening analytics dashboard"
      baseline: "Not currently possible without manual case-by-case investigation"
    - metric: "Coverage of segment timestamps"
      target: "Above 95% of referrals have all segment timestamps recorded"
      baseline: "0% -- segment timestamps not currently captured"

  regulatory_impact: "low"
  safety_impact: "medium"
  safety_class: "A"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "IEC 62304:2006/AMD1:2015 Class A software lifecycle"

  related_standards:
    - "IEC 62304:2006/AMD1:2015"

