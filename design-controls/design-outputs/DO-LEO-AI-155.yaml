# -- DO-LEO-AI-155 -- Pathway editor configurator wiring (Phase 6b-iv)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-155"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-159"]
    user_needs: ["UN-LEO-AI-072"]
    risks_addressed: ["R-LEO-AI-110"]
    verification_tests: ["VT-LEO-AI-157"]

  specification:
    title: "Pathway editor: condition rule editing, dirty guard, load-failure surface"
    description: |
      Phase 6b-iv of the pathway canvas decomposition. Three pieces of
      orchestrator behaviour move from "implicit / silent / dead code" to
      "explicit / surfaced / wired".

      1) Condition rule editing. The wizard's Settings step now renders
         ConditionRuleBuilder when the node's nodeType is "condition",
         bound to params.rules and params.defaultPort. The handleConfigSave
         path was already propagating rules/defaultPort onto the canvas
         node data, so wiring the builder is enough to make rules
         editable end-to-end.

      2) Dirty guard. A small useDirtyGuard hook computes a stable
         signature over the persistable pathway and compares it against a
         baseline captured the first time `planLoaded` flips true.
         While dirty, a beforeunload listener triggers the browser's
         native "you have unsaved changes" prompt. After every successful
         PUT, markSaved() captures a new baseline so the bar returns to
         "saved".

      3) Load-failure surface. The orchestrator's `useEffect` previously
         called `.catch(() => {})`, which swallowed every load error.
         The catch handler now sets `loadError` to the error.message and
         renders PathwayLoadError above the canvas. The error surface
         exposes a "Try again" button that increments loadAttempt to
         re-run the loader, and a "Dismiss" button that clears the error.

  acceptance_criteria:
    - criterion: "ConditionRuleBuilder mounted under nodeType==='condition'"
      type: "functional"
      measurement: "Test"
      target: >
        page.tsx renders <ConditionRuleBuilder ... /> guarded by
        `step === 2 && config.nodeType === "condition"`, and the
        catch-all SubgraphSettingsPanel branch excludes "condition".
    - criterion: "useDirtyGuard wired with beforeunload"
      type: "safety"
      measurement: "Test"
      target: >
        useDirtyGuard returns { dirty, markSaved, markBaseline }; while
        dirty=true, beforeunload listener is installed; after a successful
        save markSaved() is invoked so dirty returns false.
    - criterion: "PathwaySaveBar renders with derived state"
      type: "functional"
      measurement: "Test"
      target: >
        PathwaySaveBar receives a state of "saving" | "error" | "dirty" |
        "saved" | "idle" derived from isSaving / saveError / dirty /
        lastSaved in that priority order, plus errorMessage and
        onSave / onDismissError callbacks.
    - criterion: "Load failure surfaced via PathwayLoadError"
      type: "safety"
      measurement: "Test"
      target: >
        The plan-loader catch handler sets a non-null loadError; while
        loadError is set, PathwayLoadError renders with the message and
        with retry / dismiss callbacks. The silent `.catch(() => {})`
        no longer appears in page.tsx.

