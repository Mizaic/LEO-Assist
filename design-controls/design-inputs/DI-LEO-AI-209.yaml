# -- DI-LEO-AI-209 -- AI first-pass background job + reviewer UI
# IEC 62304 / ISO 13485 Design Input
#
# NOTE on numbering: this file replaces a now-clobbered DI-LEO-AI-202
# that was used briefly during development for the same scope. The
# patient 4643293950 attestation-guard work shipped in parallel and
# claimed DI-LEO-AI-202; the AI first-pass moved to DI-LEO-AI-209 once
# the collision was discovered. UN-LEO-AI-085 has been updated.

- id: "DI-LEO-AI-209"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-085"
  requirement: >
    The system SHALL expose the AI first-pass workflow as an
    admin-gated background job with Server-Sent Events (SSE) progress
    streaming, and SHALL render AI-suggested entities on pre_done
    candidates with a visible "AI suggested" chip plus a
    "show original" toggle that displays the pre-AI entities_json
    snapshot stored in entities_json_original.
  rationale: >
    A full backlog (~900 candidates x extraction + per-entity coding +
    optional retries) takes tens of minutes; the reviewer must be able
    to close the browser and return without losing progress, and they
    must never confuse an AI-suggested label with a hand-curated one
    when they go to confirm.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          POST /training/candidates/ai-first-pass/jobs MUST accept the
          AIFirstPassParams payload (validator thresholds, statuses,
          limit<=2000, max_workers<=8, few_shot_k, coder_max_retries,
          dry_run) and return run_id immediately with status='queued'
          or 'running'; admin scope is required.
      - type: "functional"
        spec: >
          GET /training/candidates/ai-first-pass/jobs/{run_id}/events
          MUST stream SSE events of type 'candidate.processed' (one
          per candidate, with candidate_id, verdict, action,
          accepted/rejected counts) and 'job.summary' (final), with a
          per-event idle timeout of 600s.
      - type: "functional"
        spec: >
          GET /training/candidates/ai-first-pass/jobs/{run_id} MUST
          return the persisted JobState (status, started_at,
          finished_at, candidate_count, summary, sample_outcomes,
          error) and 404 when run_id is unknown.
      - type: "functional"
        spec: >
          The reviewer UI dialog (AIFirstPassDialog, replacing
          CandidatePruneDialog) MUST consume the SSE stream and render
          a live progress bar plus a running by_verdict tally; the
          toolbar action on the Training Data > Candidates tab MUST
          carry id='ai-first-pass' for jest static-source assertion.
      - type: "functional"
        spec: >
          GoldLabelDetailDialog MUST render an "AI suggested" chip
          (data-testid 'ai-suggested-chip') on every entity row when
          ai_first_pass_run_id is non-null AND the entity originated
          from the AI pass, AND MUST expose a "show original" toggle
          (data-testid 'show-original-toggle') that flips the entity
          list between entities_json and entities_json_original.
    constraints:
      - type: "safety"
        spec: >
          All four /training/candidates/ai-first-pass/jobs* endpoints
          MUST be gated by require_admin (returns 401/403 without).
      - type: "safety"
        spec: >
          The toggle MUST be a read-only view; flipping to "original"
          MUST NOT trigger a writeback or modify the candidate.
    dependencies:
      - "DI-LEO-AI-208"
    downstream_impacts:
      - "Reviewer wall-clock per candidate"
      - "UI trust signal for AI-assisted labels"
    technical_details:
      language: "Python + TypeScript/React"
      framework: "FastAPI router + jest VT + React dialog"
      file_structure:
        - "services/api/app/routers/_training_ai_first_pass.py"
        - "services/api/app/routers/training.py"
        - "services/api/app/services/candidate_ai_first_pass/_job_runner.py"
        - "services/ui/src/components/gold-dataset/AIFirstPassDialog.tsx"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/*"
      estimated_loc: 600

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-200 backend endpoint cases (admin gating, queue
      returns run_id, get-job returns summary, 404 for unknown id) AND
      VT-LEO-AI-201 UI cases (toolbar id='ai-first-pass', dialog
      consumes SSE stream, AI chip rendered when run_id present, show
      original toggle flips view) MUST all pass.
    test_protocol: "VT-LEO-AI-200"

  safety_class: "B"
  risks:
    - "R-LEO-AI-197"
  tags:
    - "training-data"
    - "ai-assist"
    - "ui"
    - "background-job"
    - "sse"
