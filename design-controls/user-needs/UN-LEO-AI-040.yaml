# -- UN-LEO-AI-040 -- Detection of Patients Who Should Be on a Pathway but Are Not

- id: "UN-LEO-AI-040"
  title: "Clinical leads and pathway coordinators need the system to identify patients whose coded primary care encounter data contains red-flag findings consistent with a referral pathway but who have no active referral on that pathway, so that missed referrals and inappropriately downgraded urgency classifications can be detected before the patient presents late with advanced disease."
  description: |
    The patients most at risk from referral pathway failures are often invisible:
    they are not in a triage queue, not on a waiting list, not being tracked.
    A patient may have presented to their GP with red-flag cancer symptoms that
    were coded but not referred, or referred with a downgraded urgency that
    allowed the pathway to lapse, or referred and then lost in an administrative
    failure. None of these patients appear in the active pathway view because
    they were never entered.

    The system must cross-reference coded primary care encounter data against
    configured pathway eligibility criteria, identify patients whose clinical
    profile meets the threshold for referral but who have no active referral
    on the relevant pathway, and surface these as a safety-netting alert for
    clinical review.

  stakeholder:
    type: "nhs_user"
    role: "Clinical Lead for Cancer Services / Pathway Coordinator"
    organization: "NHS Acute Trust / Primary Care"

  priority: "SHOULD"

  rationale: |
    Late-stage cancer diagnosis is strongly associated with delayed or absent
    referral. Patients who should be on a two-week-wait pathway but are not
    present late with advanced disease, reduced treatment options, and worse
    outcomes. These patients are invisible to all current monitoring systems
    because monitoring only covers patients who are already in a queue. Detecting
    them requires crossing coded encounter data against pathway eligibility
    criteria -- a task that is impossible without structured clinical data at
    scale. This capability is a direct clinical safety control.

  benefit: |
    Patients with red-flag findings who have not been referred are identified
    and reviewed before they present as emergencies or with advanced disease.
    Missed referrals and inappropriately downgraded urgency classifications are
    detected systematically rather than only when the patient complains or
    presents to A&E. Clinical leads have evidence of the scale of the problem
    for governance and quality improvement purposes.

  use_case: |
    1. System continuously evaluates coded encounter data from connected primary
       care records against configured pathway eligibility criteria.
    2. When a patient's coded findings meet the threshold for a pathway referral
       but no active referral exists on that pathway, a safety-netting flag is
       raised.
    3. The flag is reviewed by a clinical lead or designated reviewer.
    4. Reviewer can: confirm the patient should be referred and initiate contact
       with the referring practice, mark as reviewed with a reason (e.g. patient
       declined referral, already under secondary care), or request additional
       information.
    5. All flags and reviewer decisions are logged in the audit trail.
    6. Aggregate data on flag rates is available to clinical leads and ICBs.

  current_solution: |
    None. Patients who are not in a referral queue are entirely invisible to
    secondary care and to referral management teams. Detection occurs only when
    the patient presents again -- often to A&E -- with advanced disease.

  pain_points:
    - "Patients with red-flag findings not referred are invisible until they present as emergencies"
    - "No systematic cross-reference of coded encounter data against pathway eligibility"
    - "Clinical leads cannot quantify the scale of missed referrals in their catchment"
    - "Retrospective analysis of late presentations requires manual case-by-case review"
    - "No proactive safety-netting for patients who did not enter the referral system"

  acceptance_criteria:
    - "System evaluates coded encounter data against configured pathway eligibility criteria on at least a daily basis"
    - "Safety-netting flag is raised for patients meeting eligibility criteria with no active referral on the relevant pathway"
    - "Flag review queue is presented to configured reviewer roles with patient summary and the criteria that were met"
    - "Reviewer can record outcome: referred, already under care, declined, other"
    - "All flags and outcomes are stored in the audit trail with timestamps"
    - "Aggregate flag data is available in the analytics dashboard by pathway and time period"

  success_metrics:
    - metric: "Patients identified via safety-netting flag and subsequently referred"
      target: "Measurable within 3 months of deployment -- baseline comparison to historical late presentation rates"
      baseline: "Not currently detected"
    - metric: "False positive rate for eligibility flags"
      target: "Below 30% after initial tuning period"
      baseline: "Not currently measurable"

  regulatory_impact: "high"
  safety_impact: "high"
  safety_class: "C"

  derived_from:
