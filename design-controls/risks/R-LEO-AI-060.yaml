# -- R-LEO-AI-060 -- False stale_post_specialist classification from cross-episode specialist contamination
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-060"
  title: "Historic specialist visits attributed to later same-site referrals, causing false stale episode status"

  hazard:
    description: >
      The episode detection algorithm assigns specialist visit anchors to episode
      nodes using only a cancer-site keyword match, with no constraint that the
      visit date must fall after the episode referral date. A specialist visit
      from an earlier pathway is re-attributed to a later same-site episode.
    category: "clinical_safety"

  hazardous_situation: >
    A patient completes a breast cancer 2WW pathway in 2024 (specialist seen,
    no cancer found). A new breast referral is raised in 2025. During episode
    rebuild, the 2024 specialist visit is attributed to the 2025 episode. The
    2025 episode is flagged stale_post_specialist (>90 days since "specialist
    visit"). The actual open pathway -- where the patient still needs a
    specialist appointment -- is auto-closed with a HITL flag instead of
    remaining in_progress for active follow-up.

  harm:
    description: >
      An active cancer investigation pathway is incorrectly closed as stale.
      The patient may not receive timely specialist review. Clinical audit
      metrics undercount open pathways and overcount completed ones. Quality
      managers reviewing the HITL queue may miss a genuinely at-risk patient.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Replace global per-site-key specialist matching with a per-episode
        temporal claiming algorithm (_claim_specialists_for_episodes). A visit
        is only eligible if its encounter_date >= episode.ref_date and <=
        episode.window_end. Each visit is claimed by at most one episode.
      implemented_by: ["DI-LEO-AI-086"]
      verified_by: ["VT-LEO-AI-086"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After the per-episode claiming algorithm is applied, the date-inversion
      condition (visit_date < ref_date on an episode) is structurally impossible
      because the claiming filter enforces v_date >= spec.ref_date. Live data
      validation confirmed zero such inversions after rebuild. Residual risk is
      limited to edge cases where a concept name yields "unknown" site key and
      the visit falls in the episode window but belongs to a different pathway --
      this is flagged for HITL review by the existing stale detection mechanism.

  monitoring:
    monitoring_plan: >
      After each full episode rebuild, run the specialist_visit_date diagnostic
      query and assert that 0 EpisodeOfCare nodes have specialist_visit_date <
      referral_date. Include this check in the post-rebuild QA script.
    metrics:
      - "Count of EpisodeOfCare nodes with specialist_visit_date < referral_date (target: 0)"
      - "stale_post_specialist count per rebuild (tracked for unexpected increase)"
    review_frequency: "Per rebuild"

  metadata:
    identified_by: "Live data audit -- multi-episode patient review, April 2026"
    identified_date: "2026-04-07"
    status: "mitigated"
    tags:
      - "episode-detection"
      - "specialist-matching"
      - "ncda-audit"
