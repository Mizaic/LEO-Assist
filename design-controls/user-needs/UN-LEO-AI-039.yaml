# -- UN-LEO-AI-039 -- Junior Clinician Triage Decision Support

- id: "UN-LEO-AI-039"
  title: "Less experienced clinicians covering triage need the system to automatically apply published guideline criteria to the coded referral content and present a structured checklist of findings present, findings absent, and threshold met or not met -- so they can make safe, consistent triage decisions without relying entirely on memorised criteria."
  description: |
    Triage is often covered by registrars and other less experienced clinicians
    when the responsible consultant is on leave or unavailable. These clinicians
    take significantly longer to triage, apply criteria less consistently, and
    are less confident in their decisions. They know the guidelines exist but
    do not reference them for every referral because the volume and time pressure
    make it impractical.

    The system must apply the configured guideline criteria for the referral's
    target pathway to the coded clinical content, produce a structured checklist
    showing which criteria are met and which are not, and present a pre-assessed
    triage recommendation with the supporting evidence. The clinician makes the
    final decision, but they are working from a structured evidence base rather
    than memory and pattern recognition alone.

  stakeholder:
    type: "nhs_user"
    role: "Registrar / Junior Doctor covering triage"
    organization: "NHS Acute Trust"

  priority: "MUST"

  rationale: |
    Triage quality should not vary based on the seniority of the clinician
    covering the session. A registrar who has not yet internalised fifteen years
    of specialty-specific triage experience should be able to produce the same
    safe triage decision as an experienced consultant, given appropriate decision
    support. The current model produces systematic inconsistency between
    experience levels, which is a patient safety risk. Guideline-based decision
    support is the standard mechanism for reducing this variation in other
    clinical contexts.

  benefit: |
    Safer triage by less experienced clinicians. Reduced triage time for junior
    clinicians. Improved consistency between consultant and registrar triage.
    Reduced anxiety and second-guessing for clinicians covering triage without
    specialty experience. Guideline criteria are always current -- the clinician
    does not need to memorise updates.

  use_case: |
    1. Registrar opens a referral for triage.
    2. The structured summary shows the coded clinical findings with assertion context.
    3. Below the summary, a guideline criteria panel shows the applicable criteria
       for the target pathway (e.g. NICE NG12 two-week-wait criteria for the
       relevant cancer site).
    4. Each criterion is shown with its status: MET (green), NOT MET (red),
       INSUFFICIENT INFORMATION (amber), or NOT APPLICABLE (grey).
    5. The status is derived from the coded content -- each criterion links
       to the specific code or codes that satisfy or fail it.
    6. A pre-assessed recommendation is shown: "Based on the coded content,
       this referral meets the threshold for two-week-wait."
    7. The clinician confirms the recommendation or overrides it with a
       documented reason.

  current_solution: |
    None. Junior clinicians apply criteria from memory, refer to guidelines
    separately if time permits, and make decisions without structured decision
    support. Triage quality varies significantly with experience level.

  pain_points:
    - "Junior clinicians take twice as long as experienced consultants to triage"
    - "Criteria are applied from memory -- less experienced clinicians miss criteria"
    - "No structured record of which criteria were assessed and why a decision was made"
    - "Registrars lack feedback on whether their triage decisions were correct"
    - "Patient safety risk from inconsistency between experience levels is unquantified"

  acceptance_criteria:
    - "Guideline criteria panel is shown for every referral with a configured target pathway"
    - "Each criterion status is derived from coded content with evidence linking to the source code and phrase"
    - "Criteria cover the full published guideline for the pathway -- not a subset"
    - "Pre-assessed recommendation is shown with the supporting criteria listed"
    - "Clinician can override the recommendation with a mandatory reason"
    - "Override reason is logged with the clinician's role and the criteria assessment at time of decision"

  success_metrics:
    - metric: "Triage time for junior clinicians"
      target: "Within 25% of experienced consultant triage time for equivalent referrals"
      baseline: "Estimated 2x longer than consultant"
    - metric: "Triage consistency between junior and senior clinicians"
      target: "Kappa > 0.7 for two-week-wait classification"
      baseline: "Not currently measured"

  regulatory_impact: "high"
  safety_impact: "high"
  safety_class: "B"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "IEC 62304:2006/AMD1:2015 Class B software lifecycle"
    - "ISO 14971:2019 risk management"

  related_standards:
