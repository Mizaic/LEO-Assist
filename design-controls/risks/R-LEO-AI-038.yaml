# -- R-LEO-AI-038 through R-LEO-AI-045 -- ODS Nightly Sync Job Risks
# ISO 14971 / IEC 62304 Risk Register
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-038"
  title: "ODS API unavailable — nightly sync completes silently with no data freshness checks"

  hazard:
    description: >
      The NHS ODS FHIR API becomes temporarily unavailable during the nightly sync window.
      Without a circuit breaker, the sync job could silently succeed (zero orgs checked)
      while LEO continues to use stale ODS data, unaware that organisations may have
      changed name, type, or closure status.
    category: "data_integrity"

  hazardous_situation: >
    During the 02:00 UTC nightly sync, the ODS API returns connection errors for all
    requests. The sync job logs no errors and marks the run as complete. Practitioners
    continue to use LEO with org data that may be weeks old, including potentially
    organisations that have since been decommissioned or merged.

  harm:
    description: >
      Clinical audit records may be attributed to incorrect or decommissioned organisations,
      leading to inaccurate pathway coding metrics and misdirected clinical governance reports.
    severity: "moderate"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Circuit breaker in services/ods_sync/app/circuit_breaker.py aborts the sync after
        5 consecutive OdsApiError exceptions. On abort, an OdsSyncFailed FHIR AuditEvent
        is emitted and a Service Bus alert is triggered. Previous ods_sync_status values
        are not cleared — stale data remains visible to platform admins rather than being
        silently lost.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Per-org ods_sync_last_checked timestamp is written atomically on each successful check.
        Platform admins can filter the portal view by ods_sync_last_checked to identify orgs
        not checked within the expected 24h window.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The circuit breaker ensures API outages produce visible alerts rather than silent
      failures. Platform admins are alerted via Service Bus within minutes of the sync
      aborting. Stale data is retained (not overwritten with nulls) so clinical operations
      are unaffected pending the next successful sync.

  monitoring:
    monitoring_plan: >
      Monitor OdsSyncFailed AuditEvents in the FHIR audit log. Alert on-call if the
      nightly sync fails to complete within a 4-hour window of the scheduled time.
    metrics:
      - "ODS sync completion rate (target: 100% nightly)"
      - "Circuit breaker trigger frequency"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "data-integrity"
      - "availability"


- id: "R-LEO-AI-039"
  title: "ODS API rate limiting (429) — partial sync leaves some organisations unchecked"

  hazard:
    description: >
      The NHS ODS FHIR API applies per-client rate limits. During bulk processing of
      hundreds of organisations the sync job may receive HTTP 429 responses for some orgs,
      resulting in a partial sync where a subset of organisations are not checked.
    category: "data_integrity"

  hazardous_situation: >
    Orgs processed late in the sync run consistently receive 429 responses. Their
    ods_sync_last_checked timestamps are not updated, making it appear they were never
    checked. An organisation that has closed may not be flagged as inactive.

  harm:
    description: >
      Mislabelled organisation status in LEO audit data; clinical governance metrics
      may include data attributed to decommissioned practices.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        OdsRateLimitError triggers per-org exponential backoff: 1s, 2s, 4s delays with
        maximum 3 retries before marking ods_sync_status = "error" for that org and
        continuing to the next. Configurable via ODS_SYNC_DELAY_MS environment variable.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        ods_sync_last_checked is written per-org immediately after a successful ODS call.
        Orgs that fail due to rate limiting retain their previous timestamp, making
        partial-sync coverage gaps visible to platform admins.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Backoff and retry make transient 429 errors unlikely to cause persistent gaps.
      Orgs that do fail are individually flagged with ods_sync_status: "error" and
      will be rechecked on the next nightly run.

  monitoring:
    monitoring_plan: >
      Track ODS API 429 error rates in sync logs. If rate-limit errors exceed 5% of
      orgs on any single run, review ODS_SYNC_DELAY_MS configuration.
    metrics:
      - "ODS 429 error rate per sync run"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "rate-limiting"
      - "data-integrity"


- id: "R-LEO-AI-040"
  title: "ODS marks GP as Inactive during re-registration / merger — LEO incorrectly flags an active practice"

  hazard:
    description: >
      NHS GP practices occasionally re-register (e.g. during ICB mergers or branch surgery
      closures) which causes ODS to temporarily mark the practice as Inactive even though
      it continues to serve patients. An automated sync that acts on this status could
      incorrectly flag or suspend an active practice in LEO.
    category: "clinical_safety"

  hazardous_situation: >
    ODS returns status: Inactive for a GP practice that is currently active and processing
    patients. If the sync job automatically suspends the org, clinical coders lose access
    to patient records for that practice during an active clinical audit cycle.

  harm:
    description: >
      Clinical coders cannot access patient records for an active practice during re-registration
      window; disruption to ongoing clinical audit workflow.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        The ods_sync_status = "closed" flag is informational only. The sync job NEVER
        auto-suspends, deactivates, or removes an organisation from LEO. Only a platform
        admin taking a deliberate manual action can suspend an org. The UI shows a
        "ODS reports inactive — review required" banner to prompt human investigation.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        A FHIR AuditEvent closure alert is emitted for platform admin review whenever
        an org is flagged as closed. The alert includes the ODS code, organisation name,
        and timestamp for rapid triage.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 1
    probability: 2
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Because the sync job never auto-suspends orgs, the worst-case outcome is a
      platform admin banner that prompts human review — not clinical disruption.
      All suspension actions require deliberate human intent.

  monitoring:
    monitoring_plan: >
      Track ods_sync_status = "closed" events. Platform admins must acknowledge and
      investigate each closure alert within 5 business days.
    metrics:
      - "Open ODS closure alerts older than 5 business days"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "clinical-safety"
      - "org-lifecycle"


- id: "R-LEO-AI-041"
  title: "Sync job crashes mid-run — some orgs updated, some not, leaving inconsistent state"

  hazard:
    description: >
      An unhandled exception, OOM event, or container timeout causes the ODS sync job
      to terminate partway through processing the organisation list, leaving a mix of
      updated and un-updated records.
    category: "data_integrity"

  hazardous_situation: >
    The Azure Container Apps Job times out after 2 hours while 200 orgs remain unchecked.
    Those orgs retain stale ods_sync_last_checked values and may have undetected mismatches
    or closure events.

  harm:
    description: >
      Undetected org data discrepancies persisting until the next nightly run; potential
      for clinical audit metrics to reference out-of-date org names or status.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        ods_sync_last_checked and ods_run_id are written atomically per-org immediately
        after each successful ODS check. A crash mid-run leaves already-processed orgs
        correctly updated; unprocessed orgs retain their previous timestamps, making
        coverage gaps visible.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The sync job is idempotent. Re-running it processes all orgs regardless of
        previous run state. Azure Container Apps Job retry policy can be configured
        to retry on non-zero exit code.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Per-org atomic writes ensure no data corruption on crash. Idempotent design
      means any missed orgs are caught on the next nightly run. Clinical impact is
      limited to a maximum of 24h data staleness for affected orgs.

  monitoring:
    monitoring_plan: >
      Monitor Azure Container Apps Job exit codes. Alert on non-zero exit.
    metrics:
      - "ODS sync job non-zero exit rate"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "resilience"
      - "data-integrity"


- id: "R-LEO-AI-042"
  title: "Malformed ODS API response causes unhandled exception — org flagged incorrectly"

  hazard:
    description: >
      The NHS ODS FHIR API returns a non-JSON or structurally unexpected response body.
      Without per-org error handling, a JSON parse exception could propagate and crash
      the entire sync run, or silently skip the org.
    category: "data_integrity"

  hazardous_situation: >
    ODS returns HTML error page instead of JSON for one org. The JSON parse raises
    an unhandled exception that propagates to terminate the sync loop prematurely.

  harm:
    description: >
      Remaining orgs in the batch are not checked; closure events or name mismatches
      go undetected for up to 24 hours.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Each org is processed in an isolated try/except block. OdsApiError (including
        JSON parse failures) sets ods_sync_status = "error" for that org and logs the
        exception. Processing continues to the next org — a single failure never
        aborts the loop (unless circuit breaker threshold is reached).
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 1
    probability: 1
    detectability: 1
    rpn: 1
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Per-org isolation ensures malformed responses cannot cascade. The affected org
      is marked with ods_sync_status: "error" and will be retried on the next run.

  monitoring:
    monitoring_plan: >
      Track ods_sync_status = "error" counts per run. Investigate systematic errors
      that affect >1% of orgs.
    metrics:
      - "ODS parse error rate per sync run"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "error-handling"


- id: "R-LEO-AI-043"
  title: "ODS sync writes incorrect data to Neo4j — corrupts organisation node properties"

  hazard:
    description: >
      A bug in the sync service Cypher query or data mapping causes incorrect values
      to be written to Organisation nodes, overwriting valid data with erroneous ODS
      sync metadata.
    category: "data_integrity"

  hazardous_situation: >
    A Cypher parameterisation bug causes the wrong ods_sync_status value to be written
      to multiple org nodes in a single UNWIND batch, incorrectly flagging active
    organisations as closed.

  harm:
    description: >
      Platform admins investigate false closure alerts; clinical coders see incorrect
      ODS status banners for active practices.
    severity: "moderate"

  initial_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        UPDATE_ORG_ODS_SYNC and BATCH_UPDATE_ODS_CHECKED use PATCH semantics — only
        an explicit allowlist of properties (ods_sync_status, ods_sync_last_checked,
        ods_discrepancy, ods_run_id) are ever written. No DETACH DELETE, SET o = {},
        or structural changes are made by the sync job.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        BATCH_UPDATE_ODS_CHECKED matches by o.id (unique constraint) to prevent
        cross-org writes. The UNWIND pattern is parameterised; no string interpolation
        is used in Cypher queries.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Property-allowlist write semantics prevent structural corruption. Worst case is
      an incorrect informational flag that a platform admin can manually correct.
      Covered by TC-006 and TC-012 in VT-LEO-AI-048.

  monitoring:
    monitoring_plan: >
      Spot-check 5% of org nodes post-sync for unexpected property changes.
    metrics:
      - "Post-sync org node anomaly rate"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "data-integrity"
      - "neo4j"


- id: "R-LEO-AI-044"
  title: "ODS returns different org type from LEO record — auto-correction breaks org hierarchy"

  hazard:
    description: >
      The ODS FHIR API returns a different organisation type code than what is recorded
      in LEO (e.g. a PCN code where LEO has ICB). Automatic correction of org type
      would break COMMISSIONED_BY and PART_OF_ALLIANCE relationships and corrupt the
      hierarchy used for patient data scoping.
    category: "data_integrity"

  hazardous_situation: >
    ODS returns RO116 (PCN) for an org that LEO has classified as ICB. If the sync
    job auto-corrects the node label, CallerScope expansion for ICB users breaks —
    they can no longer see their commissioned GP practices.

  harm:
    description: >
      Clinical coders and org admins lose access to patient records and sub-org management
      for their entire ICB hierarchy until the incorrect label is manually corrected.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Org type is NEVER auto-corrected by the sync job. Type mismatches are recorded
        as ods_sync_status = "mismatch" with ods_discrepancy = {type: {ods: X, leo: Y}}
        for human review. The sync job has no authority to change node labels or
        COMMISSIONED_BY/PART_OF_ALLIANCE relationships.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 1
    probability: 1
    detectability: 1
    rpn: 1
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Hard architectural constraint: sync job can only write to an explicit property
      allowlist that excludes labels and relationships. Covered by TC-004 in VT-LEO-AI-048.

  monitoring:
    monitoring_plan: >
      Track ods_discrepancy.type mismatch events. Platform admins must investigate
      within 5 business days.
    metrics:
      - "Org type mismatch alert count"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "clinical-safety"
      - "org-hierarchy"


- id: "R-LEO-AI-045"
  title: "ODS nightly sync Neo4j write load degrades graph performance during peak hours"

  hazard:
    description: >
      A nightly batch of 10,000+ ods_sync_last_checked updates stresses the Neo4j
      patient graph if writes are issued as individual queries, potentially increasing
      query latency for clinical coders accessing patient records simultaneously.
    category: "performance"

  hazardous_situation: >
    During the 02:00 UTC sync window, 10,000 individual Cypher SET queries cause
    index contention on Organization nodes. Concurrent clinical coding sessions experience
    elevated latency for patient look-up queries.

  harm:
    description: >
      Degraded response times for active clinical coders; potential session timeouts
      disrupting in-progress audit coding work.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        No-change org updates use BATCH_UPDATE_ODS_CHECKED with UNWIND batches of
        maximum 500 orgs per query, reducing round-trips by 500x for the common case.
        Individual UPDATE_ORG_ODS_SYNC queries are only issued for mismatch or closure
        events, which are expected to be rare.
      implemented_by: ["ods_sync_service"]
      verified_by: ["VT-LEO-AI-048"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Azure Container Apps Job is scheduled at 02:00 UTC — lowest clinical activity
        window for NHS England. The ODS_SYNC_DELAY_MS environment variable introduces
        configurable inter-org delay to spread write load.
      implemented_by: ["ods_sync_service"]
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 1
    probability: 1
    detectability: 1
    rpn: 1
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Batch UNWIND reduces write pressure by orders of magnitude. Off-peak scheduling
      minimises concurrent user impact. Covered by TC-012 in VT-LEO-AI-048.

  monitoring:
    monitoring_plan: >
      Monitor Neo4j query latency metrics during the 02:00–04:00 UTC window.
      Alert if median patient look-up latency exceeds 500ms during sync.
    metrics:
      - "Neo4j query latency p95 during sync window"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design review — ODS sync job threat modelling"
    identified_date: "2026-03-06"
    status: "analyzed"
    tags:
      - "ods-sync"
      - "performance"
      - "neo4j"
