# -- UN-LEO-AI-090 -- AI-driven episode + milestone detection
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-090"
  title: "System detects cancer episodes and pathway milestones using AI reasoning over the patient timeline"
  description: |
    Clinical audit teams need the system to read a patient's complete encounter
    history end-to-end, decide which sections of the timeline represent
    cancer episodes (vs benign, non-cancer, or admin noise), and pin the
    canonical milestones (referral, first-seen, diagnosis, treatment-start,
    treatment-complete, benign-closure) to the encounters that prove them.
    The previous rule-based detector could not distinguish a real treatment
    event from an admin echo on the same day, leading to phantom episodes
    and incorrect treatment_started dates. An AI agent chain reading the
    full timeline with explicit clinical rules-of-the-road is required to
    handle the ambiguity that rules alone could not.

  stakeholder:
    type: "end_user"
    role: "Clinical Audit Team Member"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    The rule-based episode detector consistently mis-anchored milestones
    in real cases (see synthetic reference SYN-EE-001, breast cancer),
    where it picked an admin "Failed encounter" mentioning letrozole as
    treatment_started instead of the actual mastectomy two months later.
    Patient timelines routinely contain booking entries, receptionist
    call logs, SMS reminders, and pharmacist reconciliations on the same
    date as the real clinical event - exactly the disambiguation rules
    cannot do. An LLM that reads the whole window and is asked the right
    question (with the date, encounter id and evidence quote pinned)
    gives auditors trustworthy episodes with citable provenance.

  benefit: |
    Clinically credible episodes and milestones with per-event evidence
    quotes and source-encounter ids, ready for HITL review or downstream
    reporting. Reviewers can trust the engine's output or override it from
    the same UI without combing the raw record.

  use_case: |
    1. Engine loads the patient's encounters from Neo4j.
    2. Segmenter agent splits the timeline into candidate episode windows.
    3. Classifier agent labels each window (cancer / multi_site / benign /
       non_cancer / uncertain) with a confidence score.
    4. Milestone extractor pulls canonical milestones from each
       cancer-ish window with date, encounter id and evidence quote.
    5. Reconciler merges overlapping multi-site referrals that share a
       single diagnosis, splits incorrectly merged windows, and drops
       low-confidence non-cancer windows.
    6. Writer wipes existing EpisodeOfCare nodes for the patient and
       writes the engine output with full provenance.
    7. Trace node records per-stage prompt versions, model ids, tokens,
       latency and errors for audit.

  current_solution: |
    Rule-based anchor detector + episode builder using regex patterns
    (Pattern A..N) on encounter text. Could not disambiguate admin
    actions on the same date as real clinical events; produced phantom
    episodes and incorrect treatment dates.

  pain_points:
    - "Rule-based detector picked admin/booking events as treatment_started"
    - "Multiple referrals to different sites for one diagnosis produced multiple phantom episodes"
    - "Clinicians could not tell why an episode was detected (no evidence quote)"
    - "Adding new patterns required code deploys and risked regressing existing patients"

  acceptance_criteria:
    - "System shall identify cancer episodes from raw patient timelines using a chain of LLM agents (segmenter, classifier, milestone extractor, reconciler)"
    - "System shall pin every milestone to a specific encounter_id with an evidence quote drawn from that encounter"
    - "System shall correctly identify both endocrine therapy (letrozole) and surgery (mastectomy) as treatment_started milestones for the synthetic reference case SYN-EE-001 and exclude the 2025-05-02 'Failed encounter' admin task (verified by VT-LEO-AI-503 with synthetic fixture data)"
    - "System shall produce per-run provenance (trace_id, prompt versions, model ids, tokens, latency, errors) persisted as an EpisodeEngineTrace node"
    - "System shall be idempotent per patient: re-running wipes prior episodes and rewrites cleanly"
    - "System shall flag low-confidence episodes for human-in-the-loop review (needs_human_review=true)"

  success_metrics:
    - metric: "Engine reproduces correct episodes for synthetic reference SYN-EE-001 (breast cancer)"
      target: "1 cancer episode, includes treatment_started (endocrine) on the reconciled letrozole date AND treatment_started (surgery) on the mastectomy date; excludes the 'Failed encounter' admin task"
      baseline: "Rule-based: phantom second episode + treatment_started anchored on the Failed encounter (incorrect)"
    - metric: "Episodes per patient (10-patient spike)"
      target: "Reduction of >=40% vs rule-based on same cohort"
      baseline: "Rule-based produced 8 episodes for some patients where the engine produces 1-3 with HITL flags on the uncertain ones"
    - metric: "Per-run cost"
      target: "<$0.20 per patient on Bedrock Haiku + Sonnet reconciler"
      baseline: "n/a (new engine)"

  regulatory_impact: "high"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1.5"
    - "Synthetic reference case SYN-EE-001 (rule-based mis-detection of treatment_started)"
    - "Feedback from Clinical Audit Team Pilot 2026-Q2"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"
    - "NHS Cancer Waiting Times guidance"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-04-18"
    status: "draft"

  design_inputs:
