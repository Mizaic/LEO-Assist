# -- VT-LEO-AI-166 -- Test patient library page + ReplayResultsDialog UI
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-166"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-167"]
    risks: ["R-LEO-AI-166"]

  metadata:
    title: "Test patient library page chrome, API client and ReplayResultsDialog rendering"
    description: >
      Verifies the /admin/guidance/test-patients page wires the Build,
      Generate and Replay actions, that the api client targets the
      correct endpoints with the right headers, and that the
      ReplayResultsDialog renders pass / regression / unexpected
      buckets in plain English (reading age 9-11).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/test-patients-page.test.tsx"
      - "services/api/tests/test_require_admin_or_service.py"
      - "services/terminology_api/tests/test_post_compile_replay_hook.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node + jest + @testing-library/react installed via services/ui/package.json"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-166-TC-001"
      case_name: "Library page wires Build, Generate and Replay dialogs"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source check: page.tsx imports BuildPatientDialog, GeneratePatientsDialog and ReplayResultsDialog and renders the matching button labels."
          expected_result: "All three dialog imports and button labels present."
          verification_method: "automated"
      acceptance_criteria:
        - "All three reviewer actions are reachable."

    - case_id: "VT-166-TC-002"
      case_name: "Library page supports per-guideline scope filter and 'All guidelines'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source check: page.tsx mentions 'All guidelines' and uses a scopeGuideline state variable."
          expected_result: "Both substrings present."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer can scope down to a single guideline or stay global."

    - case_id: "VT-166-TC-003"
      case_name: "Empty-state copy avoids jargon (reading age 9-11)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source check: page.tsx contains 'No saved patients yet' and does NOT contain 'fixture' or 'corpus'."
          expected_result: "Empty-state line present, jargon absent."
          verification_method: "automated"
      acceptance_criteria:
        - "Plain-English standard preserved on the empty state."

    - case_id: "VT-166-TC-004"
      case_name: "listPatients API client targets the scoped GET endpoint"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock global fetch; call listPatients({guideline_id: 'g1'}); inspect the URL."
          expected_result: "URL matches /api/guidance/test-patients?... and contains guideline_id=g1; rows are returned to the caller."
          verification_method: "automated"
      acceptance_criteria:
        - "Frontend calls the right backend route with the right filter."

    - case_id: "VT-166-TC-005"
      case_name: "dryRun POSTs JSON body with X-Requested-With"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock global fetch; call dryRun({patient: {codes: ['100'], age: 70, sex: 'male'}})."
          expected_result: "POST to /api/guidance/test-patients/dry-run with Content-Type application/json and X-Requested-With XMLHttpRequest."
          verification_method: "automated"
      acceptance_criteria:
        - "CSRF-style header set on every state-changing call."

    - case_id: "VT-166-TC-006"
      case_name: "ReplayResultsDialog renders patient name and pass / regression labels"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render ReplayResultsDialog with one patient ('Smoker, 70'), one pass and one regression."
          expected_result: "Dialog shows the patient name and surfaces both 'pass' and 'regression' labels in the DOM."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer sees per-patient outcome at a glance."

    - case_id: "VT-166-TC-007"
      case_name: "Empty report avoids developer jargon"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render ReplayResultsDialog with report=null and assert that the words 'diff' and 'regex' do not appear."
          expected_result: "Neither word in the rendered DOM."
          verification_method: "automated"
      acceptance_criteria:
        - "Empty state stays in plain English."

    # -- Backend auth coverage for the post-compile replay hook -----------
    # The terminology-api compile job calls back into core-api at
    # /guidance/test-patients/replay; that endpoint must accept either an
    # admin session cookie (admin UI) or a SERVICE_AUTH_SECRET Bearer token
    # (inter-service). The dev bypass MUST NOT be relied on.

    - case_id: "VT-166-TC-008"
      case_name: "test_service_auth_bearer_with_correct_secret_returns_service_account"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Set SERVICE_AUTH_SECRET; GET a route protected by require_admin_or_service with Authorization: Bearer <correct>."
          expected_result: "200 with synthetic service-account admin scope."
          verification_method: "automated"
      acceptance_criteria:
        - "Inter-service callers can reach the endpoint without a session cookie."

    - case_id: "VT-166-TC-009"
      case_name: "test_service_auth_bearer_with_wrong_secret_returns_401"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Set SERVICE_AUTH_SECRET; GET with Authorization: Bearer <wrong>."
          expected_result: "401 Invalid service auth token."
          verification_method: "automated"
      acceptance_criteria:
        - "Forged Bearer tokens are rejected timing-safe."

    - case_id: "VT-166-TC-010"
      case_name: "test_bearer_header_ignored_when_secret_unset_falls_back_to_session"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Unset SERVICE_AUTH_SECRET; GET with Authorization: Bearer anything and no session cookie."
          expected_result: "401 Not authenticated -- the dev bypass is not used by this dependency."
          verification_method: "automated"
      acceptance_criteria:
        - "Local-dev does not silently widen the auth surface."

    - case_id: "VT-166-TC-011"
      case_name: "test_session_cookie_admin_returns_admin_scope"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide an admin session cookie (no Bearer header)."
          expected_result: "200 with the session email as admin."
          verification_method: "automated"
      acceptance_criteria:
        - "Admin UI continues to work unchanged."

    - case_id: "VT-166-TC-012"
      case_name: "test_no_session_and_no_bearer_returns_401"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Send no Authorization header and no session cookie."
          expected_result: "401 Not authenticated."
          verification_method: "automated"
      acceptance_criteria:
        - "Endpoint stays closed by default."

    - case_id: "VT-166-TC-013"
      case_name: "test_session_cookie_non_admin_returns_403"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Provide a session cookie for a non-admin clinician."
          expected_result: "403 Platform admin access required."
          verification_method: "automated"
      acceptance_criteria:
        - "Non-admin sessions cannot replay test patients."

    - case_id: "VT-166-TC-014"
      case_name: "test_replay_hook_sends_service_auth_bearer_header"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Set SERVICE_AUTH_SECRET; await _trigger_test_patient_replay(); inspect outbound httpx headers."
          expected_result: "Authorization: Bearer <secret> and X-Requested-With both present on the POST."
          verification_method: "automated"
      acceptance_criteria:
        - "The post-compile hook authenticates against the core-api in deployed environments."

    - case_id: "VT-166-TC-015"
      case_name: "test_replay_hook_omits_auth_header_when_secret_unset"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Unset SERVICE_AUTH_SECRET; await _trigger_test_patient_replay()."
          expected_result: "POST goes out with X-Requested-With but no Authorization header."
          verification_method: "automated"
      acceptance_criteria:
        - "Local-dev parity preserved; no fake credentials are forged."

    - case_id: "VT-166-TC-016"
      case_name: "test_replay_hook_swallows_401_and_logs"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Stub core-api to return 401; await _trigger_test_patient_replay()."
          expected_result: "Hook returns normally and emits a WARNING log naming the 401."
          verification_method: "automated"
      acceptance_criteria:
        - "A failed replay never blocks a successful guideline compile (DI-LEO-AI-167)."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-166/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-166-EXEC-001"
      executed_by: "automated_jest"
      executed_date: "2026-04-17"
      result: "pass"
      command: "cd services/ui && npx jest src/__tests__/test-patients-page.test.tsx --no-coverage"
      total_cases: 7
      passed: 7
      failed: 0
      notes: >
        7/7 cases passed. Mixes static-source assertions on page.tsx
        (no DOM mount of the full library page is required for the
        chrome contract) with a focused ReplayResultsDialog DOM
        render and a fetch-mock test of the api client.

    - execution_id: "VT-166-EXEC-002"
      executed_by: "automated_pytest"
      executed_date: "2026-04-19"
      result: "pass"
      command: "python3 -m pytest services/api/tests/test_require_admin_or_service.py services/terminology_api/tests/test_post_compile_replay_hook.py services/api/tests/test_test_patient_router.py -v"
      total_cases: 9
      passed: 9
      failed: 0
      notes: >
        Backend coverage added after observing
        'Test patient replay returned 401: {"detail":"Not authenticated"}'
        in the terminology-api logs. The post-compile hook in
        services/terminology_api/app/routers/guidelines.py now sends
        the SERVICE_AUTH_SECRET Bearer header (via
        libs/auth/service_auth.get_service_auth_header), and the
        /guidance/test-patients/replay endpoint accepts that header
        through the new app.deps.require_admin_or_service dependency
        as well as the pre-existing admin session cookie. The fix
        deliberately does NOT route through the LEO_LOCAL_DEV_BYPASS
        local-dev shortcut.
