# -- R-LEO-AI-086 -- Staging cross-contamination across concurrent cancers
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-086"
  title: "Stage derivation pulls evidence from a different cancer pathway on the same patient"

  hazard:
    description: >
      A patient with two or more active cancer pathways in the same
      window has staging evidence (TNM, Gleason, explicit stage group)
      cross-contaminated between episodes, because the staging subgraph
      inspects all encounter text in the window without filtering by
      the site of the current episode.
    category: "clinical_safety"

  hazardous_situation: >
    The stage for a colorectal episode is derived from a breast-cancer
    MDT letter written the same week, or vice versa. The resulting
    stage is clinically wrong. Downstream NCDA audit submissions and
    cancer-tracker views show a wrong stage for that patient.

  harm:
    description: >
      Audit quality is degraded; quality-improvement decisions are
      based on wrong stage; clinical trust in the tool is lost.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        libs/clinical_scoping.filter_rows_by_specialty removes encounter
        rows that do not match the cancer-type regex before any TNM,
        Gleason or explicit-stage extraction; the staging subgraph
        operates only on evidence inside a 90-day post-diagnosis window.
      implemented_by: ["DI-LEO-AI-126"]
      verified_by: ["VT-LEO-AI-121"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Per-site regex filtering plus bounded temporal window removes the
      dominant cross-contamination path. Rare ambiguous text is handled
      by the no-match fallback which defers to existing rules and
      downstream review.

  monitoring:
    monitoring_plan: >
      Post-deployment audit samples patients with multiple concurrent
      pathways and compares derived stage against clinician review.
    metrics:
      - "Percentage of multi-cancer patients with mismatched stage"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "NCDA export build - patient 4200797127 case review"
    identified_date: "2026-04-16"
    status: "mitigated"
    tags:
      - "staging"
      - "cross-contamination"
