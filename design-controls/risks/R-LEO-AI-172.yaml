# -- R-LEO-AI-172 -- Residual missed-cancer risk on the skin / melanoma pathway
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-172"
  title: "Confirmed skin cancer or melanoma silently filed as closed_benign because pathway-specific codes / templates / surgical procedures are missing from the inventory"

  hazard:
    description: >
      Skin cancer and melanoma are the most common 2WW pathway in
      English primary care, but the dermatology / plastics ecosystem
      uses a long tail of free-text templates, histological subtype
      diagnoses, and surgical-procedure codes (Wide excision of skin
      lesion, Biopsy - action) that did not exist in the pre-2026-04
      inventories. A confirmed melanoma can be missed when (a) the
      diagnosis Read code is in a part of the B32.. family not yet
      mapped, (b) the histological subtype phrase is not in
      MALIGNANCY_TERM_PATTERNS, (c) the secondary-care surveillance
      template name is not in CANCER_FOLLOW_UP_PHRASES, or (d) the
      treating clinician used the surgical procedure code rather
      than a diagnosis code in the only post-referral encounter.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician triages the cancer-audit dashboard and does not see
    a confirmed melanoma that should be there because the entire
    post-referral pathway in primary care relies on (i) the 2WW
    referral code, (ii) a "Skin Cancer Follow Up" template name, and
    (iii) a 7G055 wide-excision code, none of which were recognised
    by the detector before the DI-LEO-AI-175 / DI-LEO-AI-177 fixes.

  harm:
    description: >
      Delayed clinical follow-up for a real melanoma pathway. The
      audit found patient 4921442355 (confirmed pT1a Lentigo maligna
      melanoma of the right cheek) silently filed as closed_benign
      and excluded from the confirmed-cancer cohort. Equivalent
      misses exist for at least 2 other patients in the corpus.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        FAST_TRACK_REFERRAL_READ_CODES (XaMeA), SPECIALIST_CLINIC_READ_CODES
        (XaPyd), MALIGNANCY_READ_CODES (B32.. family + Xa99Y +
        related), MALIGNANCY_TERM_PATTERNS (Lentigo maligna,
        superficial spreading melanoma, etc.), and the new
        CANCER_TREATMENT_PROCEDURE_CODES (7G055, X90PX) close the
        primary-care vocabulary gaps for the skin / melanoma pathway.
      implemented_by: ["DI-LEO-AI-175"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        CANCER_FOLLOW_UP_PHRASES + find_cancer_follow_up_phrase
        recognise free-text surveillance template names ("Skin
        Cancer Follow Up", "Breast Cancer Follow Up" etc.) so a
        confirmed cancer that lives only in a secondary-care
        surveillance template still emits a diagnosis_confirmed
        anchor. The history-of-cancer guard remains the hard
        precondition.
      implemented_by: ["DI-LEO-AI-177"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Every diagnosis anchor produced by the new skin / melanoma
        and follow-up template paths sets hitl_required=True so the
        episode receives hitl_flag=True and a clinician adjudicates
        before the dashboard treats the classification as
        authoritative.
      implemented_by: ["DI-LEO-AI-175", "DI-LEO-AI-177"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Quarterly clinical audit samples 50 closed_benign episodes
        with site_key in {melanoma, skin} or with any encounter
        containing a B32.. / Xa99Y / 7G055 token, and confirms
        against the source. Inventory updates feed back through
        DI-LEO-AI-175 amendments.
      implemented_by: ["DI-LEO-AI-175"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"
    acceptability: "acceptable"
    justification: >
      The skin / melanoma vocabulary fixes recover at least 3 known
      missed cancers in the current corpus. Every text-driven
      diagnosis anchor is hitl_required, so no decision becomes
      authoritative without human review. The remaining residual
      risk (very recent diagnosis terminology not yet in the
      inventory) is bounded by the quarterly audit cadence and
      acceptable for a Class B safety classification.

  monitoring:
    monitoring_plan: >
      Quarterly audit: sample 50 closed_benign episodes per quarter
      with skin / melanoma context (any encounter token in B32..,
      Xa99Y, XaMeA, XaPyd, 7G055, "skin cancer follow up", "lentigo
      maligna") and confirm against source. Track precision and
      yield per signal type. Trigger inventory review if a new
      missed cancer is found.
    metrics:
      - "Number of closed_benign skin/melanoma episodes per quarter"
      - "Number of escapees recovered post-rebuild"
      - "Yield of each new signal (XaMeA, XaPyd, B32.., 7G055, follow-up template)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "2026-04-17 audit of patient 4921442355 (Lentigo maligna melanoma silently filed closed_benign)"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "episode-building"
      - "missed-cancer"
      - "skin-cancer"
      - "melanoma"
      - "follow-up-template"
