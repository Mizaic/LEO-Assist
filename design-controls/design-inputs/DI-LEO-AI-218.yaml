# -- DI-LEO-AI-218 -- UI shell SSR session bootstrap and cache strategy
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-218"
  type: "Functional"
  derived_from: ["UN-LEO-AI-087"]
  requirement: >
    The UI root layout SHALL resolve the current user's session on the
    server using the leo_session cookie before any HTML is sent to the
    browser, pass the resolved session into the AuthProvider as
    initialSession, and declare the segment as fully dynamic
    (force-dynamic, revalidate=0, fetchCache=force-no-store) so that
    Next.js never participates in the Full Route Cache for
    authenticated pages and never serves a prerendered "loading" tree.
    The /auth/login and /auth/callback route handlers SHALL set
    Cache-Control: no-store on every response so that Cloudflare and
    any other CDN cannot cache OAuth redirects or any leg of the
    sign-in flow.

  rationale: >
    Production debugging of leo-ai-audit.healthcarecopilot.ai showed
    Cloudflare returning the build-time prerender of /care/dashboard
    with x-nextjs-cache: HIT, x-nextjs-prerender: 1, and
    cache-control: s-maxage=31536000. Because no session cookie was
    present at build time, the AppShell rendered only its loading
    branch and that spinner HTML was then served to every signed-in
    user. Resolving the session on the server and disabling the
    Full Route Cache for the authenticated shell removes the only
    surface that cached the loading state.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "services/ui/src/app/layout.tsx exports `dynamic = \"force-dynamic\"`, `revalidate = 0`, and `fetchCache = \"force-no-store\"` so Next.js disables the Full Route Cache for every UI route."
      - type: "functional"
        spec: "services/ui/src/lib/serverSession.ts exports an async fetchInitialSession() that reads the leo_session cookie via next/headers, calls GET ${INTERNAL_API_BASE}/auth/session with cache: 'no-store', and returns a Session object or null. It MUST never throw; upstream errors return null and a console.warn in development."
      - type: "functional"
        spec: "services/ui/src/components/AuthProviderWrapper.tsx accepts an `initialSession?: Session | null` prop and forwards it to the client AuthProvider."
      - type: "functional"
        spec: "services/ui/src/lib/authContext.tsx accepts an `initialSession` prop on AuthProvider; when provided the provider initialises status as 'authenticated' (or 'unauthenticated' when null) and never reports 'loading' to consumers on first render."
      - type: "functional"
        spec: "services/ui/src/app/auth/login/route.ts and services/ui/src/app/auth/callback/route.ts set response.headers.set('Cache-Control', 'no-store') on every redirect response (success, error, and unreachable-upstream paths)."
    constraints:
      - type: "safety"
        spec: "fetchInitialSession() MUST NOT throw. If core-api is unreachable, the root layout still renders an unauthenticated shell so the user can retry sign-in. The UI must not return 5xx."
      - type: "safety"
        spec: "The cookie value forwarded to core-api MUST come from the request cookies via next/headers and MUST NOT be persisted to any module-level or process-level cache."
      - type: "safety"
        spec: "The AuthProvider MUST still re-fetch the session on the client after hydration so role and density changes made in another tab become visible without a page reload."
    dependencies:
      - "DI-LEO-AI-052"
      - "DI-LEO-AI-129"
      - "DI-LEO-AI-169"
    downstream_impacts:
      - "Every authenticated UI route is now SSR'd per request"
      - "Cold-start latency for the UI Container App now includes one round-trip to core-api /auth/session"
      - "Cloudflare cache-control headers for UI responses change from s-maxage=31536000 to no-store"
    technical_details:
      language: "TypeScript"
      framework: "Next.js 16 App Router + React 18"
      file_structure:
        - "services/ui/src/app/layout.tsx"
        - "services/ui/src/lib/serverSession.ts"
        - "services/ui/src/lib/authContext.tsx"
        - "services/ui/src/components/AuthProviderWrapper.tsx"
        - "services/ui/src/app/auth/login/route.ts"
        - "services/ui/src/app/auth/callback/route.ts"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-210 covers: AuthProvider with initialSession hydrates
      straight into 'authenticated' on the first render; AuthProvider
      with no initialSession reports 'unauthenticated' (never
      'loading') on the first render; the background refetch does not
      regress the status; layout.tsx declares force-dynamic and
      revalidate=0 and calls fetchInitialSession; the auth/login and
      auth/callback route handlers set Cache-Control: no-store.
    test_protocol: "VT-LEO-AI-210"

  safety_class: "B"
  risks:
    - "R-LEO-AI-205"
  tags:
    - "auth"
    - "ssr"
    - "cache"
    - "availability"
    - "deployment"
