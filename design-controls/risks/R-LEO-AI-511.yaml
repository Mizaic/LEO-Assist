# -- R-LEO-AI-511 -- Reduce step introduces loss or hallucinated facts
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-511"
  title: "The SBAR Background reduce step silently loses a clinical fact, or invents a fact, while merging partial Background sections"

  hazard:
    description: >
      The partition + map + reduce flow (DI-LEO-AI-513) for the SBAR
      Background stage introduces a second LLM call (the reduce
      prompt, DI-LEO-AI-521) whose only job is to merge two or more
      partial Background sections into one coherent Background
      section. An LLM in an editor role can still drop a clinical
      fact during deduplication, paraphrase a dose or value in a way
      that changes its meaning, or invent a synthesis sentence that
      adds interpretation not present in any input part. Because the
      reduce step is the last step before the merged Background
      reaches the reviewer, any such loss or invention is
      potentially invisible -- the reviewer sees one polished
      Background and not the N partial inputs.
    category: "clinical_safety"

  hazardous_situation: >
    A QA reviewer triggers an SBAR for a patient whose record
    requires four Background partitions. All four MAP calls succeed.
    The REDUCE call invokes the sbar_background_reduce prompt to
    merge the four partial Backgrounds. The LLM, treating two
    similar-looking medication entries as duplicates, drops one of
    them; or paraphrases a dose ("aspirin 75mg" -> "low-dose
    aspirin"); or adds a synthesis sentence ("the patient's
    cardiovascular risk is increasing") that no input part claimed.
    The reviewer reads the merged Background and shares the SBAR
    without spotting the loss / invention. A clinician acts on the
    summarised Background without going back to the per-record
    source.

  harm:
    description: >
      Wrong clinical decision based on a Background section that
      either misses a relevant medication / encounter / value, or
      contains an invented synthesis the model fabricated. Severity
      is serious because the Background section bounds the safety
      of any downstream Recommendation and can flip the clinical
      picture.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  status: "mitigated"
  status_change_rationale: >
    DI-LEO-AI-522 retires the reduce LLM step entirely in favour of
    pure-Python deterministic stitching under
    "### Part {i} of {N} -- records {a}-{b}" headings. With no LLM
    in the merge path the editor-induced fact-loss and
    fact-invention modes that this risk describes are no longer
    architecturally possible: the only LLM step is the per-part
    Background prompt, which is the same prompt the single-call
    Background uses. The mitigation is therefore "design-removed"
    rather than "controlled".

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        The reduce LLM step has been removed entirely. The SBAR
        Background flow is now partition + map + deterministic
        Python stitch (DI-LEO-AI-522). The merge step is pure
        Python concatenation under
        "### Part {i} of {N} -- records {a}-{b}" headings with one
        "<!-- sources: id1, id2, ... -->" HTML comment per part.
        Because no LLM ever sees more than one part at a time,
        and no LLM is involved in the merge, the editor-induced
        fact-loss and fact-invention failure modes described by
        this risk are architecturally eliminated.
      implemented_by: ["DI-LEO-AI-522"]
      verified_by: ["VT-LEO-AI-520"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Per-part failure containment: a failed MAP call renders as
        a placeholder body that points the reviewer to the errors
        panel, while the surviving parts still land. The
        surviving-part bodies are byte-for-byte the per-part LLM
        output, so the reviewer never sees a synthesised replacement
        for a failed part.
      implemented_by: ["DI-LEO-AI-522"]
      verified_by: ["VT-LEO-AI-520"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        When the Background stage runs in multiple parts, the
        playground renders a "part i of N" Chip on the Background
        stage card while the run is in flight, and the stitched
        markdown carries explicit
        "### Part {i} of {N} -- records {a}-{b}" headings plus a
        plain-English notice ("This patient has a lot of records,
        so we summarised them in N parts. Every record is
        included; nothing was dropped."). Reviewers can therefore
        see at a glance that the displayed Background was
        assembled from multiple LLM calls.
      implemented_by: ["DI-LEO-AI-516"]
      verified_by: ["VT-LEO-AI-520"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        QA reviewer onboarding documentation continues to bound
        the scenario to QA reviewers via the "Test only" banner
        from R-LEO-AI-185. With the reduce step removed there is
        no longer a need to call out "watch for editor-induced
        synthesis"; instead reviewers are reminded that a
        multi-part Background is a structured concatenation of
        per-part summaries and not a synthesised narrative.
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With the reduce LLM step removed (DI-LEO-AI-522) there is no
      longer any LLM in the merge path. The only LLM step is the
      per-part Background prompt, which is the same prompt the
      single-call Background uses and which is verified by the
      existing VT-LEO-AI-189 golden-set tests. The merge is pure
      Python and is verified by VT-LEO-AI-520 to preserve every
      per-part body verbatim under explicit Part i of N headings
      with sources comments. Residual probability is essentially
      zero for the failure mode this risk describes (LLM-induced
      loss/invention during merge); detectability is high because
      the Part i of N structure makes a multi-part summary
      visually obvious to the reviewer.

  monitoring:
    monitoring_plan: >
      VT-LEO-AI-520 enforces (per release) the no-reduce-call
      invariant: the LLM invoker is called exactly once per
      Partition; no second call to a "reduce" prompt is ever made
      (test_no_reduce_call_is_ever_made). The "no record dropped"
      invariant is verified by every partitioner unit test.
      Pipeline worker logs every Background run with the part
      count, per-part status, and stitched output character count
      so post-deployment review can spot regressions in the
      stitch format.
    metrics:
      - "VT-LEO-AI-520 status (must be 'pass' on every release)"
      - "Count of multi-part Background runs per week (exposure signal)"
      - "Count of background_part_failed errors per week (per-part LLM stability signal)"
    review_frequency: "Per release + monthly QA review"

  metadata:
    identified_by: "Design review 2026-04-19 (partition + map + reduce design)"
    identified_date: "2026-04-19"
    status: "analyzed"
    tags:
      - "sbar"
      - "background"
      - "reduce"
      - "hallucination"
      - "loss"
      - "llm-safety"
