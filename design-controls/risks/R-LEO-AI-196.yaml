# -- R-LEO-AI-196 -- Encounter mass-attribution across overlapping episodes
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-196"
  title: "A single encounter is attached to multiple EpisodeOfCare nodes via duplicate IS_PART_OF edges, producing contradictory milestone narratives"

  hazard:
    description: >
      Before DI-LEO-AI-206 the episode builder issued
      IS_PART_OF MERGE for every (anchor, episode) pair
      independently. A single encounter could end up
      linked to two or more episodes as treatment_started,
      first_seen, AND care_obstruction simultaneously,
      producing contradictory milestone narratives and
      inflated edge counts.
    category: "clinical_safety"

  hazardous_situation: >
    A clinical reviewer using the operations queue or
    pathway explorer sees the same encounter cited as
    different milestones across overlapping episodes,
    eroding trust in the queue and making it impossible
    to determine which episode the encounter actually
    belongs to.
    category: "clinical_safety"

  harm:
    description: >
      Reviewer fatigue, loss of trust in milestone
      attribution, potential mis-routing of patients to
      the wrong specialty workflow.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 3
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-206: introduce
        BuildContext.claimed_encounters and
        _filter_unclaimed_link_groups so each non-referral
        encounter attaches to AT MOST one episode within a
        patient build. Referral milestones are protected
        because the referral encounter IS the episode
        identity; multi-episode attribution is legitimate
        for referrals only.
      implemented_by:
        - "DI-LEO-AI-206"
      verified_by:
        - "VT-LEO-AI-199"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The single-claim invariant is enforced before
      _link_encounters_to_episode is called in both
      _build_closed_episode and _build_open_episode, so
      duplicate edges cannot be created within a single
      patient build. claimed_encounters defaults to an
      empty set per patient build to prevent leakage. Unit
      tests cover the four key behaviours including the
      referral protection.

  monitoring:
    monitoring_plan: >
      Track the count of duplicate IS_PART_OF edges (same
      Encounter, multiple EpisodeOfCare) per cohort
      rebuild. Investigate any rebuild that produces a
      non-zero count for non-referral milestones.
    metrics:
      - "Count of Encounter nodes with >1 IS_PART_OF edge to non-referral milestones per rebuild (must be 0)"
      - "Mean IS_PART_OF edges per Encounter per rebuild"
    review_frequency: "Each rebuild"

  metadata:
    identified_by: "Patient 4643293950 investigation -- Pattern F (Dec 2024 home-visit encounter was being attached as treatment_started, first_seen and care_obstruction across four overlapping episodes)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "episode-builder"
      - "encounter-claiming"
      - "patient-4643293950"
