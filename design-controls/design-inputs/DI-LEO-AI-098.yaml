- id: "DI-LEO-AI-098"
  type: "Safety"
  derived_from: ["UN-LEO-AI-049"]
  requirement: >
    The coding pipeline SHALL run a lightweight coding quality LLM check after
    terminology resolution and before persistence. The check SHALL only support
    two actions: drop clearly unsupported coded entities and force ambiguous
    coded entities to human review by applying a tier override marker.
  rationale: >
    Terminology resolution can still produce context-mismatched or ambiguous
    coded entities. A constrained late-stage check reduces false write-back
    while preserving deterministic terminology mapping and avoiding post-hoc
    concept rewriting.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "coding_check subgraph runs in one LLM call with output keys drop and force_review"
      - type: "safety"
        spec: "Coding check never mutates concept_id, preferred term, or lookup_term"
      - type: "functional"
        spec: "force_review applies _tier_override=2 and override reason metadata on entity"
      - type: "functional"
        spec: "PlanDefinition pd-gp-encounter-coding executes coding_check between terminology and tier_classify"
      - type: "functional"
        spec: "Persist step for pd-gp-encounter-coding writes to output_target both"
    constraints:
      - type: "safety"
        spec: "Coding check must be single-turn with no terminology tool loop"
      - type: "safety"
        spec: "Dropped entities must be removed before persistence in patient and knowledge graphs"
    dependencies: ["DI-LEO-AI-097", "DI-LEO-AI-094"]
    downstream_impacts:
      - "libs/pipeline_graph/subgraphs/llm_check.py"
      - "libs/pipeline_graph/registry.py"
      - "libs/prompts/coding_check_v1.py"
      - "scripts/seed_prompt_configs.py"
      - "scripts/seed_plan_definitions.py"
    technical_details:
      language: "Python"
      framework: "LangGraph / LLM client"
      file_structure:
        - "libs/pipeline_graph/subgraphs/llm_check.py"
        - "libs/prompts/coding_check_v1.py"
        - "libs/pipeline_graph/registry.py"
        - "scripts/seed_prompt_configs.py"
        - "scripts/seed_plan_definitions.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-098 passes all critical checks for coding-check parse/apply
      behavior and tier override routing.
    test_protocol: "VT-LEO-AI-098"

  safety_class: "B"
  risks: ["R-LEO-AI-068"]
  tags:
    - "pipeline"
    - "llm-check"
    - "coding-quality"
    - "tier-override"
