# -- R-LEO-AI-193 -- PMHx malignancy mention triggers phantom diagnosis
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-193"
  title: "Malignancy term in 'Past medical history' section is mis-classified as a new diagnosis and falsely closes an open cancer pathway"

  hazard:
    description: >
      The text-anchor classifier may emit a diagnosis
      anchor for any encounter mentioning a malignancy
      term, including PMHx / 'Past medical history' lines
      that are pure historical context without diagnosis
      date, staging, treatment, or MDT discussion. The
      episode builder then closes the open cancer pathway
      as 'completed' against the PMHx encounter.
    category: "clinical_safety"

  hazardous_situation: >
    A clinical reviewer sees an open 2WW pathway falsely
    flagged as 'completed' because a community therapy
    holistic-assessment proforma listed "Bowel cancer."
    under PMHx. Avoidable-delay analysis is silently
    masked.

  harm:
    description: >
      Missed avoidable-delay escalation; phantom 'completed'
      status hides a cancer pathway that has actually
      been blocked or delayed.
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 3
    detectability: 4
    rpn: 48
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-203: text_contains_history_of_cancer now
        recognises malignancy mentions under recognised
        PMHx section headers (Past medical history, PMHx,
        PMH, Background) and returns True so the diagnosis
        anchor is suppressed.
      implemented_by:
        - "DI-LEO-AI-203"
      verified_by:
        - "VT-LEO-AI-196"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The PMHx section regex is line-anchored with a colon
      delimiter so the prefix 'PMH' inside an unrelated
      word cannot trigger. Active-diagnosis cues
      (Diagnosis:, MDT outcome) explicitly remain non-
      history so true diagnoses still classify. Tests
      cover the patient 4643293950 PMHx case plus a short-
      form PMH variant and a true-positive diagnosis
      negative case (VT-LEO-AI-196).

  monitoring:
    monitoring_plan: >
      Track the count of EpisodeOfCare 'completed'
      transitions whose diagnosis evidence is text-only
      (no SNOMED diagnosis code). Investigate any practice
      with a >5% jump per rebuild.
    metrics:
      - "EpisodeOfCare 'completed' transitions whose diagnosis evidence is text-only per rebuild"
      - "Count of diagnosis anchors emitted from encounters that also match _PMHX_SECTION_RX (must be 0)"
    review_frequency: "Each rebuild"

  metadata:
    identified_by: "Patient 4643293950 investigation -- Pattern E (Dec 2024 community-therapy holistic assessment listed 'Bowel cancer.' under PMHx, which the classifier treated as a new diagnosis)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "anchor-detector"
      - "diagnosis-classification"
      - "pmhx"
      - "patient-4643293950"
