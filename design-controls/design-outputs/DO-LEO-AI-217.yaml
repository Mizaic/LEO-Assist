# -- DO-LEO-AI-217 -- POST /training/gold-labels/from-encounter
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-217"
  version: "1.0.0"
  type: "API_Contract"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-220"]
    user_needs: ["UN-LEO-AI-088"]
    risks_addressed: ["R-LEO-AI-206", "R-LEO-AI-207"]
    verification_tests: ["VT-LEO-AI-211"]

  specification:
    title: "Live encounter -> draft GoldLabel seeding endpoint"
    description: |
      New FastAPI endpoint POST /training/gold-labels/from-encounter
      that the shared dialog calls when /care surfaces open the
      editor for a live encounter. The endpoint:

        1. Reads the encounter text + current :DOCUMENTS coded links
           from Neo4j (patient-scoped).
        2. De-identifies the text via libs.utils.deidentify.
        3. Re-anchors each live :DOCUMENTS row onto the de-id text
           using libs.ner.span_finder; rows whose evidence cannot be
           re-anchored are dropped and counted in dropped_link_count.
        4. Maps each surviving link to the gold entity shape used by
           the dialog (snomed_concept_id, snomed_term, semantic_tag,
           assertion, body_site_*).
        5. Upserts a TrainingCandidate keyed by
           sha256(de-identified text) and a draft GoldLabel keyed
           by candidate_id (idempotent on repeated calls).
        6. Returns the full GoldLabel plus baseline_concept_ids
           (the live concept_id set the dialog must echo back on
           the dual-save call).

    acceptance_criteria:
      - criterion: "Patient-scoped, encounter-existence checked"
        type: "safety"
        measurement: "Test"
        target: "require_patient_in_scope dependency present; 404 when encounter missing; 400 when text empty after de-id"
      - criterion: "Idempotent upsert"
        type: "functional"
        measurement: "Test"
        target: "Two POSTs with the same (patient_id, encounter_id) return the same candidate_id and label_id"
      - criterion: "PHI never leaves Neo4j"
        type: "safety"
        measurement: "Test"
        target: "All persisted text is the output of deidentify_text(text, ner=True); raw text is not stored on the candidate or the label"
      - criterion: "Dropped links are accounted"
        type: "functional"
        measurement: "Test"
        target: "Links whose evidence cannot be re-anchored are excluded from gold_label.entities and counted in dropped_link_count"
      - criterion: "Semantic tag normalisation falls back gracefully"
        type: "functional"
        measurement: "Test"
        target: "Unknown semantic tags map to a conservative default NER label rather than failing the request"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "EncounterGoldLabelRequest model, _ner_label_for_semantic_tag, _sanitise_live_links, gold_label_from_encounter endpoint"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 220
      key_functions:
        - "gold_label_from_encounter"
        - "_sanitise_live_links"
        - "_ner_label_for_semantic_tag"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Server-side de-identification before any gold-dataset write"
      - "Canonical baseline_concept_ids that the dual-save endpoint uses for optimistic concurrency"
    risk_control_measures:
      - "Single point of de-identification (server-side)"
      - "Idempotent upsert keyed by sha256(de-id text) prevents duplicate gold rows"
      - "Dropped-link counting ensures lossy re-anchoring is observable to the reviewer"

  verification_status:
    verification_method: "Test"
    verification_complete: true
