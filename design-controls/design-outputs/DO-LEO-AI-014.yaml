    validation_tests: []

  specification:
    title: "Dual Neo4j Database Architecture"
    description: |
      Implements two physically separate Neo4j database instances: one for
      patient and clinical data, one for terminology and reference data.
      This separation ensures that a breach or misconfiguration in the
      terminology layer cannot expose patient-identifiable information,
      and allows independent scaling, backup, and access-control policies
      for each data domain.
    purpose: "Enforces physical separation between patient and terminology data stores to reduce data-breach risk"
    technical_approach: |
      A shared Neo4j client library provides a factory that returns the
      correct driver instance based on a domain enum (PATIENT or TERMINOLOGY).
      Connection strings, credentials, and TLS settings are loaded from
      Azure Key Vault at startup. The API service layer uses a dedicated
      client wrapper that routes queries to the appropriate instance.
    acceptance_criteria:
      - criterion: "Patient data queries never reach the terminology database instance"
        type: "security"
        measurement: "Integration test issues patient-domain query and asserts target URI matches patient instance"
        target: "Zero cross-domain query leaks"
      - criterion: "Terminology queries never reach the patient database instance"
        type: "security"
        measurement: "Integration test issues terminology-domain query and asserts target URI matches terminology instance"
        target: "Zero cross-domain query leaks"
      - criterion: "Connection credentials are sourced from Key Vault, not environment variables"
        type: "security"
        measurement: "Code inspection and integration test confirming Key Vault retrieval"
        target: "No plaintext credentials in config or env"
      - criterion: "Client handles connection failure gracefully with retry"
        type: "functional"
        measurement: "Simulate Neo4j downtime; verify retry and structured error response"
        target: "Three retries with exponential backoff before returning 503"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/neo4j_client/client.py"
        description: "Shared Neo4j client factory with domain-aware connection routing"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/db/neo4j_client.py"
        description: "API-layer Neo4j client wrapper used by service routers"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]

  safety_characteristics:
