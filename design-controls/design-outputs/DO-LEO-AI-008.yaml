# -- DO-LEO-AI-008 -- Quality Checker and KPI Calculator
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-008"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-012", "DI-LEO-AI-013"]
    user_needs: ["UN-LEO-AI-007", "UN-LEO-AI-008"]
    risks_addressed: ["R-LEO-AI-007"]
    verification_tests: ["VT-LEO-AI-008"]
    validation_tests: []

  specification:
    title: "Quality Checker and KPI Calculator"
    description: |
      Evaluates coded and episodic data against quality indicators to
      produce key performance indicators (KPIs) for clinical practice.
      The quality checker validates completeness and correctness of coded
      data. The KPI calculator aggregates results into practice-level and
      clinician-level metrics aligned with QOF and other frameworks.
    purpose: "Measure clinical coding quality and practice performance against recognised quality frameworks"
    technical_approach: "Rule-based quality checks with configurable indicator definitions, followed by aggregation into KPI metrics with denominator/numerator logic"
    acceptance_criteria:
      - criterion: "KPI calculations match manual audit results"
        type: "functional"
        measurement: "Comparison against manually calculated KPIs"
        target: "100% agreement on test dataset"
      - criterion: "Quality check rules cover all configured indicators"
        type: "functional"
        measurement: "Rule coverage audit"
        target: "100% of configured indicators have rules"
      - criterion: "Calculation completes within time limit"
        type: "performance"
        measurement: "Wall-clock timing per practice batch"
        target: "<= 30 seconds per practice"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/quality_checker.py"
        description: "Validates coded data completeness and correctness"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/kpi_calculator.py"
        description: "Aggregates quality results into KPI metrics"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: []

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["KPI numerator/denominator accuracy", "Indicator rule correctness"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Library code in services/analysis_worker; runs inside pipeline-worker container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-012 and DI-LEO-AI-013"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["quality", "kpi", "qof", "analysis"]
    priority: "high"
    complexity: "moderate"
