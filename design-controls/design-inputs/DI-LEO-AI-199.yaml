# -- DI-LEO-AI-199 -- Dry-run row 'Open in gold editor' button + GoldDataset deep-link
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-199"
  type: "Usability"
  derived_from:
    - "UN-LEO-AI-084"
  requirement: >
    Every dry-run result row in
    services/ui/src/components/console/EvaluateStage.tsx (both the
    NER-only and full-pipeline blocks) SHALL render an
    aria-labelled IconButton 'Open in gold editor' next to the
    entity-count badge. The handler SHALL POST the encounter text
    and the row's entity list to /api/training/candidates/from-dry-run,
    SHALL surface failures via the existing setError Alert, and on
    success SHALL navigate to
    /admin/gold-dataset?labelId={returned label_id}&from=dry_run.
    services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx
    SHALL read useSearchParams(), SHALL switch the active tab to
    'candidates' when from=dry_run, SHALL try in-memory items first
    and fall back to fetchGoldLabel(labelId), SHALL set
    selectedItem to the resolved record so GoldLabelDetailDialog
    opens, and SHALL call router.replace to clear the labelId query
    param after handling so a refresh does not re-open the dialog.
  rationale: >
    A per-row IconButton keeps the page-level primary action
    unchanged (one primary per page; ToolbarActions still owns it).
    Re-using the existing GoldLabelDetailDialog opening path
    (selectedItem state + fetchGoldLabel fallback) avoids a second
    code path through the dialog and inherits all of its
    correction, suggestion, and mark-gold behaviour. Switching to
    the Candidates tab on from=dry_run lines the reviewer's mental
    model up with the workflow ('I am editing a draft candidate
    that came from a dry-run error').

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "EvaluateStage.tsx imports IconButton and EditNoteIcon and renders an IconButton with aria-label='Open in gold editor' inside both the NER-only result row header and the full-pipeline result row header"
      - type: "functional"
        spec: "openInGoldEditor calls fetchWithTimeout('/api/training/candidates/from-dry-run', ...) with body {encounter_text, entities, source_hint}; on res.ok with a label_id calls router.push(/admin/gold-dataset?labelId=...&from=dry_run)"
      - type: "safety"
        spec: "The IconButton is disabled while the request is in flight (openingGoldEditor === row.encounter_id) and when the row has no encounter text"
      - type: "safety"
        spec: "API failures are surfaced via setError; a missing label_id in the response is treated as a failure"
      - type: "functional"
        spec: "GoldDatasetPanel.tsx imports usePathname, useRouter, useSearchParams from next/navigation"
      - type: "functional"
        spec: "When useSearchParams().get('from') === 'dry_run', GoldDatasetPanel sets the active tab to 'candidates' (setTab('candidates'))"
      - type: "functional"
        spec: "When useSearchParams().get('labelId') is set, GoldDatasetPanel resolves it via items.find or fetchGoldLabel and calls setSelectedItem(record)"
      - type: "functional"
        spec: "After resolving the deep link, GoldDatasetPanel calls router.replace(pathname, { scroll: false }) to clear the query param"
      - type: "safety"
        spec: "A handledDeepLinkRef guard ensures the deep-link effect runs at most once per labelId so the dialog cannot re-open after the user closes it"
      - type: "functional"
        spec: "/gold-dataset/page.tsx wraps GoldDatasetPanel in <Suspense> so useSearchParams stays compatible with the Next.js app router"
    constraints:
      - type: "safety"
        spec: "All copy is plain English at reading age 9-11 (label 'Open in gold editor', tooltip 'Open this encounter in the gold editor to fix labels and add to gold training data.')"
      - type: "safety"
        spec: "EvaluateStage.tsx file size remains within the project hard limit; new logic introduces no native dialogs or window.confirm calls"
    dependencies:
      - "DI-LEO-AI-198"
    downstream_impacts:
      - "services/ui/src/components/console/EvaluateStage.tsx"
      - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      - "services/ui/src/app/gold-dataset/page.tsx"
    technical_details:
      language: "TypeScript"
      framework: "React + Next.js app router + MUI"
      file_structure:
        - "services/ui/src/components/console/EvaluateStage.tsx"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        - "services/ui/src/app/gold-dataset/page.tsx"
      estimated_loc: 110

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-192 is a static-source jest VT pinning: presence of
      the IconButton and aria-label in both EvaluateStage row
      blocks, the POST to /api/training/candidates/from-dry-run,
      the deep-link push, the useSearchParams plumbing in
      GoldDatasetPanel, and the Suspense wrapper on the page.
    test_protocol: "VT-LEO-AI-192"

  safety_class: "B"
  risks:
    - "R-LEO-AI-189"
  tags:
    - "training-data-quality"
    - "ner-accuracy"
    - "ui-action"
    - "gold-dataset"
