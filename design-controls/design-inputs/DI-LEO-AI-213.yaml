  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-205 passes all critical static-source and
      live-render cases for the overlay-first navigation rework:
      scope chips and accordions removed, Coded-only and Search
      retained, In-episode chip on linked cards, default brush
      initialised to the padded episode-linked window, tightened
      episode band, per-encounter linked tick markers, milestone
      markers (with accessible label and keyboard activation), the
      flat encounter list driven by the brush, EncounterTextTab.tsx
      remains <= 500 LOC.
    test_protocol: "VT-LEO-AI-205"

  safety_class: "B"
  risks: ["R-LEO-AI-174"]
  tags: ["mission-control", "patient-detail", "encounter-text", "navigation", "ui", "framer-motion", "accessibility"]
