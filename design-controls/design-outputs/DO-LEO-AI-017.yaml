- id: "DO-LEO-AI-017"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-027"]
    user_needs: ["UN-LEO-AI-019"]
    risks_addressed: []
    verification_tests: ["VT-LEO-AI-017"]
    validation_tests: []

  specification:
    title: "Analytics Dashboard Service"
    description: |
      An API layer that serves aggregated metrics, key performance indicators,
      deprivation-index breakdowns, benchmark comparisons, and cohort
      summaries to the front-end dashboard. Each router handles a specific
      analytics domain and queries the patient Neo4j instance for real-time
      or cached results.
    purpose: "API layer serving aggregated metrics and analytics data for practice and PCN dashboards"
    technical_approach: |
      Dedicated FastAPI routers expose endpoints for dashboard KPIs, IMD
      (Index of Multiple Deprivation) analysis, benchmark data, and cohort
      breakdowns. Cypher queries aggregate graph data and the results are
      cached in Redis with configurable TTLs. Responses use Pydantic models
      that the front-end consumes directly.
    acceptance_criteria:
      - criterion: "Dashboard endpoint returns correct KPI values for a known dataset"
        type: "functional"
        measurement: "Integration test with seeded Neo4j data compared to expected KPIs"
        target: "All KPIs match expected values within rounding tolerance"
      - criterion: "IMD endpoint returns deprivation quintile breakdowns"
        type: "functional"
        measurement: "Unit test verifies quintile grouping logic"
        target: "Correct quintile assignment for all test postcodes"
      - criterion: "Cached responses are returned within target latency"
        type: "performance"
        measurement: "Response time for cached dashboard endpoint"
        target: "<200ms p95 for cached responses"
      - criterion: "Endpoints require valid authentication"
        type: "security"
        measurement: "Request without token returns 401"
        target: "All unauthenticated requests rejected"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/dashboards.py"
        description: "Dashboard KPI endpoints"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/imd.py"
        description: "Index of Multiple Deprivation analysis endpoints"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/benchmarks.py"
        description: "Benchmark comparison endpoints"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/cohorts.py"
        description: "Cohort summary and breakdown endpoints"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
