        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/panel/ConditionRuleBuilder.tsx"
        description: >
          Existing primitive (no changes), now reachable from the wizard.
        storage_location: "git"
    technical_details:
