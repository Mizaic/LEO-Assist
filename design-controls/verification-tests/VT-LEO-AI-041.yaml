# -- VT-LEO-AI-041 -- LLM Interpretation Service Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml
#
# Status: pending — DI-014 (LLM Interpretation Service) is currently unimplemented.
# The stub router (services/api/app/routers/agent.py) was removed on 2026-03-03
# because it returned fabricated data in a regulated system. This VT defines the
# acceptance criteria that must be met before the real implementation is admitted.

- id: "VT-LEO-AI-041"
  version: "1.0"
  status: "pending"

  traceability:
    design_inputs: ["DI-LEO-AI-014"]
    risks: ["R-LEO-AI-011", "R-LEO-AI-014"]
    user_needs: ["UN-LEO-AI-009"]

  metadata:
    title: "LLM Interpretation Service Verification"
    description: >
      Verifies that the LLM Interpretation Service generates plain-language narrative
      interpretations of clinical episode timelines at reading age 9-11 years
      (Flesch-Kincaid grade <= 6), flags interpretation confidence level on every output,
      and never includes diagnostic or treatment recommendations. Tests cover both
      OpenAI and Bedrock provider paths. Note: the stub endpoints (POST /agent/interpret,
      POST /agent/executive-summary) were removed on 2026-03-03 — this VT gates the
      real implementation before it may be re-admitted.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "planned"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_interpretation_service.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-03"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "LLM provider configured (OpenAI or Bedrock) — mocked in CI"
      - "Prompt registry (libs/prompts/registry.py) loaded with interpretation templates"
    test_data:
      data_type: "fixture"
      cleanup_required: false

  test_cases:
    - case_id: "VT-041-TC-001"
      case_name: "Generated interpretation meets Flesch-Kincaid grade <= 6"
      priority: "critical"
      preconditions:
        - "InterpretationService instantiated with mocked LLM client"
        - "Synthetic episode fixture with referral, diagnosis, and treatment milestones"
      test_steps:
        - step_number: 1
          action: "Call interpret(episode) with a mocked LLM response containing plain-language text"
          expected_result: "Returned interpretation text has Flesch-Kincaid grade level <= 6"
          verification_method: "Assert textstat.flesch_kincaid_grade(text) <= 6"
        - step_number: 2
          action: "Call interpret(episode) with a mocked LLM response containing complex clinical language"
          expected_result: "validate_output() raises or returns False for grade > 6"
          verification_method: "Assert validate_output raises ValueError or returns validation failure"
      acceptance_criteria:
        - "Flesch-Kincaid grade <= 6 enforced by validate_output() on every generated interpretation"
        - "High-grade text is rejected before being returned to the caller"

    - case_id: "VT-041-TC-002"
      case_name: "Confidence level flagged on every interpretation"
      priority: "critical"
      preconditions:
        - "InterpretationService instantiated with mocked LLM client"
      test_steps:
        - step_number: 1
          action: "Call interpret(episode) and inspect returned object"
          expected_result: "Returned object contains a confidence_level field with value 'high', 'medium', or 'low'"
          verification_method: "Assert result.confidence_level in {'high', 'medium', 'low'}"
        - step_number: 2
          action: "Call assess_confidence() with a low-token-count LLM response"
          expected_result: "Confidence level is 'low' for sparse responses"
          verification_method: "Assert assess_confidence(sparse_response) == 'low'"
      acceptance_criteria:
        - "Every interpretation result carries a non-null confidence_level"
        - "assess_confidence() produces calibrated low/medium/high ratings"

    - case_id: "VT-041-TC-003"
      case_name: "No diagnostic or treatment recommendations in output"
      priority: "critical"
      preconditions:
        - "InterpretationService instantiated with mocked LLM client"
        - "Mocked LLM response contains recommendation-like phrases ('you should', 'recommend', 'prescribe')"
      test_steps:
        - step_number: 1
          action: "Call validate_output() with text containing diagnostic recommendations"
          expected_result: "validate_output() detects prohibited content and raises or returns failure"
          verification_method: "Assert validate_output raises ValueError containing 'recommendation' or 'prohibited'"
        - step_number: 2
          action: "Call validate_output() with compliant plain-language text"
          expected_result: "validate_output() returns True or passes without exception"
          verification_method: "Assert no exception raised and return value is truthy"
      acceptance_criteria:
        - "Prohibited phrases ('you should', 'we recommend', 'prescribe', 'diagnose') are rejected by the output validator"
        - "Compliant interpretations pass validation"

    - case_id: "VT-041-TC-004"
      case_name: "AI-generated marker present on all outputs"
      priority: "high"
      preconditions:
        - "InterpretationService returning a result via interpret()"
      test_steps:
        - step_number: 1
          action: "Inspect the returned interpretation object's metadata"
          expected_result: "Object contains generated_by='ai' or equivalent marker and requires_human_review=True"
          verification_method: "Assert result.generated_by == 'ai' and result.requires_human_review is True"
      acceptance_criteria:
        - "Every interpretation is flagged as AI-generated and requiring human review (DI-014 safety constraint)"

    - case_id: "VT-041-TC-005"
      case_name: "Inspection: prompt templates reviewed for safety and bias"
      priority: "high"
      automation_status: "inspection"
      preconditions:
        - "libs/prompts/registry.py contains interpretation prompt templates"
      test_steps:
        - step_number: 1
          action: "Review all interpretation prompt templates in libs/prompts/registry.py"
          expected_result: "No prompts contain leading phrases that could produce diagnostic recommendations"
          verification_method: "Code and prompt inspection — record findings in evidence bundle"
        - step_number: 2
          action: "Review prompts for demographic bias triggers (age, sex, ethnicity references)"
          expected_result: "Prompts are neutral — no demographic comparisons in generated text"
          verification_method: "Inspection — record finding in evidence bundle"
      acceptance_criteria:
        - "All interpretation prompts approved by a clinical reviewer before implementation goes live"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage", "inspection_record"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-041/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-041-EXEC-000"
      date: "2026-03-03"
      executor: "quality_engineer"
      environment: "planning"
      result: "pending"
      cases_executed: 0
      cases_passed: 0
      cases_failed: 0
      duration_seconds: 0
      notes: "VT created to provide correct coverage for DI-LEO-AI-014. Stub implementation (agent.py) removed. Test file tests/test_interpretation_service.py to be created when InterpretationService is implemented."
