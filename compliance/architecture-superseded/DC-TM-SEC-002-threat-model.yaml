# =============================================================================
# DC-TM-SEC-002 — Security Threat Model (Revision 2)
# Primary Care Clinical Pathway Audit Platform
# =============================================================================
#
# Document ID:    DC-TM-SEC-002
# Version:        2.0.0
# Status:         Draft
# Date:           2026-03-03
# Supersedes:     DC-TM-SEC-001 v1.0.0 (2026-03-01)
# Standard:       IEC 81001-5-1:2021, ISO 14971:2019 (via AAMI TIR57)
# Classification: QMS — Design Controls
#
# Regulatory scope:
#   - UK Medical Devices Regulations 2002 (as amended) — UKCA Class I
#   - ISO 13485:2016 — Quality Management System
#   - IEC 62304:2006/AMD1:2015 — Software Lifecycle Processes
#   - IEC 81001-5-1:2021 — Health Software Security Lifecycle
#   - ISO 14971:2019 — Risk Management
#   - UK GDPR / Data Protection Act 2018 — Article 9 special category data
#   - NHS Data Security and Protection Toolkit (DSPT)
#   - NCSC Secure by Design Principles
#   - NCSC Cyber Assessment Framework (CAF)
#
# System classification:
#   IEC 62304 Software Safety Class: B (per DC-SC-001)
#   Data classification: Clinical (special category), PII, Operational
#   Deployment: Cloud-hosted SaaS, multi-tenant NHS trust access
#
# Cross-references:
#   - DC-SC-001  Software Safety Classification
#   - DC-RM-001  Risk Management
#   - DC-SOUP-001 SOUP List
#   - DC-TM-SEC-001 (predecessor)
#
# Change summary (v1 → v2):
#   - GAP-001 resolved: X-User-Email header and ?email= removed; session-only identity
#   - GAP-003 partially resolved: model registry mutating routes require platform admin
#   - GAP-005 resolved: COOKIE_SECURE configurable, defaults to true
#   - GAP-006 resolved: slowapi rate limiting added
#   - GAP-007 resolved: SERVICE_AUTH_SECRET shared-secret inter-service auth
#   - GAP-009 partially resolved: X-Requested-With header required for mutations
#   - GAP-010 resolved: OAuth nonce cookie for CSRF protection
#   - GAP-011 partially resolved: SESSION_TTL_HOURS configurable (12-24h in prod/val)
#   - GAP-013 resolved: ALLOWED_ORIGINS configurable via environment
#   - New component: Dual-model consensus engine (AWS + Azure + arbitrator)
#   - New component: Disorder verifier (clinical entity classification via LLM)
#   - New component: Context engine (medspaCy ConText assertion detection)
#   - New component: Tier classifier (auto-code vs HITL routing)
#   - New component: CodingDecision audit trail (Neo4j)
#   - New component: Context rules CRUD (user-configurable ConText rules)
#   - New component: Post-processor rules (regex-based entity suppression)
#   - New component: Patient coding timeline (UI)
#   - Session store hardened: Redis required (503 on failure, no in-memory fallback)
#   - ACA infrastructure: mTLS peer encryption, Key Vault secret references
# =============================================================================

system_context:
  product: "Primary Care Clinical Pathway Audit Platform"
  iec_62304_class: "B"
  data_classifications:
    - "Clinical (UK GDPR Article 9 special category)"
    - "PII (NHS patient records)"
    - "Operational (system configuration, model artifacts)"
  deployment: >
    Azure Container Apps (ACA) per-environment (leo-ai-dev, leo-ai-val, leo-ai-prod).
    Shared ACR (leo-ai RG). Neo4j Aura (external). Azure Managed Redis (per-env).
    Azure Service Bus Standard (per-env). AWS Bedrock. Azure OpenAI (per-env).
    All secrets in Azure Key Vault (per-env). All services use a single
    user-assigned Managed Identity per environment. ACA peer traffic encryption
    (mTLS) enabled. Distroless runtime images. Non-root containers.

  trust_zones:
    - id: ZONE_A
      name: "Internet"
      services: [core-api, ui]
      ingress: external
      controls: [TLS 1.3, Entra ID OAuth, cookie session, nonce CSRF, XHR mutation guard, slowapi rate limiting]
    - id: ZONE_B
      name: "ACA internal network"
      services: [terminology-api, fhir-api, analytics-api, model-inference, training-worker, pipeline-worker]
      ingress: internal
      controls: [ACA mTLS peer-traffic-encryption, SERVICE_AUTH_SECRET Bearer token, Managed Identity service token]
    - id: ZONE_C
      name: "Azure PaaS"
      services: [Key Vault, Service Bus, Blob Storage, Redis, Azure OpenAI]
      controls: [Managed Identity, RBAC, TLS 1.2+]
    - id: ZONE_D
      name: "External SaaS"
      services: [Neo4j Aura, AWS Bedrock]
      controls: [TLS 1.3, Bolt+TLS, IAM key]

  services:
    - {name: "core-api", port: 8000, exposure: "external", framework: "FastAPI 0.115+", trust_zone: "ZONE_A/ZONE_B"}
    - {name: "terminology-api", port: 8001, exposure: "internal", framework: "FastAPI", trust_zone: "ZONE_B"}
    - {name: "fhir-api", port: 8002, exposure: "internal", framework: "FastAPI", trust_zone: "ZONE_B"}
    - {name: "analytics-api", port: 8003, exposure: "internal", framework: "FastAPI", trust_zone: "ZONE_B"}
    - {name: "model-inference", port: 8004, exposure: "internal", framework: "FastAPI", trust_zone: "ZONE_B"}
    - {name: "training-worker", port: 8005, exposure: "internal", framework: "FastAPI", trust_zone: "ZONE_B"}
    - {name: "pipeline-worker", port: 8006, exposure: "internal", framework: "FastAPI + Service Bus consumer", trust_zone: "ZONE_B"}
    - {name: "ui", port: 3000, exposure: "external", framework: "Next.js 16", trust_zone: "ZONE_A"}

  data_stores:
    - {name: "Neo4j Patient Graph", type: "graph database", data: "Patient, Encounter, clinical text, review tasks, CodingDecision audit, ContextRule, PostProcessorRule", trust_zone: "ZONE_D"}
    - {name: "Neo4j Knowledge Graph", type: "graph database", data: "SNOMED terminology, FHIR resources, SurfaceForm mappings", trust_zone: "ZONE_D"}
    - {name: "Azure Managed Redis", type: "key-value", data: "OAuth sessions, pipeline progress, LLM cache, checkpoints", trust_zone: "ZONE_C", note: "Managed Identity + rediss:// URL; session store requires Redis (503 on failure)"}

  external_services:
    - {name: "Azure AD v2.0", purpose: "OAuth authentication"}
    - {name: "AWS Bedrock", purpose: "Primary LLM (Claude Haiku, Sonnet, Opus)", data_sent: "de-identified clinical text, entity text"}
    - {name: "Azure OpenAI", purpose: "Secondary LLM (GPT-5 mini)", data_sent: "de-identified clinical text, entity text"}
    - {name: "Azure Blob Storage (leoaimodels)", purpose: "NER model artifact storage", trust_zone: "ZONE_C"}
    - {name: "Azure Service Bus", purpose: "Async job messaging (pipeline-jobs, analysis-jobs queues)", trust_zone: "ZONE_C"}
    - {name: "Azure Key Vault", purpose: "Centralised secret management (per-env)", trust_zone: "ZONE_C"}
    - {name: "Azure Container Registry (leoaicr)", purpose: "Docker image registry (shared, leo-ai RG)", trust_zone: "ZONE_C"}

  aca_threat_reclassifications:
    - id: T-ACA-001
      description: "ACA internal network lateral movement"
      pre_aca_risk: HIGH
      post_aca_risk: LOW
      controls: ["ACA internal-ingress (no external DNS)", "ACA mTLS peer encryption", "SERVICE_AUTH_SECRET Bearer token (GAP-007 resolved)", "Managed Identity service token"]
    - id: T-ACA-002
      description: "Container image supply chain attack"
      pre_aca_risk: MEDIUM
      post_aca_risk: LOW
      controls: ["Distroless runtime images (no shell, no apt)", "Multi-stage builds (build tools stripped)", "Non-root appuser", "ACR with Managed Identity pull (no admin credentials)"]
    - id: T-ACA-003
      description: "Secret exfiltration via environment variables or .env files"
      pre_aca_risk: HIGH
      post_aca_risk: LOW
      controls: ["Azure Key Vault secret references (secrets never in plain env config)", "Managed Identity (no connection strings in code)", "Distroless images (no shell to exec-into)", "Non-root containers"]

# =============================================================================
# PHASE 1–2: COMPONENT ANALYSIS AND THREATS
# =============================================================================

# ---------------------------------------------------------------------------
# COMPONENT 1: AUTH SUBSYSTEM
# ---------------------------------------------------------------------------
component_1_auth:
  name: "Auth Subsystem"
  purpose: "OAuth 2.0 authentication via Azure AD, session management, org-scoped authorization"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "Internet → Core API (OAuth flow)"
    - "Core API → Redis (session storage)"
    - "Core API → Neo4j (org scope resolution)"
    - "Core API → Analytics API (org context fetch)"
  data_assets: "PII (email, name, org), Azure AD access tokens, session IDs"
  network_exposure: "Public"
  authentication_context: "Azure AD OAuth 2.0 authorization code flow"

  phase_1_reconnaissance:
    entry_points:
      - id: "AUTH-EP-001"
        type: "HTTP GET"
        path: "/auth/login"
        file: "services/api/app/routers/auth.py"
        line: 85
        authentication: "none"
        description: "Initiates OAuth flow; generates nonce cookie; redirects to Azure AD"
      - id: "AUTH-EP-002"
        type: "HTTP GET"
        path: "/auth/callback"
        file: "services/api/app/routers/auth.py"
        line: 117
        authentication: "none (OAuth callback); nonce cookie validated"
        description: "Handles OAuth code exchange, validates nonce, creates session"
      - id: "AUTH-EP-003"
        type: "HTTP POST"
        path: "/auth/logout"
        file: "services/api/app/routers/auth.py"
        line: 257
        authentication: "session cookie"
        description: "Clears session and cookie"
      - id: "AUTH-EP-004"
        type: "HTTP GET"
        path: "/auth/session"
        file: "services/api/app/routers/auth.py"
        line: 268
        authentication: "session cookie (optional)"
        description: "Returns current user info; returns null user if unauthenticated"
      - id: "AUTH-EP-005"
        type: "FastAPI dependency"
        path: "get_caller_scope_from_request"
        file: "services/api/app/deps.py"
        line: 42
        authentication: "session cookie only (GAP-001 resolved)"
        description: "Resolves caller identity and org scope from authenticated session"

    data_flows:
      - id: "AUTH-DF-001"
        description: "OAuth authorization code flow"
        source: "Browser"
        steps:
          - "Browser → /auth/login → generates nonce, sets leo_oauth_nonce cookie → 302 redirect to Azure AD"
          - "Azure AD → /auth/callback with ?code= (cleartext over HTTPS)"
          - "Callback validates nonce cookie is present (CSRF check)"
          - "Core API → Azure AD token endpoint (HTTPS POST with client_secret)"
          - "Azure AD → access_token + id_token (JWT, cleartext in memory)"
          - "Core API verifies id_token via JWKS (jose.jwt.decode RS256 — GAP-002 resolved 2026-03-03)"
          - "Core API checks MFA claim (amr) when require_mfa=True in SystemConfig"
          - "Core API → Analytics API GET /analytics/auth/org-context (org/admin enrichment)"
          - "Core API → Redis SET auth:session:{session_id} (JSON with access_token)"
          - "Core API → Browser SET-COOKIE leo_session={session_id} (httponly, samesite=lax, secure=COOKIE_SECURE env)"
        encryption_transit: "HTTPS to Azure AD; inter-service depends on ACA mTLS + SERVICE_AUTH_SECRET"
        encryption_rest: "Redis — Azure Managed Redis with TLS"
        crosses_trust_boundary: true
        clinical_decision_pathway: false

      - id: "AUTH-DF-002"
        description: "Org scope resolution"
        source: "Any authenticated request"
        steps:
          - "Request arrives with leo_session cookie"
          - "get_caller_scope_from_request loads session from Redis"
          - "Email extracted from server-side session data (not from headers — GAP-001 resolved)"
          - "PatientGraphClient opens Neo4j session"
          - "Cypher query: MATCH (pr:Practitioner {email: $email})"
          - "Expands org hierarchy: GPPractice → ICB → CancerAlliance"
          - "Returns CallerScope(email, is_admin, org_ids)"
        encryption_transit: "bolt+s:// to Neo4j Aura (TLS 1.3)"
        encryption_rest: "Neo4j Aura encrypts at rest"
        crosses_trust_boundary: true
        clinical_decision_pathway: false

    trust_boundary_analysis:
      - boundary: "Internet → Core API (OAuth callback)"
        authentication_present: "yes — OAuth authorization code + nonce cookie"
        authentication_citation: "services/api/app/routers/auth.py:117-254"
        authorisation_enforcement: "no — callback is open, relies on Azure AD code validity"
        input_validation:
          code_parameter: "checked for presence (line 129) but not validated beyond exchange"
          nonce_cookie: "validated present (line 133); missing nonce → redirect with csrf_nonce_missing error"
          error_parameter: "reflected to frontend URL (line 128)"
          state_parameter: "normalized; must start with '/'; restricted redirect targets (line 239-241)"

      - boundary: "Core API → Redis (session store)"
        authentication_present: "yes — Redis URL via Managed Identity (Azure Managed Redis)"
        authentication_citation: "services/api/app/services/session_store.py:33-70"
        authorisation_enforcement: "no — any process with Redis URL has full access"
        input_validation: "session_id is cryptographically random (secrets.token_urlsafe(32), line 92)"

      - boundary: "Caller identity resolution"
        authentication_present: "yes — session cookie validated against Redis"
        authentication_citation: "services/api/app/deps.py:42-73"
        authorisation_enforcement: "yes — org scope restricts data visibility"
        authorisation_citation: "libs/auth/org_scope.py:65-135, 220-242"
        input_validation: "email extracted from server-side session (no user-controllable identity input)"

    secrets_usage:
      - secret: "AZURE_AD_CLIENT_SECRET"
        storage: "environment variable (Key Vault reference in ACA)"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:32"]

      - secret: "AZURE_AD_CLIENT_ID"
        storage: "environment variable (Key Vault reference)"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:31"]

      - secret: "AZURE_AD_TENANT_ID"
        storage: "environment variable (Key Vault reference)"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:30"]

      - secret: "Session ID (leo_session cookie)"
        storage: "browser cookie + Redis key"
        rotation_evidence: "none — no rotation on use; configurable TTL (12-24h in prod/val)"
        scope: ["services/api/app/services/session_store.py:21-23"]

      - secret: "Azure AD access_token"
        storage: "Redis (auth:session:{session_id} JSON field)"
        rotation_evidence: "none — token stored at login, never refreshed"
        scope: ["services/api/app/routers/auth.py:226-237"]

      - secret: "OAuth nonce (leo_oauth_nonce cookie)"
        storage: "browser cookie"
        rotation_evidence: "per-login; 600s max_age"
        scope: ["services/api/app/routers/auth.py:91,105-113"]

    existing_controls:
      - control: "Cryptographically random session IDs"
        citation: "services/api/app/services/session_store.py:91-92"
        description: "secrets.token_urlsafe(32) — 256 bits of entropy"
      - control: "HttpOnly cookie"
        citation: "services/api/app/routers/auth.py:248"
        description: "Session cookie inaccessible to JavaScript"
      - control: "SameSite=lax cookie"
        citation: "services/api/app/routers/auth.py:250"
        description: "Mitigates cross-site POST CSRF"
      - control: "Secure cookie flag (configurable)"
        citation: "services/api/app/routers/auth.py:244,249"
        description: "COOKIE_SECURE env var; defaults to true; all deployed envs set to true"
      - control: "v2.0 token enforcement"
        citation: "services/api/app/routers/auth.py:160-178"
        description: "Rejects Azure AD v1.0 tokens (sts.windows.net issuer)"
      - control: "OAuth nonce cookie (CSRF)"
        citation: "services/api/app/routers/auth.py:91,105-113,133-136"
        description: "Cryptographic nonce set at /login, validated at /callback (GAP-010)"
      - control: "MFA enforcement"
        citation: "services/api/app/routers/auth.py:210-223"
        description: "App-level MFA backstop; checks amr claim for 'mfa' when require_mfa=True in SystemConfig"
      - control: "Session-only identity (GAP-001)"
        citation: "services/api/app/deps.py:42-73"
        description: "X-User-Email header and ?email= query param removed; identity from session only"
      - control: "Configurable session TTL"
        citation: "services/api/app/services/session_store.py:21-22"
        description: "SESSION_TTL_HOURS env var; 12h in dev/val, 24h in prod (down from 168h default)"
      - control: "Redis required for sessions"
        citation: "services/api/app/services/session_store.py:95-100"
        description: "Session store raises 503 if Redis unavailable (no in-memory fallback)"
      - control: "Org-scoped data access"
        citation: "libs/auth/org_scope.py:65-135"
        description: "Non-admin users restricted to their org hierarchy"
      - control: "Patient-in-scope check"
        citation: "libs/auth/org_scope.py:220-242"
        description: "Verifies patient GP is within caller's org_ids"
      - control: "Rate limiting"
        citation: "services/api/app/main.py:33,91-92"
        description: "slowapi Limiter with per-IP rate limiting"
      - control: "XHR mutation guard (CSRF)"
        citation: "services/api/app/main.py:124-140"
        description: "X-Requested-With: XMLHttpRequest required for POST/PUT/PATCH/DELETE"

  phase_2_threats:
    - id: "AUTH-S-001"
      element: "libs/auth/org_scope.py:196-217"
      threat: "Identity spoofing via X-User-Email header"
      status: "RESOLVED in v2"
      resolution: >
        X-User-Email header and ?email= query parameter removed from
        get_caller_scope (libs/auth/org_scope.py:196-217) and
        get_caller_scope_from_request (services/api/app/deps.py:42-73).
        Identity is now derived solely from the server-side session cookie.
        The get_caller_scope function now accepts only X-Leo-Session header
        (for internal service-to-service calls) and validates it against Redis.
      resolution_date: "2026-03-02"
      resolution_files:
        - "libs/auth/org_scope.py"
        - "services/api/app/deps.py"
        - "services/api/app/main.py"
      residual_risk: >
        X-Leo-Session header is accepted by get_caller_scope for internal
        service-to-service calls. An attacker with network access to an internal
        service could forge this header, but this requires breaching ACA internal
        network + SERVICE_AUTH_SECRET (GAP-007 resolved).
      original_severity: "Critical"
      residual_severity: "Low"

    - id: "AUTH-S-002"
      element: "services/api/app/deps.py"
      threat: "Identity spoofing via email query parameter"
      status: "RESOLVED in v2"
      resolution: >
        The ?email= query parameter is no longer accepted.
        get_caller_scope_from_request reads email from session data only.
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/deps.py"]
      original_severity: "Critical"
      residual_severity: "Closed"

    - id: "AUTH-T-001"
      element: "services/api/app/routers/auth.py:164-178"
      threat: "Token tampering — no JWT signature verification"
      status: "OPEN"
      attack_vector: "Attacker intercepts or forges a JWT with valid-looking claims (correct email, tenant, issuer) but invalid signature. The callback handler decodes it via base64 without verifying against Azure AD JWKS."
      prerequisites: "Ability to inject a forged JWT into the token exchange response (MITM on token endpoint) or forge a token that Azure AD returns"
      threat_actors: ["external_targeted", "supply_chain"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 167
        snippet: "payload_b64 = token.split('.')[1]"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "The token exchange happens over HTTPS to Azure AD, making MITM difficult. However, the absence of signature verification means any code path that processes existing tokens is vulnerable. The stored access_token in Redis is never re-validated."
      existing_controls: "HTTPS to Azure AD token endpoint; v2.0 issuer check; nonce cookie CSRF"
      gaps: "No JWKS-based cryptographic signature verification of id_token or access_token. python-jose[cryptography] is in requirements but not used for token validation."
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.3"
          nature: "Cryptographic verification of authentication tokens not implemented"
        - standard: "NCSC CAF"
          clause: "B2.a"
          nature: "Identity verification does not use cryptographic methods"

    - id: "AUTH-T-002"
      element: "services/api/app/routers/auth.py:85-114"
      threat: "OAuth state parameter tampering — open redirect"
      status: "RESOLVED in v2"
      resolution: >
        Nonce cookie (leo_oauth_nonce) set at /login, validated at /callback.
        State parameter redirect targets restricted: /sign-in and /auth/callback
        redirect to /dashboard. State must start with '/'.
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/routers/auth.py"]
      original_severity: "Medium"
      residual_severity: "Low"
      residual_risk: "Path-based phishing within the frontend domain remains theoretically possible but nonce prevents CSRF-style attacks."

    - id: "AUTH-R-001"
      element: "services/api/app/routers/auth.py"
      threat: "Repudiation — no audit trail for authentication events"
      status: "OPEN"
      attack_vector: "Attacker authenticates, performs malicious actions, and there is no durable audit log of when sessions were created, by whom, or when they expired."
      prerequisites: "Valid or spoofed identity"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 226
        snippet: "save_session(session_id, {...})"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "Low"
        patient_data_exposure: false
      likelihood: "Medium"
      likelihood_rationale: "Authentication events are logged via Python logging (logger.info/warning) but not persisted to a durable audit store. Log retention depends on infrastructure configuration."
      existing_controls: "Python logging captures auth events; ACA container logs routed to Azure Monitor"
      gaps: "No durable, tamper-evident audit log for authentication events. No session creation/destruction events written to a persistent store."
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 62304"
          clause: "5.2"
          nature: "Insufficient audit trail for security-relevant events"
        - standard: "IEC 81001-5-1"
          clause: "5.4.2"
          nature: "Security event logging not persisted to durable store"

    - id: "AUTH-I-001"
      element: "services/api/app/routers/auth.py:244-249"
      threat: "Session cookie transmitted over HTTP (secure=False)"
      status: "RESOLVED in v2"
      resolution: >
        COOKIE_SECURE env var introduced, defaults to 'true'. All deployed
        environments (dev, val, prod) set cookieSecure='true' in Bicep parameters.
      resolution_date: "2026-03-02"
      resolution_files:
        - "services/api/app/routers/auth.py"
        - "infra/bicep/parameters/dev.bicepparam"
        - "infra/bicep/parameters/val.bicepparam"
        - "infra/bicep/parameters/prod.bicepparam"
      original_severity: "High"
      residual_severity: "Closed"

    - id: "AUTH-I-002"
      element: "services/api/app/services/session_store.py:21-22"
      threat: "Excessive session lifetime enables persistent access from stolen cookie"
      status: "PARTIALLY RESOLVED in v2"
      resolution: >
        SESSION_TTL_HOURS now configurable via env var. Dev/val: 12h. Prod: 24h.
        SystemConfig in Neo4j can override per-tenant. Down from hardcoded 168h (7 days).
      residual_risk: >
        No session rotation on activity. No sliding renewal with new session ID.
        No IP or user-agent binding. No concurrent session limits.
        A stolen session cookie is valid for up to 24h in production.
      original_severity: "Medium"
      residual_severity: "Low"

    - id: "AUTH-D-001"
      element: "services/api/app/services/session_store.py:95-100"
      threat: "Redis session store denial of service — in-memory fallback"
      status: "RESOLVED in v2"
      resolution: >
        In-memory fallback removed. Session store now raises HTTP 503 when Redis
        is unavailable (_require_redis, line 95-100). This prevents degraded
        authentication modes. Retry with exponential backoff handles transient
        Redis errors (lines 52-54).
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/services/session_store.py"]
      original_severity: "Low"
      residual_severity: "Closed"
      note: "Users cannot authenticate during Redis outage — acceptable fail-closed behavior."

    - id: "AUTH-E-001"
      element: "libs/auth/org_scope.py:88-97"
      threat: "Privilege escalation via platform admin flag"
      status: "MITIGATED in v2"
      resolution: >
        AUTH-S-001/AUTH-S-002 resolved — identity spoofing via header/query param no longer
        possible. Admin status checked from session (set at login) or live from Neo4j.
        The chained attack path (spoof email → gain admin) is broken.
      residual_risk: >
        Admin status cached in session. If a Practitioner's is_platform_admin flag
        is changed in Neo4j during an active session, the change takes effect only
        at next login. Session revocation (delete_sessions_by_email) exists but
        requires manual invocation.
      original_severity: "Critical"
      residual_severity: "Low"

# ---------------------------------------------------------------------------
# COMPONENT 2: CORE API GATEWAY
# ---------------------------------------------------------------------------
component_2_core_api:
  name: "Core API Gateway"
  purpose: "Central FastAPI application serving all HTTP endpoints and proxying to internal services"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "UI → Core API"
    - "Core API → Terminology/FHIR/Analytics APIs (proxy)"
  data_assets: "All data types — clinical, PII, operational"
  network_exposure: "Public"
  authentication_context: "Session cookie (via deps.py); XHR mutation guard; slowapi rate limiting"

  phase_1_reconnaissance:
    entry_points:
      - id: "API-EP-001"
        type: "HTTP GET"
        path: "/health"
        file: "services/api/app/main.py"
        line: 161
        authentication: "none"
      - id: "API-EP-002"
        type: "HTTP wildcard"
        path: "/api/proxy/{benchmarks,fhir,analytics,pipeline}/*"
        file: "services/api/app/routers/proxy.py"
        authentication: "session cookie (get_access_token, get_user_email)"
      - id: "API-EP-003"
        type: "HTTP multiple"
        path: "/model-registry/*"
        file: "services/api/app/routers/model_registry.py"
        authentication: "mutating routes require platform admin (require_admin); read routes open"
      - id: "API-EP-004"
        type: "HTTP multiple"
        path: "/terminology/*"
        file: "services/api/app/routers/terminology.py"
        authentication: "none (GAP-004 still open)"
      - id: "API-EP-005"
        type: "HTTP multiple"
        path: "/games/*"
        file: "services/api/app/routers/games.py"
        authentication: "none"
      - id: "API-EP-006"
        type: "HTTP multiple"
        path: "/training/*"
        file: "services/api/app/routers/training.py"
        authentication: "session cookie (get_caller_scope)"
      - id: "API-EP-007"
        type: "HTTP multiple"
        path: "/patients/*"
        file: "services/api/app/routers/patients.py"
        authentication: "session cookie (get_caller_scope) + require_patient_in_scope"

    trust_boundary_analysis:
      - boundary: "CORS policy"
        authentication_present: "N/A"
        authorisation_enforcement: "configurable origins"
        input_validation:
          origins: "ALLOWED_ORIGINS env var (GAP-013 resolved); dev includes localhost; prod restricted to healthcarecopilot.ai domain"
          credentials: "true"
          methods: "['*']"
          headers: "['*']"
        citation: "services/api/app/main.py:98-110"

    existing_controls:
      - control: "CORS middleware with configurable origins"
        citation: "services/api/app/main.py:98-110"
      - control: "Proxy router requires session authentication"
        citation: "services/api/app/routers/proxy.py"
      - control: "Proxy strips dangerous headers (host, cookie, transfer-encoding)"
        citation: "services/api/app/routers/proxy.py"
      - control: "slowapi rate limiting"
        citation: "services/api/app/main.py:33,91-92"
      - control: "XHR mutation guard"
        citation: "services/api/app/main.py:124-140"
      - control: "Request ID / correlation ID logging"
        citation: "services/api/app/main.py:113-121"

  phase_2_threats:
    - id: "API-S-001"
      element: "services/api/app/routers/model_registry.py"
      threat: "Unauthenticated model lifecycle manipulation"
      status: "PARTIALLY RESOLVED in v2"
      resolution: >
        Mutating routes (register, upload, validate, canary/start, canary/result,
        promote, rollback, reject) now require Depends(require_admin) — platform
        admin only (GAP-003 partial). Read routes (GET /status, /versions, /versions/{v},
        /inference/health, canary jobs) remain unauthenticated.
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/routers/model_registry.py", "services/api/app/deps.py"]
      residual_risk: >
        Read-only model metadata (version list, status, inference health) is
        accessible without authentication. This leaks model version names,
        training metadata, and precision/recall metrics. Low confidentiality impact
        but provides reconnaissance information for a targeted attacker.
      original_severity: "Critical"
      residual_severity: "Low"

    - id: "API-S-002"
      element: "services/api/app/routers/terminology.py"
      threat: "Unauthenticated terminology writeback"
      status: "OPEN"
      attack_vector: "POST /terminology/writeback, POST /terminology/surface-forms/upsert-mapping, DELETE /terminology/surface-forms/* have no authentication. An attacker can inject incorrect SurfaceForm→SNOMED mappings into the Knowledge Graph."
      prerequisites: "Network access to Core API port 8000"
      threat_actors: ["external_targeted", "supply_chain"]
      evidence:
        file: "services/api/app/routers/terminology.py"
        line: 32
        snippet: "router = APIRouter(prefix='/terminology', tags=['terminology']) — no Depends() on any route"
      impact:
        confidentiality: "None"
        integrity: "High"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: false
      likelihood: "Medium"
      likelihood_rationale: "SurfaceForm mappings have a 1.2x boost weight, not authoritative. But systematic manipulation could bias coding at population level. XHR mutation guard (GAP-009) blocks form-based CSRF but not direct API calls."
      existing_controls: "SurfaceForm provides 1.2x suggestion boost, not authoritative resolution; XHR mutation guard"
      gaps: "No authentication on write endpoints for terminology data"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.6"
          nature: "Write access to clinical terminology data without authentication"

    - id: "API-T-001"
      element: "services/api/app/main.py:98-110"
      threat: "CORS misconfiguration for production deployment"
      status: "RESOLVED in v2"
      resolution: >
        ALLOWED_ORIGINS env var configurable per environment. Dev: atlas-dev.healthcarecopilot.ai + localhost.
        Val: atlas-val.healthcarecopilot.ai. Prod: leo-ai-audit.healthcarecopilot.ai.
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/main.py", "infra/bicep/parameters/*.bicepparam"]
      original_severity: "Medium"
      residual_severity: "Closed"

    - id: "API-D-001"
      element: "services/api/app/main.py:33,91-92"
      threat: "No rate limiting on API endpoints"
      status: "RESOLVED in v2"
      resolution: "slowapi Limiter with get_remote_address key function added. Rate limit exceeded returns standard 429."
      resolution_date: "2026-03-02"
      resolution_files: ["services/api/app/main.py"]
      original_severity: "High"
      residual_severity: "Closed"
      note: "Per-endpoint rate limit configuration should be documented and tuned for production load."

    - id: "API-T-002"
      element: "services/api/app/routers/proxy.py"
      threat: "Proxy forwards access token and user context to internal services"
      status: "IMPROVED in v2"
      resolution: >
        Proxy no longer forwards X-User-Email header. Uses X-Leo-Session instead.
        Internal services validate SERVICE_AUTH_SECRET Bearer token (GAP-007).
      residual_risk: "Forwarded access token still has full user permissions. No token scoping for internal calls."
      original_severity: "Low"
      residual_severity: "Low"

