# -- VAL-LEO-AI-007 -- FHIR Interoperability Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-007"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs: ["UN-LEO-AI-022"]
    design_inputs: ["DI-LEO-AI-031", "DI-LEO-AI-032"]
    risks: []
    verification_tests: ["VT-LEO-AI-015"]

  metadata:
    title: "FHIR Interoperability Validation"
    validation_phase: "alpha"
    test_type: "end_to_end"
    automation_level: "semi-automated"
    participants:
      user_type: "internal_qa"
      count: 3
      selection_criteria: "QA engineers with FHIR R4 specification knowledge"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "Verification test VT-LEO-AI-015 passed"
      - "System deployed to staging with FHIR API endpoints enabled"
      - "FHIR R4 validation tooling available (e.g., HAPI FHIR Validator)"
      - "Test patient data bundle prepared in FHIR R4 format"
    infrastructure: "Azure Container Apps staging environment with FHIR API service"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Import patient data via FHIR R4 and process through pipeline"
      user_role: "Integration Engineer"
      user_goal: "Import a FHIR R4 patient data bundle and confirm it flows through the pipeline successfully"
      preconditions:
        - "A valid FHIR R4 Bundle resource is prepared with Patient, Condition, and Observation resources"
        - "The target organisation is provisioned and the pipeline is configured"
      steps:
        - step_number: 1
          action: "Submit the FHIR R4 Bundle to the import endpoint using a POST request"
          expected_result: "System accepts the bundle and returns HTTP 200 with an import tracking ID"
          success_criteria: "Response contains a valid tracking ID and the bundle is queued for processing"
        - step_number: 2
          action: "Monitor the pipeline status until processing completes"
          expected_result: "Pipeline processes the imported data and reaches a completed state"
          success_criteria: "Pipeline status shows completed within the expected time window"
        - step_number: 3
          action: "Query the system for records derived from the imported FHIR data"
          expected_result: "Records appear in the system with correct mappings from FHIR resources"
          success_criteria: "All imported resources are represented in the system with correct field mappings"
      postconditions:
        - "Imported FHIR data is available in the system for downstream processing"
        - "No data loss or corruption occurred during import"
      success_metrics:
        - metric: "FHIR import success rate"
          target: "100%"
          measurement_method: "Count of successfully imported resources divided by total resources in the bundle"
        - metric: "Field mapping accuracy"
          target: "100%"
          measurement_method: "Comparison of source FHIR fields to mapped system fields"
      evidence_to_capture:
        - "FHIR Bundle submitted as input"
        - "API response with tracking ID"
        - "Pipeline completion logs"
        - "Mapped records in the system"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Export audit results as FHIR MeasureReport and validate conformance"
      user_role: "Integration Engineer"
      user_goal: "Export audit results in FHIR MeasureReport format and confirm conformance to the R4 specification"
      preconditions:
        - "A completed audit with results exists in the system"
        - "FHIR export endpoint is available"
        - "FHIR R4 validator tool is ready"
      steps:
        - step_number: 1
          action: "Request an export of audit results in FHIR MeasureReport format from the export endpoint"
          expected_result: "System returns a FHIR MeasureReport resource with audit results"
          success_criteria: "Response is valid JSON and contains a MeasureReport resource type"
        - step_number: 2
          action: "Validate the exported MeasureReport against the FHIR R4 specification using the validator tool"
          expected_result: "Validator reports zero errors and the resource conforms to the R4 MeasureReport profile"
          success_criteria: "Zero validation errors; all required fields are present and correctly typed"
        - step_number: 3
          action: "Verify that the MeasureReport content matches the original audit results"
          expected_result: "All audit metrics and scores in the MeasureReport match the source data"
          success_criteria: "100% data accuracy between source audit results and exported MeasureReport"
      postconditions:
        - "Exported MeasureReport is a valid FHIR R4 resource"
        - "Audit data integrity is maintained through the export process"
      success_metrics:
        - metric: "FHIR R4 conformance"
          target: "Zero validation errors"
          measurement_method: "FHIR R4 validator output error count"
        - metric: "Data accuracy"
          target: "100%"
          measurement_method: "Field-by-field comparison of source audit data to exported MeasureReport"
      evidence_to_capture:
        - "Exported FHIR MeasureReport JSON"
        - "FHIR validator output report"
        - "Source audit results for comparison"

  acceptance_criteria:
    - criterion: "FHIR resources conform to R4 specification"
      target: "Zero validation errors from FHIR R4 validator"
      measurement_method: "FHIR R4 validator tool output"
    - criterion: "Import and export workflow completes successfully"
      target: "100% workflow completion rate"
      measurement_method: "Count of successful end-to-end FHIR workflows divided by total attempts"

  user_feedback:
    feedback_methods: ["survey", "observation"]

  evidence_bundle:
    bundle_id: "VAL-007-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-007/"
    artifacts:
      - type: "user_acceptance_results"
        description: "FHIR import and export test results with pass/fail per scenario"
      - type: "fhir_export"
        description: "Exported FHIR MeasureReport resources and validator conformance reports"
      - type: "api_capture"
        description: "API request and response payloads for import and export operations"
    immutability: true

  execution_history: []
