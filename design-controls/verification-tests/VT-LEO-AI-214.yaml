# -- VT-LEO-AI-214 -- /care/encounters preview wrapper static surface
# IEC 62304 Verification Test

- id: "VT-LEO-AI-214"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-223"
    risks:
      - "R-LEO-AI-206"
      - "R-LEO-AI-207"

  metadata:
    title: "EncounterPreviewDialog wrapper -- read-only preview, search highlight, on-demand dual-save editor"
    description: >
      Static-source verification per ui-testing.mdc. Confirms the
      /care/encounters preview wrapper opens as a read-only
      preview that renders the encounter text from item.text and
      highlights the search query plus match-rationale terms via
      <mark> elements, without making any backend call on open.
      An explicit "Edit codes" footer button seeds via
      createGoldLabelFromEncounter and mounts the shared dialog in
      saveMode='dual'. Seed failures keep the preview open with an
      inline error so the encounter text stays readable.
      EncounterMissionControl forwards the search query and no
      longer prefetches coded links for the preview path.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/encounter-preview-dialog-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest harness (jest 30 + ts-jest)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-214-TC-001"
      case_name: "Wrapper imports shared editor and dual-save helpers from @/components/gold-editor"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterPreviewDialog.tsx"
          expected_result: "Imports include GoldLabelEditorDialog, createGoldLabelFromEncounter, useDualSaveAdapter from @/components/gold-editor"
          verification_method: "automated"

    - case_id: "VT-214-TC-002"
      case_name: "Read-only preview renders encounter text without an API call on open"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterPreviewDialog.tsx and inspect mount-time effects"
          expected_result: "EncounterTextBlock with data-testid='encounter-preview-text' (and 'encounter-preview-empty' fallback) is present; the only useEffect in the file is the cancellation reset; createGoldLabelFromEncounter is only called from handleEditCodes"
          verification_method: "automated"

    - case_id: "VT-214-TC-003"
      case_name: "'Edit codes' button seeds gold label and mounts shared editor in dual-save mode"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for the edit-codes button, the seed call, and the dual-save mount"
          expected_result: "Footer button data-testid='encounter-preview-edit-codes' triggers createGoldLabelFromEncounter(patient_id, encounter_id); baseline_concept_ids stored in context; dialog mounted with saveMode='dual', entitySaver={dualSaver}, onAfterSave callback"
          verification_method: "automated"

    - case_id: "VT-214-TC-004"
      case_name: "Match rationale chrome is rendered in preview and forwarded via headerChrome"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for headerChrome prop and rationale data-testid"
          expected_result: "headerChrome={<MatchRationaleHeader item={item} />}; data-testid='encounter-preview-rationale' present; copy 'Why this matched your search' present"
          verification_method: "automated"

    - case_id: "VT-214-TC-005"
      case_name: "Encounter text highlights search query and rationale terms via <mark>"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterPreviewDialog.tsx and inspect the highlight helpers"
          expected_result: "HighlightedText + collectHighlightTerms helpers exist; <Box component='mark' data-testid='encounter-preview-highlight'> wraps each hit; pattern is built with new RegExp(..., 'gi'); MIN_HIGHLIGHT_LEN constant + longest-first sort are present"
          verification_method: "automated"

    - case_id: "VT-214-TC-006"
      case_name: "Seed failure keeps the preview open with an inline error"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search for the editError surface in the preview body"
          expected_result: "data-testid='encounter-preview-error' is rendered after the EncounterTextBlock so the encounter text stays visible when the seed call fails"
          verification_method: "automated"

    - case_id: "VT-214-TC-007"
      case_name: "GoldLabelDetailDialog renders headerChrome when provided"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx"
          expected_result: "Source contains headerChrome?: React.ReactNode and data-testid='gold-dialog-header-chrome'"
          verification_method: "automated"

    - case_id: "VT-214-TC-008"
      case_name: "EncounterMissionControl does not prefetch coded links and forwards searchQuery"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EncounterMissionControl.tsx"
          expected_result: "fetchEncounterCodedLinks/previewCodedLinks/previewLinksLoading/previewLinksError are NOT present; EncounterPreviewDialog is mounted with searchQuery={search.query} and onCodingChanged that calls loadAll(false)"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-214/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-214-EXEC-001"
      timestamp: "2026-04-18T17:35:00Z"
      executor: "Rob Smith (developer)"
      result: "pass"
      notes: "7 cases pass under jest 30 + ts-jest."
    - run_id: "VT-214-EXEC-002"
      timestamp: "2026-04-19T08:05:00Z"
      executor: "Rob Smith (developer)"
      result: "pass"
      notes: >
        8 cases pass under jest 30 + ts-jest after splitting the
        preview from the editor: read-only preview by default,
        search-term highlighting via <mark>, on-demand
        GoldLabelEditorDialog mount via the 'Edit codes' button,
        and an inline seed-failure error that does not hide the
        encounter text. searchQuery is now forwarded by
        EncounterMissionControl.
