# -- VT-LEO-AI-210 -- UI shell SSR session bootstrap and cache strategy
# IEC 62304 Verification Test

- id: "VT-LEO-AI-210"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-218"
    risks:
      - "R-LEO-AI-205"

  metadata:
    title: "Root layout disables Next.js Full Route Cache, hydrates AuthProvider from server-side session, and OAuth route handlers are uncacheable"
    description: >
      Verifies DI-LEO-AI-218. TC-001 and TC-002 confirm the
      AuthProvider hydrates straight into the correct status when an
      initialSession is (or is not) provided. TC-003 confirms the
      background refetch still runs after server-side hydration so
      role / density updates from another tab become visible. TC-004
      and TC-005 are static-source assertions on layout.tsx and the
      auth route handlers - structural invariants that protect
      against future regressions removing force-dynamic or no-store.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/server-session-bootstrap.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest harness (jest 30 + ts-jest)"
      - "services/ui/src/lib/serverSession.ts present"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-210-TC-001"
      case_name: "AuthProvider hydrates straight into authenticated when given an initial session"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render <AuthProvider initialSession={SAMPLE_SESSION}> and capture every status emitted by useAuth()"
          expected_result: "The very first observation is status='authenticated' with session.user.email='clinician@example.com'"
          verification_method: "automated"
      acceptance_criteria:
        - "First render is never status='loading' when an initialSession is supplied"

    - case_id: "VT-210-TC-002"
      case_name: "AuthProvider with no initial session never reports loading to consumers"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render <AuthProvider initialSession={null}> and capture the first status emitted"
          expected_result: "First observation is status='unauthenticated', session is null"
          verification_method: "automated"
      acceptance_criteria:
        - "First render is never status='loading' even when no initial session is supplied"

    - case_id: "VT-210-TC-003"
      case_name: "AuthProvider refetches in the background when hydrated from server data"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render <AuthProvider initialSession={SAMPLE_SESSION}> with global.fetch returning a deferred promise"
          expected_result: "global.fetch was called with '/auth/session' and credentials: 'include'"
          verification_method: "automated"
        - step_number: 2
          action: "Resolve the deferred fetch with a fresh session payload"
          expected_result: "Final captured status remains 'authenticated' (refetch did not regress to loading)"
          verification_method: "automated"
      acceptance_criteria:
        - "Background refetch runs after server-side hydration without exposing 'loading' to consumers"

    - case_id: "VT-210-TC-004"
      case_name: "layout.tsx declares force-dynamic so the Next.js Full Route Cache cannot serve a stale spinner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/app/layout.tsx as a string"
          expected_result: "Source matches /export const dynamic = \"force-dynamic\"/, /export const revalidate = 0/, and contains a call to fetchInitialSession()"
          verification_method: "automated"
      acceptance_criteria:
        - "Static-source guard against accidental removal of the cache opt-out"

    - case_id: "VT-210-TC-005"
      case_name: "auth route handlers set Cache-Control: no-store so Cloudflare never caches OAuth redirects"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/app/auth/login/route.ts and services/ui/src/app/auth/callback/route.ts"
          expected_result: "Both files contain a 'Cache-Control', 'no-store' header set on the response"
          verification_method: "automated"
      acceptance_criteria:
        - "Static-source guard against regressions removing no-store from the OAuth round-trip"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-210/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-210-EXEC-001"
      execution_date: "2026-04-18"
      executor: "automated_local"
      result: "pass"
      cases_run: 5
      cases_passed: 5
      cases_failed: 0
      notes: >
        Run via `cd services/ui && npx jest --testPathPatterns
        "server-session-bootstrap" --no-coverage`. All five cases
        passed in 0.9s. Re-ran density-context and
        design-system-role-gate to confirm no AuthProvider contract
        regression - 14 tests passed across both suites.
