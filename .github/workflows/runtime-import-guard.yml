name: Runtime Import Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-import-boundary:
    name: Runtime import boundary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pytest
        run: python -m pip install pytest

      - name: Runtime import boundary smoke test
        run: pytest tests/test_runtime_import_boundaries.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
