# -- R-LEO-AI-011 -- LLM Service Unavailable
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-011"
  title: "LLM inference service unavailable causing pipeline failure"

  hazard:
    description: "External LLM service (OpenAI / Anthropic / AWS Bedrock) experiences outage or rate limiting"
    category: "infrastructure_failure"

  hazardous_situation: "Pipeline step requiring LLM inference (disambiguation, interpretation) fails because the LLM service is unavailable, blocking pipeline completion for affected patients"

  harm:
    description: "Pipeline processing delayed; audit reporting timelines may be affected"
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 1
    rpn: 6
    risk_level: "low"

  mitigation_measures:
    - control_type: "inherent_safety"
      description: "Pipeline hard-fails with clear error message when LLM unavailable -- no degraded fallback that could produce incorrect results"
      implemented_by: []
      verified_by: []
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Retry logic with exponential backoff for transient failures"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: "Clear error reporting to operators with suggested resolution steps"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 2
    detectability: 1
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Hard-fail design prevents incorrect results; retry logic handles transient issues; operator alerting enables rapid response to sustained outages"

  monitoring:
    monitoring_plan: "Track LLM service availability and pipeline failure rates"
    metrics: ["LLM service availability", "Pipeline failure rate from LLM outage", "Mean time to recovery"]
    review_frequency: "Weekly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["infrastructure", "llm", "availability"]
