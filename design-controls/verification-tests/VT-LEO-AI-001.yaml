# -- VT-LEO-AI-001 -- Encounter Shortlisting Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-001"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-001", "DI-LEO-AI-002"]
    risks: ["R-LEO-AI-002"]
    user_needs: ["UN-LEO-AI-001"]

  metadata:
    title: "Clinical Encounter Classification and Anchor Detection Verification"
    description: >
      Verifies that the encounter classification pipeline (libs/classifiers/encounter_textcat.py)
      correctly labels GP encounters as admin_only, document_transfer, or clinical using
      deterministic rule-based matching, and that the anchor detector
      (services/analysis_worker/app/analyzers/anchor_detector.py) correctly identifies
      referral, diagnosis, treatment, and specialist-visit milestones from coded SNOMED
      DOCUMENTS relationships. Note: the original DI described a vector+keyword hybrid
      retrieval shortlister; that design was superseded — encounter filtering is now
      performed by the rule-based textcat classifier and coded-concept anchor detection.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_encounter_textcat.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 installed with project dependencies"
      - "spaCy model available (encounter_textcat uses rule-based PhraseMatcher, no model download needed)"
      - "libs/classifiers/encounter_rules.json present"
    test_data:
      data_type: "fixture"
      cleanup_required: false

  test_cases:
    - case_id: "VT-001-TC-001"
      case_name: "Admin encounters classified as admin_only"
      priority: "critical"
      preconditions:
        - "encounter_rules.json loaded with admin_only phrase and regex patterns"
      test_steps:
        - step_number: 1
          action: "Pass known admin encounter texts (SMS reminders, registration events, DNA) to classify_text()"
          expected_result: "Each text is labelled 'admin_only'"
          verification_method: "Assert classify_text() == 'admin_only' for each case"
        - step_number: 2
          action: "Verify empty and whitespace-only texts are treated as admin"
          expected_result: "Empty text returns 'admin_only' (safe default)"
          verification_method: "Assert classify_text('') == 'admin_only'"
      acceptance_criteria:
        - "All admin encounter texts correctly labelled admin_only"
        - "Empty text defaults to admin_only (conservative, not clinical)"

    - case_id: "VT-001-TC-002"
      case_name: "Document transfer encounters classified correctly"
      priority: "high"
      preconditions:
        - "encounter_rules.json loaded with document_transfer phrase patterns"
      test_steps:
        - step_number: 1
          action: "Pass discharge summaries, filed letters, lab reports to classify_text()"
          expected_result: "Each text is labelled 'document_transfer'"
          verification_method: "Assert classify_text() == 'document_transfer'"
        - step_number: 2
          action: "Verify 2WW referral letter sent is document_transfer not clinical"
          expected_result: "Letter-filing event is document_transfer"
          verification_method: "Assert classify_text('2WW referral sent...') == 'document_transfer'"
      acceptance_criteria:
        - "Filed letters and lab reports correctly identified as document_transfer"

    - case_id: "VT-001-TC-003"
      case_name: "Clinical encounters classified as clinical, override takes priority"
      priority: "critical"
      preconditions:
        - "encounter_rules.json loaded with clinical_override patterns"
      test_steps:
        - step_number: 1
          action: "Pass GP consultation texts with O/E notation, prescriptions, and plans"
          expected_result: "Each text is labelled 'clinical'"
          verification_method: "Assert classify_text() == 'clinical'"
        - step_number: 2
          action: "Pass text that contains admin framing but also clinical content (override case)"
          expected_result: "Clinical override wins — text labelled 'clinical'"
          verification_method: "Assert clinical_override pattern correctly escalates label"
      acceptance_criteria:
        - "GP consultations correctly classified as clinical"
        - "clinical_override ensures strong clinical signals always win over admin framing"

    - case_id: "VT-001-TC-004"
      case_name: "Anchor detector identifies milestone encounters from SNOMED concepts"
      priority: "critical"
      preconditions:
        - "Patient graph mock returns coded encounters with FAST_TRACK_REFERRAL_IDS concepts"
      test_steps:
        - step_number: 1
          action: "Call detect_anchors() with a mocked patient client returning coded referral encounters"
          expected_result: "AnchorResult has non-empty referral_anchors"
          verification_method: "Assert len(result.referral_anchors) >= 1"
        - step_number: 2
          action: "Call detect_anchors() with no coded encounters"
          expected_result: "AnchorResult.detection_method == 'none', all anchor lists empty"
          verification_method: "Assert result.detection_method == 'none'"
      acceptance_criteria:
        - "Referral, diagnosis, treatment, and specialist anchors detected from SNOMED DOCUMENTS relationships"
        - "No anchors created when no coded encounters exist"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-001/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-001-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 7
      cases_passed: 7
      cases_failed: 0
      duration_seconds: 2
      notes: "VT remapped from deprecated shortlister stub to encounter_textcat + anchor_detector real modules. tests/test_encounter_textcat.py covers 48 cases across admin/clinical/override classification and ClassificationResult interface. Anchor detector covered via mock-based unit tests in TC-004."
