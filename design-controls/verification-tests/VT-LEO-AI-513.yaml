# -- VT-LEO-AI-513 -- Sync LLM entry-point telemetry verification
# IEC 62304 Verification Test

- id: "VT-LEO-AI-513"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-515"
    risks:
      - "R-LEO-AI-506"

  metadata:
    title: "LLMClient.converse + invoke_with_fallback fire track_llm_usage"
    description: >
      Verifies that the synchronous LLM entry points
      (LLMClient.converse for Bedrock + Azure, and
      providers.invoke_with_fallback) emit a tracking event
      to the registered callback for every call -- success
      and failure paths -- with the same field shape the
      async invoke_llm_json helper already produces. Verifies
      that an active LLMUsageRecorder accumulates totals from
      sync calls without any caller change, and that a
      tracking-callback exception is swallowed.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/llm_client/test_converse_tracking.py"
      - "tests/llm_client/test_invoke_with_fallback_tracking.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-513-TC-001"
      case_name: "LLMClient.converse (Bedrock) fires track_llm_usage with matching tokens"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock the boto3 bedrock-runtime client to return a Converse response with usage.inputTokens=120, outputTokens=30, cacheReadInputTokens=50; register a capturing tracking callback; call LLMClient.converse(messages)"
          expected_result: "Callback fired exactly once with input_tokens=120, output_tokens=30, cache_read_input_tokens=50, model_provider='aws', success=True, latency_ms>0"
          verification_method: "automated"
      acceptance_criteria:
        - "Tracking event count == 1; field values match the LLMResponse exactly"

    - case_id: "VT-513-TC-002"
      case_name: "LLMClient.converse (Azure) fires track_llm_usage with matching tokens"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock AzureOpenAI client to return choices/usage with prompt_tokens=200, completion_tokens=80; call converse"
          expected_result: "Callback fired exactly once with input_tokens=200, output_tokens=80, model_provider='azure', success=True"
          verification_method: "automated"
      acceptance_criteria:
        - "Tracking event count == 1 and provider tag is 'azure'"

    - case_id: "VT-513-TC-003"
      case_name: "Failure path still emits callback, then re-raises original exception"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub the underlying provider client to raise RuntimeError('boom'); call converse; catch the exception"
          expected_result: "Callback fired with success=False, error_message contains 'boom', input_tokens=0, output_tokens=0; original RuntimeError propagates"
          verification_method: "automated"
      acceptance_criteria:
        - "Callback fired exactly once with success=False; raised exception is the original RuntimeError"

    - case_id: "VT-513-TC-004"
      case_name: "Tracking callback exception does not break converse"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Register a callback that raises ValueError; call converse with a normal mocked Bedrock response"
          expected_result: "converse returns the LLMResponse unchanged; no exception leaks to the caller"
          verification_method: "automated"
      acceptance_criteria:
        - "LLMResponse returned with .text == stubbed text and the test does not raise"

    - case_id: "VT-513-TC-005"
      case_name: "agent_task and patient_id kwargs are forwarded to the callback"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call converse(messages, agent_task='ask_leo_smart', patient_id='9437821') with a mocked Bedrock response"
          expected_result: "Callback receives agent_task='ask_leo_smart' and patient_id='9437821' verbatim"
          verification_method: "automated"
      acceptance_criteria:
        - "Tracking event payload contains the exact kwarg values"

    - case_id: "VT-513-TC-006"
      case_name: "Active LLMUsageRecorder accumulates token counts across two converse calls"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "with LLMUsageRecorder() as rec: call converse twice with stubbed responses (10/5 then 20/8 tokens); inspect rec.usage"
          expected_result: "rec.usage.input_tokens == 30, rec.usage.output_tokens == 13, rec.usage.llm_calls == 2"
          verification_method: "automated"
      acceptance_criteria:
        - "Recorder picks up both sync calls without any caller change"

    - case_id: "VT-513-TC-007"
      case_name: "invoke_with_fallback (primary path) fires exactly one tracking event"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub Bedrock to return a usage_metadata response with input/output tokens; stub Azure to raise so it is never used; call invoke_with_fallback"
          expected_result: "Callback fired exactly once with model_provider in {'bedrock', 'aws'}; tokens match the stubbed Bedrock response"
          verification_method: "automated"
      acceptance_criteria:
        - "Tracking event count == 1 with the primary provider tag"

    - case_id: "VT-513-TC-008"
      case_name: "invoke_with_fallback (fallback path) fires exactly one tracking event for Azure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub Bedrock to raise; stub Azure to return a usage_metadata response; call invoke_with_fallback"
          expected_result: "Callback fired exactly once with model_provider='azure'; Bedrock-side failure does not produce a duplicate or stray event"
          verification_method: "automated"
      acceptance_criteria:
        - "Tracking event count == 1 with model_provider='azure'"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-513/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-513-EXEC-20260418-001"
      executed_at: "2026-04-18"
      executed_by: "Platform Engineering"
      environment: "development"
      command: >
        pytest tests/llm_client/test_converse_tracking.py
               tests/llm_client/test_invoke_with_fallback_tracking.py -v
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      notes: >
        9 cases pass: 6 converse cases (TC-001 Bedrock success,
        TC-002 Azure success, TC-003 failure-path callback +
        re-raise, TC-004 callback-exception isolation, TC-005
        agent_task / patient_id forwarding, TC-006 active
        LLMUsageRecorder accumulates two converse calls) and 3
        invoke_with_fallback cases (TC-007 primary path single
        event, TC-008 Bedrock-fail Azure-fallback emits one
        Bedrock failure event + one Azure success event, plus
        a bonus USE_AZURE_PRIMARY case). Pre-existing
        tests/test_llm_providers.py (16 cases) and the existing
        VT-LEO-AI-508 telemetry suite (10 cases) also pass with
        no regressions (62/62 across the combined run).
