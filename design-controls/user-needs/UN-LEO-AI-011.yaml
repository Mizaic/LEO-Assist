# -- UN-LEO-AI-011 -- Programme Configurability
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-011"
  title: "Administrators configure new clinical audit programmes without code changes"
  description: |
    Programme administrators need to configure new clinical audit
    programmes by defining clinical domains, milestone types, guideline
    rules, quality targets, and pipeline configurations -- all stored
    as data, not code. Adding support for a new clinical programme (e.g.
    diabetes, cardiovascular, respiratory) requires configuration changes
    only, with no modifications to the platform software.

  stakeholder:
    type: "end_user"
    role: "Programme Administrator"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    The platform must support multiple clinical audit programmes beyond
    the NCDA launch programme. Hard-coding programme-specific logic would
    make the system rigid and expensive to extend. A configuration-driven
    approach enables rapid deployment of new programmes and reduces
    regulatory burden for each new programme.

  benefit: "New clinical audit programmes deployed in days through configuration rather than months of development"

  use_case: |
    1. Programme administrator receives requirements for a new clinical
       audit programme (e.g. diabetes care).
    2. Administrator opens the programme configuration interface.
    3. Administrator defines the clinical domains for the programme
       (e.g. HbA1c monitoring, foot examination, retinal screening).
    4. Administrator configures milestone types and their expected
       sequence for the programme pathway.
    5. Administrator sets guideline rules referencing relevant NICE
       guidelines and quality standards.
    6. Administrator defines quality targets (e.g. 8 care processes
       completed within 12 months).
    7. Administrator selects pipeline components from the capability
       registry and defines the workflow graph.
    8. System validates the configuration for completeness and consistency.
    9. Administrator activates the programme, making it available for
       audit runs.
    10. No code changes or software deployments are required.

  current_solution: "New audit programmes require bespoke software development and deployment cycles"

  pain_points:
    - "Adding a new programme requires months of development effort"
    - "Programme-specific code increases maintenance burden and regression risk"
    - "Each new programme requires its own regulatory change control review"
    - "Clinical teams cannot adjust programme parameters without developer support"

  acceptance_criteria:
    - "System shall support programme-defined clinical domain configurations"
    - "System shall support programme-defined milestone type definitions"
    - "System shall support programme-defined guideline rule sets"
    - "System shall support programme-defined quality targets"
    - "System shall support programme-defined pipeline workflow definitions"
    - "All programme configuration shall be stored as data (not code)"

  success_metrics:
    - metric: "New programme configuration time"
      target: "<=5 days from requirements to active programme"
      baseline: "Current: months of development per programme"
    - metric: "Code changes required"
      target: "Zero code changes for new programme"
      baseline: "Current: full development cycle per programme"
    - metric: "Configuration validation time"
      target: "<=1 minute"
      baseline: "N/A"

  regulatory_impact: "medium"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 4.1"
    - "Platform extensibility requirements"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "implemented"

  design_inputs: ["DI-LEO-AI-002", "DI-LEO-AI-017"]
  validation_tests: ["VAL-LEO-AI-009"]

  tags: ["programme-config", "configurability", "cross-cutting", "platform"]
