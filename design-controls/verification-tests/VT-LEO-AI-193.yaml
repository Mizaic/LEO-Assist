# -- VT-LEO-AI-193 -- Strict NSS classification (regex + concept ID + Read code)
# IEC 62304 Verification Test

- id: "VT-LEO-AI-193"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-200"
    risks:
      - "R-LEO-AI-190"
      - "R-LEO-AI-097"

  metadata:
    title: "Strict NSS classification: explicit phrase OR explicit SNOMED/Read code only"
    description: >
      Verifies the DI-LEO-AI-200 strict-NSS rule. An encounter
      classifies as cancer_type='non_site_specific' if and only
      if the text matches an explicit NSS surface form
      (_NSS_PHRASE_RE) or the SNOMED concept_id is one of the
      canonical NSS pathway IDs (1556551000000104,
      382761000000101). Generic cancer text without a site
      ('carcinoma', 'fasting', 'cancer follow-up clinic', PRISM
      pathway names) classifies as 'unknown', not NSS.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_site_resolution_nss.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-193-TC-001"
      case_name: "Full SNOMED preferred-term phrase classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('Fast track referral for suspected cancer due to non-site-specific symptoms')"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-002"
      case_name: "'2WW NSS referral' surface form classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('2WW NSS referral')"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-003"
      case_name: "'NSS 2ww referral' (reverse order) classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('NSS 2ww referral')"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-004"
      case_name: "'Fast track NSS referral' classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('Fast track NSS referral')"
          expected_result: "Returns 'non_site_specific'"
