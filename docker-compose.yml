services:
  # --- Local-only infrastructure ---
  # All host port bindings are explicitly bound to 127.0.0.1 so the
  # development stack is reachable only from the developer's own machine.
  # Without the loopback prefix Docker would publish on 0.0.0.0 and any
  # peer on the local network (corporate Wi-Fi, hotel Wi-Fi, conference
  # network) could connect to Neo4j with the seeded dev credentials.
  neo4j-patient:
    image: neo4j:5-community
    container_name: pca-neo4j-patient
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/patient-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_patient_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j-knowledge:
    image: neo4j:5-community
    container_name: pca-neo4j-knowledge
    ports:
      - "127.0.0.1:7475:7474"
      - "127.0.0.1:7688:7687"
    environment:
      NEO4J_AUTH: neo4j/knowledge-dev
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
      NEO4J_server_memory_pagecache_size: "512m"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_knowledge_data:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pca-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Application services ---
  core-api:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.core-api
    container_name: pca-core-api
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j-patient:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: patient-dev
      KNOWLEDGE_GRAPH_NEO4J_URI: bolt://neo4j-knowledge:7687
      KNOWLEDGE_GRAPH_NEO4J_USERNAME: neo4j
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: knowledge-dev
      REDIS_URL: redis://redis:6379
    depends_on:
      neo4j-patient:
        condition: service_healthy
      neo4j-knowledge:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app/services/api
      - ./libs:/app/libs

  terminology-api:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.terminology-api
    container_name: pca-terminology-api
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      KNOWLEDGE_GRAPH_NEO4J_URI: bolt://neo4j-knowledge:7687
      KNOWLEDGE_GRAPH_NEO4J_USERNAME: neo4j
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: knowledge-dev
      REDIS_URL: redis://redis:6379
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    depends_on:
      neo4j-knowledge:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/terminology_api:/app/services/terminology_api
      - ./libs:/app/libs

  pipeline-worker:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.pipeline-worker
    container_name: pca-pipeline-worker
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j-patient:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: patient-dev
      KNOWLEDGE_GRAPH_NEO4J_URI: bolt://neo4j-knowledge:7687
      KNOWLEDGE_GRAPH_NEO4J_USERNAME: neo4j
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: knowledge-dev
      REDIS_URL: redis://redis:6379
      TERMINOLOGY_API_URL: http://terminology-api:8001
      PIPELINE_QUEUE_NAME: pipeline-jobs
    depends_on:
      neo4j-patient:
        condition: service_healthy
      neo4j-knowledge:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/pipeline_worker:/app/services/pipeline_worker
      - ./libs:/app/libs

  fhir-api:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.fhir-api
    container_name: pca-fhir-api
    ports:
      - "127.0.0.1:8002:8002"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j-patient:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: patient-dev
      KNOWLEDGE_GRAPH_NEO4J_URI: bolt://neo4j-knowledge:7687
      KNOWLEDGE_GRAPH_NEO4J_USERNAME: neo4j
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: knowledge-dev
    depends_on:
      neo4j-patient:
        condition: service_healthy
      neo4j-knowledge:
        condition: service_healthy
    volumes:
      - ./services/fhir-api:/app/services/fhir-api
      - ./libs:/app/libs

  analytics-api:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.analytics-api
    container_name: pca-analytics-api
    ports:
      - "127.0.0.1:8003:8003"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j-patient:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: patient-dev
      KNOWLEDGE_GRAPH_NEO4J_URI: bolt://neo4j-knowledge:7687
      KNOWLEDGE_GRAPH_NEO4J_USERNAME: neo4j
      KNOWLEDGE_GRAPH_NEO4J_PASSWORD: knowledge-dev
      REDIS_URL: redis://redis:6379
    depends_on:
      neo4j-patient:
        condition: service_healthy
      neo4j-knowledge:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/analytics-api:/app/services/analytics-api
      - ./libs:/app/libs

  ui:
    build:
      context: .
      dockerfile: infra/dockerfiles/Dockerfile.ui
    container_name: pca-ui
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_TERMINOLOGY_API_URL: http://localhost:8001
      NEXT_PUBLIC_FHIR_API_URL: http://localhost:8002
      NEXT_PUBLIC_ANALYTICS_API_URL: http://localhost:8003
    depends_on:
      - core-api
    volumes:
      - ./services/ui:/app
      - /app/node_modules

volumes:
  neo4j_patient_data:
  neo4j_knowledge_data:
  redis_data:
