# -- DI-LEO-AI-208 -- AI first-pass over the labeller backlog (backend service)
# IEC 62304 / ISO 13485 Design Input
#
# NOTE on numbering: this file replaces a now-clobbered DI-LEO-AI-201 that
# was used briefly during development for the same scope. The patient
# 4643293950 attestation-guard work shipped in parallel and claimed
# DI-LEO-AI-201; the AI first-pass moved to DI-LEO-AI-208 once the
# collision was discovered. UN-LEO-AI-085 has been updated accordingly.

- id: "DI-LEO-AI-208"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-085"
  requirement: >
    The system SHALL provide an AI first-pass service that, for each
    non-completed TrainingCandidate in the configured statuses, runs a
    Haiku-driven entity extraction seeded with few-shot exemplars drawn
    from status='completed' (gold) TrainingCandidates by
    BioClinicalBERT cosine similarity, runs the existing SNOMED
    resolver and validator (validate_proposal) on each AI-extracted
    entity with up to N alternative-search-term retries from
    Ask LEO smart coding (escalate_coding_from_candidates,
    Haiku tier='small'), assigns one of three verdicts
    (pre_done | delete | review), and applies the corresponding
    writeback action. status='completed' candidates MUST be excluded at
    fetch time AND defended again per-candidate via a TOCTOU re-check
    immediately before any write or delete.
  rationale: >
    A defensive auto-prune (UN-LEO-AI-083 v1, DI-LEO-AI-186) only
    removes the obviously bad and leaves the bulk of the
    ~900-candidate backlog untouched, so the queue stays unmanageable.
    An assistive AI first-pass that PRE-DOES the label and code,
    deletes only what cannot be coded after Haiku has tried alternative
    search terms, and visually marks every AI-suggested entity in the
    reviewer UI converts a 900-candidate backlog into a much smaller
    queue of confirmations plus a clear delete log.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Extractor: ai_extract_entities(candidate, selector, k,
          tier) MUST send EXTRACTION_SYSTEM_V1 plus k nearest-neighbour
          gold candidates (FewShotSelector cosine-similarity over
          BioClinicalBERT embeddings) plus the candidate text and
          existing entities_json hint to Haiku
          (call_haiku_extraction(tier='small')); on any LLM call
          failure, JSON parse failure, or zero parsed entities the
          extractor MUST fall back to the candidate's original
          entities_json with fallback_used=True.
      - type: "functional"
        spec: >
          Coder: ai_code_entity(entity, terminology) MUST first call
          validate_proposal on the top resolver hit; if accepted, return
          'accepted'; if rejected, MUST invoke
          escalate_coding_from_candidates (Haiku tier='small') to
          request an alternative search query, re-resolve, re-validate,
          and repeat up to coder_max_retries (default 2) before
          returning 'rejected' or 'not_codeable'.
      - type: "functional"
        spec: >
          Verdict: classify_candidate MUST return 'pre_done' when at
          least one entity coding is accepted AND no safety rail fires;
          'delete' when zero accepted AND at least one rejected AND no
          safety rail fires; 'review' when any safety rail fires
          (zero entities even after extraction; any entity carries an
          _AUTO_CODE_BLOCKED assertion; source startswith
          'manual_gold_seed'; live status='completed').
      - type: "functional"
        spec: >
          Writeback: writeback_pre_done MUST set
          entities_json_original to the prior entities_json ONLY when
          entities_json_original is currently NULL (write-once audit
          copy), then overwrite entities_json with the AI pass and
          stamp ai_first_pass_run_id and ai_first_pass_at; the same
          query MUST refuse to write when status='completed'.
      - type: "functional"
        spec: >
          Writeback: execute_delete MUST re-fetch the candidate and
          refuse to delete when status='completed'; otherwise it MUST
          execute DELETE_TRAINING_CANDIDATE_AND_ARTIFACTS and surface
          gold_labels_deleted and surface_form_tasks_deleted counts.
    constraints:
      - type: "safety"
        spec: >
          status='completed' candidates MUST never be modified or
          deleted by any phase of this workflow regardless of input
          parameters or run_id state.
      - type: "safety"
        spec: >
          source startswith 'manual_gold_seed' MUST always route to
          'review', never 'delete' or 'pre_done'.
      - type: "safety"
        spec: >
          Any entity whose assertion is in _AUTO_CODE_BLOCKED MUST
          force the verdict to 'review' regardless of how many siblings
          were coded successfully.
    dependencies:
      - "DI-LEO-AI-186"
      - "DI-LEO-AI-209"
    downstream_impacts:
      - "Training-data backlog volume"
      - "Reviewer cognitive load"
      - "NER model retraining cadence"
    technical_details:
      language: "Python"
      framework: "FastAPI service + thread pool"
      file_structure:
        - "services/api/app/services/candidate_ai_first_pass/_types.py"
        - "services/api/app/services/candidate_ai_first_pass/_gold_pool.py"
        - "services/api/app/services/candidate_ai_first_pass/_extractor.py"
        - "services/api/app/services/candidate_ai_first_pass/_coder.py"
        - "services/api/app/services/candidate_ai_first_pass/_verdict.py"
        - "services/api/app/services/candidate_ai_first_pass/_writeback.py"
        - "services/api/app/services/candidate_ai_first_pass/__init__.py"
        - "libs/cypher/training_candidate_queries.py"
      estimated_loc: 900

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-200 must pass all 12 backend test cases (extractor
      fallback x2, few-shot selection, coder accepted-first-try,
      coder retry-then-accept, coder retry-cap-exhausted, coder
      not-codeable short-circuit, verdict pre_done / delete / review
      ladder x4, writeback write-once invariant, writeback TOCTOU
      refusal, delete TOCTOU refusal).
    test_protocol: "VT-LEO-AI-200"

  safety_class: "B"
  risks:
    - "R-LEO-AI-197"
  tags:
    - "training-data"
    - "ai-assist"
    - "haiku"
    - "few-shot"
