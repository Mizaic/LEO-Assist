# -- DI-LEO-AI-126 -- Specialty-scoped staging with post-diagnosis window
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-126"
  type: "Safety"
  derived_from: ["UN-LEO-AI-052"]
  requirement: >
    The staging enrichment subgraph SHALL derive stage only from
    encounter text inside a fixed post-diagnosis window of
    STAGING_WINDOW_DAYS days (default 90) starting at the episode's
    diagnosis_date. Within that window, evidence rows SHALL be filtered
    through the cancer-site specialty marker for the episode's
    cancer_type so that TNM, Gleason and explicit stage text belonging
    to a different concurrent cancer pathway cannot contribute to this
    episode's stage. If no evidence rows match the specialty marker, the
    filter SHALL fall back to the unfiltered rows to avoid producing a
    null stage where the window contained relevant evidence that simply
    did not mention the site keyword.
  rationale: >
    Patients with multiple concurrent cancer pathways (for example
    breast + lower GI in the same 90 days) previously suffered stage
    cross-contamination: breast TNM leaked onto the colorectal episode
    and vice versa. A fixed post-diagnosis window plus per-site
    filtering closes the contamination path while keeping the window
    long enough to catch the MDT letter that follows every new
    diagnosis.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          _choose_window returns diagnosis_date and diagnosis_date + 90
          days when diagnosis_date parses; otherwise falls back to
          referral_date -> end_date.
      - type: "functional"
        spec: >
          filter_rows_by_specialty is invoked on evidence_rows before
          _extract_evidence with the episode's cancer_type.
      - type: "safety"
        spec: >
          When no rows match the specialty marker, the original rows
          are returned so stage derivation is not silently skipped.
    constraints:
      - type: "performance"
        spec: >
          SPECIALTY_MARKERS is a compiled-regex dict evaluated O(n)
          per row; no per-row DB calls.
    dependencies: ["DI-LEO-AI-104", "DI-LEO-AI-111"]
    downstream_impacts:
      - "libs/pipeline_graph/subgraphs/staging_enrichment.py"
      - "libs/clinical_scoping/specialty_markers.py"
      - "scripts/build_ncda_export.py"
    technical_details:
      language: "Python"
      framework: "LangGraph + Neo4j"
      file_structure:
        - "libs/clinical_scoping/specialty_markers.py"
        - "libs/pipeline_graph/subgraphs/staging_enrichment.py"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-121 cases pass: marker coverage, window is 90 days,
      filter scopes rows to the correct site, fallback retains rows
      when no marker matches.

    test_protocol: "VT-LEO-AI-121"

  safety_class: "B"
  risks: ["R-LEO-AI-086"]
  tags:
    - "staging"
    - "clinical-scoping"
    - "ncda"
