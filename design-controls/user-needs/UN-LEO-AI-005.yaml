# -- UN-LEO-AI-005 -- Anchor/Milestone Detection
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-005"
  title: "System identifies key milestone events that structure a clinical episode"
  description: |
    Clinical audit teams need the system to identify key milestone
    events -- first presentation, referral, specialist visit,
    investigation, diagnosis, and treatment -- that define the
    structure of a clinical episode. Milestones are detected using
    programme-defined milestone definitions and coded SNOMED concepts.
    Accurate milestone detection is essential for episode building,
    duration calculation, and pathway quality assessment.

  stakeholder:
    type: "end_user"
    role: "Clinical Audit Team Member"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    Clinical episodes are defined by their milestones. Without accurate
    milestone detection, the system cannot reconstruct the patient
    pathway, calculate waiting times, or identify breaches of national
    standards. Manual milestone identification is subjective and
    time-consuming.

  benefit: "Automated, consistent identification of pathway milestones across all patients, enabling accurate duration calculations"

  use_case: |
    1. Coded encounters with SNOMED annotations are available for a
       patient.
    2. System loads programme-defined milestone definitions (e.g. first
       GP presentation, two-week-wait referral, diagnostic test,
       histology report, MDT discussion, treatment start).
    3. System scans coded encounters for SNOMED concepts matching each
       milestone type.
    4. System assigns dates and confidence scores to detected milestones.
    5. Where multiple candidates exist for a milestone, the system
       selects the most appropriate based on date ordering and context.
    6. Detected milestones are passed to the episode building stage.

  current_solution: "Manual identification of milestone dates by auditors reviewing individual patient records and recording in spreadsheets"

  pain_points:
    - "Manual milestone identification is subjective"
    - "Different auditors identify different dates"
    - "Time-consuming to cross-reference encounters"
    - "Milestone types vary by programme"

  acceptance_criteria:
    - "System shall detect milestones using programme-defined milestone types and SNOMED value sets"
    - "System shall assign dates and confidence scores to detected milestones"
    - "System shall handle multiple milestone candidates and select the most appropriate"
    - "System shall achieve accuracy >=90% for milestone detection against gold-standard data"
    - "System shall link milestones to source encounters"

  success_metrics:
    - metric: "Milestone detection accuracy"
      target: ">=90% against gold-standard labels"
      baseline: "Manual review: variable, estimated 80-85%"
    - metric: "Date accuracy"
      target: "Within 1 day of expert consensus"
      baseline: "Manual review: 2-3 day variance between auditors"
    - metric: "Processing time per patient"
      target: "<=3 seconds"
      baseline: "Manual review: 15-30 minutes per patient"

  regulatory_impact: "medium"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1.5"
    - "NHS NCDA programme requirements"
    - "NHS Cancer Waiting Times standards"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "NHS Cancer Waiting Times guidance"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: []
  validation_tests: []

  tags: ["anchor-detection", "milestone", "core-capability", "pipeline", "episode-building"]
