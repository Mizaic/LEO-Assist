# --------------------------------------------------------------------------
# Manual gold seed - 2026-04-17
# --------------------------------------------------------------------------
#
# Hand-authored gold training records for the spancat NER head, sourced from
# 21 real patient encounters (4 cancer-positive, 17 benign / excluded /
# normal control cases). The sentence text in this manifest has been
# de-identified by libs.utils.deidentify.deidentify_text() and validated by
# libs.ner.deid_validator.DeIdValidator.check_record() with zero residual
# PHI issues (see scripts/_inspect_manual_gold_deid.py).
#
# Provenance fields (encounter_id, episode_prefix, patient_class) are kept
# for our local audit trail only. They are NOT written to the GoldLabel
# or TrainingCandidate nodes - those nodes are GDPR-isolated and only
# carry the de-identified sentence + entity payload.
#
# Scope:
#   - Class B verification dataset for VT-LEO-AI-157.
#   - Implements DI-LEO-AI-159 (manual gold seed for cancer / benign
#     discrimination) under UN-LEO-AI-074.
#
# Schema:
#   - schema_version    : str  - manifest schema version
#   - generated_at      : str  - ISO date
#   - source            : str  - written into GoldLabel.source
#   - verified_by       : str  - written into GoldLabel.verified_by
#   - quality_score     : float - written into GoldLabel.quality_score
#   - records[]:
#       tag             : str  - stable human key (e.g. POS-01-...)
#       encounter_id    : str  - provenance only (NOT persisted to KG)
#       episode_prefix  : str  - provenance only (NOT persisted to KG)
#       text            : str  - de-identified sentence text
#       entities[]:
#           text                : str  - exact surface form found in `text`
#           label               : str  - lowercase SNOMED semantic tag
#           semantic_tag        : str  - same as `label` (kept for parity)
#           snomed_concept_id   : str  - SNOMED CT concept id (UK edition)
#           snomed_term         : str  - SNOMED preferred term
#           assertion           : str  - one of:
#               present | absent | refuted | possible | historical |
#               planned | hypothetical | family | declined | cancelled
#
# Notes on label vocabulary:
#   - We use the lowercase SNOMED semantic-tag style ("disorder",
#     "finding", "procedure", "observable_entity", "body_structure")
#     because that matches existing GoldLabel records and the spaCy
#     label normalisation map in services/training_worker/app/
#     label_exporter.py::_LABEL_MAP.
#   - The spancat training signal is (start, end, label) only; assertion
#     is recorded for ConText evaluation and is not part of the spancat
#     training signal. start/end offsets are re-derived at write time
#     by libs.ner.span_finder.find_span() from the surface text.
#
# Notes on dropped Read codes:
#   - The GP record originals contain bracketed Read codes alongside the
#     clinical phrase, e.g. "(537..)", "(X78WM)", "(X00pE)".
#   - Some Read codes (X78WM, X00pE, X70nW) collide with our UK-postcode
#     regex in libs.utils.deidentify and would be replaced by [POSTCODE].
#   - In those records we drop the bracketed Read code from the sentence
#     text before authoring spans. The clinical phrase and the SNOMED
#     concept id are preserved in the entity payload.
# --------------------------------------------------------------------------

