# -- DI-LEO-AI-227 -- No-anchor episode rejection (Pattern N1)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-227"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-005"
  requirement: >
    The text-anchor detector SHALL tag a ``diagnosis_confirmed``
    anchor with ``is_narrative_restatement: True`` when the encounter
    body matches the unambiguous shape of a sick note (eMED3, MED3,
    fit note, "not fit for work", "unfit for work", "fitness to /
    for work", "statement of fitness for work", "sickness
    certificate / note") OR a "known X cancer" / "history of X
    cancer" narrative restatement (where X is a recognised cancer
    site token kept aligned with
    ``_PROBLEM_HEADER_CANCER_TOKEN_RX``). The episode builder SHALL
    then suppress materialisation of any FLOATING diagnosis-led
    EpisodeOfCare group whose diagnosis anchors are ALL tagged with
    ``is_narrative_restatement: True``. A floating group is one
    produced by ``_build_diagnosis_led_groups`` whose
    ``ref_anchors`` list is empty (i.e. no referral could be claimed
    for this diagnosis cluster, even by the lookback fallback pass).
    The new helper
    ``encounter_diagnosis_is_narrative_restatement(text)`` MUST be
    called from the diagnosis_confirmed emission path AFTER
    diagnosis_source assignment so every soft and hard source is
    tagged consistently. The guard MUST be inert when at least one
    diagnosis anchor in the floating group is NOT tagged as a
    narrative restatement (preserves genuine fresh-diagnosis
    floating groups), and MUST be inert when the diagnosis group
    has claimed a referral (the group is no longer floating and
    real clinical evidence anchors the episode).
  rationale: >
    Patient 4802892365's phantom episode 862a306e1ee82616 was built
    from two diagnosis_confirmed anchors with no referral to attach
    to: the 2025-09-24 "Cancer care review and general catch up
    given recent events. Referred by me on 2ww earlier this year,
    confirmed breast cancer. Post mastectomy recovery review."
    encounter (Pattern K firing on the problem-list malignancy
    code), and the 2025-12-06 "eMED3 (2010) new statement issued,
    not fit for work ... known breast ca" sick-note (Pattern K /
    cancer_follow_up_template firing on the narrative). Both are
    pure restatements of the already-confirmed lobular carcinoma
    that was diagnosed and treated under the real episode
    1ecfb55618c2a6d2 -- yet because neither had a referral within
    the lookback window, the episode builder synthesised a second
    "completed" breast-cancer episode from the two restatement
    anchors plus two unrelated 2024 pharmacist-failed-encounter
    care_obstructions. Without N1 every routine cancer follow-up
    review and every sick note that mentions "known X ca" can
    materialise a phantom episode whenever the source-of-truth
    referral falls outside the lookback window. N1 is the safety
    net that catches restatement-only floating groups even when
    the upstream Pattern K / cancer_follow_up_template emission
    cannot be tightened (e.g. cancer follow-up templates that
    really do imply an active diagnosis but only ever appear after
    the index event).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Encounter body containing "eMED3 (2010) new statement
          issued, not fit for work" MUST cause
          ``encounter_diagnosis_is_narrative_restatement`` to
          return True.
      - type: "functional"
        spec: >
          Encounter body containing "known breast ca, post
          mastectomy" MUST cause
          ``encounter_diagnosis_is_narrative_restatement`` to
          return True.
      - type: "functional"
        spec: >
          Encounter body containing "PMHx: history of breast
          carcinoma 2023" MUST cause
          ``encounter_diagnosis_is_narrative_restatement`` to
          return True.
      - type: "functional"
        spec: >
          Encounter body "Cancer care review and general catch up
          ... referred by me on 2ww earlier this year, confirmed
          breast cancer ... post mastectomy recovery review" MUST
          cause every diagnosis_confirmed anchor emitted from that
          encounter to carry ``is_narrative_restatement: True``.
      - type: "safety"
        spec: >
          Encounter body "Major: Invasive carcinoma of breast
          (Ya0ln) - lobular (New Episode). Plan: Refer to breast
          clinic urgently. Discussed diagnosis with patient." MUST
          NOT carry ``is_narrative_restatement: True`` (genuine
          fresh diagnosis must not be tagged).
      - type: "safety"
        spec: >
          ``_build_diagnosis_led_groups`` MUST suppress a floating
          group whose diagnosis anchors are ALL tagged
          ``is_narrative_restatement: True`` (no closed group
          emitted, no open group emitted, no episode_id
          generated).
      - type: "safety"
        spec: >
          ``_build_diagnosis_led_groups`` MUST keep a floating
          group when at least one diagnosis anchor is NOT tagged
          (mixed-anchor groups continue to materialise).
      - type: "safety"
        spec: >
          ``_build_diagnosis_led_groups`` MUST keep a diagnosis
          group when a referral has been claimed (group is no
          longer floating; N1 has no effect on referral-anchored
          episodes regardless of restatement tags).
      - type: "performance"
        spec: >
          The wipe-and-rebuild after N1 lands MUST eliminate the
          phantom episode 862a306e1ee82616 for patient
          4802892365, leaving exactly one EpisodeOfCare for that
          patient (the real 1ecfb55618c2a6d2 breast-cancer
          episode).
    constraints:
      - type: "safety"
        spec: >
          The narrative-restatement vocabulary is conservative
          and aligned with the existing
          ``_PROBLEM_HEADER_CANCER_TOKEN_RX`` site list -- new
          site tokens or restatement phrases must be added
          deliberately with a regression test in
          tests/test_pattern_n1_no_anchor_episode_rejection.py.
      - type: "safety"
        spec: >
          The guard NEVER suppresses an episode that contains a
          referral. Loss of a real diagnosis would require BOTH
          the absence of any referral within the diagnosis-
          claim lookback window AND the entire diagnosis cluster
          consisting of restatement-tagged anchors only -- in
          which case the diagnosis evidence is by definition
          historical and there is no fresh clinical event to
          anchor an episode on.
    dependencies:
      - "DI-LEO-AI-145"
      - "DI-LEO-AI-215"
    downstream_impacts:
      - "Anchor detector (diagnosis_confirmed emission path)"
      - "Episode builder (_build_diagnosis_led_groups floating-group filter)"
      - "EpisodeOfCare graph (eliminates phantom no-referral diagnosis-only episodes built from sick notes and known-cancer narratives)"
      - "Cohort EpisodeOfCare counts (drops phantom restatement-only episodes; expected reduction across patients with active cancer diagnoses who routinely receive sick notes or cancer-care reviews)"
    technical_details:
      language: "Python"
      framework: "Anchor detector + episode builder"
      file_structure:
        - "libs/domains/code_inventories.py"
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_grouping.py"
      estimated_loc: 105

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-219 must pass on all critical and total cases,
      including the canonical patient 4802892365 sick-note and
      cancer-care-review tagging tests, the floating-group
      rejection test, the mixed-anchor preservation test, and the
      referral-attached preservation test. Cohort wipe-and-rebuild
      MUST eliminate phantom episode 862a306e1ee82616 and reduce
      total EpisodeOfCare count by at least 1.
    test_protocol: "VT-LEO-AI-219"

  safety_class: "B"
  risks:
    - "R-LEO-AI-210"
  tags:
    - "anchor-detector"
    - "episode-builder"
    - "no-anchor-rejection"
    - "patient-4802892365"
    - "pattern-n1"
