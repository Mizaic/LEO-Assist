# -- DO-LEO-AI-527 -- Similar-candidates batch dialog highlighter + match rationale chips
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-527"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-527"]
    user_needs: ["UN-LEO-AI-096"]
    risks_addressed: ["R-LEO-AI-063", "R-LEO-AI-174"]
    verification_tests: ["VT-LEO-AI-525"]

  specification:
    title: "Similar-candidates batch dialog uses host-search vocabulary"
    description: |
      Adds the shared `<HighlightedText>` primitive and the outlined
      "why this matched" chip taxonomy to each row in the
      `SimilarCandidatesBatch` dialog, sourcing the active query
      from `GoldDatasetPanel`'s `debouncedSearch` so chips reflect
      what drove the source-row context.
    acceptance_criteria:
      - criterion: "Imports the shared encounterRelevance + HighlightedText helpers"
        type: "functional"
        measurement: "Test"
        target: "Imports `expandSearchTerms`, `computeMatchRationale`, `HighlightedText`, `collectHighlightTerms`"
      - criterion: "Exposes `search?: string` and memoises expansion"
        type: "functional"
        measurement: "Test"
        target: "useMemo(() => expandSearchTerms(search), [search])"
      - criterion: "Renders rationale chip row with stable testids and 4-chip cap"
        type: "functional"
        measurement: "Test"
        target: "data-testid=similar-candidate-row-match-rationale, similar-candidate-row-match-rationale-chip, slice(0, 4)"
      - criterion: "GoldDatasetPanel forwards debouncedSearch"
        type: "functional"
        measurement: "Test"
        target: "<SimilarCandidatesBatch ... search={debouncedSearch}>"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/SimilarCandidatesBatch.tsx"
        description: "Per-row HighlightedText + rationale chip row"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "Forwards debouncedSearch into the dialog"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 70
      key_functions:
        - "SimilarCandidatesBatch (default export)"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Reviewer batch-acceptance UI -- chips MUST stay visual and not influence accept/review/skip handlers"
    risk_control_measures:
      - "Read-only client-side decoration, no impact on accept / review / skip flows"
      - "Falls back to plain truncated string when no terms hit"
      - "Stable data-testids enable end-to-end Playwright parity assertions"

  verification_status:
    verification_method: "Test"
    verification_complete: true
