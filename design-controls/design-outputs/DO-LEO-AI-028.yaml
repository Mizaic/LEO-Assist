# -- DO-LEO-AI-028 -- Coding Verification Consensus Function
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-028"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-041"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-026"]
    verification_tests: ["VT-LEO-AI-026"]

  specification:
    title: "Coding Verification Consensus Function"
    description: |
      Verifies terminology index matches using dual-model consensus,
      returning correct, incorrect, or uncertain. Mode-aware fail
      behaviour: autonomous defaults to uncertain (do not auto-approve),
      HITL defaults to correct (let human review). Reuses the generic
      consensus runner (DO-LEO-AI-023) with a domain-specific system
      prompt and verdict parser.
    acceptance_criteria:
      - criterion: "Correct verdict"
        type: "functional"
        measurement: "Test"
        target: "Consensus agreement on correct -> returns 'correct'"
      - criterion: "Incorrect verdict"
        type: "functional"
        measurement: "Test"
        target: "Consensus agreement on incorrect -> returns 'incorrect'"
      - criterion: "Autonomous fail-safe"
        type: "safety"
        measurement: "Test"
        target: "Failure defaults to uncertain in autonomous mode"
      - criterion: "HITL fail-safe"
        type: "safety"
        measurement: "Test"
        target: "Failure defaults to correct in HITL mode"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/llm_client/escalation.py"
        description: "verify_coding_consensus() and _parse_verify_verdict()"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 30
      key_functions: ["verify_coding_consensus", "_parse_verify_verdict"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Autonomous mode never defaults to correct on failure"
      - "Encounter text sanitised and capped at 16000 chars"
      - "Verdict validated against allowlist (correct, incorrect, uncertain)"
    risk_control_measures:
      - "Dual-model consensus via DO-LEO-AI-023"
      - "Verdict parsing rejects any value not in the valid set"

  verification_status:
    verification_method: "Test"
    verification_complete: true
