# -- R-LEO-AI-067 -- Extraction check introduces incorrect entity corrections
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-067"
  title: "Extraction quality check drops valid entities or adds unsupported entities"

  hazard:
    description: >
      The extraction quality LLM check may incorrectly remove clinically valid
      entities or add unsupported mentions due to prompt misinterpretation.
    category: "clinical_safety"

  hazardous_situation: >
    A valid disorder or finding mention is dropped by extraction_check, or an
    unsupported mention is added. The modified entity set proceeds to
    terminology and persistence, resulting in under-coding or incorrect coded
    evidence in patient and training stores.

  harm:
    description: >
      Clinical coding quality metrics are degraded and review queues may contain
      missing or spurious entities, delaying remediation and increasing residual
      coding error in downstream analytics.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Constrain extraction_check output to four operations only (drop,
        correct_assertion, correct_label, add) and require strict JSON parse
        with invalid output fallback to no-op updates.
      implemented_by: ["DI-LEO-AI-097"]
      verified_by: ["VT-LEO-AI-097"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Provide domain-focused few-shot examples including exclusion/screening
        language and template noise to reduce unsupported additions.
      implemented_by: ["DI-LEO-AI-097"]
      verified_by: ["VT-LEO-AI-097"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Apply deterministic referral-procedure assertion guard so wording like
        "referral for suspected X" is kept as a planned procedure and not
        treated as an uncertain diagnosis assertion.
      implemented_by: ["DI-LEO-AI-097"]
      verified_by: ["VT-LEO-AI-097"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Single-turn constrained output and explicit test coverage reduce incorrect
      correction likelihood. Residual issues are further contained by coding
      check and HITL review pathways.

  monitoring:
    monitoring_plan: >
      Monitor weekly extraction-check change rates (drop/add/correction) and
      sample reviewed mismatches from coding review queue for regression.
    metrics:
      - "Extraction check drop rate per 100 encounters"
      - "Extraction check add rate per 100 encounters"
      - "Reviewer disagreement rate on llm_added entities"
    review_frequency: "Weekly"

  metadata:
    identified_by: "NER + dual LLM quality gate design review 2026-04-11"
    identified_date: "2026-04-11"
    status: "analyzed"
    tags:
      - "extraction-check"
      - "llm"
      - "coding-quality"
