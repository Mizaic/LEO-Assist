# -- R-LEO-AI-063 -- Incorrect patient data mutation via DQ remediation API
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-063"
  title: "Incorrect patient graph mutation via DQ remediation API"

  hazard:
    description: >
      A platform administrator uses the DQ remediation API endpoints to delete
      encounters, modify assertions, or write DOCUMENTS edges incorrectly,
      corrupting patient clinical data in the graph.
    category: "clinical_safety"

  hazardous_situation: >
    An admin runs a remediation operation (e.g. delete-patient, fix-assertions,
    writeback) with incorrect parameters or without reviewing the dry-run
    preview, causing valid clinical data to be deleted or incorrect clinical
    coding to be written to the patient graph, which downstream affects episode
    detection, safety-net alerts, or clinical coding outputs.

  harm:
    description: >
      Patient episode or coding data is corrupted, leading to incorrect cancer
      pathway status, missed safety-net alerts, or incorrect SNOMED codes
      being exported or displayed to clinical users.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        All mutation endpoints default to dry_run=true. The API explicitly
        returns a preview of affected nodes/edges when dry_run=true and
        performs no writes. The caller must explicitly set dry_run=false to
        execute the mutation.
      implemented_by: ["DI-LEO-AI-089"]
      verified_by: ["VT-LEO-AI-089"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        All /admin/dq/remediation/* endpoints are gated by require_admin
        (platform admin only). Org admins and clinical users cannot reach these
        endpoints.
      implemented_by: ["DI-LEO-AI-089"]
      verified_by: ["VT-LEO-AI-089"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The MCP server exposes read-only tools only. Mutation tools are excluded
        from the MCP tool list so AI agents cannot trigger graph mutations.
      implemented_by: ["DI-LEO-AI-089"]
      verified_by: ["VT-LEO-AI-089"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        The admin UI presents a confirmation dialog showing the dry-run preview
        before any mutation is applied. Destructive operations show a yellow
        warning banner.
      implemented_by: ["DI-LEO-AI-089"]
      verified_by: ["VT-LEO-AI-089"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With dry-run default, admin-only access, MCP read-only restriction, and
      UI confirmation dialogs, the probability of an accidental or uninformed
      mutation is very low. Any mutation that does occur is auditable via the
      Neo4j transaction log and can be reversed. The residual risk is low and
      acceptable for an internal admin-only tool used by platform engineers.

  monitoring:
    monitoring_plan: >
      Monitor Neo4j write operations from the DQ remediation endpoints via
      application logs. Alert on any non-dry-run remediation operation
      exceeding 10 nodes affected. Review quarterly as part of DQ governance.
    metrics:
      - "Count of non-dry-run remediation operations per week"
      - "Count of affected nodes per remediation operation"
      - "Error rate on remediation endpoints"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review -- DQ toolkit implementation"
    identified_date: "2026-04-07"
    status: "analyzed"
    tags:
      - "data-quality"
      - "remediation"
      - "admin-tooling"
