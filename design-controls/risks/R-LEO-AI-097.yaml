# -- R-LEO-AI-097 -- Over-aggressive duplicate merge collapses genuine multi-primary cancers
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-097"
  title: >
    The evidence-wins duplicate-merge rule (DI-LEO-AI-137) could
    incorrectly collapse a genuine second primary cancer into an
    unrelated primary episode if both diagnoses happen to fall in
    the same SAME_EPISODE_DAYS window, corrupting the patient's
    true cancer history.

  hazard:
    description: >
      A patient with two genuinely distinct primary cancers whose
      first clinical encounters fall within SAME_EPISODE_DAYS
      (default 180 days) could have one primary merged into the
      other, losing a clinical record. Example: a breast cancer
      diagnosed at mammography and an incidental melanoma
      diagnosed at the same dermatology review 30 days later.
    category: "clinical_safety"

  hazardous_situation: >
    A retrospective audit reviewer opens the patient record and
    sees only the breast episode. The melanoma pathway (including
    any stage, treatment start, and safety-netting signal) is
    hidden behind a 'merged' flag on a shadow episode. If the
    reviewer never drills into merged_into references, the
    melanoma signal is effectively lost for audit purposes.

  harm:
    description: >
      Missed audit detection of a second primary cancer. No
      direct patient harm (the underlying coded and textual
      record is preserved in Encounter nodes), but a loss of
      visibility in the primary audit workflow and a potential
      under-reporting of multi-primary patients.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Evidence-wins rule requires ONE and only ONE episode in a
        cluster to have its cancer_type corroborated by its
        diagnosis_confirmed encounter text. If BOTH candidates
        are text-corroborated (the multi-primary case), the
        cluster is left untouched and a warning is logged for
        human review.
      implemented_by: ["DI-LEO-AI-137"]
      verified_by: ["VT-LEO-AI-138"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Merges are reversible: MARK_MERGED_Q records merged_into
        and merge_reasoning; MOVE_LINKS_Q tags every migrated
        IS_PART_OF edge with r.linked_by='merge_duplicate', so a
        rollback script can reconstruct the pre-merge graph.
      implemented_by: ["DI-LEO-AI-137"]
      verified_by: ["VT-LEO-AI-138"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        A DQ report lists patients with >1 merged_into chain per
        year, flagging for monthly human review to catch
        any mis-merges.
      implemented_by: ["DI-LEO-AI-137"]
      verified_by: ["VT-LEO-AI-138"]
      effectiveness: "partially_effective"
    - control_type: "information_for_safety"
      description: >
        Episode detail UI shows merged-in episodes expanded when
        present, so a reviewer can always see the underlying
        cluster members.
      implemented_by: ["DI-LEO-AI-137"]
      verified_by: ["VT-LEO-AI-138"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The evidence-wins rule is deliberately conservative: a
      multi-primary patient with distinct diagnosis text for both
      primaries will fail the single-winner check and be left
      alone. The reversibility guarantees mean any wrongful merge
      can be undone. The combination of automatic skip + human
      review on the warning log + reversible writes keeps
      residual probability low.

  monitoring:
    monitoring_plan: >
      Monthly DQ report of patients with >=2 merges within a
      calendar year; manual review to confirm the merges are
      correct. Logger warnings on ambiguous-cluster skips are
      surfaced to the operations team for the same review.
    metrics:
      - "count of auto-merges per month"
      - "count of ambiguous-cluster skip warnings per month"
      - "patients with >=2 merges in 12 months"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk-forward review of DI-LEO-AI-137 merge policy"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "ncda"
      - "episode-builder"
      - "duplicate-merge"
      - "multi-primary"
