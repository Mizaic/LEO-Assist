# -- DI-LEO-AI-012 -- Quality Checker
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-012"
  type: "Functional"
  derived_from: ["UN-LEO-AI-007"]
  requirement: "The system SHALL validate completed clinical episodes for quality issues including duration outliers, missing mandatory milestones, temporal anomalies, low-confidence classifications, coding contradictions, and unactioned alerts"
  rationale: "Quality validation acts as a gate before episodes are accepted as final audit data. Automated checks catch systematic errors that would distort population-level analysis. Human reviewers cannot scale to validate thousands of episodes manually."

  machine_spec:
    agent_prompt: |
      Implement the QualityChecker class (~250 LOC).

      SINGLE PURPOSE: Validate completed clinical episodes against quality
      rules and flag issues before episodes are accepted as final audit data.

      REQUIREMENTS:
      1. Check episode duration against expected ranges and flag outliers.
      2. Verify all mandatory milestones are present for the episode type.
      3. Detect temporal anomalies (e.g. treatment before diagnosis).
      4. Flag episodes with low-confidence AI classifications.
      5. Identify coding contradictions (e.g. conflicting SNOMED codes).
      6. Report unactioned guideline alerts attached to the episode.

      METHODS:
      - check(episode): Run all quality checks and return a QualityReport.
      - check_duration(episode): Validate duration against expected ranges.
      - check_milestones(episode): Verify mandatory milestones present.
      - check_temporal(episode): Detect temporal ordering anomalies.
      - check_confidence(episode): Flag low-confidence classifications.
      - check_coding(episode): Identify contradictory codes.
      - check_alerts(episode): Report unactioned alerts.

      CODE CLARITY:
      - Each check method returns a list of QualityIssue objects.
      - Use guard clauses to flatten nesting.
      - Keep functions under 30 lines.

    acceptance_criteria:
      - type: "test"
        spec: "Quality issue detection rate >= 95% against known-issue test cases"
      - type: "test"
        spec: "Zero false negatives on temporal anomaly detection"
      - type: "test"
        spec: "All mandatory milestone checks enforce programme configuration"

    constraints:
      - type: "performance"
        spec: "Quality check for a single episode completes in < 1 second"
      - type: "safety"
        spec: "Episodes failing critical quality checks are blocked from finalisation"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "review_service"
      - "kpi_calculator"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/quality_checker.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Quality issue detection rate >= 95% against known-issue test cases"
    test_protocol: "VT-LEO-AI-012"

  safety_class: "B"
  risks: ["R-LEO-AI-007"]
  tags: ["quality-validation", "data-quality", "analysis"]
