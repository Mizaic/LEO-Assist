name: CD - Deploy

# Atlas trace
#   DO: DO-6036D724
#   DI: DI-71087A9E
#   Look up via: get_design_control(dc_type="design-output", dc_id="DO-6036D724")
#
# Selective deploy (dev via workflow_run):
#   Reads CI artifact built-services.json and only retags Container Apps
#   that were rebuilt. Bicep uses imageTag=latest so unchanged services
#   keep their current :latest digest. val/prod promotions still require
#   an immutable sha-* tag that exists for every service image.
#
# Hardening notes
#   - Third-party / Microsoft-owned actions are pinned to immutable commit
#     SHAs with the human-readable tag in a comment. Renovate (or a manual
#     audit) is responsible for bumping the SHA + comment together.
#   - Every value that originates from user input or a webhook payload
#     (workflow_dispatch inputs, github.event.*) flows into the shell via
#     the step's `env:` block, never via inline `${{ }}` expansion. This
#     blocks GHA template injection through crafted tag / SHA values.

on:
  workflow_run:
    workflows: ["CI - Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, val, prod]
      image_tag:
        description: Image tag to deploy (default = sha of HEAD)
        required: false
      services:
        description: Optional comma-separated services to retag (dev only; empty = all)
        required: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  MIZAIC_ACR_NAME: mizaicleoacr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Resolve image tag and built services
        id: tag
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          INPUT_SERVICES: ${{ github.event.inputs.services }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ALL_SERVICES="core-api terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker ui"
          TAG="$INPUT_IMAGE_TAG"
          SERVICES=""
          BICEP_TAG="latest"
          BUILD_ALL="false"

          if [ "$EVENT_NAME" = "workflow_run" ]; then
            TAG=""
            mkdir -p /tmp/ci-manifest
            if gh run download "$WORKFLOW_RUN_ID" \
              --name built-services \
              --dir /tmp/ci-manifest; then
              SERVICES="$(jq -r '.services // [] | join(",")' /tmp/ci-manifest/built-services.json)"
              BUILD_ALL="$(jq -r 'if .build_all then "true" else "false" end' /tmp/ci-manifest/built-services.json)"
              TAG="$(jq -r '.image_tag // empty' /tmp/ci-manifest/built-services.json)"
            else
              echo "No built-services artifact; deploying no image retags."
              SERVICES=""
            fi
            if [ -n "$SERVICES" ] && [ -z "$TAG" ]; then
              echo "Rebuilt services listed but image_tag is missing" >&2
              exit 1
            fi
            if [ "$BUILD_ALL" = "true" ]; then
              if [ -z "$TAG" ]; then
                echo "Full build has no image_tag" >&2
                exit 1
              fi
              BICEP_TAG="$TAG"
              SERVICES="$(echo "$ALL_SERVICES" | tr ' ' ',')"
            fi
          else
            if [ -z "$TAG" ]; then
              TAG="$(python3 scripts/ci/image_tag.py)"
            fi
            if [ -n "$INPUT_SERVICES" ]; then
              SERVICES="$(echo "$INPUT_SERVICES" | tr ',' ' ' | xargs | tr ' ' ',')"
            else
              SERVICES="$(echo "$ALL_SERVICES" | tr ' ' ',')"
            fi
            BICEP_TAG="$TAG"
          fi

          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "image_tag $TAG contains disallowed characters" >&2
            exit 1
          fi
          if ! [[ "$BICEP_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "bicep_tag $BICEP_TAG contains disallowed characters" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bicep_tag=$BICEP_TAG" >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG bicep_tag=$BICEP_TAG services=${SERVICES:-none}"

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Applies infra/bicep/main.bicep: Container App env vars (internal URLs, secrets refs,
      # FRONTEND_URL, etc.). Image tags below only update container images that CI rebuilt.
      - name: Deploy Bicep stack
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.bicep_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          az deployment group create \
            --resource-group leo-ai-dev \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/dev.bicepparam \
            --parameters "imageTag=$IMAGE_TAG" \
            --name "cd-dev-$RUN_NUMBER"

      - name: Update Container App image tags
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          SERVICES_CSV: ${{ steps.tag.outputs.services }}
        run: |
          set -euo pipefail
          if [ -z "$SERVICES_CSV" ]; then
            echo "No rebuilt services to retag; leaving running revisions unchanged."
            exit 0
          fi
          # Must match images built in ci-build.yml and apps in infra/bicep/modules/container-apps.bicep
          SERVICES="$(echo "$SERVICES_CSV" | tr ',' ' ')"
          for SERVICE in $SERVICES; do
            if ! [[ "$SERVICE" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "Refusing invalid service name: $SERVICE" >&2
              exit 1
            fi
            az containerapp update \
              --name "$SERVICE" \
              --resource-group leo-ai-dev \
              --image "${MIZAIC_ACR_NAME}/${SERVICE}:${IMAGE_TAG}" \
              --output none
            echo "Updated $SERVICE -> ${MIZAIC_ACR_NAME}/${SERVICE}:${IMAGE_TAG}"
          done

      - name: Post-deploy smoke checks
        run: |
          CORE_EXTERNAL=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-dev \
            --query properties.configuration.ingress.external \
            --output tsv)
          UI_FQDN=$(az containerapp show \
            --name ui \
            --resource-group leo-ai-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          CORE_FQDN=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-dev \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [ "$CORE_EXTERNAL" != "false" ]; then
            echo "core-api ingress must remain internal-only; got external=${CORE_EXTERNAL}"
            exit 1
          fi
          ACA_DOMAIN="${CORE_FQDN#core-api.internal.}"
          for APP in core-api ui analytics-api terminology-api fhir-api model-inference training-worker research-worker pipeline-worker; do
            BAD_URLS=$(az containerapp show \
              --name "$APP" \
              --resource-group leo-ai-dev \
              --query "properties.template.containers[0].env[?(contains(name, '_URL') || contains(name, '_BASE') || contains(name, 'WORKER') || name=='CODING_MODEL_ENDPOINT') && value != null && contains(value, '.${ACA_DOMAIN}') && !contains(value, '.internal.${ACA_DOMAIN}')].[name,value]" \
              --output tsv)
            if [ -n "$BAD_URLS" ]; then
              echo "${APP} has non-internal ACA service URL envs:"
              echo "$BAD_URLS"
              exit 1
            fi
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "https://${UI_FQDN}/"

      - name: Verify revision health (dev)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          for APP in $APPS; do
            echo "Checking revision states for ${APP}"
            BAD=$(az containerapp revision list \
              --name "$APP" \
              --resource-group leo-ai-dev \
              --query "[?properties.active==\`true\` && (properties.runningState=='Failed' || properties.runningState=='ActivationFailed')].name" \
              --output tsv)
            if [ -n "$BAD" ]; then
              echo "Active failed revisions found for ${APP}: ${BAD}"
              exit 1
            fi
          done

      - name: Report deployed images (dev)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          {
            echo "## Deployed ACA images - dev"
            echo ""
            echo "| App | Active image | Latest revision |"
            echo "| --- | --- | --- |"
            for APP in $APPS; do
              IMAGE=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-dev \
                --query "properties.template.containers[0].image" \
                --output tsv)
              REVISION=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-dev \
                --query "properties.latestRevisionName" \
                --output tsv)
              echo "| $APP | $IMAGE | $REVISION |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-val:
    name: Deploy to validation
    runs-on: ubuntu-latest
    environment: validation
    concurrency:
      group: deploy-val
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'val'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate promotion image tag
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="$INPUT_IMAGE_TAG"
          if [ -z "$TAG" ]; then
            echo "image_tag is required for validation promotion"
            exit 1
          fi
          if [[ "$TAG" != sha-* ]]; then
            echo "image_tag must be immutable (sha-*) for promotion"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "image_tag contains disallowed characters"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Full stack Bicep (env vars + ingress). Prod path is the same pattern.
      - name: Deploy to validation
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="$INPUT_IMAGE_TAG"
          az deployment group create \
            --resource-group leo-ai-val \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/val.bicepparam \
            --parameters "imageTag=$TAG" \
            --name "cd-val-$RUN_NUMBER"

      - name: Post-deploy smoke checks
        run: |
          CORE_EXTERNAL=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-val \
            --query properties.configuration.ingress.external \
            --output tsv)
          UI_FQDN=$(az containerapp show \
            --name ui \
            --resource-group leo-ai-val \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          CORE_FQDN=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-val \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [ "$CORE_EXTERNAL" != "false" ]; then
            echo "core-api ingress must remain internal-only; got external=${CORE_EXTERNAL}"
            exit 1
          fi
          ACA_DOMAIN="${CORE_FQDN#core-api.internal.}"
          for APP in core-api ui analytics-api terminology-api fhir-api model-inference training-worker research-worker pipeline-worker; do
            BAD_URLS=$(az containerapp show \
              --name "$APP" \
              --resource-group leo-ai-val \
              --query "properties.template.containers[0].env[?(contains(name, '_URL') || contains(name, '_BASE') || contains(name, 'WORKER') || name=='CODING_MODEL_ENDPOINT') && value != null && contains(value, '.${ACA_DOMAIN}') && !contains(value, '.internal.${ACA_DOMAIN}')].[name,value]" \
              --output tsv)
            if [ -n "$BAD_URLS" ]; then
              echo "${APP} has non-internal ACA service URL envs:"
              echo "$BAD_URLS"
              exit 1
            fi
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "https://${UI_FQDN}/"

      - name: Verify revision health (validation)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          for APP in $APPS; do
            echo "Checking revision states for ${APP}"
            BAD=$(az containerapp revision list \
              --name "$APP" \
              --resource-group leo-ai-val \
              --query "[?properties.active==\`true\` && (properties.runningState=='Failed' || properties.runningState=='ActivationFailed')].name" \
              --output tsv)
            if [ -n "$BAD" ]; then
              echo "Active failed revisions found for ${APP}: ${BAD}"
              exit 1
            fi
          done

      - name: Report deployed images (validation)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          {
            echo "## Deployed ACA images - validation"
            echo ""
            echo "| App | Active image | Latest revision |"
            echo "| --- | --- | --- |"
            for APP in $APPS; do
              IMAGE=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-val \
                --query "properties.template.containers[0].image" \
                --output tsv)
              REVISION=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-val \
                --query "properties.latestRevisionName" \
                --output tsv)
              echo "| $APP | $IMAGE | $REVISION |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Validate promotion image tag
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          TAG="$INPUT_IMAGE_TAG"
          if [ -z "$TAG" ]; then
            echo "image_tag is required for production promotion"
            exit 1
          fi
          if [[ "$TAG" != sha-* ]]; then
            echo "image_tag must be immutable (sha-*) for promotion"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "image_tag contains disallowed characters"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Full stack Bicep (env vars + ingress).
      - name: Deploy to production
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="$INPUT_IMAGE_TAG"
          az deployment group create \
            --resource-group leo-ai-prod \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam \
            --parameters "imageTag=$TAG" \
            --name "cd-prod-$RUN_NUMBER"

      - name: Post-deploy smoke checks
        run: |
          CORE_EXTERNAL=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-prod \
            --query properties.configuration.ingress.external \
            --output tsv)
          UI_FQDN=$(az containerapp show \
            --name ui \
            --resource-group leo-ai-prod \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          CORE_FQDN=$(az containerapp show \
            --name core-api \
            --resource-group leo-ai-prod \
            --query properties.configuration.ingress.fqdn \
            --output tsv)

          if [ "$CORE_EXTERNAL" != "false" ]; then
            echo "core-api ingress must remain internal-only; got external=${CORE_EXTERNAL}"
            exit 1
          fi
          ACA_DOMAIN="${CORE_FQDN#core-api.internal.}"
          for APP in core-api ui analytics-api terminology-api fhir-api model-inference training-worker research-worker pipeline-worker; do
            BAD_URLS=$(az containerapp show \
              --name "$APP" \
              --resource-group leo-ai-prod \
              --query "properties.template.containers[0].env[?(contains(name, '_URL') || contains(name, '_BASE') || contains(name, 'WORKER') || name=='CODING_MODEL_ENDPOINT') && value != null && contains(value, '.${ACA_DOMAIN}') && !contains(value, '.internal.${ACA_DOMAIN}')].[name,value]" \
              --output tsv)
            if [ -n "$BAD_URLS" ]; then
              echo "${APP} has non-internal ACA service URL envs:"
              echo "$BAD_URLS"
              exit 1
            fi
          done
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "https://${UI_FQDN}/"

      - name: Verify revision health (production)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          for APP in $APPS; do
            echo "Checking revision states for ${APP}"
            BAD=$(az containerapp revision list \
              --name "$APP" \
              --resource-group leo-ai-prod \
              --query "[?properties.active==\`true\` && (properties.runningState=='Failed' || properties.runningState=='ActivationFailed')].name" \
              --output tsv)
            if [ -n "$BAD" ]; then
              echo "Active failed revisions found for ${APP}: ${BAD}"
              exit 1
            fi
          done

      - name: Report deployed images (production)
        run: |
          APPS="core-api ui terminology-api fhir-api analytics-api model-inference training-worker research-worker pipeline-worker"
          {
            echo "## Deployed ACA images - production"
            echo ""
            echo "| App | Active image | Latest revision |"
            echo "| --- | --- | --- |"
            for APP in $APPS; do
              IMAGE=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-prod \
                --query "properties.template.containers[0].image" \
                --output tsv)
              REVISION=$(az containerapp show \
                --name "$APP" \
                --resource-group leo-ai-prod \
                --query "properties.latestRevisionName" \
                --output tsv)
              echo "| $APP | $IMAGE | $REVISION |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
