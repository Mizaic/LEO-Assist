# -- R-LEO-AI-001 -- Incorrect SNOMED Coding
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-001"
  title: "Incorrect SNOMED CT coding from NLP extraction"

  hazard:
    description: "NLP pipeline assigns wrong SNOMED CT code to clinical narrative"
    category: "software_defect"

  hazardous_situation: "System assigns incorrect SNOMED code to an encounter narrative, and the error is not detected during human review, leading to incorrect clinical pathway classification"

  harm:
    description: "Systematic miscoding distorts audit data, potentially misdirecting quality improvement activities for future patient populations"
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "Human review required for all NLP coding proposals before acceptance as audit data"
      implemented_by: []
      verified_by: []
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Validation checks verify SNOMED code plausibility against clinical context"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: "Gold-standard labelled dataset regression testing with F1 >= 0.85 threshold"
      implemented_by: []
      verified_by: []
      effectiveness: "highly_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Human review gate combined with gold-standard regression testing reduces probability of undetected incorrect coding to improbable level. Individual coding errors are caught by reviewers; systematic errors are caught by regression tests."

  monitoring:
    monitoring_plan: "Monitor reviewer correction rates and NLP accuracy metrics"
    metrics: ["SNOMED coding F1 score", "Reviewer correction rate", "Reviewer agreement rate"]
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["clinical-risk", "snomed-coding", "nlp"]
