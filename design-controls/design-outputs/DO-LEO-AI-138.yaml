  specification:
    title: "createLeoTheme() factory in @leo/design-system consumed by services/ui ThemeRegistry"
    description: |
      The MUI theme moves out of services/ui into the shared
      design-system workspace package. A single exported factory,
      createLeoTheme, reads tokens from services/design-system/src/
      tokens/color, /spacing, and /typography and returns a complete
      MUI Theme. services/ui/src/components/ThemeRegistry.tsx imports
      the factory from "@leo/design-system/theme" and instantiates it
      once; the old services/ui/src/theme.ts file is removed. The
      design-system package.json exposes the new path via its exports
      map so consumers can import it without reaching into src/.
      Static-analysis tests are updated to read the new location.
    acceptance_criteria:
      - criterion: "createLeoTheme exported from @leo/design-system/theme"
        type: "functional"
        measurement: "Test"
        target: "VT-140 TC-001 passes"
      - criterion: "ThemeRegistry imports createLeoTheme from design-system"
        type: "functional"
        measurement: "Test"
        target: "VT-140 TC-002 passes"
      - criterion: "services/ui/src/theme.ts removed"
        type: "functional"
        measurement: "Test"
        target: "VT-140 TC-003 passes"
      - criterion: "Existing colour + font static tests resolve new path"
        type: "functional"
        measurement: "Test"
        target: "VT-140 TC-004 passes"

