# -- UN-LEO-AI-094 -- Non-specialist reviewers can change a clinical guidance rule step by step
# IEC 62304 / IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-094"
  title: "When a non-specialist reviewer (audit clerk, junior coder, clinical lead with no AI / NLP background, age 8-80, UK reading age 7-11) opens 'Change this rule' from the Clinical Guidelines page, they must be guided step by step through the four jobs (who the rule is about, what the system should suggest, try it on real patients, save the change) so they never feel overwhelmed by the editor and never save a rule they did not understand"

  description: |
    The "Change this rule" dialog edits clinical guidance rules that
    the appropriateness engine evaluates against patient data.
    A reviewer who confidently saves the wrong rule can silently
    change which patients trigger which recommendations -- a Class B
    clinical safety event under IEC 62304.

    Today the dialog presents nine concerns at once in a single
    vertical stack inside a 1200px modal: summary, duplicate alert,
    helper copy, NICE source, name, suggestion strength, test-patient
    bitmap state, build / sandbox controls, action SNOMED, and the
    logic tree. For users with no AI / NLP background and an average
    UK reading age (9-11) -- and for the wider 8-80 audience the
    platform must serve as the audit cohort widens -- this is too
    much "where do I look first?" at once. The signal that the
    rule is doing what they intended is buried below the controls
    that change it.

    Reviewers need a guided, step-by-step editor that:

      - Breaks the task into four clearly numbered jobs, one focused
        screen at a time, with a left-hand step rail showing where
        they are and which steps are ready.
      - Mirrors the rule back to them in plain English at every step
        so they can see their edits make sense without reading the
        logic tree.
      - On the save step, shows a side-by-side "before / after"
        summary so they can confirm what they are about to change.
      - Uses everyday language (UK reading age 7-11) for every
        label, helper, and warning -- never clinical / NLP jargon
        for the chrome itself; SNOMED preferred terms still display
        verbatim inside pills because that is the source of truth.

  stakeholder:
    type: "end_user"
    role: "Clinical lead, audit clerk, junior coder, QA / RA reviewer (age 8-80, no AI / NLP background)"
    organization: "NHS Primary Care Organisation / Cancer Alliance"

  priority: "high"

  rationale: >
    Saving the wrong rule is a Class B clinical safety event: a
    rule that quietly stops firing means a 2-week wait
    recommendation is never raised; a rule that quietly fires more
    often means clinics are flooded with low-value referrals. A
    non-specialist reviewer who feels overwhelmed by the editor
    will either save without understanding (high risk) or abandon
    the task and leave a stale rule in place (also a risk -- NICE
    updates do not get reflected in the system). Breaking the task
    into four jobs with a continuous plain-English mirror lets a
    non-expert see the consequence of every edit before saving.

  benefit: >
    Non-specialist reviewers can confidently change a guidance
    rule, see in plain English what their change does, and save
    only when they are sure -- without needing to learn boolean
    logic, SNOMED hierarchy, or the bitmap engine.

  acceptance_criteria:
    - "The 'Change this rule' dialog opens as a widescreen modal with a left-hand numbered step rail (4 steps), a focused main canvas showing one step at a time, and a sticky right-hand 'What this rule means' preview pane"
    - "The four steps are: 1) Who is this rule about? 2) What should the system suggest? 3) Try it on real patients. 4) Save your change"
    - "The step rail shows one of three states per step: Not started / In progress / Ready, and is jump-able (clicking any step navigates to it)"
    - "The 'What this rule means' preview pane is always visible and updates live as the reviewer edits the logic tree, the suggestion strength, or the recommended procedure"
    - "On step 4, the preview pane swaps to a 'Before / After' two-column variant computed from the original tree vs the edited tree"
    - "Every label, step title, helper sentence and rail state in the dialog chrome reads at UK reading age 7-11 (Hemingway grade <= 6 on a sample of 30 strings)"
    - "Save changes is the single primary action, only enabled when (a) the rule is structurally valid AND (b) a reason of >= 3 characters has been entered"
    - "The previous behaviour contracts are preserved: the save payload still strips node ids, the action SNOMED is still omitted when not touched, the duplicate-set warning still surfaces, and the NICE source text is still reachable"
    - "Page passes WCAG 2.1 AA on the chrome (axe baseline)"

  design_inputs:
    - "DI-LEO-AI-512"

