- id: "DO-LEO-AI-006"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-008", "DI-LEO-AI-024", "DI-LEO-AI-025"]
    user_needs: ["UN-LEO-AI-004", "UN-LEO-AI-016", "UN-LEO-AI-017"]
    risks_addressed: ["R-LEO-AI-022", "R-LEO-AI-023", "R-LEO-AI-025"]
    verification_tests: ["VT-LEO-AI-006"]
    validation_tests: []

  specification:
    title: "Guideline Rule Engine and Safety-Net Detector"
    description: |
      Evaluates coded encounter data against configurable clinical guideline
      rules and safety-net criteria. Detects gaps in care such as missing
      follow-up actions, overdue investigations, and unaddressed abnormal
      results. Uses domain concept sets to match clinical conditions against
      guideline requirements.
    purpose: "Identify care gaps and safety-net failures by comparing encounter data against evidence-based clinical guidelines"
    technical_approach: "Rule engine pattern with domain concept set matching, configurable guideline definitions, and gap detection logic"
    acceptance_criteria:
      - criterion: "Safety-net gap detection sensitivity"
        type: "functional"
        measurement: "Sensitivity against gold-standard gap labels"
        target: ">= 0.90 sensitivity"
      - criterion: "No false negatives on critical safety-net items"
        type: "safety"
        measurement: "Review of critical safety-net test cases"
        target: "0 missed critical safety-net gaps"
      - criterion: "Rule evaluation completes within time limit"
        type: "performance"
        measurement: "Wall-clock timing per encounter"
        target: "<= 2 seconds per encounter"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/safety_net_detector.py"
        description: "Safety-net gap detection and guideline rule evaluation"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/domains/ncda_concept_sets.py"
        description: "NCDA domain concept sets for guideline matching"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: []

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Critical gap detection", "Guideline rule accuracy"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Library code in services/analysis_worker; runs inside pipeline-worker container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-008, DI-LEO-AI-024, and DI-LEO-AI-025"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["safety-net", "guidelines", "rule-engine", "analysis"]
    priority: "high"
    complexity: "complex"
