        action: "If admin email used, attacker gains is_admin=True"
      - step: 3
        threat_ref: "PAT-S-001"
        action: "Attacker lists all patients"
    resolution: "AUTH-S-001 resolved — X-User-Email header no longer accepted. Identity from session only."
    residual_attack_path: >
      An attacker would need to: (1) steal a session cookie (requires HTTPS interception
      or XSS, mitigated by HttpOnly + Secure + SameSite), or (2) compromise the Redis
      session store (requires Key Vault credential + network access).
    original_severity: "Critical"
    residual_severity: "Low"

  - id: "CHAIN-002"
    name: "Unauthenticated model supply chain compromise"
    status: "PARTIALLY BROKEN in v2"
    original_steps:
      - step: 1
        threat_ref: "API-S-001"
        action: "Attacker calls POST /model-registry/register"
    resolution: "Mutating model registry endpoints now require platform admin authentication."
    residual_attack_path: >
      Attacker would need: (1) a valid admin session cookie, and (2) admin account in
      Neo4j. Read-only model metadata still accessible without auth (reconnaissance).
    original_severity: "Critical"
    residual_severity: "Low"

  - id: "CHAIN-003"
    name: "Identity spoofing to training data poisoning"
    status: "BROKEN in v2"
    resolution: "AUTH-S-001 resolved — bulk import requires authenticated session with real CallerScope."
    original_severity: "High"
    residual_severity: "Low"

  - id: "CHAIN-004"
    name: "Terminology poisoning via unauthenticated endpoints"
    status: "OPEN"
    steps:
      - step: 1
        threat_ref: "API-S-002"
        action: "Attacker calls POST /terminology/surface-forms/upsert-mapping to inject false SNOMED mappings"
      - step: 2
        action: "SurfaceForm MAPS_TO relationships bias terminology resolution"
      - step: 3
        action: "Future coding operations use biased mappings"
    note: "XHR mutation guard (GAP-009) blocks browser-based CSRF but not direct API calls. Terminology endpoints still lack authentication."
    overall_severity: "Medium"
    clinical_safety_impact: "Biased SNOMED coding at population level"

  - id: "CHAIN-005"
    name: "Session theft via insecure cookie to persistent access"
    status: "BROKEN in v2"
    resolution: >
      Cookie secure flag now defaults to true (all environments). Session TTL reduced
      to 12-24h (from 168h). HTTPS enforced in all deployed environments.
    original_severity: "High"
    residual_severity: "Low"

  - id: "CHAIN-006"
    name: "Context rule poisoning for systematic entity suppression (NEW)"
    status: "NEW in v2"
    steps:
      - step: 1
        action: "Authenticated user creates a ConText rule matching a common clinical phrase as 'negated'"
      - step: 2
        action: "Context engine applies the rule to all future encounters"
      - step: 3
        action: "Entities matching the phrase are systematically marked as 'absent' and suppressed from coding"
      - step: 4
        action: "Population-level audit data becomes biased (relevant diagnoses not coded)"
    objective: "Suppress specific clinical entities across all patients"
    blast_radius: "All patients with encounters containing the targeted phrase"
    controls_traversed: "Authentication (valid session required); no admin restriction; no approval workflow"
    overall_severity: "Medium"
    clinical_safety_impact: "Systematic suppression of clinically relevant entities"

  - id: "CHAIN-007"
    name: "LLM dual-provider failure in autonomous mode (NEW)"
    status: "NEW in v2"
    steps:
      - step: 1
        action: "Both AWS Bedrock and Azure OpenAI become unavailable (network, rate limit, outage)"
      - step: 2
        threat_ref: "CONS-T-002"
        action: "Consensus engine returns fail_verdict"
      - step: 3
        action: "In autonomous mode, disorder verifier fail_verdict='not_disorder' suppresses entity"
      - step: 4
        action: "Clinically relevant entities silently dropped without review"
    objective: "N/A — failure mode chain"
    blast_radius: "All entities processed during dual-provider outage"
    controls_traversed: "CodingDecision audit records 'both providers failed' but no alerting"
    overall_severity: "Medium"
    clinical_safety_impact: "Entities silently suppressed in autonomous mode during LLM outage"

# =============================================================================
# PHASE 4: GAP ANALYSIS AND CONSOLIDATION
# =============================================================================

gaps:
  - id: "GAP-001"
    title: "Identity accepted from unauthenticated HTTP header"
    category: "Authentication"
    severity: "Critical"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "X-User-Email header and ?email= query parameter removed. Identity from session cookie only."
    resolution_files: ["libs/auth/org_scope.py", "services/api/app/deps.py", "services/api/app/main.py"]
    verification: "get_caller_scope accepts X-Leo-Session only; get_caller_scope_from_request reads from session; main.py overrides get_caller_scope with get_caller_scope_from_request"
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-002"
    title: "No JWT signature verification on Azure AD tokens"
    category: "Authentication"
    severity: "High"
    status: "RESOLVED"
    resolution_date: "2026-03-03"
    resolution: >
      _verify_id_token() added using jose.jwt.decode with RS256, audience=CLIENT_ID,
      issuer=v2.0 endpoint. JWKS fetched from Azure AD discovery endpoint with 1-hour
      in-process cache and stale-fallback on network failure. JWTError raises HTTP 401
      and emits security.token_rejected audit event. Insecure base64 decode removed.
    resolution_files:
      - "services/api/app/routers/auth.py"
    design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]

  - id: "GAP-003"
    title: "Unauthenticated model registry endpoints"
    category: "Authentication"
    severity: "Critical"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "Mutating routes require Depends(require_admin). Read routes (status, versions, inference health) remain open."
    resolution_files: ["services/api/app/routers/model_registry.py", "services/api/app/deps.py"]
    remaining_risk: "Model metadata leakage via unauthenticated read endpoints"
    remaining_severity: "Low"
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-004"
    title: "Unauthenticated terminology write endpoints"
    category: "Authentication"
    severity: "High"
    status: "RESOLVED"
    resolution_date: "2026-03-03"
    resolution: >
      verify_service_token (SERVICE_AUTH_SECRET Bearer token) added as Depends to:
      POST /surface-forms/upsert-mapping, DELETE /surface-forms/{normalized:path},
      POST /surface-forms/deduplicate. The /writeback endpoint already had this guard.
      GET read endpoints left open for internal use. Returns HTTP 401 on invalid token.
    resolution_files:
      - "services/terminology_api/app/routers/surface_forms.py"
    design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]

  - id: "GAP-005"
    title: "Session cookie secure flag hardcoded False"
    category: "Encryption"
    severity: "High"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "COOKIE_SECURE env var; defaults to 'true'; all environments set to 'true' in Bicep parameters."
    resolution_files: ["services/api/app/routers/auth.py", "infra/bicep/parameters/*.bicepparam"]
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-006"
    title: "No rate limiting on any endpoint"
    category: "Configuration"
    severity: "High"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "slowapi Limiter with per-IP rate limiting added to main.py."
    resolution_files: ["services/api/app/main.py"]
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-007"
    title: "Inter-service communication without authentication"
    category: "Authentication"
    severity: "High"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "SERVICE_AUTH_SECRET shared-secret Bearer token for inter-service calls. hmac.compare_digest for timing-safe comparison. Key Vault secret reference in ACA."
    resolution_files: ["libs/auth/service_auth.py", "infra/bicep/modules/container-apps.bicep"]
    remaining_risk: "Auth bypassed when SECRET is empty (local dev). Single shared secret for all services."
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-008"
    title: "Incomplete de-identification before LLM submission"
    category: "Data Protection"
    severity: "High"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-03"
    resolution: >
      Optional spaCy NER second pass added to deidentify_text(ner=True).
      Enabled via DEIDENTIFY_NER_MODEL env var. Lazy-loaded model catches
      PERSON entities in free narrative missed by regex. Model load failures
      logged at WARNING and gracefully degrade (regex-only fallback).
    remaining_risk: >
      NER pass is opt-in; deployment must set DEIDENTIFY_NER_MODEL to activate.
      PHI audit log (post-de-id check) not yet implemented.
    resolution_files:
      - "libs/utils/deidentify.py"
    design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]

  - id: "GAP-009"
    title: "No CSRF protection"
    category: "Configuration"
    severity: "Medium"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "XHR mutation guard (X-Requested-With header required for POST/PUT/PATCH/DELETE). SameSite=lax cookie."
    resolution_files: ["services/api/app/main.py"]
    remaining_risk: "No per-request CSRF token. XHR header can be set by JS on same-origin."
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-010"
    title: "OAuth state parameter not CSRF-protected"
    category: "Authentication"
    severity: "Medium"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "Nonce cookie (leo_oauth_nonce) set at /login, validated at /callback. 600s max_age."
    resolution_files: ["services/api/app/routers/auth.py"]
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-011"
    title: "Excessive session TTL without rotation"
    category: "Configuration"
    severity: "Medium"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "SESSION_TTL_HOURS configurable. Dev/val: 12h. Prod: 24h. SystemConfig per-tenant override. Redis required (503 on failure)."
    resolution_files: ["services/api/app/services/session_store.py", "services/api/app/routers/auth.py"]
    remaining_risk: "No sliding session renewal with new session ID. No IP/user-agent binding. No concurrent session limits."
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-012"
    title: "No durable security audit log"
    category: "Logging"
    severity: "High"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-03"
    resolution: >
      libs/audit/security_log.py created with typed emit_* functions writing
      single-line JSON to 'security.audit' logger at WARNING level.
      Events wired in auth.py: login success/failure/MFA-block, logout,
      token rejection. All records include ts, event, email, ip.
      Production deployments should configure the security.audit logger handler
      to write to an append-only destination (Azure Monitor / Log Analytics).
    remaining_risk: >
      authz.denied events not yet wired to require_admin dependency.
      data.access events for patient record reads not yet instrumented.
      Log sink (Azure Monitor integration) is an ops deployment task.
    resolution_files:
      - "libs/audit/security_log.py"
      - "services/api/app/routers/auth.py"
    design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]

  - id: "GAP-013"
    title: "CORS origins not configurable for production"
    category: "Configuration"
    severity: "Medium"
    status: "RESOLVED"
    resolution_date: "2026-03-02"
    resolution: "ALLOWED_ORIGINS env var; per-env Bicep parameters restrict to deployment domain."
    resolution_files: ["services/api/app/main.py", "infra/bicep/parameters/*.bicepparam"]
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]

  - id: "GAP-014"
    title: "Deployment-specific de-identification config hardcoded"
    category: "Configuration"
    severity: "Medium"
    status: "RESOLVED"
    resolution_date: "2026-03-03"
    resolution: >
      DEIDENTIFY_LOCAL_ORGS env var (pipe-separated) now overrides the built-in
      _BUILTIN_ORGS tuple at module load time. Falls back to built-in list when
      env var is absent or empty. Bicep parameters can pass deployment-specific org names.
    resolution_files:
      - "libs/utils/deidentify.py"
    design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]

  - id: "GAP-015"
    title: "User-configurable rules without change control"
    category: "Clinical Safety"
    severity: "Medium"
    status: "PARTIALLY RESOLVED"
    resolution_date: "2026-03-03"
    affected_threats: ["RULE-T-001", "RULE-T-002"]
    evidence:
      file: "services/api/app/routers/training.py"
      snippet: "Context rules and post-processor rules CRUD endpoints"
    resolution: >
      Post-processor rule creation/update and context rule creation/deactivation
      now require Depends(require_admin). ReDoS detection via _validate_regex
      with timeout probe rejects catastrophic backtracking patterns. Regex max
      length enforced (200 chars). Context rule literal max length enforced.
    remaining_risk: >
      Coding ignore rules (ignore_coding_review, delete_coding_ignore_rule) still
      use Depends(get_caller_scope) — any authenticated user can create/delete.
      No approval workflow or durable audit log for rule changes.
    resolution_files:
      - "services/api/app/routers/training.py"
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]
    regulatory_impact:
      - standard: "IEC 62304"
        clause: "5.5"
      - standard: "ISO 14971"
        clause: "7"
    exploitability: "Moderate (requires authentication)"

  - id: "GAP-016"
    title: "Autonomous mode fail-closed behavior not guaranteed"
    category: "Clinical Safety"
    severity: "Medium"
    status: "RESOLVED"
    resolution_date: "2026-03-03"
    affected_threats: ["CONS-T-002"]
    evidence:
      file: "libs/llm_client/disorder_verifier.py"
      snippet: "fail_verdict for autonomous mode is 'not_disorder' (entity suppressed)"
    resolution: >
      _fail_verdict_for_mode('autonomous') now returns DisorderVerdict.UNCERTAIN
      instead of 'not_disorder'. In autonomous mode, consensus failure results in
      UNCERTAIN verdict — entity is not coded without confirmation (fail-closed).
      LLM response capped at 1000 chars to prevent response-stuffing attacks.
    resolution_files:
      - "libs/llm_client/disorder_verifier.py"
      - "libs/llm_client/escalation.py"
    design_controls: ["DI-LEO-AI-052", "DO-LEO-AI-035", "VT-LEO-AI-045"]
    regulatory_impact:
      - standard: "IEC 81001-5-1"
        clause: "5.5.2"
      - standard: "IEC 62304"
        clause: "5.5"
    exploitability: "N/A — failure mode"

  - id: "GAP-017"
    title: "Expanded LLM data exposure via consensus pattern (NEW)"
    category: "Data Protection"
    severity: "Medium"
    status: "NEW"
    affected_threats: ["CONS-I-001", "COD-I-001", "TRN-I-001"]
    evidence:
      file: "libs/llm_client/consensus.py"
      snippet: "Dual-model calls to AWS + Azure in parallel; Sonnet arbitration on disagreement"
    remediation: "Conduct Data Protection Impact Assessment for dual-provider pattern. Confirm both providers' data processing agreements cover clinical text. Implement per-call PHI audit. Consider data minimization (send only entity text, not encounter context, where possible)."
    regulatory_impact:
      - standard: "UK GDPR"
        clause: "Article 35"
      - standard: "DSPT"
        clause: "Assertion 3.4"
    exploitability: "N/A — architectural pattern"

