# -- VT-LEO-AI-510 -- Synonym sets, descendant control, exclusions end-to-end
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-510"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-508"
      - "DI-LEO-AI-509"
      - "DI-LEO-AI-510"
      - "DI-LEO-AI-511"
    risks: ["R-LEO-AI-508"]

  metadata:
    title: "Synonym sets + per-seed descendants + carve-outs across schema, compiler, evaluator, SBAR and UI"
    description: >
      Pytest verifies the new LogicCriterion shape, the
      validator's accept / reject branches, the bitmap compiler's
      union + exclusion logic, the evaluator's matched_concept_ids
      population, the diagnose endpoint pass-through, the SBAR
      _rule_snapshot pass-through, and the migration script's
      idempotent / lossless behaviour. Jest verifies the
      treeOps helpers, the treeToSentence narrative and a
      static-source check that LogicTreeEditor wires up the new
      SynonymChipEditor primitive when seeds.length >= 2.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "services/api/tests/test_guidance_rule_edit.py"
      - "services/terminology_api/tests/test_guideline_compiler.py"
      - "services/terminology_api/tests/test_guideline_evaluator.py"
      - "tests/test_sbar_assessment_formatter.py"
      - "services/ui/src/__tests__/synonym-chip-tree-ops.test.ts"
      - "services/ui/src/__tests__/synonym-chip-tree-to-sentence.test.ts"
      - "services/ui/src/__tests__/synonym-chip-descendants.test.tsx"
      - "services/ui/src/app/admin/guidance/EditRuleDialog/__tests__/treeOps.test.ts"
      - "services/ui/src/app/admin/guidance/__tests__/RuleReviewSection.merge.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest"
      - "Node 20+ / jest 30"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-510-TC-001"
      case_name: "LogicCriterion accepts legacy single-seed shape unchanged"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "LogicCriterion.model_validate({snomed_concept_id: '77176002', preferred_term: 'Smoker'})"
          expected_result: "Validation succeeds, seeds defaults to []"
          verification_method: "automated"
      acceptance_criteria:
        - "Existing rules continue to round-trip through the validator"

    - case_id: "VT-510-TC-002"
      case_name: "LogicCriterion accepts new multi-seed shape with primary"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "LogicCriterion.model_validate with seeds=[{snomed_concept_id:'77176002', preferred_term:'Smoker'}, {snomed_concept_id:'230063004', preferred_term:'Cigarette smoker'}], primary_concept_id='77176002', excluded_concept_ids=[]"
          expected_result: "Validation succeeds; legacy snomed_concept_id auto-derived from primary_concept_id"
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy field stays populated for backward readers"

    - case_id: "VT-510-TC-003"
      case_name: "validate_logic_tree rejects empty / overlapping / inconsistent criteria"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run validate_logic_tree on a tree with (a) seeds=[] and snomed_concept_id='', (b) seeds=[s1] with primary_concept_id='other', (c) seeds=[s1] with excluded_concept_ids=[s1.id]"
          expected_result: "Each call raises LogicTreeValidationError with a plain-English message"
          verification_method: "automated"
      acceptance_criteria:
        - "Author cannot persist a criterion that would silently drop the leaf or contradict itself"

    - case_id: "VT-510-TC-004"
      case_name: "validate_logic_tree returns the union of seed ids and excluded ids"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Build a tree with one CONCEPT leaf having seeds=[s1, s2] and excluded_concept_ids=[x1]; call validate_logic_tree"
          expected_result: "Returned set == {s1, s2, x1}"
          verification_method: "automated"
      acceptance_criteria:
        - "Existing _VERIFY_CONCEPTS round-trip catches unknown ids in one Cypher pass"

    - case_id: "VT-510-TC-005"
      case_name: "Compiler legacy single-seed parity"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Compile a CONCEPT leaf with criterion={snomed_concept_id:'X', distance_child:3} against a stubbed _closure_ids that returns ['X','X1','X2']; capture the int-id list passed to put_bitmap"
          expected_result: "Sorted, deduplicated int-id list matches the pre-change behaviour exactly"
          verification_method: "automated"
      acceptance_criteria:
        - "No clinical-output drift when migrated rules compile"

    - case_id: "VT-510-TC-006"
      case_name: "Compiler unions multi-seed closures and subtracts exclusions"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Compile seeds=[A,B] with include_descendants=true and excluded_concept_ids=['Bx'] against a stubbed _closure_ids returning {A:[A,A1], B:[B,B1,Bx]}"
          expected_result: "Int-id list passed to put_bitmap == sorted, deduplicated mapping of {A,A1,B,B1} (Bx excluded); compiled-leaf seed_concept_ids == ['A','A1','B','B1']"
          verification_method: "automated"
      acceptance_criteria:
        - "Union + exclusion semantics correct in one pass"

    - case_id: "VT-510-TC-007"
      case_name: "Per-seed include_descendants false forces exact-match for that seed only"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Compile seeds=[A include=true, B include=false] with rule-level distance_child=3"
          expected_result: "_closure_ids called with (A, 3, 0) and (B, 0, 0); int-id union == {A,A1,...} union {B}"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-seed flag overrides rule-level default"

    - case_id: "VT-510-TC-008"
      case_name: "Evaluator surfaces matched_concept_ids per leaf and per rule"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Evaluate a patient with codes [c1, c2, c3] against a rule whose CONCEPT leaf bitmap intersects on c1 and c3 (compiled-leaf seed_concept_ids = [c1, c3, c4])"
          expected_result: "_annotate_logic_tree leaf has matched_concept_ids == [c1, c3] (input order); rule.matched_concept_ids deduplicated union across leaves"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers see exactly which patient code satisfied the rule"

    - case_id: "VT-510-TC-009"
      case_name: "Evaluator filters excluded ids from matched_concept_ids (defence in depth)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Force a stale compiled-leaf where seed_concept_ids includes an id that the criterion also lists in excluded_concept_ids; evaluate against a patient who has that id"
          expected_result: "matched_concept_ids does NOT contain the excluded id; rule still evaluates correctly"
          verification_method: "automated"
      acceptance_criteria:
        - "A future regression in the compiler cannot leak an excluded id through to the SBAR narrative"

    - case_id: "VT-510-TC-010"
      case_name: "_rule_snapshot passes matched_concept_ids and matched_via through"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Build a rule dict with matched_concept_ids and matched_via populated; call _rule_snapshot; build a legacy rule dict without those fields and call _rule_snapshot"
          expected_result: "First snapshot carries the new fields verbatim; second snapshot carries [] for both"
          verification_method: "automated"
      acceptance_criteria:
        - "SBAR formatter is back-compat for legacy rule payloads"

    - case_id: "VT-510-TC-011"
      case_name: "Migration script is idempotent and preserves the int-id set"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run upgrade_concept_leaf on a legacy {snomed_concept_id:'X', preferred_term:'Smoker'} criterion; capture the output; run upgrade_concept_leaf again on the output; assert byte-identical second pass"
          expected_result: "Second pass output == first pass output; seeds == [{X, include_descendants:true, distance_child:3}], primary_concept_id=='X', excluded_concept_ids==[], legacy snomed_concept_id stays 'X'"
          verification_method: "automated"
      acceptance_criteria:
        - "Re-running migration is safe; no clinical-output drift"

    - case_id: "VT-510-TC-012"
      case_name: "treeOps helpers add_seed/remove_seed/set_primary/toggle_include_descendants/set_seed_distance/add_excluded/remove_excluded are pure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "For each helper, build a tree with one CONCEPT leaf, apply the helper, assert the input was not mutated, the result is a new object, node_id is preserved, and the criterion fields were updated as expected"
          expected_result: "All assertions pass for every helper"
          verification_method: "automated"
      acceptance_criteria:
        - "Helpers are safe to call from event handlers without surprise re-renders"

    - case_id: "VT-510-TC-013"
      case_name: "remove_seed re-points primary_concept_id when the primary is removed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build a CONCEPT leaf with seeds=[A,B,C], primary='B'; call remove_seed(B); call remove_seed on the only remaining seed afterwards"
          expected_result: "After remove(B): primary_concept_id == 'A' (first remaining); after remove on the last seed: helper returns the input unchanged (cannot drop the only seed)"
          verification_method: "automated"
      acceptance_criteria:
        - "Primary-seed invariant is enforced; cannot accidentally empty the criterion"

    - case_id: "VT-510-TC-014"
      case_name: "treeToSentence renders synonym + descendant + exclusion forms"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render three trees: (a) seeds=[Smoker] include_descendants=true, exclusions=[]; (b) seeds=[Smoker, Cigarette smoker, Pipe smoker] all include=false; (c) seeds=[Smoker] include=true, excluded=[Trial of smoking]"
          expected_result: "(a) sentence contains 'is a smoker (or any kind of smoker)'; (b) contains 'is one of: smoker, cigarette smoker, pipe smoker'; (c) contains 'is a smoker (or any kind of smoker), except trial of smoking'"
          verification_method: "automated"
      acceptance_criteria:
        - "Authors and reviewers see the synonym set in plain English"

    - case_id: "VT-510-TC-015"
      case_name: "Static-source: LogicTreeEditor renders SynonymChipEditor when criterion has multi-seed or exclusion"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/app/admin/guidance/EditRuleDialog/LogicTreeEditor.tsx and SynonymChipEditor.tsx as strings; assert LogicTreeEditor imports SynonymChipEditor and references it where seeds.length is checked"
          expected_result: "Imports and references present"
          verification_method: "automated"
      acceptance_criteria:
        - "Synonym chip wiring is present in the editor"

    - case_id: "VT-510-TC-016"
      case_name: "SeedDescendantsList lets the author audit and block descendants inline (DI-511 AC-007 / R-508 mitigation)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render SeedDescendantsList with includeDescendants=false; assert the static 'Only the exact code <id> will fire' message renders, no Show/Hide button is present, and global fetch was NOT called."
          expected_result: "Static message rendered; no /api/terminology/concepts/.../descendants request issued."
          verification_method: "automated"
        - step_number: 2
          action: "Render with includeDescendants=true depth=3, click 'Show the codes covered by smoker at depth 3'; assert fetch called once with a URL containing /api/terminology/concepts/77176002/descendants and depth=3; assert the rendered list has one row per response item with the friendly term, SNOMED id and a 'Block <term> from firing this rule' button."
          expected_result: "Fetch URL matches; list role='list' with N listitems; each row exposes the Block button."
          verification_method: "automated"
        - step_number: 3
          action: "Click the Block button on a row; assert onBlock callback fires with that row's snomed_concept_id."
          expected_result: "onBlock called once with the SNOMED id of the clicked row."
          verification_method: "automated"
        - step_number: 4
          action: "Render with excludedIds=['266920004']; expand the panel; assert the matching row renders the 'Blocked' badge with strike-through styling and an 'Unblock <term>' button; click Unblock; assert onUnblock callback fires with the same id."
          expected_result: "Blocked row renders with the badge + line-through; Unblock fires onUnblock('266920004')."
          verification_method: "automated"
        - step_number: 5
          action: "Open the panel at depth=2 (one fetch). Re-render with depth=4 while the panel stays open; assert a second fetch is issued with depth=4."
          expected_result: "Two fetches total, depths 2 and 4 in order."
          verification_method: "automated"
      acceptance_criteria:
        - "Author can audit every descendant the bitmap will match before saving."
        - "Author can block any unintended descendant in a single click without leaving the popover."
        - "Already-blocked descendants are visibly differentiated and reversible."
        - "Depth changes refetch so the preview always reflects the saved configuration."

    - case_id: "VT-510-TC-017"
      case_name: "stripNodeIds whitelists BE-allowed criterion + seed keys (DI-511 AC-008 / R-508 sixth mitigation)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build a CONCEPT leaf whose criterion carries every LLM-provenance
            field written by libs/pipeline_graph/subgraphs/
            guidance_rule_extraction_v2_impl.py::_apply_leaf_decisions
            (node_id, source_text, original_phrase, expansion_source,
            expanded_from, candidates, verification_status,
            verification_reason, confidence, resolver_turns,
            needs_human_review, search_history) alongside the BE-allowed
            keys (snomed_concept_id, preferred_term, semantic_tag, term,
            seeds, primary_concept_id, excluded_concept_ids). Pass through
            stripNodeIds.
          expected_result: >
            Output criterion contains ONLY the BE-allowed keys. Every
            LLM-provenance key is absent (not just undefined). Allowed
            field values are preserved verbatim.
          verification_method: "automated"
        - step_number: 2
          action: >
            Build a seed with the BE-allowed keys (snomed_concept_id,
            preferred_term, semantic_tag, include_descendants,
            distance_child) plus stale extras (node_id, candidates).
            Pass through stripNodeIds.
          expected_result: >
            Each seed in the output retains only the BE-allowed keys.
            distance_child override is preserved.
          verification_method: "automated"
      acceptance_criteria:
        - "BE LogicCriterion / LogicSeed extra=forbid validators never see an unknown key on save."
        - "Reviewer edits to a CONCEPT chip persist after Save (no silent 422 + dropped seeds)."

    - case_id: "VT-510-TC-019"
      case_name: "_VERIFY_CONCEPTS accepts canonical :Concept and legacy :SnomedConcept ids (DI-508 AC-006 / R-508 ninth mitigation)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Static-source pin: read services/api/app/services/
            guidance_rule_edit.py and assert _VERIFY_CONCEPTS contains
            two OPTIONAL MATCH lines, one against (:Concept {id: cid})
            and one against (:SnomedConcept {conceptId: cid}), and
            returns (canonical IS NOT NULL OR legacy IS NOT NULL)
            AS exists.
          expected_result: >
            Both labels are referenced in the verifier query; either
            label being present satisfies the existence check.
          verification_method: "automated"
        - step_number: 2
          action: >
            Stub the BE driver so the verifier returns a row per
            concept id with exists=true for ids that exist on
            (:Concept) and exists=false for an unknown id; call
            apply_rule_edit with a CONCEPT criterion whose seeds
            reference :Concept-only ids (the canonical terminology
            search path).
          expected_result: >
            apply_rule_edit completes successfully and never raises
            "Unknown SNOMED concept ids" for an id that exists on
            (:Concept) but not on (:SnomedConcept). A genuinely
            missing id still raises.
          verification_method: "automated"
      acceptance_criteria:
        - "v2 rules whose seeds come from the canonical terminology search persist on save."
        - "Backward compatibility with legacy v1-generated :SnomedConcept ids is preserved."
        - "An unknown id still fails verification (no false positives)."

    - case_id: "VT-510-TC-020"
      case_name: "Approved-in-this-session card exposes Edit (DI-511 AC-010)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Static-source pin: read services/ui/src/app/admin/guidance/
            RuleReviewSection.tsx and assert it imports EditOutlinedIcon
            from @mui/icons-material/EditOutlined; assert the
            "Approved in this session" card contains a Button with
            aria-label matching /Edit approved rule/ that calls
            setEditRule(rule); assert the Edit button is declared
            BEFORE the promotedRules ternary inside the same Stack so
            it remains visible after promotion.
          expected_result: >
            All three assertions pass; the Edit button is wired to
            the existing handleSaveEdit code path.
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers can edit a rule they have already approved without leaving the page."
        - "The Edit affordance survives the 'Add to domain' action."

    - case_id: "VT-510-TC-021"
      case_name: "Pending / Active / Superseded status filter (DI-511 AC-011, AC-012)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Static-source pin: read services/ui/src/app/admin/guidance/
            RuleReviewSection.tsx and assert the file declares
            type RuleStatusFilter = "pending_review" | "active" |
            "superseded" and a STATUS_FILTER_OPTIONS list with all
            three labels and tooltips written in plain English; assert
            the fetch URL is interpolated as
            /api/guidance/rules/review?status=${statusFilter}; assert
            the useEffect dependency array includes statusFilter;
            assert the default useState value is "pending_review";
            assert the exclusive ToggleButtonGroup onChange handler
            guards against next === null so the filter cannot be
            unset; assert the Approve-all button render block is
            wrapped in {statusFilter === "pending_review" && ...};
            assert onApprove and onReject passed to RuleAccordionCard
            are conditional on statusFilter === "pending_review"
            (otherwise undefined); assert onEdit is unconditional.
          expected_result: >
            All static-source assertions pass.
          verification_method: "automated"
        - step_number: 2
          action: >
            Render RuleReviewSection with a fetch mock that returns
            different lists per ?status= value; assert the Pending
            review tab is visible on first paint with the pending
            list and the Approve-all button; click "Show Active rules";
            assert fetch is called with status=active; assert the
            Approve-all button disappears; assert the active rules
            still render the Edit button.
          expected_result: >
            The toggle drives the fetch URL, the bulk affordance
            disappears outside Pending, and Edit remains available
            on every status.
          verification_method: "automated"
      acceptance_criteria:
        - "A reviewer can find any rule by status without leaving the section."
        - "Bulk and per-row decision affordances are scoped to Pending so they cannot be misapplied to live rules."
        - "Edit is always reachable; the BE supports editing both pending and active predecessors."

    - case_id: "VT-510-TC-018"
      case_name: "Save error UI is readable and post-save cache reflects the persisted tree (DI-511 AC-009 / R-508 seventh + eighth mitigations)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call formatApiDetail with the array shape FastAPI returns for
            a 422 (e.g. [{type:'extra_forbidden', loc:['body','updates',
            'logic_tree','criterion','source_text'], msg:'Extra inputs
            are not permitted'}, {...candidates...}]).
          expected_result: >
            Returns a single readable string that includes both offending
            keys (source_text, candidates) and the human message; never
            contains the literal '[object Object]'; the body / updates
            prefixes are stripped from the loc path.
          verification_method: "automated"
        - step_number: 2
          action: >
            Call formatApiDetail with a plain string detail, with a
            nested object detail, and with null / undefined.
          expected_result: >
            String passes through unchanged; object becomes its
            JSON.stringify form; null and undefined return ''.
          verification_method: "automated"
        - step_number: 3
          action: >
            Call mergeEditedRuleIntoCache(previousRule, newRuleId, payload)
            where payload.logic_tree is a CONCEPT criterion expanded from
            one seed to three seeds plus an excluded id, payload.action is
            omitted, and previousRule has the original single-seed tree.
          expected_result: >
            The merged Rule's logic_tree is the payload tree (not the
            previous one); the inner CONCEPT criterion shows seeds.length
            === 3 and excluded_concept_ids === ['56294008']; rule_id
            switches to newRuleId; status flips to 'active'; action keeps
            the previous coded recommendation (mirrors BE
            _decide_rule_with_edits coalesce).
          verification_method: "automated"
        - step_number: 4
          action: >
            Re-call mergeEditedRuleIntoCache with payload.action set to
            a different SNOMED-coded action.
          expected_result: >
            The merged Rule's action.snomed_concept_id matches
            payload.action.snomed_concept_id (overlay path).
          verification_method: "automated"
      acceptance_criteria:
        - "If save fails, the reviewer sees a sentence describing the offending field, never '[object Object]'."
        - "If save succeeds, the in-session 'approved this session' card shows the seeds / exclusions the reviewer just added (no stale cache)."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-510/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-510-EXEC-2026-04-19-004"
      execution_date: "2026-04-19"
      executor: "automated"
      environment: "development"
      result: "pass"
      cases_executed: 21
      cases_passed: 21
      cases_failed: 0
      duration_seconds: 6.7
      notes: >
        Re-run after closing two reviewer-visible gaps surfaced by Rob
        Smith on 2026-04-19:
        (1) Save kept failing with "Unknown SNOMED concept ids: ..."
        for ids that the canonical terminology search had just
        returned. Root cause: services/api/app/services/
        guidance_rule_edit.py::_VERIFY_CONCEPTS only looked at
        (:SnomedConcept {conceptId: cid}), a parallel namespace
        created by the v1 guidance_rule_generator path. Concepts
        sourced from the terminology API live as (:Concept {id: cid})
        and never had a :SnomedConcept twin, so any v2 rule edited
        through the dialog 422'd. Fix: _VERIFY_CONCEPTS now performs
        OPTIONAL MATCH against BOTH labels and reports exists when
        either side is present. Two new pytest cases pinned in
        services/api/tests/test_guidance_rule_edit.py
        (test_verifier_cypher_targets_canonical_and_legacy_labels --
        static source pin; test_accepts_concepts_only_on_canonical_
        concept_label -- happy path against a :Concept-only graph).
        Mapped to VT-510-TC-019.
        (2) After approval there was no surface to edit a rule -- the
        "Approved in this session" card only offered "Add to domain",
        and the pending list filter hid every rule the reviewer had
        just approved. Two FE changes:
        (a) RuleReviewSection.tsx now renders an Edit button on the
        approved-card (DI-511 AC-010) wired to setEditRule(rule)
        through the existing handleSaveEdit path; pinned in
        services/ui/src/app/admin/guidance/__tests__/
        RuleReviewSection.merge.test.ts (TC-020).
        (b) RuleReviewSection.tsx now renders a Pending review /
        Active / Superseded ToggleButtonGroup (DI-511 AC-011, AC-012)
        that drives the GET /api/guidance/rules/review?status=...
        fetch. Approve-all and per-row Looks right / Reject collapse
        away outside Pending; Edit stays available on every status
        because the BE apply_rule_edit accepts predecessor status
        in {pending_review, active}. Pinned in
        services/ui/src/app/admin/guidance/__tests__/
        RuleReviewSection.merge.test.ts (10 new static-source cases)
        and services/ui/src/app/admin/guidance/__tests__/
        GuidancePage.test.tsx (3 new live-render cases verifying the
        toggle, the ?status=active fetch, and the Approve-all
        scoping). Mapped to VT-510-TC-021.
        Totals across the touched suites:
        pytest -- 33 of 33 in services/api/tests/
        test_guidance_rule_edit{,_action}.py green (2 new TC-019
        cases plus the 31 from EXEC-003);
        jest -- 160 of 160 across guidance + EditRuleDialog +
        synonym-chip + RuleReviewSection suites green; the 13 new
        cases (10 static-source in RuleReviewSection.merge +
        3 live-render in GuidancePage) cover TC-020 and TC-021.
        TC-001..TC-018 unchanged since EXEC-003.
    - execution_id: "VT-LEO-AI-510-EXEC-2026-04-19-003"
      execution_date: "2026-04-19"
      executor: "automated"
      environment: "development"
      result: "pass"
      cases_executed: 18
      cases_passed: 18
      cases_failed: 0
      duration_seconds: 13.4
      notes: >
        Re-run after fixing two reviewer-visible bugs in the synonym
        chip save flow surfaced by Rob Smith on 2026-04-19:
        (1) BE LogicCriterion / LogicSeed declare model_config={"extra":
        "forbid"} but the FE was forwarding the criterion wholesale via
        stripNodeIds, including the LLM-provenance fields written by
