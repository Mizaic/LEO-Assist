# -- DO-LEO-AI-102 -- Polarity-Encoded Finding Guard Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-102"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-104"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-071"]
    verification_tests: ["VT-LEO-AI-104"]

  specification:
    title: "fix_polarity_encoded_findings guard in post_processing.py and terminology.py"
    description: |
      Adds fix_polarity_encoded_findings() to libs/pipeline/post_processing.py.
      The function iterates over resolved entities and, for any entity whose
      semantic_tag is "finding" or "observable entity" and whose SNOMED
      preferred term matches _POLARITY_SUFFIX_RE (ends with "absent",
      "not detected", "not found", "not present", or "negative" before the
      semantic tag parenthesis), forces assertion="present" and sets
      _assertion_guard="polarity_encoded_finding".

      Called from two locations:
        1. post_processing.py layer 7d (_run_double_neg_guards), after
           fix_double_negated_situations, for the training path.
        2. terminology.py _resolve_terms, after fix_double_negated_situations,
           for the runtime coding pipeline.

      This closes the gap where the existing double-negation guard handles
      only situation concepts with prefix-negated PTs. Finding concepts
      encode polarity as a suffix word; this guard handles that pattern.
    acceptance_criteria:
      - criterion: "Perineural invasion absent finding corrected"
        type: "functional"
        measurement: "Test"
        target: >
          Entity with assertion=absent and term="Perineural invasion by tumor
          absent (finding)" has assertion corrected to present with
          _assertion_guard="polarity_encoded_finding".
      - criterion: "Non-finding not corrected"
        type: "functional"
        measurement: "Test"
        target: >
          Entities with semantic_tag=disorder or situation are not affected
          by this guard.
      - criterion: "Runtime path corrected"
        type: "functional"
        measurement: "Test"
        target: >
          _resolve_terms in terminology.py calls fix_polarity_encoded_findings
          after SNOMED resolution.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "_POLARITY_SUFFIX_RE regex, _POLARITY_FINDING_TAGS frozenset, fix_polarity_encoded_findings function, _run_double_neg_guards layer 7d wrapper"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/terminology.py"
        description: "Imports fix_polarity_encoded_findings; calls it after fix_double_negated_situations in _resolve_terms"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 25
      key_functions:
        - "fix_polarity_encoded_findings"
        - "_run_double_neg_guards"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Correcting assertion inversion on polarity-encoding SNOMED finding concepts"
    risk_control_measures:
      - "Suffix-based regex detects polarity-encoding SNOMED preferred terms and forces assertion=present"
      - "Guard applied after SNOMED resolution when preferred term is known"
      - "Both runtime and training paths covered"

  verification_status:
    verification_method: "Test"
    verification_complete: true
