# -- UN-LEO-AI-083 -- Confidence-gated auto-prune of low-value training candidates
# IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-083"
  title: "Reduce HITL backlog by auto-pruning training candidates that cannot produce defensible SNOMED codes"
  description: >
    As a training-data curator, I have ~900 TrainingCandidate nodes
    sitting in non-completed states (pending, processing, failed) that
    will never reach gold quality because their LLM-proposed entities
    cannot resolve to a defensible SNOMED concept. Reviewing every one
    of them by hand wastes reviewer time and dilutes the training
    signal. I need a confidence-gated auto-prune workflow, callable
    from the Training Data UI, that re-runs the SNOMED proposal
    validator over each non-completed candidate and either deletes the
    candidate (and its draft GoldLabel/SurfaceFormTask artefacts) when
    every entity fails the validator, OR keeps it for human review when
    at least one entity is acceptable, OR routes it to a "needs review"
    bucket when the verdict is mixed. The action must always be a
    two-step preview-then-execute flow with a clear audit trail, must
    never touch GoldLabels in `status='completed'`, and must respect
    safety rails (never delete candidates that exercise blocked
    assertions or originate from manual gold seed manifests).
  stakeholder: "Training data curator / QA-RA lead / clinical reviewer"
  priority: "high"
  rationale: >
    The HITL queue has 1689 TrainingCandidate rows of which 950 are
    `status='completed'` (gold). The remaining ~739 are a long tail of
    LLM-proposed candidates that the post-processing stack flagged for
    review but the LLM extractor over-generated against. The 2026-04-17
    SNOMED validator audit (audit_gold_label_entities) demonstrated
    that we can compute a defensible "accept / reject" verdict per
    entity, with calibrated absolute confidence (EXACT, SEMANTIC,
    SURFACE branches). Applying that same verdict ladder to the
    non-completed backlog -- with a high default confidence floor --
    lets us delete candidates that would only ever waste a reviewer's
    time, without risk of dropping training signal that the model
    actually needs. Doing this in the UI (rather than only at the CLI)
    keeps the action discoverable, auditable, and reversible via the
    same admin scope that already gates the existing
    DELETE /candidates/{candidate_id} endpoint.

  acceptance_criteria:
    - "A 'Auto-prune low confidence' action is visible to admin reviewers on the Training Data > Candidates tab"
    - "Clicking the action opens a dialog where the user picks confidence-floor parameters (min_surface_match, semantic_vector_floor, semantic_min_surface) with safe defaults"
    - "The dialog runs a server-side dry-run preview that returns per-candidate verdicts (keep / delete / review) with the rejection reason and entity counts, and never mutates the graph"
    - "Preview results are grouped by verdict and show the candidate text snippet + entity rejection reasons so the reviewer can sample before executing"
    - "Execution requires the reviewer to explicitly confirm and submits the candidate_ids returned by the preview (preventing TOCTOU drift)"
    - "Execution never deletes candidates with status='completed'"
    - "Execution never deletes candidates whose entities carry an _AUTO_CODE_BLOCKED assertion (absent, refuted, declined, cancelled, planned, hypothetical, possible, historical, family) -- those route to the 'review' verdict"
    - "Execution never deletes candidates sourced from manual_gold_seed* (those route to the 'review' verdict)"
    - "Execution never deletes candidates with zero entities (empty proposals are not evidence of low confidence -- they go to 'review')"
    - "Both preview and execute endpoints require require_admin and emit an INFO log line including the actor email, parameters, scanned/kept/deleted/review counts"
    - "An equivalent CLI scripts/prune_low_confidence_candidates.py exposes the same preview-then-execute flow for offline operations"

  design_inputs:
    - "DI-LEO-AI-196"
    - "DI-LEO-AI-197"

  metadata:
    identified_by: "Curator request 2026-04-17 (~900 non-gold candidates need to be coded or pruned to reduce HITL load)"
    identified_date: "2026-04-17"
    status: "superseded"
    superseded_by: "UN-LEO-AI-085 (the defensive prune was extended to an assistive AI first-pass that pre-codes the recoverable candidates instead of leaving them in the queue; supersession effective 2026-04-17)"
    tags:
      - "training-data-quality"
      - "snomed-validation"
      - "hitl-backlog"
      - "ui-action"
