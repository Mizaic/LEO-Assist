# -- DI-LEO-AI-080 -- Appointment and Admin Header Filtering in NLP Pipeline
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-080"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The NLP coding pipeline SHALL detect and discard administrative
    appointment-header sentences from clinical encounter text before
    passing sentences to the entity extractor, so that administrative
    metadata (timestamps, staff names, location entries, appointment
    confirmations) is never coded as a clinical SNOMED CT finding.

  rationale: >
    EMIS encounter exports prepend each encounter with structured
    administrative header lines (e.g. "07:35 - Surgery: INGLE, Kirsty",
    "Entered at: LLR Community Therapy Service"). The NER and LLM
    extractors were incorrectly coding these lines as clinical context
    codes such as "Seen in general practitioner surgery" (743 instances
    observed in the April 2026 coding quality audit). This constitutes
    systematic overcoding of administrative metadata as clinical findings,
    distorting quality metrics and creating incorrect patient records.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Sentences matching admin header patterns (timestamp-led,
          'Entered at:', 'Presenting to non-clinical team',
          appointment booking/confirmation strings, phlebotomy service
          headers, online-consult headers) SHALL be removed before
          the sentence list is passed to any extractor.
      - type: "functional"
        spec: >
          Sentences that are purely clinical SHALL NOT be removed by
          the header filter (false-positive rate = 0 on clinical test
          sentences).
      - type: "safety"
        spec: >
          If all sentences in an encounter are classified as headers
          (e.g. a purely administrative encounter), the pipeline SHALL
          produce zero extractions rather than crash.

    constraints:
      - type: "safety"
        spec: >
          The filter MUST be conservative. When in doubt, a sentence
          SHALL be preserved (err on the side of keeping content).
      - type: "performance"
        spec: >
          Filter evaluation SHALL complete in O(n) time with no
          external I/O, suitable for inline pipeline use.

    dependencies: []
    downstream_impacts:
      - "libs/nlp/sentence_splitter.py (new filter function)"
      - "services/coding_worker/app/pipeline/pipeline_service.py (filter call)"
      - "libs/ner/precision_gates.py (existing entity-level gate complemented)"

    technical_details:
      language: "Python"
      framework: "libs/nlp"
      file_structure:
        - "libs/nlp/sentence_splitter.py"
        - "services/coding_worker/app/pipeline/pipeline_service.py"
      estimated_loc: 30

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-080 pass: header sentences correctly
      filtered, clinical sentences not filtered, empty-encounter handling
      correct. 100% pass required.
    test_protocol: "VT-LEO-AI-080"

  safety_class: "B"
  risks: ["R-LEO-AI-054"]
  tags:
    - "nlp-pipeline"
    - "precision-gate"
    - "overcoding-prevention"
