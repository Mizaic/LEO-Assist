# -- VT-LEO-AI-070 -- NCDA Report Template Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-070"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-070"]
    risks: []

  metadata:
    title: "NCDA Report Template Generation Verification"
    description: >
      Verifies that NCDA-aligned report templates render correctly with
      required field mappings, are configurable per programme, and include
      all mandatory NCDA data fields without manual transformation.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/api/tests/test_ncda_report_generator.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-070-TC-001"
      case_name: "Report renders with correct NCDA field mappings"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Provide synthetic audit data with known pathway fields"
          expected_result: "Template renders all NCDA required fields"
          verification_method: "automated"
      acceptance_criteria:
        - "All NCDA required fields present in rendered output"

    - case_id: "VT-070-TC-002"
      case_name: "Template is configurable per programme without code changes"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Load two different programme configurations"
          expected_result: "Each configuration produces distinct report layout"
          verification_method: "automated"
      acceptance_criteria:
        - "Report layout differs between programmes based on configuration"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: false

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-070/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
