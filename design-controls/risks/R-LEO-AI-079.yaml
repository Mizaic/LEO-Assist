# -- R-LEO-AI-079 -- Dense UI causes mis-taps on patient-reachable screens
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-079"
  title: "A patient or carer on a touch device mis-taps a safety-netting or portal control because targets are smaller than 44x44 CSS pixels, or an older clinician with mild tremor triggers the wrong action on a coding review list"

  hazard:
    description: >
      The current UI has a single compact density with no user
      control. Buttons, chips, and list rows can be under 36 CSS
      pixels tall. On a touch device or for a user with dexterity
      impairment, the wrong control is easy to hit. On
      patient-reachable screens this is high risk because the
      user may be a child, an older patient, or a carer under
      stress.
    category: "clinical_safety"

  hazardous_situation: >
    A patient opens their safety-netting advice on a phone, tries
    to tap the "I understand" confirmation, and instead taps the
    "I am worried - contact NHS 111" button below it. The
    incorrect action is taken; either a false-positive 111 call is
    made, or, worse, the confirm is mis-tapped and the patient
    never reads the red-flag list. Or: an older coder reviewing a
    long list of candidate codes accidentally approves the code
    immediately below the one they intended because rows are 32px
    tall.

  harm:
    description: >
      Patient misroutes into the wrong care pathway; or clinical
      codes are approved in error, propagating incorrect clinical
      data into the patient record and downstream reports. Both
      are clinical-safety harms with potential delayed diagnosis
      or inappropriate onward action.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Introduce three-tier density (DI-LEO-AI-119) with
        Spacious default on patient-reachable routes and
        >=44x44 CSS pixel minimum targets. Every primitive
        honours the context value.
      implemented_by: ["DI-LEO-AI-119"]
      verified_by: ["VT-LEO-AI-114"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Playwright e2e test asserts that, on each
        patient-reachable route, the smallest interactive
        bounding box is >=44px in both dimensions. CI fails the
        build on regression.
      implemented_by: ["DI-LEO-AI-119", "DI-LEO-AI-120"]
      verified_by: ["VT-LEO-AI-114", "VT-LEO-AI-115"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After the density layer and CI target-size assertion,
      residual risk covers content rendered from unknown HTML
      imports or third-party embedded widgets that bypass the
      primitive layer. These paths are out of scope for
      patient-reachable routes.

  monitoring:
    monitoring_plan: >
      Monitor Playwright target-size assertion results per
      build. Manual quarterly mis-tap test with older and
      younger users on physical devices.
    metrics:
      - "Playwright target-size violations per build (target 0)"
      - "Mis-tap rate in usability tests (target <2%)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "UX redesign programme 2026-04 inclusive design review"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "density"
      - "touch-target"
      - "accessibility"
      - "patient-safety"
