# -- DI-LEO-AI-219 -- Shared GoldLabelEditorDialog component
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-219"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-088"
  requirement: >
    The system SHALL expose a single shared editor dialog
    (`GoldLabelEditorDialog`) that every reviewer surface mounts
    when editing the codes attached to an encounter. The dialog
    SHALL accept three optional plumbing props -- `saveMode`
    ('gold' | 'dual'), `entitySaver` (custom persistence callback),
    and `onAfterSave` (post-save hook) -- with safe defaults that
    leave the existing /admin/training candidates tab unchanged.
    The dialog SHALL also accept an optional `headerChrome` slot
    so host surfaces can render context (e.g. search match
    rationale) without forking the dialog.
  rationale: >
    The candidates tab dialog has matured into the canonical entity
    editor for clinical text. Forking it for /admin/console,
    /care/patients, and /care/encounters would split the safety
    surface area and risk drift between code paths. A single dialog
    with plumbing props lets every surface consume the same
    keyboard shortcuts, assertion controls, and validation logic
    while still selecting a surface-appropriate save behaviour.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          The dialog component MUST be exported under a stable name
          (`GoldLabelEditorDialog`) from `@/components/gold-editor`,
          re-exporting the existing `GoldLabelDetailDialog` so legacy
          imports keep working during migration.
      - type: "functional"
        spec: >
          When `entitySaver` is provided the dialog MUST call it in
          place of the default PATCH `/training/gold-labels/{id}/entities`;
          when not provided the dialog MUST fall back to the default
          PATCH so /admin/training behaviour is preserved.
      - type: "functional"
        spec: >
          When `saveMode === 'dual'` the dialog MUST render a
          warning banner (`data-testid="dual-save-banner"`) that
          tells the reviewer they are writing to BOTH live data and
          gold training, citing R-LEO-AI-206.
      - type: "functional"
        spec: >
          When `headerChrome` is provided the dialog MUST render it
          inside the dialog body just below the title strip
          (`data-testid="gold-dialog-header-chrome"`).
      - type: "functional"
        spec: >
          The shared barrel (`@/components/gold-editor`) MUST surface
          the dialog, the dual-save adapter hook
          (`useDualSaveAdapter`), the four API helpers
          (`patchGoldLabelEntities`, `createGoldLabelFromDryRun`,
          `createGoldLabelFromEncounter`, `syncCodedLinksFromGold`),
          and the shared types (`GoldLabel`, `Entity`, `EntityRelation`,
          `SavedGoldEntity`, `GoldDialogSaveMode`,
          `GoldDialogEntitySaver`, `DualSaveEncounterContext`).
    constraints:
      - type: "safety"
        spec: >
          Default behaviour MUST be `saveMode='gold'` with no
          `entitySaver` so that omitting the new props on existing
          call sites cannot accidentally trigger dual-save writes.
      - type: "safety"
        spec: >
          The dual-save banner MUST always render before any "save"
          control becomes interactive in `dual` mode.
    dependencies: []
    downstream_impacts:
      - "Every surface that edits encounter entities now consumes one component"
      - "Future entity-editor changes (shortcuts, assertions, validation) flow to all surfaces simultaneously"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + MUI"
      file_structure:
        - "services/ui/src/components/gold-editor/GoldLabelEditorDialog.tsx"
        - "services/ui/src/components/gold-editor/index.ts"
        - "services/ui/src/components/gold-editor/types.ts"
        - "services/ui/src/components/gold-editor/api.ts"
        - "services/ui/src/components/gold-editor/useDualSaveAdapter.ts"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-213 (static-source) verifies all five barrel exports,
      the saveMode/entitySaver/onAfterSave/headerChrome prop surface,
      the conditional dual-save banner, and the conditional header
      chrome rendering.
    test_protocol: "VT-LEO-AI-213"

  safety_class: "B"
  risks:
    - "R-LEO-AI-206"
  tags:
    - "ui"
    - "training-data"
    - "shared-component"
