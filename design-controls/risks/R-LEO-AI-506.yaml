# -- R-LEO-AI-506 -- Untracked LLM cost from non-coding pipelines

- id: "R-LEO-AI-506"
  title: "Non-coding LLM pipelines write no cost telemetry, so per-tenant invoicing under-counts AI spend"

  hazard:
    description: >
      The shared LLM helper invoke_llm_json fires its tracking callback
      with no token counts and no callback is registered at runtime, so
      the SBAR orchestrator (and any future pipeline that does not
      go through the coding workflow engine) writes no
      :AuditEvent {type:'PipelineRun'} and no llm_usage_json. The
      per-tenant billing subsystem (DI-LEO-AI-068) reads spend from
      exactly those two surfaces, so SBAR cost is invisible to
      invoicing and to the dashboard cost panels.
    category: "data_protection"

  hazardous_situation: >
    A tenant runs many SBAR generations across a billing period.
    Finance issues invoices computed only from coding extraction
    spend. The tenant is under-billed and Mizaic absorbs the
    cost. Concurrently, a prompt-version regression in SBAR
    doubles per-call cost without any cost-monitoring alert
    firing.

  harm:
    description: >
      Direct revenue loss from under-billing tenants for AI usage.
      Loss of cost-regression observability allows expensive
      prompts to ship undetected. No direct patient-safety impact
      because the underlying clinical output is unaffected.
    severity: "minor"
    safety_impact: "none"

  initial_risk_estimate:
    severity: 2
    probability: 4
    detectability: 4
    rpn: 32
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        invoke_llm_json extracts input_tokens, output_tokens,
        cached_tokens, latency_ms and the model id from the
        provider response and passes them to the tracking
        callback for every call.
      implemented_by: ["DI-LEO-AI-506"]
      verified_by: ["VT-LEO-AI-508"]
    - control_type: "design_feature"
      description: >
        A contextvars-scoped LLMUsageRecorder accumulates per-run
        token usage so any orchestrator can persist it to a
        UI-visible surface with a single try/except block.
      implemented_by: ["DI-LEO-AI-506"]
      verified_by: ["VT-LEO-AI-508"]
    - control_type: "design_feature"
      description: >
        The SBAR orchestrator writes a :AuditEvent {type:'PipelineRun'}
        and Assessment.llm_usage_json on finalisation, matching
        the wire format already consumed by /analytics/llm-spend
        and /pricing/orgs.
      implemented_by: ["DI-LEO-AI-506"]
      verified_by: ["VT-LEO-AI-508"]
    - control_type: "procedural_control"
      description: >
        dq_stale_unactioned_safety_alerts and the dashboard
        LLMSpendPanel together flag any 7-day window in which a
        tenant has Assessment nodes but no PipelineRun
        AuditEvents (telemetry gap). Quarterly platform review
        confirms parity.
      implemented_by: ["DI-LEO-AI-506"]
      verified_by: ["VT-LEO-AI-508"]
    - control_type: "design_feature"
      description: >
        The synchronous LLM entry points
        (libs.llm_client.factory.LLMClient.converse for both
        Bedrock and Azure, and
        libs.llm_client.providers.invoke_with_fallback) fire
        track_llm_usage on every call (success and failure
        paths) so the ~14 sync caller surfaces (escalation,
        consensus, label_verifier, candidate_ai_first_pass,
        llm_extractor, training, _training_askleo, prompts,
        terminology, encounter_query_understanding,
        terminology_api/concepts, exclusion_detector,
        _extractor, fix_analyzer) become observable to the
        dashboard LLMSpendPanel and per-tenant billing
        without modifying any caller. Telemetry is
        best-effort and a callback exception is swallowed.
      implemented_by: ["DI-LEO-AI-515"]
      verified_by: ["VT-LEO-AI-513"]
    - control_type: "design_feature"
      description: >
        The episode engine writes a parallel
        :AuditEvent {type:'PipelineRun', subtype:'episode_engine'}
        from persist_trace and GET_PATIENT_LLM_SPEND is extended
        with a UNION over those rows so episode-engine cost is
        visible in the per-tenant billing dashboard and the
        per-patient drill-down panel without UI changes.
        Telemetry is best-effort and a Neo4j failure logs at
        WARNING.
      implemented_by: ["DI-LEO-AI-517"]
      verified_by: ["VT-LEO-AI-516"]
    - control_type: "design_feature"
      description: >
        The guidance rule generator's existing audit event is
        normalised to type='PipelineRun',
        subtype='guidance_rule_extraction' and the synchronous
        /guidance/rules/test dry-run endpoint writes a parallel
        :AuditEvent with subtype='guidance_rule_dry_run'. Both
        carry the canonical token / cost properties so guidance
        spend (background + HITL editor) appears in /admin/billing
        and the per-patient drill-down with no UI changes.
      implemented_by: ["DI-LEO-AI-518"]
      verified_by: ["VT-LEO-AI-517"]
    - control_type: "design_feature"
      description: >
        Every production LLMClient.converse call site passes a
        stable agent_task literal (and patient_id where in scope)
        so the telemetry events emitted by DI-LEO-AI-515 carry
        meaningful task labels for cost attribution. The
        duplicated services/api/app/services/llm_usage module is
        consolidated into libs/llm_usage so cost numbers stop
        depending on the import path the caller happened to use.
      implemented_by: ["DI-LEO-AI-519"]
      verified_by: ["VT-LEO-AI-518"]

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Once invoke_llm_json + LLMUsageRecorder are wired through the
      shared helper, every future LLM-backed feature inherits cost
      telemetry by default. Telemetry writes are best-effort with
      WARNING logs, so the run never fails because of cost-tracking
      issues. Residual risk is limited to a small window of missed
      events between a deploy and the next dq sweep.

  monitoring:
    monitoring_plan: >
      Weekly review of the LLMSpendPanel comparing Assessment
      counts to PipelineRun AuditEvent counts for the same period.
      Quarterly billing reconciliation cross-checks invoice totals
      against /analytics/llm-spend/runs aggregates.
    metrics:
      - "Ratio of completed :Assessment nodes to corresponding PipelineRun AuditEvents (target = 1.0)"
      - "Mean llm_cost_usd per SBAR run (alert if 7-day moving average changes > 25%)"
    review_frequency: "weekly"

  metadata:
    identified_by: "Platform engineering review during SBAR playground rollout"
    identified_date: "2026-04-18"
    status: "analyzed"
    tags:
      - "observability"
      - "billing"
      - "cost-tracking"
