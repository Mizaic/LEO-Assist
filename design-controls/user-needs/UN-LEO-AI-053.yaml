# -- UN-LEO-AI-053 -- Accurate per-episode specialist visit attribution
# IEC 62304 User Need

- id: "UN-LEO-AI-053"
  title: "Per-episode specialist visit attribution without cross-pathway contamination"
  description: >
    Clinical quality managers and auditors need each cancer investigation episode
    to carry only the specialist visit that genuinely belongs to it. When a
    patient has multiple cancer referral episodes sharing the same cancer site
    (e.g. two breast 2WW referrals in different years), a specialist clinic
    visit from the first pathway must not be attributed to the second. Incorrect
    attribution produces false stale_post_specialist episode counts, inflated
    specialist-seen rates, and inaccurate NCDA audit metrics.
  stakeholder: "quality_manager"
  priority: "high"
  rationale: >
    The NCDA audit report and clinical dashboard both surface specialist-seen
    rates and time-from-referral-to-specialist KPIs. If historic specialist
    visits bleed across episode boundaries, these metrics are wrong. For a
    cancer audit, wrong episode status can cause genuine stale pathways to be
    hidden behind a false specialist-seen flag, delaying clinical follow-up.
  acceptance_criteria:
    - "Each specialist visit is attributed to at most one episode"
    - "A specialist visit that predates an episode referral is never attributed to that episode"
    - "Two same-site episodes in different calendar years each get only the specialist visit that follows their own referral date"
    - "Episodes with no matching specialist visit correctly show specialist_seen=False"
    - "After rebuild, zero EpisodeOfCare nodes have specialist_visit_date earlier than referral_date"
  metadata:
    created_date: "2026-04-07"
    status: "draft"
  design_inputs: ["DI-LEO-AI-086"]
