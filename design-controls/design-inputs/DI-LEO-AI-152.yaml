# -- DI-LEO-AI-152 -- Wave E Phase 5: Clinical Guidelines workflow on @leo/design-system
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-152"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    The Clinical Guidelines admin orchestrator
    (services/ui/src/app/admin/guidance/page.tsx) SHALL be rebuilt
    onto the shared @leo/design-system chrome:

      - SegmentedTabs as a sticky workflow jump strip with three
        steps (Load / Review / Compile) that scroll the matching
        StepCard into view.
      - Motion-enabled StepCard sections (12px radius, 1px divider
        border, 3px tone-coded left accent strip, framer-motion
        stagger entry) replacing the legacy heavy 4px-accent
        Card / CardContent chrome.

    All four child sections (NiceLoaderSection, LoadedGuidelinesPanel,
    RuleReviewSection, BitmapLifecycleSection) MUST be preserved
    untouched, including the loadedRefreshKey / ruleRefreshKey
    bridges that fan changes from one step into the next. The
    redesign is a chrome-only rebuild; sub-module internals stay on
    their existing implementations.
  rationale: >
    Wave E user feedback: "Clinical Guidelines doesn't look touched
    at all" -- the page was the only Knowledge tab still on the
    legacy SectionBox / Card / CardContent chrome with a thick 4px
    accent border, no motion, and a row of jump-link Buttons
    instead of SegmentedTabs. That broke UN-LEO-AI-071 AC-001
    (consistent primitives) and AC-002 (motion-paced entry).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: The page imports SegmentedTabs from
          @leo/design-system and motion (as fm) from framer-motion.
      - type: "functional"
        spec: >
          AC-002: The legacy heavy chrome is removed -- no Card /
          CardContent imports, no borderLeft: "4px solid", no
          SectionBox helper.
      - type: "functional"
        spec: >
          AC-003: Each StepCard renders as fm.section with
          borderRadius: 12, a 3px-wide left accent strip with
          background: accent, and a stagger entry of
          delay = min(index, 6) * 0.05s.
      - type: "functional"
        spec: >
          AC-004: All four child sections render with their
          existing props -- NiceLoaderSection.onGuidelineLoaded,
          LoadedGuidelinesPanel.refreshKey + onRulesGenerated,
          RuleReviewSection.refreshKey, BitmapLifecycleSection
          (no props).
      - type: "functional"
        spec: >
          AC-005: A sticky workflow jump strip (data-testid
          guidance-jump-strip) hosts SegmentedTabs with three tabs
          (id: load / review / compile). Selecting a tab scrolls
          the matching StepCard into view via scrollIntoView({
          behavior: "smooth", block: "start" }).
      - type: "functional"
        spec: >
          AC-006: The numbered steps (1 Load, 2 Review, 3 Compile)
          are rendered as 28px circular pips inside the StepCard
          header so reviewers can see their place in the workflow
          at a glance.
    constraints:
      - type: "safety"
        spec: >
          The redesign MUST preserve the existing
          loadedRefreshKey / ruleRefreshKey bridges so that
          successfully loading a guideline still triggers
          LoadedGuidelinesPanel to refetch, and successfully
          generating rules still triggers RuleReviewSection to
          refetch. A regression here would silently strand the QA
          lead on stale data.
    dependencies: ["DI-LEO-AI-142"]
    downstream_impacts:
      - "services/ui/src/app/admin/guidance/page.tsx"
      - "services/ui/src/app/admin/knowledge/page.tsx (consumer)"
    technical_details:
      language: "TypeScript"
      framework: "React + Next.js + MUI + Framer Motion + @leo/design-system"
      file_structure:
        - "services/ui/src/app/admin/guidance/page.tsx"
      estimated_loc: 230

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-150 passes: 9 test cases covering imports, removal
      of legacy chrome, StepCard token alignment, child-section
      preservation, refresh-key bridges, sticky jump strip,
      SegmentedTabs API correctness, and step-numbering.
    test_protocol: "VT-LEO-AI-150"

  safety_class: "B"
  risks: ["R-LEO-AI-104"]
  tags:
    - "knowledge"
    - "design-system"
    - "wave-e"
    - "phase-5"
    - "clinical-guidelines"
