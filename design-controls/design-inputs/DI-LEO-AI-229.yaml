# -- DI-LEO-AI-229 -- Inter-service session namespace consistency
# IEC 62304 / ISO 13485 Design Input
#
# Closes the inter-service auth gap that surfaced as a "log in, see data,
# get bounced back to sign-in" loop on leo-ai-audit.healthcarecopilot.ai
# (April 2026). core-api wrote sessions to one Redis namespace and every
# downstream service (analytics-api, fhir-api, terminology-api,
# training-worker, pipeline-worker, research-worker, model-inference)
# silently looked them up in a different one, so every X-Leo-Session
# verification on those services failed with 401.

- id: "DI-LEO-AI-229"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-087"
  requirement: >
    Every backend service that calls
    ``libs/redis_client/session.py::load_session`` or
    ``services/api/app/services/session_store.py::load_session`` SHALL
    resolve the same Redis key namespace for any given deployed
    environment. The deployed configuration SHALL set
    ``SESSION_KEY_NAMESPACE`` explicitly on every backend container
    (core-api, analytics-api, fhir-api, terminology-api,
    training-worker, pipeline-worker, research-worker,
    model-inference) so namespace resolution is independent of which
    other env vars (FRONTEND_URL, AUTH_REDIRECT_URI, ENVIRONMENT,
    APP_ENV, LEO_ENV) happen to be set on each service. The Python
    namespace-resolver SHALL produce identical output in
    ``libs/redis_client/session.py`` and
    ``services/api/app/services/session_store.py`` given the same
    environment variables.

  rationale: >
    A session-namespace mismatch manifests as a 401 on every
    inter-service call, which the UI auth interceptor treats as
    "session expired" and turns into a redirect to ``/auth/login``.
    The user appears to log in, see data for a fraction of a second,
    and then get bounced back to the sign-in page in a tight loop.
    For a clinician on shift this is indistinguishable from a total
    outage of the SaMD and is therefore a safety-relevant
    availability hazard under ISO 14971.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          ``services/api/app/services/session_store.py::_detect_session_namespace``
          and ``libs/redis_client/session.py::_detect_session_namespace``
          return the same string for every combination of the inputs
          ``SESSION_KEY_NAMESPACE``, ``ENVIRONMENT``, ``APP_ENV``,
          ``LEO_ENV``, ``FRONTEND_URL``, ``AUTH_REDIRECT_URI`` defined
          in the verification test.
      - type: "functional"
        spec: >
          A session saved by ``session_store.save_session`` is loadable
          by ``libs/redis_client/session.py::load_session`` when both
          processes share the same ``SESSION_KEY_NAMESPACE``.
      - type: "safety"
        spec: >
          ``infra/bicep/modules/container-apps.bicep`` injects
          ``SESSION_KEY_NAMESPACE`` into ``sharedEnv`` so every
          container app deployed by ``main.bicep`` receives the value.
    constraints:
      - type: "safety"
        spec: >
          The default fallback path (no env vars set) MUST resolve to
          a deterministic non-empty string ("local") so the lookup
          never produces an empty Redis key prefix that could read or
          write outside its intended namespace.
    dependencies:
      - "DI-LEO-AI-218"
    downstream_impacts:
      - "Inter-service auth (X-Leo-Session) for analytics, FHIR, terminology, training, pipeline, research, and model-inference services"
      - "Post-login dashboard load on every authenticated route"
    technical_details:
      language: "Python"
      framework: "FastAPI / shared libs"
      file_structure:
        - "libs/redis_client/session.py"
        - "services/api/app/services/session_store.py"
        - "infra/bicep/modules/container-apps.bicep"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 6 test cases in
      ``tests/test_session_namespace_parity.py`` pass under pytest.
    test_protocol: "VT-LEO-AI-217"

  safety_class: "B"
  risks:
    - "R-LEO-AI-210"
  tags:
    - "auth"
    - "inter-service"
    - "session"
    - "deployment"
    - "safety-relevant"
