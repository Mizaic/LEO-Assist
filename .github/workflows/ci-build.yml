name: CI - Build and Push Images

# Atlas trace
#   DO: DO-6036D724
#   DI: DI-71087A9E
#   Look up via: get_design_control(dc_type="design-output", dc_id="DO-6036D724")
#
# Hardening notes
#   - Third-party / Microsoft-owned actions are pinned to immutable commit
#     SHAs with the human-readable tag in a comment.
#   - Webhook-derived values (github.event.before, etc.) are passed through
#     `env:` to shell steps to defeat GHA template injection.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated credential
  contents: read

env:
  ACR_NAME: leoaicr
  ACR_LOGIN_SERVER: leoaicr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Tests
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio black flake8

      - name: Lint - black format check
        run: black --check --diff .

      - name: Atlas trace headers (every Class B+ source file)
        run: python3 scripts/atlas/check_atlas_trace_headers.py

      - name: Lint - flake8
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$EVENT_BEFORE_SHA"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{0,40}$ ]]; then
            echo "Refusing to use non-hex BASE_SHA: $BASE_SHA"
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping flake8 changed-file lint."
            exit 0
          fi

          PY_CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- '*.py' || true)"
          if [ -z "$PY_CHANGED" ]; then
            echo "No Python file changes; skipping flake8."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              flake8 --max-line-length=88 --extend-ignore=E203,W503,E501,E402 "$file"
            fi
          done <<< "$PY_CHANGED"

      - name: Run tests (non-blocking)
        run: |
          set +e
          pytest tests/ -v --tb=short
          TEST_EXIT=$?
          echo "PYTEST_EXIT_CODE=$TEST_EXIT" >> "$GITHUB_ENV"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "Pytest failed with exit code $TEST_EXIT (non-blocking in CI)." >&2
          fi
          exit 0
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Publish test status summary
        if: always()
        run: |
          {
            echo "## Test job status"
            echo ""
            if [ "${PYTEST_EXIT_CODE:-0}" -eq 0 ]; then
              echo "- pytest: passed"
            else
              echo "- pytest: failed (non-blocking), exit code ${PYTEST_EXIT_CODE}"
              echo "- action: build/push continues"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ui-a11y:
    name: UI accessibility gate (VT-LEO-AI-113/114/115/116)
    needs: [test]
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint - ESLint with jsx-a11y (changed files)
        run: |
          set +e
          npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
          LINT_EXIT=$?
          if [ "$LINT_EXIT" -ne 0 ]; then
            echo "::warning::eslint jsx-a11y reported issues (non-blocking while codebase migrates)"
          fi
          exit 0

      - name: Jest - design tokens, density, a11y primitives, explanation patterns
        run: |
          npx jest \
            src/__tests__/theme-tokens.test.ts \
            src/__tests__/density-context.test.tsx \
            src/__tests__/confirmdialog-a11y.test.tsx \
            src/__tests__/statusdot-a11y.test.tsx \
            src/__tests__/explanation-patterns.test.tsx \
            --no-coverage --ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright - a11y baseline (axe-core, non-blocking)
        run: |
          set +e
          npx playwright test e2e/a11y-baseline.spec.ts --reporter=line
          AXE_EXIT=$?
          if [ "$AXE_EXIT" -ne 0 ]; then
            echo "::warning::axe-core a11y baseline failed (non-blocking until VT-115 TC-006 is green)"
          fi
          exit 0

  build-push:
    name: Build ${{ matrix.service }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-api
            dockerfile: infra/dockerfiles/Dockerfile.core-api
          - service: terminology-api
            dockerfile: infra/dockerfiles/Dockerfile.terminology-api
          - service: fhir-api
            dockerfile: infra/dockerfiles/Dockerfile.fhir-api
          - service: analytics-api
            dockerfile: infra/dockerfiles/Dockerfile.analytics-api
          - service: pipeline-worker
            dockerfile: infra/dockerfiles/Dockerfile.pipeline-worker
          - service: model-inference
            dockerfile: infra/dockerfiles/Dockerfile.model-inference
          - service: training-worker
            dockerfile: infra/dockerfiles/Dockerfile.training-worker
          - service: research-worker
            dockerfile: infra/dockerfiles/Dockerfile.research-worker

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/${SERVICE}"
          TAG="sha-${GITHUB_SHA}"
          docker build \
            --file "$DOCKERFILE" \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            --cache-from "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Output image digest
        env:
          SERVICE: ${{ matrix.service }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' "${ACR_LOGIN_SERVER}/${SERVICE}:sha-${GITHUB_SHA}"

  build-push-ui:
    name: Build ui
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5  # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE="${ACR_LOGIN_SERVER}/ui"
          TAG="sha-${GITHUB_SHA}"
          docker build \
            --file infra/dockerfiles/Dockerfile.ui \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            --cache-from "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Output image digest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' "${ACR_LOGIN_SERVER}/ui:sha-${GITHUB_SHA}"
