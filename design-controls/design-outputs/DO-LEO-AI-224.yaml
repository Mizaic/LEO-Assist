# -- DO-LEO-AI-224 -- Inter-service session namespace consistency
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-224"
  version: "1.0.0"
  type: "Configuration"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-229"
    user_needs:
      - "UN-LEO-AI-087"
    risks_addressed:
      - "R-LEO-AI-210"
    verification_tests:
      - "VT-LEO-AI-217"

  specification:
    title: "Explicit SESSION_KEY_NAMESPACE on every backend container"
    description: |
      Adds ``SESSION_KEY_NAMESPACE`` to the ``sharedEnv`` block in
      ``infra/bicep/modules/container-apps.bicep`` so every container
      app receives the value. The value is derived from the first
      label of the host of ``frontendUrl`` (e.g. ``leo-ai-audit`` for
      ``https://leo-ai-audit.healthcarecopilot.ai``), which matches
      the existing fallback rule in
      ``services/api/app/services/session_store.py`` and
      ``libs/redis_client/session.py``. By making the value explicit
      on every service, namespace resolution no longer depends on
      which other env vars are present on which container.

      The hot-fix ``az containerapp update --set-env-vars
      SESSION_KEY_NAMESPACE=leo-ai-audit`` was also applied directly
      to all eight backend container apps in the leo-ai-dev resource
      group so that the fix takes effect ahead of the next CD
      deployment.

    acceptance_criteria:
      - criterion: "namespace-consistency"
        type: "functional"
        measurement: "Test"
        target: >
          Both Python session-store modules (``services/api/app/services/session_store.py``
          and ``libs/redis_client/session.py``) resolve the same
          namespace given the same env vars (every test case in
          ``tests/test_session_namespace_parity.py``).
      - criterion: "bicep-coverage"
        type: "functional"
        measurement: "Test"
        target: >
          ``infra/bicep/modules/container-apps.bicep`` includes
          ``SESSION_KEY_NAMESPACE`` in the ``sharedEnv`` array (static
          source check in the verification test).
      - criterion: "round-trip"
        type: "functional"
        measurement: "Test"
        target: >
          A session saved through ``session_store.save_session`` is
          retrievable through ``libs/redis_client/session.py::load_session``
          when both share the same ``SESSION_KEY_NAMESPACE`` value.

  implementation:
    artifacts:
      - artifact_type: "infrastructure_as_code"
        location: "infra/bicep/modules/container-apps.bicep"
        description: >
          ``sessionKeyNamespace`` derived from frontendUrl host first
          label; injected into ``sharedEnv`` as
          ``SESSION_KEY_NAMESPACE``.
      - artifact_type: "source_code"
        location: "libs/redis_client/session.py"
        description: "_detect_session_namespace, _session_keys, load_session"
      - artifact_type: "source_code"
        location: "services/api/app/services/session_store.py"
        description: "_detect_session_namespace, SESSION_PREFIX, save_session, load_session"
    storage_location: "git"
    technical_details:
      language: "Python + Bicep"
      loc: 80
      key_functions:
        - "_detect_session_namespace"
        - "load_session"
        - "save_session"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Inter-service authentication for every clinician-facing API call (analytics, FHIR, terminology, pipeline, training)"
    risk_control_measures:
      - "Explicit SESSION_KEY_NAMESPACE removes silent reliance on FRONTEND_URL parity across services"
      - "Bicep `sharedEnv` makes the value uniform across every backend container in one place"
      - "Verification test enforces parity between the two Python namespace resolvers"

  verification_status:
    verification_method: "Test"
    verification_complete: true
