# -- DI-LEO-AI-151 -- Wave E polish: Knowledge tab width parity + Domains/Terminology card consistency
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-151"
  type: "Usability"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    All eight Knowledge tabs SHALL render at the wide (1600px) layout
    width via KnowledgePageLayout so that page width does not jump
    when the user moves between tabs. The previously narrower
    "ai-instructions" and "clinical-guidelines" entries in TAB_WIDTH
    MUST be promoted to "wide" to match the data-heavy reading,
    review and CRUD tabs.

    The Domains DomainCard and the Terminology PackageCard SHALL
    share the same visual contract -- 12px border radius, 18px
    padding, 1px divider border, 3px tone-coded left accent strip,
    minHeight >= 160px, icon + title in the header row, tone-tinted
    chip on the right -- so the two surfaces feel like the same card
    family. The Domains responsive grid MUST be capped at three
    columns on large screens (no lg:4) so cards stay readable
    instead of getting cramped.
  rationale: >
    Wave E Phase 4 user feedback: "AI Instructions does not render
    to the same width as Training Data, Surface Forms and Context
    Rules" and "Domains is a grid of cards, need to ensure
    consistency with Terminology". The width mismatch made the
    Knowledge tab system feel like two different products glued
    together; the card-style mismatch broke UN-LEO-AI-071 AC-001
    (consistent primitives across all tabs).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: services/ui/src/app/admin/knowledge/page.tsx
          TAB_WIDTH maps every one of the eight Knowledge tab keys
          (training-data, surface-forms, context-rules,
          ai-instructions, clinical-guidelines, pathways, domains,
          terminology) to "wide".
      - type: "functional"
        spec: >
          AC-002: services/ui/src/app/settings/domains/page.tsx
          DomainCard uses borderRadius: 12, padding: 18, a 3px
          width left accent strip with borderRadius: 2 and
          background: accent, minHeight 168.
      - type: "functional"
        spec: >
          AC-003: services/ui/src/app/settings/terminology/page.tsx
          PackageCard uses borderRadius: "12px", p: "18px", a 3px
          width left accent strip with bgcolor: accent, and
          minHeight 168.
      - type: "functional"
        spec: >
          AC-004: Domains responsive grid is xs:1, sm:2, md:3 with
          no lg:4 column.
      - type: "functional"
        spec: >
          AC-005: DomainCard tone chips use the canonical knowledge
          palette -- info (#DBEAFE / #1E40AF / #BFDBFE) for NICE,
          neutral (#F1F5F9 / #475569 / #E2E8F0) for built-in,
          positive (#ECFDF5 / #047857 / #A7F3D0) for tenant.
    constraints:
      - type: "safety"
        spec: >
          The width promotion MUST NOT change behaviour of the
          standalone /admin/prompts or /admin/guidance routes,
          which mount the same page components without
          KnowledgePageLayout. Those pages stay self-contained.
    dependencies: ["DI-LEO-AI-142", "DI-LEO-AI-144", "DI-LEO-AI-147"]
    downstream_impacts:
      - "services/ui/src/app/admin/knowledge/page.tsx"
      - "services/ui/src/app/settings/domains/page.tsx"
      - "services/ui/src/app/settings/terminology/page.tsx"
    technical_details:
      language: "TypeScript"
      framework: "React + MUI + @leo/design-system"
      file_structure:
        - "services/ui/src/app/admin/knowledge/page.tsx"
        - "services/ui/src/app/settings/domains/page.tsx"
        - "services/ui/src/app/settings/terminology/page.tsx"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-149 passes: 6 test cases covering width parity,
      DomainCard / PackageCard token alignment, grid-column cap,
      minHeight floor, and chip palette.
    test_protocol: "VT-LEO-AI-149"

  safety_class: "A"
  risks: []
  tags:
    - "knowledge"
    - "design-system"
    - "wave-e"
    - "polish"
