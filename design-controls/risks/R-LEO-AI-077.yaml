# -- R-LEO-AI-077 -- Observable entity value not captured for string or pre-entity results
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-077"
  title: "Observable entity value field is left empty when the result is a string descriptor or appears before the entity span, causing downstream abnormal detection to treat the result as unknown"

  hazard:
    description: >
      The Layer 6 value-unit linker only processes numeric measurement spans.
      String results (positive, negative, borderline) and values that appear
      before the entity in the encounter text are not linked, leaving
      obs["value"] = None even when the encounter clearly records a result.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician records a microbiological or immunological result such as
    "Urine culture -- negative" or "positive -- COVID antigen rapid test".
    The NLP pipeline extracts the observable entity but leaves obs.value empty
    because the value-unit linker skips non-numeric candidates. The abnormal
    result detection layer treats the result as missing and does not flag the
    finding. A clinician reviewing the audit dashboard sees no alert for a
    positive result that should have been actioned.

  harm:
    description: >
      Clinically significant positive or abnormal test results are not surfaced
      in the audit dashboard. Pathway coordinators miss findings that require
      follow-up, increasing the risk of delayed treatment or missed safety
      netting for the patient.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Extend Layer 6 to add a string-result linking pass that attaches
        qualifier_value entities in _RESULT_DESCRIPTOR_TEXTS to the nearest
        observable_entity within 40 characters, and a raw-text fallback scan
        that captures values in a 60-character window before the observable
        start offset.
      implemented_by: ["DI-LEO-AI-111"]
      verified_by: ["VT-LEO-AI-111"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After extension, the linker captures all entries in
      _RESULT_DESCRIPTOR_TEXTS and values within 60 characters before the
      entity. Residual risk covers result descriptors outside this vocabulary
      (free-text qualitative descriptions) and values more than 60 characters
      away from the entity, both of which are uncommon clinical patterns. A
      human reviewer retains responsibility for actioning flagged results.

  monitoring:
    monitoring_plan: >
      Track the proportion of observable_entity records in Neo4j where
      obs.value IS NULL after post-processing. Alert if the null-value rate
      increases by more than 5 percentage points in any weekly audit cycle.
    metrics:
      - "Observable entity null-value rate (target <5%)"
      - "String result entities not linked to any observable (target <2%)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review - value-unit linker gap analysis 2026-04-15"
    identified_date: "2026-04-15"
    status: "mitigated"
    tags:
      - "observable-entity"
      - "value-unit-linking"
      - "pipeline"
      - "clinical-safety"
