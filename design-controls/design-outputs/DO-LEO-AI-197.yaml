# -- DO-LEO-AI-197 -- Dry-run to gold editor: API endpoint + UI deep link
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-197"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs:
      - "DI-LEO-AI-198"
      - "DI-LEO-AI-199"
    user_needs:
      - "UN-LEO-AI-084"
    risks_addressed:
      - "R-LEO-AI-189"
    verification_tests:
      - "VT-LEO-AI-191"
      - "VT-LEO-AI-192"

  specification:
    title: "Dry-run encounter to gold-label editor bridge"
    description: |
      Three small, tightly-scoped artefacts together close the
      'spot a NER error in dry-run -> ship a gold correction'
      loop:

        1. POST /api/training/candidates/from-dry-run
           (services/api/app/routers/training.py): de-identifies
           the encounter text via libs.utils.deidentify.deidentify_text(text, ner=True),
           hashes the de-identified text to candidate_id (sha256
           hex), upserts a TrainingCandidate with
           source='dry_run_correction' and status='pending', re-anchors
           the dry-run entities onto the de-identified text (drops
           any whose surface text cannot be found), and ensures a
           draft GoldLabel for the candidate. Idempotent on
           candidate_id: a second call returns the existing draft.

        2. EvaluateStage 'Open in gold editor' IconButton
           (services/ui/src/components/console/EvaluateStage.tsx):
           rendered next to the entity-count badge in both the
           NER-only and full-pipeline result rows. POSTs to the
           new endpoint and on success router.push()'s to
           /admin/gold-dataset?labelId=...&from=dry_run. Disabled
           while in flight; failures surface in the existing
           Alert.

        3. GoldDatasetPanel deep-link handler
           (services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx):
           reads useSearchParams(); switches the active tab to
           'candidates' when from=dry_run; resolves labelId via
           in-memory items first, then via fetchGoldLabel; opens
           GoldLabelDetailDialog by setting selectedItem; clears
           the query param via router.replace so a refresh does
           not re-open the dialog. /gold-dataset/page.tsx wraps
           the panel in <Suspense> for app-router compatibility.

      No new GoldLabelDetailDialog code path: the existing dialog,
      its keyboard shortcuts, suggestion fetcher, and mark-gold
      flow all run unchanged because the deep link feeds into the
      same selectedItem state slot used by the verified-gold list.

    acceptance_criteria:
      - criterion: "deidentify_called_before_hash"
        type: "safety"
        measurement: "Test"
        target: "candidate_id is sha256 of the de-identified text, not the raw encounter text"
      - criterion: "candidate_upsert_source_dry_run_correction"
        type: "functional"
        measurement: "Test"
        target: "Upsert call uses source='dry_run_correction' and status='pending'"
      - criterion: "entity_reanchor_drops_unmappable"
        type: "functional"
        measurement: "Test"
        target: "Entities whose text cannot be located in the de-identified text are dropped; remaining entities carry adjusted start/end offsets matching the de-identified text"
      - criterion: "idempotent_on_second_call"
        type: "functional"
        measurement: "Test"
        target: "Second call returns the same candidate_id and the same label_id; no duplicate GoldLabel is created"
      - criterion: "empty_text_returns_400"
        type: "safety"
        measurement: "Test"
        target: "POST with empty encounter_text returns HTTP 400"
      - criterion: "icon_button_in_both_row_blocks"
        type: "functional"
        measurement: "Test"
        target: "EvaluateStage.tsx renders aria-label='Open in gold editor' inside both the dryRunResults and pipelineTraceResults map blocks"
      - criterion: "deep_link_opens_dialog"
        type: "functional"
        measurement: "Test"
        target: "GoldDatasetPanel.tsx contains a useEffect on deepLinkLabelId that calls setSelectedItem and router.replace"
      - criterion: "candidates_tab_on_dry_run"
        type: "functional"
        measurement: "Test"
        target: "GoldDatasetPanel.tsx contains setTab('candidates') guarded by deepLinkFrom === 'dry_run'"
      - criterion: "suspense_wraps_panel"
        type: "functional"
        measurement: "Test"
        target: "/gold-dataset/page.tsx wraps GoldDatasetPanel in <Suspense>"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "candidate_from_dry_run, _sanitise_dry_run_entities, DryRunCandidateRequest"
      - artifact_type: "source_code"
        location: "services/ui/src/components/console/EvaluateStage.tsx"
        description: "openInGoldEditor, IconButton in both row blocks"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "useSearchParams deep-link effect"
      - artifact_type: "source_code"
        location: "services/ui/src/app/gold-dataset/page.tsx"
        description: "Suspense wrapper for the panel"
    storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 250
      key_functions:
        - "candidate_from_dry_run"
        - "_sanitise_dry_run_entities"
        - "openInGoldEditor"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Server-side de-identification of clinical encounter text before any persistence or hashing"
      - "Idempotent candidate creation prevents duplicate gold drafts when two reviewers click the same encounter"
    risk_control_measures:
      - "deidentify_text(text, ner=True) is the only path from raw text to candidate_id"
      - "candidate_id contract matches libs/pipeline_graph/subgraphs/persist.py::_candidate_id so curator-corrected and pipeline-produced candidates collapse onto the same node"
      - "source='dry_run_correction' lets QA filter and audit dry-run-sourced candidates separately"
      - "Per-row IconButton with explicit aria-label keeps the page-level primary action unchanged (one primary per page)"

  verification_status:
    verification_method: "Test"
    verification_complete: false
