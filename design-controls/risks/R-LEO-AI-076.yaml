# -- R-LEO-AI-076 -- Algorithm jargon causes incorrect user action
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-076"
  title: >
    Algorithm terminology exposed in the UI causes users to misinterpret
    findings and take incorrect action

  hazard:
    description: >
      If technical algorithm names or scores (e.g. "betweenness centrality
      coefficient: 0.73") appear in the user interface, non-technical clinical
      or operational staff may misinterpret their meaning, over- or under-weight
      a finding, or make an erroneous operational decision.
    category: "usability"

  hazardous_situation: >
    A service improvement manager sees a column labelled "betweenness centrality"
    with a value of 0.73 and interprets this as a percentage (73%) criticality
    score. They escalate or deprioritise services based on this misreading.

  harm:
    description: >
      Incorrect service prioritisation or de-prioritisation that misallocates
      clinical capacity or delays pathway improvement work.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 4
    detectability: 2
    rpn: 16
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        All user-facing text in the Pathway Explorer (mission card titles,
        headline results, table column headers, next-step suggestions) uses
        plain English only. Algorithm names, statistical coefficients, and
        graph-theory terms are prohibited from any element with a CSS
        visibility that makes them visible to non-technical users.
        Technical terms are permitted only inside the collapsed Method
        Explainer section, which requires a deliberate click to open.
      implemented_by: ["DI-LEO-AI-110"]
      verified_by: ["VT-LEO-AI-110"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Column headers in ResultsTable are mapped to plain-English labels
        before rendering. The mapping is maintained in a lookup table in the
        component. Unmapped keys are humanised (underscores to spaces, title
        case) rather than passed through raw.
      implemented_by: ["DI-LEO-AI-110"]
      verified_by: ["VT-LEO-AI-110"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Headline generator (headline_generator.py) is the single source of
        truth for all result text. It produces sentences in plain English
        at a reading age of 9-11 years. The generator is tested to ensure
        no technical terms appear in the main headline output.
      implemented_by: ["DI-LEO-AI-109"]
      verified_by: ["VT-LEO-AI-109"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After controls are in place (plain-English-only user-facing text,
      column header mapping, headline generator as single source of truth),
      the probability of a user encountering algorithm jargon in the main
      workflow is very low. Technical terms remain accessible behind a
      deliberate disclosure pattern for users who need them.

  monitoring:
    monitoring_plan: >
      Include a plain-English compliance check in the UI design review for
      any new mission added to the catalogue. Run automated test
      VT-LEO-AI-110 on each deploy to assert no algorithm names appear
      in rendered mission card or results text.
    metrics:
      - "Count of UI test assertions covering plain-English compliance"
      - "Count of user feedback reports citing confusing terminology"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review -- Pathway Explorer R&D feature"
    identified_date: "2026-04-15"
    status: "analyzed"
    tags:
      - "pathway-explorer"
      - "usability"
      - "health-literacy"
