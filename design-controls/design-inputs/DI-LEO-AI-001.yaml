# -- DI-LEO-AI-001 -- Hybrid Encounter Retrieval
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-001"
  type: "Functional"
  derived_from: ["UN-LEO-AI-001"]
  requirement: "The system SHALL retrieve patient encounters via FHIR R4 API and apply hybrid retrieval (keyword matching, full-text search, and clinical vector embeddings) to shortlist encounters relevant to configured clinical domains"
  rationale: "Hybrid retrieval combines three complementary search strategies to maximise recall while maintaining reasonable precision. Keyword matching catches exact term hits, full-text handles synonyms and partial matches, vector similarity captures semantic relationships via Bio_ClinicalBERT embeddings."

  machine_spec:
    agent_prompt: |
      Implement hybrid encounter retrieval (~250 LOC).

      SINGLE PURPOSE: Retrieve patient encounters from FHIR R4 and rank
      them using three complementary search strategies.

      REQUIREMENTS:
      1. Fetch encounters from FHIR R4 API using httpx async client
      2. Apply keyword matching against programme domain concept sets
      3. Apply full-text search via Neo4j full-text index
      4. Apply vector similarity search using Bio_ClinicalBERT embeddings
      5. Combine scores from all three strategies into a ranked shortlist
      6. Return encounters with composite relevance scores

      METHODS:
      - retrieve_encounters(patient_id): Fetch all encounters from FHIR
      - keyword_match(encounters, domains): Score by exact term hits
      - fulltext_search(encounters, domains): Score by Neo4j full-text
      - vector_search(encounters, domains): Score by embedding similarity
      - rank_and_shortlist(scores): Combine and threshold results

      CODE CLARITY:
      - Each search strategy is a separate, testable function
      - Score combination weights are configurable
      - Logging at each retrieval stage for audit trail

    acceptance_criteria:
      - type: "test"
        spec: "Recall >= 95% against gold-standard shortlisting labels"
      - type: "test"
        spec: "Processing time <= 10 seconds per patient"
      - type: "test"
        spec: "All three search strategies contribute to final ranking"

    constraints:
      - type: "performance"
        spec: "Single patient shortlisting completes in <= 10 seconds"
      - type: "safety"
        spec: "No encounters silently dropped -- all excluded encounters logged with reason"

    dependencies: []

    downstream_impacts:
      - "services/coding_worker -- shortlisted encounters feed coding pipeline"
      - "services/analysis_worker -- shortlisted encounters feed analysis"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j", "httpx", "sentence-transformers"]
      file_structure:
        - "services/api/app/services/neo4j_store.py"
        - "libs/domains/ncda_concept_sets.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Recall >= 95% against gold-standard shortlisting labels"
    test_protocol: "VT-LEO-AI-001"

  safety_class: "B"
  risks: ["R-LEO-AI-002", "R-LEO-AI-018"]
  tags: ["encounter-shortlisting", "hybrid-retrieval", "core-pipeline"]
