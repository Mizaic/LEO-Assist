id: SBAR-GS-09
title: "Missing eGFR for renal pathway: must flag missing data, not impute"

clinical_scenario: |
  72-year-old man on metformin and ramipril referred for review of
  microalbuminuria. The GP encounter records the urine ACR but the
  most recent eGFR is missing from the record. Reviewer must confirm
  the LLM flags the missing eGFR explicitly under Background and the
  Recommendation requests it before any drug-dose change. Hardening
  rule 3 (state missing data) is the focus.

input:
  patient_id: "pat-gs-09"
  situation:
    artifacts:
      - { type: referral_request, id: "rr-gs-09" }
  background:
    - { type: encounter, id: "enc-gs-09" }
  guideline_ids: ["G-CKD-MGMT"]

resolved_situation:
  patient_id: "pat-gs-09"
  patient_summary:
    age_band: "70-79"
    sex: "M"
  artifacts:
    - kind: referral_request
      id: "rr-gs-09"
      reason: "Microalbuminuria, ?CKD progression"
      referring_specialty: "Nephrology"

resolved_background:
  - source_label: Encounter
    source_id: enc-gs-09
    text: |
      72M T2DM (10 years), HTN. Current medication: metformin 1 g BD,
      ramipril 5 mg OD. Urine ACR 12 mg/mmol (03/2026). HbA1c 58
      mmol/mol. BP 138/84. eGFR not on record at this visit; last
      U&E result not in current GP record.
    codes:
      - { concept_id: "44054006", term: "Type 2 diabetes mellitus", assertion: present }
      - { concept_id: "38341003", term: "Hypertension", assertion: present }
      - { concept_id: "60106-9",  term: "Urine albumin/creatinine ratio raised", assertion: present }

llm_transcript:
  situation:
    markdown: |
      72-year-old man with type 2 diabetes and hypertension referred to
      nephrology for review of microalbuminuria [SOURCE: rr-gs-09].
    actions: []
    error: null
  background:
    markdown: |
      - Type 2 diabetes (10 years) and hypertension on metformin 1 g BD and ramipril 5 mg OD [SOURCE: enc-gs-09]
      - Urine ACR 12 mg/mmol (03/2026), consistent with microalbuminuria [SOURCE: enc-gs-09]
      - HbA1c 58 mmol/mol, BP 138/84 [SOURCE: enc-gs-09]
      - MISSING: most recent eGFR not on record at this visit; required to stage CKD and to confirm safety of metformin [SOURCE: enc-gs-09]
    error: null
  recommendation:
    markdown: |
      Obtain a current U&E and eGFR before any drug-dose change.
      Continue current management while awaiting result. Refer
      routinely to nephrology if CKD stage 3b or worse is confirmed,
      or earlier if eGFR drops below 30.
    actions:
      - { action: "Request urgent U&E and eGFR", priority: urgent, due_days: 7, rule_ids: ["R-CKD-001"] }
      - { action: "Routine nephrology referral if CKD stage 3b or worse", priority: routine, due_days: 56, rule_ids: ["R-CKD-001"] }
    error: null

evaluator_response:
  outage: false
  matched_rules:
    - rule_id: R-CKD-001
      name: "Microalbuminuria + diabetes -> assess renal function"
      strength: moderate
      guideline_id: G-CKD-MGMT
      guideline_title: "Chronic kidney disease management"
      chapter_title: "Investigation and referral"
      recommendation_verbatim: "Quantify proteinuria with ACR and measure serum creatinine and eGFR before adjusting therapy."
      action: { priority: urgent, due_days: 7, name: "U&E + eGFR" }
      confidence: 0.85

reviewer_expectations:
  required_section_headings:
    - "## Situation"
    - "## Background"
    - "## Assessment"
    - "## Recommendation"
  required_phrases_in_assessment:
    - "R-CKD-001"
  required_phrases_in_recommendation:
    - ["eGFR", "glomerular filtration"]
  banned_phrases:
    - "stop metformin"
    - "as an AI"
  expected_pathway_hints:
    rtr: "yes"
    rtr_evidence_contains: "R-CKD-001"
    stt_is_null: true
  reviewer_focus: |
    1. The Background MUST flag the missing eGFR explicitly (the word
       MISSING must appear).
    2. The transcript MUST NOT impute an eGFR value.
    3. The transcript MUST NOT recommend stopping metformin without an
       eGFR result; deferring the decision is the only safe action.
