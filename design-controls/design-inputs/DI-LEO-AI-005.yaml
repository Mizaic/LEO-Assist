# -- DI-LEO-AI-005 -- Context Detection (Negation, Assertion)
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-005"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The system SHALL classify the context of each extracted clinical entity as
    patient, family, resolved, plan, negated, or uncertain using MedSpaCy
    ConText and custom UK primary care context detection rules. The "discussed"
    ConText rule SHALL NOT be used because discussion of a condition in UK GP
    notes indicates active management, not historical status. The "dna" rule
    SHALL be scoped to standalone usage only to avoid false positives on
    "DNA test". Overlapping entities SHALL be processed in multiple ConText
    passes rather than dropped. Situation normalisation SHALL use specific
    patterns (e.g. "planned procedure", "awaiting biopsy") rather than blanket
    "planned" or "awaiting" catch-alls.
  rationale: >
    Context is essential for correct clinical interpretation. 'No chest pain'
    and 'chest pain' have opposite meanings. Negation detection prevents false
    positive coding. Context classification (patient vs family, current vs
    resolved) prevents incorrect pathway classification. The "discussed" rule
    was removed because "Discussed diabetes control" in UK GP notes means
    diabetes is actively managed, not historical.

  machine_spec:
    agent_prompt: |
      Implement context detection module (~150 LOC).

      SINGLE PURPOSE: Classify the clinical context of extracted entities
      using negspaCy and custom rules for negation, assertion, and scope.

      REQUIREMENTS:
      1. Integrate negspaCy for negation detection
      2. Classify entity context: patient, family, resolved, plan,
         negated, uncertain
      3. Apply custom context rules for domain-specific patterns
      4. Attach context labels to each entity record
      5. Support configurable context patterns per programme

      METHODS:
      - detect_context(entity, doc): Classify entity context
      - is_negated(entity, doc): Check negation status
      - classify_assertion(entity, doc): Determine assertion type
      - classify_experiencer(entity, doc): Patient vs family vs other

      CODE CLARITY:
      - Context rules are data-driven, not hard-coded
      - Each context dimension is independently testable
      - Clear mapping from context label to clinical meaning

    acceptance_criteria:
      - type: "test"
        spec: "Context classification accuracy >= 90% against gold-standard labels"
      - type: "test"
        spec: "Negation detection sensitivity >= 95% for negated entities"
      - type: "test"
        spec: "All entities annotated with context labels before downstream use"

    constraints:
      - type: "safety"
        spec: "Negated entities never treated as affirmed in downstream processing"
      - type: "code_quality"
        spec: "Context rules are configurable, not hard-coded in pipeline"

    dependencies: []

    downstream_impacts:
      - "DI-LEO-AI-004 -- context labels inform terminology resolution ranking"
      - "libs/pipeline/post_processing.py -- context detection is Layer 7 in the unified post-processing stack, applied identically to training and runtime pipelines (DI-LEO-AI-050)"
      - "services/coding_worker -- pipeline uses context to filter entities"

    technical_details:
      language: "Python"
      framework: "None"
      libraries: ["negspacy", "medspacy"]
      file_structure:
        - "libs/pipeline/post_processing.py"
        - "libs/ner/context_engine.py"
        - "libs/ner/context_detector.py"
      estimated_loc: 150

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Context classification accuracy >= 90% against gold-standard labels"
    test_protocol: "VT-LEO-AI-005"

  safety_class: "B"
  risks: ["R-LEO-AI-003"]
  tags: ["nlp", "negation", "context", "assertion"]
