# -- VT-LEO-AI-086 -- Per-episode specialist visit claiming
# IEC 62304 Verification Test

- id: "VT-LEO-AI-086"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-086"]
    risks: ["R-LEO-AI-060"]

  metadata:
    title: "Per-episode specialist visit claiming algorithm"
    description: >
      Verifies that specialist visit anchors are claimed per-episode with
      temporal constraints, preventing historic visits from contaminating
      later same-site episodes. The core safety property is that
      specialist_visit_date is always >= referral_date on every episode.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_episode_builder.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-086-TC-001"
      case_name: "No visits returns empty claims"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _claim_specialists_for_episodes with empty visits list and one episode spec"
          expected_result: "Returned dict has specialist_seen=False for the episode"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is False"

    - case_id: "VT-086-TC-002"
      case_name: "Matching visit is claimed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide one breast episode spec (ref 2024-01-01) and one breast clinic visit (2024-03-15)"
          expected_result: "Episode claims the visit; specialist_seen=True; specialist_visit_date='2024-03-15'"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is True"
        - "claims[ep_id].specialist_visit_date == '2024-03-15'"

    - case_id: "VT-086-TC-003"
      case_name: "Visit before referral is not claimed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide one breast episode spec (ref 2024-06-01) and one breast clinic visit dated 2024-01-15 (before referral)"
          expected_result: "Episode gets specialist_seen=False"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is False"

    - case_id: "VT-086-TC-004"
      case_name: "No cross-contamination between same-site episodes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Create breast 2024 episode (ref 2024-01-01, window 2024-12-31) and breast 2025 episode (ref 2025-01-01, window 2025-12-31)"
          expected_result: "One breast clinic visit dated 2024-05-10 is claimed only by the 2024 episode"
        - step_number: 2
          action: "Check 2025 episode"
          expected_result: "specialist_seen=False"
          verification_method: "automated"
      acceptance_criteria:
        - "claims['ep_2024'].specialist_seen is True"
        - "claims['ep_2024'].specialist_visit_date == '2024-05-10'"
        - "claims['ep_2025'].specialist_seen is False"

    - case_id: "VT-086-TC-005"
      case_name: "Each same-site episode claims its own visit"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Two breast episodes (2024, 2025) with two breast clinic visits (2024-05-10 and 2025-06-20)"
          expected_result: "2024 episode claims 2024 visit; 2025 episode claims 2025 visit"
          verification_method: "automated"
      acceptance_criteria:
        - "claims['ep_2024'].specialist_visit_date == '2024-05-10'"
        - "claims['ep_2025'].specialist_visit_date == '2025-06-20'"

    - case_id: "VT-086-TC-006"
      case_name: "Earliest unclaimed visit wins within window"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "One skin episode and two skin clinic visits (2024-09-01 and 2024-04-01) both within window"
          expected_result: "Episode claims the earlier visit (2024-04-01)"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_visit_date == '2024-04-01'"

    - case_id: "VT-086-TC-007"
      case_name: "Unknown site visit matches by temporal proximity"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Lung episode with a visit whose concept name yields 'unknown' but date is within window"
          expected_result: "Visit is claimed by the episode"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is True"

    - case_id: "VT-086-TC-008"
      case_name: "Different site visit not claimed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Breast episode; skin clinic visit within date window"
          expected_result: "Visit not claimed; specialist_seen=False"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is False"

    - case_id: "VT-086-TC-009"
      case_name: "Visit after window_end not claimed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Breast episode with window_end=2024-06-30; breast clinic visit dated 2024-09-01"
          expected_result: "Visit not claimed"
          verification_method: "automated"
      acceptance_criteria:
        - "claims[ep_id].specialist_seen is False"

    - case_id: "VT-086-TC-010"
      case_name: "Live data: zero date inversions after rebuild"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Delete all EpisodeOfCare nodes; run episode rebuild for cancer_audit domain"
          expected_result: "No EpisodeOfCare has specialist_visit_date < referral_date"
          verification_method: "automated"
      acceptance_criteria:
        - "COUNT of EpisodeOfCare WHERE specialist_visit_date < referral_date = 0"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-086/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-086-RUN-001"
      date: "2026-04-07"
      executor: "automated CI (pytest)"
      environment: "development"
      result: "pass"
      notes: >
        51/51 tests passed including all 10 TestClaimSpecialistsForEpisodes cases.
        Live rebuild confirmed: 43 stale_post_specialist (down from 51),
        0 episodes with specialist_visit_date < referral_date (down from 8).
      test_cases_run: 10
      test_cases_passed: 10
      test_cases_failed: 0
