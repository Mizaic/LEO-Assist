id: SBAR-GS-18
title: "Adversarial: visible haematuria WITH active UTI age 36 - NOT 2WW"

# Adversarial twin of fixture-11. Under NICE NG12, visible haematuria
# only triggers a 2WW bladder referral if the patient is aged 45 or
# over AND there is no UTI cause. This patient is 36 and has culture-
# proven UTI, so neither of the NG12 thresholds is met. The expected
# outcome is "no rule fired" -- treat the UTI, then re-test the urine,
# and refer routinely (or 2WW if haematuria persists after treatment).
# This fixture exists so the model is rewarded for NOT escalating
# every red-flag word.

clinical_scenario: |
  36-year-old female presents to GP with 4 days of dysuria, frequency,
  cloudy urine, and one episode of visible haematuria. Urine
  dipstick: blood ++, leucocytes +++, nitrites positive. MSU sent;
  culture confirms E. coli >10^5 CFU/mL, sensitive to nitrofurantoin.
  No flank pain, no fever, no recent catheter, no anticoagulants. No
  prior UTIs. Reviewer must confirm the SBAR does NOT route to a 2WW
  bladder pathway, that the UTI is treated first, and that a clear
  safety-net is in place to re-check post-treatment.

