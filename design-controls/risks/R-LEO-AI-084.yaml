# -- R-LEO-AI-084 -- False Same-Day Referral-to-Diagnosis
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-084"
  title: "Diagnosis-encounter text is misclassified as a fresh referral, producing a false same-day referral-to-diagnosis interval"

  hazard:
    description: >
      When a diagnosis encounter's free-text contains fast-track or 2WW
      language describing the referral that preceded the appointment,
      the text-referral classifier emits a referral anchor on the
      diagnosis date. The episode builder's _find_best_referral then
      selects this near-zero-gap referral as the episode's referral
      trigger and overshadows the earlier authoritative PRISM or
      clinic-note referral.
    category: "clinical_safety"

  hazardous_situation: >
    A quality-improvement lead reviews the Diagnostic Interval dashboard
    and sees a cohort of episodes with near-zero referral-to-diagnosis
    intervals. They either (a) conclude pathway performance is
    artificially excellent and miss a genuine delay upstream, or
    (b) lose confidence in the analytics and revert to manual review.

  harm:
    description: >
      Misinformed quality-improvement action; inflated conversion-rate
      metrics; loss of trust in the LEO analytics layer.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        _find_best_referral enforces a minimum referral-to-diagnosis gap
        of MIN_REFERRAL_TO_DIAG_DAYS (default 3 days), so same-day and
        next-day referral candidates are skipped in favour of an earlier
        valid match.
      implemented_by: ["DI-LEO-AI-124"]
      verified_by: ["VT-LEO-AI-119"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        PRISM referrals are emitted as a distinct higher-confidence
        anchor subtype and dedupe rules prefer them over generic
        text-referral anchors on the same encounter, preserving the
        authoritative trigger.
      implemented_by: ["DI-LEO-AI-124"]
      verified_by: ["VT-LEO-AI-119"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Residual risk is acceptable because the gap control prevents the
      dominant failure mode; the remaining risk is that a legitimate
      same-day one-stop-shop clinic (where referral and diagnosis truly
      fall on the same day) loses its referral evidence. Monitoring
      (R-084 metrics) tracks the fraction of episodes where no referral
      was found so this tail case is visible.

  monitoring:
    monitoring_plan: >
      Weekly: count episodes where diagnosis is present but no referral
      anchor was selected, split by cancer_type. Spike alert when the
      rate exceeds 2%. Monthly: manual review of 10 random affected
      cases to confirm the guard is not over-correcting.
    metrics:
      - "Fraction of diagnosis-led episodes with no referral anchor"
      - "Median referral-to-diagnosis interval by cancer_type (should rise from the pre-fix artificially compressed value)"
    review_frequency: "Weekly for first 4 weeks, Monthly thereafter"

  metadata:
    identified_by: "NCDA ground-truth review 2026-04-15 - patients 4200797127, 4245139757, 4469113522, 6040304227, 6507904570"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "episode"
      - "referral"
      - "temporal-integrity"
      - "prism"
