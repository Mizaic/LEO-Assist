# -- DO-LEO-AI-205 -- candidate_ai_first_pass service implementation
# ISO 13485 / IEC 62304 Design Output
#
# NOTE on numbering: replaces a now-clobbered DO-LEO-AI-199 used briefly
# during development; that ID went to the patient 4643293950
# attestation-guard implementation that shipped in parallel.

- id: "DO-LEO-AI-205"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-208"
    user_needs:
      - "UN-LEO-AI-085"
    risks_addressed:
      - "R-LEO-AI-197"
    verification_tests:
      - "VT-LEO-AI-200"

  specification:
    title: "candidate_ai_first_pass service: extractor + smart coder + verdict + writeback"
    description: |
      Python package implementing the AI first-pass workflow over
      non-completed TrainingCandidates. Composed of seven modules:

        - _types.py       AIFirstPassParams, ExtractedEntity,
                          ExtractionResult, CodingOutcome,
                          CandidateOutcome dataclasses + verdict /
                          action enums.
        - _gold_pool.py   Loads status='completed' candidates via
                          READ_GOLD_POOL_FOR_FEW_SHOT, builds and
                          process-cache-warms a FewShotSelector
                          (BioClinicalBERT cosine similarity).
        - _extractor.py   ai_extract_entities: Haiku
                          (call_haiku_extraction tier='small')
                          seeded with EXTRACTION_SYSTEM_V1 + k=5
                          nearest-neighbour gold exemplars + the
                          candidate text and original entities_json
                          hint; falls back to original entities on any
                          LLM, parse, or zero-entity failure.
        - _coder.py       ai_code_entity: validate_proposal first,
                          escalate_coding_from_candidates retry loop
                          with Haiku alternative-search-term up to
                          coder_max_retries.
        - _verdict.py     classify_candidate: pre_done / delete /
                          review ladder with four safety rails
                          (status='completed', zero entities,
                          _AUTO_CODE_BLOCKED assertion,
                          manual_gold_seed source).
        - _writeback.py   writeback_pre_done (write-once
                          entities_json_original via
                          UPSERT_AI_FIRST_PASS_ENTITIES) and
                          execute_delete (TOCTOU re-check then
                          DELETE_TRAINING_CANDIDATE_AND_ARTIFACTS).
        - __init__.py     process_one orchestrator + fetch_candidates
                          + summarise.

    acceptance_criteria:
      - criterion: "extractor_fallback_on_llm_failure"
        type: "functional"
        measurement: "Test"
        target: "ai_extract_entities returns fallback_used=True with original entities when call_llm raises"
      - criterion: "coder_haiku_retry_loop"
        type: "functional"
        measurement: "Test"
        target: "ai_code_entity returns 'accepted' after one ask_haiku retry with a viable alt_query"
      - criterion: "verdict_safety_rails"
        type: "safety"
        measurement: "Test"
        target: "classify_candidate forces 'review' for _AUTO_CODE_BLOCKED, manual_gold_seed source, zero entities, and live status='completed'"
      - criterion: "writeback_write_once"
        type: "safety"
        measurement: "Test"
        target: "Second writeback_pre_done call MUST NOT re-overwrite entities_json_original"
      - criterion: "writeback_toctou_refusal"
        type: "safety"
        measurement: "Test"
        target: "Both writeback_pre_done and execute_delete MUST refuse when re-fetched status='completed'"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_types.py"
        description: "AIFirstPassParams, AIFirstPassVerdict, AIFirstPassAction, ExtractedEntity, ExtractionResult, CodingOutcome, CandidateOutcome"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_gold_pool.py"
        description: "load_gold_pool_rows + get_few_shot_selector (process-cached FewShotSelector)"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_extractor.py"
        description: "ai_extract_entities + _parse_haiku_entities + _to_extracted + fallback"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_coder.py"
        description: "ai_code_entity + _ask_haiku_for_alt_query + _validation_to_outcome"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_verdict.py"
        description: "classify_candidate + _outcome ladder + safety rails"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/_writeback.py"
        description: "writeback_pre_done + execute_delete + TOCTOU re-check"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_ai_first_pass/__init__.py"
        description: "process_one orchestrator + fetch_candidates + summarise"
      - artifact_type: "source_code"
        location: "libs/cypher/training_candidate_queries.py"
        description: "UPSERT_AI_FIRST_PASS_ENTITIES + READ_GOLD_POOL_FOR_FEW_SHOT + GET_TRAINING_CANDIDATE_BY_ID extension"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 900
      key_functions:
        - "ai_extract_entities"
        - "ai_code_entity"
        - "classify_candidate"
        - "writeback_pre_done"
        - "execute_delete"
        - "process_one"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Excludes status='completed' from fetch query and TOCTOU-rechecks before any write or delete"
      - "Write-once entities_json_original audit copy preserves the human-curated baseline"
      - "_AUTO_CODE_BLOCKED assertion forces 'review' verdict regardless of coder accept count"
      - "manual_gold_seed source forces 'review' verdict so seeded candidates are never deleted"
    risk_control_measures:
      - "Three-layer gold defence (fetch query exclusion, TOCTOU re-check, verdict assertion)"
      - "Haiku call failure falls back to original entities rather than emitting empty extraction"
      - "Coder retry cap prevents unbounded LLM spend per entity"

  verification_status:
    verification_method: "Test"
    verification_complete: true
