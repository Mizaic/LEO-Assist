# -- DO-LEO-AI-151 -- cancer_site_terms module + episode-builder integration
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-151"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-155"]
    user_needs: ["UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-107"]
    verification_tests: ["VT-LEO-AI-153"]

  specification:
    title: "Gold-mined cancer-site dictionary and integration into the text-path episode builder"
    description: |
      Adds two pieces:

      1. cancer_site_terms.py: an auto-generated module that maps each
         canonical NCDA cancer-site key (breast, prostate, lung, ...)
         to a deduplicated list of lower-case literal surface forms.
         The module exposes match_cancer_site(text) which returns the
         (site_key, hit_count) tuple for the highest-scoring site, or
         None when nothing matches.

      2. anchor_detector.py + _site_resolution.py changes that:
         - call match_cancer_site() on the encounter text inside
           _classify_text_encounters when assembling each text-built
           anchor, and
         - prefer an explicit anchor['site_key'] over the generic
           "Text: ..." concept_name in
           _extract_condition_key_from_anchor.

      The dictionary is regenerated by scripts/_mine_cancer_site_terms.py
      directly from GoldLabel.entities_json and SurfaceForm-MAPS_TO-Concept
      pairs. Each surface form must (a) belong to a malignancy concept and
      (b) itself contain a literal anatomy/histology stem -- this filters
      noise such as "cramps" or "amy was not elevated" whose parent SNOMED
      concept happens to mention an organ.

    acceptance_criteria:
      - criterion: "Coverage on live corpus"
        type: "performance"
        measurement: "Test"
        target: ">=70% of existing EpisodeOfCare nodes get a specific cancer_type after rebuild"
      - criterion: "Canonical key contract"
        type: "functional"
        measurement: "Inspection"
        target: "Every key emitted by match_cancer_site is present in episode_builder/_site_resolution.py _SITE_MAP"
      - criterion: "Deterministic top-pick"
        type: "functional"
        measurement: "Test"
        target: "match_cancer_site returns the site with the highest hit count; ties resolve to first inserted key"
      - criterion: "Noise filter"
        type: "safety"
        measurement: "Test"
        target: "Generic findings whose surface form lacks anatomy stem are NOT included (e.g. 'cramps' must not map to stomach)"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/cancer_site_terms.py"
        description: "Auto-generated CANCER_SITE_TERMS dict + match_cancer_site() helper"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_classify_text_encounters tags each text anchor with site_key"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_site_resolution.py"
        description: "_extract_condition_key_from_anchor prefers anchor['site_key']"
      - artifact_type: "tooling"
        location: "scripts/_mine_cancer_site_terms.py"
        description: "Regenerator -- pulls from KnowledgeGraphClient, applies anatomy-stem filter, writes the dictionary module"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 280
      key_functions:
        - "match_cancer_site"
        - "_classify_text_encounters"
        - "_extract_condition_key_from_anchor"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "EpisodeOfCare.cancer_type drives the NCDA report categories used by clinical reviewers"
      - "Site classification gates which patients show up in each pathway-specific cohort"
    risk_control_measures:
      - "Surface forms drawn ONLY from reviewer-confirmed gold labels and curated SurfaceForms"
      - "Anatomy-stem filter on the surface form itself (not just the parent concept)"
      - "When two sites tie, the first specific subtype wins -- pathway-level keys are last in the list"
      - "Hit count returned for downstream confidence scoring / hitl flag"

  verification_status:
    verification_method: "Test"
    verification_complete: false
