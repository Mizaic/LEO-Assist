# -- DI-LEO-AI-223 -- /care surfaces consume the shared dialog with dual save
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-223"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-088"
  requirement: >
    The /care/patients encounter card and the /care/encounters
    search-results preview SHALL replace their bespoke editors with
    the shared `GoldLabelEditorDialog` mounted in `saveMode='dual'`.
    Each surface SHALL seed the dialog via
    `createGoldLabelFromEncounter` (DI-LEO-AI-220) and persist via
    `useDualSaveAdapter` -> `syncCodedLinksFromGold`
    (DI-LEO-AI-221). On /care/encounters the search match-rationale
    chips SHALL be passed into the dialog via the `headerChrome`
    slot. The legacy full-page editor routes
    (`/patients/{id}/encounters/{eid}` and
    `/patients/{id}/encounters/view/{eid}`) and the
    `EncounterCodedView` component SHALL be retired with redirects
    to `/care/patients?...` so existing bookmarks still work.
  rationale: >
    Replacing the bespoke editors with the shared dialog is the
    UI-side payoff of UN-LEO-AI-088: corrections made anywhere in
    /care now flow into the model, the dialog has one set of
    keyboard shortcuts and validation rules, and we delete a
    full-page route's worth of code that we no longer need to
    maintain.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          The /care/patients encounter card "Edit codes" control
          MUST mount `GoldLabelEditorDialog` inline with
          `saveMode='dual'`, `entitySaver` from
          `useDualSaveAdapter`, and an `onAfterSave` that triggers
          a refresh of the encounter's coded links.
      - type: "functional"
        spec: >
          The /care/encounters preview wrapper
          (`EncounterPreviewDialog`) MUST seed the dialog via
          `createGoldLabelFromEncounter`, mount the shared dialog
          with `saveMode='dual'`, and pass the search match
          rationale (date, match type, rationale chips) into the
          dialog's `headerChrome`
          (`data-testid="encounter-preview-rationale"`).
      - type: "functional"
        spec: >
          Both surfaces MUST surface optimistic-concurrency errors
          (HTTP 409) and gold-mirror failures (HTTP 502) as
          human-readable banners; the saved entity set MUST NOT be
          discarded on error so the reviewer can retry.
      - type: "functional"
        spec: >
          The legacy routes
          `services/ui/src/app/patients/[patientId]/encounters/[encounterId]/page.tsx`
          and
          `services/ui/src/app/patients/[patientId]/encounters/view/[encounterId]/page.tsx`
          MUST be replaced with `redirect()` calls that point to
          `/care/patients?patient=...&tab=encounters&encounter=...`.
      - type: "functional"
        spec: >
          The `EncounterCodedView` component MUST be deleted (no
          new code paths point to it).
    constraints:
      - type: "safety"
        spec: >
          The `EncounterPreviewDialog` MUST NOT prefetch coded
          links itself; the seed endpoint already returns the
          re-anchored entities and the baseline_concept_ids.
      - type: "safety"
        spec: >
          The dialog's `headerChrome` MUST be read-only context;
          interacting with rationale chips MUST NOT alter the
          editor state.
    dependencies:
      - "DI-LEO-AI-219"
      - "DI-LEO-AI-220"
      - "DI-LEO-AI-221"
    downstream_impacts:
      - "EncounterCodedView component is removed"
      - "Two legacy routes return redirects instead of rendering"
      - "fetchEncounterCodedLinks is no longer called from EncounterMissionControl"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16"
      file_structure:
        - "services/ui/src/components/mission-control/EncounterCard.tsx"
        - "services/ui/src/components/mission-control/EncounterTextTab.tsx"
        - "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
        - "services/ui/src/components/mission-control/EncounterPreviewDialog.tsx"
        - "services/ui/src/app/patients/[patientId]/encounters/[encounterId]/page.tsx"
        - "services/ui/src/app/patients/[patientId]/encounters/view/[encounterId]/page.tsx"
      estimated_loc: 280

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-214 verifies the wrapper imports, the seed call
      shape, the saveMode='dual' mount, the headerChrome
      contract, and that EncounterMissionControl no longer
      prefetches coded links.
    test_protocol: "VT-LEO-AI-214"

  safety_class: "B"
  risks:
    - "R-LEO-AI-206"
    - "R-LEO-AI-207"
  tags:
    - "ui"
    - "live-encounters"
    - "training-data"
    - "deletion"
