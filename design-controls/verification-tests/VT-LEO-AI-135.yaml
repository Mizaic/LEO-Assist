- id: "VT-LEO-AI-135"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-139"]
    risks: ["R-LEO-AI-094"]

  metadata:
    title: "Role-first area intro copy + feature flag default"
    description: >
      Verifies the centralised AREA_INTRO_COPY map, the migration of
      every target landing page onto AreaIntro, and the shipped
      default value for NEXT_PUBLIC_ROLE_FIRST.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/area-copy-readability.test.ts"
      - "services/ui/src/__tests__/area-intro-wiring.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-135-TC-001"
      case_name: "AREA_INTRO_COPY covers all nine areas"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Enumerate AREA_INTRO_COPY keys"
          expected_result: >
            Keys equal ['care-overview', 'operations', 'pathway-explorer',
            'platform', 'users', 'portal', 'support', 'settings',
            'work'] and every default block has title, lede, how,
            and what populated.
      verification_method: "automated"
      acceptance_criteria:
        - "Jest assertions pass in area-copy-readability.test.ts"

    - case_id: "VT-135-TC-002"
      case_name: "Role coverage per area"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Check role-specific blocks"
          expected_result: >
            Clinical areas (care-overview, pathway-explorer, portal)
            include a clinician block; admin areas (operations,
            platform, users, portal) include a platform_admin or
            staff block.
      verification_method: "automated"
      acceptance_criteria:
        - "TC-002 assertions pass in area-copy-readability.test.ts"

    - case_id: "VT-135-TC-003"
      case_name: "Default blocks grade <=9 on Flesch-Kincaid"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Compute readingAgeGrade for the default text of every area"
          expected_result: "Grade <= 9 for every area"
      verification_method: "automated"
      acceptance_criteria:
        - "TC-003 assertion passes in area-copy-readability.test.ts"

    - case_id: "VT-135-TC-004"
      case_name: "Every target page mounts AreaIntro"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Scan each target page (care/dashboard, admin/console,
            admin/pathway-explorer, admin/platform, admin/users,
            admin/portal, admin/support, settings, work) for an
            AreaIntro mount.
          expected_result: >
            Every target page source contains an <AreaIntro area=...>
            invocation referencing the correct AreaKey.
      verification_method: "automated"
      acceptance_criteria:
        - "area-intro-wiring.test.ts passes"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-135/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-135-2026-04-17-001"
      executed_at: "2026-04-17T00:00:00Z"
      executor: "rob.smith@mizaic.ai"
      environment: "local-dev"
      result: "pass"
      jest_summary: "pass -- area-copy-readability.test.ts, area-intro-wiring.test.ts"
      notes: >
        Source-level assertions for TC-001..TC-004. Readability test
        uses @leo/design-system fleschKincaidGrade to pin grade <=9.
        TC-005 for the rollout flag default was removed in Phase 6
        because the feature flag itself was deleted (see VT-136).
