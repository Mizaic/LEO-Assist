  specification:
    title: "Terminology API Service"
    description: |
      Provides REST endpoints for SNOMED CT and dm+d terminology operations
      including free-text search, concept resolution, value set expansion,
      concept map translation, and clinician-initiated writeback of coding
      corrections. The service reads from the terminology Neo4j instance and
      writes corrections back through a controlled writeback pipeline that
      records provenance and triggers re-evaluation of affected records.
    purpose: "Terminology search, resolution, value set management, and writeback for clinical coding workflows"
    technical_approach: |
      Each operation has a dedicated router. Search and resolve hit the
      terminology Neo4j instance using parameterised Cypher with full-text
      index support. Value set expansion uses pre-computed refsets stored as
      graph relationships. Concept map translation follows FHIR ConceptMap
      semantics. The writeback router accepts correction payloads, validates
      them against allowed value sets, persists the change with an audit
      trail, and publishes a re-evaluation message to the service bus.
    acceptance_criteria:
      - criterion: "Free-text search returns relevant SNOMED concepts ranked by relevance"
        type: "functional"
        measurement: "Precision at k=10 measured against gold-standard query set"
        target: ">=0.80 precision@10"
      - criterion: "Concept resolution returns the correct preferred term and hierarchy"
        type: "functional"
        measurement: "Unit tests with known SNOMED concept IDs"
        target: "100% correct for valid concept IDs"
      - criterion: "Writeback records provenance and triggers downstream re-evaluation"
        type: "functional"
        measurement: "Integration test verifies audit record creation and service bus message"
        target: "Every writeback produces an audit entry and a re-evaluation message"
      - criterion: "Value set expansion completes within acceptable time"
        type: "performance"
        measurement: "Expand a value set with 500+ concepts under load"
        target: "<1s p95"
      - criterion: "Only authorised users can perform writeback"
        type: "security"
        measurement: "Attempt writeback without clinician role; verify 403 response"
        target: "All unauthorised writeback attempts rejected"

