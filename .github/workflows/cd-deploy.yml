name: CD - Deploy

on:
  workflow_run:
    workflows: ["CI - Build and Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, val, prod]
      image_tag:
        description: Image tag to deploy (default = sha of HEAD)
        required: false

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: leoaicr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment: dev
    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'dev')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-${{ github.event.workflow_run.head_sha || github.sha }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Applies infra/bicep/main.bicep: Container App env vars (internal URLs, secrets refs,
      # FRONTEND_URL, etc.). Image tags below only update container images.
      - name: Deploy Bicep stack
        run: |
          az deployment group create \
            --resource-group leo-ai-dev \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/dev.bicepparam \
            --parameters imageTag=${{ steps.tag.outputs.tag }} \
            --name "cd-dev-${{ github.run_number }}"

      - name: Update Container App image tags
        run: |
          # Must match images built in ci-build.yml and apps in infra/bicep/modules/container-apps.bicep
          # Parity with scripts/start_leo-ai-core.ps1 (-Services names: api, terminology_api, ...)
          SERVICES="core-api terminology-api fhir-api analytics-api model-inference training-worker pipeline-worker ui"
          TAG=${{ steps.tag.outputs.tag }}
          for SERVICE in $SERVICES; do
            az containerapp update \
              --name $SERVICE \
              --resource-group leo-ai-dev \
              --image ${{ env.ACR_LOGIN_SERVER }}/$SERVICE:$TAG \
              --output none
          done

  deploy-dev-ui:
    name: Deploy ui to dev
    runs-on: ubuntu-latest
    environment: dev
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update UI image tag
        run: |
          TAG="sha-${{ github.event.workflow_run.head_sha }}"
          az containerapp update \
            --name ui \
            --resource-group leo-ai-dev \
            --image ${{ env.ACR_LOGIN_SERVER }}/ui:$TAG \
            --output none

  deploy-val:
    name: Deploy to validation
    runs-on: ubuntu-latest
    environment: validation
    needs: deploy-dev
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'val'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Full stack Bicep (env vars + ingress). Prod path is the same pattern.
      - name: Deploy to validation
        run: |
          TAG="${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}"
          az deployment group create \
            --resource-group leo-ai-val \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/val.bicepparam \
            --parameters imageTag=$TAG \
            --name "cd-val-${{ github.run_number }}"

  deploy-prod:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    needs: deploy-val
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Full stack Bicep (env vars + ingress).
      - name: Deploy to production
        run: |
          TAG="${{ github.event.inputs.image_tag || format('sha-{0}', github.sha) }}"
          az deployment group create \
            --resource-group leo-ai-prod \
            --template-file infra/bicep/main.bicep \
            --parameters infra/bicep/parameters/prod.bicepparam \
            --parameters imageTag=$TAG \
            --name "cd-prod-${{ github.run_number }}"
