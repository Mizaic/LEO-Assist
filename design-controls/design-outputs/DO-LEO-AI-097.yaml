# -- DO-LEO-AI-097 -- Encounter Mission Control and Batch Recode Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-097"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-099"]
    user_needs: ["UN-LEO-AI-058", "UN-LEO-AI-056"]
    risks_addressed: ["R-LEO-AI-063", "R-LEO-AI-065"]
    verification_tests: ["VT-LEO-AI-099"]

  specification:
    title: "Encounter-centric Mission Control and Batch Reset/Recode"
    description: |
      Implements the encounter-first Mission Control route, org-wide hybrid
      retrieval endpoints, and batch remediation endpoint.
      - UI route /care/encounters replaces /care/pathways behavior.
      - Analytics API provides /mission-control/encounters and /kpis.
      - Search supports optional near-duplicate suppression for very similar encounter text.
      - Core API provides /patients/encounters/batch-reset-and-recode.
      - Queue payloads use pd-gp-encounter-coding with mode extract_encounter.
      - trigger_analysis defaults false, with explicit opt-in.
      - UI supports queueing all matching search results by paging and submitting chunked batches.
    acceptance_criteria:
      - criterion: "Encounter list endpoint"
        type: "functional"
        measurement: "Test"
        target: "Returns org-scoped rows with paging and deterministic ordering"
      - criterion: "Hybrid search endpoint"
        type: "functional"
        measurement: "Test"
        target: "Merges fulltext and vector legs with fallback when one leg is unavailable, and applies optional near-duplicate suppression"
      - criterion: "Batch queue payload"
        type: "safety"
        measurement: "Test"
        target: "Queued messages include plan_definition_id, mode, and trigger_analysis with default false"
      - criterion: "UI shortlist + progress"
        type: "usability"
        measurement: "Test"
        target: "Users can select encounters or submit all results, trigger chunked batch reset+recode, and observe per-encounter statuses"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/mission_control_encounters.py"
        description: "Encounter list, KPI, and hybrid search APIs"
      - artifact_type: "source_code"
        location: "services/api/app/routers/patients.py"
        description: "Batch reset-and-recode endpoint and queue payload helper"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
        description: "Encounter-centric Mission Control page with shortlist and progress"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/missionControlApi.ts"
        description: "Encounter and batch API client methods"
    storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 420
      key_functions:
        - "get_mission_control_encounters"
        - "get_mission_control_encounter_kpis"
        - "batch_reset_and_recode_encounters"
        - "EncounterMissionControl"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Scope-gated batch mutation and queue dispatch"
      - "Default trigger_analysis false for encounter-level remediation"
    risk_control_measures:
      - "Per-patient scope checks before each reset"
      - "Explicit trigger_analysis toggle in request model"
      - "Failure reporting for partial batch execution"

  verification_status:
    verification_method: "Test"
    verification_complete: false
