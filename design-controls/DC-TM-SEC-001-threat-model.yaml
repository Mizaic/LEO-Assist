# =============================================================================
# DC-TM-SEC-001 — Security Threat Model
# Primary Care Clinical Pathway Audit Platform
# =============================================================================
#
# Document ID:    DC-TM-SEC-001
# Version:        1.0.0
# Status:         Draft
# Date:           2026-03-01
# Standard:       IEC 81001-5-1:2021, ISO 14971:2019 (via AAMI TIR57)
# Classification: QMS — Design Controls
#
# Regulatory scope:
#   - UK Medical Devices Regulations 2002 (as amended) — UKCA Class I
#   - ISO 13485:2016 — Quality Management System
#   - IEC 62304:2006/AMD1:2015 — Software Lifecycle Processes
#   - IEC 81001-5-1:2021 — Health Software Security Lifecycle
#   - ISO 14971:2019 — Risk Management
#   - UK GDPR / Data Protection Act 2018 — Article 9 special category data
#   - NHS Data Security and Protection Toolkit (DSPT)
#   - NCSC Secure by Design Principles
#   - NCSC Cyber Assessment Framework (CAF)
#
# System classification:
#   IEC 62304 Software Safety Class: B (per DC-SC-001)
#   Data classification: Clinical (special category), PII, Operational
#   Deployment: Cloud-hosted SaaS, multi-tenant NHS trust access
#
# Cross-references:
#   - DC-SC-001  Software Safety Classification
#   - DC-RM-001  Risk Management
#   - DC-SOUP-001 SOUP List
# =============================================================================

system_context:
  product: "Primary Care Clinical Pathway Audit Platform"
  iec_62304_class: "B"
  data_classifications:
    - "Clinical (UK GDPR Article 9 special category)"
    - "PII (NHS patient records)"
    - "Operational (system configuration, model artifacts)"
  deployment: "Cloud-hosted SaaS — Neo4j Aura, Azure Cache for Redis, Azure Service Bus, AWS Bedrock, Azure OpenAI"
  services:
    - {name: "core-api", port: 8000, exposure: "public", framework: "FastAPI 0.115+"}
    - {name: "terminology-api", port: 8001, exposure: "internal", framework: "FastAPI"}
    - {name: "fhir-api", port: 8002, exposure: "internal", framework: "FastAPI"}
    - {name: "analytics-api", port: 8003, exposure: "internal", framework: "FastAPI"}
    - {name: "model-inference", port: 8004, exposure: "internal", framework: "FastAPI"}
    - {name: "training-worker", port: 8005, exposure: "internal", framework: "FastAPI"}
    - {name: "coding-worker", port: null, exposure: "internal", framework: "async message consumer"}
    - {name: "analysis-worker", port: null, exposure: "internal", framework: "async message consumer"}
    - {name: "ui", port: 3000, exposure: "public", framework: "Next.js 16"}
  data_stores:
    - {name: "Neo4j Patient Graph", type: "graph database", data: "Patient, Encounter, clinical text, review tasks"}
    - {name: "Neo4j Knowledge Graph", type: "graph database", data: "SNOMED terminology, FHIR resources, SurfaceForm mappings"}
    - {name: "Redis", type: "key-value", data: "OAuth sessions, pipeline progress, LLM cache, checkpoints"}
  external_services:
    - {name: "Azure AD v2.0", purpose: "OAuth authentication"}
    - {name: "AWS Bedrock", purpose: "Primary LLM (Claude)", data_sent: "de-identified clinical text"}
    - {name: "Azure OpenAI", purpose: "Fallback LLM (GPT-4o)", data_sent: "de-identified clinical text"}
    - {name: "Azure Blob Storage", purpose: "NER model artifact storage"}
    - {name: "Azure Service Bus", purpose: "Async job messaging"}

# =============================================================================
# PHASE 1: RECONNAISSANCE — All Components
# =============================================================================

# ---------------------------------------------------------------------------
# COMPONENT 1: AUTH SUBSYSTEM
# ---------------------------------------------------------------------------
component_1_auth:
  name: "Auth Subsystem"
  purpose: "OAuth 2.0 authentication via Azure AD, session management, org-scoped authorization"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "Internet → Core API (OAuth flow)"
    - "Core API → Redis (session storage)"
    - "Core API → Neo4j (org scope resolution)"
    - "Core API → Analytics API (org context fetch)"
  data_assets: "PII (email, name, org), Azure AD access tokens, session IDs"
  network_exposure: "Public"
  authentication_context: "Azure AD OAuth 2.0 authorization code flow"

  phase_1_reconnaissance:
    entry_points:
      - id: "AUTH-EP-001"
        type: "HTTP GET"
        path: "/auth/login"
        file: "services/api/app/routers/auth.py"
        line: 63
        authentication: "none"
        description: "Initiates OAuth flow; redirects to Azure AD"
      - id: "AUTH-EP-002"
        type: "HTTP GET"
        path: "/auth/callback"
        file: "services/api/app/routers/auth.py"
        line: 81
        authentication: "none (OAuth callback)"
        description: "Handles OAuth code exchange, creates session"
      - id: "AUTH-EP-003"
        type: "HTTP POST"
        path: "/auth/logout"
        file: "services/api/app/routers/auth.py"
        line: 185
        authentication: "session cookie"
        description: "Clears session and cookie"
      - id: "AUTH-EP-004"
        type: "HTTP GET"
        path: "/auth/session"
        file: "services/api/app/routers/auth.py"
        line: 196
        authentication: "session cookie (optional)"
        description: "Returns current user info; returns null user if unauthenticated"
      - id: "AUTH-EP-005"
        type: "FastAPI dependency"
        path: "get_caller_scope / get_caller_scope_from_request"
        file: "libs/auth/org_scope.py"
        line: 196
        authentication: "X-User-Email header OR ?email= query param OR session cookie"
        description: "Resolves caller identity and org scope for all protected endpoints"

    data_flows:
      - id: "AUTH-DF-001"
        description: "OAuth authorization code flow"
        source: "Browser"
        steps:
          - "Browser → /auth/login → 302 redirect to Azure AD"
          - "Azure AD → /auth/callback with ?code= (cleartext over HTTPS)"
          - "Core API → Azure AD token endpoint (HTTPS POST with client_secret)"
          - "Azure AD → access_token + id_token (JWT, cleartext in memory)"
          - "Core API decodes id_token (base64, NO signature verification)"
          - "Core API → Redis SET auth:session:{session_id} (JSON with access_token)"
          - "Core API → Browser SET-COOKIE leo_session={session_id} (httponly, samesite=lax, secure=FALSE)"
        encryption_transit: "HTTPS to Azure AD; HTTP between services"
        encryption_rest: "Redis — depends on Azure Cache for Redis TLS config"
        crosses_trust_boundary: true
        clinical_decision_pathway: false

      - id: "AUTH-DF-002"
        description: "Org scope resolution"
        source: "Any authenticated request"
        steps:
          - "Request arrives with X-User-Email header, ?email= param, or leo_session cookie"
          - "get_caller_scope_from_request extracts email (no validation against session)"
          - "PatientGraphClient opens Neo4j session"
          - "Cypher query: MATCH (pr:Practitioner {email: $email})"
          - "Expands org hierarchy: GPPractice → ICB → CancerAlliance"
          - "Returns CallerScope(email, is_admin, org_ids)"
        encryption_transit: "bolt:// to Neo4j (TLS depends on deployment config)"
        encryption_rest: "Neo4j Aura encrypts at rest"
        crosses_trust_boundary: true
        clinical_decision_pathway: false

      - id: "AUTH-DF-003"
        description: "Org context enrichment at login"
        source: "OAuth callback"
        steps:
          - "Core API → Analytics API GET /analytics/auth/org-context?email={email}"
          - "Analytics API → Neo4j (Practitioner lookup)"
          - "Returns is_platform_admin, organizations"
          - "Stored in Redis session alongside access_token"
        encryption_transit: "HTTP (plaintext between services)"
        encryption_rest: "Redis session store"
        crosses_trust_boundary: true
        clinical_decision_pathway: false

    trust_boundary_analysis:
      - boundary: "Internet → Core API (OAuth callback)"
        authentication_present: "yes — OAuth authorization code from Azure AD"
        authentication_citation: "services/api/app/routers/auth.py:81-109"
        authorisation_enforcement: "no — callback is open, relies on Azure AD code validity"
        input_validation:
          code_parameter: "checked for presence (line 94) but not validated beyond exchange"
          state_parameter: "used as redirect URL without validation (line 68, 168)"
          error_parameter: "reflected to frontend URL (line 92)"

      - boundary: "Core API → Redis (session store)"
        authentication_present: "yes — Redis URL with optional password"
        authentication_citation: "services/api/app/services/session_store.py:30-61"
        authorisation_enforcement: "no — any process with Redis URL has full access"
        input_validation: "session_id is cryptographically random (secrets.token_urlsafe(32), line 128)"

      - boundary: "Caller identity resolution (X-User-Email)"
        authentication_present: "no — header accepted without signature verification"
        authentication_citation: "libs/auth/org_scope.py:196-215"
        authorisation_enforcement: "yes — org scope restricts data visibility"
        authorisation_citation: "libs/auth/org_scope.py:65-135, 218-241"
        input_validation: "email normalized (lowercase, strip) but not validated against session"

    secrets_usage:
      - secret: "AZURE_AD_CLIENT_SECRET"
        storage: "environment variable (loaded from secrets/.env)"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:32"]

      - secret: "AZURE_AD_CLIENT_ID"
        storage: "environment variable"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:31"]

      - secret: "AZURE_AD_TENANT_ID"
        storage: "environment variable"
        rotation_evidence: "undocumented"
        scope: ["services/api/app/routers/auth.py:30"]

      - secret: "Session ID (leo_session cookie)"
        storage: "browser cookie + Redis key"
        rotation_evidence: "none — no rotation on use; 7-day TTL"
        scope: ["services/api/app/services/session_store.py:19-21"]

      - secret: "Azure AD access_token"
        storage: "Redis (auth:session:{session_id} JSON field)"
        rotation_evidence: "none — token stored at login, never refreshed"
        scope: ["services/api/app/routers/auth.py:157-165"]

    existing_controls:
      - control: "Cryptographically random session IDs"
        citation: "services/api/app/services/session_store.py:128-129"
        description: "secrets.token_urlsafe(32) — 256 bits of entropy"
      - control: "HttpOnly cookie"
        citation: "services/api/app/routers/auth.py:174"
        description: "Session cookie inaccessible to JavaScript"
      - control: "SameSite=lax cookie"
        citation: "services/api/app/routers/auth.py:176"
        description: "Mitigates cross-site POST CSRF (but not GET)"
      - control: "v2.0 token enforcement"
        citation: "services/api/app/routers/auth.py:122-136"
        description: "Rejects Azure AD v1.0 tokens (sts.windows.net issuer)"
      - control: "Redis session TTL"
        citation: "services/api/app/services/session_store.py:20"
        description: "Sessions expire after 7 days"
      - control: "Org-scoped data access"
        citation: "libs/auth/org_scope.py:65-135"
        description: "Non-admin users restricted to their org hierarchy"
      - control: "Patient-in-scope check"
        citation: "libs/auth/org_scope.py:218-241"
        description: "Verifies patient GP is within caller's org_ids"

  phase_2_threats:
    - id: "AUTH-S-001"
      element: "libs/auth/org_scope.py:196-215"
      threat: "Identity spoofing via X-User-Email header"
      attack_vector: "Attacker sets X-User-Email header to any email address (including platform admin) when calling protected API endpoints directly"
      prerequisites: "Network access to Core API port 8000"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint", "external_targeted"]
      evidence:
        file: "libs/auth/org_scope.py"
        line: 196
        snippet: "def get_caller_scope(x_user_email: Optional[str] = Header(default=None, alias='X-User-Email'), email: Optional[str] = Query(default=None)) -> CallerScope:"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: true
      likelihood: "High"
      likelihood_rationale: "Trivially exploitable — requires only setting an HTTP header. The get_caller_scope dependency is overridden in main.py (line 77) with get_caller_scope_from_request which falls back to session cookie, but the original get_caller_scope accepting bare X-User-Email is still used by internal services (FHIR, Analytics, proxy forwarding)."
      existing_controls: "get_caller_scope_from_request in deps.py provides session cookie fallback for the Core API, but the fallback chain still prefers X-User-Email header over session"
      gaps: "No validation that X-User-Email matches the authenticated session. Any caller who can reach the API can set this header."
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.2"
          nature: "Inadequate authentication mechanism — identity accepted from unauthenticated header"
        - standard: "UK GDPR"
          clause: "Article 32(1)(b)"
          nature: "Inability to ensure ongoing confidentiality of processing systems"
        - standard: "DSPT"
          clause: "Assertion 4.3.1"
          nature: "Access controls do not ensure only authorised individuals access data"

    - id: "AUTH-S-002"
      element: "services/api/app/deps.py:46-65"
      threat: "Identity spoofing via email query parameter"
      attack_vector: "Attacker appends ?email=admin@nhs.net to any protected endpoint URL"
      prerequisites: "Network access to Core API; knowledge of admin email address"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint", "external_targeted"]
      evidence:
        file: "services/api/app/deps.py"
        line: 53
        snippet: "caller_email = (x_user_email or email or '').strip().lower()"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: true
      likelihood: "High"
      likelihood_rationale: "The ?email= parameter is documented in the code as 'legacy fallback' but is still active. Any URL with a valid practitioner email grants that user's scope."
      existing_controls: "Session cookie fallback exists but X-User-Email and ?email= are checked first"
      gaps: "Query parameter identity is not authenticated against any credential"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.2"
          nature: "Authentication bypass via query parameter"

    - id: "AUTH-T-001"
      element: "services/api/app/routers/auth.py:122-149"
      threat: "Token tampering — no JWT signature verification"
      attack_vector: "Attacker intercepts or forges a JWT with valid-looking claims (correct email, tenant, issuer) but invalid signature. The callback handler decodes it via base64 without verifying against Azure AD JWKS."
      prerequisites: "Ability to inject a forged JWT into the token exchange response (MITM on token endpoint) or forge a token that Azure AD returns"
      threat_actors: ["external_targeted", "supply_chain"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 125
        snippet: "payload_b64 = token.split('.')[1]\npayload_b64 += '=' * (4 - len(payload_b64) % 4)\nclaims = json.loads(base64.urlsafe_b64decode(payload_b64))"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "The token exchange happens over HTTPS to Azure AD, making MITM difficult. However, the absence of signature verification means any code path that processes existing tokens (session restore, token refresh) is vulnerable. The stored access_token in Redis is never re-validated."
      existing_controls: "HTTPS to Azure AD token endpoint; v2.0 issuer check"
      gaps: "No JWKS-based cryptographic signature verification of id_token or access_token. python-jose[cryptography] is in requirements but not used for token validation."
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.3"
          nature: "Cryptographic verification of authentication tokens not implemented"
        - standard: "NCSC CAF"
          clause: "B2.a"
          nature: "Identity verification does not use cryptographic methods"

    - id: "AUTH-T-002"
      element: "services/api/app/routers/auth.py:68,168"
      threat: "OAuth state parameter tampering — open redirect"
      attack_vector: "Attacker crafts a login URL with state=//evil.com or state=/auth/callback?error=phishing. After OAuth, the user is redirected to FRONTEND_URL + attacker-controlled path. Since state is not signed or validated against an allowlist, the attacker controls the post-login redirect."
      prerequisites: "Ability to send a crafted URL to the victim (phishing)"
      threat_actors: ["external_opportunistic", "external_targeted"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 68
        snippet: "state = next_url"
      impact:
        confidentiality: "Medium"
        integrity: "Low"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: false
      likelihood: "Medium"
      likelihood_rationale: "The redirect is prefixed with FRONTEND_URL (line 171), limiting the redirect to paths on the frontend domain. However, path-based phishing (e.g., redirect to a page that mimics a login form) is still possible."
      existing_controls: "Redirect prefixed with FRONTEND_URL; normalized_state must start with '/'"
      gaps: "No CSRF nonce in state parameter; no allowlist of valid redirect paths; state not cryptographically signed"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.4"
          nature: "Session management vulnerability — OAuth state not protected"

    - id: "AUTH-R-001"
      element: "services/api/app/routers/auth.py"
      threat: "Repudiation — no audit trail for authentication events"
      attack_vector: "Attacker authenticates, performs malicious actions, and there is no durable audit log of when sessions were created, by whom, or when they expired."
      prerequisites: "Valid or spoofed identity"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 156
        snippet: "save_session(session_id, {...})"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "Low"
        patient_data_exposure: false
      likelihood: "Medium"
      likelihood_rationale: "Authentication events are logged via Python logging (logger.info/warning) but not persisted to a durable audit store. Log retention depends on infrastructure configuration."
      existing_controls: "Python logging captures some auth events"
      gaps: "No durable, tamper-evident audit log for authentication events. No session creation/destruction events written to a persistent store. IEC 62304 Clause 5.2 requires audit trail for clinical decisions."
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 62304"
          clause: "5.2"
          nature: "Insufficient audit trail for security-relevant events"
        - standard: "IEC 81001-5-1"
          clause: "5.4.2"
          nature: "Security event logging not persisted to durable store"

    - id: "AUTH-I-001"
      element: "services/api/app/routers/auth.py:173-181"
      threat: "Session cookie transmitted over HTTP (secure=False)"
      attack_vector: "Session cookie is transmitted in cleartext over HTTP connections. An attacker on the same network (e.g., NHS hospital WiFi) can intercept the cookie via passive network sniffing."
      prerequisites: "Network-level access (same LAN, compromised network equipment)"
      threat_actors: ["external_opportunistic", "compromised_nhs_endpoint"]
      evidence:
        file: "services/api/app/routers/auth.py"
        line: 177
        snippet: "secure=False,  # True in production with HTTPS"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "Code comment indicates this should be True in production, but the setting is hardcoded, not driven by environment configuration. If deployed as-is, sessions are exposed."
      existing_controls: "Code comment acknowledges the issue"
      gaps: "secure flag is hardcoded False, not configurable via environment variable"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.5"
          nature: "Session credentials transmitted without transport encryption enforcement"
        - standard: "UK GDPR"
          clause: "Article 32(1)(a)"
          nature: "Encryption of personal data in transit not enforced"

    - id: "AUTH-I-002"
      element: "services/api/app/services/session_store.py:20"
      threat: "Excessive session lifetime enables persistent access from stolen cookie"
      attack_vector: "A stolen session cookie (via XSS on a same-site origin, network interception, or endpoint compromise) provides 7 days of persistent access without re-authentication."
      prerequisites: "Stolen session cookie"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint", "external_targeted"]
      evidence:
        file: "services/api/app/services/session_store.py"
        line: 20
        snippet: "SESSION_TTL = 60 * 60 * 24 * 7  # 7 days"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "7-day TTL is long for a medical device application. No session rotation on activity, no single-use session tokens, no IP binding."
      existing_controls: "Session expires after 7 days; logout deletes session"
      gaps: "No session rotation; no re-authentication on sensitive operations; no IP or user-agent binding; no concurrent session limits"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.4"
          nature: "Session management does not limit exposure window"
        - standard: "DSPT"
          clause: "Assertion 4.2.2"
          nature: "Session timeout exceeds NHS recommended limits"

    - id: "AUTH-D-001"
      element: "services/api/app/services/session_store.py:105-108"
      threat: "Redis session store denial of service — in-memory fallback"
      attack_vector: "If Redis becomes unavailable, the session store falls back to in-memory storage. This means (a) sessions created during Redis outage are lost on process restart, (b) sessions are not shared across API replicas, and (c) an attacker who causes Redis to fail forces a degraded authentication mode."
      prerequisites: "Ability to disrupt Redis connectivity"
      threat_actors: ["external_targeted"]
      evidence:
        file: "services/api/app/services/session_store.py"
        line: 107
        snippet: "_redis_client = False  # Mark as permanently unavailable this process lifetime"
      impact:
        confidentiality: "Low"
        integrity: "Low"
        availability: "Medium"
        clinical_safety: "Low"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Redis on Azure Cache is generally reliable. Marking as permanently unavailable per-process is aggressive but prevents repeated connection attempts."
      existing_controls: "Graceful fallback to in-memory store"
      gaps: "In-memory fallback is not HA-compatible; sessions are not shared across replicas. No alerting on Redis failover."
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.5.2"
          nature: "Degraded security mode under failure conditions not documented"

    - id: "AUTH-E-001"
      element: "libs/auth/org_scope.py:88-97"
      threat: "Privilege escalation via platform admin flag"
      attack_vector: "An attacker who spoofs the email of a platform admin (via X-User-Email header or ?email= param) gains is_admin=True, which bypasses all org scope restrictions. Platform admin status is stored as a boolean on the Practitioner node in Neo4j."
      prerequisites: "Knowledge of a platform admin email address; AUTH-S-001 or AUTH-S-002 exploited"
      threat_actors: ["malicious_insider", "compromised_nhs_endpoint"]
      evidence:
        file: "libs/auth/org_scope.py"
        line: 88
        snippet: "is_admin = bool(user.get('is_platform_admin', False))"
      impact:
        confidentiality: "High"
        integrity: "High"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: true
      likelihood: "High"
      likelihood_rationale: "Chained with AUTH-S-001/AUTH-S-002, this is trivially exploitable. Admin emails may be discoverable from organizational directories."
      existing_controls: "Platform admin is checked in Neo4j graph, not in a header"
      gaps: "The authentication of the caller identity is weak (header-based), so the admin privilege check is effectively bypassed"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.3.6"
          nature: "Privilege escalation to full system access via identity spoofing"
        - standard: "UK GDPR"
          clause: "Article 32(1)(d)"
          nature: "Inability to ensure authorized access boundaries"

# ---------------------------------------------------------------------------
# COMPONENT 2: CORE API GATEWAY
# ---------------------------------------------------------------------------
component_2_core_api:
  name: "Core API Gateway"
  purpose: "Central FastAPI application serving all HTTP endpoints and proxying to internal services"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "UI → Core API"
    - "Core API → Terminology/FHIR/Analytics APIs (proxy)"
  data_assets: "All data types — clinical, PII, operational"
  network_exposure: "Public"
  authentication_context: "Session cookie (via deps.py); some endpoints unauthenticated"

  phase_1_reconnaissance:
    entry_points:
      - id: "API-EP-001"
        type: "HTTP GET"
        path: "/health"
        file: "services/api/app/main.py"
        line: 100
        authentication: "none"
      - id: "API-EP-002"
        type: "HTTP wildcard"
        path: "/api/proxy/{benchmarks,fhir,analytics,pipeline}/*"
        file: "services/api/app/routers/proxy.py"
        line: 57
        authentication: "session cookie (get_access_token, get_user_email)"
      - id: "API-EP-003"
        type: "HTTP multiple"
        path: "/model-registry/*"
