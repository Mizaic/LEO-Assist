# -- R-LEO-AI-023 -- Incorrect Guideline Compliance Assessment
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-023"
  title: "Guideline compliance checker produces incorrect deviation alerts"

  hazard:
    description: "Guideline compliance rules incorrectly classify encounters as compliant or non-compliant with clinical guidelines"
    category: "software_defect"

  hazardous_situation: "False positive alerts create unnecessary work and erode trust in the system; false negative alerts fail to identify genuine guideline deviations that should be investigated"

  harm:
    description: "False negatives could mask genuine quality issues; false positives waste clinical audit resource and erode system trust"
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "Guideline rule accuracy validated against expert-reviewed cases with threshold >= 90%"
      implemented_by: []
      verified_by: []
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Human review of all guideline alerts before they are actioned"
      implemented_by: []
      verified_by: []
      effectiveness: "highly_effective"
    - control_type: "procedural_control"
      description: "Guideline rules reviewed by clinical team when NICE guidance is updated"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Guideline rules are validated against expert consensus. All alerts require human review. Clinical team reviews rules when guidance changes. Multiple controls reduce probability of systematic error to improbable."

  monitoring:
    monitoring_plan: "Track alert accuracy, false positive and false negative rates, and guideline rule update latency"
    metrics: ["Alert accuracy rate", "False positive rate", "False negative rate", "Guideline rule update latency"]
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["clinical-risk", "guideline-compliance", "nice-ng12"]
