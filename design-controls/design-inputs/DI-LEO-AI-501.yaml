# -- DI-LEO-AI-501 -- Episode Engine: Segmenter Agent
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-501"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-090"
  requirement: >
    The episode engine segmenter agent SHALL split a patient's
    timeline_text into a list of CandidateWindow records, each with a
    stable ``window_id`` (w1, w2, ...), a ``suspected_site`` (or
    'unknown'), an inclusive ``window_start`` date, an optional
    ``window_end`` date, and a one-sentence ``rationale``. The agent
    SHALL be implemented as a Bedrock Claude Haiku call using a
    forced ``tool_config`` (toolChoice = submit_windows) so the model
    always returns valid JSON conforming to ``SegmenterResult``.
    Pydantic validation SHALL be applied to every response and a
    ``StageError`` SHALL be raised on schema violation, missing tool
    use, or LLM-level exception.
  rationale: >
    Cancer episodes are typed at the level of a "window" (referral ->
    diagnosis -> treatment), not at the encounter level. Asking the
    LLM to make ALL decisions in one call would blow context and
    couple stages. A cheap segmenter pass produces the windows that
    the rest of the chain can then classify and extract milestones
    from independently. Forcing JSON via ``tool_config`` removes the
    free-form-output failure mode that plagues unstructured prompting.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "submit_windows tool MUST be the only tool offered and MUST be forced (toolChoice = {tool: {name: submit_windows}})."
      - type: "functional"
        spec: "A valid response MUST be parsed into SegmenterResult with windows[] and notes."
      - type: "functional"
        spec: "Each CandidateWindow MUST have a date-typed window_start; window_end MAY be null."
      - type: "safety"
        spec: "An empty tool_uses list MUST raise StageError - the engine never silently returns empty output."
      - type: "safety"
        spec: "Schema validation failure MUST raise StageError; the chain handles fail-soft so the patient run continues with no windows."
      - type: "safety"
        spec: "Provider-level exceptions (Bedrock down) MUST be wrapped in StageError with the original message preserved."
      - type: "performance"
        spec: "Per-patient input tokens MUST stay under 30,000 on cohort-typical timelines (validated in spike)."
    constraints:
      - type: "safety"
        spec: "Prompt MUST include the canonical rules-of-the-road (admin echoes, restatements, structured codes) imported from libs/prompts/episode_engine/_shared.py."
    dependencies:
      - "DI-LEO-AI-500"
    downstream_impacts:
      - "Classifier accuracy depends on segmenter window quality"
      - "Reconciler workload scales with number of windows"
    technical_details:
      language: "Python"
      framework: "libs.llm_client.factory.LLMClient (Bedrock) + Pydantic"
      file_structure:
        - "services/analysis_worker/app/episode_engine/agents/segmenter.py"
        - "services/analysis_worker/app/episode_engine/agents/_common.py"
        - "libs/prompts/episode_engine/segmenter_v1.py"
        - "libs/prompts/episode_engine/_shared.py"
      estimated_loc: 220

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-501 must pass on all critical and total cases:
      structured tool-use parsing (dict and JSON-string forms),
      empty-tool-use raise, schema-violation raise, provider-error
      raise, and tool_config forced toolChoice.
    test_protocol: "VT-LEO-AI-501"

  safety_class: "B"
  risks:
    - "R-LEO-AI-501"
  tags:
    - "episode-engine"
    - "segmenter"
    - "haiku"
    - "tool_config"
