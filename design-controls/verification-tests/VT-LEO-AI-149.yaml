# -- VT-LEO-AI-149 -- Knowledge tab width parity + DomainCard / PackageCard consistency
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-149"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-151"]
    risks: []

  metadata:
    title: "Knowledge tab width parity + DomainCard / PackageCard consistency"
    description: >
      Verifies the Wave E polish change set:

        - services/ui/src/app/admin/knowledge/page.tsx promotes
          ai-instructions and clinical-guidelines from 'reading'
          to 'wide' so all eight Knowledge tabs render at the same
          1600px max width.
        - services/ui/src/app/settings/domains/page.tsx DomainCard
          uses the canonical 12px / 18px / 3px-accent / >=160px
          minHeight pattern and the canonical knowledge tone
          palette (NICE blue / LEO platform slate / domain green).
        - services/ui/src/app/settings/terminology/page.tsx
          PackageCard uses the same canonical pattern.
        - The Domains responsive grid is capped at 3 columns so
          cards stay legible on the wide layout.

      The test does a deterministic static-source scan because
      both pages hit live Neo4j-backed APIs on mount, which makes
      a unit-scoped live render fragile. A live render is reserved
      for the Phase 7 Playwright sweep.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/knowledge-tab-width-and-cards.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node >= 20"
      - "npm install run in services/ui"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-149-TC-001"
      case_name: "Every Knowledge tab maps to layout width 'wide'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read knowledge/page.tsx and inspect the TAB_WIDTH map"
          expected_result: >
            All eight tab keys (training-data, surface-forms,
            context-rules, ai-instructions, clinical-guidelines,
            pathways, domains, terminology) map to 'wide'.
      verification_method: "automated"
      acceptance_criteria:
        - "All eight tabs share the same layout width"

    - case_id: "VT-149-TC-002"
      case_name: "DomainCard uses 12px radius, 18px padding, 3px accent strip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read domains/page.tsx and inspect DomainCard style"
          expected_result: >
            borderRadius: 12, padding: 18, and a 3px-wide left
            accent strip with background: accent are present.
      verification_method: "automated"
      acceptance_criteria:
        - "DomainCard token alignment matches PackageCard"

    - case_id: "VT-149-TC-003"
      case_name: "PackageCard uses 12px radius, 18px padding, 3px accent strip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read terminology/page.tsx and inspect PackageCard style"
          expected_result: >
            borderRadius: '12px', p: '18px', and a 3px-wide left
            accent strip with background: accent are present.
      verification_method: "automated"
      acceptance_criteria:
        - "PackageCard token alignment matches DomainCard"

    - case_id: "VT-149-TC-004"
      case_name: "Domains grid is capped at 3 columns (no lg:4)"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Read domains/page.tsx and inspect the gridTemplateColumns block"
          expected_result: >
            md: 'repeat(3, 1fr)' present; no lg: 'repeat(4, 1fr)'.
      verification_method: "automated"
      acceptance_criteria:
        - "Cards stay legible on the wide layout"

    - case_id: "VT-149-TC-005"
      case_name: "Domains and Terminology card minHeight is aligned (>=160)"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Search both page sources for minHeight"
          expected_result: >
            minHeight: 168 (DomainCard) and minHeight: 168
            (PackageCard) both present and >= 160.
      verification_method: "automated"
      acceptance_criteria:
        - "Card height floor is consistent"

    - case_id: "VT-149-TC-006"
      case_name: "DomainCard tone chips use the canonical knowledge palette"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Search domains/page.tsx for chip background colours"
          expected_result: >
            NICE chip uses #DBEAFE / #1E40AF; platform chip uses
            #F1F5F9 / #475569; LEO domain chip uses #ECFDF5 /
            #047857.
      verification_method: "automated"
      acceptance_criteria:
        - "Chip palette matches the canonical knowledge tone tokens"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-149/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-16"
      executed_by: "Wave E polish automation"
      result: "pass"
      notes: "All 6 test cases pass under jest 30; 0 failures."
