# -- DO-LEO-AI-079 -- Ambiguous Abbreviation Disambiguation Rules
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-079"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-081"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-055"]
    verification_tests: ["VT-LEO-AI-081"]

  specification:
    title: "Ambiguous GP Abbreviation Disambiguation Rules"
    description: |
      Three-layer defence against miscoding of ambiguous GP abbreviations:

      Layer 1 - Extraction prompt (libs/prompts/extraction_v1.py):
        - "CA" alone added to DO NOT EXTRACT list; requires organ/site context.
        - "MSK" alone added to DO NOT EXTRACT list; only specific symptom coded.
        - NAD disambiguation note: always tag as finding, never substance.
        - Abbreviation expansion table extended with 30+ new entries covering
          cancer pathway, chronic conditions, symptoms, and investigations.
        - CRITICAL disambiguation block added after abbreviation table.

      Layer 2 - Escalation prompts (libs/llm_client/escalation.py):
        - Rule 10 added to escalate_coding() prompt: CA/MSK/NAD guidance.
        - Rule 11 added to _CANDIDATES_SYSTEM: same guidance for ask-leo path.
        - Both prompts updated in the same changeset (dual-path parity).

      Layer 3 - Resolver concept blocklist (libs/terminology/client.py):
        - _ABBREV_BLOCKED_CONCEPTS dict maps normalised abbreviation text
          to a set of SNOMED concept IDs that are incorrect in GP context.
        - _filter_abbrev_noise() applied during re-keying in both
          TerminologyClient.resolve() and AsyncTerminologyClient.resolve_raw().
        - Blocked for "nad": 104695007, 124316006, 131143000 (NAD biochemistry).

      Surface form writeback:
        - 43 abbreviation surface forms written to terminology server with
          confidence 1.0 and provenance "abbreviation_audit_april_2026".
        - 3 review-required entries (TWOC, OOH, NAD) subsequently resolved
          and written after clinical confirmation.
        - 5 entries deferred for clinical review (CA, NAD-general, OOH, TWOC, MSK).

    acceptance_criteria:
      - criterion: "NAD resolver blocklist"
        type: "safety"
        measurement: "Test"
        target: >
          TerminologyClient.resolve(['NAD']) never returns concept IDs
          104695007, 124316006, or 131143000 in any position in the result list.
      - criterion: "CA no-site suppression"
        type: "functional"
        measurement: "Test"
        target: >
          LLM extractor with updated prompt returns no entity for 'CA' alone;
          escalation returns not_codeable for standalone CA.
      - criterion: "MSK specialty tag suppression"
        type: "functional"
        measurement: "Test"
        target: >
          'MSK clinic' and 'referred to MSK' produce no coded entity;
          'MSK back pain' produces 'back pain' entity only.
      - criterion: "Abbreviation resolution accuracy"
        type: "functional"
        measurement: "Test"
        target: >
          All 40 approved surface forms resolve via TerminologyClient at
          score >= 0.95 after writeback.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/prompts/extraction_v1.py"
        description: "CA/MSK/NAD rules in DO NOT EXTRACT and disambiguation block"
      - artifact_type: "source_code"
        location: "libs/llm_client/escalation.py"
        description: "Rule 10/11 added to escalate_coding and _CANDIDATES_SYSTEM"
      - artifact_type: "source_code"
        location: "libs/terminology/client.py"
        description: "_ABBREV_BLOCKED_CONCEPTS and _filter_abbrev_noise()"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "_filter_abbrev_noise"
        - "_ABBREV_BLOCKED_CONCEPTS"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Prevention of incorrect SNOMED codes on patient records from ambiguous abbreviations"
      - "Dual-path parity: extraction prompt and escalation prompt rules are identical"
    risk_control_measures:
      - "Three independent layers (prompt, escalation, resolver) provide defence in depth"
      - "Blocklist is normalised-text keyed so case variants (nad, NAD, Nad) all match"

  verification_status:
    verification_method: "Test"
    verification_complete: false
