# -- VT-LEO-AI-230 -- PatientFinder primitive + analytics-api router
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-230"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-230"]
    risks: ["R-LEO-AI-211"]

  metadata:
    title: "PatientFinder dialog (Search/Filter/Cohort tabs) + /patient-finder router"
    description: >
      Two-layer verification. Jest static-source layer pins the
      three-tab structure, the always-on NHS+DOB row contract, and
      the typeahead debounce wiring. Jest live-render layer covers
      typeahead behaviour and the no-results empty state. Pytest
      layer covers /patient-finder/{patient_id}/* CallerScope
      enforcement (403 on out-of-scope id) and the extended
      CohortFilter clauses (imd, encounter_count, episode_*).
    test_level: "system"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest + pytest"
    test_file_paths:
      - "services/ui/src/__tests__/patient-finder-chrome.test.tsx"
      - "services/ui/src/__tests__/patient-finder-typeahead.test.tsx"
      - "tests/test_patient_finder_router.py"
      - "tests/test_cohort_filter_extensions.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node 20+ / jest 30 / @testing-library/react / user-event"
      - "Python 3.11+ / pytest / pytest-asyncio / fakeredis"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-230-TC-001"
      case_name: "Dialog renders three tabs (Search / Filter / Saved cohort)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source assertion that PatientFinder.tsx contains <Tab data-testid='patient-finder-tab-search'>, '...-filter' and '...-cohort'"
          expected_result: "All three tab markers present"
          verification_method: "automated"
      acceptance_criteria:
        - "Three-tab structure preserved"

    - case_id: "VT-230-TC-002"
      case_name: "Every result row renders NHS number AND DOB"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source assertion that ResultsList row contains data-testids 'patient-row-nhs' and 'patient-row-dob' for every tab"
          expected_result: "Both identifiers required by markup"
          verification_method: "automated"
      acceptance_criteria:
        - "Mitigation for R-LEO-AI-211 enforced at build time"

    - case_id: "VT-230-TC-003"
      case_name: "Typeahead debounces by 250 ms"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Live-render: type 'sm' then 'ith' within 200 ms; advance fake timers"
          expected_result: "searchPatients called once with 'smith', not three times"
          verification_method: "automated"
      acceptance_criteria:
        - "Debounce prevents per-keystroke API calls"

    - case_id: "VT-230-TC-004"
      case_name: "Out-of-scope patient id returns 404 from /patient-finder/{id}/encounters"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pytest: call endpoint with patient owned by a different tenant"
          expected_result: "Status 404 (we do not leak existence of out-of-scope patients)"
          verification_method: "automated"
      acceptance_criteria:
        - "CallerScope enforcement; mitigation for R-LEO-AI-211 (patient mismatch / leakage)"

    - case_id: "VT-230-TC-005"
      case_name: "Extended CohortFilter (imd, encounter_count, episode_*) builds the right WHERE clauses"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Pytest: assert _build_where_clauses output for each new field"
          expected_result: "Generated Cypher contains the expected sub-clauses and parameters"
          verification_method: "automated"
      acceptance_criteria:
        - "Filter contract behaves as documented in DI-LEO-AI-230"

    - case_id: "VT-230-TC-006"
      case_name: "POST /cohorts/preview returns patient_count + sample_patient_ids"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Pytest: post a CohortFilter and assert response shape"
          expected_result: "JSON has patient_count (int) and sample_patient_ids (list, len <= 5)"
          verification_method: "automated"
      acceptance_criteria:
        - "Filter tab can preview before listing"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-230/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-LEO-AI-230-2026-04-18"
      executed_at: "2026-04-18T00:00:00Z"
      executed_by: "automated"
      result: "pass"
      environment: "developer-laptop"
      notes: >
        Jest run: 13 tests across patient-finder-chrome.test.tsx and
        patient-finder-typeahead.test.tsx (debounce + safety chip
        invariants). Pytest run: 16 tests across
        tests/test_cohort_filter_extensions.py (8) and
        tests/test_patient_finder_router.py (8). All passed.
