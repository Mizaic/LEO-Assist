# -- VT-LEO-AI-154 -- Pathway editor chrome decomposition
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-154"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-156"]
    risks: ["R-LEO-AI-108"]

  metadata:
    title: "Pathway editor chrome decomposition (Phase 6b-ii)"
    description: >
      Static-source verification that the pathway editor's top-level
      chrome (toolbar, sticky save bar, publish / delete / edge-
      confirm dialogs) has been extracted from the orchestrator
      page.tsx into prop-driven sibling modules under editor/, that
      the orchestrator wires them in and removes the legacy inline
      markup, and that the new files respect the canonical API and
      file-size discipline.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathway-canvas-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-154-TC-001"
      case_name: "Editor scaffold files exist"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "fs.existsSync each of PathwayToolbar.tsx, PathwaySaveBar.tsx, utils.ts, dialogs/EdgeDeleteConfirm.tsx, dialogs/PublishDialog.tsx, dialogs/DeletePathwayDialog.tsx"
          expected_result: "All six paths exist"
          verification_method: "automated"
      acceptance_criteria:
        - "All six chrome modules exist"

    - case_id: "VT-154-TC-002"
      case_name: "page.tsx imports the new chrome modules"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read page.tsx and assert it imports PathwayToolbar, PublishDialog, DeletePathwayDialog, EdgeDeleteConfirm from editor/"
          expected_result: "All four imports match"
          verification_method: "automated"
      acceptance_criteria:
        - "Imports point at relative paths under editor/"

    - case_id: "VT-154-TC-003"
      case_name: "page.tsx renders the new components, not inline JSX"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert <PathwayToolbar.../>, <PublishDialog.../>, <DeletePathwayDialog.../>, <EdgeDeleteConfirm.../> appear in page.tsx"
          expected_result: "All four JSX usages match"
          verification_method: "automated"
      acceptance_criteria:
        - "All four extracted components are rendered"

    - case_id: "VT-154-TC-004"
      case_name: "Legacy inline toolbar markup has been removed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert page.tsx no longer contains the legacy strings ('Add a data source...', 'Add an output...', 'Add a step...') and no longer wires onClick={handlePublish}"
          expected_result: "None of the legacy patterns appear"
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy inline toolbar removed"

    - case_id: "VT-154-TC-005"
      case_name: "PathwayToolbar is prop-driven (no inline state)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert PathwayToolbar.tsx contains no useState / useEffect, exports function PathwayToolbar, and exports interface PathwayToolbarProps"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Component is prop-driven"

    - case_id: "VT-154-TC-006"
      case_name: "PathwayToolbar exposes the canonical handler set"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert all 16 expected handlers (onSaveDraft, onPublish, onRetire, onAddSourceNode, onAddOutputNode, onAddViewerNode, onAddAction, onAutoLayout, onClearTestTrace, onOpenTestRun, onRunAllSteps, onOpenBatchPanel, onOpenHistory, onOpenDelete, onBack, onClearSaveError) appear in source"
          expected_result: "All 16 names match"
          verification_method: "automated"
      acceptance_criteria:
        - "Toolbar exposes the full handler set"

    - case_id: "VT-154-TC-007"
      case_name: "PathwayToolbar applies aria-labels to icon-only controls"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert aria-label='Back to pathway list', 'Auto-layout pathway', 'Open version history', and aria-label on the pathway name input appear in PathwayToolbar.tsx"
          expected_result: "All four aria-labels match"
          verification_method: "automated"
      acceptance_criteria:
        - "Icon-only controls are SR-readable"

    - case_id: "VT-154-TC-008"
      case_name: "PublishDialog is prop-driven"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert PublishDialog.tsx exports the function and interface, contains no useState, and labels the primary action 'Publish to live'"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Dialog is prop-driven and SR-labelled"

    - case_id: "VT-154-TC-009"
      case_name: "DeletePathwayDialog uses type-the-name confirm gate"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert DeletePathwayDialog.tsx contains the 'confirmText.trim() === pathwayName' guard, the 'Type the pathway name exactly' instruction copy, and the aria-label 'Delete pathway permanently'"
          expected_result: "All three assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Confirm gate is implemented inside the component"

    - case_id: "VT-154-TC-010"
      case_name: "EdgeDeleteConfirm is a small, single-purpose dialog"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Assert EdgeDeleteConfirm.tsx contains 'Remove connection?' title, 'Keep connected' cancel label, and exports function EdgeDeleteConfirm"
          expected_result: "All three assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Edge-disconnect confirm is single-purpose"

    - case_id: "VT-154-TC-011"
      case_name: "PathwaySaveBar exposes the dirty / saving / saved / error states"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert PathwaySaveBar.tsx defines a SaveBarState union containing idle, dirty, saving, saved, error and renders role=status with aria-live=polite"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Save bar is ready for Phase 6b-iv dirty tracking"

    - case_id: "VT-154-TC-012"
      case_name: "utils centralises lifecycle helpers"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Assert utils.ts exports formatSaveTime, lifecycleColor, lifecycleLabel, and the PlanLifecycleStatus type"
          expected_result: "All four exports present"
          verification_method: "automated"
      acceptance_criteria:
        - "Lifecycle helpers are reusable"

    - case_id: "VT-154-TC-013"
      case_name: "Extracted modules respect file-size discipline"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Assert utils.ts < 60 lines, EdgeDeleteConfirm.tsx < 100 lines, PublishDialog.tsx and DeletePathwayDialog.tsx < 220 lines, PathwaySaveBar.tsx < 220 lines, PathwayToolbar.tsx < 500 lines"
          expected_result: "All six size limits hold"
          verification_method: "automated"
      acceptance_criteria:
        - "File sizes inside policy"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-154/"
