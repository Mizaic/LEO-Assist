# -- VT-LEO-AI-014 -- Data Governance Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-014"
  version: "1.0"
  status: "pending"

  traceability:
    design_inputs: ["DI-LEO-AI-023"]
    risks: ["R-LEO-AI-008", "R-LEO-AI-009"]
    user_needs: ["UN-LEO-AI-015"]

  metadata:
    title: "Data Governance Verification"
    description: "Verifies that patient data is stored only in the Patient graph, the Coding graph contains no patient data, and cross-database queries are prevented."
    test_level: "inspection"
    test_type: "security"
    safety_class: "B"
    automation_status: "inspection"
    automation_framework: "manual"
    test_file_paths: []
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "staging"
    prerequisites:
      - "Neo4j Patient database running with application credentials"
      - "Neo4j Coding (Knowledge) database running with separate credentials"
      - "Both databases populated with at least one synthetic patient pipeline run"
    test_data:
      data_type: "synthetic"
      cleanup_required: true
    rationale: >
      Database isolation is enforced at the infrastructure level (separate Neo4j instances,
      separate connection credentials). This cannot be verified by CI unit tests — it requires
      inspection of the deployed graph schema and live connection testing against a staging
      environment with real Neo4j instances. The schema schema_constraints.py defines the
      node/property model but does not enforce cross-database isolation at the code level.

  test_cases:
    - case_id: "VT-014-TC-001"
      case_name: "Inspect: Patient identifiable data present only in Patient graph"
      priority: "critical"
      preconditions:
        - "Staging Neo4j Patient database has at least one processed synthetic patient"
      test_steps:
        - step_number: 1
          action: "Connect to staging Patient Neo4j database using patient_client credentials and run: MATCH (p:Patient) RETURN p.nhs_number, p.name, p.dob LIMIT 5"
          expected_result: "Patient identifiable fields returned — confirms PII is in the correct graph"
          verification_method: "Inspect query results — confirm nhs_number, name, dob present on Patient nodes"
        - step_number: 2
          action: "Connect to staging Knowledge/Coding Neo4j database using knowledge_client credentials and run: MATCH (n) RETURN keys(n) LIMIT 50"
          expected_result: "No property keys named nhs_number, patient_name, or dob appear"
          verification_method: "Inspect returned property key sets — confirm absence of patient identifiers"
      acceptance_criteria:
        - "PII fields confirmed absent from Coding graph property keys"
        - "Inspection result recorded in evidence bundle with screenshots of query results"

    - case_id: "VT-014-TC-002"
      case_name: "Inspect: Connection credentials enforce graph isolation"
      priority: "critical"
      preconditions:
        - "Two separate Neo4j connection strings configured in Azure Key Vault or env vars"
        - "patient_client bolt URI points to Patient database"
        - "knowledge_client bolt URI points to Knowledge (Coding) database"
      test_steps:
        - step_number: 1
          action: "Review services/api/app/config.py and services/coding_worker/app/pipeline/pipeline_service.py — verify patient_client and knowledge_client are constructed with separate connection URIs"
          expected_result: "Two distinct bolt:// URIs confirmed — isolation is at connection level"
          verification_method: "Code inspection — document URI config keys in evidence"
        - step_number: 2
          action: "In staging, attempt to run a Cypher query against the Patient database using the Knowledge database credentials"
          expected_result: "Authentication failure or empty result — credentials are database-scoped"
          verification_method: "Inspect response — record auth error message in evidence bundle"
      acceptance_criteria:
        - "Separate bolt URIs confirmed in config"
        - "Cross-credential query rejected by Neo4j"

    - case_id: "VT-014-TC-003"
      case_name: "Inspect: Schema constraints enforce allowed node types per graph"
      priority: "high"
      preconditions:
        - "libs/cypher/schema_constraints.py defines PATIENT_GRAPH_CONSTRAINTS and KNOWLEDGE_GRAPH_CONSTRAINTS"
      test_steps:
        - step_number: 1
          action: "Review libs/cypher/schema_constraints.py and list all constraint types applied to each graph"
          expected_result: "Patient graph constraints cover Patient, Encounter nodes; Knowledge graph covers Concept, Domain nodes"
          verification_method: "Code inspection — confirm no Concept/Domain constraints defined for Patient graph"
        - step_number: 2
          action: "In staging, run SHOW CONSTRAINTS on both databases and compare against schema_constraints.py"
          expected_result: "Applied constraints match the constraint definitions in code"
          verification_method: "Record SHOW CONSTRAINTS output in evidence bundle"
      acceptance_criteria:
        - "Schema constraints confirmed applied to correct graphs"
        - "No patient-graph constraints present in Knowledge graph or vice versa"

    - case_id: "VT-014-TC-004"
      case_name: "No reviewer identity in Knowledge Graph"
      priority: "critical"
      preconditions:
        - "Writeback has been run with candidates approved by named reviewers"
        - "Knowledge Graph contains SurfaceForm nodes"
      test_steps:
        - step_number: 1
          action: "Query all SurfaceForm nodes and MAPS_TO relationships in the Knowledge Graph for email-like patterns"
          expected_result: "No email addresses or person names found"
          verification_method: "Assert regex search for email patterns returns zero matches"
        - step_number: 2
          action: "Check approved_by and created_by fields on all SurfaceForm nodes and MAPS_TO relationships"
          expected_result: "All values are process-name source tags (e.g. 'hitl_approved', 'coding_review', 'manual_mapping')"
          verification_method: "Assert no value contains '@' or matches a person-name pattern"
      acceptance_criteria:
        - "No staff personal data stored in the Knowledge Graph"
        - "DPA clause 5.3(d) and clause 6.2 satisfied"
      regulatory_reference: "DC-DPA-002 clauses 5.3(d), 6.2; ICO pseudonymisation guidance"

  pass_fail_criteria:
    pass_threshold: "100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-014/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-014-EXEC-001"
      date: "2026-03-03"
      executor: "quality_engineer"
      environment: "staging"
      result: "pending"
      cases_executed: 0
      cases_passed: 0
      cases_failed: 0
      duration_seconds: 0
      notes: "VT is a staging inspection — requires live Neo4j instances. Pending execution before first clinical deployment. Previous automated_ci entry removed: test_org_context.py does not test cross-database isolation and was an incorrect mapping."
