# -- DI-LEO-AI-203 -- PMHx-aware history-of-cancer detection
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-203"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-005"
    - "UN-LEO-AI-006"
    - "UN-LEO-AI-007"
  requirement: >
    The history-of-cancer detector
    (text_contains_history_of_cancer) SHALL return True for
    any malignancy term that appears under a recognised
    "Past medical history" section header
    ("Past medical history", "Past medical hx", "PMHx",
    "PMH", "Background"). Such mentions are historical
    context, not new diagnoses, and MUST NOT trigger a
    diagnosis anchor or open a fresh cancer pathway.
  rationale: >
    Patient 4643293950 had a community-therapy holistic
    assessment (Dec 2024) listing "Bowel cancer." in a
    bulleted Past medical history block, with no
    accompanying diagnosis date, staging, treatment
    history, or MDT discussion. Without PMHx awareness the
    text classifier emitted a phantom diagnosis anchor and
    closed the open Lower-GI pathway as "completed". The
    only mention of bowel cancer in the patient's record
    was this PMHx line; treating it as a diagnosis silently
    masked the avoidable delay being investigated.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "text_contains_history_of_cancer('Past medical history:\\nBowel cancer.') == True"
      - type: "functional"
        spec: "text_contains_history_of_cancer('PMH: HTN, T2DM, prostate cancer 2018') == True"
      - type: "safety"
        spec: "text_contains_history_of_cancer('Diagnosis: confirmed adenocarcinoma of caecum on biopsy') == False"
    constraints:
      - type: "safety"
        spec: "Section detection MUST be case-insensitive, anchored to start of line, and require a colon delimiter so the prefix 'PMH' inside an unrelated word does not trigger"
    dependencies:
      - "DI-LEO-AI-159"
      - "DI-LEO-AI-172"
    downstream_impacts:
      - "Anchor detector (diagnosis path)"
      - "Episode status (false-positive 'completed' suppression)"
      - "Reviewer trust in 'completed' status"
    technical_details:
      language: "Python"
      framework: "Code inventories (text guard)"
      file_structure:
        - "libs/domains/code_inventories.py"
      estimated_loc: 25

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-196 must pass with 100% on all critical and
      total cases, including the patient 4643293950 PMHx
      regression case.
    test_protocol: "VT-LEO-AI-196"

  safety_class: "B"
  risks:
    - "R-LEO-AI-193"
  tags:
    - "anchor-detector"
    - "diagnosis-classification"
    - "pmhx-guard"
    - "patient-4643293950"
