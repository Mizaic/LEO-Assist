# -- DI-LEO-AI-024 -- NG12 Referral Quality Rules
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-024"
  type: "Functional"
  derived_from: ["UN-LEO-AI-016"]
  requirement: "The system SHALL implement NICE Guideline NG12 cancer referral quality rules that assess two-week-wait referral patterns, match symptom presentations against recommended referral criteria, and identify deviations from NG12 recommendations"
  rationale: "DES paragraph 28 requires explicit expectations around reviewing referral quality against NICE NG12. The NG12 rule set is the launch configuration for cancer referral quality assessment."

  machine_spec:
    agent_prompt: |
      Implement NG12 referral quality rules (~250 LOC).

      SINGLE PURPOSE: Assess cancer referral patterns against NICE NG12
      guideline criteria and identify deviations.

      REQUIREMENTS:
      1. Encode NG12 two-week-wait referral criteria as structured rules
      2. Match patient symptom presentations against NG12 criteria
      3. Identify referrals that deviate from NG12 recommendations
      4. Score referral quality against guideline compliance
      5. Support rule versioning for guideline updates
      6. Generate structured deviation reports per practice

      METHODS:
      - load_ng12_rules(): Load NG12 criteria from configuration
      - assess_referral(referral, symptoms): Check against NG12 criteria
      - detect_deviations(referrals): Identify non-compliant referrals
      - score_compliance(practice_id): Calculate practice-level compliance
      - generate_report(results): Structure findings for output

      CODE CLARITY:
      - Rules are data-driven, not hard-coded logic
      - Each guideline section maps to a testable rule set
      - Clear separation between rule evaluation and reporting

    acceptance_criteria:
      - type: "test"
        spec: "NG12 rules cover >= 95% of guideline sections"
      - type: "test"
        spec: "Referral assessment accuracy >= 90% against validated cases"
      - type: "test"
        spec: "Deviations from NG12 correctly identified and reported"
      - type: "test"
        spec: "Rule versioning supports guideline updates without code changes"

    constraints:
      - type: "safety"
        spec: "No false negatives on urgent referral criteria -- err on side of flagging"
      - type: "regulatory"
        spec: "Rule set must align with current published NG12 guideline version"

    dependencies: []

    downstream_impacts:
      - "services/analysis_worker -- NG12 rules used by safety net analyser"
      - "services/analytics_api -- referral quality metrics served to dashboard"

    technical_details:
      language: "Python"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/safety_net_detector.py"
        - "libs/domains/ncda_concept_sets.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "NG12 rules cover >= 95% of guideline sections; referral assessment accuracy >= 90%"
    test_protocol: "VT-LEO-AI-024"

  safety_class: "B"
  risks: ["R-LEO-AI-023"]
  tags: ["ng12", "cancer-referral", "guideline-rules", "des-paragraph-28"]
