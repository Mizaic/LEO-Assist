- id: "VT-LEO-AI-081"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-081"]
    risks: ["R-LEO-AI-055"]

  metadata:
    title: "Ambiguous Abbreviation Disambiguation - Extraction, Escalation, and Resolver"
    description: >
      Verifies that (1) the resolver blocklist suppresses biochemistry NAD concepts,
      (2) the extraction prompt rules for CA and MSK are present and correctly worded,
      (3) the escalation prompt rules are consistent with the extraction prompt
      (dual-path parity), and (4) the 40 approved abbreviation surface forms resolve
      at the expected concepts via the terminology client.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_abbreviation_disambiguation.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Terminology server running at http://localhost:8001"
      - "SERVICE_AUTH_SECRET available via Key Vault or env"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-081-TC-001"
      case_name: "NAD blocklist suppresses nicotinamide adenine dinucleotide substance concept"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise('nad', [mock_result_131143000, mock_result_281900007])"
          expected_result: "131143000 removed; 281900007 retained"
          verification_method: "automated"
      acceptance_criteria:
        - "Concept ID 131143000 absent from return value"
        - "Concept ID 281900007 present in return value if supplied"

    - case_id: "VT-081-TC-002"
      case_name: "NAD blocklist suppresses glutamate dehydrogenase NAD procedure concept"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise('nad', [mock_result_104695007])"
          expected_result: "Empty list returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Concept ID 104695007 absent from return value"

    - case_id: "VT-081-TC-003"
      case_name: "NAD blocklist suppresses NAD kinase deficiency disorder concept"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise('nad', [mock_result_124316006])"
          expected_result: "Empty list returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Concept ID 124316006 absent from return value"

    - case_id: "VT-081-TC-004"
      case_name: "NAD blocklist applies to both ResolvedTerm objects and raw dicts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise('NAD', [ResolvedTerm(concept_id='131143000',...)])"
          expected_result: "ResolvedTerm with concept_id 131143000 removed"
          verification_method: "automated"
        - step_number: 2
          action: "Call _filter_abbrev_noise('NAD', [{'snomed_concept_id': '131143000'}])"
          expected_result: "Dict with snomed_concept_id 131143000 removed"
          verification_method: "automated"
      acceptance_criteria:
        - "Blocklist applies to ResolvedTerm objects via .concept_id"
        - "Blocklist applies to raw dicts via snomed_concept_id key"

    - case_id: "VT-081-TC-005"
      case_name: "NAD blocklist case-insensitive - mixed case variants all blocked"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise for 'NAD', 'Nad', 'nAD' with biochem concept"
          expected_result: "All blocked regardless of input case"
          verification_method: "automated"
      acceptance_criteria:
        - "All case variants block concept 131143000"

    - case_id: "VT-081-TC-006"
      case_name: "Non-blocked terms pass through filter unchanged"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call _filter_abbrev_noise('htn', [mock_result_38341003]) - HTN is not in blocklist"
          expected_result: "Full list returned unchanged"
          verification_method: "automated"
      acceptance_criteria:
        - "List length unchanged when term not in _ABBREV_BLOCKED_CONCEPTS"

    - case_id: "VT-081-TC-007"
      case_name: "Extraction prompt contains CA disambiguation rule"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Import EXTRACTION_SYSTEM_V1 from libs.prompts.extraction_v1"
          expected_result: "Prompt contains 'CA' rule in DO NOT EXTRACT section"
          verification_method: "automated"
      acceptance_criteria:
        - "String 'CA' and 'organ' and 'body site' all present in EXTRACTION_SYSTEM_V1"
        - "String 'leave uncoded' or 'not extract' present near CA rule"

    - case_id: "VT-081-TC-008"
      case_name: "Extraction prompt contains MSK disambiguation rule"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Import EXTRACTION_SYSTEM_V1 and check for MSK specialty tag rule"
          expected_result: "Prompt contains MSK rule directing extraction of symptom not MSK itself"
          verification_method: "automated"
      acceptance_criteria:
        - "String 'MSK' and 'specialty' and 'category' present in EXTRACTION_SYSTEM_V1"

    - case_id: "VT-081-TC-009"
      case_name: "Extraction prompt NAD disambiguation note present"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Check EXTRACTION_SYSTEM_V1 for NAD disambiguation note"
          expected_result: "Prompt states NAD = no abnormality detected, never biochemistry"
          verification_method: "automated"
      acceptance_criteria:
        - "String 'nicotinamide' present in EXTRACTION_SYSTEM_V1"
        - "String 'no abnormality detected' present near NAD entry"

    - case_id: "VT-081-TC-010"
      case_name: "Escalation prompt CA/MSK/NAD rules present (dual-path parity)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Import _CANDIDATES_SYSTEM from libs.llm_client.escalation"
          expected_result: "CA, MSK, NAD rules present in _CANDIDATES_SYSTEM"
          verification_method: "automated"
      acceptance_criteria:
        - "String 'CA without' or 'CA alone' present in _CANDIDATES_SYSTEM"
        - "String 'MSK alone' or 'specialty tag' present in _CANDIDATES_SYSTEM"
        - "String 'nicotinamide' present in _CANDIDATES_SYSTEM"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-081/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-081-RUN-001"
      date: "2026-04-04"
      executor: "automated"
      environment: "development"
      result: "pass"
      tests_run: 28
      tests_passed: 28
      tests_failed: 0
      notes: >
        All 28 test cases passed. NAD biochemistry blocklist (3 concept IDs)
        suppresses correctly for ResolvedTerm objects and raw dicts, case-
        insensitive. CA and MSK rules verified in both extraction prompt and
        escalation prompt (_CANDIDATES_SYSTEM). Dual-path parity confirmed.
    - run_id: "VT-081-RUN-002"
      date: "2026-04-04"
      executor: "automated"
      environment: "development"
      result: "pass"
      tests_run: 33
      tests_passed: 33
      tests_failed: 0
      notes: >
        Test suite updated (5 additional tests) and re-run after NAD policy
        change: NAD moved from biochemistry-concept blocklist to
        _ALWAYS_IGNORE_TERMS -- all resolver output suppressed regardless of
        concept ID (including 281900007 No abnormality detected). Reason:
        clinical review identified NAD is also commonly used for 'No apparent
        distress' with no SNOMED equivalent; ambiguity cannot be resolved from
        the abbreviation alone. Extraction and escalation prompts updated to
        instruct LLM not to extract or code NAD, directing reviewers to code
        manually. All 33 tests passed.
