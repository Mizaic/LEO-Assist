# -- DI-LEO-AI-502 -- Episode Engine: Classifier Agent
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-502"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-090"
  requirement: >
    The classifier agent SHALL label each CandidateWindow produced by
    the segmenter with an ``episode_type`` from the closed vocabulary
    {cancer, multi_site, benign, non_cancer, uncertain}, a
    ``confidence`` in [0.0, 1.0], and a ``reasoning`` string. The agent
    SHALL run once per window with a Bedrock Haiku call and a forced
    ``submit_classification`` tool. Pydantic SHALL reject any other
    episode_type literal or a confidence outside [0.0, 1.0]. Windows
    classified below the configured ``_CLASSIFIER_MIN_CONFIDENCE``
    (0.4) SHALL be dropped before the milestone extraction stage.
  rationale: >
    Most candidate windows are NOT cancer (benign biopsy follow-ups,
    routine reviews, non-cancer pathology). Sending every window to
    the milestone extractor would burn tokens and risk hallucinating
    cancer milestones in benign windows. The classifier acts as a
    cheap filter and, equally important, as a confidence gate so the
    chain knows when to flag a window for human review rather than
    silently extracting noise.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "submit_classification tool MUST be forced via toolChoice."
      - type: "functional"
        spec: "Valid responses parse into ClassifierResult with literal episode_type."
      - type: "functional"
        spec: "When window_end is None the user prompt substitutes 'open' so the LLM is not asked about a null date."
      - type: "safety"
        spec: "An invented episode_type literal MUST raise StageError."
      - type: "safety"
        spec: "Confidence outside [0, 1] MUST raise StageError."
      - type: "safety"
        spec: "Windows with confidence below 0.4 MUST be skipped by the milestone extractor (chain-level guard)."
      - type: "performance"
        spec: "Per-window input tokens MUST stay under 12,000 on cohort-typical windows."
    constraints:
      - type: "safety"
        spec: "Classifier output MUST NOT extract milestones; that is delegated to the milestone extractor stage."
    dependencies:
      - "DI-LEO-AI-501"
    downstream_impacts:
      - "Milestone extractor only sees cancer/multi_site/benign windows"
      - "Reconciler uses classifier_confidence as a tie-break input"
    technical_details:
      language: "Python"
      framework: "libs.llm_client.factory.LLMClient (Bedrock) + Pydantic"
      file_structure:
        - "services/analysis_worker/app/episode_engine/agents/classifier.py"
        - "libs/prompts/episode_engine/classifier_v1.py"
      estimated_loc: 130

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-502 must pass on all critical and total cases:
      cancer-verdict parse, open-window prompt substitution, unknown
      episode_type rejection, and out-of-range confidence rejection.
    test_protocol: "VT-LEO-AI-502"

  safety_class: "B"
  risks:
    - "R-LEO-AI-502"
  tags:
    - "episode-engine"
    - "classifier"
    - "haiku"
    - "confidence-gate"
