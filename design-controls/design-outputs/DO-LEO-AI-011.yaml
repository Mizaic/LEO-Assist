# -- DO-LEO-AI-011 -- Pipeline Orchestration Service
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-011"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-018", "DI-LEO-AI-019"]
    user_needs: ["UN-LEO-AI-012"]
    risks_addressed: ["R-LEO-AI-015"]
    verification_tests: ["VT-LEO-AI-011"]
    validation_tests: []

  specification:
    title: "Pipeline Orchestration Service"
    description: |
      Orchestrates the end-to-end clinical coding and analysis pipeline.
      Manages job lifecycle from submission through coding, analysis, and
      completion. Dispatches work to coding and analysis workers via the
      message bus, tracks job progress, and handles retries and failures.
    purpose: "Coordinate the multi-stage pipeline so jobs flow reliably from submission to completion with full observability"
    technical_approach: "REST API for job submission, Azure Service Bus for async worker dispatch, state tracking in data store, and idempotent job handlers in each worker"
    acceptance_criteria:
      - criterion: "Jobs complete end-to-end without data loss"
        type: "functional"
        measurement: "Integration test with full pipeline execution"
        target: "100% of submitted jobs reach terminal state"
      - criterion: "Failed jobs are retried with backoff"
        type: "functional"
        measurement: "Fault injection tests"
        target: "Transient failures retried up to 3 times"
      - criterion: "Pipeline throughput meets target"
        type: "performance"
        measurement: "Load test with concurrent jobs"
        target: ">= 10 concurrent jobs without degradation"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/pipeline_worker/"
        description: "Unified pipeline worker service"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/"
        description: "Pipeline graph definitions and execution"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/workflow/"
        description: "Workflow orchestration utilities"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/services/pipeline_service.py"
        description: "Pipeline orchestration and job lifecycle management"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/pipeline.py"
        description: "REST API endpoints for pipeline job submission and status"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/message_bus/factory.py"
        description: "Message bus factory for Service Bus adapter creation"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Job completion guarantee", "Message delivery reliability"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed across core-api, coding-worker, and analysis-worker containers via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-018 and DI-LEO-AI-019"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["pipeline", "orchestration", "message-bus", "jobs"]
    priority: "high"
    complexity: "complex"
