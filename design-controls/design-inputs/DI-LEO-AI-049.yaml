# -- DI-LEO-AI-049 -- Surface Form Management and Curation API
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-049"
  type: "Functional"
  derived_from: ["DI-LEO-AI-035", "DI-LEO-AI-033"]
  requirement: >
    The terminology API SHALL expose a surface form management API enabling
    authorised administrators to:
    (a) Browse all SurfaceForm nodes grouped by SNOMED concept, with
        pagination and full-text search across form text, concept name,
        SNOMED concept ID, and Read code.
    (b) Browse surface forms as a flat paginated list, optionally filtered
        by concept ID.
    (c) Add a new SurfaceForm → Concept mapping (upsert-mapping), creating
        the SurfaceForm node if it does not exist.
    (d) Delete an individual surface form (removes the node entirely) or a
        specific MAPS_TO relationship to a named concept, or keep a single
        named concept and remove all other MAPS_TO relationships.
    (e) Audit surface forms with multiple MAPS_TO relationships (duplicates)
        and auto-resolve duplicates by retaining the highest-confidence
        mapping per surface form.
    All mutation endpoints SHALL be accessible only to authenticated users
    with appropriate role; the UI enforces confirmation dialogs before
    destructive operations.
  rationale: >
    Surface forms are the text strings the NER pipeline matches against
    clinical text to identify SNOMED concepts.  Spurious, over-broad, or
    duplicated surface form mappings cause false-positive coding that flows
    into the HITL review queue or, in autonomous mode, into auto-coded
    encounters.  Administrators require a curated management interface to
    correct mappings written by the learning loop or to remove terminology
    that has been found to cause systematic mis-coding.  This is a
    complementary control to the writeback learning loop (DI-LEO-AI-035)
    and the three-tier safety gate (DI-LEO-AI-038): accurate surface form
    coverage improves Tier 1 coding precision; spurious coverage degrades it.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "GET /terminology/surface-forms/grouped returns items grouped by concept_id with concept_fsn, semantic_tag, read_code, icd10, and surface_forms array"
      - type: "functional"
        spec: "GET /terminology/surface-forms/grouped supports q, limit, offset query parameters"
      - type: "functional"
        spec: "GET /terminology/surface-forms returns flat paginated list with total count"
      - type: "functional"
        spec: "POST /terminology/surface-forms/upsert-mapping creates or updates a SurfaceForm node and MAPS_TO relationship"
      - type: "functional"
        spec: "DELETE /terminology/surface-forms/{normalized} with no params deletes the node entirely (DETACH DELETE)"
      - type: "functional"
        spec: "DELETE /terminology/surface-forms/{normalized}?concept_id=X removes only the MAPS_TO relationship to concept X"
      - type: "functional"
        spec: "DELETE /terminology/surface-forms/{normalized}?keep_concept_id=X removes all MAPS_TO relationships except to concept X"
      - type: "functional"
        spec: "GET /terminology/surface-forms/duplicates returns surface forms with more than one MAPS_TO relationship"
      - type: "functional"
        spec: "POST /terminology/surface-forms/deduplicate retains the highest-confidence MAPS_TO per surface form and removes the rest; returns count of removed relationships"
      - type: "safety"
        spec: "Pending surface forms that are deleted no longer appear in coding resolution queries"
      - type: "safety"
        spec: "Deduplicate retains the highest-confidence mapping; ties result in at most one mapping retained (arbitrary but deterministic)"

    constraints:
      - type: "safety"
        spec: >
          Deletions affect future NER resolution only — they do not modify
          existing coded encounters or CodingReview nodes.
      - type: "safety"
        spec: >
          The deduplication Cypher query MUST evaluate confidence before
          deleting; it MUST NOT delete mappings when confidence values are
          equal (one is retained arbitrarily to avoid ambiguous state).
      - type: "auditability"
        spec: >
          All upsert-mapping calls MUST record created_by, created_at,
          source, and provenance on the SurfaceForm node and MAPS_TO
          relationship.

    dependencies: ["DI-LEO-AI-035", "DI-LEO-AI-033"]

    downstream_impacts:
      - "NER pipeline surface form resolution accuracy"
      - "Tier 1 coding precision (surface form approval status affects tier)"
      - "HITL review queue volume"
      - "Autonomous coding mode false positive rate"

    technical_details:
      language: "Python"
      framework: "FastAPI / Neo4j"
      file_structure:
        - "services/terminology_api/app/routers/surface_forms.py"
        - "services/terminology_api/app/queries/terminology.py"
        - "services/terminology_api/app/main.py"
        - "services/terminology_api/app/routers/__init__.py"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All CRUD operations verified against a seeded test graph: grouped list,
      flat list, upsert, delete (node), delete (single mapping), keep-mapping,
      duplicate audit, deduplication.  Deduplication retains correct mapping
      and count matches expected removals.
    test_protocol: "VT-LEO-AI-043"

  safety_class: "B"
  risks: ["R-LEO-AI-005", "R-LEO-AI-034"]
  tags:
    - "terminology"
    - "surface-forms"
    - "curation"
    - "ner-accuracy"
    - "deduplication"
    - "admin-api"
