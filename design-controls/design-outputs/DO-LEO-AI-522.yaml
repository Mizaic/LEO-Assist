  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Reduce prompt MUST NOT introduce new facts, MUST preserve dates / meds / values verbatim, MAY only dedupe literal duplicates"
      - "Deterministic stitch fallback (DO-LEO-AI-521) bounds the worst case if the editor LLM itself fails or hallucinates -- the stitched output is then a faithful concatenation of the per-part markdowns"
    risk_control_measures:
      - "System prompt explicitly tells the model it is an editor and not a clinician"
      - "No-new-facts and preserve-verbatim rules are stated as HARD RULES in the system message"
      - "Reduce is gated on all-MAP-succeeded so a single failed MAP cannot poison the merged narrative"
      - "Reduce invocation count is asserted in unit tests (must be exactly 1 per multi-part successful run)"

  verification_status:
