# -- DI-LEO-AI-167 -- Replay engine, post-compile gate and Clinical Guidelines surfacing
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-167"
  type: "Functional"
  derived_from: ["UN-LEO-AI-076"]
  requirement: >
    The system SHALL replay every saved test patient against the live
    appropriateness ruleset, diff each EXPECTED_RESULT snapshot against
    the fresh evaluation, and surface a {passes, regressions, drift,
    unexpected_matches} report on the Clinical Guidelines page. The
    ruleset compiler in the terminology service SHALL trigger this
    replay automatically after a successful compile, persist the
    report as a :RulesetReplay node, and the EditRuleDialog SHALL
    re-run a rule-scoped replay whenever the reviewer edits a logic
    tree, with a regression banner blocking unaware saves.
  rationale: >
    Persisted test patients are only useful if they are replayed at
    the moment of risk -- when a reviewer edits a rule, when a deploy
    rebuilds the ruleset, or when a scheduled rebuild swaps the
    bitmap version. Surfacing the latest replay on the same Clinical
    Guidelines page that drives the deploy collapses the feedback
    loop from "wait for downstream tests" to "see the regression
    before you click save". Persisting the report against the
    ruleset_version gives QA an immutable record of how each ruleset
    version behaved on a stable cohort.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "diff_replay(expectations, current_matches) buckets each asserted rule into passes (expected_fires == actual_fires) or regressions (expected_fires != actual_fires) and lists every current match not in the asserted set as unexpected_matches."
      - type: "functional"
        spec: "POST /guidance/test-patients/replay accepts {patient_ids?, guideline_id?, scope_type, scope_id, ruleset_version?, persist_report} and returns the diff per patient plus aggregate {passes_count, regressions_count, drift_count, patient_count}."
      - type: "functional"
        spec: "When persist_report=True the replay writes a :RulesetReplay node carrying ruleset_version, scope_type, scope_id, guideline_id, regressions_count, passes_count, drift_count, total_count and the full report_json."
      - type: "functional"
        spec: "After a successful guideline compile the terminology API POSTs to /guidance/test-patients/replay with the new ruleset_version; failures are logged but do not roll back the compile (the report is the regression signal, not the compile)."
      - type: "functional"
        spec: "BitmapLifecycleSection on the Clinical Guidelines page reads the latest :RulesetReplay for the active scope and shows a coloured banner with regressions / passes / patient counts and a link to the test-patient library."
      - type: "functional"
        spec: "TestPatientsPanel inside EditRuleDialog re-replays patients scoped to the rule whenever the rule's logic-tree signature changes and shows a regression banner with the affected rule names, written in plain English (reading age 9-11)."
    constraints:
      - type: "safety"
        spec: "Auto-replay must not block the compile; transient HTTP errors against the core API are logged at WARNING and the compile reports success without a fresh report so deploys are never silently held."
    dependencies:
      - "DI-LEO-AI-165"
      - "DI-LEO-AI-166"
    downstream_impacts:
      - "Clinical Guidelines page (BitmapLifecycleSection, EditRuleDialog)"
      - "Terminology API guideline compile background task"
      - "Knowledge Graph :RulesetReplay storage"
    technical_details:
      language: "Python, TypeScript"
      framework: "FastAPI, httpx, Next.js 14, MUI"
      file_structure:
        - "services/api/app/services/test_patient_service.py"
        - "services/terminology_api/app/routers/guidelines.py"
        - "services/ui/src/app/admin/guidance/BitmapLifecycleSection.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/TestPatientsPanel.tsx"
        - "services/ui/src/app/admin/guidance/test-patients/page.tsx"
        - "services/ui/src/app/admin/guidance/test-patients/ReplayResultsDialog.tsx"
      estimated_loc: 950

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-164 covers diff_replay bucketing and report persistence,
      VT-LEO-AI-166 covers the UI library page, ReplayResultsDialog and
      EditRuleDialog auto-replay banner.
    test_protocol: "VT-LEO-AI-166"

  safety_class: "B"
  risks:
    - "R-LEO-AI-166"
  tags:
    - "test-patients"
    - "replay"
    - "bitmap-engine"
    - "regression-testing"
    - "appropriateness-rules"
