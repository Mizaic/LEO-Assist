# -- DI-LEO-AI-092 -- Mission Control Frontend UI
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-092"
  type: "Usability"
  derived_from: ["UN-LEO-AI-058"]
  requirement: >
    The system SHALL replace the /care/patients page with a Clinical Audit
    Mission Control interface comprising: (1) a Command Bar with date range,
    org scope, pathway filter, sub-filters, and review status toggle;
    (2) a KPI Strip showing 6 summary metrics; (3) a server-paginated
    Patient Case Table with expandable rows showing inline episode timelines;
    (4) a Patient Detail Drawer with tabs for Overview (visual timeline),
    Coded Data (SNOMED table), Encounter Text (raw vs coded side-by-side),
    and Audit Trail; and (5) Review Actions panel allowing mark-as-reviewed,
    notes, flag, and status override. All status labels and pathway names
    SHALL use plain English at reading age 11 or below.
  rationale: >
    Cancer auditors validating the pipeline before clinical decisions need
    progressive disclosure from aggregate KPIs down to raw encounter text.
    The interface must be learnable without training by clinical staff at
    all levels of digital literacy. Plain English labels reduce the risk of
    misinterpretation. The episode timeline makes pathway delays immediately
    visible without the auditor needing to calculate intervals manually.

  machine_spec:
  acceptance_criteria:
    - type: "usability"
      spec: "All pathway status labels use plain English: 'Confirmed cancer', 'No cancer found', 'No diagnosis after wait', 'Specialist seen, no diagnosis', 'Duplicate pathway closed', 'Still being investigated'"
    - type: "functional"
      spec: "Command Bar renders date range presets (UK tax year chips), org scope selector, pathway toggle, contextual sub-filter chips, review status toggle, Go and Clear all buttons"
    - type: "functional"
      spec: "KPI Strip renders 6 metric cards; cards update within 2 seconds after applying filters; time-to-diagnosis card uses green/amber/red colour thresholds (<=28/<=62/>62 days)"
    - type: "functional"
      spec: "Patient Case Table renders server-paginated rows (25/50/100 per page); rows are sortable by column header; default sort is unreviewed first then referral date descending"
    - type: "functional"
      spec: "Expanding a table row renders an inline EpisodeTimeline component with milestone nodes, interval labels, and colour-coded segments"
    - type: "functional"
      spec: "Clicking a patient row opens the Patient Detail Drawer with four tabs; Overview tab shows demographics, episode card, timeline, and Review Actions; Coded Data tab shows SNOMED concept table; Encounter Text tab shows raw text with entity highlights; Audit Trail tab shows review history"
    - type: "functional"
      spec: "Review Actions panel: Mark as reviewed writes to PATCH /review; notes field stores free text; Flag toggle sets audit_flag; Override status uses ConfirmDialog before sending PATCH /status"
    - type: "functional"
      spec: "Mission Control reads URL search params on mount and applies them as initial filter state (enables audit page deep-links)"
    - type: "safety"
      spec: "Override status action requires explicit confirmation via ConfirmDialog before the API call is made"

  constraints:
    - type: "safety"
      spec: "Plain English labels MUST map to correct database status values in all API calls; there MUST be a single source of truth mapping in pathwayLabels.ts"
    - type: "usability"
      spec: "No clinical jargon acronyms (SNOMED, TNM, ICD) SHALL appear in patient-facing labels without a plain English explanation alongside"

  dependencies: ["DI-LEO-AI-091"]
  downstream_impacts:
    - "Audit page deep-link integration"
    - "AppShell navigation wiring"

  technical_details:
    language: "TypeScript"
    framework: "Next.js / MUI"
    file_structure:
      - "services/ui/src/components/mission-control/MissionControl.tsx"
      - "services/ui/src/components/mission-control/CommandBar.tsx"
      - "services/ui/src/components/mission-control/KPIStrip.tsx"
      - "services/ui/src/components/mission-control/PatientCaseTable.tsx"
      - "services/ui/src/components/mission-control/PatientCaseRow.tsx"
      - "services/ui/src/components/mission-control/EpisodeTimeline.tsx"
      - "services/ui/src/components/mission-control/PatientDetailDrawer.tsx"
      - "services/ui/src/components/mission-control/OverviewTab.tsx"
      - "services/ui/src/components/mission-control/CodedDataTab.tsx"
      - "services/ui/src/components/mission-control/EncounterTextTab.tsx"
      - "services/ui/src/components/mission-control/AuditTrailTab.tsx"
      - "services/ui/src/components/mission-control/ReviewActionsPanel.tsx"
      - "services/ui/src/components/mission-control/StatusBadge.tsx"
      - "services/ui/src/components/mission-control/PathwayFilterChips.tsx"
      - "services/ui/src/lib/missionControlApi.ts"
      - "services/ui/src/lib/missionControlFilters.ts"
      - "services/ui/src/lib/pathwayLabels.ts"
      - "services/ui/src/app/care/patients/page.tsx"
    estimated_loc: 1200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-092 pass: filter serialisation,
      plain English label mapping, KPI colour thresholds, timeline
      rendering, review action API calls, confirm dialog on override,
      and URL param initialisation.
    test_protocol: "VT-LEO-AI-092"

  safety_class: "B"
  risks: ["R-LEO-AI-065"]
  tags: ["mission-control", "ui", "audit", "cancer-pathway", "case-management"]
