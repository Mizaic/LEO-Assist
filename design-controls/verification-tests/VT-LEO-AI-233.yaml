# -- VT-LEO-AI-233 -- GuidelinePicker primitive + Concern field
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-233"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-233"]
    risks: ["R-LEO-AI-185"]

  metadata:
    title: "GuidelinePicker Autocomplete + Concern field 500-char cap + orchestrator forwarding"
    description: >
      Jest static-source layer pins the Autocomplete multi-select
      contract, the loader URL (/api/nice/loaded), the
      'Use all loaded' shortcut, and the Concern textarea
      maxLength=500 + visible counter. Pytest layer covers the
      Pydantic 500-char cap, the orchestrator forwarding of
      payload.concern into extra_context, and the empty-concern
      passthrough.
    test_level: "system"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest + pytest"
    test_file_paths:
      - "services/ui/src/__tests__/guideline-picker-chrome.test.tsx"
      - "services/ui/src/__tests__/sbar-playground-concern.test.tsx"
      - "tests/test_sbar_concern_forwarding.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node 20+ / jest 30 / @testing-library/react / user-event"
      - "Python 3.11+ / pytest / pytest-asyncio"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-233-TC-001"
      case_name: "GuidelinePicker is an MUI Autocomplete with multiple=true loaded from /api/nice/loaded"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source: assert GuidelinePicker.tsx contains 'multiple' on Autocomplete and the default loader URL is /api/nice/loaded"
          expected_result: "Both assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Picker reuses the same data source as LoadedGuidelinesPanel"

    - case_id: "VT-233-TC-002"
      case_name: "'Use all loaded' shortcut button is wired up in the source"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Static-source: assert GuidelinePicker.tsx contains the 'Use all loaded' label and the data-testid 'guideline-picker-toggle-all', and emits codes (string[]) via onChange(next.map((g) => g.code))"
          expected_result: "Both markers and the emitter present"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer can express 'every loaded guideline' in one click"

    - case_id: "VT-233-TC-003"
      case_name: "Concern textarea has maxLength=500 and a visible counter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: assert SbarPlayground.tsx textarea has maxLength=500 and renders the count"
          expected_result: "Both present"
          verification_method: "automated"
      acceptance_criteria:
        - "UI side of the two-sided 500-char cap"

    - case_id: "VT-233-TC-004"
      case_name: "SBARRequestPayload.concern rejects strings longer than 500 chars"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pytest: build a payload with concern='x'*501 and call model_validate"
          expected_result: "ValidationError raised"
          verification_method: "automated"
      acceptance_criteria:
        - "Pydantic side of the two-sided cap"

    - case_id: "VT-233-TC-005"
      case_name: "Orchestrator forwards payload.concern into the Situation extra_context"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pytest: spy on the situation_caller; run a payload with concern='breathless and oxygen has dropped'"
          expected_result: "spy received extra_context={'guideline_ids': [...], 'concern': 'breathless and oxygen has dropped'}"
          verification_method: "automated"
      acceptance_criteria:
        - "QSIR-aligned framing reaches the LLM"

    - case_id: "VT-233-TC-006"
      case_name: "Empty / whitespace-only concern is forwarded as None"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Pytest: run with concern='' and concern='   '"
          expected_result: "extra_context['concern'] is None in both cases"
          verification_method: "automated"
      acceptance_criteria:
        - "Whitespace does not become a meaningless prompt fragment"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-233/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-LEO-AI-233-2026-04-18"
      executed_at: "2026-04-18T00:00:00Z"
      executed_by: "automated"
      result: "pass"
      environment: "developer-laptop"
      notes: >
        Jest run: 7 cases in guideline-picker-chrome.test.tsx (4) and
        sbar-playground-concern.test.tsx (3). Pytest run: 5 cases in
        tests/test_sbar_concern_forwarding.py (cap, forwarding,
        empty / whitespace passthrough). All passed.
