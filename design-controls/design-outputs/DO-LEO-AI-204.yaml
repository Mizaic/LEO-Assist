  specification:
    title: "Exclusive encounter claiming via BuildContext.claimed_encounters + _filter_unclaimed_link_groups"
    description: |
      Two coordinated changes to the episode builder:

        1. BuildContext (_types.py) gains a
           ``claimed_encounters: set[str]`` field
           (default_factory=set) that tracks every
           encounter id already attached to an episode in
           the current build.

        2. _filter_unclaimed_link_groups(link_groups,
           claimed, protected_milestones=("referral",)) is
           called by both _build_closed_episode and
           _build_open_episode immediately before
           _link_encounters_to_episode. It:
             - drops anchors whose encounter_id is already
               in ``claimed`` for non-referral milestones,
             - keeps referral milestones unconditionally
               (referral is the episode identity),
             - removes link groups that become empty after
               filtering,
             - updates ``claimed`` in-place so subsequent
               episodes within the same build see the new
               attributions.

    acceptance_criteria:
      - criterion: "filter_drops_already_claimed_non_referral_encounter"
        type: "functional"
        measurement: "Test"
        target: "_filter_unclaimed_link_groups removes anchors whose encounter_id is in the claimed set for non-referral milestones"
      - criterion: "filter_drops_empty_non_referral_groups"
        type: "functional"
        measurement: "Test"
        target: "_filter_unclaimed_link_groups removes link groups that become empty after filtering"
      - criterion: "referral_milestone_is_protected"
        type: "safety"
        measurement: "Test"
        target: "Referral encounters are kept even when the encounter_id is already in the claimed set"
      - criterion: "filter_passes_through_when_no_claims"
        type: "functional"
        measurement: "Test"
        target: "Empty claimed set returns the input link_groups unchanged"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_types.py"
        description: "BuildContext.claimed_encounters: set[str] = field(default_factory=set)"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        description: "_filter_unclaimed_link_groups; integration in _build_closed_episode (~line 593) and _build_open_episode (~line 794)"
      - artifact_type: "test_code"
        location: "tests/test_patient_4643293950_patterns.py"
        description: "TestPatternFExclusiveEncounterClaiming"
    storage_location: "git"
    technical_details:
