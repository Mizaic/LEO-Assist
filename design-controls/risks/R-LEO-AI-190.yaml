# -- R-LEO-AI-190 -- Phantom non-site-specific cancer pathway misclassification
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-190"
  title: "Phantom or false-positive non-site-specific (NSS) cancer pathway opens for non-NSS encounters"

  hazard:
    description: >
      The episode builder may classify an EpisodeOfCare as
      cancer_type='non_site_specific' for an encounter that does
      not represent an NHS NSS pathway -- for example because the
      text contains the substring 'fast' (matching 'fasting
      bloods'), generic cancer words ('carcinoma', 'cancer'),
      a non-cancer PRISM proforma, or a Read code (XaMeD, XaPyS)
      that was incorrectly mapped to NSS.
    category: "clinical_safety"

  hazardous_situation: >
    A clinical reviewer using the operations / pathway dashboard
    sees an EpisodeOfCare flagged as a non-site-specific 2WW
    pathway for a patient who has no NSS referral. The reviewer
    either (a) wastes time investigating a phantom pathway,
    (b) loses trust in the queue and starts ignoring NSS items
    so a real NSS pathway is missed, or (c) assigns the patient
    to the wrong specialty workflow.

  harm:
    description: >
      Delayed or missed cancer diagnosis from reviewer fatigue
      / loss of trust in NSS triage, or wasted clinical time
      that displaces real safety review.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 3
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Strict NSS classification rule (DI-LEO-AI-200): only
        classify cancer_type='non_site_specific' when (a) the
        text matches an explicit, word-boundary NSS surface form
        (_NSS_PHRASE_RE) covering the full SNOMED guideline
        synonym list for concept 1556551000000104, OR (b) the
        SNOMED concept_id / Read code is one of the canonical
        NSS pathway codes (1556551000000104 / 382761000000101 /
        XaPyg). Generic cancer terms without a recognisable site
        return 'unknown' so the encounter can be absorbed into
        a typed pathway.
      implemented_by:
        - "DI-LEO-AI-200"
      verified_by:
        - "VT-LEO-AI-193"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Read-code map corrections (XaMeD -> childrens_tumour,
        XaMeL -> testicular, XaPyS -> childrens_tumour) prevent
        three known sources of non-NSS-to-NSS misclassification.
      implemented_by:
        - "DI-LEO-AI-200"
      verified_by:
        - "VT-LEO-AI-193"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Coordinated with DI-LEO-AI-196 NSS-absorption: any
        residual 'unknown' open-group is folded into a temporally-
        overlapping typed open- or closed-group rather than
        opening a phantom NSS pathway.
      implemented_by:
        - "DI-LEO-AI-196"
        - "DI-LEO-AI-200"
      verified_by:
        - "VT-LEO-AI-193"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Post-fix the live cohort contains zero EpisodeOfCare nodes
      with cancer_type='non_site_specific' (down from 48 phantom
      / misclassified episodes pre-fix). The only path that can
      now classify as NSS is an explicit, validated SNOMED /
      Read code or a phrase from the SNOMED 1556551000000104
      guideline synonym list. Unit tests (VT-LEO-AI-193) cover
      both positive and negative cases including the previously-
      observed false-positive triggers (fasting, PRISM pathway
      names, generic carcinoma text, children's tumour codes).

  monitoring:
    monitoring_plan: >
      Include a recurring DQ check that counts EpisodeOfCare
      nodes with cancer_type='non_site_specific' broken down by
      source signal (NSS phrase match vs explicit code) so any
      future regression that re-introduces a generic-term or
      substring fallback is detected immediately.
    metrics:
      - "Count of active (non-merged) NSS EpisodeOfCare nodes per cohort run"
      - "Ratio of NSS episodes whose source encounter contains an explicit NSS surface form or NSS SNOMED/Read code (must be 100%)"
    review_frequency: "Each rebuild"

  metadata:
    identified_by: "Patient 6519337463 investigation -- single 'unknown cancer type' phantom pathway expanded to a cohort-wide audit revealing 48 misclassified NSS episodes"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "episode-builder"
      - "cancer-type-classification"
      - "nss"
      - "ncda-pathway"
