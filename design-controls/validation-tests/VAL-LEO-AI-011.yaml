# -- VAL-LEO-AI-011 -- Guideline Deviation Alert Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-011"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs: ["UN-LEO-AI-004"]
    design_inputs: ["DI-LEO-AI-008"]
    risks: ["R-LEO-AI-023", "R-LEO-AI-025"]
    verification_tests: ["VT-LEO-AI-006"]

  metadata:
    title: "Guideline Deviation Alert Validation"
    validation_phase: "beta"
    test_type: "user_acceptance"
    automation_level: "manual"
    participants:
      user_type: "clinical_audit_team"
      count: 5
      selection_criteria: "Experienced clinical auditors with knowledge of NICE NG12 and cancer referral pathways"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "Verification test VT-LEO-AI-006 passed"
      - "NICE NG12 guideline rule set loaded in programme configuration"
      - "Synthetic patient data set with known guideline-compliant and non-compliant pathways"
      - "Audit team members trained on LEO-AI review interface"
    infrastructure: "Azure Container Apps staging environment with production-equivalent analysis worker"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Guideline deviation alerts match expert clinical judgement"
      user_role: "Clinical Audit Team Member"
      user_goal: "Confirm that system-generated guideline deviation alerts agree with expert manual review"
      preconditions:
        - "50 synthetic patient pathways with known deviations pre-labelled by clinical experts"
        - "NG12 guideline rule set is active in the programme configuration"
      steps:
        - step_number: 1
          action: "Run the analysis pipeline for the 50-patient test cohort"
          expected_result: "Pipeline completes and guideline deviation alerts are generated for applicable patients"
          success_criteria: "Pipeline completes without errors; alerts visible in the review dashboard"
        - step_number: 2
          action: "Review the alerts generated for each patient and compare against expert labels"
          expected_result: "Alerts match expert expectations for both true deviations and correctly compliant pathways"
          success_criteria: "Alert accuracy >= 90% against expert labels"
        - step_number: 3
          action: "Check that each alert includes the correct guideline reference and severity classification"
          expected_result: "Every alert links to a specific guideline clause (e.g. NICE NG12 section) and has a severity level"
          success_criteria: "100% of alerts include guideline reference and severity"
        - step_number: 4
          action: "Verify that no critical deviations were missed by the system"
          expected_result: "All expert-labelled critical deviations appear in the system output"
          success_criteria: "Zero missed critical deviations (recall = 100% for critical severity)"
      postconditions:
        - "All 50 patients reviewed and alert accuracy recorded"
        - "Any false positives or false negatives documented for improvement"
      success_metrics:
        - metric: "Overall alert accuracy"
          target: ">= 90%"
          measurement_method: "Agreement rate between system alerts and expert labels across all 50 patients"
        - metric: "Critical deviation recall"
          target: "100%"
          measurement_method: "Count of expert-labelled critical deviations detected by the system"
      evidence_to_capture:
        - "Per-patient alert comparison (system vs expert)"
        - "Confusion matrix (TP, FP, FN, TN) per severity level"
        - "Screenshots of alert detail view with guideline references"
        - "Auditor feedback on alert clarity and usefulness"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Configurable guideline rule sets work for non-cancer programmes"
      user_role: "Clinical Audit Lead"
      user_goal: "Confirm that the guideline engine works with a non-NG12 rule set to validate platform configurability"
      preconditions:
        - "A second guideline rule set (e.g. diabetes management) is configured in the system"
        - "Test patients with known diabetes management deviations are available"
      steps:
        - step_number: 1
          action: "Activate the diabetes guideline programme and run the analysis pipeline"
          expected_result: "Pipeline runs using the diabetes rule set and generates relevant deviation alerts"
          success_criteria: "Alerts reference diabetes guideline clauses, not cancer/NG12"
        - step_number: 2
          action: "Review generated alerts for clinical relevance to the diabetes pathway"
          expected_result: "Alerts are clinically meaningful for diabetes management deviations"
          success_criteria: "Clinical auditors confirm alerts are relevant and actionable"
      postconditions:
        - "Non-cancer programme configuration validated end-to-end"
      success_metrics:
        - metric: "Programme configurability confirmed"
          target: "Non-cancer guideline rules produce relevant alerts"
          measurement_method: "Clinical auditor review of alert relevance for the configured programme"
      evidence_to_capture:
        - "Screenshots of alerts generated from non-cancer rule set"
        - "Auditor confirmation of clinical relevance"

  acceptance_criteria:
    - criterion: "Guideline deviation alert accuracy"
      target: ">= 90% agreement with expert labels"
      measurement_method: "Comparison of system alerts against expert-labelled test cohort"
    - criterion: "Critical deviation recall"
      target: "100% -- no critical deviations missed"
      measurement_method: "Count of expert-labelled critical deviations detected by the system"
    - criterion: "Alert completeness"
      target: "100% of alerts include guideline reference and severity"
      measurement_method: "Inspection of alert metadata fields"

  user_feedback:
    feedback_methods: ["survey", "interview"]

  evidence_bundle:
    bundle_id: "VAL-011-EXEC-BETA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-011/"
    artifacts:
      - type: "test_results"
        description: "Per-patient alert comparison tables and confusion matrices"
      - type: "user_acceptance_results"
        description: "Clinical auditor feedback surveys and interview notes"
      - type: "test_log_bundle"
        description: "Pipeline execution logs, alert detail screenshots, and programme configuration evidence"
    immutability: true

  execution_history: []
