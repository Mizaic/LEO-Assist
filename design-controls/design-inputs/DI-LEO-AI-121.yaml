# -- DI-LEO-AI-121 -- Explanation pattern framework (Why / How / What)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-121"
  type: "Usability"
  derived_from: ["UN-LEO-AI-065", "UN-LEO-AI-067"]
  requirement: >
    The LEO UI SHALL expose five reusable explanation primitives
    (PageIntro, HelpPopover, CoachMark, ProgressiveReveal,
    GlossaryTerm) that every screen consumes to answer, for the
    current persona, (a) Why am I here, (b) How do I do the task,
    (c) What will happen next. GlossaryTerm MUST read its
    definition from a single source-of-truth glossary keyed by
    clinical term. All patient-reachable copy rendered through
    these primitives MUST be written at Flesch-Kincaid Grade
    level 9 or below.
  rationale: >
    Explaining the product in place is the only scalable way to
    make LEO usable for patients, carers, and junior staff without
    heavy training. A single framework keeps copy consistent,
    lets us measure readability, and makes it feasible to add a
    guided onboarding tour per persona later.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          PageIntro accepts {why, how, what, persona?} string
          props, renders with h1/h2 semantics, supports a
          collapsed/expanded state remembered per persona in
          localStorage under 'leo-pageintro-<screen-id>'.
      - type: "functional"
        spec: >
          HelpPopover renders a trigger button
          (aria-haspopup='dialog', aria-label) and a popover
          (role='dialog', aria-labelledby) with a short
          plain-language explanation.
      - type: "functional"
        spec: >
          CoachMark renders a temporary overlay tied to an
          anchor element by ref, with Next/Skip/Done controls,
          supports keyboard escape, and persists dismissal per
          user/per tour in localStorage.
      - type: "functional"
        spec: >
          ProgressiveReveal hides N advanced controls behind a
          'More options' disclosure with aria-expanded state.
      - type: "functional"
        spec: >
          GlossaryTerm takes a termId, looks up {label,
          definition, plainLanguage} from
          services/ui/src/lib/glossary.ts, and renders as an
          underlined phrase that opens a HelpPopover with the
          plainLanguage definition.
      - type: "safety"
        spec: >
          All default copy shipped in the glossary and in the
          PageIntro docs passes a Flesch-Kincaid Grade <=9
          readability check.
    constraints:
      - type: "performance"
        spec: >
          Glossary load MUST be tree-shakeable: importing a
          single term MUST NOT pull the entire glossary into
          the first-paint bundle.
    dependencies: ["DI-LEO-AI-118"]
    downstream_impacts:
      - "services/ui/src/components/ui/PageIntro.tsx"
      - "services/ui/src/components/ui/HelpPopover.tsx"
      - "services/ui/src/components/ui/CoachMark.tsx"
      - "services/ui/src/components/ui/ProgressiveReveal.tsx"
      - "services/ui/src/components/ui/GlossaryTerm.tsx"
      - "services/ui/src/lib/glossary.ts"
    technical_details:
      language: "TypeScript"
      framework: "Next.js + MUI"
      file_structure:
        - "services/ui/src/components/ui/PageIntro.tsx"
        - "services/ui/src/components/ui/HelpPopover.tsx"
        - "services/ui/src/components/ui/CoachMark.tsx"
        - "services/ui/src/components/ui/ProgressiveReveal.tsx"
        - "services/ui/src/components/ui/GlossaryTerm.tsx"
        - "services/ui/src/lib/glossary.ts"
        - "services/ui/src/lib/readability.ts"
      estimated_loc: 420

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-116 cases pass: PageIntro semantics and
      persistence, HelpPopover roles and labelling, CoachMark
      dismiss/keyboard, ProgressiveReveal disclosure semantics,
      GlossaryTerm renders plainLanguage and readability check
      on shipped copy computes FK grade <=9.

    test_protocol: "VT-LEO-AI-116"

  safety_class: "B"
  risks: ["R-LEO-AI-081"]
  tags:
    - "explanation-pattern"
    - "readability"
    - "onboarding"
    - "usability"
    - "patient-safety"
