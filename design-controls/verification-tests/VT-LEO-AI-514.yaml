# -- VT-LEO-AI-514 -- SBAR background partition + map + reduce + plain-English error surfacing
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-514"
  version: "2.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-513"
      - "DI-LEO-AI-516"
      - "DI-LEO-AI-521"
    risks:
      - "R-LEO-AI-185"
      - "R-LEO-AI-510"
      - "R-LEO-AI-511"

  metadata:
    title: "SBAR Background partition + map + reduce flow + structured errors / notices end-to-end"
    description: >
      Pytest verifies (a) the partitioner returns one Partition
      under budget, packs into N partitions when over budget,
      splits oversized single records intra-record, refuses with
      too_many_parts when more than 8 parts would be needed, and
      preserves every source ID under the no-record-dropped
      invariant; (b) call_background runs MAP once per partition,
      runs REDUCE exactly once when N >= 2 and every MAP succeeded,
      falls back to deterministic stitch with a reduce_failed
      notice on REDUCE failure, contains per-part MAP failures as
      structured background_part_failed errors, and emits per-part
      progress_cb events; (c) translate_error covers the four
      Bedrock failure modes plus the new too_many_parts /
      reduce_failed / background_part_failed codes plus
      missing_section and an unknown fallback; (d) the orchestrator
      emits sbar_stage_progress events per Background part / phase,
      and the sbar_completed payload carries structured errors[] /
      notices[] / parts[] arrays with no raw AWS strings on the
      wire. Static-source jest verifies the useSbarStream hook
      consumes sbar_stage_progress and exposes parts /
      partProgress, and the SbarPlayground renders per-part
      progress + parts-summary Chips.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/sbar/test_background_partitioner.py"
      - "tests/sbar/test_error_messages.py"
      - "tests/sbar/test_prompt_calls_background_partition.py"
      - "tests/test_sbar_orchestrator.py"
      - "services/ui/src/__tests__/sbar-playground-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest"
      - "Node 20+ / jest 30"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-514-TC-001"
      case_name: "Partitioner returns exactly one partition when the input fits in one LLM call"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build 2 small ResolvedSource records, call partition_background_sources with default budget"
          expected_result: "Returns ([Partition(index=1, total=1)], PartitionReport(total_parts=1, notice=None, record_split_notice=None, too_many_parts=False))"
          verification_method: "automated"
      acceptance_criteria:
        - "Single-part runs are a no-op so the legacy success path is preserved"

    - case_id: "VT-514-TC-002"
      case_name: "Partitioner splits into multiple parts and preserves every source ID"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build 12 oversize ResolvedSource records, call partition_background_sources with a budget that requires 3 parts"
          expected_result: "Returns 3 partitions; the union of source IDs across all partitions equals the input set; PartitionReport.notice mentions 'split into N parts'"
          verification_method: "automated"
        - step_number: 2
          action: "Inspect the user_message of each partition"
          expected_result: "Each user_message includes a 'Part k of N' header"
          verification_method: "automated"
      acceptance_criteria:
        - "No-record-dropped invariant under multi-part packing"
        - "Each part is self-describing (header tells the LLM which part it is)"

    - case_id: "VT-514-TC-003"
      case_name: "Partitioner splits one oversize record across multiple slices with part_in_record metadata"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build 1 ResolvedSource with serialised text > one part's budget, call partition_background_sources"
          expected_result: "The record appears in PartitionReport.split_records; consecutive partitions carry _SourceSlice fragments with sequential part_in_record numbering; each slice's user_message contains the slice header 'This is part k of N of source <id>; treat both slices as the same record'"
          verification_method: "automated"
      acceptance_criteria:
        - "An oversized single record is split intra-record rather than dropped"
        - "The LLM is told the slices belong to the same record"

    - case_id: "VT-514-TC-004"
      case_name: "Partitioner refuses (too_many_parts) when more than 8 parts would be required"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build enough oversize records that bin-packing would need >8 partitions, call partition_background_sources with the default _MAX_PARTS_DEFAULT cap"
          expected_result: "Returns ([], PartitionReport(too_many_parts=True))"
          verification_method: "automated"
      acceptance_criteria:
        - "Hard 8-part cap is enforced; refusal preferred over silent drop"

    - case_id: "VT-514-TC-005"
      case_name: "No-record-dropped invariant under intra-record splitting"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build a mix of small + oversize records that triggers both inter- and intra-record splitting; verify every input source ID appears at least once in the union of partition slices"
          expected_result: "set(source_id for p in partitions for slice in p for source_id in slice.source_ids) == set(input_source_ids)"
          verification_method: "automated"
      acceptance_criteria:
        - "Every record reaches the LLM at least once"

    - case_id: "VT-514-TC-006"
      case_name: "call_background single-partition path runs exactly one LLM call and emits no split notice"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json to a counter; call call_background with input that fits in one part"
          expected_result: "invoke_llm_json was called exactly once; returned dict has notice is None and partition_report.total_parts == 1"
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy single-call path preserved when input fits"

    - case_id: "VT-514-TC-007"
      case_name: "call_background multi-partition path runs MAP once per partition then exactly one REDUCE"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json to count and tag invocations by prompt name; call call_background with input that requires 3 partitions; supply a fake prompt fetcher that returns the sbar_background and sbar_background_reduce prompts"
          expected_result: "3 invocations of sbar_background (MAP) + exactly 1 invocation of sbar_background_reduce (REDUCE), in that order"
          verification_method: "automated"
      acceptance_criteria:
        - "MAP invocations match partition count"
        - "REDUCE runs exactly once per multi-part successful run"

    - case_id: "VT-514-TC-008"
      case_name: "REDUCE failure falls back to deterministic stitch with reduce_failed notice"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json so the MAP calls succeed but the REDUCE call returns {'error': '...'}; call call_background with input that requires 2 partitions"
          expected_result: "Returned markdown contains '## Background -- part 1 of 2' and '## Background -- part 2 of 2' headings; returned dict has notice mentioning 'reduce_failed' (or its plain-English equivalent); no extra LLM calls beyond MAP+REDUCE"
          verification_method: "automated"
      acceptance_criteria:
        - "Reduce failure cannot silently hallucinate -- the stitched output is faithful"
        - "Reviewer sees a notice that reduce failed"

    - case_id: "VT-514-TC-009"
      case_name: "Per-part MAP failure is contained and surfaced as background_part_failed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json so MAP call 1 succeeds and MAP call 2 returns {'error': '...'}; call call_background with input that requires 2 partitions"
          expected_result: "Returned dict has parts[0].status == 'completed' and parts[1].status == 'failed' with error_code 'background_part_failed'; REDUCE is NOT invoked; markdown is the deterministic stitch over the surviving part(s)"
          verification_method: "automated"
      acceptance_criteria:
        - "A failed MAP part does not abort the run"
        - "Reduce is gated on all-MAP-succeeded"

    - case_id: "VT-514-TC-010"
      case_name: "too_many_parts refusal returns a friendly error and invokes no LLM"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json to a counter; call call_background with input that triggers too_many_parts in the partitioner"
          expected_result: "invoke_llm_json was called zero times; returned dict has error_code == 'too_many_parts' and a plain-English error message asking to pick fewer records"
          verification_method: "automated"
      acceptance_criteria:
        - "Refusal is enforced before any LLM cost is incurred"

    - case_id: "VT-514-TC-011"
      case_name: "progress_cb is called per part for MAP and once per phase for REDUCE"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch invoke_llm_json so all calls succeed; call call_background with input that requires 3 partitions, capturing progress_cb events"
          expected_result: ">= one MAP started and one MAP completed event per part (3 of each); >= one REDUCE started and one REDUCE completed event"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-part progress is observable to the orchestrator / playground"

    - case_id: "VT-514-TC-012"
      case_name: "translate_error covers the four Bedrock modes + new partition codes + missing_section + unknown fallback"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call translate_error('background', raw) for inputs containing 'Input is too long', 'ThrottlingException', 'AccessDeniedException', 'EndpointConnectionError', 'missing background_markdown', and an arbitrary 'foo bar baz'; assert the (code, message) pair for each"
          expected_result: "input_too_long / throttled / access_denied / network / missing_section / unknown codes; messages are plain English and never include the raw vendor string"
          verification_method: "automated"
        - step_number: 2
          action: "Call translate_error('background', raw) where raw['error_code'] is 'too_many_parts', 'reduce_failed', and 'background_part_failed'; assert each maps to a friendly plain-English message naming the right cause and next action"
          expected_result: "too_many_parts message asks to pick fewer records; reduce_failed message says the parts are shown side-by-side; background_part_failed message says one part did not finish"
          verification_method: "automated"
      acceptance_criteria:
        - "All known modes map to friendly text"
        - "The new partition+map+reduce codes have specific friendly messages"

    - case_id: "VT-514-TC-013"
      case_name: "Notice helpers produce the expected FriendlyNotice shape"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call background_split_notice('split into 3 parts') and background_record_split_notice('one record split across 2 parts'); assert each returns {stage: 'background', code: 'background_split' or 'background_record_split', message: '...'}"
          expected_result: "Both helpers produce the canonical FriendlyNotice shape with the right code"
          verification_method: "automated"
      acceptance_criteria:
        - "Notices carry machine-readable codes alongside friendly text"

    - case_id: "VT-514-TC-014"
      case_name: "Orchestrator emits sbar_stage_progress per Background part / phase"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run SBAROrchestrator with a background_caller stub that emits 2 MAP started/completed pairs and 1 REDUCE started/completed pair via the supplied progress_cb; capture publish() calls"
          expected_result: "publish() emits sbar_stage_progress events with phase in {'map', 'reduce'}, the right part_index / part_total, and status in {'started', 'completed'}; events are ordered correctly (started before completed)"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-part progress reaches the SSE wire so the playground can show 'Generating Background, part 2 of 5'"

    - case_id: "VT-514-TC-015"
      case_name: "Orchestrator surfaces per-part failures in sbar_completed errors[]"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run SBAROrchestrator with a background_caller that returns parts[1].status == 'failed' with error_code 'background_part_failed'; capture publish() calls"
          expected_result: "sbar_completed.errors contains a FriendlyError with stage == 'background:part 2 of 2', code == 'background_part_failed', message in plain English"
          verification_method: "automated"
      acceptance_criteria:
        - "Each failed part is its own structured error so reviewers see exactly which parts failed"

    - case_id: "VT-514-TC-016"
      case_name: "Orchestrator emits structured background_split notice on sbar_completed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run SBAROrchestrator with a background_caller that returns a PartitionReport with notice='split into 3 parts'; capture publish() calls"
          expected_result: "sbar_completed.notices contains a FriendlyNotice with stage='background', code='background_split', message='split into 3 parts'; the sbar_stage_completed event for stage='background' carries parts (per-part summary) and notices arrays"
          verification_method: "automated"
      acceptance_criteria:
        - "Split notices travel on the wire as structured codes, not just free text"
        - "Per-part summary is available to the playground"

    - case_id: "VT-514-TC-017"
      case_name: "useSbarStream consumes sbar_stage_progress and exposes parts / partProgress"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: read services/ui/src/hooks/useSbarStream.ts; assert SbarStagePart and SbarStagePartProgress types are exported, the SbarStageState.parts and partProgress fields exist, the on('sbar_stage_progress') handler updates partProgress with phase / part_index / part_total, and on('sbar_stage_completed') resets partProgress to null and folds parts / notices"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Hook surface mirrors the orchestrator wire format for the new partition+map+reduce flow"

    - case_id: "VT-514-TC-018"
      case_name: "SbarPlayground renders per-part progress + parts-summary Chips"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: read services/ui/src/app/admin/ai-summarisation/SbarPlayground.tsx; assert data-testid 'sbar-part-progress-${stage}', 'sbar-reduce-progress-${stage}', and 'sbar-parts-summary-${stage}' all appear; assert the part-progress Chip is gated on partProgress.phase === 'map'; assert the reduce-progress Chip is gated on partProgress.phase === 'reduce'; assert the parts-summary Chip is gated on parts.length > 0"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-part progress + parts summary are visually surfaced to the reviewer"
        - "Reviewer can see the run is split into N parts and which parts succeeded / failed"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-514/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-514-EXEC-2026-04-19-001"
      execution_date: "2026-04-19"
      executor: "automated"
      environment: "development"
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      duration_seconds: 2.0
