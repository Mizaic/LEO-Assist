# -- UN-LEO-AI-078 -- Trustworthy SNOMED coding confidence so over-coding cannot enter training data
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-078"
  title: "Clinical leads, QA reviewers, and the runtime coding pipeline need every SNOMED candidate the resolver returns to carry a calibrated absolute confidence in [0, 1] -- and need a separate validator that re-checks LLM-proposed entities against that confidence before they enter the gold training data -- so that weak fulltext token matches cannot masquerade as high-confidence codes and the NER model is not taught to emit spans the downstream coder cannot represent."

  description: |
    The terminology resolver returns ranked SNOMED candidates for every
    clinical phrase the NER model emits. Until now its primary `score`
    field was a per-term RELATIVE measure: the top candidate of any
    search was always normalised to ~1.0, then a fixed 1.3x multiplier
    was applied if the SNOMED tag aligned with what the LLM expected.
    Two consequences followed:

      1. Downstream gates (the runtime coder, surface-form validator,
         the Mission Control coding gate) all saw "score >= 0.7" as
         "this is a strong, codeable match". In reality, a one-token
         Lucene partial match (e.g. "free" inside "cancer free")
         scored exactly the same as a curated SurfaceForm exact hit
         (e.g. "CKD" -> Chronic kidney disease). Reviewers and the
         pipeline had no way to tell strong from weak.
      2. The LLM-driven gold-label backfill (used to re-label HITL-
         completed candidates) then proposed clinically wrong codes
         with score=1.3 attached -- e.g. "rising PSA" -> Slow rising
         pulse, "cancer free" -> Seizure free, "nipple inversion on
         the right breast" -> Pendulous right breast. These would
         have been auto-applied to the gold training set, teaching
         the next model generation to emit spans that map to the
         wrong concept.

    Reviewers and the runtime pipeline need:

      - The resolver `score` to be a calibrated absolute confidence
        in [0, 1] that is roughly interpretable as P(correct mapping).
        Exact-branch hits should report 1.0; strong fulltext + tag
        match should report ~0.85-0.97; weak partial matches must
        report < 0.5 honestly.
      - A separate proposal validator that, before any LLM-generated
        entity is added to the gold training set, calls the resolver
        and applies an explicit acceptance ladder (EXACT branch /
        SEMANTIC branch / SURFACE branch) so that surface-text drift
        and lexicon gaps are handled with documented thresholds, not
        a single fused-score threshold that has been shown to be
        misleading.

  stakeholder:
    type: "end_user"
    role: "Clinical Lead / QA-RA Lead / Coding Reviewer / NER Pipeline Maintainer"
    organization: "NHS Primary Care Organisation / Cancer Alliance"

  priority: "high"

  rationale: |
    Auto-coding clinical free text to SNOMED is the system's central
    safety claim. Every other downstream control (audit dashboards,
    breach decomposition, NICE NG12 alerts, training-data writeback)
    assumes that when a span is coded with score >= threshold the
    code accurately represents the clinical concept. The previous
    relative+boosted score broke that assumption invisibly: a weak
    Lucene partial match for an unfamiliar phrase could produce a
    top-1 candidate with score 1.3 because there was nothing else
    in the candidate pool to normalise against. Once that score
    crossed a downstream threshold, the wrong code was applied with
    no further QA. The fix has two halves -- calibrate the score so
    "strong" actually means strong, and gate LLM proposals with a
    second-line validator so the gold training data never contains
    a wrong code that future model generations would learn from.

  benefit: "Reviewers and the runtime pipeline can trust the resolver score as a probability-like absolute confidence; LLM-generated proposals can no longer drift into the gold training set; clinically wrong matches that previously scored 1.3 are now visibly weak (sub-0.6) and rejected by the same threshold that admits true exact matches"

  use_case: |
    1. The runtime coding pipeline calls the terminology resolver
       on a phrase extracted by the NER model. The resolver returns
       a ranked candidate list, each with a calibrated score in
       [0, 1] plus the raw evidence signals (had_exact_match,
       lexical_raw, vector_raw).
    2. The terminology subgraph applies the configured threshold
       (default 0.55 calibrated) and either accepts the top
       candidate or rejects it as terminology_unresolved. Strong
       exact matches pass at 1.0; strong fulltext + tag match
       passes at 0.85+; weak partial matches honestly fail at
       0.4-0.5.
    3. Separately, when a HITL-completed gold candidate is
       re-extracted by the LLM-driven backfill, every proposed
       entity addition is sent to the SNOMED proposal validator.
       The validator applies a tiered acceptance ladder using the
       resolver's absolute signals -- accept on exact branch, on
       high-cosine semantic branch with surface-overlap floor, or
       on direct surface match with shared-token floor.
    4. Proposals that pass the validator are merged into the gold
       label. Proposals that fail are recorded as
       rejected_additions with a structured reason and the closest
       candidate, available for human review, but never silently
       added.
    5. A QA reviewer auditing a kept-set summary sees the score
       distribution (e.g. "min=0.873, max=1.000, mean=0.989, all
       in [0, 1]") and can trust that no proposal entered the
       training set with a misleading absolute confidence.

  current_solution: |
    coding_resolver._fuse_and_rank previously normalised lexical_raw
    and vector_raw against the per-term maximum, then applied a
    multiplicative 1.3x tag boost. This produced top-1 scores in the
    1.0-1.3 range regardless of underlying evidence quality. The
    SNOMED proposal validator did not exist; LLM-generated
    additions from the gold-label backfill were applied
    unconditionally.

  pain_points:
    - "Reviewers cannot tell a curated exact match from a weak partial Lucene hit when both report score=1.3"
    - "Downstream coder thresholds (0.7) admit weak matches that were never strong; the threshold cannot be tightened without losing real exact matches"
    - "LLM-backfilled GoldLabels can silently introduce clinically wrong concepts (e.g. cancer free -> Seizure free) into the training set"
    - "Audit reviewers have no documented acceptance criteria for distinguishing accept-able lexicon gaps (prostate cancer -> Malignant neoplasm of prostate) from semantic drift (rising PSA -> Slow rising pulse)"

  acceptance_criteria:
    - "The resolver `score` field is a calibrated absolute confidence in [0.0, 1.0] for every candidate returned by /terminology/resolve"
    - "Exact-branch hits (Term or SurfaceForm) report score == 1.0; strong fulltext (BM25 >= 5) reports >= 0.83; high-cosine vector hits (cosine >= 0.85) report >= 0.85; weak partial Lucene hits (BM25 ~1) report ~0.5"
    - "The resolver continues to expose absolute signals (had_exact_match, lexical_raw, vector_raw) so consumers that need branch-specific gating can apply it without rerunning the resolver"
    - "Tag-matching candidates win ties via a small additive boost (+0.10) -- never a multiplicative inflation that distorts absolute confidence"
    - "The SNOMED proposal validator implements an explicit three-branch acceptance ladder (EXACT / SEMANTIC / SURFACE) and rejects a proposal with a structured reason rather than silently dropping it"
    - "The validator's SEMANTIC branch requires both vector_raw >= 0.92 and surface_match >= 0.66 (i.e. >= two-thirds of meaningful surface tokens shared with the SNOMED preferred term) so embedding-only hallucinations cannot pass"
    - "Polarity-mismatched proposals (e.g. surface 'No hydrocephalus' resolving to a SNOMED term that does not carry negation) are flagged as polarity_mismatch and rejected"
    - "Every previously documented false-positive case (cancer free -> Seizure free, rising PSA -> Slow rising pulse, nipple inversion on the right breast -> Pendulous right breast, worsened over the last six months -> Sexually active in last six months) is rejected by the validator"
    - "Downstream gates (terminology._DEFAULT_MIN_SCORE, surface_form_validation_threshold) are retuned to match the calibrated score so existing recall on curated exact matches is preserved"

  success_metrics:
    - metric: "Resolver score distribution across kept SNOMED proposals on the 950 HITL-completed backfill set"
      target: "All 240+ kept proposals score in [0.85, 1.0]; mean >= 0.95"
      baseline: "Before fix: every top-1 reported 1.3 regardless of quality"
    - metric: "Number of clinically wrong concepts that pass the validator and would have entered gold training data"
      target: "Zero on the documented audit set of 4 false positives"
      baseline: "Before fix: 4 of 28 sm=0.5-0.69 acceptances were wrong (cancer-free / rising-PSA family)"
    - metric: "Calibrated absolute confidence test coverage"
      target: ">= 8 dedicated tests pinning per-branch score behaviour"
      baseline: "Before fix: zero -- only relative-rank assertions existed"

  regulatory_impact: "high"
  safety_impact: "high"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1 (NCDA launch configuration)"
    - "User feedback 2026-04-17: 'The LLM maybe over coding, so we need to check we can get a valid and clinically sensible snomed code otherwise we are pulling terms we can't code. We need to ensure that the surface term matches the code that comes back as it may not be the top ranking result.'"
    - "User feedback 2026-04-17: 'can you fix the resolve scoring and reassess'"

