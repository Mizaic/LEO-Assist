# -- DO-LEO-AI-055 -- Surface Form Validation Subgraph

- id: "DO-LEO-AI-055"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"
  traceability:
    design_inputs: ["DI-LEO-AI-055"]
    risks_addressed: ["R-LEO-AI-039", "R-LEO-AI-040"]
    verification_tests: ["VT-LEO-AI-055", "VT-LEO-AI-061"]
  specification:
    title: "Surface-form validation and tasking"
    description: >
      Adds a surface_form_validation subgraph after terminology resolution.
      High-confidence corrections are auto-applied; low-confidence mismatches
      create SurfaceFormTask items for human approval.
    acceptance_criteria:
      - criterion: "Create review task for uncertain mismatch"
        type: "functional"
        target: "confidence < threshold creates SurfaceFormTask"
      - criterion: "No patient linkage in tasks"
        type: "safety"
        target: "task uses candidate_id + anonymised context only"
  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/surface_form_validation.py"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/surface_form_task_queries.py"
        storage_location: "git"
  safety_characteristics:
    safety_class: "B"
    risk_control_measures:
      - "Auto-correction threshold set to 0.9"
      - "Ambiguous corrections route to human review"
