# -- DI-LEO-AI-223 -- /care surfaces consume the shared dialog with dual save
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-223"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-088"
  requirement: >
    The /care/patients encounter card SHALL replace its bespoke
    editor with the shared `GoldLabelEditorDialog` mounted in
    `saveMode='dual'`, seeded via
    `createGoldLabelFromEncounter` (DI-LEO-AI-220) and persisted
    via `useDualSaveAdapter` -> `syncCodedLinksFromGold`
    (DI-LEO-AI-221).

    The /care/encounters search-results preview
    (`EncounterPreviewDialog`) SHALL open as a read-only encounter
    preview by default. The preview SHALL render the search match
    rationale (date, patient id, match type, rationale chips) and
    the full encounter text already returned by the search response,
    WITHOUT making any additional API call on open. An explicit
    "Edit codes" footer button SHALL trigger the seed call and
    mount the shared `GoldLabelEditorDialog` in `saveMode='dual'`,
    passing the same match-rationale chips into the dialog's
    `headerChrome` slot.

    The legacy full-page editor routes
    (`/patients/{id}/encounters/{eid}` and
    `/patients/{id}/encounters/view/{eid}`) and the
    `EncounterCodedView` component SHALL be retired with redirects
    to `/care/patients?...` so existing bookmarks still work.
  rationale: >
    Replacing the bespoke editors with the shared dialog is the
    UI-side payoff of UN-LEO-AI-088: corrections made anywhere in
    /care now flow into the model, the dialog has one set of
    keyboard shortcuts and validation rules, and we delete a
    full-page route's worth of code that we no longer need to
    maintain.

    Reviewers on /care/encounters click rows mainly to read the
    encounter text and confirm the search hit. Auto-mounting the
    full editor on every click made the dialog feel slow and broke
    completely when the seed call returned 404 (out-of-scope
    patient, missing :HAS_ENCOUNTER edge), leaving the reviewer
    with a blank dialog and no encounter text at all. Splitting
    preview from edit keeps the dialog usable in both cases and
    avoids wasted seed work for read-only inspections.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          The /care/patients encounter card "Edit codes" control
          MUST mount `GoldLabelEditorDialog` inline with
          `saveMode='dual'`, `entitySaver` from
          `useDualSaveAdapter`, and an `onAfterSave` that triggers
          a refresh of the encounter's coded links.
      - type: "functional"
        spec: >
          The /care/encounters preview wrapper
          (`EncounterPreviewDialog`) MUST open in a read-only
          preview state by default. The preview body MUST render
          the match rationale chrome
          (`data-testid="encounter-preview-rationale"`) and the
          encounter text from `item.text`
          (`data-testid="encounter-preview-text"`, or
          `encounter-preview-empty` when the encounter has no text)
          WITHOUT calling any backend endpoint on open.
      - type: "functional"
        spec: >
          The preview MUST highlight matches of the reviewer's
          search query and the `item.match_rationale` terms inside
          the encounter text using `<mark>` elements
          (`data-testid="encounter-preview-highlight"`). Matching
          MUST be case-insensitive, MUST skip tokens shorter than
          three characters to avoid noise, and MUST prefer longer
          terms over shorter overlapping ones.
      - type: "functional"
        spec: >
          The preview wrapper MUST expose an explicit "Edit codes"
          footer button
          (`data-testid="encounter-preview-edit-codes"`). Clicking
          it MUST call `createGoldLabelFromEncounter`, then mount
          the shared `GoldLabelEditorDialog` with `saveMode='dual'`,
          `entitySaver` from `useDualSaveAdapter`, an `onAfterSave`
          that triggers a refresh of the encounter's coded links,
          and the match-rationale chrome supplied via the
          dialog's `headerChrome` slot.
      - type: "functional"
        spec: >
          If the seed call fails, the preview MUST stay open with
          the encounter text still visible and surface the failure
          as a plain-English error
          (`data-testid="encounter-preview-error"`). It MUST NOT
          replace the preview with a bare error banner.
      - type: "functional"
        spec: >
          Both surfaces MUST surface optimistic-concurrency errors
          (HTTP 409) and gold-mirror failures (HTTP 502) as
          human-readable banners; the saved entity set MUST NOT be
          discarded on error so the reviewer can retry.
      - type: "functional"
        spec: >
          The legacy routes
          `services/ui/src/app/patients/[patientId]/encounters/[encounterId]/page.tsx`
          and
          `services/ui/src/app/patients/[patientId]/encounters/view/[encounterId]/page.tsx`
          MUST be replaced with `redirect()` calls that point to
          `/care/patients?patient=...&tab=encounters&encounter=...`.
      - type: "functional"
        spec: >
          The `EncounterCodedView` component MUST be deleted (no
          new code paths point to it).
    constraints:
      - type: "safety"
        spec: >
          The `EncounterPreviewDialog` MUST NOT prefetch coded
          links itself; the seed endpoint already returns the
          re-anchored entities and the baseline_concept_ids.
      - type: "safety"
        spec: >
          The dialog's `headerChrome` MUST be read-only context;
          interacting with rationale chips MUST NOT alter the
          editor state.
    dependencies:
      - "DI-LEO-AI-219"
      - "DI-LEO-AI-220"
      - "DI-LEO-AI-221"
    downstream_impacts:
      - "EncounterCodedView component is removed"
      - "Two legacy routes return redirects instead of rendering"
      - "fetchEncounterCodedLinks is no longer called from EncounterMissionControl"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16"
      file_structure:
        - "services/ui/src/components/mission-control/EncounterCard.tsx"
        - "services/ui/src/components/mission-control/EncounterTextTab.tsx"
        - "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
        - "services/ui/src/components/mission-control/EncounterPreviewDialog.tsx"
        - "services/ui/src/app/patients/[patientId]/encounters/[encounterId]/page.tsx"
        - "services/ui/src/app/patients/[patientId]/encounters/view/[encounterId]/page.tsx"
      estimated_loc: 280

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-214 verifies the wrapper imports, the seed call
      shape, the saveMode='dual' mount, the headerChrome
      contract, and that EncounterMissionControl no longer
      prefetches coded links.
    test_protocol: "VT-LEO-AI-214"

  safety_class: "B"
  risks:
    - "R-LEO-AI-206"
    - "R-LEO-AI-207"
  tags:
    - "ui"
    - "live-encounters"
    - "training-data"
    - "deletion"
