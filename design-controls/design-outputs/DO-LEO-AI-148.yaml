  specification:
    title: "Clinical Guidelines workflow rebuilt on the design-system"
    description: |
      Single Next.js page under
      services/ui/src/app/admin/guidance/page.tsx that orchestrates
      the four child sections (NiceLoaderSection,
      LoadedGuidelinesPanel, RuleReviewSection,
      BitmapLifecycleSection). Wave E Phase 5 swaps the legacy
      heavy chrome for a sticky design-system jump strip and
      motion-enabled StepCard sections:

        - SegmentedTabs jump strip (sticky, blur-backed) at the top
          with three tabs (load / review / compile). Selecting a
          tab smoothly scrolls the matching StepCard into view.
        - StepCard: fm.section with 12px radius, 1px divider border,
          3px tone-coded left accent strip, framer-motion stagger
          entry. Each StepCard owns the numbered pip + title +
          description in its header, then renders the existing
          child section in its body.

      Sub-module internals (NiceLoaderSection etc.) are NOT touched
      by this DO; their visual upgrade is staged to a follow-up DI.
