# -- DO-LEO-AI-163 -- Intelligence Console redesign on @leo/design-system (Phase 8a)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-163"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-164"]
    user_needs: ["UN-LEO-AI-075"]
    risks_addressed: ["R-LEO-AI-165"]
    verification_tests: ["VT-LEO-AI-162"]

  specification:
    title: "Intelligence Console -- KnowledgePageLayout + PipelineRail + NudgeStrip + ConsoleStagePanel"
    description: |
      Replaces the bespoke chrome on /admin/console with the same
      design-system spine used by the Knowledge tabs and Pathways list:

        - KnowledgePageLayout (width="wide", screenId="admin-console")
          provides IntroCard via the existing AreaIntro/areaCopy entry,
          consistent gutter and a 1600 px column.
        - StatHero summarises the AI loop in three live tiles
          (gold labels / candidate queue / latest F1 or live model).
        - A new PipelineRail design-system primitive renders the six
          pipeline stages as accent-themed pills with status dots,
          framer-motion mount stagger, and keyboard / aria-tablist
          semantics.
        - A new NudgeStrip design-system primitive renders the smart
          nudge with the same severity tones as the rest of the
          design-system.
        - A ConsoleStagePanel module presents each stage body inside a
          design-system-tokenised card (color.surface.raised, divider,
          radius.md, accent strip).

      The internal stage bodies (DiscoverStage / CurateStage /
      TrainStage / EvaluateStage / DeployStage / MonitorStage) keep
      their existing behaviour. Their bodies will be rebuilt on
      ReviewListCard / DataGridCard primitives in Phase 8b.

    acceptance_criteria:
      - criterion: "Page is wrapped by KnowledgePageLayout"
        type: "functional"
        measurement: "Test"
        target: >
          page.tsx imports KnowledgePageLayout from @leo/design-system
          and renders it with screenId="admin-console" and width="wide".
      - criterion: "StatHero summarises the AI loop"
        type: "functional"
        measurement: "Test"
        target: >
          A computeConsoleStats helper returns at least three StatTile
          entries (gold labels, candidate queue, latest F1 or live model)
          and the page renders them through the layout.
      - criterion: "PipelineRail replaces HealthBar"
        type: "functional"
        measurement: "Test"
        target: >
          page.tsx no longer imports HealthBar; PipelineRail.tsx exposes
          role="tablist", supports Enter/Space activation, animates with
          framer-motion (collapsing to instant when reduced-motion is on),
          and uses color.status.* tokens for the dot colours.
      - criterion: "NudgeStrip replaces NudgeBanner"
        type: "functional"
        measurement: "Test"
        target: >
          page.tsx no longer imports NudgeBanner; NudgeStrip.tsx accepts
          a severity prop in {info, warning, danger}, renders
          role="status" with aria-live="polite", and uses
          color.status.* tokens for tone.
      - criterion: "Stage panels keep working"
        type: "safety"
        measurement: "Test"
        target: >
          ConsoleStagePanel.tsx exposes the same surface (title, status,
          accentColor, action button, expansion). The six stage bodies
          continue to render without modification.
      - criterion: "useConsoleState API is preserved"
        type: "safety"
        measurement: "Inspection"
        target: >
          The exported ConsoleState shape and the useConsoleState
          signature are unchanged; only an additive computeConsoleStats
          helper is introduced.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/console/page.tsx"
        description: "Refactored to render KnowledgePageLayout(width='wide', screenId='admin-console') with StatHero, NudgeStrip, PipelineRail and a column of ConsoleStagePanel."
      - artifact_type: "source_code"
        location: "services/ui/src/components/console/useConsoleState.ts"
        description: "Adds computeConsoleStats(state): StatTile[] helper used by the page to feed StatHero."
      - artifact_type: "source_code"
        location: "services/ui/src/components/console/ConsoleStagePanel.tsx"
        description: "New design-system-tokenised stage panel (replaces direct StageCard usage in the console page)."
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/PipelineRail.tsx"
        description: "New primitive: ordered, accent-themed pipeline stages with motion-aware stagger, status dot, role=tablist."
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/NudgeStrip.tsx"
        description: "New primitive: semantic nudge banner (info/warning/danger) with role=status, aria-live=polite."
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/index.ts"
        description: "Re-exports PipelineRail and NudgeStrip alongside the existing primitive surface."
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 600
      key_functions:
        - "computeConsoleStats"
        - "PipelineRail"
        - "NudgeStrip"
        - "ConsoleStagePanel"
        - "ConsolePage"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Pipeline rail must show the correct stage health derived from useConsoleState"
      - "Nudge strip must surface failed-job and golden-set regression banners with clear severity"
    risk_control_measures:
      - "Static-source VT pins the import contract (KnowledgePageLayout / StatHero / PipelineRail / NudgeStrip in, HealthBar / NudgeBanner out) and the screenId/width contract"
      - "ConsoleStagePanel preserves the existing accentColor + status surface so no clinical-pipeline behaviour changes"
      - "useConsoleState public surface is preserved; only an additive helper is introduced"

  verification_status:
    verification_method: "Test"
    verification_complete: false
