# -- DO-LEO-AI-194 -- PRISM cancer-context guard + admin-amendment filter
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-194"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-195"]
    user_needs: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-186"]
    verification_tests: ["VT-LEO-AI-190"]

  specification:
    title: "PRISM cancer-context guard and Marked-in-Error admin filter"
    description: |
      Refines the anchor detector so PRISM proforma encounters only
      open a 2WW cancer pathway when accompanied by explicit cancer
      context, and so administrative "Marked in Error: Amended data"
      QOF amendments on a referral row are not surfaced as workflow
      rejection events.

      Implementation centers on a new regex (_RE_PRISM_CANCER_CONTEXT)
      and an "is_prism_cancer" boolean used in _classify_text_encounters.
      A second admin-amendment regex check filters MIE matches that
      carry an "amended data" / "amendment" / "data amendment"
      qualifier so they fall through to text_generic instead of
      emitting referral_subtype="rejected".

    acceptance_criteria:
      - criterion: "Non-cancer PRISM yields no referral anchor"
        type: "safety"
        measurement: "Test"
        target: "Sexual health / MSK / IBD / mental-health PRISM templates emit refs == []"
      - criterion: "Cancer PRISM still emits prism subtype"
        type: "functional"
        measurement: "Test"
        target: "PRISM 2WW Lung / PRISM + suspected cancer / PRISM + XaMe Read code emit referral_subtype='prism'"
      - criterion: "Marked-in-Error without amendment still emits rejected"
        type: "safety"
        measurement: "Test"
        target: "'Hospital ... referral Marked in Error' (no 'amended data') emits referral_subtype='rejected'"
      - criterion: "Marked-in-Error with Amended data does not emit rejected"
        type: "safety"
        measurement: "Test"
        target: "'... Marked in Error: Amended data' encounter emits no rejected subtype; falls through to text_generic if a real fast-track phrase is present"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_PRISM_CANCER_CONTEXT, is_prism_cancer guard, _is_admin_amendment qualifier check inside _classify_text_encounters"
      - artifact_type: "test_code"
        location: "tests/test_anchor_detector.py"
        description: "TestPrismCancerContextGuard class (7 cases) + updated TestReferralRejectionResubmissionDetection"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Decision to open a 2WW cancer EpisodeOfCare from a PRISM proforma encounter"
      - "Decision to surface a referral as a rejection / workflow-delay event"
    risk_control_measures:
      - "Cancer-context guard prevents non-cancer PRISM templates from inflating 2WW pathway counts and blocking real cancer-suspicion review"
      - "Admin-amendment qualifier prevents QOF data corrections from inflating rejection-resubmission DQ alerts"

  verification_status:
    verification_method: "Test"
    verification_complete: true
