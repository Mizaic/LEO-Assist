# -- R-LEO-AI-098 -- Training Data chrome refactor hides or breaks review controls
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-098"
  title: >
    Wave E Phase 2a chrome refactor on the Training Data tab silently
    breaks the segmented tab control, the export trigger, or the
    progress indicator, leaving reviewers unable to reach or grade
    candidate annotations.

  hazard:
    description: >
      The Training Data tab is the primary interface through which
      clinical reviewers convert model candidates into verified gold
      labels. Swapping the chrome (tabs, stats, progress, actions)
      from legacy MUI primitives to new @leo/design-system primitives
      is a purely cosmetic intent but crosses the critical path:
      if the SegmentedTabs value binding, the ToolbarActions export
      handler, or the ProgressStrip computation regresses, the
      reviewer cannot switch between candidate / gold / synthetic
      views or cannot trigger the medspacy training export.
    category: "usability"

  hazardous_situation: >
    A reviewer opens /admin/knowledge?tab=training-data during a
    coding-audit session. The new chrome mounts but (a) the
    SegmentedTabs value is not wired to the existing tab state, so
    clicking "Verified gold" does not rerender the body; or (b) the
    Export action in ToolbarActions is not connected to the existing
    handleExport, so clicking it silently no-ops; or (c) the
    ProgressStrip mis-computes and hides the "items left" cue. The
    reviewer either abandons the session, proceeds without seeing
    their actual progress, or raises a support ticket.

  harm:
    description: >
      Delayed or skipped gold-label review. No direct patient harm
      because no clinical recommendation is blocked -- but the
      training dataset gets stale, model retraining is delayed, and
      downstream coding-assistance quality drifts.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Keep the existing tab state (useState<"candidates" | "gold" |
        "synthetic">) and existing handleTabChange, handleExport,
        candidateStats, goldStats, syntheticStats untouched. The new
        primitives receive the SAME data and fire the SAME handlers;
        only the presentation is swapped. This keeps the blast radius
        to render-layer only.
      implemented_by: ["DI-LEO-AI-143"]
      verified_by: ["VT-LEO-AI-142"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        VT-LEO-AI-142 includes a render-level interaction test that
        clicks each segmented tab, clicks the Export action, and
        asserts the expected handler-driven state change happens.
        CI runs this on every PR.
      implemented_by: ["DI-LEO-AI-143"]
      verified_by: ["VT-LEO-AI-142"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With the interaction test pinning each chrome element to its
      existing handler, and the body sub-renders untouched, the
      remaining residual risk is limited to unanticipated css
      z-index or focus-order regressions which are covered by
      VT-LEO-AI-141 (primitives) axe-core and keyboard tests.

  monitoring:
    monitoring_plan: >
      Track Training Data tab session-completion rate post-deploy
      via the existing coding review telemetry dashboard. Any drop
      greater than 10 percent in the week following rollout triggers
      rollback to the legacy chrome.
    metrics:
      - "reviewer sessions that reach at least one gold-label commit per day"
      - "Export action click-through count per week"
      - "Support tickets tagged 'training-data tab' per week"
    review_frequency: "Weekly for first month, then monthly"

  metadata:
    identified_by: "Wave E design review 2026-04-17"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "knowledge"
      - "training-data"
      - "design-system"
