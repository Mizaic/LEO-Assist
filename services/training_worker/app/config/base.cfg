[nlp]
lang = "en"
pipeline = ["transformer","spancat"]
batch_size = 64
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}

[components]

[components.transformer]
factory = "transformer"
max_batch_items = 1024
set_extra_annotations = {"@annotation_setters":"spacy-transformers.null_annotation_setter.v1"}

[components.transformer.model]
@architectures = "spacy-transformers.TransformerModel.v3"
name = ${vars.hf_model_name}
# Wave 1 (F5): mixed precision is flipped on by the trainer when a CUDA GPU is
# resolved (see _write_filled_config).  Kept ``false`` here so CPU and MPS runs
# (which do not support PyTorch AMP) stay stable by default.
mixed_precision = false

[components.transformer.model.get_spans]
@span_getters = "spacy-transformers.strided_spans.v1"
# Wave 1 (F2): window/stride raised from 128/96 so the full 22-24 token lab
# lines (see suggester comment below) sit inside a single window with enough
# overlap that near-boundary spans keep useful context.  BioClinicalBERT max
# context is 512 tokens — keeping the window at half of that leaves room for
# positional stability and limits attention cost.  Override either value at
# runtime via TRAINING_WINDOW_TOKENS / TRAINING_STRIDE_TOKENS.
window = 256
stride = 192

[components.transformer.model.grad_scaler_config]

[components.transformer.model.tokenizer_config]
use_fast = true

[components.transformer.model.transformer_config]

[components.spancat]
factory = "spancat"
scorer = {"@scorers":"spacy.spancat_scorer.v1"}
spans_key = "sc"
threshold = 0.5

[components.spancat.model]
@architectures = "spacy.SpanCategorizer.v1"

[components.spancat.model.reducer]
@layers = "spacy.mean_max_reducer.v1"
# Wave 1 (F10): hidden_size raised to 384 to widen the bottleneck through
# which the (mean,max) pooled 1536-d transformer representation passes before
# hitting the logistic head.  With a frozen transformer, this is the main
# place the head can carve out label-specific subspaces.  Keep to a power-of-2
# friendly multiple of 128 to stay within dataset size limits (at ~5k docs per
# label we are budgeting roughly nInput * hidden_size ~= 600k params per
# spancat head — comfortably below the overfit boundary for this data size).
hidden_size = 384

[components.spancat.model.scorer]
@layers = "spacy.LinearLogistic.v1"
nO = null
nI = null

[components.spancat.model.tok2vec]
@architectures = "leo_training.TransformerListener.v1"
pooling = {"@layers":"reduce_mean.v1"}
grad_factor = 1.0
upstream = "*"
width = 768

[components.spancat.suggester]
# Wave 2 (F7): the previous 1..24 range produced an O(n^2) blow-up of negative
# candidates on the long lab lines.  The clinical suggester below emits only
# short-entity sizes (1..5) and the long-line sizes (22..24) — cutting negative
# candidate volume by ~60% without losing any positive coverage.
@misc = "leo_training.clinical_ngram_suggester.v1"
sizes = [1, 2, 3, 4, 5, 22, 23, 24]

[corpora]

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 0
gold_preproc = false
limit = 0

[corpora.train.augmenter]
# Wave 2 (F8): orthographic variants augmenter.  Re-cases (diabetes / Diabetes
# / DIABETES) and applies common lowercase/uppercase swaps that primary-care
# note authors use interchangeably.  Kept at modest level/lower probabilities
# so the augmenter never flips an entity surface form outside the letter-case
# axis (a guard test enforces this).
@augmenters = "spacy.orth_variants.v1"
level = 0.2
lower = 0.3

[corpora.train.augmenter.orth_variants]
@readers = "srsly.read_json.v1"
path = ${paths.orth_variants}

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[training]
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
seed = 42
gpu_allocator = null
dropout = 0.2
# Increased dropout for regularization when training head on small # of candidates
# Wave 1 (F3): accumulate_gradient raised from 1 to 4 so the effective batch
# seen by the optimiser is stable on the tiny GoldLabel splits.  With words-
# based batching (start=256 words, stop=1024) this gives ~1k-4k tokens per
# optimiser step, which is where Adam's moment estimates become reliable.
accumulate_gradient = 4
# Reduced patience (from 1600) and max_steps (from 20000) to prevent overfitting
# on small numbers of training candidates. More frequent eval (every 100 steps).
# LR tuned lower for stability in low-data regime with frozen BioClinicalBERT.
patience = 400
max_epochs = 0
max_steps = 10000
eval_frequency = 100
frozen_components = ["transformer"]
annotating_components = ["transformer"]
before_to_disk = null
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_words.v1"
discard_oversize = false
tolerance = 0.2
get_length = null

[training.batcher.size]
@schedules = "compounding.v1"
# Wave 1 (F11): raised words-per-batch floor from 64 to 256 and ceiling from
# 256 to 1024.  64 words was ~2 sentences on UK primary-care text; too small
# to produce a stable gradient.  Combined with accumulate_gradient=4 the
# optimiser sees ~1-4k words per update.
start = 256
stop = 1024
compound = 1.001

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
# Wave 1 (F4): Polyak averaging turned on.  At negligible memory cost the
# averaged weights typically cut per-label F1 variance across seeds by 1-2
# points.  Costs one extra state tensor per param but no extra step compute.
use_averages = true
eps = 1e-8

[training.optimizer.learn_rate]
@schedules = "warmup_linear.v1"
# Tuned for small # of training candidates + frozen Bio_ClinicalBERT head:
# - Lower initial_rate (5e-5 → 3e-5)
# - Shorter warmup (kept < new eval_frequency=100)
# - total_steps aligned to new max_steps. Avoids the previous bell-curve
#   overfitting seen on small medical gold sets (see prior comment).
warmup_steps = 50
total_steps = 10000
initial_rate = 0.00003

[training.score_weights]
spans_sc_per_type = null
spans_sc_f = 1.0
spans_sc_p = 0.0
spans_sc_r = 0.0

[pretraining]

[initialize]
vectors = null
init_tok2vec = null
vocab_data = null
lookups = null
before_init = null
# Force-initialise frozen transformer pipes whose HuggingFace model+tokenizer
# were skipped by init_nlp (which disables frozen_components during initialize).
# Without this the first nlp.update() call via annotating_components raises:
#   TypeError: 'NoneType' object is not callable
# (see services/training_worker/app/spacy_listener_width.py)
after_init = {"@misc": "leo_training.init_frozen_transformer.v1"}

[initialize.components]

[initialize.tokenizer]

[vars]
hf_model_name = "emilyalsentzer/Bio_ClinicalBERT"

[paths]
train = null
dev = null
# Wave 2 (F8): orth_variants JSON is filled by the exporter (default
# orthographic variants table shipped alongside the training corpus).
orth_variants = null
