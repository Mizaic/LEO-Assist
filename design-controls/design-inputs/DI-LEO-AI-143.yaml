# -- DI-LEO-AI-143 -- Wave E Phase 2a: Training Data tab chrome on design-system primitives
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-143"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    The Training Data tab (the body of /admin/knowledge?tab=training-data,
    implemented in services/ui/src/components/gold-dataset/
    GoldDatasetPanel.tsx) SHALL render its upper chrome -- header, stat
    tiles, progress strip, segmented tabs, and toolbar actions --
    through the shared @leo/design-system primitives shipped in
    DI-LEO-AI-142 (StatHero/MetricTile, ProgressStrip, SegmentedTabs,
    ToolbarActions). The existing candidate list body, gold label
    review body, synthetic generation body, and all dialogs MUST
    continue to function without behavioural regression. Phase 2b
    (DI-LEO-AI-143b, follow-up session) will decompose the body
    sub-modules.
  rationale: >
    Wave D Phase 3 shipped the outer Knowledge shell but the tab body
    stayed on the 4,781 LOC legacy MUI monolith. Product-owner
    feedback on 2026-04-17 was "the frame is beautiful, the content
    inside is still the old spreadsheet." Phase 2a lands the visible
    redesign of the upper chrome -- the first thing the user sees on
    open -- by routing the same data through the design-system
    primitives, without rewriting the much larger body in the same
    session (risk-managed).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx
          imports StatHero, ProgressStrip, SegmentedTabs, and
          ToolbarActions from @leo/design-system, and uses them in
          the chrome region ABOVE the body conditional rendering
          (tab === "gold"/"candidates"/"synthetic").
      - type: "functional"
        spec: >
          The render does NOT use <Tabs value={tab} ...> / <Tab ...>
          MUI components for the primary segmented control; those
          are replaced with <SegmentedTabs>.
      - type: "functional"
        spec: >
          The data shape fed to StatHero (DsStatTile[]) contains the
          six canonical metrics: Received, Ready for training,
          Failed, Verified gold, Synthetic gold, and Avg quality.
      - type: "functional"
        spec: >
          The progress banner (rendered only when tab === "candidates"
          and total > completed) uses <ProgressStrip>, not an inline
          Box-based bar.
      - type: "functional"
        spec: >
          Export and Deduplicate buttons are rendered via
          <ToolbarActions>, not <Button>/<Tooltip>. The Export
          action's disabled/loading state mirrors the previous MUI
          tooltip + disabled attribute behaviour.
    constraints:
      - type: "safety"
        spec: >
          The migration MUST be semantics-preserving. All existing
          handlers (handleTabChange, handleExport, setDedupeDialogOpen,
          setDedupePreview, setExpandedDedupeGroup) MUST continue to
          fire on the correct user interactions.
      - type: "safety"
        spec: >
          The migration MUST NOT touch the tab body sub-renders
          (DatasetHealthPanel, candidate list, gold label review,
          synthetic generation, dialogs); those remain on the legacy
          MUI stack and are Phase 2b work.
    dependencies: ["DI-LEO-AI-142", "DI-LEO-AI-136"]
    downstream_impacts:
      - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
    technical_details:
      language: "TypeScript (React 18, framer-motion 11)"
      framework: "@leo/design-system primitives + legacy MUI body"
      file_structure:
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        - "services/ui/src/__tests__/training-data-chrome.test.tsx"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-142 passes: static scan confirms the primitive
      imports and the Tabs/Tab removal; render test confirms the
      chrome testids (stat-hero, progress-strip, segmented-tabs,
      toolbar-actions) are present.
    test_protocol: "VT-LEO-AI-142"

  safety_class: "B"
  risks: ["R-LEO-AI-098"]
  tags:
    - "knowledge"
    - "training-data"
    - "design-system"
