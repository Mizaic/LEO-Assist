# -- DI-LEO-AI-079 -- Loop 3: Training Data Export and PII Gate
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-079"
  type: "Safety"
  derived_from: ["UN-LEO-AI-050"]
  requirement: >
    The system SHALL provide a training data export script that queries
    confirmed and reviewed DOCUMENTS relationships, excludes holdout and
    sentinel records, groups results by encounter and sentence, strips all
    patient-linkable identifiers from output, runs a PII gate before writing
    any output file (aborting if PII is detected), and outputs spaCy JSONL
    training files alongside a stratification report that blocks training if
    any safety-critical entity category has fewer than 20 examples.
  rationale: >
    The export script is the boundary between internal patient data and the
    AI training artefact. Any patient-linkable identifier that crosses this
    boundary constitutes a data breach under UK GDPR. The PII gate is a
    technical control that supplements de-identification at collection time;
    two independent PII checks (at write and at export) reduce the probability
    of a breach to near-zero. The training block on safety-critical category
    imbalance prevents training a model that cannot detect cancer or safeguarding
    concerns reliably.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "Export query uses encounter_id for grouping only; encounter_id and patient_id do not appear in any output file"
      - type: "safety"
        spec: "PII gate: detect_phi() is run on every evidence_sentence before writing; if any PII found, export aborts and logs offending records"
      - type: "functional"
        spec: "Outputs: ner_training_gold.jsonl (source='confirmed'), ner_training_silver.jsonl (source='reviewed'), ner_stratification_report.txt, ner_export_manifest.json"
      - type: "functional"
        spec: "ner_export_manifest.json contains: date, entity_count, holdout_exclusion_count, pii_check_result; no patient or encounter IDs"
      - type: "safety"
        spec: "Training is blocked (export aborts with error) if any safety-critical entity category has fewer than 20 examples"
      - type: "functional"
        spec: "Non-safety categories with fewer than 50 examples generate a warning in the stratification report but do not block export"
      - type: "functional"
        spec: "Each encounter's non-coded sentences are included as negative examples: {text: '...', spans: []}"
    constraints:
      - type: "safety"
        spec: "Only source='confirmed' records in gold file; only source='reviewed' records in silver file; source='provisional' excluded entirely"
      - type: "safety"
        spec: "Export JSONL files must not contain encounter_id, patient_id, NHS number, or any field that could link the record to a real patient"
    dependencies: ["DI-LEO-AI-077", "DI-LEO-AI-078"]
    downstream_impacts:
      - "NER model training pipeline"
      - "Stratification report and imbalance monitoring"
      - "CorpusCard in operations UI"
    technical_details:
      language: "Python"
      framework: "Neo4j"
      file_structure:
        - "scripts/export_ner_training.py"
        - "libs/utils/deidentify.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-079 test cases pass: no encounter_id in output, PII gate aborts
      on detection, training block fires when safety-critical category < 20,
      gold/silver split correct, negative examples included, manifest accurate.
    test_protocol: "VT-LEO-AI-079"

  safety_class: "B"
  risks: ["R-LEO-AI-052"]
  tags: ["loop3", "training-export", "pii-gate", "de-identification", "ner-training", "gdpr", "data-minimisation"]
