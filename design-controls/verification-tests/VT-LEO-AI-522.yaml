# -- VT-LEO-AI-522 -- Episode Engine Audit Relevance Filter (focus-first)
# IEC 62304 OQ verification

- id: "VT-LEO-AI-522"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-524"]
    risks:
      - "R-LEO-AI-512"

  metadata:
    title: "Episode Engine Audit Relevance Filter -- guards + Haiku triage + fail-open"
    description: >
      Verifies the focus-first Audit Relevance Filter (DI-LEO-AI-524)
      that runs between the segmenter/classifier and the milestone
      extractor in the Episode Engine chain. Covers the deterministic
      always-keep guards (apply_guards), the Haiku batched relevance
      triage (audit_relevance_filter.run), the assembled FocusedSet,
      the audit trace fields recorded on the EoC, and the fail-open
      behaviour on Haiku errors. The no-encounter-silently-dropped
      invariant is the headline safety property.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/episode_engine/test_audit_relevance_filter.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "FakeLLM stub from tests/episode_engine/conftest.py"
      - "Pydantic schemas from services.analysis_worker.app.episode_engine.schemas"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-522-TC-001"
      case_name: "Cancer-coded encounter is always kept by the guard even when LLM votes drop"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run apply_guards then audit_relevance_filter.run with a cancer-coded encounter and a FakeLLM that returns keep=false for the same encounter_id"
          expected_result: "Encounter appears in FocusedSet with kept_by_guard=true, kept_by_llm is None, guard_reason references the cancer code"
          verification_method: "automated"
      acceptance_criteria:
        - "Guard decision is final"
        - "LLM is never asked about guarded encounters"

    - case_id: "VT-522-TC-002"
      case_name: "Anchor encounter from segmenter is always kept by the guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide a segmenter output that tags an encounter in the referral anchor role and run the filter"
          expected_result: "Anchor encounter appears in FocusedSet with kept_by_guard=true and guard_reason names the anchor role"
          verification_method: "automated"
      acceptance_criteria:
        - "Every anchor role (referral, first_seen, diagnosis_confirmed, treatment_started, treatment_completed, benign_closure, first_presentation, place_of_first_presentation, outcome_letter) is treated as always-keep"

    - case_id: "VT-522-TC-003"
      case_name: "Deterministic safety-netting / disruption hint flag triggers always-keep guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide an encounter with hint_flag=safety_netting (or disruption) and run the filter"
          expected_result: "Encounter is kept_by_guard=true even when the LLM votes drop"
          verification_method: "automated"
      acceptance_criteria:
        - "Pre-existing deterministic detectors are not overridden by the LLM"

    - case_id: "VT-522-TC-004"
      case_name: "Haiku batching: 25 encounters produce exactly 2 batches of <= 20"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run the filter on 25 un-guarded encounters and a FakeLLM that returns one decision per encounter per batch"
          expected_result: "FakeLLM.calls has exactly 2 entries; first batch sees 20 encounter rows, second batch sees 5 rows"
          verification_method: "automated"
      acceptance_criteria:
        - "ceil(N/20) batches per window"
        - "submit_relevance tool call shape includes encounter_id, keep, reason for every input"

    - case_id: "VT-522-TC-005"
      case_name: "Fail-open on LLM error: every encounter in a failing batch flows through with kept_by_fallback=true"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run the filter with a FakeLLM that raises on converse() and 6 un-guarded encounters"
          expected_result: "All 6 encounters appear in the FocusedSet with kept_by_fallback=true and kept_by_llm=False; AuditFilterReport.audit_filter_failed=true; structured warning logged"
          verification_method: "automated"
      acceptance_criteria:
        - "Transient Bedrock outage NEVER silently turns an encounter into a missing milestone"

    - case_id: "VT-522-TC-006"
      case_name: "EoC audit trace fields are populated for every run"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run the filter with a mix of guarded, llm-kept, and llm-dropped encounters"
          expected_result: "AuditFilterReport contains audit_input_encounters, audit_kept_by_guards, audit_kept_by_llm, audit_dropped_by_llm (with up to 10 {encounter_id, reason} samples), audit_filter_failed=false"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer can see why every encounter was kept or dropped in one click"

    - case_id: "VT-522-TC-007"
      case_name: "Guard + LLM keep on the same encounter does not duplicate it"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Provide one encounter that is both cancer-coded (guard keeps) and present in the LLM batch with keep=true"
          expected_result: "Encounter appears exactly once in the FocusedSet; kept_by_guard=true, kept_by_llm=None (LLM was bypassed)"
          verification_method: "automated"
      acceptance_criteria:
        - "FocusedSet contains no duplicate encounter_ids"

    - case_id: "VT-522-TC-008"
      case_name: "FocusedSet preserves original chronological order"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run the filter on encounters at three different dates with mixed guard/LLM outcomes"
          expected_result: "FocusedSet.encounters is sorted by ascending date irrespective of guard / LLM order"
          verification_method: "automated"
      acceptance_criteria:
        - "Order matches the input timeline"

    - case_id: "VT-522-TC-009"
      case_name: "One StageTrace is recorded per Haiku batch"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run the filter on 25 un-guarded encounters and inspect the returned StageTrace list"
          expected_result: "Two StageTrace entries (one per batch); each has stage='audit_relevance_filter', input/output token counts, latency_ms"
          verification_method: "automated"
      acceptance_criteria:
        - "LLMUsage cost reporting can attribute spend to audit_relevance_filter at batch granularity"

    - case_id: "VT-522-TC-010"
      case_name: "audit_guards.apply_guards is a pure function smoke test"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call apply_guards with a mix of cancer-coded, anchor, hint-flagged, and unrelated encounters"
          expected_result: "Returns the union as guarded with the correct guard_reason for each; unrelated encounters are NOT in the guarded set"
          verification_method: "automated"
      acceptance_criteria:
        - "Pure function, no I/O, deterministic given the same inputs"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-522/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-522-RUN-001"
      executed_at: "2026-04-19T00:00:00Z"
      executor: "automated"
      result: "pass"
      notes: "10/10 cases pass via `pytest tests/episode_engine/test_audit_relevance_filter.py -v` in 0.66s. Cancer-code guard, anchor preservation, hint-flag guard, 25-encounter batching (2 batches), fail-open on Bedrock error, EoC audit trace, guard-bypasses-LLM dedup, chronological order, per-batch StageTrace, and pure-function apply_guards smoke test all confirmed."
