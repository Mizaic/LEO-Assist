    verification_tests: ["VT-LEO-AI-179"]

  specification:
    title: "Stable key prop on every GoldLabelDetailDialog mount + in-component state resync effect"
    description: |
      Two-layer fix for the dialog stale-state regression class:

        1. Caller layer -- every JSX mount of the
           GoldLabelDetailDialog component carries a stable `key`
           prop derived from the rendered GoldLabel's `label_id`,
           with a distinct namespace prefix per surface
           ("gold-", "syn-", "cand-", "sim-"). React unmounts and
           remounts the dialog when the item changes, so the
           lazy useState initialisers run again.

        2. Component-internal layer -- the dialog body declares
           a useEffect with dependency array
           [item.label_id, item.entities_json] that compares the
           previous label_id (via useRef) against the new one
           and, on change, re-derives entities,
           rejectedRelationKeys, and clears suggestions, term
           drafts, surface-form drafts, lookup target, save
           message, save error, the new-entity input, and the
           delete-confirm flags. This is the safety net for the
           case where a future contributor adds a new dialog
           mount and forgets the key prop.

    acceptance_criteria:
      - criterion: "All 4 dialog mounts carry stable key prop"
        type: "functional"
        measurement: "Test"
        target: "Static-source regex match on every <GoldLabelDetailDialog ... /> JSX block"
      - criterion: "useEffect resync re-derives entities and rejectedRelationKeys"
        type: "safety"
        measurement: "Test"
        target: "Static-source regex on the effect body inside the dialog component"
      - criterion: "Lazy useState fast path preserved"
        type: "functional"
        measurement: "Test"
        target: "Initial mount does not pay the effect cost; first render reads from entities_json directly"

  implementation:
    artifacts:
