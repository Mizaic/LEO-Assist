# -- DO-LEO-AI-219 -- /admin/console Evaluate stage inline editor mount
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-219"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-222"]
    user_needs: ["UN-LEO-AI-088"]
    risks_addressed: ["R-LEO-AI-207"]
    verification_tests: ["VT-LEO-AI-215"]

  specification:
    title: "EvaluateStage mounts the shared editor inline above the dry-run table"
    description: |
      Replaces the previous window.open / router.push deep-link
      flow on the /admin/console "Evaluate" stage. Clicking the
      pencil icon on a dry-run row now POSTs to
      /api/training/candidates/from-dry-run, takes the full
      gold_label payload from the response, and mounts the shared
      GoldLabelEditorDialog inline above the dry-run table. The
      table stays mounted in the background so the reviewer keeps
      their place in the evaluation set, including the per-row
      error-contribution context.

      The from-dry-run endpoint is updated to include the full
      GoldLabel in its response so the UI can mount the dialog
      without a second round-trip.

    acceptance_criteria:
      - criterion: "Inline mount, no navigation"
        type: "functional"
        measurement: "Test"
        target: "EvaluateStage mounts GoldLabelEditorDialog with data-testid='dry-run-gold-editor'; window.open and router.push are absent from the click handler"
      - criterion: "Endpoint returns full GoldLabel"
        type: "functional"
        measurement: "Test"
        target: "POST /training/candidates/from-dry-run response includes gold_label.label_id, gold_label.text, gold_label.entities_json"
      - criterion: "Per-row error banner"
        type: "functional"
        measurement: "Test"
        target: "If the seed POST fails the row banner surfaces the error and the dialog does not open"
      - criterion: "Gold-only save mode"
        type: "safety"
        measurement: "Test"
        target: "Dialog mounted with saveMode='gold' and the default entitySaver (no live encounter to update on the dry-run path)"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/console/EvaluateStage.tsx"
        description: "Inline dialog mount and per-row open handler"
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "from-dry-run endpoint extended to return the full GoldLabel"
    storage_location: "git"
    technical_details:
      language: "TypeScript + Python"
      loc: 120
      key_functions:
        - "EvaluateStage (open handler)"
        - "candidate_from_dry_run"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Reviewer correction flow on dry-run errors"
    risk_control_measures:
      - "Server-side de-identification (existing)"
      - "Inline mount preserves session context so reviewers do not lose their place and act on partial evidence"

  verification_status:
    verification_method: "Test"
    verification_complete: true
