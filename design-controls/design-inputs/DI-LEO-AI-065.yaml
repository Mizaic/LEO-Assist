# -- DI-LEO-AI-065 -- Bitmap Store, Compiler, and Evaluator in Terminology API

- id: "DI-LEO-AI-065"
  type: "Functional"
  derived_from: ["UN-LEO-AI-028"]
  requirement: >
    The system SHALL provide a bitmap-based guideline evaluation service in the
    terminology_api. A BitmapStore SHALL use pyroaring to build and retrieve
    Roaring bitmaps from Redis, keyed by a deterministic BLAKE2b hash. A
    GuidelineCompiler SHALL read AppropriatenessRule nodes (status: active) from
    Neo4j, build per-CriteriaGroup bitmaps, and write a versioned ruleset JSON to
    Redis. A GuidelineEvaluator SHALL load the active ruleset and evaluate a set of
    patient SNOMED codes against reqAll and forbid bitmaps in microsecond time.
    A FastAPI router SHALL expose endpoints for patient evaluation, bitmap compilation
    (fire-and-track), version listing, version activation, and status.
  rationale: >
    Deterministic, microsecond-level guideline matching against patient SNOMED codes
    is required for real-time inference. Roaring bitmaps in Redis achieve this at
    scale. Versioning allows safe rollback. Only admin-activated versions affect
    patient evaluations.

  machine_spec:
    agent_prompt: |
      Implement bitmap pipeline in terminology_api (~400 LOC across 4 files).

      FILES:
      - services/terminology_api/app/services/bitmap_store.py
        - BitmapStore class using redis.asyncio
        - Redis key scheme:
            rbm:{blake2b_16_hex} -- serialised BitMap bytes
            snomed:intids -- hash field per concept_id -> int_id
            snomed:intids:next -- atomic counter
            ruleset:{version} -- JSON ruleset
            ruleset:current -- pointer to active version
        - Methods: put_bitmap(int_ids), get_bitmap(bitmap_id),
          set_int_id(concept_id, int_id), get_or_assign_int_id(concept_id),
          write_ruleset(version, ruleset_dict), get_ruleset(version),
          get_current_ruleset(), list_versions(), set_current_version(version)

      - services/terminology_api/app/services/guideline_compiler.py
        - GuidelineCompiler class
        - _fetch_active_rules() -> list[dict]
          Cypher: MATCH (g:Guideline)-[:HAS_RECOMMENDATION]->(rec:Recommendation)
                  -[:HAS_RULE]->(rule:AppropriatenessRule {status: "active"})
                  -[:HAS_CRITERIA_GROUP]->(grp:CriteriaGroup)
                  OPTIONAL MATCH (grp)-[hc:HAS_CRITERIA]->(crit)
                  OPTIONAL MATCH (rule)-[:HAS_ACTION_GROUP]->(ag:ActionGroup)
                        -[ha:HAS_ACTION]->(proc:Procedure)
                  RETURN rule.id, rule.name, rule.strength,
                         g.guidanceNumber, rec.verbatim,
                         grp.id, coalesce(grp.type,'ALL') AS group_mode,
                         collect({crit:crit, edge:properties(hc)}) AS crits,
                         collect({proc:proc, edge:properties(ha)}) AS actions
        - compile_ruleset() -> dict -- groups by rule_id, builds bitmap IDs
        - compile_and_store(version: str) -> str
          Wraps CPU work in asyncio.to_thread(); calls write_ruleset + set_current
        - _get_int_ids(concept_ids: list[str]) -> list[int]

      - services/terminology_api/app/services/guideline_evaluator.py
        - GuidelineEvaluator class
        - evaluate_patient(patient_codes, pathway_filter=None) -> dict
          1. Load active ruleset from Redis
          2. Map patient codes to int IDs (skip unknown codes)
          3. Build patient BitMap from int IDs
          4. For each rule: check all reqAll bitmaps intersect patient set
             AND no forbid bitmap intersects patient set
          5. Return matched rules with strength, actions, confidence

      - services/terminology_api/app/routers/guidelines.py
        - FastAPI router, prefix /terminology/guidelines (set in main.py)
        - POST /evaluate -- {patient_codes: list[str], pathway_id?: str}
        - POST /bitmap/compile -- 202 + job_id, background compile_and_store()
        - GET /bitmap/versions -- list Redis ruleset versions
        - PUT /bitmap/versions/{version}/activate -- set ruleset:current
        - GET /bitmap/status -- active version, rule count, compile timestamp

      Update services/terminology_api/app/routers/__init__.py to export guidelines_router.
      Update services/terminology_api/app/main.py to include_router with prefix.
      Update services/terminology_api/requirements.txt: add pyroaring>=4.0, redis>=5.2.0.

    acceptance_criteria:
      - type: "test"
        spec: "BitmapStore.put_bitmap returns the same ID for identical int_id sets (deterministic hash)"
      - type: "test"
        spec: "BitmapStore round-trip: put then get returns equivalent BitMap"
      - type: "test"
        spec: "GuidelineCompiler groups ALL-mode criteria into separate reqAll bitmaps"
      - type: "test"
        spec: "GuidelineCompiler puts ANY-mode criteria into a single union reqAll bitmap"
      - type: "test"
        spec: "GuidelineCompiler puts ABSENT criteria into forbid bitmaps"
      - type: "test"
        spec: "GuidelineEvaluator returns a rule when all reqAll bitmaps intersect patient set"
      - type: "test"
        spec: "GuidelineEvaluator excludes a rule when any forbid bitmap intersects patient set"
      - type: "test"
        spec: "POST /bitmap/compile returns 202 immediately; compile runs in background"

    constraints:
      - type: "performance"
        spec: "GuidelineEvaluator.evaluate_patient must complete in under 10ms for rulesets up to 500 rules"
      - type: "safety"
        spec: "GuidelineCompiler only fetches rules with status: active from Neo4j"
      - type: "traceability"
        spec: "Each compiled ruleset stores compile_timestamp and rule_count in Redis"

    dependencies: ["DI-LEO-AI-064"]
    downstream_impacts:
      - "DI-LEO-AI-066 admin UI calls bitmap compile, version, and activate endpoints"
      - "Inference pipeline uses POST /evaluate for patient guideline matching"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["pyroaring", "redis", "neo4j", "pydantic"]
      file_structure:
        - "services/terminology_api/app/services/bitmap_store.py"
        - "services/terminology_api/app/services/guideline_compiler.py"
        - "services/terminology_api/app/services/guideline_evaluator.py"
        - "services/terminology_api/app/routers/guidelines.py"
        - "services/terminology_api/app/routers/__init__.py"
        - "services/terminology_api/app/main.py"
        - "services/terminology_api/requirements.txt"
      estimated_loc: 420

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All acceptance criteria pass with mocked Redis and Neo4j"
    test_protocol: "VT-LEO-AI-065"

  safety_class: "B"
  risks: ["R-LEO-AI-043"]
  tags: ["bitmap", "pyroaring", "redis", "neo4j", "terminology-api", "evaluation", "guidelines"]
