# -- DO-LEO-AI-526 -- Server-side search term expansion for the dry-run review queue
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-526"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-526"]
    user_needs: ["UN-LEO-AI-096"]
    risks_addressed: ["R-LEO-AI-063", "R-LEO-AI-174"]
    verification_tests: ["VT-LEO-AI-524"]

  specification:
    title: "Shared term-expansion module + cypher term filter for the dry-run review queue"
    description: |
      Pulls the deterministic part of the host encounter search query
      understanding -- typo correction (TYPO_MAP) and synonym
      expansion (SYNONYM_MAP) -- into a single dependency-free
      Python module, then wires the dry-run review queue endpoints
      to call that module before issuing their cypher and to pass
      the expanded term list as a `$terms` parameter.

      The cypher for `GET_TRAINING_CANDIDATES_PAGE`,
      `COUNT_TRAINING_CANDIDATES_PAGE`, `GET_GOLD_LABELS_PAGE`, and
      `COUNT_GOLD_LABELS_PAGE` gains a CASE branch that prefers
      `ANY(t IN $terms WHERE toLower(text) CONTAINS t)` when
      `$terms` is non-empty and falls back to the legacy `$search`
      substring otherwise.
    acceptance_criteria:
      - criterion: "expand_search_terms returns the synonym list"
        type: "functional"
        measurement: "Test"
        target: '`expand_search_terms("lump") == ["lump", "mass", "swelling", "nodule"]`'
      - criterion: "Single source of truth for typo/synonym maps"
        type: "functional"
        measurement: "Test"
        target: "encounter_query_understanding._TYPO_MAP IS libs.search.term_expansion.TYPO_MAP"
      - criterion: "Router forwards terms to page + count queries"
        type: "functional"
        measurement: "Test"
        target: "Both calls receive the same `terms` kwarg per request"
      - criterion: "Cypher contains the ANY-over-terms branch"
        type: "functional"
        measurement: "Test"
        target: '`ANY(t IN $terms WHERE toLower(c.text) CONTAINS t)` present in candidates and gold-labels queries'

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/search/term_expansion.py"
        description: "TYPO_MAP, SYNONYM_MAP, normalise_tokens, expand_search_terms"
      - artifact_type: "source_code"
        location: "libs/search/__init__.py"
        description: "Package marker for the new shared search helpers"
      - artifact_type: "source_code"
        location: "libs/cypher/training_candidate_queries.py"
        description: "GET_TRAINING_CANDIDATES_PAGE / COUNT_TRAINING_CANDIDATES_PAGE accept $terms"
      - artifact_type: "source_code"
        location: "libs/cypher/gold_label_queries.py"
        description: "GET_GOLD_LABELS_PAGE / COUNT_GOLD_LABELS_PAGE accept $terms"
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "list_training_candidates, list_gold_labels, _fetch_dedupe_candidates expand and forward terms"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/services/encounter_query_understanding.py"
        description: "Refactored to import from libs.search.term_expansion"
      - artifact_type: "source_code"
        location: "services/neo4j_mcp/tools/training.py"
        description: "MCP candidate + gold-label tools forward expanded terms"
      - artifact_type: "source_code"
        location: "services/api/app/services/candidate_prune.py"
        description: "Pass terms=[] explicitly to the updated cypher"
      - artifact_type: "source_code"
        location: "services/api/app/routers/pipeline.py"
        description: "Pass terms=[] explicitly to the updated cypher"
      - artifact_type: "source_code"
        location: "services/pipeline_worker/app/main.py"
        description: "Pass terms=[] explicitly to the updated cypher"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 220
      key_functions:
        - "expand_search_terms"
        - "normalise_tokens"
        - "list_training_candidates"
        - "list_gold_labels"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Reviewer-facing search results -- wrong rows would skew gold-label triage"
    risk_control_measures:
      - "Deterministic-only expansion (no LLM) keeps results predictable"
      - "CASE fallback preserves legacy behaviour for callers that have not opted in"
      - "Page query and count query receive identical `terms` kwarg per request"

  verification_status:
    verification_method: "Test"
    verification_complete: true
