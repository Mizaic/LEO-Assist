    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 800
      key_functions:
        - "PathwayExplorerWorkspace"
        - "MissionCard"
        - "ScopingWizard"
        - "HeadlineResult"
        - "useResearchState"
        - "fetchMissions"
        - "startMissionRun"
        - "pollMissionRun"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - >
        Coverage badge display (ensures every result screen shows data
        confidence before users act on findings)
      - >
        Data-gated mission cards (prevents users from attempting investigations
        that would return empty or misleading results)
    risk_control_measures:
      - "HeadlineResult always shows coverage badge when result is displayed"
      - "Data-gated missions are visually disabled and show explanation text"
      - "Method text hides algorithm names from casual users but is accessible"

  verification_status:
    verification_method: "Test"
    verification_complete: false
