# -- DO-LEO-AI-072 -- Loop 1: Overcoded Item Remediation Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-072"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-074"]
    user_needs: ["UN-LEO-AI-049"]
    risks_addressed: ["R-LEO-AI-049"]
    verification_tests: ["VT-LEO-AI-074"]

  specification:
    title: "Overcoded CodingReview Creation with Urgent Queue and 48h SLA Alert"
    description: |
      Audit Phase 3 identifies overcoded items. Each overcoded item creates a
      CodingReview node with review_type='overcoded' and priority='urgent'.
      These appear in a dedicated urgent section in the ReviewSection UI above
      the general queue. A background check creates a SafetyNetAlert if any
      urgent item remains unreviewed after 48 hours.
    acceptance_criteria:
      - criterion: "Overcoded CodingReview creation"
        type: "safety"
        measurement: "Test"
        target: "Each overcoded item from audit creates CodingReview with review_type='overcoded', priority='urgent'"
      - criterion: "Urgent queue section"
        type: "functional"
        measurement: "Test"
        target: "Overcoded items appear in dedicated Urgent section above general queue in ReviewSection"
      - criterion: "48-hour SLA alert"
        type: "safety"
        measurement: "Test"
        target: "SafetyNetAlert created with alert_type='overcoded_overdue' if urgent item unreviewed after 48h"
      - criterion: "DriftMetric population"
        type: "functional"
        measurement: "Test"
        target: "DriftMetric.overcoded_count and top_overcoded_terms populated from audit results"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "scripts/investigations/audit_encounter_coding.py"
        description: "Phase 3 overcoded detection and CodingReview creation with review_type='overcoded'"
      - artifact_type: "source_code"
        location: "libs/cypher/coding_review_queries.py"
        description: "UPSERT_CODING_REVIEW with priority and review_type fields; overcoded filter query"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/ReviewSection.tsx"
        description: "Urgent section rendering; priority sort with overcoded at top"
    storage_location: "git"
    technical_details:
      language: "Python / TypeScript"
      loc: 150
      key_functions:
        - "_create_overcoded_review"
        - "_check_overcoded_sla"
        - "renderUrgentQueue"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Overcoded items surfaced as urgent to prevent false clinical records persisting"
      - "48h SLA alert ensures overcoded items are not silently buried in a growing queue"
    risk_control_measures:
      - "Overcoded items separated from general queue; reviewer cannot miss them"
      - "SLA alert escalates if reviewer does not act within 48 hours"

  verification_status:
    verification_method: "Test"
    verification_complete: false
