# -- DI-LEO-AI-145 -- First-seen milestone for 2WW fast-track clinic attendances
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-145"
  type: "Functional"
  derived_from: ["UN-LEO-AI-006"]
  requirement: >
    The anchor detector SHALL detect "Seen in fast-track / 2WW clinic" encounter
    text as a distinct first_seen milestone bucket and the episode builder SHALL
    write an IS_PART_OF {milestone_type: 'first_seen'} edge and a first_seen_date
    property on the EpisodeOfCare node for each such encounter claimed within the
    episode window (referral_date to diagnosis_date + 90 days).
    A "first_seen" encounter is one that records the patient's attendance at the
    hospital fast-track or 2WW clinic -- distinct from the GP referral (which
    precedes it) and from the diagnosis (which may follow it or be contained in
    the same clinic letter). The minimum referral-to-diagnosis gap SHALL be
    reduced to 0 days to allow same-day PRISM-pathway workflows where the GP
    completes the 2WW referral and enters the suspected-cancer SNOMED code on
    the same calendar day.
  rationale: >
    Investigation of 24 'diagnosis-only' confirmed-cancer episodes (2025 cohort)
    showed that 10 had a genuine PRISM 2WW referral on the same calendar day as
    the diagnosis SNOMED code (one-stop breast/dermatology workflow). The current
    MIN_REFERRAL_TO_DIAG_DAYS=3 guard blocks these referrals from being claimed.
    A further 13 had "Seen in fast track clinic" text (a first_seen encounter, not
    a referral) present in the 60-day pre-diagnosis window; without a first_seen
    milestone type these encounters are invisible in pathway analytics.
    Capturing first_seen enables days_referral_to_first_seen KPI reporting per
    NCDA standard.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          _RE_FIRST_SEEN matches 'Seen in fast track suspected breast cancer clinic',
          'Seen in 2WW Clinic', 'Attended TWW suspected lung cancer clinic',
          and similar attendance phrasings; does NOT match GP-side referral phrases
          ('Fast track referral for suspected X', 'PRISM 2WW questionnaire').
      - type: "functional"
        spec: >
          AnchorResult gains a first_seen_anchors field populated from the text
          detection layer; _classify_text_encounters returns a first_seen bucket
          as the 8th element of _AnchorBuckets.
      - type: "functional"
        spec: >
          For each confirmed-cancer episode, IS_PART_OF {milestone_type: 'first_seen'}
          edges are written for all claimed first_seen encounters within the window.
      - type: "functional"
        spec: >
          first_seen_date property is set on EpisodeOfCare to the earliest
          first_seen encounter date within the episode window.
      - type: "functional"
        spec: >
          With MIN_REFERRAL_TO_DIAG_DAYS reduced to 0, the 10 same-day PRISM
          referral patients gain a 'referral' milestone edge. Total 2WW route
          rate for 2025 confirmed cancers rises from 49% to >= 58%.
    constraints:
      - type: "safety"
        spec: >
          first_seen detection MUST NOT reclassify GP-side referral encounters
          (containing 'Fast track referral for' or PRISM questionnaire phrases)
          as first_seen; the referral remains the referral milestone.
      - type: "safety"
        spec: >
          Reducing MIN_REFERRAL_TO_DIAG_DAYS to 0 MUST NOT create phantom episodes
          where a filing/admin note on diagnosis day is mistakenly claimed as a
          referral; the existing _RE_REFERRAL and PRISM primacy guards are
          sufficient since they require specific 2WW phrasing.
    dependencies: ["DI-LEO-AI-136", "DI-LEO-AI-124"]
    downstream_impacts:
      - "services/analysis_worker/app/analyzers/anchor_detector.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_config.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_types.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
    technical_details:
      language: "Python"
      framework: "episode_builder + anchor_detector"
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_config.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_types.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-143 passes: regex unit tests confirm correct first_seen detection
      and non-confusion with referral phrases; integration test confirms
      IS_PART_OF {milestone_type: 'first_seen'} edges are written and
      first_seen_date is populated on the episode; same-day referral test confirms
      d-0 PRISM referrals are now claimed.
    test_protocol: "VT-LEO-AI-143"

  safety_class: "B"
  risks: ["R-LEO-AI-096"]
  tags:
    - "episode-builder"
    - "first-seen"
    - "2ww"
    - "ncda"
