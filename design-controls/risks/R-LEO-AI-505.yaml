# -- R-LEO-AI-505 -- Episode Engine: Writer leaves stale episodes after a partial failure
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-505"
  title: "Writer leaves stale or duplicate EpisodeOfCare nodes after a partial failure"

  hazard:
    description: >
      The writer first DETACH DELETEs the patient's existing
      EpisodeOfCare nodes in the target domain, then writes the new
      ones in a single transaction. If the engine fails between
      delete and write (network drop, Bedrock timeout, process kill)
      the patient could be left with no episodes, or - if the
      transaction is replayed without the delete - with duplicate
      EoC nodes.
    category: "data_protection"

  hazardous_situation: >
    A reconciler call times out after the delete query has committed
    but before the write query runs. The patient appears to have no
    cancer episodes in the next reviewer load. Or, a retry path
    skips the delete and double-writes the same episodes with new
    deterministic IDs.

  harm:
    description: >
      Reviewers see no EpisodeOfCare for a patient who has one
      (operational disruption); or duplicate EoC nodes inflate cohort
      counts.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        write_episodes wraps the per-episode delete + write in a
        single Neo4j transaction per patient via the
        PatientGraphClient session pattern; if the transaction fails
        the delete is rolled back.
      implemented_by: ["DI-LEO-AI-505"]
      verified_by: ["VT-LEO-AI-505"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        deterministic_episode_id is a SHA-256 hash of
        (patient_id, episode_type, suspected_site, started_on)
        truncated to 24 hex chars; replays produce the same node IDs
        and the writer uses MERGE so duplicates are impossible.
      implemented_by: ["DI-LEO-AI-505"]
      verified_by: ["VT-LEO-AI-505"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        EpisodeEngineTrace records every write attempt with status,
        episode_count_before, episode_count_after; an out-of-band
        nightly job can detect patients with trace.success = false
        and replay the engine for them.
      implemented_by: ["DI-LEO-AI-505"]
      verified_by: ["VT-LEO-AI-506"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Single-transaction guarantees plus deterministic IDs eliminate
      both stale-state and duplicate-state failure modes for any
      individual patient. The trace ledger is the operational safety
      net for partial cohort runs.

  monitoring:
    monitoring_plan: >
      Track count of EpisodeEngineTrace nodes with success = false
      per day; alarm at >5 per cohort run.
    metrics:
      - "Failed writer trace count per day"
      - "Duplicate EpisodeOfCare detection (deterministic ID collision sweep)"
    review_frequency: "Weekly during rollout, monthly thereafter"

  metadata:
    identified_by: "Episode Engine v1 design review"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags: ["episode-engine", "writer", "idempotency"]
