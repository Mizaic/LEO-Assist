- id: "VT-LEO-AI-099"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-099"]
    risks: ["R-LEO-AI-063", "R-LEO-AI-065"]

  metadata:
    title: "Encounter Mission Control Hybrid Search and Batch Recode Verification"
    description: >
      Verifies encounter-centric mission control APIs and UI: org-scoped
      encounter list, hybrid search fallback behavior, batch reset+recode queue
      payloads, and shortlist-to-progress rendering.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest + playwright"
    test_file_paths:
      - "services/analytics_api/tests/test_mission_control_encounters.py"
      - "services/api/tests/test_patients_batch_recode.py"
      - "services/ui/src/__tests__/mission-control/EncounterMissionControl.test.tsx"
      - "services/ui/e2e/encounters-batch.spec.ts"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-099-TC-001"
      case_name: "Encounter list endpoint returns paged rows"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/encounters without q"
          expected_result: "Response includes total/page/page_size/items with encounter_id and patient_id"
      verification_method: "automated"
      acceptance_criteria:
        - "Endpoint returns rows with deterministic sorting and page metadata"
    - case_id: "VT-099-TC-002"
      case_name: "Hybrid search degrades gracefully when index unavailable"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/encounters with q when fulltext/vector index is unavailable"
          expected_result: "Endpoint returns 200 with empty or partial items, not server error"
      verification_method: "automated"
      acceptance_criteria:
        - "No 5xx failure when one search leg is unavailable"
    - case_id: "VT-099-TC-003"
      case_name: "Batch endpoint queues expected message shape"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call POST /patients/encounters/batch-reset-and-recode with valid items"
          expected_result: "Queued item includes run_id and queue payload with plan_definition_id/mode/trigger_analysis"
      verification_method: "automated"
      acceptance_criteria:
        - "trigger_analysis defaults false unless explicitly true"
    - case_id: "VT-099-TC-004"
      case_name: "Encounter UI shortlist submits batch payload"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Select encounter row and click Reset + recode selected"
          expected_result: "UI calls batch endpoint with patient_id and encounter_id for selected rows"
      verification_method: "automated"
      acceptance_criteria:
        - "Selected rows are submitted; status summary is rendered"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-099/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-099-RUN-001"
      date: "2026-04-12"
      executor: "automated"
      environment: "development"
      result: "fail"
      notes: >
        Python and UI unit suites passed:
        - python3 -m pytest services/analytics_api/tests/test_mission_control_encounters.py -q (4 passed)
        - python3 -m pytest services/api/tests/test_patients_batch_recode.py -q (2 passed)
        - npm test -- src/__tests__/mission-control/EncounterMissionControl.test.tsx --runInBand (2 passed)
        Playwright smoke test blocked because browser binaries are missing in this environment
        (npx playwright test e2e/encounters-batch.spec.ts requested install via npx playwright install).
    - run_id: "VT-099-RUN-002"
      date: "2026-04-12"
      executor: "automated"
      environment: "development"
      result: "fail"
      notes: >
        Partial execution completed: python3 -m pytest services/analytics_api/tests/test_mission_control_encounters.py -q
        (5 passed), python3 -m pytest services/api/tests/test_patients_batch_recode.py -q (2 passed),
        and npm test -- src/__tests__/mission-control/EncounterMissionControl.test.tsx --runInBand
        (2 passed). Playwright scenario remains blocked because (1) Chromium binaries are not installed
        (requires npx playwright install) and (2) local core-api backend was not running (ECONNREFUSED :8000).
