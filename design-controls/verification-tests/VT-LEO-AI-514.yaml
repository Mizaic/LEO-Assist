        DI-LEO-AI-521). Run 1: python3 -m pytest
        tests/sbar/test_background_partitioner.py
        tests/sbar/test_prompt_calls_background_partition.py
        tests/sbar/test_error_messages.py
        tests/test_sbar_orchestrator.py -- 40 passed in 0.14s,
        covering TC-001 (single-partition no-op,
        test_partitioner_returns_one_partition_when_under_budget),
        TC-002 / TC-005 (multi-part packing + no-record-dropped,
