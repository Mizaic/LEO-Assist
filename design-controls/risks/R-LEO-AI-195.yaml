# -- R-LEO-AI-195 -- Rejected referral with no follow-up stays in_progress until stale-close
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-195"
  title: "Episode whose referral was rejected and never resubmitted remains 'in_progress' until the stale-close pass files it months later"

  hazard:
    description: >
      Before DI-LEO-AI-205 the episode status engine had
      no signal for "every referral was rejected and no
      working referral was filed in the rescue window".
      Such episodes stayed 'in_progress' until the stale-
      close pass eventually filed them as
      'stale_no_diagnosis' months later, by which point the
      avoidable delay was unrecoverable.
    category: "clinical_safety"

  hazardous_situation: >
    A clinical reviewer using the operations queue cannot
    distinguish a healthy in-progress referral from a
    silently-broken one until weeks or months have passed.
    The patient is left in pathway limbo while the
    practice has no prompt to resubmit.

  harm:
    description: >
      Delayed cancer diagnosis from undetected broken
      referral chain; missed opportunity to resubmit while
      the rescue window is still open.
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 3
    detectability: 4
    rpn: 48
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-205: introduce status='rejected_no_followup'
        with hitl_flag=True. Triggered when every referral
        subtype on the open episode is 'rejected' /
        'marked_in_error' AND no follow-up referral was
        filed within 90 days AND no diagnosis or benign-
        closure date exists. Surfaces the case to the
        operations queue while the rescue window is still
        open.
      implemented_by:
        - "DI-LEO-AI-205"
      verified_by:
        - "VT-LEO-AI-197"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-204: care_obstruction anchor provides a
        defence-in-depth HITL flag for cases where the
        rejection narrative carries an obstruction signal
        (e.g. hospital retracted referral, patient refused
        resubmission).
      implemented_by:
        - "DI-LEO-AI-204"
      verified_by:
        - "VT-LEO-AI-198"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Diagnosis evidence and benign-closure date short-
      circuit the rule (they outrank the workflow signal),
      so a confirmed cancer or confirmed benign closure
      cannot be silently overridden. The 90-day window is
      conservative enough to allow legitimate
      resubmission delays. Care obstruction provides a
      second line of defence.

  monitoring:
    monitoring_plan: >
      Track count of EpisodeOfCare with
      status='rejected_no_followup' per practice per
      rebuild. Audit triage and resubmission outcomes for
      a sample weekly.
    metrics:
      - "EpisodeOfCare with status='rejected_no_followup' per practice per rebuild"
      - "Median days from rejection to resubmission for triaged cases"
    review_frequency: "Weekly for 12 weeks post-deployment, then monthly"

  metadata:
    identified_by: "Patient 4643293950 investigation -- Pattern A (Jan 2024 referral retracted by hospital, no working referral until Nov 2024 -- 10 month avoidable delay invisible to the operations queue)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "episode-builder"
      - "status-engine"
      - "rejected-no-followup"
      - "patient-4643293950"
