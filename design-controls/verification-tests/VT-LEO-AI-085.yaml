- id: "VT-LEO-AI-085"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-085"]
    risks: ["R-LEO-AI-059"]

  metadata:
    title: "Benign Cancer Pathway Closure Episode Builder Verification"
    description: >
      Verifies that the episode builder correctly closes cancer pathway episodes
      as 'closed_benign' when SNOMED 395100000 (No evidence of cancer found) is
      coded within 365 days of the referral, while rejecting codings outside this
      window, ensuring no episodes are created without a referral anchor, and
      confirming that cancer diagnosis always takes precedence over benign closure.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_episode_builder_benign_closure.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python test dependencies installed (pytest, pytest-asyncio)"
      - "Stub/mock PatientGraphClient available in test fixtures"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-085-TC-001"
      case_name: "Benign closure within 365 days sets closed_benign status"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build episode for patient with referral on 2024-07-01 and
            395100000 coded on 2024-12-01 (153 days -- within window).
          expected_result: >
            EpisodeOfCare created with status='closed_benign' and
            end_date='2024-12-01'.
          verification_method: "automated"
      acceptance_criteria:
        - "Episode status equals 'closed_benign'"
        - "Episode end_date equals '2024-12-01'"

    - case_id: "VT-085-TC-002"
      case_name: "Benign closure beyond 365 days does NOT close episode"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build episode for patient with referral on 2024-01-01 and
            395100000 coded on 2025-02-15 (411 days -- beyond window).
          expected_result: >
            EpisodeOfCare created with status='in_progress' and end_date=null.
          verification_method: "automated"
      acceptance_criteria:
        - "Episode status equals 'in_progress'"
        - "Episode end_date is null"

    - case_id: "VT-085-TC-003"
      case_name: "No episode created from standalone 395100000 without referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build episodes for patient with 395100000 coded but no referral
            anchors and no diagnosis anchors.
          expected_result: "No EpisodeOfCare nodes created. Result has episodes_created=0."
          verification_method: "automated"
      acceptance_criteria:
        - "EpisodeBuildResult.episodes_created equals 0"
        - "EpisodeBuildResult.episode_ids is empty"

    - case_id: "VT-085-TC-004"
      case_name: "Cancer diagnosis takes precedence over benign closure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build episode for patient with referral 2024-07-01,
            395100000 coded 2024-09-01 (62 days), AND cancer diagnosis
            coded 2024-10-01 (92 days).
          expected_result: >
            EpisodeOfCare created with status='completed' not 'closed_benign'.
          verification_method: "automated"
      acceptance_criteria:
        - "Episode status equals 'completed'"
        - "Episode status does NOT equal 'closed_benign'"

    - case_id: "VT-085-TC-005"
      case_name: "Benign closure exactly on day 365 is accepted"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Build episode with referral 2024-01-01 and 395100000 on
            2024-12-31 (exactly 365 days).
          expected_result: "Episode status='closed_benign'."
          verification_method: "automated"
      acceptance_criteria:
        - "Episode status equals 'closed_benign'"

    - case_id: "VT-085-TC-006"
      case_name: "Benign closure date precedes referral is rejected"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Build episode with referral 2024-07-01 and 395100000 coded
            on 2024-06-15 (before referral).
          expected_result: "Episode status='in_progress', no benign closure applied."
          verification_method: "automated"
      acceptance_criteria:
        - "Episode status equals 'in_progress'"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-085/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-085-RUN-001"
      date: "2026-04-06"
      executor: "automated (pytest)"
      environment: "development"
      result: "pass"
      notes: >
        8/8 test cases passed. Covered: benign closure within window (registry path
        and direct Cypher path), closure beyond 365-day window rejected, no episode
        without referral, diagnosis precedence, day-365 boundary acceptance, and
        pre-referral closure rejection. Run: pytest tests/test_episode_builder_benign_closure.py -v
