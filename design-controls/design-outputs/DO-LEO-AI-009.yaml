# -- DO-LEO-AI-009 -- Review Service and Workflow
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-009"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-015"]
    user_needs: ["UN-LEO-AI-010"]
    risks_addressed: ["R-LEO-AI-006", "R-LEO-AI-001"]
    verification_tests: ["VT-LEO-AI-009"]
    validation_tests: []

  specification:
    title: "Review Service and Workflow"
    description: |
      Provides the backend service for human review of AI-generated clinical
      coding suggestions. Manages review states (pending, accepted, rejected,
      modified), records reviewer decisions with rationale, and enforces the
      requirement that no AI-generated code reaches the clinical record
      without human approval.
    purpose: "Ensure all AI-generated coding suggestions are reviewed and approved by a qualified human before acceptance"
    technical_approach: "REST API with state-machine workflow, audit trail for every decision, and role-based access control for reviewers"
    acceptance_criteria:
      - criterion: "No AI code accepted without human review"
        type: "safety"
        measurement: "Audit log analysis for direct acceptance paths"
        target: "0 codes accepted without reviewer decision"
      - criterion: "All reviewer decisions are auditable"
        type: "functional"
        measurement: "Audit log completeness check"
        target: "100% of decisions logged with reviewer, timestamp, and rationale"
      - criterion: "Review API response time within limit"
        type: "performance"
        measurement: "p95 API response time"
        target: "<= 200ms p95"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/services/review_service.py"
        description: "Review workflow state machine and business logic"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/review.py"
        description: "REST API endpoints for review operations"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Human-in-the-loop enforcement", "Audit trail integrity"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed as part of the core-api container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-015"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["review", "human-in-the-loop", "workflow", "audit"]
    priority: "high"
    complexity: "moderate"
