# -- DI-LEO-AI-118 -- Inclusive design tokens (colour, type, spacing, motion)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-118"
  type: "Interface"
  derived_from: ["UN-LEO-AI-065", "UN-LEO-AI-068"]
  requirement: >
    The LEO UI SHALL expose a single, typed, tokenised design system
    (colour pairs, type scale, spacing scale, radius scale, motion
    scale, focus ring) that every surface consumes through MUI theme
    and matching CSS custom properties. Tokens MUST guarantee a
    minimum 16px base body font size, a minimum 12px chip/caption
    size, >=4.5:1 text contrast, >=3:1 non-text contrast, a >=3px
    visible focus ring with >=3:1 contrast, and MUST support
    prefers-reduced-motion and prefers-color-scheme at the CSS
    custom-property level so any component can adapt without
    duplicating logic.
  rationale: >
    The current theme hard-codes a 14px body, lacks a typography
    overrides table for h1-h3, uses low-contrast greys (e.g. #94a3b8
    banned by ui-safety.mdc but in practice present), provides no
    motion scale, and has no CSS custom properties. This blocks
    WCAG 2.1 AA compliance, prevents per-user density and dark-mode,
    and makes every new component re-invent visual decisions. A
    single token source removes these recurring defects and gives
    the UX redesign a testable foundation.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          theme.ts exposes typography overrides for h1 (2rem/700),
          h2 (1.5rem/700), h3 (1.25rem/600), h4 (1.125rem/700),
          h5 (1rem/700), h6 (0.95rem/600), body1 (1rem), body2
          (0.95rem), caption (0.8125rem >= 13px), with minimum
          readable sizes.
      - type: "functional"
        spec: >
          theme/tokens.ts exports SPACING, RADIUS, MOTION,
          TYPE_SCALE, CONTRAST_PAIRS, and FOCUS_RING objects
          consumed by theme.ts.
      - type: "functional"
        spec: >
          theme/tokens.css exposes each token as a CSS custom
          property (e.g. --leo-radius-sm, --leo-space-md,
          --leo-focus-ring-width) under :root, with
          prefers-reduced-motion and prefers-color-scheme media
          query overrides.
      - type: "safety"
        spec: >
          All text/background pairs exported from CONTRAST_PAIRS
          achieve >=4.5:1 for normal text and >=3:1 for large
          text (WCAG AA). A unit test proves this by computing
          the ratio from the hex values.
      - type: "safety"
        spec: >
          Focus ring is >=3px and has >=3:1 contrast against the
          default page background (#F8FAFC). A unit test proves
          this.
      - type: "functional"
        spec: >
          layout.tsx sets html.lang and html.dir (defaults "en"
          and "ltr"); globals.css respects
          prefers-reduced-motion to disable non-essential
          animations.
    constraints:
      - type: "functional"
        spec: >
          Tokens MUST NOT break existing MUI sx props; existing
          colour names (primary, secondary, success, warning,
          error, info) remain the same keys.
      - type: "performance"
        spec: >
          Token additions MUST NOT add more than 5KB gzipped to
          the first-paint CSS payload.
    dependencies: []
    downstream_impacts:
      - "services/ui/src/theme.ts"
      - "services/ui/src/theme/tokens.ts"
      - "services/ui/src/theme/tokens.css"
      - "services/ui/src/app/layout.tsx"
      - "services/ui/src/app/globals.css"
    technical_details:
      language: "TypeScript"
      framework: "Next.js + MUI"
      file_structure:
        - "services/ui/src/theme.ts"
        - "services/ui/src/theme/tokens.ts"
        - "services/ui/src/theme/tokens.css"
        - "services/ui/src/app/layout.tsx"
        - "services/ui/src/app/globals.css"
      estimated_loc: 320

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-113 cases pass: typography overrides present,
      contrast ratios computed from CONTRAST_PAIRS are >=4.5:1 and
      >=3:1 as appropriate, focus ring meets size and contrast
      requirements, CSS custom properties are emitted under :root
      and inside prefers-reduced-motion and prefers-color-scheme
      blocks. Playwright axe scan returns zero critical or serious
      a11y violations on a representative patient-reachable page.

    test_protocol: "VT-LEO-AI-113"

  safety_class: "B"
  risks: ["R-LEO-AI-078"]
  tags:
    - "ui-foundation"
    - "design-tokens"
    - "accessibility"
    - "wcag"
    - "patient-safety"
