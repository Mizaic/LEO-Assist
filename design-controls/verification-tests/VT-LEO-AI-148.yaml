# -- VT-LEO-AI-148 -- Diagnosis-aware open-episode rescue + first_seen_date persistence
# IEC 62304 Verification Protocol

- id: "VT-LEO-AI-148"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-150", "DI-LEO-AI-145"]
    risks: ["R-LEO-AI-103", "R-LEO-AI-096"]

  metadata:
    title: "Open-episode diagnosis rescue + first_seen_date persistence"
    description: >
      Verifies the helper _rescue_diagnosis_for_open_episode picks the
      earliest in-window site-compatible confirmed cancer anchor; that
      it returns None for ineligible inputs (no anchors, anchor outside
      window, wrong specific site, possible/pathway-completion
      assertion); that _build_open_episode promotes the episode to
      'completed' with end_date=rescue_date and writes a
      diagnosis_confirmed IS_PART_OF edge when the rescue fires; that
      the rescue is a no-op when status is already 'completed' (e.g.
      from specialist-letter inference). Also verifies the defect fix
      from DI-LEO-AI-145: first_seen_date is now persisted on the
      EpisodeOfCare node when _build_open_episode finds a first_seen
      anchor in the window.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_open_episode_diagnosis_rescue.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-148-TC-001"
      case_name: "_rescue_diagnosis_for_open_episode picks earliest in-window diagnosis"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Two diagnosis anchors at d+30 and d+90 in same site; ref_date=d"
          expected_result: "Returns (d+30, [anchor at d+30])"
          verification_method: "automated"
      acceptance_criteria:
        - "Earliest in-window date returned"

    - case_id: "VT-148-TC-002"
      case_name: "Helper returns None when no anchors in window"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Empty diagnosis_anchors list"
          expected_result: "None"
          verification_method: "automated"
        - step_number: 2
          action: "Anchor before ref_date"
          expected_result: "None"
          verification_method: "automated"
        - step_number: 3
          action: "Anchor after ref_date + STALE_HARD_DAYS"
          expected_result: "None"
          verification_method: "automated"
        - step_number: 4
          action: "ref_date is None"
          expected_result: "None"
          verification_method: "automated"
      acceptance_criteria:
        - "All 4 sub-cases return None"

    - case_id: "VT-148-TC-003"
      case_name: "Helper applies site-key compatibility"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Lung diagnosis on breast referral"
          expected_result: "None (incompatible specific sites)"
          verification_method: "automated"
        - step_number: 2
          action: "Unknown / NSS diagnosis on breast referral"
          expected_result: "Anchor returned (NSS matches any site)"
          verification_method: "automated"
        - step_number: 3
          action: "Breast diagnosis on breast referral"
          expected_result: "Anchor returned"
          verification_method: "automated"
      acceptance_criteria:
        - "Specific site mismatch returns None; NSS matches; same-site matches"

    - case_id: "VT-148-TC-004"
      case_name: "Possible / pathway-completion anchors do NOT trigger rescue"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Anchor with assertion='possible' in window"
          expected_result: "None"
          verification_method: "automated"
        - step_number: 2
          action: "Anchor with is_pathway_completion=True in window"
          expected_result: "None"
          verification_method: "automated"
      acceptance_criteria:
        - "Both filters honoured"

    - case_id: "VT-148-TC-005"
      case_name: "_build_open_episode promotes status when rescue fires"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build open episode with confirmed diagnosis anchor in window"
          expected_result: "WriteEpisodeParams written with status='completed', end_date=rescue date, hitl_flag=true"
          verification_method: "automated"
        - step_number: 2
          action: "Verify diagnosis_confirmed IS_PART_OF link is in the link list"
          expected_result: "Link list contains (rescue_anchors, 'diagnosis_confirmed')"
          verification_method: "automated"
      acceptance_criteria:
        - "Rescue path writes correct status and edges"

    - case_id: "VT-148-TC-006"
      case_name: "Rescue is a no-op when status already completed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Open episode where specialist-letter inference set status='completed'"
          expected_result: "Status remains 'completed' from letter; rescue does NOT overwrite end_date or hitl_reason"
          verification_method: "automated"
      acceptance_criteria:
        - "Letter-inferred completion preserved"

    - case_id: "VT-148-TC-007"
      case_name: "first_seen_date persisted on open episode (DI-LEO-AI-145 defect fix)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build open episode with one first_seen anchor in window"
          expected_result: "WriteEpisodeParams.first_seen_date == anchor date (not None)"
          verification_method: "automated"
        - step_number: 2
          action: "Build open episode with no first_seen anchors"
          expected_result: "WriteEpisodeParams.first_seen_date is None"
          verification_method: "automated"
      acceptance_criteria:
        - "first_seen_date populated when anchor present; None otherwise"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-148/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-148-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "cursor-agent"
      environment: "development"
      result: "pass"
      cases_passed: 17
      cases_failed: 0
      notes: >
        pytest tests/test_open_episode_diagnosis_rescue.py -- 17 unit tests
        passed: TC-001 (earliest in-window date returned), TC-002 (4
        sub-cases: empty, before ref, after STALE_HARD_DAYS+1, ref_date
        None), TC-003 (3 sub-cases: lung-on-breast None, NSS-on-breast
        rescued, breast-on-breast rescued), TC-004 (possible + pathway
        completion both filtered), TC-005 (status='completed', end_date
        set, hitl_flag true, hitl_reason starts with 'Auto-completed:
        confirmed cancer diagnosis'), TC-006 (LINK_ENCOUNTERS includes
        ('d-001','diagnosis_confirmed') and ('ref-001','referral')),
        TC-007 (first_seen_date persisted on open episode when anchor
        present; None when no anchor) -- DI-LEO-AI-145 defect fix
        verified.
