# -- R-LEO-AI-046 -- NICE API Schema Volatility: Silent Taxonomy Sync Failure

- id: "R-LEO-AI-046"
  title: "Undocumented NICE API schema changes could silently break taxonomy sync, leaving the taxonomy browser empty"
  hazard:
    description: >
      The NICE Syndication API's taxonomy endpoint (newtaxonomy.json) uses an
      undocumented JSON schema that differs from the published API guide. The live
      response uses lowercase keys ("name", "categories", "paths") and a self-contained
      nested tree structure, whereas the guide describes a different shape.
      If NICE changes this schema without notice, the fetch_taxonomy() parser could
      return 0 subcategories with no user-visible error, causing the taxonomy browser
      to silently fall back to an auto-sync loop or show an empty state.
    category: "data-integrity"
  hazardous_situation: >
    NICE updates newtaxonomy.json schema. The parser fails to extract categories or
    guideline codes. The taxonomy browser triggers repeated catalogue syncs (auto-sync
    loop), or shows "No areas found" without explaining why, blocking administrators
    from discovering and loading guidelines by clinical area.
  harm:
    description: >
      Taxonomy sync failure does not directly harm patients -- guidelines can still be
      loaded by typing a NICE code directly or via text search on the Redis catalogue.
      However, sustained failure degrades the discoverability UX, may cause unnecessary
      API load from repeated syncs, and reduces confidence in the system. A complete
      taxonomy blackout would require engineering intervention to diagnose and fix.
    severity: "minor"
    safety_impact: "none"
  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 3
    rpn: 12
    risk_level: "medium"
  mitigation_measures:
    - control_type: "design_feature"
      description: >
        fetch_taxonomy() logs a WARNING with the actual top-level keys received at every
        failure point in the parse chain (empty categories list, missing name field,
        empty subcategory list). There are no silent fallbacks -- every failure path
        produces a named WARNING log entry with diagnostic detail.
      implemented_by: ["DI-LEO-AI-063"]
      verified_by: ["VT-LEO-AI-063"]
    - control_type: "design_feature"
      description: >
        The taxonomy browser drawer's polling loop has a hard ceiling of 60 polls
        (3 minutes). On a 404 (server restart) it immediately re-checks Neo4j rather
        than looping. On expiry it surfaces a plain-English error message to the
        administrator rather than looping silently.
      implemented_by: ["DI-LEO-AI-066"]
      verified_by: ["VT-LEO-AI-066"]
    - control_type: "test_coverage"
      description: >
        A live integration test suite (pytest -m integration, test_nice_integration.py)
        runs fetch_taxonomy() against the real NICE API and asserts: at least 20
        subcategories returned; "conditions and diseases" category present; "cancer"
        subcategory contains NG12; all entries have required fields; all codes match
        NICE_CODE_RE. These tests are run before any release that touches the NICE
        API client, giving early detection of schema drift.
      implemented_by: []
      verified_by: ["VT-LEO-AI-063"]
    - control_type: "design_feature"
      description: >
        A diagnostic probe script (services/api/scripts/probe_nice_taxonomy.py)
        captures raw API responses at each step of the HATEOAS walk and prints them
        to stdout, enabling rapid root-cause analysis when the taxonomy structure
        changes. The script bootstraps Key Vault secrets automatically and requires
        no code changes to run.
      implemented_by: ["DI-LEO-AI-063"]
      verified_by: []
    - control_type: "design_feature"
      description: >
        Administrators can still load individual guidelines by typing a NICE code
        (e.g. NG12) directly into the search box even when the taxonomy browser is
        unavailable. The Redis catalogue (3,661+ guidelines) also supports text search
        as an alternative discovery path. Taxonomy failure does not block ingest.
      implemented_by: ["DI-LEO-AI-063", "DI-LEO-AI-066"]
      verified_by: ["VT-LEO-AI-063", "VT-LEO-AI-066"]
  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Integration tests against the live NICE API provide early detection of schema
      drift before any release. All parse failures produce WARNING logs with diagnostic
      detail. The taxonomy browser is a convenience feature -- direct code entry and
      text search remain available as fallback discovery paths. No patient safety impact.
  monitoring:
    - metric: "taxonomy_subcategory_count_per_sync"
      description: >
        Log the count of subcategories returned by each fetch_taxonomy() call.
        A count of 0 or a sudden drop from expected ~87 should trigger investigation.
      threshold: "Alert if count < 20 after a successful catalogue sync"
      frequency: "per_sync"
    - metric: "taxonomy_browser_error_rate"
      description: >
        Rate of TaxonomyBrowserDrawer rendering the error state (phase=error) in the
        admin UI. An elevated rate indicates API or connectivity problems.
      threshold: "Monitor trend"
      frequency: "monthly"
  metadata:
    identified_by: "Live API probe -- taxonomy schema mismatch found 2026-03-08"
    identified_date: "2026-03-08"
    status: "analyzed"
    tags: ["nice", "taxonomy", "api-schema", "data-integrity", "discoverability"]
