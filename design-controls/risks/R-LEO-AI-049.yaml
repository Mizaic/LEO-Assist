# -- R-LEO-AI-049 -- False Clinical Record Persists (Overcoded Diagnosis)
# ISO 14971 Risk

- id: "R-LEO-AI-049"
  title: "An overcoded diagnosis remains in a patient record undetected, causing incorrect clinical decisions or inappropriate follow-up."

  hazard:
    description: >
      The NER pipeline or LLM extractor incorrectly codes a condition that
      the patient does not have (overcoding). If the audit identifies this
      but the remediation item is not reviewed promptly, the false code
      persists in the patient's record and may influence clinical decisions,
      triage classifications, or QOF register memberships.
    category: "clinical_safety"

  hazardous_situation: >
    Audit Phase 3 identifies an overcoded diagnosis (e.g. cancer code on
    a record where the patient does not have cancer). A CodingReview node
    is created with priority='urgent'. The review item is mixed into the
    general queue and deprioritised, or the reviewer is on leave. After
    48 hours, no SafetyNetAlert is raised because the alert logic does
    not check overcoded SLA. The false code persists for days or weeks.
    Clinical staff reviewing the record act on the false code.

  harm:
    description: >
      Patient receives unnecessary clinical follow-up, investigation, or
      anxiety from a false cancer or serious condition code. Alternatively,
      an incorrect condition code affects downstream QOF searches, pathway
      decisions, or referral routing.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Overcoded items from audit Phase 3 create CodingReview nodes with
        review_type='overcoded' and priority='urgent'. These appear in a
        dedicated Urgent section at the top of the review queue, separate
        from the general queue, so reviewers cannot overlook them.
      implemented_by: ["DI-LEO-AI-074"]
      verified_by: ["VT-LEO-AI-074"]
    - control_type: "design_feature"
      description: >
        48-hour SLA alert: if any CodingReview with priority='urgent' and
        review_type='overcoded' remains status='pending' after 48 hours,
        a SafetyNetAlert is created with alert_type='overcoded_overdue'.
        This fires even if the operations UI is not being actively monitored.
      implemented_by: ["DI-LEO-AI-074"]
      verified_by: ["VT-LEO-AI-074"]
    - control_type: "protective_measure"
      description: >
        DriftMetric records overcoded_count and top_overcoded_terms per run,
        allowing trend monitoring. A sustained increase in overcoded_count
        triggers investigation of the underlying pipeline.
      implemented_by: ["DI-LEO-AI-072"]
      verified_by: ["VT-LEO-AI-072"]

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Dedicated urgent queue section and 48-hour SLA alert together ensure
      overcoded items are detected and actioned within 2 days of the weekly
      audit run. Residual risk is limited to the window between the error
      occurring and the next audit run (maximum 7 days) plus the 48-hour SLA.

  monitoring:
    monitoring_plan: >
      Track overcoded_count trend in DriftMetric across runs. Track mean
      resolution time for overcoded CodingReview items. Alert if any
      overcoded item exceeds 48h SLA more than once per month.
    metrics:
      - "overcoded_count: track weekly trend; sustained increase requires investigation"
      - "overcoded_review_mean_resolution_hours: target < 24h"
      - "overcoded_sla_breach_count: target 0 per month"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Three Learning Loops Production Plan v3.0 (CSO-004)"
    identified_date: "2026-04-03"
    status: "analyzed"
    tags: ["loop1", "overcoded", "clinical-safety", "false-record", "urgent-queue"]
