# -- DO-LEO-AI-124 -- SafetyNetAlert persistence + canonical alert_id implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-124"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-127"]
    user_needs: ["UN-LEO-AI-019"]
    risks_addressed: ["R-LEO-AI-087"]
    verification_tests: ["VT-LEO-AI-122"]

  specification:
    title: "persist_safety_net_alerts module + dashboards alert_id cleanup"
    description: |
      Creates services/analysis_worker/app/analyzers/safety_net_persistence.py
      with persist_safety_net_alerts() that writes detected signals as
      SafetyNetAlert nodes linked to Patient (HAS_SAFETY_NET_ALERT) and
      optionally EpisodeOfCare (FOR_EPISODE). Wires the call into the
      safety_net subgraph. Refactors the analytics dashboards router
      to read and write alerts exclusively via alert_id.
    acceptance_criteria:
      - criterion: "node + Patient edge created"
        type: "functional"
        measurement: "Test"
        target: >
          After persist_safety_net_alerts, a MATCH on
          (p:Patient {id:$pid})-[:HAS_SAFETY_NET_ALERT]->(a:SafetyNetAlert)
          returns every persisted signal.
      - criterion: "idempotency"
        type: "functional"
        measurement: "Test"
        target: >
          Running persist_safety_net_alerts twice does not increase
          node or edge count for the same signals.
      - criterion: "dashboards canonical key"
        type: "safety"
        measurement: "Inspection"
        target: >
          No occurrence of 'a.id' or '{id: $aid}' inside
          safety_net_alerts / safety_net_worklist / action_css_alert.
      - criterion: "API contract preserved"
        type: "functional"
        measurement: "Test"
        target: >
          safety_net_alerts and safety_net_worklist return 'id'
          field in row payload, projected from a.alert_id.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/safety_net_persistence.py"
        description: "persist_safety_net_alerts entry point"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/safety_net.py"
        description: "Invokes persist_safety_net_alerts after detection"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/dashboards.py"
        description: "alert_id in MATCH/SET/projection"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 140
      key_functions: ["persist_safety_net_alerts", "detect_safety_net", "action_css_alert"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Safety-netting alerts must survive the subgraph run to be reviewed"
    risk_control_measures:
      - "MERGE on alert_id avoids duplicate alerts on repeat runs"
      - "Canonical alert_id in router queries prevents silent no-ops on acknowledge"

  verification_status:
    verification_method: "Test"
    verification_complete: true
