# -- UN-LEO-AI-058 -- Clinical Audit Mission Control
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-058"
  title: "Cancer auditors need a single Mission Control view to find, filter, review, and validate cancer pathway episodes before clinical decisions are made on that data"
  description: |
    Cancer auditors reviewing the end-to-end LEO AI pipeline need a unified
    case management interface that replaces the basic patient list. They must
    be able to filter patients by date range, organisational scope, pathway
    status (confirmed cancer or pathway closure), cancer type, and closure
    reason. For each patient they must be able to see a visual episode
    timeline, drill into coded SNOMED data and raw encounter text to verify
    the pipeline is correct, and mark episodes as reviewed with notes. The
    interface must be usable without training by anyone from 8 to 80 years
    old.

  stakeholder:
    type: "end_user"
    role: "Cancer Auditor / Clinical Audit Lead / Cancer Pathway Manager"
    organization: "NHS Primary Care Organisation / Cancer Alliance"

  priority: "MUST"

  rationale: |
    Clinical and operational decisions about referral pathways, resource
    allocation, and quality improvement are made on the basis of LEO AI
    episode data. Before those decisions are made, auditors must be able to
    validate the pipeline output at the individual patient level. Without
    this capability, decisions may rest on unvalidated data, creating
    patient safety risk and audit governance gaps.

  benefit: "Enables pre-decision pipeline validation at patient level; reduces risk of clinical decisions based on unverified AI output"

  use_case: |
    1. Cancer auditor opens Mission Control at /care/patients.
    2. Auditor selects the 2024/25 tax year, their practice scope, and
       filters to "Confirmed cancer" episodes of type "Colorectal".
    3. KPI strip shows total patients in scope, confirmed cancer count,
       median time to diagnosis, safety netting rate, and how many still
       need review.
    4. Case list shows one row per patient, colour-coded by review status
       and time-to-diagnosis performance.
    5. Auditor clicks a patient row to expand the inline episode timeline.
    6. Auditor opens the detail drawer and clicks "Coded data" tab to see
       which SNOMED concepts were extracted and with what confidence.
    7. Auditor switches to "Encounter text" tab to verify the raw
       consultation text matches what was coded.
    8. Satisfied, auditor clicks "Mark as reviewed" and adds a short note.
    9. Progress chip in the main list updates to show "Reviewed".
    10. From the existing Audit page, auditor clicks "View X cases" on a
        cancer type stat card and is taken to Mission Control with those
        filters pre-applied.

  current_solution: |
    Basic patient list (/care/patients) showing only patient ID,
    encounter count, and a progress bar for coding review. No episode
    filtering, no timeline view, no evidence drill-down, no audit tracking.

  pain_points:
    - "No way to filter patients by cancer type or pathway status"
    - "No visual representation of the cancer pathway timeline"
    - "Cannot see raw encounter text alongside coded output to verify pipeline"
    - "No audit tracking -- cannot see who reviewed which episode or when"
    - "No link from aggregate statistics (audit page) to individual cases"
    - "Basic card list is not scalable to hundreds of patients per review session"

  acceptance_criteria:
    - "Auditor can filter the patient list by date range, org scope, pathway status, cancer type, and closure reason"
    - "KPI strip shows 6 summary metrics that update when filters change"
    - "Each patient row shows status badge, cancer type, key dates, time-to-diagnosis, and review status"
    - "Expanding a row shows the episode timeline with colour-coded intervals"
    - "Patient detail drawer has tabs for Overview, Coded Data, Encounter Text, and Audit Trail"
    - "Auditor can mark an episode as reviewed with notes, flag it, or override its status"
    - "Clicking View cases on the audit page navigates to Mission Control with filters pre-applied"

  success_metrics:
    - metric: "Pipeline validation coverage"
      target: "100% of episodes in scope can be individually reviewed before data is used for decisions"
      baseline: "Current: no individual episode review capability"
    - metric: "Time to audit a patient case"
      target: "Less than 3 minutes per patient from landing on Mission Control"
      baseline: "Current: not measurable; requires multiple tools"

  regulatory_impact: "medium"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1 (NCDA launch configuration)"
    - "NHS NCDA audit governance requirement"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"

