id: SBAR-GS-13
title: "Suspected melanoma (2WW) - changing pigmented lesion 7-point score 4"
draft: true  # NG12 backfill - rule engine seeding pending

# NICE NG12 (suspected cancer): consider a suspected cancer pathway
# referral (within 2 weeks) for melanoma if the dermoscopy or weighted
# 7-point checklist suggests it. The 7-point checklist scores at 3 or
# more for major (2 pts each: change in size, irregular shape, irregular
# colour) and minor (1 pt each: largest diameter >=7mm, inflammation,
# oozing, change in sensation) features.

clinical_scenario: |
  42-year-old male presents to GP with a 6-month history of a changing
  pigmented lesion on the back. Spouse first noticed it. Lesion is
  9 mm, irregular border with two shades of brown, no oozing or
  bleeding, no inflammation, no change in sensation. Weighted 7-point
  score: change in size (2) + irregular shape (2) + diameter >=7mm (1)
  = 5 (referral threshold is 3+). Reviewer must confirm the SBAR
  routes to a 2WW suspected melanoma pathway and that the 7-point
  score is calculated correctly and stated explicitly.

