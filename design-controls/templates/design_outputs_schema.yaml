# ============================================================================
# DESIGN OUTPUTS SCHEMA - ISO 13485 / IEC 62304 / FDA 21 CFR Part 820 Compliant
# ============================================================================
# This schema defines the structure for Design Outputs documentation used in
# the Autonomous eQMS Platform design controls process.
#
# Regulatory References:
# - ISO 13485:2016 Section 7.3.4 (Design and Development Outputs)
# - IEC 62304:2006 Section 5.3 (Software Architectural Design)
# - IEC 62304:2006 Section 5.4 (Software Detailed Design)
# - FDA 21 CFR Part 820.30(d) (Design Output)
# - ISO 14971:2019 (Risk Management - outputs must address risks)
#
# Version: 1.0
# Created: 2025-11-10
# Owner: Quality & Engineering
# ============================================================================

meta:
  schema_version: "1.0"
  schema_name: "Design Outputs Schema"
  purpose: "Define machine-readable structure for Design Outputs documentation"
  intended_use: "All design_outputs.yaml files in design controls"
  regulatory_compliance:
    - "ISO 13485:2016 Section 7.3.4 - Design and Development Outputs"
    - "IEC 62304:2006 - Medical Device Software Lifecycle (Sections 5.3, 5.4)"
    - "FDA 21 CFR Part 820.30(d) - Design Output"
    - "ISO 14971:2019 - Risk Management Integration"
  change_history:
    - version: "1.0"
      date: "2025-11-10"
      change: "Initial schema creation - addresses critical gap in design controls"
      author: "Quality Engineering"

# ============================================================================
# REGULATORY CONTEXT
# ============================================================================

regulatory_context:
  iso_13485_7_3_4_requirements:
    - "Design outputs shall meet the input requirements for design and development"
    - "Provide appropriate information for purchasing, production and service provision"
    - "Contain or reference product acceptance criteria"
    - "Specify characteristics of the product essential for its safe and proper use"
    - "Be approved before release"
    
  fda_21_cfr_820_30_d_requirements:
    - "Design output procedures shall be established and maintained"
    - "Design output shall be documented, reviewed, and approved before release"
    - "Design output shall meet design input requirements"
    - "Design output shall contain or make reference to acceptance criteria"
    - "Design output shall identify those characteristics crucial to safe and proper functioning"
    
  iec_62304_requirements:
    - "Software architecture shall implement all design inputs"
    - "Software detailed design shall enable implementation of units"
    - "Design outputs shall be verified against design inputs"
    
  iso_14971_requirements:
    - "Design outputs shall implement risk control measures"
    - "Risk analysis shall be updated when design outputs change"
    - "Residual risks shall be evaluated after design output implementation"

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

schema:
  design_output:
    description: "A single design output representing tangible result of design process"
    required: true
    fields:
      
      # --- IDENTIFICATION ---
      id:
        type: string
        required: true
        format: "DO-{PROJECT}-###"
        description: "Unique design output identifier"
        example: "DO-PLATFORM-001"
        pattern: "^DO-[A-Z]+-\\d{3}[a-z]?$"
        note: "Letter suffix (a, b, c) allowed for granular outputs"
        
      version:
        type: string
        required: true
        format: "semantic versioning (major.minor.patch)"
        description: "Version number of this design output"
        example: "1.0.0"
        note: "Incremented with each approved change"
        
      type:
        type: enum
        required: true
        values: 
          - "Software_Module"
          - "Software_Architecture"
          - "Software_Detailed_Design"
          - "Source_Code"
          - "Database_Schema"
          - "API_Specification"
          - "User_Interface"
          - "Configuration"
          - "Algorithm"
          - "Documentation"
          - "Test_Procedure"
          - "Build_Artifact"
        description: "Type of design output per IEC 62304"
        
      status:
        type: enum
        required: true
        values: ["draft", "review", "approved", "released", "obsolete", "superseded"]
        description: "Lifecycle status of design output"
        state_transitions:
          - "draft → review → approved → released"
          - "released → superseded (when newer version released)"
          - "Any state → obsolete (with justification)"
          
      # --- TRACEABILITY ---
      traceability:
        type: object
        required: true
        description: "Links to upstream requirements and downstream verification"
        fields:
          design_inputs:
            type: array
            required: true
            item_type: string
            format: "DI-{PROJECT}-###"
            min_items: 1
            description: "Design Input(s) that this output implements"
            example: ["DI-PLATFORM-001", "DI-PLATFORM-002"]
            
          user_needs:
            type: array
            required: true
            item_type: string
            format: "UN-{PROJECT}-###"
            min_items: 1
            description: "User Need(s) traced through Design Inputs"
            example: ["UN-PLATFORM-001"]
            
          risks_addressed:
            type: array
            required: false
            item_type: string
            format: "R-{PROJECT}-###"
            description: "Risk(s) whose controls are implemented by this output"
            example: ["R-PLATFORM-001"]
            
          verification_tests:
            type: array
            required: true
            item_type: string
            format: "VT-{PROJECT}-###"
            min_items: 1
            description: "Verification test(s) that verify this output"
            example: ["VT-PLATFORM-001"]
            
          validation_tests:
            type: array
            required: false
            item_type: string
            format: "VAL-{PROJECT}-###"
            description: "Validation test(s) that validate this output"
            example: ["VAL-PLATFORM-001"]
            
          dependencies:
            type: array
            required: false
            item_type: string
            format: "DO-{PROJECT}-###"
            description: "Other Design Outputs that this output depends on"
            example: ["DO-PLATFORM-005"]
            
          dependent_outputs:
            type: array
            required: false
            item_type: string
            format: "DO-{PROJECT}-###"
            description: "Other Design Outputs that depend on this output"
            example: ["DO-PLATFORM-010"]
            
      # --- CONTENT & SPECIFICATION ---
      specification:
        type: object
        required: true
        description: "Detailed specification of the design output"
        fields:
          title:
            type: string
            required: true
            min_length: 10
            max_length: 200
            description: "Human-readable title"
            example: "OutcomeTracker Class Implementation"
            
          description:
            type: string
            required: true
            min_length: 50
            max_length: 5000
            description: "Comprehensive description of what this output delivers"
            
          purpose:
            type: string
            required: true
            min_length: 30
            max_length: 1000
            description: "Why this output exists and how it fulfills Design Inputs"
            
          technical_approach:
            type: string
            required: true
            min_length: 50
            max_length: 5000
            description: "How this output is implemented (architecture, algorithms, methods)"
            
          acceptance_criteria:
            type: array
            required: true
            item_type: object
            min_items: 1
            description: "Criteria that this output must meet (ISO 13485 requirement)"
            fields:
              criterion:
                type: string
                required: true
                description: "Specific acceptance criterion"
                example: "All unit tests pass with ≥80% line coverage"
              type:
                type: enum
                required: true
                values: ["functional", "performance", "security", "safety", "quality", "regulatory"]
              measurement:
                type: string
                required: true
                description: "How criterion is measured"
              target:
                type: string
                required: true
                description: "Target value or threshold"
                example: "≥80%"
              verified_by:
                type: string
                required: false
                format: "VT-{PROJECT}-###"
                description: "Verification test that verifies this criterion"
                
      # --- IMPLEMENTATION DETAILS ---
      implementation:
        type: object
        required: true
        description: "Details of the actual implementation"
        fields:
          artifacts:
            type: array
            required: true
            item_type: object
            min_items: 1
            description: "Tangible artifacts that constitute this output"
            fields:
              artifact_type:
                type: enum
                required: true
                values:
                  - "source_code"
                  - "compiled_binary"
                  - "docker_image"
                  - "database_migration"
                  - "configuration_file"
                  - "api_definition"
                  - "design_document"
                  - "architecture_diagram"
                  - "uml_diagram"
                  - "test_script"
                  - "user_manual"
                  - "installation_guide"
                  - "maintenance_procedure"
                description: "Type of artifact"
                
              location:
                type: string
                required: true
                description: "Path or URI to artifact"
                example: "backend/src/meta_learning/outcome_tracker.py"
                
              description:
                type: string
                required: true
                description: "Description of this artifact"
                
              version:
                type: string
                required: false
                description: "Version of this artifact (if separately versioned)"
                
              hash:
                type: string
                required: false
                description: "Git commit hash or file hash for immutability"
                example: "a3f2d8e9c1b4..."
                
              storage_location:
                type: enum
                required: true
                values: ["git", "azure_blob", "container_registry", "neo4j"]
                description: "Where this artifact is stored"
                
          technical_details:
            type: object
            required: true
            fields:
              language:
                type: array
                required: true
                item_type: string
                description: "Programming language(s) used"
                example: ["Python 3.11", "TypeScript 5.x"]
                
              framework:
                type: array
                required: false
                item_type: string
                description: "Framework(s) used"
                example: ["FastAPI 0.104", "React 18"]
                
              libraries:
                type: array
                required: false
                item_type: object
                description: "External libraries/dependencies"
                fields:
                  name:
                    type: string
                    required: true
                  version:
                    type: string
                    required: true
                  purpose:
                    type: string
                    required: false
                    
              architecture_pattern:
                type: string
                required: false
                description: "Architectural pattern used"
                example: "Repository pattern, Dependency Injection"
                
              design_patterns:
                type: array
                required: false
                item_type: string
                description: "Design patterns applied"
                example: ["Singleton", "Factory", "Observer"]
                
              complexity_metrics:
                type: object
                required: false
                fields:
                  lines_of_code:
                    type: integer
                    description: "Total lines of code"
                  cyclomatic_complexity:
                    type: integer
                    description: "Average cyclomatic complexity"
                  maintainability_index:
                    type: number
                    description: "Maintainability index (0-100)"
                    
          interfaces:
            type: array
            required: false
            item_type: object
            description: "Interfaces exposed or consumed by this output"
            fields:
              interface_type:
                type: enum
                required: true
                values: ["api_rest", "api_graphql", "database", "message_queue", "file_system", "function_call", "ui_component"]
              description:
                type: string
                required: true
              specification:
                type: string
                required: false
                description: "Link to interface specification document"
                
      # --- SAFETY & RISK CHARACTERISTICS ---
      safety_characteristics:
        type: object
        required: true
        description: "Characteristics essential for safe and proper use (ISO 13485 requirement)"
        fields:
          safety_class:
            type: enum
            required: true
            values: ["A", "B", "C"]
            description: "IEC 62304 software safety classification"
            definitions:
              A: "No injury or damage to health is possible"
              B: "Non-serious injury is possible"
              C: "Death or serious injury is possible"
              
          safety_critical_functions:
            type: array
            required: false
            item_type: string
            description: "Functions critical to safety"
            example: ["Data validation", "Authentication", "Audit logging"]
            
          risk_control_measures:
            type: array
            required: false
            item_type: object
            description: "Risk controls implemented by this output"
            fields:
              risk_id:
                type: string
                required: true
                format: "R-{PROJECT}-###"
              control_description:
                type: string
                required: true
              control_type:
                type: enum
                required: true
                values: ["inherent_safety", "protective_measure", "information_for_safety", "procedural_control"]
              effectiveness:
                type: enum
                required: false
                values: ["not_effective", "partially_effective", "effective", "highly_effective"]
                
          failure_modes:
            type: array
            required: false
            item_type: object
            description: "Potential failure modes and effects"
            fields:
              failure_mode:
                type: string
                required: true
                description: "How this output could fail"
              effect:
                type: string
                required: true
                description: "Effect of failure"
              severity:
                type: enum
                required: true
                values: ["negligible", "minor", "serious", "critical", "catastrophic"]
              mitigation:
                type: string
                required: true
                description: "How failure is prevented/detected/mitigated"
                
          security_considerations:
            type: array
            required: false
            item_type: object
            description: "Security measures implemented"
            fields:
              threat:
                type: string
                required: true
                description: "Security threat addressed"
              control:
                type: string
                required: true
                description: "Security control implemented"
                
      # --- VERIFICATION STATUS ---
      verification_status:
        type: object
        required: true
        description: "Status of verification activities for this output"
        fields:
          verification_method:
            type: enum
            required: true
            values: ["Test", "Inspection", "Analysis", "Demonstration"]
            description: "Primary verification method"
            
          verification_complete:
            type: boolean
            required: true
            description: "Whether verification is complete"
            
          verification_results:
            type: array
            required: false
            item_type: object
            description: "Summary of verification results"
            fields:
              test_id:
                type: string
                required: true
                format: "VT-{PROJECT}-###"
              result:
                type: enum
                required: true
                values: ["Pass", "Fail", "Pending", "N/A"]
              date:
                type: date
                required: false
                format: "YYYY-MM-DD"
              notes:
                type: string
                required: false
                
          code_coverage:
            type: object
            required: false
            description: "Code coverage metrics (for software outputs)"
            fields:
              line_coverage:
                type: number
                required: true
                description: "Line coverage percentage"
                example: 87.5
              branch_coverage:
                type: number
                required: false
                description: "Branch coverage percentage"
              meets_target:
                type: boolean
                required: true
                description: "Whether coverage meets target (≥80% line, ≥70% branch)"
                
          static_analysis:
            type: object
            required: false
            description: "Static analysis results"
            fields:
              tool:
                type: string
                example: "pylint, mypy, ESLint"
              warnings:
                type: integer
                description: "Number of warnings"
              errors:
                type: integer
                description: "Number of errors"
              quality_gate_passed:
                type: boolean
                
      # --- PRODUCTION INFORMATION ---
      production_information:
        type: object
        required: true
        description: "Information for purchasing, production, and service provision (ISO 13485 requirement)"
        fields:
          deployment_instructions:
            type: string
            required: false
            description: "How to deploy/install this output"
            
          configuration_requirements:
            type: array
            required: false
            item_type: object
            description: "Configuration needed for production"
            fields:
              parameter:
                type: string
                required: true
              description:
                type: string
                required: true
              default_value:
                type: string
                required: false
              required:
                type: boolean
                required: true
                
          infrastructure_requirements:
            type: object
            required: false
            description: "Infrastructure resources needed"
            fields:
              compute:
                type: string
                example: "2 vCPU, 4GB RAM"
              storage:
                type: string
                example: "10GB SSD"
              network:
                type: string
                example: "HTTPS ingress, Neo4j connection"
                
          dependencies_runtime:
            type: array
            required: false
            item_type: object
            description: "Runtime dependencies"
            fields:
              dependency:
                type: string
                required: true
              version:
                type: string
                required: true
              purpose:
                type: string
                required: false
                
          maintenance_requirements:
            type: string
            required: false
            description: "Ongoing maintenance requirements"
            
          backup_recovery:
            type: string
            required: false
            description: "Backup and recovery procedures"
            
          monitoring_requirements:
            type: array
            required: false
            item_type: string
            description: "Monitoring/observability requirements"
            example: ["Health check endpoint", "Metrics endpoint", "Log aggregation"]
            
      # --- DOCUMENTATION ---
      documentation:
        type: object
        required: true
        description: "Supporting documentation for this output"
        fields:
          design_documentation:
            type: array
            required: false
            item_type: object
            description: "Design documents"
            fields:
              type:
                type: enum
                required: true
                values: ["architecture_doc", "design_doc", "api_spec", "database_schema", "algorithm_description"]
              location:
                type: string
                required: true
              version:
                type: string
                required: false
                
          user_documentation:
            type: array
            required: false
            item_type: object
            description: "User-facing documentation"
            fields:
              type:
                type: enum
                required: true
                values: ["user_manual", "installation_guide", "admin_guide", "api_reference", "release_notes"]
              location:
                type: string
                required: true
              version:
                type: string
                required: false
                
          inline_documentation:
            type: object
            required: false
            description: "Code-level documentation quality"
            fields:
              docstring_coverage:
                type: number
                description: "Percentage of functions/classes with docstrings"
              follows_standards:
                type: boolean
                description: "Whether documentation follows standards (Google/NumPy style)"
                
      # --- APPROVAL & REVIEW ---
      approval:
        type: object
        required: true
        description: "Approval workflow (ISO 13485 requires approval before release)"
        fields:
          created_by:
            type: string
            required: true
            description: "Person/team who created this output"
            example: "Engineering Team"
            
          created_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            
          reviewed_by:
            type: string
            required: false
            description: "Person who reviewed this output"
            note: "Required for status = 'approved' or 'released'"
            
          reviewed_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          approved_by:
            type: string
            required: false
            description: "Quality Manager or authorized person who approved"
            note: "Required for status = 'approved' or 'released'"
            
          approved_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          released_by:
            type: string
            required: false
            description: "Person who released to production"
            note: "Required for status = 'released'"
            
          released_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          approval_notes:
            type: string
            required: false
            max_length: 2000
            description: "Notes from approval process"
            
      # --- VERSION HISTORY ---
      version_history:
        type: array
        required: true
        item_type: object
        description: "History of all versions of this design output"
        fields:
          version:
            type: string
            required: true
            format: "major.minor.patch"
            
          date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            
          changes:
            type: string
            required: true
            description: "Summary of changes in this version"
            
          reason:
            type: string
            required: true
            description: "Reason for change"
            
          author:
            type: string
            required: true
            
          approval_status:
            type: enum
            required: true
            values: ["draft", "approved", "released"]
            
          impact_analysis:
            type: string
            required: false
            description: "Impact of changes on other outputs, risks, tests"
            
      # --- METADATA ---
      metadata:
        type: object
        required: true
        fields:
          tags:
            type: array
            required: true
            item_type: string
            min_items: 1
            description: "Tags for categorization"
            example: ["meta-learning", "foundation", "critical-path"]
            
          priority:
            type: enum
            required: false
            values: ["low", "medium", "high", "critical"]
            description: "Implementation priority"
            
          complexity:
            type: enum
            required: false
            values: ["simple", "moderate", "complex", "very_complex"]
            
          estimated_effort:
            type: string
            required: false
            description: "Estimated development effort"
            example: "3 days"
            
          actual_effort:
            type: string
            required: false
            description: "Actual development effort"
            example: "4.5 days"
            
          notes:
            type: string
            required: false
            max_length: 5000
            description: "Additional notes or comments"

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "id_format"
    description: "ID must follow pattern DO-{PROJECT}-### with zero-padded number"
    
  - rule: "version_semantic"
    description: "Version must follow semantic versioning (major.minor.patch)"
    
  - rule: "traceability_complete"
    description: "Must trace to at least one Design Input and one User Need"
    
  - rule: "verification_required"
    description: "Must link to at least one Verification Test"
    
  - rule: "acceptance_criteria_required"
    description: "Must have at least one acceptance criterion (ISO 13485 requirement)"
    
  - rule: "approval_before_release"
    description: "If status is 'approved' or 'released', approved_by and approved_date must be populated"
    
  - rule: "verification_before_release"
    description: "If status is 'released', verification_complete must be true"
    
  - rule: "safety_class_consistency"
    description: "Safety class must match the safety class of linked Design Inputs"
    
  - rule: "risk_controls_verified"
    description: "All risk controls must be verified by linked verification tests"
    
  - rule: "artifacts_exist"
    description: "At least one artifact must be documented"
    
  - rule: "documentation_complete"
    description: "Class B/C outputs require comprehensive documentation"
    
  - rule: "code_coverage_adequate"
    description: "Software outputs must meet coverage targets (≥80% line, ≥70% branch)"

# ============================================================================
# ISO 13485 COMPLIANCE MAPPING
# ============================================================================

iso_13485_compliance:
  section_7_3_4_a:
    requirement: "Design outputs shall meet the input requirements for design and development"
    schema_fields: ["traceability.design_inputs", "specification.purpose", "acceptance_criteria"]
    verification: "verification_status.verification_results shows all linked Design Inputs are met"
    
  section_7_3_4_b:
    requirement: "Provide appropriate information for purchasing, production and service provision"
    schema_fields: ["production_information", "documentation"]
    verification: "Deployment, configuration, and maintenance information documented"
    
  section_7_3_4_c:
    requirement: "Contain or reference product acceptance criteria"
    schema_fields: ["specification.acceptance_criteria"]
    verification: "At least one acceptance criterion with measurement and target"
    
  section_7_3_4_d:
    requirement: "Specify characteristics of the product essential for its safe and proper use"
    schema_fields: ["safety_characteristics"]
    verification: "Safety class, safety-critical functions, and risk controls documented"
    
  section_7_3_4_note:
    requirement: "Information for production and service provision can include details for preservation of product"
    schema_fields: ["production_information.backup_recovery", "production_information.maintenance_requirements"]

# ============================================================================
# DESIGN OUTPUT TYPES GUIDANCE
# ============================================================================

output_type_guidance:
  Software_Module:
    description: "Complete software module/class implementing specific functionality"
    typical_artifacts: ["source_code", "test_script", "api_definition"]
    example: "OutcomeTracker class (DO-PLATFORM-001)"
    
  Software_Architecture:
    description: "High-level system architecture and component interactions"
    typical_artifacts: ["architecture_diagram", "design_document", "api_definition"]
    example: "Meta-learning system architecture (DO-PLATFORM-ARCH-001)"
    
  Software_Detailed_Design:
    description: "Detailed design of software units ready for implementation"
    typical_artifacts: ["design_document", "uml_diagram", "algorithm_description"]
    example: "Pattern recognition algorithm design (DO-PLATFORM-005)"
    
  Source_Code:
    description: "Actual source code implementation"
    typical_artifacts: ["source_code"]
    example: "Python modules, TypeScript components"
    
  Database_Schema:
    description: "Database structure and data model"
    typical_artifacts: ["database_migration", "design_document"]
    example: "Neo4j graph schema for traceability (DO-PLATFORM-DB-001)"
    
  API_Specification:
    description: "REST/GraphQL API contracts"
    typical_artifacts: ["api_definition", "design_document"]
    example: "CopilotKit integration API (DO-PLATFORM-API-003)"
    
  User_Interface:
    description: "UI components and screens"
    typical_artifacts: ["source_code", "design_document", "screenshot"]
    example: "Design Controls Dashboard (DO-PLATFORM-UI-001)"
    
  Configuration:
    description: "System configuration and deployment manifests"
    typical_artifacts: ["configuration_file", "docker_image"]
    example: "Kubernetes deployment configuration (DO-PLATFORM-CFG-001)"
    
  Algorithm:
    description: "Specific algorithm implementation"
    typical_artifacts: ["source_code", "algorithm_description"]
    example: "Similarity scoring algorithm (DO-PLATFORM-ALG-001)"
    
  Documentation:
    description: "User manuals, admin guides, training materials"
    typical_artifacts: ["user_manual", "installation_guide", "admin_guide"]
    example: "User manual for meta-learning system (DO-PLATFORM-DOC-001)"
    
  Test_Procedure:
