    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 950
      key_functions:
        - "BaseNode"
        - "NodeHandle"
        - "NodeHeader"
        - "NodeStatusStrip"
        - "ActionNode"
        - "resolveRunStatus"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Aria-label generation on every connection handle (preserves screen-reader access to the canvas)"
      - "Keyboard activation on every interactive node (preserves keyboard-only operability)"
      - "Halted-state border + tooltip on ActionNode (signals where the pipeline stopped during a dry run)"
    risk_control_measures:
      - "NodeHandle always emits an aria-label via resolvedAria; no opt-out is exposed in the prop API"
      - "BaseNode binds onClick + onKeyDown together so a node that is mouse-clickable is always also keyboard-operable"
      - "NodeStatusStrip retains all six pre-existing visual states (running pulse, halted glow, queued pip, completed dot+duration, errored dot, skipped label) so the existing dry-run UX is preserved"

  verification_status:
    verification_method: "Test"
    verification_complete: true
