# -- VT-LEO-AI-129 -- RoleGate / RolePicker / RoleSwitcher primitives
# IEC 62304 Verification Test

- id: "VT-LEO-AI-129"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-133"]
    risks: ["R-LEO-AI-089", "R-LEO-AI-091"]

  metadata:
    title: "Role-first shell primitives behave per spec and respect the feature flag"
    description: >
      Verifies the RoleProvider reads session, RolePicker appears when
      selected_role is null, PATCHes on confirm and closes; the
      RoleSwitcher renders only for multi-role users; the AppShell
      nav is scoped by role when the feature flag is on and preserves
      the existing shell when off.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/design-system-role-gate.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "global.fetch is mocked for /auth/session and PATCH /auth/session/role"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-129-TC-001"
      case_name: "Picker shows when selected_role is null"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render RoleGate with a session { selected_role: null, allowed_roles: ['clinician','staff'] }"
          expected_result: "RolePicker dialog is rendered with role=dialog and aria-modal=true"
      verification_method: "automated"
      acceptance_criteria:
        - "screen.getByRole('dialog') resolves"
        - "The dialog offers both allowed_roles as options"

    - case_id: "VT-129-TC-002"
      case_name: "Picker PATCHes on confirm"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "User selects 'clinician' and clicks Continue"
          expected_result: "fetch is called with PATCH /auth/session/role body {role: 'clinician'} and the dialog closes"
      verification_method: "automated"
      acceptance_criteria:
        - "fetch called with method 'PATCH' and the correct body"

    - case_id: "VT-129-TC-003"
      case_name: "Switcher hidden for single-role users"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render RoleSwitcher with allowed_roles: ['clinician']"
          expected_result: "Component renders nothing"
      verification_method: "automated"
      acceptance_criteria:
        - "container.firstChild is null"

    - case_id: "VT-129-TC-004"
      case_name: "Switcher visible for multi-role users"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render RoleSwitcher with allowed_roles: ['clinician','qa_ra_lead']"
          expected_result: "A button with aria-label 'Switch role' is rendered"
      verification_method: "automated"
      acceptance_criteria:
        - "screen.getByRole('button', { name: /switch role/i }) resolves"

    - case_id: "VT-129-TC-005"
      case_name: "Feature flag off preserves legacy shell"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render AppShell with NEXT_PUBLIC_ROLE_FIRST unset or 'off'"
          expected_result: "Legacy nav items are rendered; no RolePicker is shown"
      verification_method: "automated"
      acceptance_criteria:
        - "RolePicker is NOT in the document"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-129/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-129-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-1-foundation"
      environment: "development"
      result: "pass"
      notes: >
        jest src/__tests__/design-system-role-gate.test.tsx -> passed.
        Covers RolePicker render, RoleSwitcher PATCH /auth/session/role,
        RoleGate hides app until selection, feature-flag gated via
        NEXT_PUBLIC_ROLE_FIRST.
