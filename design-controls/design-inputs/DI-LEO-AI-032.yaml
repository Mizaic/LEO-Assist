# -- DI-LEO-AI-032 -- FHIR Measure Evaluation
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-032"
  type: "Functional"
  derived_from: ["UN-LEO-AI-022"]
  requirement: "The system SHALL evaluate FHIR Measure resources against patient population data, producing MeasureReport resources with stratified results by organisation, time period, and demographic dimensions"
  rationale: "FHIR Measure/MeasureReport provides the standard format for clinical quality measures. Evaluation against the patient population produces standardised audit reports that can be shared with commissioners and national audit programmes."

  machine_spec:
    agent_prompt: |
      Implement FHIR Measure evaluation service (~250 LOC).

      SINGLE PURPOSE: Evaluate FHIR Measure resources against
      patient population data and produce stratified MeasureReport
      resources.

      REQUIREMENTS:
      1. Parse Measure resource population criteria
      2. Generate Cypher queries from Measure group definitions
      3. Execute population queries against Neo4j patient data
      4. Calculate numerator, denominator, and exclusion counts
      5. Stratify results by organisation, time period, demographics
      6. Produce valid FHIR MeasureReport resources

      METHODS:
      - evaluate_measure(measure_id, params): Run full evaluation
      - generate_cypher(group): Convert Measure group to Cypher
      - calculate_populations(results): Count num/denom/excl
      - stratify_results(data, dimensions): Apply stratifiers
      - build_measure_report(results): Assemble FHIR resource

      CODE CLARITY:
      - Cypher generation separated from execution
      - Stratification logic is dimension-agnostic
      - MeasureReport assembly follows FHIR R4 spec exactly

    acceptance_criteria:
      - type: "test"
        spec: "MeasureReport output matches manual calculation for test Measures"
      - type: "test"
        spec: "Stratification produces correct breakdowns by all dimensions"
      - type: "test"
        spec: "Generated MeasureReport passes FHIR R4 validation"

    constraints:
      - type: "regulatory"
        spec: "MeasureReport must conform to FHIR R4 specification"
      - type: "performance"
        spec: "Measure evaluation completes in <= 30 seconds for typical population"

    dependencies: []

    downstream_impacts:
      - "DI-LEO-AI-031 -- MeasureReport served via FHIR endpoints"
      - "services/fhir_api -- evaluation service called by MeasureReport router"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/fhir_api/app/services/measure_service.py"
        - "services/fhir_api/app/services/cypher_generator.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "MeasureReport output matches manual calculation for test Measures; stratification produces correct breakdowns"
    test_protocol: "VT-LEO-AI-032"

  safety_class: "B"
  risks: ["R-LEO-AI-021"]
  tags: ["fhir", "measure", "evaluation", "reporting"]
