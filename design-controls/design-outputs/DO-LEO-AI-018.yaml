  specification:
    title: "Dashboard and Safety Netting UI"
    description: |
      Front-end pages and components that present practice-level KPI cards,
      trend charts, and a safety netting worklist. The dashboard gives
      clinicians and practice managers an at-a-glance view of coding quality
      and QOF performance. The safety netting worklist highlights patients
      whose care episodes may have missing or incorrect clinical codes,
      allowing clinicians to review and action them.
    purpose: "Visual dashboards and safety netting worklist UI components for clinical users"
    technical_approach: |
      Built with Next.js and React using server components where possible
      for fast initial render. KPI cards fetch data from the Analytics API.
      The safety netting page uses a patient pathway worklist component
      that supports filtering, sorting, and inline episode timeline views.
      All components follow the project MUI design system and meet WCAG 2.1
      AA accessibility standards.
    acceptance_criteria:
      - criterion: "Dashboard page renders KPI cards with data from the Analytics API"
        type: "functional"
        measurement: "End-to-end test with mocked API verifies card content"
        target: "All KPI cards display correct values"
      - criterion: "Safety netting worklist displays patients requiring review"
        type: "functional"
        measurement: "Component test with fixture data verifies patient rows and sort order"
        target: "Worklist renders all flagged patients in priority order"
      - criterion: "Episode timeline view shows chronological care events"
        type: "functional"
        measurement: "Component test verifies timeline ordering and event details"
        target: "Events displayed in correct chronological order"
      - criterion: "UI meets WCAG 2.1 AA accessibility requirements"
        type: "quality"
        measurement: "Automated axe-core accessibility scan"
        target: "Zero critical or serious accessibility violations"

