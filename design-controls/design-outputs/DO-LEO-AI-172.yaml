# -- DO-LEO-AI-172 -- Site reconciliation in episode build
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-172"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-173"]
    user_needs: ["UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-170"]
    verification_tests: ["VT-LEO-AI-170"]

  specification:
    title: "Episode-builder site reconciliation when diagnosis disagrees with referral"
    description: |
      Implements DI-LEO-AI-173. Adds a small reconciliation block to
      _build_closed_episode in
      services/analysis_worker/app/analyzers/episode_builder/_builder.py
      that picks the most explicit available site signal across the
      diagnosis anchors of a diagnosis-led group, and flips the
      EpisodeOfCare.cancer_type to that signal when it disagrees with
      the referral-derived working site_key.

      The block runs AFTER the existing fallback that promotes
      first_presentation/referral concept names when the working
      site_key is unknown/non_site_specific, so it only intervenes when
      the working site_key is otherwise specific. When triggered, it
      forces hitl_flag=True and appends a structured reason to
      hitl_reason. Open (in_progress) episodes are unaffected.

    acceptance_criteria:
      - criterion: "Conflicting explicit diagnosis site wins"
        type: "functional"
        measurement: "Test"
        target: "When a diagnosis anchor carries site_source in {explicit_2ww_code, explicit_malignancy_code, malignancy_term_problem_line} and a different site_key, EpisodeOfCare.cancer_type adopts that key."
      - criterion: "HITL flag forced on reconciliation"
        type: "safety"
        measurement: "Test"
        target: "EpisodeOfCare.hitl_flag is True and hitl_reason contains 'Site reconciled' substring."
      - criterion: "No reconciliation when sites match"
        type: "functional"
        measurement: "Test"
        target: "When the diagnosis anchor's explicit site equals the working site_key, hitl_flag and hitl_reason are unchanged."
      - criterion: "No downgrade to unknown"
        type: "safety"
        measurement: "Test"
        target: "Reconciliation never replaces a specific site with 'unknown' or 'non_site_specific'."
      - criterion: "Live-corpus impact"
        type: "performance"
        measurement: "Live rebuild"
        target: "Episode a6c093d2702d379f flips cancer_type from liver to prostate with hitl_flag=True."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        description: "Site-reconciliation block in _build_closed_episode."
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 35
      key_functions:
        - "_build_closed_episode"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Cancer-site classification (drives NCDA pathway split)"
    risk_control_measures:
      - "Hitl_flag forced on every reconciliation; humans adjudicate"
      - "Guard against downgrade to unknown/non_site_specific"
      - "Only diagnosis-led (closed) episodes affected; in_progress unchanged"

  verification_status:
    verification_method: "Test"
    verification_complete: false
