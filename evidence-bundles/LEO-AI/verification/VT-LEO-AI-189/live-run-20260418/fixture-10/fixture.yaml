id: SBAR-GS-10
title: 'Multi-rule prioritisation: 2WW + routine simultaneously - 2WW must dominate'
clinical_scenario: '68-year-old man with new dysphagia AND chronic mild osteoarthritis

  knee pain. Two rules fire: a 2WW upper GI rule for dysphagia and a

  routine MSK rule for the knee. Reviewer must confirm the 2WW rule

  appears first in the Assessment, dominates the pathway hints, and

  the Recommendation does not bury the urgent action under routine

  follow-up. Hardening rule 6 (limit Background to material relevance)

  is also tested.

  '
