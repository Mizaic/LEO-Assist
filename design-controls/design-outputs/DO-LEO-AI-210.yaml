      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/useEncounterRecode.ts"
        description: "useEncounterRecode hook (queue + SSE progress + refresh-until-coded) extracted to keep EncounterTextTab under 500 LOC."
    storage_location: "git"
    technical_details:
