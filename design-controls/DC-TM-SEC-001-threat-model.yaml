      threat_actors: []
      evidence:
        file: "services/api/app/services/patient_graph_writer.py"
        line: 38
        snippet: "def _upsert_query(label: str) -> str:\n    return f\"\"\"\nMATCH (e:Encounter {{id: $encounter_id}})\nMERGE (s:{label} {{conceptId: $concept_id}})\n\"\"\""
      impact:
        confidentiality: "None"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "The label parameter is derived from _label_for_tag() which normalizes to a fixed set. However, the pattern of f-string Cypher construction is a latent risk if the mapping is modified."
      existing_controls: "_label_for_tag normalization restricts labels to fixed set; all other Cypher parameters use $param placeholders"
      gaps: "Pattern of f-string label interpolation is fragile; should use parameterized label construction"
