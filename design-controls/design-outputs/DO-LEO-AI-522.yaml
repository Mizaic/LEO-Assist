        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/sbar/prompt_calls.py"
        description: "_try_reduce_partials invokes the reduce prompt once per multi-part run"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 100
      key_functions:
        - "SBAR_BACKGROUND_REDUCE_SYSTEM_V1 (system prompt constant)"
