# -- VT-LEO-AI-172 -- Skin/melanoma inventory + cancer follow-up + benign-phrase scope guard
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-172"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-175", "DI-LEO-AI-177", "DI-LEO-AI-178"]
    risks: ["R-LEO-AI-172", "R-LEO-AI-173"]

  metadata:
    title: "Skin/melanoma inventory completeness, cancer follow-up template recogniser, and benign-investigation phrase scope guard"
    description: >
      Verifies the three coordinated changes that recover the
      patient 4921442355 (Mr Harold Allwyn) Lentigo maligna
      melanoma case and the two related missed melanoma episodes
      a644d1c1586405a6 and fb62376ea4b48443:
      (1) skin / melanoma vocabulary (XaMeA, XaPyd, B32.. family,
          Xa99Y, lentigo maligna term patterns, 7G055/X90PX
          treatment procedures);
      (2) cancer follow-up template recogniser (Skin / Breast /
          Prostate / etc. Cancer Follow Up template names);
      (3) benign-investigation phrase scope guard that prevents
          the day-17 closure bug where an unrelated CKD encounter
          containing "no further action" silently closed the
          parallel skin-cancer episode.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_stale_detector_fixes.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-172-TC-001"
      case_name: "FAST_TRACK_REFERRAL_READ_CODES contains XaMeA -> melanoma"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_fast_track_referral_site('Fast track referral for suspected skin cancer (XaMeA)')."
          expected_result: "Returns ('XaMeA', 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "2WW skin code now mapped to the melanoma site."

    - case_id: "VT-172-TC-002"
      case_name: "SPECIALIST_CLINIC_READ_CODES contains XaPyd -> melanoma"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_specialist_clinic_site('Seen in fast track suspected skin cancer clinic (XaPyd)')."
          expected_result: "Returns ('XaPyd', 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "Specialist clinic code recognised."

    - case_id: "VT-172-TC-003"
      case_name: "MALIGNANCY_READ_CODES recognises Xa99Y (Lentigo maligna)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_code('Major: Lentigo maligna melanoma (Xa99Y)')."
          expected_result: "Returns ('Xa99Y', 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "Audit-discovered code is now in the inventory."

    - case_id: "VT-172-TC-004"
      case_name: "MALIGNANCY_READ_CODES recognises B32.. family (B3230 cheek)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_code('Diagnosis: Malignant melanoma of cheek (B3230)')."
          expected_result: "Returns ('B3230', 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "B32.. family appendix sweep applied."

    - case_id: "VT-172-TC-005"
      case_name: "MALIGNANCY_READ_CODES recognises B32.. parent code"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_code('Problem: Malignant melanoma of skin (B32..)')."
          expected_result: "Returns ('B32..', 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "Parent B32.. mapping present."

    - case_id: "VT-172-TC-006"
      case_name: "MALIGNANCY_TERM_PATTERNS matches 'lentigo maligna melanoma' on a problem-list line"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_term_in_problem_line('Major: Lentigo maligna melanoma - excised by plastics April 2025')."
          expected_result: "Returns (matched_term, 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "Histological subtype recognised."

    - case_id: "VT-172-TC-007"
      case_name: "Other melanoma subtypes recognised on problem-list lines"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_term_in_problem_line for 'Major: Superficial spreading melanoma', 'Problem: Nodular melanoma', 'Active Problem: Acral lentiginous melanoma'."
          expected_result: "All three return (term, 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "All four common melanoma subtypes mapped."

    - case_id: "VT-172-TC-008"
      case_name: "CANCER_TREATMENT_PROCEDURE_CODES contains 7G055 and X90PX"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert '7G055' in CANCER_TREATMENT_PROCEDURE_CODES and 'X90PX' in CANCER_TREATMENT_PROCEDURE_CODES."
          expected_result: "Both assertions hold."
          verification_method: "automated"
      acceptance_criteria:
        - "Wide excision and biopsy action codes present."

    - case_id: "VT-172-TC-009"
      case_name: "Treatment anchor fires on encounter containing 7G055"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Wide excision of skin lesion (7G055) - right cheek lentigo maligna'."
          expected_result: "treatment anchor emitted for the encounter."
          verification_method: "automated"
      acceptance_criteria:
        - "Treatment milestone fires from procedure code alone."

    - case_id: "VT-172-TC-010"
      case_name: "find_cancer_follow_up_phrase recognises 'Skin Cancer Follow Up'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_cancer_follow_up_phrase('Template: Skin Cancer Follow Up - 6 month surveillance')."
          expected_result: "Returns (matched_phrase, 'melanoma')."
          verification_method: "automated"
      acceptance_criteria:
        - "Skin surveillance template mapped to melanoma site."

    - case_id: "VT-172-TC-011"
      case_name: "find_cancer_follow_up_phrase recognises 'Breast Cancer Follow Up'"
      priority: "high"
