  specification:
    title: "Role-first rollout flag removed; duplicate primitives deleted; font @import removed; sx colour-literal lint rule added"
    description: |
      Closing move for Wave D. The NEXT_PUBLIC_ROLE_FIRST flag is
      physically removed from next.config.mjs, RoleShellProvider, and
      AppShell -- the role-first shell is the only codepath. The
      duplicate MUI-backed ProgressiveReveal in components/ui/ is
      deleted in favour of the design-system primitive. The Google
      Fonts @import that predated next/font is removed from
      globals.css (DM Sans + JetBrains Mono already load via
      next/font/google). eslint.config.mjs now carries a
      no-restricted-syntax rule that flags hex / rgb / hsl colour
      literals inside JSX sx props so new contributions stay on the
      token system.
    acceptance_criteria:
