# -- DO-LEO-AI-109 -- Observable value-unit linking: string results and pre-entity values
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-109"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-111"]
    user_needs: ["UN-LEO-AI-064"]
    risks_addressed: ["R-LEO-AI-077"]
    verification_tests: ["VT-LEO-AI-111"]

  specification:
    title: "Extended value-unit linker in post-processing Layer 6"
    description: |
      Extends link_observable_value_units in libs/pipeline/post_processing.py
      with two additional linking passes beyond the existing numeric entity pass:

      Pass 2 - String result linking:
        Builds a list of entity indices whose text is in _RESULT_DESCRIPTOR_TEXTS.
        For each observable_entity that still has no value, finds the nearest
        string result entity within 40 characters and sets obs["value"] to the
        lowercased text and obs["unit"] to "".

      Pass 3 - Raw-text fallback scan:
        When encounter_text is provided, scans a window of up to 60 characters
        immediately before each still-unlinked observable entity's start offset.
        Applies _VALUE_UNIT_RE for numeric matches and _RESULT_DESCRIPTOR_TEXTS
        for string matches. Attaches the last (closest) match found.

      The function signature gains an optional encounter_text: str = ""
      parameter. The call site in run_post_processing threads the existing
      encounter_text argument through.

      A new private predicate _is_string_result_text is added alongside
      _is_numeric_measurement_text for use in Pass 2.

    acceptance_criteria:
      - criterion: "String entity linking"
        type: "functional"
        measurement: "Test"
        target: "obs.value == 'negative' and obs.unit == '' after Pass 2"
      - criterion: "String entity before observable"
        type: "functional"
        measurement: "Test"
        target: "obs.value == 'positive' when string qualifier precedes entity in character order"
      - criterion: "Raw-text numeric fallback"
        type: "functional"
        measurement: "Test"
        target: "obs.value == '7.2' and obs.unit == 'mmol/L' from raw text when no entity extracted"
      - criterion: "Raw-text string fallback"
        type: "functional"
        measurement: "Test"
        target: "obs.value == 'negative' from raw text when no qualifier entity extracted"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "link_observable_value_units, _is_string_result_text"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "link_observable_value_units"
        - "_is_string_result_text"
        - "_link_string_results"
        - "_raw_text_fallback_scan"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Attaching correct result values to observable entities used in abnormal result detection"
    risk_control_measures:
      - "60-character window constraint prevents cross-sentence value attachment"
      - "Exact-match filter on _RESULT_DESCRIPTOR_TEXTS prevents free-text fragments being misread as results"

  verification_status:
    verification_method: "Test"
    verification_complete: true
