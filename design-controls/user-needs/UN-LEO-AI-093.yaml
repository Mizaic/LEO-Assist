# -- UN-LEO-AI-093 -- Synonym sets, descendant expansion and carve-outs in rule authoring
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-093"
  title: "Clinical guideline authors can express a single rule criterion as a set of equivalent SNOMED codes (a synonym set), opt into descendant expansion per code, and exclude specific sub-codes that should not fire the rule"

  description: |
    SNOMED CT routinely encodes the same clinical concept multiple ways:
    "Smoker" (77176002), "Cigarette smoker" (230063004), "Pipe smoker"
    (230065006), and many more, often spread across different semantic
    tags (finding, situation, lifestyle). NICE guidance written as
    "smoker" is intended to fire on any of those codes. The current
    rule editor only allows ONE SNOMED code per criterion, so authors
    either:

      - pick the most general code and rely on hierarchy expansion,
        which sweeps in unwanted descendants like "Trial of smoking",
      - or build a verbose OR group of single-code chips that visually
        demotes the headline ("Smoker") into one option among many.

    Authors need a single criterion (one chip in the editor) that:

      1. Holds one or more equivalent SNOMED codes (a synonym set)
         where any patient code matching any seed satisfies the leaf.
      2. Lets each seed independently include descendants in the IS_A
         hierarchy (so "Smoker" can sweep its descendants while the
         "History of asbestos exposure" situation does not).
      3. Lets the author list specific concept ids to EXCLUDE from
         the descendant sweep (carve-outs), so a known false-positive
         descendant cannot fire the rule.
      4. Continues to display under one human-readable headline term
         (the "primary" preferred term) so the rule summary stays
         readable.

    The change must be backwards compatible: every existing rule must
    continue to fire on exactly the same patient set after the schema
    upgrade unless an author explicitly adds a synonym, descendant
    flag, or carve-out.

  stakeholder: "Clinical guideline author, QA / RA reviewer, clinical lead"

  priority: "high"

  rationale: >
    Coding variability is the single most common reason a NICE rule
    fails to fire on a patient who clinically meets the criterion.
    Today the only way to express a synonym set is to wrap the chip
    in an OR group, which clutters the pathway view and obscures the
    fact that the codes are intended to be equivalent. Authors
    routinely either give up on the variants (silent under-firing,
    Class B safety risk) or wrap the chip in OR (visual clutter that
    increases review time and error rate). A first-class synonym set
    plus per-seed descendant control plus targeted carve-outs gives
    authors the precision they need without leaving the chip view.

  acceptance_criteria:
    - "An author can attach one OR more SNOMED codes to a single CONCEPT chip in the EditRuleDialog and nominate one as the primary preferred term used as the chip label"
    - "Each seed code carries its own include_descendants flag (default true) and optional distance_child override; the rule fires when any patient code matches any seed (or seed descendant when the flag is set)"
    - "An author can add SNOMED concept ids to an excluded_concept_ids list on the chip; codes in that list are subtracted from the bitmap after descendant expansion, so the rule cannot fire on those exact codes"
    - "Existing rules persisted with a single snomed_concept_id continue to compile and evaluate to the same matched-patient set as before this change (backward compatibility)"
    - "The bitmap compiler produces ONE bitmap per CONCEPT leaf representing the union of (all seed closures) minus (excluded_concept_ids); evaluation remains a single bitmap intersection per leaf"
    - "The evaluator and the diagnose endpoint return matched_concept_ids per CONCEPT leaf (which patient code(s) hit the bitmap) so the SBAR Assessment narrative can name the matched code"
    - "The SBAR Assessment formatter records the matched concept ids per matched rule in its rule snapshot so a downstream renderer can say 'matched on Cigarette smoker (a kind of Smoker)' rather than just naming the rule"
    - "A migration script upgrades every persisted v2 AppropriatenessRule.logicJson into the new shape without changing the int-id set passed to put_bitmap (zero clinical-output drift)"
    - "Author copy in the UI follows the project's plain-English standard (reading age 9-11, no SNOMED ids in chip labels)"

  design_inputs:
    - "DI-LEO-AI-508"
    - "DI-LEO-AI-509"
    - "DI-LEO-AI-510"
    - "DI-LEO-AI-511"

  validation_tests: ["VAL-LEO-AI-015"]

