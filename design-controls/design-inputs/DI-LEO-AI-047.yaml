# -- DI-LEO-AI-047 -- Consensus Arbitrator Third-Verdict Audit Alert
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-047"
  type: "Safety"
  derived_from: ["UN-LEO-AI-021"]
  requirement: >
    The dual-model consensus runner (libs/llm_client/consensus.py) SHALL emit
    a WARNING-level log message with the keyword
    "consensus.arbitrator_third_verdict" whenever the Sonnet arbitrator returns
    a verdict that differs from both the AWS and Azure primary model verdicts.
    The warning MUST include the arbitrator verdict, the AWS verdict, and the
    Azure verdict.

    This warning is an audit control signal: an unexpected third verdict from
    the arbitrator may indicate that an LLM model has been jailbroken,
    subjected to prompt injection, or is producing anomalous output.
  rationale: >
    The consensus architecture (DI-LEO-AI-036) expects the arbitrator to
    resolve a two-way split -- it normally returns one of the two existing
    verdicts. A third verdict (distinct from both primary verdicts) is a
    statistically unusual outcome. While it can arise from genuine model
    uncertainty, it is also the expected output pattern for a successful
    prompt injection or jailbreak that produces a non-standard verdict string.
    Making this case explicitly observable in logs enables post-incident
    forensic analysis and ongoing anomaly monitoring (R-LEO-AI-030).

  machine_spec:
    agent_prompt: |
      Update libs/llm_client/consensus.py.

      In the disagreement-and-arbitration branch, after the arbitrator verdict
      is parsed, add:

          if arb_verdict not in {aws_verdict, azure_verdict}:
              logger.warning(
                  "consensus.arbitrator_third_verdict: arbitrator=%s "
                  "disagrees with both aws=%s and azure=%s -- "
                  "unexpected third verdict; audit required",
                  arb_verdict, aws_verdict, azure_verdict,
              )

      This block must appear BEFORE the existing logger.info call that
      records the resolved verdict.

    acceptance_criteria:
      - type: "test"
        spec: "WARNING containing 'arbitrator_third_verdict' is emitted when arbitrator disagrees with both primary models"
      - type: "test"
        spec: "No warning is emitted when arbitrator agrees with either primary model"
      - type: "test"
        spec: "ConsensusResult correctly captures arbitrator_verdict, aws_verdict, and azure_verdict in the third-verdict case"
      - type: "test"
        spec: "agreed is False in the third-verdict case"

    constraints:
      - type: "auditability"
        spec: "The keyword 'consensus.arbitrator_third_verdict' MUST appear verbatim in the log message to enable log search and alerting rule matching"
      - type: "safety"
        spec: "The warning MUST NOT prevent the arbitrator verdict from being returned; it is an audit signal only"

    dependencies: ["DI-LEO-AI-036"]

    downstream_impacts:
      - "libs/llm_client/consensus.py (single change)"
      - "Monitoring and alerting pipeline (new alert rule on keyword)"

    technical_details:
      language: "Python"
      framework: "N/A"
      libraries: ["logging"]
      file_structure:
        - "libs/llm_client/consensus.py"
      estimated_loc: 8

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Warning emitted on third verdict; no spurious warning on normal arbitration; ConsensusResult fields correct"
    test_protocol: "VT-LEO-AI-038"

  safety_class: "B"
  risks: ["R-LEO-AI-030"]
  tags: ["security", "audit", "consensus", "anomaly-detection", "prompt-injection"]
