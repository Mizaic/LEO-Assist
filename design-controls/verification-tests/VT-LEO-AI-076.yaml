# -- VT-LEO-AI-076 -- Surface Form Revocation and Cascade Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-076"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-076"]
    risks: ["R-LEO-AI-051"]

  metadata:
    title: "Loop 2 Surface Form Revocation and Cascade CodingReview Verification"
    description: >
      Verifies that the revoke endpoint removes MAPS_TO, marks SurfaceFormTask
      revoked, creates cascade CodingReview for each affected encounter in a
      single atomic transaction, and that the recently approved terms view
      shows use_count and revoke button.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_surface_form_revocation.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Mock Neo4j client with provisioned MAPS_TO and DOCUMENTS relationships"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-076-TC-001"
      case_name: "Revoke removes MAPS_TO and marks SurfaceFormTask as revoked"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call DELETE /training/surface-forms/{normalized}/revoke"
          expected_result: "MAPS_TO deleted; SurfaceFormTask.status='revoked'; revoked_by and revoked_at recorded"
          verification_method: "automated"
      acceptance_criteria:
        - "MAPS_TO relationship no longer exists"
        - "SurfaceFormTask.status = 'revoked'"

    - case_id: "VT-076-TC-002"
      case_name: "Cascade creates CodingReview for each affected encounter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock 3 DOCUMENTS relationships with source='provisional' coded after first_used_at for the revoked concept"
          expected_result: "3 CodingReview nodes created with review_type='revocation_cascade'"
          verification_method: "automated"
      acceptance_criteria:
        - "One CodingReview per affected encounter"
        - "review_type = 'revocation_cascade' on each"

    - case_id: "VT-076-TC-003"
      case_name: "Encounters coded before first_used_at are NOT included in cascade"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Mock 1 DOCUMENTS relationship coded before first_used_at for the revoked concept"
          expected_result: "No CodingReview created for pre-first_used_at encounter"
          verification_method: "automated"
      acceptance_criteria:
        - "Cascade scope is strictly limited to encounters coded after first_used_at"

    - case_id: "VT-076-TC-004"
      case_name: "Cascade is atomic: Neo4j transaction rolls back on failure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock Neo4j transaction failure after 2 of 3 CodingReview creations"
          expected_result: "Transaction rolled back; 0 CodingReview nodes created; MAPS_TO preserved"
          verification_method: "automated"
      acceptance_criteria:
        - "On transaction failure: zero cascade reviews created"
        - "MAPS_TO not deleted (operation not committed)"

    - case_id: "VT-076-TC-005"
      case_name: "Recently approved terms view returns use_count and first_used_at"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Mock SurfaceForm with use_count=12 and first_used_at timestamp"
          expected_result: "View response includes use_count=12 and first_used_at"
          verification_method: "automated"
      acceptance_criteria:
        - "use_count and first_used_at present in recently approved terms response"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-076/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
