# -- R-LEO-AI-171 -- Adjuvant-therapy diagnosis inference may misclassify outcome
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-171"
  title: "Adjuvant-therapy drug detection may produce false-positive cancer diagnoses or wrong-site classifications"

  hazard:
    description: >
      ADJUVANT_THERAPY_DRUG_PATTERNS treats appearance of a curated
      anti-cancer drug (e.g. tamoxifen, letrozole, triptorelin) as
      evidence of a confirmed cancer when paired with a co-condition
      (issue marker, active-care code, malignancy term, or malignancy
      code). Edge cases include: (a) tamoxifen used for primary
      breast-cancer prophylaxis in high-risk patients (no current
      cancer); (b) goserelin used for endometriosis (not prostate
      cancer); (c) trastuzumab biosimilar names not yet in the regex;
      (d) capecitabine being site-ambiguous (GI vs breast).
    category: "clinical_safety"

  hazardous_situation: >
    A clinician sees a confirmed cancer in the cancer audit dashboard
    that is actually a prophylactic prescription for a high-risk
    patient, or sees an endometriosis patient counted as a prostate
    cancer because of a goserelin prescription. The HITL flag is
    set on every adjuvant-therapy anchor so the dashboard surfaces
    the case for review, but if the reviewer rubber-stamps the
    cohort the audit numbers will be inflated.

  harm:
    description: >
      False reassurance for a patient under active investigation
      (low risk - the wrong direction of error here is over-counting
      cancer); inflated cancer-prevalence numbers in NCDA submissions;
      wasted reviewer time on false-positive HITL items. No direct
      harm to clinical follow-up because the rule fires only when
      the patient already has cancer-relevant context (active-care
      code, malignancy term, or new prescription).
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Co-condition guard: a drug match alone NEVER fires a diagnosis
        anchor. At least one of (issue marker, active-care code,
        malignancy term, malignancy code) must also be present in the
        same encounter text. This eliminates the largest false-
        positive class (routine repeat-prescription reviews).
      implemented_by: ["DI-LEO-AI-172"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        History-of-cancer guard from DI-LEO-AI-171 also short-circuits
        the adjuvant-therapy path so survivors on long-term hormone
        therapy do not get re-diagnosed.
      implemented_by: ["DI-LEO-AI-171", "DI-LEO-AI-172"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Hitl_required=True and confidence=0.75 on every adjuvant-
        therapy diagnosis anchor. The episode builder forces
        hitl_flag=True when any anchor in the group carries
        hitl_required so no adjuvant-derived episode becomes
        authoritative without human review.
      implemented_by: ["DI-LEO-AI-172"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Drug list curated to OVERWHELMINGLY-cancer indications only;
        excludes drugs with significant non-cancer use (methotrexate,
        ciclosporin, etc.). Capecitabine maps to non_site_specific
        (forces HITL to disambiguate GI vs breast).
      implemented_by: ["DI-LEO-AI-172"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Quarterly audit specifically of adjuvant-therapy-derived
        episodes; review each with the source encounter and the
        full prescription history; refine drug list and co-condition
        regex if precision falls below 85%.
      implemented_by: ["DI-LEO-AI-172"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The co-condition guard plus mandatory HITL plus history-of-
      cancer suppression collectively constrain the path to fire
      only when there is corroborating evidence. The expected
      benefit (3 of 6 known-missed cancers per audit cohort
      recovered) substantially outweighs the modest false-positive
      tail, all of which is gated by human review.

  monitoring:
    monitoring_plan: >
      Quarterly audit of all episodes flipped via
      diagnosis_source=adjuvant_therapy_drug. Track precision
      separately from the term/active-care channels. If precision
      falls below 85%, raise an inventory review CAPA to tighten
      the drug list or co-condition regex.
    metrics:
      - "Precision of adjuvant_therapy_drug -> diagnosis_confirmed"
      - "HITL override rate on adjuvant-therapy episodes"
      - "Count of adjuvant-therapy episodes per audit cycle"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "2025 closed_benign audit (3 of 6 missed cancers were adjuvant-therapy-only) 2026-04-17"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "episode-building"
      - "missed-cancer"
      - "adjuvant-therapy"
      - "drug-inference"
