# -- VAL-LEO-AI-010 -- Performance Qualification Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-010"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs: ["UN-LEO-AI-020"]
    design_inputs: ["DI-LEO-AI-029"]
    risks: ["R-LEO-AI-012"]
    verification_tests: ["VT-LEO-AI-018"]

  metadata:
    title: "Performance Qualification Validation"
    validation_phase: "alpha"
    test_type: "performance_qualification"
    automation_level: "automated"
    participants:
      user_type: "internal_qa"
      count: 3
      selection_criteria: "QA engineers with performance testing and load testing experience"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "Verification test VT-LEO-AI-018 passed"
      - "System deployed to staging with production-equivalent resource allocation"
      - "Load testing tooling available (e.g., k6, Locust, or equivalent)"
      - "Synthetic patient data sets prepared for 100-patient and multi-organisation scenarios"
      - "Monitoring and metrics collection enabled (e.g., Application Insights, Prometheus)"
    infrastructure: "Azure Container Apps staging environment with production-equivalent scaling configuration"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Full pipeline for 100 patients completes within acceptable time"
      user_role: "QA Engineer"
      user_goal: "Confirm that a full pipeline run for 100 patients completes within the defined performance target"
      preconditions:
        - "Synthetic data set of 100 patients is loaded into the test organisation"
        - "Pipeline is configured for the target clinical programme"
        - "No other pipeline jobs are running on the system"
      steps:
        - step_number: 1
          action: "Trigger a full pipeline run for the 100-patient data set and record the start time"
          expected_result: "Pipeline starts successfully and begins processing patient records"
          success_criteria: "Pipeline enters the running state and progress is visible in the dashboard"
        - step_number: 2
          action: "Monitor pipeline progress until completion and record the end time"
          expected_result: "Pipeline completes processing all 100 patients"
          success_criteria: "Pipeline status shows completed with 100 patients processed"
        - step_number: 3
          action: "Calculate the per-patient processing time and compare to the P95 target"
          expected_result: "P95 per-patient processing time is within the target of 2 minutes"
          success_criteria: "P95 completion time <= 2 minutes per patient"
      postconditions:
        - "All 100 patients processed with results available"
        - "Performance metrics collected and stored for analysis"
      success_metrics:
        - metric: "P95 pipeline completion time per patient"
          target: "<= 2 minutes"
          measurement_method: "95th percentile of per-patient processing time across the 100-patient run"
        - metric: "Pipeline success rate"
          target: "100%"
          measurement_method: "Count of successfully processed patients divided by total patients"
      evidence_to_capture:
        - "Pipeline start and end timestamps"
        - "Per-patient processing time distribution"
        - "System resource utilisation metrics during the run"
        - "Pipeline completion report"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Concurrent pipeline jobs from multiple organisations do not interfere"
      user_role: "QA Engineer"
      user_goal: "Confirm that concurrent pipeline jobs from different organisations complete within SLA without interference"
      preconditions:
        - "At least 10 test organisations are provisioned with patient data"
        - "Each organisation has a pipeline configured and ready to run"
        - "System scaling configuration matches production settings"
      steps:
        - step_number: 1
          action: "Trigger pipeline jobs for all 10 organisations simultaneously"
          expected_result: "All 10 pipeline jobs start and enter the running state"
          success_criteria: "All 10 jobs are visible in the pipeline dashboard with running status"
        - step_number: 2
          action: "Monitor all pipeline jobs until completion and record per-job timing"
          expected_result: "All 10 jobs complete without errors or timeouts"
          success_criteria: "All 10 jobs reach completed status with no failures"
        - step_number: 3
          action: "Verify that no cross-organisation data contamination occurred during concurrent execution"
          expected_result: "Each organisation's results contain only their own patient data"
          success_criteria: "Zero cross-organisation data leakage in pipeline results"
        - step_number: 4
          action: "Compare concurrent job completion times to the single-job baseline"
          expected_result: "Concurrent job times are within acceptable degradation from the single-job baseline"
          success_criteria: "All jobs complete within the SLA; degradation is less than 50% compared to single-job baseline"
      postconditions:
        - "All 10 concurrent jobs completed successfully"
        - "No data isolation violations detected"
        - "Performance metrics show acceptable scaling behaviour"
      success_metrics:
        - metric: "Concurrent job completion rate"
          target: "100%"
          measurement_method: "Count of successfully completed jobs divided by total concurrent jobs"
        - metric: "SLA compliance"
          target: "All jobs complete within SLA"
          measurement_method: "Comparison of actual job completion time to SLA target"
        - metric: "System availability during load"
          target: ">= 99.5%"
          measurement_method: "Uptime percentage measured by health check probes during the concurrent run"
      evidence_to_capture:
        - "Per-job start and completion timestamps"
        - "System resource utilisation metrics during concurrent execution"
        - "Data isolation verification results"
        - "Health check probe results during the test window"

  acceptance_criteria:
    - criterion: "P95 pipeline completion per patient"
      target: "<= 2 minutes per patient"
      measurement_method: "95th percentile of per-patient processing time across test runs"
    - criterion: "Concurrent job completion"
      target: "10 concurrent jobs complete within SLA"
      measurement_method: "Count of jobs completing within SLA divided by total concurrent jobs"
    - criterion: "System availability under load"
      target: ">= 99.5%"
      measurement_method: "Uptime percentage from health check probes during performance testing"

  user_feedback:
    feedback_methods: ["survey", "observation"]

  evidence_bundle:
    bundle_id: "VAL-010-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-010/"
    artifacts:
      - type: "performance_metrics"
        description: "Pipeline timing data, resource utilisation, and throughput metrics for single and concurrent runs"
      - type: "user_acceptance_results"
        description: "Performance qualification test results with pass/fail per scenario and SLA compliance"
      - type: "test_log_bundle"
        description: "Load test tool output, health check logs, and data isolation verification reports"
    immutability: true

  execution_history: []
