# -- VT-LEO-AI-219 -- ICD-10 5th Edition XML loader and UI surfacing
# IEC 62304 Verification Test
#
# NOTE: Originally drafted at VT-LEO-AI-217 but reassigned to the next
# free ID after Pattern N5 (off-pathway Problem-header guard) claimed
# VT-LEO-AI-217 in the same change window.

- id: "VT-LEO-AI-219"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-228"
    risks:
      - "R-LEO-AI-210"

  metadata:
    title: "NHS ICD-10 5th Edition XML loader writes titled, hierarchical Icd10Code nodes and the UI surfaces the title"
    description: >
      Two-layer verification per ui-testing.mdc.

      Layer 1 (pytest, against an in-memory neo4j-driver fake):
      drives the new `load_icd10_xml` function with a fixture XML
      snippet covering one chapter, one block, one 3-character
      category and one 4-character code. Verifies idempotent
      MERGE-on-code, IS_A hierarchy, title backfill on bare
      pre-existing nodes, and the structured summary log.

      Layer 2 (jest static-source): verifies the Settings --
      Terminology page renders the new ICD-10 package card and
      stat tile, and that TermSearch renders the title alongside
      the bare code when present.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/test_icd10_xml_loader.py"
      - "services/ui/src/__tests__/settings-terminology-classifications.test.tsx"
      - "services/ui/src/__tests__/term-search-classification-titles.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest + pytest-asyncio"
      - "services/ui jest harness (jest 30 + ts-jest)"
      - "Fixture XML snippet representing one ICD-10 chapter, block, category, code"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-219-TC-001"
      case_name: "Loader upserts an Icd10Code with title, chapter, block, age range, sex, edition, and level=code"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run load_icd10_xml against a fixture XML containing one 4-character code I50.0 'Congestive heart failure'"
          expected_result: "Exactly one MERGE on (:Icd10Code {code: 'I50.0'}) with SET on title, chapter, block, age_range, sex, edition, level"
          verification_method: "automated"
      acceptance_criteria:
        - "code is normalised to the canonical 4-character form (e.g. I500 in some sources -> I50.0)"
        - "title equals the value carried in the XML"
        - "level = 'code'"

    - case_id: "VT-219-TC-002"
      case_name: "Loader is idempotent on rerun (same fixture twice produces identical counts)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run loader twice against the same fixture and capture node + edge counts after each run"
          expected_result: "Run 2 produces zero new nodes and zero new IS_A edges"
          verification_method: "automated"

    - case_id: "VT-219-TC-003"
      case_name: "Loader backfills titles onto bare nodes left by the SNOMED ExtendedMap loader"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pre-seed the test graph with an Icd10Code {code: 'I50.0'} that has no title (mimics SNOMED map output), then run the loader against a fixture XML containing that code"
          expected_result: "Node count is unchanged; the existing node now has title='Congestive heart failure' and level='code'"
          verification_method: "automated"

    - case_id: "VT-219-TC-004"
      case_name: "Loader creates IS_A hierarchy code -> category -> block -> chapter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run the loader against a fixture covering one chapter (IX), one block (I30-I52), one category (I50), one code (I50.0)"
          expected_result: "Cypher MATCH path (I50.0)-[:IS_A]->(I50)-[:IS_A]->(I30-I52)-[:IS_A]->(IX) returns exactly one row"
          verification_method: "automated"

    - case_id: "VT-219-TC-005"
      case_name: "Loader emits a structured summary line counting upserts, IS_A edges, first-time titles, and drift"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run loader twice with two different fixtures (second fixture changes one title) and capture the summary log line of the second run"
          expected_result: "Summary contains nonzero `titles_drifted` count for the changed code and zero `titles_first_time` for the unchanged code"
          verification_method: "automated"

    - case_id: "VT-219-TC-006"
      case_name: "Settings -- Terminology page renders an `icd10` PackageCard alongside SNOMED and dm+d"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/app/settings/terminology/page.tsx"
          expected_result: "PACKAGE_KEYS literal contains 'icd10'; the file imports DownloadingIcon and renders the PackageCard for 'icd10'"
          verification_method: "automated"

    - case_id: "VT-219-TC-007"
      case_name: "Settings -- Terminology page renders an icd10_codes StatTile"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/app/settings/terminology/page.tsx"
          expected_result: "Neo4jCounts type contains icd10_codes; buildStatTiles returns a tile with id='icd10-codes' and label='ICD-10 codes'"
          verification_method: "automated"

    - case_id: "VT-219-TC-008"
      case_name: "TermSearch renders ICD-10 title alongside bare code when present, falls back to bare code when not"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/components/TermSearch.tsx"
          expected_result: "Source contains the conditional `r.icd10_term ? `ICD-10: ${r.icd10} ${r.icd10_term}` : `ICD-10: ${r.icd10}`` (or equivalent ternary on r.icd10_term)"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-219/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-219-EXEC-2026-04-18-A"
      executed_date: "2026-04-18"
      executor: "automation"
      result: "pass"
      notes: >
        pytest tests/test_icd10_xml_loader.py: 19/19 passed (0.20s).
        Covers normalisation, level classification, ClaML parsing,
        end-to-end MERGE writes against a fake AsyncDriver, idempotency,
        title backfill on bare nodes, and drift detection.

        jest --testPathPatterns "settings-terminology-classifications":
        8/8 passed (0.81s). Covers PACKAGE_KEYS extension, Neo4jCounts
        ICD-10 fields, ICD-10 codes/maps stat tiles, 2x2 grid layout.

        jest --testPathPatterns "term-search-classification-titles":
        7/7 passed. Covers TermSearch ICD-10 title rendering, surface
        forms ICD-10 title rendering, and TermSearchResult /
        ConceptGroup type contracts.
