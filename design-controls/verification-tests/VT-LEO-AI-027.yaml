# -- VT-LEO-AI-027 -- HITL Safety Layer Tier Integration
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-027"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-027"]
    risks: ["R-LEO-AI-026"]
    user_needs: ["UN-LEO-AI-019"]

  metadata:
    title: "HITL Safety Layer Tier Integration"
    description: >
      Verifies that the three-tier safety classifier integrates correctly with
      the HITL coding review pipeline: tier fields are stored on CodingReview
      nodes, the calibration endpoint returns override statistics, and the
      review queue returns tier metadata for UI rendering.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_hitl_tier_integration.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12+ with project dependencies installed"
      - "No Neo4j connection required (unit tests only)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-027-TC-001"
      case_name: "_build_review_item includes tier fields"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _build_review_item with tier metadata"
          expected_result: "Returned item includes decision_tier, tier_reason, tier_decision"
          verification_method: "Assert field presence"
      acceptance_criteria:
        - "Tier metadata propagates from classifier to review queue items"

    - case_id: "VT-027-TC-002"
      case_name: "_check_terminology_coding calls classify_tier"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Trace _check_terminology_coding execution path"
          expected_result: "classify_tier is called for each entity entering the review queue"
          verification_method: "Assert call"
      acceptance_criteria:
        - "Every entity in the coding review queue has tier classification"

    - case_id: "VT-027-TC-003"
      case_name: "UPSERT_CODING_REVIEW stores tier params"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect UPSERT_CODING_REVIEW Cypher for tier field parameters"
          expected_result: "decision_tier, tier_reason, tier_decision parameters present"
          verification_method: "Assert string presence"
      acceptance_criteria:
        - "Tier metadata persists to Neo4j CodingReview nodes"

    - case_id: "VT-027-TC-004"
      case_name: "RESOLVE_CODING_REVIEW sets reviewer_tier_override"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect RESOLVE_CODING_REVIEW Cypher"
          expected_result: "reviewer_tier_override field is set on resolution"
          verification_method: "Assert string presence"
      acceptance_criteria:
        - "Override tracking enables calibration analysis"

    - case_id: "VT-027-TC-005"
      case_name: "GET_TIER_OVERRIDE_STATS query structure"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect GET_TIER_OVERRIDE_STATS Cypher"
          expected_result: "Groups by tier, counts overrides"
          verification_method: "Assert string presence"
      acceptance_criteria:
        - "Calibration endpoint can compute override rates per tier"

    - case_id: "VT-027-TC-006"
      case_name: "Calibration endpoint wiring"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Check training router for tier-calibration endpoint"
          expected_result: "GET /training/coding-review/tier-calibration exists"
          verification_method: "Assert route registration"
      acceptance_criteria:
        - "Calibration data accessible via API"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-027/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-027-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "local"
      result: "pass"
      cases_executed: 6
      cases_passed: 6
      cases_failed: 0
      duration_seconds: 1
      notes: "All tests pass (pytest tests/test_hitl_tier_integration.py)"
