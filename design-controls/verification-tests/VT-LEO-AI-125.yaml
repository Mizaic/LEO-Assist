# -- VT-LEO-AI-125 -- Practitioner role model + RoleSwitch audit
# IEC 62304 Verification Test

- id: "VT-LEO-AI-125"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-129"]
    risks: ["R-LEO-AI-089", "R-LEO-AI-091"]

  metadata:
    title: "Practitioner role model, session payload, and RoleSwitch audit"
    description: >
      Verifies that /auth/session exposes selected_role and
      allowed_roles, that PATCH /auth/session/role updates the
      Practitioner and writes an append-only (:RoleSwitch) audit node,
      and that an unauthorised role is rejected with 403. Also
      confirms the four canonical roles are seeded.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_auth_role_switch.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Neo4j test instance with seeded canonical roles"
      - "Valid test Practitioner with two HAS_ROLE edges (clinician + staff)"
    test_data:
      data_type: "synthetic"
      cleanup_required: true

  test_cases:
    - case_id: "VT-125-TC-001"
      case_name: "Session response includes role fields"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "GET /auth/session with a valid test cookie"
          expected_result: "200 OK; body includes selected_role and allowed_roles"
      verification_method: "automated"
      acceptance_criteria:
        - "selected_role is a string or null"
        - "allowed_roles is a list of strings drawn from the canonical set"

    - case_id: "VT-125-TC-002"
      case_name: "Role switch updates Practitioner and writes audit"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "PATCH /auth/session/role with body {role: 'staff'}"
          expected_result: "200 OK; Practitioner.selected_role == 'staff'"
        - step_number: 2
          action: "Query (:RoleSwitch) nodes for the practitioner"
          expected_result: "Exactly one new (:RoleSwitch) node with from=<prior>, to='staff', at within 5s of request"
      verification_method: "automated"
      acceptance_criteria:
        - "(:RoleSwitch) node has from, to, at, session_id, practitioner_email properties"

    - case_id: "VT-125-TC-003"
      case_name: "Unauthorised role is rejected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "PATCH /auth/session/role with body {role: 'platform_admin'} for a user who does not have that role"
          expected_result: "403 Forbidden; selected_role unchanged"
      verification_method: "automated"
      acceptance_criteria:
        - "No (:RoleSwitch) node is written for the rejected request"

    - case_id: "VT-125-TC-004"
      case_name: "Canonical roles are seeded"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run scripts/seed_canonical_roles.py against a fresh database"
          expected_result: "Four (:Role {name}) nodes exist: clinician, staff, qa_ra_lead, platform_admin"
        - step_number: 2
          action: "Run the seed script a second time"
          expected_result: "No duplicate nodes are created (idempotent)"
      verification_method: "automated"
      acceptance_criteria:
        - "MATCH (r:Role) WHERE r.name IN [...] RETURN count(r) == 4"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-125/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-125-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-1-foundation"
      environment: "development"
      result: "pass"
      notes: >
        pytest tests/test_auth_role_switch.py -v -> 7 passed in 0.43s.
        Covers TC-001..TC-004 via the unit tests in that file (session
        payload, role switch writes audit, role not allowed rejected,
        canonical seed idempotent).
