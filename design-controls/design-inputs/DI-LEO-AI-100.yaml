# -- DI-LEO-AI-100 -- GoldLabel Single Source for NER Training
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-100"
  type: "Safety"
  derived_from: ["UN-LEO-AI-050", "UN-LEO-AI-027"]
  requirement: >
    The system SHALL treat Knowledge Graph GoldLabel data as the single source
    of truth for model training by (a) migrating eligible legacy TrainingLabel
    records into GDPR-isolated TrainingCandidate and GoldLabel nodes, (b)
    exporting training DocBin files directly from completed GoldLabel records in
    the Knowledge Graph, and (c) aligning operations training UX to reference
    gold-dataset data and workflows instead of legacy TrainingLabel lifecycle
    states.
  rationale: >
    Running multiple training data lifecycles (TrainingLabel, TrainingCandidate,
    GoldLabel, and DOCUMENTS-derived corpus stats) creates inconsistent counts,
    operator confusion, and traceability gaps. A single gold source reduces
    data-governance risk, ensures that the model trains on verified data, and
    keeps operational decisions aligned with what is actually used for training.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "Migration script copies include=true TrainingLabel records into Knowledge Graph TrainingCandidate and GoldLabel nodes with source='migrated_from_training_label'"
      - type: "safety"
        spec: "Migration does not persist encounter_id or patient_id_hash to GoldLabel nodes"
      - type: "functional"
        spec: "training_worker label exporter queries GoldLabel via GET_ALL_GOLD_LABELS_FOR_EXPORT and builds train/dev DocBins from that dataset"
      - type: "safety"
        spec: "Training pipeline aborts when GoldLabel exportable count is below TRAINING_MIN_LABEL_COUNT"
      - type: "usability"
        spec: "Operations workspace removes legacy 'Fix mistakes' and old 'Teach/check labels' sub-flow, and provides direct navigation to /admin/gold-dataset"
    constraints:
      - type: "safety"
        spec: "GoldLabel selection for training is limited to TrainingCandidate status='completed' records"
      - type: "security"
        spec: "Migration and export flows use de-identified text payloads only"
    dependencies: ["DI-LEO-AI-055", "DI-LEO-AI-079", "DI-LEO-AI-097"]
    downstream_impacts:
      - "services/training_worker/app/label_exporter.py"
      - "scripts/migrate_training_labels_to_gold.py"
      - "services/ui/src/components/operations/OperationsWorkspace.tsx"
      - "services/ui/src/components/operations/TrainSection.tsx"
    technical_details:
      language: "Python + TypeScript"
      framework: "FastAPI + Next.js / MUI"
      file_structure:
        - "scripts/migrate_training_labels_to_gold.py"
        - "services/training_worker/app/label_exporter.py"
        - "services/ui/src/components/operations/OperationsWorkspace.tsx"
        - "services/ui/src/components/operations/TrainSection.tsx"
      estimated_loc: 260

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-100 passes migration and export path checks, verifies the
      exporter uses GoldLabel records, and confirms operations training UI uses
      gold-label metrics and training-worker job controls.
    test_protocol: "VT-LEO-AI-100"

  safety_class: "B"
  risks: ["R-LEO-AI-052", "R-LEO-AI-053", "R-LEO-AI-039"]
  tags: ["training-data", "gold-label", "operations-ui", "gdpr", "model-training"]
