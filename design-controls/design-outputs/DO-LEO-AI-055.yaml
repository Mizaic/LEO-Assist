# -- DO-LEO-AI-055 -- Surface Form Validation Subgraph

- id: "DO-LEO-AI-055"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"
  traceability:
    design_inputs: ["DI-LEO-AI-055"]
    risks_addressed: ["R-LEO-AI-039", "R-LEO-AI-040"]
    verification_tests: ["VT-LEO-AI-055", "VT-LEO-AI-061", "VT-LEO-AI-096"]
  specification:
    title: "Surface-form validation and tasking"
    description: >
      Adds a surface_form_validation subgraph after terminology resolution.
      High-confidence corrections are auto-applied; low-confidence mismatches
      create SurfaceFormTask items for human approval. Extends admin gold-dataset
      operations with manual candidate dedupe preview/apply controls for
      near-duplicate training examples.
    acceptance_criteria:
      - criterion: "Create review task for uncertain mismatch"
        type: "functional"
        target: "confidence < threshold creates SurfaceFormTask"
      - criterion: "No patient linkage in tasks"
        type: "safety"
        target: "task uses candidate_id + anonymised context only"
      - criterion: "Cascade delete for training candidate"
        type: "functional"
        target: "DELETE /training/candidates/{candidate_id} removes TrainingCandidate and linked GoldLabel and SurfaceFormTask records"
      - criterion: "Manual dedupe workflow"
        type: "functional"
        target: "POST /training/candidates/dedupe/preview and /apply support threshold-based duplicate marking with reviewer-triggered execution"
  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/surface_form_validation.py"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/surface_form_task_queries.py"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/training_candidate_queries.py"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        storage_location: "git"
  safety_characteristics:
    safety_class: "B"
    risk_control_measures:
      - "Auto-correction threshold set to 0.9"
      - "Ambiguous corrections route to human review"
