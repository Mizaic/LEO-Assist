# -- DI-LEO-AI-214 -- Mission Control KPI unit clarity + cohort denominator
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-214"
  type: "Usability"
  derived_from: ["UN-LEO-AI-058"]
  requirement: >
    The Mission Control /care/patients KPI strip SHALL present
    audit headline figures in the same unit (patients) as the
    label and tooltip claim, AND SHALL surface the cohort
    denominator so the user always knows how many patients
    behind the current filter are hidden and why. Specifically:
    (a) GET /mission-control/kpis SHALL return both an episode
    count AND a patient count for "confirmed cancer" and for
    "pathway closures" (confirmed_cancer / confirmed_cancer_
    patients, pathway_closures / pathway_closure_patients) so
    the UI can render the patient count as the headline and the
    pathway count as a secondary sub-line;
    (b) GET /mission-control/kpis SHALL return a "cohort" block
    containing total_patients (org-scoped, ignoring date /
    pathway / cancer-type / closure-reason / review filters) and
    three excluded buckets: excluded_no_pathway (patients with
    no EpisodeOfCare), excluded_missing_referral_date (patients
    whose only non-excluded episodes have a NULL referral_date),
    and excluded_outside_window (patients whose only non-
    excluded episodes have a referral_date outside the selected
    period);
    (c) The KPIStrip "Confirmed cancer" and "Pathway closures"
    cards SHALL display the patient count as the headline value
    and the pathway count as a sub-line of the form "<N>
    pathway[s]";
    (d) The KPIStrip "Confirmed cancer" and "Pathway closures"
    tooltips SHALL describe the metric as a count of PATIENTS
    in plain English (reading age 9-11);
    (e) A cohort denominator caption (data-testid="kpi-cohort-
    denominator") SHALL appear below the KPI strip when at
    least one patient is hidden, formatted as "Showing <inView>
    of <total> patients - <excluded> hidden (<reason1>, ...)";
    when no patients are hidden the caption SHALL read "Showing
    all <total> patients in the cohort"; when the cohort block
    is absent the caption SHALL NOT render at all;
    (f) The KPI patient-equivalent count for confirmed cancer
    SHALL use the canonical NCDA cohort definition
    (confirmed_cancer_where) so it agrees with /audit/summary
    (DI-LEO-AI-134);
    (g) The cohort denominator query SHALL respect org / caller
    scope ONLY -- it MUST NOT inherit the date, pathway,
    cancer-type, closure-reason or review-status filters.

  rationale: >
    UN-LEO-AI-058 promises a single Mission Control view where
    auditors can find, filter, review, and validate cancer
    pathway episodes before clinical decisions are made. The
    headline KPI strip currently mixes units: "Patients in view"
    is a patient count, but "Confirmed cancer" and "Pathway
    closures" are EPISODE counts even though their tooltips
    promise patient counts. A user who sees "Confirmed cancer
    54" naturally believes 54 patients have a confirmed cancer
    diagnosis when the real number is 44 -- one patient may
    have several pathways. The same mismatch makes "Pathway
    closures 76" look anomalously larger than the "89 patients
    in view" headline (it is comparing pathways to patients).
    Separately, the KPI strip silently filters out patients
    whose pathways have a NULL referral_date (typically real
    cancers diagnosed via routine GP encounter rather than a
    2WW pathway) and patients with no EpisodeOfCare at all.
    Today there is no indication those patients exist, which
    erodes auditor trust ("we have 107 patients but the
    dashboard shows 89 - where are the others?") and risks a
    real cancer being overlooked because the patient does not
    appear in the working list. This DI brings the KPI strip
    into unit alignment with its labels and surfaces the
    cohort denominator so hidden patients become discoverable.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          _kpis_cypher returns confirmed_cancer (DISTINCT ep)
          AND confirmed_cancer_patients (DISTINCT p) using the
          same canonical NCDA predicate (confirmed_cancer_where
          alias 'ep').
      - type: "functional"
        spec: >
          _kpis_cypher returns pathway_closures (DISTINCT ep)
          AND pathway_closure_patients (DISTINCT p) using the
          shared _CLOSURE_STATUSES list.
      - type: "functional"
        spec: >
          _cohort_denominator_cypher returns the four fields
          cohort_total_patients, excluded_no_pathway,
          excluded_missing_referral_date, excluded_outside_
          window plus the derived excluded_total. The query
          MUST contain no cancer_type, closure_reason or
          reviewed_at predicates.
      - type: "functional"
        spec: >
          GET /mission-control/kpis returns a top-level "cohort"
          object containing total_patients, excluded_total,
          excluded_no_pathway, excluded_missing_referral_date
          and excluded_outside_window. When the cohort Cypher
          returns no rows the endpoint returns the same shape
          with all values zero (no KeyError).
      - type: "functional"
        spec: >
          KPIStrip renders the patient count
          (kpis.confirmed_cancer_patients) as the headline of
          the "Confirmed cancer" card and shows the pathway
          count (kpis.confirmed_cancer) as a sub-line of the
          form "<N> pathway[s]" (data-testid="kpi-sub-value").
          The same pattern applies to the "Pathway closures"
          card.
      - type: "usability"
        spec: >
          The "Confirmed cancer" tooltip reads "Patients with
          at least one pathway in the selected period where a
          cancer diagnosis was recorded (NCDA definition)." and
          the "Pathway closures" tooltip reads "Patients with
          at least one pathway in the selected period that
          closed without a cancer diagnosis (benign, no
          follow-up, or stale)."
      - type: "functional"
        spec: >
          KPIStrip renders a caption with data-testid="kpi-
          cohort-denominator" below the strip whose text matches
          one of:
            (i) "Showing <inView> of <total> patients - <hidden>
                hidden (<reason1>, ...)." when at least one
                patient is excluded;
            (ii) "Showing all <total> patients in the cohort."
                when no patient is excluded;
            (iii) the caption MUST NOT render when kpis.cohort
                  is undefined.
      - type: "usability"
        spec: >
          The caption is generated by the exported helper
          buildCohortDenominatorLine() which lists only the
          excluded buckets that are non-zero, in the order
          (no pathway, missing referral date, outside the date
          range), so the caption stays at reading age 9-11.

  constraints:
    - type: "performance"
      spec: >
        The KPI endpoint runs at most two Cypher queries per
        request (one filtered KPI query, one cohort denominator
        query). The cohort denominator query MUST be O(patients
        in scope) and MUST NOT scan EpisodeOfCare cohort-wide
        more than once.
    - type: "safety"
      spec: >
        Confirmed cancer headline counts MUST use
        confirmed_cancer_where('ep') so they continue to agree
        with /audit/summary.confirmed_cancers (DI-LEO-AI-134).
        Diverging the definition would let the headline drift
        from the audit endpoint and mislead clinical staff.
    - type: "accessibility"
      spec: >
        The cohort denominator caption MUST be a sibling of the
        KPI strip (not inside a tooltip) so it is reachable by
        screen readers without keyboard interaction.

  dependencies: ["DI-LEO-AI-091", "DI-LEO-AI-134"]
  downstream_impacts:
    - "services/analytics_api/app/routers/mission_control.py"
    - "services/ui/src/lib/missionControlApi.ts"
    - "services/ui/src/components/mission-control/KPIStrip.tsx"

  technical_details:
    language: "Python + TypeScript"
    framework: "FastAPI / Neo4j Cypher / Next.js / React / MUI"
    file_structure:
      - "services/analytics_api/app/routers/mission_control.py"
      - "services/ui/src/lib/missionControlApi.ts"
      - "services/ui/src/components/mission-control/KPIStrip.tsx"
      - "services/analytics_api/tests/test_mission_control_cohort_kpis.py"
      - "services/ui/src/__tests__/mission-control/KPIStripCohortDenominator.test.tsx"
    estimated_loc: 280

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-206 passes all 11 critical and high cases
      (5 backend, 6 UI) covering: patient count exposure for
      confirmed_cancer and pathway_closures; cohort denominator
      query field surface and scope independence; endpoint
      returns "cohort" block (with zeroed shape on empty);
      patient-headline / pathway-sub-line rendering on the two
      KPI cards; cohort denominator caption rendering for
      excluded, no-excluded, and missing-cohort cases; plain-
      English builder pluralisation.
    test_protocol: "VT-LEO-AI-206"

  safety_class: "B"
  risks: ["R-LEO-AI-201"]
