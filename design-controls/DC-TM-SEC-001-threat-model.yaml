    - id: "PAT-T-001"
      element: "services/api/app/services/patient_graph_writer.py:37-50"
      threat: "Cypher label injection via semantic tag"
      attack_vector: "The _upsert_query function constructs Cypher with f-string label interpolation. The label comes from _label_for_tag() which maps semantic_tag to a fixed set. However, if a new semantic_tag is passed that is not in the mapping, it defaults to 'SnomedConcept'. The label is NOT user-controllable because it passes through _label_for_tag() normalization."
