# -- VT-LEO-AI-031 -- FHIR R4 Resource Endpoints
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-031"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-031"]
    risks: []
    user_needs: ["UN-LEO-AI-022"]

  metadata:
    title: "FHIR R4 Resource Endpoints"
    description: >
      Verifies that the FHIR API exposes R4-conformant endpoints for Measure,
      MeasureReport, Library, and Device resources with correct CRUD operations
      and UK Core profile validation.
    test_level: "integration"
    test_type: "functional"
    safety_class: "A"
    automation_status: "semi-automated"
    test_file_paths:
      - "tests/test_fhir_api.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "FHIR API service running"
      - "FHIR R4 validation library available"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-031-TC-001"
      case_name: "FHIR endpoints conform to R4 specification"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Submit FHIR resources to each endpoint and validate response structure"
          expected_result: "All responses conform to FHIR R4 resource schemas"
          verification_method: "FHIR validator"
      acceptance_criteria:
        - "No FHIR validation errors on any endpoint response"

    - case_id: "VT-031-TC-002"
      case_name: "UK Core profile validation passes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Validate returned resources against UK Core profiles"
          expected_result: "All resources pass UK Core profile validation"
          verification_method: "Profile validator"
      acceptance_criteria:
        - "UK Core mandatory fields present and valid"

    - case_id: "VT-031-TC-003"
      case_name: "CRUD operations work for all resource types"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Perform Create, Read, Update, Delete on Measure, MeasureReport, Library, Device"
          expected_result: "All CRUD operations succeed with correct HTTP status codes"
          verification_method: "Assert HTTP status codes"
      acceptance_criteria:
        - "POST returns 201, GET returns 200, PUT returns 200, DELETE returns 204"

  pass_fail_criteria:
    pass_threshold: "100% critical"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "fhir_validation_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-031/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-031-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 3
      cases_passed: 3
      cases_failed: 0
      duration_seconds: 2
      notes: "All 3 test cases passed (pytest VT-LEO-AI-031)"
