# -- DI-LEO-AI-064 -- LLM-Based AppropriatenessRule Authoring with HITL Gate

- id: "DI-LEO-AI-064"
  type: "Functional"
  derived_from: ["UN-LEO-AI-028"]
  requirement: >
    The system SHALL provide a rule generation service that reads Recommendation nodes
    from Neo4j and uses the existing dual-model consensus pipeline (AWS Bedrock Haiku
    + Azure GPT-5-mini with Sonnet arbitration) to produce candidate AppropriatenessRule
    nodes with SNOMED-coded CriteriaGroup entries. Generated rules SHALL be stored with
    status: pending_review. A FastAPI router SHALL expose endpoints for triggering rule
    generation and for a HITL review queue (list, detail, decide) following the existing
    ReviewService pattern. Only rules with status: active SHALL be visible to the bitmap
    compiler. All LLM call sites SHALL comply with llm-security.mdc (INJECTION_GUARD,
    sanitise_for_prompt, response length cap, conservative fail_verdict).
  rationale: >
    Manual authoring of SNOMED-coded CriteriaGroups by clinical experts is not
    scalable. The existing consensus/escalation pipeline has proven reliable for
    clinical NLP tasks and provides a consistent, auditable approach to LLM use.
    A mandatory HITL gate before any rule affects patients is the primary safety
    control for this pipeline (see R-LEO-AI-042).

  machine_spec:
    agent_prompt: |
      Implement LLM rule generation and HITL review (~400 LOC across 2 files).

      FILES:
      - services/api/app/services/guidance_rule_generator.py
        - GuidanceRuleGenerator class
        - generate_rules_for_guideline(guideline_id: str) -> list[dict]
          1. Fetch Recommendation nodes for guideline from Neo4j
          2. For each recommendation, call run_consensus() with:
             - system_prompt = INJECTION_GUARD + rule-authoring prompt
             - user_msg = sanitise_for_prompt(recommendation.verbatim, max_chars=2000)
             - parse_fn = _parse_criteria_response (length cap + JSON parse)
             - fail_verdict = None (conservative -- skip bad responses)
             - max_tokens = 800
          3. For each criterion term in the parsed output, call
             GET /terminology/search to get SNOMED candidates, then
             escalate_coding_from_candidates() to pick best concept
          4. MERGE AppropriatenessRule node (status: pending_review) + CriteriaGroup
             nodes + HAS_CRITERIA edges to SNOMED concept nodes
          5. Create ReviewTask node (status: pending) in Neo4j for HITL queue
        - _parse_criteria_response(raw: str) -> dict | None
          - cap_llm_response(raw) first; return None if empty
          - json.loads inside try/except; return None on any error
        - _snomed_code_criteria(criteria: list[dict]) -> list[dict]
          - calls terminology API search + escalate_coding_from_candidates()

      - services/api/app/routers/guidance_rules.py
        - FastAPI router, prefix /guidance
        - POST /guidance/rules/generate -- 202 + job_id, background task
        - GET /guidance/rules/review?guideline_id=&status= -- list pending rules
        - GET /guidance/rules/review/{rule_id} -- detail with plain-English summary
        - POST /guidance/rules/review/{rule_id}/decision
          body: {action: approve|edit|reject, reviewer: str, reason: str}
          On approve/edit: set rule status: active, log immutable audit event
          On reject: set rule status: rejected, log audit event
        - POST /guidance/rules/review/{rule_id}/promote-to-domain
          Only valid when rule status is active. Finds AuditDomain (source=nice) linked
          via rule's guideline -> TaxonomySubcategory -> AuditDomain. MERGEs each
          SNOMED concept from rule's CriteriaGroup into a ValueSet under that domain.
          Writes AuditEvent (type=domain_promotion) recording rule_id, domain_id, reviewer.
          Returns {domain_id, domain_name, concepts_added}.
        - POST /guidance/rules/review/approve-all?guideline_id= -- bulk approve
        - All endpoints: require_admin (from app.deps)
      Register router in services/api/app/main.py.

    acceptance_criteria:
      - type: "test"
        spec: "INJECTION_GUARD is the first content in every system prompt"
      - type: "test"
        spec: "sanitise_for_prompt is called on recommendation text before LLM submission"
      - type: "test"
        spec: "When _parse_criteria_response receives a response > 2000 chars, returns None"
      - type: "test"
        spec: "When consensus returns fail_verdict (None), no rule node is written to Neo4j"
      - type: "test"
        spec: "Generated rules have status: pending_review in Neo4j"
      - type: "test"
        spec: "POST .../decision with action: approve sets rule status to active"
      - type: "test"
        spec: "Approving a rule creates an immutable audit event node in Neo4j"
      - type: "test"
        spec: "Only active rules are returned by GET /terminology/guidelines/bitmap/status rule count"
      - type: "test"
        spec: "POST promote-to-domain returns 409 when rule status is not active"
      - type: "test"
        spec: "POST promote-to-domain MERGEs SNOMED concepts into ValueSet and writes AuditEvent node"
      - type: "test"
        spec: "POST promote-to-domain returns 404 when no NICE AuditDomain is linked to the guideline"

    constraints:
      - type: "safety"
        spec: "INJECTION_GUARD prepended to all system prompts (llm-security.mdc rule 2)"
      - type: "safety"
        spec: "All recommendation text through sanitise_for_prompt() (llm-security.mdc rule 3)"
      - type: "safety"
        spec: "Response length cap in _parse_criteria_response (llm-security.mdc rule 4)"
      - type: "safety"
        spec: "fail_verdict = None -- never write a rule from a failed LLM response"
      - type: "traceability"
        spec: "Every approve/reject decision stored as immutable audit event with reviewer email and timestamp"

    dependencies: ["DI-LEO-AI-063"]
    downstream_impacts:
      - "DI-LEO-AI-065 bitmap compiler reads active rules produced by this pipeline"
      - "DI-LEO-AI-066 admin UI calls these endpoints for review workflow"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j", "pydantic", "httpx"]
      file_structure:
        - "services/api/app/services/guidance_rule_generator.py"
        - "services/api/app/routers/guidance_rules.py"
        - "services/api/app/main.py"
      estimated_loc: 400

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All acceptance criteria pass; LLM calls mocked with controlled responses"
    test_protocol: "VT-LEO-AI-064"

  safety_class: "B"
  risks: ["R-LEO-AI-042", "R-LEO-AI-043", "R-LEO-AI-044"]
  tags: ["llm", "rule-authoring", "hitl", "consensus", "bedrock", "snomed", "guidelines", "domains", "promote"]
