- id: "DO-LEO-AI-095"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-097"]
    user_needs: ["UN-LEO-AI-049", "UN-LEO-AI-050"]
    risks_addressed: ["R-LEO-AI-067"]
    verification_tests: ["VT-LEO-AI-097"]

  specification:
    title: "Extraction quality LLM check before terminology"
    description: |
      Adds a single-turn extraction quality check stage that can drop noisy
      entities, correct assertion and semantic tag fields, and add missed
      clinically explicit mentions before terminology resolution. The check uses
      a constrained JSON contract and attaches provenance markers for retraining.
      Referral procedure phrases are protected from uncertain assertion
      downgrades by a deterministic guard.
    acceptance_criteria:
      - criterion: "Single-turn check"
        type: "functional"
        measurement: "Test"
        target: "extraction_check subgraph executes one llm.converse call and parses JSON response"
      - criterion: "Correction scope"
        type: "safety"
        measurement: "Test"
        target: "Only drop/correct_assertion/correct_label/add operations are applied"
      - criterion: "Provenance tags"
        type: "functional"
        measurement: "Test"
        target: "Modified entities include _llm_check_source markers"
      - criterion: "Referral procedure assertion safety"
        type: "safety"
        measurement: "Test"
        target: "Procedure referral phrases are normalised to present when an extraction check suggests possible"
      - criterion: "Gold-training gating"
        type: "functional"
        measurement: "Test"
        target: "Gold-training write is skipped unless an entity includes extraction-check provenance markers"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/llm_check.py"
        description: "Extraction check execution and patch application"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "Referral procedure assertion guard after ConText"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/nlp/sentence_splitter.py"
        description: "Shared referral procedure phrase detector"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/extraction_check_v1.py"
        description: "Extraction check prompt and example library"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/registry.py"
        description: "Registers extraction_check subgraph"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/persist.py"
        description: "Gates gold-training writes on extraction-check provenance signal"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_prompt_configs.py"
        description: "Seeds extraction_check PromptConfig"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_plan_definitions.py"
        description: "Adds ad-extraction-check and act-extraction-check in pd-gp-encounter-coding"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 260
      key_functions:
        - "extraction_check"
        - "_run_check"
        - "_apply_extraction_check"
        - "build_extraction_check_subgraph"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Prevent persistence of non-evidence and template-derived entities"
      - "Recover missed clinically explicit mentions with provenance"
    risk_control_measures:
      - "Strict JSON output contract"
      - "Constrained correction operations"
      - "Prompt examples for screening/exclusion no-inference behavior"

  verification_status:
    verification_method: "Test"
    verification_complete: false
