# -- VAL-LEO-AI-009 -- Programme Configurability Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-009"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs: ["UN-LEO-AI-011", "UN-LEO-AI-012"]
    design_inputs: ["DI-LEO-AI-017", "DI-LEO-AI-018"]
    risks: ["R-LEO-AI-025"]
    verification_tests: ["VT-LEO-AI-011", "VT-LEO-AI-020"]

  metadata:
    title: "Programme Configurability Validation"
    validation_phase: "alpha"
    test_type: "user_acceptance"
    automation_level: "semi-automated"
    participants:
      user_type: "internal_qa"
      count: 3
      selection_criteria: "QA engineers with clinical audit programme configuration experience"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "Verification tests VT-LEO-AI-011 and VT-LEO-AI-020 passed"
      - "System deployed to staging with programme configuration UI and pipeline engine"
      - "Test organisation provisioned with admin and programme administrator accounts"
      - "Reference clinical guidelines and target definitions available"
    infrastructure: "Azure Container Apps staging environment with pipeline engine and configuration service"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Programme administrator configures a new clinical audit programme from scratch"
      user_role: "Programme Administrator"
      user_goal: "Configure a complete clinical audit programme with domains, milestones, guidelines, and targets, then run a test pipeline"
      preconditions:
        - "Programme administrator account is provisioned"
        - "Clinical guideline documents and target definitions are available"
        - "No existing programme exists for the target clinical domain"
      steps:
        - step_number: 1
          action: "Create a new programme and define the clinical domain, description, and audit period"
          expected_result: "System creates the programme in draft status and displays the configuration dashboard"
          success_criteria: "Programme appears in the programme list with draft status and correct metadata"
        - step_number: 2
          action: "Add clinical domains, milestones, and associated clinical guidelines to the programme"
          expected_result: "Domains, milestones, and guidelines are linked to the programme"
          success_criteria: "All configured items appear in the programme structure view with correct relationships"
        - step_number: 3
          action: "Define performance targets for each domain and milestone"
          expected_result: "Targets are saved and displayed against each domain and milestone"
          success_criteria: "Target values are persisted and visible in the programme configuration"
        - step_number: 4
          action: "Activate the programme and trigger a test pipeline run with sample data"
          expected_result: "Pipeline executes using the programme configuration and produces audit results"
          success_criteria: "Pipeline completes successfully and results reflect the configured domains and targets"
      postconditions:
        - "New programme is active and has produced at least one set of audit results"
        - "Programme configuration is persisted and auditable"
      success_metrics:
        - metric: "Programme configuration time"
          target: "<= 5 days from start to first pipeline run"
          measurement_method: "Elapsed time from programme creation to first successful pipeline completion"
        - metric: "Configuration completeness"
          target: "100%"
          measurement_method: "All required configuration fields populated and validated by the system"
      evidence_to_capture:
        - "Screenshots of programme configuration at each step"
        - "Pipeline execution logs and results"
        - "Programme configuration export"

    - scenario_id: "SCENARIO-002"
      scenario_name: "System administrator defines a custom pipeline workflow with conditional branching"
      user_role: "System Administrator"
      user_goal: "Define a custom pipeline workflow that includes conditional branching based on data characteristics and validate its execution"
      preconditions:
        - "System administrator account is provisioned with pipeline configuration permissions"
        - "Pipeline engine is running and accessible"
        - "Test data sets are available for different branching conditions"
      steps:
        - step_number: 1
          action: "Create a new pipeline workflow definition with sequential and conditional steps"
          expected_result: "System accepts the workflow definition and displays it in the pipeline designer"
          success_criteria: "Workflow is saved with correct step ordering and conditional logic"
        - step_number: 2
          action: "Configure conditional branching rules based on data characteristics (e.g., patient count threshold)"
          expected_result: "Branching rules are saved and the workflow diagram updates to show the conditional paths"
          success_criteria: "Conditional rules are persisted and visually represented in the workflow"
        - step_number: 3
          action: "Execute the pipeline with data that triggers each conditional branch"
          expected_result: "Pipeline follows the correct branch for each data set"
          success_criteria: "Execution logs confirm the correct branch was taken for each test data set"
      postconditions:
        - "Custom pipeline workflow executes correctly with conditional branching"
        - "Pipeline execution history records the branch taken for each run"
      success_metrics:
        - metric: "Pipeline execution correctness"
          target: "100% correct branch selection"
          measurement_method: "Comparison of expected branch to actual branch taken for each test data set"
      evidence_to_capture:
        - "Pipeline workflow definition export"
        - "Execution logs showing branch decisions"
        - "Pipeline results for each conditional path"

  acceptance_criteria:
    - criterion: "New programme configured and running within 5 days"
      target: "<= 5 days from creation to first pipeline completion"
      measurement_method: "Elapsed time from programme creation to first successful pipeline run"
    - criterion: "Pipeline executes correctly with configured steps"
      target: "100% correct execution across all configured workflows"
      measurement_method: "Count of correct pipeline executions divided by total executions"

  user_feedback:
    feedback_methods: ["survey", "observation"]

  evidence_bundle:
    bundle_id: "VAL-009-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-009/"
    artifacts:
      - type: "user_acceptance_results"
        description: "Programme configuration and pipeline execution test results with pass/fail per scenario"
      - type: "pipeline_logs"
        description: "Pipeline execution logs showing workflow steps, branch decisions, and completion status"
      - type: "screenshot"
        description: "Screenshots of programme configuration UI and pipeline designer at each step"
    immutability: true

  execution_history: []
