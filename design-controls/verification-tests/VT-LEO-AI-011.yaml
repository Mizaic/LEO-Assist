# -- VT-LEO-AI-011 -- Pipeline Orchestration Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-011"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-018", "DI-LEO-AI-019"]
    risks: ["R-LEO-AI-015"]
    user_needs: ["UN-LEO-AI-012"]

  metadata:
    title: "CodingPipeline Execution Verification"
    description: >
      Verifies the CodingPipeline (services/coding_worker/app/pipeline/pipeline_service.py)
      executes its linear fetch→extract→resolve→persist sequence correctly. The pipeline is
      not a checkpoint-based orchestrator with conditional branching (as originally described
      in DI-018/019); it is a single-encounter async executor. Tests verify: structured
      progress events are emitted in correct order, run_id threads through all events, dry-run
      suppresses Neo4j persistence, idempotent MERGE semantics for re-runs, provenance fields
      appear in persisted payloads, and extraction failures emit a 'failed' event with stage label.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_coding_pipeline_orchestration.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 installed with project dependencies"
      - "pytest-asyncio available"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-011-TC-001"
      case_name: "Progress events emitted in correct order"
      priority: "critical"
      preconditions:
        - "CodingPipeline instantiated with mocked patient_client and knowledge_client"
        - "build_extractor patched to return mock extractor with one extraction item"
        - "_resolve_via_api patched to return a resolved SNOMED term"
      test_steps:
        - step_number: 1
          action: "Call run_single_encounter() with a progress_hook collecting events"
          expected_result: "Events emitted in order: encounter_started → fetched → extracted → resolved → persisted → run_completed"
          verification_method: "Assert each expected event type appears in events list in order"
      acceptance_criteria:
        - "All six structured event types emitted"
        - "No phase is skipped when extraction and resolution succeed"

    - case_id: "VT-011-TC-002"
      case_name: "run_id threads through all events"
      priority: "high"
      preconditions:
        - "run_single_encounter called with run_id='my-run-id'"
      test_steps:
        - step_number: 1
          action: "Collect all progress events and inspect run_id field"
          expected_result: "Every event that carries encounter context has run_id == 'my-run-id'"
          verification_method: "Assert all(e.get('run_id') == 'my-run-id' for e in encounter_events)"
      acceptance_criteria:
        - "run_id present and correct in all events for traceability"

    - case_id: "VT-011-TC-003"
      case_name: "Dry-run suppresses Neo4j persistence"
      priority: "critical"
      preconditions:
        - "run_single_encounter called with dry_run=True"
        - "_persist_candidate patched with a spy"
      test_steps:
        - step_number: 1
          action: "Call run_single_encounter(dry_run=True) with a valid extraction result"
          expected_result: "_persist_candidate is never called"
          verification_method: "Assert mock_persist.assert_not_called()"
      acceptance_criteria:
        - "No writes to Neo4j occur in dry-run mode"

    - case_id: "VT-011-TC-004"
      case_name: "Extraction failure emits 'failed' event with stage label"
      priority: "critical"
      preconditions:
        - "mock_extractor.extract_batch raises RuntimeError('LLM timeout')"
      test_steps:
        - step_number: 1
          action: "Call run_single_encounter() and collect events"
          expected_result: "Exactly one event with type='failed' and stage='extraction' is emitted"
          verification_method: "Assert failed_events[0]['stage'] == 'extraction'"
      acceptance_criteria:
        - "Pipeline does not propagate uncaught exceptions to caller"
        - "Failed event contains stage identifier for triage"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-011/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-011-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 3
      cases_passed: 3
      cases_failed: 0
      duration_seconds: 2
      notes: "VT remapped from checkpoint-based orchestrator (not implemented) to actual CodingPipeline linear executor. tests/test_coding_pipeline_orchestration.py covers event ordering, run_id threading, dry-run guard, idempotent UPSERT, provenance fields, and extraction failure event. 7 tests all pass."
