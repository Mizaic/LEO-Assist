# -- VT-LEO-AI-130 -- Canonical NCDA 'confirmed cancer' cohort parity
# IEC 62304 Verification Test

- id: "VT-LEO-AI-130"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-134"]
    risks: ["R-LEO-AI-092"]

  metadata:
    title: "libs.analytics.cohorts parity across NCDA analytics endpoints"
    description: >
      Verifies that a single canonical cohort helper is used by every
      NCDA analytics endpoint and that the 'confirmed cancer' count
      returned by /audit/summary, /audit/cancer-stage,
      /audit/cancer-type, /dashboards/overview, and mission-control
      agree for identical filter windows.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_analytics_cohorts.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-130-TC-001"
      case_name: "confirmed_cancer_where returns canonical clause"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call confirmed_cancer_where()"
          expected_result: >
            Returns a Cypher fragment that includes
            ep.status = 'completed',
            coalesce(ep.letter_inferred_benign, false) = false,
            and EXISTS an IS_PART_OF diagnosis-milestone encounter.
          verification_method: "automated"
      acceptance_criteria:
        - "All three clauses present in the returned fragment"

    - case_id: "VT-130-TC-002"
      case_name: "suspected_cancer_referral_where composes canonical + referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call suspected_cancer_referral_where()"
          expected_result: >
            Returns the canonical confirmed-cancer clause PLUS an
            EXISTS IS_PART_OF referral-milestone encounter.
          verification_method: "automated"
      acceptance_criteria:
        - "Both EXISTS subqueries present in the returned fragment"

    - case_id: "VT-130-TC-003"
      case_name: "no inline cohort duplication in routers"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Grep each analytics router for the combined pattern
            'status = completed' AND 'letter_inferred_benign'
            AND 'IS_PART_OF'.
          expected_result: >
            No router defines its own combined filter; every
            occurrence appears only in libs/analytics/cohorts.py.
          verification_method: "automated"
      acceptance_criteria:
        - "Zero inline duplications found across the five router files"

    - case_id: "VT-130-TC-004"
      case_name: "endpoints parity on synthetic graph"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Seed an in-memory graph stub with a mix of completed /
            in-progress / benign-inferred episodes, each with
            combinations of referral and diagnosis milestones.
          expected_result: >
            confirmed_cancer_where() selects exactly the intended
            subset (completed + non-benign + diagnosis milestone).
          verification_method: "automated"
      acceptance_criteria:
        - "The helper agrees with a hand-curated expected-set fixture"

    - case_id: "VT-130-TC-005"
      case_name: "live baseline pin"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Against the current live graph snapshot, assert the
            canonical confirmed_cancer count for the 2025 audit
            window equals 91 (the Stage-at-Diagnosis denominator).
          expected_result: "Baseline pinned; regression if drifts."
          verification_method: "automated"
      acceptance_criteria:
        - "Count equals 91 on the 2026-04-17 rebuild snapshot"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-130/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-130-EXEC-20260417-001"
      executed_at: "2026-04-17"
      executed_by: "automated"
      environment: "development"
      result: "pass"
      cases_passed: 14
      cases_failed: 0
      notes: >
        14/14 cases passed in tests/test_analytics_cohorts.py. TC-005
        live baseline pin verified manually against the patient graph:
        canonical confirmed-cancer count for 2025 referral window = 91
        (matches Stage-at-Diagnosis chart); 2WW-route subset = 16.
        All five affected routers import libs.analytics.cohorts.
