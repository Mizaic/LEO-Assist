# -- UN-LEO-AI-071 -- Knowledge tab bodies feel as calm and modern as the shell
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-071"
  title: "When I open any Knowledge tab the content inside looks and behaves like the rest of the role-first product - calm, well-spaced, paced with motion, and easy to scan"
  description: |
    Wave D shipped a new role-first shell and a redesigned frame
    around each Knowledge tab, but the eight tab BODIES (Training
    Data, Surface Forms, Context Rules, AI Instructions, Clinical
    Guidelines, Pathways, Domains, Terminology) are still the legacy
    MUI pages - dense, inconsistent in padding, no smooth entry, no
    progressive disclosure. Clinical staff and QA leads tell us the
    page feels "unfinished": "why do I get a beautiful header and
    then a spreadsheet?"

    The user need is that every Knowledge tab body MUST feel like it
    belongs to the same app as the shell:

      - consistent primitives (stat row, progress, segmented tabs,
        filter bar, review cards, grid cards) from the design-system
        package;
      - motion on mount, on filter change, and on list item reveal
        using framer-motion, honouring prefers-reduced-motion;
      - a density control so data-heavy users can go compact;
      - role-aware empty and loading states (staff, clinician,
        qa_ra_lead, platform_admin).

  stakeholder: "Clinical staff, QA/RA lead, platform_admin"

  priority: "high"

  rationale: >
    Visual consistency is a usability control (ISO 14971 -- misread
    screens cause miscoded encounters). A uniform primitive set also
    prevents the "island of legacy" drift that made Wave D Phase 3
    look incomplete. Adaptive density keeps the redesign inclusive
    for older users (airy default) while giving power users the
    compact option they rely on to clear work queues fast.

  acceptance_criteria:
    - "Every Knowledge tab body renders through primitives exported from @leo/design-system"
    - "No direct @mui/material import exists inside services/ui/src/app/admin/knowledge/**, app/gold-dataset/**, components/gold-dataset/**, app/admin/prompts/**, app/admin/pathways/**, app/admin/guidance/**, app/settings/{surface-forms,context-rules,domains,terminology}/** after Phase 7"
    - "Adaptive density (airy | compact) is a runtime setting stored on the Practitioner node and applied across every tab body"
    - "Framer-motion mount + list-item motion is applied, with durations collapsed to 0 when prefers-reduced-motion: reduce"
    - "Every rebuilt tab body passes axe-core at WCAG 2.1 AA and carries a Playwright smoke test that pins the new layout"

  design_inputs:
