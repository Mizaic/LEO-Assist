# -- DI-LEO-AI-070 -- NCDA Report Template Generation
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-070"
  type: "Functional"
  derived_from: ["UN-LEO-AI-024"]
  requirement: >
    The system SHALL provide configurable report templates aligned to NCDA
    (National Clinical Data Audit) output specifications, enabling clinical
    audit teams to generate standardised reports from pathway audit data
    without manual formatting or data transformation.
  rationale: >
    NCDA submissions require specific data layouts and field mappings that
    currently must be assembled manually from raw audit outputs. Templated
    report generation reduces manual effort and ensures consistency with
    NCDA submission requirements.

  machine_spec:
    agent_prompt: |
      Implement NCDA report template generation.
    acceptance_criteria:
      - type: "test"
        spec: "Report template renders with correct NCDA field mappings"
      - type: "test"
        spec: "Generated report includes all required NCDA data fields"
      - type: "test"
        spec: "Template is configurable per programme without code changes"
    constraints: []
    dependencies: ["DI-LEO-AI-013"]
    downstream_impacts:
      - "Clinical audit reporting workflows"
    technical_details:
      language: "Python / TypeScript"
      framework: "FastAPI / Next.js"
      file_structure:
        - "services/api/app/services/ncda_report_generator.py"
        - "services/ui/src/app/admin/reports/page.tsx"
      estimated_loc: 300

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All NCDA template fields correctly mapped and rendered"
    test_protocol: "VT-LEO-AI-070"

  safety_class: "A"
  risks: []
  tags: ["ncda", "reporting", "templates", "audit-output"]
