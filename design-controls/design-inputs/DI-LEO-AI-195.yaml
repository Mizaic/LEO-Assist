# -- DI-LEO-AI-195 -- PRISM cancer-context guard + admin-amendment filter
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-195"
  type: "Safety"
  derived_from: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
  requirement: >
    The anchor detector SHALL classify a PRISM proforma encounter as a
    cancer 2WW referral (referral_subtype="prism") ONLY when the same
    encounter text carries explicit cancer context: a 2WW / TWW /
    "two-week wait" token, a "fast track referral for suspected ..."
    or "suspected cancer" phrase, or a 2WW Read code from the
    XaMeA-XaMeZ family. PRISM encounters lacking that context (sexual
    health, MSK, IBD, cardiology, mental-health crisis, ultrasound,
    advice & guidance, hospice, etc.) MUST NOT emit a referral anchor
    and MUST NOT open a 2WW cancer episode.

    The anchor detector SHALL also distinguish between "Marked in
    Error" as a clinical referral withdrawal (treated as
    referral_subtype="rejected") and "Marked in Error: Amended data"
    / "amendment" qualifiers, which represent QOF / data-quality
    administrative corrections to the referral row and MUST NOT be
    surfaced as a workflow rejection event.
  rationale: >
    Patient 6519337463 investigation surfaced the failure mode: a
    "Sexual Healthcare (Complex) PRISM Pathway Accessed" encounter
    opened a non_site_specific 2WW cancer episode because the legacy
    PRISM regex matched any PRISM proforma. Inspection of the dataset
    confirmed every legitimate cancer-2WW PRISM template name carries
    a "2WW" token while no non-cancer PRISM template does, so a cancer
    context guard is a generic, practice-agnostic discriminator.

    Separately, "Marked in Error: Amended data" entries are
    administrative corrections (QOF data quality) routinely applied
    to clean up referral metadata; treating them as clinical
    rejections inflates the rejected-referral DQ metric and creates
    spurious workflow-delay alerts that distract from real
    rejection-resubmission delays.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: >
          A PRISM proforma encounter with no cancer-context token
          (no 2WW, no "fast track referral for suspected", no
          "suspected cancer", no XaMe[A-Z] Read code) MUST NOT
          emit a referral anchor.
      - type: "safety"
        spec: >
          A PRISM proforma encounter that DOES carry a cancer-context
          token MUST continue to emit referral_subtype="prism" with
          confidence 0.9 (preserves DI-LEO-AI-124 PRISM primacy).
      - type: "safety"
        spec: >
          A "Marked in Error" referral encounter without an
          "amended data" / "amendment" / "data amendment" qualifier
          MUST emit referral_subtype="rejected".
      - type: "safety"
        spec: >
          A "Marked in Error: Amended data" encounter on a referral
          row MUST NOT emit referral_subtype="rejected"; if the
          encounter still contains a genuine fast-track referral
          phrase the encounter falls through to text_generic, but
          rejection / workflow-delay metrics are NOT incremented.
      - type: "functional"
        spec: >
          _RE_PRISM_CANCER_CONTEXT regex matches 2WW, TWW,
          two-week wait, fast track referral for suspected,
          suspected cancer, and XaMe[A-Z] tokens (case-insensitive).
    constraints:
      - type: "safety"
        spec: >
          The guard must be evidence-based and pattern-level, not
          patient-specific. New non-cancer PRISM template names
          observed in production are auto-handled by the cancer-
          context check; no per-template allow / deny list is
          maintained.
    dependencies: ["DI-LEO-AI-124", "DI-LEO-AI-182"]
    downstream_impacts:
      - "services/analysis_worker anchor_detector text classifier"
      - "services/analysis_worker episode_builder cancer-pathway opens"
      - "DQ tooling dq_rejected_referrals_resubmission_delay"
      - "Patient pathway dashboards (false 2WW pathway rate)"

  technical_details:
    language: "Python"
    framework: "pytest"
    file_structure:
      - "services/analysis_worker/app/analyzers/anchor_detector.py"
      - "tests/test_anchor_detector.py"
    estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-190 test cases pass: non-cancer PRISM (sexual
      health, MSK, mental-health, IBD) emit no referral anchor,
      cancer PRISM (PRISM 2WW Lung, PRISM + suspected cancer,
      PRISM + XaMe Read code) still emit referral_subtype=prism,
      "Marked in Error" alone emits rejected, "Marked in Error:
      Amended data" does not emit rejected.
    test_protocol: "VT-LEO-AI-190"

  safety_class: "B"
  risks: ["R-LEO-AI-186"]
  tags: ["episode", "referral", "anchor", "prism", "cancer-context", "dq"]
