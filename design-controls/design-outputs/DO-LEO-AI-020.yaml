- id: "DO-LEO-AI-020"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-014"]
    user_needs: ["UN-LEO-AI-009"]
    risks_addressed: ["R-LEO-AI-011", "R-LEO-AI-014"]
    verification_tests: ["VT-LEO-AI-020"]
    validation_tests: []

  specification:
    title: "LLM Interpretation Module"
    description: |
      Provides LLM-assisted clinical interpretation that translates
      structured audit and coding data into plain-language summaries
      readable by non-specialist users. A prompt registry manages
      versioned system prompts, and a factory abstracts the underlying
      LLM provider so the system can switch between Azure OpenAI models
      without code changes.
    purpose: "LLM-assisted clinical interpretation with plain language output at a reading age of 9-11 years"
    technical_approach: |
      The agent router accepts interpretation requests containing
      structured clinical data. It retrieves the appropriate versioned
      prompt from the prompt registry, constructs the LLM payload, and
      calls the model through the LLM client factory. Prompts include
      explicit plain-language directives targeting a reading age of 9-11.
      Responses are validated for safety (no hallucinated clinical advice)
      before being returned to the caller. The factory supports Azure
      OpenAI with configurable model, temperature, and token limits.
    acceptance_criteria:
      - criterion: "Generated interpretations meet plain language readability target"
        type: "quality"
        measurement: "Flesch-Kincaid Grade Level of generated text"
        target: "<=6 (reading age ~11)"
      - criterion: "Interpretations do not contain unsupported clinical advice"
        type: "safety"
        measurement: "Safety classifier flags any directive language (must, should take, prescribe)"
        target: "Zero unsupported clinical directives in output"
      - criterion: "Prompt registry returns the correct version for a given prompt key"
        type: "functional"
        measurement: "Unit test retrieves prompt by key and version; verifies content"
        target: "Correct prompt content for all registered keys"
      - criterion: "LLM client factory returns a working client for configured provider"
        type: "functional"
        measurement: "Integration test sends a test prompt and receives a valid response"
        target: "Successful response from configured LLM provider"
      - criterion: "Interpretation endpoint requires authentication"
        type: "security"
        measurement: "Request without token returns 401"
        target: "All unauthenticated requests rejected"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/agent.py"
        description: "Agent router handling interpretation requests"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/registry.py"
        description: "Versioned prompt registry for LLM system prompts"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/llm_client/factory.py"
        description: "LLM client factory abstracting provider-specific details"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
