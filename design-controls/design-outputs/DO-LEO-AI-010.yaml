# -- DO-LEO-AI-010 -- Coding Review UI
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-010"
  version: "1.0.0"
  type: "User_Interface"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-016"]
    user_needs: ["UN-LEO-AI-010"]
    risks_addressed: ["R-LEO-AI-006"]
    verification_tests: ["VT-LEO-AI-010"]
    validation_tests: []

  specification:
    title: "Coding Review UI"
    description: |
      Provides the user interface for reviewing AI-generated clinical coding
      suggestions. Displays encounter narrative with highlighted entity spans,
      candidate SNOMED codes with confidence scores, and controls for
      accepting, rejecting, or modifying each suggestion. Supports side-by-side
      view of source text and coded entities.
    purpose: "Enable clinicians to efficiently review, verify, and approve AI-generated coding suggestions with full source text context"
    technical_approach: "React components with Material UI, entity span highlighting, sidebar navigation, and real-time state sync with the review API"
    acceptance_criteria:
      - criterion: "Entity spans correctly highlighted in source text"
        type: "functional"
        measurement: "Visual regression tests and manual QA"
        target: "100% of entities highlighted at correct positions"
      - criterion: "Review actions complete without page reload"
        type: "functional"
        measurement: "End-to-end browser tests"
        target: "Accept/reject/modify updates in-place"
      - criterion: "UI accessible at WCAG 2.1 AA level"
        type: "quality"
        measurement: "Automated accessibility audit (axe-core)"
        target: "0 critical or serious accessibility violations"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/ReviewView.tsx"
        description: "Main review view container component"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/EncounterCodedView.tsx"
        description: "Encounter text display with entity highlighting"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/EntityCard.tsx"
        description: "Card component for individual entity details and actions"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/EntitySidebar.tsx"
        description: "Sidebar navigation for entity list and filtering"
        storage_location: "git"
    technical_details:
      language: ["TypeScript"]
      framework: ["Next.js", "React"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Entity span accuracy in display", "Review action reliability"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed as part of the ui container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-016"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["ui", "review", "react", "coding"]
    priority: "high"
    complexity: "complex"
