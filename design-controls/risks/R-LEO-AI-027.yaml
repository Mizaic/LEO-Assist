# -- R-LEO-AI-027 -- Overly Broad Suppress Rule Causes Systematic Under-coding
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-027"
  title: "Overly broad suppress rule causes systematic under-coding of a clinical term"

  hazard:
    description: >
      A reviewer creates a post-processor suppress rule for a clinical term without
      a context phrase, suppressing the term globally rather than only in the
      specific non-codeable context (e.g. 'awaiting appointment', 'hypothetical').

  hazardous_situation: >
    The suppress rule silently removes all future mentions of the term from the
    coding queue -- including clinically valid, present-tense mentions -- before
    any human reviewer can see them. The systematic gap in coding is not immediately
    visible because the entity no longer appears in the review queue; it is simply
    absent from the data.

  harm:
    description: >
      Systematic under-coding of a clinical condition (e.g. biopsy, hypertension,
      diabetes check) distorts audit data, producing artificially low prevalence or
      activity figures. Quality improvement decisions made on this data may
      misdirect clinical care for future patient populations.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "protective_measure"
      description: >
        UI guard: when LEO has flagged an assertion_warning, the Confirm suppress
        button is disabled until the reviewer supplies a context phrase. The context
        phrase field is pre-populated with the key phrase extracted from LEO's
        reasoning, and explanatory copy tells the reviewer why the phrase is required.
      implemented_by: ["services/ui/src/components/operations/CodingReviewCasesModal.tsx"]
      verified_by: ["DI-LEO-AI-016"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: >
        extractSuggestedPhrase function parses LEO's assertion_warning for quoted
        phrases and pre-fills the context phrase field, reducing the chance that a
        reviewer leaves the field blank due to uncertainty about what to type.
      implemented_by: ["services/ui/src/components/operations/CodingReviewCasesModal.tsx"]
      verified_by: ["DI-LEO-AI-016"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Post-processor rule audit: periodic review of suppress rules without context
        phrases to identify and remediate any that were created before the guard was
        in place or via the API directly.
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Suppress rules created via the API (not the UI) still require context_regex
        to be set by the caller; API documentation specifies this is mandatory for
        common clinical terms.
      implemented_by: []
      verified_by: []
      effectiveness: "partially_effective"
    - control_type: "protective_measure"
      description: >
        Admin-only API access: POST /training/post-processor-rules and PATCH
        /training/post-processor-rules/{rule_id} require Depends(require_admin).
        This limits rule creation and modification to platform-admin accounts,
        reducing the population of users who could create a harmful suppress rule
        via the API to privileged users only.
      implemented_by: ["DI-LEO-AI-046"]
      verified_by: ["VT-LEO-AI-039"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        ReDoS-safe regex validation: _validate_regex() rejects pathological
        context_regex patterns (catastrophic backtracking) before they are
        persisted, preventing a DoS condition in the coding pipeline caused by
        an overly complex suppress rule regex.
      implemented_by: ["DI-LEO-AI-046"]
      verified_by: ["VT-LEO-AI-039"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The UI guard makes it technically impossible to confirm a context-free suppress
      when LEO has identified the reason the entity is not codeable. The pre-filled
      phrase further reduces the probability that a reviewer bypasses the guard by
      clearing the field. Direct API access is now restricted to platform-admin
      accounts (require_admin), and user-supplied context_regex patterns are
      validated for ReDoS safety before persistence. Residual risk arises only from
      a malicious admin creating a suppress rule via the API, which is covered by
      the periodic rule audit and the admin access review (see R-LEO-AI-031).

  monitoring:
    monitoring_plan: >
      Review suppress rules monthly. Flag any rules where context_regex is null or
      empty and the entity text is a common clinical term (disorder, procedure, finding).
      Investigate and remediate.
    metrics:
      - "Number of suppress rules without context_regex"
      - "Coding queue volume per entity text (detect unexpected drops)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design Review -- Operations UX"
    identified_date: "2026-03-03"
    status: "analyzed"

  tags:
    - "data-integrity"
    - "suppress-rules"
    - "systematic-under-coding"
    - "ui-safety-guard"
    - "patient-safety"
