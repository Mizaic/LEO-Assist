# -- DO-LEO-AI-181 -- Referral rejection / resubmission detector
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-181"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-182"]
    user_needs: ["UN-LEO-AI-041"]
    risks_addressed: ["R-LEO-AI-097"]
    verification_tests: ["VT-LEO-AI-176"]

  specification:
    title: "Referral rejection / resubmission anchor classifier"
    description: |
      Adds three regex patterns (_RE_REFERRAL_REJECTED,
      _RE_REFERRAL_MARKED_IN_ERROR, _RE_REFERRAL_RESUBMITTED) and a
      priority branch in _classify_text_encounters that emits the
      affected encounter as a referral anchor with referral_subtype
      'rejected' or 'resubmitted'. The episode builder persists the
      subtype on the IS_PART_OF edge via LINK_ENCOUNTERS, and a new
      MCP tool dq_rejected_referrals_resubmission_delay surfaces the
      rejection-to-resubmission delay for any 2WW pathway.
    acceptance_criteria:
      - criterion: "Rejection regex precedence"
        type: "functional"
        measurement: "Test"
        target: >
          A rejection-bearing encounter produces a referral anchor with
          referral_subtype='rejected' even when generic referral text
          is also present.
      - criterion: "Resubmission requires referral context"
        type: "safety"
        measurement: "Test"
        target: >
          Resubmission keywords without referral context produce zero
          referral anchors (negative test).
      - criterion: "Marked-in-Error specificity"
        type: "safety"
        measurement: "Test"
        target: >
          'Marked in Error' on a non-referral entity (lab value, BP)
          produces zero referral anchors (negative test).

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: >
          _RE_REFERRAL_REJECTED, _RE_REFERRAL_MARKED_IN_ERROR,
          _RE_REFERRAL_RESUBMITTED, plus the priority branch in
          _classify_text_encounters that emits the new subtypes.
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
        description: >
          _link_encounters_to_episode propagates anchor.referral_subtype
          into the IS_PART_OF edge property.
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        description: >
          LINK_ENCOUNTERS Cypher writes r.referral_subtype.
      - artifact_type: "source_code"
        location: "services/neo4j_mcp/tools/query_pack_pathway.py"
        description: >
          dq_rejected_referrals_resubmission_delay tool function and
          TOOLS registry entry.
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 120
      key_functions:
        - "_classify_text_encounters"
        - "_link_encounters_to_episode"
        - "dq_rejected_referrals_resubmission_delay"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Detect referral lifecycle events without falsely matching unrelated rejection or resubmission tokens"
    risk_control_measures:
      - "Negative-pattern tests block false positives for transplant rejection, lab sample resubmission, and Marked-in-Error on non-referral entities"
      - "Rejection/resubmission encounters are gated to suppress diagnosis and benign_closure emission so a workflow event cannot be confused with a clinical outcome"

  verification_status:
    verification_method: "Test"
    verification_complete: false
