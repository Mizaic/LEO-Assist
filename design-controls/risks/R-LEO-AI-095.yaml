# -- R-LEO-AI-095 -- Unified queue hides a source that is falling behind
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-095"
  title: "A unified /work queue could mask a source that is piling up, delaying safety-net or coding action"

  hazard:
    description: >
      When tasks from three queues are merged into one ordered list,
      a source whose items happen to have lower severity or be
      younger than another source can drop off the first page.
      Staff who only look at the first page may miss that (for
      example) SafetyNetAlert volume has doubled overnight.
    category: "clinical_safety"

  hazardous_situation: >
    A SafetyNetAlert sits unactioned past its SLA because the
    unified queue has pushed it below coding-review rows that look
    more urgent by severity band but are clinically less important.

  harm:
    description: >
      Delayed action on a safety-net alert could delay a patient
      intervention. Harm is capped by the fact that SafetyNetAlert
      already has independent escalation pathways, so this is a
      usability-layer risk, not a loss-of-data risk.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 3
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        /work shows a persistent counts-by-source strip at the top of
        the queue. Per-source counts are always visible, even when the
        list is filtered, so a rising source cannot disappear from the
        staff member's view.
      implemented_by: ["DI-LEO-AI-138"]
      verified_by: ["VT-LEO-AI-134"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        SafetyNetAlert rows in the unified queue inherit the existing
        escalation SLA colour band, so an ageing alert cannot look like
        a low-severity coding row.
      implemented_by: ["DI-LEO-AI-138"]
      verified_by: ["VT-LEO-AI-134"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Existing SafetyNetAlert escalation and audit paths remain the
        source of truth. The /work view is an aggregator and never
        writes to source nodes.
      implemented_by: ["DI-LEO-AI-138"]
      verified_by: ["VT-LEO-AI-134"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Counts-by-source, SLA colouring, and the existing escalation
      pathway together mean the unified view cannot hide a rising
      queue. Residual risk is low and acceptable.

  monitoring:
    monitoring_plan: >
      Monthly QA spot-check compares /work counts against the
      independent SafetyNetAlert and CodingReview screens. Any drift
      between the unified view and the source screens is investigated.
    metrics:
      - "Drift between /work counts and per-source screens"
      - "Median time to action SafetyNetAlert after unified queue rollout"
    review_frequency: "Monthly for first 3 months, then quarterly"

  metadata:
    identified_by: "Wave D design review, Phase 4"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "role-first"
      - "staff"
      - "task-queue"
      - "usability"
