# -- R-LEO-AI-092 -- Divergent NCDA cohort definitions mislead clinical users
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-092"
  title: >
    Different analytics endpoints using different 'confirmed cancer'
    filters give contradictory headline figures on the same dashboard,
    causing clinical users to mistrust or misinterpret their audit
    data.

  hazard:
    description: >
      On 2026-04-17 the NCDA care/audit dashboard simultaneously
      displayed '17 Confirmed Cancers' (headline card) and '91 cases'
      (Stage at Diagnosis chart) for the same filter window.
      Investigation found six distinct inline definitions of
      'confirmed cancer' spread across audit.py, _audit_sections.py,
      dashboards.py, mission_control.py, benchmarks.py, and
      _audit_intervals.py.
    category: "clinical_safety"

  hazardous_situation: >
    A practice quality improvement lead views the NCDA summary page
    to decide where to focus clinical-improvement effort. They see
    two mutually incompatible numbers. Depending on which number
    they believe, they either (a) dismiss the product as unreliable,
    (b) act on the wrong denominator when calculating practice
    performance versus national benchmarks, or (c) report
    inconsistent figures to their CCG / ICB.

  harm:
    description: >
      Incorrect prioritisation of clinical improvement effort;
      erosion of clinician trust in the audit platform; risk of
      external audit / CQC finding if the inconsistency is
      reproduced in a published benchmark report. No direct patient
      harm, but meaningful quality-improvement and regulatory harm.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 2
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Introduce libs.analytics.cohorts as the single authoritative
        source for the confirmed-cancer and suspected-cancer-referral
        cohort definitions. Every analytics endpoint composes its
        Cypher by calling one of these helpers; inline filter
        duplication is removed.
      implemented_by: ["DI-LEO-AI-134"]
      verified_by: ["VT-LEO-AI-130"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Regression harness (tests/test_analytics_cohorts.py) asserts
        all affected endpoints return the same confirmed-cancer count
        for an identical filter window; CI blocks any drift.
      implemented_by: ["DI-LEO-AI-134"]
      verified_by: ["VT-LEO-AI-130"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        The '2WW-route diagnoses' metric is surfaced separately with
        a clear tooltip; it is never labelled simply 'Confirmed
        Cancers'.
      implemented_by: ["DI-LEO-AI-134"]
      verified_by: ["VT-LEO-AI-130"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After consolidation every endpoint derives its cohort from a
      single helper, and the parity regression test makes drift
      visible at CI time. The metric label change prevents users
      from ever seeing a '17' and a '91' under the same noun.

  monitoring:
    monitoring_plan: >
      Parity regression test runs on every PR. Post-deployment, a
      lightweight smoke query logs the NCDA summary confirmed_cancers
      count and the cancer-stage chart total once per nightly batch;
      any non-zero delta raises an observability alert.
    metrics:
      - "diff(/audit/summary.confirmed_cancers, /audit/cancer-stage total)"
      - "diff(/audit/summary.confirmed_cancers, /dashboards/overview.confirmed_cancer)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Live dashboard inconsistency observed by product owner 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "ncda"
      - "analytics"
      - "cohort-definition"
