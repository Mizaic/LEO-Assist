# -- DO-LEO-AI-212 -- Problem-list diagnosis override for same-encounter referral gate
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-212"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-215"]
    user_needs: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-202"]
    verification_tests: ["VT-LEO-AI-207"]

  specification:
    title: "Pattern K: hard problem-list diagnosis evidence overrides DI-LEO-AI-145 same-encounter referral gate"
    description: |
      Implements DI-LEO-AI-215. Two coordinated changes:

      libs/domains/code_inventories.py:
        - New helper find_malignancy_code_in_problem_line(text)
          scans only problem-list lines (Major:/Problem:/Active
          Problem:) for Read codes present in MALIGNANCY_READ_
          CODES, returning the first (code, site_key) tuple or
          None. The helper short-circuits when the same line
          carries a "history of" marker (text_contains_history_
          of_cancer guard reused).

      services/analysis_worker/app/analyzers/anchor_detector.py:
        - The diagnosis branch in _classify_text_encounters now
          computes a separate _malignancy_problem_hit (using the
          new strict helper) and passes it into a
          _has_hard_dx_evidence boolean alongside the existing
          _malignancy_term_hit (problem-line term) and
          _active_care_hit (XaIph etc.). The same-encounter
          referral gate (_dx_referral_blocked) is now bypassed
          ONLY when _has_hard_dx_evidence is true. Free-prose
          code mentions (find_malignancy_code without the
          problem-line constraint) still respect the gate so the
          DI-LEO-AI-145 trap stays in place.
        - Imports updated to pull find_malignancy_code_in_
          problem_line from libs.domains.code_inventories.

    acceptance_criteria:
      - criterion: "Strict helper isolated to problem-list lines"
        type: "functional"
        measurement: "Unit test"
        target: "find_malignancy_code_in_problem_line('Major: Invasive carcinoma of breast (Ya0ln) - lobular (New Episode)') returns ('Ya0ln', 'breast'); 'Considering malignant tumour of breast (X78WM)' returns None."
      - criterion: "Same-encounter override fires diagnosis"
        type: "safety"
        measurement: "Unit test"
        target: "Encounter with both 'Fast track referral for suspected breast cancer (XaMeC)' AND 'Major: Invasive carcinoma of breast (Ya0ln) (New Episode)' emits exactly one diagnosis with diagnosis_source='problem_list_code'."
      - criterion: "DI-LEO-AI-145 trap preserved"
        type: "safety"
        measurement: "Unit test"
        target: "Encounter with only 'Fast track referral for suspected lung cancer' emits zero diagnosis anchors."
      - criterion: "Active-care code still overrides"
        type: "safety"
        measurement: "Unit test"
        target: "Encounter with 'Cancer care review (XaIph)' on a referral encounter still emits diagnosis (active-care path unchanged)."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "find_malignancy_code_in_problem_line strict helper"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_has_hard_dx_evidence override gate inside _classify_text_encounters"
      - artifact_type: "test"
        location: "tests/test_patient_4802892365_patterns.py"
        description: "TestPatternKProblemListDxOverridesReferralGate class (4 cases)"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 25
      key_functions:
        - "find_malignancy_code_in_problem_line"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Diagnosis anchor emission used to populate EpisodeOfCare.diagnosis_date and to drive cohort confirmed-cancer counts"
    risk_control_measures:
      - "Override gate uses the strict find_malignancy_code_in_problem_line helper so free-prose code mentions cannot bypass DI-LEO-AI-145"
      - "Hard evidence requires Read code OR malignancy term OR active-cancer-care code on a problem-list line; soft signals still respect the referral gate"
      - "history_of_cancer guard short-circuits the helper to avoid mis-classifying historical mentions as fresh diagnoses"

  verification_status:
    verification_method: "Test"
    verification_complete: false
