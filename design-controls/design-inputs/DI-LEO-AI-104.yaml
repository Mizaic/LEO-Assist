# -- DI-LEO-AI-104 -- Polarity-Encoded Finding Guard
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-104"
  type: "Safety"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The system SHALL detect and correct assertion inversion that arises when
    a resolved SNOMED finding or observable entity concept's preferred term
    (PT) explicitly encodes its own polarity via a suffix word -- such as
    "absent", "not detected", "not found", "not present", or "negative" --
    immediately before the semantic tag parenthesis (e.g. 370051000
    "Perineural invasion by tumor absent (finding)"). In this case the
    concept choice already encodes the clinical result; entity assertion
    SHALL be forced to "present" to mean "this concept applies to this
    patient". The correction SHALL be logged with guard reason
    "polarity_encoded_finding". The guard SHALL fire after SNOMED
    terminology resolution has populated the preferred term, in both the
    runtime coding pipeline (terminology subgraph) and the training
    label-verification path (post-processing layer 7d).
  rationale: >
    When the source text states "Perineural invasion: absent", two things
    happen simultaneously: ConText detects "absent" and sets
    assertion=absent; SNOMED lookup finds the "absent" variant concept
    (370051000) because the lookup text contains "absent". The result is
    double negation -- assertion=absent on a concept that already means
    absent -- semantically equivalent to "perineural invasion is present".
    This is a clinical inversion. The fix_double_negated_situations guard
    handles situation concepts only (prefix-based patterns such as "No
    suicidal thoughts"). Finding concepts require a separate suffix-based
    guard, because the polarity word in SNOMED finding PTs appears at the
    end of the term rather than the beginning.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: >
          Given a finding entity with any non-present assertion and a
          resolved SNOMED PT ending with "absent (finding)", "not detected
          (finding)", "not found (finding)", "not present (finding)", or
          "negative (finding)", assertion SHALL be corrected to present and
          _assertion_guard SHALL equal "polarity_encoded_finding".
      - type: "safety"
        spec: >
          The guard SHALL also fire for "observable entity" semantic tag
          concepts with polarity-encoding PTs.
      - type: "functional"
        spec: >
          Guard SHALL NOT fire on situation concepts -- those are handled
          by fix_double_negated_situations.
      - type: "functional"
        spec: >
          Guard SHALL NOT fire on disorder concepts regardless of PT content.
      - type: "functional"
        spec: >
          Guard SHALL be idempotent: applying it twice to the same entity
          list produces the same result as applying it once.
      - type: "functional"
        spec: >
          Guard SHALL NOT alter entities whose assertion is already "present".
      - type: "functional"
        spec: >
          Guard fires after terminology resolution in both the runtime
          (_resolve_terms in terminology.py) and training paths
          (post_processing layer 7d).
    constraints:
      - type: "safety"
        spec: >
          Guard MUST only correct entities whose SNOMED preferred term is
          already resolved. It MUST NOT infer polarity from the raw entity
          text alone.
      - type: "performance"
        spec: "Guard processes each entity in O(1) time; no external calls"
    dependencies: ["DI-LEO-AI-005", "DI-LEO-AI-101"]
    downstream_impacts:
      - "libs/pipeline/post_processing.py -- new fix_polarity_encoded_findings function, called in layer 7d"
      - "libs/pipeline_graph/subgraphs/terminology.py -- called after fix_double_negated_situations"
    technical_details:
      language: "Python"
      framework: "None"
      file_structure:
        - "libs/pipeline/post_processing.py"
        - "libs/pipeline_graph/subgraphs/terminology.py"
      estimated_loc: 25

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-104 pass: polarity-encoding finding PTs
      corrected to present; non-finding and non-absent entities unaffected;
      idempotency verified; runtime (_resolve_terms) and training paths both
      corrected; specific "Perineural invasion by tumor absent (finding)" case
      corrected.
    test_protocol: "VT-LEO-AI-104"

  safety_class: "B"
  risks: ["R-LEO-AI-071"]
  tags:
    - "assertion"
    - "double-negation"
    - "safety-guard"
    - "finding"
    - "polarity"
    - "snomed"
