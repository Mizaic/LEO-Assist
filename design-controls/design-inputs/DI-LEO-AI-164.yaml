# -- DI-LEO-AI-164 -- Intelligence Console redesign on @leo/design-system (Phase 8a)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-164"
  type: "Functional"
  derived_from: ["UN-LEO-AI-075"]
  requirement: >
    The /admin/console page SHALL be rendered through KnowledgePageLayout
    (width="wide") with a StatHero summarising the AI loop, a PipelineRail
    primitive for the six pipeline stages, a NudgeStrip primitive for the
    smart nudge, and the existing stage panel bodies wired into a refreshed
    ConsoleStagePanel that uses design-system surface, divider and radius
    tokens.

  rationale: >
    The Intelligence Console is the only top-level admin surface still using
    the legacy HealthBar / NudgeBanner / StageCard chrome. Aligning it with
    the design-system removes visual inconsistency, gives operations users
    the same motion / density / accessibility contracts as the Knowledge
    tabs and the Pathways list, and unblocks Phase 8b (rebuilding the
    TrainStage and EvaluateStage bodies on ReviewListCard / DataGridCard).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/app/admin/console/page.tsx SHALL import
          KnowledgePageLayout, StatHero, PipelineRail and NudgeStrip from
          @leo/design-system and render them in that order. The page SHALL
          NOT import HealthBar or NudgeBanner from @/components/ui.
      - type: "functional"
        spec: >
          The KnowledgePageLayout invocation SHALL set screenId="admin-console"
          and width="wide" so the page matches the rest of the admin surface.
        # Intro copy is provided by the existing AreaIntro/areaCopy.ts
        # entry under the "operations" key (which is the area key for
        # the console; see services/ui/src/__tests__/area-intro-wiring.test.ts).
      - type: "functional"
        spec: >
          A new computeConsoleStats(state) helper SHALL live in
          services/ui/src/components/console/useConsoleState.ts and SHALL
          return at least three StatTile entries covering: gold labels
          total, candidate queue depth, latest F1 (or live model version
          if no F1 is available).
      - type: "functional"
        spec: >
          A new PipelineRail primitive SHALL live at
          services/design-system/src/primitives/PipelineRail.tsx and SHALL
          render an ordered, accessible row of stage pills (status dot +
          label + accent), expose role="tablist" semantics, support
          keyboard activation (Enter / Space), and animate stage entry on
          mount with framer-motion (stagger respects reduced-motion).
      - type: "functional"
        spec: >
          A new NudgeStrip primitive SHALL live at
          services/design-system/src/primitives/NudgeStrip.tsx and SHALL
          accept a message, optional actionLabel + onAction, and a
          severity in {info, warning, danger}. The strip SHALL use
          color.status.* tokens for tone and SHALL set role="status" with
          aria-live="polite".
      - type: "functional"
        spec: >
          A new ConsoleStagePanel module SHALL live at
          services/ui/src/components/console/ConsoleStagePanel.tsx, SHALL
          present each stage body inside a card that uses
          color.surface.raised + color.surface.divider + radius.md, and
          SHALL keep the existing accentColor convention so each stage's
          identity colour remains visible.
      - type: "safety"
        spec: >
          The page SHALL preserve the existing handler contract: clicking
          a stage in the rail SHALL still toggle that stage's panel,
          training kick-off and cancel SHALL still call the same APIs,
          and the polling cadence SHALL remain at 10 s.
    constraints:
      - type: "safety"
        spec: >
          The redesign SHALL NOT modify the public API of useConsoleState
          (jobs, latestJob, runningJob, goldStats, candidateQueueTotal,
          promotedVersion, loading, refresh) -- only ADDITIVE changes are
          permitted (computeConsoleStats helper).
      - type: "safety"
        spec: >
          The existing internal stage modules (DiscoverStage,
          CurateStage, TrainStage, EvaluateStage, DeployStage,
          MonitorStage) SHALL continue to render unchanged behind the new
          shell. Their internal redesign is out of scope for Phase 8a.
    dependencies: ["DI-LEO-AI-130", "DI-LEO-AI-135", "DI-LEO-AI-142", "DI-LEO-AI-144"]
    downstream_impacts:
      - "Intelligence Console / training & deployment workflow"
      - "Reusable PipelineRail + NudgeStrip primitives for future stage views"
      - "Phase 8b TrainStage / EvaluateStage body rebuild"
    technical_details:
      language: "TypeScript"
      framework: "React + @leo/design-system + framer-motion"
      file_structure:
        - "services/ui/src/app/admin/console/page.tsx"
        - "services/ui/src/components/console/useConsoleState.ts"
        - "services/ui/src/components/console/ConsoleStagePanel.tsx"
        - "services/design-system/src/primitives/PipelineRail.tsx"
        - "services/design-system/src/primitives/NudgeStrip.tsx"
        - "services/design-system/src/primitives/index.ts"
      estimated_loc: 600

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-162 verifies via static-source inspection that:
      (a) /admin/console/page.tsx imports KnowledgePageLayout, StatHero,
          PipelineRail, NudgeStrip from @leo/design-system and does NOT
          import HealthBar or NudgeBanner;
      (b) the KnowledgePageLayout call sets screenId="admin-console" and
          width="wide";
      (c) computeConsoleStats is exported from useConsoleState.ts and
          returns >= 3 StatTile entries;
      (d) PipelineRail.tsx exposes role="tablist", a keyboard handler
          for Enter/Space, and uses useMotion for reduced-motion;
      (e) NudgeStrip.tsx accepts a severity prop and renders role="status"
          with aria-live="polite".
    test_protocol: "VT-LEO-AI-162"

  safety_class: "B"
  risks: ["R-LEO-AI-165"]
  tags:
    - "intelligence-console"
    - "design-system"
    - "wave-e-phase-8"
    - "operations"
    - "ui"
