    description: |
      Cross-cutting polish change that harmonises three Knowledge
      tab surfaces:

        - services/ui/src/app/admin/knowledge/page.tsx -- TAB_WIDTH
          map promotes ai-instructions and clinical-guidelines from
          "reading" to "wide" so all eight tabs render at 1600px.
        - services/ui/src/app/settings/domains/page.tsx -- DomainCard
          re-laid-out (icon + title in header, tone-tinted chip on
          right, description body, footer with subdomain count and
          chevron). Grid capped at 3 columns. Card style aligned to
          the canonical 12px / 18px / 3px-accent / 168px-min pattern.
        - services/ui/src/app/settings/terminology/page.tsx --
          PackageCard radius / padding / minHeight aligned to the
          same canonical pattern.
