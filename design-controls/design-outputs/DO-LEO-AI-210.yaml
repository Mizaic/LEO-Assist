# -- DO-LEO-AI-210 -- Patient detail Encounter text overlay-first navigation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-210"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-213"]
    user_needs: ["UN-LEO-AI-077"]
    risks_addressed: ["R-LEO-AI-174"]
    verification_tests: ["VT-LEO-AI-205"]

  specification:
    title: "Overlay-first patient detail Encounter text tab"
    description: |
      Implements DI-LEO-AI-213. Removes the legacy scope chips and
      collapsible accordions from the Mission Control patient
      detail Encounter text tab and replaces them with a single
      chronological encounter list filtered only by the histogram
      brush, the existing Coded-only switch, and the existing
      Search field. Adds three episode overlays on top of the
      DI-LEO-AI-179 histogram so the timeline itself answers
      "what happened before, after, and in between the episode
      encounters":

        - The existing tinted "timeline-window-band" is now derived
          from the min and max dates of the encounters in the
          linked-encounter set rather than from
          episode.referral_date / episode.end_date. The band now
          tracks the actual episode footprint instead of a loose
          envelope; when no linked encounters resolve, the band is
          omitted.
        - LinkedEncounterTicks: one small absolutely-positioned
          tick (data-testid="timeline-linked-tick", colour #2563eb)
          per linked encounter, sitting on the bottom axis. Each
          tick carries a data-encounter-id attribute and is
          aria-hidden because the per-bar aria-label already
          announces the linked count.
        - MilestoneMarkers: one absolutely-positioned drop-line
          plus a small label tab per episode milestone. Each marker
          has data-testid="timeline-milestone-marker", a
          data-milestone-type attribute, an aria-label of the form
          "Milestone: <Plain label> on <short date>", a Tooltip
          revealing the full label, and click + Enter / Space
          handlers that delegate to the parent's onJumpToEncounter.

      EncounterTextTab.tsx is restructured as follows:
        - Scope state and the three Chip elements are deleted.
        - The two Accordion sections and the "linked but no
          explicit links" warning Alert are deleted. splitEncounters
          is removed from encounterFilters.ts.
        - A single visibleEncounters memo runs applyCommonFilters
          over every patient encounter and sorts ascending by date.
        - On first load (and on every episode_id change) the brush
          window is initialised to the padded episode-linked
          footprint. The default-applied state lives in a ref keyed
          by episode_id so the brush is not reset after the user
          manually adjusts it.
        - jumpToEncounter clears codedOnly, search, and
          timelineRange before scrolling, and the scrollIntoView
          call is guarded by a `typeof ... === "function"` check so
          jsdom-driven unit tests can exercise the jump flow
          without crashing.
        - The encounter cards now render an "In episode" chip and
          a 3px coloured left accent on linked encounters via two
          new EncounterCard props (isLinkedToEpisode, plus
          data-linked-to-episode on the root).
        - The recode flow (queue -> SSE -> refresh until coded
          count > 0) is lifted into useEncounterRecode.ts so the
          tab file stays under 500 LOC.
        - Help copy above the timeline now reads, in plain
          English, that every patient encounter appears below and
          the brush controls which appear; the timeline caption
          reads "Click a bar to jump - drag the focus band to
          widen or narrow your view".

      Carried over unchanged from DO-LEO-AI-178: the histogram
      bars, the brush rail, the popover, the focus band, the
      sticky positioning, the IntersectionObserver scroll-sync,
      the milestone chip row, and the recode SSE helper.

    acceptance_criteria:
      - criterion: "Scope chips removed"
        type: "functional"
        measurement: "Source inspection"
        target: "EncounterTextTab.tsx contains no 'Episode linked (', 'Episode window (' or 'All encounters (' string literals and no setScope state setter."
      - criterion: "Accordions removed"
        type: "functional"
        measurement: "Source inspection"
        target: "EncounterTextTab.tsx contains no <Accordion ...> nodes; encounterFilters.ts no longer exports splitEncounters."
      - criterion: "Coded only and Search retained"
        type: "functional"
        measurement: "Live render"
        target: "Coded only switch and 'Search text in shown encounters' field are visible above the encounter list."
      - criterion: "Default brush is padded episode window"
        type: "functional"
        measurement: "Live render"
        target: "On first render the timeline-filter-banner is visible and the encounter cards rendered are the linked subset; clearing the banner restores every patient encounter."
      - criterion: "In-episode chip on linked cards"
        type: "functional"
        measurement: "Live render"
        target: "Each card whose encounter id is in the linked set renders a Chip with label 'In episode' (data-testid='encounter-in-episode-chip') and the card root carries data-linked-to-episode='true'."
      - criterion: "Tightened episode band"
        type: "functional"
        measurement: "Live render"
        target: "data-testid='timeline-window-band' spans only the dates of linked encounters; when no linked encounters resolve, the band is not rendered."
      - criterion: "Per-encounter linked tick markers"
        type: "functional"
        measurement: "Live render"
        target: "One element with data-testid='timeline-linked-tick' per linked encounter, each carrying a data-encounter-id attribute."
      - criterion: "Milestone markers with accessible label"
        type: "functional"
        measurement: "Live render"
        target: "One element with data-testid='timeline-milestone-marker' per non-empty milestone date, each with aria-label matching /^Milestone: .+ on .+$/ and invoking onJumpToEncounter on click and on Enter / Space."
      - criterion: "Jump clears all filters"
        type: "functional"
        measurement: "Live render"
        target: "Clicking a milestone chip, single-bin bar, popover row, or milestone marker clears codedOnly, search and timelineRange so the target encounter is rendered."
      - criterion: "EncounterTextTab.tsx LOC ceiling"
        type: "functional"
        measurement: "wc -l"
        target: "EncounterTextTab.tsx <= 500 LOC after wiring the new overlay-first navigation."

