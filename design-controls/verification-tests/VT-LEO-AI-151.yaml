# -- VT-LEO-AI-151 -- Pathways list chrome on @leo/design-system
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-151"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-153"]
    risks: ["R-LEO-AI-105"]

  metadata:
    title: "Pathways admin list redesigned on @leo/design-system"
    description: >
      Verifies the Pathways admin list page
      (services/ui/src/app/admin/pathways/page.tsx) and its sibling
      modules (PathwayCard.tsx, dialogs.tsx, templates.ts,
      types.ts) consume the shared design-system chrome (StatHero,
      SegmentedTabs, ToolbarActions); that the legacy custom h5
      header + raw chip-strip filter is gone; that all FHIR + Next
      router handlers are still wired (api.get / api.put / api.post
      / api.delete on /fhir/PlanDefinition + router.push to
      /admin/pathways/:id); that destructive actions (Publish,
      Retire, Delete) stay behind explicit confirmation dialogs;
      that the Delete dialog still requires the user to type the
      pathway name verbatim; that exactly one ToolbarAction has
      variant 'primary'; that all four starter templates ship in
      the New Pathway dialog; and that loading / empty / no-match
      states are reachable.

      The test does a deterministic static-source scan because the
      page hits /fhir/PlanDefinition on mount, which makes a
      unit-scoped live render fragile. A live render is reserved
      for the Phase 7 Playwright sweep.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathways-list-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node >= 20"
      - "npm install run in services/ui"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-151-TC-001"
      case_name: "Page imports design-system primitives and sibling modules"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read pathways/page.tsx as text"
          expected_result: >
            StatHero, SegmentedTabs, ToolbarActions imported from
            @leo/design-system; PathwayCard imported from
            ./PathwayCard; dialogs imported from ./dialogs;
            PlanDefinition imported from ./types; PathwayTemplate
            imported from ./templates.
      verification_method: "automated"
      acceptance_criteria:
        - "Module split + chrome imports match DI-153 AC-001"

    - case_id: "VT-151-TC-002"
      case_name: "Removes legacy custom h5 page header in favour of StatHero"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search pathways/page.tsx for legacy header markers"
          expected_result: >
            No <Typography variant='h5'> page title; <StatHero />
            present.
      verification_method: "automated"
      acceptance_criteria:
        - "Legacy custom header replaced by StatHero"

    - case_id: "VT-151-TC-003"
      case_name: "Preserves /fhir/PlanDefinition data + routing handlers"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search pathways/page.tsx for handler calls"
          expected_result: >
            api.get<...>('/fhir/PlanDefinition'),
            api.post<...>('/fhir/PlanDefinition'),
            api.put('/fhir/PlanDefinition/<id>'),
            api.delete('/fhir/PlanDefinition/<id>'),
            router.push('/admin/pathways/<id>') all present.
      verification_method: "automated"
      acceptance_criteria:
        - "All FHIR + routing handlers preserved"

    - case_id: "VT-151-TC-004"
      case_name: "Status filter uses SegmentedTabs with the correct API"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Extract <SegmentedTabs ... /> tag and inspect props"
          expected_result: >
            tabs={...}, value={statusFilter},
            aria-label='Filter pathways by status' present; tabs
            include 'all', 'active', 'draft', 'retired' with per-
            tab counts.
      verification_method: "automated"
      acceptance_criteria:
        - "API matches DI-153 AC-004"

    - case_id: "VT-151-TC-005"
      case_name: "Single primary action is 'New pathway'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search pathways/page.tsx for ToolbarAction ids and variants"
          expected_result: >
            id 'new-pathway' present; variant 'primary' appears
            exactly once.
      verification_method: "automated"
      acceptance_criteria:
        - "Exactly one primary action wires to the New Pathway dialog"

    - case_id: "VT-151-TC-006"
      case_name: "Stats include the four canonical tiles"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Search pathways/page.tsx for stat-tile labels"
          expected_result: >
            'Pathways', 'Live', 'Drafts', 'Retired' all present
            as label strings on StatTile entries.
      verification_method: "automated"
      acceptance_criteria:
        - "Workflow health is visible at a glance"

    - case_id: "VT-151-TC-007"
      case_name: "PathwayCard uses 12px radius and 3px tone-coded accent strip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read PathwayCard.tsx and inspect its style"
          expected_result: >
            borderRadius: 12, padding: 18, a 3px-wide left accent
            strip with background: accent, framer-motion stagger
            entry all present.
      verification_method: "automated"
      acceptance_criteria:
        - "PathwayCard token alignment matches the canonical pattern"

    - case_id: "VT-151-TC-008"
      case_name: "PathwayCard preserves the full action surface"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search PathwayCard.tsx for action handler usage"
          expected_result: >
            onEdit, onPublish, onDuplicate, onRetire, onReactivate,
            onDelete all referenced; busy + isSeeded disable logic
            present.
      verification_method: "automated"
      acceptance_criteria:
        - "All six action paths still reachable from a card"

    - case_id: "VT-151-TC-009"
      case_name: "dialogs module exports New / Publish / Delete dialogs"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read dialogs.tsx as text"
          expected_result: >
            NewPathwayDialog, PublishDialog, DeletePathwayDialog
            all exported; DeletePathwayDialog disables confirm
            until confirmName.trim() === target.name.
      verification_method: "automated"
      acceptance_criteria:
        - "Type-the-name confirm gate preserved (R-105 mitigation)"

    - case_id: "VT-151-TC-010"
      case_name: "templates module ships all four starter templates"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read templates.ts and inspect PATHWAY_TEMPLATES"
          expected_result: >
            ids 'blank', 'extraction-only',
            'extraction-verify-persist', 'training-audit' all
            present in the exported catalogue.
      verification_method: "automated"
      acceptance_criteria:
        - "Template catalogue completeness preserved"

    - case_id: "VT-151-TC-011"
      case_name: "Empty / loading / no-match states reachable"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search pathways/page.tsx for state markers"
          expected_result: >
            Copy strings 'Loading pathways...', 'No pathways
            configured yet', and 'No pathways match this filter'
            all present.
      verification_method: "automated"
      acceptance_criteria:
        - "All three async states reachable"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-151/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-16"
      executed_by: "Wave E Phase 6 automation"
      result: "pass"
      notes: "All 11 test cases pass under jest 30; 0 failures."
