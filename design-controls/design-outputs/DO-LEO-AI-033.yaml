  version: "1.0.0"
  type: "Software_Module"
  status: "released"

  traceability:
    design_inputs: ["DI-LEO-AI-050"]
    user_needs: []
    risks_addressed: ["R-LEO-AI-034"]
    verification_tests: ["VT-LEO-AI-042"]

  specification:
    title: "Suggest-Aliases LLM Endpoint (Concepts Router) and Model Inference Reload Safeguard"
    description: |
      Two changes delivered together as software improvements:

      ── 1. Suggest-Aliases Endpoint ──────────────────────────────────────

      New endpoint added to services/terminology_api/app/routers/concepts.py:

        POST /terminology/concepts/{concept_id}/suggest-aliases

      Behaviour:
        1. Queries Knowledge Graph for concept FSN, semantic_tag, and
           collect(sf.form) (existing aliases) using GET_CONCEPT_FOR_SUGGESTION.
        2. Calls create_llm(tier="small") → Claude Haiku via AWS Bedrock.
        3. System prompt constrains output to UK primary care clinical
           shorthand, abbreviations, and spelling variants.
        4. User prompt includes concept FSN, SNOMED ID, semantic tag, and
           existing aliases (no patient data, no encounter text).
        5. Parses JSON array from LLM response using re.search(r"\\[.*\\]").
        6. Filters out suggestions already in existing_aliases (case-insensitive).
        7. Returns up to 10 suggestions: {suggestions: [...], concept_id: ...}
        8. On any exception: logs WARNING, returns {suggestions: [], ...}
           (graceful degradation — does not raise HTTP 500).

      404 is returned if the concept is not found or inactive.

      Privacy guarantee: only concept metadata is transmitted to the LLM.
      The Cypher query (GET_CONCEPT_FOR_SUGGESTION) selects c.fsn,
      c.semantic_tag, and collect(sf.form) only.

      ── 2. Model Inference Reload Safeguard ──────────────────────────────

      Problem: On service startup, the lifespan handler calls
      _loader.load_version(version) in a background thread.  If the model
      registry's _signal_reload fires a POST /reload before startup
      completes, two concurrent 382 MB blob downloads begin.  The second
      download races the first's tar.extractall, causing intermittent
      BlobNotFound or extraction errors.

      Fix applied in two files:

      services/model_inference/app/model_loader.py:
        - Added _load_lock = threading.Lock() alongside the existing _lock.
        - load_version() acquires _load_lock before downloading, serialising
          all concurrent calls.
        - Inside _load_lock, re-checks _active_version under _lock: if the
          version was loaded by another thread while waiting, returns
          immediately without downloading.

      services/model_inference/app/main.py:
        - /reload fast-path: if _loader.active_version == req.version, return
          {active_version, elapsed_ms: 0} immediately without spawning a
          thread, before any lock acquisition.

      This fix is documented as a software problem resolution per IEC 62304
      Clause 9 (see DC-PR-001 entry PR-2026-003).

