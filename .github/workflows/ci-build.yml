name: CI - Build and Push Images

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC federated credential
  contents: read

env:
  ACR_NAME: leoaicr
  ACR_LOGIN_SERVER: leoaicr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio black flake8

      - name: Lint - black format check
        run: black --check --diff .

      - name: Lint - flake8
        run: flake8 --max-line-length=88 --extend-ignore=E203,W503 libs/ services/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  build-push:
    name: Build ${{ matrix.service }}
    needs: [test, security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-api
            dockerfile: infra/dockerfiles/Dockerfile.core-api
          - service: terminology-api
            dockerfile: infra/dockerfiles/Dockerfile.terminology-api
          - service: fhir-api
            dockerfile: infra/dockerfiles/Dockerfile.fhir-api
          - service: analytics-api
            dockerfile: infra/dockerfiles/Dockerfile.analytics-api
          - service: pipeline-worker
            dockerfile: infra/dockerfiles/Dockerfile.pipeline-worker
          - service: model-inference
            dockerfile: infra/dockerfiles/Dockerfile.model-inference
          - service: training-worker
            dockerfile: infra/dockerfiles/Dockerfile.training-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}
          TAG=sha-${{ github.sha }}
          docker build \
            --file ${{ matrix.dockerfile }} \
            --tag $IMAGE:$TAG \
            --tag $IMAGE:latest \
            --cache-from $IMAGE:latest \
            .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Output image digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:sha-${{ github.sha }}

  build-push-ui:
    name: Build ui
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/ui
          TAG=sha-${{ github.sha }}
          docker build \
            --file infra/dockerfiles/Dockerfile.ui \
            --tag $IMAGE:$TAG \
            --tag $IMAGE:latest \
            --cache-from $IMAGE:latest \
            .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Output image digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_LOGIN_SERVER }}/ui:sha-${{ github.sha }}
