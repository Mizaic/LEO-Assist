# -- DO-LEO-AI-216 -- Shared GoldLabelEditorDialog module
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-216"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-219"]
    user_needs: ["UN-LEO-AI-088"]
    risks_addressed: ["R-LEO-AI-206"]
    verification_tests: ["VT-LEO-AI-213"]

  specification:
    title: "Shared gold-label editor dialog and barrel module"
    description: |
      Promotes the existing `GoldLabelDetailDialog` to a stable,
      shared component (`GoldLabelEditorDialog`) consumed by every
      surface that edits encounter entities. Adds three optional
      plumbing props -- `saveMode` ('gold' | 'dual'), `entitySaver`,
      and `onAfterSave` -- with safe defaults so the existing
      /admin/training candidates tab continues to behave exactly as
      it did before. Adds an optional `headerChrome` slot for
      surface-specific context (e.g. search match rationale on
      /care/encounters).

      A new barrel module (`@/components/gold-editor`) re-exports
      the dialog, the dual-save adapter hook (`useDualSaveAdapter`),
      the four API helpers, and the shared types so consumers can
      import everything from one stable path.

    acceptance_criteria:
      - criterion: "Backwards compatibility for /admin/training"
        type: "functional"
        measurement: "Test"
        target: "Default props (no saveMode, no entitySaver) produce identical behaviour to the pre-refactor candidates dialog"
      - criterion: "Dual-save banner gated on saveMode"
        type: "safety"
        measurement: "Test"
        target: "saveMode='dual' renders the warning banner; saveMode='gold' does not"
      - criterion: "Header chrome rendered when provided"
        type: "functional"
        measurement: "Test"
        target: "headerChrome prop is rendered inside the dialog body just below the title strip"
      - criterion: "Single barrel export"
        type: "functional"
        measurement: "Inspection"
        target: "Dialog, hook, API helpers, and types are all exported from @/components/gold-editor"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-editor/GoldLabelEditorDialog.tsx"
        description: "Re-export of GoldLabelDetailDialog under a stable name"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-editor/index.ts"
        description: "Barrel surfacing dialog, hook, API helpers, types"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-editor/types.ts"
        description: "Shared TS types (SavedGoldEntity, GoldDialogSaveMode, ...)"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-editor/api.ts"
        description: "Shared API helpers (patch/from-dry-run/from-encounter/sync-from-gold)"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-editor/useDualSaveAdapter.ts"
        description: "React hook bridging the dialog to syncCodedLinksFromGold"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "Adds saveMode/entitySaver/onAfterSave/headerChrome props with safe defaults"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 200
      key_functions:
        - "GoldLabelEditorDialog"
        - "GoldLabelDetailDialog (host)"
        - "useDualSaveAdapter"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Editing the entities that drive coding decisions and downstream pipelines"
    risk_control_measures:
      - "saveMode defaults to 'gold' so omitting plumbing props cannot accidentally trigger live writes"
      - "Dual-save warning banner makes the broader scope of writes unmistakable to the reviewer"
      - "headerChrome is render-only context; it cannot trigger writes"

  verification_status:
    verification_method: "Test"
    verification_complete: true
