# -- DI-LEO-AI-050 -- LLM-Assisted Surface Form Alias Suggestion with Human Oversight
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-050"
  type: "Safety"
  derived_from: ["DI-LEO-AI-049", "DI-LEO-AI-033"]
  requirement: >
    The terminology API SHALL provide a concept alias suggestion endpoint
    (POST /terminology/concepts/{concept_id}/suggest-aliases) that:
    (a) Retrieves the SNOMED concept FSN, semantic tag, and list of existing
        surface form aliases from the Knowledge Graph.
    (b) Calls a small LLM (tier="small", currently Claude Haiku via AWS
        Bedrock) with a system prompt constraining output to UK primary care
        clinical shorthand, abbreviations, and spelling variants.
    (c) Returns up to 10 suggested alias strings as a JSON array.
    (d) On LLM failure or timeout, returns an empty suggestions list (graceful
        degradation) rather than an error, so the UI remains usable.
    The endpoint SHALL NOT transmit patient identifiers, encounter text,
    or any personal data to the LLM — only SNOMED concept metadata.
    The UI SHALL present suggestions as visually distinct chips (dashed
    border, AI icon) that require an explicit admin accept action before the
    alias is written to the graph.  Dismissed suggestions are discarded
    client-side without any write to the database.

  rationale: >
    Manually curating surface form aliases for hundreds of SNOMED concepts is
    time-consuming and requires specialist terminology knowledge.  An LLM
    that has been trained on UK clinical text can suggest NHS abbreviations,
    acronyms, and spelling variants that administrators may not know.
    The human acceptance gate is the critical safety control: no alias is
    persisted unless a human clinician or administrator explicitly approves
    it.  This mirrors the HITL pattern used throughout the coding pipeline
    (DI-LEO-AI-040) and limits harm to the case where both the LLM and the
    administrator err simultaneously.  Because only concept metadata is sent
    to the LLM, this feature does not trigger DPIA-001 sub-processor
    obligations for patient data.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "POST /terminology/concepts/{concept_id}/suggest-aliases returns {suggestions: [...], concept_id: ...} for a valid concept"
      - type: "functional"
        spec: "Returned suggestions are strings not already present in existing_aliases (deduplication by lowercased value)"
      - type: "functional"
        spec: "On LLM error or timeout, endpoint returns {suggestions: [], concept_id: ...} with HTTP 200 (graceful degradation)"
      - type: "functional"
        spec: "404 returned when concept_id not found or inactive"
      - type: "safety"
        spec: "Cypher query (GET_CONCEPT_FOR_SUGGESTION) retrieves only c.fsn, c.semantic_tag, and collect(sf.form) — no patient data"
      - type: "safety"
        spec: "LLM prompt does not include patient names, NHS numbers, encounter text, or any personal data"
      - type: "ui"
        spec: "Suggested alias chips are visually distinct from confirmed aliases (dashed border, AutoAwesomeIcon)"
      - type: "ui"
        spec: "Accepting a suggestion calls upsertSurfaceFormMapping with source='llm_suggestion'; no write occurs on dismiss"

    constraints:
      - type: "privacy"
        spec: >
          Only SNOMED concept metadata (FSN, semantic tag, existing alias
          forms) is transmitted to the LLM sub-processor.  No PHI or
          quasi-identifiers may be included in the LLM request.  This is a
          categorical constraint — any change to include patient data requires
          a DPIA-001 review and legal sign-off.
      - type: "safety"
        spec: >
          Suggestions MUST require explicit human acceptance before being
          persisted.  Auto-acceptance or bulk-accept without per-alias review
          is prohibited.
      - type: "reliability"
        spec: >
          LLM failures MUST NOT prevent the surface forms management page from
          loading or other surface form operations from completing.  The
          suggest button is an optional enhancement, not a critical path.

    dependencies: ["DI-LEO-AI-049"]

    downstream_impacts:
      - "Surface form dictionary completeness"
      - "NER anchor detection recall"
      - "HITL review queue volume (via surface form coverage)"
      - "R-LEO-AI-034 (false-positive risk from poor suggestions)"

    technical_details:
      language: "Python / TypeScript"
      framework: "FastAPI (backend), Next.js + MUI (frontend)"
      libraries: ["libs/llm_client/factory.py", "httpx"]
      file_structure:
        - "services/terminology_api/app/routers/concepts.py"
        - "services/terminology_api/app/queries/terminology.py"
        - "services/ui/src/app/settings/surface-forms/page.tsx"
        - "services/ui/src/lib/api/legacy.ts"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      Endpoint returns suggestions for known concept; returns empty list on
      simulated LLM failure; returns 404 for unknown concept; LLM prompt
      verified to contain no PHI fields; UI chips require individual accept.
    test_protocol: "VT-LEO-AI-042"

  safety_class: "B"
  risks: ["R-LEO-AI-034"]
  tags:
    - "llm"
    - "alias-suggestion"
    - "surface-forms"
    - "human-oversight"
    - "terminology-curation"
    - "privacy"
    - "graceful-degradation"
