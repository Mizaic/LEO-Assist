# -- DI-LEO-AI-051 -- Security Gap Remediation: JWT Verification, Audit Log, Data Integrity, Message Validation
- id: "DI-LEO-AI-051"
  title: "Security Gap Remediation — Batch 2"
  version: "1.0"
  status: "approved"
  date: "2026-03-03"
  derived_from: ["R-LEO-AI-030", "R-LEO-AI-031", "R-LEO-AI-032"]
  risk_references:
    - "GAP-002: JWT tokens accepted without JWKS signature verification"
    - "GAP-004: Terminology surface form write endpoints unauthenticated"
    - "GAP-008: Regex-only de-identification misses first names in free narrative"
    - "GAP-012: No durable structured security audit log"
    - "GAP-014: Local organisation list for de-identification hardcoded"
    - "COD-T-001: Service Bus coding job messages accepted without schema validation"
    - "COD-T-002: patient_id and encounter_id accepted without format validation"
    - "CSP-T-001: No Content-Security-Policy or security response headers"
    - "TODO-VERIFY: patient_id_hash stored raw (unencoded) patient_id"

  requirements:
    - id: "DI-051-001"
      title: "JWT JWKS Signature Verification (GAP-002)"
      description: >
        The OAuth callback MUST cryptographically verify the Azure AD id_token
        against the Azure AD JWKS endpoint before trusting any claims.
        Bare base64 decoding (no signature check) is not sufficient.
      acceptance_criteria:
        - "id_token verified using jose.jwt.decode with RS256 algorithm"
        - "JWKS fetched from https://login.microsoftonline.com/{tenant}/discovery/v2.0/keys"
        - "JWKS response cached in-process with configurable TTL (default 3600s)"
        - "Stale cache used as fallback on fetch failure with WARNING log"
        - "JWTError raises HTTP 401 and emits security audit event"
        - "Issuer checked against v2.0 endpoint; v1.0 (sts.windows.net) rejected"

    - id: "DI-051-002"
      title: "Durable Structured Security Audit Log (GAP-012)"
      description: >
        A dedicated 'security.audit' logger MUST emit single-line JSON records
        at WARNING level for every security-relevant event so they appear in
        production log streams regardless of application log level.
      acceptance_criteria:
        - "Module libs/audit/security_log.py exposes typed emit_* functions"
        - "Every emitted record is valid JSON with 'ts', 'event', and context fields"
        - "All records emitted at logging.WARNING level"
        - "Events covered: auth.login.success, auth.login.failure, auth.login.mfa_blocked, auth.logout, auth.session.expired, authz.denied, authz.admin_action, data.access, data.modification, security.token_rejected"
        - "auth.py callback and logout routes call appropriate emit_* functions"

    - id: "DI-051-003"
      title: "Patient ID Hash Must Be a SHA-256 Digest (TODO-VERIFY fix)"
      description: >
        CodingDecision audit nodes MUST store SHA-256(patient_id) as the
        patient_id_hash property, not the raw patient_id. Storing the raw ID
        is a data protection violation under UK GDPR.
      acceptance_criteria:
        - "hashlib.sha256(patient_id.encode()).hexdigest() used before Cypher write"
        - "patient_id_hash=patient_id (raw assignment) removed from source"
        - "SHA-256 produces a 64-character hex digest, verified by test"

    - id: "DI-051-004"
      title: "Terminology Surface Form Write Endpoints Require Service Auth (GAP-004)"
      description: >
        The POST /surface-forms/upsert-mapping, DELETE /surface-forms/{norm},
        and POST /surface-forms/deduplicate endpoints MUST require the
        SERVICE_AUTH_SECRET shared token, consistent with the /writeback endpoint.
      acceptance_criteria:
        - "verify_service_token applied as Depends to all three mutating endpoints"
        - "GET endpoints (list, grouped, duplicates) remain unauthenticated for internal use"
        - "Returns HTTP 401 when SERVICE_AUTH_SECRET is set and token is absent/wrong"

    - id: "DI-051-005"
      title: "Service Bus Coding Job Message Schema Validation (COD-T-001 / COD-T-002)"
      description: >
        Inbound Service Bus coding job messages MUST be validated against a
        Pydantic schema before any pipeline code executes.
      acceptance_criteria:
        - "CodingJobMessage Pydantic model validates patient_id, encounter_id, mode, dry_run"
        - "mode restricted to: all, unprocessed, extract_patient, extract_encounter"
        - "patient_id required, max 128 chars, matches [a-zA-Z0-9_\\-]{1,128}"
        - "encounter_id optional, same format constraint when present"
        - "Malformed messages logged at ERROR and dropped without raising (prevents poison-pill loops)"

    - id: "DI-051-006"
      title: "Content-Security-Policy and Security Response Headers (CSP-T-001)"
      description: >
        The Core API MUST attach security headers to every HTTP response via a
        middleware layer. As a JSON API it serves no documents, so the CSP is
        maximally restrictive.
      acceptance_criteria:
        - "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'"
        - "X-Content-Type-Options: nosniff"
        - "X-Frame-Options: DENY"
        - "Referrer-Policy: no-referrer"
        - "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload"

    - id: "DI-051-007"
      title: "De-identification Local Org List Configurable via Environment (GAP-014)"
      description: >
        The list of local organisation names to redact from clinical text MUST
        be overridable at runtime via the DEIDENTIFY_LOCAL_ORGS environment
        variable (pipe-separated), falling back to the built-in list.
      acceptance_criteria:
        - "DEIDENTIFY_LOCAL_ORGS env var parsed on module load"
        - "Pipe-separated entries each trimmed of whitespace"
        - "Falls back to _BUILTIN_ORGS when env var absent or empty"
        - "Runtime-configured orgs produce [ORGANISATION] replacements in deidentify_text()"

    - id: "DI-051-008"
      title: "NER-Based De-identification Second Pass (GAP-008)"
      description: >
        An optional spaCy NER second pass MUST be available to catch PERSON
        entities in free clinical narrative that regex cannot match (e.g. first
        names without honorifics).
      acceptance_criteria:
        - "DEIDENTIFY_NER_MODEL env var enables the NER pass"
        - "spaCy model loaded once and cached (_NER_NLP module-level)"
        - "deidentify_text(ner=True) applies _ner_redact after regex pass"
        - "Only PERSON entities replaced; ORG/GPE entities left intact"
        - "NER pass silently disabled when model unavailable (logged at WARNING)"
