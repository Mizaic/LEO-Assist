# -- VT-LEO-AI-036 -- UI Safety, Accessibility, and Usability Verification
# IEC 62304 / IEC 62366-1 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-036"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-043"]
    risks: ["R-LEO-AI-028"]
    user_needs: ["UN-LEO-AI-001", "UN-LEO-AI-010"]

  metadata:
    title: "UI Safety, Accessibility, and Usability Verification"
    description: >
      Verifies that all 48 findings from the IEC 62366-1 / WCAG 2.2 usability
      audit (DC-UE-001) have been remediated. Covers destructive action
      confirmation dialogs, error surfacing, keyboard safety, heading hierarchy,
      colour contrast, navigation landmarks, skip link, aria-labels, and
      the preventive cursor rule.
    test_level: "inspection"
    test_type: "functional + accessibility"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/components/__tests__/ReviewView.test.tsx"
      - "services/ui/src/components/__tests__/CodedLinksSection.test.tsx"
      - "services/ui/src/components/__tests__/AppShell.test.tsx"
      - "services/ui/src/components/operations/__tests__/ReviewCard.test.tsx"
      - "services/ui/src/app/dashboard/__tests__/DashboardPage.test.tsx"
      - "services/ui/src/__tests__/ui-safety-static.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Access to services/ui/src/ source code"
      - "Understanding of WCAG 2.2 Level AA criteria"
    test_data:
      data_type: "source_code"
      cleanup_required: false

  test_cases:
    # -- Phase 1: Safety (8 cases) --

    - case_id: "VT-036-TC-001"
      case_name: "CodedLinksSection remove uses ConfirmDialog"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect CodedLinksSection.tsx for ConfirmDialog import and confirmRemove state"
          expected_result: "Delete IconButton sets confirmRemove state; ConfirmDialog rendered when confirmRemove is non-null"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Remove clinical code requires user confirmation before API call"

    - case_id: "VT-036-TC-002"
      case_name: "CodingReviewPanel ignore rule uses ConfirmDialog"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect CodingReviewPanel.tsx for confirmIgnore state and ConfirmDialog"
          expected_result: "Create ignore rule button sets confirmIgnore; ConfirmDialog gates handleCreateIgnoreRule"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Create ignore rule requires user confirmation"

    - case_id: "VT-036-TC-003"
      case_name: "LabelVerificationPanel suppress rule and reset use ConfirmDialog"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect LabelVerificationPanel.tsx for confirmSuppressReview and confirmResetAll states"
          expected_result: "Both actions gated by ConfirmDialog with variant='danger'"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Create suppress rule requires user confirmation"
        - "Reset + reverify all requires user confirmation"

    - case_id: "VT-036-TC-004"
      case_name: "ReviewCard dismiss uses ConfirmDialog"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect ReviewCard.tsx HitlActions for confirmDismiss state"
          expected_result: "Dismiss button sets confirmDismiss; ConfirmDialog gates onResolve(item, 'dismissed')"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Dismiss review item requires user confirmation"

    - case_id: "VT-036-TC-005"
      case_name: "ReviewView keyboard reject uses ConfirmDialog"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect ReviewView.tsx onKey handler for R/r case"
          expected_result: "R/r sets confirmReject state; ConfirmDialog gates handleDecision('reject')"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Keyboard reject shortcut requires confirmation"

    - case_id: "VT-036-TC-006"
      case_name: "ReviewView keydown guard expanded"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect isEditableTarget function in ReviewView.tsx"
          expected_result: "Checks input, textarea, select, isContentEditable, and closest('[role=\"combobox\"]')"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Keyboard shortcuts do not fire from editable elements"

    - case_id: "VT-036-TC-007"
      case_name: "Dashboard error handling uses Promise.allSettled"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect dashboard/page.tsx load function"
          expected_result: "Promise.allSettled used; sectionErrors state tracks per-section failures; Alert shown for each failed section"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "No .catch(() => []) patterns"
        - "Each section shows its own error indicator on failure"

    - case_id: "VT-036-TC-008"
      case_name: "Error boundaries exist"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Check existence of global-error.tsx, error.tsx, not-found.tsx, loading.tsx in services/ui/src/app/"
          expected_result: "All 4 files exist with branded UI and recovery actions"
          verification_method: "File inspection"
      acceptance_criteria:
        - "Unhandled errors show recovery UI, not a blank page"

    # -- Phase 2: Accessibility (7 cases) --

    - case_id: "VT-036-TC-009"
      case_name: "All pages have h1"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search all page.tsx files and delegated components for component='h1'"
          expected_result: "Every page title Typography has component='h1'"
          verification_method: "Code search"
      acceptance_criteria:
        - "WCAG 1.3.1: every page has a semantic h1"

    - case_id: "VT-036-TC-010"
      case_name: "Sidebar brand is not a heading"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect AppShell.tsx fullDrawerContent brand Typography"
          expected_result: "Uses component='span', not variant='h6' without component override"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Brand text does not create a misleading heading in the document outline"

    - case_id: "VT-036-TC-011"
      case_name: "Navigation landmark and aria-current"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect AppShell.tsx full drawer nav section"
          expected_result: "<Box component='nav' aria-label='Main navigation'> wraps List; active ListItemButton has aria-current='page'"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "WCAG 1.3.1: navigation is a landmark region"
        - "WCAG 4.1.2: current page is programmatically indicated"

    - case_id: "VT-036-TC-012"
      case_name: "Skip navigation link"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect layout.tsx for skip link and globals.css for skip-link styles"
          expected_result: "<a href='#main-content'> present; CSS hides it off-screen except on :focus"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "WCAG 2.4.1: keyboard users can bypass navigation"

    - case_id: "VT-036-TC-013"
      case_name: "Colour contrast meets AA"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect theme.ts for caption, body2, and text.secondary values"
          expected_result: "caption=#6B7280 (5.0:1), body2=#596577 (5.5:1), text.secondary=#596577"
          verification_method: "Contrast ratio calculation"
      acceptance_criteria:
        - "WCAG 1.4.3: all text meets 4.5:1 minimum on white"

    - case_id: "VT-036-TC-014"
      case_name: "Main content has id for skip link target"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect AppShell.tsx main Box element"
          expected_result: "id='main-content' present"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Skip link target is programmatically reachable"

    - case_id: "VT-036-TC-015"
      case_name: "Filter chips have aria-pressed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect ReviewSection.tsx filter Chip elements"
          expected_result: "aria-pressed={isActive} on each chip; parent has role='group' and aria-label"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "WCAG 4.1.2: toggle state is programmatically determinable"

    # -- Phase 3: Remaining safety (3 cases) --

    - case_id: "VT-036-TC-016"
      case_name: "No window.confirm or alert calls"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search services/ui/src/ for window.confirm, confirm(, alert("
          expected_result: "No matches in application code"
          verification_method: "Code search"
      acceptance_criteria:
        - "Native browser dialogs are not used"

    - case_id: "VT-036-TC-017"
      case_name: "AppShell uses Next.js Link"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect AppShell.tsx full drawer ListItemButton elements"
          expected_result: "component={Link} and href={item.path} props present"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Navigation uses semantic links for accessibility and right-click support"

    - case_id: "VT-036-TC-018"
      case_name: "Cursor rule exists and covers all standards"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect .cursor/rules/ui-safety.mdc"
          expected_result: "Rule covers ConfirmDialog, error handling, keyboard guards, headings, labels, contrast, empty states"
          verification_method: "File inspection"
      acceptance_criteria:
        - "Preventive rule prevents regression of all remediated findings"

    - case_id: "VT-036-TC-019"
      case_name: "TrainSection uses plain-language stat card labels"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render TrainSection and inspect stat card headings"
          expected_result: "Cards titled 'Teaching examples', 'Checked records', 'Need attention' — no ML jargon"
          verification_method: "Component test"
      acceptance_criteria:
        - "All stat cards use reading-age-11 language"
        - "Error state is surfaced via Alert, not silently swallowed"

    - case_id: "VT-036-TC-020"
      case_name: "TrainingDataPanel uses ConfirmDialog for exclude action"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search TrainingDataPanel.tsx for ConfirmDialog usage"
          expected_result: "ConfirmDialog used for exclude and start-learning dialogs — no raw Dialog"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "No raw <Dialog> used for destructive or confirmation actions"

    - case_id: "VT-036-TC-021"
      case_name: "LabelVerificationPanel has ARIA attributes on toggle"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect LabelVerificationPanel view-mode toggle buttons"
          expected_result: "Buttons have aria-pressed attribute and wrapper has role='group' with aria-label"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "Toggle buttons are accessible to screen readers"

    - case_id: "VT-036-TC-022"
      case_name: "DeploySection uses plain-language metric labels"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render DeploySection and inspect metric labels"
          expected_result: "Labels are 'Training accuracy', 'Training completeness', 'Live test accuracy', 'Live test completeness' with tooltips"
          verification_method: "Component test"
      acceptance_criteria:
        - "No ML jargon (precision, recall, canary, offline) in user-facing labels"

    - case_id: "VT-036-TC-023"
      case_name: "ModelLifecyclePanel uses ConfirmDialog for all destructive actions"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search ModelLifecyclePanel.tsx for ConfirmDialog usage"
          expected_result: "ConfirmDialog used for force-promote, rollback, and reject — no raw Dialog"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "All destructive actions gated by ConfirmDialog component"

    - case_id: "VT-036-TC-024"
      case_name: "ModelLifecyclePanel status labels are plain language"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect statusChip function in ModelLifecyclePanel.tsx"
          expected_result: "Labels are 'Live', 'Being tested', 'Ready to test', 'Registered', 'Retired', 'Switched back'"
          verification_method: "Code inspection"
      acceptance_criteria:
        - "No technical status labels (canary, deprecated, offline_validated) shown to users"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["code_review", "inspection_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-029/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-036-EXEC-001"
      date: "2026-03-03"
      executor: "automated_jest"
      environment: "development"
      result: "pass"
      cases_executed: 18
      cases_passed: 18
      cases_failed: 0
      duration_seconds: 0
      notes: "All 18 verification cases covered: TC-001–011 by component tests, TC-012–018 by static analysis tests"
