# -- R-LEO-AI-501 -- Episode Engine: Segmenter creates wrong window boundaries
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-501"
  title: "Segmenter splits a single episode in two or merges two distinct episodes into one"

  hazard:
    description: >
      The segmenter LLM may set window boundaries on the wrong dates
      (cutting through a single referral-to-treatment episode) or fail
      to start a new window when a clearly separate cancer pathway
      begins. Both errors propagate to every downstream stage and
      cannot be undone by the reconciler in pathological cases.
    category: "clinical_safety"

  hazardous_situation: >
    A patient with a 2024 BCC diagnosis and a 2025 colorectal
    diagnosis is assigned a single window from 2024 to 2025; the
    classifier picks one episode_type and milestones for both diseases
    are mixed in one EpisodeOfCare. Or, conversely, a single breast
    cancer pathway is split into a "referral window" and a
    "treatment window" and the reconciler fails to re-merge them.
    Reviewers using the engine output as the basis for cohort metrics
    or HITL review see the wrong episode count for the patient.

  harm:
    description: >
      Distorted cohort statistics; wrong waiting-time calculations;
      reviewer time wasted reconciling phantom or merged episodes.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Segmenter prompt v1 includes the canonical rules-of-the-road
        from libs/prompts/episode_engine/_shared.py covering
        multi-site referrals and admin echoes; tool_config forces
        valid CandidateWindow output (verified by VT-LEO-AI-501).
      implemented_by: ["DI-LEO-AI-501"]
      verified_by: ["VT-LEO-AI-501"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Reconciler stage (DI-LEO-AI-504, Sonnet) is the second
        chance to merge incorrectly-split or split incorrectly-merged
        windows; merged_from records the audit trail.
      implemented_by: ["DI-LEO-AI-504"]
      verified_by: ["VT-LEO-AI-504"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Frozen-cohort regression VT (VT-LEO-AI-507) re-runs 20
        patients against a pinned baseline with episode_count
        tolerance of +/-1 and asserts the per-episode site +
        episode_type + milestone_types invariants.
      implemented_by: ["DI-LEO-AI-505"]
      verified_by: ["VT-LEO-AI-507"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The two-stage segmenter -> reconciler architecture catches
      single-stage errors in the majority of cases. Frozen-cohort
      regression detects drift before deployment. needs_human_review
      flags low-confidence outcomes for explicit review.

  monitoring:
    monitoring_plan: >
      Track distribution of episode_count per patient and merged_from
      length per episode in EpisodeEngineTrace nodes. Alarm if mean
      episode_count drifts >25% from the 14-day baseline.
    metrics:
      - "Episodes per patient distribution"
      - "Reconciler merge ratio (merged_from length > 1)"
      - "Frozen-cohort VT pass rate"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Episode Engine v1 design review"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags: ["episode-engine", "segmenter", "windows"]
