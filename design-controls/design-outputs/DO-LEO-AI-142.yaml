# -- DO-LEO-AI-142 -- GoldLabelDetailDialog chrome sub-components
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-142"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-146"]
    user_needs: ["UN-LEO-AI-071"]
    risks_addressed: ["R-LEO-AI-099"]
    verification_tests: ["VT-LEO-AI-144"]

  specification:
    title: "Gold-label review dialog: chrome sub-components"
    description: |
      Five focused React components that replace the inline chrome
      of the legacy GoldLabelDetailDialog inside GoldDatasetPanel.tsx.
      Each component is a pure presentation shell that receives all
      state and handlers from the parent. The parent (still inline
      in GoldDatasetPanel.tsx for now) owns business logic so we
      can swap chrome without risking the SVG arc renderer, surface
      form mapping, subdomain popover, or relation suggestion
      pipeline.

      Sub-components:
        - DialogTitleStrip: status pill (uncoded + suggested
          counts), copy / guidelines / shortcuts / close cluster.
        - SuggestionsPanel: collapsible "Recommended links" list
          with single Accept-all action.
        - DeleteConfirmPanel: slide-in destructive confirmation
          with suppress-from-pipeline checkbox.
        - DialogActionsBar: single primary action whose label
          morphs based on suggestion state, Skip-to-next as
          tertiary, Delete behind a kebab.
        - AddTermPopover: extracted target for the future
          "Add a missing term" popover (currently unused by the
          parent panel; lands in Phase 2b with the deeper body
          decomposition).
    acceptance_criteria:
      - criterion: "Single primary action in footer"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-144 TC-005 + TC-006 pass"
      - criterion: "Status pill summarises outstanding work"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-144 TC-004 passes (ready vs counts)"
      - criterion: "Delete behind progressive disclosure"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-144 TC-005 (kebab opens delete menu)"
      - criterion: "All legacy handlers preserved"
        type: "functional"
        measurement: "Inspection"
        target: >
          Manual diff confirms handleAcceptRelationSuggestion,
          handleRejectRelationSuggestion, handleUndoRejectedRelation,
          handleAcceptAllSuggestions, flushTermDraftsAndMarkGold,
          onDeleteCandidate, onNextCandidate, copyToClipboard,
          showShortcutHelp toggle, showGuidelines toggle all wired
          via props from the new sub-components.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DialogTitleStrip.tsx"
        description: "Compact title strip with status pill and toolbar actions"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DialogActionsBar.tsx"
        description: "Single-primary-action footer with morphing label and kebab"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/SuggestionsPanel.tsx"
        description: "Collapsible relation-suggestion list with Accept-all"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/DeleteConfirmPanel.tsx"
        description: "Slide-in destructive confirm with suppress-on-delete"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelDetailDialog/AddTermPopover.tsx"
        description: "Extracted Add-term popover (Phase 2b consumer)"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "Inline GoldLabelDetailDialog now consumes the four chrome sub-components"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 700
      key_functions:
        - "DialogTitleStrip"
        - "DialogActionsBar"
        - "SuggestionsPanel"
        - "DeleteConfirmPanel"
        - "AddTermPopover"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Preserve Skip-to-next so the reviewer queue is never blocked"
      - "Preserve suppress-on-delete so bad pipeline output can be quarantined"
      - "Preserve Mark-as-gold and Accept-all-and-mark behaviours"
    risk_control_measures:
      - "Delete tinted error.main inside the kebab menu (R-099 mitigation)"
      - "Skip-to-next remains a visible secondary so the reviewer can never get stuck"
      - "Status pill makes outstanding work visible at a glance to discourage premature mark-as-gold"

  verification_status:
    verification_method: "Test"
    verification_complete: true
