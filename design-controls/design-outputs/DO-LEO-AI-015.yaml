  specification:
    title: "FHIR R4 API Service"
    description: |
      A set of FastAPI routers that expose FHIR R4-compliant endpoints for
      Measure, MeasureReport, Library, and Device resources. These endpoints
      allow external audit programme systems to discover available quality
      measures, submit measure reports, and retrieve supporting library and
      device metadata. A dedicated Cypher generator translates FHIR search
      parameters into Neo4j queries so the graph database can serve as the
      backing store.
    purpose: "FHIR R4 compliant endpoints for audit programme interoperability"
    technical_approach: |
      Each FHIR resource type has its own router module. The measure service
      layer orchestrates business logic such as period validation and
      population grouping. The cypher_generator translates FHIR search
      parameters (date ranges, identifiers, status filters) into
      parameterised Cypher queries executed against the patient Neo4j
      instance. Responses are serialised to FHIR R4 JSON using Pydantic
      models that mirror the official StructureDefinitions.
    acceptance_criteria:
      - criterion: "Measure and MeasureReport endpoints return valid FHIR R4 JSON"
        type: "functional"
        measurement: "FHIR validator checks response payloads against R4 StructureDefinitions"
        target: "Zero validation errors on all resource responses"
      - criterion: "Search parameters map correctly to Neo4j Cypher queries"
        type: "functional"
        measurement: "Unit tests verify generated Cypher for date, identifier, and status filters"
        target: "100% of supported search parameters produce correct Cypher"
      - criterion: "API responds within acceptable latency under load"
        type: "performance"
        measurement: "Load test with 50 concurrent requests"
        target: "<800ms p95 for list endpoints"
      - criterion: "Unauthenticated requests are rejected"
        type: "security"
        measurement: "Send request without bearer token; verify 401 response"
        target: "All unauthenticated requests return 401"

