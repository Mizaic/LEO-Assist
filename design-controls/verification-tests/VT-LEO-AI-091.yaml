- id: "VT-LEO-AI-091"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-091"]
    risks: ["R-LEO-AI-065"]

  metadata:
    title: "Mission Control Backend API -- Filter, Pagination, KPI, Review Write"
    description: >
      Verifies that the mission_control.py router correctly filters patients
      by all supported parameters, returns properly paginated envelopes,
      calculates KPI aggregations, and writes review data to EpisodeOfCare
      without altering clinical fields. Also verifies org scope enforcement
      and authentication requirements.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/analytics_api/tests/test_mission_control.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest and pytest-asyncio installed"
      - "Neo4j test driver mock or fixture available"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-091-TC-001"
      case_name: "Pathway filter 'confirmed' restricts to completed episodes only"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/patients with pathway_filter=confirmed and a mock Neo4j driver returning mixed-status episodes"
          expected_result: "Cypher query contains WHERE clause restricting ep.status = 'completed'"
        - step_number: 2
          action: "Inspect returned patients array"
          expected_result: "All returned episodes have status='completed'; no closure or in_progress episodes present"
      verification_method: "automated"
      acceptance_criteria:
        - "WHERE clause includes ep.status = 'completed'"
        - "No episode with status other than 'completed' appears in response"

    - case_id: "VT-091-TC-002"
      case_name: "Pathway filter 'closures' restricts to closure status values"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/patients with pathway_filter=closures"
          expected_result: "Cypher WHERE clause includes ep.status IN ['closed_benign','stale_no_diagnosis','stale_post_specialist','closed_related']"
        - step_number: 2
          action: "Verify no completed or in_progress episodes in response"
          expected_result: "All returned episodes have a closure status"
      verification_method: "automated"
      acceptance_criteria:
        - "Cypher restricts to the 4 closure status values"
        - "Completed and in_progress episodes excluded"

    - case_id: "VT-091-TC-003"
      case_name: "Cancer type filter restricts by EpisodeOfCare.cancer_type"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/patients with cancer_types=colorectal,lung"
          expected_result: "Cypher WHERE clause includes ep.cancer_type IN ['colorectal','lung']"
        - step_number: 2
          action: "Inspect returned episodes"
          expected_result: "All returned episodes have cancer_type in {colorectal, lung}"
      verification_method: "automated"
      acceptance_criteria:
        - "cancer_type filter applied correctly to Cypher"

    - case_id: "VT-091-TC-004"
      case_name: "Review status filter 'unreviewed' restricts to episodes with reviewed_at IS NULL"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/patients with review_status=unreviewed"
          expected_result: "Cypher includes ep.reviewed_at IS NULL"
        - step_number: 2
          action: "Inspect response; all episodes have reviewed_at=null"
          expected_result: "No reviewed episodes present"
      verification_method: "automated"
      acceptance_criteria:
        - "Cypher predicate ep.reviewed_at IS NULL included for unreviewed filter"

    - case_id: "VT-091-TC-005"
      case_name: "Pagination SKIP and LIMIT calculated correctly"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/patients with page=2, page_size=25"
          expected_result: "Cypher includes SKIP 25 LIMIT 25"
        - step_number: 2
          action: "Call with page=1, page_size=50"
          expected_result: "Cypher includes SKIP 0 LIMIT 50"
      verification_method: "automated"
      acceptance_criteria:
        - "SKIP = (page-1)*page_size for all valid page/page_size combinations"

    - case_id: "VT-091-TC-006"
      case_name: "KPI endpoint returns all 6 required fields with correct types"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call GET /analytics/mission-control/kpis with any valid filter params"
          expected_result: "Response contains total_patients (int), confirmed_cancer (int), pathway_closures (int), median_diagnostic_interval_days (float or null), safety_netting_rate (float 0.0-1.0), needs_review_count (int)"
        - step_number: 2
          action: "Call with no episodes in scope (empty graph)"
          expected_result: "All counts return 0; median_diagnostic_interval_days returns null; safety_netting_rate returns 0.0"
      verification_method: "automated"
      acceptance_criteria:
        - "All 6 KPI fields present in every non-error response"
        - "safety_netting_rate is float between 0.0 and 1.0"

    - case_id: "VT-091-TC-007"
      case_name: "PATCH /review writes audit fields without altering clinical data"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call PATCH /analytics/mission-control/episodes/{id}/review with body {reviewed_by: 'test@nhs.net', audit_notes: 'OK', audit_flag: false}"
          expected_result: "Cypher SET clause includes reviewed_by, reviewed_at, audit_notes, audit_flag and nothing else"
        - step_number: 2
          action: "Verify Cypher SET does not include cancer_type, status, condition_type, or any SNOMED fields"
          expected_result: "No clinical fields modified"
      verification_method: "automated"
      acceptance_criteria:
        - "SET clause in PATCH /review Cypher contains only audit tracking fields"
        - "No clinical coding fields appear in SET clause"

    - case_id: "VT-091-TC-008"
      case_name: "Unauthenticated PATCH /review returns HTTP 401"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call PATCH /analytics/mission-control/episodes/{id}/review without a valid session credential"
          expected_result: "HTTP 401 Unauthorized returned"
      verification_method: "automated"
      acceptance_criteria:
        - "HTTP status code 401 returned for unauthenticated PATCH /review"

    - case_id: "VT-091-TC-009"
      case_name: "confirmed_cancer KPI excludes letter_inferred_benign episodes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect the Cypher string returned by _kpis_cypher for the confirmed_cancer CASE expression"
          expected_result: "The confirmed_cancer CASE includes coalesce(ep.letter_inferred_benign, false) = false, matching the audit summary definition"
        - step_number: 2
          action: "Verify the letter_inferred_benign guard is present alongside ep.status = 'completed' in the confirmed_cancer CASE"
          expected_result: "Both conditions are present; benign-letter closures will not be counted as confirmed cancer"
      verification_method: "automated"
      acceptance_criteria:
        - "Cypher contains 'letter_inferred_benign' in confirmed_cancer CASE expression"
        - "Cypher contains coalesce(ep.letter_inferred_benign, false) = false"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-091/"
    retention_period: "7 years"
    immutability: true

