# -- VT-LEO-AI-032 -- FHIR Measure Evaluation
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-032"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-032"]
    risks: []
    user_needs: ["UN-LEO-AI-022"]

  metadata:
    title: "FHIR Measure Evaluation"
    description: >
      Verifies that the FHIR Measure evaluation engine produces correct
      MeasureReport outputs, stratification breakdowns, and passes FHIR R4
      validation.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_measure_evaluate.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "FHIR API service running"
      - "Neo4j seeded with test patient data"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-032-TC-001"
      case_name: "MeasureReport matches manual calculation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Evaluate a test Measure with known data and compare output to manual calculation"
          expected_result: "Numerator, denominator, and score match expected values"
          verification_method: "Assert numeric equality"
      acceptance_criteria:
        - "Evaluation engine produces accurate results"

    - case_id: "VT-032-TC-002"
      case_name: "Stratification produces correct breakdowns"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Evaluate a stratified Measure and inspect breakdowns"
          expected_result: "Each stratum has correct count and percentage"
          verification_method: "Assert per-stratum values"
      acceptance_criteria:
        - "Stratification dimensions are accurate"

    - case_id: "VT-032-TC-003"
      case_name: "Generated MeasureReport passes FHIR R4 validation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Validate generated MeasureReport against FHIR R4 schema"
          expected_result: "No validation errors"
          verification_method: "FHIR validator"
      acceptance_criteria:
        - "Output is a valid FHIR R4 MeasureReport"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-032/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-032-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 3
      cases_passed: 3
      cases_failed: 0
      duration_seconds: 2
      notes: "All 3 test cases passed (pytest VT-LEO-AI-032)"
