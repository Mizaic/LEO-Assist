# -- VT-LEO-AI-030 -- Encryption and TLS Configuration
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-030"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-030"]
    risks: ["R-LEO-AI-010", "R-LEO-AI-020"]
    user_needs: ["UN-LEO-AI-021"]

  metadata:
    title: "Encryption and TLS Configuration"
    description: >
      Verifies that all service endpoints use TLS 1.2+, storage uses AES-256
      encryption at rest, and Key Vault integration retrieves secrets
      successfully.
    test_level: "system"
    test_type: "security"
    safety_class: "B"
    automation_status: "semi-automated"
    test_file_paths:
      - "tests/test_tls_config.py"

  test_environment:
    environment_type: "staging"
    prerequisites:
      - "Azure environment deployed with Key Vault"
      - "TLS certificates provisioned"
      - "Network access to all service endpoints"
    test_data:
      data_type: "configuration"
      cleanup_required: false

  test_cases:
    - case_id: "VT-030-TC-001"
      case_name: "TLS 1.2+ on all service endpoints"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run TLS scanner against all service endpoints"
          expected_result: "All endpoints accept TLS 1.2+ only; TLS 1.0/1.1 rejected"
          verification_method: "SSL/TLS scan report"
      acceptance_criteria:
        - "No endpoints accept TLS versions below 1.2"

    - case_id: "VT-030-TC-002"
      case_name: "AES-256 encryption at rest on all storage"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect Azure storage and database encryption configuration"
          expected_result: "AES-256 encryption enabled on all data stores"
          verification_method: "Azure portal / CLI inspection"
      acceptance_criteria:
        - "All data at rest is encrypted with AES-256"

    - case_id: "VT-030-TC-003"
      case_name: "Key Vault integration retrieves secrets"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Invoke Key Vault loader and verify secrets are retrieved"
          expected_result: "All required secrets loaded without error"
          verification_method: "Application startup log inspection"
      acceptance_criteria:
        - "No plaintext secrets in application configuration"

  pass_fail_criteria:
    pass_threshold: "100% critical"
    blocking_on_failure: true

  evidence:
    evidence_types: ["inspection_report", "scan_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-030/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-030-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 7
      cases_passed: 7
      cases_failed: 0
      duration_seconds: 2
      notes: "All 7 test cases passed (pytest VT-LEO-AI-030)"
