# -- VT-LEO-AI-072 -- Automated Audit Execution Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-072"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-072"]
    risks: ["R-LEO-AI-047"]

  metadata:
    title: "Loop 1 Automated Audit Execution Verification"
    description: >
      Verifies the immutability guard, deterministic run_id scheme,
      AuditRun/DriftMetric schema, per-domain pct_clean breakdown,
      per-run cost cap enforcement, and SQLite crash-resume behaviour.
      Safety-critical: immutable audit records are required quality evidence
      under ISO 13485. A broken immutability guard could allow falsification
      of audit evidence.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_audit_execution.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Mock Neo4j client available"
      - "Mock AWS Bedrock client available"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-072-TC-001"
      case_name: "Scheduled run produces deterministic run_id in audit-YYYY-WNN format"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _compute_run_id(triggered_by='schedule') on a known date"
          expected_result: "Returns 'audit-2026-W14' (or correct ISO week for the date)"
          verification_method: "automated"
      acceptance_criteria:
        - "run_id matches ISO week pattern for all test dates"
        - "Same date always produces the same run_id"

    - case_id: "VT-072-TC-002"
      case_name: "Manual run produces UUID run_id"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call _compute_run_id(triggered_by='manual')"
          expected_result: "Returns a valid UUID string"
          verification_method: "automated"
      acceptance_criteria:
        - "run_id is a valid UUID"
        - "Each call produces a different UUID"

    - case_id: "VT-072-TC-003"
      case_name: "Immutability guard: completed AuditRun cannot be overwritten"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock Neo4j: existing AuditRun with status='complete' for run_id 'audit-2026-W14'"
          expected_result: "_immutability_guard creates new node with run_id 'audit-2026-W14-retry-1'"
          verification_method: "automated"
      acceptance_criteria:
        - "No MERGE or SET is applied to the completed node"
        - "Retry node has suffixed run_id: audit-2026-W14-retry-1"

    - case_id: "VT-072-TC-004"
      case_name: "DriftMetric populated with per-domain pct_clean breakdown"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Provide audit results with encounters from 3 domains"
          expected_result: "DriftMetric.pct_clean_by_domain contains keys for each domain with float values"
          verification_method: "automated"
      acceptance_criteria:
        - "pct_clean_by_domain is valid JSON with domain keys"
        - "Each domain value is a float between 0.0 and 100.0"
        - "metric_type is set to 'audit'"

    - case_id: "VT-072-TC-005"
      case_name: "Cost cap fires SafetyNetAlert when estimated cost_usd > 100"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Set mock token count to produce cost_usd = 105"
          expected_result: "Run pauses; SafetyNetAlert created with alert_type='cost_cap_exceeded'"
          verification_method: "automated"
      acceptance_criteria:
        - "SafetyNetAlert created with correct alert_type"
        - "Run status set to 'paused' not 'failed'"

    - case_id: "VT-072-TC-006"
      case_name: "auditor_model_version recorded on AuditRun"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run audit with mock LLM client returning model_id='claude-sonnet-4-20250514'"
          expected_result: "AuditRun.auditor_model_version = 'claude-sonnet-4-20250514'"
          verification_method: "automated"
      acceptance_criteria:
        - "auditor_model_version matches LLM client model_id exactly"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-072/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
