  specification:
    title: "Pathway probe surface decomposition + ESLint guard (Phase 6b-vi)"
    description: |
      Splits the legacy PortEdge.tsx (1781 LOC) and probeStrategies.tsx
      (1048 LOC) into focused, side-effect-free modules under
      PortEdge/ and probes/ subdirectories so every file lives within
      the project's 500 LOC hard limit. Removes four dead panel/*
      files that no UI route still imports. Adds a no-restricted-imports
      ESLint rule scoped to services/ui/src/components/pathway/** that
      warns on raw @mui/* imports, steering future authors toward
      @leo/design-system primitives.
    acceptance_criteria:
      - criterion: "Every PortEdge/* and probes/* module is at most 500 LOC"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-167 TC-001 reads each file via fs and asserts line count <= 500"
      - criterion: "Dead panel files are removed from the tree"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-167 TC-002 asserts InputsTab.tsx, OverviewTab.tsx, ReviewTab.tsx, TriggerContextPanel.tsx are absent"
      - criterion: "ESLint guard for pathway/** @mui imports is registered"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-167 TC-003 reads eslint.config.mjs and asserts the no-restricted-imports rule scoped to pathway/**"
      - criterion: "Existing probe popover behaviour is preserved"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-158 still passes (49 pathway-canvas jest cases) plus pathway-editor.spec.ts smoke + axe baseline"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/edges/PortEdge.tsx"
        description: "Thin barrel re-exporting PortEdge from PortEdge/index.tsx"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/edges/PortEdge/"
        description: "Directory of focused modules: utils, diff, TreeNode, SemanticSection, ProbeInspectorDrawer, ProbeMonitor, ProbeMonitorBanners, ProbeMonitorChanges, ProbeMonitorData, ProbeMonitorValidate, index"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/edges/probes/"
        description: "Per-domain probe strategy modules: _shared, extraction, verification, persist, connectors, guidance"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/eslint.config.mjs"
        description: "Adds no-restricted-imports rule for pathway/** that flags direct @mui/* imports"
        storage_location: "git"
      - artifact_type: "test"
