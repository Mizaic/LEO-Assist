  specification:
    title: "Surface Forms Management Router — Terminology API"
    description: |
      New FastAPI router implementing CRUD management of SurfaceForm nodes
      in the Knowledge Graph.  Registered at prefix /terminology in the
      terminology API (port 8001).

      Endpoints implemented:

        GET  /terminology/surface-forms
             Paginated flat list of surface forms with MAPS_TO concept data.
             Query params: q (text filter), concept_id (filter by concept),
             limit (1–200, default 50), offset.
             Returns: {items, total, offset, limit}

        GET  /terminology/surface-forms/grouped
             Surface forms grouped by SNOMED concept with pagination.
             Includes concept_fsn, semantic_tag, read_code, icd10, and
             surface_forms[] array per concept.
             Query params: q (searches form text, concept name, SNOMED ID,
             Read code), limit, offset.

        GET  /terminology/surface-forms/duplicates
             Returns all SurfaceForm nodes with more than one MAPS_TO
             relationship, with per-mapping concept_id, concept_fsn,
             confidence, and provenance.  Capped at 200 rows.

        POST /terminology/surface-forms/deduplicate
             Removes duplicate MAPS_TO relationships, retaining the
             highest-confidence mapping per surface form.
             Returns: {duplicates_removed: int}

        POST /terminology/surface-forms/upsert-mapping
             Creates or updates a SurfaceForm → Concept mapping.
             Body: {normalized, form, concept_id, confidence, source,
                    provenance, created_by}
             Returns: {normalized, form, concept_id, concept_fsn}
             404 if concept_id not found.

        DELETE /terminology/surface-forms/{normalized}
             Three behaviours governed by query params:
             • No params        → DETACH DELETE the SurfaceForm node.
             • ?concept_id=X    → DELETE only the MAPS_TO rel to concept X.
             • ?keep_concept_id=X → DELETE all MAPS_TO rels except to X.
             Uses {normalized:path} path converter to support spaces/slashes.

      Cypher queries added to terminology.py:
        LIST_SURFACE_FORMS, COUNT_SURFACE_FORMS,
        GROUPED_SURFACE_FORMS, COUNT_GROUPED_SURFACE_FORMS,
        DELETE_SURFACE_FORM, DELETE_SURFACE_FORM_MAPPING,
        KEEP_SURFACE_FORM_MAPPING, UPSERT_SURFACE_FORM_MAPPING,
        DEDUPLICATE_SURFACE_FORM_RELS, AUDIT_SURFACE_FORM_DUPLICATES

    acceptance_criteria:
