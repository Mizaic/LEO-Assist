# -- UN-LEO-AI-072 -- Pathway editor must be safe and predictable to use
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-072"
  title: "When I edit a pathway in LEO it must be obvious whether my work is saved, every action must look the same on every step, and destructive moves must require a deliberate confirmation"
  description: |
    Today the pathway editor (services/ui/src/app/admin/pathways/[id])
    is a 5,960-LOC monolith with three quietly dangerous behaviours:

      1. Two competing save mechanisms (per-keystroke effect AND
         wizard "Next" -> full save) that make it unclear when work
         is persisted to Neo4j;
      2. Inconsistent node interactions (some single-click to
         configure, some double-click) and inconsistent visual
         status (one node lights up red on error, another lights up
         orange) that lead reviewers to misread which step halted;
      3. A silent failure on plan load (`api.get(...).catch(() =>
         {})`) that leaves the user staring at a blank canvas with
         no message - they think the pathway is empty and start
         rebuilding it.

    The user need is that the editor MUST behave like a clinical
    safety surface: clear save state at all times, identical chrome
    on every step, identical interaction model on every node, type-
    the-name confirm on permanent deletes, and visible failures so
    nobody silently overwrites a working pathway.

  stakeholder: "QA / RA lead, platform admin, clinical informatician (pipeline builder)"

  priority: "high"

  rationale: >
    A coding pathway is a clinical safety control - it decides which
    extractor and verifier run, when human review is required, and
    where halt-on-error gates fire. If the builder cannot tell
    whether their work is saved or whether they just deleted a
    live-in-use pathway, they will either lose work or break runtime
    coding for every encounter that depends on the pathway. ISO
    14971 puts both of these in the "use error -> patient harm"
    category for SaMD that gates clinical decisions.

  acceptance_criteria:
    - "The pathway editor has a single, explicit save action - per-keystroke autosave is gone"
    - "Every node uses the same configure interaction (single click selects + opens side panel; double click reserved for fitToNode)"
    - "Every node renders status (idle / running / passed / halted / error) using one shared component with one colour vocabulary"
    - "Permanent deletes (pathway, node, edge connection) require a deliberate confirm; pathway delete uses type-the-name gate"
    - "Plan load failures are surfaced to the user (alert + retry), never swallowed"
    - "The orchestrator file is below 500 LOC and every chrome element is owned by a sibling module"
    - "Knowledge tab parity: the pathway editor uses the same primitives, density, and motion language as the rest of @leo/design-system"

  design_inputs:
    - "DI-LEO-AI-156"
    - "DI-LEO-AI-157"
    - "DI-LEO-AI-168"

