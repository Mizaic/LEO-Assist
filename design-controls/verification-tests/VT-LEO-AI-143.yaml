# -- VT-LEO-AI-143 -- first_seen milestone detection and episode wiring
# IEC 62304 Verification Protocol

- id: "VT-LEO-AI-143"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-145"]
    risks: ["R-LEO-AI-096"]

  metadata:
    title: "first_seen milestone: regex, classification, claiming, and d-0 referral"
    description: >
      Verifies that _RE_FIRST_SEEN detects fast-track/2WW clinic attendance
      text without conflicting with referral phrases, that
      _classify_text_encounters routes first_seen encounters to the 8th bucket
      and does not put them in the referral bucket, that
      _first_seen_link_anchors correctly claims anchors within the episode
      window, and that MIN_REFERRAL_TO_DIAG_DAYS defaults to 0 to allow
      same-day PRISM-pathway referrals.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_first_seen_milestone.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-143-TC-001"
      case_name: "_RE_FIRST_SEEN matches attendance phrases"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Apply _RE_FIRST_SEEN to 8 known clinic-attendance phrases"
          expected_result: "All 8 match"
          verification_method: "automated"
        - step_number: 2
          action: "Apply _RE_FIRST_SEEN to 6 known GP-side referral phrases"
          expected_result: "None match"
          verification_method: "automated"
      acceptance_criteria:
        - "8/8 attendance phrases match"
        - "0/6 referral phrases match"

    - case_id: "VT-143-TC-002"
      case_name: "first_seen takes priority over generic referral on overlap"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Pass 'Seen in fast track suspected breast cancer clinic' through
            _classify_text_encounters
          expected_result: >
            Encounter appears in first_seen bucket (index 7), NOT in
            referral bucket (index 0)
          verification_method: "automated"
      acceptance_criteria:
        - "Encounter in first_seen bucket"
        - "Encounter NOT in referral bucket"

    - case_id: "VT-143-TC-003"
      case_name: "_classify_text_encounters returns 8-tuple with first_seen bucket"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pass first_seen encounter through _classify_text_encounters"
          expected_result: "len(result) == 8; result[7] contains the encounter"
          verification_method: "automated"
        - step_number: 2
          action: "Pass referral encounter; verify not in first_seen bucket"
          expected_result: "result[7] empty"
          verification_method: "automated"
        - step_number: 3
          action: "Pass PRISM referral; verify not in first_seen bucket"
          expected_result: "result[7] empty"
          verification_method: "automated"
        - step_number: 4
          action: "Pass already-coded encounter ID; verify skipped"
          expected_result: "result[7] empty"
          verification_method: "automated"
      acceptance_criteria:
        - "All 4 sub-cases pass"

    - case_id: "VT-143-TC-004"
      case_name: "_first_seen_link_anchors window claiming"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Anchor within window (between ref_date and end_date+90)"
          expected_result: "claimed; first_date matches anchor date"
          verification_method: "automated"
        - step_number: 2
          action: "Anchor before ref_date"
          expected_result: "not claimed; first_date None"
          verification_method: "automated"
        - step_number: 3
          action: "Anchor on ref_date (d-0)"
          expected_result: "claimed"
          verification_method: "automated"
        - step_number: 4
          action: "Two anchors; verify earliest returned"
          expected_result: "first_date = earliest anchor date"
          verification_method: "automated"
        - step_number: 5
          action: "Empty anchor list"
          expected_result: "([], None)"
          verification_method: "automated"
        - step_number: 6
          action: "No ref_date (None)"
          expected_result: "anchor claimed (any date eligible)"
          verification_method: "automated"
      acceptance_criteria:
        - "All 6 sub-cases pass"

    - case_id: "VT-143-TC-005"
      case_name: "MIN_REFERRAL_TO_DIAG_DAYS defaults to 0"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read cfg.MIN_REFERRAL_TO_DIAG_DAYS without env override"
          expected_result: "== 0"
          verification_method: "automated"
      acceptance_criteria:
        - "cfg.MIN_REFERRAL_TO_DIAG_DAYS == 0"

    - case_id: "VT-143-TC-006"
      case_name: "Referral encounters excluded from diagnosis and benign-closure buckets"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Pass PRISM referral encounter with 'confirmed carcinoma' language
            through _classify_text_encounters
          expected_result: "In referral bucket; NOT in diagnosis bucket"
          verification_method: "automated"
        - step_number: 2
          action: "Pass generic fast-track referral + cancer language"
          expected_result: "In referral bucket; NOT in diagnosis bucket"
          verification_method: "automated"
        - step_number: 3
          action: "Pass PRISM referral + 'no cancer' phrasing"
          expected_result: "NOT in benign-closure bucket"
          verification_method: "automated"
        - step_number: 4
          action: "Pass standalone histology encounter (no referral phrasing)"
          expected_result: "In diagnosis bucket"
          verification_method: "automated"
      acceptance_criteria:
        - "Referral encounters never appear in diagnosis or benign-closure buckets"
        - "Standalone histology encounters still fire as diagnosis"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-143/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-143-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "cursor-agent"
      environment: "development"
      result: "pass"
      cases_passed: 18
      cases_failed: 0
      notes: >
        pytest tests/test_first_seen_milestone.py -- 18 unit tests: TC-001
        (_RE_FIRST_SEEN corpus), TC-002 (priority-over-generic-referral),
        TC-003 (8-tuple bucket routing), TC-004 (_first_seen_link_anchors
        window claiming, 6 sub-cases), TC-005 (MIN_REFERRAL_TO_DIAG_DAYS=0),
        TC-006 (referral encounters excluded from diagnosis and benign-closure
        buckets -- 4 sub-cases covering PRISM, generic referral, benign guard,
        and standalone histology passthrough).  All 18 passed.
