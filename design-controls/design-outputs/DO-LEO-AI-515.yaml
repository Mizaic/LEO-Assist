      - criterion: "Host wiring composes filters in correct order"
        type: "functional"
        measurement: "Static-source"
        target: "EncounterMissionControl applies brush filter to filteredRows BEFORE pagination, alongside bucket filter"
      - criterion: "Active preview drives row highlight + active ring"
        type: "functional"
        measurement: "Static-source"
        target: "highlightedEncounterId and timeline.activeEncounterId both fed from activePreview.encounter_id"
      - criterion: "Tiny result sets hide the panel"
        type: "functional"
        measurement: "Static-source"
        target: "Wrapper returns null when fewer than 5 dated rows are loaded"

