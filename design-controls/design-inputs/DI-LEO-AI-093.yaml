# -- DI-LEO-AI-093 -- Spinal-TNM Context Disambiguation Guard
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-093"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The system SHALL suppress extracted entities whose surface-form text matches a
    standalone TNM staging component pattern (T0-T4, N0-N3, M0-M1, optionally
    prefixed with c/p/y/r) when the sentence context contains spinal anatomical or
    manual-therapy markers (including but not limited to: facet, vertebra(e), disc,
    nags, snags, spinal, spine, radiculopathy, dermatome, myelopathy, spondyl*,
    foraminal, physiother*, osteopath*, chiropr*, mobilisa* in spinal context) and
    no full TNM triplet (all three components T+N+M) is present in the same sentence.
    Additionally, the LLM extraction system prompt SHALL include an explicit
    negative extraction rule instructing the model not to label isolated vertebral
    level tokens as staging scale or observable entity in a spinal context.
  rationale: >
    Vertebral level notation (C3, T4, L5, etc.) uses the same alphanumeric pattern
    as TNM cancer staging components. Without explicit disambiguation rules in both
    the LLM prompt and the post-processing pipeline, spinal physiotherapy and
    musculoskeletal encounter text is incorrectly resolved to cancer staging SNOMED
    concepts (e.g. 78873005 T category). This creates false-positive staging
    observations on patient records, corrupts cancer audit analytics, and may lead
    clinical quality teams to incorrect quality-improvement decisions.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          reclassify_assertion() returns SUPPRESSED for a staging scale or observable
          entity entity with text matching a standalone TNM component (e.g. 'T4') when
          the sentence contains spinal context markers and no full TNM triplet.
      - type: "functional"
        spec: >
          reclassify_assertion() returns None (no suppression) for a staging scale
          entity extracted from a sentence containing an explicit oncological context
          even when a spinal marker is also present.
      - type: "functional"
        spec: >
          reclassify_assertion() returns None (no suppression) for a staging scale
          entity whose sentence contains a full TNM triplet (T2N1M0) alongside spinal
          text -- the full triplet overrides the spinal guard.
      - type: "functional"
        spec: >
          Non-TNM entities (disorders, substances, procedures) in spinal context are
          not suppressed by the spinal guard.
      - type: "safety"
        spec: >
          The spinal guard only fires when entity_assertion is 'present' or '' --
          it must not affect already-reclassified assertions (absent, hypothetical, etc.)
    constraints:
      - type: "safety"
        spec: >
          Guard must not suppress valid TNM staging entities: a full TNM triplet in
          the sentence (e.g. T2N1M0) prevents suppression regardless of spinal markers.
      - type: "safety"
        spec: >
          Guard applies only to semantic tags 'staging scale', 'staging_scale',
          'observable entity', 'observable_entity' -- it must not widen to disorder
          or procedure tags.
    dependencies: ["DI-LEO-AI-005"]
    downstream_impacts:
      - "libs/ner/scope_guard.py (Layer 3 of unified post-processing stack)"
      - "libs/prompts/extraction_v1.py (LLM system prompt)"
      - "Terminology resolver -- spinal T-category surface-form mappings suppressed before resolution"

  technical_details:
    language: "Python"
    framework: "libs/ner, libs/prompts"
    file_structure:
      - "libs/ner/scope_guard.py"
      - "libs/prompts/extraction_v1.py"
    estimated_loc: 40

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-093 all 7 test cases pass: spinal sentence suppressed for T4 and N2,
      full triplet exemption, oncology context exemption, non-staging tag not
      suppressed, absent-assertion not affected, facet-area real-world case.
    test_protocol: "VT-LEO-AI-093"

  safety_class: "B"
  risks: ["R-LEO-AI-066"]
  tags: ["tnm", "staging", "scope-guard", "spinal", "nlp-extraction"]
