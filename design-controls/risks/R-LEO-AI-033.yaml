# -- R-LEO-AI-033 -- Operation Beyond Intended Purpose: Treatment Recommendations and Safety-Netting Advice
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-033"
  title: "Pipeline codes treatment recommendations or safety-netting advice as present clinical findings"

  hazard:
    description: >
      The LLM extraction step assigns assertion "present" to entities
      extracted from treatment recommendation text (e.g. "consider starting
      metformin"), safety-netting instructions (e.g. "if develops chest pain,
      call 999"), or hedged diagnostic language (e.g. "consistent with
      migraine"). These entities then bypass the tier classifier's
      hypothetical/possible gates and may auto-code in autonomous mode.
    category: "software_defect"

  hazardous_situation: >
    A clinical encounter contains treatment plans, safety-netting advice, or
    speculative diagnostic statements. The LLM extracts entities from these
    sentences with assertion "present" rather than "hypothetical" or
    "possible". In autonomous mode, these entities pass the tier classifier's
    Tier 1/2 gates and are persisted to the patient graph as confirmed clinical
    findings. In HITL mode, they appear as coding suggestions that waste
    reviewer time and erode trust.

  harm:
    description: >
      (a) A planned medication is coded as actively prescribed, creating a
          medication safety risk if the patient has not actually started it.
      (b) Safety-netting symptoms are coded as present findings, creating
          false positive diagnoses in the patient record.
      (c) A speculative diagnosis is coded as confirmed, influencing care
          decisions and quality measures.
      (d) The system crosses from retrospective coding tool into treatment
          recommendation territory, pushing the product into a higher-risk
          SaMD classification.
    severity: "serious"

  initial_risk_estimate:
    severity: 4
    probability: 3
    detectability: 3
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "inherent_safety"
      description: >
        Extraction prompt "Intended Use Boundaries" section explicitly forbids
        the LLM from making diagnoses, recommending treatment, interpreting
        results, or generating safety advice. Planned actions must use
        assertion "hypothetical".
      implemented_by: ["DI-LEO-AI-048"]
      verified_by: ["VT-LEO-AI-040"]
      effectiveness: "effective"

    - control_type: "protective_measure"
      description: >
        Scope guard (libs/ner/scope_guard.py): deterministic post-extraction
        filter operating on sentence-windowed context that detects safety-netting
        sentences, treatment recommendation language, and hedged diagnostic
        language. Recommendation regex narrowed to exclude ambiguous UK GP
        phrases ("will start", "to start"). Confirmed-diagnosis regex expanded
        to recognise "known X", "suffers from", "on treatment for", "managed
        for", "presents with". Reclassifies entity assertions from "present"
        to "hypothetical" or "possible" as appropriate.
      implemented_by: ["DI-LEO-AI-048"]
      verified_by: ["VT-LEO-AI-040"]
      effectiveness: "highly_effective"

    - control_type: "protective_measure"
      description: >
        Tier classifier blocks hypothetical/possible assertions from Tier 1
        auto-coding. Entities reclassified by the scope guard will not be
        auto-coded in autonomous mode and will route to human review in
        HITL mode.
      implemented_by: ["DI-LEO-AI-040"]
      verified_by: ["VT-LEO-AI-025"]
      effectiveness: "highly_effective"

    - control_type: "protective_measure"
      description: >
        MedSpaCy ConText engine runs after the scope guard and may further
        tighten assertions (e.g. from "present" to "hypothetical" for
        planned procedures), providing an independent second layer of
        assertion detection.
      implemented_by: ["DI-LEO-AI-035"]
      verified_by: []
      effectiveness: "effective"

    - control_type: "protective_measure"
      description: >
        Unified post-processing pipeline: the scope guard and all 9
        post-processing layers are applied identically to both training
        data and runtime data via a single shared module
        (libs/pipeline/post_processing.py), ensuring that training-time
        assertion corrections are consistently reproduced at inference
        time and preventing train/serve skew.
      implemented_by: ["DI-LEO-AI-050"]
      verified_by: ["VT-LEO-AI-050"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 1
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Four layered controls reduce probability to improbable: the prompt
      "Intended Use Boundaries" section prevents the LLM from generating
      recommendation/safety-netting entities with "present" assertion; the
      deterministic scope guard catches any that slip through and reclassifies
      them; the tier classifier blocks hypothetical/possible from auto-coding;
      and ConText provides independent assertion detection. All four would need
      to fail simultaneously for a treatment recommendation or safety-netting
      symptom to be auto-coded as a confirmed present finding.

  monitoring:
    monitoring_plan: >
      Track scope guard reclassification counts per pipeline run. Monitor for
      entities with assertion "present" from sentences containing
      recommendation or safety-netting language that bypass the guard.
    metrics:
      - "Scope guard reclassification rate per pipeline run (baseline TBD)"
      - "Safety-netting entities coded as 'present' (target: 0)"
      - "Treatment recommendation entities auto-coded (target: 0)"
    review_frequency: "Weekly during initial deployment, then monthly"

  metadata:
    identified_by: "Clinical Safety Review"
    identified_date: "2026-03-03"
    status: "analyzed"

  related_risks: ["R-LEO-AI-029"]
  related_risk_rationale: >
    Both risks involve the system operating beyond its intended purpose as a
    retrospective coding tool. R-LEO-AI-029 covers diagnostic inference from
    lab values; this risk covers treatment recommendations, safety-netting
    advice, and hedged diagnostic language.

  tags:
    - "clinical-risk"
    - "intended-use-enforcement"
    - "treatment-recommendation"
    - "safety-netting"
    - "hedged-diagnosis"
    - "regulatory-classification"
    - "safety-critical"
