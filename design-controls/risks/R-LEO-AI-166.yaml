# -- R-LEO-AI-166 -- Silent regression in appropriateness ruleset after edit or rebuild
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-166"
  title: "A rule edit, guideline redeploy or scheduled bitmap rebuild silently changes which patients trigger which appropriateness rules, so a clinically required recommendation is no longer raised"

  hazard:
    description: >
      The roaring-bitmap appropriateness engine compiles every active
      AppropriatenessRule into a versioned ruleset and evaluates
      patients by intersecting concept-id bitmaps. A reviewer-initiated
      rule edit, a guideline redeploy or a scheduled rebuild can change
      which patients now match which rules without any human signing
      off on the change in clinical behaviour.
    category: "clinical_safety"

  hazardous_situation: >
    A reviewer changes the logic tree on an appropriateness rule (for
    example tightens an OR-branch concept set), or operations rebuilds
    the ruleset against a refreshed SNOMED snapshot. The new ruleset
    compiles cleanly and ships. A patient who previously triggered a
    "2-week wait" appropriateness recommendation no longer does, but
    nobody notices because there is no replay against a stable cohort
    -- the safety-net dashboard simply stops listing that patient.

  harm:
    description: >
      A clinically required appropriateness recommendation is not
      raised on a patient who would previously have received it,
      delaying onward referral or investigation. Worst-case clinical
      outcome is delayed cancer pathway entry.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Reviewer-confirmed test patients persist as :TestPatient nodes
        FIXTURE_FOR-linked to their guideline and carry an
        EXPECTED_RESULT snapshot per asserted rule (fires +
        matched_branch_node_ids + ruleset_version + snapshot_by). A
        blake2b content_hash dedups accidental duplicates so the
        regression cohort stays stable across edits.
      implemented_by: ["DI-LEO-AI-165"]
      verified_by: ["VT-LEO-AI-164"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Synthetic happy / fail / branch / boundary patients are
        generated directly from the rule's logic tree so a brand-new
        guideline is regression-tested on day one without manual
        seeding. Generator output is gated behind a reviewer dry-run
        before any EXPECTED_RESULT snapshot is captured.
      implemented_by: ["DI-LEO-AI-166"]
      verified_by: ["VT-LEO-AI-165"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Successful guideline compiles in the terminology service POST
        to /guidance/test-patients/replay so every saved patient is
        replayed against the new ruleset_version, the diff is
        persisted as a :RulesetReplay node and a regression banner
        appears on the Clinical Guidelines page before reviewers
        roll out the new ruleset. EditRuleDialog re-runs a
        rule-scoped replay on every logic-tree change so unaware
        edits cannot ship.
      implemented_by: ["DI-LEO-AI-167"]
      verified_by: ["VT-LEO-AI-166"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With per-rule, per-guideline and global test patient cohorts
      replayed automatically on every compile and on every edit, a
      regression that affects an asserted rule cannot ship without a
      visible banner. The residual risk is dominated by the
      completeness of the cohort (a regression in a rule with no
      asserted test patient remains undetected) rather than by the
      detection mechanism. Auto-generated proposals at scope all keep
      coverage from drifting as new guidelines land.

  monitoring:
    monitoring_plan: >
      Weekly review of :RulesetReplay entries by the QA / RA lead.
      Track the number of guidelines with zero asserted test patients
      and the median regressions_count per compile. If a new guideline
      lands without coverage, run the generator at scope guideline
      and prompt the clinical owner to review the proposed cohort.
    metrics:
      - "Count of guidelines with zero saved test patients"
      - "Median regressions_count per :RulesetReplay over rolling 7 days"
      - "Count of compiles where _trigger_test_patient_replay failed at WARNING"
    review_frequency: "Weekly"

  metadata:
    identified_by: "Rob Smith - 2026-04-17 EditRuleDialog usability + bitmap deployment review"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "appropriateness-rules"
      - "regression-testing"
      - "bitmap-engine"
      - "clinical-safety"
