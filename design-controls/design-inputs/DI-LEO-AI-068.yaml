# -- DI-LEO-AI-068 -- Per-Tenant Billing, Margin Configuration, and Discount Management
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-068"
  type: "Functional"
  derived_from: ["UN-LEO-AI-029"]
  requirement: >
    The system SHALL provide an admin-only billing and pricing subsystem that:
    (a) Stores a global PricingConfig node (singleton, id='default') in the Knowledge
        Graph with target_margin (float 0.0–0.99), updated_by, and updated_at fields.
        The default target margin SHALL be 0.75 (75% gross margin).
    (b) Exposes GET /pricing/config (returns margin, updated_by, updated_at) and
        PUT /pricing/config (updates margin) endpoints, both returning 403 for
        callers without the 'admin' permission.
    (c) Stores OrgDiscount nodes in the Knowledge Graph with fields: discount_id (UUID),
        org_id, description, rate (0.0–1.0), type ('promo' | 'contract'), valid_from
        (datetime), valid_to (datetime or null for perpetual), is_active (bool),
        created_by, created_at, updated_at.
    (d) Exposes GET /pricing/orgs that queries the Patient Graph for per-organisation
        AuditEvent spend (type='PipelineRun', llm_input_tokens IS NOT NULL), then
        joins with Knowledge Graph pricing data to return per-tenant: raw_cost_usd,
        list_price_usd, discount_rate, billable_usd, gross_margin, active_discounts.
        Pricing formula: list_price = raw_cost / (1 - target_margin);
        billable = list_price × (1 - min(Σ active_discount_rates, 1.0)).
    (e) Exposes GET /pricing/orgs/{org_id}/discounts, POST /pricing/orgs/{org_id}/discounts,
        and DELETE /pricing/discounts/{discount_id}?permanent=bool endpoints.
        DELETE with permanent=false deactivates (sets is_active=false).
        DELETE with permanent=true hard-deletes the node.
    (f) Exposes GET /pricing/platform-spend that returns AuditEvents not linked to
        any patient (patient_id IS NULL or ''), covering TrainingRun, VerificationRun,
        and GoldDatasetRun event types, clearly labelled as non-tenant-billable.
    (g) All six endpoints SHALL return HTTP 403 for callers without the 'admin'
        permission in their CallerScope.
    (h) The admin billing UI page at /admin/billing SHALL display: global margin slider
        with quick-pick presets, summary tiles (total AI cost, total billable, gross
        profit), per-tenant expandable table with colour-coded margin column
        (green ≥ target − 2pp, amber ≥ target − 10pp, red below), per-tenant
        discount management (add, deactivate, delete), and a platform operating
        costs section.
    (i) The Dashboard LLMSpendPanel SHALL display a "View all tenants →" link
        that navigates to /admin/billing, visible only to users with 'admin' permission.

  rationale: >
    As the platform scales to multiple NHS tenant organisations, manual cost attribution
    from aggregate logs is commercially unsustainable. A configurable margin model
    with per-tenant discounts enables accurate invoicing and commercial flexibility
    without code deployments. Admin-only gating ensures commercial margin data
    remains confidential from tenant users.

  machine_spec:
    agent_prompt: |
      Implement per-tenant billing subsystem.
    acceptance_criteria:
      - type: "test"
        spec: "GET /pricing/config returns 403 for non-admin callers"
      - type: "test"
        spec: "PUT /pricing/config updates target_margin and returns 200"
      - type: "test"
        spec: "GET /pricing/orgs returns 403 for non-admin callers"
      - type: "test"
        spec: "GET /pricing/orgs returns per-tenant spend with correct list_price = raw_cost / (1 - margin)"
      - type: "test"
        spec: "GET /pricing/orgs applies active discounts: billable = list_price × (1 - discount_rate)"
      - type: "test"
        spec: "GET /pricing/orgs caps combined discount at 100% (billable never negative)"
      - type: "test"
        spec: "POST /pricing/orgs/{org_id}/discounts creates OrgDiscount node and returns 201"
      - type: "test"
        spec: "DELETE /pricing/discounts/{id} with permanent=false sets is_active=false"
      - type: "test"
        spec: "DELETE /pricing/discounts/{id} with permanent=true removes node from graph"
      - type: "test"
        spec: "GET /pricing/platform-spend returns only events with patient_id IS NULL"
      - type: "test"
        spec: "Expired discounts (valid_to in the past) are excluded from active discount calculation"
      - type: "test"
        spec: "Perpetual discounts (valid_to IS NULL) are included indefinitely"
      - type: "review"
        spec: "Margin slider in UI reflects stored value on page load"
      - type: "review"
        spec: "Admin-only Billing nav item does not render for non-admin users"

    constraints:
      - type: "security"
        spec: "All /pricing/* endpoints return HTTP 403 for callers without 'admin' permission"
      - type: "security"
        spec: "Target margin and discount rates are never returned by any non-admin endpoint"
      - type: "data-integrity"
        spec: "discount_rate is validated 0.0 ≤ rate ≤ 1.0; total applied discount is capped at 1.0"
      - type: "data-integrity"
        spec: "target_margin is validated 0.0 ≤ margin < 1.0"
      - type: "audit"
        spec: "All discount create/delete actions are logged with created_by (email) and timestamp"

    dependencies: []
    downstream_impacts:
      - "Commercial: enables accurate per-tenant invoicing"
      - "Finance: provides gross profit visibility per tenant"

    technical_details:
      language: "Python / TypeScript"
      framework: "FastAPI / Next.js / MUI"
      libraries: ["neo4j", "fastapi", "pydantic", "@mui/material"]
      file_structure:
        - "libs/cypher/pricing_queries.py"
        - "services/api/app/routers/pricing.py"
        - "services/api/app/main.py"
        - "services/ui/src/proxy.ts"
        - "services/ui/src/app/admin/billing/page.tsx"
        - "services/ui/src/components/dashboard/LLMSpendPanel.tsx"
        - "services/ui/src/components/AppShell.tsx"
        - "services/api/tests/test_pricing_router.py"
      estimated_loc: 600

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All pytest tests in test_pricing_router.py pass.
      Admin-only access and pricing formula verified by automated tests.
      UI margin slider and tenant table verified by manual review.
    test_protocol: "VT-LEO-AI-068"

  safety_class: "A"
  risks: ["R-LEO-AI-045"]
  tags: ["billing", "pricing", "margin", "discounts", "admin-only", "per-tenant"]
