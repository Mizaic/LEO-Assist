# -- DI-LEO-AI-188 -- SBAR queue contract
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-188"
  type: "Interface"
  derived_from:
    - "UN-LEO-AI-080"
  requirement: >
    The pipeline-jobs queue SHALL accept an `sbar_requested` message
    that carries (a) the patient id, (b) zero-or-more situation
    artefacts (Patient context node id / ReferralRequest id /
    ProcedureRequest id / fixed text), (c) zero-or-more background
    source references (Encounter / DocumentReference / Chunk), and
    (d) optional clinical-guideline ids. The contract is enforced by
    a single Pydantic model so every producer (UI playground, future
    referral-writer, encounter-hook) gets identical validation.
  rationale: >
    A typed contract for the trigger message is the simplest way to
    keep producers consistent without coupling them to the
    orchestrator. It also gives us a single place to evolve the
    payload (new artefact types, new background sources) without
    risking silent producer drift.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs.sbar.events.SBARRequestPayload validates a payload
          with at least patient_id, run_id, and an event_type literal
          of 'sbar_requested'.
      - type: "functional"
        spec: >
          SBARArtifactRef enforces 'fixed_text' artefacts must carry
          text and other artefact types must carry id.
      - type: "functional"
        spec: >
          BackgroundSourceType is restricted to the enum
          {encounter, document_reference, chunk}.
      - type: "functional"
        spec: >
          The payload round-trips through Pydantic's model_dump(mode="json")
          producing a JSON-encodable body suitable for the pipeline-jobs
          queue.
    constraints:
      - type: "safety"
        spec: >
          Free-text fields (e.g. fixed_text artefact text) MUST be
          treated as untrusted input by downstream prompts -- this DI
          owns only the schema and validation, not the prompt-injection
          defence (see DI-LEO-AI-192).
    dependencies: []
    downstream_impacts:
      - "Pipeline worker dispatcher (sbar_requested handler)"
      - "SBAR API enqueue endpoint"
      - "UI playground"
    technical_details:
      language: "Python"
      framework: "Pydantic 2"
      file_structure:
        - "libs/sbar/events.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-186 covers minimal-payload validation, the
      type-specific id/text rules, the BackgroundSourceType enum
      gate, and the queue-message round trip.
    test_protocol: "VT-LEO-AI-186"

  safety_class: "B"
  risks:
    - "R-LEO-AI-181"
  tags:
    - "sbar"
    - "queue-contract"
