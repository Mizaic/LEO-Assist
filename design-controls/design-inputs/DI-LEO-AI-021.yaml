# -- DI-LEO-AI-021 -- Service-to-Service Authentication
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-021"
  type: "Security"
  derived_from: ["UN-LEO-AI-013"]
  requirement: "The system SHALL authenticate service-to-service API calls using managed identity tokens, ensuring that internal services cannot be accessed without valid service credentials"
  rationale: "Inter-service communication must be authenticated to prevent unauthorised access to internal APIs. Managed identity avoids the need for shared secrets and integrates with Azure AD."

  machine_spec:
    agent_prompt: |
      Implement service-to-service authentication (~150 LOC).

      SINGLE PURPOSE: Authenticate inter-service API calls using Azure
      managed identity tokens.

      REQUIREMENTS:
      1. Acquire managed identity tokens for outbound service calls
      2. Validate managed identity tokens on inbound service requests
      3. Reject unauthenticated service-to-service calls with 401
      4. Cache tokens until near-expiry to reduce token acquisition overhead
      5. Support local development fallback with service principal credentials
      6. Log all service authentication events for audit

      METHODS:
      - get_service_token(audience): Acquire token for target service
      - validate_service_token(token): Verify inbound service token
      - attach_token(request): Add bearer token to outbound request
      - is_valid_service(claims): Check caller is an allowed service

      CODE CLARITY:
      - Token provider and validator are separate, testable components
      - Allowed service list configurable per environment
      - Clear distinction between user auth and service auth

    acceptance_criteria:
      - type: "test"
        spec: "Service-to-service calls authenticated via managed identity"
      - type: "test"
        spec: "Unauthenticated service calls rejected with 401"
      - type: "test"
        spec: "Token caching reduces redundant token acquisitions"
      - type: "test"
        spec: "Local dev fallback works with service principal"

    constraints:
      - type: "security"
        spec: "No service endpoint accessible without valid managed identity token"
      - type: "security"
        spec: "Service credentials never stored in code or config files"

    dependencies: []

    downstream_impacts:
      - "services/coding_worker -- authenticates calls to terminology API"
      - "services/analysis_worker -- authenticates calls to core API"
      - "services/fhir_api -- authenticates calls to core API"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["azure-identity"]
      file_structure:
        - "libs/service_auth/token_provider.py"
        - "libs/service_auth/validator.py"
      estimated_loc: 150

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Service-to-service calls authenticated via managed identity; unauthenticated calls rejected"
    test_protocol: "VT-LEO-AI-021"

  safety_class: "B"
  risks: ["R-LEO-AI-010"]
  tags: ["service-auth", "managed-identity", "security"]
