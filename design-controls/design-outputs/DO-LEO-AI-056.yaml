        target: "/admin/operations/reviews renders review workflow"
  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/operations/page.tsx"
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/operations/reviews/page.tsx"
