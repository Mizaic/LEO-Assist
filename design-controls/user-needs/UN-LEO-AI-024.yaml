# -- UN-LEO-AI-024 -- NCDA Report Templates
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-024"
  title: "System provides an out-of-the-box NCDA proforma report template built with the no-code report builder"
  description: |
    Clinical audit teams need a ready-to-use report template that produces
    an audit-ready dataset aligned to the NCDA proforma, without requiring
    any configuration or development. The report template is built using
    the platform's no-code report builder and shipped as an out-of-the-box
    (OOB) template. The builder also allows authorised users to create,
    customise, or extend report templates for other clinical audit programmes
    without writing code. Generated reports can be exported as structured
    files (CSV, JSON, PDF) suitable for submission to the national NCDA
    programme coordinator.

  stakeholder:
    type: "end_user"
    role: "Clinical Audit Team Member"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    The NCDA proforma defines a fixed set of required data fields that
    participating practices must submit. Without an aligned output template,
    clinical teams must manually map system outputs to the proforma, which
    is error-prone and reintroduces the transcription burden the platform
    is designed to remove. An OOB template eliminates this step. The no-code
    builder enables the same capability to be extended to future programmes
    without requiring software releases.

  benefit: "Zero-configuration NCDA proforma output, eliminating manual transcription from system outputs to submission format"

  use_case: |
    1. Clinical audit team member completes a pipeline run for a patient
       cohort and confirms all AI proposals through the review queue.
    2. Team member navigates to Reports and selects the NCDA Proforma
       out-of-the-box template.
    3. System populates the template with validated episode data for the
       cohort, mapping each NCDA proforma field to the appropriate data
       from the pipeline output.
    4. Team member previews the populated report and verifies field
       completeness.
    5. Team member exports the report in the required submission format
       (e.g. CSV or structured JSON) and submits to CRUK / NHS England.
    6. A programme administrator for a new diabetes audit programme opens
       the no-code report builder, selects data fields from the programme
       output schema, arranges them in a report layout, and saves a new
       OOB template for the diabetes programme.

  current_solution: |
    Manual copy-paste of data from clinical systems and spreadsheets into
    the NCDA online submission form or proforma spreadsheet; field mapping
    is performed by hand with no validation of completeness.

  pain_points:
    - "Manual field mapping from clinical system output to NCDA proforma takes hours per submission"
    - "Transcription errors introduce data quality issues into national audit datasets"
    - "No automated check that all required NCDA fields are populated before submission"
    - "New programme report formats require developer time to build"

  acceptance_criteria:
    - "System shall ship an OOB NCDA proforma report template covering all required NCDA submission fields"
    - "Report template shall map pipeline output fields to NCDA proforma fields without manual configuration"
    - "System shall validate that all mandatory NCDA fields are populated before allowing export"
    - "System shall support export in CSV and JSON submission formats"
    - "No-code report builder shall allow authorised users to create custom report templates without code changes"
    - "Custom templates shall be configurable per programme without modifying platform software"

  success_metrics:
    - metric: "NCDA proforma field coverage"
      target: "100% of NCDA required fields"
      baseline: "Manual mapping: estimated 85-90% completeness due to omissions"
    - metric: "Report generation time"
      target: "<=30 seconds per cohort"
      baseline: "Manual compilation: 2-4 hours per submission"
    - metric: "Transcription error rate"
      target: "Zero (system-generated output)"
      baseline: "Manual transcription: estimated 2-5% field error rate"

  regulatory_impact: "medium"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1 (NCDA launch configuration)"
    - "NHS NCDA programme submission requirements (CRUK / NHS England)"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "NHS NCDA data specification"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-02"
    status: "draft"

  design_inputs: ["DI-LEO-AI-070"]
  validation_tests: []

  tags: ["ncda-proforma", "reporting", "no-code-builder", "data-export", "ncda"]
