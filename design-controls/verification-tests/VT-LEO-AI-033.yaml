# -- VT-LEO-AI-033 -- Terminology Search and Resolution
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-033"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-033"]
    risks: ["R-LEO-AI-019"]
    user_needs: ["UN-LEO-AI-023"]

  metadata:
    title: "Terminology Search and Resolution"
    description: >
      Verifies that the terminology API hybrid search returns relevant SNOMED
      concepts, all three search modes produce valid results, and response
      times meet the P95 <= 500ms target.
    test_level: "integration"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_terminology_api.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Terminology API running"
      - "Neo4j Coding graph seeded with SNOMED CT subset"
      - "Vector embeddings generated"
    test_data:
      data_type: "fixture"
      cleanup_required: false

  test_cases:
    - case_id: "VT-033-TC-001"
      case_name: "Hybrid search returns relevant concepts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for known clinical terms (e.g. 'high blood pressure', 'diabetes')"
          expected_result: "Correct SNOMED concepts appear in top 5 results"
          verification_method: "Assert concept presence"
      acceptance_criteria:
        - "Known terms resolve to correct SNOMED codes"

    - case_id: "VT-033-TC-002"
      case_name: "P95 response time under 500ms"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run 100 search queries and measure response times"
          expected_result: "P95 response time <= 500ms"
          verification_method: "Assert percentile"
      acceptance_criteria:
        - "Search performance meets SLA"

    - case_id: "VT-033-TC-003"
      case_name: "All three hybrid search modes return valid results"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Execute search in each mode (text, vector, hybrid)"
          expected_result: "All three modes return non-empty, valid result sets"
          verification_method: "Assert non-empty results"
      acceptance_criteria:
        - "Every search mode is functional"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "performance_metrics"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-033/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-033-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 3
      cases_passed: 3
      cases_failed: 0
      duration_seconds: 2
      notes: "All 3 test cases passed (pytest VT-LEO-AI-033)"
