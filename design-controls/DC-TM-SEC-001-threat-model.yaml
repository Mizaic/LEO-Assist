    - id: "DEID-I-001"
      element: "libs/utils/deidentify.py"
      threat: "Incomplete PII removal — regex-based de-identification has known gaps"
      attack_vector: "The de-identification module uses regex patterns for name detection (CAPS,Firstname format), NHS numbers, postcodes, etc. It explicitly documents that 'first names in free-text narrative (e.g. discussed with Christopher) are not catchable by regex alone' (line 28-30). Clinical text with residual PII is then sent to external LLM providers."
      prerequisites: "Clinical text contains PII in formats not covered by regex patterns"
      threat_actors: ["N/A — systemic gap"]
      evidence:
        file: "libs/utils/deidentify.py"
        line: 28
        snippet: "NOTE — first names in free-text narrative (e.g. 'discussed with Christopher')\nare not catchable by regex alone."
      impact:
        confidentiality: "High"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: true
      likelihood: "High"
      likelihood_rationale: "GP consultation text frequently contains embedded names in narrative. The documented gap confirms PII will pass through to LLMs."
      existing_controls: "Comprehensive regex patterns for SURNAME,Firstname, NHS numbers, postcodes, phones, emails, dates, addresses, facility names"
      gaps: "No NER-based name detection; no validation step to audit de-identification completeness; deployment-specific org list (_LOCAL_ORGS) must be manually updated per deployment"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "UK GDPR"
          clause: "Article 9, Article 32"
          nature: "Incomplete pseudonymisation of special category data before third-party processing"
        - standard: "DSPT"
          clause: "Assertion 3.3"
          nature: "De-identification of personal data incomplete"

    - id: "DEID-I-002"
      element: "libs/utils/deidentify.py:46-52"
      threat: "Deployment-specific organisation names hardcoded"
      attack_vector: "The _LOCAL_ORGS tuple contains site-specific organisation names (Woodbrook Medical Centre, LLR Charnwood DN, etc.) that must be updated for each deployment. If not updated, the practice names will not be scrubbed from clinical text sent to LLMs."
      prerequisites: "Deployment at a site not listed in _LOCAL_ORGS"
      threat_actors: ["N/A — configuration gap"]
      evidence:
        file: "libs/utils/deidentify.py"
        line: 46
        snippet: "_LOCAL_ORGS: tuple[str, ...] = (\n    'Loughborough Urgent Treatment Centre',\n    'Woodbrook Medical Centre',\n    ..."
      impact:
        confidentiality: "Medium"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: true
      likelihood: "High"
      likelihood_rationale: "Multi-tenant SaaS deployment will serve multiple NHS trusts. Each trust's organisation names need to be in this list."
      existing_controls: "Current deployment organisations are listed"
      gaps: "Organisation list not configurable via environment or database; requires code change per deployment"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "UK GDPR"
          clause: "Article 32"
          nature: "De-identification configuration not scalable for multi-tenant deployment"

    - id: "NER-T-001"
      element: "libs/prompts/extraction_v1.py"
      threat: "Prompt injection via clinical text"
      attack_vector: "Encounter text is embedded directly into LLM prompts. Malicious content in encounter records (either injected by a compromised GP system or crafted by a malicious user) could contain prompt injection payloads that alter extraction behavior."
      prerequisites: "Malicious content in encounter text"
      threat_actors: ["supply_chain", "malicious_insider"]
      evidence:
        file: "services/coding_worker/app/pipeline/llm_extractor.py"
        line: "TODO:INSPECT"
        snippet: "Encounter text included in LLM messages"
      impact:
        confidentiality: "Low"
        integrity: "Medium"
        availability: "Low"
        clinical_safety: "Medium"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "GP system encounter text is unlikely to contain deliberate injection payloads. The structured JSON output format provides some resilience. The classification step no longer uses an LLM, removing that attack surface entirely."
      existing_controls: >
        Structured JSON output format; output validation (assertion values, entity label validation);
        de-identification strips some control characters;
        encounter classification step replaced with rule-based spaCy PhraseMatcher component
        (libs/classifiers/encounter_textcat.py) — EPR text is no longer embedded in any LLM prompt
        during classification; the NER extraction path (ModelExtractorProvider) also does not use
        an LLM, meaning no EPR text is sent to an external model under the current configuration.
      gaps: >
        The LLM extraction path (LLMExtractorProvider / libs/prompts/extraction_v1.py) is still
        available as a configurable provider and embeds encounter text in prompts when active.
        Prompt injection testing with adversarial clinical text payloads against that path is
        outstanding (see TODO:MANUAL below). No explicit injection detection in the LLM extraction
        path if it is enabled.
