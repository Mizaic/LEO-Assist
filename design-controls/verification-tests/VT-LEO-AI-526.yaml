# -- VT-LEO-AI-526 -- Guidance schema unification + Active-list staleness signal
# IEC 62304 OQ verification

- id: "VT-LEO-AI-526"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-528"]
    risks:
      - "R-LEO-AI-508"
      - "R-LEO-AI-514"

  metadata:
    title: "Canonical-only guidance writes + dual-tolerant reads + Active-list staleness sort"
    description: >
      Pins the canonical-write contract across the guidance generator,
      promotion endpoint, and the bitmap compiler; verifies the
      compiler's dual-tolerant reads + canonical IS_A walk; verifies
      the BE projection of `updated_at` / `reviewed_at` /
      `reviewed_by` and the FE Active-list stalest-first sort with
      the per-row "Updated <relative>" hint; verifies the migration
      script is idempotent, :DOCUMENTS-safe, and refuses ambiguous
      argument combinations; pins the schema invariant that prevents
      the dual-graph bug from regressing.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/test_guidance_schema_invariants.py"
      - "tests/scripts/test_link_or_delete_orphan_snomed_concepts.py"
      - "services/api/tests/test_guidance_rule_generator.py"
      - "services/ui/src/app/admin/guidance/__tests__/RuleReviewSection.merge.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest 8 + pytest-asyncio"
      - "jest 30 + ts-jest"
      - "Source files for generator + router + compiler + UI checked in"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-526-TC-001"
      case_name: "Generator MERGEs only canonical (:Concept {id}) for criteria"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/api/app/services/guidance_rule_generator.py and assert _UPSERT_CONCEPT_AND_CRITERIA contains MERGE (concept:Concept {id: $concept_id}) and not MERGE (concept:SnomedConcept ...)"
          expected_result: "Canonical MERGE present, legacy MERGE absent"
          verification_method: "automated"
      acceptance_criteria:
        - "Generator no longer creates dual-namespace concepts for criteria"

    - case_id: "VT-526-TC-002"
      case_name: "Generator MERGEs only canonical (:Concept {id}) for actions (no :Procedure label)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert _UPSERT_ACTION_CONCEPT contains MERGE (proc:Concept {id: $concept_id}) and does not contain :SnomedConcept or :Procedure"
          expected_result: "Canonical MERGE present, legacy labels absent"
          verification_method: "automated"
      acceptance_criteria:
        - "Action targets share the canonical Concept identity"

    - case_id: "VT-526-TC-003"
      case_name: "Generator MERGEs only canonical (:Concept {id}) for applies_to"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert _UPSERT_APPLIES_TO contains MERGE (concept:Concept {id: $concept_id}) and not :SnomedConcept"
          expected_result: "Canonical MERGE present, legacy MERGE absent"
          verification_method: "automated"
      acceptance_criteria:
        - "Applies-to scopes share the canonical identity"

    - case_id: "VT-526-TC-004"
      case_name: "Promotion endpoint writes canonical (:Concept {id}) into ValueSets"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/api/app/routers/guidance_rules.py and assert _PROMOTE_CONCEPT_TO_DOMAIN contains MERGE (concept:Concept {id: c.concept_id}) and uses concept.preferred_term"
          expected_result: "Canonical write present"
          verification_method: "automated"
      acceptance_criteria:
        - "Domain promotion does not re-introduce :SnomedConcept"

    - case_id: "VT-526-TC-005"
      case_name: "Schema invariant test forbids :SnomedConcept MERGE in guidance production code"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/test_guidance_schema_invariants.py::TestCanonicalWrites and ::test_no_unexpected_legacy_label_mentions_in_guidance_production_code"
          expected_result: "Both tests pass; no MERGE :SnomedConcept in guidance generator / router; no :SnomedConcept Cypher mentions outside the documented exceptions (verifier fallback, compiler dual-tolerant seed match, migration script, patient-coding paths)"
          verification_method: "automated"
      acceptance_criteria:
        - "Future regressions of the dual-graph bug fail CI before merge"

    - case_id: "VT-526-TC-006"
      case_name: "Compiler reads bind concept + proc unlabeled with coalesced ids and display"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/test_guidance_schema_invariants.py::TestDualTolerantReads"
          expected_result: "_FETCH_ACTIVE_RULES, _FETCH_APPLIES_TO, _build_fetch_active_rules_query, _build_fetch_applies_to_query bind concept and proc unlabeled and project ids via coalesce(concept.id, concept.conceptId)"
          verification_method: "automated"
      acceptance_criteria:
        - "Both canonical and legacy nodes bind during the migration window"

    - case_id: "VT-526-TC-007"
      case_name: "Compiler _closure_ids walks IS_A on :Concept only with dual-tolerant seed match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert _closure_ids matches the seed via (t:Concept AND t.id = $concept_id) OR (t:SnomedConcept AND t.conceptId = $concept_id) and walks OPTIONAL MATCH (d:Concept)-[:IS_A*1..N]->(t)"
          expected_result: "Canonical IS_A walk present; seed bind dual-tolerant"
          verification_method: "automated"
      acceptance_criteria:
        - "Descendant expansion works for every guidance-only concept post-migration"
        - "Falls back silently to exact-match for concepts with no canonical twin"

    - case_id: "VT-526-TC-008"
      case_name: "Router projects updated_at / reviewed_at / reviewed_by on every rule"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert _FETCH_RULES, _FETCH_RULE_BY_ID, _FETCH_RULE_DETAIL contain coalesce(rule.updatedAt, rule.createdAt) AS updated_at, rule.reviewedAt AS reviewed_at, rule.reviewedBy AS reviewed_by; assert _format_rule_for_review surfaces all three"
          expected_result: "BE projection + serialiser both surface the staleness fields"
          verification_method: "automated"
      acceptance_criteria:
        - "FE has the data it needs to sort stalest-first and to render the relative-time hint"

    - case_id: "VT-526-TC-009"
      case_name: "Router read queries coalesce concept ids + display fields"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert _FETCH_RULES + sibling reads use coalesce(concept.id, concept.conceptId) and coalesce(concept.preferred_term, concept.fsn, concept.term, ...)"
          expected_result: "All read queries are dual-graph tolerant"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer never sees a raw conceptId fall through during the migration window"

    - case_id: "VT-526-TC-010"
      case_name: "Migration script gates every legacy selector on NOT (legacy)<-[:DOCUMENTS]-()"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/scripts/test_link_or_delete_orphan_snomed_concepts.py::test_every_legacy_selector_excludes_patient_documents_subgraph"
          expected_result: "Every Cypher constant referencing :SnomedConcept also contains the :DOCUMENTS exclusion guard"
          verification_method: "automated"
      acceptance_criteria:
        - "Patient-coding nodes are NEVER touched by the migration"

    - case_id: "VT-526-TC-011"
      case_name: "Migration argparse refuses --apply --dry-run together and requires one"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/scripts/test_link_or_delete_orphan_snomed_concepts.py::test_apply_and_dry_run_are_mutually_exclusive_and_required"
          expected_result: "Argparse mutex group enforced; missing arg refused; both supplied refused"
          verification_method: "automated"
      acceptance_criteria:
        - "Operator must explicitly opt in to mutate production"

    - case_id: "VT-526-TC-012"
      case_name: "Migration rewire template is idempotent"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/scripts/test_link_or_delete_orphan_snomed_concepts.py::test_rewire_template_is_idempotent"
          expected_result: "Per-rel rewire is content-addressed on edge properties; re-running the apply pass produces zero rewires"
          verification_method: "automated"
      acceptance_criteria:
        - "Operator can safely re-run after an interruption"

    - case_id: "VT-526-TC-013"
      case_name: "Migration orphan-delete only targets unreferenced legacy nodes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run tests/scripts/test_link_or_delete_orphan_snomed_concepts.py::test_orphan_delete_only_targets_unreferenced_legacy_nodes"
          expected_result: "_DELETE_ORPHANS gates on NOT (legacy)<-[:DOCUMENTS]-() AND NOT (legacy)--()"
          verification_method: "automated"
      acceptance_criteria:
        - "A legacy node with any remaining relationship is preserved for operator review"

    - case_id: "VT-526-TC-014"
      case_name: "Migration --dry-run executes only read queries (never the rewire template)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run the dry-run behavioural test that asserts run_migration with --dry-run never invokes _MERGE_CANONICAL_TWINS, _REWIRE_REL_TEMPLATE, or _DELETE_ORPHANS"
          expected_result: "Only _COUNT_GUIDANCE_LEGACY + _COUNT_REL_TEMPLATE + _AUDIT_REMAINING run"
          verification_method: "automated"
      acceptance_criteria:
        - "Dry-run can never mutate data even if the operator intended otherwise"

    - case_id: "VT-526-TC-015"
      case_name: "FE formatRelativeUpdatedAt renders 'Updated <relative>' with correct singular/plural"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run services/ui/src/app/admin/guidance/__tests__/RuleReviewSection.merge.test.ts > formatRelativeUpdatedAt suite"
          expected_result: "Returns Updated just now (sub-minute / future), Updated 1 minute ago / 5 minutes ago, Updated 1 hour ago / 7 hours ago, Updated 1 day ago / 14 days ago, Updated 1 month ago / 6 months ago, Updated 1 year ago / N years ago"
          verification_method: "automated"
      acceptance_criteria:
        - "Plain-English staleness hint covers every range a reviewer will see"

    - case_id: "VT-526-TC-016"
      case_name: "FE sortRulesForStatus sorts active stalest-first with deterministic ties"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run sortRulesForStatus suite: assert active sort by updated_at ASC with rule_id tie-break; pending_review and superseded preserve BE order; helper returns a new array (immutability)"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Active list is stable across renders"
        - "Pending and superseded ordering is unchanged"

    - case_id: "VT-526-TC-017"
      case_name: "FE Rule interface declares created_at / updated_at / reviewed_at / reviewed_by"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source: read RuleReviewSection.tsx and assert each field is present in the Rule interface block"
          expected_result: "All four fields present"
          verification_method: "automated"
      acceptance_criteria:
        - "TypeScript surface matches the BE projection"

    - case_id: "VT-526-TC-018"
      case_name: "FE renders 'Updated <relative>' hint per active rule card"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source: assert formatRelativeUpdatedAt(rule.updated_at) is invoked inside a Typography with data-testid=\"rule-updated-relative\" inside the rules.map block"
          expected_result: "Hint render present"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer sees staleness at a glance without expanding cards"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-526/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-526-RUN-001"
      executed_at: "2026-04-19T12:00:00Z"
      executor: "automated"
      result: "pass"
      notes: >
        TC-001..TC-009 verified via
        `pytest tests/test_guidance_schema_invariants.py
        services/api/tests/test_guidance_rule_generator.py::TestCanonicalConceptMerge -v`
        (all green). TC-010..TC-014 verified via
        `pytest tests/scripts/test_link_or_delete_orphan_snomed_concepts.py -v`
        (all green; static-source guards + dry-run / apply
        behavioural tests). TC-015..TC-018 verified via
        `npx jest --testPathPatterns RuleReviewSection.merge --no-coverage`
        (all green; helper unit tests + static-source render
        invariants). Schema invariant test pins the canonical-write
        contract; migration script is idempotent and DOCUMENTS-safe;
        FE sort + relative-time hint verified end to end.
