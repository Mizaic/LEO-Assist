# -- R-LEO-AI-081 -- Patients and junior staff misunderstand clinical terms because jargon is not explained in-product
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-081"
  title: "A patient, carer, or junior staff member acts on a LEO screen they do not fully understand because no inline 'what-is-this' or 'why-am-I-here' affordance exists, leading to a wrong clinical action"

  hazard:
    description: >
      LEO surfaces use clinical terminology (e.g.
      'microalbuminuria', 'refuted assertion', 'HbA1c',
      'scope guard') without in-product definitions. Patients,
      carers, and new staff either guess the meaning or
      proceed anyway. No PageIntro explains why the screen
      exists or what action the user should take.
    category: "clinical_safety"

  hazardous_situation: >
    A carer reads a safety-netting paragraph that says
    "persistent haematuria should be reviewed". They do not
    know what haematuria means. The carer assumes it is not
    relevant and closes the page. The patient goes without the
    intended follow-up. Or: a junior coder approves a record
    marked 'refuted' without realising that 'refuted' means
    the initial diagnosis was overturned, not that the record
    itself is being rejected.

  harm:
    description: >
      Patients miss safety-netting prompts; coders propagate
      incorrect clinical data into the audit pipeline. Both
      cause clinical-safety harm by delay or wrong onward
      routing.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Deliver five explanation primitives (DI-LEO-AI-121):
        PageIntro, HelpPopover, CoachMark, ProgressiveReveal,
        GlossaryTerm. Every patient- and trainee-reachable
        screen consumes them. GlossaryTerm provides a
        single-source plain-language definition for every
        clinical term.
      implemented_by: ["DI-LEO-AI-121"]
      verified_by: ["VT-LEO-AI-116"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Readability gate in CI computes Flesch-Kincaid Grade
        for every plainLanguage string in the glossary and
        fails the build on any string with grade > 9.
      implemented_by: ["DI-LEO-AI-121"]
      verified_by: ["VT-LEO-AI-116"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After explanation primitives and the readability gate,
      residual risk covers clinical terms that have not yet
      been added to the glossary. A monitoring metric tracks
      the proportion of clinical terms in shipped copy
      covered by the glossary and alerts on coverage drop.

  monitoring:
    monitoring_plan: >
      Monthly automated scan of shipped copy for clinical
      terms that are not yet in glossary.ts; file a ticket
      when found. Quarterly usability test with patients and
      juniors confirming comprehension.
    metrics:
      - "Clinical-term glossary coverage (target >=95%)"
      - "Patient task comprehension score (target >=4/5)"
      - "Copy readability grade (target <=9)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "UX redesign programme 2026-04 copy review"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "readability"
      - "explanation-pattern"
      - "patient-safety"
      - "onboarding"
