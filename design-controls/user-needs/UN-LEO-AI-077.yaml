# -- UN-LEO-AI-077 -- Spatial timeline navigation for episode encounter text
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-077"
  title: "Cancer auditors and clinical reviewers need to see and jump between every encounter in a patient's history without losing the episode they are focused on, so that surrounding context (encounters before and after a focused episode encounter) is one click away rather than hidden behind scope toggles and date guesswork"

  description: |
    On the Mission Control patient detail drawer (/care/patients), when
    a reviewer focuses on an episode the Encounter text tab defaults to
    showing only encounters linked to that episode. To see what
    happened a few days before or after a focused encounter -- which
    is often where the clinical signal sits (a normal scan two weeks
    earlier, a chase letter ten days later) -- the reviewer has to:

      - click "All encounters" to widen the scope,
      - then scroll through the entire patient history,
      - while trying to remember the date of the encounter they were
        looking at.

    This is slow, error-prone, and breaks the reviewer's train of
    thought. They lose their place, lose track of which encounter was
    the focal point, and frequently abandon the context check.

    Reviewers need a persistent visual map of the patient's whole
    encounter history -- a horizontal time axis with one dot per
    encounter -- that shows where the focused encounter sits relative
    to everything else, marks the episode window as a band, and lets
    them jump to any neighbour with a single click. Hovering a dot
    must reveal the date, encounter source and a short preview so the
    reviewer can choose without committing.

  stakeholder:
    type: "end_user"
    role: "Cancer Auditor / Clinical Audit Lead / QA Reviewer"
    organization: "NHS Primary Care Organisation / Cancer Alliance"

  priority: "high"

  rationale: |
    Episode-only views can hide the clinical signal that explains the
    episode -- the routine appointment two weeks before referral, the
    chase letter the week after a missed milestone. Without an
    affordance to navigate spatially, reviewers either skip the check
    (clinical risk) or unfilter and scroll (slow, fragile). A
    persistent timeline scrubber turns "find encounters around this
    date" from a multi-step toggle-and-scroll exercise into a single
    glance and a single click, and makes gaps and clusters in care
    visible as a shape.

  benefit: "Reviewer can see and reach surrounding-context encounters in one click; reduces missed clinical signal during episode review; reduces time-per-case for context cross-checks from 30s+ to under 5s"

  use_case: |
    1. Auditor opens a patient with a focused episode "Type not yet
       confirmed" via the Mission Control row -> Episodes -> drawer
       flow.
    2. Drawer opens to the Encounter text tab, scope = Episode linked.
    3. A horizontal timeline scrubber sits below the milestone chips,
       showing every encounter in the patient's history as a dot on a
       date axis. Linked encounters are filled, others are hollow. A
       faint coloured band shows the episode window
       (referral_date -> end_date).
    4. Auditor sees a cluster of dots in the two weeks before the
       linked encounter and hovers one. A small floating card reveals
       the date plus a short preview (first 80 characters of the
       encounter text plus coded count).
    5. Auditor clicks the dot. The view auto-switches scope to "All
       encounters" if needed, scrolls to that encounter card, expands
       it, and visually highlights it. The active dot on the
       scrubber moves with a smooth animated indicator.
    6. Auditor reads the surrounding encounter, then clicks back on
       the previously-focused dot to return.
    7. As the auditor scrolls through the encounter list, the
       scrubber's active indicator follows the encounter currently
       in view, keeping spatial orientation.

  current_solution: |
    EncounterTextTab.tsx exposes three scope chips ("Episode linked",
    "Episode window", "All encounters") plus a coded-only switch and
    a free-text search. Milestone date chips at the top let the
    reviewer jump to a known milestone but only to those few
    encounters. There is no spatial overview of the patient's whole
    history; surrounding-context discovery requires manual scope
    widening and scrolling.

  pain_points:
    - "Reviewer cannot see surrounding-context encounters without leaving the focused episode view"
    - "Reviewer must remember the date of the focused encounter to scroll to its neighbours"
    - "Long patient histories require many scroll actions to reach the right date region"
    - "No visual representation of how dense or sparse the patient's encounter history is"
    - "No way to see at a glance how close other encounters sit to the episode window"

  acceptance_criteria:
    - "When the Encounter text tab loads, a horizontal mini-timeline strip is visible below the milestone chips, with one dot per encounter on a real date axis"
    - "Encounters linked to the focused episode are visually distinct (filled, larger) from other encounters (hollow, smaller); the episode window appears as a tinted band underneath the dots"
    - "Hovering or focusing a dot shows a floating card with the encounter date, a short text preview, and the coded count, with the dot lifting/scaling to confirm focus"
    - "Clicking a dot jumps to that encounter card: scope auto-widens if needed, the card scrolls into view and expands, and the dot becomes the active indicator"
    - "An active indicator slides smoothly between dots when the user clicks (or arrow-keys) between encounters; reduced-motion users get instant transitions"
    - "Keyboard users can tab into the scrubber, arrow-key between dots, and press Enter / Space to jump; every dot has an aria-label with full date and preview"
    - "Scrubber auto-hides when there are fewer than 5 encounters (the existing chip row is enough for short histories)"
    - "Scrubber copy meets the project's plain-English standard (reading age 9-11)"

  success_metrics:
    - metric: "Time to reach a surrounding-context encounter from a focused episode"
      target: "Less than 5 seconds median, down from ~30 seconds"
      baseline: "Current: requires scope toggle plus manual scroll"
    - metric: "Surrounding-context check completion rate per case review"
      target: ">= 80% of episode reviews include at least one neighbour-encounter check"
      baseline: "Current: not measurable; anecdotally low"

  regulatory_impact: "low"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1 (NCDA launch configuration)"
    - "UN-LEO-AI-058 Mission Control parent need"

  related_standards:
