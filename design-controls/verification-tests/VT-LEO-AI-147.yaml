# -- VT-LEO-AI-147 -- Histology vocabulary expansion in anchor_detector
# IEC 62304 Verification Protocol

- id: "VT-LEO-AI-147"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-149"]
    risks: ["R-LEO-AI-102"]

  metadata:
    title: "_RE_CONFIRMED_CANCER and _RE_NO_CANCER histology corpus tests"
    description: >
      Verifies that the expanded _RE_CONFIRMED_CANCER pattern matches
      standard histology-letter vocabulary (invasive ductal/lobular,
      adenocarcinoma, BCC/SCC/DCIS/LCIS/in-situ, melanoma in-situ,
      metastatic, infiltrating, lymph node involvement, grades, T-N-M
      staging, Gleason, FIGO, Dukes, Breslow, Clark level) and that the
      expanded _RE_NO_CANCER pattern matches standard benign-histology
      vocabulary (benign lesion names, normal-result phrasing, reactive
      / inflammatory findings, discharge phrases). Verifies that
      neither expansion mis-classifies suspected-cancer or PRISM /
      fast-track referral text. Verifies that
      _classify_text_encounters routes the new vocabulary to the
      correct buckets (diagnosis idx 1, benign-closure idx 4) without
      regressing the _is_referral_enc guard.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_histology_vocabulary.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-147-TC-001"
      case_name: "_RE_CONFIRMED_CANCER matches histology-positive corpus"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Apply _RE_CONFIRMED_CANCER to >= 18 histology cancer phrases"
          expected_result: "All match"
          verification_method: "automated"
      acceptance_criteria:
        - ">= 18/18 histology-positive phrases match"

    - case_id: "VT-147-TC-002"
      case_name: "_RE_CONFIRMED_CANCER does NOT match suspected / referral corpus"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Apply _RE_CONFIRMED_CANCER to >= 6 suspected / referral phrases"
          expected_result: "None match"
          verification_method: "automated"
      acceptance_criteria:
        - "0/6 suspected / referral phrases match"

    - case_id: "VT-147-TC-003"
      case_name: "_RE_NO_CANCER matches benign-histology corpus"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Apply _RE_NO_CANCER to >= 18 benign histology phrases"
          expected_result: "All match"
          verification_method: "automated"
      acceptance_criteria:
        - ">= 18/18 benign histology phrases match"

    - case_id: "VT-147-TC-004"
      case_name: "_RE_NO_CANCER does NOT match malignant or referral corpus"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Apply _RE_NO_CANCER to >= 6 malignant or referral phrases"
          expected_result: "None match"
          verification_method: "automated"
      acceptance_criteria:
        - "0/6 malignant or referral phrases match"

    - case_id: "VT-147-TC-005"
      case_name: "_classify_text_encounters routes histology cancer to diagnosis bucket"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pass 4 histology cancer encounters through _classify_text_encounters"
          expected_result: "All appear in diagnosis bucket (idx 1); none in referral or benign bucket"
          verification_method: "automated"
      acceptance_criteria:
        - "4 encounters routed to diagnosis bucket"
        - "0 routed to referral bucket"
        - "0 routed to benign-closure bucket"

    - case_id: "VT-147-TC-006"
      case_name: "_classify_text_encounters routes benign histology to benign-closure bucket"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pass 4 benign histology encounters through _classify_text_encounters"
          expected_result: "All appear in benign-closure bucket (idx 4); none in diagnosis bucket"
          verification_method: "automated"
      acceptance_criteria:
        - "4 encounters routed to benign-closure bucket"
        - "0 routed to diagnosis bucket"

    - case_id: "VT-147-TC-007"
      case_name: "_is_referral_enc guard preserved for histology-bearing referrals"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pass 'Fast track referral for suspected invasive ductal carcinoma' through _classify_text_encounters"
          expected_result: "Encounter in referral bucket; NOT in diagnosis bucket; NOT in benign bucket"
          verification_method: "automated"
        - step_number: 2
          action: "Pass 'PRISM 2WW questionnaire finalised. Suspected DCIS.' through _classify_text_encounters"
          expected_result: "Encounter in referral bucket; NOT in diagnosis bucket"
          verification_method: "automated"
      acceptance_criteria:
        - "Referral encounters NEVER fire diagnosis or benign-closure"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-147/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-147-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "cursor-agent"
      environment: "development"
      result: "pass"
      cases_passed: 8
      cases_failed: 0
      notes: >
        pytest tests/test_histology_vocabulary.py -- 8 unit tests passed:
        TC-001 (histology-positive corpus, 18 phrases all match _RE_CONFIRMED_CANCER),
        TC-002 (suspected/referral corpus, 0/6 false-positives on _RE_CONFIRMED_CANCER),
        TC-003 (benign-histology corpus, 18 phrases all match _RE_NO_CANCER),
        TC-004 (malignant/referral corpus, 0/6 false-positives on _RE_NO_CANCER),
        TC-005 (4 histology cancer encounters routed to diagnosis bucket idx 1),
        TC-006 (4 benign encounters routed to benign-closure bucket idx 4),
        TC-007 (referral guard preserved for both 'Fast track referral for
        suspected invasive ductal carcinoma' and 'PRISM 2WW questionnaire
        finalised. Suspected DCIS.').
