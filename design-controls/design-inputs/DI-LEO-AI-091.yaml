# -- DI-LEO-AI-091 -- Mission Control Backend API
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-091"
  type: "Functional"
  derived_from: ["UN-LEO-AI-058"]
  requirement: >
    The analytics API SHALL expose three Mission Control endpoints:
    (1) GET /analytics/mission-control/patients returning a server-side
    paginated, filtered, sorted list of patients with nested episode data;
    (2) GET /analytics/mission-control/kpis returning 6 aggregate KPI values
    for the current filter context; and (3) PATCH
    /analytics/mission-control/episodes/{episode_id}/review recording
    reviewed_by, reviewed_at, audit_notes, and audit_flag on the
    EpisodeOfCare node. All patient endpoints SHALL respect org scope,
    date range, pathway status, cancer type, closure reason, and review
    status filter parameters.
  rationale: >
    The frontend Mission Control UI requires server-side pagination and
    filtering because patient lists can contain hundreds of records that
    cannot be fetched and filtered client-side without performance
    degradation. The review endpoint enables audit tracking, which is
    required for governance and for demonstrating that pipeline output was
    validated before clinical decisions were made.

  machine_spec:
  acceptance_criteria:
    - type: "functional"
      spec: "GET /analytics/mission-control/patients returns a paginated envelope with total, page, page_size, and a patients array containing patient demographics and nested episode objects"
    - type: "functional"
      spec: "Pathway status filter 'confirmed' restricts episodes to status=completed; filter 'closures' restricts to closed_benign|stale_no_diagnosis|stale_post_specialist|closed_related; filter 'all' excludes only merged and closed_phantom"
    - type: "functional"
      spec: "Cancer type filter restricts by EpisodeOfCare.cancer_type field; closure reason filter restricts by EpisodeOfCare.status field"
    - type: "functional"
      spec: "Org scope filter applies the same GP/ICB/Alliance hierarchy as existing _audit_helpers._episode_base"
    - type: "functional"
      spec: "Date range filter applies to EpisodeOfCare.referral_date within date_from and date_to"
    - type: "functional"
      spec: "Review status filter 'unreviewed' restricts to episodes where reviewed_at IS NULL; 'reviewed' where reviewed_at IS NOT NULL"
    - type: "functional"
      spec: "PATCH /review sets reviewed_by, reviewed_at=datetime(), audit_notes, audit_flag on the matched EpisodeOfCare node"
    - type: "functional"
      spec: "GET /analytics/mission-control/kpis returns 6 fields: total_patients, confirmed_cancer, pathway_closures, median_diagnostic_interval_days, safety_netting_rate, needs_review_count"
    - type: "safety"
      spec: "The confirmed_cancer KPI MUST use the same definition as the audit summary endpoint: ep.status = 'completed' AND coalesce(ep.letter_inferred_benign, false) = false. Episodes closed as benign following a reassurance letter MUST NOT be counted as confirmed cancer."
    - type: "performance"
      spec: "GET /patients responds in under 2 seconds for page_size=25 for a practice-scoped org with up to 5000 episodes"
    - type: "safety"
      spec: "PATCH /review requires caller to be authenticated; unauthenticated requests return HTTP 401"

  constraints:
    - type: "safety"
      spec: "The review PATCH endpoint MUST NOT alter any clinical coding data (SNOMED concepts, episode status, cancer_type); it only writes audit tracking fields"
    - type: "safety"
      spec: "Org scope enforcement MUST use the same CallerScope logic as all other analytics endpoints; cross-org patient data access MUST be impossible without admin role"

  dependencies: []
  downstream_impacts:
    - "Frontend Mission Control UI (DI-LEO-AI-092)"
    - "EpisodeOfCare node schema (reviewed_by, reviewed_at, audit_notes, audit_flag properties)"

  technical_details:
    language: "Python"
    framework: "FastAPI / analytics_api"
    file_structure:
      - "services/analytics_api/app/routers/mission_control.py"
      - "services/analytics_api/app/main.py"
    estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-091 pass: filter logic, pagination,
      KPI aggregation, review write, org scope enforcement, and
      unauthenticated access rejection.
    test_protocol: "VT-LEO-AI-091"

  safety_class: "B"
  risks: ["R-LEO-AI-065"]
  tags: ["mission-control", "api", "audit", "backend", "cancer-pathway"]
