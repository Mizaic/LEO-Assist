# -- DI-LEO-AI-182 -- Detect 2WW referral rejection and resubmission as auditable workflow events
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-182"
  type: "Functional"
  derived_from: ["UN-LEO-AI-041"]
  requirement: >
    The anchor detector SHALL classify free-text encounters that record
    a 2WW referral rejection ("Choose and book referral rejected by
    service provider", "referral marked in error", "hospital rejected
    referral") and a subsequent resubmission ("amended referral sent",
    "re-referred", "resubmitted") as referral anchors with
    referral_subtype values 'rejected' and 'resubmitted' respectively,
    persist that subtype on the IS_PART_OF edge to the EpisodeOfCare,
    and expose a DQ tool that reports the rejection-to-resubmission
    delay in calendar days for any pathway above a configurable
    minimum.
  rationale: >
    A rejected 2WW referral introduces a delay before the patient is
    seen in secondary care. The current pipeline collapses every
    referral-class encounter onto a single 'referral' milestone with
    no subtype, so a 6-day rejection-to-resubmission gap is invisible
    in pathway analytics and never reaches the breach-analysis
    dashboard described in UN-LEO-AI-041. Surfacing this segment is a
    prerequisite for explaining a proportion of 2WW breaches at
    governance level.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          When the encounter free text matches the rejection regex
          family (rejected by service provider, e-Referral marked in
          error, hospital rejected referral), _classify_text_encounters
          emits exactly one referral anchor with
          referral_subtype='rejected' and confidence>=0.9.
      - type: "functional"
        spec: >
          When the encounter free text matches the resubmission regex
          family AND a referral pattern is co-mentioned, the anchor
          carries referral_subtype='resubmitted'. Resubmission keywords
          on their own (no referral context) MUST NOT produce a
          referral anchor.
      - type: "functional"
        spec: >
          A rejection or resubmission encounter MUST NOT also emit a
          diagnosis or benign_closure anchor in the same row -- the
          referral lifecycle takes precedence.
      - type: "functional"
        spec: >
          The IS_PART_OF edge persisted by the episode builder carries
          a referral_subtype property that mirrors the anchor field.
      - type: "functional"
        spec: >
          dq_rejected_referrals_resubmission_delay returns one row per
          (patient, episode) where a rejection occurred, with the
          calendar-day delay to the earliest later resubmission
          (NULL when never resubmitted).
    constraints:
      - type: "safety"
        spec: >
          Generic 'rejected' or 'resubmitted' tokens in unrelated
          clinical text (transplant rejection, lab sample resubmitted,
          BP value marked in error) MUST NOT match the referral
          patterns. Negative tests cover each of these false-positive
          scenarios.
    dependencies: ["DI-LEO-AI-124", "DI-LEO-AI-145"]
    downstream_impacts:
      - "Episode builder edge schema (IS_PART_OF.referral_subtype)"
      - "Pathway analytics dashboards (breach decomposition)"
      - "DQ MCP tool surface"
    technical_details:
      language: "Python"
      framework: "analysis_worker"
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        - "services/neo4j_mcp/tools/query_pack_pathway.py"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in tests/test_anchor_detector.py
      ::TestReferralRejectionAndResubmission pass on automated CI.
    test_protocol: "VT-LEO-AI-176"

  safety_class: "B"
  risks: ["R-LEO-AI-097"]
  tags:
    - "anchor-detection"
    - "referral-workflow"
    - "pathway-analytics"
    - "breach-decomposition"
