# -- VT-LEO-AI-068 -- Per-Tenant Billing, Margin Configuration, and Discount Management
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-068"
  title: "Per-Tenant Billing and Pricing Router Verification"
  design_input: "DI-LEO-AI-068"
  design_output: "DO-LEO-AI-068"
  safety_class: "A"
  phase: "OQ"
  method: "Automated unit tests (pytest) with mocked Neo4j clients"
  test_file: "services/api/tests/test_pricing_router.py"
  status: "pending"

  test_cases:
    - id: "VT-068-001"
      title: "GET /pricing/config returns 403 for non-admin caller"
      steps:
        - "Call GET /pricing/config with a CallerScope that has no 'admin' permission"
      expected: "HTTP 403 response"

    - id: "VT-068-002"
      title: "GET /pricing/config returns default margin when not configured"
      steps:
        - "Mock CodingGraphClient to return no PricingConfig row"
        - "Call GET /pricing/config with admin scope"
      expected: "targetMargin=0.75, isDefault=true"

    - id: "VT-068-003"
      title: "PUT /pricing/config stores and returns updated margin"
      steps:
        - "Call PUT /pricing/config with body {targetMargin: 0.65} as admin"
        - "Mock UPSERT_PRICING_CONFIG to succeed"
      expected: "HTTP 200, targetMargin=0.65"

    - id: "VT-068-004"
      title: "PUT /pricing/config rejects margin >= 1.0"
      steps:
        - "Call PUT /pricing/config with body {targetMargin: 1.0}"
      expected: "HTTP 422 (Pydantic validation error, ge=0 lt=1)"

    - id: "VT-068-005"
      title: "GET /pricing/orgs returns 403 for non-admin"
      steps:
        - "Call GET /pricing/orgs without admin permission"
      expected: "HTTP 403"

    - id: "VT-068-006"
      title: "GET /pricing/orgs calculates correct list price"
      steps:
        - "Mock ORG_SPEND_SUMMARY to return [{orgId:'org-1', rawCostUsd:10.0}]"
        - "Mock GET_ACTIVE_DISCOUNT_RATE to return {total_discount_rate:0.0}"
        - "Mock GET_PRICING_CONFIG to return target_margin=0.75"
        - "Call GET /pricing/orgs as admin"
      expected: "listPriceUsd=40.0 (10 / (1-0.75)), billableUsd=40.0, grossMargin=0.75"

    - id: "VT-068-007"
      title: "GET /pricing/orgs applies discount to billable amount"
      steps:
        - "Mock raw_cost=10.0, margin=0.75, discount_rate=0.20"
      expected: "listPriceUsd=40.0, billableUsd=32.0 (40×0.8), grossMargin≈0.6875"

    - id: "VT-068-008"
      title: "GET /pricing/orgs caps total discount at 100%"
      steps:
        - "Mock raw_cost=10.0, margin=0.75, discount_rate=1.5 (sum of multiple discounts)"
      expected: "billableUsd=0.0 (capped), never negative"

    - id: "VT-068-009"
      title: "POST /pricing/orgs/{org_id}/discounts creates node and returns 201"
      steps:
        - "Call POST /pricing/orgs/org-1/discounts with valid body {description:'Test', rate:0.1, type:'promo', validFrom:'2026-01-01T00:00:00Z', validTo:'2026-12-31T23:59:59Z'}"
      expected: "HTTP 201, discountId is a UUID, orgId='org-1'"

    - id: "VT-068-010"
      title: "POST discount rejects invalid type"
      steps:
        - "Call POST /pricing/orgs/org-1/discounts with type='invalid'"
      expected: "HTTP 422 (Pydantic validator error)"

    - id: "VT-068-011"
      title: "DELETE /pricing/discounts/{id} with permanent=false deactivates"
      steps:
        - "Mock DEACTIVATE_ORG_DISCOUNT to return {discount_id: 'x'}"
        - "Call DELETE /pricing/discounts/x?permanent=false"
      expected: "HTTP 200, status='deactivated'"

    - id: "VT-068-012"
      title: "DELETE /pricing/discounts/{id} with permanent=true hard-deletes"
      steps:
        - "Mock DELETE_ORG_DISCOUNT to return {deleted: 1}"
        - "Call DELETE /pricing/discounts/x?permanent=true"
      expected: "HTTP 200, status='deleted'"

    - id: "VT-068-013"
      title: "DELETE returns 404 when discount not found"
      steps:
        - "Mock DELETE_ORG_DISCOUNT to return {deleted: 0}"
        - "Call DELETE /pricing/discounts/nonexistent?permanent=true"
      expected: "HTTP 404"

    - id: "VT-068-014"
      title: "GET /pricing/platform-spend returns 403 for non-admin"
      steps:
        - "Call GET /pricing/platform-spend without admin permission"
      expected: "HTTP 403"

    - id: "VT-068-015"
      title: "GET /pricing/platform-spend returns only non-patient events"
      steps:
        - "Mock PLATFORM_SPEND_SUMMARY to return [{eventType:'TrainingRun', rawCostUsd:5.0}]"
        - "Call GET /pricing/platform-spend as admin"
      expected: "breakdown contains TrainingRun; totals.note mentions 'not billed to tenants'"

    - id: "VT-068-016"
      title: "Expired promo discounts are excluded from active rate calculation"
      steps:
        - "Confirm GET_ACTIVE_DISCOUNT_RATE Cypher filters: valid_from <= datetime() AND (valid_to IS NULL OR valid_to >= datetime())"
      expected: "Cypher WHERE clause present in pricing_queries.py (code review)"
