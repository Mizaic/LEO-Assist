# -- R-LEO-AI-185 -- Reviewer treats playground SBAR output as production-ready
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-185"
  title: "An admin reviewer running SBAR generation in the /admin/knowledge AI Summarisation playground treats the output as production-ready clinical guidance"

  hazard:
    description: >
      The SBAR Playground in /admin/knowledge generates real
      :Assessment nodes against real patient data. The output is
      visually similar to what a clinician would see in a future
      production SBAR consumer surface. A reviewer might copy/share
      the playground output as if it were an approved clinical
      summary.
    category: "usability"

  hazardous_situation: >
    A QA reviewer runs an SBAR for a real patient to test a prompt
    change. They share the rendered Markdown with a clinician
    colleague to "double-check" the result. The clinician records the
    findings in the patient's notes without going back to the source
    record.

  harm:
    description: >
      Wrong clinical decision based on a reviewer-grade SBAR that may
      use an unreleased prompt version, may be partial, may have
      failed sections silently. Severity is serious.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "information_for_safety"
      description: >
        Permanent "Test only" Alert banner at the top of the SBAR
        Playground (data-testid sbar-test-only-banner). Wording:
        "Test only. Output from this playground is for prompt and
        pipeline testing. It must not be used for clinical
        decision-making." Banner presence is enforced by the static
        VT (VT-LEO-AI-188).
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-188"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Page sits behind /admin/* role gate; the underlying SBAR API
        endpoints (POST/GET /sbar/*) also require admin role
        independently.
      implemented_by: ["DI-LEO-AI-191", "DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-188"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Replaced free-text Situation framing with the typed
        SummarisationContext enum (DI-LEO-AI-231) and added the
        capped 500-char Concern field (DI-LEO-AI-233) so the
        playground prompt surface is bounded and reproducible
        rather than open-ended free text. The per-context framing
        snippets are now PromptConfig nodes editable in the AI
        Instructions surface (DI-LEO-AI-507) with a hardcoded
        fallback dict so the runtime cannot regress to an unframed
        Situation prompt.
      implemented_by:
        - "DI-LEO-AI-231"
        - "DI-LEO-AI-233"
        - "DI-LEO-AI-507"
      verified_by:
        - "VT-LEO-AI-231"
        - "VT-LEO-AI-233"
        - "VT-LEO-AI-509"
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        QA reviewer onboarding documentation calls out that the
        playground generates real :Assessment nodes and that those
        nodes may be associated with real patient ids; reviewers are
        told not to share output outside the QA channel.
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: []
      effectiveness: "partially_effective"
    - control_type: "design_feature"
      description: >
        Pre-emptive token-budget aware shrinker (DI-LEO-AI-513)
        prevents the most common cause of silent partial SBARs
        (Bedrock 'Input is too long for requested model'
        ValidationException on the Background stage) by trimming
        per-source text and dropping the lowest-priority sources
        before the LLM call, with a plain-English notice surfaced
        to the reviewer. Structured errors[] and notices[]
        (DI-LEO-AI-516) are emitted on every sbar_completed and
        sbar_stage_completed SSE event and rendered in the
        playground as warning / info Alerts; the result button
        shifts from green to amber when any stage failed so the
        visual signal matches the run state and a partial SBAR can
        no longer be confused with a complete one. See R-LEO-AI-510
        for the dedicated risk record.
      implemented_by: ["DI-LEO-AI-513", "DI-LEO-AI-516"]
      verified_by: ["VT-LEO-AI-514"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Always-visible banner + admin-only access materially reduce
      misuse probability. Procedural training carries the residual
      gap. The page does not expose any "approve / send" flow that
      would push the output into a production surface.

  monitoring:
    monitoring_plan: >
      Banner presence checked on every UI release by VT-LEO-AI-188
      (jest static-source) and the e2e a11y/smoke spec. Onboarding
      docs reviewed quarterly with QA team.
    metrics:
      - "VT-LEO-AI-188 status (must be 'pass' on every release)"
      - "Reviewer-reported SBAR misuse incidents (target 0)"
    review_frequency: "Per release + quarterly QA review"

  metadata:
    identified_by: "Plan workshop 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "sbar"
      - "playground"
      - "admin-ui"
