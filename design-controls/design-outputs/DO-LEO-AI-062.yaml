- id: "DO-LEO-AI-062"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-062"]
    user_needs: ["UN-LEO-AI-001"]
    risks_addressed: ["R-LEO-AI-030", "R-LEO-AI-014"]
    verification_tests: ["VT-LEO-AI-062"]
    validation_tests: []

  specification:
    title: "Smart Few-Shot Selection + Prompt Caching"
    description: |
      Runtime prompt assembly enhancement with static core examples, dynamic
      few-shot retrieval by similarity, and Bedrock cache-point marking.
      Includes PromptConfig schema/API/UI support for maxFewShot and core flags
      persisted in Neo4j.
    purpose: "Reduce prompt token cost and size while improving relevance of in-context examples"
    technical_approach: "Core/dynamic split, in-process vector similarity selection, provider caching marker, Neo4j-backed configuration"
    acceptance_criteria:
      - criterion: "Visual editing"
        type: "functional"
        measurement: "Test"
        target: "Users can set maxFewShot and per-example core flag in admin prompt editor"
      - criterion: "PlanDefinition output"
        type: "functional"
        measurement: "Test"
        target: "Extractor applies maxFewShot cap and splits core/dynamic examples correctly"
      - criterion: "Save and load"
        type: "functional"
        measurement: "Test"
        target: "Prompt config fields persist/load via API and Neo4j"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/_extractor.py"
        description: "Core/dynamic few-shot split and dynamic selection integration"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/few_shot_selector.py"
        description: "FewShotSelector similarity ranking with graceful fallback"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/llm_client/factory.py"
        description: "Bedrock cachePoint prompt marker"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/prompts/[id]/page.tsx"
        description: "Prompt editor controls for maxFewShot and core toggle"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/prompts.py"
        description: "Prompt API persistence of maxFewShot/core"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/prompt_config_queries.py"
        description: "Neo4j prompt config schema/query fields for max_few_shot"
        storage_location: "git"
    technical_details:
      language: ["TypeScript"]
      framework: ["Python", "FastAPI", "Next.js", "React"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Prompt token budget control", "Deterministic fallback selection", "Configuration persistence integrity"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Backend + UI prompt-management deployment; no data migration required (defaults apply)"

  documentation:
