# -- VT-LEO-AI-155 -- Pathway canvas node primitives
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-155"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-157"]
    risks: ["R-LEO-AI-109"]

  metadata:
    title: "Pathway canvas node primitives (Phase 6b-iii)"
    description: >
      Static-source verification that all 10 pathway node types share a
      single BaseNode shell, NodeHandle wrapper, and NodeStatusStrip;
      that every Handle is aria-labelled; and that the configure
      interaction is unified on single-click + Enter/Space activation.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathway-canvas-nodes.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node 22 / jest 30 (services/ui workspace)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-155-TC-001"
      case_name: "_base/ primitive files exist"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/"
          expected_result: "BaseNode.tsx, NodeHandle.tsx, NodeHeader.tsx, NodeStatusStrip.tsx, index.ts all exist"
          verification_method: "automated"
      acceptance_criteria:
        - "All five primitive files exist on disk"

    - case_id: "VT-155-TC-002"
      case_name: "_base/index.ts re-exports all primitives"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/index.ts"
          expected_result: "Source contains export {BaseNode}, export {NodeHandle, ...}, export {NodeHeader}, export {NodeStatusStrip}"
          verification_method: "automated"
      acceptance_criteria:
        - "Barrel exports the four primitive components"

    - case_id: "VT-155-TC-003"
      case_name: "every node imports BaseNode from ./_base"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read each of the 10 node source files"
          expected_result: "Every file contains 'from \"./_base\"' import and references BaseNode"
          verification_method: "automated"
      acceptance_criteria:
        - "All 10 node files import the canonical primitives"

    - case_id: "VT-155-TC-004"
      case_name: "every node renders <BaseNode> as the wrapper"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Scan each of the 10 node source files for <BaseNode ...> ... </BaseNode>"
          expected_result: "Every node opens with <BaseNode and closes with </BaseNode>"
          verification_method: "automated"
      acceptance_criteria:
        - "BaseNode is the structural wrapper of every node component"

    - case_id: "VT-155-TC-005"
      case_name: "every node uses NodeHandle (no raw <Handle ... />)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Scan each of the 10 node source files for <Handle JSX"
          expected_result: "Every file contains <NodeHandle and zero <Handle (the raw React Flow Handle)"
          verification_method: "automated"
      acceptance_criteria:
        - "Aria-label-bearing NodeHandle is the only handle wrapper used"

    - case_id: "VT-155-TC-006"
      case_name: "NodeHandle always sets an aria-label"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/NodeHandle.tsx"
          expected_result: "Source contains aria-label={resolvedAria} on the Handle and a resolvedAria fallback constructor"
          verification_method: "automated"
      acceptance_criteria:
        - "Aria-label is always emitted, never opt-in"

    - case_id: "VT-155-TC-007"
      case_name: "BaseNode unifies onActivate single-click + keyboard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/BaseNode.tsx"
          expected_result: "Source binds onClick={onActivate}, onKeyDown for Enter/Space, role='button' and tabIndex=0 when interactive"
          verification_method: "automated"
      acceptance_criteria:
        - "Every BaseNode is keyboard-operable"

    - case_id: "VT-155-TC-008"
      case_name: "no node binds onDoubleClick to onConfigure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Scan each node file for onDoubleClick={...onConfigure pattern"
          expected_result: "Zero matches"
          verification_method: "automated"
      acceptance_criteria:
        - "Configure interaction is single-click on every node type"

    - case_id: "VT-155-TC-009"
      case_name: "every interactive node passes onConfigure -> onActivate"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Scan ActionNode, ConditionNode, ConnectorNode, TriggerNode, TransformNode, SourceNode, OutputNode, MiniHitlNode for onActivate={...onConfigure}"
          expected_result: "Every interactive node forwards onConfigure to BaseNode.onActivate"
          verification_method: "automated"
      acceptance_criteria:
        - "Configure intent is propagated through the canonical activation prop"

    - case_id: "VT-155-TC-010"
      case_name: "BaseNode pins the canonical 12px radius + 2px border"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/BaseNode.tsx"
          expected_result: "Source contains borderRadius: '12px' and border: `2px ${borderStyle}`"
          verification_method: "automated"
      acceptance_criteria:
        - "Canonical card-pattern tokens are applied at the BaseNode level"

    - case_id: "VT-155-TC-011"
      case_name: "NodeStatusStrip exposes the canonical run states"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/_base/NodeStatusStrip.tsx"
          expected_result: "Source references each of: idle, queued, running, completed, halted, error, skipped"
          verification_method: "automated"
      acceptance_criteria:
        - "All six run states are handled centrally"

    - case_id: "VT-155-TC-012"
      case_name: "ActionNode delegates run state to NodeStatusStrip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/ActionNode.tsx"
          expected_result: "Source renders <NodeStatusStrip ... /> and delegates raw step result -> NodeRunStatus mapping to resolveRunStatus()"
          verification_method: "automated"
      acceptance_criteria:
        - "Test-run feedback flows through the shared status strip"

    - case_id: "VT-155-TC-013"
      case_name: "nodeTypes registry still exposes all 10 entries"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/nodes/nodeTypes.ts"
          expected_result: "Registry contains keys: action, condition, rest_connector, queue_publish, trigger, parallel, merge, transform, source, output, viewer"
          verification_method: "automated"
      acceptance_criteria:
        - "React Flow node-type lookup contract is preserved"

    - case_id: "VT-155-TC-014"
      case_name: "every node file stays under the 300 LOC target / 500 hard limit"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Count lines in every node + _base/* file"
          expected_result: "Every file < 500 LOC"
          verification_method: "automated"
      acceptance_criteria:
        - "File-size discipline is preserved through the refactor"

    - case_id: "VT-155-TC-015"
      case_name: "source/output nodes still expose their definitions registry"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read SourceNode.tsx and OutputNode.tsx"
          expected_result: "SOURCE_DEFINITIONS exported with all four source types; OUTPUT_DEFINITIONS exported with all four output types"
          verification_method: "automated"
      acceptance_criteria:
        - "Downstream consumers (configurator, templates) keep their definition contract"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-155/"
    retention_period: "7 years"
    immutability: true

