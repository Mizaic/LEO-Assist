# -- UN-LEO-AI-036 -- Triage Queue Backlog Alerting

- id: "UN-LEO-AI-036"
  title: "Referral management teams and patient safety leads need the system to automatically detect and alert when a triage queue has not been actioned within a configurable threshold, so that backlogs caused by annual leave, illness, or staffing gaps are caught before they cause pathway breaches."
  description: |
    Triage queues become stale when the responsible consultant is on leave,
    unwell, or absorbed by other clinical commitments. The current process
    relies on referral management administrators manually monitoring queues
    and chasing consultants. This manual process fails regularly, particularly
    during holiday periods, because no automatic alert is triggered when a
    queue exceeds a safe waiting threshold.

    The system must monitor the age of the oldest untriaged referral in every
    specialty queue, compare it against configurable thresholds by urgency
    band, and automatically alert the appropriate person (referral manager,
    clinical director, or on-call lead) when thresholds are exceeded. Alerts
    must be actionable -- containing enough information to escalate immediately
    without requiring the recipient to log in and investigate.

  stakeholder:
    type: "nhs_user"
    role: "Referral Management Team Leader / Patient Safety Lead"
    organization: "NHS Acute Trust"

  priority: "MUST"

  rationale: |
    Untriaged two-week-wait cancer referrals sitting in a queue for five days
    because a consultant is on leave is a preventable patient safety event that
    has occurred multiple times across NHS trusts. Manual queue monitoring fails
    because the workload of referral management teams does not allow systematic
    queue checks across all specialties every day. Automated alerting shifts
    this from a manual surveillance task to an exception-based intervention,
    dramatically reducing the risk of a backlog going unnoticed.

  benefit: |
    Two-week-wait referrals cannot sit untriaged beyond safe thresholds without
    triggering an alert. Patient safety leads have real-time visibility of queue
    health without manual monitoring. Staffing gaps during leave periods are
    detected immediately rather than days later.

  use_case: |
    1. System monitors the age of every untriaged referral continuously.
    2. When the oldest untriaged referral in a queue exceeds the configured
       threshold (e.g. 24 hours for two-week-wait, 72 hours for routine),
       an alert is triggered.
    3. The alert is sent by email and in-app notification to the referral
       manager and the clinical director for that specialty.
    4. The alert contains: specialty, number of overdue referrals, age of
       oldest referral, urgency breakdown, and a direct link to the queue.
    5. The recipient can acknowledge the alert, reassign triage responsibility,
       or escalate -- all from the notification.
    6. Alert history is retained in the audit trail.

  current_solution: |
    None. Manual queue checking by referral management administrators is the
    only safeguard. This fails during leave periods and high-workload periods.

  pain_points:
    - "Two-week-wait referrals have sat untriaged for five or more days during leave periods"
    - "No automatic alert when a queue becomes stale"
    - "Manual queue monitoring is not systematic across all specialties"
    - "Referral management teams discover backlogs only when someone notices or complains"
    - "No audit trail of when a backlog was detected and who was alerted"

  acceptance_criteria:
    - "Thresholds are configurable per urgency band (two-week-wait, urgent, routine) and per specialty"
    - "Alert is triggered within 5 minutes of threshold being exceeded"
    - "Alert recipients are configurable per specialty and per escalation tier"
    - "Alert contains: specialty, overdue count, oldest referral age, urgency breakdown, direct queue link"
    - "Alert acknowledgement and response are logged in the audit trail"
    - "Repeat alerts are sent at configurable intervals if the backlog is not resolved"

  success_metrics:
    - metric: "Two-week-wait referrals sitting untriaged beyond 24 hours"
      target: "Zero undetected instances after deployment"
      baseline: "Multiple instances per quarter currently undetected"
    - metric: "Mean time from threshold breach to alert receipt"
      target: "Under 5 minutes"
      baseline: "Not currently performed automatically"

  regulatory_impact: "medium"
  safety_impact: "high"
  safety_class: "B"

