# -- DO-LEO-AI-119 -- Operations workspace inclusive redesign implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-119"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-122"]
    user_needs: ["UN-LEO-AI-067", "UN-LEO-AI-068"]
    risks_addressed: ["R-LEO-AI-082"]
    verification_tests: ["VT-LEO-AI-117"]

  specification:
    title: "Operations workspace inclusive redesign"
    description: |
      The Operations workspace is the staff landing page for
      managing, improving, and monitoring the AI. This output
      rewrites the workspace to:

      - Render a PageIntro block explaining why / how / what,
        keyed to 'admin-operations', with copy at Flesch-Kincaid
        Grade <=9.
      - Delete the local components/operations/StatusDot.tsx and
        migrate every consumer in
        services/ui/src/components/operations/ to the shared
        components/ui/StatusDot which encodes status by colour
        AND shape.
      - Keep the existing section-row ARIA pattern
        (aria-expanded, aria-controls, role='region') and verify
        focus ring visibility passes WCAG AA non-text contrast.

    acceptance_criteria:
      - criterion: "PageIntro on Operations"
        type: "functional"
        measurement: "Test"
        target: >
          OperationsWorkspace renders a PageIntro with
          screenId='admin-operations' before the context banner.
      - criterion: "Unified StatusDot"
        type: "functional"
        measurement: "Inspection"
        target: >
          No file in services/ui/src/components/operations/
          imports './StatusDot'; the local file is deleted.
      - criterion: "Readable copy"
        type: "safety"
        measurement: "Test"
        target: >
          fleschKincaidGrade() returns <=9 for every shipped
          why/how/what string on the Operations PageIntro.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/OperationsWorkspace.tsx"
        description: "Hosts PageIntro + SectionRow + status encoding"
      - artifact_type: "source_code"
        location: "services/ui/src/components/ui/StatusDot.tsx"
        description: "Shared shape-encoded StatusDot (re-used here)"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 60
      key_functions:
        - "OperationsWorkspace"
        - "SectionRow"
        - "resolveContextMessage"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Directs the user to unacknowledged quality alerts"
    risk_control_measures:
      - "PageIntro reminds operator that alerts must be checked"
      - "Shape-encoded StatusDot keeps status legible without colour"

  verification_status:
    verification_method: "Test"
    verification_complete: false
