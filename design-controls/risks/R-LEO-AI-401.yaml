# -- R-LEO-AI-401 -- Sick-note / known-cancer narrative creates phantom no-referral EpisodeOfCare (Pattern N1)
# ISO 14971 / IEC 62304 Risk
#
# NOTE: Moved to the 4xx ID range after the parallel ICD-10 / OPCS-4
# reference-data session repeatedly overwrote / deleted Pattern N1
# design-control YAMLs in the 21x-30x ranges. See DI-LEO-AI-401 for
# the full collision history.

- id: "R-LEO-AI-401"
  title: "Sick-note or 'known X cancer' narrative restatement triggers a phantom no-referral EpisodeOfCare for an already-known diagnosis."

  hazard:
    description: >
      Routine GP cancer-care reviews and eMED3 / fit-note encounters
      that mention an already-known cancer diagnosis (for example
      "known breast ca, post mastectomy" or "history of breast
      carcinoma") cause Pattern K and the soft diagnosis sources
      (cancer_follow_up_template, adjuvant_therapy_drug,
      problem_list_diagnosis) to emit a diagnosis_confirmed anchor.
      When no referral exists within the diagnosis-claim lookback
      window, the episode builder synthesises a floating diagnosis-
      led EpisodeOfCare from the restatement anchors alone.
    category: "clinical_safety"

  hazardous_situation: >
    A reviewer opens the patient's pathway view and sees a second
    "completed" cancer EpisodeOfCare alongside the real one. The
    phantom episode contains only restatement diagnoses (no
    referral, no first_seen, often only unrelated obstructions
    pulled in by the windowing logic). Wait-time, breach, and
    NCDA-comparison metrics computed across the cohort double-count
    the affected patients, biasing service-improvement and capacity
    analytics.

  harm:
    description: >
      Reviewer wastes time investigating a fictitious second cancer
      episode; cohort breach and wait-time analytics are inflated;
      research-workspace mission cards built on EpisodeOfCare counts
      report inaccurate denominators.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 4
    detectability: 3
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Tag diagnosis_confirmed anchors emitted from sick-note or
        known-cancer / PMHx narrative encounters with
        ``is_narrative_restatement: True`` and reject any floating
        diagnosis-led group whose anchors are ALL tagged as
        restatements.
      implemented_by: ["DI-LEO-AI-401"]
      verified_by: ["VT-LEO-AI-401"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The guard is conservative (sick-note shapes are unambiguous;
      "known X cancer" / "PMHx X cancer" patterns require both a
      stem and a recognised cancer site token from
      ``_PROBLEM_HEADER_CANCER_TOKEN_RX``). The guard is inert when
      a referral exists OR when at least one diagnosis anchor is
      not a restatement, so loss of a real episode requires both
      a restatement-only diagnosis cluster AND a missing referral
      -- in which case there is no clinical event to anchor on.

  monitoring:
    monitoring_plan: >
      Track phantom-restatement-episode count via the wipe-and-
      rebuild cohort report. Alert if any patient regains a
      phantom episode whose anchors are all flagged as
      restatements after a future detector change.
    metrics:
      - "Number of EpisodeOfCare nodes whose all-anchors are restatement-tagged (target: 0)"
      - "Total EpisodeOfCare count delta after detector changes affecting Pattern N1"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Patient 4802892365 deep-dive (phantom episode 862a306e1ee82616 built from cancer-care-review and sick-note restatements)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "anchor-detector"
      - "episode-builder"
      - "pattern-n1"
      - "patient-4802892365"
