# -- VT-LEO-AI-075 -- Surface Form Task Creation and Two-Reviewer Gate Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-075"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-075"]
    risks: ["R-LEO-AI-050"]

  metadata:
    title: "Loop 2 Surface Form Task Creation and Two-Reviewer Gate Verification"
    description: >
      Verifies that Stream B creates a SurfaceFormTask (not MAPS_TO) when
      resolved concept differs, that MAPS_TO is only created on second
      approval, that Stream C daily cap and auto-pause are enforced, and
      that source badges are correct. Safety-critical: two-reviewer gate
      is the primary control for R-LEO-AI-050 (incorrect mapping propagation).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_surface_form_tasks.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Mock Neo4j client"
      - "Mock terminology coding client"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-075-TC-001"
      case_name: "Stream B: resolve with different concept creates SurfaceFormTask, NOT MAPS_TO"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call resolve_coding_review with resolved_concept_id != snomed_concept_id"
          expected_result: "SurfaceFormTask created with source='reviewer_correction'; MAPS_TO NOT created"
          verification_method: "automated"
      acceptance_criteria:
        - "SurfaceFormTask created with status='pending', source='reviewer_correction'"
        - "UPSERT_SURFACE_FORM_MAPPING NOT called"

    - case_id: "VT-075-TC-002"
      case_name: "Stream B: resolve confirming same concept creates MAPS_TO directly"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call resolve_coding_review with resolved_concept_id == snomed_concept_id"
          expected_result: "MAPS_TO created via UPSERT_SURFACE_FORM_MAPPING; no SurfaceFormTask"
          verification_method: "automated"
      acceptance_criteria:
        - "UPSERT_SURFACE_FORM_MAPPING called once"
        - "No SurfaceFormTask created"

    - case_id: "VT-075-TC-003"
      case_name: "MAPS_TO created only on second approval via resolve endpoint"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Create pending SurfaceFormTask; call resolve with second reviewer identity"
          expected_result: "MAPS_TO created; SurfaceFormTask.status='resolved'; second_reviewer_id recorded"
          verification_method: "automated"
      acceptance_criteria:
        - "MAPS_TO created only after second-reviewer approval"
        - "SurfaceFormTask.status = 'resolved'"

    - case_id: "VT-075-TC-004"
      case_name: "Stream C blocked when daily cap of 20 reached"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Set daily Stream C creation count to 20; attempt to create 21st task"
          expected_result: "Creation rejected; SurfaceFormTask NOT created"
          verification_method: "automated"
      acceptance_criteria:
        - "21st Stream C creation attempt returns cap-exceeded result"
        - "Total Stream C count for day remains 20"

    - case_id: "VT-075-TC-005"
      case_name: "Stream C auto-pauses when total queue depth > 50"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Mock total unresolved SurfaceFormTask count = 51; attempt Stream C creation"
          expected_result: "Stream C auto-paused; no new SurfaceFormTask created"
          verification_method: "automated"
      acceptance_criteria:
        - "Stream C creation blocked when total queue depth > 50"

    - case_id: "VT-075-TC-006"
      case_name: "SurfaceFormTask.source set correctly for each stream"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Create tasks via Stream A, B, and C"
          expected_result: "source = 'audit_gap', 'reviewer_correction', 'llm_auto_detected' respectively"
          verification_method: "automated"
      acceptance_criteria:
        - "Each stream produces correct source value on the SurfaceFormTask node"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-075/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
