# -- DI-LEO-AI-035 -- Terminology Writeback
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-035"
  type: "Functional"
  derived_from: ["UN-LEO-AI-023"]
  requirement: "The system SHALL support writeback of new terminology mappings discovered during the audit process, storing approved SurfaceForm mappings in the Coding Neo4j database for use as suggestion boosts in future terminology resolution"
  rationale: "Writeback enables the terminology database to learn from reviewer decisions. SurfaceForm mappings capture the relationship between surface text and approved SNOMED concepts, improving resolution accuracy over time."

  machine_spec:
    agent_prompt: |
      Implement terminology writeback service (~150 LOC).

      SINGLE PURPOSE: Store approved SurfaceForm-to-SNOMED
      mappings in Neo4j for use as suggestion boosts in
      future terminology resolution.

      REQUIREMENTS:
      1. Accept approved SurfaceForm-to-concept mappings
      2. Store mappings as SurfaceForm nodes in Coding Neo4j
      3. Link SurfaceForm to approved SNOMED concept node
      4. Record approval metadata (reviewer, timestamp, source)
      5. Expose mappings as boost signals for resolution queries
      6. Configurable boost weight for writeback suggestions

      METHODS:
      - create_mapping(surface_form, concept_id, metadata): Store mapping
      - get_boosts(surface_form): Retrieve boost suggestions
      - update_weight(mapping_id, weight): Adjust boost weight
      - list_mappings(filters): Search stored mappings

      CODE CLARITY:
      - Writeback is idempotent -- duplicate submissions update metadata
      - Boost weights are configurable per mapping
      - Audit trail records who approved each mapping and when

    acceptance_criteria:
      - type: "test"
        spec: "Writeback stores SurfaceForm mappings in Neo4j"
      - type: "test"
        spec: "Stored mappings appear as suggestion boosts in subsequent resolution"
      - type: "test"
        spec: "Boost weight is configurable per mapping"

    constraints:
      - type: "safety"
        spec: "Only reviewer-approved mappings are written back"
      - type: "code_quality"
        spec: "Writeback is idempotent -- no duplicate SurfaceForm nodes"

    dependencies: []

    downstream_impacts:
      - "DI-LEO-AI-033 -- resolution uses writeback boosts for ranking"
      - "services/terminology_api -- writeback endpoint hosted here"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/terminology_api/app/routers/writeback.py"
        - "services/terminology_api/app/services/writeback_service.py"
      estimated_loc: 150

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Writeback stores SurfaceForm mappings; mappings appear as suggestion boosts in subsequent resolution; boost weight is configurable"
    test_protocol: "VT-LEO-AI-035"

  safety_class: "B"
  risks: ["R-LEO-AI-005"]
  tags: ["terminology", "writeback", "surfaceform", "learning"]
