      - artifact_type: "source_code"
        location: "services/ui/src/components/research/HeadlineResult.tsx"
        description: "Headline result with coverage badge"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/ResultsTable.tsx"
        description: "Sortable exportable results table"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/MethodExplainer.tsx"
