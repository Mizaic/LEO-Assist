# -- UN-LEO-AI-052 -- Domain-Driven Episode Detector Configuration
# IEC 62304 User Need

- id: "UN-LEO-AI-052"
  title: "Domain-driven configuration of cancer pathway episode detection"
  description: >
    Clinical quality managers need to configure which SNOMED concepts define
    cancer pathway milestones (referrals, diagnoses, treatments, specialist
    visits) through the settings UI, without requiring a code deployment.
    Each milestone subdomain must support an assertion filter so that the
    episode detector can match only concepts coded with a specific ConText
    assertion (e.g. hypothetical/suspected only), preventing false episode
    creation from historical or negated codes. The system must fail clearly
    when configuration is missing rather than silently falling back to stale
    hardcoded data.
  stakeholder: "quality_manager"
  priority: "high"
  rationale: >
    The current episode detector reads SNOMED concept IDs from hardcoded
    Python frozensets that require a code deployment to update. Clinical teams
    need to add new cancer pathway concepts (e.g. a new NICE fast-track
    referral code) without engineering involvement. Additionally, the system
    must distinguish between confirmed diagnoses and suspected/hypothetical
    findings so that episode creation accurately reflects the clinical pathway
    stage, not just any coded mention of a cancer-related concept.
  acceptance_criteria:
    - "A quality manager can add or remove SNOMED concepts from a milestone subdomain via the settings UI without a code deployment"
    - "A subdomain with assertion_filter=[hypothetical] only triggers episode anchors when the coded concept has assertion=hypothetical"
    - "The episode detector raises a clear error rather than silently using stale defaults when the knowledge graph is unreachable"
    - "Each EpisodeOfCare node in Neo4j carries a domain_id property identifying which domain config produced it"
    - "The episode_detector flag on an AuditDomain is persisted to Neo4j and readable via the API"
  metadata:
    created_date: "2026-04-06"
    status: "draft"
  design_inputs: ["DI-LEO-AI-084", "DI-LEO-AI-085", "DI-LEO-AI-090"]
