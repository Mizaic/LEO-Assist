# -- R-LEO-AI-013 -- Incorrect MedSpaCy Inference
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-013"
  title: "MedSpaCy NLP model produces incorrect clinical entity extraction"

  hazard:
    description: "MedSpaCy model is undertrained, overfitted, or degraded, producing incorrect NER results"
    category: "software_defect"

  hazardous_situation: "MedSpaCy model used for entity extraction produces systematically incorrect results across a category of clinical text, and the error is not detected before deployment"

  harm:
    description: "Systematic extraction errors could affect audit data quality across all patients processed with the faulty model"
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "F1 >= 0.90 validation threshold must be met before model deployment"
      implemented_by: ["DI-LEO-AI-003"]
      verified_by: ["VT-LEO-AI-002"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Dry-run comparison of new model against current model on holdout data"
      implemented_by: ["DI-LEO-AI-003"]
      verified_by: ["VT-LEO-AI-002"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: "Human review of all inference results provides independent quality check"
      implemented_by: ["DI-LEO-AI-003"]
      verified_by: ["VT-LEO-AI-002"]
      effectiveness: "highly_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Validation threshold gates deployment; dry-run comparison catches regressions; human review provides final safety net against systematic extraction errors"

  monitoring:
    monitoring_plan: "Track model accuracy metrics and reviewer correction rates"
    metrics: ["MedSpaCy F1 score on holdout data", "Model drift metrics", "Reviewer correction rate post-model-update"]
    review_frequency: "Per model update and monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["nlp", "medspacy", "model-quality", "soup"]
