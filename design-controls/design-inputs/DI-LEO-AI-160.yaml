# -- DI-LEO-AI-160 -- Pathway probe parity and popover safety (Phase 6b-v)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-160"
  type: "Functional"
  derived_from: ["UN-LEO-AI-072"]
  requirement: >
    The pathway editor SHALL expose a probe strategy and an SUBGRAPH_IO descriptor for
    every subgraph registered in libs/pipeline_graph/registry.py, and the probe popover
    SHALL be dismissible via the keyboard (Escape) without trapping focus on the canvas.
  rationale: >
    Today the canvas silently shows a "no detail" popover for steps the python pipeline
    actually runs (encounter_loader, staging_enrichment, human_review_gate,
    encounter_coding_agent), making the dry-run view unreliable. The popover also has no
    keyboard escape, blocking screen-reader and keyboard-only users from closing it.
    Closing this drift is required for the pathway editor to remain usable as new
    subgraphs are added.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/components/pathway/config/subgraphs.ts SHALL include entries for
          encounter_loader, staging_enrichment, human_review_gate, and
          encounter_coding_agent in SUBGRAPH_OPTIONS_RAW, SUBGRAPH_IO, and
          SUBGRAPH_CATEGORY.
      - type: "functional"
        spec: >
          services/ui/src/components/pathway/edges/probeStrategies.tsx PROBE_STRATEGIES
          SHALL register strategy implementations for each of those four subgraph IDs.
      - type: "safety"
        spec: >
          The ProbeMonitor popover SHALL register a window-level keydown listener that
          closes the topmost surface (drawer first, popover second) when the user presses
          Escape, and SHALL expose role="dialog" with an aria-label that names the
          source and target steps.
    constraints:
      - type: "safety"
        spec: >
          Adding probe strategies SHALL NOT change behaviour for any existing subgraph
          (no edits to extraction / post_processing / verification / terminology / etc).
    dependencies: ["DI-LEO-AI-156", "DI-LEO-AI-157", "DI-LEO-AI-159"]
    downstream_impacts:
      - "Pathway editor canvas dry-run probe popover"
      - "Subgraph registry parity between python and UI"
    technical_details:
      language: "TypeScript"
      framework: "React + React Flow"
      file_structure:
        - "services/ui/src/components/pathway/config/subgraphs.ts"
        - "services/ui/src/components/pathway/edges/probeStrategies.tsx"
        - "services/ui/src/components/pathway/edges/PortEdge.tsx"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-158 verifies via static-source inspection that:
      (a) every subgraph registered in libs/pipeline_graph/registry.py has both a
          SUBGRAPH_IO entry and a PROBE_STRATEGIES entry;
      (b) ProbeMonitor installs a keydown handler keyed on "Escape" that closes the
          drawer first then calls onClose;
      (c) the popover root carries role="dialog" and an aria-label.
    test_protocol: "VT-LEO-AI-158"

  safety_class: "B"
  risks: ["R-LEO-AI-162"]
  tags:
    - "pathway-canvas"
    - "phase-6b-v"
    - "registry-drift"
    - "accessibility"
