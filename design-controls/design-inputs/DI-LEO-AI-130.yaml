# -- DI-LEO-AI-130 -- @leo/design-system workspace package
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-130"
  type: "Functional"
  derived_from: ["UN-LEO-AI-069", "UN-LEO-AI-067", "UN-LEO-AI-068"]
  requirement: >
    The system SHALL expose a single design-system workspace package
    (`@leo/design-system`) that owns tokens (colour, typography,
    spacing, radius, elevation, motion, density), primitives (shell,
    role gate, knowledge page, stat hero, progressive reveal,
    task queue), motion infra, and role-scoped copy. All UI services
    SHALL import from this package; no service SHALL ship duplicated
    local copies of these concerns.

  rationale: >
    Today design concerns are scattered across theme.ts, globals.css,
    and a sprawling components/ui/ folder in services/ui. This blocks
    a coherent role-first redesign and makes inclusive-design fixes
    fragile. A single shared package collapses seven different page
    patterns into one, enforces consistent tokens, and gives us one
    place to enforce ESLint rules and readability gates.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "services/design-system exists as an npm workspace package with name '@leo/design-system'"
      - type: "functional"
        spec: "Root package.json declares workspaces: ['services/ui', 'services/design-system']"
      - type: "functional"
        spec: "services/ui/next.config.mjs adds '@leo/design-system' to transpilePackages"
      - type: "functional"
        spec: "The package exports: tokens/*, motion/*, roles/*, fonts/*, primitives/*, copy/*"
      - type: "functional"
        spec: "A TypeScript tsconfig path alias `@leo/design-system` resolves to the package source"
    constraints:
      - type: "safety"
        spec: "Package is pure ES modules; no side-effect imports at top level; tree-shakable"
    dependencies: []
    downstream_impacts:
      - "All UI pages eventually import tokens + primitives from @leo/design-system"
      - "Phase 6 deletes theme.ts and components/ui/ duplicates"
    technical_details:
      language: "TypeScript"
      framework: "React 19 + Next.js 15"
      file_structure:
        - "package.json"
        - "services/design-system/package.json"
        - "services/design-system/tsconfig.json"
        - "services/design-system/src/index.ts"
        - "services/design-system/src/tokens/"
        - "services/ui/package.json"
        - "services/ui/next.config.mjs"
        - "services/ui/tsconfig.json"
      estimated_loc: 400

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      Jest/unit: tokens export shape matches schema; importing any
      primitive from @leo/design-system renders in the UI service
      without requiring deep path imports. Inspection: grep confirms
      no production code path still imports from the retired
      services/ui/src/theme.ts for concerns the package now owns.
    test_protocol: "VT-LEO-AI-126"

  safety_class: "A"
  risks: []
  tags:
    - "design-system"
    - "workspace"
    - "architecture"
