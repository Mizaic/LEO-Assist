# -- R-LEO-AI-061 -- False benign completion from specialist letter inference
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-061"
  title: "Cancer pathway incorrectly closed as completed after specialist letter when treatment is uncoded or external"

  hazard:
    description: >
      The system infers benign pathway completion from a specialist outcome
      letter and absence of coded treatment within 120 days. The patient may
      actually be receiving treatment documented only outside the GP record or
      not yet coded.
    category: "clinical_safety"

  hazardous_situation: >
    A reviewer trusts a completed episode without verifying the correspondence.
    Active cancer care is delayed or missed in audit follow-up lists.

  harm:
    description: >
      Delayed cancer treatment or loss to follow-up; incorrect audit assurance.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Require hitl_flag=true on all inferred completions; require no
        treatment_start anchor in the 120-day post-letter window; only apply
        after the existing 90-day post-specialist stale threshold.
      implemented_by: ["DI-LEO-AI-087"]
      verified_by: ["VT-LEO-AI-087"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        hitl_reason text states that completion is inferred and must be confirmed
        from source records.
      implemented_by: ["DI-LEO-AI-087"]
      verified_by: ["VT-LEO-AI-087"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Residual risk is limited to reviewer oversight; HITL queue remains the
      safety net. Uncoded hospital activity cannot be distinguished automatically
      without additional data feeds.

  monitoring:
    monitoring_plan: >
      Track count of episodes closed with inferred letter reason; sample audit
      quarterly.
    metrics:
      - "Inferred letter completions per rebuild"
      - "HITL resolution rate for those episodes"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review specialist letter pipeline April 2026"
    identified_date: "2026-04-07"
    status: "analyzed"
    tags:
      - "episode-detection"
      - "hitl"
