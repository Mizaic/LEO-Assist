# -- DI-LEO-AI-140 -- Phase 6 cleanup: zero-tech-debt role-first rollout
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-140"
  type: "Functional"
  derived_from: ["UN-LEO-AI-069"]
  requirement: >
    Once the role-first shell is the shipped default, the repository
    SHALL be cleaned of the rollout scaffolding and legacy duplicates
    so no developer accidentally re-introduces the old layout.
    Concretely: (a) the NEXT_PUBLIC_ROLE_FIRST feature flag and every
    code-side branch on it SHALL be removed; (b) the duplicate
    ProgressiveReveal component at
    services/ui/src/components/ui/ProgressiveReveal.tsx SHALL be
    deleted and its callers migrated to @leo/design-system; (c) the
    Google Fonts @import at the top of services/ui/src/app/globals.css
    SHALL be removed (DM Sans + JetBrains Mono are already loaded via
    next/font/google in services/ui/src/lib/fonts.ts); (d) a lint rule
    SHALL flag new hex / rgb / hsl colour literals written inside an
    MUI `sx` prop so reviewers steer contributors toward colour
    tokens from @leo/design-system or theme.palette.
  rationale: >
    Phases 1-5 kept a rollout flag and a parallel Progressive-reveal
    primitive so we could A/B the new shell. With Phase 5 shipping
    role-first to every user, the flag becomes dead code -- the kind
    of debt that silently drifts and eventually lets legacy UI back
    in. The duplicate primitive and the inline Google Fonts request
    are in the same category: harmless individually, corrosive over
    time. The ESLint rule gives reviewers a machine-checked prompt
    to keep colour decisions inside the token system.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/next.config.mjs contains NO reference to
          NEXT_PUBLIC_ROLE_FIRST in any config form (no env
          assignment, no process.env seed).
      - type: "functional"
        spec: >
          services/ui/src/components/RoleShellProvider.tsx and
          services/ui/src/components/AppShell.tsx contain no
          NEXT_PUBLIC_ROLE_FIRST reads; the role-first shell is
          always enabled once the user is authenticated.
      - type: "functional"
        spec: >
          services/ui/src/components/ui/ProgressiveReveal.tsx does
          not exist; the two callers (explanation-patterns test and
          design-system knowledge primitives test) import
          ProgressiveReveal from @leo/design-system.
      - type: "functional"
        spec: >
          services/ui/src/app/globals.css contains no
          `@import url('https://fonts.googleapis.com/...')` line.
      - type: "functional"
        spec: >
          services/ui/eslint.config.mjs defines a no-restricted-syntax
          rule that flags hex or rgb/hsl colour literals inside JSX
          sx props, pointing contributors at the token system.
    constraints:
      - type: "safety"
        spec: >
          Every cleanup MUST be semantics-preserving. The role-first
          shell, the /work queue, and the knowledge hub MUST keep
          passing their existing VTs with no regression.
    dependencies: ["DI-LEO-AI-133", "DI-LEO-AI-136", "DI-LEO-AI-139"]
    downstream_impacts:
      - "services/ui/next.config.mjs"
      - "services/ui/src/components/RoleShellProvider.tsx"
      - "services/ui/src/components/AppShell.tsx"
      - "services/ui/src/components/ui/ProgressiveReveal.tsx (deleted)"
      - "services/ui/src/app/globals.css"
      - "services/ui/eslint.config.mjs"
    technical_details:
      language: "TypeScript + JavaScript + CSS"
      framework: "Next.js + ESLint flat config"
      file_structure:
        - "services/ui/next.config.mjs"
        - "services/ui/src/components/RoleShellProvider.tsx"
        - "services/ui/src/components/AppShell.tsx"
        - "services/ui/src/app/globals.css"
        - "services/ui/eslint.config.mjs"
        - "services/ui/src/__tests__/phase6-cleanup.test.ts"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-136 passes: flag-absence assertions, globals.css
      cleanup assertion, ProgressiveReveal migration assertion, and
      ESLint rule presence assertion all pass.
    test_protocol: "VT-LEO-AI-136"

  safety_class: "A"
  risks: []
  tags:
    - "role-first"
    - "cleanup"
    - "no-tech-debt"
    - "feature-flag-removal"
