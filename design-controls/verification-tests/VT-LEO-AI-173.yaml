# -- VT-LEO-AI-173 -- Encounter timeline scrubber + EncounterTextTab refactor
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-173"
  version: "1.4"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-179"]
    risks: ["R-LEO-AI-174"]

  metadata:
    title: "Sticky histogram encounter timeline plus EncounterTextTab modular refactor"
    description: >
      Verifies the histogram timeline scrubber renders correctly,
      auto-bins by date range, supports zoom + per-bin popover, is
      sticky at the top of the encounter list, and is reachable from
      the Encounter text tab. Also verifies that the existing
      EncounterTextTab behaviour (milestone jump, codes panel,
      reset-and-recode) is preserved through the refactor and that
      the refactored file complies with the 500-LOC ceiling.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/mission-control/EncounterTimelineScrubber.test.tsx"
      - "services/ui/src/__tests__/mission-control/EncounterTextTab-scrubber-chrome.test.ts"
      - "services/ui/src/__tests__/mission-control/EncounterTextTab-timeline-filter.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest setup with @leo/design-system path mapping"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-173-TC-001"
      case_name: "Histogram renders when 5 or more encounters present"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with 6 encounters and assert the data-testid='encounter-timeline-scrubber' element is in the document and at least one role='button' bar with data-bin-label is visible."
          expected_result: "Histogram renders."
          verification_method: "automated"
      acceptance_criteria:
        - "Bar field renders for histories of 5+."

    - case_id: "VT-173-TC-002"
      case_name: "Scrubber returns null when fewer than 5 encounters present"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with 4 encounters and assert no element with data-testid='encounter-timeline-scrubber' is rendered."
          expected_result: "Component renders nothing."
          verification_method: "automated"
      acceptance_criteria:
        - "Short histories suppress the scrubber."

    - case_id: "VT-173-TC-003"
      case_name: "Stacked-bar segments expose linked / other / total counts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with 6 encounters spanning 8 months (so granularity='month'); assert the Feb bar has data-total-count='2', data-linked-count='1', data-other-count='1' and contains both data-segment='linked' and data-segment='other' children; assert the Apr bar has data-linked-count='1' with no other-segment child."
          expected_result: "Counts and segments rendered correctly."
          verification_method: "automated"
      acceptance_criteria:
        - "Bars expose linked vs other density in the DOM."

    - case_id: "VT-173-TC-004"
      case_name: "Episode window band rendered when referral_date and end_date present"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render with referral_date and end_date set; assert data-testid='timeline-window-band' exists."
          expected_result: "Band present."
          verification_method: "automated"
      acceptance_criteria:
        - "Window band visible."

    - case_id: "VT-173-TC-005"
      case_name: "Clicking a single-encounter bar jumps directly"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with a jest.fn() handler; click the Apr bar (1 encounter, enc-4); assert handler called with 'enc-4' and no popover opens."
          expected_result: "Handler invoked, no popover."
          verification_method: "automated"
      acceptance_criteria:
        - "Single-bin click jumps directly."

    - case_id: "VT-173-TC-006"
      case_name: "Each non-empty bar has the prescribed aria-label"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with 6 encounters and assert every non-empty bar's aria-label matches /^Bin .+, \\d+ encounters?( \\(\\d+ linked to focused episode\\))?, from .+ to .+$/."
          expected_result: "All aria-labels formatted correctly."
          verification_method: "automated"
      acceptance_criteria:
        - "Screen reader can describe each bar with bin metadata."

    - case_id: "VT-173-TC-007"
      case_name: "Pressing Enter on a focused single-encounter bar jumps"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with handler; focus the May bar (single encounter enc-5); fire keyDown Enter; assert handler called with 'enc-5'."
          expected_result: "Keyboard activation works."
          verification_method: "automated"
      acceptance_criteria:
        - "Enter key triggers jump."

    - case_id: "VT-173-TC-008"
      case_name: "Multi-encounter bar opens TimelineBinPopover"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Click the Feb bar (2 encounters: enc-2 + enc-3); assert data-testid='timeline-bin-popover' is rendered with data-bin-label='Feb 24', contains 2 rows with data-popover-row='true', and the jump handler was NOT called."
          expected_result: "Popover lists every encounter in the bin."
          verification_method: "automated"
      acceptance_criteria:
        - "Multi-bin click reveals per-encounter chooser."

    - case_id: "VT-173-TC-009"
      case_name: "Clicking a popover row jumps to that encounter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Open the Feb popover; click the row with data-encounter-id='enc-3'; assert onJumpToEncounter called with 'enc-3'."
          expected_result: "Per-row jump works."
          verification_method: "automated"
      acceptance_criteria:
        - "Popover rows are individually actionable."

    - case_id: "VT-173-TC-010"
      case_name: "Range brush exposes two role='slider' handles"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Locate data-testid='timeline-range-brush'; assert exactly two role='slider' children with aria-valuemin / aria-valuemax / aria-valuenow attributes; one carries data-handle='from' and the other data-handle='to'."
          expected_result: "Brush handles are accessible sliders."
          verification_method: "automated"
      acceptance_criteria:
        - "Zoom brush exposes WCAG-compliant slider semantics."

    - case_id: "VT-173-TC-011"
      case_name: "Reset zoom appears after zooming and restores the full range"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert no 'Reset zoom' button initially; focus the from-handle and fire 3x ArrowRight with shiftKey; assert a 'Reset zoom' button is now visible; click it; assert the button disappears."
          expected_result: "Zoom round-trip via keyboard works."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers can zoom in and reset back to the full history."

    - case_id: "VT-173-TC-012"
      case_name: "Active bar carries data-active='true' and aria-pressed='true'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render with activeEncounterId='enc-4'; assert the Apr bar has data-active='true' and aria-pressed='true'; the May bar has both attributes 'false'."
          expected_result: "Active indicator is correctly attributed."
          verification_method: "automated"
      acceptance_criteria:
        - "Active bin is visually + semantically indicated."

    - case_id: "VT-173-TC-013"
      case_name: "Active bar wraps motion.div with layoutId='timeline-active-bin' (static-source)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx as string and assert it contains layoutId=\"timeline-active-bin\"."
          expected_result: "Shared-layout id present."
          verification_method: "automated"
      acceptance_criteria:
        - "Active indicator uses framer-motion shared layout."

    - case_id: "VT-173-TC-014"
      case_name: "Scrubber consumes useMotion() to honour reduced-motion (static-source)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx and assert it imports useMotion from '@leo/design-system', calls useMotion(), reads transitions.hover.duration, and references reducedMotion."
          expected_result: "useMotion + reducedMotion path wired."
          verification_method: "automated"
      acceptance_criteria:
        - "Reduced-motion path wired."

    - case_id: "VT-173-TC-015"
      case_name: "Scrubber root is sticky-positioned"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render the scrubber and assert getComputedStyle on the root element returns position='sticky' and top='0px'; static-source confirms position: 'sticky' and top: 0 in the source."
          expected_result: "Scrubber stays pinned at the top of the scroll container."
          verification_method: "automated"
      acceptance_criteria:
        - "Sticky positioning preserves the timeline during scroll."

    - case_id: "VT-173-TC-016"
      case_name: "pickGranularity covers all five thresholds (static-source)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read timelineBins.ts and assert pickGranularity returns day/<=60, week/<=180, month/<=730, quarter/<=1825, year otherwise."
          expected_result: "All five thresholds present."
          verification_method: "automated"
      acceptance_criteria:
        - "Auto-granularity logic matches the spec."

    - case_id: "VT-173-TC-017"
      case_name: "EncounterTextTab.tsx imports and renders EncounterTimelineScrubber (static-source)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it imports EncounterTimelineScrubber and renders <EncounterTimelineScrubber ... /> with the expected props."
          expected_result: "Wiring is present."
          verification_method: "automated"
      acceptance_criteria:
        - "Scrubber visible to the user from the Encounter text tab."

    - case_id: "VT-173-TC-018"
      case_name: "EncounterTextTab.tsx is at or under 500 LOC"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert line count <= 500."
          expected_result: "File meets code-quality.mdc ceiling."
          verification_method: "automated"
      acceptance_criteria:
        - "File-size discipline preserved."

    - case_id: "VT-173-TC-019"
      case_name: "Existing milestone jump and codes-panel behaviour preserved (regression)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run the existing EncounterTextTab milestone-jump test (services/ui/src/__tests__/mission-control/EncounterTextTab.test.tsx) and assert it still passes."
          expected_result: "All existing tests pass."
          verification_method: "automated"
      acceptance_criteria:
        - "Refactor does not regress existing functionality."

    - case_id: "VT-173-TC-020"
      case_name: "Brush drag filters the encounter list and shows the timeline-filter banner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTextTab with 6 dated encounters spanning Jan-Aug 2024, click the All encounters scope chip, focus the from-handle of the timeline-range-brush slider and dispatch ArrowRight + shiftKey. Assert the data-testid='timeline-filter-banner' Alert is rendered above the scope chips and the All encounters chip count is now < 6."
          expected_result: "The encounter list shrinks to the visible date range and the banner appears."
          verification_method: "automated"
      acceptance_criteria:
        - "Brush handles drive the encounter list filter."

    - case_id: "VT-173-TC-021"
      case_name: "Banner Clear control restores every encounter and removes the banner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "After narrowing via VT-173-TC-020, locate the Clear button inside the timeline-filter-banner Alert and click it. Assert the banner is removed and the All encounters chip count returns to 6."
          expected_result: "Clear control resets the filter."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers can clear the timeline filter explicitly without leaving the tab."

    - case_id: "VT-173-TC-022"
      case_name: "Single-bin bar click clears the timeline filter (jump always visible)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "After narrowing via VT-173-TC-020, click a histogram bar with a single encounter (e.g. data-bin-label='Apr 24'). Assert the timeline-filter-banner is removed and the All encounters chip count returns to the full set, so the jumped-to card is guaranteed to be visible."
          expected_result: "Jump clears the filter."
          verification_method: "automated"
      acceptance_criteria:
        - "Jumping to an encounter never leaves it filtered out."

    - case_id: "VT-173-TC-023"
      case_name: "Histogram is bin-stable while the focus window narrows"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render the scrubber with 6 encounters and snapshot the bar count and the labels of the first and last bars. Focus the from-handle and press Shift+ArrowRight twice to narrow the focus window. Assert the bar count is unchanged and the first / last bin labels are still rendered."
          expected_result: "Bins do not shift when the focus window changes."
          verification_method: "automated"
      acceptance_criteria:
        - "Bin count and label set is invariant across focus window changes."

    - case_id: "VT-173-TC-024"
      case_name: "Focus band overlay appears once the window is narrower than full history"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render the scrubber, assert no element with data-testid='timeline-focus-band' is in the document. Focus the from-handle and press Shift+ArrowRight to narrow the window. Assert the timeline-focus-band element is now present on the histogram."
          expected_result: "Focus band is visible whenever zoomed."
          verification_method: "automated"
      acceptance_criteria:
        - "The brush position is mirrored on the histogram via a focus band overlay."

    - case_id: "VT-173-TC-025"
      case_name: "Bars outside the focus window are flagged data-in-focus='false'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render the scrubber. Initially every bar reports data-in-focus='true'. Focus the to-handle and step it left repeatedly with Shift+ArrowLeft. Assert at least one bar reports data-in-focus='true' and at least one reports data-in-focus='false'."
          expected_result: "Out-of-focus bars are dimmed but remain present."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers can see which bars are inside vs outside the active filter without losing them."

    - case_id: "VT-173-TC-026"
      case_name: "Focus band element is keyboard-pannable via Arrow keys"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "After narrowing the focus window via the from / to handles, focus the data-testid='timeline-range-band' element and press Shift+ArrowRight twice. Assert the from-handle and to-handle aria-valuenow values both increased by the same delta and the window width was preserved."
          expected_result: "Band drag pans both ends together; width is preserved."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewers can pan the focus window without resizing it."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
