# -- DO-LEO-AI-107 -- Pathway Explorer research API and GDS services
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-107"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-109"]
    user_needs: ["UN-LEO-AI-063"]
    risks_addressed: ["R-LEO-AI-075"]
    verification_tests: ["VT-LEO-AI-109"]

  specification:
    title: "Pathway Explorer research API and GDS services"
    description: |
      Implements the backend for the Pathway Explorer research workspace.
      Consists of four modules:

      1. gds_projection_manager.py -- Creates, caches, and drops four named GDS
         in-memory projections (patient-condition, condition-cooccur,
         patient-journey, referral-network) with org-scoped Cypher projections
         and a data-gate check for the referral-network Layer B projection.

      2. algorithm_runner.py -- Maps mission IDs to GDS algorithm calls. Handles
         Leiden (groups), KNN (similar), PageRank (critical), Betweenness
         (bridges), Degree (busiest), Shortest Path / temporal (bottleneck), WCC
         (gaps), SCC (circles), Triangle Count (teams), Adamic-Adar (missing).
         Returns AlgorithmResult dataclass with headline, items, coverage info,
         method text, and guided next steps.

      3. headline_generator.py -- Plain-English headline templates and method
         text (plain + technical) for each mission. Complies with health literacy
         rules (Flesch-Kincaid Grade <= 6).

      4. research.py router -- FastAPI router exposing projection management and
         mission execution endpoints. Inline missions return 200; async missions
         return 202 with run_id.

      5. research_worker/ -- Dedicated FastAPI worker service (port 8007) that
         executes async missions in background threads with Redis pub/sub progress
         events and 7-day Redis job persistence.

    acceptance_criteria:
      - criterion: "Projection lifecycle"
        type: "functional"
        measurement: "Test"
        target: >
          create_projection, list_projections, and drop_projection work for all
          four projection types; Layer B blocked when referral count < 10
      - criterion: "Mission execution"
        type: "functional"
        measurement: "Test"
        target: >
          All 10 mission runners return AlgorithmResult with non-empty headline
          and coverage info when given a mocked GDS client
      - criterion: "Coverage badge"
        type: "safety"
        measurement: "Test"
        target: >
          _get_coverage returns CoverageInfo with patient_count, practice_count,
          confidence (low/moderate/high), and confidence_note for all scopes

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analytics_api/app/services/gds_projection_manager.py"
        description: "GDS projection lifecycle manager"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/services/algorithm_runner.py"
        description: "Mission ID to GDS algorithm dispatcher"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/services/headline_generator.py"
        description: "Plain-English headline and method text generator"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/research.py"
        description: "FastAPI router with projection and mission endpoints"
      - artifact_type: "source_code"
        location: "services/research_worker/app/main.py"
        description: "Research worker FastAPI service (port 8007)"
      - artifact_type: "source_code"
        location: "services/research_worker/app/job_runner.py"
        description: "Background thread job execution with Redis events"
      - artifact_type: "source_code"
        location: "services/research_worker/app/job_store.py"
        description: "Redis-backed research job persistence store"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 900
      key_functions:
        - "create_projection"
        - "list_projections"
        - "check_referral_data_available"
        - "run_mission"
        - "generate_headline"
        - "generate_method_text"
        - "_get_coverage"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - >
        Org-scoped projection creation (prevents cross-tenant data leakage
        in multi-organisation deployments)
      - >
        Data-availability gate for Layer B projections (prevents empty or
        misleading results when referral data is absent)
      - >
        Coverage badge generation (ensures users know the statistical basis
        of every finding before acting on it)
    risk_control_measures:
      - "Org filter applied at GDS projection creation time via Cypher WHERE clause"
      - "Layer B blocked programmatically until referral record count >= 10"
      - "All results include CoverageInfo with patient_count and confidence level"

  verification_status:
    verification_method: "Test"
    verification_complete: false
