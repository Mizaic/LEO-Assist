# -- R-LEO-AI-169 -- Wrong SNOMED procedure attached to an approved guidance rule
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-169"
  title: >
    A pending guidance rule is approved with an incorrect or missing SNOMED
    procedure (action), causing the system to suggest the wrong investigation
    or referral when the rule fires.

  hazard:
    description: >
      The reviewer approves a rule whose patient-criteria are correct but
      whose recommended action is mis-coded (wrong SNOMED concept) or
      uncoded altogether. Until DI-LEO-AI-170 the action was not visible
      in the edit dialog at all, so reviewers could not detect the error
      in the human-in-the-loop gate.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician sees a recommendation generated by the rule -- for example
    "Refer urgently to colorectal" -- when the underlying NICE wording
    actually directs an upper-GI referral, because the LLM extraction
    coded the action to the wrong SNOMED procedure and the reviewer had
    no opportunity to inspect or fix it before approving the rule.

  harm:
    description: >
      Patient is sent for the wrong investigation or referral pathway,
      causing diagnostic delay, unnecessary procedure exposure, or
      mis-routing through secondary care.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 4
    rpn: 36
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Surface the SNOMED action procedure as a clearly-labelled chip in
        the EditRuleDialog so the reviewer sees what the system will
        suggest before they approve.
      implemented_by: ["DI-LEO-AI-170"]
      verified_by: ["VT-LEO-AI-168"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Allow the reviewer to swap the SNOMED procedure via the existing
        concept search panel and persist the change as part of the edit.
      implemented_by: ["DI-LEO-AI-170"]
      verified_by: ["VT-LEO-AI-168"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Server-side check that any reviewer-supplied action concept
        exists in the SnomedConcept knowledge graph before persisting
        the new rule version.
      implemented_by: ["DI-LEO-AI-170"]
      verified_by: ["VT-LEO-AI-168"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Required Reason for edit (>= 3 chars) accompanies every action
        change, captured in the immutable GuidanceAuditEvent for
        post-deployment review.
      implemented_by: ["DI-LEO-AI-154"]
      verified_by: ["VT-LEO-AI-168"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With the action now visible in the human-in-the-loop edit gate
      and validated server-side, the reviewer has both visibility and
      a controlled mechanism to correct LLM action-coding errors before
      approval. The audit trail captures who changed what and why, so
      any escaped misconfiguration can be rolled back via the
      [:SUPERSEDES] graph and identified post-deployment.

  monitoring:
    monitoring_plan: >
      Track the proportion of edited rules where the reviewer changed
      the action SNOMED concept (proxy for LLM action mis-coding rate).
      Spike-alert if it exceeds 15% over a rolling 30-day window. Sample
      audited GuidanceAuditEvents quarterly to confirm reasons cite the
      action change explicitly when applicable.
    metrics:
      - "Percentage of approved rules whose action SNOMED was edited at review"
      - "Count of post-deployment safety incidents tied to wrong rule action"
      - "Median time spent on action review per rule"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Reviewer feedback on EditRuleDialog (2026-04-17)"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "guidance-rules"
      - "hitl-review"
      - "snomed"
      - "clinical_safety"
