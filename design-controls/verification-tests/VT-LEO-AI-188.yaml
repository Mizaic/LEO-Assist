# -- VT-LEO-AI-188 -- AI Summarisation Playground (UI chrome + proxies + e2e)
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-188"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-191", "DI-LEO-AI-194"]
    risks: ["R-LEO-AI-182", "R-LEO-AI-185"]

  metadata:
    title: "AI Summarisation tab registration, 'test only' banner, useSbarStream wiring, proxy routes, axe baseline"
    description: >
      Two-layer UI verification. Jest static-source layer pins the
      tab registration in /admin/knowledge, the SbarPlayground form
      structure (test-only banner present, patient id + background
      source inputs present, submit gated until populated), the
      useSbarStream hook wiring (POST + EventSource), and the three
      Next.js Route Handlers proxying to the Core API. Playwright
      layer renders the tab live, exercises the submit-enable
      heuristic and runs the axe baseline.
    test_level: "system"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest + playwright"
    test_file_paths:
      - "services/ui/src/__tests__/sbar-playground-chrome.test.tsx"
      - "services/ui/e2e/sbar-playground.spec.ts"
      - "services/ui/e2e/knowledge-tabs.spec.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node 20+ / jest 30 / @playwright/test / @axe-core/playwright"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-188-TC-001"
      case_name: "AI Summarisation tab is registered in /admin/knowledge with the right key/label/panel"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/app/admin/knowledge/page.tsx and assert the tab record"
          expected_result: "TABS contains {key:'ai-summarisation', label:'AI Summarisation'} and TAB_PANELS maps it to AiSummarisationPage"
          verification_method: "automated"
      acceptance_criteria:
        - "Tab discoverable from the Knowledge hub"

    - case_id: "VT-188-TC-002"
      case_name: "SbarPlayground renders the 'Test only' banner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source assertion that data-testid 'sbar-test-only-banner' exists"
          expected_result: "Banner present with the production-warning copy"
          verification_method: "automated"
      acceptance_criteria:
        - "Banner mitigates R-LEO-AI-185"

    - case_id: "VT-188-TC-003"
      case_name: "Form exposes patient id, background source and guideline id inputs"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source assertion on data-testids sbar-patient-id, sbar-background-row, sbar-guideline-ids"
          expected_result: "All three inputs present"
          verification_method: "automated"
      acceptance_criteria:
        - "Form structure preserved"

    - case_id: "VT-188-TC-004"
      case_name: "useSbarStream POSTs /api/sbar/jobs and opens EventSource on /api/sbar/jobs/{id}/events"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source assertion on the hook wiring"
          expected_result: "Both URLs present and the POST method literal is set"
          verification_method: "automated"
      acceptance_criteria:
        - "Hook wires to the proxy routes"

    - case_id: "VT-188-TC-005"
      case_name: "Three Next.js Route Handlers proxy to the Core API"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source assertion on each Route Handler file"
          expected_result: "POST /sbar/jobs proxy, GET /sbar/jobs/{runId}/events SSE proxy, GET /sbar/assessments/{id} proxy"
          verification_method: "automated"
      acceptance_criteria:
        - "All three proxy routes present"

    - case_id: "VT-188-TC-006"
      case_name: "Live: tab loads and renders the safety banner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Playwright: goto /admin/knowledge?tab=ai-summarisation"
          expected_result: "data-testid sbar-test-only-banner contains 'Test only'"
          verification_method: "automated"
      acceptance_criteria:
        - "End-to-end smoke pass"

    - case_id: "VT-188-TC-007"
      case_name: "Submit button is disabled until patient id and background source are populated"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Playwright: type into sbar-patient-id; add sbar-background-row id"
          expected_result: "sbar-submit becomes enabled"
          verification_method: "automated"
      acceptance_criteria:
        - "Submit guard prevents empty submissions"

    - case_id: "VT-188-TC-008"
      case_name: "axe baseline passes with zero critical/serious violations"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Playwright + @axe-core/playwright on the loaded tab"
          expected_result: "No critical or serious violations"
          verification_method: "automated"
      acceptance_criteria:
        - "WCAG 2.1 AA baseline maintained"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-188/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-188-EXEC-001"
      executed_at: "2026-04-17"
      executor: "automated-jest"
      command: "cd services/ui && npx jest --testPathPatterns sbar-playground-chrome --no-coverage"
      result: "pass"
      summary: "Static-source jest cases passed; live e2e + axe runs in CI Playwright job"
