# -- UN-LEO-AI-056 -- Admin Data Quality Toolkit
# ISO 13485 User Need

- id: "UN-LEO-AI-056"
  title: "Admin Data Quality Toolkit"
  description: >
    Platform administrators need a comprehensive, reusable data quality toolkit
    to inspect, audit, and remediate patient graph data without writing one-off
    scripts. The toolkit must be accessible from the admin UI, from Cursor AI
    via an MCP server, and from the CLI. It must cover patient inspection,
    episode health, terminology audit, encounter coding quality, domain
    coverage, safe remediation, and produce a repeatable DQ scorecard against
    10 standard data quality dimensions.
  stakeholder: "Platform Admin / Data Engineer"
  priority: "high"
  rationale: >
    Over 300 one-off investigation scripts have accumulated, each hardcoding
    patient IDs or paths, using inconsistent output formats, and not being
    discoverable between AI chat sessions. This creates risk of missed data
    quality issues, duplicated investigation effort, and inconsistent remediation
    decisions. A first-class API-backed toolkit removes this technical debt and
    enables systematic, auditable DQ governance.
  acceptance_criteria:
    - "Platform admins can inspect any patient, episode, or surface form via the admin UI without running scripts"
    - "All DQ tools are callable from Cursor via MCP without manual script invocation"
    - "A DQ rules scorecard covers all 10 ISO 25012 dimensions with configurable thresholds"
    - "All mutation operations (delete, fix, writeback) require explicit confirmation and support dry-run mode"
    - "Outcome inference runs at scale across all stale episodes and returns a verdict per episode"
  design_inputs:
    - "DI-LEO-AI-089"
    - "DI-LEO-AI-095"
  metadata:
    identified_by: "Engineering team"
    identified_date: "2026-04-07"
    status: "approved"
