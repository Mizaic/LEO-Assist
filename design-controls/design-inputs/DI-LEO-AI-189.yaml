# -- DI-LEO-AI-189 -- :Assessment node and HAS_ASSESSMENT relationships
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-189"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-080"
  requirement: >
    The patient graph SHALL persist every SBAR generation as an
    :Assessment node with type='SBAR', linked from :Patient and
    (where applicable) from the originating :ReferralRequest,
    :ProcedureRequest or future/same-day :Encounter via a
    HAS_ASSESSMENT relationship. Each section (situation, background,
    assessment, recommendation) and each pathway hint (stt, rtr,
    alternative_pathway, plus *_evidence fields) SHALL be persisted
    incrementally so partial output is recoverable on later-stage
    failure.
  rationale: >
    Persisting incrementally protects the user when the LLM call for
    a single stage fails -- the prior stages remain queryable as a
    draft. Linking the Assessment to the originating request makes
    audit straightforward ("show me every SBAR generated for this
    referral").

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs.cypher.sbar_assessment_queries.CREATE_ASSESSMENT MERGEs
          the Assessment by id, sets status='draft', type='SBAR',
          created_at, run_id, requested_by, tenant_id, guideline_ids,
          and creates the (Patient)-[:HAS_ASSESSMENT]->(Assessment)
          edge.
      - type: "functional"
        spec: >
          LINK_ASSESSMENT_TO_REFERRAL_REQUEST,
          LINK_ASSESSMENT_TO_PROCEDURE_REQUEST and
          LINK_ASSESSMENT_TO_ENCOUNTER each MERGE the appropriate
          inbound HAS_ASSESSMENT edge.
      - type: "functional"
        spec: >
          SET_SITUATION, SET_BACKGROUND, SET_ASSESSMENT_NARRATIVE and
          SET_RECOMMENDATION each update the corresponding section
          property without touching unrelated properties, so partial
          output is observable mid-run.
      - type: "functional"
        spec: >
          FINALISE_ASSESSMENT writes content, status, errors and the
          stt/rtr/alternative_pathway hint properties + their
          *_evidence companions atomically.
      - type: "functional"
        spec: >
          schema_constraints registers UNIQUE on Assessment.id and
          indexes on Assessment.run_id, Assessment.status,
          Assessment.type and Assessment.created_at.
    constraints:
      - type: "safety"
        spec: >
          The :HAS_ASSESSMENT edge from a :Patient is ALWAYS created
          (Assessment is patient-bound); edges from
          ReferralRequest/ProcedureRequest/Encounter are best-effort
          (logged on failure) so that a missing referral does not
          block the whole SBAR.
    dependencies:
      - "DI-LEO-AI-188"
    downstream_impacts:
      - "Patient graph schema (new node + four relationship types)"
      - "SBAR orchestrator persistence calls"
    technical_details:
      language: "Python"
      framework: "Neo4j Cypher"
      file_structure:
        - "libs/cypher/sbar_assessment_queries.py"
        - "libs/cypher/schema_constraints.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-187 verifies the CREATE_ASSESSMENT + LINK + SET_*
      + FINALISE call sequence runs against a fake session and
      records the expected query keywords in order.
    test_protocol: "VT-LEO-AI-187"

  safety_class: "B"
  risks:
    - "R-LEO-AI-182"
  tags:
    - "sbar"
    - "schema"
    - "audit-trail"
