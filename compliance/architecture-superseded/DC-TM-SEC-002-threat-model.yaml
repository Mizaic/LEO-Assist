      evidence:
        file: "libs/cypher/documents_queries.py"
        snippet: "_build_upsert_query uses f-string for label/rel_type but both from fixed _LABEL_BY_TAG and _REL_BY_LABEL maps"
      impact:
        confidentiality: "None"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: false
