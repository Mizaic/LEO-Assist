# -- DO-LEO-AI-218 -- POST /patients/.../coded-links/sync-from-gold (dual save)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-218"
  version: "1.0.0"
  type: "API_Contract"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-221"]
    user_needs: ["UN-LEO-AI-088"]
    risks_addressed: ["R-LEO-AI-206", "R-LEO-AI-207"]
    verification_tests: ["VT-LEO-AI-212"]

  specification:
    title: "Dual-save endpoint that updates live :DOCUMENTS and mirrors to GoldLabel"
    description: |
      New FastAPI endpoint POST
      /patients/{patient_id}/encounters/{encounter_id}/coded-links/sync-from-gold
      that the shared dialog calls when /care surfaces save the
      editor in saveMode='dual'. The endpoint:

        1. Re-fetches the live concept_id set on the encounter and
           returns HTTP 409 if it differs from
           expected_baseline_concept_ids.
        2. Diffs the saved entities against the live
           :DOCUMENTS rows and applies add / remove / update via
           PatientGraphWriter (so existing audit/event hooks fire).
        3. Mirrors the same entity array onto the linked GoldLabel
           via UPDATE_GOLD_LABEL_ENTITIES (overwrite, not merge).
        4. Returns counts and the new baseline_concept_ids so the
           dialog can adopt them as the next baseline.

      `body_site_concept_id` and `body_site_term` are embedded in
      the modifiers JSON so that the existing _upsert_query can
      persist them without schema changes. Entities without a
      concept_id are skipped on the live path (they remain in the
      gold mirror as user-curated drafts).

    acceptance_criteria:
      - criterion: "Optimistic concurrency by concept_id set"
        type: "safety"
        measurement: "Test"
        target: "If live baseline_concept_ids != expected, returns 409 and makes no writes (live or gold)"
      - criterion: "Atomic dual write"
        type: "safety"
        measurement: "Test"
        target: "Live writes and gold mirror share a single Neo4j session; failure on either surfaces as a non-2xx and the dialog treats it as 'no save'"
      - criterion: "Per-link write accounting"
        type: "functional"
        measurement: "Test"
        target: "Response includes live_links_added, live_links_removed, live_links_updated"
      - criterion: "Gold mirror is whole-array overwrite"
        type: "functional"
        measurement: "Test"
        target: "UPDATE_GOLD_LABEL_ENTITIES is called with the full saved entity array (no merge)"
      - criterion: "Missing label is reported clearly"
        type: "functional"
        measurement: "Test"
        target: "When the linked label is not found the response is a structured 502 the dialog can render"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/patients.py"
        description: "SyncCodedLinksFromGoldRequest, _build_link_payload_from_gold_entity, _list_baseline_concept_ids, sync_coded_links_from_gold endpoint"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 260
      key_functions:
        - "sync_coded_links_from_gold"
        - "_build_link_payload_from_gold_entity"
        - "_list_baseline_concept_ids"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Live :DOCUMENTS writes that drive downstream pipelines"
      - "GoldLabel mirror that feeds future model training"
    risk_control_measures:
      - "Optimistic concurrency by concept_id set prevents silent overwrite of pipeline writes"
      - "PatientGraphWriter audits every live write"
      - "Whole-array overwrite on the gold mirror avoids merge ambiguity"

  verification_status:
    verification_method: "Test"
    verification_complete: true
