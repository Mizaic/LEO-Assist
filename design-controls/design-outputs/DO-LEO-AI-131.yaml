# -- DO-LEO-AI-131 -- libs/analytics/cohorts.py canonical NCDA cohort helpers
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-131"
  version: "1.1.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-134"]
    user_needs: ["UN-LEO-AI-019"]
    risks_addressed: ["R-LEO-AI-092"]
    verification_tests: ["VT-LEO-AI-130", "VT-LEO-AI-163"]

  change_history:
    - version: "1.1.0"
      date: "2026-04-17"
      summary: >
        Refined canonical cohort: dropped the status='completed'
        precondition so in_progress episodes that already carry a
        diagnosis_confirmed milestone are counted as confirmed cancer.
        Added explicit exclusion of closed_benign (in addition to the
        existing letter_inferred_benign filter) so legacy
        closed_benign-with-spurious-diagnosis_confirmed episodes (8
        cases on 2026-04-17) cannot flip into the confirmed-cancer
        cohort. Effect on live data: confirmed_cancers tile in the
        2024-01-01 .. 2026-01-01 window moved from 47 to 50; all-time
        count moved from 80 to 83. See VT-LEO-AI-163 for the
        regression suite.

  specification:
    title: "libs/analytics/cohorts.py canonical NCDA cohort definition"
    description: |
      A pure-Cypher-text helper library that returns the single
      authoritative WHERE / EXISTS clauses used across every NCDA
      analytics endpoint to identify a 'confirmed cancer episode'
      and a '2WW-route diagnosis'. No Neo4j session, LLM, or HTTP
      dependency; consumed by audit.py, _audit_sections.py,
      _audit_intervals.py, dashboards.py, mission_control.py, and
      benchmarks.py.
    acceptance_criteria:
      - criterion: "canonical_confirmed_cancer_clause"
        type: "functional"
        measurement: "Test"
        target: >
          confirmed_cancer_where() returns a Cypher fragment matching
          exactly: NOT status IN [merged, closed_phantom,
          closed_related, closed_benign] AND NOT
          letter_inferred_benign AND EXISTS diagnosis-milestone
          encounter (milestone_type IN [diagnosis,
          diagnosis_confirmed]).
      - criterion: "in_progress_with_diagnosis_counts"
        type: "functional"
        measurement: "Test"
        target: >
          An EpisodeOfCare with status='in_progress' that has a linked
          Encounter milestone of type diagnosis_confirmed passes the
          canonical clause (regression for VT-LEO-AI-163 TC-001).
      - criterion: "closed_benign_with_diagnosis_excluded"
        type: "safety"
        measurement: "Test"
        target: >
          An EpisodeOfCare with status='closed_benign' that ALSO
          carries a diagnosis_confirmed milestone (legacy data
          artefact) does NOT pass the canonical clause (regression for
          VT-LEO-AI-163 TC-002).
      - criterion: "suspected_cancer_referral_clause"
        type: "functional"
        measurement: "Test"
        target: >
          suspected_cancer_referral_where() returns the canonical
          confirmed_cancer clause extended with an EXISTS referral-
          milestone encounter, for the '2WW-route diagnoses' metric.
      - criterion: "endpoints_parity"
        type: "safety"
        measurement: "Test"
        target: >
          Integration test with a synthetic graph asserts
          /audit/summary.confirmed_cancers, /audit/cancer-stage total,
          /audit/cancer-type sum-of-n (pre-exclusion), and the
          /dashboards/overview confirmed_cancer tile are all equal.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/analytics/cohorts.py"
        description: >
          Pure-text Cypher helpers: CONFIRMED_CANCER_CLAUSE,
          SUSPECTED_CANCER_REFERRAL_CLAUSE, confirmed_cancer_where(),
          suspected_cancer_referral_where(), plus a docstring
          describing the canonical definition.
      - artifact_type: "source_code"
        location: "libs/analytics/__init__.py"
        description: "Re-exports the public cohort helpers."
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/_audit_sections.py"
        description: >
          _q_cancer_type and _q_cancer_stage rewritten to compose the
          canonical confirmed_cancer clause; no inline status /
          milestone filters remain.
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/audit.py"
        description: >
          audit_summary computes is_confirmed from the canonical
          helper; the confirmed_cancers count equals the
          cancer-stage denominator.
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/dashboards.py"
        description: >
          Overview + stage endpoints reuse the canonical cohort.
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/mission_control.py"
        description: "confirmed_cancer tile uses canonical cohort."
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/_audit_intervals.py"
        description: >
          INFERRED_CANCER_DIAG_CASE composes the canonical confirmed-
          cancer predicate where applicable.
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 220
      key_functions:
        - "confirmed_cancer_where"
        - "suspected_cancer_referral_where"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Single authoritative cohort definition for all clinical audit counts"
    risk_control_measures:
      - "Parity test pins all endpoint counts to the same denominator"
      - "Helper is pure-text; no silent data reshaping"

  verification_status:
    verification_method: "Test"
    verification_complete: false
