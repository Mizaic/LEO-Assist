# -- DO-LEO-AI-108 -- Pathway Explorer UI components
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-108"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-110"]
    user_needs: ["UN-LEO-AI-063"]
    risks_addressed: ["R-LEO-AI-076"]
    verification_tests: ["VT-LEO-AI-110"]

  specification:
    title: "Pathway Explorer UI components"
    description: |
      Implements the frontend for the Pathway Explorer research workspace.
      All components use MUI with sx prop and theme tokens; no hardcoded colours,
      no emojis, no algorithm names in user-facing text.

      Components:
      - PathwayExplorerWorkspace.tsx -- Top-level layout with header, persona
        lens toggle, split panel (card grid + results), and scoping wizard dialog
      - MissionCardGrid.tsx -- Groups mission cards by intent; handles loading,
        error, and empty states
      - MissionCard.tsx -- Single card with icon, tier badge, title, description,
        locked/data-gated state, keyboard navigation
      - PersonaLensToggle.tsx -- Segmented control for Patients/Pathways/Capacity
        lens switching
      - ScopingWizard.tsx -- Three-question scoping dialog (area, period, detail)
        with pill-button ToggleButtonGroup selectors
      - ResultsPanel.tsx -- Four-layer result container with tabs (Data / Method)
      - HeadlineResult.tsx -- Plain-English headline with coverage badge;
        loading/error/unavailable states; role=status aria-live=polite
      - ResultsTable.tsx -- Sortable, exportable results table with plain-English
        column headers
      - MethodExplainer.tsx -- Collapsible How did we work this out? section
      - GuidedNextSteps.tsx -- Contextual next mission links
      - useResearchState.ts -- Custom hook managing mission selection, scoping,
        API polling, and result caching
      - researchApi.ts -- TypeScript API client for research endpoints

    acceptance_criteria:
      - criterion: "Mission card grid renders"
        type: "functional"
        measurement: "Test"
        target: >
          MissionCardGrid renders all missions from catalogue; data-gated
          missions show Coming soon badge and are not clickable
      - criterion: "Scoping wizard flow"
        type: "functional"
        measurement: "Test"
        target: >
          Clicking a non-gated mission opens ScopingWizard; submitting calls
          startMissionRun and displays HeadlineResult when done
      - criterion: "Accessibility"
        type: "usability"
        measurement: "Inspection"
        target: >
          All mission cards have aria-label; cards respond to Enter and Space;
          HeadlineResult has role=status aria-live=polite; all form controls
          have accessible labels
      - criterion: "No algorithm names"
        type: "usability"
        measurement: "Inspection"
        target: >
          User-facing text contains no instances of: betweenness, centrality,
          leiden, pagerank, jaccard, cosine, knn, wcc, scc, fastRP, graphsage

  implementation:
    artifacts:
