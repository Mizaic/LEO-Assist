# -- VT-LEO-AI-161 -- Stale-detector five fixes (problem-list codes, site,
#                     stale guard, letter-stub DQ, inference defence)
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-161"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-161", "DI-LEO-AI-162"]
    risks: ["R-LEO-AI-163", "R-LEO-AI-164"]

  metadata:
    title: "Stale-detector five fixes verification (DI-161 + DI-162)"
    description: >
      Verifies the five coordinated fixes that resolve the 36-patient
      false-stale finding from the 2026-04-17 deep-read:
      (1) problem-list malignancy code recognition,
      (2) problem-list benign-explanation code and investigation-phrase
          recognition,
      (3) explicit 2WW site reconciliation,
      (4) STALE_CLOSE_Q guard against episodes with diagnosis / benign /
          treatment milestones,
      (5) outcome-inference defence-in-depth on the new code/phrase
          signals, plus the dq_letter_stub_unfilled MCP safety tool.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_stale_detector_fixes.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-161-TC-001"
      case_name: "find_malignancy_code returns canonical site key"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_code on text containing X78WM (breast malignancy CTV3)."
          expected_result: "Returns ('X78WM', 'breast')."
          verification_method: "automated"
      acceptance_criteria:
        - "Tuple of (code, site_key) returned with both fields correct."

    - case_id: "VT-161-TC-002"
      case_name: "find_benign_explanation_code returns matched code"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_benign_explanation_code on text containing XaK99 (laryngopharyngeal reflux)."
          expected_result: "Returns 'XaK99'."
          verification_method: "automated"
      acceptance_criteria:
        - "Code returned exactly as listed in BENIGN_EXPLANATION_READ_CODES."

    - case_id: "VT-161-TC-003"
      case_name: "find_fast_track_referral_site returns explicit site"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call find_fast_track_referral_site on text containing XaMeC."
          expected_result: "Returns ('XaMeC', 'breast')."
          verification_method: "automated"
      acceptance_criteria:
        - "Tuple of (code, site_key) returned."

    - case_id: "VT-161-TC-004"
      case_name: "Code helpers do not false-positive on unrelated tokens"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call all three find_* helpers on text 'Routine BP review, no symptoms.'."
          expected_result: "All three return None."
          verification_method: "automated"
      acceptance_criteria:
        - "No spurious match on routine text."

    - case_id: "VT-161-TC-005"
      case_name: "Investigation-phrase matcher prefers specific phrase"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call match_benign_investigation_phrase on text containing 'Mammogram normal, no further action.'"
          expected_result: "Returns the 'mammogram normal' label, not the more general 'no further action'."
          verification_method: "automated"
      acceptance_criteria:
        - "Specific patterns precede general ones in BENIGN_INVESTIGATION_PHRASES."

    - case_id: "VT-161-TC-006"
      case_name: "Investigation-phrase matcher recognises 'cancer excluded'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call match_benign_investigation_phrase on 'Cancer excluded - discharge to GP.'"
          expected_result: "Returns 'cancer excluded - discharge to GP'."
          verification_method: "automated"
      acceptance_criteria:
        - "Phrase recognised verbatim."

    - case_id: "VT-161-TC-007"
      case_name: "looks_like_letter_stub recognises routing-only stubs"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call looks_like_letter_stub on 'Urology to Greenfields Surgery'."
          expected_result: "Returns True."
          verification_method: "automated"
      acceptance_criteria:
        - "Routing-only text classified as a stub."

    - case_id: "VT-161-TC-008"
      case_name: "looks_like_letter_stub rejects full clinical letter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call looks_like_letter_stub on a 600-character clinic letter body."
          expected_result: "Returns False."
          verification_method: "automated"
      acceptance_criteria:
        - "Substantive letter text not flagged."

    - case_id: "VT-161-TC-009"
      case_name: "Anchor detector emits diagnosis_confirmed on X78WM (breast)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on a non-referral encounter containing X78WM."
          expected_result: "A diagnosis anchor is emitted with site_key='breast', diagnosis_source='problem_list_code', diagnosis_code='X78WM'."
          verification_method: "automated"
      acceptance_criteria:
        - "Anchor carries explicit provenance fields."

    - case_id: "VT-161-TC-010"
      case_name: "Anchor detector emits diagnosis on BB5j2 (endometrial)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on text containing BB5j2."
          expected_result: "Diagnosis anchor with site_key='endometrial' is emitted."
          verification_method: "automated"
      acceptance_criteria:
        - "Endometrial mapping correct."

    - case_id: "VT-161-TC-011"
      case_name: "Anchor detector emits diagnosis on X78XO (endometrial)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on text containing X78XO."
          expected_result: "Diagnosis anchor emitted; site_key resolves to 'endometrial'."
          verification_method: "automated"
      acceptance_criteria:
        - "Second endometrial code recognised."

    - case_id: "VT-161-TC-012"
      case_name: "Referral encounter with malignancy code does NOT emit diagnosis"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on a 2WW referral encounter that quotes a malignancy code."
          expected_result: "No diagnosis anchor is emitted (the existing referral-encounter guard wins)."
          verification_method: "automated"
      acceptance_criteria:
        - "Existing safety guard preserved -- referrals never become diagnoses."

    - case_id: "VT-161-TC-013"
      case_name: "Anchor detector emits benign_closure on XaK99"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on text containing XaK99."
          expected_result: "Benign-closure anchor emitted with benign_source='problem_list_code', benign_code='XaK99'."
          verification_method: "automated"
      acceptance_criteria:
        - "Benign anchor carries provenance."

    - case_id: "VT-161-TC-014"
      case_name: "Anchor detector emits benign_closure on 'cancer excluded - discharge to GP'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on text containing the phrase."
          expected_result: "Benign-closure anchor emitted with benign_source='investigation_phrase' and benign_phrase populated."
          verification_method: "automated"
      acceptance_criteria:
        - "Phrase-based benign provenance recorded."

    - case_id: "VT-161-TC-015"
      case_name: "Anchor detector emits benign_closure on 'Mammogram normal'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on text containing 'Mammogram normal'."
          expected_result: "Benign-closure anchor emitted with the matching investigation phrase."
          verification_method: "automated"
      acceptance_criteria:
        - "Mammogram-normal investigation phrase recognised."

    - case_id: "VT-161-TC-016"
      case_name: "Explicit 2WW code overrides surface-form site match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build an anchor where surface text mentions colorectal but XaMeC (breast 2WW) is also present, then run _classify_text_encounters."
          expected_result: "Anchor site_source='explicit_2ww_code' and site_key='breast'."
          verification_method: "automated"
      acceptance_criteria:
        - "Explicit code wins over surface heuristic."

    - case_id: "VT-161-TC-017"
      case_name: "_extract_condition_key_from_anchor prefers explicit_2ww_code"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _extract_condition_key_from_anchor on an anchor with site_source='explicit_2ww_code', site_key='gynaecological', and a competing concept_id."
          expected_result: "Returns 'gynaecological'."
          verification_method: "automated"
      acceptance_criteria:
        - "Explicit-site precedence enforced in resolver."

    - case_id: "VT-161-TC-018"
      case_name: "Resolver still falls through when explicit site is unknown"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call _extract_condition_key_from_anchor with site_source='explicit_2ww_code' but site_key empty."
          expected_result: "Falls through to the existing concept-id / surface-form / fallback chain."
          verification_method: "automated"
      acceptance_criteria:
        - "No regression for anchors that lack an explicit site."

    - case_id: "VT-161-TC-019"
      case_name: "STALE_CLOSE_Q contains the diagnosis/benign/treatment guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect STALE_CLOSE_Q text for the EXISTS clause covering diagnosis_confirmed, diagnosis, benign_closure, treatment_started."
          expected_result: "Both EXISTS subqueries and the WHERE NOT (has_dx OR has_benign_or_treatment) clause are present."
          verification_method: "automated"
      acceptance_criteria:
        - "Static-source check passes."

    - case_id: "VT-161-TC-020"
      case_name: "STALE_CLOSE_Q still assigns stale_post_specialist when guard is clear"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect STALE_CLOSE_Q for the existing CASE that sets stale_post_specialist and stale_no_diagnosis."
          expected_result: "Status assignment logic preserved verbatim."
          verification_method: "automated"
      acceptance_criteria:
        - "No regression in genuine-stale handling."

    - case_id: "VT-161-TC-021"
      case_name: "dq_letter_stub_unfilled is registered in safety pack"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect query_pack_safety.TOOLS for an entry named 'dq_letter_stub_unfilled'."
          expected_result: "Entry present with description and inputSchema."
          verification_method: "automated"
      acceptance_criteria:
        - "Tool discoverable through the dynamic load path."

    - case_id: "VT-161-TC-022"
      case_name: "dq_letter_stub_unfilled descriptor exposes expected inputs"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect tool inputSchema for days_threshold, max_chars, limit (all integers with sensible defaults)."
          expected_result: "All three properties present and typed integer."
          verification_method: "automated"
      acceptance_criteria:
        - "Schema matches DI-162 acceptance criterion."

    - case_id: "VT-161-TC-023"
      case_name: "dq_letter_stub_unfilled returns expected envelope when run"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch the neo4j-mcp client run method with a fake row, call dq_letter_stub_unfilled, inspect the result."
          expected_result: "Result has category='safety', summary mentioning 'letter stub', and rows matching the fake input."
          verification_method: "automated"
      acceptance_criteria:
        - "Envelope shape matches the standard MCP _result helper."

    - case_id: "VT-161-TC-024"
      case_name: "outcome_inference POST_CANCER contains the new malignancy codes"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect POST_CANCER for entries whose label starts with 'malignancy code'."
          expected_result: "At least one entry per code in MALIGNANCY_READ_CODES."
          verification_method: "automated"
      acceptance_criteria:
        - "Defence-in-depth signals registered."

    - case_id: "VT-161-TC-025"
      case_name: "outcome_inference POST_BENIGN contains the new benign codes"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect POST_BENIGN for entries whose label starts with 'benign explanation code'."
          expected_result: "At least one entry per code in BENIGN_EXPLANATION_READ_CODES."
          verification_method: "automated"
      acceptance_criteria:
        - "Defence-in-depth signals registered."

    - case_id: "VT-161-TC-026"
      case_name: "score_post_specialist_outcome detects problem-list malignancy"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run score_post_specialist_outcome on a synthetic specialist letter quoting X78WM."
          expected_result: "Outcome verdict reflects the cancer signal (INFERRED_CANCER_* or HITL with cancer signal)."
          verification_method: "automated"
      acceptance_criteria:
        - "Code signal flows through the inference engine."

    - case_id: "VT-161-TC-027"
      case_name: "score_post_specialist_outcome detects benign investigation phrase"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run score_post_specialist_outcome on a letter containing 'cancer excluded - discharge to GP'."
          expected_result: "Outcome verdict reflects the benign signal."
          verification_method: "automated"
      acceptance_criteria:
        - "Phrase signal flows through the inference engine."

    - case_id: "VT-161-TC-028"
      case_name: "Inventories are non-empty"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert len() > 0 for MALIGNANCY_READ_CODES, BENIGN_EXPLANATION_READ_CODES, FAST_TRACK_REFERRAL_READ_CODES, BENIGN_INVESTIGATION_PHRASES, LETTER_STUB_PATTERNS."
          expected_result: "All inventories populated."
          verification_method: "automated"
      acceptance_criteria:
        - "Module loads with a complete inventory set."

    - case_id: "VT-161-TC-029"
      case_name: "Helpers do not match unrelated CTV3 codes"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call find_malignancy_code on text containing 'XaABC' (not in inventory)."
          expected_result: "Returns None."
          verification_method: "automated"
      acceptance_criteria:
        - "Inventory lookup is closed-set."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-161/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-161-EXEC-001"
      executed_by: "automated_pytest"
      executed_date: "2026-04-17"
      result: "pass"
      command: "python -m pytest tests/test_stale_detector_fixes.py -v"
      total_cases: 29
      passed: 29
      failed: 0
      notes: >
        29/29 tests passed. The wipe-and-rebuild orchestration script
        (scripts/_wipe_episodes_and_rebuild.py) was executed against the
        live patient corpus on the same day: total EpisodeOfCare nodes
        went from 518 to 360 (phantom and merged duplicates resolved),
        stale_post_specialist + stale_no_diagnosis distinct patients
        dropped from 36 to 6 (well below the <=12 acceptance threshold),
        and benign-closure patient count rose from 41 to 81
        (>=25 increase met). Three of the four named confirmed-cancer
        deep-read patients (4709023328, 6220044894, 7039607018) now
        carry diagnosis_confirmed milestones; the fourth (4300102074)
        was correctly classified by the benign-exclusion path on a
        co-located benign code and is queued for HITL spot-check under
        R-LEO-AI-163.
