# -- VT-LEO-AI-176 -- Referral rejection / resubmission detection
# IEC 62304 Verification Test

- id: "VT-LEO-AI-176"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-182"]
    risks: ["R-LEO-AI-097"]

  metadata:
    title: "Detect 2WW referral rejection and resubmission as auditable events"
    description: >
      Verifies that the anchor detector classifies referral lifecycle
      events (rejection, marked-in-error, resubmission) as referral
      anchors with correct referral_subtype, rejects unrelated
      occurrences of the same tokens (transplant rejection, lab
      sample resubmission, BP value Marked-in-Error), and does not
      regress the existing PRISM and text_generic referral subtypes.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_anchor_detector.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-176-TC-001"
      case_name: "Choose and book rejection emits referral_subtype='rejected'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on an encounter whose text
            contains "Choose and book referral rejected by service
            provider".
          expected_result: >
            Returns one referral anchor with
            referral_subtype='rejected' and confidence >= 0.9.
          verification_method: "automated"
      acceptance_criteria:
        - "len(referrals) == 1"
        - "referrals[0]['referral_subtype'] == 'rejected'"

    - case_id: "VT-176-TC-002"
      case_name: "Referral Marked-in-Error emits referral_subtype='rejected'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on text containing both
            "Hospital Fast track referral for suspected breast cancer
            Marked in Error" and "e-Referral Service Referral Marked
            in Error".
          expected_result: "One referral anchor, subtype 'rejected'."
          verification_method: "automated"
      acceptance_criteria:
        - "len(referrals) == 1"
        - "referrals[0]['referral_subtype'] == 'rejected'"

    - case_id: "VT-176-TC-003"
      case_name: "Resubmission with referral context emits 'resubmitted'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on text containing both a
            referral phrase and an "amended referral sent" phrase.
          expected_result: "One referral anchor, subtype 'resubmitted'."
          verification_method: "automated"
      acceptance_criteria:
        - "len(referrals) == 1"
        - "referrals[0]['referral_subtype'] == 'resubmitted'"

    - case_id: "VT-176-TC-004"
      case_name: "Rejection encounter does not emit diagnosis or benign_closure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on a rejection encounter
            whose text also names "fast track referral for suspected
            colorectal cancer".
          expected_result: >
            One referral anchor (rejected); diagnoses == []; benigns
            == [].
          verification_method: "automated"
      acceptance_criteria:
        - "diagnoses == []"
        - "benign_closures == []"

    - case_id: "VT-176-TC-005"
      case_name: "Vanilla 2WW referral still text_generic (regression)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on plain "Fast track
            referral for suspected breast cancer (XaMeC)".
          expected_result: "One referral anchor, subtype 'text_generic'."
          verification_method: "automated"
      acceptance_criteria:
        - "referrals[0]['referral_subtype'] == 'text_generic'"

    - case_id: "VT-176-TC-006"
      case_name: "PRISM proforma referral still 'prism' (regression)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on a finalised PRISM 2WW
            Lung questionnaire encounter.
          expected_result: "One referral anchor, subtype 'prism'."
          verification_method: "automated"
      acceptance_criteria:
        - "referrals[0]['referral_subtype'] == 'prism'"

    - case_id: "VT-176-TC-007"
      case_name: "Negative: 'rejection' in transplant context does not match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on text "Patient discussed:
            no signs of transplant rejection."
          expected_result: "Zero referral anchors."
          verification_method: "automated"
      acceptance_criteria:
        - "referrals == []"

    - case_id: "VT-176-TC-008"
      case_name: "Negative: 'resubmitted' in lab context does not match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on text "Sample was
            resubmitted to the lab for re-analysis."
          expected_result: "Zero referral anchors."
          verification_method: "automated"
      acceptance_criteria:
        - "referrals == []"

    - case_id: "VT-176-TC-009"
      case_name: "Negative: 'Marked in Error' on a BP value does not match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run _classify_text_encounters on text "Blood pressure
            140/90 - Marked in Error: Amended data".
          expected_result: "Zero referral anchors."
          verification_method: "automated"
      acceptance_criteria:
        - "referrals == []"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-176/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_date: "2026-04-17"
      executor: "automated pytest CI"
      commit: "HEAD (referral-rejection-detection branch)"
      command: >
        PYTHONPATH=. python -m pytest
        tests/test_anchor_detector.py::TestReferralRejectionAndResubmission
        -v
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      evidence_path: >
        /evidence-bundles/LEO-AI/verification/VT-LEO-AI-176/
        2026-04-17-pytest-referral-rejection.log
      notes: >
        Pattern-level tests, not patient-specific. Negative-pattern
        cases gate the rejection / resubmission / Marked-in-Error
        regexes against false positives from transplant medicine,
        lab workflow, and observation correction. PRISM and
        text_generic regression tests pin existing subtypes.
