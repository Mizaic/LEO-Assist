# -- R-LEO-AI-110 -- Pathway editor configurator wiring could mis-handle
#                    unsaved work or silently mis-edit a condition rule
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-110"
  title: >
    Wiring the dirty guard, load-error surface, and ConditionRuleBuilder
    into the pathway editor could regress save semantics, leak unsaved
    work, or let a condition rule be edited without an explicit save.

  hazard:
    description: >
      A change to (a) the orchestrator's load handler, (b) the introduction
      of a beforeunload listener tied to a derived "dirty" boolean, and
      (c) wiring an existing ConditionRuleBuilder primitive into the
      wizard's Settings step could regress the FHIR PUT payload, leave
      the beforeunload listener stuck on after a successful save, or let
      condition rules be persisted into nodeConfigs without ever flowing
      onto the canvas node's data.
    category: "clinical_safety"

  hazardous_situation: >
    A QA-RA lead edits a clinical pathway's condition node, the rule
    appears to update in the UI but is not reflected on the canvas / not
    serialised on save; OR they navigate away with unsaved work and the
    beforeunload prompt does not fire; OR they hit a transient network
    error loading the plan, see no message because the catch was silently
    swallowed before but now mis-renders an empty canvas as if the plan
    were genuinely empty.

  harm:
    description: >
      A live clinical pathway runs with the wrong branch logic, or an
      operator overwrites a fresh edit with a stale baseline, or a
      published pathway gets blanked out because the load failure was
      mis-interpreted as an empty plan.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        ConditionRuleBuilder is wired through the existing
        updateParam("rules", ...) / updateParam("defaultPort", ...) API,
        which preserves all other params and triggers the same
        useEffect-driven sync to handleConfigSave that every other
        wizard field uses. handleConfigSave already propagates rules
        and defaultPort onto the canvas node's data, so editing a rule
        flows from wizard -> nodeConfigs -> canvas data without a new
        code path.
      implemented_by: ["DI-LEO-AI-159"]
      verified_by: ["VT-LEO-AI-157"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        useDirtyGuard captures its baseline only after planLoaded flips
        true, so a freshly loaded plan starts dirty=false. After every
        successful PUT /fhir/PlanDefinition/:id the orchestrator calls
        markSaved() so the baseline advances atomically. The
        beforeunload handler is registered via useEffect's cleanup so
        it is removed the moment dirty becomes false.
      implemented_by: ["DI-LEO-AI-159"]
      verified_by: ["VT-LEO-AI-157"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        PathwayLoadError replaces the silent catch handler. The handler
        now sets loadError to error.message (or a plain-English fallback)
        and renders a visible alert above the canvas. The retry button
        re-runs the loader by incrementing loadAttempt rather than
        reloading the page so existing in-memory edits are preserved.
      implemented_by: ["DI-LEO-AI-159"]
      verified_by: ["VT-LEO-AI-157"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Each control sits on an existing tested code path: ConditionRuleBuilder
      is unchanged and reuses the same updateParam plumbing as every other
      wizard field; useDirtyGuard is additive and never blocks a save;
      the load error surface is read-only above the canvas. A static-source
      VT (VT-LEO-AI-157) gates the wiring with 12 assertions so future
      regressions (e.g. someone re-introducing the silent catch, or
      removing the dirty guard) are caught in CI.

  monitoring:
    monitoring_plan: >
      Track (a) Sentry/console error reports referencing the FHIR
      PlanDefinition GET, (b) user reports of "I lost my work" or
      "rules did not save" on the pathway editor, and (c) any new VT
      assertion failures referencing pathway-canvas-configurator.
    metrics:
      - "Number of unhandled errors from /fhir/PlanDefinition/:id GET"
      - "Number of pathway-editor support tickets mentioning unsaved work"
      - "Pass rate of VT-LEO-AI-157 in CI"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Pathway canvas discovery (Phase 6b plan, Q1 + Q2 + load-failure inference)"
    identified_date: "2026-04-16"
    status: "mitigated"
    tags:
      - "wave-e"
      - "phase-6b"
      - "phase-6b-iv"
      - "pathway-editor"
      - "clinical-safety"
