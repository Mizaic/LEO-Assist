  specification:
    title: "OPCS-4 reference data loader, SNOMED -> OPCS-4 map extension, TRUD package wiring, schema, and UI surfacing"
    description: |
      A new loader module ingests the OPCS-4 data files release
      (TRUD pack 10, item 119) and writes OpcsCode nodes with
      title, chapter, block, level and edition, plus IS_A parent
      edges. The existing snomed_map loader gains a third public
      function `load_opcs4_map` that filters the SNOMED simple-map
      refset on refsetId 1126491000000109 and creates
      `(:Concept)-[:MAPS_TO_OPCS4]->(:OpcsCode)` edges using the
      same BatchWriter pattern.

      Surrounding wiring:

        - `file_finder.py` gains an `Opcs4Files` class that locates
          the extracted data files in `external_content/trud-nhs-opcs4/`.
        - `schema.py` gains a constraint on `OpcsCode.code` and an
          index on `OpcsCode.level`.
        - `run_all.py` adds a phase 7 that runs the OPCS-4
          reference data loader and extends phase 2 to call the
          new `load_opcs4_map` against the SNOMED simple map.
        - `trud_sync.py` gains an `opcs4` package entry pointing
          at item 119 with phases {7} (reference data) and a note
          that phase 2 picks up the OPCS-4 map automatically when
          SNOMED is present.
        - `services/api/app/services/trud_sync.py::get_neo4j_counts`
          gains `opcs4_codes` and `opcs4_maps` counts.
        - `services/api/app/models/neo4j_schema.py` updates the
          three TERMINOLOGY_SEARCH variants to also collect
          `opcs.code` and `opcs.title` via an OPTIONAL MATCH on
          `[:MAPS_TO_OPCS4]`.
        - `services/ui/src/lib/types.ts` and `lib/api/legacy.ts`
          gain `opcs4?: string` and `opcs4_term?: string` fields.
        - `services/ui/src/components/TermSearch.tsx` and
          `services/ui/src/app/settings/surface-forms/page.tsx`
          render the OPCS-4 code and title when present.
        - `services/ui/src/app/settings/terminology/page.tsx`
          adds the `opcs4` package card and the `opcs4_codes` /
          `opcs4_maps` stat tiles.

    acceptance_criteria:
      - criterion: "OPCS-4 loader is idempotent on rerun"
        type: "functional"
        measurement: "Test"
        target: "Running the loader twice against the same fixture data produces identical node and edge counts"
      - criterion: "OPCS-4 loader sets titles on bare nodes"
        type: "functional"
        measurement: "Test"
        target: "Pre-seeding the graph with bare OpcsCode nodes (from a SNOMED -> OPCS-4 map run) and running the loader leaves node count unchanged but sets titles"
      - criterion: "load_opcs4_map writes only the OPCS-4 refset"
        type: "functional"
        measurement: "Test"
        target: "Given a fixture simple-map containing CTV3 (refset 900000000000497000) and OPCS-4 (refset 1126491000000109) rows, only the OPCS-4 rows produce MAPS_TO_OPCS4 edges and CTV3 rows continue to produce MAPS_TO_READ edges"
      - criterion: "TRUD package surfaces in the Settings page"
        type: "functional"
        measurement: "Test"
        target: "Settings -- Terminology page renders an `opcs4` PackageCard alongside `snomed`, `dmd`, and `icd10`, and renders the `opcs4_codes` and `opcs4_maps` StatTiles"
      - criterion: "TermSearch surfaces OPCS-4 when present"
        type: "functional"
        measurement: "Test"
        target: "TermSearch row text reads `OPCS-4: H10.1 Endoscopic submucosal resection of lesion of caecum` when an OPCS-4 mapping exists for the SNOMED concept"

