# -- VT-LEO-AI-028 -- Declined/Cancelled Assertion Lifecycle
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-028"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-042"]
    risks: ["R-LEO-AI-001", "R-LEO-AI-026"]
    user_needs: ["UN-LEO-AI-002", "UN-LEO-AI-009"]

  metadata:
    title: "Declined/Cancelled Assertion Lifecycle"
    description: >
      Verifies that 'declined' and 'cancelled' assertion values are correctly
      propagated through every pipeline layer: LLM extractor, schema mapper,
      documents queries (assertion context + patient shortcut gate), tier
      classifier (Tier 3 block), label verifier queuing, extractor contract
      version, and patient timeline query structure.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_assertion_pipeline_fix.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12+ with project dependencies installed"
      - "No Neo4j connection required (unit tests only)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    # -- LLM Extractor (8 tests) --

    - case_id: "VT-028-TC-001"
      case_name: "declined in _VALID_ASSERTIONS"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _VALID_ASSERTIONS from llm_extractor"
          expected_result: "'declined' is present in the frozenset"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "declined is not silently rejected by the LLM extractor"

    - case_id: "VT-028-TC-002"
      case_name: "cancelled in _VALID_ASSERTIONS"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _VALID_ASSERTIONS from llm_extractor"
          expected_result: "'cancelled' is present in the frozenset"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "cancelled is not silently rejected by the LLM extractor"

    - case_id: "VT-028-TC-003"
      case_name: "declined context maps declined=True, negated=False"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Read _ASSERTION_TO_CONTEXT['declined']"
          expected_result: "declined=True, negated=False"
          verification_method: "Assert dict values"
      acceptance_criteria:
        - "Declined events are not treated as negated (absent) events"

    - case_id: "VT-028-TC-004"
      case_name: "cancelled context maps cancelled=True, negated=False"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Read _ASSERTION_TO_CONTEXT['cancelled']"
          expected_result: "cancelled=True, negated=False"
          verification_method: "Assert dict values"
      acceptance_criteria:
        - "Cancelled events are not treated as negated events"

    - case_id: "VT-028-TC-005"
      case_name: "present context has declined=False and cancelled=False"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Read _ASSERTION_TO_CONTEXT['present']"
          expected_result: "declined=False, cancelled=False"
          verification_method: "Assert dict values"
      acceptance_criteria:
        - "Normal present events are not mislabelled as declined or cancelled"

    - case_id: "VT-028-TC-006"
      case_name: "All valid assertions have a context entry"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Iterate _VALID_ASSERTIONS and check each key exists in _ASSERTION_TO_CONTEXT"
          expected_result: "No KeyError; all assertions have a context mapping"
          verification_method: "Assert membership for each"
      acceptance_criteria:
        - "No assertion is left without a context mapping"

    # -- Schema Mapper (5 tests) --

    - case_id: "VT-028-TC-007"
      case_name: "schema_mapper passes declined through"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call map_raw_record with a procedure entity whose assertion is 'declined'"
          expected_result: "Output entity has assertion='declined'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "declined is not coerced to present at the schema mapping layer"

    - case_id: "VT-028-TC-008"
      case_name: "schema_mapper passes cancelled through"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call map_raw_record with a procedure entity whose assertion is 'cancelled'"
          expected_result: "Output entity has assertion='cancelled'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "cancelled is not coerced to present at the schema mapping layer"

    - case_id: "VT-028-TC-009"
      case_name: "Unknown assertion coerced to present"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call map_raw_record with assertion='nonsense_value'"
          expected_result: "Output entity has assertion='present'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "Invalid assertion values are safely normalised to present"

    - case_id: "VT-028-TC-010"
      case_name: "absent passes through schema_mapper"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call map_raw_record with assertion='absent'"
          expected_result: "Output entity has assertion='absent'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "Pre-existing absent assertion is not broken by this change"

    - case_id: "VT-028-TC-011"
      case_name: "hypothetical passes through schema_mapper"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call map_raw_record with assertion='hypothetical'"
          expected_result: "Output entity has assertion='hypothetical'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "Pre-existing hypothetical assertion is not broken by this change"

    # -- Documents Queries (9 tests) --

    - case_id: "VT-028-TC-012"
      case_name: "declined in _NON_PRESENT"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _NON_PRESENT from documents_queries"
          expected_result: "'declined' is in the set"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "declined triggers the non-present branch in write logic"

    - case_id: "VT-028-TC-013"
      case_name: "cancelled in _NON_PRESENT"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _NON_PRESENT from documents_queries"
          expected_result: "'cancelled' is in the set"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "cancelled triggers the non-present branch in write logic"

    - case_id: "VT-028-TC-014"
      case_name: "_assertion_context('declined') correct"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call _assertion_context('declined')"
          expected_result: "Returns dict with assertion='declined', declined=True, negated=False, cancelled=False"
          verification_method: "Assert dict field values"
      acceptance_criteria:
        - "Context dict stored on DOCUMENTS relationship is accurate for declined"

    - case_id: "VT-028-TC-015"
      case_name: "_assertion_context('cancelled') correct"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call _assertion_context('cancelled')"
          expected_result: "Returns dict with assertion='cancelled', cancelled=True, negated=False, declined=False"
          verification_method: "Assert dict field values"
      acceptance_criteria:
        - "Context dict stored on DOCUMENTS relationship is accurate for cancelled"

    - case_id: "VT-028-TC-016"
      case_name: "_assertion_context(None) defaults to present"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call _assertion_context(None)"
          expected_result: "Returns dict with assertion='present'"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "Null assertion safely defaults without error"

    - case_id: "VT-028-TC-017"
      case_name: "Patient shortcut gate uses FOREACH"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Inspect source of _build_upsert_query for FOREACH keyword"
          expected_result: "FOREACH is present in the generated Cypher"
          verification_method: "Assert string presence in source"
      acceptance_criteria:
        - "Patient shortcut relationships are conditionally gated on assertion value"
        - "declined and cancelled events never create HAS_PROCEDURE/HAS_FINDING shortcuts"

    - case_id: "VT-028-TC-018"
      case_name: "GET_PATIENT_CODING_TIMELINE has required fields"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Check GET_PATIENT_CODING_TIMELINE string for required RETURN aliases"
          expected_result: "encounter_date, encounter_id, concept_id, term, semantic_tag, r.context, r.confidence all present"
          verification_method: "Assert string membership"
      acceptance_criteria:
        - "Timeline API returns all fields needed by the PatientTimeline UI component"

    - case_id: "VT-028-TC-019"
      case_name: "GET_PATIENT_CODING_TIMELINE ordered by date ASC"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Check GET_PATIENT_CODING_TIMELINE for ORDER BY e.date"
          expected_result: "String is present"
          verification_method: "Assert string membership"
      acceptance_criteria:
        - "Timeline events are always returned in chronological order"

    # -- Tier Classifier (7 tests) --

    - case_id: "VT-028-TC-020"
      case_name: "declined returns Tier 3 in autonomous mode"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call classify_tier with assertion='declined', coding_mode='autonomous', high score"
          expected_result: "TierDecision.tier == 3"
          verification_method: "Assert tier value"
      acceptance_criteria:
        - "Declined events are never auto-coded in autonomous mode"

    - case_id: "VT-028-TC-021"
      case_name: "declined returns Tier 3 in HITL mode"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call classify_tier with assertion='declined', coding_mode='hitl', high score"
          expected_result: "TierDecision.tier == 3"
          verification_method: "Assert tier value"
      acceptance_criteria:
        - "Declined events enter the review queue, not auto-coding, in HITL mode"

    - case_id: "VT-028-TC-022"
      case_name: "cancelled returns Tier 3 in autonomous mode"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call classify_tier with assertion='cancelled', coding_mode='autonomous', high score"
          expected_result: "TierDecision.tier == 3"
          verification_method: "Assert tier value"
      acceptance_criteria:
        - "Cancelled events are never auto-coded in autonomous mode"

    - case_id: "VT-028-TC-023"
      case_name: "cancelled returns Tier 3 in HITL mode"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call classify_tier with assertion='cancelled', coding_mode='hitl', high score"
          expected_result: "TierDecision.tier == 3"
          verification_method: "Assert tier value"
      acceptance_criteria:
        - "Cancelled events enter the review queue in HITL mode"

    - case_id: "VT-028-TC-024"
      case_name: "declined in _AUTO_CODE_BLOCKED"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _AUTO_CODE_BLOCKED from tier_classifier and check 'declined'"
          expected_result: "'declined' in _AUTO_CODE_BLOCKED"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "Safety gate constant includes declined"

    - case_id: "VT-028-TC-025"
      case_name: "cancelled in _AUTO_CODE_BLOCKED"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _AUTO_CODE_BLOCKED from tier_classifier and check 'cancelled'"
          expected_result: "'cancelled' in _AUTO_CODE_BLOCKED"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "Safety gate constant includes cancelled"

    - case_id: "VT-028-TC-026"
      case_name: "present high-confidence entity is not Tier 3 (regression)"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call classify_tier with assertion='present', score=1.0, surface approved"
          expected_result: "TierDecision.tier != 3"
          verification_method: "Assert tier value"
      acceptance_criteria:
        - "Normal codeable entities are not blocked by the declined/cancelled gate"

    # -- Label Verifier (5 tests) --

    - case_id: "VT-028-TC-027"
      case_name: "label_verifier source contains declined in _AUTO_CODE_BLOCKED"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Inspect label_verifier module source for 'declined' string near _AUTO_CODE_BLOCKED"
          expected_result: "'declined' is present in source"
          verification_method: "Assert string in source"
      acceptance_criteria:
        - "label_verifier cannot auto-approve declined entities"

    - case_id: "VT-028-TC-028"
      case_name: "label_verifier source contains cancelled in _AUTO_CODE_BLOCKED"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Inspect label_verifier module source for 'cancelled' string near _AUTO_CODE_BLOCKED"
          expected_result: "'cancelled' is present in source"
          verification_method: "Assert string in source"
      acceptance_criteria:
        - "label_verifier cannot auto-approve cancelled entities"

    - case_id: "VT-028-TC-029"
      case_name: "_ASSERTION_QUEUE_SET contains declined"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _ASSERTION_QUEUE_SET from label_verifier"
          expected_result: "'declined' in _ASSERTION_QUEUE_SET"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "Declined entities are routed into the human review queue"

    - case_id: "VT-028-TC-030"
      case_name: "_ASSERTION_QUEUE_SET contains cancelled"
      priority: "critical"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _ASSERTION_QUEUE_SET from label_verifier"
          expected_result: "'cancelled' in _ASSERTION_QUEUE_SET"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "Cancelled entities are routed into the human review queue"

    - case_id: "VT-028-TC-031"
      case_name: "_ASSERTION_QUEUE_SET still contains possible (regression)"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import _ASSERTION_QUEUE_SET from label_verifier"
          expected_result: "'possible' in _ASSERTION_QUEUE_SET"
          verification_method: "Assert membership"
      acceptance_criteria:
        - "Pre-existing possible assertion routing is not broken"

    # -- Extractor Contract (2 tests) --

    - case_id: "VT-028-TC-032"
      case_name: "CONTRACT_VERSION is 1.2"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Import CONTRACT_VERSION from extractor_contract"
          expected_result: "Value equals '1.2'"
          verification_method: "Assert equality"
      acceptance_criteria:
        - "Version bump signals assertion schema change to downstream consumers"

    - case_id: "VT-028-TC-033"
      case_name: "ExtractionItem source mentions declined and cancelled"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Inspect ExtractionItem source for 'declined' and 'cancelled'"
          expected_result: "Both strings present in docstring/comment"
          verification_method: "Assert string membership"
      acceptance_criteria:
        - "Assertion enum documentation is accurate and complete"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-028/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-028-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "local"
      result: "pass"
      cases_executed: 36
      cases_passed: 36
      cases_failed: 0
      duration_seconds: 2
      notes: "All 36 tests pass (pytest tests/test_assertion_pipeline_fix.py)"
