# -- VT-LEO-AI-039 -- Training Rules Security Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-039"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-046"]
    risks: ["R-LEO-AI-031", "R-LEO-AI-027"]
    user_needs: []

  metadata:
    title: "Training Router Clinical Rule Security Verification"
    description: >
      Verifies that the training router correctly restricts clinical rule
      mutation to admin users, that user-supplied regex patterns are validated
      for syntax and ReDoS safety before persistence, that ConText rule
      literals are validated for length, and that the audit trail uses the
      session-verified identity (scope.email) rather than any caller-supplied
      value.
    test_level: "unit"
    test_type: "security"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_training_rules_security.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12+ with project dependencies installed"
      - "Neo4j graph calls mocked"
      - "session.run mocked to capture call arguments"
    test_data:
      data_type: "synthetic rule inputs and malicious regex patterns"
      cleanup_required: false

  test_cases:
    - case_id: "VT-039-TC-001"
      case_name: "_validate_regex -- valid pattern accepted without exception"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _validate_regex with r'\\bawaiting appointment\\b'"
          expected_result: "No exception raised"
          verification_method: "pytest.raises not triggered"
      acceptance_criteria:
        - "No HTTPException for a valid, safe pattern"

    - case_id: "VT-039-TC-002"
      case_name: "_validate_regex -- pattern exceeding 200 chars raises HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _validate_regex with a string of 201 'a' characters"
          expected_result: "HTTPException raised with status_code 422"
          verification_method: "pytest.raises(HTTPException) with status_code == 422"
      acceptance_criteria:
        - "HTTPException(422) raised"
        - "detail mentions max_length"

    - case_id: "VT-039-TC-003"
      case_name: "_validate_regex -- syntactically invalid pattern raises HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _validate_regex with r'(unclosed'"
          expected_result: "HTTPException raised with status_code 422"
          verification_method: "pytest.raises(HTTPException)"
      acceptance_criteria:
        - "HTTPException(422) raised"
        - "detail contains 'Invalid regex'"

    - case_id: "VT-039-TC-004"
      case_name: "_validate_regex -- ReDoS pattern (nested quantifier) raises HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _validate_regex with r'^(([a-zA-Z])+.)+[A-Z]([a-zA-Z])+$' (known catastrophic backtracking pattern)"
          expected_result: "HTTPException raised with status_code 422"
          verification_method: "pytest.raises(HTTPException)"
      acceptance_criteria:
        - "HTTPException(422) raised within 2 seconds (subprocess probe times out at 0.5s)"
        - "detail mentions 'catastrophic backtracking'"

    - case_id: "VT-039-TC-005"
      case_name: "_validate_regex -- ReDoS pattern (repeated group) raises HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call _validate_regex with r'^(a+)*b$' (known catastrophic backtracking pattern)"
          expected_result: "HTTPException raised with status_code 422"
          verification_method: "pytest.raises(HTTPException)"
      acceptance_criteria:
        - "HTTPException(422) raised"
        - "detail mentions 'catastrophic backtracking'"

    - case_id: "VT-039-TC-006"
      case_name: "POST /post-processor-rules has require_admin dependency"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect FastAPI router routes for POST /post-processor-rules. Check parameter annotations for Depends(require_admin)."
          expected_result: "require_admin is a Depends in the endpoint signature"
          verification_method: "Inspect route.endpoint signature via inspect.signature()"
      acceptance_criteria:
        - "require_admin found as a Depends parameter in POST /post-processor-rules"

    - case_id: "VT-039-TC-007"
      case_name: "PATCH /post-processor-rules/{rule_id} has require_admin dependency"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect PATCH /post-processor-rules/{rule_id} endpoint for require_admin Depends"
          expected_result: "require_admin present"
          verification_method: "Inspect signature"
      acceptance_criteria:
        - "require_admin found as Depends in PATCH /post-processor-rules/{rule_id}"

    - case_id: "VT-039-TC-008"
      case_name: "POST /context-rules has require_admin dependency"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect POST /context-rules endpoint for require_admin Depends"
          expected_result: "require_admin present"
          verification_method: "Inspect signature"
      acceptance_criteria:
        - "require_admin found as Depends in POST /context-rules"

    - case_id: "VT-039-TC-009"
      case_name: "PATCH /context-rules/{rule_id}/deactivate has require_admin dependency"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect PATCH /context-rules/{rule_id}/deactivate endpoint for require_admin Depends"
          expected_result: "require_admin present"
          verification_method: "Inspect signature"
      acceptance_criteria:
        - "require_admin found as Depends in PATCH /context-rules/{rule_id}/deactivate"

    - case_id: "VT-039-TC-010"
      case_name: "create_context_rule -- empty literal rejected with HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call create_context_rule with body.literal = '   ' (whitespace only)"
          expected_result: "HTTPException(422) raised"
          verification_method: "pytest.raises(HTTPException)"
      acceptance_criteria:
        - "HTTPException(422) raised for empty/whitespace literal"

    - case_id: "VT-039-TC-011"
      case_name: "create_context_rule -- literal > 200 chars rejected with HTTP 422"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call create_context_rule with body.literal of 201 characters"
          expected_result: "HTTPException(422) raised"
          verification_method: "pytest.raises(HTTPException)"
      acceptance_criteria:
        - "HTTPException(422) raised"
        - "detail mentions 200 character limit"

    - case_id: "VT-039-TC-012"
      case_name: "create_context_rule -- created_by derived from scope.email, not body"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock session.run to capture kwargs. Call create_context_rule with scope.email='admin@example.com' and no created_by in body. Assert session.run received created_by='admin@example.com'."
          expected_result: "session.run called with created_by='admin@example.com'"
          verification_method: "Assert captured kwarg"
      acceptance_criteria:
        - "created_by == scope.email in session.run call"
        - "No caller-supplied created_by value used"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-039/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-039-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "local"
      result: "pass"
      cases_executed: 18
      cases_passed: 18
      cases_failed: 0
      duration_seconds: 3
      notes: >
        All 18 tests in test_training_rules_security.py pass. ReDoS probe
        uses subprocess.run (not threading) for reliable OS-level timeout.
        require_admin detection uses inspect.signature() to find Depends
        parameters (not route.dependencies which only captures route-level
        deps). created_by capture mock accepts *args, **kwargs to handle
        positional Cypher query argument.
