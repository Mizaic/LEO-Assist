# -- VT-LEO-AI-218 -- OPCS-4 reference data loader, SNOMED -> OPCS-4 map, and UI surfacing
# IEC 62304 Verification Test

- id: "VT-LEO-AI-218"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-226"
    risks:
      - "R-LEO-AI-210"

  metadata:
    title: "OPCS-4 reference data loader, SNOMED -> OPCS-4 map, and UI surfacing"
    description: >
      Two-layer verification per ui-testing.mdc.

      Layer 1 (pytest): drives the new `load_opcs4` function with
      a fixture data file snippet covering one chapter, one
      category and one 4-character code. Drives the new
      `load_opcs4_map` function with a fixture simple-map snippet
      containing CTV3 and OPCS-4 rows. Verifies idempotent
      MERGE-on-code, IS_A hierarchy, title backfill on pre-existing
      bare nodes, refsetId-based filtering in the map loader, and
      the structured summary log.

      Layer 2 (jest static-source): verifies the Settings --
      Terminology page renders the new OPCS-4 package card and
      stat tiles, and that TermSearch and surface-forms admin
      render the OPCS-4 code and title when present.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/test_opcs4_loader.py"
      - "tests/test_snomed_map_opcs4.py"
      - "services/ui/src/__tests__/settings-terminology-classifications.test.tsx"
      - "services/ui/src/__tests__/term-search-classification-titles.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest + pytest-asyncio"
      - "services/ui jest harness (jest 30 + ts-jest)"
      - "Fixture data file snippet representing one OPCS-4 chapter, category, code"
      - "Fixture simple-map snippet containing both CTV3 (refset 900000000000497000) and OPCS-4 (refset 1126491000000109) rows"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-218-TC-001"
      case_name: "Loader upserts an OpcsCode with title, chapter, block, level, edition"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run load_opcs4 against a fixture covering chapter H, category H10, code H10.1"
          expected_result: "Exactly one MERGE on (:OpcsCode {code: 'H10.1'}) with SET on title, chapter, level='code', edition"
          verification_method: "automated"

    - case_id: "VT-218-TC-002"
      case_name: "OPCS-4 loader is idempotent on rerun"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run loader twice against the same fixture and capture counts after each run"
          expected_result: "Run 2 produces zero new nodes and zero new IS_A edges"
          verification_method: "automated"

    - case_id: "VT-218-TC-003"
      case_name: "OPCS-4 loader backfills titles onto bare nodes left by load_opcs4_map"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Pre-seed the test graph with OpcsCode {code: 'H10.1'} that has no title (mimics SNOMED -> OPCS-4 map output), then run the loader against a fixture covering H10.1"
          expected_result: "Node count is unchanged; the existing node now has title and level='code'"
          verification_method: "automated"

    - case_id: "VT-218-TC-004"
      case_name: "OPCS-4 loader creates IS_A hierarchy code -> category -> chapter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run the loader against a fixture covering chapter H, category H10, code H10.1"
          expected_result: "Cypher MATCH path (H10.1)-[:IS_A]->(H10)-[:IS_A]->(H) returns exactly one row"
          verification_method: "automated"

    - case_id: "VT-218-TC-005"
      case_name: "load_opcs4_map writes only the OPCS-4 refset rows, leaves CTV3 rows untouched"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run load_opcs4_map against a fixture simple-map containing one CTV3 row and one OPCS-4 row, then count [:MAPS_TO_OPCS4] and [:MAPS_TO_READ] edges"
          expected_result: "Exactly one [:MAPS_TO_OPCS4] edge created (for the OPCS-4 refset row); zero [:MAPS_TO_READ] edges created (the CTV3 row is left for load_simple_map)"
          verification_method: "automated"

    - case_id: "VT-218-TC-006"
      case_name: "load_opcs4_map is additive and does not regress load_extended_map or load_simple_map"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source check on services/terminology/scripts/loaders/snomed_map.py"
          expected_result: "MERGE_ICD10_MAP and MERGE_READ_MAP Cypher constants are unchanged from baseline; new MERGE_OPCS4_MAP constant added"
          verification_method: "automated"

    - case_id: "VT-218-TC-007"
      case_name: "Settings -- Terminology page renders an `opcs4` PackageCard alongside SNOMED, dm+d, and ICD-10"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/app/settings/terminology/page.tsx"
          expected_result: "PACKAGE_KEYS literal contains 'opcs4'; the file renders the PackageCard for 'opcs4'"
          verification_method: "automated"

    - case_id: "VT-218-TC-008"
      case_name: "Settings -- Terminology page renders opcs4_codes and opcs4_maps StatTiles"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/app/settings/terminology/page.tsx"
          expected_result: "Neo4jCounts type contains opcs4_codes and opcs4_maps; buildStatTiles returns tiles with id='opcs4-codes' and id='opcs4-maps'"
          verification_method: "automated"

    - case_id: "VT-218-TC-009"
      case_name: "TermSearch renders OPCS-4 alongside SNOMED when present"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source scan of services/ui/src/components/TermSearch.tsx"
          expected_result: "Source contains a render of `r.opcs4` analogous to the existing `r.icd10` render, with optional `r.opcs4_term` title fallback"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-218/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-218-EXEC-2026-04-18-A"
      executed_date: "2026-04-18"
      executor: "automation"
      result: "pass"
      notes: >
        pytest tests/test_opcs4_loader.py: 19/19 passed.
        pytest tests/test_snomed_map_opcs4.py: 3/3 passed.
        Combined run with the ICD-10 suite: 41/41 passed (0.20s).
        Covers code normalisation, level classification, tab and
        multi-space delimited streaming, hierarchy synthesis when
        chapter/category rows are absent, parent-edge dedupe,
        idempotency, title backfill on bare nodes left by
        load_opcs4_map, drift detection, refset filtering on the
        SNOMED -> OPCS-4 simple-map (no leakage to ReadCode), and
        the CTV3 filter regression guard.

        jest --testPathPatterns "settings-terminology-classifications":
        8/8 passed (0.81s). Covers OPCS-4 PACKAGE_KEYS entry,
        Neo4jCounts opcs4_codes / opcs4_maps fields, OPCS-4 stat
        tiles, 2x2 grid layout.

        jest --testPathPatterns "term-search-classification-titles":
        7/7 passed. Covers TermSearch OPCS-4 code+title rendering,
        surface forms OPCS-4 code+title rendering, and
        TermSearchResult / ConceptGroup type contracts.
