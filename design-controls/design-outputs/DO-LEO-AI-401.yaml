# -- DO-LEO-AI-401 -- No-anchor episode rejection (Pattern N1)
# ISO 13485 / IEC 62304 Design Output
#
# NOTE: Moved into the 4xx ID range (alongside DI-401, R-401, VT-401)
# after the parallel ICD-10 / OPCS-4 reference-data session repeatedly
# overwrote / deleted Pattern N1 design-control YAMLs in the 21x-30x
# ranges. See DI-LEO-AI-401 for the full collision history.

- id: "DO-LEO-AI-401"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-401"]
    user_needs: ["UN-LEO-AI-005"]
    risks_addressed: ["R-LEO-AI-401"]
    verification_tests: ["VT-LEO-AI-401"]

  specification:
    title: "Narrative-restatement diagnosis tagging and no-anchor episode rejection"
    description: |
      Pattern N1 protects the EpisodeOfCare graph from phantom
      no-referral episodes built entirely from sick-note and
      "known X cancer" / "history of X cancer" narratives that
      restate an already-known cancer diagnosis.

      The implementation has three coordinated parts:

      1. ``encounter_diagnosis_is_narrative_restatement(text)`` --
         a new helper in ``libs/domains/code_inventories.py`` that
         returns True when the encounter body matches the
         conservative sick-note shape (``_SICK_NOTE_RX``) or the
         conservative known-cancer / PMHx restatement shape
         (``_KNOWN_CANCER_RESTATEMENT_RX``). The site vocabulary
         in the restatement regex is kept in lock-step with
         ``_PROBLEM_HEADER_CANCER_TOKEN_RX`` so we never invent
         new cancer site tokens here.

      2. Anchor tagging -- the diagnosis_confirmed emission path
         in ``services/analysis_worker/app/analyzers/anchor_detector.py``
         calls the helper after diagnosis_source assignment and
         attaches ``is_narrative_restatement: True`` to the anchor
         dict. Tagging is consistent across hard and soft sources
         (problem_list_diagnosis, cancer_follow_up_template,
         adjuvant_therapy_drug, etc.).

      3. Floating-group rejection -- ``_build_diagnosis_led_groups``
         in ``services/analysis_worker/app/analyzers/episode_builder/_grouping.py``
         skips materialising a floating diagnosis-only group (i.e.
         the lookback referral-claim pass found no referral) when
         every anchor in the group carries
         ``is_narrative_restatement: True``. Mixed-anchor groups
         (at least one non-restatement diagnosis) and
         referral-anchored groups are unaffected.

    acceptance_criteria:
      - criterion: "Sick-note tagging"
        type: "functional"
        measurement: "Test"
        target: "VT-401-TC-001/002/003/004 pass"
      - criterion: "Known-cancer narrative tagging"
        type: "functional"
        measurement: "Test"
        target: "VT-401-TC-005/006/007/008/009 pass"
      - criterion: "PMHx restatement tagging"
        type: "functional"
        measurement: "Test"
        target: "VT-401-TC-010/011 pass"
      - criterion: "Inert on fresh diagnosis"
        type: "safety"
        measurement: "Test"
        target: "VT-401-TC-012/013/014 pass (no tagging on genuine diagnosis)"
      - criterion: "Floating restatement-only group suppressed"
        type: "safety"
        measurement: "Test"
        target: "VT-401-TC-018 pass"
      - criterion: "Mixed-anchor floating group preserved"
        type: "safety"
        measurement: "Test"
        target: "VT-401-TC-019 pass"
      - criterion: "Referral-anchored group preserved"
        type: "safety"
        measurement: "Test"
        target: "VT-401-TC-020 pass"
      - criterion: "Patient 4802892365 has exactly one EpisodeOfCare"
        type: "performance"
        measurement: "Wipe-and-rebuild count"
        target: "1 EpisodeOfCare for patient 4802892365 post-rebuild"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "_SICK_NOTE_RX, _KNOWN_CANCER_RESTATEMENT_RX, encounter_diagnosis_is_narrative_restatement"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "diagnosis_confirmed emission path tags anchors with is_narrative_restatement"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_grouping.py"
        description: "_build_diagnosis_led_groups skips floating groups whose anchors are all restatements"
      - artifact_type: "test"
        location: "tests/test_pattern_n1_no_anchor_episode_rejection.py"
        description: "25 unit + integration cases (sick-note, known-cancer, PMHx, inert-on-fresh, floating-group filter, mixed-anchor preservation, referral-anchored preservation)"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 105
      key_functions:
        - "encounter_diagnosis_is_narrative_restatement"
        - "_build_diagnosis_led_groups"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Suppress phantom EpisodeOfCare nodes built from restatement-only diagnoses"
    risk_control_measures:
      - "Conservative regex vocabulary, aligned with existing problem-header cancer tokens"
      - "Inert on referral-anchored episodes -- never suppresses an episode with a real clinical referral"
      - "Inert on mixed groups -- a single fresh diagnosis preserves the group"

  verification_status:
    verification_method: "Test"
    verification_complete: true
