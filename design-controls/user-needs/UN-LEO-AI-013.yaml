# -- UN-LEO-AI-013 -- Role-Based Access Control
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-013"
  title: "System enforces role-based access so no AI output is finalised without authorisation"
  description: |
    All users need role-based access control with four distinct roles --
    builder (configures pipelines and programmes), reviewer (validates AI
    proposals), releaser (approves final audit data for export), and
    operator (manages system infrastructure). The system must enforce that
    no AI-generated output can be finalised without appropriate human
    authorisation through the correct role. Access is authenticated via
    Azure AD / Entra ID with organisation-scoped tenancy.

  stakeholder:
    type: "regulatory"
    role: "Information Governance Lead"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    Regulatory compliance (IEC 62304, ISO 13485, NHS DSPT) requires that
    access to clinical data and approval of audit outputs is restricted to
    authorised personnel. Role separation ensures independent review and
    prevents conflicts of interest in the approval chain.

  benefit: "Regulatory-compliant access control with clear separation of duties across the audit workflow"

  use_case: |
    1. Organisation administrator registers the practice in the system and
       maps staff to roles (builder, reviewer, releaser, operator).
    2. Builder configures a new audit programme and triggers a pipeline run.
    3. Pipeline produces AI-generated coding proposals and analysis results.
    4. Reviewer opens the review queue and validates each proposal, confirming
       or rejecting AI suggestions with documented rationale.
    5. Releaser reviews the validated batch and approves final audit data for
       export.
    6. Operator monitors system health but cannot access patient-level data
       or approve audit outputs.
    7. Any attempt to skip a step or act outside an assigned role is blocked
       and logged.

  current_solution: "Manual access management via shared credentials or basic password protection with no formal role separation"

  pain_points:
    - "No enforced separation of duties in current audit workflows"
    - "Shared credentials make accountability impossible"
    - "No audit trail linking actions to individual users"
    - "Regulatory inspections cannot verify who approved what"

  acceptance_criteria:
    - "System shall authenticate users via Azure AD / Entra ID"
    - "System shall enforce four roles (builder, reviewer, releaser, operator)"
    - "System shall scope access by organisation (multi-tenancy)"
    - "System shall prevent unauthorised role escalation"
    - "System shall log all access and authorisation events"
    - "No AI output shall be finalised without reviewer+releaser approval chain"

  success_metrics:
    - metric: "Authenticated session coverage"
      target: "100% of actions require authenticated session"
      baseline: "Current: no enforced authentication in local tools"
    - metric: "Unauthorised access incidents"
      target: "Zero unauthorised access incidents"
      baseline: "Current: not tracked"
    - metric: "Role assignment audit time"
      target: "<=5 minutes to audit role assignments for an organisation"
      baseline: "Current: manual spreadsheet review, 30+ minutes"

  regulatory_impact: "critical"
  safety_impact: "high"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "NHS Data Security and Protection Toolkit requirements"
    - "ISO 27001 access control requirements"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "NHS DSPT"
    - "ISO 27001"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-020", "DI-LEO-AI-021"]
  validation_tests: ["VAL-LEO-AI-006"]

  tags: ["rbac", "access-control", "security", "cross-cutting", "regulatory"]
