# -- DO-LEO-AI-209 -- Extended narrative-reference guard implementation (Pattern J)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-209"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-212"
    user_needs:
      - "UN-LEO-AI-005"
      - "UN-LEO-AI-006"
    risks_addressed:
      - "R-LEO-AI-200"
    verification_tests:
      - "VT-LEO-AI-204"

  specification:
    title: "Extended narrative-reference guard: was-seen-narrative + clinician-to-clinician clarification"
    description: |
      Extends _RE_NARRATIVE_REFERRAL_REFERENCE with two new
      alternation groups so the C+D narrative suppression in
      _classify_text_encounters covers more real-world follow-up
      shapes:

        - Past-tense seen-narrative:
          "(was|were|has been|had been) seen (by|under|in|at) ...
           (2WW|TWW|fast.?track|clinic|specialist)"
          and the bare form
          "seen (by|under|in|at) ... (2WW|TWW|fast.?track)"

        - Clinician-to-clinician clarification:
          "(write|writing|wrote|letter|email|message)
           (to|back to) (ENT|consultant|specialist|hospital|
           registrar|clinic)"

      Both shapes target true narrative / inter-clinician comms
      that contain referral-shaped tokens but are not new referral
      events. The suppression still requires the absence of any
      structural referral artefact, so a real referral that
      happens to mention "was seen" still fires.

    acceptance_criteria:
      - criterion: "was_seen_by_ent_under_2ww_matches_narrative"
        type: "functional"
        measurement: "Test"
        target: "_RE_NARRATIVE_REFERRAL_REFERENCE matches 'Was seen by ENT under 2ww in Jan.'"
      - criterion: "seen_under_fast_track_clinic_matches_narrative"
        type: "functional"
        measurement: "Test"
        target: "_RE_NARRATIVE_REFERRAL_REFERENCE matches 'Patient seen under fast track clinic last month.'"
      - criterion: "write_to_ent_matches_narrative"
        type: "functional"
        measurement: "Test"
        target: "_RE_NARRATIVE_REFERRAL_REFERENCE matches 'Write to ENT to clarify that polyp requires no FU.'"
      - criterion: "letter_to_consultant_matches_narrative"
        type: "functional"
        measurement: "Test"
        target: "_RE_NARRATIVE_REFERRAL_REFERENCE matches 'Letter to consultant requesting clarification of plan.'"
      - criterion: "active_referral_does_not_match_narrative"
        type: "safety"
        measurement: "Test"
        target: "_RE_STRUCTURAL_REFERRAL still matches 'Outbound referral (XaY59) - Fast track referral for suspected H&N cancer'"
      - criterion: "was_seen_followup_does_not_emit_referral"
        type: "safety"
        measurement: "Test"
        target: "Patient 4842019832-style follow-up encounter ('Was seen by ENT under 2ww in Jan ... Write to ENT to clarify that polyp requires no FU') MUST NOT emit a text_generic referral"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_NARRATIVE_REFERRAL_REFERENCE extended alternations covering was-seen and write-to-clinician shapes"
      - artifact_type: "test_code"
        location: "tests/test_patient_4842019832_patterns.py"
        description: "TestPatternJWasSeenNarrativeGuard (6 cases)"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 20
      key_functions:
        - "_RE_NARRATIVE_REFERRAL_REFERENCE"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Referral subtype classification on uncoded text encounters"
    risk_control_measures:
      - "Suppression is conditional on the absence of structural referral artefacts -- a real referral with these narrative tokens still fires"
      - "Existing C+D narrative alternations are preserved -- this is a strict extension, not a replacement"

  verification_status:
    verification_method: "Test"
    verification_complete: true
