# -- UN-LEO-AI-086 -- Two-click 'Approve as gold' on dry-run rows + per-encounter error weight
# IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-086"
  title: "Approve correct dry-run extractions as gold in two clicks; see per-encounter error impact from the latest canary"
  description: >
    Following UN-LEO-AI-084 reviewers can open a failing dry-run row
    in the gold editor for correction. When the model's extraction
    is already correct, opening the editor just to click 'Verify'
    and close again is unnecessary friction and inflates the
    dataset-curation cost. Equally, when reviewing a list of
    dry-run rows the curator currently has no signal about which
    encounters would move overall model performance most if fixed
    -- they triage by gut. As a curator I need (1) a per-row
    'Approve as gold' action that, after a confirmation modal
    showing every entity, persists the dry-run extraction as a
    verified GoldLabel without ever leaving the page; and (2) a
    per-row 'error weight' badge showing what fraction of the
    latest canary's measured errors this encounter contributes,
    plus a sort that puts the highest-impact encounters at the top.
  stakeholder: "ML engineer / training-data curator / QA-RA reviewer"
  priority: "high"
  rationale: >
    The chart on the Evaluate stage shows aggregate per-entity F1
    only; per-encounter weight is computed inside the canary loop
    and then discarded. Surfacing it turns the dry-run page from a
    flat list into a directed 'fix the encounters that move the
    score most, then verify the easy wins' queue. The two-click
    approve flow keeps the gold dataset honest -- it requires the
    reviewer to read the entity list in a confirmation modal and
    refuses if de-identification dropped or merged entities the
    reviewer never saw, so the audit trail accurately reflects
    what they verified.

  acceptance_criteria:
    - "Every dry-run row (NER-only and full-pipeline) renders a green 'Approve dry-run extraction as gold' icon button next to the existing 'Open in gold editor' button"
    - "Clicking the button opens a confirmation dialog that lists every entity by surface text and label, the encounter id, and a guard reminder to use the editor for any wrong/missing entity"
    - "Confirming the dialog POSTs to /api/training/gold-labels/approve-from-dry-run with expected_entity_count = entities.length; on success the GoldLabel is upserted with source='manual_gold_curated', verified_by=<reviewer email>, and a quality_score of 1.0; the dialog closes and a success message names the encounter"
    - "If de-identification drops or merges any entity (sanitised count != expected_entity_count) the server returns 409 and the UI surfaces a message asking the reviewer to use the editor instead -- nothing is written to gold"
    - "After every dry-run completes the UI calls POST /api/training/per-encounter-weights/lookup with each row's text; the server de-identifies + sha256s and joins to per_document data from the most recent completed canary job"
    - "Each row whose candidate_id appears in that lookup shows an 'error weight X.X%' chip next to the entity count, and a 'Sort by error impact' toggle re-orders the row list by descending error_contribution; rows without canary data sort to the end"
    - "PHI never leaves the server boundary -- the lookup request carries raw text but the server returns only candidate_id-keyed weight data; the approve endpoint always de-identifies before hashing or persisting"
    - "All copy is plain English at reading age 9-11 ('Approve as gold', 'error weight 4.2%', 'Use the pencil to open this row in the editor.')"

  design_inputs:
    - "DI-LEO-AI-205"
    - "DI-LEO-AI-206"
    - "DI-LEO-AI-207"

