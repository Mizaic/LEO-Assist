# -- DO-LEO-AI-145 -- Histology vocabulary expansion in anchor_detector regexes
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-145"
  version: "1.0.0"
  type: "Algorithm"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-149"]
    user_needs: ["UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-102"]
    verification_tests: ["VT-LEO-AI-147"]

  specification:
    title: "Histology-aware _RE_CONFIRMED_CANCER and _RE_NO_CANCER patterns"
    description: |
      Extends the two regex constants in anchor_detector.py that classify
      uncoded encounter text as either confirmed-cancer or benign-closure
      evidence. The expanded confirmed-cancer pattern adds standard
      histology terms (invasive ductal/lobular/carcinoma, adenocarcinoma,
      BCC, SCC, DCIS, LCIS, in-situ, melanoma in-situ, metastatic,
      infiltrating, lymph node involvement), differentiation grades
      (poorly/moderately/well differentiated, high/low grade, grade 1-3),
      and staging notations (Gleason N, T0-4 N0-3 M0-1, stage I-IV[abc],
      FIGO, Dukes A-D, Breslow, Clark level). The expanded benign pattern
      adds standard benign-histology vocabulary (lipoma, fibroadenoma,
      sebaceous/epidermoid cyst, seborrhoeic/actinic keratosis, skin tag,
      acrochordon, dermatofibroma, benign naevus/cyst/polyp/nodule/
      lesion/finding), normal-result phrasing (no malignant cells, no
      atypia, no abnormality detected, normal histology, unremarkable
      findings), reactive findings (inflammatory/reactive change,
      hyperplastic/inflammatory polyp, fibrocystic/cystic change), and
      discharge phrases (discharged back to GP, discharged from clinic,
      reassurance given). Both patterns continue to be applied AFTER the
      _is_referral_enc guard in _classify_text_encounters so referral
      encounters never appear in the diagnosis or benign-closure buckets.

    acceptance_criteria:
      - criterion: "Histology-positive corpus 100% match"
        type: "functional"
        measurement: "Test"
        target: ">= 18 known histology-cancer phrases all match _RE_CONFIRMED_CANCER"
      - criterion: "Suspected / referral corpus 0% false-positive"
        type: "safety"
        measurement: "Test"
        target: ">= 6 referral phrases (PRISM, fast-track, suspected) do NOT match _RE_CONFIRMED_CANCER"
      - criterion: "Benign-histology corpus 100% match"
        type: "functional"
        measurement: "Test"
        target: ">= 18 known benign-histology phrases all match _RE_NO_CANCER"
      - criterion: "Malignant / referral corpus 0% false-positive"
        type: "safety"
        measurement: "Test"
        target: ">= 6 malignant or referral phrases do NOT match _RE_NO_CANCER"
      - criterion: "_classify_text_encounters routing"
        type: "functional"
        measurement: "Test"
        target: "histology-cancer text -> diagnosis bucket (idx 1); benign text -> benign-closure bucket (idx 4); referral text -> NEITHER"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_CONFIRMED_CANCER and _RE_NO_CANCER regex constants"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions: ["_RE_CONFIRMED_CANCER", "_RE_NO_CANCER", "_classify_text_encounters"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Confirmed-cancer text classification (drives diagnosis_confirmed milestone)"
      - "Benign-closure text classification (drives episode end_date and pathway closure)"
    risk_control_measures:
      - "Existing _is_referral_enc guard preserves the invariant that referral encounters never fire diagnosis or benign-closure buckets"
      - "Site-key compatibility checks downstream in episode builder prevent cross-site mis-pairing"

  verification_status:
    verification_method: "Test"
    verification_complete: true
