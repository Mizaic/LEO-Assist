# -- VT-LEO-AI-174 -- Bitmap-backed per-rule diagnose parity and rendering
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-174"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-180"]
    risks: ["R-LEO-AI-175"]

  metadata:
    title: "Per-rule diagnose() agrees with evaluate_patient() and the dialog renders the annotated tree"
    description: >
      Verifies that the diagnostic shown to QA reviewers in the
      Replay Results dialog uses the SAME roaring-bitmap evaluator
      that production uses to fire rules, by exercising both the
      backend diagnose() method and the frontend dialog.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "services/terminology_api/tests/test_guideline_evaluator_diagnose.py"
      - "services/ui/src/__tests__/test-patients-page.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pyroaring installed in the terminology_api venv"
      - "services/ui jest setup with @leo/design-system path mapping"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-174-TC-001"
      case_name: "Young patient with descendant cough code does not fire and the diagnostic agrees"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Mock a v2 rule AND(age>=40, OR(Cough, Dyspnea)) with
            compiled bitmaps that include the SNOMED IS_A descendant
            closure. Patient is 29 with descendant code 161635002.
          expected_result: >
            diagnose().fires == False matches evaluate_patient(); the
            DEMOGRAPHIC leaf is unsatisfied; the OR child is satisfied
            because the patient has a descendant of the Cough concept.
          verification_method: "automated"
      acceptance_criteria:
        - "diagnose() and evaluate_patient() agree on firing decision."
        - "OR child reports matched=True; demographic leaf reports matched=False."

    - case_id: "VT-174-TC-002"
      case_name: "Eligible patient fires the rule and diagnose() agrees"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Same rule and bitmaps as TC-001; patient is 55 with code 161635002."
          expected_result: >
            diagnose().fires == True matches evaluate_patient(); the
            annotated_tree root.matched == True.
          verification_method: "automated"
      acceptance_criteria:
        - "Both endpoints agree on firing for an eligible patient."

    - case_id: "VT-174-TC-003"
      case_name: "Unknown rule_id returns None (UI surfaces a recompile hint)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call diagnose() with a rule_id that is not in the active ruleset."
          expected_result: "diagnose() returns None; the API route returns 404."
          verification_method: "automated"
      acceptance_criteria:
        - "diagnose returns None when the rule is missing from the compiled ruleset."

    - case_id: "VT-174-TC-004"
      case_name: "No active ruleset returns None"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call diagnose() when get_current_ruleset() returns None."
          expected_result: "diagnose() returns None."
          verification_method: "automated"
      acceptance_criteria:
        - "diagnose fails closed when no ruleset is compiled."

    - case_id: "VT-174-TC-005"
      case_name: "AT_LEAST node reports matched_count and threshold"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Build an AT_LEAST 2-of-3 rule, evaluate against a patient
            with one symptom and a patient with two symptoms.
          expected_result: >
            One-symptom diagnose returns matched=False with
            matched_count=1, total_count=3, min=2; two-symptom diagnose
            returns matched=True with matched_count=2.
          verification_method: "automated"
      acceptance_criteria:
        - "AT_LEAST nodes carry matched_count, total_count and min so the UI can render 'M of N satisfied (need K)'."

    - case_id: "VT-174-TC-006"
      case_name: "Missing bitmap marks the node and fails closed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Compile a single-concept rule whose bitmap is absent from Redis."
          expected_result: >
            The CONCEPT leaf in the annotated_tree carries
            missing_bitmap=true and matched=false.
          verification_method: "automated"
      acceptance_criteria:
        - "missing_bitmap is propagated to the UI so the reviewer sees a recompile hint."

    - case_id: "VT-174-TC-007"
      case_name: "Schema-v1 rule synthesises a tree with per-group match status"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Diagnose a v1 rule with applies_to + one ANY criteria_group."
          expected_result: >
            The annotated tree contains DEMOGRAPHIC + CONCEPT_GROUP
            children, each with matched flags consistent with the
            evaluate_patient verdict.
          verification_method: "automated"
      acceptance_criteria:
        - "v1 rules render through the same hierarchical UI."

    - case_id: "VT-174-TC-008"
      case_name: "ReplayResultsDialog calls /diagnose for each regression and renders the annotated tree"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Render the dialog with one regression. Stub fetch to
            return a DiagnoseResponse for AND(age>=40, OR(Cough,
            Dyspnea)).
          expected_result: >
            fetch is called against /api/guidance/test-patients/diagnose
            with rule_id, scope and patient codes; after the response
            resolves the dialog shows 'Each part of the rule', the
            patient codes/age/sex, the recommendation text, and 'M of
            N satisfied' for the OR/AND groups.
          verification_method: "automated"
      acceptance_criteria:
        - "Hierarchical render replaces the legacy flat list."
        - "AT_LEAST/AND/OR counts are visible to the reviewer."

    - case_id: "VT-174-TC-009"
      case_name: "Diagnose endpoint failure surfaces a plain-English recompile hint"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Stub fetch to return 502 with the recompile message."
          expected_result: >
            The dialog surfaces an Alert containing the word
            'recompiled', not a stack trace.
          verification_method: "automated"
      acceptance_criteria:
        - "A failed diagnose call cannot block reviewer triage; the recovery action is named."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-174/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-174-EXEC-2026-04-17-001"
      executed_by: "Rob Smith (CI)"
      executed_at: "2026-04-17T15:35:00Z"
      ruleset_version: "n/a"
      result: "pass"
      summary: >
        7 backend pytest cases (parity v1+v2, AT_LEAST counts, missing
        bitmap, no ruleset, unknown rule) plus 12 jest cases for the
        Replay Results dialog all passed. The full guidance UI suite
        (105/105) also passed.
      commands:
        - "python -m pytest services/terminology_api/tests/test_guideline_evaluator_diagnose.py -v"
        - "npx jest --no-coverage --testPathPatterns 'test-patients-page'"
        - "npx jest --no-coverage --testPathPatterns 'guidance|EditRule'"
      notes: >
        Diagnostic verdict and live evaluate_patient firing decision
        agree across all parity cases. Legacy client-side
        evaluateLogicTree.ts deleted as part of this change.
