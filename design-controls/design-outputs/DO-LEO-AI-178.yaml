# -- DO-LEO-AI-178 -- Encounter timeline scrubber primitive and EncounterTextTab refactor
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-178"
  version: "1.3.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-179"]
    user_needs: ["UN-LEO-AI-077", "UN-LEO-AI-058"]
    risks_addressed: ["R-LEO-AI-174"]
    verification_tests: ["VT-LEO-AI-173"]

  specification:
    title: "Sticky histogram encounter timeline plus EncounterTextTab modular refactor"
    description: |
      Implements DI-LEO-AI-179. Adds a persistent, sticky histogram
      timeline to the Mission Control patient detail Encounter text
      tab, with auto-binning, range zoom, and per-bin popover. Built
      on the modular EncounterTextTab refactor delivered in v1.0.0.

      v1.1.0 update -- histogram + zoom + sticky:
        - Replace the per-encounter dot field with a stacked-bar
          histogram. Each bar represents one bin; bin granularity
          (day | week | month | quarter | year) is auto-selected
          from the visible date range via timelineBins.pickGranularity.
        - Each bar is a vertical stack: linked-to-focused-episode
          count at the base (saturated brand colour), other-encounter
          count above (neutral). Bar height is proportional to the
          bin total relative to the maximum bin total in the visible
          range.
        - Hover / focus a bar reveals an AnimatePresence preview
          card with bin label, total, linked count, and date range.
        - Click a single-encounter bar to jump directly. Click a
          multi-encounter bar to open an AnimatePresence
          TimelineBinPopover listing every encounter in the bin
          (date, coded count, linked badge, 80-char preview); each
          row jumps to its encounter on click. Escape closes the
          popover and returns focus to the bar.
        - The bar containing the active encounter is wrapped in a
          motion.div with layoutId="timeline-active-bin"; transitions
          collapse to {duration: 0} when useMotion().reducedMotion
          is true.
        - A TimelineRangeBrush component renders below the bars: a
          slim overview rail with two draggable handles bound to
          the visible [from, to] range. Dragging a handle (mouse,
          touch, or ArrowLeft/Right when focused) updates the
          visible range, which re-bins the histogram. A "Reset zoom"
          button appears whenever the visible range is narrower than
          the patient's full history.
        - Sticky positioning: the scrubber root uses position:
          sticky; top: 0; with z-index above encounter cards and a
          soft shadow that fades in when the encounter list is
          scrolled, so the timeline remains visible at all times.
        - IntersectionObserver scroll-sync (delivered in v1.0.0)
          continues to feed the active bin from the encounter card
          currently centred in the viewport.

      New modules added in v1.1.0:
        - timelineBins.ts: pure binning utilities (pickGranularity,
          binStart, binNext, binLabel, buildBins).
        - TimelineBinPopover.tsx: popover listing per-bin encounters
          with click-to-jump rows.
        - TimelineRangeBrush.tsx: zoom rail with two draggable
          handles, keyboard-accessible, with role="slider" handles.

      v1.2.0 update -- timeline brush drives the encounter list filter:
        - EncounterTimelineScrubber becomes optionally controlled.
          When the parent passes onVisibleRangeChange, the scrubber
          calls it on every brush drag with (fromMs, toMs), and on
          Reset zoom with (null, null). Internal zoom state is only
          used when the parent does not provide the callback (back-
          compat for any non-EncounterTextTab consumer).
        - EncounterTextTab now owns a `timelineRange` state. When
          set, it filters the encounter cards rendered below to only
          those whose date falls within [fromMs, toMs] via the new
          encounterFilters.applyCommonFilters helper.
        - A "timeline-filter-banner" Alert is rendered above the
          scope chips whenever a timeline filter is active, with a
          Clear control wired back to setTimelineRange(null).
        - jumpToEncounter (used by milestone chips, single-bin clicks
          and popover row clicks) now also clears timelineRange so
          the target card is always visible after a jump.
        - encounterFilters.ts (new) houses applyCommonFilters and
          splitEncounters, both of which are now timeline-range
          aware. encounterTextUtils.tsx exposes inMsRange to back
          the new filter check.
        - useEncounterLoad.ts (new) extracts the patient-encounter
          data hook so EncounterTextTab.tsx stays under its 500 LOC
          ceiling after the new filter wiring is added.

      v1.3.0 update -- stable-bins histogram with focus-window overlay:
        - The histogram is now bin-stable. Bins are computed once
          per render from the patient's FULL date range
          (fullMinMs..fullMaxMs) at a single granularity selected
          by pickGranularity(fullMaxMs - fullMinMs). Brush drags
          no longer re-bin the histogram; only the focus filter
          changes.
        - A second band, "timeline-focus-band", is overlaid on the
          histogram whenever the focus window is narrower than the
          full history. Visually it tracks the brush position so
          the brush rail and the histogram are spatially linked.
        - Bars whose date range falls entirely outside the focus
          window receive data-in-focus="false" and are dimmed
          (opacity ~0.35); they remain present and clickable so
          reviewers can still jump directly to an out-of-focus
          encounter.
        - TimelineRangeBrush gains a draggable focus band between
          the two handles. Mouse-drag pans both ends together
          while preserving window width. Arrow keys (with Shift
          for larger steps) pan the band by 1% / 5% of the full
          range. The band has role="button", a descriptive
          aria-label, tabIndex=0, and clamps against fullMinMs /
          fullMaxMs so it cannot leave the axis.
        - Header copy updated to "Click a bar to jump - drag the
          focus band to filter".

      Carried over from v1.0.0:
        - encounterStyles.ts (TAG_STYLE_MAP and tag helpers).
        - encounterTextUtils.tsx (date / regex / sentence helpers and
          MILESTONE_LABELS).
        - EncounterCodesPanel.tsx (TagLegend + CodesPanel).
        - EncounterCard.tsx (per-encounter card renderer).
        - encounterRecodeProgress.ts (waitForRecodeProgress helper).
        - EncounterTextTab.tsx (state, scope filtering, recode flow,
          milestone chip row, scrubber wiring, IntersectionObserver
          scroll-sync) -- target <= 500 LOC.

    acceptance_criteria:
      - criterion: "Bin granularity selection"
        type: "functional"
        measurement: "Test"
        target: "pickGranularity returns day for <=60d, week for <=180d, month for <=730d, quarter for <=1825d, year otherwise."
      - criterion: "Bin builder counts"
        type: "functional"
        measurement: "Test"
        target: "buildBins returns one bin per granularity step covering [from, to]; per-bin total/linked/other counts match the input encounters."
      - criterion: "Scrubber renders for >= 5 encounters"
        type: "functional"
        measurement: "Test"
        target: "Live-render with 6 encounters shows the histogram; live-render with 4 encounters returns null."
      - criterion: "Stacked-bar segments"
        type: "functional"
        measurement: "Test"
        target: "Each bar exposes data-linked-count and data-other-count attributes whose sum equals data-total-count; segment heights are proportional to those counts."
      - criterion: "Episode window band"
        type: "functional"
        measurement: "Test"
        target: "When referral_date and end_date are present, an element with data-testid='timeline-window-band' is rendered with left/width derived from those dates clipped to the visible range."
      - criterion: "Single-bin jump"
        type: "functional"
        measurement: "Test"
        target: "Clicking a bar with data-total-count='1' calls onJumpToEncounter with that encounter id; no popover opens."
      - criterion: "Multi-bin popover"
        type: "functional"
        measurement: "Test"
        target: "Clicking a bar with data-total-count > 1 opens TimelineBinPopover; each row in the popover calls onJumpToEncounter with its encounter id when clicked; Escape closes the popover."
      - criterion: "Active indicator layoutId"
        type: "functional"
        measurement: "Source inspection"
        target: "Active bar wraps a motion.div with layoutId='timeline-active-bin'."
      - criterion: "Range brush + reset zoom"
        type: "functional"
        measurement: "Test"
        target: "TimelineRangeBrush renders two role='slider' handles; dragging a handle (or ArrowLeft/Right when focused) updates the visible range; a 'Reset zoom' button appears when the visible range is narrower than the full history and restores it on click."
      - criterion: "Sticky positioning"
        type: "functional"
        measurement: "Source inspection"
        target: "Scrubber root style includes position: 'sticky' and top: 0 with z-index above encounter cards."
      - criterion: "Reduced motion"
        type: "safety"
        measurement: "Source inspection"
        target: "Scrubber consumes useMotion() and applies {duration: 0} transitions when reducedMotion is true."
      - criterion: "Keyboard accessibility"
        type: "functional"
        measurement: "Test"
        target: "Each bar is role='button', tabIndex=0, has the prescribed aria-label, responds to Enter/Space; brush handles are role='slider' with aria-valuemin/aria-valuemax/aria-valuenow."
      - criterion: "EncounterTextTab under ceiling"
        type: "functional"
        measurement: "wc -l"
        target: "EncounterTextTab.tsx <= 500 LOC after wiring the new histogram."
      - criterion: "Brush drives the encounter list filter"
        type: "functional"
        measurement: "Test"
        target: "When the brush is dragged narrower than the full history, the visible encounter count drops to those whose date falls within the new [fromMs, toMs] range and a timeline-filter-banner Alert is rendered above the scope chips."
      - criterion: "Banner Clear control restores full list"
        type: "functional"
        measurement: "Test"
        target: "Clicking the Clear button on the timeline-filter-banner Alert removes the banner and restores the encounter list to the full set."
      - criterion: "Jump clears timeline filter"
        type: "functional"
        measurement: "Test"
        target: "Calling jumpToEncounter (via milestone chip, single-bin bar click, or popover row click) clears the timeline filter so the target encounter is always visible."
      - criterion: "Histogram is bin-stable across focus changes"
        type: "functional"
        measurement: "Test"
        target: "Bin count and bin labels remain unchanged when the brush is dragged narrower; bins are computed from buildBins(dated, fullMinMs, fullMaxMs, granularity) and granularity is derived from the full range, never from the focus window."
      - criterion: "Focus band overlaid on the histogram"
        type: "functional"
        measurement: "Test"
        target: "When the focus window is narrower than the full history, an element with data-testid='timeline-focus-band' is rendered on top of the bars; bars outside the window get data-in-focus='false' and dim opacity."
      - criterion: "Draggable focus band pans the window"
        type: "functional"
        measurement: "Test"
        target: "The element with data-testid='timeline-range-band' is keyboard-pannable: ArrowLeft/ArrowRight (with Shift for larger steps) shifts both fromMs and toMs by the same delta while preserving the window width and clamping at fullMinMs / fullMaxMs."

