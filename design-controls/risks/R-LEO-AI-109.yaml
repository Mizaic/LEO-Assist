# -- R-LEO-AI-109 -- Unifying pathway nodes on a shared shell may regress canvas behaviour
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-109"
  title: "Replacing 10 hand-rolled pathway node shells with a shared BaseNode + NodeHandle could regress connection routing, dry-run feedback, or accessibility"

  hazard:
    description: >
      Every pathway node type currently rolls its own border, port
      handles, status indicator, and configure interaction. Phase 6b-iii
      replaces that with shared primitives (BaseNode / NodeHandle /
      NodeStatusStrip / NodeHeader). A subtle regression in those
      primitives - for example, NodeHandle accidentally overriding
      Handle.position, BaseNode swallowing the React Flow click that
      starts a drag, or NodeStatusStrip dropping the halted glow - would
      change how every node behaves on the canvas at once.
    category: "clinical_safety"

  hazardous_situation: >
    A QA / RA lead opens a draft pathway after Phase 6b-iii lands,
    expects to see the red 'halted' glow on a verifier node that fails
    its dry run, but the regression replaces the glow with a generic
    error pip. The lead does not realise the verification gate stopped
    the pipeline and ships the pathway as 'active'. The pathway then
    gates real coding decisions even though its safety check is
    failing on every encounter.

  harm:
    description: >
      A pathway whose verifier is silently broken is allowed to gate
      real coding output. Encounters can be miscoded or downstream
      safety alerts can be missed because the operator did not see
      the halted state on the canvas.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        NodeHandle never overrides position / top / right / transform
        on the inner Handle when those are required by React Flow for
        connection routing; it only adds aria-label, default colour,
        border, and a Tooltip wrapper. The existing handle layout for
        every node is preserved verbatim.
      implemented_by: ["DI-LEO-AI-157"]
      verified_by: ["VT-LEO-AI-155"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        NodeStatusStrip retains all six visual states (running pulse,
        halted glow, queued pip, completed dot+duration, errored dot,
        skipped label) and BaseNode keeps the running / halted border
        animations. The mapping from raw step result to NodeRunStatus
        is centralised in resolveRunStatus() inside ActionNode, the
        only node that consumes the live test trace today.
      implemented_by: ["DI-LEO-AI-157"]
      verified_by: ["VT-LEO-AI-155"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        BaseNode binds onClick + onKeyDown together so a node that is
        mouse-clickable is always also keyboard-operable; aria-labels
        on every Handle preserve screen-reader access. Static-source
        VT asserts no node still uses raw <Handle ... /> JSX or binds
        onDoubleClick to onConfigure.
      implemented_by: ["DI-LEO-AI-157"]
      verified_by: ["VT-LEO-AI-155"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Node data shape is preserved; React Flow node-routing API is
      not touched; status mapping is verified by static source.
      Residual risk reduces further once Phase 6b-vi ships the
      Playwright + axe spec for the editor.

  monitoring:
    monitoring_plan: >
      QA / RA lead drives the editor end-to-end after Phase 6b-iii
      lands - open an existing pathway, drag a connection, configure a
      node by single-click, configure a node by keyboard (Tab + Enter),
      run a dry run that halts on a verifier - before Phase 6b-iv is
      started. Any drift from the expected halted glow / aria
      announcements opens a follow-up DI.
    metrics:
      - "Number of pathway nodes without aria-labelled handles (target: 0)"
      - "Number of node configure interactions requiring double-click (target: 0)"
      - "Halted glow appears on verifier nodes during dry-run (manual visual verification)"
    review_frequency: "Once after Phase 6b-iii lands; quarterly after Phase 6b-vi"

  metadata:
    identified_by: "Pathway canvas discovery (Phase 6b-i)"
    identified_date: "2026-04-16"
    status: "mitigated"
    tags:
      - "pathways"
      - "design-system"
      - "accessibility"
      - "ui-refactor"
