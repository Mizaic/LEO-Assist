# -- R-LEO-AI-080 -- Assistive-technology users cannot perceive navigation state or status information
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-080"
  title: "Users of screen readers, keyboard-only navigation, or colour-blindness aids lose track of which page they are on, cannot activate the LEO logo from the keyboard, or cannot tell status dots apart"

  hazard:
    description: >
      The AppShell does not set aria-current in rail mode, renders
      the LEO logo as an <img> with onClick, and the OrgSelect
      has no associated label. StatusDot conveys status in colour
      only. ConfirmDialog has no aria-describedby. Collectively,
      users relying on assistive technology lose the ability to
      orient themselves and to distinguish critical status
      information during clinical tasks and safety-netting.
    category: "clinical_safety"

  hazardous_situation: >
    A blind clinician using NVDA opens the encounter review page,
    wants to navigate to 'Audit', but the rail drawer does not
    announce which item is the current page. They choose 'Patients'
    instead, operate on the wrong cohort, and approve records
    that belong to the wrong context. Or: a colour-blind coder
    cannot tell apart healthy-green from error-red status dots on
    a pathway dashboard and misses an alert.

  harm:
    description: >
      Clinical decisions made against the wrong cohort; alerts
      missed by users with visual impairment; safety-netting
      confirmations submitted without the user understanding the
      dialog content. All constitute clinical-safety harm with
      potential for delayed or incorrect care.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Set aria-current='page' in AppShell rail and full modes;
        render the logo as a <button> with aria-label; label
        OrgSelect; add aria-labelledby and aria-describedby to
        ConfirmDialog; extend StatusDot to encode status via
        shape and icon in addition to colour.
      implemented_by: ["DI-LEO-AI-120"]
      verified_by: ["VT-LEO-AI-115"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Enable eslint-plugin-jsx-a11y recommended rules in CI;
        run @axe-core/playwright on a representative
        patient-reachable Playwright route; fail CI on any
        critical or serious violation.
      implemented_by: ["DI-LEO-AI-120"]
      verified_by: ["VT-LEO-AI-115"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      After the baseline is enforced in CI, residual risk
      covers screens not yet migrated onto the primitive layer
      (tracked by the redesign wave backlog) and
      non-determinism in axe-core rule coverage. Both are
      actively monitored.

  monitoring:
    monitoring_plan: >
      Monitor per-build axe-core violations. Monthly manual
      screen-reader walkthrough of the AppShell + at least one
      patient-reachable route.
    metrics:
      - "Critical/serious axe violations per build (target 0)"
      - "Screen-reader walkthrough blockers (target 0)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "UX redesign programme 2026-04 AppShell audit"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "accessibility"
      - "app-shell"
      - "wcag"
      - "patient-safety"
