# -- DI-LEO-AI-026 -- Screening Gap Detection
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-026"
  type: "Functional"
  derived_from: ["UN-LEO-AI-018"]
  requirement: "The system SHALL cross-reference patient demographics (age, sex) and clinical history against screening programme eligibility criteria, detect absence of screening participation records, and generate screening gap reports at practice and PCN level"
  rationale: "DES paragraph 28 requires proactive identification of patients not engaged with screening programmes. Automated eligibility matching and gap detection enables targeted outreach to improve screening uptake."

  machine_spec:
    agent_prompt: |
      Implement screening gap detection (~200 LOC).

      SINGLE PURPOSE: Match patient demographics against screening
      eligibility criteria and detect missing participation records.

      REQUIREMENTS:
      1. Load screening programme eligibility criteria (age, sex, conditions)
      2. Match patient demographics against eligibility rules
      3. Check for screening participation records in patient history
      4. Detect gaps where eligible patients lack participation records
      5. Aggregate gap reports at practice and PCN level
      6. Support configurable screening programme definitions

      METHODS:
      - check_eligibility(patient, programme): Test eligibility criteria
      - detect_gaps(patient_cohort, programmes): Find missing screenings
      - aggregate_practice(gaps): Summarise gaps per practice
      - aggregate_pcn(gaps): Summarise gaps per PCN
      - generate_report(aggregations): Structure for output

      CODE CLARITY:
      - Screening programme definitions are data configuration
      - Eligibility rules are composable (age range, sex, exclusion criteria)
      - Gap detection is deterministic and reproducible

    acceptance_criteria:
      - type: "test"
        spec: "Eligibility matching accuracy >= 95% against validated test data"
      - type: "test"
        spec: "All configured screening programmes covered"
      - type: "test"
        spec: "Practice and PCN level aggregations calculated correctly"
      - type: "test"
        spec: "Screening gap reports generated in correct format"

    constraints:
      - type: "safety"
        spec: "No eligible patient excluded from gap detection without logged reason"
      - type: "performance"
        spec: "Full practice screening gap analysis completes in <= 60 seconds"

    dependencies: []

    downstream_impacts:
      - "services/analytics_api -- screening gap metrics served to dashboard"
      - "services/api -- screening reports available for practice teams"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/safety_net_detector.py"
        - "services/analytics_api/app/routers/cohorts.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Eligibility matching accuracy >= 95%; all configured screening programmes covered"
    test_protocol: "VT-LEO-AI-026"

  safety_class: "B"
  risks: ["R-LEO-AI-023"]
  tags: ["screening", "population-health", "des-paragraph-28", "prevention"]
