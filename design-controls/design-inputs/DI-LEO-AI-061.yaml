# -- DI-LEO-AI-061 -- No-code Pathway Builder with Visual PlanDefinition Editor
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-061"
  type: "Functional"
  derived_from: ["UN-LEO-AI-012"]
  requirement: >
    The system SHALL provide a no-code Pathway Builder with a visual
    PlanDefinition editor, enabling users to design and configure
    clinical pathways without writing code, with changes persisted
    as valid FHIR PlanDefinition resources.
  rationale: >
    Clinical pathway design should be accessible to domain experts
    without requiring software development skills. A visual editor
    that emits standards-compliant PlanDefinition enables both
    usability and interoperability.

  machine_spec:
    agent_prompt: |
      Implement no-code Pathway Builder UI with visual PlanDefinition
      editor (~400 LOC).

      SINGLE PURPOSE: Allow users to visually design clinical pathways
      that serialize to FHIR PlanDefinition.

      REQUIREMENTS:
      1. Drag-and-drop node palette for pathway steps.
      2. Visual graph canvas with node connections.
      3. Property panel for ActivityDefinition configuration.
      4. Serialize graph to FHIR PlanDefinition JSON.
      5. Validate output against PlanDefinition schema.
      6. Save/load pathway definitions.

      METHODS:
      - render_canvas(): Display editable graph.
      - add_node(type, config): Add step to pathway.
      - connect_nodes(from, to): Create action relationship.
      - to_plandefinition(): Serialize to FHIR PlanDefinition.
      - validate_plandef(plandef): Schema validation.

    acceptance_criteria:
      - type: "test"
        spec: "Pathway canvas renders and accepts node placement"
      - type: "test"
        spec: "Serialized output validates as FHIR PlanDefinition"
      - type: "test"
        spec: "Saved pathways load correctly"

    constraints:
      - type: "usability"
        spec: "No code required; all configuration via UI"
      - type: "data"
        spec: "Output MUST be valid FHIR R4 PlanDefinition"

    dependencies: ["DI-LEO-AI-060"]

    downstream_impacts:
      - "Pathway Builder UI"
      - "FHIR Workflow Engine"
      - "Pipeline execution"

    technical_details:
      language: "TypeScript"
      framework: "React"
      libraries: ["react-flow", "fhir/r4"]
      file_structure:
        - "services/ui/src/components/pathway/PathwayBuilder.tsx"
        - "services/ui/src/components/pathway/PlanDefinitionEditor.tsx"
        - "services/ui/src/components/pathway/NodePalette.tsx"
        - "libs/fhir/plandefinition_serializer.ts"
      estimated_loc: 400

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Pathway Builder produces valid PlanDefinition; visual editing works correctly"
    test_protocol: "VT-LEO-AI-061"

  safety_class: "B"
  risks: ["R-LEO-AI-015"]
  tags: ["pathway-builder", "no-code", "plandefinition", "visual-editor", "ui"]
