# -- VT-LEO-AI-525 -- Similar-candidates batch dialog highlighter + match rationale chips
# IEC 62304 OQ verification

- id: "VT-LEO-AI-525"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-527"]
    risks:
      - "R-LEO-AI-063"
      - "R-LEO-AI-174"

  metadata:
    title: "SimilarCandidatesBatch dialog shared search relevance"
    description: >
      Static-source verification that the SimilarCandidatesBatch
      dialog renders each similar-candidate row using the shared
      <HighlightedText> primitive and the outlined "why this
      matched" chip row, and that GoldDatasetPanel forwards
      debouncedSearch into the dialog.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/similar-candidates-dialog-search-rationale-chrome.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "jest 30 + ts-jest"
      - "Source files for SimilarCandidatesBatch and GoldDatasetPanel checked in"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-525-TC-001"
      case_name: "Imports the shared encounterRelevance + HighlightedText helpers"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read SimilarCandidatesBatch.tsx and assert imports"
          expected_result: "expandSearchTerms, computeMatchRationale, HighlightedText, collectHighlightTerms all imported from the shared modules"
          verification_method: "automated"
      acceptance_criteria:
        - "Single source of truth for typo / synonym vocabulary"
        - "Same highlighter as /care/encounters and the patient drawer"

    - case_id: "VT-525-TC-002"
      case_name: "Declares optional search prop and memoises expansion"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert `search?: string` on Props and useMemo expand call"
          expected_result: "Both invariants present"
          verification_method: "automated"
      acceptance_criteria:
        - "Expansion is computed once per query change"

    - case_id: "VT-525-TC-003"
      case_name: "Computes per-row matchRationale and highlightTerms"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert computeMatchRationale(item.text, expandedTerms) and collectHighlightTerms(search, matchRationale.hitTerms) are called per row"
          expected_result: "Both calls present"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-row rationale enables the chip + highlight wiring"

    - case_id: "VT-525-TC-004"
      case_name: "Wraps row text in <HighlightedText> when terms hit"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert ternary that renders <HighlightedText testId=\"similar-candidate-row-highlight\">"
          expected_result: "Conditional present"
          verification_method: "automated"
      acceptance_criteria:
        - "Falls back to plain truncated string when no terms hit"

    - case_id: "VT-525-TC-005"
      case_name: "Renders rationale chip row with stable testids and 4-chip cap"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert data-testid container, data-testid per chip, slice(0, 4), variant=outlined, height 20, fontSize 0.65rem"
          expected_result: "All structural invariants present"
          verification_method: "automated"
      acceptance_criteria:
        - "Same chip token as the dry-run review queue and the drawer"

    - case_id: "VT-525-TC-006"
      case_name: "Only renders rationale block when expanded > 0 AND hits > 0"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert const showRationale = expandedTerms.length > 0 && matchRationale.hitTerms.length > 0; and conditional render"
          expected_result: "Both present"
          verification_method: "automated"
      acceptance_criteria:
        - "Empty / mismatched queries do not pollute the row with empty chip rows"

    - case_id: "VT-525-TC-007"
      case_name: "GoldDatasetPanel forwards debouncedSearch"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert <SimilarCandidatesBatch ... search={debouncedSearch}>"
          expected_result: "Prop wired"
          verification_method: "automated"
      acceptance_criteria:
        - "Dialog and host page show chips for the same query"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-525/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-525-RUN-001"
      executed_at: "2026-04-19T07:30:00Z"
      executor: "automated"
      result: "pass"
      notes: "7/7 test cases pass via `npx jest --testPathPatterns 'similar-candidates-dialog-search-rationale-chrome' --no-coverage` in 0.52s. Static-source confirms shared imports, optional search prop, memoised expansion, per-row rationale + highlight, conditional <HighlightedText>, chip row + 4-chip cap with the standard token, and GoldDatasetPanel pass-through."
