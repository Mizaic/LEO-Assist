# -- R-LEO-AI-188 -- Auto-prune masks systemic LLM extractor regression
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-188"
  title: "Auto-prune deletes the only evidence of an LLM extractor regression before a human can investigate"

  hazard:
    description: >
      A new prompt or model version causes the LLM extractor to
      produce systematically un-codable spans (e.g. all candidates
      from one site or one document type fail validation). Auto-prune
      silently deletes them, removing the failure pattern from the
      HITL queue before a curator notices the regression.
    category: "data_protection"

  hazardous_situation: >
    A pipeline release ships a regressed extraction prompt overnight.
    The next morning a curator runs auto-prune to clear the backlog;
    every regressed candidate scores below the floor and is deleted.
    The only surviving evidence is in the API audit log, which is
    not surfaced in the UI.

  harm:
    description: >
      Loss of the diagnostic signal needed to identify and roll back
      the regressed extraction prompt. Knock-on effect: the same
      regressed prompt continues to run in production, dropping
      training quality further until someone notices via NER F1
      drift.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 4
    rpn: 16
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        The preview endpoint and dialog group candidates by verdict
        and surface the rejection reason for each, so a sudden spike
        in 'tag_mismatch_all' or 'no_candidates' rejections becomes
        visible to the curator before they confirm deletion.
      implemented_by: ["DI-LEO-AI-196", "DI-LEO-AI-197"]
      verified_by: ["VT-LEO-AI-182", "VT-LEO-AI-183"]
      effectiveness: "partially_effective"
    - control_type: "information_for_safety"
      description: >
        Both endpoints emit an INFO log line with the actor email,
        confidence floors, and per-verdict counts. Operations are
        responsible for alerting on a sudden spike in deleted_total
        (see monitoring).
      implemented_by: ["DI-LEO-AI-196"]
      verified_by: ["VT-LEO-AI-182"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 3
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The grouped preview surfaces the rejection-reason distribution
      to the curator and the audit log lets ops correlate auto-prune
      events with extractor releases. Residual exposure is the
      curator failing to notice a 1-of-N regression in the preview
      grid; this is bounded by the underlying validator already being
      well-calibrated and by the procedural rule that auto-prune
      should not be run on the same day as a pipeline release.

  monitoring:
    monitoring_plan: >
      Alert when the per-call delete count exceeds the rolling 4-week
      median by more than 2 sigma; correlate with the most recent
      extractor or prompt release. Add a paired-run check against
      tests/test_pipeline_parity.py before any model promotion.
    metrics:
      - "candidate_prune_deleted_total (per call, alert threshold)"
      - "candidate_prune_rejection_reason_breakdown (per call)"
      - "pipeline_extractor_release_timestamp"
    review_frequency: "Per pipeline release"

  metadata:
    identified_by: "Auto-prune design review 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "training-data-quality"
      - "extractor-regression"
      - "auto-prune"
