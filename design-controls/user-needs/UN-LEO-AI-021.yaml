# -- UN-LEO-AI-021 -- Security and Data Protection
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-021"
  title: "System protects patient data with encryption, authentication, and authorisation controls"
  description: |
    Data protection officers need the system to protect patient data with
    encryption at rest and in transit, strong authentication via Azure AD /
    Entra ID, granular authorisation controls, and compliance with NHS Data
    Security and Protection Toolkit (DSPT) requirements. The system must
    support data residency within UK geography, implement least-privilege
    access, and provide security monitoring and incident response capabilities.

  stakeholder:
    type: "regulatory"
    role: "Data Protection Officer"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    Patient clinical data is among the most sensitive personal data under UK
    GDPR and NHS information governance frameworks. A breach of clinical audit
    data could expose thousands of patients' health records. Security controls
    must meet or exceed NHS DSPT standards to maintain data processing
    agreements with GP practices.

  benefit: "NHS DSPT-compliant security posture protecting patient clinical data across all system components"

  use_case: |
    1. Data protection officer reviews the platform security architecture
       during a data processing impact assessment (DPIA).
    2. Officer verifies that all data at rest is encrypted using AES-256 or
       equivalent by checking Azure resource configurations.
    3. Officer confirms that all API endpoints enforce TLS 1.2 or higher by
       reviewing infrastructure-as-code definitions.
    4. Officer tests authentication by attempting to access a protected
       endpoint without a valid Azure AD / Entra ID token and confirms the
       request is rejected with HTTP 401.
    5. Officer reviews role-based access control (RBAC) configuration to
       confirm least-privilege access -- an auditor cannot access admin
       endpoints.
    6. Officer checks the security event log to verify that failed login
       attempts and privilege escalation attempts are recorded.
    7. Officer signs off the DPIA confirming NHS DSPT compliance.

  current_solution: "Ad hoc security controls with no formal compliance framework or centralised monitoring"

  pain_points:
    - "No centralised view of encryption coverage across all system components"
    - "Authentication and authorisation rules are inconsistent across services"
    - "Security event logging is incomplete, making incident investigation difficult"
    - "UK data residency is not enforced at the infrastructure level"

  acceptance_criteria:
    - "System shall encrypt data at rest using AES-256 or equivalent"
    - "System shall encrypt data in transit using TLS 1.2 or higher"
    - "System shall authenticate all users via Azure AD / Entra ID"
    - "System shall enforce least-privilege access controls"
    - "System shall store all data within UK geography"
    - "System shall provide security event logging and monitoring"
    - "System shall support security incident response procedures"

  success_metrics:
    - metric: "Data breaches"
      target: "Zero"
      baseline: "N/A -- new system"
    - metric: "NHS DSPT compliance score"
      target: "100%"
      baseline: "N/A -- new system"
    - metric: "Encryption coverage"
      target: "100% of data at rest and in transit"
      baseline: "N/A -- new system"

  regulatory_impact: "critical"
  safety_impact: "high"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 4.1"
    - "UK GDPR Article 32 -- Security of processing"
    - "NHS Data Security and Protection Toolkit requirements"
    - "ISO 27001 Annex A controls"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "UK GDPR"
    - "NHS DSPT"
    - "ISO 27001"
    - "IEC 81001-5-1"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-020", "DI-LEO-AI-030"]
  validation_tests: ["VAL-LEO-AI-006"]

  tags: ["security", "encryption", "nhs-dspt", "gdpr", "data-protection"]
