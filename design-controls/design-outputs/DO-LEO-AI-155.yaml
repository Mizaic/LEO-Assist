        - "ConditionRuleBuilder (consumed)"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Surfacing failed plan loads so an operator never edits a stale or empty canvas without realising it."
      - "Warning the operator before they navigate away from unsaved changes (preventing silent loss of authoring work on a clinical pathway)."
    risk_control_measures:
      - "useDirtyGuard installs beforeunload while dirty so closing the tab triggers the browser's native prompt."
      - "PathwayLoadError replaces the silent catch with an explicit error message + retry."
      - "ConditionRuleBuilder is reachable from a guarded branch inside the wizard, never from a free-floating dialog, so condition-only edits cannot accidentally clobber other params."

