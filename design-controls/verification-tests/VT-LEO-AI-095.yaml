- id: "VT-LEO-AI-095"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-095"]
    risks: ["R-LEO-AI-063"]

  metadata:
    title: "Bulk Reset and Reprocess - Runtime Guard Verification"
    description: >
      Verifies preview counts, destructive confirmation gates, and successful
      queue dispatch for the admin bulk reset-and-reprocess flow.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/api/tests/test_pipeline_router_runtime.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-095-TC-001"
      case_name: "Preview returns scoped counts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call run_all_patients with preview=true and org_id"
          expected_result: "Response includes preview=true, patient_count, and encounter_count"
      verification_method: "automated"
      acceptance_criteria:
        - "patient_count > 0 for non-empty mocked scope"
        - "encounter_count matches expanded encounter job count"

    - case_id: "VT-095-TC-002"
      case_name: "Execution rejected without confirmation gates"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call run_all_patients with preview=false and missing acknowledgements"
          expected_result: "HTTPException 400 is raised"
      verification_method: "automated"
      acceptance_criteria:
        - "No queue dispatch occurs when confirmation requirements are missing"

    - case_id: "VT-095-TC-003"
      case_name: "Execution queues jobs when all confirmations are valid"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call run_all_patients with preview=false, all acknowledgements true, exact confirmation text, and expected_patient_count"
          expected_result: "Queued count is returned and progress stream path is provided"
      verification_method: "automated"
      acceptance_criteria:
        - "queued equals mocked encounter job count"
        - "stream_path starts with /api/pipeline/progress/"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-095/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-095-RUN-001"
      date: "2026-04-10"
      executor: "automated (pytest)"
      environment: "development"
      result: "pass"
      passed_cases: 3
      failed_cases: 0
      notes: >
        services/api/tests/test_pipeline_router_runtime.py executed for bulk
        reset-and-reprocess guardrails. 7 total tests passed, including all
        VT-095 critical cases for preview, confirmation rejection, and queue
        success behaviour.
