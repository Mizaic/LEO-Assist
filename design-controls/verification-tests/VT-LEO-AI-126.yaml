# -- VT-LEO-AI-126 -- @leo/design-system package resolution
# IEC 62304 Verification Test

- id: "VT-LEO-AI-126"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-130"]
    risks: []

  metadata:
    title: "@leo/design-system package is resolvable from services/ui"
    description: >
      Verifies that the root workspaces manifest, the
      services/design-system package, the Next transpilePackages
      entry, and the TypeScript path alias all wire together so that
      services/ui can import tokens from @leo/design-system.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/design-system-resolution.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "npm install has been run at the repo root"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-126-TC-001"
      case_name: "Tokens barrel export"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "import { tokens } from '@leo/design-system'"
          expected_result: "tokens object exposes spacing, radius, color, typography, motion, density"
      verification_method: "automated"
      acceptance_criteria:
        - "tokens.spacing.md === 16"
        - "tokens.radius.md === 12"
        - "tokens.motion.default.duration === 180"

    - case_id: "VT-126-TC-002"
      case_name: "Role navMap barrel export"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "import { roleNavMap } from '@leo/design-system'"
          expected_result: "roleNavMap keyed by the four canonical roles"
      verification_method: "automated"
      acceptance_criteria:
        - "Object.keys(roleNavMap).sort() === ['clinician', 'platform_admin', 'qa_ra_lead', 'staff']"
        - "Each role has { landing: string, primary: NavItem[], advanced: NavItem[] }"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-126/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-126-EXEC-001"
