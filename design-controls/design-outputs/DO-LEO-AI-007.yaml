# -- DO-LEO-AI-007 -- Anchor Detection and Episode Builder
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-007"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-009", "DI-LEO-AI-010", "DI-LEO-AI-011"]
    user_needs: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-021"]
    verification_tests: ["VT-LEO-AI-007"]
    validation_tests: []

  specification:
    title: "Anchor Detection and Episode Builder"
    description: |
      Detects anchor events in coded encounter data and groups related
      clinical events into longitudinal episodes of care. Anchor detection
      identifies index events (e.g. new diagnosis, acute presentation) that
      start episodes. The episode builder then gathers follow-up encounters,
      investigations, and actions into coherent care episodes. A consolidator
      merges overlapping or duplicate episodes.
    purpose: "Structure coded clinical data into episodes of care to support quality analysis, safety-netting, and narrative generation"
    technical_approach: "Rule-based anchor detection with LLM-assisted episode boundary resolution, temporal grouping, and overlap consolidation"
    acceptance_criteria:
      - criterion: "Anchor detection accuracy on gold-standard data"
        type: "functional"
        measurement: "Precision and recall against labelled anchor events"
        target: ">= 0.85 F1"
      - criterion: "Episode completeness -- no orphaned events"
        type: "functional"
        measurement: "Coverage check across all coded events"
        target: ">= 95% of events assigned to an episode"
      - criterion: "Episode building completes within time limit"
        type: "performance"
        measurement: "Wall-clock timing per patient"
        target: "<= 5 seconds per patient"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "Detects anchor events that initiate clinical episodes"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder.py"
        description: "Groups related events into longitudinal episodes of care"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_consolidator.py"
        description: "Merges overlapping or duplicate episodes"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/episode_builder_v1.py"
        description: "LLM prompt templates for episode boundary decisions"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: []

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Anchor event detection", "Episode completeness"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Library code in services/analysis_worker; runs inside pipeline-worker container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
