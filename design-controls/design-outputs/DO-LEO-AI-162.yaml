# -- DO-LEO-AI-162 -- dq_letter_stub_unfilled MCP safety tool
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-162"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-162"]
    user_needs: ["UN-LEO-AI-054"]
    risks_addressed: ["R-LEO-AI-164"]
    verification_tests: ["VT-LEO-AI-161"]

  specification:
    title: "MCP safety tool: dq_letter_stub_unfilled"
    description: |
      Implements DI-LEO-AI-162. Adds dq_letter_stub_unfilled to the
      neo4j-mcp safety query pack so the DQ team can surface incoming
      specialist-letter stubs filed without body text on patients whose
      episodes are already classified as stale. The tool reuses the
      existing _result envelope and is auto-registered by server.py via
      the dynamic TOOLS scan.

    acceptance_criteria:
      - criterion: "Tool registration"
        type: "functional"
        measurement: "Test"
        target: "Tool name dq_letter_stub_unfilled present in query_pack_safety.TOOLS with category='safety'."
      - criterion: "Stub recognition"
        type: "functional"
        measurement: "Test"
        target: "looks_like_letter_stub returns True for 'Urology to Greenfields Surgery' style text and False for full clinical letters."
      - criterion: "Read-only Cypher"
        type: "safety"
        measurement: "Inspection"
        target: "Tool Cypher contains no MERGE, SET, DELETE, or CREATE clauses."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/neo4j_mcp/tools/query_pack_safety.py"
        description: "dq_letter_stub_unfilled function and TOOLS entry."
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "LETTER_STUB_PATTERNS plus looks_like_letter_stub helper."
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 90
      key_functions:
        - "dq_letter_stub_unfilled"
        - "looks_like_letter_stub"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Surfacing of unfilled letter stubs that would otherwise let cancer pathways age into stale_post_specialist."
    risk_control_measures:
      - "Read-only Cypher: zero side effects on the patient graph."
      - "Snippet truncation prevents accidental over-exposure of letter content."
      - "Tool only fires when the patient has a stale episode, focusing the DQ team on actionable cases."

  verification_status:
    verification_method: "Test"
    verification_complete: true
