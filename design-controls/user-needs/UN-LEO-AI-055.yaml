# -- UN-LEO-AI-055 -- Post-specialist fallback outcome inference
# IEC 62304 User Need

- id: "UN-LEO-AI-055"
  title: "Infer cancer or benign pathway outcome from post-specialist encounter signals"
  description: >
    Quality leads and clinicians reviewing stale_post_specialist episodes need
    the system to scan the 180 days of encounters following a specialist visit
    and determine, from textual signals alone, whether the outcome was likely
    cancer (requiring further action) or benign (pathway complete). Where a
    clear inference can be made it should be stored with a confidence score and
    earliest inferred date so that time-to-outcome milestones can be calculated
    even when no formal SNOMED diagnosis was coded. Where no inference is
    possible the episode must be flagged for human review.
  stakeholder: "quality_manager"
  priority: "high"
  rationale: >
    Approximately 79% of stale_post_specialist episodes contain sufficient
    post-clinic encounter text (discharge letters, pathology notes, prescriptions
    of Efudix/5-FU, excision bookings) to determine the likely outcome without
    waiting for a coded diagnosis. Without this inference the diagnostic interval
    KPI is systematically under-reported and many episodes stay in HITL queues
    indefinitely. An incorrect benign inference is guarded by the confidence
    threshold and mandatory HITL flag for weak verdicts.
  acceptance_criteria:
    - "For episodes with clear post-specialist cancer signals only, inferred_outcome = 'cancer' and inferred_confidence >= 0.65"
    - "For episodes with clear post-specialist benign signals only, inferred_outcome = 'benign' and inferred_confidence >= 0.65"
    - "For episodes with no post-specialist signals, inferred_outcome is null and hitl_flag = true"
    - "inferred_outcome_date is the date of the earliest encounter that fired a signal, not the referral date"
    - "avg_days_to_diagnosis KPI includes inferred cancer outcomes as fallback"
    - "UX shows amber inferred badge with confidence % distinct from green confirmed badge"
  metadata:
    created_date: "2026-04-07"
    status: "draft"
  design_inputs: ["DI-LEO-AI-088"]
