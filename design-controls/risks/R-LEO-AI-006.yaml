# -- R-LEO-AI-006 -- Automation Bias in Human Review
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-006"
  title: "Reviewers develop automation bias and reduce review rigour over time"

  hazard:
    description: "Human reviewers develop over-trust in system accuracy and reduce the thoroughness of their review"
    category: "misuse"

  hazardous_situation: "Reviewers routinely approve AI proposals without adequate scrutiny, allowing systematic errors to pass through the human review gate undetected"

  harm:
    description: "Automation bias undermines the primary safety control (human review), potentially allowing systematic miscoding to enter final audit data"
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "medium"

  mitigation_measures:
    - control_type: "procedural_control"
      description: "Sampling audits of reviewer behaviour to detect approval patterns suggesting reduced rigour"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: "Discordance analysis comparing reviewer decisions against independent re-review"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: "Periodic gold-standard re-review where known-correct items are inserted into the queue"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: "Reviewer training on automation bias awareness and mitigation"
      implemented_by: []
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "low"
    acceptability: "alarp"
    justification: "Automation bias is a known human factors risk that cannot be fully eliminated. Multiple monitoring controls (sampling audits, discordance analysis, gold re-review) detect emerging bias. Reviewer training raises awareness. Risk is as low as reasonably practicable."

  monitoring:
    monitoring_plan: "Monitor reviewer behaviour for signs of automation bias"
    metrics: ["Approval rate per reviewer", "Average review time", "Discordance rate", "Gold re-review accuracy"]
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["clinical-risk", "automation-bias", "human-factors", "safety-critical"]
