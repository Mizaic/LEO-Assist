- id: "VT-LEO-AI-134"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-138"]
    risks: ["R-LEO-AI-095"]

  metadata:
    title: "Unified /work task queue verification"
    description: >
      Verifies the Cypher union, Python service, FastAPI endpoints,
      TaskQueue primitive, and /work page that together implement
      DI-LEO-AI-138.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/test_work_queue.py"
      - "services/ui/src/__tests__/design-system-task-queue.test.tsx"
      - "services/ui/src/__tests__/work-page-integration.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-134-TC-001"
      case_name: "Cypher UNION returns one shape across three sources"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect GET_UNIFIED_WORK_TASKS and COUNT_WORK_TASKS_BY_SOURCE"
          expected_result: >
            Both contain a CALL { ... UNION ... } and return a
            consistent column set: task_id, task_type, severity,
            summary, age_days, resolve_url, patient_id, episode_id.
      verification_method: "automated"
      acceptance_criteria:
        - "Both constants present as strings in work_queue_queries.py"
        - "Each branch returns the same named columns"

    - case_id: "VT-134-TC-002"
      case_name: "Python service normalises rows and builds filters"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call get_work_tasks with stub neo4j session"
          expected_result: >
            Rows from each source are mapped to the common shape; the
            filters dict produces the expected Cypher parameters.
      verification_method: "automated"
      acceptance_criteria:
        - "task_type values are one of coding_review, safety_net_alert, gold_label"
        - "summary field <=160 chars, FK grade <=9"

    - case_id: "VT-134-TC-003"
      case_name: "FastAPI /work/tasks returns tasks and counts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call the router with a stub session and an authed user"
          expected_result: >
            200 OK with body {tasks[], counts_by_source{...}}; filters
            by source accepted; limit/offset honoured.
      verification_method: "automated"
      acceptance_criteria:
        - "Response schema matches; counts consistent with tasks length per source"

    - case_id: "VT-134-TC-004"
      case_name: "TaskQueue primitive renders rows with deep links"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render <TaskQueue tasks={synthetic} /> in jsdom"
          expected_result: >
            Rows render as anchors with href=resolve_url, ordered by
            severity desc then age desc, keyboard navigable.
      verification_method: "automated"
      acceptance_criteria:
        - "Each row has role=listitem and an <a> pointing at resolve_url"

    - case_id: "VT-134-TC-005"
      case_name: "/work page wires TaskQueue to the proxy and shows counts strip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect services/ui/src/app/work/page.tsx"
          expected_result: >
            Page imports TaskQueue, calls /work/tasks, and always
            renders the counts strip above the filter bar.
      verification_method: "automated"
      acceptance_criteria:
        - "page source references /work/tasks, TaskQueue, and counts_by_source"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-134/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-134-2026-04-17-001"
      executed_at: "2026-04-17T00:00:00Z"
      executor: "rob.smith@mizaic.ai"
      environment: "local-dev"
      result: "pass"
      pytest_summary: "11 passed in 0.12s (tests/test_work_queue.py)"
      jest_summary: "10 passed across design-system-task-queue.test.tsx and work-page-integration.test.tsx"
      notes: >
        Backend (TC-001..003) covered by pytest; design-system TaskQueue
        (TC-004) and /work page wiring (TC-005) covered by jest.
