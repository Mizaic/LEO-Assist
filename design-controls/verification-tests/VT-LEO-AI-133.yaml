# -- VT-LEO-AI-133 -- Knowledge tab migration and role-aware copy
# IEC 62304 Verification Test

- id: "VT-LEO-AI-133"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-137"]
    risks: ["R-LEO-AI-094"]

  metadata:
    title: "Knowledge hub migration onto primitives with role-aware copy"
    description: >
      Verifies that every Knowledge tab now renders inside
      KnowledgePageLayout, that KNOWLEDGE_TAB_COPY carries a default
      block plus one block for each of the four canonical roles for all
      8 tabs, and that every default block grades at or below Flesch-
      Kincaid 9.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/knowledge-copy-readability.test.ts"
      - "services/ui/src/__tests__/knowledge-layout-integration.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-133-TC-001"
      case_name: "KNOWLEDGE_TAB_COPY has a complete entry for every tab"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Assert Object.keys(KNOWLEDGE_TAB_COPY) matches the 8 tab
            keys declared in KnowledgePage TABS.
          expected_result: "Exact match; no extra or missing keys"
          verification_method: "automated"
      acceptance_criteria:
        - "Tab keys match TABS exactly"

    - case_id: "VT-133-TC-002"
      case_name: "Every tab carries default + 4 role blocks"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            For each tab in KNOWLEDGE_TAB_COPY, assert the object has
            keys ['default','clinician','staff','qa_ra_lead','platform_admin'].
          expected_result: "All 8 tabs contain all 5 keys"
          verification_method: "automated"
      acceptance_criteria:
        - "Each tab has default + 4 canonical role keys"

    - case_id: "VT-133-TC-003"
      case_name: "Every default block grades <= 9"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Compose the default block's (title + ' ' + lede + ' ' +
            how + ' ' + what) for each tab, then call readingAgeGrade().
          expected_result: "All 8 grades <= 9"
          verification_method: "automated"
      acceptance_criteria:
        - "max(grade) <= 9"

    - case_id: "VT-133-TC-004"
      case_name: "KnowledgePage wraps every tab in KnowledgePageLayout"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Source-level inspection: knowledge/page.tsx imports KnowledgePageLayout and references it inside the JSX for each tab render."
          expected_result: "Layout import present; used in render map."
          verification_method: "automated"
      acceptance_criteria:
        - "KnowledgePageLayout appears in knowledge/page.tsx"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-133/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-133-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-3-knowledge-migration"
      environment: "development"
      result: "pass"
      notes: >
        jest src/__tests__/knowledge-copy-readability.test.ts -> 18
        passed (8 tabs x keys + role coverage + FK grade <= 9 on every
        default block). jest
        src/__tests__/knowledge-layout-integration.test.tsx -> 4 passed
        (KnowledgePageLayout import present, used in JSX, role passed
        through, KNOWLEDGE_TAB_COPY[activeKey] supplied as intro).
        Turbopack dev server: /admin/knowledge -> 200;
        /admin/knowledge?tab=pathways -> 200.
