# -- VT-LEO-AI-013 -- Audit Trail Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-013"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-022"]
    risks: []
    user_needs: ["UN-LEO-AI-014"]

  metadata:
    title: "Audit Trail Verification"
    description: "Verifies that pipeline events emit audit records, review decisions are captured with user identity, and audit records are append-only and immutable."
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_audit_trail.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Audit emitter service running"
      - "FHIR API service running"
      - "Audit event storage available"
    test_data:
      data_type: "synthetic"
      cleanup_required: true

  test_cases:
    - case_id: "VT-013-TC-001"
      case_name: "Pipeline events emit audit records"
      priority: "critical"
      preconditions:
        - "Pipeline orchestrator is running"
        - "Audit emitter is connected to event bus"
      test_steps:
        - step_number: 1
          action: "Trigger a pipeline run for a test patient"
          expected_result: "Pipeline starts and emits events for each step"
          verification_method: "Assert pipeline run ID is returned"
        - step_number: 2
          action: "Wait for pipeline to complete and query audit records"
          expected_result: "Audit records exist for pipeline start, each step, and pipeline completion"
          verification_method: "Assert audit record count matches expected pipeline events"
        - step_number: 3
          action: "Inspect audit record contents"
          expected_result: "Each record contains timestamp, event type, pipeline run ID, and step name"
          verification_method: "Assert required fields are present and non-empty in each record"
      acceptance_criteria:
        - "Every pipeline event produces an audit record"
        - "Audit records contain all required fields"
        - "No pipeline events are missing from the audit trail"

    - case_id: "VT-013-TC-002"
      case_name: "Review decisions emit audit records with identity"
      priority: "critical"
      preconditions:
        - "Pipeline has produced coding suggestions awaiting review"
        - "Test user is authenticated"
      test_steps:
        - step_number: 1
          action: "Accept a coding suggestion as the authenticated user"
          expected_result: "Audit record created for the accept decision"
          verification_method: "Assert audit record exists with action 'accept'"
        - step_number: 2
          action: "Reject a coding suggestion as the authenticated user"
          expected_result: "Audit record created for the reject decision"
          verification_method: "Assert audit record exists with action 'reject'"
        - step_number: 3
          action: "Inspect the identity fields on both audit records"
          expected_result: "Both records contain the authenticated user ID and organisation ID"
          verification_method: "Assert user_id and org_id fields match the test user"
      acceptance_criteria:
        - "Every review decision is recorded in the audit trail"
        - "Audit records include the identity of the user who made the decision"
        - "Decision type (accept/reject) is captured accurately"

    - case_id: "VT-013-TC-003"
      case_name: "Audit records are append-only immutable"
      priority: "critical"
      preconditions:
        - "Existing audit records are present in the store"
      test_steps:
        - step_number: 1
          action: "Attempt to update an existing audit record via the API"
          expected_result: "Update is rejected with HTTP 405 Method Not Allowed or 403 Forbidden"
          verification_method: "Assert response status code is 405 or 403"
        - step_number: 2
          action: "Attempt to delete an existing audit record via the API"
          expected_result: "Delete is rejected with HTTP 405 Method Not Allowed or 403 Forbidden"
          verification_method: "Assert response status code is 405 or 403"
        - step_number: 3
          action: "Verify original audit record is unchanged after attempted modifications"
          expected_result: "Record content matches the original exactly"
          verification_method: "Assert record hash matches the pre-modification hash"
      acceptance_criteria:
        - "Audit records cannot be updated after creation"
        - "Audit records cannot be deleted"
        - "Original record integrity is preserved"

  pass_fail_criteria:
    pass_threshold: "100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-013/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-013-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      duration_seconds: 2
      notes: "All 9 test cases passed (pytest VT-LEO-AI-013)"
