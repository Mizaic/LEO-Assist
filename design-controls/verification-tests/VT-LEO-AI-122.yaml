- id: "VT-LEO-AI-122"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-127"]
    risks: ["R-LEO-AI-087"]

  metadata:
    title: "Safety-net alert persistence + canonical alert_id"
    description: >
      Verifies persist_safety_net_alerts creates SafetyNetAlert nodes
      with Patient (and optional EpisodeOfCare) edges, is idempotent,
      uses a deterministic alert_id, and that the analytics dashboards
      router reads/writes alerts via the canonical alert_id key.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_safety_net_persistence.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-122-TC-001"
      case_name: "persist creates alert and Patient edge"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run persist_safety_net_alerts with one signal"
          expected_result: "MERGE SafetyNetAlert {alert_id} and HAS_SAFETY_NET_ALERT edge issued"
          verification_method: "automated"
      acceptance_criteria:
        - "len(returned alert_ids) == 1"
        - "Query text contains HAS_SAFETY_NET_ALERT and alert_id: $alert_id"

    - case_id: "VT-122-TC-002"
      case_name: "persist links episode when episode_id present"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "persist with signal that carries episode_id"
          expected_result: "FOR_EPISODE MERGE query fired"
          verification_method: "automated"

    - case_id: "VT-122-TC-003"
      case_name: "persist skips episode link when episode_id absent"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "persist with episode_id empty"
          expected_result: "No FOR_EPISODE query"
          verification_method: "automated"

    - case_id: "VT-122-TC-004"
      case_name: "persist is idempotent"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run persist twice with same signal"
          expected_result: "Same alert_id returned both runs"
          verification_method: "automated"

    - case_id: "VT-122-TC-005"
      case_name: "dashboards projection uses alert_id canonical key"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call safety_net_alerts() and inspect query text"
          expected_result: "Contains 'a.alert_id AS id', does not contain 'a.id AS id'"
          verification_method: "automated"

    - case_id: "VT-122-TC-006"
      case_name: "action_css_alert matches alerts via {alert_id: $aid}"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call action_css_alert and inspect every session.run query"
          expected_result: "All MATCH clauses use alert_id, none use {id: $aid}"
          verification_method: "automated"

    - case_id: "VT-122-TC-007"
      case_name: "safety_net subgraph invokes persist_safety_net_alerts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "detect_safety_net patched; invoke subgraph with synthetic state"
          expected_result: "persist_safety_net_alerts called once with detected signals"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-122/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-122-EXEC-20260416-001"
      executed_on: "2026-04-16"
      executed_by: "ci-pytest"
      environment: "local-dev"
      result: "pass"
      total_cases: 11
      passed: 11
      failed: 0
      notes: >
        pytest tests/test_safety_net_persistence.py -v
        11 passed in 1.05s. Covers VT-122-TC-001..TC-007 plus
        helper tests (noop on empty patient_id, derive_alert_id
        stability, preserve-existing). Full test_dashboards.py
        regression also green (20 cases).
