# -- DO-LEO-AI-177 -- Benign-investigation phrase scope guard
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-177"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-178"]
    user_needs: ["UN-LEO-AI-006", "UN-LEO-AI-054"]
    risks_addressed: ["R-LEO-AI-173"]
    verification_tests: ["VT-LEO-AI-172"]

  specification:
    title: "Benign-investigation phrase scope guard"
    description: |
      Implements DI-LEO-AI-178. Closes the day-17 closure bug
      discovered in the 2026-04-17 audit by tightening the gating
      around BENIGN_INVESTIGATION_PHRASES.

      1. libs/domains/code_inventories.py exposes
         BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT (frozenset of phrase
         labels) and CANCER_PATHWAY_CONTEXT_REGEX (precompiled
         re.Pattern). The frozenset names the previously-too-broad
         labels: "no further action", "discharged from care",
         "discharged from clinic".
      2. anchor_detector._classify_text_encounters separates
         _benign_code_hit (always counts) from _benign_phrase_hit
         (gated when its label is in the new frozenset). The gate
         allows the phrase to fire has_no_cancer when the encounter
         has cancer context: a cancer-pathway regex hit,
         match_cancer_site() returns non-None, OR _benign_code_hit
         is also present.

    acceptance_criteria:
      - criterion: "Constants exposed"
        type: "functional"
        measurement: "Test"
        target: "BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT contains 'no further action' and 'discharged from care' and 'discharged from clinic'. CANCER_PATHWAY_CONTEXT_REGEX matches 'cancer', '2WW', 'fast track'."
      - criterion: "CKD encounter regression"
        type: "safety"
        measurement: "Test"
        target: "The verbatim CKD encounter text from patient 4921442355 / 2024-11-18 produces NO benign_closure anchor."
      - criterion: "Tier-1 phrases unchanged"
        type: "functional"
        measurement: "Test"
        target: "An encounter containing only 'mammogram normal' or 'PSA normal no further action' or 'no evidence of malignancy' continues to fire benign_closure."
      - criterion: "Cancer-context override"
        type: "functional"
        measurement: "Test"
        target: "An encounter containing both '2WW skin cancer' and 'discharged from clinic' DOES fire benign_closure (cancer context present)."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT and CANCER_PATHWAY_CONTEXT_REGEX exposed; existing tier-1 / tier-2 phrase definitions remain in BENIGN_INVESTIGATION_PHRASES."
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "Gating logic in _classify_text_encounters split _benign_code_hit (unconditional) from _benign_phrase_hit (gated)."
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Episode benign-closure determination"
    risk_control_measures:
      - "Gate fail-closed: when no cancer context is present, the encounter is silent (no benign_closure)"
      - "Tier-1 phrases unaffected so existing benign-detection precision preserved"
      - "Specific frozenset listing keeps the gated phrases auditable"

  verification_status:
    verification_method: "Test"
    verification_complete: false
