# -- DO-LEO-AI-154 -- Spancat suggester capacity bump
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-154"
  version: "1.0.0"
  type: "Configuration"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-158"]
    user_needs: ["UN-LEO-AI-073"]
    risks_addressed: ["R-LEO-AI-161"]
    verification_tests: ["VT-LEO-AI-156"]

  specification:
    title: "Spancat ngram_range_suggester max_size raised from 10 to 24"
    description: |
      The spancat span suggester previously capped candidate spans at
      10 tokens, which is shorter than typical UK primary-care lab
      observable spans (18-22 tokens). With the cap at 10 the spancat
      model could not propose, score, or learn the long observable
      span natively. Raising max_size to 24 gives the model the
      structural ability to learn the long-span pattern from gold
      data after the next training run.

      The change is applied to the canonical training config used by
      services/training_worker. No other parameters were modified.

    acceptance_criteria:
      - criterion: "max_size = 24"
        type: "functional"
        measurement: "Inspection"
        target: "services/training_worker/app/config/base.cfg [components.spancat.suggester].max_size equals 24"

  implementation:
    artifacts:
      - artifact_type: "configuration"
        location: "services/training_worker/app/config/base.cfg"
        description: "spaCy training config; spancat suggester max_size key"
    storage_location: "git"
    technical_details:
      language: "TOML/INI (spaCy config)"
      loc: 5
      key_functions: []

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Allows the model to natively learn long lab observable spans, reducing reliance on the deterministic recovery layer over time"
    risk_control_measures:
      - "Value is bounded at 24 to limit candidate set growth; any future bump above 32 requires a separate performance review"

  verification_status:
    verification_method: "Inspection"
    verification_complete: true
