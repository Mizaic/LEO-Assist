# -- R-LEO-AI-208 -- Receptionist form-field restatement creates duplicate milestones
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-208"
  title: "Structured 2WW proforma update by a receptionist on a date later than the event creates duplicate referral / first_seen milestones on the patient's cancer EpisodeOfCare"

  hazard:
    description: >
      Primary-care 2WW proforma fields ("Date of First outpatient
      appointment: 07 Apr 2025"; "Seen in 2WW Clinic?: Seen in
      fast track suspected breast cancer clinic (XaPyQ) 28 Apr
      2025") are routinely updated by a receptionist on a date
      AFTER the event the field describes. The detector matched
      the surface forms / specialist-clinic Read code on the
      encounter date and emitted a fresh referral or first_seen
      milestone, even though the real event had already fired
      from its own source encounter (the actual referral on
      2025-03-26 and the actual first clinic visit on 2025-04-28).
    category: "clinical_safety"

  hazardous_situation: >
    Patient 4802892365's pathway carried a duplicate text_generic
    referral on 2025-05-13 (real referral 2025-03-26) and a
    duplicate first_seen on 2025-06-10 (real first_seen
    2025-04-28). A clinical auditor opening the EpisodeOfCare
    sees two referrals and two first-seen entries and may
    conclude the patient was re-referred or attended clinic
    twice. Cohort-level referral / first_seen counts and
    time-to-first-seen / time-to-treatment KPIs are inflated
    and skewed.

  harm:
    description: >
      Reviewer trust in the milestone model degrades. Cohort
      KPIs (time-to-first-seen, referral counts, conversion-to-
      diagnosis) are inflated by duplicate milestones, leading
      to inaccurate management reports and potentially
      misdirected service-improvement effort. In the worst case
      a quality lead chases a phantom referral or first-seen
      pathway that already has an outcome on the original
      milestone, wasting clinical time.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 4
    detectability: 3
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-224 introduces a structured-form-field
        restatement guard. The new helper
        ``encounter_restates_past_event(text, encounter_date,
        lookback_days=14)`` returns True when the encounter body
        contains a Field-shape line (a line containing ``:``)
        whose embedded calendar date is at least 14 days BEFORE
        the encounter date. The guard is wired into BOTH the
        text_generic referral suppression block and the
        first_seen emission gate (including the specialist-
        clinic Read code branch). Five date formats are
        recognised: ``DD MMM YYYY``, ``DD/MM/YYYY``,
        ``DD-MM-YYYY``, ``DD.MM.YYYY``, and ISO ``YYYY-MM-DD``.
        The guard is INERT for prose without colons (Pattern L
        / DI-LEO-AI-216 handles narrative referral suppression).
      implemented_by:
        - "DI-LEO-AI-224"
      verified_by:
        - "VT-LEO-AI-216"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Twenty-one verification cases (12 critical) cover the
      canonical 4802892365 2025-05-13 and 2025-06-10
      restatements, all five date formats, the colon-required
      shape, the lookback parameter, and three no-over-
      suppression sanity cases (fresh first_seen on the form
      date, fresh text_generic referral, free-text prose with a
      past date). The 14-day default lookback prevents
      over-suppression of same-week clinic notes; new
      restatement shapes can be added by extending the date
      regex set if a previously unrecognised format is
      surfaced by cohort scans.

  monitoring:
    monitoring_plan: >
      Per pipeline rebuild, count distinct referral and
      first_seen milestones per patient. Spot-check a sample
      of any encounters where multiple referral or first_seen
      milestones fire on the same patient within 90 days of
      each other -- look for receptionist 2WW proforma updates
      that escaped the guard and add new date formats / Field
      shapes to the inventory as needed.
    metrics:
      - "Count of referral milestones per cohort rebuild"
      - "Count of first_seen milestones per cohort rebuild"
      - "Per-rebuild count of patients with more than one referral or first_seen milestone within 90 days (target: trending downward)"
    review_frequency: "Per pipeline rebuild"

  metadata:
    identified_by: "Patient 4802892365 investigation -- 2025-05-13 receptionist note (Date of First outpatient appointment: 07 Apr 2025) emitted a fresh text_generic referral; 2025-06-10 receptionist note (Seen in 2WW Clinic?: ... 28 Apr 2025) emitted a fresh first_seen via the XaPyQ Read code"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "anchor-detector"
      - "form-field-restatement"
      - "patient-4802892365"
      - "pattern-n3"
