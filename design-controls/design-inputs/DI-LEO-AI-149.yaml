# -- DI-LEO-AI-149 -- Histology vocabulary expansion for confirmed-cancer and benign-closure detection
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-149"
  type: "Functional"
  derived_from: ["UN-LEO-AI-006"]
  requirement: >
    The text-based anchor detector SHALL recognise standard histology-letter
    vocabulary as confirmed-cancer evidence and standard benign-histology
    vocabulary as benign-closure evidence so that text-only episode building
    files diagnoses and benign closures at the correct calendar date instead
    of leaving the episode 'in_progress' to be auto-closed as stale.

    For confirmed cancer (_RE_CONFIRMED_CANCER), the regex SHALL match -- in
    addition to the existing 'confirmed | diagnosed | biopsy showed' verbs --
    standard histology terms ('invasive ductal', 'invasive lobular',
    'invasive carcinoma', 'adenocarcinoma', 'squamous cell carcinoma',
    'basal cell carcinoma', 'BCC', 'SCC', 'DCIS', 'LCIS', 'in-situ',
    'carcinoma in-situ', 'melanoma in-situ', 'metastatic', 'metastasis',
    'infiltrating ductal/lobular/carcinoma', 'lymph node involvement',
    'positive margin/node/lymph nodes'), differentiation grades ('poorly
    differentiated', 'moderately differentiated', 'well differentiated',
    'high-grade', 'low-grade', 'grade 1|2|3|I|II|III|IV'), and standard
    staging notations ('Gleason N', 'T0-4 N0-3 M0-1', 'stage I-IV[abc]',
    'FIGO I-IV', 'Dukes A-D', 'Breslow', 'Clark level').

    For benign closure (_RE_NO_CANCER), the regex SHALL match -- in addition
    to the existing 'no cancer | NED | nothing sinister | reassured'
    phrasing -- the standard benign-histology and clinical-discharge terms
    ('no malignant cells', 'no atypia', 'no atypical cells',
    'no abnormality detected', 'no significant abnormality',
    'normal appearance', 'normal histology', 'normal biopsy result',
    'unremarkable biopsy/histology/findings', benign lesion names
    ('lipoma', 'fibroadenoma', 'sebaceous cyst', 'epidermal/epidermoid
    cyst', 'seborrhoeic|seborrheic keratosis', 'actinic|solar keratosis',
    'skin tag', 'acrochordon', 'dermatofibroma', 'benign naevus',
    'benign cyst|polyp|nodule|lesion|finding', 'inflammatory change',
    'reactive change|atypia', 'hyperplastic|inflammatory polyp',
    'fibrocystic change', 'cystic change', 'intramucosal', 'hamartoma'),
    and the discharge phrases ('discharged back to GP', 'discharged from
    clinic', 'reassurance given').

    Both expansions MUST preserve the existing _is_referral_enc guard so
    that 'Fast track referral for suspected cancer' (and similar PRISM /
    2WW referral phrases) NEVER fire either bucket -- only standalone
    histology / clinic-letter encounters get the new classifications.
  rationale: >
    Investigation of 79 auto-closed text-path episodes (April 2026 cohort,
    after the schema-driven GDS rebuild) found:
      - 24/79 (30%) had clear histology cancer text (e.g. 'Invasive ductal
        carcinoma, grade 2', 'Adenocarcinoma of colon T2 N0 M0', 'DCIS high
        grade', 'Gleason 7 (3+4) prostate') that the legacy regex did not
        match. These episodes were auto-closed as stale_post_specialist
        despite a documented diagnosis -- a critical NCDA accuracy gap.
      - 19/79 (24%) had common benign findings (e.g. 'Lipoma',
        'Fibroadenoma', 'Sebaceous cyst', 'No malignant cells',
        'Unremarkable') that the legacy regex did not match. These
        pathways closed cleanly in the clinic but stayed open in the
        graph for 90+ days, biasing breach metrics.
    Expanding the vocabulary lifts both diagnosis-confirmed and
    benign-closure recall on the text-only path, halving the residual
    auto-stale rate.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          _RE_CONFIRMED_CANCER matches every phrase in the histology-positive
          corpus (>= 18 examples covering invasive ductal/lobular,
          adenocarcinoma, BCC/SCC, DCIS/LCIS, in-situ, melanoma in-situ,
          metastatic, grades 1-3 / I-III, T-N-M staging, Gleason, FIGO,
          Dukes, Breslow / Clark level). 100% match rate.
      - type: "functional"
        spec: >
          _RE_CONFIRMED_CANCER does NOT match the suspected-only / referral
          corpus (>= 6 examples: 'Fast track referral for suspected breast
          cancer', 'PRISM 2WW dermatology', '?suspected lung cancer for
          investigation', 'query carcinoma'). 0% match rate.
      - type: "functional"
        spec: >
          _RE_NO_CANCER matches every phrase in the benign-histology corpus
          (>= 18 examples covering lipoma, fibroadenoma, sebaceous cyst,
          seborrhoeic keratosis, actinic keratosis, skin tag,
          dermatofibroma, no malignant cells, no abnormality detected,
          normal histology, unremarkable biopsy, inflammatory change,
          reactive change, hyperplastic polyp, fibrocystic change,
          discharged back to GP, reassurance given). 100% match rate.
      - type: "functional"
        spec: >
          _RE_NO_CANCER does NOT match the malignant or referral corpus
          (>= 6 examples: 'Invasive ductal carcinoma', 'Adenocarcinoma',
          'Fast track referral for suspected breast cancer', 'PRISM 2WW',
          'Confirmed melanoma', 'Metastatic disease'). 0% match rate.
      - type: "functional"
        spec: >
          _classify_text_encounters routes histology-cancer text into the
          diagnosis bucket (index 1) and benign-histology text into the
          benign-closure bucket (index 4) when the encounter is NOT also
          a referral (no PRISM / fast-track referral phrasing).
    constraints:
      - type: "safety"
        spec: >
          The expanded vocabulary MUST NOT cause 'suspected cancer' or
          'PRISM / fast-track referral' encounters to be reclassified as
          confirmed diagnoses or benign closures. The existing
          _is_referral_enc guard in _classify_text_encounters MUST remain
          in place and continue to suppress diagnosis / benign output for
          referral encounters.
      - type: "safety"
        spec: >
          Adding benign-lesion names (e.g. 'lipoma') MUST NOT close
          episodes where the lesion is mentioned as part of a differential
          diagnosis BEFORE confirmed cancer ('initial impression: lipoma,
          but biopsy showed sarcoma'). The episode builder already runs
          benign-closure detection per encounter and only closes when no
          confirmed cancer anchor exists in the window, so this risk is
          held by the existing pipeline guard.
    dependencies: ["DI-LEO-AI-145"]
    downstream_impacts:
      - "services/analysis_worker/app/analyzers/anchor_detector.py"
    technical_details:
      language: "Python"
      framework: "regex + episode_builder"
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-147 passes: corpus tests confirm 100% sensitivity on the
      histology-positive and benign-histology corpora and 0%
      false-positive rate on the suspected / referral corpora; integration
      tests confirm _classify_text_encounters routes the new vocabulary
      to the correct buckets without disturbing the _is_referral_enc
      suppression.
    test_protocol: "VT-LEO-AI-147"

  safety_class: "B"
  risks: ["R-LEO-AI-102"]
  tags:
    - "anchor-detector"
    - "histology"
    - "benign-closure"
    - "ncda"
