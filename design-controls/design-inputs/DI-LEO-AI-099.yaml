# -- DI-LEO-AI-099 -- Encounter-centric Mission Control and Batch Recode
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-099"
  type: "Functional"
  derived_from: ["UN-LEO-AI-058", "UN-LEO-AI-056"]
  requirement: >
    The system SHALL provide an encounter-centric Mission Control workflow at
    /care/encounters that supports org-scoped hybrid search (fulltext plus
    vector), ephemeral shortlist selection, and a dedicated batch reset+recode
    API that queues extract_encounter jobs with trigger_analysis disabled by
    default and optional override for analytics rerun.
  rationale: >
    Clinical audit users need a fast way to target encounter text directly and
    run controlled remediation in batches to evaluate extraction quality.
    Defaulting trigger_analysis to false prevents unnecessary episode-detector
    churn during coding-quality operations, while still allowing explicit
    rerun when required.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "GET /analytics/mission-control/encounters returns org-scoped, paged encounter rows and supports q-based hybrid ranking"
      - type: "functional"
        spec: "Hybrid keyword leg uses db.index.fulltext.queryNodes('encounter_text_index', ...)"
      - type: "functional"
        spec: "Hybrid semantic leg uses db.index.vector.queryNodes('encounter_vector_index', ...), with graceful fallback if unavailable"
      - type: "functional"
        spec: "POST /patients/encounters/batch-reset-and-recode accepts encounter items across patients and queues pd-gp-encounter-coding extract_encounter runs"
      - type: "safety"
        spec: "Batch endpoint trigger_analysis defaults false and is true only when explicitly set by caller"
      - type: "usability"
        spec: "UI exposes shortlist selection and live per-encounter queued/running/completed/failed statuses"

  constraints:
    - type: "safety"
      spec: "Every batch item MUST pass patient scope enforcement before reset and queue"
    - type: "performance"
      spec: "Encounter list and search endpoints MUST cap page size at 100 and batch payload at 500 items"

  dependencies: ["DI-LEO-AI-001", "DI-LEO-AI-092", "DI-LEO-AI-095"]
  downstream_impacts:
    - "services/analytics_api/app/routers/mission_control_encounters.py"
    - "services/api/app/routers/patients.py"
    - "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
    - "services/ui/src/lib/missionControlApi.ts"

  technical_details:
    language: "Python + TypeScript"
    framework: "FastAPI + Next.js / MUI"
    file_structure:
      - "services/analytics_api/app/routers/mission_control_encounters.py"
      - "services/analytics_api/app/main.py"
      - "services/api/app/routers/patients.py"
      - "services/api/app/services/pipeline_service.py"
      - "services/ui/src/components/mission-control/EncounterMissionControl.tsx"
      - "services/ui/src/app/care/encounters/page.tsx"
      - "services/ui/src/components/AppShell.tsx"
      - "services/ui/src/lib/missionControlApi.ts"
    estimated_loc: 420

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-099 passes all critical API and UI cases for encounter hybrid
      search, shortlist batch submission, queued message shape, and progress UX.
    test_protocol: "VT-LEO-AI-099"

  safety_class: "B"
  risks: ["R-LEO-AI-063", "R-LEO-AI-065"]
  tags: ["mission-control", "encounters", "batch-recode", "hybrid-search"]
