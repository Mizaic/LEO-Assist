# -- DI-LEO-AI-107 -- Multi-label NER Span Classification
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-107"
  type: "Functional"
  derived_from: ["UN-LEO-AI-061"]
  requirement: >
    The NER training and inference pipeline SHALL support multi-label span
    classification: (1) the label exporter SHALL write overlapping and
    co-located spans to doc.spans["sc"] without deduplication by token
    range; (2) the spaCy model SHALL be trained using the spancat component
    (SpanCategorizer.v1) rather than the transition-based NER component so
    that multiple labels can be assigned to the same character span at
    inference time; (3) the inference service SHALL return one EntityOut per
    span-label pair, including multiple entries at the same character
    position; (4) post-processing layer 5 (normalise_entity_types) SHALL
    only suppress a nested same-label span when its normalized lookup term
    is identical to the containing span's normalized term; (5) the LLM
    extraction prompt SHALL NOT generate multiple entries for the same text
    span during fresh extraction; (6) the label verification prompt SHALL
    explicitly instruct the LLM to preserve multi-label annotations rather
    than reducing them to a single semantic type; (7) a canonical shared
    annotation guideline artifact SHALL be reused across extraction, label
    verification, extraction_check, coding_check, and relation_linking prompt
    composition so the same boundary policy applies end-to-end and remains
    visible to human reviewers in the gold review workflow.

  rationale: >
    Single-label NER silently drops dual codings (e.g. medicinal_product +
    procedure for a dose-change sentence; disorder + finding for a staged
    malignancy). The spaCy ner component enforces non-overlapping doc.ents;
    switching to spancat with doc.spans["sc"] is the architecturally correct
    change to remove this restriction. Layer 5 nesting suppression is too
    aggressive when shorter and longer spans represent distinct SNOMED
    concepts. Prompt changes ensure the LLM neither creates nor destroys
    multi-label annotations that originate from the NER model.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "_record_to_spacy_doc() populates doc.spans['sc'] not doc.ents; entities at same token range both written"
      - type: "functional"
        spec: "base.cfg pipeline = ['transformer','spancat']; score_weights uses spans_sc_f"
      - type: "performance"
        spec: "ngram_range_suggester max_size >= p95 of gold-label token-length distribution (currently 10) so that at least 95% of curated training spans are proposable as candidates"
      - type: "functional"
        spec: "evaluator.py reads spans_sc_per_type and spans_sc_f instead of ents_per_type and ents_f"
      - type: "functional"
        spec: "/extract endpoint iterates doc.spans.get('sc', []) and falls back to doc.ents for pre-spancat models"
      - type: "functional"
        spec: "normalise_entity_types only suppresses nested same-label span when normalized values are identical"
      - type: "safety"
        spec: "If 'sc' spans are absent (old model loaded), inference falls back to doc.ents and logs a warning; no exception"
      - type: "functional"
        spec: "PromptConfig annotation_guidelines v1 is seedable and composed into extraction, label_verification, extraction_check, coding_check, and relation_linking prompts"
      - type: "usability"
        spec: "Gold dataset review UI displays the same annotation_guidelines text used by prompt composition"
    constraints:
      - type: "safety"
        spec: "LLM extraction prompt rule 4 retains 'one semantic_tag per output entry'; LLM may not generate multi-label during fresh extraction"
      - type: "safety"
        spec: "Label verification prompt instructs LLM to preserve existing multi-label annotations and not reduce them"

  dependencies: ["DI-LEO-AI-106"]
  downstream_impacts:
    - "NER model training accuracy for multi-concept spans"
    - "SNOMED coding completeness for ambiguous clinical events"
    - "Post-processing span deduplication behaviour"
    - "LLM label verification correctness"
    - "Prompt consistency across extraction and quality-check subgraphs"
    - "Reviewer annotation guidance visibility in gold dataset workflow"

  technical_details:
    language: "Python"
    framework: "spaCy / FastAPI"
    file_structure:
      - "services/training_worker/app/config/base.cfg"
      - "services/training_worker/app/label_exporter.py"
      - "services/training_worker/app/evaluator.py"
      - "services/model_inference/app/main.py"
      - "libs/pipeline/post_processing.py"
      - "libs/prompts/extraction_v1.py"
      - "libs/prompts/label_verification_v2.py"
      - "libs/prompts/annotation_guidelines_v1.py"
      - "libs/prompts/registry.py"
      - "services/api/app/routers/training.py"
      - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
    estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-107 pass: multi-label export to doc.spans["sc"],
      inference fallback behaviour, layer 5 nesting suppression refinement, and
      prompt preservation rules all behave as specified.
    test_protocol: "VT-LEO-AI-107"

  safety_class: "B"
  risks: ["R-LEO-AI-073"]
  tags: ["multi-label", "ner", "spancat", "post-processing", "prompt"]
