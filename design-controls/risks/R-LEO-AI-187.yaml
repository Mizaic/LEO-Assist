# -- R-LEO-AI-187 -- Auto-prune deletes valuable training candidate
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-187"
  title: "Auto-prune deletes a TrainingCandidate that the model actually needed to learn from"

  hazard:
    description: >
      The confidence-gated auto-prune removes a candidate whose
      entities, although currently rejected by the SNOMED proposal
      validator, encode genuine clinical signal (e.g. negation
      assertion, qualifier_value, or a rare surface form not yet in
      the terminology cache). Deleting these starves the NER training
      loop of exactly the hard cases it should learn from.
    category: "clinical_safety"

  hazardous_situation: >
    Curator triggers auto-prune with the default confidence floors
    (min_surface_match=0.7, semantic_vector_floor=0.92,
    semantic_min_surface=0.66). The validator rejects every entity on
    a candidate that, if reviewed by a human, would have been kept --
    e.g. "Co-existing benign naevus: Present" where the LLM reasonably
    proposes a finding even though the resolver cannot exact-match.
    The cascade DETACH DELETE removes the candidate's draft GoldLabel
    and SurfaceFormTask siblings, so the work cannot be recovered
    from the UI.

  harm:
    description: >
      Slow erosion of training signal -> the next NER model release
      degrades silently on the surface forms the curator had been
      collecting examples of. Downstream coding accuracy drops without
      a visible incident.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 4
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Verdict ladder uses three independent acceptance branches
        (EXACT, SEMANTIC, SURFACE) with calibrated absolute floors;
        only candidates where EVERY entity fails ALL branches qualify
        for verdict='delete'. Mixed verdicts route to 'review'.
      implemented_by: ["DI-LEO-AI-196"]
      verified_by: ["VT-LEO-AI-182"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Safety rails: zero-entity, _AUTO_CODE_BLOCKED assertion, and
        manual_gold_seed* source candidates are forced to
        verdict='review' regardless of validator output, because they
        are exactly the categories where validator rejection is most
        likely to misread genuine signal.
      implemented_by: ["DI-LEO-AI-196"]
      verified_by: ["VT-LEO-AI-182"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Two-phase preview-then-execute API and UI dialog with explicit
        confirmation checkbox, plus per-call audit logging of the
        actor email and counts. No pathway exists for one-click bulk
        deletion.
      implemented_by: ["DI-LEO-AI-196", "DI-LEO-AI-197"]
      verified_by: ["VT-LEO-AI-182", "VT-LEO-AI-183"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The verdict ladder already mirrors the calibrated floors used
      by the gold-label audit (R-LEO-AI-180), so a 'delete' verdict
      requires a stronger negative signal than would normally trigger
      a human reviewer to discard a candidate. The two-phase UI plus
      audit log make any erroneous deletion individually traceable
      and recoverable from Neo4j backups.

  monitoring:
    monitoring_plan: >
      Track the count of candidates auto-pruned per week and the
      ratio delete/review/keep emitted by /candidates/prune/preview.
      Investigate if the delete fraction exceeds 50% on any
      invocation (suggests too-aggressive parameters) or if NER
      regression tests degrade on a model release that immediately
      followed an auto-prune run.
    metrics:
      - "candidate_prune_deleted_total (per week)"
      - "candidate_prune_delete_fraction (per call)"
      - "ner_regression_test_f1 (per release, paired with prune timestamp)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Auto-prune design review 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "training-data-quality"
      - "auto-prune"
