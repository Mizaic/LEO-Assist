# ============================================================================
# VALIDATION TEST REPORT SCHEMA - IEC 62304 / FDA 21 CFR Part 820 Compliant
# ============================================================================
# This schema defines the structure for validation test execution reports
# that document the RESULTS of executing validation test protocols.
#
# KEY DISTINCTION:
# - Validation Test Protocol: "What to validate and how" (PLAN)
# - Validation Test Report: "What was validated and what happened" (RESULTS)
# - Verification: "Did we build the product right?" (DI → DO)
# - Validation: "Did we build the right product?" (UN → System)
#
# Regulatory References:
# - ISO 13485:2016 Section 7.3.7 (Design and Development Validation)
#   "Records of validation results and any necessary actions shall be maintained"
# - FDA 21 CFR Part 820.30(g) (Design Validation)
#   "Design validation results shall be documented in the DHF"
# - FDA 21 CFR Part 11 (Electronic Records)
#   "Electronic records shall be signed and include date/time stamps"
# - IEC 62304:2006 Section 5.8 (Software System Testing / Validation)
#
# Version: 1.0
# Created: 2025-11-10
# Owner: Quality & Engineering
# ============================================================================

meta:
  schema_version: "1.0"
  schema_name: "Validation Test Report Schema"
  purpose: "Define machine-readable structure for validation test execution results"
  intended_use: "All validation test report documents recording validation execution"
  regulatory_compliance:
    - "ISO 13485:2016 Section 7.3.7 - Validation Records"
    - "FDA 21 CFR Part 820.30(g) - Design Validation Documentation"
    - "FDA 21 CFR Part 11 - Electronic Records and Signatures"
    - "IEC 62304:2006 Section 5.8 - System Testing Evidence"
  change_history:
    - version: "1.0"
      date: "2025-11-10"
      change: "Initial schema creation - addresses critical gap in validation documentation"
      author: "Quality Engineering"

# ============================================================================
# REGULATORY CONTEXT
# ============================================================================

regulatory_context:
  iso_13485_7_3_7:
    requirement: "Records of the results of the validation and any necessary actions shall be maintained"
    schema_implementation: "Complete validation execution records with user feedback, performance data, and conclusions"
    
  fda_21_cfr_820_30_g:
    requirement: "The results of the design validation, including identification of the design, method(s), the date, and the individual(s) performing the validation, shall be documented in the DHF"
    schema_implementation: "Report includes design identification, validation methods, execution dates, participants, and facilitators"
    
  fda_guidance_software_validation:
    requirement: "Validation activities include user site testing, alpha/beta testing, usability testing"
    schema_implementation: "Support for alpha, beta, and production validation phases with real user participation"
    
  fda_21_cfr_part_11:
    electronic_records: "Electronic records must be accurate, accessible, indelible, and include audit trail"
    electronic_signatures: "Electronic signatures must be unique, verified, and include date/time stamp"
    schema_implementation: "Immutable evidence bundles with cryptographic signatures and audit trails"
    
  iec_62304_5_8:
    requirement: "Software system testing shall ensure software system fulfills requirements"
    schema_implementation: "Comprehensive validation results demonstrating system meets user needs"

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

schema:
  validation_test_report:
    description: "Complete record of validation test execution"
    required: true
    fields:
      
      # --- IDENTIFICATION ---
      id:
        type: string
        required: true
        format: "VALR-{PROJECT}-###-{phase}-EXEC-{execution_number}"
        description: "Unique validation test report identifier"
        example: "VALR-PLATFORM-001-ALPHA-EXEC-001"
        pattern: "^VALR-[A-Z]+-\\d{3}-(ALPHA|BETA|PROD)-EXEC-\\d{3}$"
        
      protocol_id:
        type: string
        required: true
        format: "VAL-{PROJECT}-###"
        description: "Validation test protocol that was executed"
        example: "VAL-PLATFORM-001"
        
      protocol_version:
        type: string
        required: true
        format: "semantic versioning (major.minor)"
        description: "Version of protocol that was executed"
        example: "1.0"
        
      report_version:
        type: string
        required: true
        format: "major.minor"
        description: "Version of this report (if amended)"
        example: "1.0"
        
      status:
        type: enum
        required: true
        values: ["in_progress", "completed", "approved", "rejected", "superseded"]
        description: "Current status of validation report"
        
      # --- VALIDATION PHASE ---
      validation_phase:
        type: object
        required: true
        description: "Validation phase information"
        fields:
          phase:
            type: enum
            required: true
            values: ["alpha", "beta", "production"]
            description: "Validation phase executed"
            definitions:
              alpha: "Internal validation with QA team"
              beta: "Limited external validation with selected customers"
              production: "Full production validation with all users"
              
          start_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            description: "Phase start date"
            
          end_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            description: "Phase end date"
            
          duration:
            type: string
            required: true
            description: "Total phase duration"
            example: "4 weeks"
            
      # --- EXECUTION METADATA ---
      execution_metadata:
        type: object
        required: true
        description: "Who, what, when, where of validation (FDA 21 CFR Part 11)"
        fields:
          facilitated_by:
            type: object
            required: true
            description: "Person(s) who facilitated validation"
            fields:
              name:
                type: string
                required: true
              role:
                type: string
                required: true
                example: "Quality Engineer, UX Researcher"
              user_id:
                type: string
                required: true
              signature:
                type: string
                required: false
                description: "Electronic signature"
              signature_date:
                type: datetime
                required: false
                format: "ISO 8601"
                
          environment:
            type: object
            required: true
            description: "Validation environment details"
            fields:
              environment_name:
                type: enum
                required: true
                values: ["staging", "beta-production", "production"]
                
              infrastructure:
                type: string
                required: true
                description: "Infrastructure details"
                example: "Azure AKS production cluster"
                
              software_version:
                type: string
                required: true
                description: "Software version under validation"
                example: "v1.2.0"
                
              git_commit:
                type: string
                required: false
                description: "Git commit hash"
                
              release_date:
                type: date
                required: false
                format: "YYYY-MM-DD"
                
      # --- TRACEABILITY ---
      traceability:
        type: object
        required: true
        description: "Links to design controls"
        fields:
          user_needs:
            type: array
            required: true
            item_type: string
            format: "UN-{PROJECT}-###"
            min_items: 1
            description: "User Needs being validated"
            
          design_inputs:
            type: array
            required: true
            item_type: string
            format: "DI-{PROJECT}-###"
            min_items: 1
            description: "Design Inputs that implement User Needs"
            
          design_outputs:
            type: array
            required: true
            item_type: string
            format: "DO-{PROJECT}-###"
            min_items: 1
            description: "Design Outputs deployed in validation"
            
          verification_tests:
            type: array
            required: true
            item_type: string
            format: "VT-{PROJECT}-###"
            description: "Verification tests that passed before validation"
            
          risks:
            type: array
            required: false
            item_type: string
            format: "R-{PROJECT}-###"
            description: "Risks related to validated features"
            
          previous_validation_reports:
            type: array
            required: false
            item_type: string
            format: "VALR-{PROJECT}-###-{PHASE}-EXEC-###"
            description: "Previous validation reports for comparison"
            
      # --- PARTICIPANTS ---
      participants:
        type: object
        required: true
        description: "Users who participated in validation"
        fields:
          total_count:
            type: integer
            required: true
            description: "Total number of participants"
            
          target_count:
            type: integer
            required: true
            description: "Target number from protocol"
            
          participation_rate:
            type: number
            required: true
            description: "Percentage of target achieved"
            calculation: "(total_count / target_count) * 100"
            
          demographics:
            type: object
            required: false
            description: "Participant demographics"
            fields:
              by_role:
                type: array
                required: false
                item_type: object
                fields:
                  role:
                    type: string
                  count:
                    type: integer
              by_experience:
                type: array
                required: false
                item_type: object
                fields:
                  experience_level:
                    type: enum
                    values: ["novice", "intermediate", "expert"]
                  count:
                    type: integer
              by_organization:
                type: array
                required: false
                item_type: object
                fields:
                  organization_type:
                    type: string
                  count:
                    type: integer
                    
          participant_list:
            type: array
            required: true
            item_type: object
            description: "Individual participants (anonymized if required)"
            fields:
              participant_id:
                type: string
                required: true
                description: "Unique participant ID (can be anonymized)"
                example: "P-001, USER-ABC-123"
                
              role:
                type: string
                required: true
                description: "User role"
                example: "Quality Engineer, Quality Manager"
                
              organization:
                type: string
                required: false
                description: "Organization (anonymized if beta/external)"
                
              experience_level:
                type: enum
                required: false
                values: ["novice", "intermediate", "expert"]
                
              scenarios_completed:
                type: integer
                required: true
                description: "Number of scenarios completed"
                
              consent_obtained:
                type: boolean
                required: true
                description: "Whether informed consent was obtained"
                
      # --- SCENARIO RESULTS ---
      scenario_results:
        type: array
        required: true
        item_type: object
        min_items: 1
        description: "Results for each user scenario from protocol"
        fields:
          scenario_id:
            type: string
            required: true
            description: "Scenario ID from protocol"
            example: "SCENARIO-001"
            
          scenario_name:
            type: string
            required: true
            description: "Scenario name from protocol"
            
          user_goal:
            type: string
            required: true
            description: "User goal from protocol"
            
          participants_attempted:
            type: integer
            required: true
            description: "Number of participants who attempted"
            
          participants_completed:
            type: integer
            required: true
            description: "Number who successfully completed"
            
          completion_rate:
            type: number
            required: true
            description: "Completion rate percentage"
            calculation: "(participants_completed / participants_attempted) * 100"
            
          target_completion_rate:
            type: number
            required: true
            description: "Target from protocol"
            example: 90.0
            
          success_metrics:
            type: array
            required: true
            item_type: object
            description: "Success metrics from protocol"
            fields:
              metric:
                type: string
                required: true
                example: "Task completion time"
              target:
                type: string
                required: true
                example: "≤5 minutes"
              actual_mean:
                type: string
                required: true
              actual_median:
                type: string
                required: false
              actual_p95:
                type: string
                required: false
              met:
                type: boolean
                required: true
                
          user_feedback_summary:
            type: object
            required: true
            description: "Aggregated user feedback for scenario"
            fields:
              positive_comments:
                type: array
                required: false
                item_type: string
              negative_comments:
                type: array
                required: false
                item_type: string
              suggestions:
                type: array
                required: false
                item_type: string
              common_issues:
                type: array
                required: false
                item_type: string
                
          step_results:
            type: array
            required: true
            item_type: object
            description: "Results for each scenario step"
            fields:
              step_number:
                type: integer
                required: true
              action:
                type: string
                required: true
              success_count:
                type: integer
                required: true
              failure_count:
                type: integer
                required: true
              common_errors:
                type: array
                required: false
                item_type: string
              average_time:
                type: string
                required: false
                
          evidence_artifacts:
            type: array
            required: false
            item_type: string
            description: "Evidence URIs for this scenario"
            
      # --- OVERALL VALIDATION RESULTS ---
      validation_results:
        type: object
        required: true
        description: "Overall validation results"
        fields:
          overall_result:
            type: enum
            required: true
            values: ["Pass", "Pass with Observations", "Fail", "Incomplete"]
            description: "Overall validation verdict"
            
          user_needs_validated:
            type: integer
            required: true
            description: "Number of User Needs successfully validated"
            
          user_needs_total:
            type: integer
            required: true
            description: "Total User Needs in scope"
            
          validation_rate:
            type: number
            required: true
            description: "Percentage of User Needs validated"
            calculation: "(user_needs_validated / user_needs_total) * 100"
            
          acceptance_criteria_met:
            type: boolean
            required: true
            description: "Whether acceptance criteria from protocol were met"
            
      # --- USER SATISFACTION ---
      user_satisfaction:
        type: object
        required: true
        description: "User satisfaction measurements"
        fields:
          survey_responses:
            type: object
            required: true
            description: "Survey response data"
            fields:
              surveys_sent:
                type: integer
                required: true
              surveys_completed:
                type: integer
                required: true
              response_rate:
                type: number
                required: true
                calculation: "(surveys_completed / surveys_sent) * 100"
              target_response_rate:
                type: number
                required: true
                example: 70.0
                
          satisfaction_score:
            type: object
            required: false
            description: "Overall satisfaction rating"
            fields:
              mean:
                type: number
                required: true
                description: "Mean satisfaction (1-5 scale)"
              median:
                type: number
                required: false
              target:
                type: number
                required: true
                example: 4.0
              met:
                type: boolean
                required: true
                
          sus_score:
            type: object
            required: false
            description: "System Usability Scale score (if applicable)"
            fields:
              score:
                type: number
                required: true
                description: "SUS score (0-100)"
              target:
                type: number
                required: true
                example: 70.0
              met:
                type: boolean
                required: true
              interpretation:
                type: string
                required: false
                description: "Score interpretation"
                example: "Good usability"
                
          net_promoter_score:
            type: object
            required: false
            description: "Net Promoter Score (if applicable)"
            fields:
              score:
                type: number
                required: true
                description: "NPS score (-100 to +100)"
              promoters_percentage:
                type: number
                required: false
              passives_percentage:
                type: number
                required: false
              detractors_percentage:
                type: number
                required: false
                
          qualitative_feedback:
            type: object
            required: true
            description: "Qualitative user feedback"
            fields:
              total_comments:
                type: integer
                required: true
              positive_themes:
                type: array
                required: false
                item_type: object
                fields:
                  theme:
                    type: string
                  mention_count:
                    type: integer
                  example_quotes:
                    type: array
                    item_type: string
              negative_themes:
                type: array
                required: false
                item_type: object
                fields:
                  theme:
                    type: string
                  mention_count:
                    type: integer
                  example_quotes:
                    type: array
                    item_type: string
              improvement_suggestions:
                type: array
                required: false
                item_type: string
                
      # --- PERFORMANCE METRICS ---
      performance_metrics:
        type: array
        required: false
        item_type: object
        description: "Performance metrics measured during validation"
        fields:
          metric_name:
            type: string
            required: true
            example: "Design Input to Code cycle time"
            
          target:
            type: string
            required: true
            example: "P95 ≤7 days"
            
          actual_mean:
            type: string
            required: true
            
          actual_median:
            type: string
            required: false
            
          actual_p95:
            type: string
            required: false
            
          baseline:
            type: string
            required: false
            description: "Baseline for comparison"
            
          improvement:
            type: string
            required: false
            description: "Improvement vs baseline"
            example: "+85% faster"
            
          met:
            type: boolean
            required: true
            description: "Whether target was met"
            
          measurement_period:
            type: string
            required: true
            example: "30 days continuous"
            
          sample_size:
            type: integer
            required: false
            
      # --- ISSUES FOUND ---
      issues:
        type: array
        required: false
        item_type: object
        description: "Issues discovered during validation"
        fields:
          issue_id:
            type: string
            required: true
            description: "Unique issue identifier"
            example: "ISSUE-001"
            
          severity:
            type: enum
            required: true
            values: ["critical", "major", "minor", "enhancement"]
            
          title:
            type: string
            required: true
            
          description:
            type: string
            required: true
            
          scenario_id:
            type: string
            required: false
            description: "Scenario where issue was found"
            
          frequency:
            type: object
            required: false
            description: "How often issue occurred"
            fields:
              occurrence_count:
                type: integer
              participant_count:
                type: integer
              percentage:
                type: number
                
          user_impact:
            type: string
            required: true
            description: "Impact on user experience"
            
          evidence_artifacts:
            type: array
            required: false
            item_type: string
            
          status:
            type: enum
            required: true
            values: ["open", "in_progress", "resolved", "verified", "closed", "deferred", "wont_fix"]
            
          resolution:
            type: string
            required: false
            
          assigned_to:
            type: string
            required: false
            
      # --- OBSERVATIONS ---
      observations:
        type: array
        required: false
        item_type: object
        description: "Observations that don't constitute issues but are noteworthy"
        fields:
          observation_id:
            type: string
            required: true
            
          category:
            type: enum
            required: true
            values: ["usability", "performance", "user_behavior", "workaround", "positive_finding"]
            
          description:
            type: string
            required: true
            
          recommendation:
            type: string
            required: false
            
      # --- EVIDENCE BUNDLE ---
      evidence_bundle:
        type: object
        required: true
        description: "Collection of all validation evidence (21 CFR Part 11)"
        fields:
          bundle_id:
            type: string
            required: true
            description: "Unique evidence bundle identifier"
            example: "VALR-001-ALPHA-EXEC-001-BUNDLE-20251110"
            
          storage_location:
            type: string
            required: true
            format: "Azure Blob Storage URI"
            description: "Immutable storage location"
            
          immutability:
            type: object
            required: true
            fields:
              enabled:
                type: boolean
                required: true
                default: true
              retention_period:
                type: string
                required: true
                example: "7 years"
              hash:
                type: string
                required: false
                description: "Cryptographic hash"
                
          artifacts:
            type: array
            required: true
            item_type: object
            min_items: 1
            fields:
              artifact_id:
                type: string
                required: true
              type:
                type: enum
                required: true
                values:
                  - "user_acceptance_results"
                  - "user_satisfaction_survey"
                  - "usability_test_recording"
                  - "task_completion_data"
                  - "performance_metrics"
                  - "user_feedback_transcripts"
                  - "screenshot"
                  - "video_recording"
                  - "analytics_data"
                  - "support_ticket_analysis"
                  - "interview_notes"
                  - "observation_notes"
                  - "consent_forms"
              file_name:
                type: string
                required: true
              uri:
                type: string
                required: true
              created_timestamp:
                type: datetime
                required: true
                format: "ISO 8601"
              description:
                type: string
                required: false
              hash:
                type: string
                required: false
                
      # --- CONCLUSIONS ---
      conclusions:
        type: object
        required: true
        description: "Validation conclusions and recommendations"
        fields:
          summary:
            type: string
            required: true
            min_length: 100
            max_length: 5000
            description: "Executive summary of validation"
            
          user_needs_validated:
            type: boolean
            required: true
            description: "Whether User Needs are validated as met"
            
          system_fit_for_purpose:
            type: boolean
            required: true
            description: "Whether system is fit for intended purpose"
            
          ready_for_next_phase:
            type: boolean
            required: true
            description: "Whether ready to progress to next phase"
            
          key_findings:
            type: array
            required: true
            item_type: string
            min_items: 1
            description: "Key findings from validation"
            
          strengths:
            type: array
            required: false
            item_type: string
            description: "System strengths identified"
            
          weaknesses:
            type: array
            required: false
            item_type: string
            description: "System weaknesses identified"
            
          recommendations:
            type: array
            required: false
            item_type: string
            description: "Recommendations for improvement"
            
          next_steps:
            type: array
            required: false
            item_type: string
            description: "Required next steps"
            
          limitations:
            type: array
            required: false
            item_type: string
            description: "Limitations of validation"
            
      # --- APPROVAL ---
      approval:
        type: object
        required: true
        description: "Report approval workflow"
        fields:
          report_author:
            type: string
            required: true
          author_signature:
            type: string
            required: false
          author_signature_date:
            type: datetime
            required: false
            format: "ISO 8601"
          reviewed_by:
            type: string
            required: false
            note: "Required for status = 'approved'"
          reviewer_signature:
            type: string
            required: false
          reviewer_signature_date:
            type: datetime
            required: false
            format: "ISO 8601"
          approved_by:
            type: string
            required: false
            note: "Quality Manager - Required for status = 'approved'"
          approver_signature:
            type: string
            required: false
          approver_signature_date:
            type: datetime
            required: false
            format: "ISO 8601"
          approval_notes:
            type: string
            required: false
            max_length: 2000
            
      # --- AMENDMENTS ---
      amendments:
        type: array
        required: false
        item_type: object
        description: "Record of amendments (21 CFR Part 11)"
        fields:
          amendment_number:
            type: integer
            required: true
          amendment_date:
            type: datetime
            required: true
            format: "ISO 8601"
          amended_by:
            type: string
            required: true
          reason:
            type: string
            required: true
          sections_changed:
            type: array
            required: true
            item_type: string
          changes_description:
            type: string
            required: true
          approved_by:
            type: string
            required: true
          approval_date:
            type: datetime
            required: true
            format: "ISO 8601"
            
      # --- AUDIT TRAIL ---
      audit_trail:
        type: array
        required: true
        item_type: object
        description: "Complete audit trail (21 CFR Part 11)"
        fields:
          timestamp:
            type: datetime
            required: true
            format: "ISO 8601"
          user:
            type: string
            required: true
          action:
            type: enum
            required: true
            values: ["created", "modified", "approved", "rejected", "viewed", "exported"]
          field_changed:
            type: string
            required: false
          old_value:
            type: string
            required: false
          new_value:
            type: string
            required: false
          reason:
            type: string
            required: false
          ip_address:
            type: string
            required: false

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "protocol_exists"
    description: "protocol_id must reference existing validation test protocol"
    
  - rule: "minimum_participants"
    description: "Must meet minimum participant count (alpha=5, beta=15, production=50)"
    
  - rule: "scenario_results_complete"
    description: "Must have results for all scenarios in protocol"
    
  - rule: "user_satisfaction_threshold"
    description: "Mean satisfaction must be ≥4.0 for validation to pass"
    
  - rule: "approval_required"
    description: "If status is 'approved', approved_by and signature required"
    
  - rule: "21_cfr_part_11_compliance"
    description: "Must have who, what, when, why for all actions"
    
  - rule: "evidence_immutable"
    description: "Evidence bundle must be in WORM storage"
    
  - rule: "phase_prerequisites"
    description: "Beta requires alpha completion, production requires beta completion"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - example_name: "Alpha Validation Report"
    description: "Internal validation with QA team"
    scenario: "5 participants, high completion rate, good satisfaction"
    
  - example_name: "Beta Validation with Issues"
    description: "External beta with multiple customers"
    scenario: "20 participants, some usability issues found, recommendations made"
    
  - example_name: "Production Validation Report"
    description: "Full production validation"
    scenario: "100+ users, excellent metrics, ready for market"

# ============================================================================
# CHANGE CONTROL
# ============================================================================

change_control:
  report_amendments:
    allowed_changes: "Corrections to factual errors, clarifications"
    prohibited_changes: "Cannot change validation results after approval"
    amendment_process: "Document in amendments array, requires approval"
    audit_trail: "All amendments recorded in audit_trail"
    
  report_retention:
    duration: "7 years minimum (FDA requirement)"
    location: "Azure Blob Storage with WORM policy"

# ============================================================================
# RELATIONSHIP TO OTHER SCHEMAS
# ============================================================================

schema_relationships:
  protocol_to_report:
    relationship: "Validation Test Protocol is EXECUTED BY Validation Test Report"
    cardinality: "1 Protocol → 1+ Reports (one per phase)"
    
  report_to_user_needs:
    relationship: "Validation Test Report VALIDATES User Needs"
    cardinality: "1 Report → 1+ User Needs"



