- id: "DO-LEO-AI-019"
  version: "1.0.0"
  type: "Configuration"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-029", "DI-LEO-AI-030"]
    user_needs: ["UN-LEO-AI-020", "UN-LEO-AI-021"]
    risks_addressed: ["R-LEO-AI-010", "R-LEO-AI-012", "R-LEO-AI-020"]
    verification_tests: ["VT-LEO-AI-019"]
    validation_tests: []

  specification:
    title: "Container Infrastructure"
    description: |
      Azure Container Apps infrastructure defined as Bicep templates with
      supporting Dockerfiles for each service. The Bicep modules provision
      the container environment, Key Vault for secrets, and configure
      auto-scaling rules. Dockerfiles produce minimal, reproducible images
      for the core API, coding worker, and analysis worker services.
    purpose: "Azure Container Apps infrastructure with auto-scaling and key vault integration for production deployment"
    technical_approach: |
      A main Bicep template orchestrates modular deployments for container
      apps, Key Vault, and supporting resources. Each module is
      parameterised for environment-specific values (dev, staging, prod).
      Dockerfiles use multi-stage builds with a slim Python base to
      minimise image size and attack surface. Auto-scaling is configured
      via HTTP concurrency and queue-length triggers. Secrets are injected
      from Key Vault at container start using managed identity.
    acceptance_criteria:
      - criterion: "Bicep templates deploy successfully to a clean resource group"
        type: "functional"
        measurement: "Azure CLI deployment with what-if validation followed by actual deployment"
        target: "Zero deployment errors"
      - criterion: "Container images build without errors and pass security scan"
        type: "security"
        measurement: "Docker build and Trivy vulnerability scan"
        target: "Zero critical or high vulnerabilities in base images"
      - criterion: "Auto-scaling triggers respond to load changes"
        type: "performance"
        measurement: "Load test triggers scale-out; observe replica count increase"
        target: "Scale-out within 60 seconds of threshold breach"
      - criterion: "Secrets are sourced from Key Vault, not environment variables"
        type: "security"
        measurement: "Inspect container env; verify secrets reference Key Vault"
        target: "No plaintext secrets in container configuration"

  implementation:
    artifacts:
      - artifact_type: "configuration_file"
        location: "infra/bicep/main.bicep"
        description: "Main Bicep orchestration template"
        storage_location: "git"
      - artifact_type: "configuration_file"
        location: "infra/bicep/modules/container-apps.bicep"
        description: "Container Apps environment and app definitions"
        storage_location: "git"
      - artifact_type: "configuration_file"
        location: "infra/bicep/modules/keyvault.bicep"
        description: "Key Vault provisioning module"
        storage_location: "git"
      - artifact_type: "configuration_file"
        location: "infra/dockerfiles/Dockerfile.core-api"
        description: "Dockerfile for the core API service"
        storage_location: "git"
      - artifact_type: "configuration_file"
        location: "infra/dockerfiles/Dockerfile.coding-worker"
        description: "Dockerfile for the coding worker service"
        storage_location: "git"
      - artifact_type: "configuration_file"
        location: "infra/dockerfiles/Dockerfile.analysis-worker"
        description: "Dockerfile for the analysis worker service"
        storage_location: "git"
    technical_details:
      language: ["Bicep", "Dockerfile"]

  safety_characteristics:
