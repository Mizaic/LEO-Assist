- id: "VT-LEO-AI-123"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-128"]
    risks: ["R-LEO-AI-088"]

  metadata:
    title: "Care Overview inclusive redesign verification"
    description: >
      Verifies that the Care Overview page renders the shared
      PageIntro primitive with readable copy, softens the four
      summary StatCard labels from uppercase to sentence case at a
      minimum 12px font size, and keeps every chart card h2 heading
      and body2 description under Flesch-Kincaid Grade 9.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/dashboard-overview-intro.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "jest + @testing-library/react installed"
      - "next/jest configured (services/ui/jest.config.js)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-123-TC-001"
      case_name: "PageIntro renders on Care Overview"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Render DashboardPage (with AnalyticsDateFilterProvider)
            and query for the PageIntro heading.
          expected_result: >
            A heading linked to id 'care-overview-intro-title' is
            present before the summary cards.
          verification_method: "automated"
      acceptance_criteria:
        - "PageIntro renders as a sibling of the summary grid"

    - case_id: "VT-123-TC-002"
      case_name: "PageIntro copy passes Flesch-Kincaid grade <=9"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Import CARE_OVERVIEW_INTRO and call fleschKincaidGrade
            on each of why, how, what.
          expected_result: "All three strings return grade <=9"
          verification_method: "automated"
      acceptance_criteria:
        - "Readability gate blocks jargon regressions"

    - case_id: "VT-123-TC-003"
      case_name: "Summary StatCard labels are sentence case at >=12px"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Read services/ui/src/app/dashboard/page.tsx as text.
          expected_result: >
            The four summary labels are the sentence-case strings
            'Cancer referrals', 'Active cases', 'Confirmed cancers',
            'Safety alerts' and the StatCard label Typography does
            not apply `textTransform: 'uppercase'`.
          verification_method: "automated"
      acceptance_criteria:
        - "Labels read as sentence case, not shouty tracking"

    - case_id: "VT-123-TC-004"
      case_name: "Chart card descriptions pass Flesch-Kincaid grade <=9"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Import CARE_OVERVIEW_CHART_COPY and call
            fleschKincaidGrade on every description string.
          expected_result: "Every description returns grade <=9"
          verification_method: "automated"
      acceptance_criteria:
        - "Chart body2 copy stays inside the readability ceiling"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-123/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-123-RUN-20260416-001"
      executed_at: "2026-04-16"
      executed_by: "developer"
      result: "pass"
      environment: "jest (next/jest), jsdom"
      tests_run: 11
      tests_passed: 11
      tests_failed: 0
      notes: >
        Command:
        `npx jest src/__tests__/dashboard-overview-intro.test.tsx
        --no-coverage`. All 11 cases pass: PageIntro renders with
        screenId 'care-overview' and h2 semantics, why/how/what copy
        all grade <=9, the four summary StatCard labels are sentence
        case ('Cancer referrals', 'Active cases', 'Confirmed cancers',
        'Safety alerts') with no textTransform: 'uppercase' in
        services/ui/src/app/dashboard/page.tsx, and every chart
        description in CARE_OVERVIEW_CHART_COPY reads at grade <=9.
