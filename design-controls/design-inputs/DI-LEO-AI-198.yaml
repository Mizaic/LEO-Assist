# -- DI-LEO-AI-198 -- POST /training/candidates/from-dry-run endpoint
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-198"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-084"
  requirement: >
    The Knowledge API SHALL expose POST
    /training/candidates/from-dry-run that accepts a raw encounter
    text and the entity list returned by a model dry-run, SHALL
    de-identify the text server-side via deidentify_text(text,
    ner=True), SHALL compute candidate_id =
    sha256(deidentified_text), SHALL upsert a TrainingCandidate
    keyed on that candidate_id with source='dry_run_correction'
    seeded with the supplied entities re-anchored onto the
    de-identified text via libs.ner.span_finder.find_span, SHALL
    drop entities whose surface text cannot be re-located, SHALL
    ensure (get-or-create) a draft GoldLabel for the candidate via
    the same code path as POST
    /training/gold-labels/by-candidate/{candidate_id}/ensure, and
    SHALL return {candidate_id, label_id, source, entity_count,
    dropped_entity_count}.
  rationale: >
    De-identification on the server is the single point of
    enforcement that prevents PHI from entering either the
    candidate text or the deterministic candidate_id hash. Re-using
    the existing _candidate_id contract (sha256 of de-identified
    text) means two reviewers clicking the same encounter land on
    the same draft and the dry-run correction joins the same
    training pool as pipeline-produced candidates.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "Endpoint deidentifies the request encounter_text via libs.utils.deidentify.deidentify_text(text, ner=True) BEFORE hashing or persisting"
      - type: "functional"
        spec: "candidate_id MUST equal hashlib.sha256(deidentified_text.encode('utf-8')).hexdigest() (matches libs/pipeline_graph/subgraphs/persist.py::_candidate_id contract)"
      - type: "functional"
        spec: "TrainingCandidate is upserted with source='dry_run_correction', status='pending', schema_version='v4', and entities_json holding the re-anchored entities"
      - type: "functional"
        spec: "Each input entity is re-anchored via libs.ner.span_finder.find_span(deidentified_text, entity.text); entities that cannot be re-located are dropped and counted in dropped_entity_count"
      - type: "functional"
        spec: "When a TrainingCandidate already exists for the same candidate_id, the existing row is preserved (the upsert is skipped) and only the GoldLabel ensure path runs"
      - type: "functional"
        spec: "The endpoint reuses GET_GOLD_LABEL_BY_CANDIDATE_ID; if no GoldLabel exists, one is created via UPSERT_GOLD_LABEL with label_id=manual-<uuid>, source='manual_gold_draft', verified_by='', candidate_id=candidate_id"
      - type: "safety"
        spec: "Empty encounter_text and encounter_text that is empty after de-identification SHALL return HTTP 400"
      - type: "safety"
        spec: "source_hint is truncated to 64 characters before persistence and is the only provenance string carried into the candidate (no patient_id, no encounter_id text payload)"
      - type: "performance"
        spec: "End-to-end latency target <= 1.5s for an encounter under 4 KB on a warm de-identifier"
    constraints:
      - type: "safety"
        spec: "Endpoint is gated by get_caller_scope (any authenticated user with training scope); destructive mutations are limited to upserts on the candidate_id key"
      - type: "safety"
        spec: "PHI MUST NOT be transmitted in the response body or logged at INFO level"
    dependencies: []
    downstream_impacts:
      - "Knowledge API /training/candidates"
      - "TrainingCandidate and GoldLabel nodes in Knowledge Graph"
    technical_details:
      language: "Python"
      framework: "FastAPI + libs.neo4j_client.KnowledgeGraphClient"
      file_structure:
        - "services/api/app/routers/training.py"
      estimated_loc: 140

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-191 covers the de-identification call, candidate_id
      hash contract, sanitisation/re-anchoring of entities, the
      idempotent path on second call, and the 400 path for empty
      input.
    test_protocol: "VT-LEO-AI-191"

  safety_class: "B"
  risks:
    - "R-LEO-AI-189"
  tags:
    - "training-data-quality"
    - "ner-accuracy"
    - "gdpr"
    - "active-learning"
