# -- VT-LEO-AI-035 -- Terminology Writeback
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-035"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-035"]
    risks: ["R-LEO-AI-005"]
    user_needs: ["UN-LEO-AI-023"]

  metadata:
    title: "Terminology Writeback"
    description: >
      Verifies that the writeback endpoint persists SurfaceForm mappings in
      Neo4j with provenance metadata, and that written-back mappings boost
      subsequent search results.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_terminology_writeback.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Terminology API running"
      - "Neo4j Coding graph seeded"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-035-TC-001"
      case_name: "Writeback stores SurfaceForm mapping"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "POST a writeback request with SurfaceForm, SNOMED code, and provenance"
          expected_result: "HTTP 201; SurfaceForm node linked to SNOMED concept in graph"
          verification_method: "Assert status code and graph query"
      acceptance_criteria:
        - "Mapping persisted with provenance metadata"

    - case_id: "VT-035-TC-002"
      case_name: "Written-back mappings boost search results"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search for the surface form text after writeback"
          expected_result: "Approved SNOMED concept ranks higher than before"
          verification_method: "Assert ranking improvement"
      acceptance_criteria:
        - "Writeback improves future search relevance"

    - case_id: "VT-035-TC-003"
      case_name: "Boost weight is configurable"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Submit writeback with custom boost weight and verify"
          expected_result: "Boost weight stored on mapping relationship"
          verification_method: "Assert field value"
      acceptance_criteria:
        - "Boost weight is respected per mapping"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-035/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-035-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 7
      cases_passed: 7
      cases_failed: 0
      duration_seconds: 2
      notes: "All 7 test cases passed (pytest VT-LEO-AI-035)"
