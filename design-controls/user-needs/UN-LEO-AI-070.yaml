# -- UN-LEO-AI-070 -- Staff see their jobs in one place
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-070"
  title: "Audit and coding staff see every task they need to action in one unified queue instead of bouncing between five screens"
  description: |
    Audit and coding staff today open at least five screens to do a
    full day's work: the coding-review queue, the safety-net alerts
    list, the gold-label review queue, the surface-form review queue,
    and the audit-run inbox. They tell us the commonest question at
    stand-up is "where do I pick up from yesterday?".

    The user need: a single /work route that, for the staff role, is
    the app's landing page. It lists every open task the user is
    responsible for, grouped by task type but displayed as one ordered
    queue. Each row says what the task is, why it is urgent, and which
    action resolves it. Filters let staff focus on a specific source
    (coding, safety, gold) without losing visibility of the others.

    This is an inclusive-design win: one list means one decision
    (Hick's Law), and a junior or older staff member does not need to
    remember five URLs to finish their day's work.

  stakeholder: "staff (audit + coding), also visible to qa_ra_lead"

  priority: "high"

  rationale: >
    Consolidating the five queues removes the "which app do I check
    next?" question and makes it obvious where work is piling up. The
    unified view also surfaces cross-queue signals (for example, a
    safety-net alert that relates to an episode still in coding-review)
    that no single queue can show today. Keeping the underlying nodes
    unchanged means no regulatory disturbance -- the queue is an
    aggregator view, not a new source of truth.

  acceptance_criteria:
    - "A staff user signing in with role = staff lands on /work"
    - "/work lists every open CodingReview, SafetyNetAlert, and pending GoldLabel the user can action"
    - "The queue is ordered by severity and age, with the most urgent row first"
    - "Each row links directly to the screen that resolves the task"
    - "Filtering by source narrows the queue without hiding the count of the others"
    - "Non-staff roles can still open /work but land elsewhere by default"

  design_inputs:
    - "DI-LEO-AI-138"
    - "DI-LEO-AI-139"

  metadata:
    identified_by: "Rob Smith - staff shadowing interviews, Q1 2026"
    identified_date: "2026-04-17"
    status: "approved"
    tags:
      - "role-first"
      - "staff"
      - "task-queue"
      - "information-architecture"
