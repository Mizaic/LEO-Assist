# -- R-LEO-AI-182 -- Partial SBAR rendered as complete to consumers
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-182"
  title: "An SBAR job that fails partway through is rendered to a consumer (UI or downstream service) as if the available sections were complete and validated"

  hazard:
    description: >
      The SBAR orchestrator persists each section incrementally. If
      the LLM call for one section fails, or the Redis pub/sub
      connection drops, or the worker process is killed, the
      :Assessment node may carry a populated Situation but an empty
      or stale Background, Assessment, or Recommendation. A consumer
      that fetches the Assessment without checking status / errors
      could surface this as a finished SBAR.
    category: "clinical_safety"

  hazardous_situation: >
    The pipeline-jobs queue redelivers an SBAR message after the
    worker crashed mid-run. The new attempt finds the existing draft
    Assessment, runs Situation, then fails on Background. A reviewer
    in the playground sees Situation only, no Background or
    Recommendation, but the Assessment node exists with status
    "in_progress" and the SSE stream has terminated. The reviewer
    refreshes, the GET endpoint returns the half-populated Assessment,
    and the missing sections are not visually distinguished from "no
    relevant information found".

  harm:
    description: >
      Reviewer (or downstream automated consumer) acts on a partial
      SBAR believing it is complete. Wrong clinical decision risk
      similar to R-LEO-AI-181 but rooted in process failure rather
      than content quality. Severity is bounded because the
      :Assessment.status field is the source of truth for completion.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Assessment.status is updated explicitly: 'draft' on creation,
        'in_progress' once Situation is set, and 'completed' or
        'failed' only by FINALISE_ASSESSMENT after all four stages
        have run. The orchestrator finalises in a try/finally so the
        node never leaves the in_progress state silently.
      implemented_by: ["DI-LEO-AI-189", "DI-LEO-AI-190"]
      verified_by: ["VT-LEO-AI-187"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Per-stage errors are captured in Assessment.errors[] and
        returned by GET /sbar/assessments/{id}. UI surfaces MUST
        check status and errors before rendering as complete; the
        SbarPlayground surfaces stage-status chips and per-stage
        errors directly.
      implemented_by: ["DI-LEO-AI-189", "DI-LEO-AI-191", "DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-187", "VT-LEO-AI-188"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        SSE stream emits a terminal sbar_completed/sbar_failed event
        and stale subscriptions are timed out at 300s of silence so
        the UI does not hang in a "still running" state when the
        worker has died.
      implemented_by: ["DI-LEO-AI-191"]
      verified_by: ["VT-LEO-AI-188"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With status as the explicit completion signal and errors[] as
      the per-stage diagnostic, any consumer that checks both fields
      can distinguish a degraded SBAR from a clean one. The remaining
      residual risk lies in consumers ignoring status; we mitigate
      that by reviewing every new SBAR consumer surface.

  monitoring:
    monitoring_plan: >
      Operational dashboard counts Assessments by status. Any
      Assessments stuck in in_progress > 30 minutes are flagged by
      a daily query. New SBAR consumer surfaces are reviewed for
      status/errors handling before merge.
    metrics:
      - "Count of Assessments with status=in_progress >30 minutes (target 0)"
      - "Number of consumer surfaces that render SBAR without checking status (target 0)"
    review_frequency: "Daily ops review + on-PR for any new SBAR consumer"

  metadata:
    identified_by: "Plan workshop 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "sbar"
      - "orchestrator"
      - "operational-safety"
