# -- DO-LEO-AI-139 -- Wave E Phase 1 Knowledge primitives implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-139"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-142"]
    user_needs: ["UN-LEO-AI-071"]
    risks_addressed: []
    verification_tests: ["VT-LEO-AI-141"]

  specification:
    title: "MetricTile, ProgressStrip, SegmentedTabs, FilterBar, ToolbarActions, ReviewListCard, DataGridCard, StatHero (framer-motion stagger)"
    description: |
      Seven new primitives plus a motion upgrade to the existing
      StatHero. All follow the same rules: no @mui imports, tokens
      only, framer-motion animations that honour prefers-reduced-
      motion, ARIA-correct markup, data-testid for verification.
      Each file ships under 300 LOC (code-quality rule). Consumers
      import from "@leo/design-system" at the package root.
    acceptance_criteria:
      - criterion: "Each primitive renders and carries its testid"
        type: "functional"
        measurement: "Test"
        target: "VT-141 TC-001..TC-007 pass"
      - criterion: "StatHero staggers children on mount"
        type: "functional"
        measurement: "Test"
        target: "VT-141 TC-008 passes"
      - criterion: "Reduced-motion collapses transitions to 0ms"
        type: "functional"
        measurement: "Test"
        target: "VT-141 TC-009 passes"
      - criterion: "No @mui/* imports in primitives/"
        type: "functional"
        measurement: "Test"
        target: "VT-141 TC-010 passes"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/MetricTile.tsx"
        description: "Single stat tile with label, value, optional hint and delta"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/ProgressStrip.tsx"
        description: "Labelled horizontal progress bar"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/SegmentedTabs.tsx"
        description: "Accessible pill-style segmented control with keyboard nav"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/FilterBar.tsx"
        description: "Search input + aria-pressed filter chips"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/ToolbarActions.tsx"
        description: "Right-aligned action cluster with hover motion"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/ReviewListCard.tsx"
        description: "Motion-aware list item used by Training Data and prompts tabs"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/DataGridCard.tsx"
        description: "Standard list shell for the four CRUD tabs"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/StatHero.tsx"
        description: "Enhanced with framer-motion stagger"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/design-system/src/primitives/index.ts"
        description: "Re-exports for the seven new primitives"
        storage_location: "git"
    technical_details:
      language: "TypeScript (React 18, framer-motion 11)"
      loc: 900
      key_functions:
        - "MetricTile"
        - "ProgressStrip"
        - "SegmentedTabs"
        - "FilterBar"
        - "ToolbarActions"
        - "ReviewListCard"
        - "DataGridCard"

  safety_characteristics:
    safety_class: "A"
    safety_critical_functions: []
    risk_control_measures:
      - "Motion effects animate opacity and transform only (no layout thrash)."
      - "Reduced-motion preference collapses all durations to 0 ms so users with vestibular conditions never see a motion animation."
      - "No raw @mui import inside primitives; every visual decision flows through tokens so a future theme change propagates in one place."

  verification_status:
    verification_method: "Test"
    verification_complete: true
