# -- R-LEO-AI-066 -- Spinal Vertebral Notation Misclassified as Cancer TNM Staging
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-066"
  title: "Spinal vertebral level notation misclassified as cancer TNM staging observable entity"

  hazard:
    description: >
      Alphanumeric vertebral level labels (e.g. C3, T4, L5) used in musculoskeletal,
      physiotherapy, or spinal medicine encounters share the same token pattern as
      TNM staging components (T0-T4, N0-N3, M0-M1). The LLM extraction pipeline and
      the SNOMED surface-form resolver may incorrectly map these spinal anatomical
      references to cancer staging SNOMED concepts (e.g. 78873005 T category).
    category: "clinical_safety"

  hazardous_situation: >
    A GP consultation note contains spinal physiotherapy or musculoskeletal text
    such as "C3-T4 facet areas" or "NAGs C3". The LLM extraction model, lacking an
    explicit disambiguation rule, labels the isolated token "T4" as an observable
    entity. The terminology resolver maps "T4" to SNOMED 78873005 (T category,
    observable entity) via an existing surface-form mapping. The resulting
    cancer-staging entity is persisted to the patient graph and surfaced in the
    cancer audit pipeline, incorrectly associating a musculoskeletal encounter with
    a cancer staging observation. The episode builder or audit dashboard may then
    attribute an erroneous staging value to the patient's cancer episode.

  harm:
    description: >
      Incorrect cancer staging observable entity on patient record. Audit dashboards
      misstate the stage distribution of the cancer pathway cohort. Clinical quality
      teams may make inaccurate quality-improvement decisions based on inflated or
      incorrect staging data.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Add a spinal-context disambiguation guard to the scope guard post-processing
        layer (Layer 3). The guard detects when a standalone TNM-component token
        (T0-T4, N0-N3, M0-M1) appears in a sentence with spinal anatomical or
        manual-therapy markers (facet, vertebra, nags, snags, spinal, radiculopathy,
        etc.) and no full TNM triplet is present. Matching entities are suppressed
        before terminology resolution.
      implemented_by: ["DI-LEO-AI-093"]
      verified_by: ["VT-LEO-AI-093"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Add an explicit negative extraction rule to the LLM system prompt (DO NOT
        EXTRACT section) instructing the model not to label isolated vertebral level
        tokens as staging scale or observable entity when spinal context signals are
        present in the sentence.
      implemented_by: ["DI-LEO-AI-093"]
      verified_by: ["VT-LEO-AI-093"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The dual-layer defence (LLM prompt rule + post-processing scope guard) makes
      it unlikely that a spinal vertebral token passes both filters and reaches
      terminology resolution as a TNM staging concept. Any residual misclassification
      is visible to a clinical auditor via the coded-data tab in Mission Control
      before it influences quality decisions. Monthly monitoring of T-category entity
      counts on non-oncology encounters detects any regression.

  monitoring:
    monitoring_plan: >
      Monitor monthly the count of SNOMED 78873005 (T category) and related TNM
      observable-entity codes appearing on encounters classified as musculoskeletal,
      physiotherapy, or non-oncology specialty. Any non-zero count triggers a
      targeted audit of the affected encounters to assess whether spinal context
      was correctly suppressed.
    metrics:
      - "Count of T-category (78873005) entities on non-oncology encounters per month"
      - "False-positive staging entity rate on musculoskeletal/physiotherapy encounters"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Pipeline review - spinal TNM disambiguation gap 2026-04-10"
    identified_date: "2026-04-10"
    status: "analyzed"
    tags:
      - "tnm"
      - "staging"
      - "scope-guard"
      - "spinal"
      - "nlp-extraction"
