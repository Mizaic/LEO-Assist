# -- DI-LEO-AI-071 -- Avoidable Delay Assessment
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-071"
  type: "Functional"
  derived_from: ["UN-LEO-AI-025"]
  requirement: >
    The system SHALL provide an avoidable delay assessment capability that
    analyses clinical episode timelines to identify delays in the patient
    pathway that were potentially avoidable, classifying each delay by
    cause category and calculating the impact on overall pathway duration
    against programme-defined targets.
  rationale: >
    Identifying avoidable delays is a core requirement for cancer pathway
    improvement programmes. Clinical audit teams currently perform this
    assessment manually, which is time-consuming and inconsistent.
    Automated delay identification enables systematic quality improvement.

  machine_spec:
    agent_prompt: |
      Implement avoidable delay assessment service.
    acceptance_criteria:
      - type: "test"
        spec: "System identifies delays exceeding programme-defined thresholds"
      - type: "test"
        spec: "Delays are classified by cause category (provider, patient, system)"
      - type: "test"
        spec: "Delay impact on pathway duration is calculated correctly"
      - type: "test"
        spec: "Assessment results are stored and retrievable per patient episode"
    constraints:
      - type: "safety"
        spec: "Delay classifications are proposals requiring human review before clinical action"
    dependencies: ["DI-LEO-AI-009", "DI-LEO-AI-013"]
    downstream_impacts:
      - "Pathway improvement dashboards"
      - "Clinical governance reporting"
    technical_details:
      language: "Python"
      framework: "FastAPI"
      file_structure:
        - "services/api/app/services/delay_assessor.py"
        - "services/api/app/routers/delay_assessment.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All delay detection and classification tests pass"
    test_protocol: "VT-LEO-AI-071"

  safety_class: "B"
  risks: ["R-LEO-AI-021"]
  tags: ["avoidable-delay", "pathway-improvement", "quality", "cancer-pathways"]
