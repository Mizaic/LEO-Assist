# -- VT-LEO-AI-089 -- Data Quality Toolkit Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-089"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-089"]
    risks: ["R-LEO-AI-063"]

  metadata:
    title: "Data Quality Toolkit -- Service Layer and API Verification"
    description: >
      Verifies that the libs/dq/ service layer and /admin/dq/* API endpoints
      behave correctly: episode health, outcome inference, DQ rules engine,
      remediation dry-run safety, patient inspection, and admin auth guard.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_dq_toolkit.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "libs/dq/ service layer installed"
      - "Mock Neo4j clients available (MagicMock pattern)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-089-TC-001"
      case_name: "Episode health returns status distribution"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call get_episode_health() with mock patient client returning synthetic episode rows"
          expected_result: >
            Returns EpisodeHealthResult with status_counts dict covering all
            statuses present in mock data and total_count equal to row count
        - step_number: 2
          action: "Verify stale_count is sum of stale_no_diagnosis + stale_post_specialist"
          expected_result: "stale_count matches sum of stale sub-counts"
      verification_method: "automated"
      acceptance_criteria:
        - "EpisodeHealthResult.status_counts is a non-empty dict"
        - "EpisodeHealthResult.total_count > 0 when rows present"

    - case_id: "VT-089-TC-002"
      case_name: "Outcome inference returns correct verdict for cancer-only signals"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call infer_outcome() with synthetic episode (specialist_date set)
            and Phase 2 encounter text containing 'excision booked' and 'oncology referral'
          expected_result: "verdict == 'INFERRED_CANCER', flag == 'INFERRED_CANCER'"
        - step_number: 2
          action: >
            Call infer_outcome() with Phase 2 encounter text containing only
            'discharged, no further follow-up' and 'actinic keratosis'
          expected_result: "verdict == 'INFERRED_BENIGN', flag == 'INFERRED_BENIGN'"
        - step_number: 3
          action: "Call infer_outcome() with no Phase 2 encounters"
          expected_result: "verdict == 'UNRESOLVABLE', flag == 'HITL_REQUIRED'"
        - step_number: 4
          action: >
            Call infer_outcome() with equal cancer and benign signals
          expected_result: "verdict == 'AMBIGUOUS', flag == 'HITL_REQUIRED'"
      verification_method: "automated"
      acceptance_criteria:
        - "Verdict correctly assigned for each scenario"
        - "cancer_signals and benign_signals lists contain expected SignalHit entries"

    - case_id: "VT-089-TC-003"
      case_name: "DQ rules engine returns scorecard with at least one rule per dimension"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call run_all_rules() with mock clients returning known violations"
          expected_result: >
            Returns list[DQCheckResult] with entries for Completeness,
            Consistency, and Timeliness dimensions at minimum
        - step_number: 2
          action: "Verify rules with violation_count > threshold have status == 'fail'"
          expected_result: "status == 'fail' when violation_count > threshold"
        - step_number: 3
          action: "Verify rules with violation_count == 0 and threshold > 0 have status == 'pass'"
          expected_result: "status == 'pass'"
      verification_method: "automated"
      acceptance_criteria:
        - "At least 5 rules returned"
        - "Each DQCheckResult has non-empty rule_id, dimension, severity, status"

    - case_id: "VT-089-TC-004"
      case_name: "Remediation dry-run returns preview without writing"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call delete_patient(patient_id='test-123', dry_run=True) with mock client
            that tracks write calls
          expected_result: >
            Returns RemediationResult with dry_run=True and affected_count > 0;
            mock client records zero write transactions
        - step_number: 2
          action: >
            Verify that calling with dry_run=False invokes a write on the mock client
          expected_result: "Mock client write method called exactly once"
      verification_method: "automated"
      acceptance_criteria:
        - "dry_run=True never triggers a write to Neo4j"
        - "affected_count correctly reflects node/edge count from preview query"

    - case_id: "VT-089-TC-005"
      case_name: "Signal patterns module loads all required pattern sets"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Import signal_patterns and check POST_CANCER, POST_BENIGN, PRIVATE_MARKERS, SPECIALIST_SEEN are defined"
          expected_result: "All four pattern sets are non-empty lists of (pattern, label) tuples"
        - step_number: 2
          action: "Call match_signals(text='excision booked for SCC', patterns=POST_CANCER)"
          expected_result: "Returns at least one SignalHit with label containing 'excision'"
      verification_method: "automated"
      acceptance_criteria:
        - "All four pattern sets exported from signal_patterns module"
        - "match_signals returns correct SignalHit for known cancer text"

    - case_id: "VT-089-TC-006"
      case_name: "Surface form audit returns health metrics"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call get_surface_form_audit() with mock KG client returning SF rows"
          expected_result: >
            Returns SurfaceFormAuditResult with total_count, orphan_count,
            duplicate_count, inactive_target_count populated
        - step_number: 2
          action: "Verify orphan_count equals number of SFs with no MAPS_TO edges in mock data"
          expected_result: "orphan_count matches expected count from mock rows"
      verification_method: "automated"
      acceptance_criteria:
        - "SurfaceFormAuditResult contains all required fields"
        - "Counts correctly derived from mock data"

    - case_id: "VT-089-TC-007"
      case_name: "Patient inspect returns encounter and episode summary"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call get_patient_summary(patient_id='p1') with mock client returning 3 encounters and 1 episode"
          expected_result: >
            Returns PatientSummary with encounter_count=3, episode_count=1,
            episodes list containing the mock episode
      verification_method: "automated"
      acceptance_criteria:
        - "PatientSummary.encounter_count matches mock row count"
        - "PatientSummary.episodes is non-empty"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-089/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-089-RUN-001"
      date: "2026-04-07"
      executor: "automated (pytest)"
      environment: "development"
      result: "pass"
      passed_cases: 16
      failed_cases: 0
      notes: >
        All 16 test cases passed. Signal pattern matching, outcome inference
        verdicts (INFERRED_CANCER, INFERRED_BENIGN, AMBIGUOUS, UNRESOLVABLE),
        rules engine scorecard, remediation dry-run safety, surface form audit
        metrics, and patient summary all verified. Run time: 0.91s.
