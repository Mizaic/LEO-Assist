# -- DO-LEO-AI-168 -- Adaptive density preference implementation (Wave E Phase 1)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-168"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-169"]
    user_needs: ["UN-LEO-AI-071"]
    risks_addressed: ["R-LEO-AI-168"]
    verification_tests: ["VT-LEO-AI-168"]

  specification:
    title: "Density preference: graph storage, auth API, provider wiring, settings toggle"
    description: |
      Adds a per-practitioner UI density preference. Storage and writes
      live on the Coding graph (Practitioner.density_preference), the
      auth router exposes the preference on every session fetch and a
      dedicated PATCH endpoint for updates, and the existing
      DensityProvider learns to prefer the server value over local
      storage on staff routes. A new /settings/preferences page surfaces
      the toggle in plain English.
    acceptance_criteria:
      - criterion: "Session payload includes density_preference"
        type: "functional"
        measurement: "Test"
        target: "GET /auth/session returns density_preference (string|null) for authenticated and unauthenticated requests."
      - criterion: "PATCH validates and persists density"
        type: "functional"
        measurement: "Test"
        target: "PATCH /auth/session/density returns 200 with stored value for valid tiers, 400 for unknown tiers, 401 unauthenticated, 404 missing practitioner."
      - criterion: "DensityProvider precedence"
        type: "functional"
        measurement: "Test"
        target: "Server preference > localStorage > comfortable default on staff routes; spacious is forced on patient reachable routes regardless of preference."
      - criterion: "Settings toggle posts the change"
        type: "functional"
        measurement: "Inspection + Test"
        target: "Toggle on /settings/preferences calls setDensity which PATCHes /auth/session/density and refetches the session."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/cypher/density_queries.py"
        description: "ALLOWED_DENSITIES tuple, GET_PRACTITIONER_DENSITY, SET_PRACTITIONER_DENSITY"
      - artifact_type: "source_code"
        location: "libs/auth/density_state.py"
        description: "fetch_density, set_density, DensityNotAllowedError"
      - artifact_type: "source_code"
        location: "services/api/app/routers/auth.py"
        description: "patch_session_density endpoint + density_preference in session payloads"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/authContext.tsx"
        description: "DensityPreference type + densityPreference field on Session"
      - artifact_type: "source_code"
        location: "services/ui/src/context/DensityContext.tsx"
        description: "useAuth integration, server-preference precedence, PATCH-on-change, isPersisting flag"
      - artifact_type: "source_code"
        location: "services/ui/src/app/settings/preferences/page.tsx"
        description: "ToggleButtonGroup-driven density picker with plain-English helpers"
      - artifact_type: "source_code"
        location: "services/ui/src/app/settings/page.tsx"
        description: "Preferences card linking into /settings/preferences"
    storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 360
      key_functions:
        - "fetch_density"
        - "set_density"
        - "patch_session_density"
        - "DensityProvider"
        - "SettingsPreferencesPage"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Touch-target size enforcement on non-compact tiers (>=40px comfortable, >=44px spacious)"
      - "Tenant isolation: density writes only affect the authenticated practitioner"
    risk_control_measures:
      - "Whitelist of allowed density tiers in libs/cypher/density_queries.py"
      - "Patient-route override forces spacious in DensityProvider"
      - "Fail-soft fetch_density returns None on graph errors so login never blocks"

  verification_status:
    verification_method: "Test"
    verification_complete: true
