# -- DI-LEO-AI-507 -- Per-context SBAR Situation snippets editable in AI Instructions
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-507"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-092"
  requirement: >
    Each SummarisationContext value SHALL be backed by a
    :PromptConfig node in Neo4j named
    `sbar_situation_context_<value>` (version 1) whose
    `system_prompt` field holds the framing snippet that the SBAR
    orchestrator prepends to the Situation prompt for that context.
    The seed source of truth remains
    `libs/sbar/events.SUMMARISATION_CONTEXT_PROMPTS`. The runtime
    SHALL fetch the snippet from Neo4j first and fall back to the
    hardcoded dict if the node is missing or unreachable, so the
    pipeline cannot regress to an unframed Situation prompt even
    under partial outage. The :PromptConfig description SHALL begin
    with a `[<Group>]` prefix (Primary care, Secondary care,
    Statutory and social, Quality assurance) so the existing AI
    Instructions list groups the rows by clinical setting without
    bespoke UI work.
  rationale: >
    The existing SBAR per-context fragments (UN-LEO-AI-081 /
    DI-LEO-AI-231) ship as a Python dict and require a code change
    to tune. Wording differences between settings (a primary-care
    MDT framing vs a cancer MDT framing vs a palliative-care MDT
    framing) are the kind of thing QA + clinical leads need to
    refine iteratively. The PromptConfig store + AI Instructions
    surface already supports versioned, audited, admin-only edits
    for every other LLM prompt (UN-LEO-AI-071 / DI-LEO-AI-148);
    making the SBAR context snippets first-class PromptConfigs
    follows the same pattern and lets reviewers tune wording
    without engineering involvement.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: scripts/seed_prompt_configs.SEED_PROMPTS contains
          one entry per SummarisationContext value, named
          `sbar_situation_context_<value>` at version 1, with
          `system_prompt` set from
          libs.sbar.events.SUMMARISATION_CONTEXT_PROMPTS and
          `description` set to
          `"[<Group>] <Human label>"` where Group is one of
          Primary care / Secondary care / Statutory and social /
          Quality assurance.
      - type: "functional"
        spec: >
          AC-002: libs/sbar/source_resolver._resolve_artifact()
          fetches the snippet for the requested context from Neo4j
          via GET_PROMPT_BY_NAME (name=`sbar_situation_context_<value>`,
          version=1) when a session is provided, and falls back to
          SUMMARISATION_CONTEXT_PROMPTS when (a) the session is None,
          (b) Neo4j returns no row, or (c) the lookup raises.
      - type: "functional"
        spec: >
          AC-003: The fetched snippet is cached for the lifetime of
          the resolver call so a single SBAR run never issues more
          than one PromptConfig lookup per distinct context.
      - type: "functional"
        spec: >
          AC-004: services/ui/src/app/admin/prompts/page.tsx
          ::categorise() recognises any prompt name starting with
          `sbar_situation_context_` and assigns it the category named
          by the `[<Group>]` prefix in the description (so the rows
          group under Primary care, Secondary care, Statutory and
          social, or Quality assurance in the AI Instructions list).
      - type: "safety"
        spec: >
          AC-005: PromptConfig CRUD for these nodes uses the same
          admin-only auth path as every other PromptConfig
          (require_admin or equivalent). No new edit role is added.
    constraints:
      - type: "safety"
        spec: >
          The hardcoded SUMMARISATION_CONTEXT_PROMPTS dict MUST
          remain populated for every enum value so the runtime
          fallback always has something to return; deletion is not
          permitted for the seeded snippet text.
      - type: "safety"
        spec: >
          A user-edited PromptConfig (source='user') MUST NOT be
          overwritten by the seed_if_missing() startup hook. This
          property is enforced today by UPSERT_SEED_PROMPT and is
          covered by an existing unit test on the seed script.
    dependencies:
      - "DI-LEO-AI-148"
      - "DI-LEO-AI-231"
    downstream_impacts:
      - "SBAR Playground (consumer of the snippets)"
      - "AI Instructions list page (lists the new PromptConfigs)"
      - "Per-tenant LLM cost panels (per-context spend now visible
        once snippets are tuned)"
    technical_details:
      language: "Python + TypeScript"
      framework: "Pydantic + Neo4j (backend), Next.js + MUI (UI)"
      file_structure:
        - "libs/sbar/events.py"
        - "libs/sbar/source_resolver.py"
        - "scripts/seed_prompt_configs.py"
        - "services/ui/src/app/admin/prompts/page.tsx"
      estimated_loc: 380

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-509 covers the seed parity (every enum value gets a
      seeded PromptConfig with the correct description prefix), the
      source-resolver Neo4j-first lookup, the fallback path on
      missing/raising sessions, the resolver per-call cache, and the
      AI Instructions categoriser change.
    test_protocol: "VT-LEO-AI-509"

  safety_class: "B"
  risks:
    - "R-LEO-AI-507"
  tags:
    - "sbar"
    - "ai-instructions"
    - "summarisation-context"
    - "promptconfig"
