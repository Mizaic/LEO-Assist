# -- VT-LEO-AI-509 -- Per-context SBAR snippets seeded + Neo4j-first resolver
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-509"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-507", "DI-LEO-AI-231"]
    risks: ["R-LEO-AI-507"]

  metadata:
    title: "Per-context SBAR Situation snippets editable in AI Instructions"
    description: >
      Pytest verifies that (a) the SummarisationContext enum, the
      labels dict and the prompts dict all expose the same 34 values
      after the secondary-care expansion; (b) the seed script
      produces one PromptConfig per value with the correct
      [<Group>] description prefix and snippet text; (c) the source
      resolver fetches the snippet from Neo4j when a session is
      provided and falls back to the hardcoded dict when the session
      is None / returns no row / raises; (d) the resolver caches
      lookups within a single call.       A static-source jest test
      verifies the SummarisationContextSelect groups (Primary care,
      Secondary care, Statutory and social, Quality assurance) and
      the 34-option count, plus enum parity with the Python source,
      and the card-grid Dialog markup (search field, grid columns,
      empty / no-match state, ButtonBase cards with aria-pressed).
      A second static-source jest test verifies the AI Instructions
      categoriser handles the new sbar_situation_context_* names.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest + jest"
    test_file_paths:
      - "tests/test_sbar_summarisation_context.py"
      - "tests/test_seed_prompt_configs_sbar_context.py"
      - "services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx"
      - "services/ui/src/__tests__/prompts-list-sbar-context-categoriser.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest"
      - "Node 20+ / jest 30"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-509-TC-001"
      case_name: "Enum has exactly 34 members and full label / prompt coverage"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert len(SummarisationContext) == 34 and that SUMMARISATION_CONTEXT_LABELS / SUMMARISATION_CONTEXT_PROMPTS cover every value with non-empty strings"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Enum stays the contract surface for the playground and orchestrator after the secondary-care expansion"

    - case_id: "VT-509-TC-002"
      case_name: "Seed script emits one PromptConfig per context with correct [<Group>] description prefix"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Import scripts.seed_prompt_configs.SEED_PROMPTS and filter to entries whose name starts with sbar_situation_context_"
          expected_result: "Exactly len(SummarisationContext) entries; each carries the matching SUMMARISATION_CONTEXT_PROMPTS text and a description starting with one of: '[Primary care] ', '[Secondary care] ', '[Statutory and social] ', '[Quality assurance] '"
          verification_method: "automated"
      acceptance_criteria:
        - "Every enum value gets a seeded PromptConfig with the correct group prefix"

    - case_id: "VT-509-TC-003"
      case_name: "source_resolver returns Neo4j snippet when session yields a row"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build a fake session that returns a single row with system_prompt='OVERRIDE FRAMING' for the matching name; resolve a summarisation_context artefact"
          expected_result: "Resolved entry's prompt_snippet == 'OVERRIDE FRAMING' (NOT the hardcoded dict value)"
          verification_method: "automated"
      acceptance_criteria:
        - "Admin-edited wording is honoured by the runtime"

    - case_id: "VT-509-TC-004"
      case_name: "source_resolver falls back to hardcoded dict on missing/raising session"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Resolve a summarisation_context artefact with session=None; resolve again with a session whose run() raises; resolve again with a session whose .single() returns None"
          expected_result: "All three resolutions return prompt_snippet == SUMMARISATION_CONTEXT_PROMPTS[<value>]; resolver never raises and never returns None"
          verification_method: "automated"
      acceptance_criteria:
        - "Pipeline cannot regress to an unframed Situation prompt"

    - case_id: "VT-509-TC-005"
      case_name: "Per-call cache: same context resolved twice issues at most one PromptConfig lookup"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Build a counting session; resolve two summarisation_context artefacts with the same context_value via resolve_situation()"
          expected_result: "Session.run() with the GET_PROMPT_BY_NAME query is invoked at most once"
          verification_method: "automated"
      acceptance_criteria:
        - "No N+1 lookup pattern under a multi-artefact Situation"

    - case_id: "VT-509-TC-006"
      case_name: "SummarisationContextSelect renders a card-grid Dialog with 4 groups (Secondary care, not Acute) and 34 options"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: read SummarisationContextSelect.tsx; assert exactly 4 group: '...' literals and that they include 'Secondary care' (not 'Acute'); assert 34 value: 'snake_case' literals; assert legacy MUI Select / ListSubheader / MenuItem markup is gone; assert the Dialog, search input (data-testid summarisation-context-search), responsive grid template (1 / 2 / 3 columns), no-match empty state and ButtonBase cards with aria-pressed are present"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "UI groups match the new clinical-setting taxonomy"
        - "Picker is a Dialog with a search field and a grouped grid of cards (no dropdown)"

    - case_id: "VT-509-TC-007"
      case_name: "Frontend / backend enum parity at 34 values"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: read SummarisationContextValue union from SummarisationContextSelect.tsx; read enum members from libs/sbar/events.py; assert sets equal and size is 34"
          expected_result: "Both sides have the same 34 string values"
          verification_method: "automated"
      acceptance_criteria:
        - "No silent drift between client and server contract"

    - case_id: "VT-509-TC-008"
      case_name: "AI Instructions categoriser groups sbar_situation_context_* by [<Group>] prefix"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Static-source / unit: read prompts/page.tsx; assert categorise() recognises name prefix sbar_situation_context_ and uses the [<Group>] description prefix as the category label"
          expected_result: "categorise({name: 'sbar_situation_context_two_week_wait', description: '[Primary care] Suspected cancer ...'}).label === 'Primary care'"
          verification_method: "automated"
      acceptance_criteria:
        - "AI Instructions list groups SBAR context rows by clinical setting"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-509/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-509-EXEC-2026-04-19-002"
      execution_date: "2026-04-19"
      executor: "automated"
      environment: "development"
      result: "pass"
      cases_executed: 8
      cases_passed: 8
      cases_failed: 0
      duration_seconds: 0.6
      notes: >
        Re-ran after the SummarisationContextSelect picker was
        re-shaped from a grouped MUI Select to a card-grid Dialog
        (button trigger -> Dialog with search field + responsive
        grid of selectable cards grouped by clinical setting).
        Jest: 7/7 passed for
        services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx
        (TC-006 expanded to assert the Dialog markup, search input,
        responsive grid template, no-match empty state and
        ButtonBase aria-pressed cards; legacy ListSubheader /
        MenuItem / MUI Select assertions inverted to "must NOT
        appear"). 11/11 passed for
        services/ui/src/__tests__/sbar-playground-chrome.test.tsx
        and
        services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx
        in combination. Python and AI-instructions categoriser
        cases (TC-001..TC-005, TC-007 backend, TC-008) unchanged.
    - execution_id: "VT-LEO-AI-509-EXEC-2026-04-19-001"
      execution_date: "2026-04-19"
      executor: "automated"
      environment: "development"
      result: "pass"
      cases_executed: 8
      cases_passed: 8
      cases_failed: 0
      duration_seconds: 1.8
      notes: >
        Pytest: 21/21 passed for tests/test_sbar_summarisation_context.py
        and tests/scripts/test_seed_prompt_configs_sbar_context.py
        (covers TC-001 to TC-005 and TC-007 enum parity from the Python
        side). Jest: 11/11 passed for
        services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx
        and
        services/ui/src/__tests__/prompts-list-sbar-context-categoriser.test.ts
        (covers TC-006, TC-007 UI side, and TC-008). All cases pass with
        no critical violations; all 14 new secondary-care contexts are
        present, the Acute group is fully renamed to Secondary care, the
        mdt_discussion label is disambiguated to "MDT prep (primary
        care)", the resolver honours admin-edited PromptConfig text and
        falls back safely on no-row / empty / raising sessions, and the
        per-call cache collapses repeat lookups for the same context to
        a single Neo4j query.
