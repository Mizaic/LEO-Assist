- id: "VT-LEO-AI-141"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-142"]
    risks: []

  metadata:
    title: "Wave E Phase 1 -- Knowledge primitives in @leo/design-system"
    description: >
      Verifies the seven new primitives (MetricTile, ProgressStrip,
      SegmentedTabs, FilterBar, ToolbarActions, ReviewListCard,
      DataGridCard) and the StatHero framer-motion stagger upgrade.
      Tests render each primitive, assert testids, assert ARIA
      contracts, and static-scan every primitive source file for
      the absence of @mui imports.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/knowledge-primitives.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-141-TC-001"
      case_name: "MetricTile renders label + value and becomes <button> when onClick provided"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render MetricTile with label, value, hint, and separately with onClick"
          expected_result: >
            data-testid 'metric-tile-<id>' present; label/value/hint
            text visible; when onClick provided the root tag is
            'button'.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-001 passes"

    - case_id: "VT-141-TC-002"
      case_name: "ProgressStrip clamps pct and exposes role=progressbar"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render ProgressStrip at value=55/total=100 and value=0/total=0"
          expected_result: >
            role='progressbar' on track; aria-valuenow reflects the
            clamped percentage (55, 0); no throw on total=0.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-002 passes"

    - case_id: "VT-141-TC-003"
      case_name: "SegmentedTabs is role=tablist, keyboard-navigable, click-to-select"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Focus first tab and press ArrowRight; click the second tab"
          expected_result: >
            Focus moves to the next tab; aria-selected flips to the
            clicked tab; role='tablist' on the outer element.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-003 passes"

    - case_id: "VT-141-TC-004"
      case_name: "FilterBar has role=search, aria-pressed chips, controlled search"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render FilterBar with one chip; click the chip; type in the search input"
          expected_result: >
            role='search' on form; chip flips aria-pressed from
            false to true; search input value updates.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-004 passes"

    - case_id: "VT-141-TC-005"
      case_name: "ToolbarActions renders every action and fires onClick"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render ToolbarActions with two actions; click one"
          expected_result: >
            data-testid 'toolbar-action-<id>' present; the onClick
            spy on the clicked action fires exactly once.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-005 passes"

    - case_id: "VT-141-TC-006"
      case_name: "ReviewListCard renders items and supports empty state"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render ReviewListCard with two items; separately render with items=[] and emptyState"
          expected_result: >
            Each item has data-testid 'review-list-item-<id>';
            empty state renders via 'review-list-empty' with the
            provided content.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-006 passes"

    - case_id: "VT-141-TC-007"
      case_name: "DataGridCard renders rows and columns with scope=col"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render DataGridCard with two rows and one column; separately render with rows=[]"
          expected_result: >
            th[scope='col'] present for each column; each row has
            data-testid 'data-grid-row-<id>'; empty state renders
            via 'data-grid-empty' when rows is empty.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-007 passes"

    - case_id: "VT-141-TC-008"
      case_name: "StatHero wraps every tile in a motion frame"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render StatHero with three stats"
          expected_result: >
            Every tile has 'stat-tile-<id>-frame' (the framer-motion
            wrapper) AND 'metric-tile-<id>' (the underlying tile).
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-008 passes"

    - case_id: "VT-141-TC-010"
      case_name: "No primitive imports from @mui/material or @mui/icons"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Static-scan the .tsx source of MetricTile, ProgressStrip,
            SegmentedTabs, FilterBar, ToolbarActions, ReviewListCard,
            DataGridCard, and StatHero.
          expected_result: >
            None of the files contain `from "@mui/material"` or
            `from "@mui/icons"`.
      verification_method: "automated"
      acceptance_criteria:
        - "knowledge-primitives.test.tsx TC-010 passes (one assertion per primitive)"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-141/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-141-2026-04-17-001"
      executed_at: "2026-04-17T00:00:00Z"
      executor: "rob.smith@mizaic.ai"
      environment: "local-dev"
      result: "pass"
      jest_summary: >
        pass -- knowledge-primitives.test.tsx (21 cases across
        MetricTile, ProgressStrip, SegmentedTabs, FilterBar,
        ToolbarActions, ReviewListCard, DataGridCard, StatHero,
        and the @mui static-scan).
      notes: "All 21 assertions pass on first run."
