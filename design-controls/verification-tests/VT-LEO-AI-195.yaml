# -- VT-LEO-AI-195 -- Narrative-reference referral guard
# IEC 62304 Verification Test

- id: "VT-LEO-AI-195"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-202"
    risks:
      - "R-LEO-AI-192"

  metadata:
    title: "Narrative-reference referral guard: text_generic suppressed when narrative-only and no structural cue"
    description: >
      Verifies the DI-LEO-AI-202 narrative-reference guard.
      A free-text encounter that REFERENCES a past referral
      (DNA, "explained the 2WW referral was rejected") and
      contains NO structural artefact (XaY59, PRISM
      Pathway, "Refer via 2WW") MUST NOT add a text_generic
      referral anchor. Encounters carrying a structural cue
      MUST keep the referral.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_patient_4643293950_patterns.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-195-TC-001"
      case_name: "DNA narrative without structural cue MUST NOT emit text_generic referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters([{narrative DNA encounter}], set())"
          expected_result: "Returned referrals contain no entry with referral_subtype='text_generic'"
          verification_method: "automated"
      acceptance_criteria:
        - "No text_generic referral emitted"

    - case_id: "VT-195-TC-002"
      case_name: "Encounter with explicit 'Refer via 2WW LGI pathway. Outbound referral (XaY59) PRISM 2WW Lower GI Pathway Accessed' MUST keep referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters([{structural+narrative encounter}], set())"
          expected_result: "len(referrals) >= 1"
          verification_method: "automated"
      acceptance_criteria:
        - "At least one referral anchor emitted"

    - case_id: "VT-195-TC-003"
      case_name: "'Explained 2WW referral requested again but got rejected' narrative MUST NOT emit text_generic referral"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters([{narrative explanation encounter}], set())"
          expected_result: "Returned referrals contain no entry with referral_subtype='text_generic'"
          verification_method: "automated"
      acceptance_criteria:
        - "No text_generic referral emitted"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types:
      - "automated_test_run"
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-195/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-LEO-AI-195-EXEC-001"
      executed_at: "2026-04-18T11:30:00Z"
      executor: "automated"
      result: "pass"
