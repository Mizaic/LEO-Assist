# -- DI-LEO-AI-008 -- Guideline Rule Engine
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-008"
  type: "Functional"
  derived_from: ["UN-LEO-AI-004", "UN-LEO-AI-016"]
  requirement: "The system SHALL evaluate coded encounter patterns against programme-defined guideline rules and generate deviation alerts with severity classification and guideline reference links"
  rationale: "Guideline compliance checking is the core value proposition for audit teams. Rules are defined per programme and stored as data, enabling new guidelines to be added without code changes. NG12 cancer referral rules are the launch configuration."

  machine_spec:
    agent_prompt: |
      Implement guideline rule engine (~250 LOC).

      SINGLE PURPOSE: Evaluate coded encounter patterns against
      programme-defined guideline rules and generate deviation alerts.

      REQUIREMENTS:
      1. Load guideline rules from Neo4j programme configuration
      2. Accept coded encounter data with SNOMED concepts and dates
      3. Evaluate each rule against the encounter pattern
      4. Generate deviation alerts with severity (info, warning, critical)
      5. Attach guideline reference links to each alert
      6. Support rule composition (AND, OR, NOT, temporal operators)
      7. NG12 cancer referral rules as launch configuration

      METHODS:
      - evaluate(encounters, programme): Run all rules, return alerts
      - load_rules(programme_id): Fetch rules from Neo4j
      - evaluate_rule(rule, encounters): Check single rule
      - classify_severity(deviation): Assign alert severity
      - format_alert(rule, deviation): Build structured alert

      CODE CLARITY:
      - Rules are data in Neo4j, engine is generic
      - Rule evaluation is deterministic and reproducible
      - Each alert traces back to specific rule and evidence

    acceptance_criteria:
      - type: "test"
        spec: "Guideline alert accuracy >= 90% against expert-reviewed cases"
      - type: "test"
        spec: "All alerts include guideline reference link and severity"
      - type: "test"
        spec: "NG12 rule set produces correct alerts for known test cases"

    constraints:
      - type: "safety"
        spec: "Critical guideline deviations never suppressed or downgraded"
      - type: "regulatory"
        spec: "Rule definitions traceable to specific NICE guideline sections"
      - type: "code_quality"
        spec: "Rules are data-driven -- adding new guidelines requires no code changes"

    dependencies: []

    downstream_impacts:
      - "services/analysis_worker -- alerts surfaced in analysis output"
      - "services/ui -- alerts displayed in audit dashboard"

    technical_details:
      language: "Python"
      framework: "None"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/safety_net_detector.py"
        - "libs/domains/ncda_concept_sets.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Guideline alert accuracy >= 90% against expert-reviewed cases"
    test_protocol: "VT-LEO-AI-008"

  safety_class: "B"
  risks: ["R-LEO-AI-023", "R-LEO-AI-025"]
  tags: ["guideline-compliance", "nice-ng12", "rule-engine", "analysis"]
