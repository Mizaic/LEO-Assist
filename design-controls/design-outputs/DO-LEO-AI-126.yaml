# -- DO-LEO-AI-126 -- Practitioner role model implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-126"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-129"]
    user_needs: ["UN-LEO-AI-069"]
    risks_addressed: ["R-LEO-AI-089", "R-LEO-AI-091"]
    verification_tests: ["VT-LEO-AI-125"]

  specification:
    title: "Practitioner.selected_role, allowed_roles, and (:RoleSwitch) audit"
    description: |
      Adds a `selected_role` string property and a derived `allowed_roles`
      projection to each (:Practitioner). Extends /auth/session to
      include both fields. Adds PATCH /auth/session/role to set the
      role and write an append-only (:RoleSwitch) audit node. Seeds
      the four canonical (:Role) nodes.
    acceptance_criteria:
      - criterion: "Session carries role fields"
        type: "functional"
        measurement: "Test"
        target: "GET /auth/session response schema contains selected_role and allowed_roles"
      - criterion: "Role switch is audited"
        type: "safety"
        measurement: "Test"
        target: "Each successful PATCH creates exactly one (:RoleSwitch {from, to, at, session_id})"
      - criterion: "Rejects unauthorised role"
        type: "safety"
        measurement: "Test"
        target: "PATCH returns 403 when target role is not in allowed_roles"
      - criterion: "Canonical roles seeded"
        type: "functional"
        measurement: "Inspection"
        target: "(:Role {name}) exists for clinician, staff, qa_ra_lead, platform_admin"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/auth.py"
        description: "GET /auth/session and PATCH /auth/session/role handlers"
      - artifact_type: "source_code"
        location: "libs/cypher/admin_queries.py"
        description: "GET_PRACTITIONER_ROLE_STATE, SET_PRACTITIONER_SELECTED_ROLE, CREATE_ROLE_SWITCH_AUDIT, SEED_CANONICAL_ROLES"
      - artifact_type: "source_code"
        location: "libs/auth/practitioner_org_context.py"
        description: "Extended to return allowed_roles + selected_role"
      - artifact_type: "migration"
        location: "scripts/seed_canonical_roles.py"
        description: "Idempotent seed for the four canonical roles"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 180
      key_functions:
        - "get_practitioner_role_state"
        - "patch_selected_role"
        - "create_role_switch_audit"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "RoleSwitch audit write is append-only and cannot be disabled"
    risk_control_measures:
      - "PATCH rejects roles not in allowed_roles (R-089)"
      - "Audit node is always created before the session is updated (R-091)"

  verification_status:
    verification_method: "Test"
    verification_complete: false
