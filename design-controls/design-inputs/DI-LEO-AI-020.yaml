# -- DI-LEO-AI-020 -- Organisation-Scoped Authentication
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-020"
  type: "Security"
  derived_from: ["UN-LEO-AI-013", "UN-LEO-AI-021"]
  requirement: "The system SHALL authenticate all API requests via Azure AD / Entra ID, extract the user's organisation context from the token claims, and enforce organisation-scoped data access for all subsequent queries"
  rationale: "Multi-tenant data isolation requires that every API request is scoped to the authenticated user's organisation. Organisation context extracted from the auth token is injected into all database queries as a mandatory filter."

  machine_spec:
    agent_prompt: |
      Implement organisation-scoped authentication (~150 LOC).

      SINGLE PURPOSE: Authenticate API requests via Azure AD / Entra ID
      and enforce organisation-scoped data access on all queries.

      REQUIREMENTS:
      1. Validate Azure AD / Entra ID JWT tokens on all API requests
      2. Extract organisation context (tenant ID, org ID) from token claims
      3. Inject organisation scope into FastAPI dependency chain
      4. Enforce organisation filter on all database queries
      5. Reject requests with missing or invalid organisation context
      6. Log authentication events for audit trail

      METHODS:
      - validate_token(token): Verify JWT signature and claims
      - extract_org_context(claims): Parse organisation from token
      - get_current_org(request): FastAPI dependency returning org scope
      - enforce_org_filter(query, org_id): Apply mandatory org filter

      CODE CLARITY:
      - Organisation scope is a mandatory FastAPI dependency
      - No database query can bypass organisation filter
      - Clear error messages for authentication failures

    acceptance_criteria:
      - type: "test"
        spec: "All API endpoints require valid Azure AD token"
      - type: "test"
        spec: "Organisation scope enforced on all data queries"
      - type: "test"
        spec: "Cross-tenant data access prevented"
      - type: "test"
        spec: "Requests without valid token return 401"

    constraints:
      - type: "security"
        spec: "No API endpoint accessible without valid Azure AD token"
      - type: "security"
        spec: "Organisation filter cannot be bypassed at application layer"

    dependencies: []

    downstream_impacts:
      - "services/api -- all endpoints use org-scoped auth"
      - "services/analytics_api -- dashboard queries scoped by org"
      - "services/fhir_api -- FHIR data access scoped by org"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["msal", "azure-identity"]
      file_structure:
        - "libs/auth/org_scope.py"
        - "libs/auth/tenant_context.py"
        - "services/api/app/deps.py"
      estimated_loc: 150

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All API endpoints require valid Azure AD token; organisation scope enforced on all data queries; cross-tenant access prevented"
    test_protocol: "VT-LEO-AI-020"

  safety_class: "B"
  risks: ["R-LEO-AI-010", "R-LEO-AI-024"]
  tags: ["authentication", "rbac", "multi-tenancy", "security"]
