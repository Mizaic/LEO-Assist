# -- VT-LEO-AI-180 -- Offline gold-label entity audit
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-180"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-186"]
    risks: ["R-LEO-AI-180"]

  metadata:
    title: "audit_existing_entity / audit_gold_label_entities detect qualifier-value-on-clinical-label, tag_label_mismatch, missing fields, and stored_tag_drift with documented severity"
    description: >
      Pins the offline self-consistency audit added to
      scripts/lib/gold_label_snomed_check.py. Includes a live-
      payload replay of GL-d3ffb211468a5bcf to guarantee the
      regression that motivated the audit is detected.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_gold_label_existing_entities_audit.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest 8+"
    test_data:
      data_type: "synthetic + live-payload-replay"
      cleanup_required: false

  test_cases:
    - case_id: "VT-180-TC-001"
      case_name: "Normal/Negative qualifier-value concept on finding label is critical"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity({label='finding', snomed_term='Normal (qualifier value)', ...})"
          expected_result: "issues includes qualifier_value_on_clinical_label; severity == critical"
          verification_method: "automated"
      acceptance_criteria:
        - "Issue code present and severity ranks as critical"

    - case_id: "VT-180-TC-002"
      case_name: "Qualifier-value SNOMED on disorder / procedure / observable_entity labels are all critical"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Repeat TC-001 with disorder, procedure, observable_entity labels"
          expected_result: "All three flagged as critical"
          verification_method: "automated"
      acceptance_criteria:
        - "Three independent test cases all pass"

    - case_id: "VT-180-TC-003"
      case_name: "Qualifier-value SNOMED on qualifier_value label is clean"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity({label='qualifier_value', snomed_term='Normal (qualifier value)', ...})"
          expected_result: "is_clean == True"
          verification_method: "automated"
      acceptance_criteria:
        - "No qualifier_value_on_clinical_label issue raised on the legitimate case"

    - case_id: "VT-180-TC-004"
      case_name: "finding<->disorder synonym tolerance preserved"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity({label='finding', snomed_term='Malignant tumor of prostate (disorder)', ...})"
          expected_result: "tag_label_mismatch NOT present (covered by _TAG_SYNONYMS)"
          verification_method: "automated"
      acceptance_criteria:
        - "Synonym tolerance honoured"

    - case_id: "VT-180-TC-005"
      case_name: "Procedure label with disorder concept is critical (not in synonym table)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity({label='procedure', snomed_term='Malignant tumor of prostate (disorder)', ...})"
          expected_result: "tag_label_mismatch present; severity critical"
          verification_method: "automated"
      acceptance_criteria:
        - "Critical-severity flag raised"

    - case_id: "VT-180-TC-006"
      case_name: "Stored-tag-drift is info-only when no other issue dominates"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity with stored semantic_tag drifting from term suffix but label/term consistent"
          expected_result: "stored_tag_drift in issues; severity == info"
          verification_method: "automated"
      acceptance_criteria:
        - "Info-level severity correctly ranked"

    - case_id: "VT-180-TC-007"
      case_name: "Blocked-assertion-with-concept is info (intentional negative-example training)"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "audit_existing_entity with assertion=absent, planned, etc."
          expected_result: "issue present; severity info"
          verification_method: "automated"
      acceptance_criteria:
        - "Severity downgraded to info to avoid false alarms"

    - case_id: "VT-180-TC-008"
      case_name: "Missing concept_id and missing label both critical"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "audit with snomed_concept_id='' or label=''"
          expected_result: "missing_concept_id / missing_label issue; severity critical"
          verification_method: "automated"
      acceptance_criteria:
        - "Both critical-severity"

    - case_id: "VT-180-TC-009"
      case_name: "Critical dominates warning and info when stacked"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "audit with all three severities triggered"
          expected_result: "result.severity == critical"
          verification_method: "automated"
      acceptance_criteria:
        - "Severity ranking is monotone"

    - case_id: "VT-180-TC-010"
      case_name: "Live-payload replay of GL-d3ffb211468a5bcf"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "audit_gold_label_entities on the actual JSON payload from the failing record"
          expected_result: "Procedure entity clean; qualifier_value entity flagged"
          verification_method: "automated"
      acceptance_criteria:
        - "Audit reproduces the exact diagnosis manually performed during the 2026-04-17 investigation"

    - case_id: "VT-180-TC-011"
      case_name: "Audit handles empty / malformed payloads safely"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "audit_gold_label_entities with None, '', '[]', 'not json', '{}', mixed-list inputs"
          expected_result: "Returns [] without raising for invalid; skips non-dict entries"
          verification_method: "automated"
      acceptance_criteria:
        - "No exceptions raised on any malformed input"

    - case_id: "VT-180-TC-012"
      case_name: "Every emitted issue code has a documented description"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Walk ENTITY_AUDIT_ISSUE_CODES dict"
          expected_result: "Every code emitted by audit_existing_entity has a non-empty description"
          verification_method: "automated"
      acceptance_criteria:
        - "Documentation is complete"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run", "live_payload_replay"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-180/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-180-EXEC-001"
      executed_at: "2026-04-17"
      executor: "automated-pytest"
      command: "python3 -m pytest tests/test_gold_label_existing_entities_audit.py -v"
      result: "pass"
      summary: "22/22 cases passed; runtime 0.08s"
