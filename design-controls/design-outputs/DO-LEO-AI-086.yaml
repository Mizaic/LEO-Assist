# -- DO-LEO-AI-086 -- Post-specialist outcome inference implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-086"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-088"]
    user_needs: ["UN-LEO-AI-055"]
    risks_addressed: ["R-LEO-AI-062"]
    verification_tests: ["VT-LEO-AI-088"]

  specification:
    title: "Post-specialist outcome inference engine and analytics integration"
    description: |
      Implements a third pass in the episode builder pipeline that scans
      post-specialist encounters for textual outcome signals and writes
      inferred_outcome, inferred_outcome_date, inferred_confidence, and
      inference_signals onto stale_post_specialist EpisodeOfCare nodes.
      Integrates the inferred outcome date into analytics KPI and audit
      Cypher queries as a fallback for the diagnostic interval. Exposes
      all four new fields via the episode_timeline API endpoint and renders
      amber confidence badges in the dashboard and audit UX.
    acceptance_criteria:
      - criterion: "InferenceResult all branches"
        type: "functional"
        measurement: "Test"
        target: "All 5 verdict branches (INFERRED_CANCER, INFERRED_BENIGN, INFERRED_CANCER_WEAK, INFERRED_BENIGN_WEAK, HITL_REQUIRED) return correct inferred_outcome, inferred_outcome_date, and inferred_confidence"
      - criterion: "Earliest signal date"
        type: "functional"
        measurement: "Test"
        target: "inferred_outcome_date equals min(enc.date) over encounters that fired at least one signal, not the specialist_date or referral_date"
      - criterion: "Analytics fallback"
        type: "functional"
        measurement: "Test"
        target: "avg_days_to_diagnosis and di_days include inferred cancer episodes when no diagnosis milestone exists"
      - criterion: "No status mutation"
        type: "safety"
        measurement: "Inspection"
        target: "Episode status remains stale_post_specialist after inference pass; only the four new properties are written"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/pipeline/outcome_inference.py"
        description: "POST_CANCER/POST_BENIGN patterns, InferenceResult dataclass, score_post_specialist_encounters()"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder.py"
        description: "_apply_outcome_inference() third pass, _INFERENCE_UPDATE_Q Cypher"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/benchmarks.py"
        description: "effective_diag_date CASE fallback in kpi_benchmarks"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/audit.py"
        description: "effective_diag_date fallback + diag_is_inferred in _q_intervals and audit_summary"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/dashboards.py"
        description: "Four inferred_* fields added to episode_timeline RETURN"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/analyticsApi.ts"
        description: "EpisodeTimeline type extended with inferred_* fields"
      - artifact_type: "source_code"
        location: "services/ui/src/components/dashboard/KPICards.tsx"
        description: "incl. N inferred sub-line on avg_days_to_diagnosis"
      - artifact_type: "source_code"
        location: "services/ui/src/components/episodes/EpisodeList.tsx"
        description: "Amber inferred badge + confidence % for stale_post_specialist episodes"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 220
      key_functions:
        - "score_post_specialist_encounters"
        - "_apply_outcome_inference"
        - "_INFERENCE_UPDATE_Q"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Must not overwrite coded diagnosis episodes"
      - "HITL_REQUIRED episodes must retain hitl_flag=true"
      - "Inferred confidence must not exceed 0.95"
    risk_control_measures:
      - "Engine only processes stale_post_specialist; guard clause on status check"
      - "Episode status is never changed by inference - only additive properties written"
      - "hitl_reason always set describing inference basis for audit trail"

  verification_status:
    verification_method: "Test"
    verification_complete: false
