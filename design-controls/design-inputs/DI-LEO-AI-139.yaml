# -- DI-LEO-AI-139 -- Role-first intro copy + layout across every major area
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-139"
  type: "Usability"
  derived_from: ["UN-LEO-AI-069", "UN-LEO-AI-070"]
  requirement: >
    Every top-level area landing page SHALL open with a role-aware
    IntroCard sourced from a centralised AREA_INTRO_COPY map,
    rendered through a small AreaIntro wrapper that reads the
    session role and hands the copy to <IntroCard> from
    @leo/design-system. The areas in scope are: /care/dashboard
    (Care Overview), /admin/console (Operations),
    /admin/pathway-explorer (Pathway Explorer), /admin/platform
    (Platform), /admin/users (Users), /admin/portal (Portal),
    /admin/support (Support), /settings (Settings), and /work (Work
    queue). Every area SHALL declare a default copy block graded <=9
    on Flesch-Kincaid plus a copy block for at least one of
    clinician/staff/qa_ra_lead/platform_admin where the role is a
    primary user of the area. The feature flag
    `NEXT_PUBLIC_ROLE_FIRST` SHALL default to enabled in the shipped
    Next.js config so the role-first shell reaches all users.
  rationale: >
    Phases 1-4 proved the IntroCard + KnowledgePageLayout pattern
    inside the Knowledge hub and the /work queue. UN-LEO-AI-069
    explicitly asks for the same role-first scaffolding everywhere;
    without this migration only two areas benefit from the inclusive
    copy and the rest stay inconsistent. Promoting the feature flag
    default completes the rollout so every user sees the role-aware
    shell on their next load.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/lib/areaCopy.ts exports a typed
          AREA_INTRO_COPY record whose keys are the string literals
          'care-overview' | 'operations' | 'pathway-explorer' |
          'platform' | 'users' | 'portal' | 'support' | 'settings' |
          'work'. Every value conforms to IntroRoleCopy and contains
          a default block with title, lede, how, what. Every default
          block grades <=9 on readingAgeGrade().
      - type: "functional"
        spec: >
          Each of the nine area landing pages imports AreaIntro and
          renders <AreaIntro area="..."/> at the top of its body.
          AreaIntro resolves the session role through useAuth and
          passes the block to <IntroCard> from @leo/design-system.
      - type: "functional"
        spec: >
          services/ui/next.config.mjs sets
          `env.NEXT_PUBLIC_ROLE_FIRST: '1'` as the shipped default so
          the role-first shell is live for every user without a
          manual environment override.
      - type: "usability"
        spec: >
          Every role-specific copy block (where present) grades <=9 on
          readingAgeGrade() when measured against its default block's
          combined text. Clinical-audit (Care Overview) and safety
          areas MUST have a clinician-specific block.
    constraints:
      - type: "safety"
        spec: >
          AreaIntro MUST be additive. The migration prepends an
          intro card but does not modify or remove any existing
          controls on the page.
    dependencies: ["DI-LEO-AI-136", "DI-LEO-AI-137"]
    downstream_impacts:
      - "services/ui/src/lib/areaCopy.ts"
      - "services/ui/src/components/AreaIntro.tsx"
      - "services/ui/src/app/care/dashboard/page.tsx"
      - "services/ui/src/app/admin/console/page.tsx"
      - "services/ui/src/app/admin/pathway-explorer/page.tsx"
      - "services/ui/src/app/admin/platform/page.tsx"
      - "services/ui/src/app/admin/users/page.tsx"
      - "services/ui/src/app/admin/portal/page.tsx"
      - "services/ui/src/app/admin/support/page.tsx"
      - "services/ui/src/app/settings/page.tsx"
      - "services/ui/next.config.mjs"
    technical_details:
      language: "TypeScript"
      framework: "Next.js + @leo/design-system"
      file_structure:
        - "services/ui/src/lib/areaCopy.ts"
        - "services/ui/src/components/AreaIntro.tsx"
        - "services/ui/src/app/care/dashboard/page.tsx"
        - "services/ui/src/app/admin/console/page.tsx"
        - "services/ui/src/app/admin/pathway-explorer/page.tsx"
        - "services/ui/src/app/admin/platform/page.tsx"
        - "services/ui/src/app/admin/users/page.tsx"
        - "services/ui/src/app/admin/portal/page.tsx"
        - "services/ui/src/app/admin/support/page.tsx"
        - "services/ui/src/app/settings/page.tsx"
        - "services/ui/next.config.mjs"
      estimated_loc: 280

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-135 passes: AREA_INTRO_COPY map covers all 9 areas
      with a graded <=9 default block, role coverage rules hold, each
      target page imports KnowledgePageLayout and AREA_INTRO_COPY,
      and next.config.mjs defaults NEXT_PUBLIC_ROLE_FIRST to '1'.
    test_protocol: "VT-LEO-AI-135"

  safety_class: "A"
  risks: ["R-LEO-AI-094"]
  tags:
    - "role-first"
    - "inclusive-design"
    - "intro-copy"
    - "feature-flag-rollout"
