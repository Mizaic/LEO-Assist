      cleanup_required: false

  test_cases:
    - case_id: "VT-183-TC-001"
      case_name: "ToolbarAction id='auto-prune' is registered for the candidates tab"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx; assert it contains both 'auto-prune' and 'Auto-prune low confidence' inside the tab === \"candidates\" branch"
          expected_result: "Both substrings present"
          verification_method: "automated"
      acceptance_criteria:
        - "Curators can find the action"

    - case_id: "VT-183-TC-002"
      case_name: "Default confidence floors are 0.7, 0.92, 0.66"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read CandidatePruneDialog.tsx; assert literal initial-state values for min_surface_match (0.7), semantic_vector_floor (0.92), semantic_min_surface (0.66)"
          expected_result: "All three literals present"
          verification_method: "automated"
      acceptance_criteria:
        - "Defaults match the validator (R-LEO-AI-180)"

    - case_id: "VT-183-TC-003"
      case_name: "Destructive button is disabled until preview-loaded AND confirm-acknowledged"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read CandidatePruneDialog.tsx; assert presence of expression combining previewLoaded, deleteCount > 0, and confirmAcknowledged in the disabled prop"
          expected_result: "All three terms appear in the disabled expression"
          verification_method: "automated"
      acceptance_criteria:
        - "No accidental one-click deletes"

    - case_id: "VT-183-TC-004"
      case_name: "Confirmation checkbox label includes 'permanently delete'"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read CandidatePruneDialog.tsx; assert string literal 'permanently delete' appears in a Checkbox/FormControlLabel section"
          expected_result: "Literal present"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer is warned in plain language"

    - case_id: "VT-183-TC-005"
      case_name: "onClose is a no-op while loading is true"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read CandidatePruneDialog.tsx; assert that the Dialog's onClose handler returns early when loading is true (e.g. matches /if \\(loading\\)/ before any setOpen call)"
          expected_result: "Guard present"
          verification_method: "automated"
      acceptance_criteria:
        - "User cannot dismiss mid-request"

    - case_id: "VT-183-TC-006"
      case_name: "CandidatePruneDialog.tsx <= 500 LOC"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Read CandidatePruneDialog.tsx; count lines"
          expected_result: "Lines <= 500"
          verification_method: "automated"
      acceptance_criteria:
