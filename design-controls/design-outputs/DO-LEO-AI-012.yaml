# -- DO-LEO-AI-012 -- Authentication and Authorisation Module
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-012"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-020", "DI-LEO-AI-021"]
    user_needs: ["UN-LEO-AI-013", "UN-LEO-AI-021"]
    risks_addressed: ["R-LEO-AI-010", "R-LEO-AI-024"]
    verification_tests: ["VT-LEO-AI-012"]
    validation_tests: []

  specification:
    title: "Authentication and Authorisation Module"
    description: |
      Provides authentication and authorisation for all API endpoints.
      Validates Entra ID (Azure AD) tokens, enforces organisation-scoped
      tenancy, and manages service-to-service authentication between
      internal microservices. Injects tenant context into request
      dependencies for data isolation.
    purpose: "Secure all API access with identity verification, role-based authorisation, and multi-tenant data isolation"
    technical_approach: "Entra ID token validation via JWKS, FastAPI dependency injection for tenant context, and service-to-service tokens for internal calls"
    acceptance_criteria:
      - criterion: "Unauthenticated requests are rejected"
        type: "security"
        measurement: "Integration tests with missing/invalid tokens"
        target: "100% of unauthenticated requests return 401"
      - criterion: "Cross-tenant data access is blocked"
        type: "security"
        measurement: "Integration tests with mismatched tenant tokens"
        target: "0 cross-tenant data leaks"
      - criterion: "Token validation latency within limit"
        type: "performance"
        measurement: "p95 token validation time"
        target: "<= 50ms p95 (cached JWKS)"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/auth/org_scope.py"
        description: "Organisation scope extraction and validation from tokens"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/auth/tenant_context.py"
        description: "Tenant context injection for multi-tenant data isolation"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/service_auth/token_provider.py"
        description: "Service-to-service token acquisition for internal calls"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/service_auth/validator.py"
        description: "Token validation and JWKS verification"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/deps.py"
        description: "FastAPI dependency injection for auth and tenant context"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: ["FastAPI"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["Token validation", "Tenant isolation", "Service authentication"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed as shared libraries used by all API containers via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
    - version: "1.0.0"
      date: "2026-03-01"
      changes: "Initial creation"
      reason: "Implement DI-LEO-AI-020 and DI-LEO-AI-021"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["auth", "security", "multi-tenant", "entra-id"]
    priority: "high"
    complexity: "moderate"
