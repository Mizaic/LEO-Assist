# -- DI-LEO-AI-200 -- Strict NSS classification (explicit phrase or SNOMED only)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-200"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-005"
    - "UN-LEO-AI-006"
  requirement: >
    The episode builder SHALL classify a referral or diagnosis as
    cancer_type='non_site_specific' if and only if at least one of
    the following signals is present:
      (a) the encounter / concept text matches one of the explicit
          NSS surface forms ("non-site-specific symptoms", "non
          specific symptoms", "2WW NSS", "NSS 2WW", "NSS referral",
          "fast track NSS", "fast track referral for suspected
          cancer due to non-site-specific symptoms"), evaluated as
          a word-boundary regex (case-insensitive); OR
      (b) the SNOMED concept_id is 1556551000000104 ("Fast track
          referral for suspected cancer due to non-site-specific
          symptoms") or its IS_A descendants, OR a Read code that
          maps explicitly to the NSS pathway (currently XaPyg --
          "generic suspected cancer clinic").
    All other generic cancer text ("carcinoma", "neoplasm",
    "cancer", "fast", "tumour", "suspected malignancy", PRISM
    pathway names, etc.) that lack a recognisable site SHALL
    classify as cancer_type='unknown', not 'non_site_specific'.
  rationale: >
    The previous classifier matched the bare substring "fast"
    (mapping ANY text containing that token to NSS, e.g. "fasting
    bloods", "fast turnaround") and used a generic-cancer-term
    fallback ("carcinoma", "neoplasm", "cancer") that mapped any
    unsited cancer mention to NSS. Together these produced 48
    phantom non_site_specific EpisodeOfCare nodes across the
    cohort, of which 24 were immediately merged by the duplicate
    resolver and 24 remained as misleading "unknown cancer type"
    pathways. Two Read codes (XaMeD = "Fast track referral for
    suspected children's tumour", XaPyS = "children's tumour
    clinic") were also incorrectly mapped to NSS. The strict rule
    aligns with the SNOMED guideline synonym list for concept
    1556551000000104 (the only canonical NSS 2WW concept) and the
    NHS NG12 NSS pathway.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "_extract_condition_key('Fast track referral for suspected cancer due to non-site-specific symptoms') == 'non_site_specific'"
      - type: "functional"
        spec: "_extract_condition_key('2WW NSS referral') == 'non_site_specific'"
      - type: "functional"
        spec: "_extract_condition_key('NSS 2ww referral') == 'non_site_specific'"
      - type: "functional"
        spec: "_extract_condition_key('Fast track NSS referral') == 'non_site_specific'"
      - type: "functional"
        spec: "_extract_condition_key('non-specific symptoms suggestive of cancer') == 'non_site_specific'"
      - type: "safety"
        spec: "_extract_condition_key('Fasting blood test taken') == 'unknown' (must NOT be NSS)"
      - type: "safety"
        spec: "_extract_condition_key('Patient is fasting before procedure') == 'unknown' (must NOT be NSS)"
      - type: "safety"
        spec: "_extract_condition_key('Carcinoma of unknown primary') == 'unknown' (must NOT be NSS)"
      - type: "safety"
        spec: "_extract_condition_key('Cancer follow-up clinic attended') == 'unknown' (must NOT be NSS)"
      - type: "safety"
        spec: "_extract_condition_key('Sexual Healthcare (Complex) PRISM Pathway Accessed') == 'unknown' (must NOT be NSS)"
      - type: "safety"
        spec: "FAST_TRACK_REFERRAL_READ_CODES['XaMeD'] == 'childrens_tumour' (children's tumour 2WW, not NSS)"
      - type: "safety"
        spec: "FAST_TRACK_REFERRAL_READ_CODES['XaMeL'] == 'testicular' (descended testis NOS, not NSS)"
      - type: "safety"
        spec: "SPECIALIST_CLINIC_READ_CODES['XaPyS'] == 'childrens_tumour' (children's tumour clinic, not NSS)"
      - type: "functional"
        spec: "_SITE_BY_CONCEPT_ID['1556551000000104'] == 'non_site_specific' (canonical NSS 2WW concept ID)"
      - type: "performance"
        spec: "_extract_condition_key SHALL execute in O(len(_SITE_MAP)) i.e. <50 substring scans + 1 regex; no measurable runtime regression vs prior implementation"
    constraints:
      - type: "safety"
        spec: "_NSS_PHRASE_RE SHALL use word-boundary anchors (\\b) to avoid sub-token matches (e.g. 'NSSF' must not match the 'NSS' alternative)"
      - type: "safety"
        spec: "Removing the ('fast', 'non_site_specific') _SITE_MAP entry SHALL NOT regress any other site classification (cross-checked by VT-LEO-AI-193 and the existing fast-track regression suite)"
    dependencies:
      - "DI-LEO-AI-195"
      - "DI-LEO-AI-196"
    downstream_impacts:
      - "EpisodeOfCare.cancer_type assignment"
      - "Episode duplicate resolver (NSS-vs-typed sibling merge)"
      - "Pathway explorer / dashboards filtered by cancer_type"
      - "NCDA reporting (NSS pathway counts)"
    technical_details:
      language: "Python"
      framework: "Episode builder (post-anchor-detection site resolver)"
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_builder/_site_resolution.py"
        - "libs/domains/code_inventories.py"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-193 must pass with 100% on all critical and all
      total cases. Live cohort rebuild SHALL produce zero
      EpisodeOfCare nodes with cancer_type='non_site_specific'
      whose source encounters do NOT contain an explicit NSS
      surface form or NSS SNOMED concept ID.
    test_protocol: "VT-LEO-AI-193"

  safety_class: "B"
  risks:
    - "R-LEO-AI-190"
  tags:
    - "episode-builder"
    - "cancer-type-classification"
    - "nss"
    - "ncda-pathway"
