- id: "VT-LEO-AI-050"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-050"]
    risks: ["R-LEO-AI-029", "R-LEO-AI-033"]

  metadata:
    title: "Unified post-processing parity and TNM split verification"
    description: >
      Verifies that shared extraction/post-processing behaviour remains
      deterministic across paths and that TNM staging triplets are split into
      component entities (T, N, M) before terminology resolution.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_post_processing_pipeline.py"
      - "tests/test_pipeline_parity.py"
      - "tests/test_llm_extractor.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest installed"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-050-TC-001"
      case_name: "Shared post-processing parity remains intact"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run parity and post-processing tests"
          expected_result: "All parity tests pass"
          verification_method: "automated"
      acceptance_criteria:
        - "tests/test_post_processing_pipeline.py passes"
        - "tests/test_pipeline_parity.py passes"

    - case_id: "VT-050-TC-002"
      case_name: "TNM triplet is split into T/N/M entities"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Parse extraction payload containing T2N1M0 staging-scale term"
          expected_result: "Extractor returns original triplet plus T2, N1, M0 terms"
          verification_method: "automated"
      acceptance_criteria:
        - "tests/test_llm_extractor.py TNM split test passes"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-050/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
