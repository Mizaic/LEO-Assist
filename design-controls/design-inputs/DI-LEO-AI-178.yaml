# -- DI-LEO-AI-178 -- Benign-investigation phrase scope guard
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-178"
  type: "Safety"
  derived_from: ["UN-LEO-AI-006", "UN-LEO-AI-054"]
  requirement: >
    The episode-building text path SHALL only treat a generic
    benign-investigation phrase (e.g. "no further action",
    "discharged from care", "discharged from clinic", "discharged
    from 2WW pathway", "no evidence of malignancy") as a
    benign_closure signal when the same encounter ALSO carries
    cancer-pathway context. Specifically:
    (a) The detector SHALL only set has_no_cancer=True from a
    BENIGN_INVESTIGATION_PHRASES match when EITHER
    (i) a Read code in BENIGN_EXPLANATION_CODES is also present in
    the encounter, OR
    (ii) the encounter free text contains a cancer-related token
    (\\b(?:cancer|carcinoma|malignan\\w*|tumour|melanoma|lymphoma|
    leuk(?:a|e)mia|2ww|two[- ]week wait|fast track|oncology|
    suspected\\s+\\w+\\s+cancer)\\b) within the same encounter, OR
    (iii) match_cancer_site() returns a non-None site key for the
    same encounter, OR
    (iv) the matched phrase itself encodes cancer-pathway specificity
    (the existing tier-1 patterns - mammogram normal, FOBT normal,
    cystoscopy normal, breast USS normal, BCSP normal, FIT normal,
    nasendoscopy normal, colonoscopy benign finding, brain triage
    cancer excluded, PSA normal-no further action, cancer excluded,
    no evidence of malignancy, negative for malignancy, discharged
    from 2WW pathway).
    (b) The bare phrases "discharged from care", "discharged from
    clinic", "discharged from hospital", "no further action", and
    "no further follow-up" SHALL be RECLASSIFIED as tier-2 phrases
    that REQUIRE one of conditions (i)-(iii) above to fire
    has_no_cancer.
  rationale: >
    The 2026-04-17 audit traced patient 4921442355 episode
    42b722eb6082a4b7 (confirmed pT1a Lentigo maligna melanoma) being
    incorrectly closed at day 17 (2024-11-18) because a totally
    unrelated CKD / blood-pressure review encounter on that date
    contained the phrase:
       "If BP in normal range and potassium normalised then no
        further action."
    The bare regex \\bno further (?:action|follow[- ]up)\\b matched,
    fired _benign_phrase_hit, set has_no_cancer=True for that
    encounter, emitted a benign_closure anchor with date 2024-11-18,
    and the episode builder used that date as benign_date for the
    parallel skin-cancer episode - silently discarding all post-2024-
    11-18 evidence (the wide excision, the Xa99Y diagnosis code, and
    the 6-month surveillance template).
    The same scope violation will fire any time an unrelated
    encounter (CKD, hypertension, mental health, repeat-prescription
    review) contains "no further action" or "discharged from clinic"
    while a 2WW pathway is open. Cohort-level impact: at minimum 3
    confirmed missed cancers in the current corpus; structurally
    unbounded for new patients.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: >
          libs/domains/code_inventories.py exposes
          BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT as a frozenset of
          phrase labels that require cancer context, and
          CANCER_PATHWAY_CONTEXT_REGEX as a precompiled re.Pattern
          covering cancer / carcinoma / malignan* / tumour / melanoma
          / lymphoma / leuk(a|e)mia / 2ww / two-week wait / fast track
          / oncology / suspected <site> cancer.
      - type: "safety"
        spec: >
          The anchor detector imports the new constants and applies
          the gating: has_no_cancer is set from _benign_phrase_hit
          ONLY when the matched phrase label is NOT in the gated set
          OR the encounter has cancer context (regex match or
          _site_match is not None or _benign_code_hit is not None).
      - type: "functional"
        spec: >
          The CKD encounter from patient 4921442355 on 2024-11-18
          (text exactly as captured in the regression fixture, which
          contains "no further action" but no cancer context) MUST
          NOT produce a benign_closure anchor.
      - type: "functional"
        spec: >
          Tier-1 phrases ("mammogram normal", "PSA normal no further
          action", "cancer excluded", "no evidence of malignancy",
          etc.) continue to fire benign_closure unconditionally - the
          gating only applies to the new tier-2 phrases.
    constraints:
      - type: "safety"
        spec: >
          The gating MUST be applied at the same point as the existing
          benign-phrase resolution in _classify_text_encounters; no
          downstream stage may compensate for a missed gate.
      - type: "safety"
        spec: >
          When the gate suppresses has_no_cancer, the detector MUST
          still NOT emit a positive diagnosis_confirmed - the
          encounter is simply silent on cancer outcome.
    dependencies: ["DI-LEO-AI-159", "DI-LEO-AI-171"]
    downstream_impacts:
      - "Premature episode closure on unrelated encounters eliminated"
      - "closed_benign cohort precision improves"
      - "Number of in_progress / completed episodes increases as scope-violating closures are removed"
    technical_details:
      language: "Python"
      framework: "analysis_worker + libs"
      file_structure:
        - "libs/domains/code_inventories.py"
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in tests/test_stale_detector_fixes.py class
      TestBenignPhraseScopeGuard pass, including the regression
      fixture for the patient 4921442355 / 2024-11-18 CKD encounter.
      Live-corpus wipe-and-rebuild confirms no regression in the
      existing closed_benign cohort precision.
    test_protocol: "VT-LEO-AI-172"

  safety_class: "B"
  risks: ["R-LEO-AI-173"]
  tags:
    - "episode-building"
    - "missed-cancer"
    - "scope-guard"
    - "false-benign"
    - "ckd-bug"
