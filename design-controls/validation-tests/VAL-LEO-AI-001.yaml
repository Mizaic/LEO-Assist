# -- VAL-LEO-AI-001 -- End-to-End Clinical Audit Pipeline Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-001"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs:
      - "UN-LEO-AI-001"
      - "UN-LEO-AI-002"
      - "UN-LEO-AI-003"
      - "UN-LEO-AI-005"
      - "UN-LEO-AI-006"
      - "UN-LEO-AI-007"
      - "UN-LEO-AI-008"
    design_inputs:
      - "DI-LEO-AI-001"
      - "DI-LEO-AI-003"
      - "DI-LEO-AI-007"
      - "DI-LEO-AI-009"
      - "DI-LEO-AI-010"
      - "DI-LEO-AI-012"
      - "DI-LEO-AI-013"
    risks:
      - "R-LEO-AI-001"
      - "R-LEO-AI-002"
      - "R-LEO-AI-007"
      - "R-LEO-AI-021"
    verification_tests:
      - "VT-LEO-AI-001"
      - "VT-LEO-AI-002"
      - "VT-LEO-AI-005"
      - "VT-LEO-AI-007"
      - "VT-LEO-AI-008"

  metadata:
    title: "End-to-End Clinical Audit Pipeline Validation"
    validation_phase: "alpha"
    test_type: "end_to_end"
    automation_level: "semi-automated"
    participants:
      user_type: "internal_qa"
      count: 5
      selection_criteria: "QA engineers familiar with NCDA audit workflows and SNOMED CT terminology"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "All linked verification tests (VT-LEO-AI-001 through VT-LEO-AI-008) have passed"
      - "Staging environment deployed with latest release candidate"
      - "FHIR R4 test server seeded with synthetic patient cohort (>= 100 patients)"
      - "Gold-standard manually audited dataset available for comparison"
      - "Terminology server loaded with required SNOMED CT reference sets"
    infrastructure: "Azure Container Apps staging environment with FHIR R4 API, Redis, and Azure OpenAI"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Full NCDA audit pipeline for a patient cohort"
      user_role: "Clinical Audit Team Member"
      user_goal: "Run a complete NCDA audit pipeline from encounter shortlisting through to quality metrics for a patient cohort"
      preconditions:
        - "Patient cohort of >= 50 patients loaded in FHIR server"
        - "NCDA programme configuration active with all clinical domains"
        - "User has audit-team role credentials"
      steps:
        - step_number: 1
          action: "Submit a pipeline run request for the test patient cohort with all NCDA stages enabled"
          expected_result: "Pipeline run is accepted and a run ID is returned"
          success_criteria: "HTTP 202 response with a valid run ID within 2 seconds"
        - step_number: 2
          action: "Monitor pipeline progress until the shortlisting stage completes"
          expected_result: "Shortlisted encounters are available for each patient in the cohort"
          success_criteria: "Shortlisting recall >= 95% against the gold-standard labelled data"
        - step_number: 3
          action: "Verify coding stage assigns SNOMED CT codes to shortlisted encounters"
          expected_result: "Each shortlisted encounter has at least one SNOMED CT code assigned"
          success_criteria: "Coding F1 score >= 0.85 against the gold-standard coded dataset"
        - step_number: 4
          action: "Verify abnormal result detection flags expected abnormal findings"
          expected_result: "Abnormal results are flagged with severity and clinical context"
          success_criteria: "Abnormal detection recall >= 90% against the gold-standard labels"
        - step_number: 5
          action: "Verify anchor detection identifies key clinical milestones"
          expected_result: "Anchors (diagnosis, referral, treatment start) are identified per patient"
          success_criteria: "Anchor detection precision >= 85% and recall >= 80%"
        - step_number: 6
          action: "Verify episode builder groups encounters into clinical episodes"
          expected_result: "Encounters are grouped into coherent clinical episodes with timelines"
          success_criteria: "Episode grouping matches manual review in >= 85% of cases"
        - step_number: 7
          action: "Verify quality metric calculation produces expected audit measures"
          expected_result: "Pipeline produces NCDA quality metrics for the cohort"
          success_criteria: "Metrics match manual verification within +/- 5% tolerance"
      postconditions:
        - "Complete audit data available for all processed patients"
        - "All pipeline stage outputs stored with provenance metadata"
        - "Audit trail records every pipeline step with timestamps"
      success_metrics:
        - metric: "Pipeline completion rate"
          target: ">= 90% of test patients produce complete audit data"
          measurement_method: "Count patients with all pipeline stages completed vs total cohort"
        - metric: "End-to-end metric accuracy"
          target: "Metrics match manual verification within +/- 5%"
          measurement_method: "Compare pipeline-generated metrics against manually calculated values"
        - metric: "Pipeline throughput"
          target: "<= 60 seconds per patient end-to-end"
          measurement_method: "Measure wall-clock time from pipeline start to metrics output"
      evidence_to_capture:
        - "Pipeline run logs with timestamps for each stage"
        - "Per-patient stage outputs (shortlist, codes, abnormals, anchors, episodes, metrics)"
        - "Gold-standard comparison report with precision, recall, and F1 per stage"
        - "Error log for any patients that failed processing"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Quick code pipeline -- shortlist and code only"
      user_role: "Clinical Audit Team Member"
      user_goal: "Run a reduced pipeline that shortlists encounters and assigns SNOMED codes without downstream analysis"
      preconditions:
        - "Patient cohort of >= 20 patients loaded in FHIR server"
        - "User has audit-team role credentials"
      steps:
        - step_number: 1
          action: "Submit a pipeline run request with only shortlisting and coding stages enabled"
          expected_result: "Pipeline run is accepted with a valid run ID"
          success_criteria: "HTTP 202 response within 2 seconds"
        - step_number: 2
          action: "Monitor pipeline until coding stage completes"
          expected_result: "Coded encounters available for all patients in the cohort"
          success_criteria: "All patients have coded output within 30 seconds per patient"
        - step_number: 3
          action: "Verify that downstream stages (abnormals, anchors, episodes, metrics) were not executed"
          expected_result: "No downstream stage outputs exist for this run"
          success_criteria: "Pipeline status shows only shortlisting and coding stages completed"
        - step_number: 4
          action: "Export coded encounter data and compare against gold-standard"
          expected_result: "Coding accuracy report generated"
          success_criteria: "Coding F1 score >= 0.85"
      postconditions:
        - "Only shortlisting and coding outputs are stored"
        - "No downstream analysis outputs exist for the run"
      success_metrics:
        - metric: "Quick pipeline completion rate"
          target: ">= 95% of patients produce coded output"
          measurement_method: "Count patients with coding output vs total cohort"
        - metric: "Quick pipeline throughput"
          target: "<= 30 seconds per patient"
          measurement_method: "Measure wall-clock time from start to coding completion"
      evidence_to_capture:
        - "Pipeline run logs showing only shortlisting and coding stages"
        - "Coded encounter output per patient"
        - "Gold-standard comparison report for coding accuracy"

  acceptance_criteria:
    - criterion: "Pipeline produces complete audit data for the test cohort"
      target: ">= 90% of test patients have complete audit data"
      measurement_method: "Count patients with all pipeline stages completed vs total cohort size"
    - criterion: "Metrics match manual verification"
      target: "Computed metrics within +/- 5% of manually calculated values"
      measurement_method: "Statistical comparison of pipeline output against gold-standard manual audit"
    - criterion: "Pipeline handles partial runs correctly"
      target: "Quick-code pipeline produces only shortlisting and coding outputs"
      measurement_method: "Verify absence of downstream stage outputs for partial pipeline runs"

  user_feedback:
    feedback_methods: ["survey", "observation"]
    usability_metrics:
      task_completion_target: ">=90%"
      time_on_task_target: "Full pipeline completes within 60 seconds per patient"

  evidence_bundle:
    bundle_id: "VAL-001-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-001/"
    artifacts:
      - type: "user_acceptance_results"
        description: "End-to-end pipeline validation results with per-stage accuracy metrics"
      - type: "pipeline_logs"
        description: "Complete pipeline execution logs with timestamps and provenance"
      - type: "classification_output"
        description: "Per-patient coding and analysis outputs for gold-standard comparison"
    immutability: true

  execution_history: []
