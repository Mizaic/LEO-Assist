# -- DI-LEO-AI-509 -- Bitmap compiler builds union of seed closures minus exclusions
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-509"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-093"
  requirement: >
    services/terminology_api/app/services/guideline_compiler.py
    ::_compile_logic_tree_node SHALL, for kind == "concept" leaves,
    read the new criterion fields and produce one bitmap per leaf
    representing:

      bitmap_int_ids = (
        union over each seed of
          _closure_ids(seed.snomed_concept_id,
                       seed.distance_child if include_descendants else 0,
                       distance_parent override or 0)
      ) minus (excluded_concept_ids mapped to int ids)

    When the new fields are absent, the compiler SHALL behave
    EXACTLY as today (single seed, current distance_child default of
    3) so the migration is a no-op for the int-id set passed to
    put_bitmap. The compiled-leaf echo SHALL include the new shape
    (seeds, excluded_concept_ids, primary_concept_id) AND the legacy
    snomed_concept_id field AND a new ``seed_concept_ids`` array
    listing every int-id that the leaf will accept (used by the
    evaluator to map matched_concept_ids back to the seed list).

  rationale: >
    The bitmap compiler is the single point where SNOMED hierarchy
    expansion, exclusion carve-outs, and synonym union must converge.
    Doing it here keeps the runtime evaluator unchanged (still pure
    bitmap intersection) and means caching, digest behaviour, and
    Redis storage all carry over. A no-op upgrade for legacy
    criteria is the safety property that lets us deploy the change
    without a clinical-output regression.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: When criterion has only legacy {snomed_concept_id,
          distance_child}, _compile_logic_tree_node produces the
          identical sorted int-id list it produces today.
      - type: "functional"
        spec: >
          AC-002: When criterion has seeds=[s1, s2] with
          include_descendants=true and excluded_concept_ids=[],
          the compiler unions _closure_ids(s1) and _closure_ids(s2)
          and passes the deduplicated, sorted int-id list to
          put_bitmap.
      - type: "safety"
        spec: >
          AC-003: When criterion has excluded_concept_ids=[x1, x2],
          the compiler subtracts those ids (after closure expansion,
          before int-id mapping) so the resulting bitmap CANNOT
          contain x1 or x2 even if a seed closure would otherwise
          include them.
      - type: "functional"
        spec: >
          AC-004: When a seed has include_descendants=false, only the
          seed's exact id is added to the union (distance_child is
          forced to 0 for that seed regardless of any override).
      - type: "functional"
        spec: >
          AC-005: The compiled-leaf dict echoes the new criterion
          shape AND the legacy snomed_concept_id field AND a new
          seed_concept_ids list (every SNOMED string id contributing
          to the bitmap, deduplicated, sorted) so the evaluator can
          match patient codes back to seeds without re-running
          closure queries.
    constraints:
      - type: "safety"
        spec: >
          When a seed closure call raises (Neo4j hierarchy missing),
          the compiler MUST fall back to the seed's exact id only
          for that seed (matching today's exact-match fallback in
          _closure_ids), NOT skip the rule -- a partial graph
          outage cannot silently drop synonym matches.
      - type: "safety"
        spec: >
          When excluded_concept_ids contains an id that is NOT in
          any seed closure, the compiler MUST log a warning (so
          authoring drift is observable) but MUST still emit the
          bitmap; an unreachable carve-out is a no-op rather than a
          compile error.
    dependencies:
      - "DI-LEO-AI-508"
    downstream_impacts:
      - "Evaluator + diagnose (DI-510)"
      - "Redis ruleset payload size grows by ~50 bytes per leaf"
    technical_details:
      language: "Python"
      framework: "FastAPI + pyroaring + Neo4j"
      file_structure:
        - "services/terminology_api/app/services/guideline_compiler.py"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-510 covers (a) legacy single-seed parity (same int
      set as today), (b) multi-seed union, (c) exclusion subtraction,
      (d) per-seed include_descendants flag, (e) seed_concept_ids
      echo, (f) fallback on closure failure.
    test_protocol: "VT-LEO-AI-510"

  safety_class: "B"
  risks:
    - "R-LEO-AI-508"
  tags:
    - "bitmap-compiler"
    - "snomed-closure"
    - "exclusion"
