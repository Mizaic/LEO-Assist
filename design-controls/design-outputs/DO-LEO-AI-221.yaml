# -- DO-LEO-AI-221 -- Form-field restatement guard helper + emission gates
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-221"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-224"]
    user_needs: ["UN-LEO-AI-005"]
    risks_addressed: ["R-LEO-AI-208"]
    verification_tests: ["VT-LEO-AI-216"]

  specification:
    title: "encounter_restates_past_event() helper wired into Pattern C+D referral and first_seen emission paths"
    description: |
      Adds two new helpers to ``libs/domains/code_inventories.py``:

        * ``_extract_form_field_dates(text)`` parses every line in
          ``text`` that contains a colon and returns the list of
          embedded calendar dates. Five formats are recognised:
          ``DD MMM YYYY`` (e.g. ``07 Apr 2025``), ``DD/MM/YYYY``
          and ``DD-MM-YYYY`` and ``DD.MM.YYYY`` (UK convention),
          and ISO ``YYYY-MM-DD``.
        * ``encounter_restates_past_event(text, encounter_date,
          lookback_days=14)`` returns True when at least one
          extracted date is on or before ``encounter_date -
          lookback_days``.

      In ``services/analysis_worker/app/analyzers/anchor_detector.py``:

        * The existing text_generic referral suppression block
          (the ``elif _RE_REFERRAL.search(text) and not
          is_first_seen_note:`` branch) is extended with a new
          ``_is_form_restatement = encounter_restates_past_event(
          text, date)`` flag added to ``_suppress``. This OVERRIDES
          the structural-evidence override because a Field-shape
          line with an embedded past date is by definition a
          restatement, not a fresh event.
        * The first_seen emission gate (``is_first_seen_note or
          _spec_clinic_hit is not None``) is wrapped with
          ``if not encounter_restates_past_event(text, date):``
          so XaPyQ-style specialist-clinic Read codes inside a
          form-field restatement do not double-fire first_seen
          weeks after the real clinic visit.

    acceptance_criteria:
      - criterion: "Helper extracts all five date formats"
        type: "functional"
        measurement: "Test"
        target: "_extract_form_field_dates parses DD MMM YYYY, DD/MM/YYYY, DD-MM-YYYY, DD.MM.YYYY, and ISO YYYY-MM-DD on Field: lines"
      - criterion: "Helper is inert without form-field shape"
        type: "safety"
        measurement: "Test"
        target: "_extract_form_field_dates returns [] for prose without colons"
      - criterion: "Guard fires for canonical 4802892365 2025-05-13"
        type: "functional"
        measurement: "Test"
        target: "encounter_restates_past_event returns True for the 2025-05-13 receptionist note"
      - criterion: "Guard fires for canonical 4802892365 2025-06-10"
        type: "functional"
        measurement: "Test"
        target: "encounter_restates_past_event returns True for the 2025-06-10 receptionist note"
      - criterion: "No over-suppression on fresh events"
        type: "safety"
        measurement: "Test"
        target: "Form date == encounter date emits one first_seen; fresh referral text emits one text_generic referral"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "_DATE_DDMMMYYYY_RX, _DATE_NUMERIC_DMY_RX, _DATE_ISO_RX, _MONTH_ABBREV_TO_NUM, _parse_iso_date, _extract_form_field_dates, encounter_restates_past_event"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "Imports encounter_restates_past_event; ANDs `_is_form_restatement` into the text_generic referral _suppress flag; wraps first_seen emission with the guard"
      - artifact_type: "test_code"
        location: "tests/test_pattern_n3_form_field_restatement_guard.py"
        description: "VT-LEO-AI-216 verification cases (8 extractor + 8 guard predicate + 5 detector integration)"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 175
      key_functions:
        - "encounter_restates_past_event"
        - "_extract_form_field_dates"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Suppresses duplicate referral / first_seen milestones from administrative form-field updates that restate a past event, preserving the real source-encounter milestones"
    risk_control_measures:
      - "Form-field date extractor requires the line to contain a colon, so free-text prose narrating past events is not affected (Pattern L / DI-LEO-AI-216 covers narrative cases)"
      - "Default 14-day lookback prevents over-suppression of legitimate same-week appointment / clinic notes"
      - "Sanity tests confirm fresh referral text and fresh first_seen on the embedded date still fire (no over-suppression)"

  verification_status:
