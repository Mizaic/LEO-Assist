# -- DI-LEO-AI-176 -- Knowledge tabs ESLint guard + e2e a11y baseline (Wave E Phase 7)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-176"
  type: "Functional"
  derived_from: ["UN-LEO-AI-061"]
  requirement: >
    The Knowledge tab shell at services/ui/src/app/admin/knowledge/** SHALL
    be guarded by an ESLint rule that warns when raw `@mui/*` packages are
    imported, encouraging consumers to reach for the @leo/design-system
    primitives (KnowledgePageLayout, StatHero, ToolbarActions, FilterBar,
    PromptEditorCard, ReviewListCard, DataGridCard, MetricTile,
    NudgeStrip). The eight Knowledge tabs (training-data, surface-forms,
    context-rules, ai-instructions, clinical-guidelines, pathways,
    domains, terminology) SHALL each have a Playwright smoke spec that
    asserts the route loads and has zero critical or serious axe-core
    violations on the wrapper chrome.
  rationale: >
    Wave E redesigned every Knowledge tab on top of the new design system
    (DI-LEO-AI-144 .. DI-LEO-AI-167). Without an ESLint guard, regressions
    that re-introduce raw MUI styling can land silently and erode the
    visual consistency we just shipped. Without a Playwright + axe-core
    baseline, accessibility regressions on the eight URL-contract tabs
    can also land silently. Both guards together convert the redesign
    into a verifiable contract that future PRs cannot quietly break.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/eslint.config.mjs adds a no-restricted-imports
          rule scoped to "src/app/admin/knowledge/**/*.{ts,tsx}" with
          patterns: [{ group: ["@mui/*"], message: "Knowledge tabs
          should use @leo/design-system primitives instead of raw MUI
          imports." }]. Rule severity is "warn" so legacy MUI Tabs
          containers are reported but not blocking.
      - type: "functional"
        spec: >
          services/ui/e2e/knowledge-tabs.spec.ts contains a
          Playwright test.describe block titled with VT-LEO-AI-171,
          a constant array KNOWLEDGE_TABS holding all eight tab
          keys exactly as they appear in TABS in
          services/ui/src/app/admin/knowledge/page.tsx, and for each
          tab a `loads` test plus a `zero critical or serious axe
          violations` test that uses @axe-core/playwright with WCAG
          2.0/2.1 AA tags.
      - type: "safety"
        spec: >
          The ESLint guard MUST be a "warn" not an "error" until the
          last raw MUI import in admin/knowledge/** is migrated to the
          design system, so we do not break CI for the wrapper Tabs
          container during the rolling migration. The DO records this
          rolling deprecation explicitly.
    constraints:
      - type: "safety"
        spec: >
          Playwright spec MUST iterate the same tab keys defined in
          TABS in admin/knowledge/page.tsx; if those keys change, the
          spec must change in the same PR.
    dependencies:
      - "DI-LEO-AI-144"
      - "DI-LEO-AI-167"
    downstream_impacts:
      - "Knowledge tabs visual consistency"
      - "Knowledge tabs WCAG AA baseline"
      - "Future tab additions inherit the same guards by glob"
    technical_details:
      language: "TypeScript"
      framework: "ESLint + Playwright + axe-core"
      file_structure:
        - "services/ui/eslint.config.mjs"
        - "services/ui/e2e/knowledge-tabs.spec.ts"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-171 passes -- a static-source jest sweep that asserts
      the ESLint config contains the admin/knowledge guard pattern,
      and that the e2e/knowledge-tabs.spec.ts spec iterates all eight
      tab keys with matching Playwright + axe-core blocks.
    test_protocol: "VT-LEO-AI-171"

  safety_class: "A"
  risks: []
  tags:
    - "wave-e"
    - "knowledge-tab"
    - "eslint-guard"
    - "a11y"
    - "axe-core"
