# -- VT-LEO-AI-021 -- Dual-Model Consensus Runner Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-021"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-036"]
    risks: ["R-LEO-AI-001", "R-LEO-AI-026"]
    user_needs: ["UN-LEO-AI-002"]

  metadata:
    title: "Dual-Model Consensus Runner Verification"
    description: "Verifies that the dual-model consensus runner correctly handles all execution paths: agreement, single-provider failure, dual failure, disagreement with Sonnet arbitration, and arbitration failure"
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_consensus.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12+ with project dependencies installed"
      - "LLM provider calls mocked via unittest.mock.patch"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-021-TC-001"
      case_name: "Both models agree -- returns shared verdict"
      priority: "critical"
      preconditions:
        - "Both AWS and Azure providers return the same parsed verdict"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with two mocked providers returning identical verdicts"
          expected_result: "Result verdict matches the shared verdict, agreed=True, both model IDs tracked"
          verification_method: "Assert verdict, agreed flag, and model_ids list"
      acceptance_criteria:
        - "verdict == shared value"
        - "agreed == True"
        - "len(model_ids) == 2"

    - case_id: "VT-021-TC-002"
      case_name: "One provider fails -- returns surviving provider verdict"
      priority: "critical"
      preconditions:
        - "One provider raises an exception, the other returns a valid verdict"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with one provider raising RuntimeError"
          expected_result: "Result verdict matches the surviving provider"
          verification_method: "Assert verdict from the non-failing provider"
      acceptance_criteria:
        - "verdict == surviving provider's parsed output"

    - case_id: "VT-021-TC-003"
      case_name: "Both providers fail -- returns fail_verdict"
      priority: "critical"
      preconditions:
        - "Both providers raise exceptions"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with both providers raising RuntimeError"
          expected_result: "Result verdict == fail_verdict, agreed=False"
          verification_method: "Assert verdict and reason contain 'both providers failed'"
      acceptance_criteria:
        - "verdict == fail_verdict"
        - "'both providers failed' in reason"

    - case_id: "VT-021-TC-004"
      case_name: "Disagreement triggers Sonnet arbitration"
      priority: "critical"
      preconditions:
        - "AWS and Azure return different verdicts, Sonnet returns a valid verdict"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with disagreeing providers and a valid Sonnet response"
          expected_result: "Result verdict matches Sonnet's verdict, agreed=False, arbitrator fields populated"
          verification_method: "Assert arbitrator_verdict, arbitrator_model_id, and model_ids contains 3 entries"
      acceptance_criteria:
        - "verdict == Sonnet's verdict"
        - "agreed == False"
        - "len(model_ids) == 3"

    - case_id: "VT-021-TC-005"
      case_name: "Arbitration failure returns fail_verdict"
      priority: "critical"
      preconditions:
        - "AWS and Azure disagree, Sonnet raises an exception"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with disagreeing providers and a failing Sonnet"
          expected_result: "Result verdict == fail_verdict"
          verification_method: "Assert verdict and reason contain 'arbitrator failed'"
      acceptance_criteria:
        - "verdict == fail_verdict"

    - case_id: "VT-021-TC-006"
      case_name: "Arbitration returns unparseable response"
      priority: "high"
      preconditions:
        - "AWS and Azure disagree, Sonnet returns text that parse_fn cannot parse"
      test_steps:
        - step_number: 1
          action: "Call run_consensus with a parse_fn that returns empty for Sonnet's response"
          expected_result: "Result verdict == fail_verdict, reason mentions unparseable"
          verification_method: "Assert verdict and reason"
      acceptance_criteria:
        - "verdict == fail_verdict"
        - "'unparseable' in reason"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-021/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-021-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "local"
      result: "pass"
      cases_executed: 12
      cases_passed: 12
      cases_failed: 0
      duration_seconds: 1
      notes: "All 12 tests pass (pytest tests/test_consensus.py)"
