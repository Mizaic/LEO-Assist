# -- R-LEO-AI-042 -- LLM Rule Authoring Errors in Guideline Criteria Generation

- id: "R-LEO-AI-042"
  title: "LLM-generated AppropriatenessRule criteria may be incorrect or incomplete"
  hazard:
    description: >
      The LLM consensus pipeline may generate AppropriatenessRule CriteriaGroup entries
      with incorrect SNOMED codes, missing exclusion criteria, or logically inverted
      PRESENT/ABSENT predicates. If such rules are approved and compiled into the
      active bitmap, patients may be inappropriately matched to (or excluded from)
      guideline recommendations.
    category: "clinical-safety"
  hazardous_situation: >
    The LLM consensus pipeline generates AppropriatenessRule CriteriaGroup entries
    with incorrect SNOMED codes or inverted predicates. An administrator approves
    the rule without detecting the error. The bitmap compiler includes the incorrect
    rule, and patient pathway evaluations produce false matches or missed flags.
  harm:
    description: >
      Patients receive incorrect referral guidance -- either missing an urgent referral
      they should receive, or receiving an inappropriate referral. In a 2-week-wait
      cancer pathway context, a missed referral poses a direct patient safety risk.
    severity: "serious"
  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"
  mitigation_measures:
    - control_type: "design_feature"
      description: >
        All LLM-generated rules are written with status: pending_review and cannot
        affect any patient pathway until explicitly approved by a human administrator
        via the HITL review queue. The bitmap compiler only reads rules with
        status: active.
      implemented_by: ["DI-LEO-AI-064"]
      verified_by: ["VT-LEO-AI-064"]
    - control_type: "design_feature"
      description: >
        The HITL review UI presents each rule in plain English (reading age 11),
        not raw SNOMED IDs, so a non-technical reviewer can identify obvious errors.
        SNOMED preferred terms are shown alongside concept IDs to aid clinical
        review.
      implemented_by: ["DI-LEO-AI-064"]
      verified_by: ["VT-LEO-AI-064"]
    - control_type: "design_feature"
      description: >
        SNOMED coding of each criterion uses the existing escalate_coding_from_candidates()
        pipeline with live terminology API lookup, not LLM hallucination. The LLM
        picks from real SNOMED candidates returned by the knowledge graph, preventing
        invented concept IDs.
      implemented_by: ["DI-LEO-AI-064"]
      verified_by: ["VT-LEO-AI-064"]
    - control_type: "design_feature"
      description: >
        The bitmap evaluator is an additive system. If no bitmap rule matches,
        the system falls back to the existing vector-search retrieval rather than
        returning a null result. A rule error therefore degrades precision, not
        recall.
      implemented_by: ["DI-LEO-AI-064"]
      verified_by: ["VT-LEO-AI-064"]
    - control_type: "procedural_control"
      description: >
        Rules must be reviewed by a person with appropriate clinical knowledge before
        approval. The platform requires ai.admin role for all guidance management
        endpoints. Clinical sign-off is recorded in the immutable approval audit trail.
      implemented_by: ["DI-LEO-AI-064"]
      verified_by: ["VT-LEO-AI-064"]
  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The mandatory HITL gate ensures no LLM-generated rule can affect patients
      without explicit human clinical review. The plain-English UI presentation
      and SNOMED preferred term display reduce the likelihood of undetected errors.
      The additive bitmap system limits impact to precision degradation, not recall loss.
  monitoring:
    - metric: "rule_approval_rejection_rate"
      description: "Track rule rejection rate to identify systemic LLM quality issues."
      threshold: "Monitor trend"
      frequency: "quarterly"
    - metric: "post_approval_rule_correction_rate"
      description: "Rate of rules corrected after initial approval."
      threshold: "Monitor trend"
      frequency: "quarterly"
  metadata:
    identified_by: "Design review -- NICE guideline ingestion"
    identified_date: "2026-03-07"
    status: "analyzed"
    tags: ["clinical-safety", "llm", "rule-authoring", "hitl"]
