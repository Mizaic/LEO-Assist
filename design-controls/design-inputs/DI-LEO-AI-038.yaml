# -- DI-LEO-AI-038 -- Three-Tier Decision Engine
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-038"
  type: "Safety"
  derived_from: ["UN-LEO-AI-002"]
  requirement: "The system SHALL classify each extracted entity into one of three confidence tiers based on assertion status, context detection success, terminology match score, surface form approval status, and disorder verdict -- with mode-aware routing: Tier 1 auto-codes, Tier 2 codes with audit flag (autonomous) or routes to review (HITL), Tier 3 does not code (autonomous) or routes to review (HITL)"
  rationale: "A deterministic, auditable decision matrix prevents auto-coding of entities that have insufficient confidence, non-codeable assertions, or unverified context. The tier boundaries enforce a layered safety gate where only entities with high terminology match score, present assertion, and no context failures can reach Tier 1. This is the core safety mechanism for autonomous coding mode."

  machine_spec:
    agent_prompt: |
      Implement the three-tier classifier (~60 LOC).

      SINGLE PURPOSE: Classify each entity into Tier 1 (auto-code),
      Tier 2 (code + flag), or Tier 3 (do not code) using a deterministic
      decision matrix.

      DECISION MATRIX:
      Tier 3 gates (always prevent auto-coding):
        - ConText detection failure
        - Disorder verdict: informational or uncertain
        - Assertion: absent, declined, hypothetical, possible

      Tier 1 gates (auto-code):
        - Assertion=present, no context failure
        - Approved surface form + score >= 0.95
        - Any surface form + score >= 0.95

      Tier 2 (medium confidence):
        - Qualifier assertions (historical, family)
        - Present assertion + score >= 0.70 (pending surface form or no match)

      Tier 3 fallthrough:
        - Everything else (low confidence)

      MODE-AWARE DECISIONS:
        Tier 2 autonomous: coded_with_flag
        Tier 2 HITL: route_to_review
        Tier 3 autonomous: not_coded
        Tier 3 HITL: route_to_review

    acceptance_criteria:
      - type: "test"
        spec: "Context failure always produces Tier 3 regardless of score"
      - type: "test"
        spec: "Non-codeable assertions (absent, declined, hypothetical) always Tier 3"
      - type: "test"
        spec: "Possible assertion is Tier 3"
      - type: "test"
        spec: "Informational and uncertain disorder verdicts are Tier 3"
      - type: "test"
        spec: "High score (>=0.95) with present assertion is Tier 1"
      - type: "test"
        spec: "Medium score (>=0.70) with present assertion is Tier 2"
      - type: "test"
        spec: "Historical and family assertions are Tier 2"
      - type: "test"
        spec: "Score below 0.70 is Tier 3 (low confidence)"
      - type: "test"
        spec: "Autonomous mode Tier 2 decision is coded_with_flag"
      - type: "test"
        spec: "HITL mode Tier 2 decision is route_to_review"
      - type: "test"
        spec: "Tier 3 gates override Tier 1 signals (priority ordering)"

    constraints:
      - type: "safety"
        spec: "Tier 3 gates MUST be evaluated before Tier 1 gates -- safety checks take priority"
      - type: "safety"
        spec: "Pending surface forms MUST NOT reach Tier 1 -- only approved forms qualify"
      - type: "code_quality"
        spec: "Pure function with no side effects; frozen dataclass output"

    dependencies: ["DI-LEO-AI-037"]

    downstream_impacts:
      - "pipeline_service"
      - "coding_decision_audit"

    technical_details:
      language: "Python"
      framework: "N/A"
      libraries: []
      file_structure:
        - "libs/coding_engine/tier_classifier.py"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Complete decision matrix verified: all tier boundaries, all assertions, both modes, priority ordering"
    test_protocol: "VT-LEO-AI-023"

  safety_class: "B"
  risks: ["R-LEO-AI-001", "R-LEO-AI-026", "R-LEO-AI-030"]
  tags: ["tier-classifier", "decision-engine", "safety-gate", "autonomous-coding", "intended-use-enforcement"]
