        description: "Top-level workspace layout component"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/MissionCardGrid.tsx"
        description: "Grouped mission card grid with intent headings"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/MissionCard.tsx"
        description: "Single mission card with lock state and tier badge"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/PersonaLensToggle.tsx"
        description: "Persona lens segmented toggle"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/ScopingWizard.tsx"
        description: "Three-question scoping dialog"
      - artifact_type: "source_code"
        location: "services/ui/src/components/research/ResultsPanel.tsx"
