# -- DO-LEO-AI-230 -- PatientFinder UI primitive + analytics-api router
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-230"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-230"]
    user_needs: ["UN-LEO-AI-081"]
    risks_addressed: ["R-LEO-AI-211"]
    verification_tests: ["VT-LEO-AI-230"]

  specification:
    title: "PatientFinder dialog + /patient-finder router"
    description: |
      Two-part shipping unit:

      1. UI primitive PatientFinder (MUI Dialog) with Search,
         Filter and Saved-cohort tabs. Shared sub-component
         ResultsList renders rows with NHS number and DOB on every
         row. Filter tab calls POST /cohorts/preview to surface a
         live count before listing.

      2. Backend router patient_finder.py mounted under
         /analytics/patient-finder, with five endpoints:
           GET  /search
           GET  /by-filter
           GET  /by-cohort/{cohort_id}
           GET  /{patient_id}/encounters
           GET  /{patient_id}/document-references
         All endpoints scope every Cypher query to the caller's
         CallerScope tenant_id / org_id and 403 on out-of-scope
         patient ids.

      The cohort filter contract was extended in the same change
      to accept imd_decile_min/max,
      encounter_count_min/max + window, episode_domain,
      episode_subdomain, episode_outcome.

    acceptance_criteria:
      - criterion: "NHS + DOB on every row"
        type: "safety"
        measurement: "Test"
        target: "VT-LEO-AI-230 static-source VT asserts the row markup contains data-testid for nhs-number and dob in every tab's ResultsList"
      - criterion: "CallerScope enforcement"
        type: "safety"
        measurement: "Test"
        target: "/patient-finder/{patient_id}/* returns 403 when the patient is not in the caller's scope; covered by pytest"
      - criterion: "Typeahead debounced"
        type: "functional"
        measurement: "Test"
        target: "Search tab debounces typeahead by 250 ms; covered by live-render jest test"
      - criterion: "Cohort preview"
        type: "functional"
        measurement: "Test"
        target: "Filter tab calls POST /cohorts/preview before listing; pytest covers patient_count + sample_patient_ids contract"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/sbar-playground/PatientFinder.tsx"
        description: "PatientFinder dialog, SearchTab, FilterTab, CohortTab, ResultsList"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/analyticsApi.ts"
        description: "searchPatients, patientsByFilter, patientsByCohort, previewCohort, listPatientEncounters, listPatientDocumentReferences, listDocumentReferenceChunks"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/patient_finder.py"
        description: "patient_finder_router with 5 endpoints + scope helpers"
      - artifact_type: "source_code"
        location: "services/analytics_api/app/routers/cohorts.py"
        description: "Extended CohortFilter + _build_where_clauses helpers + POST /cohorts/preview"
    storage_location: "git"
    technical_details:
      language: "TypeScript + Python"
      loc: 1100
      key_functions:
        - "PatientFinder"
        - "ResultsList"
        - "patient_finder_router"
        - "_build_where_clauses"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Patient identification surface for any consumer of the primitive"
      - "Server-side scope enforcement on /patient-finder endpoints"
    risk_control_measures:
      - "Three-identifier per row contract enforced by static-source VT"
      - "CallerScope check on every endpoint with 403 fallback"

  verification_status:
    verification_method: "Test"
    verification_complete: false
