# ============================================================================
# RISKS SCHEMA - ISO 14971 Compliant
# ============================================================================
# This schema defines the structure for Risk documentation used in
# the Autonomous eQMS Platform risk management process.
#
# Regulatory References:
# - ISO 14971:2019 (Medical Devices - Risk Management)
# - IEC 62304:2006 Section 7 (Software Risk Management)
# - FDA 21 CFR Part 820.30(g) (Design Validation)
# - ISO 13485:2016 Section 7.1 (Risk Management Process)
#
# Version: 1.0
# Created: 2025-11-09
# Owner: Quality & Risk Management
# ============================================================================

meta:
  schema_version: "1.0"
  schema_name: "Risk Register Schema"
  purpose: "Define machine-readable structure for ISO 14971 risk documentation"
  intended_use: "All risks.yaml files in design controls"
  regulatory_compliance:
    - "ISO 14971:2019 - Medical Device Risk Management"
    - "IEC 62304:2006 - Medical Device Software Lifecycle (Section 7)"
    - "ISO 13485:2016 - Medical Device Quality Management"
  change_history:
    - version: "1.0"
      date: "2025-11-09"
      change: "Initial schema creation"
      author: "Risk Management Team"

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

schema:
  risk:
    description: "A single identified risk per ISO 14971"
    required: true
    fields:
      
      # --- IDENTIFICATION ---
      id:
        type: string
        required: true
        format: "R-{PROJECT}-###"
        description: "Unique risk identifier"
        example: "R-PLATFORM-001"
        pattern: "^R-[A-Z]+-\\d{3}$"
        
      title:
        type: string
        required: true
        min_length: 10
        max_length: 200
        description: "Brief, clear statement of the risk"
        example: "Meta-learning system degrades over time without oversight"
        
      # --- HAZARD & HARM ---
      hazard:
        type: object
        required: true
        description: "Potential source of harm per ISO 14971"
        fields:
          description:
            type: string
            required: true
            description: "Description of the hazard"
            example: "AI model learns incorrect patterns from biased data"
            
          category:
            type: enum
            required: true
            values: ["software_defect", "misuse", "data_corruption", "security_breach", "performance_degradation", "integration_failure", "infrastructure_failure"]
            description: "Category of hazard"
            
      hazardous_situation:
        type: string
        required: true
        min_length: 20
        max_length: 1000
        description: "Circumstance in which people, property, or environment are exposed to hazard"
        example: "System auto-approves defective code leading to production deployment"
        
      harm:
        type: object
        required: true
        description: "Potential harm that could result"
        fields:
          description:
            type: string
            required: true
            description: "Description of potential harm"
            example: "Medical device malfunction affects patient treatment"
            
          severity:
            type: enum
            required: true
            values: ["negligible", "minor", "serious", "critical", "catastrophic"]
            description: "Severity of potential harm per ISO 14971"
            definitions:
              negligible: "Inconvenience or temporary discomfort"
              minor: "Temporary injury or impairment not requiring professional medical intervention"
              serious: "Injury or impairment requiring professional medical intervention"
              critical: "Permanent impairment or life-threatening injury"
              catastrophic: "Death"
              
      # --- RISK ESTIMATION (Pre-Mitigation) ---
      initial_risk_estimate:
        type: object
        required: true
        description: "Risk before mitigation controls applied"
        fields:
          severity:
            type: integer
            required: true
            min: 1
            max: 5
            description: "Severity score (1=negligible, 5=catastrophic)"
            
          probability:
            type: integer
            required: true
            min: 1
            max: 5
            description: "Probability of occurrence (1=rare, 5=frequent)"
            
          detectability:
            type: integer
            required: true
            min: 1
            max: 5
            description: "Difficulty of detection (1=easy, 5=nearly impossible)"
            note: "Optional - used for RPN calculation"
            
          rpn:
            type: integer
            required: false
            description: "Risk Priority Number (Severity × Probability × Detectability)"
            calculation: "severity * probability * detectability"
            range: "1-125"
            
          risk_level:
            type: enum
            required: true
            values: ["low", "medium", "high", "unacceptable"]
            description: "Overall risk level determination"
            
      # --- RISK MITIGATION ---
      mitigation_measures:
        type: array
        required: true
        item_type: object
        min_items: 1
        description: "Risk control measures to reduce risk"
        fields:
          control_id:
            type: string
            required: false
            description: "Unique control identifier"
            example: "CTRL-001"
            
          control_type:
            type: enum
            required: true
            values: ["inherent_safety", "protective_measure", "information_for_safety", "procedural_control"]
            description: "Type of risk control per ISO 14971"
            
          description:
            type: string
            required: true
            description: "Detailed description of mitigation measure"
            example: "Shadow testing validates auto-approval rules before deployment"
            
          implemented_by:
            type: array
            required: false
            item_type: string
            format: "DI-{PROJECT}-###"
            description: "Design Input(s) that implement this control"
            
          verified_by:
            type: array
            required: false
            item_type: string
            format: "VT-{PROJECT}-###"
            description: "Verification test(s) that verify this control"
            
          effectiveness:
            type: enum
            required: false
            values: ["not_effective", "partially_effective", "effective", "highly_effective"]
            description: "Assessed effectiveness of control"
            
      # --- RESIDUAL RISK (Post-Mitigation) ---
      residual_risk_estimate:
        type: object
        required: true
        description: "Risk after mitigation controls applied"
        fields:
          severity:
            type: integer
            required: true
            min: 1
            max: 5
            
          probability:
            type: integer
            required: true
            min: 1
            max: 5
            
          detectability:
            type: integer
            required: false
            min: 1
            max: 5
            
          rpn:
            type: integer
            required: false
            calculation: "severity * probability * detectability"
            
          risk_level:
            type: enum
            required: true
            values: ["low", "medium", "high", "unacceptable"]
            
          acceptability:
            type: enum
            required: true
            values: ["acceptable", "alarp", "unacceptable"]
            description: "Risk acceptability determination per ISO 14971"
            definitions:
              acceptable: "Risk is acceptable as-is"
              alarp: "As Low As Reasonably Practicable - additional controls considered"
              unacceptable: "Risk must be reduced before release"
              
          justification:
            type: string
            required: true
            min_length: 50
            description: "Justification for risk acceptability decision"
            
      # --- MONITORING ---
      monitoring:
        type: object
        required: false
        description: "Post-market surveillance and monitoring"
        fields:
          monitoring_plan:
            type: string
            required: false
            description: "How risk will be monitored in production"
            
          metrics:
            type: array
            required: false
            item_type: string
            description: "Metrics to track"
            example: ["False positive rate", "Auto-approval rate"]
            
          review_frequency:
            type: string
            required: false
            example: "Monthly, Quarterly, Annually"
            
      # --- METADATA ---
      metadata:
        type: object
        required: true
        fields:
          identified_by:
            type: string
            required: true
            description: "Person/team who identified risk"
            
          identified_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            
          analyzed_by:
            type: string
            required: false
            description: "Risk analyst"
            
          analyzed_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          reviewed_by:
            type: string
            required: false
            description: "Risk reviewer"
            
          reviewed_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          approved_by:
            type: string
            required: false
            description: "Quality Manager who approved risk analysis"
            
          approved_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          status:
            type: enum
            required: true
            values: ["identified", "analyzed", "mitigated", "accepted", "closed", "monitoring"]
            description: "Risk management lifecycle status"
            
      # --- CATEGORIZATION ---
      tags:
        type: array
        required: false
        item_type: string
        description: "Tags for categorization"
        example: ["meta-learning", "ai-risk", "safety-critical"]

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "id_format"
    description: "ID must follow pattern R-{PROJECT}-### with zero-padded number"
    
  - rule: "residual_less_than_initial"
    description: "Residual risk RPN should be less than or equal to initial RPN"
    
  - rule: "unacceptable_requires_mitigation"
    description: "If residual risk is 'unacceptable', additional mitigation_measures required"
    
  - rule: "class_c_requires_controls"
    description: "Risks linked to Class C Design Inputs must have rigorous controls"
    
  - rule: "mitigation_verification"
    description: "Each mitigation measure should be verified by a test"
    
  - rule: "approval_for_acceptance"
    description: "Risks with acceptability='acceptable' or 'alarp' require QM approval"
    
  - rule: "severity_consistency"
    description: "harm.severity must match risk_estimate.severity mapping"

# ============================================================================
# ISO 14971 RISK MATRIX
# ============================================================================

risk_matrix:
  severity_scale:
    1: "Negligible - Inconvenience or temporary discomfort"
    2: "Minor - Temporary injury, no professional medical intervention needed"
    3: "Serious - Injury requiring professional medical intervention"
    4: "Critical - Permanent impairment or life-threatening injury"
    5: "Catastrophic - Death"
    
  probability_scale:
    1: "Rare - <0.01% probability"
    2: "Unlikely - 0.01% to 0.1% probability"
    3: "Possible - 0.1% to 1% probability"
    4: "Likely - 1% to 10% probability"
    5: "Frequent - >10% probability"
    
  detectability_scale:
    1: "Very High - Almost certain to detect"
    2: "High - Likely to detect"
    3: "Medium - May detect"
    4: "Low - Unlikely to detect"
    5: "Very Low - Almost impossible to detect"
    
  risk_level_determination:
    unacceptable: "RPN > 100 OR Severity = 5 OR (Severity = 4 AND Probability >= 3)"
    high: "RPN 50-100 OR Severity = 4"
    medium: "RPN 20-49 OR Severity = 3"
    low: "RPN < 20 AND Severity <= 2"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - example_name: "Software Risk"
    file_reference: "risks.yaml - R-PLATFORM-001 (Meta-learning degradation)"
    
  - example_name: "Security Risk"
    file_reference: "risks.yaml - R-PLATFORM-019 (Cross-tenant data leakage)"
    
  - example_name: "Safety-Critical Risk"
    file_reference: "risks.yaml - R-PLATFORM-010 (Class C misclassification)"

# ============================================================================
# TEMPLATE
# ============================================================================

template: |
  - id: R-PROJECT-###
    title: "Brief risk statement"
    
    hazard:
      description: "Source of potential harm"
      category: "software_defect"
    
    hazardous_situation: "Circumstance exposing to hazard"
    
    harm:
      description: "Potential harm that could result"
      severity: "serious"
    
    initial_risk_estimate:
      severity: 3
      probability: 3
      detectability: 2
      rpn: 18
      risk_level: "medium"
    
    mitigation_measures:
      - control_type: "protective_measure"
        description: "Specific mitigation control"
        implemented_by: [DI-PROJECT-###]
        verified_by: [VT-PROJECT-###]
        effectiveness: "effective"
    
    residual_risk_estimate:
      severity: 3
      probability: 1
      detectability: 2
      rpn: 6
      risk_level: "low"
      acceptability: "acceptable"
      justification: "Risk reduced to acceptable level through effective controls"
    
    monitoring:
      monitoring_plan: "How risk will be monitored post-market"
      metrics: ["Metric to track"]
      review_frequency: "Monthly"
    
    metadata:
      identified_by: "Risk Analyst"
      identified_date: "2025-11-09"
      status: "accepted"
    
    tags: ["category", "type"]

# ============================================================================
# CHANGE CONTROL
# ============================================================================

change_control:
  risk_changes:
    new_risks: "Can be added anytime, require risk analysis"
    severity_changes: "Require re-analysis and QM approval"
    mitigation_changes: "Require verification that controls still effective"
    
  risk_lifecycle:
    identified: "Risk discovered, initial documentation"
    analyzed: "Risk analysis complete (severity, probability estimated)"
    mitigated: "Mitigation measures implemented"
    accepted: "Residual risk accepted by QM"
    closed: "Risk no longer applicable"
    monitoring: "Risk under post-market surveillance"
    
  traceability_requirements:
    forward: "Link to Design Inputs that implement controls"
    backward: "Link to User Needs or Design Inputs that introduced risk"
    verification: "Link to verification tests that verify controls"

