  specification:
    title: "EncounterResultsTimeline wrapper + EncounterMissionControl brush wiring"
    description: |
      Adapter that lifts the patient-drawer timeline scrubber
      (DI-LEO-AI-179) onto the /care/encounters surface so
      reviewers can see the temporal distribution of search
      results and brush a date window to filter the result table.

      Implementation pieces:

        1. New module
           `services/ui/src/components/mission-control/EncounterResultsTimeline.tsx`
           that adapts `EncounterListItem[]` -> `ScrubberEncounter[]`
           (renaming `encounter_date` -> `date`, dropping rows
           whose date does not parse) and renders the existing
           `EncounterTimelineScrubber` with `linkedEncounterIds`
           empty, no episode bounds, and no milestones. The
           wrapper renders nothing when fewer than 5 input rows
           have a parseable date.

        2. `EncounterMissionControl.tsx` gains:
           - `timelineRange: { fromMs, toMs } | null` state, reset
             on every fresh `load()`.
           - A `filteredRows` step that intersects bucket filter
             AND brush range so pagination + table stay in sync.
           - The new `EncounterResultsTimeline` rendered between
             the `Score3DMap` block and the `EncounterResultsTable`.
           - `highlightedEncounterId` and the timeline's
             `activeEncounterId` both wired to
             `activePreview?.encounter_id ?? null` so the active
             encounter receives the table row highlight + the
             histogram active ring.
           - `onJumpToEncounter` from the timeline -> opens the
             matching loaded row in the preview dialog.

      The brush filter MUST compose with the existing bucket and
      score filters (intersection, not union) and MUST NOT mutate
      the loaded result set so batch-bar workflows continue to
      operate on the visible page.

    acceptance_criteria:
