            - "libs/classifiers/encounter_textcat.py"
            - "libs/classifiers/encounter_rules.json"
            - "services/api/app/services/encounter_classifier.py"
          date: "2026-03-01"
          closes: "Classification LLM surface (encounter text no longer sent to AWS Haiku or Azure GPT)"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 81001-5-1"
          clause: "5.6.1"
          nature: "Untrusted input embedded in LLM prompts without sanitisation (residual: LLM extraction path only when enabled)"

# =============================================================================
# PHASE 3: ATTACK PATH SYNTHESIS
# =============================================================================

attack_chains:
  - id: "CHAIN-001"
    name: "Identity spoofing to full patient data exfiltration"
    steps:
      - step: 1
        threat_ref: "AUTH-S-001"
        action: "Attacker sets X-User-Email header to a known practitioner email"
      - step: 2
        threat_ref: "AUTH-E-001"
        action: "If admin email used, attacker gains is_admin=True bypassing all org scope restrictions"
      - step: 3
        threat_ref: "PAT-S-001"
        action: "Attacker calls GET /patients to list all patients (admin scope = unrestricted)"
      - step: 4
        action: "Attacker calls GET /patients/{id}/encounters to retrieve full clinical text for each patient"
    objective: "Bulk exfiltration of patient clinical records"
    blast_radius: "All patient data across all NHS trusts (if admin email spoofed)"
    controls_traversed: "org_scope resolution (bypassed by admin flag)"
    overall_severity: "Critical"
    clinical_safety_impact: "Patient data breach; UK GDPR Article 9 special category data exposed"

  - id: "CHAIN-002"
    name: "Unauthenticated model supply chain compromise"
    steps:
      - step: 1
        threat_ref: "API-S-001"
        action: "Attacker calls POST /model-registry/register with malicious model version"
      - step: 2
        action: "Attacker calls POST /model-registry/versions/{v}/upload with trojanized spaCy model"
      - step: 3
        action: "Attacker calls POST /model-registry/versions/{v}/validate with fabricated P=0.95 R=0.95"
      - step: 4
        action: "Attacker calls POST /model-registry/versions/{v}/canary/start"
      - step: 5
        action: "Attacker calls POST /model-registry/versions/{v}/canary/result with fabricated P=0.90 R=0.90"
      - step: 6
        action: "Attacker calls POST /model-registry/versions/{v}/promote — triggers hot-reload on inference service"
    objective: "Replace production NER model with attacker-controlled model that systematically miscodes clinical entities"
    blast_radius: "All future coding operations; all training data derived from model output; population-level audit data integrity"
    controls_traversed: "Offline eval threshold (bypassed by fabricated metrics); canary KPI gate (bypassed by fabricated metrics)"
    overall_severity: "Critical"
    clinical_safety_impact: "Systematic miscoding of clinical entities leading to incorrect audit data — directly triggers DC-RM-001 risk R-CL-007 (systematic domain miscoding masks pathway failure)"

  - id: "CHAIN-003"
    name: "Identity spoofing to training data poisoning"
    steps:
      - step: 1
        threat_ref: "AUTH-S-001"
        action: "Attacker spoofs a practitioner email"
      - step: 2
        threat_ref: "TRN-T-001"
        action: "Attacker calls POST /training/labels/bulk-import with poisoned training labels"
      - step: 3
        action: "Poisoned labels included in next training run"
      - step: 4
        action: "Trained model learns biased patterns from poisoned data"
    objective: "Corrupt NER model training data to produce systematically biased clinical coding"
    blast_radius: "All future model versions trained on poisoned data; population-level audit integrity"
    controls_traversed: "CallerScope auth (bypassed via AUTH-S-001); source string validation (attacker uses valid source name)"
    overall_severity: "High"
    clinical_safety_impact: "Gradual degradation of NER accuracy in targeted clinical domains"

  - id: "CHAIN-004"
    name: "Terminology poisoning via unauthenticated endpoints"
    steps:
      - step: 1
        threat_ref: "API-S-002"
        action: "Attacker calls POST /terminology/surface-forms/upsert-mapping to inject false SNOMED mappings"
      - step: 2
        action: "SurfaceForm MAPS_TO relationships bias terminology resolution for targeted clinical terms"
      - step: 3
        action: "Future coding operations use biased mappings, producing incorrect SNOMED codes"
    objective: "Subtly manipulate clinical coding by biasing terminology resolution"
    blast_radius: "All patients whose encounters contain the targeted clinical terms"
    controls_traversed: "SurfaceForm 1.2x boost weight (attacker must accept limited influence per mapping)"
    overall_severity: "Medium"
    clinical_safety_impact: "Biased SNOMED coding at population level"

  - id: "CHAIN-005"
    name: "Session theft via insecure cookie to persistent access"
    steps:
      - step: 1
        threat_ref: "AUTH-I-001"
        action: "Attacker intercepts leo_session cookie over HTTP (secure=False)"
      - step: 2
        threat_ref: "AUTH-I-002"
        action: "Stolen cookie valid for 7 days without rotation"
      - step: 3
        action: "Attacker uses cookie to access all resources the victim can access"
    objective: "Persistent impersonation of legitimate user"
    blast_radius: "All data within victim's org scope"
    controls_traversed: "Session cookie authentication (cookie is the only credential)"
    overall_severity: "High"
    clinical_safety_impact: "Patient data exposure within victim's org scope"

# =============================================================================
# PHASE 4: GAP ANALYSIS AND CONSOLIDATION
