# -- R-LEO-AI-024 -- Cross-Tenant Data Leakage
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-024"
  title: "Patient data from one organisation visible to users from another organisation"

  hazard:
    description: "Multi-tenancy isolation failure allows data from one organisation to be accessed by users of another organisation"
    category: "security_breach"

  hazardous_situation: "A user authenticated to Organisation A can view, query, or export patient data belonging to Organisation B due to a tenancy isolation failure"

  harm:
    description: "Cross-organisation patient data breach with severe regulatory and reputational consequences"
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 2
    detectability: 2
    rpn: 16
    risk_level: "high"

  mitigation_measures:
    - control_type: "inherent_safety"
      description: "Organisation-scoped data partitioning in Neo4j with mandatory org_id filter on all queries"
      implemented_by: ["DI-LEO-AI-020"]
      verified_by: ["VT-LEO-AI-012"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "API middleware enforces organisation scope from authenticated session"
      implemented_by: ["DI-LEO-AI-020"]
      verified_by: ["VT-LEO-AI-012"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Integration tests verify cross-tenant isolation"
      implemented_by: ["DI-LEO-AI-020"]
      verified_by: ["VT-LEO-AI-012"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: "Periodic penetration testing of tenant isolation"
      implemented_by: ["DI-LEO-AI-020"]
      verified_by: ["VT-LEO-AI-012"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 1
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Mandatory org_id filtering at both database and API layers provides defence in depth. Integration tests verify isolation. Penetration testing provides independent validation. Probability of cross-tenant leakage reduced to improbable."

  monitoring:
    monitoring_plan: "Track cross-tenant query attempts, penetration test results, and tenant isolation test pass rate"
    metrics: ["Cross-tenant query attempt count", "Penetration test results", "Tenant isolation test pass rate"]
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["security", "multi-tenancy", "data-breach", "gdpr"]
