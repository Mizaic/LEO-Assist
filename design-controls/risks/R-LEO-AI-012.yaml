# -- R-LEO-AI-012 -- Neo4j Database Unavailable
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-012"
  title: "Neo4j database unavailable causing system outage"

  hazard:
    description: "Neo4j Patient or Coding database experiences outage or performance degradation"
    category: "infrastructure_failure"

  hazardous_situation: "Core system functionality is unavailable because one or both Neo4j databases cannot be reached, preventing pipeline processing, data access, and user interactions"

  harm:
    description: "System downtime affecting all users; audit processing halted"
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 1
    rpn: 4
    risk_level: "low"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "Health check endpoints detect database unavailability"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: "Graceful error handling returns clear error messages to users"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: "Monitoring alerts notify operators of database connectivity issues"
      implemented_by: []
      verified_by: []
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Health checks and monitoring enable rapid detection and response; graceful error handling prevents cascading failures or data corruption"

  monitoring:
    monitoring_plan: "Continuous health check monitoring of Neo4j database instances"
    metrics: ["Database availability", "Connection pool health", "Query response times"]
    review_frequency: "Continuous"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["infrastructure", "neo4j", "availability"]
