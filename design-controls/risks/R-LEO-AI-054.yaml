# -- R-LEO-AI-054 -- Administrative metadata coded as clinical SNOMED finding
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-054"
  title: "Administrative appointment header lines are coded as clinical SNOMED findings"

  hazard:
    description: >
      EMIS encounter exports include structured administrative header lines
      (e.g. timestamps, staff names, entry locations, appointment confirmations).
      If the NLP pipeline processes these lines as clinical text, the extractor
      may produce SNOMED codings such as "Seen in general practitioner surgery"
      or "Seen in primary care establishment" derived solely from administrative
      metadata rather than clinician-documented clinical content.
    category: "clinical_safety"

  hazardous_situation: >
    During encounter processing, the sentence splitter produces a chunk from
    an administrative header line. The NER or LLM extractor identifies a
    clinical context code and the pipeline writes a DOCUMENTS relationship
    with the header line as the evidence phrase. This coded record appears
    in the patient clinical graph as a clinical finding, potentially inflating
    encounter-level coding counts and distorting audit dashboards. Reviewers
    may accept the code without recognising it was sourced from administrative
    metadata rather than clinical text.

  harm:
    description: >
      Patient clinical records contain spurious SNOMED codes not supported
      by clinical documentation. Audit quality metrics are distorted. In
      a HITL context, a reviewer accepting a header-sourced code may create
      a misleading training label. In autonomous mode, the patient record
      is directly corrupted.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 2
    rpn: 24
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        is_header_sentence() and filter_header_sentences() in
        libs/nlp/sentence_splitter.py detect and remove administrative
        header sentences before they reach any extractor. The filter uses
        conservative regex patterns that err on the side of preservation.
      implemented_by: ["DI-LEO-AI-080"]
      verified_by: ["VT-LEO-AI-080"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Existing HITL mode requires human reviewer to approve all coding
        proposals before they are written to the clinical record, providing
        a secondary gate against incorrectly sourced codes.
      implemented_by: ["DI-LEO-AI-040"]
      verified_by: ["VT-LEO-AI-003"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The header filter removes the primary pathway for administrative content
      to reach the extractor. Residual probability accounts for header patterns
      not yet covered by the regex (new EMIS export formats). The HITL reviewer
      gate provides a secondary control. Severity reduced because the change
      reduces the plausibility of harm reaching the patient undetected.

  monitoring:
    monitoring_plan: >
      The weekly quality audit (Loop 1) monitors overcoding frequency of
      "Seen in GP surgery" and "Seen in primary care establishment" as
      sentinel concepts. Any increase beyond 5% of encounters triggers a
      SafetyNetAlert for investigation. The surface_form_gaps.json output
      from Phase 3 is reviewed for recurrence of timestamp-pattern evidence
      phrases.
    metrics:
      - "Overcoded 'Seen in GP surgery' count per weekly audit run"
      - "Count of timestamp-pattern evidence phrases in surface_form_gaps.json"
    review_frequency: "Weekly"

  metadata:
    identified_by: "April 2026 full-corpus coding quality audit (audit_encounter_coding.py)"
    identified_date: "2026-04-04"
    status: "mitigated"
    tags:
      - "nlp-pipeline"
      - "overcoding"
      - "precision-gate"
