# -- DI-LEO-AI-067 -- Pathway Version History, Draft/Publish Separation, and Rollback
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-067"
  type: "Functional"
  derived_from: ["UN-LEO-AI-012"]
  requirement: >
    The system SHALL maintain an immutable, append-only version history for each
    clinical pathway (FHIR PlanDefinition). Every time a pathway is published
    (status set to "active"), the system SHALL create an immutable
    PlanDefinitionVersion snapshot in the graph, storing the full rawJson,
    a monotonically increasing versionId, a UTC publishedAt timestamp, and
    optional operator-provided versionNotes. The system SHALL expose a
    GET /fhir/PlanDefinition/{id}/_history endpoint returning all snapshots
    sorted newest-first as a FHIR history Bundle. The system SHALL expose a
    POST /fhir/PlanDefinition/{id}/_restore/{vid} endpoint that promotes a
    historical snapshot back to live by creating a new version entry (rollback
    is non-destructive; history is never deleted). Draft saves (status=draft)
    SHALL NOT create version entries. The pathway builder UI SHALL separate
    "Save draft" from "Publish to live", gate publication behind a validation
    check (no red errors permitted), require an optional version note before
    publishing, and show a scrollable version history drawer with per-version
    "Restore" actions. The pathway list page SHALL group pathways by status
    (Live / In draft / Retired) and expose inline Publish, New draft, and
    Retire actions per card.
  rationale: >
    Clinical AI pipelines that process patient data must be change-controlled.
    An operator must be able to identify exactly which pipeline configuration
    was active at any point in time, roll back to a known-good version if a
    publish introduces incorrect behaviour, and provide an audit trail of who
    changed what and why. Draft/publish separation prevents unintended changes
    to live pipelines while they are being edited. These controls are required
    under IEC 62304 clause 5.5 (software unit verification) and ISO 13485
    clause 4.2.5 (control of records). The version history also supports
    post-market surveillance: if an adverse event is linked to a pipeline
    execution, the exact configuration in use at that time can be retrieved.

  machine_spec:
    agent_prompt: |
      Implement pathway version history and draft/publish separation.

      BACKEND (services/fhir_api/app/routers/plan_definition.py):
      1. On PUT with status=active:
         a. MERGE the live PlanDefinition node first (ensures node exists).
         b. Query coalesce(max(v.versionId), 0) from HAS_VERSION children.
         c. CREATE a PlanDefinitionVersion node linked via HAS_VERSION with:
            id (UUID), planId, versionId (next int), status, rawJson,
            publishedAt (UTC ISO), versionNotes.
         d. Strip versionNotes from resource before rawJson serialisation.
      2. On PUT with status=draft: skip version snapshot entirely.
      3. Add GET /fhir/PlanDefinition/{id}/_history -> FHIR history Bundle,
         each entry decorated with meta.versionId / meta.lastUpdated /
         meta.versionNotes, sorted newest-first.
      4. Add POST /fhir/PlanDefinition/{id}/_restore/{vid}: fetch snapshot,
         set status=active, set versionNotes="Rolled back to v{vid}",
         delegate to upsert_plan_definition (creates a new version entry).
      5. Delete endpoint: also DETACH DELETE HAS_VERSION children.

      FRONTEND (services/ui/src/app/admin/pathways/[id]/page.tsx):
      - Auto-save draft to server on every "Next" click in wizard (background,
        non-blocking; show "Draft saved ✓" in dialog header).
      - Toolbar: status read-only Chip + "Save draft" (outlined) + History
        button (clock icon) + "Publish" (green, opens confirmation dialog).
      - Publish dialog: shows step count, error/warning count, version notes
        TextField; blocked if validation errors > 0.
      - Version history Drawer (380px, right anchor): list of versions
        newest-first with versionId chip, date, versionNotes, "Restore"
        button on non-current versions. Footer note: history is append-only.

      FRONTEND (services/ui/src/app/admin/pathways/page.tsx):
      - Group cards into Live / In draft / Retired sections.
      - Per-card actions: Edit, Publish (draft only), New draft (active only),
        Restore (retired only), Retire icon.
      - Publish from list opens confirmation dialog with versionNotes field.

    acceptance_criteria:
      - type: "test"
        spec: "GET /fhir/PlanDefinition/{id}/_history returns Bundle with versions sorted newest-first"
      - type: "test"
        spec: "GET /fhir/PlanDefinition/{id}/_history returns empty Bundle when no versions exist"
      - type: "test"
        spec: "GET /fhir/PlanDefinition/{id}/_history returns 404 when plan not found"
      - type: "test"
        spec: "POST /fhir/PlanDefinition/{id}/_restore/{vid} returns 200 and sets status=active"
      - type: "test"
        spec: "POST /fhir/PlanDefinition/{id}/_restore/{vid} returns 404 when version not found"
      - type: "test"
        spec: "PUT with status=active creates exactly one PlanDefinitionVersion node via HAS_VERSION"
      - type: "test"
        spec: "PUT with status=draft creates no PlanDefinitionVersion node"
      - type: "test"
        spec: "versionNotes is stripped from rawJson stored in Neo4j but persisted in version node"
      - type: "test"
        spec: "versionNotes accepted from top-level field or nested meta.versionNotes"
      - type: "test"
        spec: "DELETE removes HAS_VERSION and PlanDefinitionVersion nodes"
      - type: "review"
        spec: "Publish button blocked when validation errors > 0 (manual review of UI)"
      - type: "review"
        spec: "Restore action creates a new version entry; no existing version is modified"

    constraints:
      - type: "safety"
        spec: "Version history is append-only; no DELETE or UPDATE operations on PlanDefinitionVersion nodes"
      - type: "safety"
        spec: "Publish is gated by validation: red errors must be resolved before status=active is permitted"
      - type: "traceability"
        spec: "Each version node stores: versionId, publishedAt (UTC), versionNotes, planId, full rawJson"
      - type: "audit"
        spec: "Rollback creates a new version entry rather than mutating the live node silently"
      - type: "performance"
        spec: "GET /_history completes within 500ms for pathways with up to 50 version snapshots"

    dependencies: ["DI-LEO-AI-060", "DI-LEO-AI-061"]
    downstream_impacts:
      - "Post-market surveillance: exact pipeline configuration retrievable for any execution"
      - "Incident investigation: version active at time of adverse event can be identified"
      - "Regulatory audit: change history available for IEC 62304 / ISO 13485 review"

    technical_details:
      language: "Python / TypeScript"
      framework: "FastAPI / Next.js"
      libraries: ["neo4j", "fastapi", "@mui/material", "@xyflow/react"]
      file_structure:
        - "services/fhir_api/app/routers/plan_definition.py"
        - "services/fhir_api/tests/test_plan_definition_version_history.py"
        - "services/ui/src/app/admin/pathways/[id]/page.tsx"
        - "services/ui/src/app/admin/pathways/page.tsx"
      estimated_loc: 350

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 11 pytest tests pass with mocked KnowledgeGraphClient.
      UI gating and history drawer verified by manual review.
    test_protocol: "VT-LEO-AI-067"

  safety_class: "B"
  risks: ["R-LEO-AI-015"]
  tags: ["pathway-builder", "version-history", "rollback", "draft-publish", "audit", "change-control"]
