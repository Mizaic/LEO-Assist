- id: "VT-LEO-AI-102"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-102"]
    risks: ["R-LEO-AI-070"]

  metadata:
    title: "Analytics assertion filter - CCI and cohort queries"
    description: >
      Verifies that the CCI scorer and cohort condition/smoking filters exclude
      entities with non-confirmed assertions (absent, hypothetical, possible,
      family) from analytics computations. Tests inspect both Cypher query
      structure and Python-layer scoring logic.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/analytics_api/tests/test_analytics_assertion_filter.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python venv with pytest installed"
      - "No live Neo4j connection required (queries mocked)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-102-TC-001"
      case_name: "CCI query uses aliased relationship and assertion guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Invoke calculate_cci with spy PatientGraphClient"
          expected_result: >
            Captured Cypher contains [r:DOCUMENTS], coalesce(r.assertion,'present'),
            and $assertions parameter set to ['present','historical']
      verification_method: "automated"
      acceptance_criteria:
        - "[r:DOCUMENTS] present in query string"
        - "coalesce(r.assertion present in query string"
        - "$assertions param equals frozenset{'present','historical'}"

    - case_id: "VT-102-TC-002"
      case_name: "Present assertion condition scores in CCI"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock DB returns row with concept_name='Diabetes without complications'"
          expected_result: "CCI score equals 1"
      verification_method: "automated"
      acceptance_criteria:
        - "result['cci_score'] == 1"

    - case_id: "VT-102-TC-003"
      case_name: "Historical assertion condition scores in CCI"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock DB returns row with concept_name='HIV/AIDS'"
          expected_result: "CCI score equals 6"
      verification_method: "automated"
      acceptance_criteria:
        - "result['cci_score'] == 6"

    - case_id: "VT-102-TC-004"
      case_name: "Absent condition excluded - CCI returns 0"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock DB returns empty list (assertion guard excluded absent row)"
          expected_result: "CCI score equals 0 and matched_conditions is empty"
      verification_method: "automated"
      acceptance_criteria:
        - "result['cci_score'] == 0"
        - "result['matched_conditions'] == []"

    - case_id: "VT-102-TC-005"
      case_name: "Multiple conditions sum correctly"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock DB returns Dementia (1) and Renal disease (2)"
          expected_result: "CCI score equals 3"
      verification_method: "automated"
      acceptance_criteria:
        - "result['cci_score'] == 3"

    - case_id: "VT-102-TC-006"
      case_name: "_CONFIRMED_ASSERTIONS constant is correct"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Import _CONFIRMED_ASSERTIONS from cohorts module"
          expected_result: "equals frozenset{'present','historical'}"
      verification_method: "automated"
      acceptance_criteria:
        - "_CONFIRMED_ASSERTIONS == frozenset({'present','historical'})"

    - case_id: "VT-102-TC-007"
      case_name: "condition_codes clause includes assertion guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with condition_codes=['12345678']"
          expected_result: >
            where clause contains coalesce(r.assertion and $confirmed_assertions;
            params['confirmed_assertions'] == ['present','historical']
      verification_method: "automated"
      acceptance_criteria:
        - "coalesce(r.assertion in where clause"
        - "$confirmed_assertions in where clause"
        - "params confirmed_assertions equals confirmed set"

    - case_id: "VT-102-TC-008"
      case_name: "condition_codes clause does not hardcode absent"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with condition_codes set; inspect where string"
          expected_result: "string 'absent' not present in where clause"
      verification_method: "automated"
      acceptance_criteria:
        - "'absent' not in where"

    - case_id: "VT-102-TC-009"
      case_name: "ever_smoker clause includes assertion guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with smoking_status='ever_smoker'"
          expected_result: "where clause contains assertion guard; params set"
      verification_method: "automated"
      acceptance_criteria:
        - "coalesce(r.assertion in where"
        - "params confirmed_assertions set correctly"

    - case_id: "VT-102-TC-010"
      case_name: "current_smoker clause includes assertion guard"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with smoking_status='current_smoker'"
          expected_result: "where clause contains assertion guard; params set"
      verification_method: "automated"
      acceptance_criteria:
        - "coalesce(r.assertion in where"
        - "params confirmed_assertions set correctly"

    - case_id: "VT-102-TC-011"
      case_name: "condition_codes and smoking combined - no duplicate param"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with condition_codes and smoking_status='ever_smoker'"
          expected_result: "params['confirmed_assertions'] present exactly once with correct value"
      verification_method: "automated"
      acceptance_criteria:
        - "set(params['confirmed_assertions']) == {'present','historical'}"

    - case_id: "VT-102-TC-012"
      case_name: "No condition filter - confirmed_assertions param absent"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_build_where_clauses with empty CohortFilter"
          expected_result: "'confirmed_assertions' not in params"
      verification_method: "automated"
      acceptance_criteria:
        - "'confirmed_assertions' not in params"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-102/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-102-EXEC-001"
      executed_by: "automated CI"
      executed_date: "2026-04-13"
      environment: "development"
      pytest_command: "pytest services/analytics_api/tests/test_analytics_assertion_filter.py -v"
      result: "pass"
      cases_run: 12
      cases_passed: 12
      cases_failed: 0
      notes: >
        All 12 test cases passed on first run after fixes to cci.py and cohorts.py.
