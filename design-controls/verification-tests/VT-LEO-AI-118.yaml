- id: "VT-LEO-AI-118"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-123"]
    risks: ["R-LEO-AI-083"]

  metadata:
    title: "Coding review modal split and inclusive redesign verification"
    description: >
      Verifies that the CodingReviewCasesModal.tsx split produces
      five files each <=500 LOC, preserves the component's public
      API, renders a PageIntro keyed to 'coding-review-cases'
      with Flesch-Kincaid grade <=9 on each copy string, and
      that glossary entries for assertion, semantic tag,
      suppress, declined, absent, planned, and hypothetical all
      read at grade <=9.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/coding-review-split.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "jest + @testing-library/react installed"
      - "next/jest configured (services/ui/jest.config.js)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-118-TC-001"
      case_name: "All five modules are <=500 LOC"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            For each of
            CodingReviewCasesModal.tsx, CaseCard.tsx,
            EncounterContextPanel.tsx, codingReviewUtils.ts,
            codingReviewCopy.ts count non-blank lines.
          expected_result: >
            Every file is at most 500 lines.
          verification_method: "automated"
      acceptance_criteria:
        - "Code-health file-length rule observed"

    - case_id: "VT-118-TC-002"
      case_name: "PageIntro copy passes FK grade <=9"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Import CODING_REVIEW_INTRO from
            codingReviewCopy.ts and call fleschKincaidGrade()
            on why/how/what.
          expected_result: "Every string returns grade <=9"
          verification_method: "automated"
      acceptance_criteria:
        - "Readability gate blocks jargon regressions"

    - case_id: "VT-118-TC-003"
      case_name: "Glossary has plain-language entries for core terms"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            For termIds ['assertion', 'semantic-tag', 'suppress',
            'declined', 'absent', 'planned', 'hypothetical']
            call lookupTerm and fleschKincaidGrade on the
            plainLanguage string.
          expected_result: >
            Every term resolves and the plainLanguage copy
            reads at grade <=9.
          verification_method: "automated"
      acceptance_criteria:
        - "Glossary covers every clinical term the modal shows"

    - case_id: "VT-118-TC-004"
      case_name: "CodingReviewCasesModal preserves its Props signature"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Render CodingReviewCasesModal with item, open=true,
            onClose, onAllResolved and initialCases=[] and
            expect the dialog to render the PageIntro + empty
            state without throwing.
          expected_result: >
            Dialog renders and 'All cases resolved' is shown;
            PageIntro is present.
          verification_method: "automated"
      acceptance_criteria:
        - "Public API unchanged"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-118/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-118-RUN-001"
      date: "2026-04-16"
      executed_by: "cursor-agent jest"
      result: "pass"
      tests_run: 19
      tests_passed: 19
      tests_failed: 0
      notes: >
        Command: cd services/ui && npx jest
        src/__tests__/coding-review-split.test.tsx --no-coverage.
        All four test cases pass: eight split modules each <=500 LOC
        (main modal 389, title 213, CaseCard 461, leo result 174,
        suppress form 175, encounter panel 133, utils 135, copy 44);
        CODING_REVIEW_INTRO why/how/what all read at FK grade <=9;
        glossary entries for assertion, semantic-tag, suppress,
        declined, absent, planned, hypothetical all resolve and
        read at grade <=9; CodingReviewCasesModal renders its
        PageIntro and empty state unchanged with initialCases=[].
