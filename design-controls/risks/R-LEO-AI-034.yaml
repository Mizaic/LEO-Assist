# -- R-LEO-AI-034 -- LLM Alias Suggestion Introduces Incorrect Surface Form Mappings
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-034"
  title: "LLM-generated surface form alias accepted by admin causes false-positive NER coding"

  hazard:
    description: >
      The suggest-aliases endpoint (POST /terminology/concepts/{id}/suggest-aliases)
      uses a small LLM (Claude Haiku via AWS Bedrock) to propose additional text
      aliases for a SNOMED concept.  The LLM operates on concept metadata only
      (FSN, semantic tag, existing aliases) — no patient data is transmitted.
      However, if the LLM suggests an alias that is ambiguous (e.g. "SOB" for
      "Shortness of Breath" when it could also mean "Son of a Bitch" in UK
      clinical notes, or "BP" for a cardiovascular concept when it also appears
      in unrelated contexts), and an administrator accepts the suggestion without
      clinical review, that alias enters the surface form dictionary and causes
      the NER pipeline to code unrelated clinical text.
    category: "incorrect_output"

  hazardous_situation: >
    An administrator uses the Settings → Surface Forms interface to suggest
    aliases for a SNOMED concept using the AI button.  The LLM returns a phrase
    that is clinically ambiguous or overly generic.  The administrator accepts
    the suggestion.  Subsequent encounters containing that phrase are flagged by
    the NER pipeline and may be auto-coded (Tier 1) or routed to review (Tier 2/3).

  harm:
    description: >
      (a) False-positive NER hit in autonomous mode causes an unintended clinical
          code to be written to the patient graph, degrading clinical coding
          accuracy and potentially inflating disease prevalence metrics used for
          population health management.
      (b) In HITL mode, spurious suggestions enter the review queue, increasing
          reviewer burden and eroding trust in the coding pipeline.
      Severity is limited because: (1) the alias must be accepted by a human
      reviewer, (2) only future encounters are affected, (3) HITL mode provides
      a further review gate, and (4) the surface form can be deleted from the
      management UI.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: >
        Human-in-the-loop gate: the suggest-aliases endpoint returns suggestions
        as UI chips that require explicit admin acceptance.  No alias is written
        to the graph without a deliberate accept action.  Dismiss chips reject
        suggestions without side-effects.
      implemented_by: ["DI-LEO-AI-050"]
      verified_by: ["VT-LEO-AI-042"]
      effectiveness: "highly_effective"

    - control_type: "protective_measure"
      description: >
        Three-tier classifier gates auto-coding by surface form approval status
        and confidence score.  Newly added manual/LLM-suggested aliases that are
        upserted with source="llm_suggestion" and confidence=1.0 are subject to
        the same tier evaluation as any other surface form.  Ambiguous aliases
        with low terminology match score will fall to Tier 2 or Tier 3.
      implemented_by: ["DI-LEO-AI-038"]
      verified_by: ["VT-LEO-AI-023"]
      effectiveness: "effective"

    - control_type: "protective_measure"
      description: >
        Surface form management interface (DI-LEO-AI-049) allows any accepted
        alias to be deleted from the graph immediately, reversing the effect on
        all future encounters.  Existing coded encounters are unaffected.
      implemented_by: ["DI-LEO-AI-049"]
      verified_by: ["VT-LEO-AI-041"]
      effectiveness: "effective"

    - control_type: "information_for_safety"
      description: >
        UI chips for LLM-suggested aliases are visually distinct (dashed border,
        AI icon) to signal to the administrator that they require clinical
        judgement before acceptance.  Tooltip states "AI suggestion — Accept
        or Dismiss".
      implemented_by: ["DI-LEO-AI-050"]
      verified_by: []
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The mandatory human acceptance step, the three-tier coding gate, and the
      ability to immediately reverse any accepted alias together reduce the
      probability of patient harm to negligible.  The LLM does not process
      patient data; only SNOMED concept metadata is transmitted.  The harm is
      limited to future encounters (not retrospective) and is correctable
      without a code deployment.

  monitoring:
    monitoring_plan: >
      Track the number of LLM-suggested aliases accepted per week and the
      source="llm_suggestion" surface forms' contribution to Tier 3 blocks
      (unexpectedly high Tier 3 rate from new aliases may indicate poor
      suggestion quality).
    metrics:
      - "LLM alias suggestions accepted per week (baseline TBD)"
      - "Tier 3 block rate for source=llm_suggestion surface forms"
      - "Admin delete rate for source=llm_suggestion surface forms (high rate = poor quality)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Design Review — surface forms management feature"
    identified_date: "2026-03-03"
    status: "analyzed"

  related_risks: ["R-LEO-AI-005", "R-LEO-AI-001"]
  related_risk_rationale: >
    R-LEO-AI-005 covers incorrect SNOMED mappings written by the writeback
    learning loop; this risk covers the same effect arising from LLM alias
    suggestions.  R-LEO-AI-001 covers incorrect NER entity recognition
    generally; this risk is a specific pathway through the surface form
    dictionary.

  tags:
    - "llm"
    - "alias-suggestion"
    - "surface-forms"
    - "false-positive"
    - "ner-accuracy"
    - "human-oversight"
