# -- DI-LEO-AI-028 -- Dashboard UI Components
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-028"
  type: "Functional"
  derived_from: ["UN-LEO-AI-019"]
  requirement: "The system SHALL provide visual dashboard components displaying KPI cards, pathway charts, episode breakdowns, safety-net alert summaries, and screening uptake visualisations with page load time under 3 seconds"
  rationale: "Dashboard visualisations make audit data actionable for quality improvement leads. Components must load quickly and support interactive drill-down to maintain user engagement."

  machine_spec:
    agent_prompt: |
      Implement dashboard UI components (~300 LOC).

      SINGLE PURPOSE: Render interactive dashboard visualisations
      for audit KPIs, pathways, episodes, safety-net alerts, and
      screening uptake.

      REQUIREMENTS:
      1. KPICards component displays key metrics with trend indicators
      2. DiagnosedByTypeChart renders pathway breakdown using recharts
      3. EpisodesByTypeChart renders episode distribution chart
      4. SafetyNetAlertsSummary shows alert counts and severity
      5. Dashboard page composes all components with responsive layout
      6. Page load time under 3 seconds with sample data

      METHODS:
      - KPICards({ data }): Render metric cards with trend arrows
      - DiagnosedByTypeChart({ data }): Render stacked bar chart
      - EpisodesByTypeChart({ data }): Render pie/donut chart
      - SafetyNetAlertsSummary({ alerts }): Render alert summary table
      - DashboardPage(): Compose all components with MUI Grid

      CODE CLARITY:
      - Each chart component is self-contained and independently testable
      - Data loading separated from presentation via custom hooks
      - MUI theme tokens used for all colours and spacing

    acceptance_criteria:
      - type: "demonstration"
        spec: "Dashboard renders correctly with sample data"
      - type: "test"
        spec: "Page load completes in <= 3 seconds"
      - type: "demonstration"
        spec: "Drill-down navigation works from summary to detail views"

    constraints:
      - type: "performance"
        spec: "Page load time <= 3 seconds with production-sized dataset"
      - type: "code_quality"
        spec: "Components follow MUI design system and use theme tokens"

    dependencies: []

    downstream_impacts:
      - "services/ui -- dashboard is the primary landing page"
      - "services/api -- dashboard fetches KPI data from core API"

    technical_details:
      language: "TypeScript"
      framework: "Next.js / React"
      libraries: ["mui", "recharts"]
      file_structure:
        - "services/ui/src/components/dashboard/KPICards.tsx"
        - "services/ui/src/components/dashboard/DiagnosedByTypeChart.tsx"
        - "services/ui/src/components/dashboard/EpisodesByTypeChart.tsx"
        - "services/ui/src/components/dashboard/SafetyNetAlertsSummary.tsx"
        - "services/ui/src/app/dashboard/page.tsx"
      estimated_loc: 300

  verification:
    method: "Demonstration"
    phase: "OQ"
    acceptance: "Dashboard renders correctly with sample data; page load <= 3 seconds; drill-down navigation works"
    test_protocol: "VT-LEO-AI-028"

  safety_class: "A"
  risks: []
  tags: ["dashboard", "ui", "frontend", "visualisation"]
