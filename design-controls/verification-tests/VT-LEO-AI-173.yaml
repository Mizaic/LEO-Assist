    - executed_at: "2026-04-17"
      executor: "automated:jest (services/ui)"
      result: "pass"
      summary: >
        v1.3 (defect fix - infinite re-render on PatientDetailDrawer).
        User reported "Maximum update depth exceeded" thrown from
        PatientDetailDrawer / MissionControl / PatientsPage after the
        v1.2 brush-driven filter wiring landed. Root cause:
        EncounterTextTab.tsx was creating a brand-new linkedEncounterIds
        Set on every render because the useMemo dependency array fed it
        two inline arrays (linkedIdsFromEdges and linkedIdsFromMilestones)
        that were re-instantiated on every render. The unstable Set
        identity cascaded through splitEncounters, the linkedVisible /
        windowVisible / otherVisible arrays, and finally allVisibleIds,
        causing the IntersectionObserver useEffect (deps [allVisibleIds])
        to re-fire on every render and call setVisibleEncounterId. The
        new timelineRange state introduced in v1.2 added enough extra
        render churn to push the cycle past React's hard maximum-update
        cap. Fix:
          - Stabilised linkedEncounterIds with a self-contained useMemo
            that takes only episode.linked_encounter_ids and
            episode.milestones as deps (both stable references on the
            episode prop).
          - Promoted splitEncounters and the visible-array sort/filter
            chain to useMemo so identity is preserved when inputs are
            unchanged (single useMemo returns { linkedVisible,
            windowVisible, otherVisible }).
          - Wrapped filterArgs and the inline onVisibleRangeChange
            handler in useMemo / useCallback so the scrubber sees a
            stable callback identity.
        EncounterTextTab.tsx is now 492 / 500 LOC. Targeted re-run:
        npx jest --testPathPatterns mission-control --no-coverage --
        11 suites / 88 cases, all passing. No additional test cases
        needed - the existing TC-020/021/022 already exercise the
        brush -> filter -> banner -> clear flow that triggered the
        loop in the browser.
      defects_found: 1
      followups: []
