  specification:
    title: "_RE_FIRST_SEEN tightened: every alternation requires an attestation verb (seen/attended/reviewed) within proximity of the clinic token"
    description: |
      Replaces the previous regex (which contained a bare
      ``\b2WW\s+clinic\b`` alternation) with four
      attestation-anchored alternations:

        1. ``\bseen in (?:fast.?track|2WW|TWW|two.week.wait)
            (?:\s+suspected\s+\w[\w\s]{0,30})?\s*clinic\b``
        2. ``\battended (?:fast.?track|2WW|TWW)\b.{0,40}clinic\b``
        3. ``\breviewed in
            (?:fast.?track|2WW|TWW|two.week.wait)\b.{0,40}clinic\b``
        4. ``\bseen in 2WW\b`` (short-form filing-note pattern)

      Every alternation requires an attestation verb so a
      narrative reference such as "referred to 2WW clinic
      but not attended" no longer fires a phantom first_seen
      anchor. The previously-affected episode rescue path
      then no longer promotes open referrals to "completed"
      against a DNA encounter.

    acceptance_criteria:
      - criterion: "narrative_referred_to_2ww_does_not_match"
        type: "safety"
        measurement: "Test"
        target: "_RE_FIRST_SEEN.search('referred to 2WW clinic but not attended due to mobility issues') is None"
      - criterion: "narrative_was_referred_does_not_match"
        type: "safety"
        measurement: "Test"
        target: "_RE_FIRST_SEEN.search('was referred on lower gi 2ww, however was not seen') is None"
      - criterion: "seen_in_fast_track_clinic_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_FIRST_SEEN matches 'Seen in fast track suspected colorectal cancer clinic'"
      - criterion: "attended_2ww_clinic_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_FIRST_SEEN matches 'attended 2WW lower GI clinic on 18 Dec 2024'"
      - criterion: "seen_in_2ww_short_form_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_FIRST_SEEN matches 'Seen in 2WW Clinic? Yes'"

  implementation:
