# -- UN-LEO-AI-026 -- Subscription Continuous Audit with PPV
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-026"
  title: "GP practices subscribe to an ongoing audit volume that provides referral Positive Predictive Values between national NCDA cycles"
  description: |
    GP practices and PCNs need to run ongoing cancer pathway audit between
    national NCDA cycles without waiting for a national round. The system
    offers a subscription model where a practice commits to auditing a
    minimum volume of patients per period (minimum 500 per GP practice).
    The subscription cohort includes all cancer referrals: those with a
    confirmed cancer diagnosis AND those where cancer was excluded. By
    including cancer-excluded referrals the system can calculate the
    Positive Predictive Value (PPV) of the practice's referral pathway --
    the proportion of referrals that resulted in a cancer diagnosis. PPV
    is reported at practice, PCN, and cancer type level and compared
    against national benchmarks. Continuous audit enables practices to
    track improvement between national cycles and identify referral
    quality issues in near real time.

  stakeholder:
    type: "end_user"
    role: "GP Practice Manager / PCN Clinical Director"
    organization: "NHS GP Practice / Primary Care Network"

  priority: "SHOULD"

  rationale: |
    The national NCDA runs periodically. Practices that participate only
    in national rounds receive feedback years after the clinical events
    occurred. Continuous audit closes this lag, enabling quality
    improvement to be tracked in near real time. Including cancer-excluded
    referrals is essential for PPV calculation: a practice that refers
    appropriately will have a PPV consistent with national norms; one
    that over-refers or under-refers will deviate. PPV is a clinically
    meaningful metric that the national NCDA does not currently calculate
    because it only collects confirmed cancer cases. This is a competitive
    differentiator for the platform.

  benefit: |
    Near real-time referral quality intelligence between national audit
    cycles, including PPV benchmarking that the national NCDA programme
    does not provide

  use_case: |
    1. GP practice manager subscribes the practice to the continuous audit
       service, selecting a minimum cohort size of 500 patients per period.
    2. System automatically identifies patients in the practice who meet
       the subscription cohort criteria: all patients referred on a cancer
       pathway (Two Week Wait, urgent, routine, emergency) regardless of
       final diagnosis.
    3. System runs the full audit pipeline for each eligible patient as
       they complete their diagnostic pathway, without waiting for a
       national submission window.
    4. For cancer-confirmed patients, system produces the standard NCDA
       pathway data (PCI, DI, avoidable delay flags, safety-net status).
    5. For cancer-excluded patients, system records the referral event,
       investigation pathway, and final outcome (cancer excluded).
    6. System calculates PPV at practice, PCN, and cancer type level:
       (confirmed cancer referrals / total referrals) x 100.
    7. PCN Clinical Director views the PPV dashboard, comparing the
       practice against national benchmarks and tracking change over time.
    8. Practice uses PPV trend data to evidence referral quality
       improvement in DES reporting and quality improvement plans.
    9. At the end of a subscription period, system generates an export
       compatible with national NCDA submission if the practice is also
       participating in the national round.

  current_solution: |
    No continuous audit capability exists between national NCDA cycles.
    Practices have no mechanism for calculating PPV. Cancer-excluded
    referrals are not captured in the national NCDA proforma.

  pain_points:
    - "No feedback on referral quality until national NCDA findings published -- a lag of 2-3 years"
    - "Cancer-excluded referrals are invisible to national NCDA, making PPV impossible to calculate"
    - "Practices cannot demonstrate improvement between audit cycles"
    - "PCNs have no mechanism to compare referral quality across member practices in real time"

  acceptance_criteria:
    - "System shall support a practice-level subscription with a configurable minimum cohort size (default 500)"
    - "Subscription cohort shall include all cancer pathway referrals regardless of final diagnosis"
    - "System shall run the audit pipeline continuously as patients complete their diagnostic pathway"
    - "System shall calculate PPV at practice, PCN, and cancer type level"
    - "System shall display PPV benchmarks against national reference values"
    - "System shall generate NCDA-compatible export for national submission periods"
    - "System shall report cancer-excluded pathway data separately from cancer-confirmed data"

  success_metrics:
    - metric: "Cohort identification accuracy"
      target: ">=98% of eligible referrals identified within 5 working days of pathway completion"
      baseline: "No current continuous audit baseline"
    - metric: "PPV calculation accuracy"
      target: "100% (deterministic calculation from confirmed cohort data)"
      baseline: "No current PPV calculation capability"
    - metric: "Time from pathway completion to PPV update"
      target: "<=5 working days"
      baseline: "National NCDA: 2-3 year lag from diagnosis to national publication"

  regulatory_impact: "medium"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 (platform model -- programme-agnostic)"
    - "NHS NCDA programme -- continuous audit between national cycles"
    - "Network Contract DES Paragraph 28"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "NHS Cancer Waiting Times guidance"
    - "NHS Faster Diagnosis Standard"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-02"
    status: "draft"

  design_inputs: []
  validation_tests: []

  tags: ["continuous-audit", "subscription", "ppv", "ncda", "referral-quality", "benchmarking"]
