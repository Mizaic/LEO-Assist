  patient_id: "pat-gs-13"
  situation:
    artifacts:
      - { type: referral_request, id: "rr-gs-13" }
  background:
    - { type: encounter, id: "enc-gs-13" }
  guideline_ids: ["G-MELANOMA-2WW"]

resolved_situation:
  patient_id: "pat-gs-13"
  patient_summary:
    age_band: "40-49"
    sex: "M"
  artifacts:
    - kind: referral_request
      id: "rr-gs-13"
      reason: "Changing pigmented lesion, 7-point score 5, ?melanoma"
      referring_specialty: "Dermatology"

resolved_background:
