name: CI - Build and Push Images

# Atlas trace
#   DO: DO-6036D724
#   DI: DI-71087A9E
#   Look up via: get_design_control(dc_type="design-output", dc_id="DO-6036D724")
#
# Selective builds:
#   Every push builds changed images. The tag is sha-<commit>-<branch>.
#   :latest is pushed only from main.
#   detect-changes maps git paths -> affected images. Shared blast-radius
#   paths (libs/, root requirements, this workflow) rebuild everything.
#   Weekly schedule + workflow_dispatch force_all rebuild the full matrix.
#
# Hardening notes
#   - Third-party / Microsoft-owned actions are pinned to immutable commit
#     SHAs with the human-readable tag in a comment.
#   - Webhook-derived values (github.event.before, etc.) are passed through
#     `env:` to shell steps to defeat GHA template injection.

on:
  push:
    branches:
      - "**"
  schedule:
    # Weekly full rebuild (Sunday 03:17 UTC) to warm caches and catch
    # shared-path misses.
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      force_all:
        description: Rebuild every service image
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  MIZAIC_ACR_NAME: mizaicleoacr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      build_ui: ${{ steps.detect.outputs.build_ui }}
      has_backend: ${{ steps.detect.outputs.has_backend }}
      build_all: ${{ steps.detect.outputs.build_all }}
      services_csv: ${{ steps.detect.outputs.services_csv }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: detect
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL_INPUT: ${{ github.event.inputs.force_all }}
        run: |
          set -euo pipefail
          FORCE_ALL="false"
          if [ "$EVENT_NAME" = "schedule" ]; then
            FORCE_ALL="true"
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$FORCE_ALL_INPUT" = "true" ] || [ -z "$FORCE_ALL_INPUT" ]; then
              FORCE_ALL="true"
            fi
          fi

          if [ "$FORCE_ALL" = "true" ]; then
            python3 scripts/ci/detect_changed_services.py --force-all
            exit 0
          fi

          BASE_SHA="$EVENT_BEFORE_SHA"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{0,40}$ ]]; then
            echo "Refusing to use non-hex BASE_SHA: $BASE_SHA"
            exit 1
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA; forcing full rebuild."
            python3 scripts/ci/detect_changed_services.py --force-all
            exit 0
          fi

          python3 scripts/ci/detect_changed_services.py --base "$BASE_SHA" --head HEAD

      - name: Summarise selection
        env:
          SERVICES_CSV: ${{ steps.detect.outputs.services_csv }}
          BUILD_ALL: ${{ steps.detect.outputs.build_all }}
        run: |
          {
            echo "## Selective image builds"
            echo ""
            echo "- build_all: \`${BUILD_ALL}\`"
            echo "- services: \`${SERVICES_CSV:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Run Tests
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio "black==24.10.0" flake8

      - name: Lint - black format check (changed files)
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$EVENT_BEFORE_SHA"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{0,40}$ ]]; then
            echo "Refusing to use non-hex BASE_SHA: $BASE_SHA"
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping black changed-file lint."
            exit 0
          fi

          # scripts/archive/** holds retired, unmaintained ad-hoc scripts
          # (see scripts/archive/README.md) -- excluded so moving legacy
          # code there doesn't force a behaviour-neutral reformat of code
          # nobody is meant to run or maintain.
          PY_CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- '*.py' ':(exclude)scripts/archive/**' || true)"
          if [ -z "$PY_CHANGED" ]; then
            echo "No Python file changes; skipping black."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              black --check --diff "$file"
            fi
          done <<< "$PY_CHANGED"

      - name: Atlas trace headers (every Class B+ source file)
        run: python3 scripts/atlas/check_atlas_trace_headers.py

      - name: Product id canonical (no drift to superseded Atlas id)
        run: python3 -m pytest tests/test_product_id_canonical.py -v

      - name: Router size guard (new routers, non-blocking)
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$EVENT_BEFORE_SHA"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{0,40}$ ]]; then
            echo "Refusing to use non-hex BASE_SHA: $BASE_SHA"
            exit 0
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi
          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping router size guard."
            exit 0
          fi
          python3 scripts/router_size_guard.py --changed-since "$BASE_SHA"

      - name: Lint - flake8
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$EVENT_BEFORE_SHA"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{0,40}$ ]]; then
            echo "Refusing to use non-hex BASE_SHA: $BASE_SHA"
            exit 1
          fi
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping flake8 changed-file lint."
            exit 0
          fi

          # scripts/archive/** holds retired, unmaintained ad-hoc scripts
          # (see scripts/archive/README.md) -- excluded for the same reason
          # as the black step above.
          PY_CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- '*.py' ':(exclude)scripts/archive/**' || true)"
          if [ -z "$PY_CHANGED" ]; then
            echo "No Python file changes; skipping flake8."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              flake8 --max-line-length=88 --extend-ignore=E203,W503,E501,E402 "$file"
            fi
          done <<< "$PY_CHANGED"

      # Dependency / CVE evidence is owned by Aikido (controlled SBOM and
      # vulnerability source per SVP-LEO-CDS-001). Do not reintroduce pip-audit
      # as a parallel CI CVE gate.

      - name: Runtime import boundary smoke test
        run: pytest tests/test_runtime_import_boundaries.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Selective-build detector unit tests
        run: pytest tests/test_detect_changed_services.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run tests (non-blocking)
        run: |
          set +e
          pytest tests/ -v --tb=short
          TEST_EXIT=$?
          echo "PYTEST_EXIT_CODE=$TEST_EXIT" >> "$GITHUB_ENV"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "Pytest failed with exit code $TEST_EXIT (non-blocking in CI)." >&2
          fi
          exit 0
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Publish test status summary
        if: always()
        run: |
          {
            echo "## Test job status"
            echo ""
            if [ "${PYTEST_EXIT_CODE:-0}" -eq 0 ]; then
              echo "- pytest: passed"
            else
              echo "- pytest: failed (non-blocking), exit code ${PYTEST_EXIT_CODE}"
              echo "- action: build/push continues"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ui-a11y:
    name: UI accessibility gate (VT-LEO-AI-113/114/115/116)
    needs: [test, detect-changes]
    if: needs.detect-changes.outputs.build_ui == 'true' || needs.detect-changes.outputs.build_all == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint - ESLint with jsx-a11y (changed files)
        run: |
          set +e
          npx eslint "src/**/*.{ts,tsx}" --max-warnings=0
          LINT_EXIT=$?
          if [ "$LINT_EXIT" -ne 0 ]; then
            echo "::warning::eslint jsx-a11y reported issues (non-blocking while codebase migrates)"
          fi
          exit 0

      - name: Jest - design tokens, density, a11y primitives, explanation patterns
        run: |
          npx jest \
            src/__tests__/theme-tokens.test.ts \
            src/__tests__/density-context.test.tsx \
            src/__tests__/confirmdialog-a11y.test.tsx \
            src/__tests__/statusdot-a11y.test.tsx \
            src/__tests__/explanation-patterns.test.tsx \
            --no-coverage --ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Playwright - a11y baseline (axe-core, non-blocking)
        run: |
          set +e
          npx playwright test e2e/a11y-baseline.spec.ts --reporter=line
          AXE_EXIT=$?
          if [ "$AXE_EXIT" -ne 0 ]; then
            echo "::warning::axe-core a11y baseline failed (non-blocking until VT-115 TC-006 is green)"
          fi
          exit 0

      - name: Playwright - surface form approval workflow (VT-8DE34E84)
        run: npx playwright test e2e/surface-forms-approval.spec.ts --project=chromium --reporter=line

  build-push:
    name: Build ${{ matrix.service }}
    needs: [test, detect-changes]
    if: needs.test.result == 'success' && needs.detect-changes.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Log in to Mizaic ACR
        env:
          MIZAIC_ACR_USERNAME: ${{ secrets.MIZAIC_ACR_USERNAME }}
          MIZAIC_ACR_PASSWORD: ${{ secrets.MIZAIC_ACR_PASSWORD }}
        run: |
          echo "$MIZAIC_ACR_PASSWORD" | docker login "$MIZAIC_ACR_NAME" \
            --username "$MIZAIC_ACR_USERNAME" --password-stdin

      - name: Resolve image tag
        id: image-tag
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/image_tag.py

      - name: Build and push
        env:
          SERVICE: ${{ matrix.service }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TAG: ${{ steps.image-tag.outputs.tag }}
          PUSH_LATEST: ${{ steps.image-tag.outputs.push_latest }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          IMAGE="${MIZAIC_ACR_NAME}/${SERVICE}"
          HF_BUILD_ARG=""
          if [ -n "$HF_TOKEN" ]; then
            HF_BUILD_ARG="--build-arg HF_TOKEN=${HF_TOKEN}"
          fi
          latest_args=()
          if [ "$PUSH_LATEST" = "true" ]; then
            latest_args+=(--tag "${IMAGE}:latest")
          fi
          build_ok=0
          for attempt in 1 2 3; do
            if docker build \
              --file "$DOCKERFILE" \
              --tag "${IMAGE}:${TAG}" \
              "${latest_args[@]}" \
              --cache-from "${IMAGE}:latest" \
              ${HF_BUILD_ARG} \
              .; then
              build_ok=1
              break
            fi
            echo "docker build failed (attempt ${attempt}/3); retrying in 20s"
            sleep 20
          done
          if [ "$build_ok" -ne 1 ]; then
            echo "docker build failed after 3 attempts"
            exit 1
          fi
          docker push "${IMAGE}:${TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker push "${IMAGE}:latest"
          fi

      - name: Output image digest
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' "${MIZAIC_ACR_NAME}/${SERVICE}:${TAG}"

  build-push-ui:
    name: Build ui
    needs: [test, detect-changes]
    if: needs.test.result == 'success' && needs.detect-changes.outputs.build_ui == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Log in to Mizaic ACR
        env:
          MIZAIC_ACR_USERNAME: ${{ secrets.MIZAIC_ACR_USERNAME }}
          MIZAIC_ACR_PASSWORD: ${{ secrets.MIZAIC_ACR_PASSWORD }}
        run: |
          echo "$MIZAIC_ACR_PASSWORD" | docker login "$MIZAIC_ACR_NAME" \
            --username "$MIZAIC_ACR_USERNAME" --password-stdin

      - name: Resolve image tag
        id: image-tag
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 scripts/ci/image_tag.py

      - name: Build and push
        env:
          TAG: ${{ steps.image-tag.outputs.tag }}
          PUSH_LATEST: ${{ steps.image-tag.outputs.push_latest }}
        run: |
          IMAGE="${MIZAIC_ACR_NAME}/ui"
          latest_args=()
          if [ "$PUSH_LATEST" = "true" ]; then
            latest_args+=(--tag "${IMAGE}:latest")
          fi
          docker build \
            --file infra/dockerfiles/Dockerfile.ui \
            --tag "${IMAGE}:${TAG}" \
            "${latest_args[@]}" \
            --cache-from "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${TAG}"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker push "${IMAGE}:latest"
          fi

      - name: Output image digest
        env:
          TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          docker inspect --format='{{index .RepoDigests 0}}' "${MIZAIC_ACR_NAME}/ui:${TAG}"

  publish-build-manifest:
    name: Publish build manifest
    needs: [detect-changes, build-push, build-push-ui]
    if: always() && needs.detect-changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Write manifest
        env:
          SERVICES_CSV: ${{ needs.detect-changes.outputs.services_csv }}
          BUILD_ALL: ${{ needs.detect-changes.outputs.build_all }}
          BUILD_UI: ${{ needs.detect-changes.outputs.build_ui }}
          HAS_BACKEND: ${{ needs.detect-changes.outputs.has_backend }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BACKEND_RESULT: ${{ needs.build-push.result }}
          UI_RESULT: ${{ needs.build-push-ui.result }}
        run: |
          set -euo pipefail
          # Fail the manifest job if a selected build failed.
          if [ "$HAS_BACKEND" = "true" ] && [ "$BACKEND_RESULT" != "success" ] && [ "$BACKEND_RESULT" != "skipped" ]; then
            echo "Backend image build failed: $BACKEND_RESULT"
            exit 1
          fi
          if [ "$HAS_BACKEND" = "true" ] && [ "$BACKEND_RESULT" = "skipped" ]; then
            echo "Backend builds were expected but skipped"
            exit 1
          fi
          if [ "$BUILD_UI" = "true" ] && [ "$UI_RESULT" != "success" ] && [ "$UI_RESULT" != "skipped" ]; then
            echo "UI image build failed: $UI_RESULT"
            exit 1
          fi
          if [ "$BUILD_UI" = "true" ] && [ "$UI_RESULT" = "skipped" ]; then
            echo "UI build was expected but skipped"
            exit 1
          fi
          python3 scripts/ci/write_build_manifest.py

      - name: Upload build manifest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4
        with:
          name: built-services
          path: dist/built-services.json
          if-no-files-found: error
