# -- DO-LEO-AI-090 -- Mission Control Frontend UI Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-090"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-092"]
    user_needs: ["UN-LEO-AI-058"]
    risks_addressed: ["R-LEO-AI-065"]
    verification_tests: ["VT-LEO-AI-092"]

  specification:
    title: "Clinical Audit Mission Control React UI"
    description: |
      Next.js / MUI frontend replacing /care/patients with Mission Control.
      Component tree:

      MissionControl (orchestrator, state, data fetching)
        CommandBar (date range, org scope, pathway filter, sub-filters,
                    review status, Go/Clear)
        KPIStrip (6 metric cards with colour thresholds)
        PatientCaseTable (server-paginated MUI Table)
          PatientCaseRow (single row, expandable)
            EpisodeTimeline (inline milestone track)
        PatientDetailDrawer (right Drawer, ~60% width, 4 tabs)
          OverviewTab (demographics, episode card, timeline, actions)
          CodedDataTab (SNOMED concept table)
          EncounterTextTab (raw text vs entity highlights)
          AuditTrailTab (review history)
          ReviewActionsPanel (mark reviewed, notes, flag, override)

      Supporting utilities:
        missionControlApi.ts   - fetch wrappers for all 3 endpoints
        missionControlFilters.ts - URL param <-> filter state serialisation
        pathwayLabels.ts       - plain English label mapping (single source
                                  of truth for status and cancer type display)

      The page entry at services/ui/src/app/care/patients/page.tsx imports
      MissionControl instead of PatientList.

      The audit page section components gain "View cases" buttons that
      navigate to /care/patients with URL params encoding the current
      date/org/cancer-type filter context.

    acceptance_criteria:
      - criterion: "Plain English labels"
        type: "usability"
        measurement: "Test"
        target: "pathwayLabels.ts EPISODE_STATUS_LABELS maps all 6 status values to plain English strings; no raw database values visible in rendered UI"
      - criterion: "Filter URL serialisation"
        type: "functional"
        measurement: "Test"
        target: "missionControlFilters.ts round-trips all filter fields via URLSearchParams without data loss"
      - criterion: "KPI colour thresholds"
        type: "functional"
        measurement: "Test"
        target: "Median diagnostic interval card renders green for <=28, amber for <=62, red for >62 days"
      - criterion: "Timeline rendering"
        type: "functional"
        measurement: "Test"
        target: "EpisodeTimeline renders one node per milestone; missing milestones render as hollow circles; interval labels show days between adjacent milestones"
      - criterion: "Review confirm guard"
        type: "safety"
        measurement: "Test"
        target: "Status override action renders ConfirmDialog before calling PATCH /status; PATCH is not called if user clicks Cancel"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/MissionControl.tsx"
        description: "Page orchestrator"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/CommandBar.tsx"
        description: "Filter bar"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/KPIStrip.tsx"
        description: "6 KPI metric cards"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/PatientCaseTable.tsx"
        description: "Server-paginated MUI Table"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/EpisodeTimeline.tsx"
        description: "Horizontal milestone track visualisation"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/PatientDetailDrawer.tsx"
        description: "Right drawer with 4 tabs"
      - artifact_type: "source_code"
        location: "services/ui/src/components/mission-control/ReviewActionsPanel.tsx"
        description: "Mark reviewed, notes, flag, status override"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/missionControlApi.ts"
        description: "API client fetch wrappers"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/missionControlFilters.ts"
        description: "URL param <-> filter state serialisation"
      - artifact_type: "source_code"
        location: "services/ui/src/lib/pathwayLabels.ts"
        description: "Single source of truth for plain English label mapping"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 1200
      key_functions:
        - "MissionControl"
        - "CommandBar"
        - "KPIStrip"
        - "PatientCaseTable"
        - "EpisodeTimeline"
        - "PatientDetailDrawer"
        - "ReviewActionsPanel"
        - "serialiseFilters"
        - "deserialiseFilters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Status override confirmation gate -- prevents accidental clinical status changes"
      - "Plain English label mapping -- prevents misinterpretation of pathway status"
    risk_control_measures:
      - "ConfirmDialog required before any status override API call"
      - "pathwayLabels.ts is single source of truth; raw status values never rendered directly"

  verification_status:
    verification_method: "Test"
    verification_complete: true
