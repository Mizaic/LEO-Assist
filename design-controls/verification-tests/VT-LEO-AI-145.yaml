# -- VT-LEO-AI-145 -- CRUD Knowledge tabs on @leo/design-system
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-145"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-147"]
    risks: ["R-LEO-AI-100"]

  metadata:
    title: "CRUD Knowledge tabs chrome + body redesign"
    description: >
      Verifies the four CRUD Knowledge pages (Context Rules, Surface
      Forms, Domains, Terminology) consume the @leo/design-system
      chrome primitives, that legacy page-owned chrome (Breadcrumbs,
      h5 page titles, "Domain Configuration" heading) is gone, that
      every existing data-loading and write handler is still wired,
      that ToolbarActions exposes a single primary action per page,
      and that each page renders the correct body primitive
      (ReviewListCard for Context Rules, FilterBar for Surface
      Forms toolbar, DomainCard grid for Domains, PackageCard +
      LogPanel for Terminology). The test does a static-source scan
      because each page is a Next.js route with its own data-loading
      lifecycle (Neo4j calls, EventSource streaming, etc.); a full
      render test is reserved for the Phase 7 Playwright sweep.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/crud-tabs-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node >= 20"
      - "npm install run in services/ui"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-145-TC-001a"
      case_name: "Context Rules imports the right design-system primitives"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read context-rules/page.tsx as text"
          expected_result: "Import block from @leo/design-system contains StatHero, SegmentedTabs, ToolbarActions, ReviewListCard, ProgressiveReveal"
      verification_method: "automated"
      acceptance_criteria:
        - "All five primitives imported from @leo/design-system"

    - case_id: "VT-145-TC-001b"
      case_name: "Surface Forms imports the right design-system primitives"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read surface-forms/page.tsx as text"
          expected_result: "Import block from @leo/design-system contains StatHero, FilterBar, ToolbarActions"
      verification_method: "automated"
      acceptance_criteria:
        - "All three primitives imported"

    - case_id: "VT-145-TC-001c"
      case_name: "Domains imports the right design-system primitives"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read domains/page.tsx as text"
          expected_result: "Import block from @leo/design-system contains StatHero, SegmentedTabs, ToolbarActions"
      verification_method: "automated"
      acceptance_criteria:
        - "All three primitives imported"

    - case_id: "VT-145-TC-001d"
      case_name: "Terminology imports the right design-system primitives"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read terminology/page.tsx as text"
          expected_result: "Import block from @leo/design-system contains StatHero, ToolbarActions"
      verification_method: "automated"
      acceptance_criteria:
        - "Both primitives imported"

    - case_id: "VT-145-TC-002a"
      case_name: "Context Rules removes legacy Breadcrumbs and h5 page title"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search context-rules/page.tsx source"
          expected_result: "No <Breadcrumbs and no h5 page title competing with the chrome"
      verification_method: "automated"
      acceptance_criteria:
        - "Legacy chrome removed"

    - case_id: "VT-145-TC-002b"
