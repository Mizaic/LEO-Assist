# -- DI-LEO-AI-088 -- Post-specialist outcome inference engine
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-088"
  type: "Functional"
  derived_from: ["UN-LEO-AI-055"]
  requirement: >
    The system SHALL implement a post-specialist outcome inference engine that,
    for every stale_post_specialist EpisodeOfCare node, scans encounters in the
    180-day window following the specialist_visit_date for textual signals that
    indicate a cancer or benign outcome, and writes the inferred_outcome,
    inferred_outcome_date (date of the earliest signal-firing encounter),
    inferred_confidence (0.0-0.95), and inference_signals (pipe-separated labels)
    onto the episode node. Where no signals are present the episode SHALL remain
    with inferred_outcome null and hitl_flag true.
  rationale: >
    stale_post_specialist episodes lack a coded diagnosis but frequently contain
    sufficient indirect evidence (Efudix prescriptions, discharge letters,
    pathology notes, excision bookings) to determine the clinical outcome. Storing
    the inferred result with a confidence score allows downstream analytics and UX
    to present provisional milestones while clearly distinguishing them from coded
    diagnoses.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Given a phase-2 window with benign-only signals, inferred_outcome = 'benign',
          inferred_confidence in [0.60, 0.95], inferred_outcome_date = earliest
          signal encounter date.
      - type: "functional"
        spec: >
          Given a phase-2 window with cancer-only signals, inferred_outcome = 'cancer',
          inferred_confidence in [0.60, 0.95], inferred_outcome_date = earliest
          signal encounter date.
      - type: "functional"
        spec: >
          Given a phase-2 window with mixed signals (cancer > benign),
          inferred_outcome = 'cancer', inferred_confidence <= 0.85.
      - type: "functional"
        spec: >
          Given an empty phase-2 window, inferred_outcome = null, hitl_flag = true.
      - type: "safety"
        spec: >
          The engine SHALL NOT overwrite a coded diagnosis (status = 'completed'
          with a diagnosis milestone encounter). It SHALL only process episodes
          with status = 'stale_post_specialist'.
    constraints:
      - type: "safety"
        spec: >
          inferred_confidence MUST NOT exceed 0.95. All inferred episodes MUST
          retain hitl_reason describing the inference basis. Benign inference MUST
          NOT change episode status - it remains stale_post_specialist to preserve
          audit trail.
    dependencies: ["DI-LEO-AI-087"]
    downstream_impacts:
      - "EpisodeOfCare node: four new properties written"
      - "benchmarks.py avg_days_to_diagnosis: inferred cancer date used as fallback"
      - "audit.py _q_intervals: di_days includes inferred cancer date with is_inferred flag"
      - "episode_timeline API: four new fields returned"
      - "UX: amber inferred badge and confidence % in EpisodeList, EpisodeTimelineView"
      - "UX: '(incl. N inferred)' note in KPICards"
      - "UX: amber ~ indicator in audit interval rows"

  technical_details:
    language: "Python"
    framework: "episode_builder / libs/pipeline"
    file_structure:
      - "libs/pipeline/outcome_inference.py"
      - "services/analysis_worker/app/analyzers/episode_builder.py"
      - "services/analytics_api/app/routers/benchmarks.py"
      - "services/analytics_api/app/routers/audit.py"
      - "services/analytics_api/app/routers/dashboards.py"
      - "services/ui/src/lib/analyticsApi.ts"
      - "services/ui/src/components/dashboard/KPICards.tsx"
      - "services/ui/src/components/episodes/EpisodeList.tsx"
    estimated_loc: 220

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 5 verdict branches produce correct inferred_outcome, inferred_confidence,
      and inferred_outcome_date. Analytics fallback Cypher tested. UX badge tested.
    test_protocol: "VT-LEO-AI-088"

  safety_class: "B"
  risks: ["R-LEO-AI-062"]
  tags:
    - "episode-inference"
    - "outcome-classification"
    - "analytics"
