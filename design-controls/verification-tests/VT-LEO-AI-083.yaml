- id: "VT-LEO-AI-083"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-083"]
    risks: ["R-LEO-AI-057"]

  metadata:
    title: "Unified Encounter Coding Agent verification"
    description: >
      Verifies that the encounter_coding_agent LangGraph subgraph enforces its
      tool-loop limits, produces backward-compatible audit verdicts, includes
      NER offsets, routes entities through run_post_processing(), and exposes
      working kill switches. Tests use mocked LLM and tool responses so no live
      Bedrock or Neo4j connection is required.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_coding_agent.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "pytest installed"
      - "langgraph installed"
      - "libs.pipeline_graph.subgraphs.encounter_coding_agent importable"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-083-TC-001"
      case_name: "load_encounter sets audit mode when coded_entities present"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call load_encounter with coded_entities=[{concept_id: '44054006', ...}]"
          expected_result: "Returned dict has mode='audit'"
          verification_method: "automated"
      acceptance_criteria:
        - "mode == 'audit' when coded_entities is non-empty"

    - case_id: "VT-083-TC-002"
      case_name: "load_encounter sets code mode when coded_entities empty"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call load_encounter with coded_entities=[]"
          expected_result: "Returned dict has mode='code'"
          verification_method: "automated"
      acceptance_criteria:
        - "mode == 'code' when coded_entities is empty or absent"

    - case_id: "VT-083-TC-003"
      case_name: "Tool iteration limit yields needs_review verdict"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Invoke agent with mocked LLM that always returns tool_uses (no submit_verdict) beyond MAX_ITERATIONS"
          expected_result: "Final verdict has encounter_assessment='needs_review' and confidence=0.0"
          verification_method: "automated"
      acceptance_criteria:
        - "needs_review verdict when tool_iterations >= MAX_ITERATIONS"
        - "No write-back occurs when verdict is needs_review"

    - case_id: "VT-083-TC-004"
      case_name: "Audit mode verdict has legacy keys"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Invoke agent in audit mode with mocked LLM returning submit_verdict with missing/overcoded/wrong_assertion"
          expected_result: "output['verdict'] has keys: missing, overcoded, wrong_assertion, encounter_assessment, confidence"
          verification_method: "automated"
      acceptance_criteria:
        - "All legacy audit verdict keys present"

    - case_id: "VT-083-TC-005"
      case_name: "Missing entity with sentence and offsets"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Agent returns missing entity with sentence, char_start, char_end in submit_verdict"
          expected_result: "post_process node preserves sentence, char_start, char_end in verdict"
          verification_method: "automated"
      acceptance_criteria:
        - "sentence, char_start, char_end present in each missing entity"

    - case_id: "VT-083-TC-006"
      case_name: "CODING_AGENT_ENABLED kill switch"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Set CODING_AGENT_ENABLED=false env var, call build_extractor()"
          expected_result: "Returns LLMExtractorProvider not AgentExtractorProvider"
          verification_method: "automated"
      acceptance_criteria:
        - "Kill switch routes to LLMExtractorProvider fallback"

    - case_id: "VT-083-TC-007"
      case_name: "Runtime AgentExtractorProvider apply=False"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Check AgentExtractorProvider.extract_batch always passes apply=False to subgraph.invoke"
          expected_result: "apply=False in all invocations"
          verification_method: "automated"
      acceptance_criteria:
        - "apply is never True in runtime AgentExtractorProvider invocations"

    - case_id: "VT-083-TC-008"
      case_name: "Unknown tool returns structured error"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inject tool_use with name='nonexistent_tool' into coder state"
          expected_result: "execute_tools returns {'ok': false, 'error': 'unknown_tool:nonexistent_tool'}"
          verification_method: "automated"
      acceptance_criteria:
        - "Unknown tool call returns ok=false error, does not crash"

    - case_id: "VT-083-TC-009"
      case_name: "post_process adds metadata block"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Invoke full agent with mocked submit_verdict response"
          expected_result: "verdict['metadata'] contains model_id, prompt_version, tool_iterations, token_usage"
          verification_method: "automated"
      acceptance_criteria:
        - "metadata block present with all required fields"

    - case_id: "VT-083-TC-010"
      case_name: "search_snomed tool returns candidates list"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call _tool_search_snomed({'query': 'type 2 diabetes'}) with mocked TerminologyClient"
          expected_result: "Returns {'ok': true, 'candidates': [...]} with up to 10 items"
          verification_method: "automated"
      acceptance_criteria:
        - "ok=true and candidates list returned for valid query"
        - "ok=false with error key returned for empty query"

  pass_fail_criteria:
    pass_threshold: "100% critical, 80% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-083/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-083-RUN-001"
      date: "2026-04-05"
      executed_by: "automated CI"
      environment: "development"
      result: "pass"
      notes: "12/12 test cases passed. pytest 8.3.5, Python 3.13.1."
      evidence_path: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-083/VT-083-RUN-001/"
