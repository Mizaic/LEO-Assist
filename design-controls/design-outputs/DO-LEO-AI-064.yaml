# -- DO-LEO-AI-064 -- LLM Rule Authoring with HITL Gate

- id: "DO-LEO-AI-064"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-064"]
    user_needs: ["UN-LEO-AI-028"]
    risks_addressed: ["R-LEO-AI-042", "R-LEO-AI-043"]
    verification_tests: ["VT-LEO-AI-064"]
    validation_tests: []

  specification:
    title: "LLM-Based AppropriatenessRule Authoring with HITL Review Queue"
    description: |
      Two-file implementation: GuidanceRuleGenerator uses the existing
      run_consensus() dual-model pipeline to generate AppropriatenessRule candidates
      from Recommendation nodes, SNOMED-codes each criterion via the terminology API,
      and writes draft rules (status: pending_review) to Neo4j with associated HITL
      ReviewTask nodes. FastAPI router exposes fire-and-track generation, list/detail/
      decision review endpoints. All LLM call sites comply with llm-security.mdc.
    purpose: "Automatically generate auditable clinical decision rules from NICE guidance text"
    technical_approach: "run_consensus + escalate_coding_from_candidates + Neo4j MERGE + HITL queue"
    acceptance_criteria:
      - criterion: "LLM security compliance"
        type: "safety"
        measurement: "Test"
        target: "INJECTION_GUARD present in all system prompts; sanitise_for_prompt called on all clinical text"
      - criterion: "Conservative fail"
        type: "safety"
        measurement: "Test"
        target: "No rule node written when consensus returns fail_verdict (None)"
      - criterion: "HITL gate"
        type: "functional"
        measurement: "Test"
        target: "Rules start with status: pending_review; only active rules visible to bitmap compiler"
      - criterion: "Audit trail"
        type: "functional"
        measurement: "Test"
        target: "Every approve/reject decision creates immutable audit event with reviewer email"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/services/guidance_rule_generator.py"
        description: "GuidanceRuleGenerator: consensus-based rule generation + SNOMED coding"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/guidance_rules.py"
        description: "FastAPI router: generate, list, detail, decide, approve-all endpoints"
        storage_location: "git"
      - artifact_type: "test"
        location: "services/api/tests/test_guidance_rule_generator.py"
        description: "Pytest unit tests for GuidanceRuleGenerator"
        storage_location: "git"

    technical_details:
      language: ["Python"]
      framework: ["FastAPI", "neo4j", "libs/llm_client"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "fail_verdict = None -- no rule written from failed LLM response"
      - "HITL gate -- status: pending_review enforced at write time"
      - "Immutable audit trail for all human decisions"

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "No new Key Vault secrets required -- uses existing AWS Bedrock and Azure OpenAI credentials."

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-08"

  version_history:
    - version: "1.0.0"
      date: "2026-03-08"
      changes: "Initial implementation"
      reason: "New capability -- LLM rule authoring"
      author: "Engineering Team"
      approval_status: "draft"

  metadata:
    tags: ["llm", "hitl", "rule-authoring", "consensus", "snomed", "guidelines"]
    priority: "high"
    complexity: "complex"
