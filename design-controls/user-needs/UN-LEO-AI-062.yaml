# -- UN-LEO-AI-062 -- Ontology-grounded relation training and review
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-062"
  title: "Clinical reviewers need ontology-grounded relation linking so findings can be safely connected to body sites, disorders, observations, and procedures"
  description: |
    Reviewers need to link extracted entities using SNOMED-backed relationship
    rules. The current body-site shortcut does not support multi-site links or
    broader clinical relations such as finding to disorder and finding to
    observable interpretation.

    The platform must support:
    - one source term linked to multiple target body sites
    - relation recommendations ranked by confidence
    - plain-language accept, reject, and undo actions
    - persisted relation tuples that can train and evaluate a relation model

  stakeholder:
    type: "end_user"
    role: "Clinical Informatician / Gold Dataset Reviewer"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    If relations are not represented explicitly, negation and clinical meaning
    can be applied to the wrong concept. This can lead to incorrect SNOMED
    coding and unsafe pathway analytics. Ontology-grounded relation typing and
    review controls reduce this risk and improve model training quality.

  acceptance_criteria:
    - "Gold labels persist canonical relations as (type, target_idx, confidence) tuples"
    - "One finding can link to more than one body site"
    - "UI shows SNOMED-policy recommendations and supports accept, reject, and undo"
    - "Runtime relation linking uses model-first predictions and LLM fallback for low-confidence cases"
    - "Relation export, training, and evaluation produce per-type metrics and quality gates"

  regulatory_impact: "medium"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-04-14"
    status: "draft"

  design_inputs: ["DI-LEO-AI-108"]
  validation_tests: []

  tags: ["relations", "snomed", "gold-review", "training", "pipeline"]
