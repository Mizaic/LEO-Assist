# -- DI-LEO-AI-125 -- NCDA interval KPIs persisted on EpisodeOfCare
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-125"
  type: "Functional"
  derived_from: ["UN-LEO-AI-008"]
  requirement: >
    The episode builder pipeline SHALL compute and persist the four NCDA
    interval KPIs (days_presentation_to_referral, consultations_before_referral,
    days_referral_to_diagnosis, days_diagnosis_to_treatment) as named
    properties on every EpisodeOfCare node that has the prerequisite
    milestones. KPI computation SHALL execute automatically as part of
    build_episodes() and the /episodes/rebuild endpoint without a separate
    invocation. Downstream analytics routers SHALL read these persisted
    properties rather than recomputing intervals from milestone edges so
    every dashboard reports the same number for the same episode.
  rationale: >
    NCDA audit KPIs were previously computed ad-hoc inside each analytics
    router, reading milestone edges directly. That produced inconsistent
    numbers across pathway, operations and coding dashboards when any
    router applied a different tie-break, unit or filter. Persisting the
    four canonical intervals on the EpisodeOfCare node itself creates a
    single source of truth and eliminates the drift.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          calculate_kpis(patient_id, episode_ids, patient_client) is
          invoked from build_episodes after outcome inference and
          sets each of the four KPI properties on the EpisodeOfCare
          node when the prerequisite milestones exist.
      - type: "functional"
        spec: >
          KPI keys recognised include both canonical milestone types
          (diagnosis_confirmed, treatment_started) and legacy aliases
          (diagnosis, treatment) for backward compatibility.
      - type: "safety"
        spec: >
          The Cypher writeback uses MATCH (not MERGE) so KPI
          calculation cannot create orphan EpisodeOfCare nodes.
    constraints:
      - type: "performance"
        spec: >
          calculate_kpis MUST be idempotent: running it twice on the
          same episode_id set produces identical property values.
    dependencies: []
    downstream_impacts:
      - "services/analysis_worker/app/analyzers/kpi_calculator.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
      - "services/analytics_api/app/routers/dashboards.py"
    technical_details:
      language: "Python"
      framework: "FastAPI + Neo4j async driver"
      file_structure:
        - "services/analysis_worker/app/analyzers/kpi_calculator.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
      estimated_loc: 40

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-120 cases pass: KPIs persisted for complete
      milestone sets, skipped cleanly for missing milestones,
      idempotent on re-run, invoked from build_episodes, and the
      MATCH guard prevents orphan-node creation on unknown ids.

    test_protocol: "VT-LEO-AI-120"

  safety_class: "B"
  risks: ["R-LEO-AI-085"]
  tags:
    - "analytics"
    - "episode-of-care"
    - "ncda"
    - "kpi"
