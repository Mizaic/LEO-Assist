# -- VT-LEO-AI-150 -- Clinical Guidelines orchestrator chrome
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-150"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-152"]
    risks: ["R-LEO-AI-104"]

  metadata:
    title: "Clinical Guidelines redesigned on @leo/design-system"
    description: >
      Verifies the Clinical Guidelines orchestrator
      (services/ui/src/app/admin/guidance/page.tsx) consumes the
      shared design-system chrome (SegmentedTabs sticky jump strip,
      framer-motion StepCard sections); that the legacy heavy
      4px-accent Card / SectionBox chrome is gone; that all four
      child sections (NiceLoaderSection, LoadedGuidelinesPanel,
      RuleReviewSection, BitmapLifecycleSection) are still mounted
      with their existing prop contract; that both refresh-key
      bridges (loadedRefreshKey + ruleRefreshKey) survive intact;
      and that the sticky jump strip exposes the three workflow
      steps with the design-system SegmentedTabs API.

      The test does a deterministic static-source scan because the
      page hits live NICE / API endpoints on mount, which makes a
      unit-scoped live render fragile. A live render is reserved
      for the Phase 7 Playwright sweep.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/guidance-page-chrome.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node >= 20"
      - "npm install run in services/ui"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-150-TC-001"
      case_name: "Imports design-system SegmentedTabs primitive"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read guidance/page.tsx and inspect the @leo/design-system import"
          expected_result: >
            SegmentedTabs imported from @leo/design-system.
      verification_method: "automated"
      acceptance_criteria:
        - "Design-system primitive is wired"

    - case_id: "VT-150-TC-002"
      case_name: "Imports motion from framer-motion for stagger entry"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for the framer-motion import"
          expected_result: >
            motion (aliased as fm) imported from framer-motion.
      verification_method: "automated"
      acceptance_criteria:
        - "Motion is wired"

    - case_id: "VT-150-TC-003"
      case_name: "Removes legacy heavy 4px-accent Card chrome"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for legacy chrome markers"
          expected_result: >
            No 'borderLeft: \"4px solid'; no 'import Card'; no
            CardContent imports; no SectionBox helper.
      verification_method: "automated"
      acceptance_criteria:
        - "Legacy chrome is fully replaced"

    - case_id: "VT-150-TC-004"
      case_name: "Each StepCard uses 12px radius and 3px tone-coded accent strip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect StepCard implementation"
          expected_result: >
            borderRadius: 12 and a 3px-wide left accent strip with
            background: accent are present in StepCard.
      verification_method: "automated"
      acceptance_criteria:
        - "StepCard token alignment matches the canonical pattern"

    - case_id: "VT-150-TC-005"
      case_name: "Preserves all four child sections"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for child-section JSX usage"
          expected_result: >
            <NiceLoaderSection>, <LoadedGuidelinesPanel>,
            <RuleReviewSection>, <BitmapLifecycleSection> all
            present.
      verification_method: "automated"
      acceptance_criteria:
        - "No child section is dropped during the redesign"

    - case_id: "VT-150-TC-006"
      case_name: "Preserves both refresh-key state bridges between sections"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for refresh-key bumps + props"
          expected_result: >
            setLoadedRefreshKey((n) => n + 1) bumps loaded counter;
            setRuleRefreshKey((n) => n + 1) bumps rule counter;
            refreshKey={loadedRefreshKey} threaded into
            LoadedGuidelinesPanel; refreshKey={ruleRefreshKey}
            threaded into RuleReviewSection.
      verification_method: "automated"
      acceptance_criteria:
        - "Both refresh-key bridges survive the redesign (R-104 mitigation)"

    - case_id: "VT-150-TC-007"
      case_name: "Provides a sticky workflow jump strip with three steps"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for the jump strip + tab definitions"
          expected_result: >
            data-testid='guidance-jump-strip' present; sticky top:
            0 styling present; STEP_TABS contains entries with
            id 'load', 'review', 'compile'.
      verification_method: "automated"
      acceptance_criteria:
        - "Sticky three-step strip is reachable from anywhere on the page"

    - case_id: "VT-150-TC-008"
      case_name: "SegmentedTabs uses the correct tabs/value/aria-label API"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Extract <SegmentedTabs ... /> tag and inspect props"
          expected_result: >
            tabs={...}, value={activeStep}, onChange={handleJump},
            aria-label='Jump to guidance workflow step' all
            present; legacy items / activeId props absent.
      verification_method: "automated"
      acceptance_criteria:
        - "API matches DI-152 AC-005"

    - case_id: "VT-150-TC-009"
      case_name: "ID and structure matches the three-step workflow"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Search guidance/page.tsx for StepCard ids + step pip styling"
          expected_result: >
            StepCard ids 'nice-loader', 'loaded-guidelines',
            'rule-review', 'bitmap-lifecycle' all present;
            step prop values {1}, {2}, {3} all wired.
      verification_method: "automated"
      acceptance_criteria:
        - "Numbered pips give reviewers a clear sense of place"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-150/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-16"
      executed_by: "Wave E Phase 5 automation"
      result: "pass"
      notes: "All 9 test cases pass under jest 30; 0 failures."
