# -- R-LEO-AI-507 -- Edited per-context snippet omits safety-critical framing
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-507"
  title: "An admin edits a SummarisationContext snippet in /admin/knowledge?tab=ai-instructions and removes safety-critical framing (e.g. 2WW pathway action), causing the SBAR Situation to omit information the receiving clinician relies on"

  hazard:
    description: >
      The per-context snippets are now editable PromptConfig rows.
      An admin (with no clinical sign-off) could remove or alter
      the framing for a high-stakes context (suspected cancer
      2WW, ED handover, palliative care MDT) in a way that drops
      a safety-critical instruction. The SBAR Situation prompt
      would then no longer emphasise the action the receiving
      clinician needs.
    category: "use_error"

  hazardous_situation: >
    A platform admin opens the AI Instructions list, edits the
    `sbar_situation_context_two_week_wait` PromptConfig and removes
    the phrase asking the LLM to surface what the receiving team
    needs to action. A clinician then runs an SBAR for a 2WW
    referral and the Situation reads as a generic case description.
    The receiving clinician misses the urgency cue.

  harm:
    description: >
      Delayed action on a suspected cancer referral (or other
      time-critical pathway), increasing the risk of late
      diagnosis. Severity is serious -- delayed cancer diagnosis
      is a recognised patient-harm pathway in NICE NG12.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        The hardcoded SUMMARISATION_CONTEXT_PROMPTS dict in
        libs/sbar/events.py is the authoritative seed and the
        runtime fallback. If the admin-edited PromptConfig row is
        removed (deleted) or unreachable, the resolver falls back
        to the dict so the Situation prompt is never unframed.
      implemented_by: ["DI-LEO-AI-507"]
      verified_by: ["VT-LEO-AI-509"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        PromptConfig edit and create routes require platform admin
        role (existing guard on /api/prompts CRUD). No clinical
        user can mutate the snippets, and edits are attributed to
        the editor's session in the audit trail.
      implemented_by: ["DI-LEO-AI-148", "DI-LEO-AI-507"]
      verified_by: ["VT-LEO-AI-509"]
      effectiveness: "effective"
    - control_type: "information_for_safety"
      description: >
        The base SBAR Situation prompt (`sbar_situation` v2) carries
        the INJECTION_GUARD prefix and the Wave-D Situation contract
        (2-3 sentences, citations array, no fabricated content). Even
        if a per-context snippet is degraded, the base prompt still
        constrains the output shape and prevents free-form
        instruction injection from the snippet.
      implemented_by: ["DI-LEO-AI-194"]
      verified_by: ["VT-LEO-AI-188"]
      effectiveness: "partially_effective"
    - control_type: "procedural_control"
      description: >
        QA / clinical-lead sign-off is required on snippet wording
        changes for high-stakes contexts (2WW, ED handover, PCMDT,
        SACT consent, MHA tribunal). This is a documented runbook
        step rather than a code-enforced gate.
      implemented_by: ["DI-LEO-AI-507"]
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The dict fallback covers deletion / outage. INJECTION_GUARD
      and the base Situation prompt cover instruction injection.
      Admin-only edit and audited writes cover unauthorised change.
      The remaining gap (an admin who deliberately replaces the
      snippet with weaker wording, with no clinical sign-off) is
      addressed procedurally rather than technically; this is
      consistent with how every other PromptConfig is managed
      today and is in line with the platform-admin trust model.

  monitoring:
    monitoring_plan: >
      VT-LEO-AI-509 enforces the seed parity, the Neo4j-first
      lookup, the dict fallback and the categoriser change on every
      release. PromptConfig edits are visible in the Neo4j audit
      trail (updated_at + source='user'). Cost-panel telemetry
      surfaces per-context spend changes that often correlate with
      wording changes.
    metrics:
      - "VT-LEO-AI-509 status (must be 'pass' on every release)"
      - "Count of sbar_situation_context_* PromptConfigs in Neo4j (must equal len(SummarisationContext) at all times)"
      - "PromptConfig edit events for high-stakes contexts (reviewed monthly with QA)"
    review_frequency: "Per release + monthly QA review"

  metadata:
    identified_by: "Conversation 2026-04-19 (per-context snippet editability)"
    identified_date: "2026-04-19"
    status: "mitigated"
    tags:
      - "sbar"
      - "ai-instructions"
      - "summarisation-context"
      - "admin"
