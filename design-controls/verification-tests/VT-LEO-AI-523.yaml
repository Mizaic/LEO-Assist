# -- VT-LEO-AI-523 -- Episode Engine Window Partitioner + deterministic merge
# IEC 62304 OQ verification

- id: "VT-LEO-AI-523"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-525"]
    risks:
      - "R-LEO-AI-513"

  metadata:
    title: "Episode Engine Window Partitioner -- bin-pack, intra-encounter split, deterministic merge, overflow refusal"
    description: >
      Verifies the focused-window partitioner that sits between the
      Audit Relevance Filter and the milestone extractor. Covers the
      single-partition common case (legacy pass-through), multi-part
      bin-packing without dropping any focused encounter, intra-
      encounter splitting for an oversized record (with
      part_in_encounter metadata), the too_many_parts refusal, the
      deterministic Python merge of MilestoneExtractorResult across
      parts, and the chain-level rewiring that calls the extractor
      once per partition and then merges without a second LLM call.
      The no-encounter-dropped invariant and the byte-identical
      single-partition pass-through are the two headline safety
      properties.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/episode_engine/test_window_partitioner.py"
      - "tests/episode_engine/test_chain.py"
      - "tests/episode_engine/test_milestone_extractor_agent.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "FakeLLM stub from tests/episode_engine/conftest.py"
      - "EPISODE_ENGINE_MAX_INPUT_TOKENS env var honoured by window_partitioner"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-523-TC-001"
      case_name: "Single-partition: focused set fits one part"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call partition_window with 5 small focused encounters and the default budget"
          expected_result: "Returns exactly one Partition containing all 5 encounter_ids in chronological order, PartitionReport.too_many_parts=False"
          verification_method: "automated"
      acceptance_criteria:
        - "Common case fits in one Bedrock call"
        - "No part-in-encounter metadata when no record needed splitting"

    - case_id: "VT-523-TC-002"
      case_name: "Multi-part packing preserves every focused encounter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call partition_window with 20 focused encounters and a coerced small per-part budget so 3-4 partitions are required"
          expected_result: "Every input encounter_id appears in exactly one Partition; partitions are bin-packed greedily; PartitionReport.parts == returned partition count"
          verification_method: "automated"
      acceptance_criteria:
        - "No-encounter-dropped invariant"
        - "Greedy bin-packing produces the smallest N <= 8 that fits"

    - case_id: "VT-523-TC-003"
      case_name: "Intra-encounter split for an oversized record records part_in_encounter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call partition_window with one 4000-char focused encounter and a per-part budget that forces a split"
          expected_result: "Encounter is split into N >= 2 slices, each tagged part_in_encounter='1/N', '2/N', ...; concatenated slice text equals the original normalised text"
          verification_method: "automated"
      acceptance_criteria:
        - "Oversized records are split, never dropped"
        - "Reviewer can see the part-in-encounter provenance"

    - case_id: "VT-523-TC-004"
      case_name: "too_many_parts refusal returns empty partitions and a friendly notice"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call partition_window with content that would require > 8 partitions"
          expected_result: "Returns partitions=[] and PartitionReport with too_many_parts=True and a plain-English notice (reading age 9-11)"
          verification_method: "automated"
      acceptance_criteria:
        - "Hard cap of 8 partitions per window is enforced"
        - "Refusal notice is patient-readable"

    - case_id: "VT-523-TC-005"
      case_name: "Empty focused set returns one empty partition"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call partition_window with an empty FocusedSet"
          expected_result: "Returns exactly one empty Partition, PartitionReport.parts=1, too_many_parts=False"
          verification_method: "automated"
      acceptance_criteria:
        - "No-encounter-dropped invariant trivially holds for empty input"

    - case_id: "VT-523-TC-006"
      case_name: "Merge dedups milestones on (type, date, encounter_id) keeping highest confidence and longest evidence_quote"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call merge_milestones_deterministic with two MilestoneExtractorResult parts that contain the same milestone with different confidence and quote length"
          expected_result: "Merged result keeps the highest-confidence instance; ties are broken by longest evidence_quote"
          verification_method: "automated"
      acceptance_criteria:
        - "No duplicate milestones across parts"
        - "Best-evidence rule is applied"

    - case_id: "VT-523-TC-007"
      case_name: "Merge unions safety_netting flags and concatenates disruptions with the same dedup rule"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call merge_milestones_deterministic with two parts that disagree on safety_netting and contribute overlapping disruptions"
          expected_result: "Merged safety_netting is the boolean OR; merged disruptions are the de-duplicated union on (kind, encounter_id)"
          verification_method: "automated"
      acceptance_criteria:
        - "Safety-netting evidence from any part survives the merge"
        - "Disruption duplicates are collapsed"

    - case_id: "VT-523-TC-008"
      case_name: "Single-part merge is a legacy pass-through"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call merge_milestones_deterministic with exactly one MilestoneExtractorResult"
          expected_result: "Returned object is byte-identical to the input"
          verification_method: "automated"
      acceptance_criteria:
        - "No part-merge prefixes leak into the common case"

    - case_id: "VT-523-TC-009"
      case_name: "Merge with no parts returns an empty MilestoneExtractorResult"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call merge_milestones_deterministic with an empty list"
          expected_result: "Returns MilestoneExtractorResult with milestones=[] and needs_human_review=true"
          verification_method: "automated"
      acceptance_criteria:
        - "Edge case is safe"

    - case_id: "VT-523-TC-010"
      case_name: "Chain single-partition: extractor invoked once with no part headings"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Drive _node_milestone_extractor with a focused set that fits one partition and a FakeLLM"
          expected_result: "FakeLLM.calls has length 1; user message contains no 'Part X of N' heading"
          verification_method: "automated"
      acceptance_criteria:
        - "Common-case prompt is byte-identical to the legacy single-call extractor"

    - case_id: "VT-523-TC-011"
      case_name: "Chain multi-partition: extractor invoked once per partition then deterministic merge"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Drive _node_milestone_extractor with 20 focused encounters and EPISODE_ENGINE_MAX_INPUT_TOKENS coerced low to force 3-4 partitions"
          expected_result: "FakeLLM.calls has length >= 2; merged MilestoneExtractorResult contains contributions from every partition"
          verification_method: "automated"
      acceptance_criteria:
        - "One Bedrock call per partition"
        - "Deterministic merge runs after the last partition"

    - case_id: "VT-523-TC-012"
      case_name: "Chain per-part failure containment: surviving parts contribute, error recorded on EoC trace"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Drive _node_milestone_extractor across two partitions where the second LLM response has no toolUse"
          expected_result: "Surviving part still contributes its milestones; failed part records needs_human_review=true and a structured error in PartTrace; merged result has needs_human_review=true overall"
          verification_method: "automated"
      acceptance_criteria:
        - "One bad partition does not poison the whole window"

    - case_id: "VT-523-TC-013"
      case_name: "Chain too_many_parts refusal: zero extractor invocations, EoC flagged"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Drive _node_milestone_extractor with content that triggers too_many_parts=True from the partitioner"
          expected_result: "FakeLLM.calls is empty; EpisodeOfCareTrace records audit_filter_overflow=true and needs_human_review=true"
          verification_method: "automated"
      acceptance_criteria:
        - "Hard cap is enforced at the chain level too"

    - case_id: "VT-523-TC-014"
      case_name: "Milestone extractor runs unchanged inside the partitioner pass-through (single partition)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run milestone_extractor.run with a per-encounter formatted body identical to the chain's pass-through"
          expected_result: "Parsed result is byte-identical to a direct extractor call; no per-part heading on the user message"
          verification_method: "automated"
      acceptance_criteria:
        - "Regression for the focus + partition wiring"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-523/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-523-RUN-001"
      executed_at: "2026-04-19T00:00:00Z"
      executor: "automated"
      result: "pass"
      notes: "14/14 cases pass via `pytest tests/episode_engine/test_window_partitioner.py tests/episode_engine/test_chain.py tests/episode_engine/test_milestone_extractor_agent.py -v` (9 + 5 + extractor pass-through). Single-partition pass-through, multi-part bin-packing, intra-encounter split with part_in_encounter, too_many_parts refusal, empty focused set, milestone dedup with highest confidence + longest quote, safety-netting union, disruption dedup, single-part legacy merge, empty merge, chain single-call common case, chain multi-call per-part, per-part failure containment, and chain overflow refusal all confirmed."
