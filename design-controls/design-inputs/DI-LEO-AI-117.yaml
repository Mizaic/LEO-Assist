# -- DI-LEO-AI-117 -- Terminology hybrid retrieval: vector branch threshold
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-117"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The coding resolver hybrid retrieval (DI-LEO-AI-004) SHALL skip the
    vector-similarity branch for a query term only when the top lexical
    candidate's composite score is at or above a configurable strong
    threshold (default 0.70, overridable via the
    ``TERMINOLOGY_VECTOR_SKIP_SCORE`` environment variable). When the top
    lexical score is below this threshold -- or when no lexical candidates
    were returned -- the vector branch SHALL run so a semantically-related
    concept can still be surfaced.
  rationale: >
    The previous implementation skipped the vector branch whenever ANY
    lexical candidate existed, regardless of its score. For multi-token
    phrases that matched a single common word at very low composite
    score (e.g. "cough" lexically matching only the word "cough" inside
    a longer target phrase), this suppressed vector-retrieval which
    would otherwise have returned the correct multi-word concept. The
    threshold ensures vector retrieval still contributes when lexical
    evidence is weak, while preserving the cost savings for the common
    case where an exact or full-text hit is already strong.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          When the top lexical candidate score is 0.9, the vector branch
          is skipped (single-term and batch paths).
      - type: "functional"
        spec: >
          When the top lexical candidate score is 0.55, the vector branch
          runs and its candidates are merged into the output.
      - type: "functional"
        spec: >
          When no lexical candidates exist (lexical search empty), the
          vector branch runs.
      - type: "functional"
        spec: >
          TERMINOLOGY_VECTOR_SKIP_SCORE=0.85 raises the skip bar to 0.85:
          a lexical top of 0.80 now triggers vector retrieval.
      - type: "functional"
        spec: >
          TERMINOLOGY_ENABLE_VECTOR=false disables vector retrieval
          globally, overriding this threshold logic.
    constraints:
      - type: "performance"
        spec: >
          The threshold MUST NOT change overall single-entity resolution
          latency beyond the <= 500 ms budget from DI-LEO-AI-004.
    dependencies: ["DI-LEO-AI-004"]
    downstream_impacts:
      - "services/terminology_api/app/services/coding_resolver.py (single and batch paths)"
    technical_details:
      language: "Python"
      framework: "FastAPI"
      file_structure:
        - "services/terminology_api/app/services/coding_resolver.py"
      estimated_loc: 40

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-116 cases pass: strong lexical skips vector, weak
      lexical triggers vector, no-lexical triggers vector, env-var
      override respected, global disable still wins.
    test_protocol: "VT-LEO-AI-116"

  safety_class: "A"
  risks: []
  tags:
    - "terminology"
    - "hybrid-search"
    - "vector-retrieval"
