# -- R-LEO-AI-191 -- Phantom first_seen anchor from narrative 2WW mention
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-191"
  title: "Narrative reference to '2WW clinic' fires phantom first_seen anchor and rescues open referrals to false 'completed' status"

  hazard:
    description: >
      The text-anchor classifier may emit a first_seen
      milestone for any encounter mentioning '2WW clinic',
      including narratives describing why the patient never
      attended ("referred to 2WW clinic but not attended due
      to mobility issues"). The episode rescue path then
      promotes the open referral to status='completed' with
      end_date = the narrative encounter date, mass-claiming
      downstream encounters into the wrong episode.
    category: "clinical_safety"

  hazardous_situation: >
    A clinical reviewer using the operations queue sees an
    EpisodeOfCare flagged as 'completed' for a patient
    whose 2WW pathway was actually blocked. Avoidable-delay
    investigation cannot find the case, so the patient is
    left in pathway limbo while the cohort metrics
    underreport the failure rate.

  harm:
    description: >
      Missed avoidable-delay escalation; phantom 'completed'
      episode masks a 10+ month treatment delay and may
      delay diagnosis of a serious cancer.
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 3
    detectability: 4
    rpn: 48
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-201: tighten _RE_FIRST_SEEN so every
        alternation requires an attestation verb (seen,
        attended, reviewed) within proximity of the clinic
        token. Narrative references no longer match.
      implemented_by:
        - "DI-LEO-AI-201"
      verified_by:
        - "VT-LEO-AI-194"
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-204: care_obstruction anchor surfaces the
        DNA / obstruction signal as a first-class HITL flag
        on the affected episode so the operations queue
        catches the case even if the rescue path were to
        regress.
      implemented_by:
        - "DI-LEO-AI-204"
      verified_by:
        - "VT-LEO-AI-198"
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 4
    probability: 1
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Post-fix the regex requires an attestation verb so the
      previously-observed false positives no longer match.
      Unit tests (VT-LEO-AI-194) cover the patient
      4643293950 narrative regression cases plus three
      positive attestation patterns. The care_obstruction
      anchor (DI-LEO-AI-204) provides a defence-in-depth
      HITL flag so even an undetected regression would
      surface the obstruction for review.

  monitoring:
    monitoring_plan: >
      Track the count of first_seen anchors per cohort run.
      Investigate any rebuild that produces a >10% jump in
      first_seen anchors versus the baseline.
    metrics:
      - "first_seen anchors per 1000 encounters per rebuild"
      - "EpisodeOfCare 'completed' transitions whose end_date is anchored on a first_seen-only encounter"
    review_frequency: "Each rebuild"

  metadata:
    identified_by: "Patient 4643293950 investigation -- Pattern B (Nov 2024 home visit narrative fired phantom first_seen on a DNA encounter, rescuing the open Jan 2024 referral to 'completed')"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "anchor-detector"
      - "first-seen"
      - "patient-4643293950"
