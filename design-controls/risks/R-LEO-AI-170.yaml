# -- R-LEO-AI-170 -- Missed cancer or wrong-site classification via problem-list line / active-care code
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-170"
  title: "Missed cancer or wrong-site classification despite problem-list malignancy term, active-care code, or site reconciliation"

  hazard:
    description: >
      The problem-list malignancy term path (DI-LEO-AI-171) and the
      site-reconciliation block (DI-LEO-AI-173) extend the surface
      area for inferring confirmed cancers from GP free text and
      Read codes. A regex that is too narrow (or a code missing from
      ACTIVE_CANCER_CARE_CODES) will continue to silently file a
      confirmed cancer as closed_benign; conversely a regex that is
      too broad will mis-promote a survivor or a routine review.
      The site-reconciliation block can also adopt a wrong site_key
      if the diagnosis anchor itself was mis-coded (e.g. a wrong-
      patient paste).
    category: "clinical_safety"

  hazardous_situation: >
    A clinician triages the cancer-audit dashboard and either (a) does
    not see a confirmed cancer that should be there because the
    GP's free-text problem line uses a phrasing not yet in
    MALIGNANCY_TERM_PATTERNS, or (b) sees a fresh confirmed cancer for
    a survivor whose H/O code was missed by the guard, or (c) sees a
    cancer correctly identified but filed under the wrong NCDA site
    because the diagnosis anchor that drove site reconciliation
    contained a coding error.

  harm:
    description: >
      Delayed clinical follow-up for a real cancer pathway; false
      reassurance for a survivor; or wrong-pathway audit metrics
      that under- or over-count specific NCDA sites. All harms are
      recoverable via the HITL queue (every term/active-care/
      reconciliation decision carries hitl_required=True), but the
      cancer-audit dashboard is the canonical surface for management
      decisions so an undetected miss is meaningful.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        History-of-cancer guard runs BEFORE any diagnosis emission,
        evaluated against both Read codes (HISTORY_OF_CANCER_CODE_PREFIXES)
        and free-text markers ("H/O cancer", "history of cancer",
        "personal history of malignant neoplasm"). Cannot be bypassed
        by a co-occurring malignancy term, malignancy code, or
        active-care code.
      implemented_by: ["DI-LEO-AI-171"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Every diagnosis anchor produced by the new term/active-care/
        reconciliation paths sets hitl_required=True (or
        hitl_flag=True at episode level) so a human reviewer
        adjudicates before the dashboard is treated as authoritative.
      implemented_by: ["DI-LEO-AI-171", "DI-LEO-AI-173"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        MALIGNANCY_TERM_PATTERNS only fires on lines that begin with a
        problem-list prefix (Major:, Problem:, Active Problem: etc.).
        This guards against firing on free-prose discussion of cancer
        in clinic letters or referral text. ACTIVE_CANCER_CARE_CODES
        is a small, hand-curated set of unambiguous activity codes;
        no inference codes (e.g. "Refer for cancer screening").
      implemented_by: ["DI-LEO-AI-171"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Quarterly clinical audit samples 50 episodes per channel
        (term, active-care, reconciliation) and checks against the
        source encounter text. Inventory updates feed back through
        DI-LEO-AI-171 amendments. The dashboard surfaces all
        hitl_required diagnoses as a dedicated review queue.
      implemented_by: ["DI-LEO-AI-171", "DI-LEO-AI-173"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "partially_effective"
    - control_type: "design_feature"
      description: >
        Site reconciliation refuses to downgrade a specific site_key
        to "unknown" or "non_site_specific" (guard before reassignment).
        Only diagnosis-led (closed) episodes are subject to
        reconciliation; in_progress episodes keep their referral site.
      implemented_by: ["DI-LEO-AI-173"]
      verified_by: ["VT-LEO-AI-170"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"
    acceptability: "acceptable"
    justification: >
      The fixes recover at least 6 known-missed cancers in the 2025
      closed_benign cohort (12% precision improvement on a 50-episode
      sample). The HITL flag on every new-channel diagnosis means
      no decision becomes authoritative without human review. The
      history-of-cancer guard is a hard precondition that prevents
      the largest false-positive class. Residual risk is acceptable
      with the planned quarterly audit cadence.

  monitoring:
    monitoring_plan: >
      Quarterly audit: sample 50 episodes per quarter that flipped
      to diagnosis_confirmed via diagnosis_source in
      {malignancy_term_problem_line, active_cancer_care_code,
      adjuvant_therapy_drug} and confirm against the source letter.
      Sample 50 episodes per quarter that triggered site
      reconciliation and confirm against the source. Track precision
      per channel; trigger inventory review if precision falls
      below 90%.
    metrics:
      - "Precision of malignancy_term_problem_line -> diagnosis_confirmed"
      - "Precision of active_cancer_care_code -> diagnosis_confirmed"
      - "Precision of site reconciliation flips"
      - "HITL override rate on new-channel diagnoses"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "2025 closed_benign audit (50 episodes, 6 missed cancers found 2026-04-17)"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "episode-building"
      - "missed-cancer"
      - "site-classification"
      - "problem-list-codes"
      - "active-cancer-care"
      - "history-of-cancer-guard"
