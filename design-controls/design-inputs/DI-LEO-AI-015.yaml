# -- DI-LEO-AI-015 -- Review Service
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-015"
  type: "Functional"
  derived_from: ["UN-LEO-AI-010"]
  requirement: "The system SHALL provide a review service that queues all AI-generated proposals (coded encounters, episode classifications, guideline alerts, interpretations) for human validation, supporting confirm, edit, and reject actions with mandatory reviewer identity and timestamp recording"
  rationale: "Human-in-the-loop review is the primary safety control for AI outputs. The review service is the gateway between AI proposals and accepted audit data. Every decision must be attributed to a named reviewer for audit trail compliance."

  machine_spec:
    agent_prompt: |
      Implement the ReviewService class (~250 LOC).

      SINGLE PURPOSE: Queue AI-generated proposals for human review and
      record validation decisions with full attribution.

      REQUIREMENTS:
      1. Accept AI-generated proposals of all types (coded encounters,
         episode classifications, guideline alerts, interpretations).
      2. Queue proposals in a review worklist ordered by priority.
      3. Support confirm, edit, and reject actions on each proposal.
      4. Record reviewer identity (authenticated user) and timestamp on
         every decision.
      5. Block finalisation of any AI output that has not been reviewed.
      6. Expose review status and statistics via API.

      METHODS:
      - queue(proposal): Add an AI proposal to the review worklist.
      - confirm(proposal_id, reviewer): Mark a proposal as confirmed.
      - edit(proposal_id, reviewer, edits): Apply edits and mark as reviewed.
      - reject(proposal_id, reviewer, reason): Reject a proposal with reason.
      - get_worklist(filters): Retrieve the current review worklist.
      - get_stats(): Return review completion statistics.

      CODE CLARITY:
      - Use guard clauses to flatten nesting.
      - Keep functions under 30 lines.
      - Use type hints throughout.

    acceptance_criteria:
      - type: "test"
        spec: "100% of AI outputs require human approval before finalisation"
      - type: "test"
        spec: "All decisions recorded with reviewer identity and timestamp"
      - type: "test"
        spec: "Confirm, edit, and reject actions all function correctly"
      - type: "test"
        spec: "Unreviewed proposals cannot be finalised"

    constraints:
      - type: "safety"
        spec: "No AI output may bypass the review queue"
      - type: "security"
        spec: "Reviewer identity sourced from authenticated session, not user input"
      - type: "performance"
        spec: "Review action response time < 500ms"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "audit_trail"
      - "reporting_dashboard"
      - "kpi_calculator"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/api/app/services/review_service.py"
        - "services/api/app/routers/review.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "100% of AI outputs require human approval before finalisation; all decisions recorded with identity and timestamp"
    test_protocol: "VT-LEO-AI-015"

  safety_class: "B"
  risks: ["R-LEO-AI-006", "R-LEO-AI-001"]
  tags: ["hitl", "review", "safety-critical", "core-service"]
