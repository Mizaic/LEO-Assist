# -- DI-LEO-AI-135 -- Merge /admin/clinical into /admin/knowledge
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-135"
  type: "Functional"
  derived_from: ["UN-LEO-AI-069"]
  requirement: >
    The admin information architecture SHALL expose a single "Knowledge"
    hub that contains both the curation sub-pages (training data, surface
    forms, context rules, AI instructions, clinical guidelines) and the
    clinical setup sub-pages (pathways, domains, terminology) as tabs of
    one page at /admin/knowledge. The legacy /admin/clinical route and
    the standalone Clinical nav entry SHALL be removed. All prior routes
    (/admin/clinical, /admin/clinical?tab=pathways, /admin/pathways,
    /admin/domains, /admin/terminology, plus the existing
    /admin/gold-dataset etc.) SHALL 301-redirect to the matching
    /admin/knowledge?tab=<key> URL so bookmarks and emailed links keep
    working.
  rationale: >
    UN-LEO-AI-069 (role-first inclusive redesign) requires that each role
    sees the slimmest viable left nav. On the qa_ra_lead and staff roles
    "Knowledge" and "Clinical" both read as "where the reference data
    lives" and users report bouncing between the two trying to remember
    which noun covers what. Merging them into one hub removes the
    duplicate and lets us group the sub-pages by what the user is trying
    to do rather than by which team maintains them. The merge also
    reduces the admin left-nav from 9 to 8 items, clearing headroom for
    the new /work inbox in Phase 4 without breaching the Hick's-Law
    target of <=8 primary nav items per role.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/app/admin/knowledge/page.tsx exposes 8 tabs in
          this order: training-data, surface-forms, context-rules,
          ai-instructions, clinical-guidelines, pathways, domains,
          terminology. Navigating to /admin/knowledge with no tab
          parameter defaults to training-data.
      - type: "functional"
        spec: >
          services/ui/src/app/admin/clinical/page.tsx is deleted. A
          request to /admin/clinical or /admin/clinical?tab=<key>
          returns HTTP 308 permanent redirect to the matching
          /admin/knowledge?tab=<key> URL via next.config.mjs redirects.
      - type: "functional"
        spec: >
          The legacy standalone nav targets /admin/pathways,
          /admin/domains, /admin/terminology 301-redirect to
          /admin/knowledge?tab=<key>.
      - type: "functional"
        spec: >
          services/ui/src/components/AppShell.tsx ADMIN_NAV_ITEMS no
          longer contains a "Clinical" item. The "Knowledge" item's
          activePrefix includes /admin/clinical, /admin/pathways,
          /admin/domains, /admin/terminology so the Knowledge nav item
          stays highlighted when the user lands on any legacy URL during
          the redirect.
      - type: "functional"
        spec: >
          The admin-url-audit Jest test (__tests__/admin-url-audit.test.ts)
          is extended to include '"/admin/clinical"' in DEPRECATED_PATTERNS
          and asserts no file under src/ references /admin/clinical as a
          hardcoded navigation target.
    constraints:
      - type: "usability"
        spec: >
          Tab rename is forbidden in this DI -- the 8 tab keys above are
          the canonical URL contract. Visual ordering is allowed to
          change in Phase 3 (knowledge redesign) but keys must stay
          stable.
    dependencies: ["DI-LEO-AI-131"]
    downstream_impacts:
      - "services/ui/src/app/admin/knowledge/page.tsx"
      - "services/ui/src/app/admin/clinical/page.tsx (deleted)"
      - "services/ui/next.config.mjs"
      - "services/ui/src/components/AppShell.tsx"
      - "services/ui/src/__tests__/admin-url-audit.test.ts"
      - "services/ui/src/app/admin/pathways/[id]/page.tsx"
      - "services/ui/src/app/admin/guidance/RuleReviewSection.tsx"
      - "services/ui/src/app/admin/operations/run/page.tsx"
    technical_details:
      language: "TypeScript"
      framework: "Next.js 16 app router"
      file_structure:
        - "services/ui/src/app/admin/knowledge/page.tsx"
        - "services/ui/next.config.mjs"
        - "services/ui/src/components/AppShell.tsx"
        - "services/ui/src/__tests__/admin-url-audit.test.ts"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-131 passes: knowledge page renders 8 tabs in the
      documented order; legacy /admin/clinical* URLs are declared as
      permanent redirects in next.config.mjs; AppShell no longer exposes
      a Clinical nav item; the admin-url-audit test reports zero
      violations.
    test_protocol: "VT-LEO-AI-131"

  safety_class: "A"
  risks: ["R-LEO-AI-093"]
  tags:
    - "information-architecture"
    - "role-first"
    - "admin"
    - "knowledge-hub"
