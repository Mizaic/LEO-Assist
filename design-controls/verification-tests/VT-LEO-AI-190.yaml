- id: "VT-LEO-AI-190"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-195"]
    risks: ["R-LEO-AI-186"]

  metadata:
    title: "PRISM cancer-context guard + Marked-in-Error admin amendment filter"
    description: >
      Verifies the anchor detector only opens a 2WW cancer pathway
      from PRISM encounters that carry explicit cancer context, and
      that "Marked in Error: Amended data" QOF amendments do not
      inflate the referral-rejection DQ metric.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_anchor_detector.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-190-TC-001"
      case_name: "Sexual health PRISM does not open cancer pathway"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'Sexual Healthcare (Complex) PRISM Pathway Accessed' encounter"
          expected_result: "refs == [] (no referral anchor emitted)"
          verification_method: "automated"
      acceptance_criteria:
        - "test_sexual_health_prism_does_not_open_cancer_pathway passes"

    - case_id: "VT-190-TC-002"
      case_name: "MSK PRISM does not open cancer pathway"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'MSK PRISM Pathway Accessed' encounter"
          expected_result: "refs == []"
          verification_method: "automated"
      acceptance_criteria:
        - "test_msk_prism_does_not_open_cancer_pathway passes"

    - case_id: "VT-190-TC-003"
      case_name: "Mental-health PRISM does not open cancer pathway"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'Mental Health Crisis PRISM Pathway Accessed' encounter"
          expected_result: "refs == []"
          verification_method: "automated"
      acceptance_criteria:
        - "test_mental_health_prism_does_not_open_cancer_pathway passes"

    - case_id: "VT-190-TC-004"
      case_name: "IBD PRISM does not emit diagnosis or benign either"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'IBD PRISM Pathway Accessed' encounter"
          expected_result: "refs == [] AND diags == [] AND benigns == []"
          verification_method: "automated"
      acceptance_criteria:
        - "test_ibd_prism_does_not_emit_diagnosis_or_benign passes"

    - case_id: "VT-190-TC-005"
      case_name: "PRISM 2WW Lung still emits prism subtype"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'PRISM 2WW Lung - questionnaire ... finalised' encounter"
          expected_result: "len(refs) == 1 AND refs[0].referral_subtype == 'prism'"
          verification_method: "automated"
      acceptance_criteria:
        - "test_prism_2ww_lung_still_emits_prism_subtype passes"

    - case_id: "VT-190-TC-006"
      case_name: "PRISM with 'suspected cancer' phrase emits prism"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with PRISM + 'Fast track referral for suspected breast cancer'"
          expected_result: "any ref has referral_subtype == 'prism'"
          verification_method: "automated"
      acceptance_criteria:
        - "test_prism_with_suspected_cancer_phrase_emits_prism passes"

    - case_id: "VT-190-TC-007"
      case_name: "PRISM with 2WW Read code (XaMe family) emits prism"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with PRISM + '... suspected colorectal cancer (XaMeJ)'"
          expected_result: "any ref has referral_subtype == 'prism'"
          verification_method: "automated"
      acceptance_criteria:
        - "test_prism_with_2ww_readcode_emits_prism passes"

    - case_id: "VT-190-TC-008"
      case_name: "Marked in Error WITHOUT 'Amended data' qualifier emits rejected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with 'Hospital Fast track referral ... Marked in Error' (no 'Amended data')"
          expected_result: "len(refs) == 1 AND refs[0].referral_subtype == 'rejected'"
          verification_method: "automated"
      acceptance_criteria:
        - "test_referral_marked_in_error_emits_rejected_subtype passes"

    - case_id: "VT-190-TC-009"
      case_name: "Marked in Error: Amended data is admin, not rejection"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_classify_text_encounters with '... Marked in Error: Amended data'"
          expected_result: "no ref has referral_subtype == 'rejected'"
          verification_method: "automated"
      acceptance_criteria:
        - "test_marked_in_error_amended_data_is_admin_not_rejection passes"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-190/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-190-EXEC-2026-04-17-001"
      execution_date: "2026-04-17"
      executed_by: "ci-pipeline"
      environment: "local-dev"
      result: "pass"
      summary: >
        All 9 test cases pass. Sexual-health, MSK, mental-health,
        and IBD PRISM templates correctly emit no referral anchor;
        cancer PRISM (2WW Lung, suspected cancer phrase, XaMe Read
        code) still emit referral_subtype=prism; "Marked in Error"
        alone emits rejected; "Marked in Error: Amended data" does
        not emit rejected.
      command: "pytest tests/test_anchor_detector.py -x"
      output_summary: "34 passed in 0.17s"
