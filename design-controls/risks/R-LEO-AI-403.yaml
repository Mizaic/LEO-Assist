# -- R-LEO-AI-403 -- Phantom duplicate referral milestones on EpisodeOfCare timelines
# ISO 14971 / IEC 62304 Risk
#
# NOTE: Created in the 4xx ID range alongside R-401 / R-402.

- id: "R-LEO-AI-403"
  title: >
    Multiple ``referral`` IS_PART_OF edges on the same date
    inside a single EpisodeOfCare inflate referral-count
    analytics, confuse pathway-explorer investigations, and
    erode reviewer trust in the timeline view.

  hazard:
    description: >
      A single 2WW referral decision can leave multiple
      Encounter records on the same date inside the same
      episode -- the GP's clinical encounter, the structured
      PRISM 2WW questionnaire completed alongside it, and a
      back-dated medical-secretary admin tracking record. Each
      contributes its own anchor and its own IS_PART_OF
      edge, producing two or three "referral" milestones on
      one day for one clinical decision. Beyond the build
      stage, the duplicate-episode merger can move a same-day
      referral edge from a duplicate onto a primary that
      already has its own same-day referral edge, producing
      the same artefact at the merge layer.
    category: "clinical_safety"

  hazardous_situation: >
    The reviewer opens the cancer-pathway timeline for
    patient 4802892365 and sees three "referral" events on
    2025-03-26 for what was a single 2WW breast referral.
    The reviewer either (a) loses trust in the timeline and
    disengages from review, (b) interprets the duplicates as
    a clinical re-referral signalling a problem with the
    pathway and wastes investigation time, or (c) the COO
    dashboard's referral-count KPI is inflated, leading to
    misallocated capacity-planning decisions.

  harm:
    description: >
      Reviewer disengagement, wasted investigation time,
      inflated referral-count KPIs, mis-prioritised
      service-improvement decisions, mis-allocated capacity
      planning. No direct patient harm but a clear erosion
      of the safety-critical "the system tells the truth
      about what happened" guarantee.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 4
    detectability: 3
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Build-time collapse: ``collapse_same_day_referrals``
        helper deduplicates the link-group list per episode
        BEFORE IS_PART_OF edges are written, keeping one
        representative per (episode, date) using the
        ``prism > form_field > text_generic`` priority order.
      implemented_by: ["DI-LEO-AI-403"]
      verified_by: ["VT-LEO-AI-403"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Post-merge collapse: ``COLLAPSE_SAME_DAY_REFERRALS_Q``
        Cypher sweep runs on the surviving primary after each
        successful merge decision. Same ranking rule, applied
        directly in Cypher across all of the primary's
        referral edges.
      implemented_by: ["DI-LEO-AI-403"]
      verified_by: ["VT-LEO-AI-403"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        ``MOVE_LINKS_Q`` extended to preserve ``referral_subtype``
        and tag ``linked_by='merge_duplicate'`` on the
        migrated edge so the post-merge sweep can rank
        non-lossily.
      implemented_by: ["DI-LEO-AI-403"]
      verified_by: ["VT-LEO-AI-403"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Cohort wipe-and-rebuild verification: the canonical
        cohort regression query ``MATCH ()-[r:IS_PART_OF
        {milestone_type:'referral'}]->(ep) WITH ep, e.date AS
        d, count(r) AS rc WHERE rc > 1 RETURN ep`` MUST
        return zero rows post-rebuild.
      implemented_by: ["DI-LEO-AI-403"]
      verified_by: ["VT-LEO-AI-403"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Both layers (build-time helper + post-merge Cypher
      sweep) have explicit verification cases. The cohort
      regression query confirms ZERO same-day duplicate
      referrals after rebuild (down from 3 on the canonical
      4802892365 episode and 5 cohort-wide from merge-induced
      duplicates). Residual risk is limited to subtype
      vocabulary drift -- a brand-new referral subtype string
      not in ``REFERRAL_SUBTYPE_PRIORITY`` would fall to the
      lowest tier and be replaceable by any listed subtype on
      the same date, which is the intended fallback. Any genuine
      future need to preserve a new subtype's edges would be
      caught by the wipe-and-rebuild monitoring metric below.

  monitoring:
    monitoring_plan: >
      Monthly cohort regression query: same-day duplicate
      referral count must remain zero. Alert on any sudden
      drop in total cohort referral milestone count > 5%
      relative to baseline, which would indicate the helper
      is over-collapsing (e.g. a new fast-track template
      having all its anchors classified as the same fallback
      subtype rank).
    metrics:
      - "Cohort same-day duplicate referral count == 0"
      - "Total cohort referral milestone count delta vs baseline"
      - "Patient 4802892365 episode 1ecfb55618c2a6d2 referral count == 1 (canonical regression)"
      - "Patient 4802892365 referral_subtype on the kept edge == 'prism' (canonical priority test)"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Patient 4802892365 deep-dive (2025-03-26 triple referral on real episode); cohort same-day duplicate audit"
    identified_date: "2025-04-18"
    status: "mitigated"
    tags:
      - "episode-builder"
      - "referral-collapse"
      - "milestone-dedup"
      - "patient-4802892365"
      - "pattern-n2"
