# -- DI-LEO-AI-136 -- Fallback referral-claim rule for floating cancer diagnoses
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-136"
  type: "Functional"
  derived_from: ["UN-LEO-AI-006", "UN-LEO-AI-019"]
  requirement: >
    The episode builder SHALL match each cancer diagnosis anchor to a
    preceding referral anchor using a two-pass strategy. Pass 1 keeps
    current strict same-site behaviour: only a referral whose site key
    equals the diagnosis site or is non_site_specific may be claimed.
    Any diagnosis still unmatched after Pass 1 runs through Pass 2,
    which claims the nearest unclaimed referral within
    DIAG_LOOKBACK_DAYS regardless of site key, subject to
    MIN_REFERRAL_TO_DIAG_DAYS. Episodes produced via Pass 2 SHALL be
    tagged ep.referral_match_method = 'fallback_any_site' so downstream
    audit surfaces can distinguish strict from fallback claims. When
    NO referral can be claimed, ep.referral_date SHALL NOT be
    synthesised from the diagnosis encounter date; it SHALL be
    persisted as NULL, and ep.referral_inferred SHALL be false.
  rationale: >
    Live investigation on 2026-04-17 found 75 of 91 confirmed cancer
    episodes in 2025 had ep.referral_date set but no
    IS_PART_OF{milestone_type:'referral'} edge, because the builder
    rejected every referral whose site tag was 'unknown' (falsely
    mismatched to a specific-site diagnosis), then silently wrote the
    diagnosis encounter date back into ep.referral_date as a fallback.
    The effect was a data-integrity lie: 'referral_date' on 75 of 91
    episodes was really the diagnosis date, and the 2WW-route metric
    undercounted by 3-4x. The two-pass fallback matches NHS reality,
    where a non-trivial fraction of 2WW referral letters lack an
    unambiguous body-site tag and the current strict rule throws them
    away.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          _find_best_site_matched_referral (Pass 1) behaves exactly
          like the current _find_best_referral: same-site OR NSS
          only, respecting MIN_REFERRAL_TO_DIAG_DAYS and
          DIAG_LOOKBACK_DAYS.
      - type: "functional"
        spec: >
          _find_any_referral_in_window (Pass 2) returns the nearest
          unclaimed referral within DIAG_LOOKBACK_DAYS regardless
          of site key, respecting MIN_REFERRAL_TO_DIAG_DAYS.
      - type: "functional"
        spec: >
          _build_diagnosis_led_groups runs Pass 1 for all diagnoses,
          then Pass 2 for still-floating diagnoses, in chronological
          order. A Pass 2 match produces a group with site_key taken
          from the diagnosis (not the referral) and
          referral_match_method = 'fallback_any_site'.
      - type: "functional"
        spec: >
          When ref_anchors is empty (truly floating), ep.referral_date
          SHALL be written as NULL, and ep.referral_inferred SHALL be
          false. The diagnosis encounter date MUST NOT be
          re-purposed as ep.referral_date.
      - type: "safety"
        spec: >
          Every EpisodeOfCare node written by the builder carries a
          non-null ep.referral_match_method in the enumerated set
          {'strict_site', 'fallback_any_site', 'none'}. The value
          'none' applies only when ref_anchors is empty.
    constraints:
      - type: "performance"
        spec: >
          Pass 2 adds at most O(diagnoses * referrals) scan per
          patient, bounded by existing per-patient anchor counts;
          no global graph scan.
    dependencies: ["DI-LEO-AI-010", "DI-LEO-AI-124"]
    downstream_impacts:
      - "services/analysis_worker/app/analyzers/episode_builder/_grouping.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_types.py"
    technical_details:
      language: "Python"
      framework: "Neo4j + LangGraph"
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_builder/_grouping.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_persistence.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_types.py"
      estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-137 cases pass: strict-match unchanged, fallback
      correctly claims previously-floating diagnoses, truly-floating
      diagnoses persist referral_date=NULL, referral_match_method
      tagged on every written episode. After rebuild on the 2025
      dev-graph snapshot the 'via_2ww' count rises to at least 40
      (from baseline 16).
    test_protocol: "VT-LEO-AI-137"

  safety_class: "B"
  risks: ["R-LEO-AI-096"]
  tags:
    - "episode-builder"
    - "ncda"
    - "referral-matching"
    - "data-integrity"
