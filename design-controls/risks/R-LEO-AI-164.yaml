# -- R-LEO-AI-164 -- Letter-stub DQ alert may swamp triage or miss true gaps
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-164"
  title: "dq_letter_stub_unfilled may produce too many or too few alerts, delaying triage of real letter-ingestion gaps"

  hazard:
    description: >
      The new DQ tool surfaces incoming letter stubs (routing-only text
      shorter than 200 chars) older than 7 days for patients who already
      have a stale episode. If the regex over-matches, the DQ team gets a
      flood of false positives and stops trusting the alert. If it
      under-matches, a real ingestion gap (a specialist letter that never
      had its body filed) silently lets a cancer pathway age into
      stale_post_specialist.
    category: "data_protection"

  hazardous_situation: >
    The DQ analyst opens the safety dashboard and either ignores the
    letter-stub queue because it is full of false positives, or sees an
    empty queue while real stubs are sitting in the corpus undetected.
    In both cases, an unfilled letter that hides a clinical outcome is
    not corrected before the episode ages out.

  harm:
    description: >
      Delayed correction of letter-ingestion gaps, which in turn delays
      proper episode classification. No direct patient harm because the
      underlying clinical record is unchanged and reviewers always see
      the source encounter alongside the episode classification.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        LETTER_STUB_PATTERNS are explicit regexes anchored to the
        "X to Y" routing structure observed in the deep-read corpus,
        not a generic "short text" heuristic. The patterns are unit
        tested against a hand-curated set of stub vs. non-stub examples.
      implemented_by: ["DI-LEO-AI-162"]
      verified_by: ["VT-LEO-AI-161"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The tool only surfaces stubs whose patient already has an
        EpisodeOfCare in stale_post_specialist or stale_no_diagnosis.
        That precondition focuses the alert queue on actionable cases
        and bounds its size by the size of the stale-episode dashboard.
      implemented_by: ["DI-LEO-AI-162"]
      verified_by: ["VT-LEO-AI-161"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        days_threshold and max_chars are tool parameters; the DQ team
        can tune them without a code change if the alert volume drifts.
      implemented_by: ["DI-LEO-AI-162"]
      verified_by: ["VT-LEO-AI-161"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The alert is read-only and recoverable -- false positives cost
      analyst time but do not change the patient record; false negatives
      revert to the previous behaviour (stale episode visible on the
      stale dashboard). Tunable thresholds and the stale-episode
      precondition bound both failure modes.

  monitoring:
    monitoring_plan: >
      Monthly review of dq_letter_stub_unfilled output by the DQ lead.
      Track alert volume, true-positive rate (stubs that did need a
      body), and time-to-resolution. If true-positive rate falls below
      80%, tighten LETTER_STUB_PATTERNS; if alert volume stays at zero
      for two consecutive months while stale episodes persist, broaden
      the patterns.
    metrics:
      - "dq_letter_stub_unfilled true-positive rate"
      - "Median time from alert to letter-body fill"
      - "Stale-episode count attributable to letter stubs"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Stale-episode deep-read 2026-04-17 (letter ingestion gap finding)"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "data-quality"
      - "letter-ingestion"
      - "mcp-tool"
