# -- DI-LEO-AI-029 -- Auto-Scaling Worker Architecture
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-029"
  type: "Performance"
  derived_from: ["UN-LEO-AI-020"]
  requirement: "The system SHALL deploy pipeline workers as independently scalable container instances that auto-scale based on message queue depth, supporting at least 10 concurrent pipeline jobs with full pipeline completion for a single patient within 2 minutes"
  rationale: "Pipeline processing is compute-intensive. Auto-scaling ensures adequate capacity during peak audit periods while minimising cost during idle periods. Pipeline worker instances scale on Service Bus queue depth; coding and analysis logic run in-process within the unified pipeline worker and shared Python packages (no separate coding-worker or analysis-worker container apps)."

  machine_spec:
    agent_prompt: |
      Implement auto-scaling worker architecture (~200 LOC).

      SINGLE PURPOSE: Deploy pipeline workers as scalable container
      instances that auto-scale based on Service Bus queue depth.

      REQUIREMENTS:
      1. Define container app scaling rules based on queue depth
      2. Pipeline worker scales on pipeline-jobs queue depth
      3. Support at least 10 concurrent pipeline jobs
      4. Single patient pipeline completes within 2 minutes
      5. Scale-to-zero when idle to minimise cost
      6. Health checks and readiness probes for pipeline worker

      METHODS:
      - Container Apps Bicep module with scaling rules
      - Dockerfile for pipeline-worker (includes shared coding/analysis libs)
      - Queue-depth-based KEDA scaling configuration

      CODE CLARITY:
      - Scaling thresholds are parameterised in Bicep
      - Worker containers share common base image layers
      - Resource limits (CPU, memory) explicitly declared

    acceptance_criteria:
      - type: "test"
        spec: "10 concurrent pipeline jobs complete within SLA"
      - type: "test"
        spec: "Auto-scaling activates when queue depth exceeds threshold"
      - type: "test"
        spec: "Workers scale to zero after idle timeout"

    constraints:
      - type: "performance"
        spec: "Single patient pipeline completes in <= 2 minutes"
      - type: "performance"
        spec: "Auto-scale response time <= 60 seconds from queue depth trigger"

    dependencies: []

    downstream_impacts:
      - "services/coding_worker -- Python package used by pipeline worker image"
      - "services/analysis_worker -- Python package used by pipeline worker image"
      - "infra/bicep -- container app scaling rules defined here"

    technical_details:
      language: "Python"
      framework: "Azure Container Apps"
      libraries: ["azure-servicebus", "redis"]
      file_structure:
        - "infra/dockerfiles/Dockerfile.pipeline-worker"
        - "infra/bicep/modules/container-apps.bicep"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "PQ"
    acceptance: "10 concurrent pipeline jobs complete within SLA; auto-scaling activates on queue depth threshold"
    test_protocol: "VT-LEO-AI-029"

  safety_class: "A"
  risks: ["R-LEO-AI-012"]
  tags: ["performance", "scaling", "infrastructure", "container-apps"]
