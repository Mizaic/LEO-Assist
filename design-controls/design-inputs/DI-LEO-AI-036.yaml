# -- DI-LEO-AI-036 -- Dual-Model Consensus Runner
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-036"
  type: "Safety"
  derived_from: ["UN-LEO-AI-002"]
  requirement: "The system SHALL verify safety-critical clinical decisions using dual-model consensus: two independent LLM providers (AWS Haiku, Azure GPT-5 mini) run in parallel and a larger model (AWS Sonnet) arbitrates when they disagree"
  rationale: "Single-model LLM decisions are vulnerable to model-specific biases and hallucinations. Dual-model consensus with independent providers reduces the probability of correlated errors. Arbitration by a larger model provides a tiebreaker grounded in greater reasoning capacity."

  machine_spec:
    agent_prompt: |
      Implement the dual-model consensus runner (~100 LOC).

      SINGLE PURPOSE: Run two independent LLM providers in parallel,
      compare their verdicts, and escalate to a larger arbitrator on
      disagreement.

      REQUIREMENTS:
      1. Call AWS small (Haiku) and Azure small (GPT-5 mini) in parallel.
      2. If both agree, return the shared verdict with agreed=True.
      3. If one provider fails, return the surviving provider's verdict.
      4. If both fail, return the caller-supplied fail_verdict.
      5. If they disagree, call AWS big (Sonnet) as arbitrator.
      6. If the arbitrator also fails, return fail_verdict.
      7. Track all model IDs in the result for audit trail.

      The module is generic -- callers supply a parse_fn and fail_verdict
      so the same runner works for disorder verification, coding
      confidence, and any future safety gate.

    acceptance_criteria:
      - type: "test"
        spec: "Agreement path returns correct verdict with agreed=True"
      - type: "test"
        spec: "Single provider failure degrades gracefully to surviving provider"
      - type: "test"
        spec: "Both providers failing returns fail_verdict"
      - type: "test"
        spec: "Disagreement triggers Sonnet arbitration"
      - type: "test"
        spec: "Arbitration failure returns fail_verdict"
      - type: "test"
        spec: "All model IDs tracked in ConsensusResult"

    constraints:
      - type: "safety"
        spec: "Fail-safe: any unrecoverable failure returns the caller-supplied fail_verdict, never an empty or null verdict"
      - type: "performance"
        spec: "Parallel execution -- both small models called concurrently with 60s timeout"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "disorder_verifier"
      - "verify_coding_consensus"

    technical_details:
      language: "Python"
      framework: "concurrent.futures"
      libraries: ["libs.llm_client.factory"]
      file_structure:
        - "libs/llm_client/consensus.py"
      estimated_loc: 100

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All consensus paths (agree, single fail, both fail, arbitration, arbitration fail) verified"
    test_protocol: "VT-LEO-AI-021"

  safety_class: "B"
  risks: ["R-LEO-AI-001", "R-LEO-AI-026", "R-LEO-AI-030"]
  tags: ["consensus", "dual-model", "safety-gate", "autonomous-coding", "intended-use-enforcement"]
