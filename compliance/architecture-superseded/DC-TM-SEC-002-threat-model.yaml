# ---------------------------------------------------------------------------
# COMPONENT 13: DUAL-MODEL CONSENSUS ENGINE (NEW in v2)
# ---------------------------------------------------------------------------
component_13_consensus:
  name: "Dual-Model Consensus Engine"
  purpose: "Run clinical verification queries against two LLMs (Haiku + GPT-5 mini) in parallel with Sonnet arbitration on disagreement. INJECTION_GUARD now prepended to all system prompts including _VERIFY_SYSTEM. Disorder verifier supports REFUTED verdict for overridden impressions. Invalid selected_index falls back to ambiguous instead of picking candidate 0"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "Application → AWS Bedrock (Haiku, Sonnet)"
    - "Application → Azure OpenAI (GPT-5 mini)"
  data_assets: "Clinical text (entity_text, encounter_text), SNOMED codes, verification verdicts"
  network_exposure: "Internal → External"
  source_files:
    - "libs/llm_client/consensus.py (~196 lines)"
    - "libs/llm_client/disorder_verifier.py (~143 lines)"
    - "libs/llm_client/escalation.py (~484 lines) — verify_coding_consensus function"

  phase_2_threats:
    - id: "CONS-I-001"
      element: "libs/llm_client/consensus.py"
      threat: "Clinical text sent to multiple LLM providers simultaneously"
      status: "NEW in v2"
      attack_vector: >
        The consensus engine sends clinical text (entity_text, encounter_text) to
        both AWS Bedrock and Azure OpenAI in parallel. On disagreement, a third call
        goes to Sonnet (AWS). This triples the data exposure surface compared to
        single-model calls. The disorder verifier sends encounter_text[:2000] +
        entity_text to both providers. The coding consensus verifier sends
        encounter_text[:1500] + entity_text + SNOMED candidates to both providers.
      prerequisites: "Standard system operation — consensus runs on every entity requiring verification"
      threat_actors: ["supply_chain"]
      evidence:
        file: "libs/llm_client/consensus.py"
        line: 84
        snippet: "fut_aws = pool.submit(_call_provider, 'aws', 'small', ...); fut_azure = pool.submit(_call_provider, 'azure', 'small', ...)"
      impact:
        confidentiality: "Medium"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "Standard operation. Every entity that enters Tier 2 or requires disorder verification triggers dual-model calls."
      existing_controls: "De-identification upstream; encounter_text sanitised and capped at 16000 chars in disorder verifier and coding consensus; AWS/Azure DPAs"
      gaps: "No per-call PHI audit; data sent to two separate cloud jurisdictions (AWS US, Azure UK); no data minimization beyond truncation"
      confidence: "Confirmed"
      regulatory_impact:
        - standard: "UK GDPR"
          clause: "Article 28, Article 44-49"
          nature: "Clinical text sent to multiple third-party processors; cross-border transfer considerations for AWS"
        - standard: "DSPT"
          clause: "Assertion 3.4"
          nature: "Data sharing with multiple external processors"

    - id: "CONS-T-001"
      element: "libs/llm_client/consensus.py:146-195"
      threat: "Arbitrator override of correct clinical verdict"
      status: "NEW in v2"
      attack_vector: >
        When Haiku and GPT-5 mini disagree, Sonnet arbitrates with the same prompt.
        Sonnet's verdict is accepted unconditionally. If Sonnet produces an incorrect
        verdict (e.g., classifying an active disorder as informational), this
        overrides a potentially correct small-model verdict.
      prerequisites: "Model disagreement on clinical entity classification"
      threat_actors: ["N/A — systemic AI reliability risk"]
      evidence:
        file: "libs/llm_client/consensus.py"
        line: 152
        snippet: "arb_resp = _call_provider('aws', 'big', system_prompt, user_msg, max_tokens)"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Sonnet is a more capable model; arbitration errors should be rare but cannot be eliminated. Incorrect disorder classification could suppress clinically relevant entities."
      existing_controls: "fail_verdict returns conservative default (e.g., 'review' for HITL mode); CodingDecision audit trail records all verdicts and model IDs"
      gaps: "No human review step for arbitrated verdicts in autonomous mode; no monitoring of disagreement rates or arbitration accuracy"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 62304"
          clause: "5.5"
          nature: "AI-driven clinical classification without deterministic verification"
        - standard: "ISO 14971"
          clause: "5.5"
          nature: "Risk control relies on third-party AI model accuracy"

    - id: "CONS-T-002"
      element: "libs/llm_client/consensus.py:111-117"
      threat: "Dual provider failure falls back to fail_verdict without human review"
      status: "NEW in v2"
      attack_vector: >
        If both AWS and Azure calls fail (network, timeout, rate limit), the consensus
        engine returns fail_verdict. For disorder verification in HITL mode this is 'review'
        (safe), but in autonomous mode it is 'not_disorder' which suppresses the entity
        entirely without any human review.
      prerequisites: "Both LLM providers unavailable simultaneously"
      threat_actors: ["external_targeted", "configuration_error"]
      evidence:
        file: "libs/llm_client/disorder_verifier.py"
        snippet: "fail_verdict_for_mode: autonomous='not_disorder', hitl='review'"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "Medium"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Simultaneous failure of both providers is unlikely. However, a targeted DoS against LLM endpoints could trigger this path."
      existing_controls: "60s timeout per provider; CodingDecision audit records failure"
      gaps: "Autonomous mode fail_verdict silently suppresses entities; no alerting on dual-provider failure"
      confidence: "Probable"

# ---------------------------------------------------------------------------
# COMPONENT 14A: AGENTIC TRAINING LABEL AUDITOR (NEW - DI-LEO-AI-054)
# ---------------------------------------------------------------------------
component_14a_agentic_auditor:
  name: "Agentic Training Label Auditor"
  purpose: >
    Two-pass automated audit system for TrainingLabel records. Pass 1 uses
    Opus (AWS_MAX_MODEL) to audit every entity for span, assertion, label,
    and value errors. Pass 2 invokes Opus with Bedrock tool-use to call
    the Terminology API (via Haiku sub-agent) for SNOMED-ambiguous entities.
    Cost guardrails (token budget + dollar cap) and a hard iteration cap
    (5 per record) prevent runaway spending. SNOMED fields are never
    auto-fixed; tool-informed results are human-review proposals only.
  iec_62304_contribution: "B"
  trust_boundaries:
    - "scripts/opus_training_auditor.py -> AWS Bedrock (Opus, pass 1+2)"
    - "scripts/opus_training_auditor.py -> AWS Bedrock (Haiku, tool executor)"
    - "ToolExecutor -> Terminology API (internal HTTP)"
    - "scripts/opus_training_auditor.py -> Neo4j Patient Graph (read/write)"
  data_assets: >
    De-identified clinical text (from TrainingLabel.text), extracted
    entities (entities_json), SNOMED concept IDs and terms, audit verdicts,
    tool call inputs/outputs (recorded in JSONL trail)
  network_exposure: "Internal -> External (Bedrock)"
  source_files:
    - "scripts/opus_training_auditor.py"
    - "libs/llm_client/factory.py (LLMClient.converse tool_config extension)"
    - "libs/prompts/opus_audit_v1.py"

  phase_2_threats:
    - id: "AUD-I-001"
      element: "scripts/opus_training_auditor.py"
      threat: "Clinical text sent to Opus and Haiku in agentic audit loop"
      status: "NEW"
      attack_vector: >
        In pass 1, de-identified clinical text from TrainingLabel records is
        sent to Opus. In pass 2, clinical text is re-sent to Opus along with
        tool results from Haiku (which received entity text to query the
        Terminology API). The agentic loop can iterate up to 5 times per
        entity, each time re-sending the encounter text to Opus. For a batch
        of 500 records with multiple needs_review entities each, this
        significantly amplifies data exposure compared to single-pass audit.
      prerequisites: "Audit run with --apply flag or pass-2 enabled"
      threat_actors: ["supply_chain"]
      evidence:
        file: "scripts/opus_training_auditor.py"
        snippet: "_agentic_audit_record(): Opus called with full encounter context per iteration"
      impact:
        confidentiality: "Medium"
        integrity: "None"
        availability: "None"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: >
        De-identification is regex-based and cannot guarantee all PII
        removal. Each agentic iteration re-sends the same clinical text
        to Bedrock. Up to 5 iterations per entity could send the same text
        5 times. However, training labels are already de-identified
        upstream by the pipeline.
      existing_controls: >
        Regex-based de-identification upstream; sanitise_for_prompt()
        applied to all content; INJECTION_GUARD on all prompts; AWS Bedrock
        DPA in place; training labels are already de-identified
      gaps: >
        No per-call PHI audit before tool-use re-submission; iterative
        nature of agentic loop increases total exposure volume vs pass-1 only
      confidence: "Probable"

    - id: "AUD-T-001"
      element: "scripts/opus_training_auditor.py (ToolExecutor + _agentic_audit_record)"
      threat: "Haiku sub-agent returns manipulated terminology results influencing SNOMED verdicts"
      status: "NEW"
      attack_vector: >
        If Haiku hallucinates or the Terminology API returns unexpected data,
        Haiku may return incorrect SNOMED recommendations. Opus, receiving
        these results in a toolResult block, may produce a high-confidence
        needs_review proposal for an incorrect concept. If a human reviewer
        accepts the proposal without independent verification, incorrect
        SNOMED codes enter training data.
      prerequisites: "Pass 2 agentic run with SNOMED needs_review entities"
      threat_actors: ["N/A - systemic AI reliability risk"]
      evidence:
        file: "scripts/opus_training_auditor.py"
        snippet: "_agentic_audit_record(): toolResult blocks built from ToolExecutor results"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: >
        SNOMED fields are structurally protected by READONLY_FIELDS in
        _classify_fixes(). Tool results produce proposals only. Human review
        is mandatory for all SNOMED proposals. However, a human reviewer
        could accept an incorrect proposal without independent verification.
      existing_controls: >
        READONLY_FIELDS enforcement in _classify_fixes() prevents SNOMED
        auto-fix; tool-use pass produces proposals only; audit trail records
        full tool call chain for human inspection; sanitise_for_prompt()
        applied to all API responses
      gaps: >
        No independent validation of Haiku's terminology API interpretation
        against the raw API response; relies on human reviewer to verify
        SNOMED proposals against authoritative browser
      confidence: "Probable"

    - id: "AUD-T-002"
      element: "scripts/opus_training_auditor.py (_agentic_audit_record, CostGuardrail)"
      threat: "Agentic loop cost amplification via crafted or pathological clinical text"
      status: "NEW"
      attack_vector: >
        Clinical text containing unusual combinations of clinical terms or
        ambiguous SNOMED mappings could cause Opus to repeatedly request
        terminology lookups without converging on a verdict, exhausting
        the 5-iteration cap and consuming maximum tokens per record. If
        many records in a batch trigger this pattern, cumulative costs
        may approach the dollar cap before the guardrail triggers.
      prerequisites: "Large batch audit run with many pathological records"
      threat_actors: ["N/A - systemic risk from training data distribution"]
      impact:
        confidentiality: "None"
        integrity: "None"
        availability: "Low"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: >
        Multiple independent controls limit cost: 5-iteration hard cap per
        record, per-run token budget, per-run dollar cap. The two-pass
        architecture limits pass-2 eligibility to SNOMED needs_review
        entities only.
      existing_controls: >
        Hard iteration cap of 5 per record in _agentic_audit_record();
        CostGuardrail tracks cumulative tokens and estimated cost;
        two-pass architecture minimises pass-2 eligibility population;
        default budgets: 2M tokens, $50 USD
      gaps: >
        No detection of adversarial text patterns that systematically trigger
        maximum tool-use iterations; no alerting when cost approaches cap
        threshold (only halts at cap)
      confidence: "Possible"

# ---------------------------------------------------------------------------
# COMPONENT 14: CONTEXT ENGINE & TIER CLASSIFIER (NEW in v2)
# ---------------------------------------------------------------------------
component_14_context_tier:
  name: "Context Engine & Tier Classifier"
  purpose: "MedSpaCy ConText assertion detection (negation, historical, hypothetical) and tier-based routing (auto-code vs HITL vs review). ConText is Layer 7 in the unified post-processing stack (libs/pipeline/post_processing.py). The 'discussed' ConText rule has been removed (discussion implies active management, not historical). The 'dna' rule is scoped to standalone usage only. Overlapping entities are processed in multiple ConText passes"
  iec_62304_contribution: "B"
  trust_boundaries: ["None (in-process)"]
  data_assets: "Clinical text, entity assertions, tier classifications"
  network_exposure: "Isolated"
  source_files:
    - "libs/pipeline/post_processing.py — unified post-processing stack (orchestrates all 9 layers)"
    - "libs/ner/context_engine.py (~234 lines)"
    - "libs/ner/resources/uk_primary_care_context_rules.json (~39 lines)"
    - "libs/coding_engine/tier_classifier.py (~115 lines)"

  phase_2_threats:
    - id: "CTX-T-001"
      element: "libs/ner/context_engine.py"
      threat: "Incorrect assertion detection leads to clinical entity suppression"
      status: "NEW in v2"
      attack_vector: >
        The context engine uses rule-based assertion detection (medspaCy ConText).
        Incorrect negation or historical detection suppresses entities that should be
        coded, or codes entities that should not be (e.g., 'family history of cancer'
        coded as present cancer). Assertion values feed directly into the tier
        classifier which determines auto-code vs HITL routing.
      prerequisites: "Clinical text with ambiguous context modifiers"
      threat_actors: ["N/A — systemic NLP accuracy risk"]
      evidence:
        file: "libs/ner/context_engine.py"
        snippet: "On error, marks entities as 'possible' (safe fallback)"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: false
      likelihood: "Medium"
      likelihood_rationale: "Rule-based context detection has known limitations with complex sentence structures. UK primary care free-text is often abbreviated and non-standard."
      existing_controls: "Error fallback to 'possible'; custom UK primary care rules (declined, cancelled, historical); entities with non-present assertions routed to Tier 2/3 (HITL review)"
      gaps: "No quantified accuracy metrics for assertion detection on UK primary care text; no ongoing monitoring of assertion error rates"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 62304"
          clause: "5.5"
          nature: "NLP-driven clinical classification without quantified accuracy"

    - id: "TIER-T-001"
      element: "libs/coding_engine/tier_classifier.py"
      threat: "Tier classification thresholds determine clinical safety boundary"
      status: "NEW in v2"
      attack_vector: >
        The tier classifier routes entities to Tier 1 (auto-code), Tier 2 (HITL review),
        or Tier 3 (manual review). Threshold values (_TIER1_SCORE_THRESHOLD=0.95,
        _TIER2_SCORE_THRESHOLD=0.70) are hardcoded. An incorrect threshold could
        auto-code entities that should be reviewed, or overwhelm reviewers with
        unnecessary Tier 2/3 items.
      prerequisites: "N/A — systemic calibration risk"
      threat_actors: ["N/A — configuration risk"]
      evidence:
        file: "libs/coding_engine/tier_classifier.py"
        snippet: "_TIER1_SCORE_THRESHOLD = 0.95; _TIER2_SCORE_THRESHOLD = 0.70"
      impact:
        confidentiality: "None"
        integrity: "Medium"
        availability: "None"
        clinical_safety: "High"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Thresholds are conservative (95% for auto-code). Non-present assertions automatically block Tier 1. Disorder verifier verdict gates auto-coding."
      existing_controls: "High Tier 1 threshold (0.95); _AUTO_CODE_BLOCKED set for non-present/uncertain assertions; disorder verifier gate; HITL mode blocks all auto-coding"
      gaps: "Thresholds hardcoded; no mechanism to tune per deployment; no ongoing threshold calibration against clinical outcomes"
      confidence: "Probable"
      regulatory_impact:
        - standard: "IEC 62304"
          clause: "5.3"
          nature: "Clinical safety thresholds not configurable or validated per deployment"
        - standard: "ISO 14971"
          clause: "5.5"
          nature: "Risk control thresholds require ongoing calibration"

