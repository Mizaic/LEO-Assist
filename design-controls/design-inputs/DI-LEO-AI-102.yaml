# -- DI-LEO-AI-102 -- Analytics Assertion Filter
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-102"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The system SHALL exclude coded clinical entities with a non-confirmed
    assertion (i.e. assertions other than 'present' or 'historical') from
    all analytics computations, including Charlson Comorbidity Index (CCI)
    scoring and cohort condition/smoking-status filters. A coalesce guard
    SHALL treat a missing assertion as 'present'.
  rationale: >
    Coded entities carry an assertion value (present, absent, historical,
    possible, hypothetical, family) that reflects clinical certainty.
    Using absent or hypothetical conditions in risk-stratification or cohort
    selection produces clinically misleading outputs: a patient documented as
    having NO diabetes should not be scored as diabetic, and should not be
    included in a diabetic cohort. The fix ensures analytics respect the same
    assertion semantics enforced by the ConText pipeline.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          CCI Cypher query aliases the :DOCUMENTS relationship and filters
          with coalesce(r.assertion, 'present') IN ['present', 'historical'].
      - type: "functional"
        spec: >
          Cohort condition_codes EXISTS clause filters with
          coalesce(r.assertion, 'present') IN ['present', 'historical'].
      - type: "functional"
        spec: >
          Cohort smoking_status (ever_smoker and current_smoker) EXISTS clauses
          apply the same assertion guard.
      - type: "safety"
        spec: >
          An entity with assertion='absent' MUST NOT increase a patient's CCI
          score or match a cohort condition filter.
    constraints:
      - type: "safety"
        spec: >
          A missing (null) assertion on the :DOCUMENTS relationship must default
          to 'present' via coalesce, preserving backwards compatibility with
          encounters coded before assertion tracking was introduced.
    dependencies: []
    downstream_impacts:
      - "CCI risk-stratification scores"
      - "Cohort patient selection"
      - "NHS screening programme presets"

  technical_details:
    language: "Python"
    framework: "FastAPI / Neo4j Cypher"
    file_structure:
      - "services/analytics_api/app/routers/cci.py"
      - "services/analytics_api/app/routers/cohorts.py"
    estimated_loc: 15

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 12 pytest test cases in VT-LEO-AI-102 pass, including query-structure
      inspection tests and logic tests for present, historical, and absent
      assertion scenarios.
    test_protocol: "VT-LEO-AI-102"

  safety_class: "B"
  risks: ["R-LEO-AI-070"]
  tags:
    - "analytics"
    - "cci"
    - "cohort"
    - "assertion"
