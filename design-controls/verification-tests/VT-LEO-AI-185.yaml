# -- VT-LEO-AI-185 -- :Chunk node + DOCUMENTS writer generalisation
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-185"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-186", "DI-LEO-AI-187"]
    risks: ["R-LEO-AI-180"]

  metadata:
    title: "Chunk id determinism + UPSERT_CHUNK shape + generalised DOCUMENTS writer (Encounter|Chunk source) with null-safe FOREACH"
    description: >
      Pins the chunk schema foundation: deterministic Chunk.id from
      (document_reference_id, ordinal, sha256(text)); UPSERT_CHUNK
      Cypher parameter shape; generalised :DOCUMENTS source upsert
      query that supports source_label='Encounter' and 'Chunk', uses
      OPTIONAL MATCH for the Patient on chunk paths, and guards the
      Patient-level FOREACH with `p IS NOT NULL`.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_chunk_documents_queries.py"
      - "tests/test_documents_sentence_evidence_mapping.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.11+ / pytest 8+"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-185-TC-001"
      case_name: "make_chunk_id is deterministic on (document_reference_id, ordinal, sha256(text))"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Generate chunk_id twice for identical inputs and compare"
          expected_result: "Both ids are equal and have a stable prefix shape"
          verification_method: "automated"
      acceptance_criteria:
        - "Equality on identical inputs"
        - "Inequality on a single bit flip in any input"

    - case_id: "VT-185-TC-002"
      case_name: "UPSERT_CHUNK Cypher parameter shape matches the writer call"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect UPSERT_CHUNK keyword set vs the parameters supplied"
          expected_result: "All required keys present; no orphan placeholders"
          verification_method: "automated"
      acceptance_criteria:
        - "Parameter set equality"

    - case_id: "VT-185-TC-003"
      case_name: "_build_upsert_query('Encounter') keeps the legacy MATCH (e:Encounter)..."
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build the query with source_label='Encounter' and assert the MATCH clause shape"
          expected_result: "MATCH (src:Encounter {id: $source_id})<-[:HAS_ENCOUNTER]-(p:Patient)"
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy behaviour preserved"

    - case_id: "VT-185-TC-004"
      case_name: "_build_upsert_query('Chunk') uses OPTIONAL MATCH for Patient and null-safe FOREACH"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build the query with source_label='Chunk' and assert OPTIONAL MATCH and FOREACH guard"
          expected_result: "OPTIONAL MATCH (src)<-[:HAS_CHUNK]-(:DocumentReference)<-[:HAS_DOCUMENT_REFERENCE]-(p:Patient); FOREACH guarded by `p IS NOT NULL`"
          verification_method: "automated"
      acceptance_criteria:
        - "OPTIONAL MATCH present"
        - "Null-safe FOREACH present"

    - case_id: "VT-185-TC-005"
      case_name: "Unknown source_label is rejected"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Call _build_upsert_query with source_label='SomethingElse'"
          expected_result: "ValueError raised"
          verification_method: "automated"
      acceptance_criteria:
        - "Type guard fires"

    - case_id: "VT-185-TC-006"
      case_name: "write_documents_from_sentences_payload forwards source_id (not encounter_id)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Capture session calls and assert kwargs include source_id"
          expected_result: "kwargs.source_id present; encounter_id no longer used"
          verification_method: "automated"
      acceptance_criteria:
        - "Backwards-compatible call signature for existing callers"

    - case_id: "VT-185-TC-007"
      case_name: "ASSESSMENT/CHUNK schema constraints are registered"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Inspect CHUNK_CONSTRAINTS list"
          expected_result: "UNIQUE constraint on Chunk.id and indexes on document_reference_id and sha256 are emitted"
          verification_method: "automated"
      acceptance_criteria:
        - "Constraint list non-empty and shaped as expected"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-185/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-LEO-AI-185-EXEC-001"
      executed_at: "2026-04-17"
      executor: "automated-pytest"
      command: "python3 -m pytest tests/test_chunk_documents_queries.py tests/test_documents_sentence_evidence_mapping.py -v"
      result: "pass"
      summary: "All chunk + DOCUMENTS-writer cases passed"
