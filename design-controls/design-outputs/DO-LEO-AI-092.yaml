# -- DO-LEO-AI-092 -- WorkflowEngine Production Cutover Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-092"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-094"]
    user_needs: ["UN-LEO-AI-012"]
    risks_addressed: ["R-LEO-AI-015"]
    verification_tests: ["VT-LEO-AI-094"]

  specification:
    title: "Production Coding Worker WorkflowEngine Routing"
    description: |
      Implements production cutover from CodingPipeline to WorkflowEngine for
      coding jobs. Adds encounter_loader subgraph to hydrate encounter text
      from Neo4j during runtime, removes encounter text from queue payloads,
      and keeps SSE progress compatibility through Redis pub/sub events.
    acceptance_criteria:
      - criterion: "Engine-only execution"
        type: "functional"
        measurement: "Test"
        target: "Coding worker dispatches production jobs via WorkflowEngine and ServiceBusEventHandler"
      - criterion: "Encounter hydration in-graph"
        type: "functional"
        measurement: "Test"
        target: "encounter_loader subgraph loads Encounter.text from Neo4j before extraction"
      - criterion: "Queue payload hardening"
        type: "safety"
        measurement: "Inspection and test"
        target: "No encounter_text field exists in published coding queue messages"
      - criterion: "Progress streaming compatibility"
        type: "functional"
        measurement: "Test"
        target: "Redis pipeline:{run_id} receives step_completed and run_completed events"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/coding_worker/app/services/job_handler.py"
        description: "Routes coding jobs through WorkflowEngine and publishes progress events"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/workflow/engine.py"
        description: "Adds step callback and prompt name/version fallback resolution"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/workflow/events.py"
        description: "Forwards optional step callback from service bus handler"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/encounter_loader.py"
        description: "Loads encounter text from Patient Graph using encounter_id"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/registry.py"
        description: "Registers encounter_loader subgraph"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/api/app/routers/pipeline.py"
        description: "Stops publishing encounter_text in queue body/context"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_plan_definitions.py"
        description: "Seeds encounter loader step and prompt_config_id wiring for extraction"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/coding_worker/app/pipeline/pipeline_service.py"
        description: "Removed from production path"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 500
      key_functions:
        - "handle_coding_job"
        - "_run_coding_job"
        - "WorkflowEngine.handle_event"
        - "ServiceBusEventHandler.handle_message"
        - "load_encounter"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Consistent PlanDefinition-driven production orchestration"
      - "AuditEvent generation for production pipeline actions"
      - "Reliable run failure signaling through progress events"
    risk_control_measures:
      - "Engine callback publishes explicit run_error and run_completed events"
      - "Encounter text fetched from source of truth at execution time"
      - "Prompt config fallback avoids silent empty prompt binding"

  verification_status:
    verification_method: "Test"
    verification_complete: false
