# -- DI-LEO-AI-124 -- Milestone temporal integrity: referral-to-diagnosis gap + PRISM primacy
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-124"
  type: "Safety"
  derived_from: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
  requirement: >
    The episode builder SHALL enforce a minimum referral-to-diagnosis gap of
    MIN_REFERRAL_TO_DIAG_DAYS days (default 3) when selecting the best-match
    referral for a diagnosis anchor. Referrals falling inside the gap SHALL be
    skipped by _find_best_referral so an earlier-but-valid referral is
    preferred over a clinically implausible same-day or next-day referral.

    The anchor detector SHALL emit PRISM-finalised 2WW referrals as a
    distinct referral_subtype="prism" anchor with confidence 0.9, while
    generic text-referral phrases continue to emit referral_subtype=
    "text_generic" with confidence 0.6. When both a PRISM and a generic
    referral exist on the same encounter, the PRISM anchor takes
    precedence.
  rationale: >
    NCDA ground-truth investigation showed multiple episodes where a
    referral and diagnosis were assigned the same date (patients
    4200797127, 4245139757, 4469113522, 6040304227, 6507904570) because
    the diagnosis encounter's text contains fast-track language that
    the regex treats as a fresh referral. A minimum temporal gap both
    prevents this false-positive class and forces the detector to find
    the earlier authoritative referral. Separately, PRISM (the Welsh
    2WW digital proforma) has a finalised timestamp that is the
    authoritative referral trigger; generic fast-track language in
    clinic notes is weaker evidence and should not overshadow PRISM
    when both are present.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "MIN_REFERRAL_TO_DIAG_DAYS configurable via EPISODE_MIN_REFERRAL_TO_DIAG_DAYS env var, default 3"
      - type: "safety"
        spec: "_find_best_referral skips referrals where (diag_date - ref_date) < MIN_REFERRAL_TO_DIAG_DAYS"
      - type: "safety"
        spec: "When only a sub-gap referral exists, diagnosis-led grouping looks further back up to DIAG_LOOKBACK_DAYS and returns the earlier match"
      - type: "functional"
        spec: "_RE_REFERRAL_PRISM regex matches PRISM proforma finalised/submitted/completed phrasings"
      - type: "functional"
        spec: "PRISM referral anchors carry referral_subtype='prism' and confidence 0.9"
      - type: "functional"
        spec: "Generic text referral anchors carry referral_subtype='text_generic' and confidence 0.6"
      - type: "functional"
        spec: "When PRISM and generic match the same encounter, only the PRISM anchor is emitted (dedupe by encounter_id preferring higher confidence)"
    constraints:
      - type: "safety"
        spec: "The minimum gap must not cause legitimate same-day-referral-and-diagnosis scenarios to lose all referral evidence; the diagnosis-led pass still records the episode and reconciliation falls back to the nearest valid-gap referral or no referral."
    dependencies: ["DI-LEO-AI-010", "DI-LEO-AI-084"]
    downstream_impacts:
      - "services/analysis_worker anchor_detector text classifier"
      - "services/analysis_worker episode_builder _grouping._find_best_referral"
      - "analytics_api dashboards referral -> diagnosis interval calculations"

  technical_details:
    language: "Python"
    framework: "pytest"
    file_structure:
      - "services/analysis_worker/app/analyzers/anchor_detector.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_config.py"
      - "services/analysis_worker/app/analyzers/episode_builder/_grouping.py"
    estimated_loc: 120

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-119 test cases pass: same-day referral skipped, earlier
      referral selected when present, PRISM anchor emitted with correct
      confidence, dedupe rule prefers PRISM, no regression in existing
      episode builder tests.
    test_protocol: "VT-LEO-AI-119"

  safety_class: "B"
  risks: ["R-LEO-AI-084"]
  tags: ["episode", "referral", "anchor", "temporal-integrity", "prism"]
