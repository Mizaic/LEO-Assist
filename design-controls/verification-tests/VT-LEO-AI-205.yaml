# -- VT-LEO-AI-205 -- Patient detail Encounter text overlay-first navigation
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-205"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-213"]
    risks: ["R-LEO-AI-174"]

  metadata:
    title: "Overlay-first patient detail Encounter text tab"
    description: >
      Verifies that the Mission Control patient detail Encounter
      text tab no longer exposes scope chips or accordion sections,
      that the encounter list is a single chronological feed
      filtered only by the histogram brush, the Coded-only switch
      and the Search field, that linked encounters carry an
      "In episode" chip, that the histogram surfaces the episode
      via a tightened band plus per-encounter linked ticks plus
      milestone markers, and that the brush opens defaulted to
      the padded episode-linked window.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/mission-control/EncounterTimelineScrubber.test.tsx"
      - "services/ui/src/__tests__/mission-control/EncounterTextTab.test.tsx"
      - "services/ui/src/__tests__/mission-control/EncounterTextTab-timeline-filter.test.tsx"
      - "services/ui/src/__tests__/mission-control/EncounterTextTab-scrubber-chrome.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest setup with @leo/design-system path mapping"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-205-TC-CHROME-001"
      case_name: "Scope chips and accordions are removed from EncounterTextTab"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it contains no 'Episode linked (', 'Episode window (', 'All encounters (' string literals, no <Accordion ...> nodes, no setScope state setter, and no splitEncounters import."
          expected_result: "All four regex matches return false."
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy scope filter chrome is fully gone."

    - case_id: "VT-205-TC-CHROME-002"
      case_name: "Coded only switch and Search field are kept"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it still defines the Coded only switch label and the 'Search text in shown encounters' field."
          expected_result: "Both regex matches return true."
          verification_method: "automated"
      acceptance_criteria:
        - "The two retained controls are present in the source."

    - case_id: "VT-205-TC-CHROME-003"
      case_name: "Brush state defaults to padded episode-linked window"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it defines episodeLinkedRange, padRange, and a defaultRangeAppliedRef keyed by episode_id."
          expected_result: "All three regex matches return true."
          verification_method: "automated"
      acceptance_criteria:
        - "Default-brush wiring is in source."

    - case_id: "VT-205-TC-CHROME-004"
      case_name: "Visible encounters use applyCommonFilters with the brush range"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it calls applyCommonFilters(encounters, { ...timelineRange... })."
          expected_result: "Regex matches."
          verification_method: "automated"
      acceptance_criteria:
        - "Single filter pipeline drives the visible list."

    - case_id: "VT-205-TC-CHROME-005"
      case_name: "Episode-linked encounters render an In episode chip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EncounterTextTab.tsx and assert it passes isLinkedToEpisode={isLinked} into EncounterCard."
          expected_result: "Regex matches."
          verification_method: "automated"
      acceptance_criteria:
        - "Linked cards carry the new chip prop."

    - case_id: "VT-205-TC-OVERLAY-001"
      case_name: "Scrubber accepts a milestones prop"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx and assert the Props interface declares milestones?: Array<{ milestone_type: string; ... }>."
          expected_result: "Regex matches."
          verification_method: "automated"
      acceptance_criteria:
        - "Milestones prop is part of the public surface."

    - case_id: "VT-205-TC-OVERLAY-002"
      case_name: "Episode band is derived from linked-encounter dates"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx and assert linkedTicks is defined, the source contains a 'Tightened episode band' comment, and toTimestamp(episodeFrom) is no longer used."
          expected_result: "All three regex matches behave as asserted."
          verification_method: "automated"
      acceptance_criteria:
        - "Tightened episode band derivation is in source."

    - case_id: "VT-205-TC-OVERLAY-003"
      case_name: "Per-encounter linked ticks and milestone markers render"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx and assert it renders <LinkedEncounterTicks .../> and <MilestoneMarkers .../>; read TimelineOverlays.tsx and assert the two corresponding data-testid string literals are present."
          expected_result: "All four regex matches return true."
          verification_method: "automated"
      acceptance_criteria:
        - "Both overlays are wired into the histogram."

    - case_id: "VT-205-TC-OVERLAY-004"
      case_name: "Caption copy reflects brush as a viewing tool"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Read EncounterTimelineScrubber.tsx and assert the new caption 'widen or narrow your view' is present and the previous 'drag the focus band to filter' substring is absent."
          expected_result: "First regex matches; second does not."
          verification_method: "automated"
      acceptance_criteria:
        - "Caption is updated."

    - case_id: "VT-205-TC-OVERLAY-005"
      case_name: "Milestone markers expose accessible labels and keyboard activation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read TimelineOverlays.tsx and assert the marker has aria-label of the form 'Milestone: ... on ...' and an onKeyDown handler that activates on Enter."
          expected_result: "Both regex matches return true."
          verification_method: "automated"
      acceptance_criteria:
        - "Markers meet the keyboard accessibility bar."

    - case_id: "VT-205-TC-LIVE-001"
      case_name: "Tab renders no scope chips or accordions; Coded only and Search remain"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTextTab with three encounters (one milestone-linked) and assert (a) no element matching 'Episode linked (', 'Episode window (', 'All encounters (', 'Other encounters in episode window' or 'All other patient encounters' is in the document, and (b) the 'Coded only' switch and the 'Search text in shown encounters' field both render."
          expected_result: "Assertions hold."
          verification_method: "automated"
      acceptance_criteria:
        - "Legacy chrome is gone from the live render."

    - case_id: "VT-205-TC-LIVE-002"
      case_name: "Linked cards render the In episode chip"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render EncounterTextTab with a milestone-linked encounter and assert at least one element with data-testid='encounter-in-episode-chip' renders."
          expected_result: "Chip count > 0."
          verification_method: "automated"
      acceptance_criteria:
        - "Linkage is visible inline on the card."

    - case_id: "VT-205-TC-LIVE-003"
      case_name: "Default brush is initialised to the padded episode window"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTextTab with six encounters (three linked spanning a 3-month window inside an 8-month patient history) and assert (a) the timeline-filter-banner is in the document on first render and (b) the visible encounter cards include the three linked encounters and exclude the latest unrelated one."
          expected_result: "Assertions hold."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer opens the tab pre-focused on the episode plus a bit of context."

    - case_id: "VT-205-TC-LIVE-004"
      case_name: "Clearing the brush filter shows every patient encounter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "From the default-brush state, click the Clear button on the timeline-filter-banner; assert the banner is gone and every patient encounter is rendered."
          expected_result: "All cards visible after clear."
          verification_method: "automated"
      acceptance_criteria:
        - "The brush is the only spatial filter and is reversible."

    - case_id: "VT-205-TC-LIVE-005"
      case_name: "Dragging the brush narrows the encounter list"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "From the default-brush state, focus the from handle of the timeline-range-brush and press ArrowRight (with Shift) twice; assert the visible card count drops and the timeline-filter-banner remains in the document."
          expected_result: "Card count decreases."
          verification_method: "automated"
      acceptance_criteria:
        - "Brush manipulation is the single live filter."

    - case_id: "VT-205-TC-LIVE-006"
      case_name: "Jumping via a single-bin click clears the brush filter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "From the default-brush state, click the Aug 24 single-bin bar; assert the timeline-filter-banner is gone and the August encounter is visible."
          expected_result: "Filter cleared, target visible."
          verification_method: "automated"
      acceptance_criteria:
        - "jumpToEncounter clears the filter so the target is always visible."

    - case_id: "VT-205-TC-LIVE-007"
      case_name: "Per-encounter linked tick is drawn for each linked encounter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with two linked encounters; assert exactly two elements with data-testid='timeline-linked-tick' render and their data-encounter-id values match the linked set."
          expected_result: "Tick count == linked count and ids match."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer can read which bars are episode-linked at a glance."

    - case_id: "VT-205-TC-LIVE-008"
      case_name: "Linked ticks absent when no linked encounters"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with linkedEncounterIds = empty Set; assert no elements with data-testid='timeline-linked-tick' render."
          expected_result: "Tick count == 0."
          verification_method: "automated"
      acceptance_criteria:
        - "Overlay collapses when there is no linked footprint."

    - case_id: "VT-205-TC-LIVE-009"
      case_name: "Milestone markers render with accessible labels and jump on click"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with two milestones; assert two elements with data-testid='timeline-milestone-marker' render; assert the gp_referral marker has aria-label /^Milestone: Referred on /; click the marker and assert the supplied onJumpToEncounter handler is called with the milestone's encounter_id."
          expected_result: "Markers render, label matches, handler invoked."
          verification_method: "automated"
      acceptance_criteria:
        - "Milestone markers are spatial AND interactive."

    - case_id: "VT-205-TC-LIVE-010"
      case_name: "Milestone markers absent when no milestones provided"
      priority: "medium"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with milestones = empty array; assert no timeline-milestone-marker elements render."
          expected_result: "Marker count == 0."
          verification_method: "automated"
      acceptance_criteria:
        - "Overlay collapses when no milestones are present."

    - case_id: "VT-205-TC-LIVE-011"
      case_name: "Episode window band tracks the linked footprint, not the loose envelope"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render EncounterTimelineScrubber with linked encounters present; assert data-testid='timeline-window-band' is in the document. Re-render with an empty linkedEncounterIds Set; assert the band is absent."
          expected_result: "Band presence tracks the linked-encounter set."
          verification_method: "automated"
      acceptance_criteria:
        - "Band reflects the actual episode footprint."

    - case_id: "VT-205-TC-LIVE-012"
      case_name: "Milestone chip click clears the brush filter"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "From the default-brush state in EncounterTextTab, click a milestone Chip in the row above the timeline; assert the timeline-filter-banner disappears and the milestone Chip is highlighted as primary."
          expected_result: "Filter cleared, chip highlighted."
          verification_method: "automated"
      acceptance_criteria:
        - "Milestone navigation continues to work without the scope chips."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-205/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-18"
      executor: "automated:jest (services/ui)"
      result: "pass"
      summary: >
        v1.0 (initial). Implements DI-LEO-AI-213: scope chips and
        accordions removed from the patient detail Encounter text
        tab; the encounter list becomes a single chronological feed
        filtered only by the histogram brush, the Coded-only switch
        and the Search field. Linked encounters render an
        In-episode chip and a 3px coloured left accent. The
        histogram now overlays the episode in three layers: the
        existing tinted band tightened to first-linked..last-linked
        encounter dates, per-encounter linked ticks (one per
        linked encounter), and milestone markers (with tooltip,
        accessible label, and Enter / Space activation). The
        scrubber accepts a milestones prop. The default brush is
        initialised to the padded episode-linked footprint
        (10 percent of the patient history span on each side,
        clamped to the patient range) on first render and on every
        episode_id change. jumpToEncounter clears codedOnly,
        search and timelineRange before scrolling, and the
        scrollIntoView call is guarded by a function-type check
        so jsdom-driven tests do not crash. The recode flow was
        lifted into useEncounterRecode.ts to keep
        EncounterTextTab.tsx at 472 / 500 LOC. Targeted run:
        npx jest --testPathPatterns "EncounterTextTab|EncounterTimelineScrubber"
        --no-coverage -- 4 suites / 65 cases all passing. Wider
        mission-control sweep: npx jest --testPathPatterns
        mission-control --no-coverage -- 11 suites / 113 cases all
        passing.
      defects_found: 0
      followups: []
