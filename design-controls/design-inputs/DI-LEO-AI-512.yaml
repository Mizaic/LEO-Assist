# -- DI-LEO-AI-512 -- Stepped widescreen rule editor (Change this rule)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-512"
  type: "Usability"
  derived_from:
    - "UN-LEO-AI-094"
  requirement: >
    The "Change this rule" dialog
    (services/ui/src/app/admin/guidance/EditRuleDialog/index.tsx)
    SHALL be restructured as a widescreen split-view modal with
    three columns: a sticky left-hand numbered step rail, a focused
    centre canvas that renders one step at a time, and a sticky
    right-hand live "What this rule means" preview pane. The four
    steps SHALL be (in order): "Who is this rule about?",
    "What should the system suggest?", "Try it on real patients",
    "Save your change". The dialog SHALL preserve the existing
    save payload contract (action='edit' POST to
    /api/guidance/rules/review/{id}/decision with name, strength,
    logic_tree without node ids, reason, and -- only when the
    reviewer touched the action chip -- the action SNOMED criterion).
    All chrome copy (step titles, helpers, rail labels, ready-state
    chips) SHALL meet UK reading age 7-11.
  rationale: >
    The previous one-column layout presented nine concerns at once
    inside a 1200px modal. Non-specialist reviewers (audit clerks,
    junior coders, clinical leads with no AI / NLP background) lost
    their place and could not tell whether their edit had done what
    they intended without parsing the logic tree by hand. Splitting
    the editor into four focused steps with a continuous
    plain-English mirror brings the cognitive load into a range a
    UK reading-age 9-11 user can actually carry, and matches the
    "Step Rail + canvas + preview" pattern already in use on
    other admin surfaces.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          The dialog renders with maxWidth="xl" and a CSS grid
          gridTemplateColumns of three columns at the md
          breakpoint and above; on xs the columns collapse to a
          vertical stack so the dialog is usable on tablets and
          phones in the audit kiosk fleet.
      - type: "functional"
        spec: >
          A StepRail navigation primitive renders four numbered
          steps (id: who / suggest / try / save). Each step
          displays one of three states (Not started / In progress /
          Ready) computed deterministically from the dialog state
          (tree validity, action chip presence, reason length).
      - type: "functional"
        spec: >
          The current step gets a 3px-wide left accent strip and a
          12px corner radius on its rail card, matching the
          canonical conventions in design-system-ui.mdc. The strip
          uses the design-system primary token, never a raw hex.
      - type: "functional"
        spec: >
          A LivePreviewPane renders the SummaryCard (treeToSentence
          output) plus a one-sentence "What the system will do"
          recap built from STRENGTH_LABELS and the action SNOMED
          friendly term. On step 4 the pane swaps to a
          two-column "Before / After" variant computed from
          rule.logic_tree (before) and the edited tree (after).
      - type: "functional"
        spec: >
          The footer DialogActions is sticky and contains, in
          order: Cancel | Back | Next | Save changes. Save changes
          is the single primary action and is disabled until
          (a) the rule passes findValidationError AND
          (b) reason.trim().length >= 3 AND
          (c) saving === false. Back / Next jump between
          adjacent steps; jumping the rail is also allowed.
      - type: "safety"
        spec: >
          The save payload contract MUST be unchanged from the
          previous editor: action='edit', updates={ name,
          strength, logic_tree (node_ids stripped) }, reason. The
          action SNOMED criterion is omitted when actionDirty is
          false so the server preserves the predecessor's
          actionJson unchanged.
      - type: "safety"
        spec: >
          The duplicate-set alert (findDuplicateConceptGroups), the
          NICE source toggle, the concept-coach popover, the
          synonym chip editor, and the test-patients sandbox replay
          MUST remain reachable and functional. They move to step
          1 (alerts + tree + coach + NICE source + synonyms) and
          step 3 (sandbox replay) respectively; their internal
          contracts are unchanged.
      - type: "performance"
        spec: >
          Switching steps MUST not trigger a network call.
          Rendering the dialog with a tree of <= 30 nodes MUST
          not regress versus the previous one-column editor on
          the live-render Jest harness.
    constraints:
      - type: "safety"
        spec: >
          All chrome copy MUST meet UK reading age 7-11. SNOMED
          preferred terms inside chips and Use this buttons stay
          verbatim because they are the source of truth.
      - type: "safety"
        spec: >
          The Save changes button MUST never be enabled unless the
          reason has been entered, regardless of which step the
          reviewer is currently on. canSave depends on reason
          length and tree validity, not on the current step.
    dependencies: []
    downstream_impacts:
      - "services/ui/src/app/admin/guidance/EditRuleDialog/* (all sub-modules)"
      - "services/ui/src/app/admin/guidance/page.tsx (consumer)"
    technical_details:
      language: "TypeScript"
      framework: "React + Next.js + MUI + @leo/design-system"
      file_structure:
        - "services/ui/src/app/admin/guidance/EditRuleDialog/index.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/StepRail.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/LivePreviewPane.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/steps/Step1Who.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/steps/Step2Suggest.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/steps/Step3Try.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/steps/Step4Save.tsx"
        - "services/ui/src/app/admin/guidance/EditRuleDialog/copy.ts"
      estimated_loc: 950

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-511 covers static-source registration of the new
      file structure, live-render Jest cases per step
      (rail navigation, live preview update, save gating, before /
      after diff), preservation of the legacy save-payload contract
      and a reading-age sweep on the new chrome strings in copy.ts.
    test_protocol: "VT-LEO-AI-511"

  safety_class: "B"
  risks:
    - "R-LEO-AI-509"
  tags:
    - "ui"
    - "guidance"
    - "rule-editor"
    - "step-by-step"
    - "health-literacy"
    - "design-system"
