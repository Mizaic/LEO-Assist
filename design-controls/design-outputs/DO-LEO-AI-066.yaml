  specification:
    title: "Admin Guidance UI -- Plain Language Guideline Management"
    description: |
      Four-file Next.js/MUI implementation: orchestrator page.tsx with one h1;
      NiceLoaderSection with Autocomplete catalogue search + SSE ingest progress;
      RuleReviewSection with plain-English HITL review cards and ConfirmDialog
      for bulk approve; BitmapLifecycleSection with version accordion and
      ConfirmDialog for activate. AppShell.tsx updated with Guidance nav item.
      All copy targets reading age 11. All fetch errors surface via Alert.
    purpose: "Self-service admin UI for the complete NICE guideline management workflow"
    technical_approach: "Next.js App Router + MUI + fetch + SSE + SectionCard pattern"
    acceptance_criteria:
      - criterion: "Plain language"
        type: "functional"
        measurement: "Review"
        target: "All section headings, button labels, and descriptions pass reading age 11 check"
      - criterion: "Safety gates"
        type: "safety"
        measurement: "Test"
        target: "ConfirmDialog shown before approve-all and before activate"
      - criterion: "Error handling"
        type: "functional"
        measurement: "Test"
        target: "Failed fetch in any section renders Alert severity=error"

  implementation:
