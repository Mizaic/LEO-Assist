# -- VT-LEO-AI-179 -- GoldLabelDetailDialog re-key + state resync
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-179"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-185"]
    risks: ["R-LEO-AI-179"]

  metadata:
    title: "GoldLabelDetailDialog mounts carry stable label_id-derived key prop AND body resyncs entity-derived state on item change"
    description: >
      Static-source verification that pins the two-layer fix for
      the dialog stale-state regression class observed on
      2026-04-17 (GL-d3ffb211468a5bcf rendering "Flexible
      cystoscopy" against an unrelated breast-USS sentence).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/gold-label-detail-dialog-rekey.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node 20+ / jest 30 / ts-jest"
    test_data:
      data_type: "static-source"
      cleanup_required: false

  test_cases:
    - case_id: "VT-179-TC-001"
      case_name: "Every GoldLabelDetailDialog JSX mount carries a key prop"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx as a string and match every <GoldLabelDetailDialog ... /> JSX block"
          expected_result: "At least 4 mounts found; every mount contains a key={...label_id...} expression"
          verification_method: "automated"
      acceptance_criteria:
        - "Regex /key\\s*=\\s*\\{[^}]*label_id[^}]*\\}/ matches inside every mount"

    - case_id: "VT-179-TC-002"
      case_name: "Each key uses a distinct namespace prefix to avoid collisions across surfaces"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Extract the leading namespace token of each key value"
          expected_result: "{gold, syn, cand, sim} all present"
          verification_method: "automated"
      acceptance_criteria:
        - "Set of leading prefixes contains gold, syn, cand, sim"

    - case_id: "VT-179-TC-003"
      case_name: "Dialog body declares useEffect that resyncs on item.label_id change"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Slice the dialog body and match useRef(item.label_id) + useEffect with deps [item.label_id, item.entities_json]"
          expected_result: "Both regexes match"
          verification_method: "automated"
      acceptance_criteria:
        - "prevLabelIdRef.current pattern present in effect body"

    - case_id: "VT-179-TC-004"
      case_name: "Resync effect calls setEntities + setRejectedRelationKeys + clears suggestions/drafts/lookup"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect the effect body string"
          expected_result: "All required setters present"
          verification_method: "automated"
      acceptance_criteria:
        - "setEntities, setRejectedRelationKeys, setSuggestions({}), setTermDrafts({}), setLookupTarget(null) all present"

    - case_id: "VT-179-TC-005"
      case_name: "Lazy useState initialiser is preserved (mount-time fast path)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Match the lazy useState pattern"
          expected_result: "useState<Entity[]>(() => parseEntities(item.entities_json)) present"
          verification_method: "automated"
      acceptance_criteria:
        - "Lazy initialiser pattern matches"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-179/"
