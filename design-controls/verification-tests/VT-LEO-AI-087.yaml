  metadata:
    title: "Specialist outcome letter milestone and inferred benign completion"
    description: >
      Verifies specialist_outcome_letter anchor classification from
      document_transfer + clinic_letter text rows and episode_builder inference
      rules including treatment-window guards and temporal threshold guard.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_anchor_detector.py"
      - "tests/test_episode_builder.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-087-TC-001"
      case_name: "Clinic letter document_transfer produces specialist_outcome_letter anchor"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters with a document_transfer row purpose clinic_letter"
          expected_result: "specialist_letters list has one anchor with concept_id 308470004"
          verification_method: "automated"
      acceptance_criteria:
        - "len(specialist_letters) == 1"
    - case_id: "VT-087-TC-002"
      case_name: "Inference completes open episode when letter and no post-letter treatment after stale threshold"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "build_episodes with referral, specialist visit, letter anchors; mock today > 90d after visit; no treatment after letter"
          expected_result: "Episode MERGE uses status completed and hitl_flag true"
          verification_method: "automated"
      acceptance_criteria:
        - "status == completed"
    - case_id: "VT-087-TC-003"
      case_name: "Post-letter treatment blocks inference"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Same as TC-002 but add treatment anchor within 120 days after letter"
          expected_result: "Episode remains in_progress"
          verification_method: "automated"
      acceptance_criteria:
        - "status == in_progress"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-087/"
