# -- DO-LEO-AI-120 -- Coding review modal split and inclusive redesign
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-120"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-123"]
    user_needs: ["UN-LEO-AI-067", "UN-LEO-AI-068"]
    risks_addressed: ["R-LEO-AI-083"]
    verification_tests: ["VT-LEO-AI-118"]

  specification:
    title: "Coding review modal split and plain-language redesign"
    description: |
      This output refactors the 1123-line
      CodingReviewCasesModal.tsx into five modules, each at or
      below 500 lines, preserves the public API, and surfaces
      plain-language explanations via shared primitives:

      - CodingReviewCasesModal.tsx -- the dialog shell, bulk
        actions, label menu, and orchestration of CaseCards.
      - CaseCard.tsx -- per-case UI: Ask LEO, accept, code,
        suppress, assertion correction.
      - EncounterContextPanel.tsx -- the siblings widget for
        context from the same encounter.
      - codingReviewUtils.ts -- pure helpers (safety warning
        detection, extractSuggestedPhrase, keyframes).
      - codingReviewCopy.ts -- all PageIntro copy and glossary
        keys used on this screen.

      The dialog adds a PageIntro at the top explaining why
      this queue exists, how to work it, and what each action
      does. Clinical terms (assertion, semantic tag, suppress,
      declined, absent, hypothetical, planned) render through
      GlossaryTerm or HelpPopover with FK grade <=9 copy.

    acceptance_criteria:
      - criterion: "Module size bound"
        type: "functional"
        measurement: "Inspection"
        target: >
          All five files <=500 LOC.
      - criterion: "API preservation"
        type: "functional"
        measurement: "Test"
        target: >
          CodingReviewCasesModal default export accepts the same
          Props and passes existing behavioural assertions.
      - criterion: "Readable in-product help"
        type: "safety"
        measurement: "Test"
        target: >
          PageIntro and glossary entries for the six clinical
          terms pass Flesch-Kincaid grade <=9.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/CodingReviewCasesModal.tsx"
        description: "Dialog shell, bulk actions, label menu"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/CaseCard.tsx"
        description: "Per-case UI"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/EncounterContextPanel.tsx"
        description: "Sibling entities context panel"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/codingReviewUtils.ts"
        description: "Safety warning detection, extractSuggestedPhrase, keyframes"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/codingReviewCopy.ts"
        description: "PageIntro copy + glossary term keys"
    storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 1200
      key_functions:
        - "CodingReviewCasesModal"
        - "CaseCard"
        - "EncounterContextPanel"
        - "isClinicalSafetyWarning"
        - "extractSuggestedPhrase"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Decides whether to suppress a clinical finding"
      - "Accepts or modifies an assertion that will enter the patient record"
    risk_control_measures:
      - "PageIntro primes the operator before they start the queue"
      - "GlossaryTerm ensures clinical terms are understood before any action"
      - "HelpPopover on Suppress form warns when NOT to suppress"

  verification_status:
    verification_method: "Test"
    verification_complete: false
