# -- DO-LEO-AI-153 -- Pathway canvas node primitives
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-153"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-157"]
    user_needs: ["UN-LEO-AI-072"]
    risks_addressed: ["R-LEO-AI-109"]
    verification_tests: ["VT-LEO-AI-155"]

  specification:
    title: "Pathway canvas node primitives (BaseNode + NodeHandle + NodeStatusStrip + NodeHeader)"
    description: |
      Four shared primitives under
      services/ui/src/components/pathway/nodes/_base/ that every pathway
      node type renders through. Replaces 10 hand-rolled node shells
      with a single accessible, prop-driven contract.

      Primitives:
        - BaseNode.tsx      (12px radius / 2px border / canonical states)
        - NodeHandle.tsx    (Handle + Tooltip + auto-generated aria-label)
        - NodeHeader.tsx    (icon + bold title + trailing slot)
        - NodeStatusStrip.tsx (idle / queued / running / completed / halted / error / skipped)

      All 10 node types (action, condition, rest_connector,
      queue_publish, trigger, parallel, merge, transform, source,
      output, viewer) have been refactored to use these primitives.
      The configure interaction is unified on single-click with
      keyboard activation via Enter / Space.
    acceptance_criteria:
      - criterion: "_base primitive files exist"
        type: "functional"
        measurement: "Test"
        target: "BaseNode.tsx, NodeHandle.tsx, NodeHeader.tsx, NodeStatusStrip.tsx, index.ts under nodes/_base/"
      - criterion: "Every node imports BaseNode + NodeHandle"
        type: "functional"
        measurement: "Test"
        target: "All 10 node files import from ./_base; zero raw <Handle> JSX remains"
      - criterion: "Aria-labels on every handle"
        type: "functional"
        measurement: "Test"
        target: "NodeHandle generates aria-label of the form 'input port <id>' / 'output port <id>'"
      - criterion: "Keyboard activation"
        type: "functional"
        measurement: "Test"
        target: "BaseNode binds onClick + onKeyDown for Enter/Space, sets role=button + tabIndex=0 when interactive"
      - criterion: "No double-click configure"
        type: "functional"
        measurement: "Test"
        target: "Zero node files bind onDoubleClick to onConfigure (SourceNode / OutputNode / MiniHitlNode all migrated to single-click)"
      - criterion: "File-size discipline"
        type: "functional"
        measurement: "Test"
        target: "Every node file < 500 LOC; largest is ActionNode < 250 LOC after refactor"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/_base/BaseNode.tsx"
        description: "Canonical node shell; selected / running / halted / skipped states, single-click + keyboard activation, 12px radius, 2px border"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/_base/NodeHandle.tsx"
        description: "Wraps React Flow Handle with Tooltip + aria-label; PORT_COLORS dispatch by dataType"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/_base/NodeHeader.tsx"
        description: "Optional icon + bold h3 title + trailing slot used by every node header"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/_base/NodeStatusStrip.tsx"
        description: "Canonical run-status indicator (idle / queued / running / completed / halted / error / skipped) with detail tooltip"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/_base/index.ts"
        description: "Barrel exporting BaseNode, NodeHandle, NodeHeader, NodeStatusStrip, PORT_COLORS, NodeRunStatus, BaseNodeTone, PortDataType"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/ActionNode.tsx"
        description: "Refactored to BaseNode + NodeHandle + NodeStatusStrip; resolveRunStatus() centralises the status mapping"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/ConditionNode.tsx"
        description: "Refactored to BaseNode + NodeHandle; outputs render with port labels and aria-labels"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/ConnectorNode.tsx"
        description: "Refactored to BaseNode + NodeHandle; rest_connector / queue_publish dispatch preserved; dashed border via BaseNode borderStyle"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/TriggerNode.tsx"
        description: "Refactored to BaseNode + NodeHandle + NodeHeader (BoltIcon)"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/ParallelNode.tsx"
        description: "Refactored to BaseNode + NodeHandle; output handles per branch carry aria-labels"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/MergeNode.tsx"
        description: "Refactored to BaseNode + NodeHandle; input handles per branch carry aria-labels"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/TransformNode.tsx"
        description: "Refactored to BaseNode + NodeHandle"
      - artifact_type: "source_code"
        location: "services/ui/src/components/pathway/nodes/SourceNode.tsx"
