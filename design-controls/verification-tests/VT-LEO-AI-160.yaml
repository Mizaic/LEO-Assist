# -- VT-LEO-AI-160 -- Manual gold seed manifest + seeder script
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-160"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-163"]
    risks: ["R-LEO-AI-003"]

  metadata:
    title: "Manual gold-seed manifest loads, validates and produces idempotent IDs"
    description: >
      Verifies that the hand-authored cancer-positive / benign-control gold
      seed manifest at design-controls/training-data/manual-gold-seed-
      2026-04-17.yaml is structurally sound and that the seeder script at
      scripts/seed_manual_gold_records.py performs the safety- and quality-
      relevant gates required before any TrainingCandidate or GoldLabel
      node is written to the Knowledge Graph.

      Specifically:
      - every record survives a re-run of libs.utils.deidentify.deidentify_text
        and libs.ner.deid_validator.DeIdValidator.check_record() with no
        residual PHI;
      - every entity surface text resolves to a (start, end) offset that
        recovers exactly that surface from the sentence;
      - candidate_id and label_id are deterministic, order-independent
        functions of the de-identified text and surface texts so the
        seeder is safe to re-run;
      - any entity using a non-canonical assertion or label is rejected
        before any Neo4j write.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/scripts/test_seed_manual_gold_records.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "PyYAML installed"
      - "libs.utils.deidentify and libs.ner.deid_validator importable"
      - "design-controls/training-data/manual-gold-seed-2026-04-17.yaml present"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-160-TC-001"
      case_name: "Real manifest loads and every entity span aligns to its surface"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call load_manifest() then prepare_all() against the on-disk
            manifest and assert that 21 records (4 POS, 17 NEG) are
            returned, each with at least one entity whose computed
            text[start:end] equals the entity surface (case-insensitive).
          expected_result: >
            21 prepared records with all entity spans correctly aligned.
          verification_method: "automated"
      acceptance_criteria:
        - "len(prepare_all(manifest)) == 21"
        - "Every entity satisfies text[start:end].lower() == surface.lower()"

    - case_id: "VT-160-TC-002"
      case_name: "Records with residual PHI are rejected before any KG write"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Construct a record whose sentence contains a UK postcode and
            assert prepare_record() raises ValueError with message
            'mutates under deidentify_text'. Repeat with an email address.
            Confirm the real manifest does not raise.
          expected_result: >
            Postcode and email injections raise ValueError; real manifest
            is accepted.
          verification_method: "automated"
      acceptance_criteria:
        - "ValueError raised on postcode injection"
        - "ValueError raised on email injection"
        - "Real manifest passes prepare_all() without raising"

    - case_id: "VT-160-TC-003"
      case_name: "candidate_id and label_id are deterministic and order-independent"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Compute _candidate_id(text) twice and assert equality. Compute
            _label_id(text, entities) with two permutations of the entity
            list and assert equality. Re-run prepare_record() on a deep
            copy of a record and assert candidate_id, label_id and
            entities all match.
          expected_result: "Identical IDs across re-runs and orderings."
          verification_method: "automated"
      acceptance_criteria:
        - "_candidate_id returns identical 64-char sha256 strings on re-run"
        - "_label_id is order-independent and starts with 'GL-'"
        - "Two prepare_record() invocations yield identical (candidate_id, label_id)"

    - case_id: "VT-160-TC-004"
      case_name: "Unknown assertions are rejected; canonical assertions are accepted"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Set entity assertion to 'kinda_present' and assert
            prepare_record() raises ValueError matching 'VALID_ASSERTIONS'.
            Then iterate every assertion in VALID_ASSERTIONS and assert
            it is accepted.
          expected_result: >
            Out-of-vocabulary assertion is rejected; every canonical
            assertion in VALID_ASSERTIONS is accepted.
          verification_method: "automated"
      acceptance_criteria:
        - "ValueError raised on 'kinda_present'"
        - "All VALID_ASSERTIONS values accepted"

    - case_id: "VT-160-TC-005"
      case_name: "Label vocabulary is enforced (lowercase SNOMED semantic tags)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Set label='diagnosis' (not a SNOMED tag) and assert ValueError
            matching 'VALID_LABELS'. Set label='DISORDER' and assert it is
            normalised to 'disorder'. Iterate every entity in the real
            manifest and assert label and assertion are both in their
            valid sets.
          expected_result: >
            Unknown labels rejected; case-folded labels accepted; real
            manifest contains only canonical labels and assertions.
          verification_method: "automated"
      acceptance_criteria:
        - "ValueError raised on label='diagnosis'"
        - "label='DISORDER' is normalised to 'disorder'"
        - "Every manifest entity has label in VALID_LABELS and assertion in VALID_ASSERTIONS"

    - case_id: "VT-160-TC-006"
      case_name: "Surface text not present in sentence is rejected"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Set entity surface to a phrase that does not occur in the
            sentence. Assert prepare_record() raises ValueError matching
            'cannot locate surface text'.
          expected_result: "ValueError raised before any KG write."
          verification_method: "automated"
      acceptance_criteria:
        - "ValueError raised when surface is not findable"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-160/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-160-EXEC-2026-04-17-01"
      executed_by: "automated:pytest"
      executed_date: "2026-04-17"
      environment: "local-dev"
      result: "pass"
      notes: >
        pytest tests/scripts/test_seed_manual_gold_records.py -v
        - 13 tests collected, 13 passed, 0 failed.
        Real manifest (21 records) loads, validates, and yields aligned spans.
