# -- R-LEO-AI-014 -- LLM Prompt Injection
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-014"
  title: "Malicious or unexpected content in encounter text causes LLM misbehaviour"

  hazard:
    description: "Clinical encounter text contains content that manipulates LLM behaviour through prompt injection"
    category: "security_breach"

  hazardous_situation: "Encounter free text contains strings that are interpreted as instructions by the LLM, causing it to produce incorrect coding, skip entities, or leak system prompt content"

  harm:
    description: "Incorrect coding output or information disclosure; mitigated by human review and structured output validation"
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "De-identification strips patient names and identifiers from text before LLM processing"
      implemented_by: ["DI-LEO-AI-006", "DI-LEO-AI-045"]
      verified_by: ["VT-LEO-AI-004", "VT-LEO-AI-038"]
      effectiveness: "effective"
    - control_type: "inherent_safety"
      description: "Structured JSON output format constrains LLM responses to expected schema"
      implemented_by: ["DI-LEO-AI-006", "DI-LEO-AI-045"]
      verified_by: ["VT-LEO-AI-004", "VT-LEO-AI-038"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Output validation rejects LLM responses that do not conform to expected structure"
      implemented_by: ["DI-LEO-AI-006", "DI-LEO-AI-045"]
      verified_by: ["VT-LEO-AI-004", "VT-LEO-AI-038"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Structured output format and validation constrain LLM responses; de-identification reduces sensitive data exposure; human review catches incorrect outputs"

  monitoring:
    monitoring_plan: "Track LLM output validation failures and unexpected patterns"
    metrics: ["LLM output validation failure rate", "Unexpected output pattern detection"]
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["security", "llm", "prompt-injection"]
