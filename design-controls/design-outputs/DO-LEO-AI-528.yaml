  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Generator + promotion writes (any silent regression to :SnomedConcept re-introduces R-LEO-AI-508 verifier failures)"
      - "Compiler closure expansion (silent fallback to exact-match means a real safety-net rule misses real patients)"
      - "Migration script (rewire + delete on a live SNOMED graph; the :DOCUMENTS guard MUST hold)"
    risk_control_measures:
      - "Canonical-only MERGEs: single concept identity across the whole guidance subsystem"
      - "Dual-tolerant reads keep the system safe during the migration window (legacy nodes still bind)"
      - "Closure walks the only graph with IS_A; descendants are never silently dropped for canonical concepts"
      - "Migration is idempotent + DOCUMENTS-safe + requires explicit --apply (no implicit mutation)"
      - "Schema invariant test fails CI on any future MERGE :SnomedConcept in guidance production code"

  verification_status:
