    - case_id: "VT-193-TC-008"
      case_name: "SNOMED concept ID 1556551000000104 classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key_from_anchor({'concept_id':'1556551000000104','concept_name':'Fast track referral for suspected cancer due to non-site-specific symptoms (procedure)'})"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-009"
      case_name: "Variant 'non site specific symptoms' (no hyphen) classifies as NSS"
      priority: "high"
      test_steps:
