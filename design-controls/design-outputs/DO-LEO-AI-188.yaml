# -- DO-LEO-AI-188 -- :Assessment Cypher module
- id: "DO-LEO-AI-188"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-189"]
    user_needs: ["UN-LEO-AI-080"]
    risks_addressed: ["R-LEO-AI-182"]
    verification_tests: ["VT-LEO-AI-187"]

  specification:
    title: "libs/cypher/sbar_assessment_queries.py"
    description: |
      Cypher queries for the :Assessment node lifecycle: CREATE_ASSESSMENT
      (draft, links to Patient), LINK_ASSESSMENT_TO_REFERRAL_REQUEST /
      LINK_ASSESSMENT_TO_PROCEDURE_REQUEST / LINK_ASSESSMENT_TO_ENCOUNTER,
      per-stage SET_SITUATION / SET_BACKGROUND / SET_ASSESSMENT_NARRATIVE /
      SET_RECOMMENDATION, FINALISE_ASSESSMENT, GET_ASSESSMENT, plus the
      assessment_to_dict mapper used by the API.
    acceptance_criteria:
      - criterion: "Incremental persistence"
        type: "functional"
        measurement: "Test"
        target: "Each SET_* query touches only the named property"
      - criterion: "Schema constraints"
        type: "functional"
        measurement: "Inspection"
        target: "ASSESSMENT_CONSTRAINTS adds UNIQUE on Assessment.id and indexes on run_id, status, type, created_at"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/cypher/sbar_assessment_queries.py"
        description: "CREATE/LINK/SET/FINALISE/GET queries + assessment_to_dict"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/cypher/schema_constraints.py"
        description: "ASSESSMENT_CONSTRAINTS list"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 250
      key_functions: ["CREATE_ASSESSMENT", "FINALISE_ASSESSMENT", "assessment_to_dict"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Patient binding is mandatory; referral/procedure/encounter links are best-effort"
    risk_control_measures:
      - "Incremental SET_* protects partial output on later-stage failure (R-LEO-AI-182)"

  verification_status:
    verification_method: "Test"
    verification_complete: true
