# -- VT-LEO-AI-507 -- Frozen-Cohort Regression for the Episode Engine
# IEC 62304 Verification Test

- id: "VT-LEO-AI-507"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs:
      - "DI-LEO-AI-500"
      - "DI-LEO-AI-501"
      - "DI-LEO-AI-502"
      - "DI-LEO-AI-503"
      - "DI-LEO-AI-504"
      - "DI-LEO-AI-505"
    risks:
      - "R-LEO-AI-501"
      - "R-LEO-AI-502"
      - "R-LEO-AI-503"
      - "R-LEO-AI-504"
      - "R-LEO-AI-505"

  metadata:
    title: "Episode engine frozen-cohort regression -- 20 synthetic patients vs pinned baseline"
    description: >
      Re-runs the engine in dry-run on a frozen cohort of 20 SYNTHETIC
      patient ids (SYN-EE-001 .. SYN-EE-020) and asserts each patient's
      structural output (episode_count, episode_type, suspected_site,
      milestone_types, treatment_types) still matches the committed
      baseline within tolerance. SYN-EE-001 is the canonical breast-cancer
      reference case (the deterministic 'Failed encounter' failure mode);
      regression on this case is blocking. Real Neo4j patient ids are
      resolved at runtime via the gitignored secrets/episode_engine_cohort_map.json
      mapping; the test SKIPS if the mapping is unavailable. Synthetic
      ids are the only ids ever committed to source control or the
      baseline JSON.
    test_level: "system"
    test_type: "regression"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/episode_engine/test_frozen_cohort_vt.py"
      - "scripts/regression/episode_engine_frozen/cohort_ids.py"
      - "scripts/regression/episode_engine_frozen/regenerate_baseline.py"
      - "scripts/regression/episode_engine_frozen/baseline.json"

  test_environment:
    environment_type: "staging"
    prerequisites:
      - "secrets/episode_engine_cohort_map.json present and complete"
      - "RUN_EPISODE_ENGINE_FROZEN_VT=1 environment variable set"
      - "Bedrock credentials configured (real LLM calls)"
      - "Neo4j patient graph reachable for the 20 mapped patients"
    test_data:
      data_type: "synthetic_id_alias"
      cleanup_required: false
      notes: >
        The committed baseline.json is keyed by synthetic id only and
        records ONLY structural fields (episode_count, episode_type,
        suspected_site, milestone_types, treatment_types,
        needs_human_review). It contains no clinical text, no dates
        beyond aggregate keys, and no real patient identifiers.

  test_cases:
    - case_id: "VT-507-TC-001"
      case_name: "test_frozen_cohort_engine_matches_baseline"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Resolve SYN-EE-001..SYN-EE-020 to real ids via secrets mapping; skip if missing"
          expected_result: "20 (synthetic_id, real_id) pairs returned, or test SKIPS"
          verification_method: "automated"
        - step_number: 2
          action: "For each real id, run_episode_engine(dry_run=True)"
          expected_result: "Engine produces an EpisodeEngineResult per patient"
          verification_method: "automated"
        - step_number: 3
          action: "Compare engine output to baseline keyed by synthetic id"
          expected_result: "episode_count within +/-1 of baseline; every baseline episode has a matching engine episode (same site, episode_type, milestone_types subset, treatment_types subset)"
          verification_method: "automated"
      acceptance_criteria:
        - "0 failures across all 20 synthetic patients"
        - "SYN-EE-001 (canonical breast cancer) MUST produce treatment_started endocrine on 2025-05-19 AND treatment_started surgery on 2025-07-28; MUST NOT produce a treatment_started anchored on the 2025-05-02 Failed encounter"

  pass_fail_criteria:
    pass_threshold: "100% critical (all 20 synthetic patients pass structural match)"
    blocking_on_failure: true

  evidence:
    evidence_types:
      - "automated_test_run"
      - "baseline_json"
      - "engine_trace_node_export"
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-507/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
