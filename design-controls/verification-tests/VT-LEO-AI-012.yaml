# -- VT-LEO-AI-012 -- Authentication and RBAC Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-012"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-020", "DI-LEO-AI-021"]
    risks: ["R-LEO-AI-010", "R-LEO-AI-024"]
    user_needs: ["UN-LEO-AI-013"]

  metadata:
    title: "Authentication and RBAC Verification"
    description: "Verifies that authentication gates reject unauthenticated requests, role-based access control enforces org-scoped data isolation, cross-tenant access is prevented, and service-to-service auth tokens are validated."
    test_level: "integration"
    test_type: "security"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_security_gaps.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Core API service running"
      - "Entra ID test tenant configured"
      - "Test users with different roles provisioned"
      - "Service-to-service credentials available"
    test_data:
      data_type: "synthetic"
      cleanup_required: true

  test_cases:
    - case_id: "VT-012-TC-001"
      case_name: "Unauthenticated requests rejected"
      priority: "critical"
      preconditions:
        - "API endpoints are live and accepting connections"
      test_steps:
        - step_number: 1
          action: "Send a request to a protected endpoint with no Authorization header"
          expected_result: "HTTP 401 Unauthorized returned"
          verification_method: "Assert response status code is 401"
        - step_number: 2
          action: "Send a request with an expired JWT token"
          expected_result: "HTTP 401 Unauthorized returned"
          verification_method: "Assert response status code is 401 and body contains 'token expired'"
        - step_number: 3
          action: "Send a request with a malformed JWT token"
          expected_result: "HTTP 401 Unauthorized returned"
          verification_method: "Assert response status code is 401"
      acceptance_criteria:
        - "All requests without valid authentication are rejected with 401"
        - "No data is returned in the response body for rejected requests"

    - case_id: "VT-012-TC-002"
      case_name: "Org-scoped data isolation enforced"
      priority: "critical"
      preconditions:
        - "Two test organisations (Org-A and Org-B) exist with separate data"
        - "User authenticated as member of Org-A"
      test_steps:
        - step_number: 1
          action: "Query pipeline runs as Org-A user"
          expected_result: "Only Org-A pipeline runs returned"
          verification_method: "Assert all returned records have org_id matching Org-A"
        - step_number: 2
          action: "Query pipeline runs as Org-B user"
          expected_result: "Only Org-B pipeline runs returned"
          verification_method: "Assert all returned records have org_id matching Org-B"
      acceptance_criteria:
        - "Each user only sees data belonging to their organisation"
        - "No cross-org data leakage in any API response"

    - case_id: "VT-012-TC-003"
      case_name: "Cross-tenant access prevented"
      priority: "critical"
      preconditions:
        - "User authenticated as member of Org-A"
        - "Known resource ID belonging to Org-B"
      test_steps:
        - step_number: 1
          action: "Attempt to access Org-B resource by ID using Org-A credentials"
          expected_result: "HTTP 403 Forbidden or 404 Not Found returned"
          verification_method: "Assert response status code is 403 or 404"
        - step_number: 2
          action: "Attempt to modify Org-B resource by ID using Org-A credentials"
          expected_result: "HTTP 403 Forbidden or 404 Not Found returned"
          verification_method: "Assert response status code is 403 or 404 and resource is unchanged"
      acceptance_criteria:
        - "Direct access to another tenant's resources is blocked"
        - "No information about the other tenant's data is disclosed"

    - case_id: "VT-012-TC-004"
      case_name: "Service-to-service auth validated"
      priority: "critical"
      preconditions:
        - "Service-to-service token provider configured"
        - "Internal API endpoints are live"
      test_steps:
        - step_number: 1
          action: "Call internal endpoint with a valid service token"
          expected_result: "HTTP 200 OK returned with expected data"
          verification_method: "Assert response status code is 200"
        - step_number: 2
          action: "Call internal endpoint with an invalid service token"
          expected_result: "HTTP 401 Unauthorized returned"
          verification_method: "Assert response status code is 401"
        - step_number: 3
          action: "Call internal endpoint with a user token (not a service token)"
          expected_result: "HTTP 403 Forbidden returned"
          verification_method: "Assert response status code is 403"
      acceptance_criteria:
        - "Only valid service tokens grant access to internal endpoints"
        - "User tokens cannot be used for service-to-service calls"

  pass_fail_criteria:
    pass_threshold: "100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-012/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-012-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 4
      cases_passed: 4
      cases_failed: 0
      duration_seconds: 2
      notes: "All 4 test cases passed (pytest VT-LEO-AI-012)"
