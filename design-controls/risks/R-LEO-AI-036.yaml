# -- R-LEO-AI-036 -- Agentic Auditor Loop Runaway Cost
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-036"
  title: "Agentic auditor tool-use loop generates unbounded cloud API costs"

  hazard:
    description: >
      The Opus orchestrator enters a repeated tool-use loop, requesting
      terminology lookups iteratively without converging on a verdict.
      Each iteration incurs input and output tokens for Opus (expensive)
      and Haiku (cheaper), plus HTTP calls to the Terminology API.
      Without hard limits, a single record could generate hundreds of
      tool calls.
    category: "availability"

  hazardous_situation: >
    During a batch audit run of hundreds or thousands of TrainingLabel
    records, the agentic loop runs without a hard iteration cap or cost
    budget. Opus requests multiple tool calls per entity and multiple
    entities per record trigger pass 2. The cumulative token cost across
    the batch exceeds the authorised cloud budget, causing unexpected
    AWS Bedrock invoice charges and potential service disruption due to
    rate limiting.

  harm:
    description: >
      Financial harm from unexpected cloud API charges. Potential
      Terminology API resource exhaustion affecting production services
      that depend on it. Delayed training data quality improvement due
      to run failure or budget suspension.
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Hard iteration cap of 5 tool-use cycles per record enforced in
        _agentic_audit_record(). Loop exits unconditionally when counter
        reaches the cap, regardless of model stop_reason.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        CostGuardrail class tracks cumulative input and output tokens
        across the entire run. When tokens exceed OPUS_AUDIT_TOKEN_BUDGET
        (default 2,000,000) or estimated cost exceeds OPUS_AUDIT_COST_CAP
        (default $50.00 USD), the guardrail signals halt and pass 2 is
        skipped for all remaining records.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Two-pass architecture restricts tool use to pass-2 entities only.
        Pass 2 only processes entities flagged needs_review with SNOMED
        rationale keywords. This minimises the population of entities
        eligible for the agentic loop.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: ["VT-LEO-AI-047"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        CLI --dry-run default mode prevents any writes or agentic pass 2
        unless --apply flag is explicitly set. Engineers review dry-run
        reports before committing to full agentic runs.
      implemented_by: ["DI-LEO-AI-054"]
      verified_by: []
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 2
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Three independent hard stops (iteration cap, token budget, dollar
      cap) prevent unbounded cost regardless of model behaviour. The
      two-pass architecture further limits eligibility. Residual risk is
      low and acceptable given the multiple independent controls.

  monitoring:
    monitoring_plan: >
      Monitor AWS Bedrock token usage metrics per audit run. Alert if
      any single run exceeds 1M tokens before the budget cap triggers.
      Review audit trail JSONL files for high tool_calls counts per record.
    metrics:
      - "Total input + output tokens per audit run"
      - "Average tool_calls per record in audit trail"
      - "CostGuardrail halt frequency (should be zero in normal operation)"
    review_frequency: "Per audit run"

  metadata:
    identified_by: "Design review -- agentic architecture threat modelling"
    identified_date: "2026-03-05"
    status: "analyzed"
    tags:
      - "llm"
      - "cost-control"
      - "agentic"
      - "training-data"
      - "audit"
