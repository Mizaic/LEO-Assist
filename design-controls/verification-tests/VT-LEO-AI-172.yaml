          expected_result: "Returns (matched_phrase, 'breast')."
          verification_method: "automated"
      acceptance_criteria:
        - "Breast surveillance template mapped to breast site."

    - case_id: "VT-172-TC-012"
      case_name: "Follow-up template fires diagnosis_confirmed via the detector"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Skin Cancer Follow Up: lesion on back 4x4mm seb k. No local recurrence.'."
          expected_result: "diagnosis anchor with diagnosis_source='cancer_follow_up_template' and hitl_required=True."
          verification_method: "automated"
      acceptance_criteria:
        - "Detector wires the new helper."

    - case_id: "VT-172-TC-013"
      case_name: "History-of-cancer guard wins over follow-up template"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Major: H/O cancer of breast (B934.). Skin Cancer Follow Up template attached.'."
          expected_result: "No diagnosis anchor emitted."
          verification_method: "automated"
      acceptance_criteria:
        - "History guard precedes the new follow-up path."

    - case_id: "VT-172-TC-014"
      case_name: "BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT exposes the gated labels"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert {'no further action', 'discharged from care', 'discharged from clinic'}.issubset(BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT)."
          expected_result: "Assertion holds."
          verification_method: "automated"
      acceptance_criteria:
        - "Frozenset names the broad phrases that must be gated."

    - case_id: "VT-172-TC-015"
      case_name: "CANCER_PATHWAY_CONTEXT_REGEX matches cancer / 2WW / fast track"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert CANCER_PATHWAY_CONTEXT_REGEX.search returns a match for 'cancer review', '2WW skin clinic', 'fast track referral', 'oncology surveillance', 'malignant melanoma', 'lymphoma'."
          expected_result: "All six phrases match."
          verification_method: "automated"
      acceptance_criteria:
        - "Cancer-context regex is broad enough."

    - case_id: "VT-172-TC-016"
      case_name: "Day-17 closure bug regression: CKD encounter does NOT fire benign_closure"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on the verbatim CKD encounter text from patient 4921442355 / 2024-11-18 (which contains 'no further action' but no cancer context)."
          expected_result: "No benign_closure anchor emitted."
          verification_method: "automated"
      acceptance_criteria:
        - "Scope guard prevents the day-17 misclosure structurally."

    - case_id: "VT-172-TC-017"
      case_name: "Tier-1 phrases unaffected: 'no evidence of malignancy' still fires"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Mole biopsy: no evidence of malignancy.'."
          expected_result: "benign_closure anchor emitted."
          verification_method: "automated"
      acceptance_criteria:
        - "Tier-1 cancer-specific phrase remains unconditional."

    - case_id: "VT-172-TC-018"
      case_name: "Cancer-context override: 2WW + 'discharged from clinic' fires benign"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Letter from 2WW skin clinic: lesion benign, discharged from clinic.'."
          expected_result: "benign_closure anchor emitted."
          verification_method: "automated"
      acceptance_criteria:
        - "Gated phrase fires when cancer context is present."

    - case_id: "VT-172-TC-019"
      case_name: "Read-code path unaffected by gate"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run _classify_text_encounters on 'Lymphadenopathy NAD on 2WW (Xa0Vr).' (with no surrounding cancer prose)."
          expected_result: "benign_closure anchor emitted (Read-code path is unconditional)."
          verification_method: "automated"
      acceptance_criteria:
        - "Read-code hit retains its tier-1 status regardless of surrounding text."

    - case_id: "VT-172-TC-020"
      case_name: "Inventory sanity: CANCER_FOLLOW_UP_PHRASES non-empty list of (re.Pattern, str)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Iterate CANCER_FOLLOW_UP_PHRASES; assert all entries are (compiled regex, non-empty site key)."
          expected_result: "All entries valid."
          verification_method: "automated"
      acceptance_criteria:
        - "Module loads with valid follow-up patterns."

    - case_id: "VT-172-TC-021"
      case_name: "Live rebuild: patient 4921442355 episode reclassified to completed"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "After scripts/_wipe_episodes_and_rebuild.py, query MATCH (p:Patient {id:'4921442355'})-[:HAS_EPISODE]->(ep:EpisodeOfCare {episode_id:'42b722eb6082a4b7'}) RETURN ep.status, ep.cancer_type, ep.hitl_flag."
          expected_result: "status='completed', cancer_type='melanoma', hitl_flag=true."
          verification_method: "automated"
      acceptance_criteria:
        - "Harold Allwyn case reclassified."

    - case_id: "VT-172-TC-022"
      case_name: "Live rebuild: cohort-level closed_benign skin/melanoma episodes drop"
      priority: "critical"
