# -- DO-LEO-AI-514 -- Sync LLMClient.converse + invoke_with_fallback emit telemetry
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-514"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-515"]
    user_needs: ["UN-LEO-AI-091"]
    risks_addressed: ["R-LEO-AI-506"]
    verification_tests: ["VT-LEO-AI-513"]

  specification:
    title: "Sync LLM entry-point telemetry"
    description: |
      Two surgical edits make the synchronous LLM entry points
      observable to ``track_llm_usage`` (and hence to the active
      ``LLMUsageRecorder``, the dashboard ``LLMSpendPanel`` and the
      per-tenant billing aggregates):

      1. ``libs/llm_client/factory.py::LLMClient.converse`` is taught
         to:
           - Accept two new optional kwargs ``agent_task`` and
             ``patient_id`` (defaults preserve existing behaviour).
           - Time the call with ``time.monotonic`` so latency is
             measured to the point of return (or failure).
           - On success, fire ``track_llm_usage`` with the
             ``input_tokens``, ``output_tokens`` and
             ``cached_input_tokens`` already pulled from the provider
             response (no new parsing required), plus
             ``model_provider``, ``model_name``, ``latency_ms`` and
             ``success=true``.
           - On failure, fire the callback with ``success=false``,
             ``error_message`` truncated to 400 chars, zero token
             counts, then re-raise the original exception.

         The fire-callback step is wrapped in its own
         ``try / except`` and is a no-op if no callback is
         registered, so callers cannot be broken by a tracking bug.

      2. ``libs/llm_client/providers.py::invoke_with_fallback`` is
         taught to:
           - Time both branches.
           - Resolve the actual provider that answered (Bedrock
             primary OR Azure fallback OR Azure-primary mode).
           - Use the existing ``extract_token_counts(response,
             provider)`` helper to pull tokens.
           - Fire ``track_llm_usage`` exactly once.
           - Forward ``agent_task`` and ``patient_id`` kwargs through
             to the callback (defaults remain ``"unknown"`` /
             ``""`` for back-compat with ``fix_analyzer.py``).

      Both helpers route through the same ``track_llm_usage`` ->
      default-recorder-callback chain that ``invoke_llm_json``
      already uses, so an active ``LLMUsageRecorder`` picks up the
      sync calls automatically. No recorder API change is required.

    acceptance_criteria:
      - criterion: "Bedrock converse fires track_llm_usage with matching tokens"
        type: "functional"
        measurement: "Test"
        target: "Mock the boto3 bedrock-runtime client to return a Converse response with usage.inputTokens=120, outputTokens=30, cacheReadInputTokens=50; assert callback fired once with input_tokens=120, output_tokens=30, cache_read_input_tokens=50, model_provider='aws'"
      - criterion: "Azure converse fires track_llm_usage with matching tokens"
        type: "functional"
        measurement: "Test"
        target: "Mock AzureOpenAI client to return choices/usage with prompt_tokens=200, completion_tokens=80; assert callback fired with input_tokens=200, output_tokens=80, model_provider='azure'"
      - criterion: "Failure path still emits callback"
        type: "safety"
        measurement: "Test"
        target: "Mock the provider client to raise; assert callback fired with success=False, zero tokens, error_message != ''; original exception is re-raised unchanged"
      - criterion: "Callback exception does not break caller"
        type: "safety"
        measurement: "Test"
        target: "Register a callback that raises; assert converse returns the LLMResponse unchanged"
      - criterion: "agent_task / patient_id forwarded"
        type: "functional"
        measurement: "Test"
        target: "Pass agent_task='ask_leo_smart', patient_id='9437821'; assert callback receives both verbatim"
      - criterion: "LLMUsageRecorder picks up sync calls"
        type: "functional"
        measurement: "Test"
        target: "Wrap two converse calls in `with LLMUsageRecorder() as rec`; assert rec.usage.input_tokens == sum of stubbed inputs and rec.usage.llm_calls == 2"
      - criterion: "invoke_with_fallback fires once for primary path"
        type: "functional"
        measurement: "Test"
        target: "Stub Bedrock to return a usage_metadata response; assert exactly one tracking event with model_provider='bedrock' / 'aws'"
      - criterion: "invoke_with_fallback fires once for fallback path"
        type: "functional"
        measurement: "Test"
        target: "Stub Bedrock to raise, Azure to succeed; assert exactly one tracking event with model_provider='azure'"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/llm_client/factory.py"
        description: "Updated LLMClient.converse: accept agent_task / patient_id, time the call, fire track_llm_usage on success and failure with token counts pulled from the existing LLMResponse fields"
      - artifact_type: "source_code"
        location: "libs/llm_client/providers.py"
        description: "Updated invoke_with_fallback: time both branches, resolve actual responding provider, call extract_token_counts, fire track_llm_usage once with agent_task / patient_id forwarding"
      - artifact_type: "test"
        location: "tests/llm_client/test_converse_tracking.py"
        description: "Pytest covering Bedrock + Azure success paths, failure path callback emission, callback-raises isolation, agent_task / patient_id forwarding, LLMUsageRecorder accumulation"
      - artifact_type: "test"
        location: "tests/llm_client/test_invoke_with_fallback_tracking.py"
        description: "Pytest covering primary path, fallback path, Azure-primary mode -- each fires exactly one tracking event with the correct provider tag"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 180
      key_functions:
        - "LLMClient.converse"
        - "_fire_converse_tracking"
        - "invoke_with_fallback"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Telemetry emission must never fail a caller (best-effort, swallowed exceptions)"
      - "Callback fires on the failure path so cost-monitoring sees outages"
    risk_control_measures:
      - "Tracking call wrapped in its own try / except inside both helpers"
      - "Token counts cast to int and floored at 0 to avoid Neo4j drift downstream"
      - "agent_task / patient_id default to '' so existing callers do not need to know about telemetry"

  verification_status:
    verification_method: "Test"
    verification_complete: false
