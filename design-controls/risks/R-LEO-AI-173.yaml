# -- R-LEO-AI-173 -- False benign-closure from scope-violating phrase match in unrelated encounter
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-173"
  title: "Open cancer episode silently closed_benign because an unrelated encounter (CKD, BP review, mental health) contained a generic phrase like 'no further action' or 'discharged from clinic'"

  hazard:
    description: >
      The benign-investigation phrase inventory contains intentionally
      broad patterns that catch the common 2WW outcome wording
      ("PSA normal, no further action", "discharged from clinic"
      after a normal mammogram). Several of these patterns are
      ambiguous in isolation: "no further action" appears in routine
      CKD / hypertension / mental-health reviews where it has no
      cancer meaning. Without a scope guard, the benign-closure
      anchor produced from one of those unrelated encounters is
      consumed by the episode builder for any open cancer episode
      whose window covers the same date - silently closing it as
      benign and discarding all subsequent post-referral evidence
      (excisions, pathology, surveillance).
    category: "clinical_safety"

  hazardous_situation: >
    A patient on a 2WW skin-cancer pathway has an unrelated CKD
    review on day 17 of the episode. The CKD note contains "no
    further action" referring to blood pressure. The detector
    emits a benign_closure anchor on that date; the builder uses
    it as benign_date for the open skin-cancer episode; the
    confirmed melanoma diagnosis filed on day 79 is never linked
    to the episode and the patient is excluded from the
    confirmed-cancer cohort.

  harm:
    description: >
      Delayed clinical follow-up for a real cancer; under-counted
      cancer cohort and skewed PPV analytics; loss of trust in the
      audit dashboard. The 2026-04-17 audit confirmed this exact
      sequence on patient 4921442355.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 4
    detectability: 4
    rpn: 48
    risk_level: "critical"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-178 introduces BENIGN_PHRASE_REQUIRES_CANCER_CONTEXT
        - a frozenset naming the broad phrase labels ("no further
        action", "discharged from care", "discharged from clinic").
        For these labels the detector only sets has_no_cancer=True
        when the same encounter ALSO has cancer context: a
        cancer-pathway regex match, a derived cancer site_key, or a
        BENIGN_EXPLANATION_CODES Read-code hit. The Read-code path
        and the existing tier-1 cancer-specific phrases
        ("mammogram normal", "PSA normal no further action",
        "no evidence of malignancy", etc.) remain unconditional.
      implemented_by: ["DI-LEO-AI-178"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The gate fails closed: when no cancer context is present,
        the encounter is silent (no benign_closure emitted). It
        does not promote the encounter to a positive diagnosis;
        the only effect is to suppress a false benign signal.
      implemented_by: ["DI-LEO-AI-178"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Post-rebuild data-quality check counts the number of
        closed_benign episodes whose benign_closure milestone
        encounter has NO cancer-context tokens. Any non-zero count
        is investigated as a candidate scope-violating phrase.
      implemented_by: ["DI-LEO-AI-178"]
      verified_by: ["VT-LEO-AI-172"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"
    acceptability: "acceptable"
    justification: >
      The scope guard removes the structural cause of the day-17
      misclosure for the patient 4921442355 case and prevents the
      same failure for any future patient with an unrelated
      encounter inside an open cancer window. Residual risk reflects
      only the possibility that a new tier-2 phrase enters the
      inventory without the gate flag, which is bounded by the
      DC-TM-001 review.

  monitoring:
    monitoring_plan: >
      Quarterly DQ check: count closed_benign episodes whose
      benign_closure encounter text has zero matches for
      CANCER_PATHWAY_CONTEXT_REGEX. Investigate any non-zero count.
      Inventory review whenever a new benign-investigation phrase is
      added: must be classified tier-1 (cancer-specific) or tier-2
      (gated).
    metrics:
      - "Count of closed_benign episodes with benign_closure encounter lacking cancer context"
      - "Count of new BENIGN_INVESTIGATION_PHRASES additions per quarter and their tier classification"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "2026-04-17 day-17 closure trace on patient 4921442355"
    identified_date: "2026-04-17"
    status: "analyzed"
    tags:
      - "episode-building"
      - "false-benign"
      - "scope-guard"
      - "ckd-bug"
