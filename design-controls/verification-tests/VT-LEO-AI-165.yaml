# -- VT-LEO-AI-165 -- Test patient generator + FastAPI router contract
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-165"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-166"]
    risks: ["R-LEO-AI-166"]

  metadata:
    title: "Generator emits happy/fail/branch/boundary proposals; router contract for /guidance/test-patients"
    description: >
      Verifies the test_patient_generator emits the expected proposal
      mix per scope and depth, drops duplicates by content_hash, and
      that the FastAPI surface for /guidance/test-patients wires
      through to the service layer with the correct status codes.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/api/tests/test_test_patient_generator.py"
      - "services/api/tests/test_test_patient_router.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-165-TC-001"
      case_name: "Generator emits one happy + one fail for an AND of two CONCEPTs"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub list_rules_in_scope with an AND(c1=100, c2=200); call generate(scope_type='rule', depth='minimal_pair', exclude_existing=False)."
          expected_result: "Proposal kinds == {'happy', 'fail'}; happy.codes sorted == ['100', '200']; fail.codes has length 1."
          verification_method: "automated"
      acceptance_criteria:
        - "Minimal pair coverage works for the simplest AND."

    - case_id: "VT-165-TC-002"
      case_name: "boundary_plus_pairs depth emits branch + boundary proposals"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub list_rules_in_scope with AND(OR(a=1, b=2), DEMOGRAPHIC age >= 65); call generate(depth='boundary_plus_pairs')."
          expected_result: "Result includes kind='branch' (one per OR child) and kind='boundary' patients with age 65 and 64."
          verification_method: "automated"
      acceptance_criteria:
        - "Branch coverage and at-/below-boundary age fixtures emitted."

    - case_id: "VT-165-TC-003"
      case_name: "exclude_existing drops every proposal whose hash is already saved"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub find_existing to always return 'tp_existing'; call generate(exclude_existing=True)."
          expected_result: "Returned proposals == []."
          verification_method: "automated"
      acceptance_criteria:
        - "Cohort dedup at generation time."

    - case_id: "VT-165-TC-004"
      case_name: "scope_type='all' calls list_rules_in_scope without guideline / rule filters"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Spy on list_rules_in_scope; call generate(scope_type='all')."
          expected_result: "Captured kwargs == {} (no guideline_id, no rule_id)."
          verification_method: "automated"
      acceptance_criteria:
        - "Global scope pulls every rule."

    - case_id: "VT-165-TC-005"
      case_name: "POST /guidance/test-patients/dry-run returns 200 with the service result"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch test_patient_service.dry_run to return a fixed envelope; POST a PatientBody with codes / age / sex."
          expected_result: "HTTP 200 with the same envelope returned to the caller."
          verification_method: "automated"
      acceptance_criteria:
        - "Router contract for dry-run."

    - case_id: "VT-165-TC-006"
      case_name: "Dry-run returns 502 when the service raises RuntimeError"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch test_patient_service.dry_run to raise RuntimeError('terminology offline'); POST the dry-run."
          expected_result: "HTTP 502 with detail containing 'terminology offline'."
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer sees a friendly error, not a stack trace."

    - case_id: "VT-165-TC-007"
      case_name: "POST /guidance/test-patients (save) routes through to confirm_and_save"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch test_patient_service.confirm_and_save to return {id: 'tp_new', created: True, expectations_written: 1}; POST a save body with one expectation."
          expected_result: "HTTP 200 with id='tp_new' and created=True."
          verification_method: "automated"
      acceptance_criteria:
        - "Save persists what the reviewer ticked."

    - case_id: "VT-165-TC-008"
      case_name: "DELETE returns 404 when no patient was deleted"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch delete_patient to return 0; DELETE /guidance/test-patients/tp_missing."
          expected_result: "HTTP 404."
          verification_method: "automated"
      acceptance_criteria:
        - "Missing patient surfaces as 404, not 500."

    - case_id: "VT-165-TC-009"
      case_name: "DELETE returns the count and patient_id on success"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch delete_patient to return 1; DELETE /guidance/test-patients/tp1."
          expected_result: "HTTP 200 with body {deleted: 1, patient_id: 'tp1'}."
          verification_method: "automated"
      acceptance_criteria:
        - "Caller gets a confirmation envelope."

    - case_id: "VT-165-TC-010"
      case_name: "POST /guidance/test-patients/replay returns the persisted report"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Patch replay_scope to return a report with id='rv_1' and zero regressions; POST {guideline_id: 'g1'}."
          expected_result: "HTTP 200 with regressions_count=0."
          verification_method: "automated"
      acceptance_criteria:
        - "Replay endpoint returns the aggregated diff."

    - case_id: "VT-165-TC-011"
      case_name: "POST /guidance/test-patients/generate returns proposals"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch test_patient_generator.generate to return one proposal; POST {scope_type: 'rule', rule_id: 'r1', depth: 'minimal_pair'}."
          expected_result: "HTTP 200 with len(proposals) == 1."
          verification_method: "automated"
      acceptance_criteria:
        - "Generator endpoint returns its envelope."

    - case_id: "VT-165-TC-012"
      case_name: "GET /guidance/test-patients/replay-reports/{id} returns 404 when missing"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Patch get_replay_report to return None; GET /guidance/test-patients/replay-reports/rv_missing."
          expected_result: "HTTP 404."
          verification_method: "automated"
      acceptance_criteria:
        - "Replay-report 404 path."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-165/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-165-EXEC-001"
      executed_by: "automated_pytest"
      executed_date: "2026-04-17"
      result: "pass"
      command: ".venv/bin/python -m pytest services/api/tests/test_test_patient_generator.py services/api/tests/test_test_patient_router.py -v"
      total_cases: 12
      passed: 12
      failed: 0
      notes: >
        12/12 cases passed. Generator tests stub list_rules_in_scope and
        find_existing; router tests stub the service layer and use
        FastAPI TestClient with require_admin overridden to a synthetic
        admin CallerScope.
