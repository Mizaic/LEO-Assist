- id: "VT-LEO-AI-090"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-090"]
    risks: ["R-LEO-AI-064"]

  metadata:
    title: "Stage-at-diagnosis parser and rules engine verification"
    description: >
      Verifies TNM parsing and deterministic stage resolution for explicit
      stage, TNM-derived stage, non-TNM mappings, and unknown fallback.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_tnm_parser.py"
      - "tests/test_staging_engine.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-090-TC-001"
      case_name: "Parses TNM triplet without prefix"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call parse_tnm_triplet('T2N1M0')"
          expected_result: "Returns T2/N1/M0 with empty prefix"
          verification_method: "automated"
      acceptance_criteria:
        - "t == T2"
        - "n == N1"
        - "m == M0"

    - case_id: "VT-090-TC-002"
      case_name: "Parses prefixed TNM triplet"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call parse_tnm_triplet('pT3bN0M0')"
          expected_result: "Returns parsed components and prefix P"
          verification_method: "automated"
      acceptance_criteria:
        - "prefix == P"
        - "t == T3B"

    - case_id: "VT-090-TC-003"
      case_name: "Explicit stage has priority over TNM"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Resolve stage with explicit Stage II and TNM T4N3M1"
          expected_result: "Engine returns explicit stage path"
          verification_method: "automated"
      acceptance_criteria:
        - "staging_system == explicit_stage"
        - "cancer_stage == early"

    - case_id: "VT-090-TC-004"
      case_name: "Derives stage from TNM when explicit stage absent"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Resolve stage with breast cancer type and TNM T1N0M0"
          expected_result: "Engine returns TNM result"
          verification_method: "automated"
      acceptance_criteria:
        - "staging_system == TNM"

    - case_id: "VT-090-TC-005"
      case_name: "Maps non-TNM Ann Arbor stage"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Resolve stage with explicit Ann Arbor stage III"
          expected_result: "Engine returns late stage using Ann Arbor"
          verification_method: "automated"
      acceptance_criteria:
        - "staging_system == Ann Arbor"
        - "cancer_stage == late"

    - case_id: "VT-090-TC-006"
      case_name: "Unknown fallback when no stage evidence"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Resolve stage with no explicit stage and no TNM"
          expected_result: "Engine returns unknown"
          verification_method: "automated"
      acceptance_criteria:
        - "cancer_stage == unknown"
        - "staging_source == none"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-090/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-090-RUN-001"
      date: "2026-04-08"
      executed_by: "cursor-agent pytest"
      result: "pass"
      tests_run: 7
      tests_passed: 7
      tests_failed: 0
      notes: >
        Command: pytest tests/test_tnm_parser.py tests/test_staging_engine.py -v.
        All parser and engine assertions passed.
- id: "VT-LEO-AI-090"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-090"]
    risks: ["R-LEO-AI-064"]

  metadata:
    title: "CancerTypeDumbbellChart rendering, colour logic, label formatting, and empty state"
    description: >
      Verifies that the CancerTypeDumbbellChart component correctly renders rows
      per cancer type, applies direction colour logic (green above / amber below /
      grey no-benchmark), shows delta labels, humanises key strings, auto-fits
      the x-axis, and renders an accessible empty state when data is absent.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/components/audit/__tests__/CancerTypeDumbbellChart.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-090-TC-001"
      case_name: "Renders one row per cancer type"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render component with rows for breast (30.2%, benchmark 15.3%) and lung (2.5%, benchmark 13.2%)"
          expected_result: "Two row labels appear: 'Breast' and 'Lung'"
          verification_method: "automated"
      acceptance_criteria:
        - "getByText('Breast') resolves without error"
        - "getByText('Lung') resolves without error"

    - case_id: "VT-090-TC-002"
      case_name: "Empty state renders explanatory text"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render component with empty rows array"
          expected_result: "Typography with 'No cancer type data' text is visible"
          verification_method: "automated"
      acceptance_criteria:
        - "getByText(/no cancer type data/i) resolves without error"

    - case_id: "VT-090-TC-003"
      case_name: "Humanises underscore key strings in labels"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with cancer_type keys: lower_gi, head_and_neck, non_site_specific"
          expected_result: "Labels read 'Lower GI', 'Head and Neck', 'Non Site Specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "getByText('Lower GI') present"
        - "getByText('Head and Neck') present"
        - "getByText('Non Site Specific') present"

    - case_id: "VT-090-TC-004"
      case_name: "Delta label shows +pp when today exceeds benchmark"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with breast: practice=30.2, national=15.3"
          expected_result: "Delta label showing '+14.9pp' or '+15pp' is present"
          verification_method: "automated"
      acceptance_criteria:
        - "getByText(/\\+1[45]/) present in rendered output"

    - case_id: "VT-090-TC-005"
      case_name: "Delta label shows -pp when today is below benchmark"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Render with lung: practice=2.5, national=13.2"
          expected_result: "Delta label showing '-10.7pp' or '-11pp' is present"
          verification_method: "automated"
      acceptance_criteria:
        - "getByText(/-1[01]/) present in rendered output"

    - case_id: "VT-090-TC-006"
      case_name: "No delta label when benchmark is absent"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render with a row where national is null"
          expected_result: "No pp label rendered for that row"
          verification_method: "automated"
      acceptance_criteria:
        - "No element matching /pp/ is in the rendered output for the null-benchmark row"

    - case_id: "VT-090-TC-007"
      case_name: "Renders without error when all benchmarks are null"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Render with rows that all have national=null"
          expected_result: "Component renders without throwing; labels visible; no pp annotations"
          verification_method: "automated"
      acceptance_criteria:
        - "Component renders without throwing"
        - "Row labels are present"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-090/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-090-RUN-001"
      date: "2026-04-08"
      executed_by: "automated CI (jest)"
      result: "pass"
      tests_run: 11
      tests_passed: 11
      tests_failed: 0
      notes: >
        All 7 TC cases covered; 4 additional humaniseCancerLabel unit tests
        included. ResizeObserver stubbed in test setup.
        Command: npx jest CancerTypeDumbbellChart.test.tsx --no-coverage.
        Exit code 0.
