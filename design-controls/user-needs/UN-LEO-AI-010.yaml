# -- UN-LEO-AI-010 -- Human-in-the-Loop Review
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-010"
  title: "All AI-generated proposals require human review before becoming audit data"
  description: |
    All users need a review queue where AI-generated proposals -- coded
    encounters, episode classifications, quality alerts, and clinical
    interpretations -- are presented for human validation before being
    accepted as final audit data. Reviewers can confirm, edit, or reject
    each proposal. Corrections feed back into NLP model retraining for
    continuous improvement. No AI-generated output is treated as final
    audit data until a human reviewer with the appropriate role has
    approved it.

  stakeholder:
    type: "end_user"
    role: "Human Reviewer / Clinical Coder"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    The system is classified as IEC 62304 Class B software. AI outputs
    are probabilistic and can be incorrect. Mandatory human review is
    both a regulatory requirement and a clinical safety control. The
    human-in-the-loop gate is the primary risk mitigation for incorrect
    AI outputs.

  benefit: "Ensures clinical accuracy of all audit data while maintaining AI-assisted efficiency"

  use_case: |
    1. Pipeline completes processing for a patient cohort and generates
       AI proposals (coded encounters, episode classifications, quality
       alerts, clinical interpretations).
    2. System places all proposals into a role-based review queue.
    3. Human reviewer opens the review queue and sees proposals grouped
       by type and priority.
    4. Reviewer selects a proposal and sees the AI output alongside the
       source evidence (encounter text, SNOMED codes, confidence scores).
    5. Reviewer confirms the proposal if correct, edits it if partially
       correct, or rejects it if incorrect.
    6. System records the reviewer identity, timestamp, action taken,
       and any edits made.
    7. Confirmed and edited proposals become final audit data.
    8. Rejected proposals and edits are stored as training corrections
       for future model retraining.
    9. System prevents any AI output from entering final audit datasets
       without a recorded human approval.

  current_solution: "Clinical coders manually code encounters from scratch; no AI-assisted workflow exists"

  pain_points:
    - "Manual coding from scratch is slow and does not scale"
    - "No structured feedback loop from coder corrections to model improvement"
    - "No audit trail linking final data to reviewer decisions"
    - "Risk of AI errors entering audit data without a safety gate"

  acceptance_criteria:
    - "System shall present all AI proposals in a review queue"
    - "Reviewers shall be able to confirm, edit, or reject each proposal"
    - "System shall require appropriate role-based authorisation for review actions"
    - "System shall record reviewer identity and timestamp for every decision"
    - "Corrections shall be stored for model retraining"
    - "No AI output shall be finalised without human approval"

  success_metrics:
    - metric: "Review coverage"
      target: "100% of AI outputs reviewed before finalisation"
      baseline: "N/A -- no AI outputs currently"
    - metric: "Review throughput"
      target: ">=20 items per hour per reviewer"
      baseline: "Manual coding: 5-8 encounters per hour"
    - metric: "Reviewer satisfaction"
      target: ">=4/5 on usability survey"
      baseline: "N/A"

  regulatory_impact: "critical"
  safety_impact: "critical"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 3.1"
    - "IEC 62304 Class B safety requirements"
    - "ISO 14971 risk control measures"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"
    - "IEC 62366-1:2015"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-015", "DI-LEO-AI-016"]
  validation_tests: ["VAL-LEO-AI-002"]

  tags: ["hitl", "human-review", "safety-critical", "cross-cutting", "regulatory"]
