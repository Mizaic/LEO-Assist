# -- DI-LEO-AI-212 -- Extended narrative-reference guard (Pattern J)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-212"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-005"
    - "UN-LEO-AI-006"
  requirement: >
    The text-anchor classifier _RE_NARRATIVE_REFERRAL_REFERENCE
    pattern SHALL also match past-tense seen-narratives ("was seen
    by ENT under 2WW in Jan", "had been seen in fast track clinic
    last month", "patient seen under 2WW") and inter-clinician
    clarification artefacts ("Write to ENT to clarify", "letter to
    consultant", "email to specialist") so that a follow-up
    encounter that only describes a previous referral / requests a
    clarification does not fire a fresh text_generic referral
    anchor.
  rationale: >
    Patient 4842019832's 2025-06-30 GP follow-up encounter said
    "Was seen by ENT under 2ww in Jan. Found to have
    laryngopharyngeal reflux with chronic rhinosinusitis. ...
    Write to ENT to clarify that polyp requires no FU." DI-LEO-AI-202
    suppresses many narrative shapes ("noted ongoing previous 2WW",
    "did not attend") but did not catch the past-tense passive
    voice "was seen by ... under 2WW in <month>" or the structural-
    looking but actually-conversational "Write to ENT". The result
    was a phantom in_progress unknown-cancer episode dated
    2025-06-30. This narrative shape is common across follow-up
    notes and discharge letters, so the fix is generic.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "_RE_NARRATIVE_REFERRAL_REFERENCE.search('Was seen by ENT under 2ww in Jan.') is not None"
      - type: "functional"
        spec: "_RE_NARRATIVE_REFERRAL_REFERENCE.search('Patient seen under fast track clinic last month.') is not None"
      - type: "functional"
        spec: "_RE_NARRATIVE_REFERRAL_REFERENCE.search('Write to ENT to clarify that polyp requires no FU.') is not None"
      - type: "functional"
        spec: "_RE_NARRATIVE_REFERRAL_REFERENCE.search('Letter to consultant requesting clarification of plan.') is not None"
      - type: "safety"
        spec: "_RE_STRUCTURAL_REFERRAL.search('Outbound referral (XaY59) - Fast track referral for suspected H&N cancer') is not None"
      - type: "safety"
        spec: "Was-seen-narrative follow-up MUST NOT emit text_generic referral when no structural artefact is present"
    constraints:
      - type: "safety"
        spec: "Extended narrative pattern MUST coexist with the existing C+D narrative alternations - no shape may be removed"
    dependencies:
      - "DI-LEO-AI-202"
    downstream_impacts:
      - "Anchor detector (text path)"
      - "Practice-level pathway counts (fewer phantom unknown-cancer episodes from review notes)"
    technical_details:
      language: "Python"
      framework: "Anchor detector (regex layer)"
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 20

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-204 must pass with 100% on all critical and total
      cases, including the patient 4842019832 was-seen-narrative
      regression and the structural-keep-list verification.
    test_protocol: "VT-LEO-AI-204"

  safety_class: "B"
  risks:
    - "R-LEO-AI-200"
  tags:
    - "anchor-detector"
    - "referral-classification"
    - "narrative-guard"
    - "patient-4842019832"
