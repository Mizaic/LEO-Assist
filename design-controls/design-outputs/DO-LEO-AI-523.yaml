# -- DO-LEO-AI-523 -- Dry-run review-list highlighter + match rationale chips
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-523"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-523"]
    user_needs: ["UN-LEO-AI-096"]
    risks_addressed:
      - "R-LEO-AI-063"
      - "R-LEO-AI-174"
    verification_tests: ["VT-LEO-AI-521"]

  specification:
    title: "CandidateReviewList + GoldLabelReviewList highlighter + match rationale chips"
    description: |
      Wires the deterministic shared encounter-search vocabulary
      (DI-LEO-AI-520, encounterRelevance.ts) into the /admin/training
      review lists so the dry-run Candidates queue and the Verified
      gold / Synthetic gold sub-tabs render the same amber
      highlighter and the same "why this matched" chip row as the
      /care/encounters host search and the /care/patients side
      drawer.

      Implementation pieces:

        1. `CandidateReviewList.tsx` accepts a `search?: string`
           prop, expands it once per render via `expandSearchTerms`
           (memoised), and per-row computes a `matchRationale`. The
           row title is wrapped in `<HighlightedText>` whenever
           `collectHighlightTerms(search, hitTerms)` is non-empty,
           and the existing `chips:` slot is prepended with an
           outlined chip row capped at 4 hit terms.

        2. `GoldLabelReviewList.tsx` mirrors the same wiring for
           `item.text` so verified and synthetic gold rows speak
           the same vocabulary as candidate rows.

        3. `GoldDatasetPanel.tsx` forwards `debouncedSearch` to
           both review lists so the chips reflect the query that
           drove the server fetch, not the in-flight buffer.

      Both highlighter and chips are additive: with no query, no
      expansion, or no hits, the rows fall back to the existing
      string title and chip set with no behavioural change.

    acceptance_criteria:
      - criterion: "CandidateReviewList wires the shared utility"
        type: "functional"
        measurement: "Static-source"
        target: "Imports computeMatchRationale, expandSearchTerms, MatchRationale from mission-control/encounterRelevance and HighlightedText, collectHighlightTerms from mission-control/HighlightedText"
      - criterion: "Search prop forwarded by GoldDatasetPanel"
        type: "functional"
        measurement: "Static-source"
        target: "Both <CandidateReviewList> and <GoldLabelReviewList> instances receive search={debouncedSearch}"
      - criterion: "Title delegates to HighlightedText"
        type: "functional"
        measurement: "Static-source"
        target: "buildItem in both lists wraps the truncated title in <HighlightedText> with testId 'candidate-row-highlight' when collectHighlightTerms returns a non-empty array"
      - criterion: "Match rationale chip row rendered with 4-cap"
        type: "functional"
        measurement: "Static-source"
        target: "renderRationaleChips returns a Box with data-testid candidate-row-match-rationale containing matchRationale.hitTerms.slice(0, 4) outlined Chip elements with data-testid candidate-row-match-rationale-chip, height 20, fontSize 0.65rem"
      - criterion: "GoldLabelReviewList parity"
        type: "functional"
        measurement: "Static-source"
        target: "Same wiring applied to verified / synthetic rows so all three sub-tabs share the chip taxonomy and highlighter"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/CandidateReviewList.tsx"
        description: "Wires search prop, expandSearchTerms, computeMatchRationale, HighlightedText title and rationale chip row"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldLabelReviewList.tsx"
        description: "Same wiring for verified / synthetic gold rows"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
        description: "Forwards debouncedSearch to both review lists"
        storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 110
      key_functions:
        - "CandidateReviewList (search prop + memoised expandedTerms + buildItem)"
        - "GoldLabelReviewList (search prop + memoised expandedTerms + buildItem)"
        - "renderRationaleChips (both lists)"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Highlighter and chip row must be visual only and must not affect mark-gold, delete, or open-editor write paths"
      - "Chip taxonomy must mirror the host row's so reviewers do not misread synonym hits as new findings or codes"
    risk_control_measures:
      - "Reuses the pure-TS encounterRelevance.ts module (no React side-effects)"
      - "expandSearchTerms returns [] for blank queries; row falls back to plain title and existing chip set"
      - "Chip token (height, fontSize, variant) matches the drawer's encounter-card-match-rationale-chip"

  verification_status:
    verification_method: "Test"
    verification_complete: false
