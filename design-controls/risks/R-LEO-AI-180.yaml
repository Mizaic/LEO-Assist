# -- R-LEO-AI-180 -- Chunk text drift / desynchronisation
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-180"
  title: "A Chunk node persists text that no longer matches the source DocumentReference, causing reviewers to validate coded evidence against stale text"

  hazard:
    description: >
      The DocumentReference text is re-ingested or edited, but the
      previously-persisted Chunk nodes retain their original text and
      char offsets. A reviewer opening the Audit trail sees a SNOMED
      concept attributed to a chunk whose text no longer matches the
      current document.
    category: "clinical_safety"

  hazardous_situation: >
    A referral letter is replaced with a corrected version (typo fix,
    additional paragraph) and re-ingested. The chunk writer creates
    new Chunk nodes for the new text, but a stale (old) Chunk row
    survives because its sha256 differs. A reviewer sees TWO chunks
    for the same letter with overlapping char offsets but different
    text, and the SNOMED concept is attributed to whichever was
    written first.

  harm:
    description: >
      Reviewer signs off coded evidence against text that does not
      exist in the current letter. If the stale chunk happens to
      contain a finding (e.g. "haemoptysis") that was removed in the
      corrected letter, the patient could be inappropriately fast-
      tracked; conversely, if the corrected letter ADDED a finding
      and the stale chunk is the one shown, the finding is missed.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 4
    rpn: 24
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Chunk.id is deterministic on (document_reference_id, ordinal,
        sha256), so re-ingesting the SAME text is idempotent and
        does not create duplicates. Re-ingesting CHANGED text creates
        new chunks while preserving the old ones for audit, which is
        the explicitly desired behaviour for evidence integrity.
      implemented_by: ["DI-LEO-AI-186"]
      verified_by: ["VT-LEO-AI-185"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Audit trail surfaces show ALL chunks for a document with their
        sha256 and char offsets so reviewers can spot when a stale
        chunk is being used. Chunk-attributed evidence is timestamped
        via Chunk.created_at.
      implemented_by: ["DI-LEO-AI-186"]
      verified_by: ["VT-LEO-AI-185"]
      effectiveness: "partially_effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 3
    rpn: 9
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The deterministic id and sha256 make the regression class
      structurally observable. A separate post-deployment monitoring
      task (audit query for documents whose latest re-ingest produced
      net-new chunks but whose old chunks still hold coded evidence)
      will catch any case where the procedural mitigation is
      insufficient.

  monitoring:
    monitoring_plan: >
      Weekly query for DocumentReferences with multiple chunks at
      the same (ordinal) but different sha256s and review whether
      :DOCUMENTS edges from the older chunk are still in use.
    metrics:
      - "Documents with >1 active chunk per ordinal (target 0)"
      - "Coded evidence linked to chunks not present in the latest document re-ingest (target 0)"
    review_frequency: "Weekly"

  metadata:
    identified_by: "Plan workshop 2026-04-17"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "documents"
      - "chunks"
      - "audit-trail"
