# -- DO-LEO-AI-087 -- Data Quality Toolkit Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-087"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-089"]
    user_needs: ["UN-LEO-AI-056"]
    risks_addressed: ["R-LEO-AI-063"]
    verification_tests: ["VT-LEO-AI-089"]

  specification:
    title: "Data Quality Toolkit -- Service Layer, API Router, MCP Server, and Admin UI"
    description: |
      Implementation of the DQ toolkit across four layers:

      1. libs/dq/ service layer: Pydantic-modelled functions for patient
         inspection, episode health, outcome inference, terminology audit,
         coding quality, domain coverage, remediation (dry-run default), and
         an ISO-25012-aligned rules engine with YAML-configurable checks.

      2. FastAPI router at /admin/dq/* gated by require_admin, delegating
         all logic to libs/dq/ service functions.

      3. Cursor MCP server (stdio) exposing read-only DQ tools, calling the
         core API over HTTP with admin credentials.

      4. Next.js admin UI at /admin/data-quality with a traffic-light
         scorecard landing page, drill-down pages per domain (episodes,
         terminology, domain, coding, patient inspector, sitrep), and a
         confirmation-first remediation UX pattern.
    acceptance_criteria:
      - criterion: "Episode health endpoint returns status breakdown"
        type: "functional"
        measurement: "Test"
        target: "GET /admin/dq/episodes/health returns JSON with status_counts dict"
      - criterion: "Outcome inference produces verdicts"
        type: "functional"
        measurement: "Test"
        target: >
          infer_outcome() returns OutcomeInferenceResult with verdict in
          the allowed set for each stale episode
      - criterion: "Rules engine produces scorecard"
        type: "functional"
        measurement: "Test"
        target: "run_all_rules() returns non-empty list[DQCheckResult]"
      - criterion: "Remediation dry-run returns preview"
        type: "safety"
        measurement: "Test"
        target: >
          POST /admin/dq/remediation/delete-patient with dry_run=true returns
          affected_count without executing any Cypher writes
      - criterion: "Admin auth guard"
        type: "safety"
        measurement: "Test"
        target: "Unauthenticated and non-admin requests return HTTP 403"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/dq/"
        description: >
          Service layer: _clients.py, _models.py, _filters.py,
          signal_patterns.py, patient.py, episodes.py, terminology.py,
          coding.py, domain.py, remediation.py, reports.py, rules_engine.py
      - artifact_type: "source_code"
        location: "services/api/app/routers/data_quality.py"
        description: "FastAPI router delegating to libs/dq/ service functions"
      - artifact_type: "source_code"
        location: "services/dq_mcp/"
        description: "stdio MCP server exposing read-only dq_* tools"
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/data-quality/"
        description: "Next.js admin UI pages and API client"
      - artifact_type: "configuration"
        location: "libs/dq/rules.yaml"
        description: "YAML-configurable DQ rules across 10 ISO 25012 dimensions"
    storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 1200
      key_functions:
        - "get_episode_health"
        - "get_stale_episodes"
        - "infer_outcome"
        - "run_all_rules"
        - "get_surface_form_audit"
        - "delete_patient_dry_run"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "All /admin/dq/remediation/* endpoints -- writes to patient graph"
      - "infer_outcome -- produces clinical outcome inference used in HITL decisions"
    risk_control_measures:
      - "dry_run=true default on all mutation endpoints"
      - "require_admin dependency on all routes"
      - "MCP server exposes read-only tools only"
      - "Confirmation dialog in UI before any mutation is applied"

  verification_status:
    verification_method: "Test"
    verification_complete: false
