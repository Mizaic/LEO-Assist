# -- DI-LEO-AI-050 -- Post-Processing Pipeline Parity
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-050"
  type: "Safety"
  derived_from: ["UN-LEO-AI-001"]
  requirement: >
    The post-processing stack applied to training data (gold label
    verification) SHALL be identical to the post-processing stack applied
    at inference time (runtime coding pipeline).  Both pipelines SHALL
    execute the same 9 layers in the same order with the same parameters,
    from a single shared implementation (libs/pipeline/post_processing.py).
    The only permitted deviation is the disorder gate (Layer 9), which is
    enabled by default during training and disabled by default at runtime.
    This deviation SHALL be explicitly configurable and documented.
  rationale: >
    Train/serve skew — where training data is processed differently from
    production data — is a well-known source of ML system failures.  If
    the training pipeline applies different post-processing layers, in a
    different order, or with different parameters than the runtime pipeline,
    the gold training data will reflect different semantics than production
    outputs.  This undermines evaluation metrics, causes silent accuracy
    degradation, and creates patient safety risks where entities are
    classified differently during coding than during training.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "A single run_post_processing() function in libs/pipeline/post_processing.py implements all 9 layers"
      - type: "safety"
        spec: "The training pipeline (label_verifier.py) calls run_post_processing()"
      - type: "safety"
        spec: "The runtime pipeline (pipeline_service.py) calls run_post_processing()"
      - type: "safety"
        spec: "Both pipelines execute layers in identical order: (1) Post-Processor Rules, (2) Lab-Value Guard, (3) Scope Guard, (4) Observable Normalisation, (5) Entity-Type Normalisation, (6) Value-Unit Linking, (7) ConText Assertion Detection, (8) Situation Lookup Normalisation, (9) Disorder Gate"
      - type: "safety"
        spec: "The disorder gate toggle (enable_disorder_gate) is the only configurable deviation between training and runtime"
      - type: "test"
        spec: "Pipeline parity tests verify that the same input entities produce identical output through both training and runtime paths (excluding disorder gate)"

    constraints:
      - type: "safety"
        spec: >
          No post-processing layer may exist in only one pipeline.  Any new
          layer must be added to the shared module and applied to both
          training and runtime data.
      - type: "architecture"
        spec: >
          The shared module operates on plain entity dicts.  The runtime
          pipeline uses ExtractionItem adapter functions (to_entity_dicts /
          from_entity_dicts) for conversion.

    dependencies: ["DI-LEO-AI-005", "DI-LEO-AI-044", "DI-LEO-AI-048"]

    downstream_impacts:
      - "Training data quality and evaluation metric validity"
      - "Runtime coding accuracy"
      - "Model performance consistency across training and inference"
      - "Clinical safety (preventing silent behaviour differences)"

    technical_details:
      language: "Python"
      framework: "Shared libs"
      file_structure:
        - "libs/pipeline/post_processing.py"
        - "services/api/app/services/label_verifier.py"
        - "services/coding_worker/app/pipeline/pipeline_service.py"
        - "tests/test_post_processing_pipeline.py"
        - "tests/test_pipeline_parity.py"
        - "tests/test_label_verifier_normalization_rules.py"
      estimated_loc: 350

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All pipeline parity tests pass (test_pipeline_parity.py), confirming
      that training and runtime pipelines produce identical post-processing
      output for the same input entities.  All integration tests pass
      (test_post_processing_pipeline.py), verifying layer ordering, I/O
      contracts, and the disorder gate toggle.
    test_protocol: "VT-LEO-AI-050"

  safety_class: "B"
  risks: ["R-LEO-AI-029", "R-LEO-AI-033"]
  tags:
    - "clinical-safety"
    - "train-serve-parity"
    - "post-processing-pipeline"
    - "architecture"
    - "defence-in-depth"
