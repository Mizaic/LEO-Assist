# -- DI-LEO-AI-086 -- Per-episode specialist visit claiming algorithm
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-086"
  type: "Functional"
  derived_from: ["UN-LEO-AI-053"]
  requirement: >
    The episode detection system SHALL attribute each specialist visit anchor to
    at most one EpisodeOfCare node using a per-episode temporal claiming
    algorithm. A specialist visit is eligible for an episode only if (a) its
    encounter date is on or after the episode referral date, (b) its encounter
    date is on or before the episode window end date (diagnosis date for closed
    episodes; referral_date + 365 days for open episodes), and (c) its cancer
    site key is compatible with the episode site key. Episodes are processed in
    referral-date order (earliest first) so that earlier pathways have priority
    over later pathways when multiple episodes share a site key. Each visit that
    is successfully claimed is removed from the pool and cannot be attributed to
    any other episode.

  rationale: >
    The previous implementation maintained a global dict keyed by cancer site
    (e.g. "breast"). Every episode sharing that site key received the same
    specialist_seen flag and specialist_visit_date, irrespective of temporal
    ordering. This caused historic specialist visits to contaminate later
    same-site referrals, producing false stale_post_specialist episode closures
    and incorrect NCDA audit specialist-seen rates.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "After episode rebuild, zero EpisodeOfCare nodes have specialist_visit_date < referral_date"
      - type: "functional"
        spec: "A patient with two same-site referrals in different years has distinct specialist_visit_date values on each episode (or None where no visit exists in window)"
      - type: "safety"
        spec: "A specialist visit whose encounter_date precedes the episode referral_date is never stored as specialist_visit_date on that episode"
    constraints:
      - type: "safety"
        spec: "Each specialist anchor must contribute specialist_seen=True to at most one episode per rebuild"
    dependencies: ["DI-LEO-AI-083", "DI-LEO-AI-084"]
    downstream_impacts:
      - "EpisodeOfCare.specialist_seen accuracy"
      - "EpisodeOfCare.specialist_visit_date accuracy"
      - "stale_post_specialist episode counts"
      - "NCDA audit specialist-seen rate"
      - "Dashboard KPI time-from-referral-to-specialist"
    technical_details:
      language: "Python"
      framework: "analysis_worker / episode_builder"
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_builder.py"
      estimated_loc: 60

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-086 pass, including the core no-cross-
      contamination case and the visit-before-referral exclusion case.
    test_protocol: "VT-LEO-AI-086"

  safety_class: "B"
  risks: ["R-LEO-AI-060"]
  tags:
    - "episode-detection"
    - "specialist-matching"
    - "ncda-audit"
