# -- DI-LEO-AI-177 -- Cancer follow-up template recogniser
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-177"
  type: "Functional"
  derived_from: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
  requirement: >
    The episode-building text path SHALL recognise free-text cancer
    follow-up template markers (e.g. "Skin Cancer Follow Up", "Breast
    Cancer Follow Up", "Cancer follow-up clinic") as evidence that the
    patient is being actively monitored for a confirmed cancer.
    Specifically:
    (a) libs/domains/code_inventories.py SHALL expose
    CANCER_FOLLOW_UP_PHRASES as a list of (regex, site_key) tuples
    covering the recognised template names;
    (b) the anchor detector SHALL match these phrases (case-insensitive)
    in encounter text and emit a diagnosis_confirmed anchor with
    diagnosis_source="cancer_follow_up_template", site_key from the
    matched pattern (or "non_site_specific" if not site-specific),
    confidence=0.8, and hitl_required=True;
    (c) the history-of-cancer guard SHALL still apply - a follow-up
    template inside a "H/O cancer" encounter MUST NOT fire
    diagnosis_confirmed.
  rationale: >
    The 2026-04-17 audit of patient 4921442355 found that the UHL
    Dermatology service used a "Skin Cancer Follow Up" template at
    the 6-month surveillance visit (2025-06-25), which is unambiguous
    evidence the patient has a confirmed cancer being actively
    monitored. The template name was free-text only (no Read code),
    so none of the existing detectors caught it. Equivalent templates
    exist for breast, prostate, colorectal and head-and-neck
    surveillance pathways.
    Treating the template as a diagnosis_confirmed signal lets us
    recover confirmed cancers whose original diagnosis Read code was
    filed by secondary care and never coded back into primary care -
    a known gap for older Read records and outpatient-only diagnoses.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs/domains/code_inventories.py exposes CANCER_FOLLOW_UP_PHRASES
          and a helper find_cancer_follow_up_phrase(text) that returns
          (matched_phrase, site_key) or None.
      - type: "functional"
        spec: >
          The detector recognises at least these template names:
          "skin cancer follow up", "skin cancer follow-up",
          "melanoma follow up", "breast cancer follow up",
          "prostate cancer follow up", "colorectal cancer follow up",
          "lung cancer follow up", "haematology cancer follow up",
          and the generic "cancer follow up clinic" / "oncology
          surveillance".
      - type: "safety"
        spec: >
          When find_cancer_follow_up_phrase returns a hit AND
          text_contains_history_of_cancer also returns True, the
          detector MUST NOT emit diagnosis_confirmed for this encounter.
          The history guard wins.
      - type: "performance"
        spec: >
          Patient 4921442355 episode 42b722eb6082a4b7 MUST receive a
          diagnosis_confirmed anchor on 2025-06-25 via the
          cancer_follow_up_template path, contributing to its
          reclassification to status='completed'.
    constraints:
      - type: "safety"
        spec: >
          Phrase patterns MUST require the literal word "follow" within
          80 characters of "cancer" / "oncology" / "melanoma" to avoid
          firing on referral text like "fast track for suspected skin
          cancer" or "discussion of cancer risk".
    dependencies: ["DI-LEO-AI-159", "DI-LEO-AI-171", "DI-LEO-AI-175"]
    downstream_impacts:
      - "Surveillance-only confirmed cancers recovered into the cohort"
      - "HITL queue grows for follow-up-template diagnoses (verify date)"
    technical_details:
      language: "Python"
      framework: "analysis_worker + libs"
      file_structure:
        - "libs/domains/code_inventories.py"
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 90

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in tests/test_stale_detector_fixes.py class
      TestCancerFollowUpTemplate pass. Patient 4921442355 episode
      42b722eb6082a4b7 receives a diagnosis_confirmed anchor on
      2025-06-25 with diagnosis_source="cancer_follow_up_template".
    test_protocol: "VT-LEO-AI-172"

  safety_class: "B"
  risks: ["R-LEO-AI-172"]
  tags:
    - "episode-building"
    - "missed-cancer"
    - "follow-up-template"
    - "free-text"
