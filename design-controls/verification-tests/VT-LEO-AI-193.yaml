        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-005"
      case_name: "Plain 'NSS referral' classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('NSS referral')"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-006"
      case_name: "'non-specific symptoms' (mid-sentence) classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('Patient discussed: non-specific symptoms suggestive of cancer')"
          expected_result: "Returns 'non_site_specific'"
          verification_method: "automated"
      acceptance_criteria:
        - "Result == 'non_site_specific'"

    - case_id: "VT-193-TC-007"
      case_name: "'Non specific symptoms - 2WW referred' classifies as NSS"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "_extract_condition_key('Non specific symptoms - 2WW referred')"
