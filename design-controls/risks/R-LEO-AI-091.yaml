# -- R-LEO-AI-091 -- Role switch during an active safety task
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-091"
  title: "Switching role mid-task discards unsaved safety-critical input"

  hazard:
    description: >
      A user is part-way through a safety-netting action (for example
      resolving an alert or coding a suspected cancer) when they
      click the RoleSwitcher. If the switcher navigates away from the
      current page without warning, unsaved input is lost and the
      safety task is left incomplete.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician opens a suspected-cancer alert, writes half of a
    resolution note, then clicks RoleSwitcher to move to the staff
    role. The app navigates to the staff landing page. The note is
    never submitted and the alert remains open, appearing resolved
    to the user because the page is now gone.

  harm:
    description: >
      Safety-netting action is incomplete and the alert remains
      unactioned; the user believes they have moved on. Follow-up
      on the patient is delayed.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        RoleSwitcher prompts a dirty-form confirmation ("You have
        unsaved work. Leave anyway?") before switching role if the
        active route has unsaved state. Confirmation defaults to
        Cancel so the user must deliberately confirm the switch.
      implemented_by: ["DI-LEO-AI-133"]
      verified_by: ["VT-LEO-AI-129"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Role switch writes an append-only (:RoleSwitch) audit node
        with the from/to roles and session id, so a missed action can
        be reconstructed from the audit trail.
      implemented_by: ["DI-LEO-AI-129"]
      verified_by: ["VT-LEO-AI-125"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Feature flag NEXT_PUBLIC_ROLE_FIRST defaults to 'off' during
        rollout so the new switcher only reaches users after the
        dirty-form confirmation is implemented.
      implemented_by: ["DI-LEO-AI-133"]
      verified_by: ["VT-LEO-AI-129"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      A confirmation dialog and an append-only audit trail together
      make an accidental, silent switch mid-task extremely unlikely
      while preserving the user's ability to switch deliberately.

  monitoring:
    monitoring_plan: >
      Quarterly review of (:RoleSwitch) audit nodes created within
      60 seconds of an unresolved safety-netting task on the prior
      route. Investigate outliers.
    metrics:
      - "role_switches_during_open_safety_task"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Wave D safety review"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "role-first"
      - "safety-netting"
