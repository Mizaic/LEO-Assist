# -- DO-LEO-AI-189 -- SBAR orchestrator service
- id: "DO-LEO-AI-189"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-190"]
    user_needs: ["UN-LEO-AI-080"]
    risks_addressed: ["R-LEO-AI-182", "R-LEO-AI-183"]
    verification_tests: ["VT-LEO-AI-187"]

  specification:
    title: "services/pipeline_worker/app/services/sbar_orchestrator.py"
    description: |
      One-shot SBAROrchestrator class plus handle_sbar_message dispatch
      helper. Coordinates the four-stage pipeline (situation -> background
      -> deterministic Assessment -> recommendation), persists each
      section incrementally via the Cypher queries from DO-LEO-AI-188,
      and publishes per-stage progress on Redis pub/sub channel
      pipeline:{run_id}. Source resolution is delegated to
      libs/sbar/source_resolver.py and LLM calls to
      libs/sbar/prompt_calls.py so the orchestrator stays focused on
      flow control.
    acceptance_criteria:
      - criterion: "Stage ordering"
        type: "functional"
        measurement: "Test"
        target: "Emits sbar_started -> 4x stage_started/completed -> sbar_completed"
      - criterion: "Degrade-to-draft"
        type: "functional"
        measurement: "Test"
        target: "Situation LLM error -> Assessment.status='draft' with error recorded; pipeline continues"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/pipeline_worker/app/services/sbar_orchestrator.py"
        description: "SBAROrchestrator + handle_sbar_message"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/sbar/source_resolver.py"
        description: "ResolvedSituation/Source/Code data classes + resolve_* + aggregate_codes"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/sbar/prompt_calls.py"
        description: "call_situation/call_background/call_recommendation"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/pipeline_worker/app/main.py"
        description: "on_message dispatcher branch for sbar_requested"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 700
      key_functions: ["SBAROrchestrator.run", "handle_sbar_message"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Always runs the deterministic Assessment formatter, even on LLM failure"
      - "Always finalises the Assessment node so downstream cleanup can find it"
    risk_control_measures:
      - "errors[] list captured per-stage and returned with the Assessment so reviewers see degraded sections"

  verification_status:
    verification_method: "Test"
    verification_complete: true
