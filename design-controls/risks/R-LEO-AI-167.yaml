# -- R-LEO-AI-167 -- Probe surface regression after Phase 6b-vi decomposition
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-167"
  title: "Decomposing PortEdge.tsx and probeStrategies.tsx hides a runtime regression in the probe surface"

  hazard:
    description: >
      Splitting a 1781-LOC component into eleven sibling modules is a
      mechanical refactor with a meaningful chance of introducing a
      subtle behavioural drift (missed prop, swapped state owner,
      lost effect cleanup). The probe surface is what reviewers use
      to confirm what each pipeline step produced, so a quiet
      regression here would let coding errors pass review unnoticed.
    category: "clinical_safety"

  hazardous_situation: >
    A reviewer opens the pathway canvas, clamps a probe on an edge,
    and the popover renders without surfacing a halt banner or an
    inspector path because of a regression introduced during the
    decomposition. The reviewer believes the upstream step succeeded
    when it actually halted, and signs off a coding decision that
    should have been blocked.

  harm:
    description: >
      A coding decision that should have been gated by human review
      reaches the patient record, leading to an incorrect tier or
      missed safety-net alert.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Each extracted module re-exports its public API through the
        same import path so consumer files do not change, and the
        component tree remains structurally identical.
      implemented_by: ["DI-LEO-AI-168"]
      verified_by: ["VT-LEO-AI-167"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        VT-LEO-AI-167 statically asserts file size limits, the
        presence of the ESLint guard, and registry parity so the
        decomposition cannot silently regress under future work.
        VT-LEO-AI-158 (existing) continues to assert role=dialog,
        Escape handler, and registry parity at the source level.
      implemented_by: ["DI-LEO-AI-168"]
      verified_by: ["VT-LEO-AI-167"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Playwright + @axe-core/playwright smoke spec for the
        /admin/pathways route confirms the editor still mounts and
        passes the WCAG 2.1 AA baseline after the refactor.
      implemented_by: ["DI-LEO-AI-168"]
      verified_by: ["VT-LEO-AI-167"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The static-source tests pin the import structure, the existing
      pathway-canvas test suite (49 cases, all passing) covers the
      probe popover behaviours, and the Playwright + axe baseline
      catches any chrome-level regression. Residual risk is the
      possibility of a runtime-only regression that escapes both
      static and a11y verification, mitigated by the in-app
      reviewer's existing visual check before sign-off.

  monitoring:
    monitoring_plan: >
      Track the count of pathway probe-related bug reports in the
      operational backlog after the decomposition lands; a spike
      in the first 30 days triggers an extra Playwright case to
      cover the regression scenario.
    metrics:
      - "Number of pathway probe bug reports per fortnight"
      - "Pathway editor /admin/pathways[/id] error rate (frontend)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Wave E Phase 6b-vi cleanup discovery"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "pathways"
      - "knowledge"
      - "design-system"
      - "phase-6b-vi"
