# -- VT-LEO-AI-007 -- Episode Building Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-007"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-009", "DI-LEO-AI-010", "DI-LEO-AI-011"]
    risks: ["R-LEO-AI-021"]
    user_needs: ["UN-LEO-AI-005", "UN-LEO-AI-006"]

  metadata:
    title: "Episode Building Verification"
    description: >
      Verifies that the episode building service correctly detects clinical
      milestones from coded encounters, constructs episodes with appropriate
      milestone links, classifies episodes accurately, and consolidates
      overlapping episodes.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_episode_builder.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 installed with project dependencies"
      - "Milestone detection rules loaded"
      - "Labelled episode test dataset with known milestone sequences available"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-007-TC-001"
      case_name: "Milestones detected from coded encounters"
      priority: "critical"
      preconditions:
        - "Milestone detection rules configured for referral, diagnosis, treatment, and discharge"
        - "Test encounters include known milestone events"
      test_steps:
        - step_number: 1
          action: "Submit a sequence of coded encounters containing a referral event"
          expected_result: "Referral milestone is detected and returned with correct timestamp"
          verification_method: "Assert milestone type='referral' and timestamp matches the encounter date"
        - step_number: 2
          action: "Submit encounters containing diagnosis, treatment, and discharge events"
          expected_result: "All expected milestones are detected in order"
          verification_method: "Assert milestone list matches the gold-standard sequence"
      acceptance_criteria:
        - "All known milestones are detected"
        - "No spurious milestones are created"

    - case_id: "VT-007-TC-002"
      case_name: "Episodes constructed with correct milestone links"
      priority: "critical"
      preconditions:
        - "Milestones from TC-001 are available"
      test_steps:
        - step_number: 1
          action: "Run episode builder on detected milestones for a single patient"
          expected_result: "An episode is created linking referral -> diagnosis -> treatment -> discharge"
          verification_method: "Assert episode contains all expected milestone IDs in order"
        - step_number: 2
          action: "Verify episode start and end dates match the first and last milestone"
          expected_result: "Episode date range spans from referral to discharge"
          verification_method: "Assert episode.start_date == referral.date and episode.end_date == discharge.date"
      acceptance_criteria:
        - "Episode contains all linked milestones"
        - "Episode date range is correct"

    - case_id: "VT-007-TC-003"
      case_name: "Episode classification accuracy >= 85%"
      priority: "high"
      preconditions:
        - "Full labelled episode dataset loaded with expected classifications"
      test_steps:
        - step_number: 1
          action: "Run episode classification across the entire labelled dataset"
          expected_result: "Classification accuracy metric computed"
          verification_method: "Assert accuracy >= 0.85"
        - step_number: 2
          action: "Log misclassified episodes for audit"
          expected_result: "Each misclassification is recorded with expected vs actual label"
          verification_method: "Verify audit log contains details of each misclassified episode"
      acceptance_criteria:
        - "Overall classification accuracy >= 85%"
        - "No critical episode type has accuracy below 75%"

    - case_id: "VT-007-TC-004"
      case_name: "Overlapping episodes consolidated"
      priority: "high"
      preconditions:
        - "Test data includes patients with overlapping episode date ranges for the same condition"
      test_steps:
        - step_number: 1
          action: "Submit encounters that produce two overlapping episodes for the same condition"
          expected_result: "Overlapping episodes are merged into a single episode"
          verification_method: "Assert only one episode exists for the condition with a merged date range"
        - step_number: 2
          action: "Submit encounters that produce overlapping episodes for different conditions"
          expected_result: "Episodes remain separate (no incorrect merging)"
          verification_method: "Assert both episodes exist independently"
      acceptance_criteria:
        - "Same-condition overlapping episodes are merged"
        - "Different-condition overlapping episodes are preserved separately"

  pass_fail_criteria:
    pass_threshold: "100% critical, 90% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-007/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-007-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      duration_seconds: 2
      notes: "All 9 test cases passed (pytest VT-LEO-AI-007)"
    - execution_id: "VT-007-EXEC-002"
      date: "2026-04-08"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 37
      cases_passed: 37
      cases_failed: 0
      duration_seconds: 1
      notes: >
        NCDA cancer-type remapping change verified. _SITE_MAP updated to use
        NCDA-specific type keys (colorectal, prostate, bladder, ovarian, etc.)
        instead of broad pathway groups (lower_gi, urological, gynaecological).
        New tests: test_ncda_specific_types (36 type cases), test_ncda_concept_id_overrides,
        test_site_keys_compatible_pathway_to_specific. All 37 tests passed.
        pytest tests/test_episode_builder.py tests/test_episode_builder_benign_closure.py -v
