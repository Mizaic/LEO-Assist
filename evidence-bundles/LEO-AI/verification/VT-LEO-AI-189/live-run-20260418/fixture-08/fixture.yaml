id: SBAR-GS-08
title: 'Conflicting allergy data across two sources: must surface the conflict'
clinical_scenario: 'Two background sources disagree on a penicillin allergy: the GP

  encounter records "no known drug allergies" while a hospital

  discharge summary records "penicillin - rash". Reviewer must confirm

  the LLM surfaces the conflict explicitly rather than picking one

  side. Hardening rule 2 (surface conflicts) is the focus.

  '
input:
  patient_id: pat-gs-08
  situation:
    artifacts:
    - type: fixed_text
      text: Pre-operative review for elective hernia repair
  background:
  - type: encounter
    id: enc-gs-08-gp
  - type: document_reference
    id: doc-gs-08-discharge
  guideline_ids: []
resolved_situation:
  patient_id: pat-gs-08
  patient_summary:
    age_band: 50-59
    sex: M
  artifacts:
  - kind: text
    text: Pre-operative review for elective hernia repair
resolved_background:
- source_label: Encounter
  source_id: enc-gs-08-gp
  text: '55M GP review 03/2026: pre-op assessment. NKDA recorded.

    Otherwise well, BP 128/82.

    '
  codes:
  - concept_id: '716186003'
    term: No known drug allergy
    assertion: present
- source_label: DocumentReference
  source_id: doc-gs-08-discharge
  text: 'Discharge summary, City Hospital, 09/2024: appendicectomy.

    Allergies: PENICILLIN - widespread rash, documented during

    previous admission.

    '
  codes:
  - concept_id: '294505008'
    term: Allergy to penicillin
    assertion: present
llm_transcript:
  situation:
    markdown: '55-year-old man attending pre-operative assessment for an

      elective inguinal hernia repair [SOURCE: text].

      '
    actions: []
    error: null
  background:
    markdown: '- CONFLICT: GP record states No Known Drug Allergies [SOURCE: enc-gs-08-gp];
      hospital discharge summary documents penicillin allergy with rash [SOURCE: doc-gs-08-discharge].
      Allergy status MUST be reconciled before any antibiotic is prescribed.

      - Otherwise well, BP 128/82 at GP review [SOURCE: enc-gs-08-gp]

      - Previous appendicectomy 09/2024 [SOURCE: doc-gs-08-discharge]

      '
    error: null
  recommendation:
    markdown: 'Reconcile the allergy status before surgery: contact City

      Hospital for allergy testing record and update the GP record. Do

      NOT prescribe penicillin or beta-lactam antibiotics until the

      conflict is resolved. Otherwise the patient is fit for elective

      hernia repair on routine list.

      '
    actions:
    - action: Reconcile penicillin allergy status before surgery
      priority: urgent
      due_days: 7
      rule_ids: []
    error: null
evaluator_response:
  outage: false
  matched_rules: []
reviewer_expectations:
  required_section_headings:
  - '## Situation'
  - '## Background'
  - '## Assessment'
  - '## Recommendation'
  required_phrases_in_assessment:
  - No matching
  required_phrases_in_recommendation:
  - penicillin
  - - Reconcile
    - Clarify
    - Resolve
    - reconcile
    - clarify
    - resolve
  banned_phrases:
  - the patient has no known allergies
  - the patient is allergic to penicillin
  - as an AI
  expected_pathway_hints:
    rtr: 'no'
    rtr_evidence_contains: No matching rules fired
    stt_is_null: true
  reviewer_focus: "1. The Background MUST surface the allergy conflict explicitly\n\
    \   with the word CONFLICT and cite both sources.\n2. The transcript MUST NOT\
    \ pick a side as fact.\n3. The Recommendation MUST instruct reconciliation before\
    \ any\n   beta-lactam is prescribed.\n"
