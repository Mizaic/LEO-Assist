# -- DI-LEO-AI-207 -- EvaluateStage 'Approve as gold' button + error-weight badge + sort
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-207"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-086"
  requirement: >
    EvaluateStage SHALL render a green CheckCircleIcon IconButton
    with aria-label='Approve dry-run extraction as gold' next to
    the existing 'Open in gold editor' pencil on every dry-run row
    (NER-only and full-pipeline blocks). Clicking the button SHALL
    open a Dialog showing the encounter id, the count of entities
    being approved, every entity by surface text and label, and an
    info Alert telling the reviewer to use the editor for any
    wrong/missing entity. Confirming the dialog SHALL POST to
    /api/training/gold-labels/approve-from-dry-run with
    expected_entity_count = entities.length, surface 409 errors
    with the editor as the next step, and on success show a plain
    English info message naming the encounter. The component SHALL
    also call POST /api/training/per-encounter-weights/lookup after
    every dry-run completes, render an 'error weight X.X%' chip
    with data-testid='encounter-weight-chip' next to the entity
    count for any row whose candidate_id appears in the lookup
    response, and expose a 'Sort by error impact' toggle (only
    when at least one row has weight data) that re-orders both
    NER and full-pipeline result lists by descending
    error_contribution.
  rationale: >
    The two-click approve flow (icon -> dialog -> POST) is the
    minimum-friction path that still keeps the reviewer accountable
    for what enters gold. Showing every entity in the modal and
    refusing on count mismatch makes the audit trail accurate.
    The error-weight chip surfaces existing-but-discarded canary
    signal directly on the row that produces it, and the sort
    toggle turns the page into a directed correction queue without
    forcing a different default for users who prefer the existing
    encounter-id ordering.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "EvaluateStage imports CheckCircleIcon from @mui/icons-material/CheckCircle and renders an IconButton with aria-label='Approve dry-run extraction as gold' in BOTH the NER-only and full-pipeline row blocks"
      - type: "functional"
        spec: "Approve IconButton is disabled when row text is empty, when the row has zero entities, while approving is true, or when approveTarget?.encounterId === row.encounter_id"
      - type: "functional"
        spec: "requestApproveAsGold opens a Dialog (open={!!approveTarget}) listing every entity as a Chip; confirmApproveAsGold POSTs to /api/training/gold-labels/approve-from-dry-run with body {encounter_text, entities, expected_entity_count: entities.length, source_hint: `dry_run:<encounterIdPrefix>`}; on res.ok=false the UI surfaces detail; on res.status===409 the message instructs the reviewer to use the pencil"
      - type: "functional"
        spec: "After dryRunResults or pipelineTraceResults change, EvaluateStage POSTs every (encounter_id, text) pair to /api/training/per-encounter-weights/lookup once and stores the response under perEncounterWeights"
      - type: "functional"
        spec: "Each row that has a non-null weight renders a Chip with data-testid='encounter-weight-chip' and label `error weight X.X%`; chip color is 'warning' when error_contribution >= 0.05 else 'default'"
      - type: "functional"
        spec: "A 'Sort by error impact' Button (aria-pressed reflects sortByWeight) appears only when hasPerEncounterWeights is true; toggling it re-orders sortedDryRunResults and sortedPipelineTraceResults by descending error_contribution; rows without weight data sort to the end"
      - type: "functional"
        spec: "All copy is plain English at reading age 9-11 (button label 'Approve as gold', tooltip 'Approve this extraction as gold training data...', dialog title 'Approve as gold training data?', sort label 'By error impact')"
    constraints:
      - type: "safety"
        spec: "The Dialog is the ONLY commit point -- the IconButton itself never POSTs to gold; reviewer cannot bypass the dialog"
      - type: "safety"
        spec: "Lookup failures fail soft (chips simply absent); approve failures NEVER navigate the user away from the page so they can retry or escalate"
    dependencies:
      - "DI-LEO-AI-205"
      - "DI-LEO-AI-206"
    downstream_impacts:
      - "/admin/console Evaluate stage row markup"
    technical_details:
      language: "TypeScript"
      framework: "Next.js App Router + React 18 + MUI"
      file_structure:
        - "services/ui/src/components/console/EvaluateStage.tsx"
      estimated_loc: 220

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-196 (static-source jest VT) pins the imports, the
      two IconButtons with their aria-labels in both row blocks,
      the disabled guards, the POST + error path for the approve
      endpoint, the lookup useEffect, the chip rendering with
      data-testid, the sort toggle conditional rendering, and the
      Dialog wiring (open guard, entity list, confirm action).
    test_protocol: "VT-LEO-AI-196"

  safety_class: "B"
  risks:
    - "R-LEO-AI-192"
  tags:
    - "ui-action"
    - "training-data-quality"
    - "model-evaluation"
    - "active-learning"
