# -- R-LEO-AI-176 -- Silent zero-match when no ruleset is compiled
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-176"
  title: "Reviewer interprets a silent zero-match as 'rule does not match' when no ruleset is compiled"

  hazard:
    description: >
      The bitmap evaluator returns zero matches in two distinct
      conditions that are visually indistinguishable in the UI:
      (a) the patient legitimately does not satisfy any rule, and
      (b) no ruleset is compiled at all (cold start, missing scope,
      expired Redis keys, abandoned sandbox). A QA reviewer or
      clinical lead inspecting a test-patient replay or a per-rule
      diagnostic could conclude "the rule does not match this
      patient" -- and approve a regressing edit, ship a draft to
      production, or close a regression alert -- when in fact the
      evaluator had nothing loaded to evaluate against.
    category: "clinical_safety"

  hazardous_situation: >
    The reviewer is using the EditRuleDialog test-patient panel
    (live or sandbox) to triage a regression, OR is running a
    pre-deploy replay against a freshly created scope, OR is
    diagnosing a regression in the Replay Results dialog. The
    backend has no ruleset for the requested scope. The previous
    behaviour returned a zero-match report with no error, so the
    reviewer treated it as a clean pass and proceeded.

  harm:
    description: >
      Approval of an edit that silently disables a 2-week wait
      recommendation, a safety-net dashboard alert, or another
      Class B clinical control. The patient is not escalated within
      the NICE-mandated window. A second harm path exists for
      sandboxes that fail to compile (e.g. the draft has no
      SNOMED-coded leaf so the compiler drops the rule): the
      reviewer assumes "tested clean" when in fact NOTHING was
      tested.
    severity: "serious"

  hazardous_situation_likelihood: "occasional"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 5
    rpn: 45
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        GuidelineEvaluator.evaluate_patient() and diagnose() return
        an explicit ``not_compiled: True`` field along with a
        plain-English ``message`` and a ``recompile_hint`` URL when
        no active ruleset is found for the requested scope. The
        recompile hint is the exact POST URL the reviewer should
        call to fix the problem. Successful responses include
        ``not_compiled: False`` so consumers can rely on the flag
        unconditionally.
      implemented_by: ["DI-LEO-AI-181"]
      verified_by: ["VT-LEO-AI-175"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        RulesetNotCompiledBanner (a loud warning Alert with role
        "status" and an aria-label) is rendered by the Test Patients
        panel and the Replay Results dialog whenever the backend
        reports ``not_compiled``. For production scopes the banner
        offers a one-click "Compile now" button that posts to
        /api/terminology/guidelines/bitmap/compile and surfaces the
        returned job_id and version so the reviewer knows the build
        is in progress. For sandbox scopes the banner explains that
        compiling production will not fix the empty sandbox and
        prompts the reviewer to add a SNOMED-coded leaf to the
        draft.
      implemented_by: ["DI-LEO-AI-181"]
      verified_by: ["VT-LEO-AI-175"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        GuidelineCompiler.compile_drafts() refuses the ``global``
        scope so the sandbox flow can never accidentally overwrite
        the production ruleset. BitmapStore.delete_scope and
        set_scope_ttl impose the same refusal, so a stray DELETE or
        TTL call cannot wipe production. test_patient_service.
        sandbox_replay calls delete_sandbox_scope inside a
        try/finally so an abandoned sandbox is removed even when
        the replay raises, and a Redis TTL is set on every sandbox
        scope as a fallback reaper.
      implemented_by: ["DI-LEO-AI-181"]
      verified_by: ["VT-LEO-AI-175"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      The remaining residual is the possibility of the banner being
      dismissed by a reviewer who proceeds anyway. The banner is
      non-dismissable (it stays rendered while the not_compiled
      flag is true) and it is rendered above every results table,
      so the reviewer cannot miss it during triage. Detectability
      drops from 5 (silent zero) to 2 (explicit banner + structured
      flag in the API response that downstream tooling can also
      assert on).

  monitoring:
    monitoring_plan: >
      Pytest parity tests (VT-175 TC-001 / TC-003 / TC-004) run in
      CI on every PR touching the evaluator or the compile/delete
      routes. Production logs already record /evaluate and
      /diagnose response shape; alerts will be raised if
      not_compiled responses exceed 5% of evaluate calls in a 1
      hour window outside scheduled rebuilds.
    metrics:
      - "Number of /evaluate or /diagnose calls returning not_compiled (target: 0 outside scheduled rebuilds)"
      - "Number of orphan custom-scope rulesets found in Redis (target: 0)"
      - "Number of compile_drafts invocations with scope=global (target: 0; a single occurrence is a Sev-1)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Rob Smith - 2026-04-17 user request: 'we need to ensure the endpoint does that if nothing is loaded in sandbox and production runtime'"
    identified_date: "2026-04-17"
    status: "mitigated"
    tags:
      - "appropriateness-rules"
      - "regression-testing"
      - "test-patients"
      - "clinical-safety"
      - "bitmap-engine"
      - "sandbox-replay"
