# -- DI-LEO-AI-082 -- Audit-Driven Automated Encounter Remediation
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-082"
  type: "Functional"
  derived_from: ["UN-LEO-AI-049"]
  requirement: >
    The system SHALL provide an automated remediation script that reads audit
    findings from the SQLite checkpoint, fetches each encounter's text and
    current SNOMED coding from Neo4j, submits all proposed changes for that
    encounter to Claude Sonnet for independent clinical verification, and then
    applies only the changes Sonnet agrees with (confidence >= 0.80). Changes
    Sonnet disagrees with SHALL be written to a disputes log rather than applied.
    Three action types are supported: DELETE an overcoded DOCUMENTS relationship,
    ADD a missing DOCUMENTS relationship (after resolving the concept via the
    terminology API), and UPDATE the assertion on an existing DOCUMENTS
    relationship. All applied changes SHALL be recorded in a SQLite audit trail
    with before/after state. The script SHALL be idempotent (skip encounters
    already processed) and resumable after interruption.
  rationale: >
    The coding audit identified 10,136 encounters with overcoding, missing
    safety-critical codes, and wrong assertions. Manually reviewing each is
    not practical within the same quarter. An LLM second-opinion gate (Sonnet
    verifying what a first Sonnet pass found) provides a statistically
    independent clinical check before any change is committed to production
    data. The audit trail and disputes log ensure every change is traceable.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "No DOCUMENTS relationship is deleted or added without Sonnet confidence >= 0.80"
      - type: "safety"
        spec: "All applied changes are written to the audit trail before and after Neo4j write"
      - type: "functional"
        spec: "Disputes (Sonnet confidence < 0.80 or agree=false) are logged with reason; not applied"
      - type: "functional"
        spec: "Script is idempotent: re-running skips already-remediated encounters"
      - type: "functional"
        spec: "ADD path resolves snomed_search via terminology API; skips if concept not found"
      - type: "safety"
        spec: "Concept IDs in a safety blocklist (suicidal_ideation, self_harm) require explicit --allow-critical flag"
    constraints:
      - type: "safety"
        spec: "Patient shortcuts (HAS_DISORDER etc.) are updated consistently with DOCUMENTS changes"
      - type: "safety"
        spec: "Encounters with parse_error status in audit DB are skipped"
    dependencies: ["DI-LEO-AI-072", "DI-LEO-AI-074"]
    downstream_impacts:
      - "Neo4j DOCUMENTS relationships (overcoded deleted, missing added, assertion updated)"
      - "AuditRun on re-run: should show improved pct_clean"
    technical_details:
      language: "Python"
      framework: "neo4j-driver / bedrock"
      file_structure:
        - "scripts/remediate_audit_findings.py"
        - "libs/cypher/remediation_queries.py"
      estimated_loc: 400

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-082 test cases pass: low-confidence Sonnet responses are not
      applied, audit trail is written, idempotency confirmed, terminology
      API miss leaves encounter unchanged.
    test_protocol: "VT-LEO-AI-082"

  safety_class: "B"
  risks: ["R-LEO-AI-056"]
  tags: ["loop1", "remediation", "audit", "sonnet", "auto-fix"]
