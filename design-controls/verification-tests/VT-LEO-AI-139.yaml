# -- VT-LEO-AI-139 -- Broadened breast specialty marker coverage
# IEC 62304 Verification Test

- id: "VT-LEO-AI-139"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-138"]
    risks: ["R-LEO-AI-096"]

  metadata:
    title: "SPECIALTY_MARKERS['breast'] coverage and specificity"
    description: >
      Verifies the broadened breast regex in
      libs/clinical_scoping/specialty_markers.py matches routine UK
      primary-care referral and diagnostic phrasing (triple
      assessment, breast clinic, nipple discharge, family history,
      fibroadenoma, ductal/lobular carcinoma, areola, sentinel
      lymph node biopsy) without regressing on the 12 legacy
      anchors and without matching a curated negative corpus.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_specialty_markers_breast.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-139-TC-001"
      case_name: "Legacy anchors preserved"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Assert the breast regex matches each of: 'breast lump',
            'nipple', 'mammography', 'mastectomy', 'lumpectomy',
            'oncoplastic', 'DCIS', 'LCIS', 'invasive ductal
            carcinoma', 'invasive lobular carcinoma', 'HER2
            positive', 'ER+ve', 'PR/-ve', 'Ca breast'.
          expected_result: "All 14 legacy anchors match."
          verification_method: "automated"
      acceptance_criteria:
        - "14/14 legacy anchors match"

    - case_id: "VT-139-TC-002"
      case_name: "New anchors match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Assert the breast regex matches: 'triple assessment',
            'referred to breast clinic', 'nipple discharge noted',
            'family history of breast cancer', 'fibroadenoma on
            USS', 'ductal carcinoma in situ', 'lobular carcinoma
            in situ', 'areolar mass', 'sentinel lymph node biopsy',
            'sentinel node biopsy'.
          expected_result: "All 10 new anchors match."
          verification_method: "automated"
      acceptance_criteria:
        - "10/10 new anchors match"

    - case_id: "VT-139-TC-003"
      case_name: "Negative corpus does not match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Assert the breast regex does NOT match: 'chest pain',
            'thoracic cage fracture', 'breastfeeding advice
            only', 'pectoral strain', 'sternum tender',
            'retrosternal discomfort', 'dysphagia', 'cough', 'rib
            pain', 'chest wall'.
          expected_result: "0/10 false positives."
          verification_method: "automated"
      acceptance_criteria:
        - "0/10 negatives match"

    - case_id: "VT-139-TC-004"
      case_name: "Real-text corpus recall >= 18/20"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Against a corpus of 20 real-text 2025 breast encounter
            samples (excerpted from encounter text in the dev
            graph), assert the broadened regex matches >= 18.
          expected_result: "Recall >= 0.9."
          verification_method: "automated"
      acceptance_criteria:
        - "Matches / total >= 0.9"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-139/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
