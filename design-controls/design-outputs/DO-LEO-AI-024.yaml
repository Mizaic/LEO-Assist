# -- DO-LEO-AI-024 -- Disorder Entity Verifier Module
# ISO 13485 / IEC 62304 Design Output
# Schema: design-controls/templates/design_outputs_schema.yaml

- id: "DO-LEO-AI-024"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-037"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-026"]
    verification_tests: ["VT-LEO-AI-022"]

  specification:
    title: "Disorder Entity Verifier Module"
    description: |
      Classifies disorder entities as active_diagnosis, informational,
      historical, or uncertain using dual-model consensus. Mode-aware
      fail-safe behaviour ensures HITL mode defaults to active_diagnosis
      (surface for human review) and autonomous mode defaults to uncertain
      (do not code). Handles LLM output parsing including markdown-wrapped
      JSON and embedded JSON objects.
    acceptance_criteria:
      - criterion: "Active diagnosis classification"
        type: "functional"
        measurement: "Test"
        target: "Confirmed disorders classified as active_diagnosis"
      - criterion: "Informational classification"
        type: "functional"
        measurement: "Test"
        target: "Test/referral context classified as informational"
      - criterion: "HITL fail-safe"
        type: "safety"
        measurement: "Test"
        target: "Failure defaults to active_diagnosis in HITL mode"
      - criterion: "Autonomous fail-safe"
        type: "safety"
        measurement: "Test"
        target: "Failure defaults to uncertain in autonomous mode"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/llm_client/disorder_verifier.py"
        description: "DisorderVerdict enum, _parse_verdict, _fail_verdict_for_mode, verify_disorder"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 80
      key_classes: ["DisorderVerdict"]
      key_functions: ["verify_disorder", "_parse_verdict", "_fail_verdict_for_mode"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Mode-aware fail-safe: autonomous never defaults to active_diagnosis"
      - "Unknown verdicts fall back to mode-appropriate default"
      - "Encounter text truncated to 2000 chars to prevent token budget overruns"
    risk_control_measures:
      - "Dual-model consensus via DI-LEO-AI-036"
      - "JSON verdict validated against allowlist before use"

  verification_status:
    verification_method: "Test"
    verification_complete: true
