# -- UN-LEO-AI-031 -- Triage Consistency Measurement Across Clinicians

- id: "UN-LEO-AI-031"
  title: "Clinical leads and quality improvement teams need the system to measure and surface triage decision consistency across clinicians, so that systematic variation in triage thresholds can be identified and addressed before it causes patient harm."
  description: |
    Triage decisions are currently made by individual clinicians applying their
    own internalized thresholds to free-text referrals. There is no shared
    standard, no measurement of inter-rater agreement, and no visibility of
    variation between clinicians or over time. The same referral can receive
    a different urgency classification depending solely on who happens to be
    triaging that day.

    The system must record every triage decision with the full clinical evidence
    present at the time, enable comparison of decisions on clinically similar
    referrals, calculate inter-rater agreement metrics, and surface patterns of
    inconsistency to clinical leads for review and calibration.

  stakeholder:
    type: "nhs_user"
    role: "Clinical Lead / Quality Improvement Lead"
    organization: "NHS Acute Trust"

  priority: "SHOULD"

  rationale: |
    Inconsistent triage is a patient safety risk. A clinician with a lower
    urgency threshold will systematically delay a proportion of referrals that
    should be seen quickly. This variation is invisible without structured data.
    Multiple user interviews confirmed that clinical leads suspect inconsistency
    but cannot prove or quantify it. Measurement is the prerequisite for
    improvement. Regulatory bodies and national audit programmes increasingly
    expect evidence of triage consistency as part of clinical governance.

  benefit: |
    Clinical leads can identify and address systematic variation in triage
    thresholds. Training needs can be identified for specific clinicians or
    pathway types. Evidence of consistency can be provided to regulators and
    commissioners. Override rates from AI-assisted triage provide a continuous
    calibration signal.

  use_case: |
    1. Clinical lead opens the triage consistency dashboard.
    2. They see inter-rater agreement statistics for their department over
       the selected period: Cohen's kappa by specialty, by urgency band,
       and by clinician (anonymised unless role permits de-anonymisation).
    3. They can drill into cases where the same (or clinically similar)
       referral received different urgency classifications from different
       clinicians.
    4. They can see their department's AI override rate -- the proportion of
       AI triage recommendations changed by a human reviewer -- as a proxy
       for calibration quality.
    5. Trend lines show whether consistency is improving, stable, or degrading
       over time.
    6. Cases with the highest disagreement are surfaced for case review
       or training discussion.

  current_solution: |
    None. Triage decisions are not recorded in a structured form that enables
    comparison. Consistency is entirely unmeasured.

  pain_points:
    - "Clinical leads suspect inconsistency but have no data to confirm or quantify it"
    - "Patients receive different triage outcomes depending on which clinician is on duty"
    - "No mechanism to identify which clinicians have higher or lower urgency thresholds"
    - "No calibration data to improve triage quality over time"
    - "No evidence of consistency to provide to commissioners or regulators"

  acceptance_criteria:
    - "Every triage decision is stored with clinician role, timestamp, urgency classification, and clinical evidence present at time of decision"
    - "System calculates inter-rater agreement (Cohen's kappa or equivalent) across clinicians on comparable referrals"
    - "AI override rate is calculated per clinician, per specialty, and per time period"
    - "Consistency dashboard is accessible to clinical leads with appropriate role"
    - "Cases with disagreement above a configurable threshold are surfaced for review"
    - "Clinician-level data is anonymised by default with de-anonymisation requiring clinical director role"

  success_metrics:
    - metric: "Inter-rater agreement (kappa) for two-week-wait classification"
      target: "Kappa > 0.7 (substantial agreement) within 6 months of deployment"
      baseline: "Not currently measured"
    - metric: "AI override rate"
      target: "Measurable and trending down as calibration improves"
      baseline: "Not currently measurable"

  regulatory_impact: "medium"
  safety_impact: "high"
  safety_class: "B"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "IEC 62304:2006/AMD1:2015 Class B software lifecycle"
    - "ISO 14971:2019 risk management"

  related_standards:
