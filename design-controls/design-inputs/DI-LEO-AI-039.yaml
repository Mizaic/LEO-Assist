# -- DI-LEO-AI-039 -- CodingDecision Audit Trail
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-039"
  type: "Regulatory"
  derived_from: ["UN-LEO-AI-002"]
  requirement: "The system SHALL record every autonomous-mode coding decision as a CodingDecision node in Neo4j, capturing the entity, assertion, tier, decision, reason, terminology score, consensus verdict, and model IDs -- enabling the practice to audit what was coded, flagged, or skipped and why"
  rationale: "Autonomous coding without human review requires a complete audit trail so practices, regulators, and clinical safety officers can retrospectively inspect every decision. The audit trail also enables monitoring of decision distribution (e.g. percentage flagged, percentage skipped) to detect systematic drift."

  machine_spec:
    agent_prompt: |
      Implement CodingDecision audit queries (~30 LOC Cypher).

      SINGLE PURPOSE: Define the CodingDecision node schema and CRUD
      queries for the autonomous coding audit trail.

      QUERIES:
      1. UPSERT_CODING_DECISION: MERGE by decision_id, set all audit
         fields, stamp created_at and updated_at.
      2. GET_CODING_DECISIONS_FOR_ENCOUNTER: Return all decisions for a
         given encounter, ordered by created_at.
      3. GET_CODING_DECISION_STATS: Aggregate decisions by tier/decision/
         reason since a given date.
      4. COUNT_AUDIT_FLAGGED: Count coded_with_flag decisions since a date.

    acceptance_criteria:
      - type: "test"
        spec: "UPSERT uses MERGE for idempotent writes"
      - type: "test"
        spec: "created_at set only on first create (ON CREATE SET)"
      - type: "test"
        spec: "All 12 required parameters present in UPSERT query"
      - type: "test"
        spec: "GET query returns all audit fields ordered by created_at"
      - type: "test"
        spec: "STATS query groups by tier, decision, reason with count"
      - type: "test"
        spec: "COUNT_AUDIT_FLAGGED filters by coded_with_flag decision"

    constraints:
      - type: "regulatory"
        spec: "Audit records must be immutable after creation -- MERGE with ON CREATE SET ensures no accidental overwrite of created_at"
      - type: "data"
        spec: "decision_id uniqueness constraint enforced at schema level"

    dependencies: ["DI-LEO-AI-038"]

    downstream_impacts:
      - "pipeline_service"
      - "audit_dashboard"
      - "monitoring_alerts"

    technical_details:
      language: "Cypher"
      framework: "Neo4j"
      libraries: []
      file_structure:
        - "libs/cypher/coding_decision_queries.py"
      estimated_loc: 30

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All query structures validated: MERGE idempotency, parameter completeness, field coverage, ordering, aggregation"
    test_protocol: "VT-LEO-AI-024"

  safety_class: "B"
  risks: ["R-LEO-AI-026"]
  tags: ["audit-trail", "coding-decision", "neo4j", "autonomous-coding"]
