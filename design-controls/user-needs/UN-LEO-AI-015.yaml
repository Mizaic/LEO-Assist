# -- UN-LEO-AI-015 -- Data Governance
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-015"
  title: "Patient data and terminology data stored in separate databases with enforced boundaries"
  description: |
    Data protection officers need patient-identifiable data and
    terminology/coding reference data stored in physically separate
    databases with enforced access boundaries. The Patient Neo4j database
    holds patient encounters, episodes, and clinical data. The Coding
    Neo4j database holds SNOMED CT concepts, value sets, and terminology
    mappings. Cross-database queries are prohibited at the application
    layer. This separation ensures that terminology operations cannot
    inadvertently expose patient data.

  stakeholder:
    type: "regulatory"
    role: "Data Protection Officer"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    NHS information governance requirements and GDPR mandate that
    patient-identifiable data is protected with appropriate technical
    controls. Separating patient data from reference data reduces the
    blast radius of any data breach and simplifies access control. It
    also enables terminology data to be shared across organisations
    without patient data exposure.

  benefit: "Reduced data breach risk through physical separation of patient and reference data"

  use_case: |
    1. System administrator provisions two separate Neo4j database
       instances during environment setup: Patient DB and Coding DB.
    2. FHIR API writes patient encounters and episodes to the Patient DB
       only.
    3. Terminology API writes SNOMED CT concepts, value sets, and mappings
       to the Coding DB only.
    4. Coding worker reads terminology data from Coding DB and patient
       encounter text from Patient DB via separate authenticated
       connections.
    5. A developer accidentally writes a query that joins patient and
       terminology data. The application layer rejects the query because
       cross-database access is architecturally prevented.
    6. Data protection officer audits access logs and confirms no
       cross-boundary data flows exist.

  current_solution: "Single database with logical separation via schemas or collections, no enforced physical boundaries"

  pain_points:
    - "Single-database designs allow accidental cross-domain queries"
    - "Data breach affects all data types simultaneously"
    - "Terminology data cannot be shared without exposing patient data"
    - "Regulatory audits cannot easily verify data segregation"

  acceptance_criteria:
    - "System shall store patient data in a dedicated Patient Neo4j database"
    - "System shall store terminology data in a dedicated Coding Neo4j database"
    - "System shall enforce separation at the application layer"
    - "Cross-database queries shall be architecturally prevented"
    - "System shall apply data classification labels to all stored data"
    - "System shall support data deletion requests (right to erasure)"

  success_metrics:
    - metric: "Cross-boundary data leaks"
      target: "Zero cross-boundary data leaks"
      baseline: "Current: not measured (single database)"
    - metric: "Data classification coverage"
      target: "100% of stored data classified"
      baseline: "Current: 0% (no classification in place)"
    - metric: "Deletion request processing time"
      target: "<=24 hours"
      baseline: "Current: manual process, 5-10 business days"

  regulatory_impact: "critical"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "UK GDPR Article 25 (Data Protection by Design)"
    - "NHS Data Security and Protection Toolkit requirements"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "UK GDPR"
    - "NHS DSPT"
    - "ISO 27001"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: []
  validation_tests: []

  tags: ["data-governance", "gdpr", "neo4j", "cross-cutting", "security"]
