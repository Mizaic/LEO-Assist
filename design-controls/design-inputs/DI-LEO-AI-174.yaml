# -- DI-LEO-AI-174 -- AI Instructions editor decomposition (Wave E Phase 4b)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-174"
  type: "Functional"
  derived_from: ["UN-LEO-AI-061"]
  requirement: >
    The AI Instructions editor at services/ui/src/app/admin/prompts/[id]/
    SHALL be decomposed from a single 1110 LOC monolith into an orchestrator
    plus dedicated tab body components and shared types/constants modules,
    so that no page or extracted component exceeds the 500 LOC hard cap and
    each tab body remains independently testable. The orchestrator SHALL
    keep all data-fetching, save, and inter-tab state in one place and
    delegate rendering to the extracted modules.
  rationale: >
    The previous monolithic prompts/[id]/page.tsx (1110 LOC) breached the
    500 LOC hard cap and made it difficult to apply the new design system
    primitives consistently. Splitting the file improves readability,
    unblocks future PromptEditorCard adoption, and gives the static-source
    sweep a deterministic surface to assert on.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          services/ui/src/app/admin/prompts/[id]/page.tsx imports its tab
          bodies from ./_components/* and contains only orchestrator state
          (data-fetching, save, sandbox run) plus the page chrome (header,
          IdentitySection, Tabs).
      - type: "functional"
        spec: >
          Each extracted module under
          services/ui/src/app/admin/prompts/[id]/_components/ stays at or
          below 500 LOC and contains a single tab body or a focused helper
          (InputDisplay, OutputPreview, ExampleCard, IdentitySection,
          InstructionsTab, OutputFormatTab, TeachingExamplesTab,
          SandboxTab, SandboxCostTable, types).
      - type: "functional"
        spec: >
          Shared taxonomy and colour vocabulary (CATEGORY_OPTIONS,
          SCOPE_OPTIONS, TAG_COLORS, ASSERTION_COLORS, categoryLabel,
          categoryColor, FewShotExample, PromptConfigData, CostEstimate,
          SandboxResult) live in _components/types.ts so every tab consumes
          a single source of truth.
      - type: "safety"
        spec: >
          The save flow continues to call PUT /api/prompts/{id} (or POST
          /api/prompts when isNew) with the same payload shape -- name,
          description, systemPrompt, outputSchema, verification,
          fewShotExamples, maxFewShot -- so that no clinical prompt data
          can be silently dropped during refactor.
    constraints:
      - type: "safety"
        spec: >
          The decomposition MUST NOT change request/response payloads or
          API endpoints. Only the front-end module structure changes.
    dependencies: ["DI-LEO-AI-167"]
    downstream_impacts:
      - "AI Instructions admin editor"
      - "Prompt sandbox tab"
      - "Few-shot example library"
    technical_details:
      language: "TypeScript"
      framework: "Next.js / MUI"
      file_structure:
        - "services/ui/src/app/admin/prompts/[id]/page.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/types.ts"
        - "services/ui/src/app/admin/prompts/[id]/_components/IdentitySection.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/InstructionsTab.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/OutputFormatTab.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/TeachingExamplesTab.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/ExampleCard.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/InputDisplay.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/OutputPreview.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/SandboxTab.tsx"
        - "services/ui/src/app/admin/prompts/[id]/_components/SandboxCostTable.tsx"
      estimated_loc: 2100

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-169 passes -- a static-source jest sweep that asserts the
      _components/ directory contains the required modules, that none of
      them exceed 500 LOC, and that page.tsx imports each tab body from
      _components rather than declaring them inline.
    test_protocol: "VT-LEO-AI-169"

  safety_class: "A"
  risks: []
  tags:
    - "wave-e"
    - "ai-instructions"
    - "decomposition"
    - "knowledge-tab"
