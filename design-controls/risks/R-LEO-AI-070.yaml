# -- R-LEO-AI-070 -- Negated Condition Included in Analytics
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-070"
  title: "Coded entities with absent assertion included in CCI score or cohort selection"

  hazard:
    description: >
      Analytics queries traverse :DOCUMENTS relationships without filtering by
      assertion status, causing explicitly negated conditions (assertion='absent')
      to be treated identically to confirmed conditions (assertion='present').
    category: "clinical_safety"

  hazardous_situation: >
    A patient has an encounter documented with "No diabetes mellitus" coded as
    a SNOMED finding with assertion='absent'. The CCI query returns this concept
    because it does not check the assertion field, scoring the patient as diabetic
    and inflating their comorbidity index. Similarly, cohort filters include the
    patient in a diabetic cohort they do not belong to.

  harm:
    description: >
      Incorrect risk-stratification scores and inaccurate cohort membership lead
      to wrong clinical decisions: patients may receive inappropriate screening
      invitations, incorrect triage priority, or skewed audit outcomes that
      mask true population health patterns.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 2
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Add _CONFIRMED_ASSERTIONS constant and coalesce assertion guard to all
        Cypher queries that traverse :DOCUMENTS relationships in the analytics
        API, restricting results to 'present' and 'historical' assertions only.
      implemented_by: ["DI-LEO-AI-102"]
      verified_by: ["VT-LEO-AI-102"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      With the assertion guard in place, absent and hypothetical conditions are
      filtered out at query time. The coalesce guard ensures null assertions
      (legacy data) default safely to 'present'. Residual risk is limited to
      data migration scenarios where assertion values are incorrectly populated,
      which is controlled by pipeline-level VTs and the double-negation guard
      (R-LEO-AI-069).

  monitoring:
    monitoring_plan: >
      Monitor CCI score distributions in production dashboards for unexpected
      score inflation. Alert if mean CCI increases by more than 0.5 points
      following a pipeline change. Review assertion-filtered query counts
      quarterly against total query counts to detect any bypass.
    metrics:
      - "Mean patient CCI score per organisation per quarter"
      - "Count of entities with assertion='absent' returned by analytics queries (must be 0)"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Design review - analytics assertion audit Apr 2026"
    identified_date: "2026-04-13"
    status: "mitigated"
    tags:
      - "analytics"
      - "cci"
      - "cohort"
      - "assertion"
