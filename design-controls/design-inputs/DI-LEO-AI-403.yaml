# -- DI-LEO-AI-403 -- Same-day same-event referral collapse (Pattern N2)
# IEC 62304 / ISO 13485 Design Input
#
# NOTE: Created in the 4xx ID range alongside DI-401 (Pattern N1) and
# DI-402 (Pattern N4) to escape recurring ID collisions in the
# 21x-30x range.

- id: "DI-LEO-AI-403"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-005"
  requirement: >
    The episode builder SHALL ensure that any single EpisodeOfCare
    timeline shows AT MOST ONE ``referral`` milestone per
    encounter date. When multiple referral anchors fall on the
    same date inside a single episode (whether at build time or
    after duplicate-episode merge), the system SHALL keep ONE
    representative and discard the rest.

    Selection priority for the kept representative is by
    ``referral_subtype`` (highest fidelity wins):

      1. ``prism``        -- structured 2WW PRISM questionnaire
                              (machine-coded XaMeC fast-track
                              referral fields, lowest free-text
                              ambiguity)
      2. ``form_field``   -- generic structured proforma (e.g.
                              the EMIS 2WW long-name template)
      3. ``text_generic`` -- free-text mention only
      4. anything else / missing subtype

    Within the same priority tier the anchor with the earliest
    ``created_at`` wins; ties are broken by stable input order
    (build path) or by stable Neo4j ``elementId`` (post-merge
    sweep).

    The collapse SHALL operate at TWO independent layers:

      Layer 1 -- Build time. A new helper
      ``collapse_same_day_referrals`` in
      ``services/analysis_worker/app/analyzers/episode_builder/_milestone_dedup.py``
      transforms the link-group list emitted by
      ``_filter_unclaimed_link_groups`` BEFORE
      ``_link_encounters_to_episode`` writes any IS_PART_OF
      edge. The helper is wired into BOTH the closed-episode
      path and the open-episode path in
      ``services/analysis_worker/app/analyzers/episode_builder/_builder.py``.

      Layer 2 -- Post-merge time. A new Cypher query
      ``COLLAPSE_SAME_DAY_REFERRALS_Q`` in
      ``services/analysis_worker/app/analyzers/episode_builder/_cypher.py``
      runs once on the surviving primary at the end of each
      successful merge in ``_apply_merge_decision`` (``_auto_close.py``).
      The query repeats the same ranking rule directly in Cypher:
      ``CASE r.referral_subtype WHEN 'prism' THEN 0 WHEN 'form_field'
      THEN 1 WHEN 'text_generic' THEN 2 ELSE 3``, ordered by
      (rank, created_at, elementId), keeping the first per
      (episode, date) and deleting the rest.

    The existing ``MOVE_LINKS_Q`` SHALL be extended to carry
    ``referral_subtype`` over to the migrated edge (currently
    only ``milestone_type`` is preserved). Without this, every
    moved referral edge arrives at the primary with NULL
    subtype and immediately loses to any pre-existing edge with
    a real subtype, even when the moved one was higher fidelity.
  rationale: >
    Patient 4802892365 had THREE distinct referral anchors on
    2025-03-26 attached to the real breast-cancer episode
    1ecfb55618c2a6d2:

      - A GP clinical encounter ("Refer 2ww breast for further
        investigation"; subtype ``text_generic``)
      - The structured PRISM 2WW Breast Female questionnaire
        completed by the same GP at 11:46 the same day
        ("Fast track referral for suspected breast cancer
        (XaMeC)"; subtype ``prism``)
      - A back-dated medical-secretary admin record tracking
        the referral booking ("Fast track referral for suspected
        breast cancer ... Patient awaiting OPD appt."; subtype
        ``text_generic``)

    All three describe ONE single 2WW decision. The episode
    timeline therefore showed three "referral" milestones on
    a single day, inflating referral-count analytics, confusing
    pathway-explorer investigations, and eroding reviewer trust.

    Beyond the build-time case, the duplicate-episode merger
    (``MOVE_LINKS_Q`` in ``_apply_merge_decision``) itself can
    create same-day duplicate referrals: when two episodes are
    merged into one primary, both can contribute a same-day
    referral edge from a different encounter. The cohort-level
    sweep before this fix found 5 episodes with merge-induced
    same-day duplicates. ``MOVE_LINKS_Q`` only deduped per
    ``(encounter_id, milestone_type)``, not per
    ``(date, milestone_type)`` -- and it stripped
    ``referral_subtype`` so post-merge ranking was lossy.

    A single referral decision per day per episode is a
    fundamental invariant of the cancer pathway model: the patient
    cannot be "referred twice for the same thing on the same day".
    Anything that violates this invariant is operational noise
    (proforma + clinical note + admin booking record), not
    clinical signal.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          ``collapse_same_day_referrals`` returns a NEW list
          where each ``(anchor_list, milestone_type)`` group
          opted into ``milestone_types`` has at most one anchor
          per ``encounter_date``.
      - type: "functional"
        spec: >
          The kept anchor is the highest-fidelity one by
          ``referral_subtype``: ``prism`` (rank 0) >
          ``form_field`` (1) > ``text_generic`` (2) > unknown
          / empty (3). Ties broken by earliest ``created_at``,
          then stable input order.
      - type: "functional"
        spec: >
          Anchors with no ``encounter_date`` are passed through
          untouched (never silently dropped).
      - type: "functional"
        spec: >
          Non-opted-in milestone types (``diagnosis_confirmed``,
          ``treatment_started``, ``first_seen``,
          ``first_presentation``, ``care_obstruction``) are
          returned unchanged.
      - type: "functional"
        spec: >
          The helper does NOT mutate the input list or any
          input anchor dict.
      - type: "functional"
        spec: >
          The build-time helper is wired into BOTH
          ``_build_closed_episode`` (line ~602) and
          ``_build_open_episode`` (line ~795) in
          ``_builder.py``, AFTER ``_filter_unclaimed_link_groups``
          and BEFORE ``_link_encounters_to_episode``.
      - type: "functional"
        spec: >
          ``MOVE_LINKS_Q`` SETS ``new.referral_subtype =
          coalesce(old.referral_subtype, '')`` and
          ``new.linked_by = 'merge_duplicate'`` on the migrated
          edge so post-merge ranking is non-lossy.
      - type: "functional"
        spec: >
          ``COLLAPSE_SAME_DAY_REFERRALS_Q`` is invoked once per
          successful merge decision (after ALL ``MOVE_LINKS_Q``
          calls for that decision complete and at least one
          succeeded) on the surviving ``primary_id``.
      - type: "safety"
        spec: >
          Patient 4802892365 episode 1ecfb55618c2a6d2 shows
          exactly ONE referral milestone on 2025-03-26 after
          rebuild, and that milestone's ``referral_subtype`` is
          ``prism`` (the highest-fidelity of the three
          competing anchors).
      - type: "safety"
        spec: >
          Cohort-wide post-rebuild query ``MATCH (e:Encounter)
          -[r:IS_PART_OF {milestone_type:'referral'}]
          ->(ep:EpisodeOfCare) WITH ep, e.date AS d,
          count(r) AS rc WHERE rc > 1 RETURN ep`` returns ZERO
          rows.
      - type: "safety"
        spec: >
          A patient with two genuinely distinct referrals on
          DIFFERENT dates inside a single episode (e.g.
          repeat referral after rejection 14 days later) MUST
          retain BOTH milestones.
      - type: "performance"
        spec: >
          Total cohort referral milestone count drops by at
          least 5 from baseline (3 from the canonical
          4802892365 case alone -- 2 collapsed; plus at least
          5 from merge-induced duplicates across the cohort).
    constraints:
      - type: "safety"
        spec: >
          Only ``referral`` is opted into the default
          ``milestone_types`` set. Other milestones
          (``diagnosis_confirmed``, ``treatment_started``,
          etc.) have their own established dedup semantics
          and MUST NOT be collapsed by this helper without an
          explicit opt-in.
      - type: "safety"
        spec: >
          Dropped anchors lose only their IS_PART_OF
          ``referral`` edge to the episode -- the underlying
          Encounter node is unaffected and remains visible to
          search, coding, and other downstream consumers.
      - type: "safety"
        spec: >
          The post-merge sweep MUST run only on the surviving
          primary (not on duplicates marked ``status='merged'``).
    dependencies:
      - "DI-LEO-AI-137"
      - "DI-LEO-AI-145"
      - "DI-LEO-AI-182"
    downstream_impacts:
      - "EpisodeOfCare timelines (one referral milestone per day per episode)"
      - "Referral-count analytics (eliminates phantom inflation from PRISM + free-text + admin triplets)"
      - "Pathway-explorer reviewer trust (timeline no longer shows three identical referral events on a single day)"
      - "MOVE_LINKS_Q semantics (now preserves referral_subtype across merges)"
    technical_details:
      language: "Python"
      framework: "Episode builder"
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_builder/_milestone_dedup.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_cypher.py"
        - "services/analysis_worker/app/analyzers/episode_builder/_auto_close.py"
      estimated_loc: 130

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-403 must pass on all critical and total cases
      (25 unit + parametrised cases covering the helper's
      ranking, date-grouping, dateless pass-through, opt-in
      milestone widening, mutation safety, and the canonical
      patient 4802892365 same-day-collapse case). Cohort
      wipe-and-rebuild MUST eliminate all same-day referral
      duplicates cohort-wide and reduce patient 4802892365's
      referral milestone count from 3 (on 2025-03-26) to 1.
    test_protocol: "VT-LEO-AI-403"

  safety_class: "B"
  risks:
    - "R-LEO-AI-403"
  tags:
    - "episode-builder"
    - "referral-collapse"
    - "milestone-dedup"
    - "patient-4802892365"
    - "pattern-n2"
