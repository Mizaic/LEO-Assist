# -- UN-LEO-AI-095 -- Big records produce SBAR; failures explained in plain English
# IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-095"
  title: "Big patient records still produce a useful SBAR, no record is silently dropped, and any failure is explained in plain English"
  description: >
    As a QA reviewer or platform admin running the SBAR Playground in
    /admin/knowledge?tab=ai-summarisation, when I pick a patient with
    a large amount of background material (many encounters, long
    discharge summaries, dense chunked documents), the system should
    still produce an SBAR rather than silently failing. If the inputs
    cannot all fit in the model's input window in a single LLM call,
    LEO should split the records across multiple parts, summarise
    each part, and merge the partial summaries into one coherent
    Background section. No clinical record may be silently truncated
    or dropped to make space; if the work cannot be split into eight
    or fewer parts, the system MUST refuse the run and explain why in
    plain English. If a stage genuinely fails, the playground should
    show me a clear plain-English message naming the stage and the
    reason -- not a green "Done" button with a hidden error count.
  stakeholder: "QA reviewer / platform admin"
  priority: "high"
  rationale: >
    The previous "shrink-or-drop" approach silently shortened or
    dropped clinical records to fit one LLM call. That is unsafe in a
    clinical summary because a dropped or truncated discharge letter
    can change the clinical picture. The corrected design splits the
    work into multiple LLM calls (partition + map + reduce) so every
    record is included, and surfaces real-time per-part progress and
    a structured "split into N parts" notice so reviewers can see and
    audit what happened. The earlier failure mode (Bedrock
    ValidationException -> green "Done (1 errors)" button with no
    detail) also remains addressed.

  acceptance_criteria:
    - "When the assembled background prompt would exceed the model's input window, the system splits the records into multiple parts, runs the Background prompt on each part, and merges the partial summaries into one Background section -- no record is silently truncated or dropped"
    - "If even one record is too large to fit in a single part, that record is split across multiple parts and the LLM is told they are halves of the same source"
    - "If the work cannot be split into eight or fewer parts, the run is refused with a plain-English message asking the reviewer to pick fewer records, instead of dropping records"
    - "When the Background stage runs in multiple parts, the playground shows live per-part progress (for example 'Generating Background, part 2 of 5') and an info Alert summarising 'this patient has a lot of records, so we summarised them in N parts; every record is included'"
    - "When an LLM call fails for a known reason (input too long, throttled, access denied, network, too many parts, reduce failed, one part failed), the run records a plain-English message naming the stage and the reason"
    - "The SBAR Playground renders any errors as a warning Alert above the result, listing each error with its stage label and plain-English message"
    - "When a run completes with one or more errors, the result button is amber/warning rather than green/success"
    - "Plain-English error and notice messages target reading age 9-11 and never expose raw AWS exception text"

  design_inputs:
    - "DI-LEO-AI-513"
    - "DI-LEO-AI-516"
    - "DI-LEO-AI-518"

