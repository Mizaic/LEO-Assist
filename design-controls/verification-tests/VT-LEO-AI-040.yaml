# -- VT-LEO-AI-040 -- Intended-Use Scope Guard Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-040"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-048"]
    risks: ["R-LEO-AI-029", "R-LEO-AI-033"]
    user_needs: ["UN-LEO-AI-001"]

  metadata:
    title: "Intended-Use Scope Guard Verification"
    description: >
      Verifies that the scope guard correctly enforces intended-use boundaries
      by detecting safety-netting sentences, treatment recommendation language,
      and hedged diagnostic language, and reclassifying entity assertions
      accordingly. Also verifies that normal clinical text is unaffected.
      The scope guard is now Layer 3 in the unified post-processing stack
      (libs/pipeline/post_processing.py), applied identically to both
      training and runtime pipelines (DI-LEO-AI-050).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_scope_guard.py"
      - "tests/test_post_processing_pipeline.py"
      - "tests/test_pipeline_parity.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Python 3.13+"
      - "pytest installed"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    # -- Safety-netting detection (11 cases) --

    - case_id: "VT-040-TC-001"
      case_name: "'If develops' safety-netting detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call is_safety_netting_sentence with 'If you develop chest pain or shortness of breath, seek urgent medical attention'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-002"
      case_name: "'Worsening advice' safety-netting detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call is_safety_netting_sentence with 'Worsening advice given to patient'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-003"
      case_name: "'Attend A&E' safety-netting detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call is_safety_netting_sentence with 'Attend A&E immediately if symptoms worsen'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-004"
      case_name: "'Call 999' safety-netting detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call is_safety_netting_sentence with 'Call 999 if you experience severe chest pain'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-005"
      case_name: "Normal clinical text NOT detected as safety-netting"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call is_safety_netting_sentence with 'Patient presents with chest pain, onset 2 hours ago'"
          expected_result: "Returns False"
          verification_method: "Automated test"

    # -- Treatment recommendation detection (11 cases) --

    - case_id: "VT-040-TC-006"
      case_name: "'Consider starting' recommendation detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_recommendation_language with 'Consider starting metformin 500mg once daily'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-007"
      case_name: "'Will start' recommendation detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_recommendation_language with 'Will start amoxicillin 500mg TDS for 7 days'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-008"
      case_name: "Current medication NOT detected as recommendation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_recommendation_language with 'Currently taking metformin 500mg twice daily'"
          expected_result: "Returns False"
          verification_method: "Automated test"

    # -- Hedged diagnosis detection (10 cases) --

    - case_id: "VT-040-TC-009"
      case_name: "'Consistent with' hedged diagnosis detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_hedged_diagnosis with 'Clinical picture consistent with viral upper respiratory infection'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-010"
      case_name: "'Cannot exclude' hedged diagnosis detected"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_hedged_diagnosis with 'Cannot exclude pulmonary embolism'"
          expected_result: "Returns True"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-011"
      case_name: "Confirmed diagnosis overrides hedged language"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call has_hedged_diagnosis with 'Consistent with pneumonia, diagnosis confirmed on chest X-ray'"
          expected_result: "Returns False"
          verification_method: "Automated test"

    # -- Integrated reclassification (12 cases) --

    - case_id: "VT-040-TC-012"
      case_name: "Safety-netting entity reclassified to hypothetical"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with disorder/present in safety-netting sentence"
          expected_result: "Returns 'hypothetical'"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-013"
      case_name: "Recommendation entity reclassified to hypothetical"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with substance/present in recommendation sentence"
          expected_result: "Returns 'hypothetical'"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-014"
      case_name: "Hedged disorder reclassified to possible"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with disorder/present in hedged sentence"
          expected_result: "Returns 'possible'"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-015"
      case_name: "Already-absent entity NOT modified"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with disorder/absent in safety-netting sentence"
          expected_result: "Returns None"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-016"
      case_name: "Normal present disorder unchanged"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with disorder/present in normal diagnosis sentence"
          expected_result: "Returns None"
          verification_method: "Automated test"

    - case_id: "VT-040-TC-017"
      case_name: "Normal present substance unchanged"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call reclassify_assertion with substance/present in current medication sentence"
          expected_result: "Returns None"
          verification_method: "Automated test"

  pass_fail_criteria:
    pass_threshold: "100% critical"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-040/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-040-EXEC-001"
      date: "2026-03-03"
      executor: "automated_pytest"
      environment: "development"
      result: "pass"
      cases_executed: 44
      cases_passed: 44
      cases_failed: 0
      duration_seconds: 1
      notes: "All 44 test cases pass across 4 test classes (safety-netting, recommendation, hedged diagnosis, reclassification)"
    - execution_id: "VT-040-EXEC-002"
      date: "2026-03-04"
      executor: "automated_pytest"
      environment: "development"
      result: "pass"
      cases_executed: 44
      cases_passed: 44
      cases_failed: 0
      duration_seconds: 1
      notes: "Post pipeline hardening: narrowed _RECOMMENDATION_RE (removed 'will start' / 'to start'), expanded _CONFIRMED_DIAGNOSIS_RE, sentence-window scoping via _extract_sentence_window. Tests updated to reflect intended behaviour"
