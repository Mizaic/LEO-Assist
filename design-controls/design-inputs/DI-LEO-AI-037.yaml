# -- DI-LEO-AI-037 -- Disorder Entity Verifier
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-037"
  type: "Safety"
  derived_from: ["UN-LEO-AI-002"]
  requirement: "The system SHALL classify disorder entities as active_diagnosis, informational, historical, or uncertain using dual-model consensus, with mode-aware fail-safe behaviour: HITL mode defaults to active_diagnosis (human will review), autonomous mode defaults to uncertain (do not code without confirmation)"
  rationale: "Disorder entities extracted from clinical text frequently appear in informational or historical context (e.g. 'eGFR for CKD monitoring' where CKD is a test context, not an active diagnosis). False-positive coding of informational mentions distorts audit data. Mode-aware fail-safe ensures that in autonomous mode, uncertain cases are never auto-coded, while in HITL mode they are surfaced for human review."

  machine_spec:
    agent_prompt: |
      Implement the disorder entity verifier (~80 LOC).

      SINGLE PURPOSE: Classify whether a disorder entity is an active
      confirmed diagnosis or appears in informational/historical/uncertain
      context.

      REQUIREMENTS:
      1. Use dual-model consensus (DI-LEO-AI-036) for classification.
      2. Parse JSON verdict from LLM response, handling markdown wrapping
         and embedded JSON.
      3. Validate verdict against the four allowed values.
      4. On unknown verdict, fall back to mode-appropriate default.
      5. HITL mode fail-safe: active_diagnosis (let human review it).
      6. Autonomous mode fail-safe: uncertain (do not code it).
      7. Truncate encounter text to 2000 chars to stay within token limits.

    acceptance_criteria:
      - type: "test"
        spec: "Active diagnosis correctly classified for confirmed disorders"
      - type: "test"
        spec: "Informational correctly classified for test/referral context"
      - type: "test"
        spec: "HITL fail-safe defaults to active_diagnosis"
      - type: "test"
        spec: "Autonomous fail-safe defaults to uncertain"
      - type: "test"
        spec: "Unknown verdict returns mode-appropriate default"
      - type: "test"
        spec: "Encounter text truncated to 2000 characters"

    constraints:
      - type: "safety"
        spec: "Autonomous mode MUST default to uncertain on any failure -- never auto-code an ambiguous disorder"
      - type: "safety"
        spec: "HITL mode MUST default to active_diagnosis on failure -- surface it for human review rather than silently dropping"

    dependencies: ["DI-LEO-AI-036"]

    downstream_impacts:
      - "tier_classifier"
      - "pipeline_service"

    technical_details:
      language: "Python"
      framework: "N/A"
      libraries: ["libs.llm_client.consensus"]
      file_structure:
        - "libs/llm_client/disorder_verifier.py"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "All four verdicts, both mode fail-safes, unknown verdict fallback, and truncation verified"
    test_protocol: "VT-LEO-AI-022"

  safety_class: "B"
  risks: ["R-LEO-AI-001", "R-LEO-AI-026", "R-LEO-AI-030"]
  tags: ["disorder-verifier", "consensus", "safety-gate", "autonomous-coding", "intended-use-enforcement"]
