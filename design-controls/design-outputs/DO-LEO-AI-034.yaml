# -- DO-LEO-AI-034 -- Security Gap Remediation Batch 2 — Implementation
- id: "DO-LEO-AI-034"
  title: "Security Gap Remediation Batch 2 — Implementation Artefacts"
  version: "1.0"
  status: "released"
  date: "2026-03-03"
  satisfies: ["DI-LEO-AI-051"]
  verified_by: ["VT-LEO-AI-044"]

  implementation_artefacts:
    - path: "services/api/app/routers/auth.py"
      changes:
        - "GAP-002: Added _get_jwks() with 1-hour TTL in-process cache and stale-fallback"
        - "GAP-002: Added _verify_id_token() using jose.jwt.decode with RS256, audience, issuer validation"
        - "GAP-002: OAuth callback now calls _verify_id_token() instead of bare base64 decode"
        - "GAP-012: Imported emit_* functions from libs/audit/security_log.py"
        - "GAP-012: Emits auth.login.success, auth.login.failure, auth.login.mfa_blocked, auth.logout, security.token_rejected events with caller IP"

    - path: "libs/audit/security_log.py"
      changes:
        - "GAP-012: New module — typed emit_* functions writing single-line JSON to 'security.audit' logger at WARNING level"
        - "Event taxonomy: auth.login.*, auth.logout, auth.session.expired, authz.denied, authz.admin_action, data.access, data.modification, security.token_rejected"

    - path: "services/coding_worker/app/pipeline/pipeline_service.py"
      changes:
        - "TODO-VERIFY: Fixed critical data protection bug — patient_id_hash now stores hashlib.sha256(patient_id.encode()).hexdigest() instead of raw patient_id"

    - path: "services/terminology_api/app/routers/surface_forms.py"
      changes:
        - "GAP-004: Added Depends(verify_service_token) to POST /surface-forms/upsert-mapping"
        - "GAP-004: Added Depends(verify_service_token) to DELETE /surface-forms/{normalized:path}"
        - "GAP-004: Added Depends(verify_service_token) to POST /surface-forms/deduplicate"
        - "GET endpoints unchanged (remain open for internal use)"

    - path: "services/coding_worker/app/services/job_handler.py"
      changes:
        - "COD-T-001/002: Added CodingJobMessage Pydantic model with field validation"
        - "COD-T-001/002: handle_coding_job() validates msg.body via CodingJobMessage.model_validate() before any pipeline code"
        - "COD-T-002: patient_id and encounter_id validated against [a-zA-Z0-9_\\-]{1,128} regex"
        - "COD-T-001: mode restricted to Literal union of supported values"
        - "Malformed messages: logged at ERROR level, silently dropped (no re-raise) to prevent poison-pill loops"

    - path: "services/api/app/main.py"
      changes:
        - "CSP-T-001: Added add_security_headers middleware setting Content-Security-Policy, X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Strict-Transport-Security on every response"

    - path: "libs/utils/deidentify.py"
      changes:
        - "GAP-014: _LOCAL_ORGS now loaded from DEIDENTIFY_LOCAL_ORGS env var (pipe-separated) with fallback to _BUILTIN_ORGS"
        - "GAP-008: Added _get_ner_nlp() lazy loader, _ner_redact() NER PERSON replacement"
        - "GAP-008: deidentify_text() signature extended with ner: bool | None = None parameter"
        - "GAP-008: NER pass runs when ner=True or DEIDENTIFY_NER_MODEL env var is set"

  data_protection_notes:
    patient_id_hash_bug: >
      The CodingDecision audit node was storing the raw patient_id in a field
      named patient_id_hash — a direct identifier in a node that should hold
      only a pseudonym. This constitutes a UK GDPR data minimisation violation.
      The fix applies SHA-256 hashing, making the stored value a one-way
      pseudonym. Existing CodingDecision nodes with raw IDs should be remediated
      in production via a Neo4j migration script (out of scope for this release;
      tracked as open action in DPIA-001).
