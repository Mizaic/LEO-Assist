# -- VT-LEO-AI-192 -- Dry-run row 'Open in gold editor' + GoldDataset deep-link static-source VT
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-192"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-199"]
    risks: ["R-LEO-AI-189"]

  metadata:
    title: "EvaluateStage exposes 'Open in gold editor' on every dry-run row; GoldDatasetPanel handles ?labelId deep links"
    description: >
      Static-source jest VT (per ui-testing.mdc): asserts on the
      source string of EvaluateStage.tsx, GoldDatasetPanel.tsx and
      /gold-dataset/page.tsx. Pins the IconButton + aria-label in
      both row blocks, the POST to
      /api/training/candidates/from-dry-run, the
      /admin/gold-dataset?labelId=...&from=dry_run navigation, the
      useSearchParams plumbing and tab switch in GoldDatasetPanel,
      and the Suspense wrapper.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/dry-run-open-gold-editor.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "node 20 / jest 30 / ts-jest"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-192-TC-001"
      case_name: "EvaluateStage imports IconButton, EditNoteIcon and useRouter from next/navigation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EvaluateStage.tsx; assert imports for IconButton, EditNoteIcon, and useRouter from next/navigation"
          expected_result: "All three imports present"
          verification_method: "automated"
      acceptance_criteria:
        - "Required dependencies are wired"

    - case_id: "VT-192-TC-002"
      case_name: "Both dry-run row blocks render an IconButton with aria-label 'Open in gold editor'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EvaluateStage.tsx; count occurrences of aria-label=\"Open in gold editor\""
          expected_result: "Count >= 2 (NER-only block and full-pipeline block)"
          verification_method: "automated"
      acceptance_criteria:
        - "Curators see the action on every dry-run row"

    - case_id: "VT-192-TC-003"
      case_name: "Handler POSTs to /api/training/candidates/from-dry-run and pushes the deep link"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read EvaluateStage.tsx; assert presence of the literal '/api/training/candidates/from-dry-run' and 'router.push(`/admin/gold-dataset?labelId=' (template literal)"
          expected_result: "Both literals present"
          verification_method: "automated"
      acceptance_criteria:
        - "Click flow is wired end-to-end"

    - case_id: "VT-192-TC-004"
      case_name: "Disabled state guards the in-flight click and the empty-text case"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EvaluateStage.tsx; assert that the IconButton disabled prop references both openingGoldEditor and !text.trim() (or equivalent guard)"
          expected_result: "Both guards appear in the disabled prop"
          verification_method: "automated"
      acceptance_criteria:
        - "No double-click race; no empty POST"

    - case_id: "VT-192-TC-005"
      case_name: "GoldDatasetPanel imports useSearchParams, usePathname, useRouter from next/navigation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx; assert the import 'usePathname, useRouter, useSearchParams' from 'next/navigation'"
          expected_result: "Import line present"
          verification_method: "automated"
      acceptance_criteria:
        - "Deep-link plumbing is in place"

    - case_id: "VT-192-TC-006"
      case_name: "Deep-link effect resolves labelId, opens the dialog, and clears the query param"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx; assert presence of 'searchParams' references for 'labelId' and 'from', a setSelectedItem call inside a useEffect that depends on deepLinkLabelId, and a router.replace call"
          expected_result: "All three patterns present"
          verification_method: "automated"
      acceptance_criteria:
        - "Refresh-safe deep link"

    - case_id: "VT-192-TC-007"
      case_name: "from=dry_run switches the panel to the candidates tab"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx; assert that setTab('candidates') appears guarded by deepLinkFrom === 'dry_run' (or string literal 'dry_run')"
          expected_result: "Conditional setTab present"
          verification_method: "automated"
      acceptance_criteria:
        - "Reviewer mental model lines up with workflow"

    - case_id: "VT-192-TC-008"
      case_name: "/gold-dataset/page.tsx wraps GoldDatasetPanel in <Suspense>"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/app/gold-dataset/page.tsx; assert it imports Suspense from 'react' and renders <Suspense ...><GoldDatasetPanel /></Suspense>"
          expected_result: "Suspense wrapper present"
          verification_method: "automated"
      acceptance_criteria:
        - "App-router compatibility for useSearchParams"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-192/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-192-EXEC-001"
      executed_date: "2026-04-18"
      executed_by: "developer"
      result: "pass"
      environment: "development"
      command: "npx jest --testPathPatterns \"dry-run-open-gold-editor\" --no-coverage"
      summary: "8 tests passed, 0 failed in 4.561s (1 test suite)"
      notes: "All 8 acceptance criteria met. Static-source assertions on EvaluateStage.tsx, GoldDatasetPanel.tsx, and gold-dataset/page.tsx."
