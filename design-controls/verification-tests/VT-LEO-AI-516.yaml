- id: "VT-LEO-AI-516"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-517"]
    risks: ["R-LEO-AI-506"]

  metadata:
    title: "Episode-engine PipelineRun AuditEvent"
    description: >
      Verifies that persist_trace writes a unified
      :AuditEvent {type:'PipelineRun', subtype:'episode_engine'}
      alongside the EpisodeEngineTrace node, that token / cost
      properties are populated, that the patient link is created
      when the patient exists, and that write failures are swallowed.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/episode_engine/test_tracing.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "neo4j-python-driver test stub installed via fixtures"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-516-TC-001"
      case_name: "audit_event_written_with_token_totals"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call persist_trace with two stage outputs (segmenter,
            extractor) carrying input_tokens, output_tokens, cost_usd,
            and ok=True.
          expected_result: >
            Captured Cypher contains a MERGE on
            :AuditEvent {id:$id} with type='PipelineRun',
            subtype='episode_engine'; bound parameters contain
            llm_input_tokens=sum, llm_output_tokens=sum,
            llm_cost_usd>0, status='completed'.
          verification_method: "automated"
      acceptance_criteria:
        - "AuditEvent merge issued exactly once."
        - "Token / cost params match per-stage sums."

    - case_id: "VT-516-TC-002"
      case_name: "patient_link_created_when_patient_exists"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Stub neo4j session so the OPTIONAL MATCH (p:Patient)
            returns a patient.
          expected_result: >
            Captured Cypher contains a MERGE (p)-[:AUDIT_FOR]->(ae)
            and the bound patient_id matches the trace patient id.
          verification_method: "automated"
      acceptance_criteria:
        - "[:AUDIT_FOR] edge created when patient exists."

    - case_id: "VT-516-TC-003"
      case_name: "status_reflects_partial_failure"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Call persist_trace where one stage has ok=False and the
            engine errors array is empty.
          expected_result: >
            AuditEvent params include status='partial' and
            first_error matching the failing stage's message.
          verification_method: "automated"
      acceptance_criteria:
        - "status derived from per-stage ok flags."

    - case_id: "VT-516-TC-004"
      case_name: "write_failure_does_not_raise"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Patch the audit-event helper so the second session.run
            (the AuditEvent write) raises a RuntimeError.
          expected_result: >
            persist_trace completes normally, returns the trace id,
            and a WARNING log carries the trace id.
          verification_method: "automated"
      acceptance_criteria:
        - "No exception propagates from persist_trace."
        - "WARNING log includes trace id."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-516/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
