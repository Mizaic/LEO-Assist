# -- VT-LEO-AI-074 -- Overcoded Item Remediation Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-074"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-074"]
    risks: ["R-LEO-AI-049"]

  metadata:
    title: "Loop 1 Overcoded Item Remediation and 48h SLA Verification"
    description: >
      Verifies that overcoded items from audit create CodingReview with
      priority='urgent' and review_type='overcoded', appear in a dedicated
      urgent queue section, and trigger a SafetyNetAlert after 48h if
      unreviewed. Safety-critical: overcoded diagnoses in patient records
      can cause incorrect clinical decisions (R-LEO-AI-049).
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_overcoded_remediation.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Mock Neo4j client"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-074-TC-001"
      case_name: "Overcoded audit finding creates CodingReview with urgent priority"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Provide audit Phase 3 result with one overcoded item"
          expected_result: "CodingReview created with review_type='overcoded', priority='urgent', status='pending'"
          verification_method: "automated"
      acceptance_criteria:
        - "review_type = 'overcoded'"
        - "priority = 'urgent'"
        - "status = 'pending'"

    - case_id: "VT-074-TC-002"
      case_name: "DriftMetric.overcoded_count populated from audit results"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Provide audit results with 3 overcoded items"
          expected_result: "DriftMetric.overcoded_count = 3"
          verification_method: "automated"
      acceptance_criteria:
        - "overcoded_count equals number of overcoded items in audit result"

    - case_id: "VT-074-TC-003"
      case_name: "48h SLA alert fires for unreviewed urgent item"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Create urgent CodingReview with created_at = now - 49h and status='pending'"
          expected_result: "SafetyNetAlert created with alert_type='overcoded_overdue'"
          verification_method: "automated"
      acceptance_criteria:
        - "SafetyNetAlert created with alert_type='overcoded_overdue'"

    - case_id: "VT-074-TC-004"
      case_name: "No SLA alert for urgent item reviewed within 48h"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Create urgent CodingReview with created_at = now - 47h and status='resolved'"
          expected_result: "No SafetyNetAlert created"
          verification_method: "automated"
      acceptance_criteria:
        - "No overcoded_overdue alert when item is resolved"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-074/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
