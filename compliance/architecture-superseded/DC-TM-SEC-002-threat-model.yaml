unresolved_items:
  - type: "RESOLVED"
    description: "Verify that patient_id_hash in CodingDecision is actually hashed, not raw patient_id"
    impact: "Audit trail may contain directly identifiable patient data"
    resolution: "VT-LEO-AI-044 (VT-044-029/030/031) confirms SHA-256 hashing. Production Neo4j migration of existing raw IDs is an ops task tracked in DPIA-001."

  - type: "RESOLVED"
    description: "Verify SERVICE_AUTH_SECRET is set in all deployed environments"
    impact: "Inter-service auth silently disabled if secret missing"
    resolution: "container-apps.bicep maps SERVICE_AUTH_SECRET from Key Vault. migrate-secrets.ps1 auto-generates if missing. tests/test_infra_security.py confirms."

  - type: "TODO:VERIFY"
    description: "Verify Azure AD DPIA covers dual-provider consensus pattern (AWS + Azure)"
    impact: "Clinical text sent to two separate cloud providers without documented DPIA"
    note: "DPIA-001-dual-provider-llm.md exists as v0.1-draft. Awaiting DPO sign-off."

  - type: "RESOLVED"
    description: "Infrastructure WAF/reverse proxy configuration"
    impact: "Rate limiting, IP filtering, and TLS termination may exist at infrastructure layer"
    design_document: "DC-DEP-001-deployment-configuration.md"
    resolution: >
      Verified 2026-03-03 via DNS + HTTP probe. healthcarecopilot.ai zone is
      Cloudflare-proxied (CF IPs 104.26.14.136, 104.26.15.136, 172.67.73.125;
      CF-RAY header confirmed on prod). Production (leo-ai-audit.healthcarecopilot.ai)
      returns: Server: cloudflare, Strict-Transport-Security: max-age=15552000,
      X-Content-Type-Options: nosniff, Referrer-Policy: strict-origin-when-cross-origin,
      Permissions-Policy: camera=(), microphone=(self), geolocation=(), interest-cohort=().
      Cloudflare provides TLS termination, DDoS protection, and managed WAF at edge.
      Wrangler CLI not authenticated — WAF rule-set detail (OWASP CRS level,
      rate limiting thresholds, bot management) requires Cloudflare dashboard review.
    remaining_actions:
      - "Confirm WAF managed ruleset is enabled (OWASP Core, Cloudflare Managed)"
      - "Confirm rate limiting rules match application-level slowapi thresholds"
      - "Document Cloudflare plan tier (Free/Pro/Business/Enterprise) for NHS DSPT evidence"

  - type: "PARTIALLY RESOLVED"
    description: "Azure AD app registration configuration — accessTokenAcceptedVersion, redirect URIs"
    impact: "Token validation scope and OAuth flow security depend on Azure AD configuration"
    design_document: "DC-DEP-001-deployment-configuration.md"
    resolution: >
      Verified 2026-03-03 via az ad app show. Primary app registration is
      "Mizaic Atlas" (c97f7ad9-845f-420c-ae3f-fa5c5d815bcd) — the actual
      AZURE_AD_CLIENT_ID used by the platform. 19 additional legacy LEO
      registrations exist under tenant ceb47133-88ce-4455-b7ef-99dbd161c637.
      Deployment configuration specification created (DC-DEP-001) with required
      settings, checklists, and anti-patterns for new environment onboarding.
    primary_app:
      display_name: "Mizaic Atlas"
      app_id: "c97f7ad9-845f-420c-ae3f-fa5c5d815bcd"
      sign_in_audience: "AzureADMultipleOrgs"
      access_token_accepted_version: 2  # GOOD — v2 tokens enforced
      id_token_issuance: false  # GOOD — not used
      credentials:
        - "atlas-dev — expires 2026-07-27"
        - "Atlas — expires 2026-07-11"
        - "secret 1 — expires 2026-06-10"
      credential_note: "All 3 secrets expire within 4 months — rotation plan needed"
    findings:
      implicit_grant:
        issue: "enableAccessTokenIssuance was true on Mizaic Atlas"
        status: "FIXED 2026-03-03 — set to false via az ad app update"
        verification: "az ad app show confirms enableAccessTokenIssuance=false, enableIdTokenIssuance=false"
      redirect_uris:
        issue: "6 of 11 redirect URIs are localhost; localhost URIs co-exist with production callbacks"
        details:
          - "PROD: https://leo-ai-audit.healthcarecopilot.ai/auth/callback"
          - "VAL:  https://atlas-val.healthcarecopilot.ai/auth/callback"
          - "DEV:  https://atlas-dev.healthcarecopilot.ai/auth/callback"
          - "OTHER: https://research.healthcarecopilot.ai/api/auth/callback/azure-ad"
          - "LOCAL: http://localhost:3000/auth/callback"
          - "LOCAL: http://localhost:3000/auth/callback/azure-ad"
          - "LOCAL: http://localhost:3000/api/auth/callback/azure-ad"
          - "LOCAL: http://localhost:3004/api/auth/callback/azure-ad"
          - "LOCAL: http://localhost:3013/api/auth/callback/azure-ad"
          - "LOCAL: http://localhost:4000/auth/callback"
          - "LOCAL: http://localhost:4000/api/auth/callback/azure-ad"
        recommendation: >
          Create a separate app registration for local dev with localhost URIs.
          Remove all localhost URIs from the production Mizaic Atlas registration
          to prevent token redirect attacks.
      token_version:
        note: "accessTokenAcceptedVersion=2 on Mizaic Atlas (GOOD). Legacy LEO apps default to v1 — low risk if unused."
      legacy_expired_credentials:
        issue: "13 expired client secrets across 8 legacy LEO app registrations (oldest: 2024-07-12)"
        recommendation: "Audit and decommission unused legacy registrations; rotate or remove expired credentials"
        affected_apps:
          - "leo-azure-fhir-server: email_service_secret (2025-03-07)"
          - "LEO Analytics App: Generated by App Service (2025-08-07), rob-ide (2025-07-18)"
          - "Leo App - non-prod: 2 expired (2024-07)"
          - "LEO App Non Prod FHIR Agent: 2 expired (2025-05/07)"
          - "LEO Edge: 1 expired (2024-10)"
          - "LEO Pathway Onboarder: 3 expired (2025-11)"
          - "LEO Training App: 1 expired (2025-11)"
          - "LEO_Integration_uat: 1 expired (2025-04)"

  - type: "RESOLVED"
    description: "De-identification completeness assessment using annotated clinical text corpus"
    impact: "Quantify residual PII rate in text sent to 2-3 LLM providers per entity"
    resolution: >
      tests/test_deid_completeness.py provides 138-case multicultural corpus covering
      34 SystmOne-format names, 20 honorific names, 14 CAPS-bare names, 20 free-text
      first names (xfail — known NER gap), NHS numbers, postcodes, phones, emails,
      dates, addresses, facility names, and 7 integrated clinical scenarios across
      South Asian, East Asian, African, Middle Eastern, Celtic, Eastern European cultures.
      Regex-only residual rate: 100% for structured PII, 0% for bare first names (requires NER).
      Two regex bugs fixed during assessment: hyphenated NHS numbers and +44-space phone format.

  - type: "RESOLVED"
    description: "ReDoS testing of user-supplied context_regex and post-processor rules"
    impact: "Catastrophic backtracking could cause pipeline timeouts"
    resolution: "_validate_regex uses a timeout-based probe. tests/test_training_rules_security.py covers OWASP ReDoS patterns, anchored greedy, max length, syntax errors. VT-LEO-AI-045 confirms."

  - type: "RESOLVED"
    description: "Prompt injection testing with adversarial clinical text payloads against consensus/disorder verifier"
    impact: "Determine if injection can alter entity classification verdicts"
    resolution: "tests/test_llm_attack_simulation.py provides 20+ tests across 9 attack families (ChatML, Llama, role hijack, delimiter, XML injection, response-stuffing, JSON array injection, multi-field simultaneous, injection guard presence). Known non-coverage: Unicode lookalike chars (documented)."

  - type: "TODO:MANUAL"
    description: "Assertion detection accuracy assessment against UK primary care text corpus"
    impact: "Quantify negation/historical false positive rate for context engine"

  - type: "TODO:MANUAL"
    description: "Tier classifier threshold calibration against labelled clinical outcomes"
    impact: "Validate that 0.95 Tier 1 threshold provides adequate clinical safety margin"

