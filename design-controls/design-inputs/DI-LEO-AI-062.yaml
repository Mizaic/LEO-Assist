# -- DI-LEO-AI-062 -- AI-assisted PromptConfig Tuner with De-identified Few-shot Examples
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-062"
  type: "Functional"
  derived_from: ["UN-LEO-AI-001"]
  requirement: >
    The system SHALL provide PromptConfig controls for smart few-shot selection
    and prompt caching, including a configurable maximum few-shot count,
    a per-example core flag, and provider-aware runtime selection of relevant
    examples while preserving de-identification and auditability.
  rationale: >
    Prompt engineering is iterative; systematic tuning with real-world
    examples improves coding accuracy. De-identification ensures
    training examples can be used without exposing PHI. AI assistance
    accelerates the tuning workflow.

  machine_spec:
    agent_prompt: |
      Implement AI-assisted PromptConfig tuner (~300 LOC).

      SINGLE PURPOSE: Tune prompt configurations using de-identified
      few-shot examples with AI-assisted parameter suggestions.

      REQUIREMENTS:
      1. Load de-identified few-shot examples from approved corpus.
      2. Run prompt variants against examples and measure accuracy.
      3. AI suggests parameter adjustments based on failure analysis.
      4. Track tuning history and configuration versions.
      5. Export tuned PromptConfig for pipeline use.
      6. Enforce de-identification before any example inclusion.

      METHODS:
      - load_examples(corpus_id): Load de-identified few-shot set.
      - run_evaluation(config, examples): Score config against examples.
      - suggest_improvements(results): AI-assisted tuning suggestions.
      - save_config(config, version): Persist tuned configuration.
      - validate_deidentification(example): Ensure no PHI present.

    acceptance_criteria:
      - type: "test"
        spec: "Core examples are always included in static system prompt"
      - type: "test"
        spec: "Dynamic examples are selected at runtime with maxFewShot cap applied"
      - type: "test"
        spec: "Bedrock requests include cachePoint marker for prompt prefix caching"
      - type: "test"
        spec: "Admin prompt UI persists maxFewShot and core fields"

    constraints:
      - type: "safety"
        spec: "Only de-identified examples in tuning corpus"
      - type: "traceability"
        spec: "All config changes versioned and auditable"

    dependencies: ["DI-LEO-AI-045"]

    downstream_impacts:
      - "Prompt configuration management"
      - "Coding pipeline accuracy"
      - "LLM prompt versioning"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["boto3", "pydantic"]
      file_structure:
        - "services/api/app/services/prompt_tuner.py"
        - "libs/prompts/tuner_evaluator.py"
        - "libs/deid/validator.py"
        - "services/ui/src/components/operations/PromptTunerPanel.tsx"
      estimated_loc: 300

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Prompt caching and smart few-shot controls are enforced and persisted end-to-end"
    test_protocol: "VT-LEO-AI-062"

  safety_class: "B"
  risks: ["R-LEO-AI-030", "R-LEO-AI-014"]
  tags: ["prompt-tuning", "few-shot", "de-identification", "llm", "configuration"]
