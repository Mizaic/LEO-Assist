# -- DI-LEO-AI-011 -- Episode Consolidation
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-011"
  type: "Functional"
  derived_from: ["UN-LEO-AI-006"]
  requirement: "The system SHALL consolidate overlapping or duplicate episodes for the same patient, merging milestone timelines and resolving conflicts between competing episode classifications"
  rationale: "Patients may have multiple encounters that could form separate or overlapping episodes. Consolidation ensures each distinct clinical pathway is represented once, preventing duplicate counting in audit metrics."

  machine_spec:
    agent_prompt: |
      Implement the EpisodeConsolidator class (~200 LOC).

      SINGLE PURPOSE: Merge overlapping or duplicate episodes for the same
      patient into a single consolidated episode per distinct clinical pathway.

      REQUIREMENTS:
      1. Detect overlapping episodes based on temporal overlap and shared
         encounter references.
      2. Merge milestone timelines from overlapping episodes into a single
         unified timeline.
      3. Resolve conflicts between competing episode classifications using
         a defined precedence hierarchy.
      4. Preserve full provenance of the merge decision for audit trail.

      METHODS:
      - consolidate(patient_id): Run consolidation for all episodes of a patient.
      - detect_overlaps(episodes): Find candidate merge groups.
      - merge_episodes(group): Merge a group of overlapping episodes.
      - resolve_classification(classifications): Pick the winning classification.

      CODE CLARITY:
      - Use guard clauses to flatten nesting.
      - Keep functions under 30 lines.
      - Use type hints throughout.

    acceptance_criteria:
      - type: "test"
        spec: "Consolidated episodes match expert groupings in >= 90% of test cases"
      - type: "test"
        spec: "No duplicate episodes remain after consolidation for any patient"
      - type: "test"
        spec: "Merge provenance recorded for every consolidation decision"

    constraints:
      - type: "performance"
        spec: "Consolidation for a single patient completes in < 2 seconds"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "quality_checker"
      - "kpi_calculator"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/episode_consolidator.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Consolidated episodes match expert groupings in >= 90% of test cases"
    test_protocol: "VT-LEO-AI-011"

  safety_class: "B"
  risks: []
  tags: ["episode-consolidation", "deduplication", "analysis"]
