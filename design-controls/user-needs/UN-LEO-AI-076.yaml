# -- UN-LEO-AI-076 -- Persistent test patient library for guideline regression
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-076"
  title: "When clinical leads or QA reviewers edit, deploy or rebuild the appropriateness-guideline ruleset, they must be able to confirm that previously approved patient profiles still reach the same recommendation, so that no rule edit silently changes a clinical outcome"

  description: |
    The roaring-bitmap appropriateness engine compiles every active
    AppropriatenessRule into a versioned ruleset and evaluates patients
    by intersecting concept-id bitmaps. Reviewers can edit a rule's
    logic tree from the Clinical Guidelines page, which writes a new
    rule version and triggers a recompile of the ruleset.

    Today there is no way to confirm that a rule edit, a guideline
    redeploy, or a periodic rebuild does not silently change which
    patients trigger which rules. Reviewers either:

      - manually re-paste a few SNOMED codes into a temporary form to
        check one patient at a time (lossy, unrepeatable, no audit), or
      - wait for downstream regression tests to fail (slow feedback,
        no clinical context).

    Clinical leads and QA reviewers need a persistent library of test
    patient profiles (codes, age, sex, pathway) attached to each
    guideline. Each profile carries an "expected matched rules"
    snapshot captured at save time. Whenever the ruleset is recompiled
    -- by a deploy, a manual edit or a scheduled rebuild -- every
    saved profile is replayed and any drift surfaces as a regression
    on the Clinical Guidelines page, before the new ruleset reaches
    production.

    The library must also support generating starter profiles
    (happy path, fail path, branch, age boundary) directly from the
    rule logic, so a brand-new guideline can be regression-tested
    without hand-authoring 30+ patients.

  stakeholder: "Clinical lead, QA / RA reviewer, ML engineer"

  priority: "high"

  rationale: >
    Silent regressions in appropriateness rules are a Class B clinical
    safety event under IEC 62304 -- a rule that quietly stops firing
    means a 2-week wait recommendation is never raised, a patient on a
    suspected-cancer pathway never reaches the safety-net dashboard.
    Persistent, scope-filtered, replayable test patients give the
    reviewer fast, evidence-based confirmation that an edit or rebuild
    did what they expected, and give QA an immutable record of how a
    given ruleset version behaved on a stable cohort.

  acceptance_criteria:
    - "Reviewers can build a test patient (codes + age + sex + pathway) from the Clinical Guidelines page, dry-run it against the live ruleset, confirm the expected matched rules, and persist it under a guideline."
    - "Reviewers can auto-generate happy / fail / branch / boundary patient proposals at scope rule, branch, guideline or all, with deduplication against previously saved patients in the same guideline."
    - "Every save captures an EXPECTED_RESULT snapshot per asserted rule (fires + matched_branch_node_ids + ruleset_version + snapshot_by) so the assertion is auditable."
    - "A POST /api/guidance/test-patients/replay endpoint replays every saved patient in scope, diffs against its snapshot, and returns a {passes, regressions, drift, unexpected_matches} report; the report is persisted as a :RulesetReplay node tagged with ruleset_version."
    - "The terminology-API ruleset compiler triggers an automatic replay against the new version after a successful compile and the latest replay status (passes / regressions count, ruleset_version) appears on the Clinical Guidelines page so reviewers see drift before deploy."
    - "EditRuleDialog re-runs replay scoped to the rule when the logic tree changes and shows a regression banner with rule names if any saved patient flips, so the reviewer cannot save a regressing edit unknowingly."
    - "Test patient name, description, banner copy and result labels meet the project's plain-English standard (reading age 9-11)."

  design_inputs:
    - "DI-LEO-AI-165"
    - "DI-LEO-AI-166"
    - "DI-LEO-AI-167"
    - "DI-LEO-AI-180"
    - "DI-LEO-AI-181"

