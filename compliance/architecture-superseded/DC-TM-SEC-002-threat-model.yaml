# ---------------------------------------------------------------------------
# COMPONENT 4: CODING PIPELINE
# ---------------------------------------------------------------------------
component_4_coding_pipeline:
  name: "Coding Pipeline"
  purpose: "Extract clinical entities from encounter text via NER, apply the unified post-processing stack (libs/pipeline/post_processing.py — shared with Component 6), resolve to SNOMED, apply tier classification, persist DOCUMENTS links and CodingDecision audit trail"
  iec_62304_contribution: "B"
  trust_boundaries:
    - "Service Bus → Coding Worker"
    - "Coding Worker → AWS Bedrock (escalation, consensus)"
    - "Coding Worker → Azure OpenAI (consensus)"
    - "Coding Worker → Terminology API"
    - "Coding Worker → Neo4j Patient Graph"
  data_assets: "Clinical text (de-identified), SNOMED codes, extraction results, CodingDecision audit records"
  network_exposure: "Internal"

  phase_2_threats:
    - id: "COD-T-001"
      element: "services/coding_worker/app/services/job_handler.py"
      threat: "Unvalidated message body — arbitrary patient processing"
      status: "RESOLVED"
      resolution_date: "2026-03-03"
      resolution: >
        CodingJobMessage Pydantic model validates patient_id (required, max 128 chars,
        [a-zA-Z0-9_\\-] only), encounter_id (optional, same constraint), mode (Literal union),
        dry_run (bool). handle_coding_job() calls model_validate() before any pipeline code.
        Malformed messages logged at ERROR and dropped silently to prevent poison-pill loops.
      resolution_files:
        - "services/coding_worker/app/services/job_handler.py"
      design_controls: ["DI-LEO-AI-051", "DO-LEO-AI-034", "VT-LEO-AI-044"]
      attack_vector: "Messages from Azure Service Bus are deserialized and patient_id, encounter_id, mode, dry_run are read directly from the body without schema validation."
      prerequisites: "Access to Azure Service Bus queue (Managed Identity or connection string)"
      threat_actors: ["supply_chain", "malicious_insider"]
      evidence:
        file: "services/coding_worker/app/services/job_handler.py"
        snippet: "body = msg.body; patient_id = body.get('patient_id')"
      impact:
        confidentiality: "Medium"
        integrity: "Medium"
        availability: "Low"
        clinical_safety: "Medium"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "Requires Azure Service Bus access (Managed Identity). Worker does validate mode against rejection list."
      existing_controls: "Pydantic schema validation; format validation on IDs; Azure Service Bus authentication via Managed Identity; ACA network isolation"

    - id: "COD-I-001"
      element: "services/coding_worker/app/pipeline/pipeline_service.py"
      threat: "Clinical text sent to external LLM providers"
      status: "OPEN (expanded in v2)"
      attack_vector: >
        De-identified encounter text is now sent to multiple LLM providers via the
        consensus engine: AWS Bedrock (Haiku + Sonnet) and Azure OpenAI (GPT-5 mini)
        in parallel. The escalation path can invoke Opus (AWS) for complex cases.
        The disorder verifier sends entity_text + encounter_text[:2000] to both providers.
        This significantly expands the LLM exposure surface compared to v1.
      prerequisites: "Standard system operation"
      threat_actors: ["supply_chain"]
      evidence:
        file: "libs/llm_client/consensus.py"
        snippet: "fut_aws = pool.submit(_call_provider, 'aws', 'small', ...); fut_azure = pool.submit(_call_provider, 'azure', 'small', ...)"
      impact:
        confidentiality: "Medium"
        integrity: "None"
        availability: "None"
        clinical_safety: "None"
        patient_data_exposure: true
      likelihood: "Medium"
      likelihood_rationale: "De-identification is regex-based and cannot catch all PII. The consensus pattern sends clinical text to 2-3 LLMs per operation (up from 1 in v1)."
      existing_controls: "Regex-based de-identification; encounter_text sanitised and capped at 16000 chars (~4 A4 pages) in disorder verifier; AWS Bedrock and Azure OpenAI data processing agreements"
      gaps: "De-identification not validated for completeness; no PHI detection audit before LLM submission; clinical text exposure surface has grown 2-3x with consensus pattern"
      confidence: "Confirmed"

    - id: "COD-I-002"
      element: "services/coding_worker/app/pipeline/pipeline_service.py"
      threat: "Terminology resolution via unauthenticated HTTP"
      status: "PARTIALLY RESOLVED in v2"
      resolution: >
        SERVICE_AUTH_SECRET Bearer token added for inter-service calls (GAP-007).
        ACA mTLS peer encryption provides transport security.
      residual_risk: "If SERVICE_AUTH_SECRET is empty (local dev), auth is bypassed."
      original_severity: "Low"
      residual_severity: "Low"

