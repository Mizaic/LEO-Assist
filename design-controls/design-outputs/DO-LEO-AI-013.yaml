    verification_tests: ["VT-LEO-AI-013"]
    validation_tests: []

  specification:
    title: "Audit Event System"
    description: |
      Provides a structured audit event emitter and FHIR-compatible audit
      event endpoint. Every auditable action in the system -- user logins,
      data access, configuration changes, model invocations -- is captured,
      timestamped, and persisted so the organisation can demonstrate
      compliance during regulatory inspections.
    purpose: "Captures and persists all auditable system events for regulatory traceability and compliance"
    technical_approach: |
      A shared library (audit_emitter) publishes structured audit events
      with caller identity, action type, resource reference, and outcome.
      The FHIR API exposes an AuditEvent resource endpoint that accepts
      and queries these records. Events are stored in the patient-data
      Neo4j instance for tamper-evident retention.
    acceptance_criteria:
      - criterion: "Every security-relevant action produces an audit event"
        type: "functional"
        measurement: "Integration tests verify event creation for login, data read, data write, and config change"
        target: "100% of defined auditable actions produce events"
      - criterion: "Audit events conform to FHIR R4 AuditEvent resource schema"
        type: "functional"
        measurement: "FHIR validation against R4 AuditEvent StructureDefinition"
        target: "Zero validation errors"
      - criterion: "Audit query endpoint returns results within acceptable latency"
        type: "performance"
        measurement: "Response time under typical load (100 concurrent users)"
        target: "<500ms p95"
      - criterion: "Audit records cannot be deleted or modified through the API"
        type: "security"
        measurement: "Attempt DELETE and PUT on audit records; verify 405 response"
        target: "All mutation attempts rejected"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/audit/audit_emitter.py"
        description: "Shared library that constructs and emits structured audit events"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/fhir_api/app/routers/audit_event.py"
        description: "FHIR R4 AuditEvent router for querying and recording audit entries"
        storage_location: "git"
    technical_details:
