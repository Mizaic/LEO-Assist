# -- UN-LEO-AI-098 -- Reviewers see stalest active rules first and trust SNOMED writes are unified
# IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-098"
  title: "Reviewers can see which active rules are most overdue for re-validation, and every guidance SNOMED write goes to a single canonical concept node so edits never silently fail"
  description: >
    As a clinical author or QA lead working through the /admin/guidance
    Active rule list, I need two things:

    1. The Active list MUST surface the rules that are most overdue for
       re-validation at the top of the page so I can budget my review time
       sensibly. Today the list is sorted newest-first which is the WRONG
       signal for an Active list -- the rules I most need to look at are
       the ones nobody has touched for months. Each rule should also
       carry a short plain-English "Updated <relative>" hint so I can
       see at a glance whether a rule was last looked at last week or
       last year.

    2. Every guidance write MUST go to the same SNOMED concept node
       identity that terminology search returns. Today the v1 generator
       wrote a parallel `(:SnomedConcept {conceptId})` node next to the
       canonical `(:Concept {id})` written by the SNOMED loader. That
       schema split caused real edit failures ("Unknown SNOMED concept
       ids") for FE-picker concepts on v2 rules, and the bitmap
       compiler's descendant expansion silently fell back to exact-match
       for every guidance-only concept because the legacy nodes had no
       IS_A hierarchy. I should not have to know about the schema
       split, and an edit I make in the picker should never be
       rejected because of where the concept was first written.

  stakeholder: "Clinical author / QA lead / reviewer"
  priority: "high"

  rationale: >
    The Active list staleness signal is the single most useful sort
    order for re-validation work because every other dimension (rule
    name, guideline id, strength) is visible on the card already.
    Stalest-first surfaces the rules most likely to disagree with
    current evidence at the top, where the next available reviewer
    will look first. Today's newest-first sort is actively misleading:
    it pushes recently-edited rules (the ones a reviewer has already
    looked at) to the top of the list and buries everything else.

    The schema unification removes a real production bug: the dual
    namespace caused two distinct failure modes (verifier rejection
    and silent loss of descendant expansion) that we have already
    burned reviewer time chasing. Unifying writes onto the canonical
    `:Concept` graph means every reader (terminology search, the
    bitmap compiler, the verifier, the migration script) projects the
    same fields from the same node identity, so the dual-graph
    fallback in `_VERIFY_CONCEPTS` becomes purely defensive instead
    of load-bearing.

  acceptance_criteria:
    - "The /admin/guidance Active rule list sorts stalest-first by rule.updatedAt (ASC), with deterministic rule_id tie-breaks so the order is stable across renders"
    - "Each rule card shows a short plain-English 'Updated <N> minutes / hours / days / months / years ago' hint sourced from the BE rule.updatedAt projection, with 'just now' as the floor for sub-minute / future deltas"
    - "The BE list endpoint surfaces rule.updatedAt (coalesced to rule.createdAt for legacy rows), rule.reviewedAt, and rule.reviewedBy on every rule in the response"
    - "Every guidance MERGE in services/api/app/services/guidance_rule_generator.py and services/api/app/routers/guidance_rules.py writes the canonical `(:Concept {id})` node with `preferred_term` / `semantic_tag` / `source` properties; no production guidance file MERGEs `:SnomedConcept`"
    - "The bitmap compiler's HAS_CRITERIA / HAS_ACTION / APPLIES_TO reads bind concept nodes unlabeled and project ids via coalesce(concept.id, concept.conceptId) so canonical and legacy nodes both bind during the migration window"
    - "The bitmap compiler's _closure_ids walks IS_A on `:Concept` (the only graph that has hierarchy) and falls back silently to exact-match if no canonical seed is found"
    - "scripts/migrations/2026_link_or_delete_orphan_snomed_concepts.py rewires every guidance legacy `:SnomedConcept` node onto its canonical `:Concept` twin, deletes orphans, is idempotent (a second pass is a no-op), and NEVER touches patient-coding `:SnomedConcept` nodes connected via :DOCUMENTS"
    - "tests/test_guidance_schema_invariants.py pins the canonical-write contract across the generator, router, and compiler so the dual-graph bug cannot regress"

  design_inputs:
    - "DI-LEO-AI-528"

  metadata:
    identified_by: "Rob Smith - 2026-04-19 follow-up to DI-LEO-AI-508 / R-LEO-AI-508 (dual-graph bug + Active-list staleness)"
    identified_date: "2026-04-19"
    status: "approved"
    tags:
      - "guidance-rules"
      - "schema-unification"
      - "active-list-sort"
      - "staleness-signal"
      - "snomed"
      - "clinical-safety"
      - "ux"
