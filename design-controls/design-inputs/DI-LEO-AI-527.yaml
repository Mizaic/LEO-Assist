# -- DI-LEO-AI-527 -- Similar-candidates batch dialog uses host search vocabulary + match rationale chips
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-527"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-096"
  requirement: >
    The "Apply to similar candidates" batch dialog
    (`services/ui/src/components/gold-dataset/SimilarCandidatesBatch.tsx`)
    that opens after a reviewer marks a row as gold from the
    /admin/training Candidates queue SHALL render each similar-candidate
    row's encounter text using the same shared `<HighlightedText>`
    primitive and the same outlined "why this matched" chip taxonomy
    as /care/encounters, the /care/patients drawer, the dry-run
    Candidates list, and the dry-run Gold-label list.

    `SimilarCandidatesBatch` SHALL accept a `search?: string` prop
    that `GoldDatasetPanel` populates from its `debouncedSearch`
    state. The dialog SHALL compute
    `expandedTerms = useMemo(() => expandSearchTerms(search), [search])`
    once per render and SHALL compute per-row
    `matchRationale = computeMatchRationale(item.text, expandedTerms)`
    and `highlightTerms = collectHighlightTerms(search, matchRationale.hitTerms)`.

    When `highlightTerms.length > 0` the row's truncated encounter
    text SHALL be wrapped in `<HighlightedText testId="similar-candidate-row-highlight">`,
    otherwise the row SHALL render the plain truncated string
    (no behavioural change).

    When `expandedTerms.length > 0 && matchRationale.hitTerms.length > 0`
    the row SHALL render an outlined chip row inside the encounter-text
    cell (mt: 0.5, gap: 0.5, flex-wrap), with up to 4 hit terms,
    using the same chip token (`size="small"`, height 20, fontSize
    0.65rem, `variant="outlined"`) as the dry-run review queue
    (DI-LEO-AI-523) and the patient drawer (DI-LEO-AI-520). The
    chips SHALL be exposed via stable
    `data-testid="similar-candidate-row-match-rationale"`
    (container) and
    `data-testid="similar-candidate-row-match-rationale-chip"`
    (per chip).

  rationale: >
    The batch dialog is the LAST encounter-list-with-search-context
    surface in the product that does not show the highlighter +
    chips. Reviewers who built muscle memory on /care/encounters and
    the dry-run review queue routinely complain that the dialog
    "looks like a different product" -- they cannot tell at a glance
    which similar candidates actually matched the query they ran.

    Wiring the existing `encounterRelevance` + `HighlightedText`
    primitives into the dialog closes the last gap with no new
    backend surface, and uses the same
    `data-testid="similar-candidate-row-*"` namespace so future
    Playwright e2e specs can assert end-to-end consistency from the
    review-list row click into the dialog.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          `SimilarCandidatesBatch` MUST import `expandSearchTerms`
          and `computeMatchRationale` from
          `@/components/mission-control/encounterRelevance`, and
          `HighlightedText` + `collectHighlightTerms` from
          `@/components/mission-control/HighlightedText`.
      - type: "functional"
        spec: >
          `SimilarCandidatesBatch` MUST expose `search?: string` on
          its `Props` interface and MUST compute `expandedTerms`
          via `useMemo(() => expandSearchTerms(search), [search])`.
      - type: "functional"
        spec: >
          Per row, the dialog MUST compute `matchRationale` and
          `highlightTerms` and MUST render
          `<HighlightedText testId="similar-candidate-row-highlight">`
          when `highlightTerms.length > 0`, otherwise the plain
          truncated string.
      - type: "functional"
        spec: >
          When `showRationale` (terms hit > 0 AND expanded > 0),
          the row MUST render a `<Box>` with
          `data-testid="similar-candidate-row-match-rationale"`
          containing `matchRationale.hitTerms.slice(0, 4)` outlined
          `<Chip>` elements with
          `data-testid="similar-candidate-row-match-rationale-chip"`,
          height 20, fontSize 0.65rem.
      - type: "functional"
        spec: >
          `GoldDatasetPanel` MUST pass `search={debouncedSearch}`
          into `<SimilarCandidatesBatch>` so the chips reflect the
          query that drove the source-row context.
    constraints:
      - type: "performance"
        spec: >
          `expandedTerms` MUST be memoised at the dialog level (not
          per row); per-row work is bounded by the dialog's row cap
          (the existing maxHeight: 460px viewport keeps this in the
          tens of rows at most).
      - type: "safety"
        spec: >
          The chip + highlight wiring MUST stay strictly visual.
          The dialog's existing accept / review / skip handlers
          (`onApply`, `onReviewCandidate`, `onToggle`, `onClose`)
          MUST be untouched.
    dependencies:
      - "DI-LEO-AI-145"
      - "DI-LEO-AI-520"
      - "DI-LEO-AI-523"
    downstream_impacts:
      - "Similar-candidates batch dialog renders highlighted titles"
      - "Similar-candidates batch dialog renders match-rationale chips"
      - "GoldDatasetPanel forwards debouncedSearch into the dialog"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16 + MUI v7"
      file_structure:
        - "services/ui/src/components/gold-dataset/SimilarCandidatesBatch.tsx"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      estimated_loc: 70

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-525 verifies static-source structural invariants:
      the shared imports, the optional `search` prop, the memoised
      expansion, the per-row rationale + highlight computation, the
      conditional `<HighlightedText>` wrapping, the rationale chip
      container + 4-chip cap with the standard token styling, and
      the GoldDatasetPanel pass-through of `debouncedSearch`.

  safety_class: "B"
  risks:
    - "R-LEO-AI-063"
    - "R-LEO-AI-174"
  tags:
    - "ui"
    - "training-data"
    - "search"
    - "consistency"
    - "design-system"
