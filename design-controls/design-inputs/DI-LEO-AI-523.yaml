# -- DI-LEO-AI-523 -- Dry-run candidate + gold rows use host search vocabulary + match rationale chips
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-523"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-096"
  requirement: >
    The /admin/training Candidates, Verified gold, and Synthetic gold
    sub-tabs SHALL use the same deterministic query understanding as
    the /care/encounters host search and the /care/patients drawer
    (see DI-LEO-AI-520 and
    `services/ui/src/components/mission-control/encounterRelevance.ts`).

    `CandidateReviewList` SHALL accept a `search?: string` prop
    (forwarded from `GoldDatasetPanel`'s `debouncedSearch`),
    compute `expandedTerms = expandSearchTerms(search)` once per
    render, and per-row compute
    `matchRationale = computeMatchRationale(candidate.text, expandedTerms)`.
    The same wiring SHALL apply to `GoldLabelReviewList` for the
    `item.text` field.

    Each row's `title` SHALL be wrapped in `<HighlightedText>` with
    `terms = collectHighlightTerms(search, matchRationale.hitTerms)`
    so a query for "lump" highlights "mass", "swelling", or "nodule"
    inside the truncated sentence preview, identical to the drawer
    and the /care/encounters preview dialog.

    When `expandedTerms.length > 0 && matchRationale.hitTerms.length > 0`,
    the row SHALL render an outlined chip row at the start of the
    `chips:` slot of `ReviewListCard`, with up to 4 hit terms,
    using the same chip token (`size="small"`, height 20, fontSize
    0.65rem, `variant="outlined"`) as the drawer's
    `encounter-card-match-rationale-chip`. The chips SHALL be
    exposed via stable `data-testid="candidate-row-match-rationale"`
    (container) and `data-testid="candidate-row-match-rationale-chip"`
    (per chip) for static verification, and the highlighted title
    SHALL use `data-testid="candidate-row-highlight"`.

    The change SHALL be additive: when the reviewer's query is
    blank, has no expanded terms, or no terms are found in the
    sentence, the row SHALL fall back to the existing plain-string
    title and the existing chip set with no behavioural difference.

  rationale: >
    The dry-run review queue is the third "encounter list with a
    search box" in the product. Today it does a server-side
    `toLower(c.text) CONTAINS toLower($search)` (see
    `libs/cypher/training_candidate_queries.py::GET_TRAINING_CANDIDATES_PAGE`)
    and shows the matched sentence as a plain truncated string.
    Reviewers move between /care/encounters, the /care/patients
    drawer, and /admin/training Candidates dozens of times a day,
    and they have asked for the "amber highlight + why-this-matched
    chip row" muscle memory to transfer across all three.

    The shared `encounterRelevance.ts` module is already pure
    TypeScript with no React imports (DI-LEO-AI-520 constraint), so
    we can wire it straight into the @leo/design-system
    `ReviewListCard` rows without a backend change. The server's
    cheap `CONTAINS` is left in place to do the page filtering;
    the client-side decoration just enriches what the page already
    fetched. A future slice can extend the Cypher to accept an array
    of expanded terms for full convergence; this slice closes the
    visual / vocabulary gap immediately.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          `CandidateReviewList` MUST import
          `computeMatchRationale`, `expandSearchTerms`, and
          `MatchRationale` from
          `@/components/mission-control/encounterRelevance` and
          `HighlightedText` + `collectHighlightTerms` from
          `@/components/mission-control/HighlightedText`.
      - type: "functional"
        spec: >
          `CandidateReviewList` MUST expose `search?: string` on
          its `Props` interface and MUST compute `expandedTerms`
          via `useMemo(() => expandSearchTerms(props.search), [props.search])`
          so the expansion runs once per query change rather than
          per row.
      - type: "functional"
        spec: >
          The `buildItem` helper MUST compute
          `matchRationale = computeMatchRationale(candidate.text, expandedTerms)`
          per row and MUST set the `ReviewListItem.title` to a
          `<HighlightedText>` element when
          `collectHighlightTerms(search, matchRationale.hitTerms)`
          is non-empty, otherwise the truncated string.
      - type: "functional"
        spec: >
          `renderChips` (or an equivalent `renderRationaleChips`
          helper) MUST render a container `<Box>` with
          `data-testid="candidate-row-match-rationale"` containing
          `matchRationale.hitTerms.slice(0, 4)` outlined `<Chip>`
          elements with
          `data-testid="candidate-row-match-rationale-chip"`,
          `variant="outlined"`, height 20, fontSize 0.65rem.
      - type: "functional"
        spec: >
          `GoldLabelReviewList` MUST mirror the same wiring for
          its `item.text` field so the Verified gold and Synthetic
          gold sub-tabs surface the same chips and highlights as
          the Candidates sub-tab.
      - type: "functional"
        spec: >
          `GoldDatasetPanel` MUST pass `search={debouncedSearch}`
          to both `<CandidateReviewList>` and `<GoldLabelReviewList>`
          so the chips reflect the query that actually drove the
          server fetch (not the in-flight character buffer).
    constraints:
      - type: "performance"
        spec: >
          The expansion MUST be memoised per panel render (not per
          row) so a 50-item page does not recompute the synonym
          map 50 times. The per-row rationale call is O(expanded *
          text length) and is cheap because `expandedTerms` is
          capped at 36 entries.
      - type: "safety"
        spec: >
          The chip taxonomy MUST NOT be misread as clinical
          findings or codes. Chips MUST stay strictly visual and
          MUST NOT change `markCandidateAsGold`, `requestDeleteCandidate`,
          `openCandidateLabelEditor`, or any other write path. The
          new helpers are pure and read-only.
    dependencies:
      - "DI-LEO-AI-099"
      - "DI-LEO-AI-145"
      - "DI-LEO-AI-514"
      - "DI-LEO-AI-520"
    downstream_impacts:
      - "CandidateReviewList renders highlighted titles + match rationale chips"
      - "GoldLabelReviewList renders highlighted titles + match rationale chips"
      - "GoldDatasetPanel passes debouncedSearch through to both review lists"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16 + @leo/design-system"
      file_structure:
        - "services/ui/src/components/gold-dataset/CandidateReviewList.tsx"
        - "services/ui/src/components/gold-dataset/GoldLabelReviewList.tsx"
        - "services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
      estimated_loc: 110

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-521 verifies the dry-run review-list rewire via
      static-source jest: prop surface, expandSearchTerms /
      computeMatchRationale wiring, HighlightedText title
      delegation, the new chip container + chip data-testids and
      4-chip cap, and the GoldDatasetPanel pass-through of
      debouncedSearch to both review lists.

  safety_class: "B"
  risks:
    - "R-LEO-AI-063"
    - "R-LEO-AI-174"
  tags:
    - "ui"
    - "training-data"
    - "search"
    - "consistency"
    - "design-system"
