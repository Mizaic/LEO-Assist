# -- VT-LEO-AI-215 -- /admin/console Evaluate stage inline editor mount
# IEC 62304 Verification Test

- id: "VT-LEO-AI-215"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-222"
    risks:
      - "R-LEO-AI-207"

  metadata:
    title: "EvaluateStage mounts the shared GoldLabelEditorDialog inline"
    description: >
      Static-source verification per ui-testing.mdc. Confirms that
      the /admin/console Evaluate stage opens dry-run rows in the
      shared dialog inline (no window.open, no router.push), wires
      the from-dry-run gold_label payload into the dialog target,
      mounts with saveMode='gold', and preserves the legacy
      /gold-dataset?labelId deep link for direct URLs.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/dry-run-open-gold-editor.test.tsx"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest harness (jest 30 + ts-jest)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-215-TC-001"
      case_name: "EvaluateStage imports IconButton + EditNoteIcon for the row pencil"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EvaluateStage.tsx"
          expected_result: "Imports include IconButton from @mui/material and EditNoteIcon from @mui/icons-material"
          verification_method: "automated"

    - case_id: "VT-215-TC-002"
      case_name: "Evaluate stage no longer opens the gold editor in a new tab"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search EvaluateStage.tsx for window.open and useRouter"
          expected_result: "No window.open call; no useRouter import; no 'new tab' aria-label variant"
          verification_method: "automated"

    - case_id: "VT-215-TC-003"
      case_name: "aria-label='Open in gold editor' appears on both row blocks"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Count occurrences of aria-label='Open in gold editor'"
          expected_result: "At least 2 occurrences (header and inline rows)"
          verification_method: "automated"

    - case_id: "VT-215-TC-004"
      case_name: "Click handler POSTs to from-dry-run and seeds the inline dialog target"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for the seed POST and target setter"
          expected_result: "Source contains /api/training/candidates/from-dry-run, data?.gold_label, and setGoldEditorTarget(goldLabel)"
          verification_method: "automated"

    - case_id: "VT-215-TC-005"
      case_name: "Shared GoldLabelEditorDialog is imported and mounted inline with saveMode='gold'"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for the import and the inline mount"
          expected_result: "Imports GoldLabelEditorDialog from @/components/gold-editor; mount carries saveMode='gold' and a stable key keyed on label_id"
          verification_method: "automated"

    - case_id: "VT-215-TC-006"
      case_name: "IconButton disabled guards in-flight clicks and empty text"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Inspect the disabled prop expression"
          expected_result: "disabled is true when text is empty or openingGoldEditor matches the row's encounter_id"
          verification_method: "automated"

    - case_id: "VT-215-TC-007"
      case_name: "Legacy /gold-dataset?labelId deep link is still supported"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx and the page wrapper"
          expected_result: "GoldDatasetPanel reads labelId from searchParams and uses handledDeepLinkRef; page wraps the panel in Suspense"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-215/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-215-EXEC-001"
      timestamp: "2026-04-18T17:40:00Z"
      executor: "Rob Smith (developer)"
      result: "pass"
      notes: "7 cases pass under jest 30 + ts-jest."
