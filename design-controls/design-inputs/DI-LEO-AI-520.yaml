# -- DI-LEO-AI-520 -- Drawer encounter search uses host vocabulary + match rationale chips
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-520"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-096"
  requirement: >
    The /care/patients side drawer encounter search SHALL use the
    same deterministic query understanding as the /care/encounters
    host search (see
    `services/analytics_api/app/services/encounter_query_understanding.py`).
    A new shared client module
    `services/ui/src/components/mission-control/encounterRelevance.ts`
    SHALL mirror the server's `_TYPO_MAP`, `_SYNONYM_MAP`,
    `_normalise_tokens`, `_expand_terms`, and
    `feature_match_rationale` so the drawer's in-memory filter and
    the host's server-side hybrid search read from the same
    vocabulary.

    The drawer's `applyCommonFilters` helper SHALL delegate to
    `expandSearchTerms()` instead of doing a bare substring match,
    so a query for "lump" also matches encounters that mention
    "mass", "swelling", or "nodule" (the configured synonym group),
    and a query for "breat" first auto-corrects to "breast" before
    expansion.

    When the reviewer's query expands to a non-empty term set AND
    `computeMatchRationale()` reports at least one hit term in an
    encounter's text, the drawer's `EncounterCard` SHALL render an
    outlined chip row in the card header with up to 4 hit terms,
    using the same chip token (size, height 20, fontSize 0.65rem,
    `variant="outlined"`) as the `match_rationale` chips on the
    /care/encounters row. The chips SHALL be exposed via a stable
    `data-testid="encounter-card-match-rationale-chip"` for static
    verification.

    The `<HighlightedText>` primitive SHALL receive the matched
    hit terms as its `rationale` argument so the amber highlight
    paints synonyms too (a query for "lump" highlights "mass"
    inside the encounter text). The minimum-token-length
    (MIN_HIGHLIGHT_LEN = 3) and longest-first sort rules SHALL
    remain unchanged.

  rationale: >
    The drawer's text search has been a naive case-insensitive
    `String.includes` since DO-LEO-AI-210. Reviewers using
    /care/encounters were getting smarter results because the host
    expands "lump" -> "lump", "mass", "swelling", "nodule" and
    surfaces a "why this matched" chip row, then they switched to
    the drawer for the same patient and got an empty list because
    the encounter happened to use "mass" in the note. Lifting the
    deterministic part of the server's query understanding to the
    client is cheap (a lookup table + a token loop), keeps the
    drawer's existing zero-network-hop search behaviour, and gives
    reviewers the same result set on both surfaces. The chips on
    the drawer cards close the explanation gap so the reviewer can
    see at a glance which synonyms hit.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          A new module
          `services/ui/src/components/mission-control/encounterRelevance.ts`
          MUST export `expandSearchTerms(query)`,
          `computeMatchRationale(text, expandedTerms)`, and
          `hasAnyExpandedHit(text, expandedTerms)` and MUST embed
          the same `TYPO_MAP` and `SYNONYM_MAP` entries as the
          server's `_TYPO_MAP` / `_SYNONYM_MAP`.
      - type: "functional"
        spec: >
          `expandSearchTerms` MUST return [] for blank or
          whitespace-only input, MUST drop tokens shorter than 2
          characters, MUST apply typo correction before synonym
          expansion (so "breat lums" returns the "breast" and
          "lump" synonym groups), MUST cap at 12 input tokens, and
          MUST cap the deduplicated output at 36 expanded terms.
      - type: "functional"
        spec: >
          `computeMatchRationale` MUST return
          `{ termHits: 0, hitTerms: [], termCoverage: 0 }` when the
          expanded-term list is empty or the encounter text is
          null/empty, MUST cap `hitTerms` at 8, and MUST compute
          `termCoverage` as `hits / max(1, expandedTerms.length)`.
      - type: "functional"
        spec: >
          `applyCommonFilters` MUST call `expandSearchTerms` and
          `hasAnyExpandedHit` instead of doing a bare
          `text.toLowerCase().includes(query.toLowerCase())` match
          so synonym hits keep encounters in the result set.
      - type: "functional"
        spec: >
          `EncounterCard` MUST compute `expandedTerms` and
          `matchRationale` via the new module, pass
          `matchRationale.hitTerms` into
          `collectHighlightTerms(search, hitTerms)`, and render an
          outlined chip row with `data-testid="encounter-card-match-rationale-chip"`
          when `expandedTerms.length > 0` and
          `matchRationale.hitTerms.length > 0`.
      - type: "functional"
        spec: >
          The chip row MUST render at most 4 hit terms (matching
          the host row's `row.match_rationale.slice(0, 4)` cap)
          and MUST be wrapped in a container with
          `data-testid="encounter-card-match-rationale"` so the
          static verification can assert presence + max count.
    constraints:
      - type: "performance"
        spec: >
          The new module MUST be pure, synchronous, and free of
          React imports so it can be reused by future surfaces
          (dry-run candidates, gold editor sentence search) without
          dragging in MUI or hooks.
      - type: "safety"
        spec: >
          The synonym expansion MUST NOT broaden coding behaviour
          -- it only affects which encounters appear in the drawer
          list and which terms are highlighted. Coded concept
          attachment, the gold-editor save path, and the recode
          flow MUST be unaffected.
    dependencies:
      - "DI-LEO-AI-099"
      - "DI-LEO-AI-213"
      - "DI-LEO-AI-514"
    downstream_impacts:
      - "encounterFilters.applyCommonFilters now delegates to expandSearchTerms"
      - "EncounterCard renders match rationale chips when query expands and hits"
      - "HighlightedText receives synonym hit terms so amber paints synonyms"
    technical_details:
      language: "TypeScript"
      framework: "React 18 + Next.js 16 + @leo/design-system"
      file_structure:
        - "services/ui/src/components/mission-control/encounterRelevance.ts"
        - "services/ui/src/components/mission-control/encounterFilters.ts"
        - "services/ui/src/components/mission-control/EncounterCard.tsx"
      estimated_loc: 130

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-519 verifies the new shared utility (typo +
      synonym expansion, match rationale shape, blank-query and
      cap behaviour), the `applyCommonFilters` rewire, and the
      drawer card chip row + highlight integration via static-
      source jest.

  safety_class: "B"
  risks:
    - "R-LEO-AI-063"
    - "R-LEO-AI-174"
  tags:
    - "ui"
    - "encounters"
    - "search"
    - "drawer"
    - "consistency"
