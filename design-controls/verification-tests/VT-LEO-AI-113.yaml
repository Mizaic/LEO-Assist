# -- VT-LEO-AI-113 -- Inclusive design tokens unit tests
# IEC 62304 Verification Test

- id: "VT-LEO-AI-113"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-118"]
    risks: ["R-LEO-AI-078"]

  metadata:
    title: "Design tokens expose typography, spacing, motion, focus, and contrast pairs that meet WCAG AA"
    description: >
      Verifies that the single token source of truth
      (services/ui/src/theme/tokens.ts) exports the six required
      token groups, that every exported CONTRAST_PAIR computes
      the required ratio for its role, that the FOCUS_RING meets
      size and contrast thresholds, and that the generated MUI
      theme exposes h1..h6 typography overrides at readable
      sizes.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/theme-tokens.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-113-TC-001"
      case_name: "tokens.ts exports the six required token groups"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "import * as tokens from '@/theme/tokens'"
          expected_result: "TYPE_SCALE, SPACING, RADIUS, MOTION, FOCUS_RING, CONTRAST_PAIRS are all defined"
      verification_method: "automated"
      acceptance_criteria:
        - "All six named exports are truthy objects"

    - case_id: "VT-113-TC-002"
      case_name: "every CONTRAST_PAIR meets its WCAG AA target"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "For each pair in CONTRAST_PAIRS compute contrast(fg, bg)"
          expected_result: "role='normal' >=4.5:1, role='large' or role='non-text' >=3:1"
      verification_method: "automated"
      acceptance_criteria:
        - "No pair fails its role threshold"

    - case_id: "VT-113-TC-003"
      case_name: "FOCUS_RING meets size and contrast requirements"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Check FOCUS_RING.widthPx >= 3 and contrast(FOCUS_RING.color, '#F8FAFC') >= 3"
          expected_result: "Both conditions hold"
      verification_method: "automated"
      acceptance_criteria:
        - "widthPx>=3 and contrast>=3:1"

    - case_id: "VT-113-TC-004"
      case_name: "theme typography overrides present with readable sizes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "import theme; assert typography.body1.fontSize >= 16px, h1 >= 32px, caption >= 13px"
          expected_result: "Sizes resolve to at least the required px"
      verification_method: "automated"
      acceptance_criteria:
        - "body1 >= 1rem (16px), caption >= 0.8125rem (13px)"

    - case_id: "VT-113-TC-005"
      case_name: "tokens.css emits custom properties under :root and reduced-motion blocks"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "readFileSync services/ui/src/theme/tokens.css"
          expected_result: "Contains :root {--leo-... } and @media (prefers-reduced-motion: reduce) { :root { --leo-motion-duration-fast: 0ms; }}"
      verification_method: "automated"
      acceptance_criteria:
        - "Both selectors present"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-113/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-113-EXEC-20260416"
      executed_at: "2026-04-16"
      executor: "ui-design-system-wave-a"
      environment: "development"
      command: "npx jest src/__tests__/theme-tokens.test.ts --no-coverage"
      result: "pass"
      cases_passed: 5
      cases_failed: 0
      notes: >
        All five test cases (TC-001 to TC-005) passed. After initial run
        the divider-on-default contrast pair was adjusted from #94a3b8 to
        #64748b to meet the 3:1 non-text threshold; this is reflected in
        services/ui/src/theme/tokens.ts.
