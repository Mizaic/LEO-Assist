  specification:
    title: "Shared HighlightedText primitive + ReviewListCard-based EncounterResultsTable"
    description: |
      Refactor of the /care/encounters surface that converges the
      encounter list with the dry-run Candidates list visual
      template (ReviewListCard tone strip + chip taxonomy) and
      consolidates the search-term highlight into a single
      <HighlightedText> primitive consumed by all three encounter
      surfaces (mission-control rows, the preview dialog, and the
      patient drawer).

      The implementation has three pieces:

        1. A new module
           `services/ui/src/components/mission-control/HighlightedText.tsx`
           that exports `HighlightedText` and `collectHighlightTerms`.
           Hits are rendered as
           `<Box component="mark" data-testid="encounter-highlight">`
           with the amber token `#fde68a`. Matching is case-
           insensitive, skips tokens shorter than 3 chars, and
           prefers longer overlapping terms.

        2. `EncounterResultsTable.tsx` rebuilt around
           `ReviewListCard` from `@leo/design-system`. Each row
           sets `tone`, `chips`, `meta`, `actions` per
           DI-LEO-AI-514. Selection (checkbox), pagination, and
           live-threshold drift banner are preserved.

        3. `EncounterSearchPanel.tsx` gets a clear (X)
           end-adornment IconButton. `EncounterMissionControl`
           passes the active query to the table so the empty
           state can echo it.

      `EncounterPreviewDialog` and `EncounterCard` are updated to
      import the shared primitive; the inline highlight code in
      the dialog is removed and `highlightSearchMatches` in
      `encounterTextUtils.tsx` delegates to the shared primitive
      (or is removed if no callers remain).
    acceptance_criteria:
      - criterion: "ReviewListCard rows replace MUI Table rows"
        type: "functional"
        measurement: "Test"
        target: "EncounterResultsTable.tsx imports ReviewListCard from @leo/design-system and contains no MUI <Table>/<TableRow> imports"
      - criterion: "Tone mapping"
        type: "functional"
        measurement: "Test"
        target: "Source contains a toneFor() helper that returns positive when coded_count >= 1, danger when status === 'failed', warning when matched and coded_count === 0, neutral otherwise"
      - criterion: "Chip slot composition"
        type: "functional"
        measurement: "Test"
        target: "Each row's chips slot composes: match-type chip, coded-count chip, status chip (when present), and up to 4 match_rationale chips"
      - criterion: "Clear button + query-echoing empty state"
        type: "functional"
        measurement: "Test"
        target: "EncounterSearchPanel renders a CloseIcon IconButton end-adornment when query is non-empty; encounter list renders 'Nothing matches \"<q>\". Try different words.' when query is non-empty and rows is empty"
      - criterion: "Single shared HighlightedText primitive"
        type: "functional"
        measurement: "Test"
        target: "HighlightedText.tsx exports HighlightedText and collectHighlightTerms; EncounterPreviewDialog, EncounterCard, and EncounterResultsTable all import from this module; bgcolor is '#fde68a'; MIN_HIGHLIGHT_LEN === 3; longest-first sort present"

