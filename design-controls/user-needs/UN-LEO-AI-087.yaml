# -- UN-LEO-AI-087 -- Authenticated users must reach the application reliably after sign-in
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-087"
  title: "After signing in I must reach the LEO application immediately and never see a stale loading spinner cached by Cloudflare or the Next.js Full Route Cache"
  description: |
    A clinical reviewer signs in to LEO from a workstation in clinic.
    The Azure AD round-trip succeeds, the leo_session cookie is set on
    the browser, and the user is redirected to /care/dashboard.

    On the live deployment in Azure Container Apps the user is then
    stuck looking at a spinning loader for as long as they keep the
    tab open. The OAuth flow itself is healthy - the underlying cause
    is that Next.js 16 prerenders /care/dashboard at build time when
    no session cookie is present, the AppShell renders only its
    "loading" branch into that prerender, Cloudflare caches the result
    with `Cache-Control: s-maxage=31536000`, and every authenticated
    visit thereafter is served the cached spinner HTML.

    The user need is that an authenticated visit MUST always render
    the authenticated shell on the very first paint. The application
    must not depend on a downstream client-side rehydration to swap a
    spinner for content. Cloudflare and the Next.js cache must never
    have an opportunity to stamp the loading state into a long-lived
    cached response.

  stakeholder: "Clinical reviewers, QA / RA lead, end users on every authenticated route"

  priority: "MUST"

  rationale: >
    Sign-in is the very first interaction between the clinician and
    the system. If the post-login experience is a permanent spinner
    the user cannot perform any clinical task at all - the platform
    is effectively offline for that user. ISO 14971 treats loss of
    availability of a SaMD that gates clinical decisions as a hazard
    in its own right because clinicians may bypass the tool and act
    on incomplete information instead.

  acceptance_criteria:
    - "After a successful sign-in the user lands on the destination route with the authenticated shell rendered on the first HTML response"
    - "No authenticated route is ever served from a static prerender or a long-lived cache"
    - "The /auth/login and /auth/callback redirect responses set Cache-Control: no-store so Cloudflare never caches the OAuth round-trip"
    - "The /auth/session response is never cached by the browser, the CDN, or the Next.js fetch cache"
    - "If core-api is briefly unreachable during SSR the layout still renders (the UI must not 5xx) and the client refetches on hydration"
    - "Once signed in, every backend service (analytics-api, fhir-api, terminology-api, training-worker, pipeline-worker, research-worker, model-inference) accepts the session forwarded by core-api so the user is never bounced back to /auth/login by an inter-service 401"

  design_inputs:
    - "DI-LEO-AI-218"
    - "DI-LEO-AI-229"

  metadata:
    identified_by: "Rob Smith - production debugging of post-login spinner on leo-ai-audit.healthcarecopilot.ai (April 2026)"
    identified_date: "2026-04-18"
    status: "approved"
    tags:
      - "auth"
      - "availability"
      - "deployment"
      - "safety-relevant"
