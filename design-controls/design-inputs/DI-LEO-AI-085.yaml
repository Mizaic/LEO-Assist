# -- DI-LEO-AI-085 -- Benign Cancer Pathway Closure Detection
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-085"
  type: "Functional"
  derived_from: ["UN-LEO-AI-052"]
  requirement: >
    The episode builder SHALL detect encounters coded with SNOMED concept
    395100000 (No evidence of cancer found) that occur AFTER the earliest
    referral date for an open cancer pathway episode AND within 365 days of
    that referral. When detected, the episode SHALL be closed with
    status='closed_benign' and end_date set to the benign closure encounter
    date. The 365-day window constraint is mandatory -- 395100000 coded
    beyond this window (e.g. from an unrelated clinical encounter) SHALL NOT
    close the episode. The system SHALL NOT create a benign closure without a
    prior referral anchor for the same patient. The domain registry SHALL
    include a 'no_cancer_discharge' subdomain with milestoneType='benign_closure'
    seeded into Neo4j as a FHIR ValueSet node linked to the cancer_audit
    AuditDomain via HAS_SUBDOMAIN. The registry fallback (from_defaults) SHALL
    also include this subdomain. Surface form aliases for common benign pathway
    discharge phrases (e.g. 'benign histology', 'benign on biopsy',
    'confirmed benign') and 2WW clinic shorthand variants (e.g. 'Seen in 2WW
    Clinic', 'Seen in 2WW Clinic?') SHALL be pinned to their correct SNOMED
    concepts via the terminology server.
  rationale: >
    Cancer investigation pathways that end with a benign histology result
    (e.g. biopsy showing no malignancy) should be closed as 'benign' rather
    than remaining 'in_progress'. Without this, population statistics overstate
    the number of open cancer investigations and undercount resolved pathways.
    The 365-day window prevents spurious closure of cancer episodes by
    unrelated 395100000 codings elsewhere in the patient record (e.g. a
    negative cervical smear coded after a breast 2WW). The referral requirement
    ensures that standalone 395100000 codings outside any cancer pathway do
    not generate or close episode nodes.

  machine_spec:
  acceptance_criteria:
    - type: "functional"
      spec: >
        Given a patient with a cancer pathway referral on date D and SNOMED
        395100000 coded on date D+180, the episode builder creates an
        EpisodeOfCare with status='closed_benign' and end_date=D+180.
    - type: "functional"
      spec: >
        Given a patient with a cancer referral on D and 395100000 coded on
        D+400 (beyond 365-day window), the episode remains status='in_progress'
        with end_date=null.
    - type: "functional"
      spec: >
        Given a patient with NO referral anchor and 395100000 coded, the
        episode builder creates NO EpisodeOfCare node.
    - type: "functional"
      spec: >
        Given a patient with a cancer referral and BOTH 395100000 (D+90)
        AND a confirmed cancer diagnosis (D+120), the episode SHALL be
        status='completed' (diagnosis takes precedence over benign closure).
    - type: "safety"
      spec: >
        The system SHALL NOT set status='closed_benign' when the DOCUMENTS
        relationship for 395100000 carries assertion != 'present'.
  constraints:
    - type: "safety"
      spec: "Window for benign closure is strictly <= 365 days from referral date."
    - type: "safety"
      spec: "Diagnosis (cancer confirmed) ALWAYS takes precedence over benign closure."
  dependencies: ["DI-LEO-AI-084", "DI-LEO-AI-010"]
  downstream_impacts:
    - "Episode status population statistics (open vs closed_benign)"
    - "Cancer pathway dashboard episode counts"
    - "Surface form pinning for 2WW clinic and benign discharge phrases"

  technical_details:
    language: "Python"
    framework: "neo4j, terminology-api"
    file_structure:
      - "services/analysis_worker/app/analyzers/episode_builder.py"
      - "services/analysis_worker/app/analyzers/anchor_detector.py"
      - "libs/domain_config/registry.py"
      - "scripts/investigations/_seed_no_cancer_discharge_valueset.py"
      - "scripts/investigations/_pin_2ww_clinic_aliases.py"
    estimated_loc: 150

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 5 acceptance criteria pass as automated pytest cases. The
      365-day window boundary and diagnosis-precedence cases are both covered.
    test_protocol: "VT-LEO-AI-085"

  safety_class: "B"
  risks: ["R-LEO-AI-059"]
  tags:
    - "episode-detector"
    - "cancer-pathway"
    - "benign-closure"
