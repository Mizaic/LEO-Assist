# -- VT-LEO-AI-521 -- Dry-run review-list highlighter + match rationale chips
# IEC 62304 Verification Test

- id: "VT-LEO-AI-521"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-523"
    risks:
      - "R-LEO-AI-063"
      - "R-LEO-AI-174"

  metadata:
    title: "CandidateReviewList + GoldLabelReviewList shared highlighter + match rationale chips"
    description: >
      Static-source verification per ui-testing.mdc. Confirms the
      /admin/training Candidates and Verified gold / Synthetic gold
      sub-tabs route their search query through the shared
      encounterRelevance.ts vocabulary (DI-LEO-AI-520), wrap each
      row title in <HighlightedText>, and render the same outlined
      "why this matched" chip row used by the /care/encounters host
      and the /care/patients drawer (DI-LEO-AI-520, VT-LEO-AI-519).
      Also confirms GoldDatasetPanel forwards debouncedSearch to
      both review lists.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/training-data-search-rationale-chrome.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest harness (jest 30 + ts-jest)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-521-TC-001"
      case_name: "CandidateReviewList wires the shared encounterRelevance utility"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/gold-dataset/CandidateReviewList.tsx"
          expected_result: "Source imports computeMatchRationale, expandSearchTerms, MatchRationale from @/components/mission-control/encounterRelevance and HighlightedText, collectHighlightTerms from @/components/mission-control/HighlightedText"
          verification_method: "automated"

    - case_id: "VT-521-TC-002"
      case_name: "CandidateReviewList exposes a search prop and memoises expandedTerms"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read CandidateReviewList.tsx"
          expected_result: "Source declares `search?: string` on its Props interface and computes `expandedTerms = useMemo(() => expandSearchTerms(props.search), [props.search])`"
          verification_method: "automated"

    - case_id: "VT-521-TC-003"
      case_name: "CandidateReviewList wraps the row title in HighlightedText"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read CandidateReviewList.tsx"
          expected_result: "Source per-row computes matchRationale = computeMatchRationale(candidate.text, expandedTerms), builds highlightTerms = collectHighlightTerms(search, matchRationale.hitTerms), and assigns ReviewListItem.title to a <HighlightedText> with testId='candidate-row-highlight' when highlightTerms.length > 0"
          verification_method: "automated"

    - case_id: "VT-521-TC-004"
      case_name: "CandidateReviewList renders the rationale chip row capped at 4"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read CandidateReviewList.tsx"
          expected_result: "Source has a renderRationaleChips helper that returns null when expandedTerms or hitTerms are empty, otherwise renders a Box with data-testid candidate-row-match-rationale containing rationale.hitTerms.slice(0, 4) outlined Chip elements with data-testid candidate-row-match-rationale-chip, height 20 and fontSize 0.65rem"
          verification_method: "automated"

    - case_id: "VT-521-TC-005"
      case_name: "GoldLabelReviewList mirrors the same wiring for verified / synthetic rows"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/gold-dataset/GoldLabelReviewList.tsx"
          expected_result: "Source imports the same shared helpers, exposes `search?: string` on Props, computes expandedTerms via useMemo, wraps the title in <HighlightedText> with the same testId, and renders the same rationale chip row helper using the candidate-row-match-rationale[-chip] testids"
          verification_method: "automated"

    - case_id: "VT-521-TC-006"
      case_name: "GoldDatasetPanel forwards debouncedSearch to both review lists"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/gold-dataset/GoldDatasetPanel.tsx"
          expected_result: "Source passes search={debouncedSearch} on both <CandidateReviewList ...> and <GoldLabelReviewList ...> usages"
          verification_method: "automated"

    - case_id: "VT-521-TC-007"
      case_name: "Rationale chip token matches the drawer (height 20, fontSize 0.65rem, outlined)"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read both review-list sources"
          expected_result: "Both files render the rationale chip with variant='outlined', sx height 20, fontSize 0.65rem so the dry-run row chips match the drawer's encounter-card-match-rationale-chip token byte-for-byte"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-521/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-521-EXEC-001"
      timestamp: "2026-04-19T13:05:00Z"
      executor: "Rob Smith (developer)"
      result: "pass"
      notes: >
        7 cases pass under jest 30 + ts-jest in 0.53s. Wider
        regression sweep across all training-data / gold-dataset /
        gold-label / encounter / drawer / mission-control suites:
        201 tests across 23 suites, all green. Confirms the
        dry-run row highlighter + match rationale chips do not
        regress the existing CandidateReviewList /
        GoldLabelReviewList row template (VT-LEO-AI-143), the
        drawer card chips (VT-LEO-AI-519), the host search row
        chips (VT-LEO-AI-512), or the encounter preview / timeline
        wrappers (VT-LEO-AI-214, VT-LEO-AI-515).
