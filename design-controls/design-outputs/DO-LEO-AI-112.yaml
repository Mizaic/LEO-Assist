# -- DO-LEO-AI-112 -- Consensus runner v2 (single + optional dual-model)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-112"
  version: "2.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-114"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-026", "R-LEO-AI-030"]
    verification_tests: ["VT-LEO-AI-114"]

  specification:
    title: "run_consensus: single-model default, optional dual-model consensus"
    description: |
      Rewrite of libs/llm_client/consensus.py that aligns the controlled
      design with the production implementation and adds a feature-flagged
      dual-model path. Default mode runs a single AWS Bedrock call with
      parse-retry; ``CONSENSUS_DUAL_MODEL=true`` enables AWS + Azure small
      parallel calls with a big-tier AWS arbitrator on disagreement.
    acceptance_criteria:
      - criterion: "single-model default"
        type: "functional"
        measurement: "Test"
        target: "exactly one AWS call per run_consensus in default mode (plus at most one parse-retry)"
      - criterion: "dual-model agreement short-circuits"
        type: "functional"
        measurement: "Test"
        target: "two small calls, no arbitrator when verdicts match"
      - criterion: "dual-model disagreement arbitration"
        type: "functional"
        measurement: "Test"
        target: "big-tier arbitrator called on disagreement; arbitrator_verdict populated"
      - criterion: "fail-safe"
        type: "safety"
        measurement: "Test"
        target: "all provider failures return fail_verdict; never empty/null"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/llm_client/consensus.py"
        description: "ConsensusResult dataclass, run_consensus entry point, _single_model/_dual_model helpers"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 300
      key_functions:
        - "run_consensus"
        - "_single_model"
        - "_dual_model"
        - "_safe_call"
        - "_dual_model_enabled"
        - "_consensus_aws_tier"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Fail-safe: any unrecoverable failure returns the caller-supplied fail_verdict."
      - "Arbitrator tier is always CONSENSUS_AWS_TIER regardless of single-model tier override."
    risk_control_measures:
      - "Parse-retry with strict-output reminder handles transient single-provider parse failures in default mode."
      - "Dual-model mode runs AWS + Azure concurrently and arbitrates big-tier on disagreement."

  verification_status:
    verification_method: "Test"
    verification_complete: false
