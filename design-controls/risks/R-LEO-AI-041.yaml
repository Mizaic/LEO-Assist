# -- R-LEO-AI-041 -- Knowledge Graph User Identity Leakage

- id: "R-LEO-AI-041"
  title: "SurfaceForm knowledge graph stores user identifiers"
  hazard:
    description: "created_by/approved_by fields expose operator identity in shared/exported KG artifacts."
    category: "data_corruption"
  hazardous_situation: "SurfaceForm and MAPS_TO nodes in the Knowledge Graph contain created_by and approved_by fields with operator email addresses. If the KG is exported, shared with research partners, or queried by a broader user base, operator identities are exposed."
  harm:
    description: "Personal data leakage for platform users and governance non-compliance."
    severity: "minor"
  initial_risk_estimate:
    severity: 2
    probability: 2
    detectability: 2
    rpn: 8
    risk_level: "low"
  mitigation_measures:
    - control_type: "design_feature"
      description: "Remove created_by/approved_by from SurfaceForm and MAPS_TO."
      implemented_by: ["DI-LEO-AI-055"]
      verified_by: ["VT-LEO-AI-055"]
    - control_type: "design_feature"
      description: "Store system-level provenance only."
      implemented_by: ["DI-LEO-AI-055"]
      verified_by: ["VT-LEO-AI-055"]
    - control_type: "procedural_control"
      description: "Record user-level audit in AuditEvent (clinical graph), not KG nodes."
      implemented_by: ["DI-LEO-AI-055"]
      verified_by: ["VT-LEO-AI-055"]
  residual_risk_estimate:
    severity: 2
    probability: 1
    detectability: 1
    rpn: 2
    risk_level: "low"
    acceptability: "acceptable"
    justification: "KG nodes store system-level provenance only; all user-level audit trails are confined to AuditEvent nodes in the clinical graph, preventing operator identity exposure in KG exports or shared datasets."
  monitoring:
    - metric: "kg_pii_field_scan"
      description: "Automated scan of SurfaceForm and MAPS_TO nodes for presence of email addresses or user-identifying fields."
      threshold: "== 0 findings"
      frequency: "quarterly"
    - metric: "audit_event_coverage"
      description: "Percentage of SurfaceForm create/approve actions with corresponding AuditEvent records."
      threshold: ">= 99%"
      frequency: "monthly"
  metadata:
    identified_by: "Design review -- GDPR training data"
    identified_date: "2026-02-15"
    status: "analyzed"
    tags: ["privacy", "user-identity", "knowledge-graph"]
