# -- UN-LEO-AI-045 -- Configuration Validation UI with Test Mode

- id: "UN-LEO-AI-045"
  title: "Platform administrators need a configuration validation UI with a test mode that allows them to validate pipeline and pathway configuration against a sample referral before activating it for a new tenant, so that misconfiguration is caught before it processes real patient referrals."
  description: |
    New tenant onboarding requires configuring pipelines, pathway criteria,
    SNOMED value sets, threshold values, and output formats. This configuration
    is currently done by editing YAML files and database queries directly.
    Misconfiguration is not detected until the first batch of referrals is
    processed, at which point wrong results are presented to clinical reviewers.
    Even though no result goes live without human approval, misconfigured
    output erodes clinical trust in the system and requires engineering time
    to diagnose and fix.

    Platform administrators need a UI-driven configuration workflow with built-in
    validation rules and a test mode that runs a sample referral through the
    configured pipeline and shows the output before the configuration is
    activated for real referrals.

  stakeholder:
    type: "internal_user"
    role: "Platform Administrator"
    organization: "LEO AI Engineering"

  priority: "SHOULD"

  rationale: |
    Misconfiguration is a known risk in multi-tenant platforms. The current
    absence of configuration validation forces reliance on manual review of
    YAML files and trust that thresholds are correctly set. A UI with validation
    and a test mode eliminates the most common misconfiguration errors at source
    and reduces onboarding time and engineering support burden. It also reduces
    the risk of a misconfigured pipeline eroding clinical trust with a new tenant
    at the critical early adoption phase.

  benefit: |
    Misconfiguration is detected before real referrals are processed. Onboarding
    time for new tenants is reduced. Engineering support burden for configuration
    errors is reduced. Clinical trust is not damaged by incorrect first-run outputs.
    Non-technical administrators can onboard tenants without requiring engineering
    assistance for straightforward configurations.

  use_case: |
    1. Platform administrator opens the tenant configuration UI for a new tenant.
    2. They configure pipeline steps, pathway criteria, and thresholds using
       dropdowns, sliders, and value set pickers -- not YAML files.
    3. Built-in validation runs inline: missing required fields are highlighted,
       threshold values outside acceptable ranges are flagged, value set references
       that do not exist are caught.
    4. When configuration is complete, administrator clicks "Run test."
    5. They upload or paste a sample referral (synthetic or de-identified).
    6. The pipeline runs in test mode and shows the complete output: coded
       findings, completeness assessment, guideline criteria evaluation, and
       draft triage recommendation.
    7. Administrator reviews the test output. If it looks correct, they click
       "Activate configuration." If not, they adjust and re-test.
    8. Activation is logged with the administrator's identity and timestamp.

  current_solution: |
    Configuration is done by direct YAML editing and database query modification.
    No validation UI. No test mode. Misconfiguration is discovered when real
    referrals are processed incorrectly.

  pain_points:
    - "Configuration requires editing YAML files -- not accessible to non-technical administrators"
    - "No validation of configuration before activation"
    - "Misconfiguration discovered only when real referrals produce wrong output"
    - "Engineering time is consumed diagnosing and fixing configuration errors"
    - "First-run misconfiguration damages clinical trust with new tenants"

  acceptance_criteria:
    - "All configuration fields are settable via UI controls -- no YAML editing required for standard configurations"
    - "Inline validation flags: missing required fields, out-of-range thresholds, invalid value set references"
    - "Test mode runs the complete configured pipeline against a provided sample input"
    - "Test output shows all pipeline stages: coding, completeness, guideline criteria, recommendation"
    - "Configuration cannot be activated without passing all inline validation rules"
    - "Activation is logged with administrator identity and full configuration snapshot"

  success_metrics:
    - metric: "Misconfiguration incidents discovered post-activation"
      target: "Zero for configurations validated through test mode"
      baseline: "Multiple per new tenant onboarding currently"
    - metric: "New tenant onboarding time"
      target: "Reduction from estimated 2 days to under 4 hours for standard configurations"
      baseline: "Estimated 2 days including engineering support"

  regulatory_impact: "low"
  safety_impact: "medium"
  safety_class: "B"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "IEC 62304:2006/AMD1:2015 Class B software lifecycle"

  related_standards:
    - "IEC 62304:2006/AMD1:2015"

