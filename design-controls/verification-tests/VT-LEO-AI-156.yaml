# -- VT-LEO-AI-156 -- Spancat suggester capacity inspection
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-156"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-158"]
    risks: ["R-LEO-AI-161"]

  metadata:
    title: "Spancat suggester max_size raised from 10 to 24"
    description: >
      Verifies that the canonical training config used by the
      training_worker sets the spancat ngram_range_suggester
      max_size to a value >= 24, so the spancat model can natively
      propose, score, and learn the long observable spans seen on
      UK primary-care lab lines (typically 18-22 tokens).
    test_level: "inspection"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_training_config_spancat_suggester.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/training_worker/app/config/base.cfg exists in the repo"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-156-TC-001"
      case_name: "test_spancat_suggester_max_size_is_at_least_24"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Parse services/training_worker/app/config/base.cfg and read [components.spancat.suggester].max_size"
          expected_result: "max_size is an integer >= 24"
          verification_method: "automated"
      acceptance_criteria:
        - "max_size is parseable as int and is >= 24"

    - case_id: "VT-156-TC-002"
      case_name: "test_spancat_suggester_min_size_is_one"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Parse the config and read [components.spancat.suggester].min_size"
          expected_result: "min_size == 1 so single-token spans are still suggested"
          verification_method: "automated"
      acceptance_criteria:
        - "min_size is exactly 1"

    - case_id: "VT-156-TC-003"
      case_name: "test_spancat_suggester_max_size_is_capped_at_32"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Parse the config and assert max_size <= 32"
          expected_result: "Per DI-LEO-AI-158 constraint, values above 32 require a separate performance review"
          verification_method: "automated"
      acceptance_criteria:
        - "max_size is <= 32"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-156/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-17T00:00:00Z"
      executed_by: "Rob Smith"
      runner: "pytest 8.x via .venv/bin/python"
      command: "pytest tests/test_training_config_spancat_suggester.py -v"
      result: "pass"
      tests_passed: 3
      tests_failed: 0
      notes: "Inspection of services/training_worker/app/config/base.cfg confirms max_size = 24."
