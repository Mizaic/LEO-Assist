# -- UN-LEO-AI-069 -- Role-first interaction design
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-069"
  title: "LEO presents each user the slimmest viable experience for their role so clinicians, staff, QA/RA leads, and platform admins are not slowed down by screens meant for someone else"
  description: |
    LEO serves four very different working lives from the same app:
    a clinician opening a patient record between appointments, a
    coding or audit staff member working a queue of tasks, a
    QA/RA lead investigating the product's own behaviour, and a
    platform admin looking after tenants and users. Today the nav
    shows the same long list to everyone. Junior staff and older
    clinicians in particular tell us the app "feels like it is for
    someone else" and that the extra choice slows them down.

    The user need: on first sign-in the user picks a role once. After
    that, the app lands them on the right home screen, shows a short
    nav for their role, and tucks the rest behind a single "Advanced"
    tray. A user with more than one role (for example, a clinician who
    also leads the audit) can switch from a clearly labelled switcher
    in the top right. Switching role never hides clinical data; it
    only changes emphasis and layout.

    This is inclusive-design led. Fewer items up front means less
    cognitive load for older or junior users. A clear "Switch role"
    control keeps control in the user's hands.

  stakeholder: "Clinician, staff, qa_ra_lead, platform_admin"

  priority: "high"

  rationale: >
    A role-first layout applies Hick's Law (fewer visible choices =
    faster decisions) and addresses direct feedback from junior staff
    and older clinicians that the current product feels generic and
    slow to navigate. It keeps us aligned with ISO 14971 (reducing
    cognitive error) and IEC 62304 Class B usability obligations.

  acceptance_criteria:
    - "First sign-in with no selected_role shows a role picker before any other content"
    - "After picking a role the user lands on the default home screen for that role"
    - "Left nav shows only items in the role's primary set; the rest live in the Advanced tray"
    - "A multi-role user sees a 'Switch role' control in the app shell"
    - "Switching role writes a (:RoleSwitch) audit node in Neo4j"
    - "Role never gates clinical data; all data-level permissions remain on the API"

