# -- DI-LEO-AI-113 -- LLM self-rated assertion as parity signal (supersedes DI-103)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-113"
  type: "Safety"
  derived_from: ["UN-LEO-AI-002"]
  requirement: >
    The LLM extractor SHALL emit an assertion value for each extracted
    entity drawn from the controlled vocabulary {present, absent, refuted,
    possible, historical, planned, hypothetical, family, declined,
    cancelled}. The deterministic post-processing stack (scope guard,
    referral-procedure guard, double-negation situation guard, ConText
    assertion detection, disorder gate) SHALL remain the AUTHORITATIVE
    source for the final assertion written on each entity. The LLM's
    emitted assertion SHALL be retained as ``_extractor_assertion`` for a
    parity check (DI-LEO-AI-115) and SHALL NOT be used directly by the
    tier classifier or terminology resolver.
  rationale: >
    DI-LEO-AI-103 previously forbade the LLM from emitting any assertion
    on the grounds that a wrong LLM assertion could not be repaired by
    ConText (ConText only runs on entities still at ``present``). This DI
    retains that safety property -- ConText remains authoritative -- while
    adding a second, independent signal we can compare against the
    deterministic stack. When the two disagree, the parity check (DI-115)
    holds the entity at tier 2 for human review rather than auto-coding,
    which catches ConText failures (e.g. missing negation cue patterns)
    that would otherwise be silent. Retaining two independent signals is
    strictly more conservative than a single-source assertion.

    Supersedes DI-LEO-AI-103 (revision 2.0, April 2026). DI-103 is marked
    superseded; its constraint "LLM output field 'assertion' MUST be
    ignored during parsing" is replaced by the rule "LLM assertion is
    retained as _extractor_assertion but is NOT written to the final
    assertion field".

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          LLM extractor parsers (libs/pipeline_graph/subgraphs/_extractor.py
          and services/coding_worker/app/pipeline/llm_extractor.py) MUST
          parse the LLM's assertion into the ExtractionItem/ExtractedTerm
          assertion field, defaulting to "present" only when absent or
          invalid.
      - type: "safety"
        spec: >
          After the post-processing stack has run, the entity's final
          ``assertion`` field SHALL reflect the deterministic layer output,
          not the raw LLM value. The LLM value is retained as
          ``_extractor_assertion`` for the parity check only.
      - type: "functional"
        spec: >
          The extraction prompt (libs/prompts/extraction_v1.py) MUST instruct
          the LLM to emit an assertion drawn from the controlled vocabulary,
          with rules for negation, refuted, possible, historical, planned,
          hypothetical, family, declined, and cancelled.
      - type: "functional"
        spec: >
          Unknown or missing assertion values MUST fall back to "present"
          (consistent with pre-change behaviour).
    constraints:
      - type: "safety"
        spec: >
          ConText and scope guard MUST remain the authoritative source for
          non-present assertions in the final entity dict. Any direct use
          of _extractor_assertion as the final assertion is a safety bug.
      - type: "safety"
        spec: >
          Disagreements between LLM assertion and post-processing assertion
          MUST flow through the parity check (DI-LEO-AI-115) and block
          tier-1 auto-coding until a human confirms.
    dependencies: ["DI-LEO-AI-005", "DI-LEO-AI-115"]
    downstream_impacts:
      - "libs/pipeline/post_processing.py (parity snapshot)"
      - "libs/coding_engine/tier_classifier.py (consumes parity flag)"
    technical_details:
      language: "Python"
      framework: "N/A"
      file_structure:
        - "libs/prompts/extraction_v1.py"
        - "services/coding_worker/app/pipeline/llm_extractor.py"
        - "libs/pipeline_graph/subgraphs/_extractor.py"
      estimated_loc: 80

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-113 cases pass: LLM assertion parsing across all
      controlled values, default-to-present fallback, ConText authority
      retained for negated/family/hypothetical entities.
    test_protocol: "VT-LEO-AI-113"

  safety_class: "B"
  risks: ["R-LEO-AI-003"]
  tags:
    - "llm-extraction"
    - "assertion"
    - "context-detection"
    - "safety-gate"
