- id: "DO-LEO-AI-004"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-006"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-011", "R-LEO-AI-014", "R-LEO-AI-016"]
    verification_tests: ["VT-LEO-AI-004"]
    validation_tests: []

  specification:
    title: "LLM Disambiguation Module"
    description: |
      Uses large language model calls to disambiguate clinical entities where
      the NLP pipeline produces multiple candidate interpretations. Sends
      structured prompts with clinical context to an LLM and parses the
      response to select the most appropriate SNOMED mapping. All LLM
      decisions are logged for audit and human review.
    purpose: "Resolve ambiguous clinical entity extractions that cannot be confidently mapped by rule-based methods alone"
    technical_approach: "Structured prompt engineering with versioned prompt templates, LLM client factory for provider abstraction, and deterministic response parsing"
    acceptance_criteria:
      - criterion: "Disambiguation accuracy on ambiguous cases"
        type: "functional"
        measurement: "Accuracy against manually reviewed ambiguous entity set"
        target: ">= 0.80 accuracy"
      - criterion: "All LLM decisions are auditable"
        type: "safety"
        measurement: "Audit log completeness check"
        target: "100% of LLM calls logged with prompt, response, and decision"
      - criterion: "Graceful fallback when LLM is unavailable"
        type: "functional"
        measurement: "Integration test with LLM service down"
        target: "System continues with lower-confidence flag, no crash"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/coding_worker/app/pipeline/llm_extractor.py"
        description: "LLM-based entity disambiguation extractor"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/llm_client/factory.py"
        description: "Factory for creating LLM client instances across providers"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/prompts/disambiguation_v1.py"
        description: "Versioned prompt templates for disambiguation"
        storage_location: "git"
    technical_details:
      language: ["Python 3.11"]
      framework: []

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions: ["LLM response validation", "Audit logging of decisions"]

  verification_status:
    verification_method: "Test"
    verification_complete: false

  production_information:
    deployment_instructions: "Deployed as part of the coding-worker container via Azure Container Apps"

  documentation:
    design_documentation: []
    inline_documentation:
      follows_standards: true

  approval:
    created_by: "Engineering Team"
    created_date: "2026-03-01"

  version_history:
