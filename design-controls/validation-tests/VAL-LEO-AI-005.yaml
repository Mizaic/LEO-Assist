# -- VAL-LEO-AI-005 -- Clinical Interpretation Validation
# IEC 62304 Validation Test Protocol
# Schema: design-controls/templates/validation_test_schema.yaml

- id: "VAL-LEO-AI-005"
  version: "1.0"
  status: "draft"

  traceability:
    user_needs:
      - "UN-LEO-AI-009"
    design_inputs:
      - "DI-LEO-AI-014"
    risks:
      - "R-LEO-AI-011"
      - "R-LEO-AI-014"
    verification_tests:
      - "VT-LEO-AI-004"

  metadata:
    title: "Clinical Interpretation Validation"
    validation_phase: "alpha"
    test_type: "user_acceptance"
    automation_level: "manual"
    participants:
      user_type: "internal_qa"
      count: 5
      selection_criteria: "Mix of QA staff with clinical audit backgrounds and QA staff without clinical backgrounds (for readability assessment)"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_name: "staging"
    prerequisites:
      - "All linked verification tests (VT-LEO-AI-004) have passed"
      - "Staging environment deployed with interpretation generation service"
      - "Pre-generated interpretations available for >= 20 patient pathways of varying complexity"
      - "Gold-standard expert-written interpretations available for comparison"
      - "Readability analysis tooling available (Flesch-Kincaid scoring)"
    infrastructure: "Azure Container Apps staging environment with interpretation service, Azure OpenAI, and core API"

  user_scenarios:
    - scenario_id: "SCENARIO-001"
      scenario_name: "Clinical audit team reviews LLM-generated interpretation of a complex pathway"
      user_role: "Clinical Audit Team Member"
      user_goal: "Review an LLM-generated clinical interpretation for accuracy, completeness, and absence of diagnostic or treatment recommendations"
      preconditions:
        - "Interpretations generated for >= 10 complex patient pathways (multiple encounters, anchors, and episodes)"
        - "Each interpretation has a paired expert-written reference"
        - "Reviewer has access to the underlying patient data for cross-reference"
      steps:
        - step_number: 1
          action: "Open a patient pathway and read the LLM-generated interpretation"
          expected_result: "Interpretation is displayed alongside the patient timeline and coded data"
          success_criteria: "Interpretation is visible and formatted in readable paragraphs"
        - step_number: 2
          action: "Check the interpretation for factual accuracy against the patient data"
          expected_result: "Interpretation accurately reflects the coded encounters, anchors, and episode structure"
          success_criteria: "No factual errors identified -- all stated dates, codes, and sequences match the source data"
        - step_number: 3
          action: "Check the interpretation for completeness against the expert-written reference"
          expected_result: "Interpretation covers all clinically significant events in the pathway"
          success_criteria: "No material omissions compared to the expert reference"
        - step_number: 4
          action: "Check the interpretation for absence of diagnostic or treatment recommendations"
          expected_result: "Interpretation describes what happened without recommending what should happen next"
          success_criteria: "No sentences contain diagnostic conclusions or treatment suggestions"
        - step_number: 5
          action: "Record an accept/reject decision with comments"
          expected_result: "Decision and comments are stored for analysis"
          success_criteria: "Decision persists and is linked to the specific interpretation version"
      postconditions:
        - "All reviewed interpretations have an accept/reject decision with comments"
        - "Review decisions stored with reviewer ID and timestamp"
      success_metrics:
        - metric: "Reviewer acceptance rate"
          target: ">= 75% of interpretations accepted by reviewers"
          measurement_method: "Count accepted interpretations divided by total reviewed"
        - metric: "Factual accuracy"
          target: "Zero factual errors in accepted interpretations"
          measurement_method: "Reviewer cross-reference against source patient data"
        - metric: "Safety compliance"
          target: "Zero interpretations contain diagnostic or treatment recommendations"
          measurement_method: "Reviewer check for recommendation language in every interpretation"
      evidence_to_capture:
        - "Per-interpretation accept/reject decision with reviewer comments"
        - "Factual error log (if any)"
        - "Recommendation language instances (if any)"
        - "Screenshots of interpretation review interface"

    - scenario_id: "SCENARIO-002"
      scenario_name: "Non-specialist reviews interpretation for readability"
      user_role: "Non-Clinical QA Reviewer"
      user_goal: "Assess whether LLM-generated interpretations are readable by someone without a clinical background"
      preconditions:
        - "Interpretations generated for >= 10 patient pathways"
        - "Reviewer does not have a clinical coding or medical background"
        - "Flesch-Kincaid scoring tool available"
      steps:
        - step_number: 1
          action: "Read an LLM-generated interpretation without referring to the underlying clinical data"
          expected_result: "Interpretation is understandable to a non-specialist reader"
          success_criteria: "Reader can summarise the key points of the pathway in their own words"
        - step_number: 2
          action: "Identify any medical terms that are not explained in plain language"
          expected_result: "All medical terms are accompanied by a plain-language explanation on first use"
          success_criteria: "No unexplained jargon -- every clinical term has a bracketed plain-English equivalent"
        - step_number: 3
          action: "Run Flesch-Kincaid readability analysis on the interpretation text"
          expected_result: "Readability score is calculated"
          success_criteria: "Flesch-Kincaid grade level <= 6"
        - step_number: 4
          action: "Rate overall readability on a 5-point scale and provide comments"
          expected_result: "Rating and comments are recorded"
          success_criteria: "Rating form is completed for each reviewed interpretation"
      postconditions:
        - "All reviewed interpretations have readability scores and reviewer ratings"
      success_metrics:
        - metric: "Flesch-Kincaid grade level"
          target: "<= 6 (age 11 reading level)"
          measurement_method: "Automated Flesch-Kincaid analysis of interpretation text"
        - metric: "Non-specialist comprehension"
          target: ">= 80% of reviewers can accurately summarise the pathway"
          measurement_method: "Compare reviewer summaries against source data for accuracy"
        - metric: "Jargon-free compliance"
          target: "100% of clinical terms have plain-language explanations"
          measurement_method: "Reviewer identification of unexplained medical terms"
      evidence_to_capture:
        - "Flesch-Kincaid scores per interpretation"
        - "Non-specialist readability ratings and comments"
        - "List of unexplained medical terms (if any)"
        - "Reviewer plain-language summaries for comprehension assessment"

  acceptance_criteria:
    - criterion: "Reviewer acceptance rate"
      target: ">= 75% of interpretations accepted by clinical reviewers"
      measurement_method: "Count accepted interpretations divided by total reviewed across all participants"
    - criterion: "Readability"
      target: "Flesch-Kincaid grade level <= 6 for all interpretations"
      measurement_method: "Automated Flesch-Kincaid analysis of every generated interpretation"
    - criterion: "Safety -- no diagnostic or treatment recommendations"
      target: "Zero interpretations contain diagnostic or treatment recommendations"
      measurement_method: "Clinical reviewer check of every interpretation for recommendation language"

  user_feedback:
    feedback_methods: ["survey", "observation"]
    usability_metrics:
      task_completion_target: ">=90%"
      time_on_task_target: "<= 5 minutes per interpretation review (clinical); <= 3 minutes per readability review"

  evidence_bundle:
    bundle_id: "VAL-005-EXEC-ALPHA-placeholder"
    blob_path: "/evidence-bundles/LEO-AI/validation/VAL-LEO-AI-005/"
    artifacts:
      - type: "user_acceptance_results"
        description: "Per-interpretation accept/reject decisions with reviewer comments"
      - type: "user_feedback_transcripts"
        description: "Non-specialist readability ratings and comprehension summaries"
      - type: "analytics_data"
        description: "Flesch-Kincaid readability scores for all reviewed interpretations"
    immutability: true

  execution_history: []
