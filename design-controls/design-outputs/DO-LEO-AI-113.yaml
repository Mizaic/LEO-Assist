# -- DO-LEO-AI-113 -- Tier classifier v2 + assertion parity snapshot
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-113"
  version: "2.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-115", "DI-LEO-AI-113"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-026"]
    verification_tests: ["VT-LEO-AI-113"]

  specification:
    title: "Per-semantic-tag tier thresholds, extractor confidence fusion, and assertion parity gating"
    description: |
      Updates to the three-tier decision engine and post-processing stack:

      - classify_tier accepts semantic_tag, extractor_confidence, and
        assertion_parity_failed and uses a per-tag thresholds table
        (disorder 0.92, finding/situation 0.93, procedure 0.94,
        substance/product/observable 0.96-0.97; default 0.95).
      - effective_score = min(terminology_score, extractor_confidence)
        with a hard floor (0.80) below which tier-1 is blocked with reason
        ``low_extractor_confidence``.
      - A new assertion_parity snapshot in post_processing records the
        LLM's original assertion before the deterministic layers run, and
        compares it against the final assertion after the stack
        completes. Disagreements set ``assertion_parity_failed=True``,
        which caps the tier gate at tier 2 with reason ``assertion_parity``.
      - tier_classify subgraph passes all three new arguments through to
        classify_tier.

    acceptance_criteria:
      - criterion: "per-tag thresholds"
        type: "functional"
        measurement: "Test"
        target: "disorder auto-codes at 0.93; substance requires 0.96"
      - criterion: "confidence fusion"
        type: "functional"
        measurement: "Test"
        target: "min(terminology, extractor_conf) gates tier-1; floor blocks low extractor confidence"
      - criterion: "parity gate"
        type: "safety"
        measurement: "Test"
        target: "LLM-vs-ConText disagreement caps at tier 2 with reason assertion_parity"
      - criterion: "gate_failed honoured"
        type: "safety"
        measurement: "Test"
        target: "disorder_verdict=gate_failed -> tier 3"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/coding_engine/tier_classifier.py"
        description: "classify_tier with per-tag thresholds, confidence fusion, parity gate"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline_graph/subgraphs/tier_classify.py"
        description: "Subgraph wiring of new classifier arguments"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "_snapshot_extractor_assertions and _apply_assertion_parity_check"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 200
      key_functions:
        - "classify_tier"
        - "_thresholds_for"
        - "_effective_score"
        - "_snapshot_extractor_assertions"
        - "_apply_assertion_parity_check"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Tier-1 gate -- only high-trust entities auto-code."
      - "Tier-3 gates evaluated before Tier-1 (priority preserved)."
      - "assertion_parity_failed and gate_failed are Tier-1 blockers."
    risk_control_measures:
      - "Per-tag calibration raises bar for high-impact tags (substance, product)."
      - "Extractor confidence floor prevents weak NER signals from auto-coding."
      - "Parity check surfaces LLM / ConText disagreements for human review."

  verification_status:
    verification_method: "Test"
    verification_complete: false
