# -- R-LEO-AI-089 -- Wrong-role UI hides a critical task
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-089"
  title: "Role-scoped navigation hides a task the user needs to act on"

  hazard:
    description: >
      A user is logged in under one role (for example clinician) while
      a task they need to act on lives in a different role's default
      view (for example a safety alert assigned to the staff queue).
      The role-scoped navigation demotes that task into the Advanced
      tray, and the user never notices it.
    category: "clinical_safety"

  hazardous_situation: >
    A clinician who also covers audit work signs in, picks the
    clinician role, and misses a safety alert assigned to them in
    the staff /work queue because /work is not in the clinician's
    primary nav.

  harm:
    description: >
      A safety-netting action is delayed, potentially delaying a
      patient's investigation or follow-up.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        RoleSwitcher is always visible in the app shell for multi-role
        users, so switching to the staff inbox is one click away.
      implemented_by: ["DI-LEO-AI-133"]
      verified_by: ["VT-LEO-AI-129"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The Advanced tray surfaces a live count of pending items in
        each demoted area (safety alerts, coding queue, etc.) so the
        user sees there is work waiting even if the landing page is
        clinician-focused.
      implemented_by: ["DI-LEO-AI-133"]
      verified_by: ["VT-LEO-AI-129"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Role only changes UI emphasis. API-level task assignment and
        notifications (email, in-app banner) still fire regardless of
        selected_role.
      implemented_by: ["DI-LEO-AI-129"]
      verified_by: ["VT-LEO-AI-125"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Notifications are role-agnostic and the RoleSwitcher is always
      reachable, so a multi-role user cannot be trapped inside the
      wrong view without a visible escape hatch.

  monitoring:
    monitoring_plan: >
      Quarterly audit of unactioned safety alerts vs role switches in
      the same session. Investigate any pattern where a multi-role
      user misses an alert assigned to a non-active role.
    metrics:
      - "unactioned_safety_alerts_by_role_switch_rate"
      - "advanced_tray_interaction_rate"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "Wave D role-first design review"
    identified_date: "2026-04-16"
    status: "analyzed"
    tags:
      - "role-first"
      - "safety-netting"
