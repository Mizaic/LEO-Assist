# -- R-LEO-AI-019 -- SNOMED Terminology Update Breaks Resolver
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-019"
  title: "SNOMED CT terminology update introduces new concepts or changed relationships that break resolution"

  hazard:
    description: "UK SNOMED CT Clinical Edition update adds, retires, or restructures concepts used by the terminology resolver"
    category: "integration_failure"

  hazardous_situation: "Updated SNOMED CT content causes the terminology resolver to return incorrect results, fail to resolve known terms, or match to retired concepts"

  harm:
    description: "Degraded coding accuracy until terminology configuration is updated"
    severity: "minor"

  initial_risk_estimate:
    severity: 2
    probability: 3
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "Terminology version tracked in system configuration"
      implemented_by: ["DI-LEO-AI-004", "DI-LEO-AI-033", "DI-LEO-AI-034"]
      verified_by: ["VT-LEO-AI-003", "VT-LEO-AI-016"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: "Regression tests run against value sets on terminology update"
      implemented_by: ["DI-LEO-AI-004", "DI-LEO-AI-033", "DI-LEO-AI-034"]
      verified_by: ["VT-LEO-AI-003", "VT-LEO-AI-016"]
      effectiveness: "highly_effective"
    - control_type: "procedural_control"
      description: "Terminology update procedure includes validation before deployment"
      implemented_by: ["DI-LEO-AI-004", "DI-LEO-AI-033", "DI-LEO-AI-034"]
      verified_by: ["VT-LEO-AI-003", "VT-LEO-AI-016"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 2
    probability: 2
    detectability: 1
    rpn: 4
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Terminology updates are planned and tested. Regression tests validate value set resolution before deployment. Version tracking enables rollback if issues detected."

  monitoring:
    monitoring_plan: "Validate value set resolution accuracy and track retired concept usage after each SNOMED release"
    metrics: ["Value set resolution accuracy post-update", "Retired concept hit rate"]
    review_frequency: "Per SNOMED release (biannual)"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["soup", "snomed-ct", "terminology", "integration"]
