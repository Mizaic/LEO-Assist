- id: "VT-LEO-AI-096"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-096"]
    risks: ["R-LEO-AI-015"]

  metadata:
    title: "NER-first extraction routing and deterministic pre-filter verification"
    description: >
      Verifies non-evidence sentence filtering, model provider integration with
      model-inference service contract, and extraction_method NER routing behavior.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_sentence_splitter.py"
      - "tests/test_model_provider.py"
      - "tests/test_extraction_subgraph_routing.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-096-TC-001"
      case_name: "Non-evidence and header filters remove template noise"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run sentence splitter helper tests with representative header and template lines"
          expected_result: "is_non_evidence_line returns true for noise and false for clinical milestone lines"
      verification_method: "automated"
      acceptance_criteria:
        - "Fast-track milestone phrases are preserved"
        - "Known non-evidence template patterns are filtered"

    - case_id: "VT-096-TC-002"
      case_name: "Model provider maps /extract payload to ExtractionItem"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock model-inference /extract response and call extract_batch"
          expected_result: "Provider returns canonical ExtractionItem list with model provenance"
      verification_method: "automated"
      acceptance_criteria:
        - "MODEL_INFERENCE_HEALTH_URL default is localhost:8004/health"
        - "semantic_tag mapping is canonical SNOMED tag"

    - case_id: "VT-096-TC-003"
      case_name: "Extraction subgraph uses model path when extraction_method=ner"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Invoke extraction subgraph with extraction_method ner using mocked provider"
          expected_result: "Model provider path is called and entities are returned"
      verification_method: "automated"
      acceptance_criteria:
        - "No LLM call is required for NER extraction path"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-096/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
- id: "VT-LEO-AI-096"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-055"]
    risks: ["R-LEO-AI-039", "R-LEO-AI-040"]

  metadata:
    title: "TrainingCandidate cascade delete removes linked KG artifacts"
    description: >
      Verifies that deleting a TrainingCandidate from the admin gold dataset API
      removes linked GoldLabel and SurfaceFormTask artifacts, and that manual
      duplicate-candidate controls support preview and apply operations.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/api/tests/test_training_candidate_delete.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-096-TC-001"
      case_name: "Delete returns candidate and artifact counts"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call DELETE /training/candidates/{candidate_id} for existing candidate"
          expected_result: "Returns 200 with candidate_id, gold_labels_deleted, and surface_form_tasks_deleted"
      verification_method: "automated"
      acceptance_criteria:
        - "HTTP status is 200 and response includes deletion counts"
    - case_id: "VT-096-TC-002"
      case_name: "Delete returns 404 for missing candidate"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call DELETE /training/candidates/{candidate_id} for unknown candidate"
          expected_result: "Returns 404 not found and no deletion payload"
      verification_method: "automated"
      acceptance_criteria:
        - "HTTP status is 404 for missing candidate"
    - case_id: "VT-096-TC-003"
      case_name: "Dedupe preview groups highly similar candidates"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call POST /training/candidates/dedupe/preview with completed status and threshold"
          expected_result: "Returns candidate_pool_size, duplicate_count, and grouped canonical/duplicate candidate payloads"
      verification_method: "automated"
      acceptance_criteria:
        - "HTTP status is 200 and duplicate group count is non-zero for similar records"
    - case_id: "VT-096-TC-004"
      case_name: "Dedupe apply marks duplicates"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call POST /training/candidates/dedupe/apply with same criteria as preview"
          expected_result: "Returns duplicates_marked > 0 and a dedupe run_id"
      verification_method: "automated"
      acceptance_criteria:
        - "HTTP status is 200 and response includes duplicates_marked and run_id"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-096/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-096-RUN-001"
      date: "2026-04-11"
      executor: "automated (pytest)"
      environment: "development"
      result: "pass"
      passed_cases: 2
      failed_cases: 0
      notes: >
        Executed services/api/tests/test_training_candidate_delete.py. Both
        critical cases passed: delete success with cascade counts and 404 for
        unknown candidate ID.
    - run_id: "VT-096-RUN-002"
      date: "2026-04-12"
      executor: "automated (pytest)"
      environment: "development"
      result: "pass"
