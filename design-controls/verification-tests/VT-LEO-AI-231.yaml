# -- VT-LEO-AI-231 -- SummarisationContext enum + select primitive
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-231"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-231"]
    risks: ["R-LEO-AI-185"]

  metadata:
    title: "SummarisationContext enum, prompt injection, frontend / backend parity"
    description: >
      Pytest verifies the enum has 20 stable members, that every
      member has a friendly label and a prompt fragment, and that
      the source resolver injects the matching fragment into the
      Situation stage. A static-source jest test compares the
      SummarisationContextValue union in the React primitive to
      the Python enum members so the two cannot drift. Backward
      compatibility for the legacy fixed_text artefact type is
      covered by a fixture-based pytest case.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest + pytest"
    test_file_paths:
      - "services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx"
      - "tests/test_sbar_summarisation_context.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node 20+ / jest 30 / @testing-library/react"
      - "Python 3.11+ / pytest"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-231-TC-001"
      case_name: "Enum has exactly 20 members and full label / prompt coverage"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert len(SummarisationContext) == 20 and that SUMMARISATION_CONTEXT_LABELS / SUMMARISATION_CONTEXT_PROMPTS cover every value"
          expected_result: "All assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Enum stays the contract surface for the playground and orchestrator"

    - case_id: "VT-231-TC-002"
      case_name: "source_resolver._resolve_artifact injects the matching prompt fragment"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build an SBARArtifactRef of type summarisation_context with context_value=clinic_appointment_prep and resolve it"
          expected_result: "Resolved entry contains the SUMMARISATION_CONTEXT_PROMPTS[clinic_appointment_prep] string"
          verification_method: "automated"
      acceptance_criteria:
        - "Per-context prompt fragment reaches the orchestrator"

    - case_id: "VT-231-TC-003"
      case_name: "fixed_text remains accepted for one minor version"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Validate a legacy fixture using type='FixedText' with a non-empty text value"
          expected_result: "SBARArtifactRef.model_validate succeeds"
          verification_method: "automated"
      acceptance_criteria:
        - "Backward compatibility preserved for one minor version"

    - case_id: "VT-231-TC-004"
      case_name: "Frontend / backend enum parity"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Static-source: read SummarisationContextValue union from SummarisationContextSelect.tsx; read enum members from libs/sbar/events.py; assert equal sets"
          expected_result: "Both sides have the same 20 string values"
          verification_method: "automated"
      acceptance_criteria:
        - "No silent drift between client and server contract"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-231/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-LEO-AI-231-2026-04-18"
      executed_at: "2026-04-18T00:00:00Z"
      executed_by: "automated"
      result: "pass"
      environment: "developer-laptop"
      notes: >
        Pytest run: 5 cases in tests/test_sbar_summarisation_context.py
        (enum size, label / prompt parity, artefact validation,
        legacy fixed_text fallback, source resolver injection).
        Jest run: 2 cases in
        services/ui/src/__tests__/summarisation-context-select-chrome.test.tsx
        (group / option counts, frontend / backend enum parity).
        All passed.
