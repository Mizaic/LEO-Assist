# -- R-LEO-AI-194 -- Blocked / refused pathway invisible to operations queue
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-194"
  title: "Care obstruction (DNA, refusal, hospital cancellation, family aggression, safeguarding) has no first-class signal so blocked pathways stay invisible to QA"

  hazard:
    description: >
      Before DI-LEO-AI-204 the pipeline had no first-class
      anchor for care-pathway obstructions. A patient who
      DNA'd due to mobility, whose family refused
      investigation, whose hospital cancelled the referral,
      or whose case raised a safeguarding concern, would
      sit on an open EpisodeOfCare with status='in_progress'
      until the stale-close pass eventually filed it as
      'stale_no_diagnosis' months later.
    category: "clinical_safety"

  hazardous_situation: >
    Operations / QA reviewers cannot identify blocked
    pathways early enough to escalate, intervene with
    safeguarding, or arrange transport / domiciliary
    visits. The patient is left in pathway limbo while the
    cohort metrics underreport the failure rate.

  harm:
    description: >
      Delayed or missed cancer diagnosis from undetected
      pathway obstruction; safeguarding incidents not
      escalated; family aggression toward NHS staff not
      tracked.
    severity: "critical"

  initial_risk_estimate:
    severity: 4
    probability: 4
    detectability: 5
    rpn: 80
    risk_level: "critical"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        DI-LEO-AI-204: introduce a first-class
        care_obstruction milestone with seven obstruction
        sub-types (DNA+reason, refusal of named
        investigation, safeguarding, avoidable delay, best-
        interest meeting, failed-to-attend / unable-to-
        reach, family aggression / terminated call, hospital
        retraction). The episode builder claims any
        care_obstruction within the episode window and
        stamps hitl_flag=True with a reason on the parent
        episode so the operations queue surfaces the
        pathway for review.
      implemented_by:
        - "DI-LEO-AI-204"
      verified_by:
        - "VT-LEO-AI-198"
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: >
        Operations queue triages all care_obstruction
        HITL items within 1 working day. Safeguarding sub-
        type escalates immediately to the practice
        safeguarding lead.
      implemented_by:
        - "DI-LEO-AI-204"
      verified_by:
        - "VT-LEO-AI-198"
      effectiveness: "pending"

  residual_risk_estimate:
    severity: 4
    probability: 2
    detectability: 2
    rpn: 16
    risk_level: "medium"
    acceptability: "conditionally_acceptable"
    justification: >
      The new anchor is now present and surfaces obstructions
      via HITL. Residual risk reflects (a) the manual
      triage workflow that still depends on operations team
      bandwidth, and (b) the regex coverage being limited
      to the patterns observed in the patient 4643293950
      case study; additional patterns may be discovered as
      the cohort expands. Continuous monitoring of the
      anchor's true-positive / false-positive split is
      required before the procedural control can be marked
      effective.

  monitoring:
    monitoring_plan: >
      Track care_obstruction anchor count per cohort run,
      broken down by obstruction sub-type. Audit a sample
      of 10 anchors per week for true-positive accuracy.
      Track the proportion of HITL care_obstruction items
      triaged within 1 working day.
    metrics:
      - "care_obstruction anchors per 1000 encounters per rebuild, by sub-type"
      - "True-positive rate of care_obstruction anchors (weekly audit)"
      - "Mean time-to-triage of care_obstruction HITL items"
    review_frequency: "Weekly for 12 weeks post-deployment, then monthly"

  metadata:
    identified_by: "Patient 4643293950 investigation -- Pattern G (DNA-mobility, hospital retraction, family aggression, safeguarding all present in one record with no first-class signal)"
    identified_date: "2026-04-18"
    status: "mitigated"
    tags:
      - "anchor-detector"
      - "care-obstruction"
      - "hitl"
      - "patient-4643293950"
