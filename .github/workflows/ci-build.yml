name: CI - Build and Push Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC federated credential
  contents: read

env:
  ACR_NAME: leoaicr
  ACR_LOGIN_SERVER: leoaicr.azurecr.io
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Run Tests
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio black flake8

      - name: Lint - black format check
        run: black --check --diff .

      - name: Lint - flake8
        run: |
          BASE_SHA="${{ github.event.before }}"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$(git rev-list --max-count=1 HEAD^ || true)"
          fi

          if [ -z "$BASE_SHA" ]; then
            echo "No base SHA available; skipping flake8 changed-file lint."
            exit 0
          fi

          PY_CHANGED="$(git diff --name-only "$BASE_SHA" HEAD -- '*.py' || true)"
          if [ -z "$PY_CHANGED" ]; then
            echo "No Python file changes; skipping flake8."
            exit 0
          fi

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [ -f "$file" ]; then
              flake8 --max-line-length=88 --extend-ignore=E203,W503,E501,E402 "$file"
            fi
          done <<< "$PY_CHANGED"

      - name: Run tests (non-blocking)
        run: |
          set +e
          pytest tests/ -v --tb=short
          TEST_EXIT=$?
          echo "PYTEST_EXIT_CODE=$TEST_EXIT" >> "$GITHUB_ENV"
          if [ "$TEST_EXIT" -ne 0 ]; then
            echo "Pytest failed with exit code $TEST_EXIT (non-blocking in CI)." >&2
          fi
          exit 0
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Publish test status summary
        if: always()
        run: |
          {
            echo "## Test job status"
            echo ""
            if [ "${PYTEST_EXIT_CODE:-0}" -eq 0 ]; then
              echo "- pytest: passed"
            else
              echo "- pytest: failed (non-blocking), exit code ${PYTEST_EXIT_CODE}"
              echo "- action: build/push continues"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build ${{ matrix.service }}
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: core-api
            dockerfile: infra/dockerfiles/Dockerfile.core-api
          - service: terminology-api
            dockerfile: infra/dockerfiles/Dockerfile.terminology-api
          - service: fhir-api
            dockerfile: infra/dockerfiles/Dockerfile.fhir-api
          - service: analytics-api
            dockerfile: infra/dockerfiles/Dockerfile.analytics-api
          - service: pipeline-worker
            dockerfile: infra/dockerfiles/Dockerfile.pipeline-worker
          - service: model-inference
            dockerfile: infra/dockerfiles/Dockerfile.model-inference
          - service: training-worker
            dockerfile: infra/dockerfiles/Dockerfile.training-worker
          - service: research-worker
            dockerfile: infra/dockerfiles/Dockerfile.research-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}
          TAG=sha-${{ github.sha }}
          docker build \
            --file ${{ matrix.dockerfile }} \
            --tag $IMAGE:$TAG \
            --tag $IMAGE:latest \
            --cache-from $IMAGE:latest \
            .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Output image digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_LOGIN_SERVER }}/${{ matrix.service }}:sha-${{ github.sha }}

  build-push-ui:
    name: Build ui
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC subject
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          echo "$TOKEN" | python3 -c "
          import base64, json, sys
          t = sys.stdin.read().strip()
          if t:
            p = t.split('.')[1]
            p += '=' * (4 - len(p) % 4)
            d = json.loads(base64.urlsafe_b64decode(p))
            print('OIDC subject (must match federated credential):', d.get('sub'))
            print('OIDC issuer:', d.get('iss'))
          "

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          audience: api://AzureADTokenExchange

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push
        run: |
          IMAGE=${{ env.ACR_LOGIN_SERVER }}/ui
          TAG=sha-${{ github.sha }}
          docker build \
            --file infra/dockerfiles/Dockerfile.ui \
            --tag $IMAGE:$TAG \
            --tag $IMAGE:latest \
            --cache-from $IMAGE:latest \
            .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Output image digest
        run: docker inspect --format='{{index .RepoDigests 0}}' ${{ env.ACR_LOGIN_SERVER }}/ui:sha-${{ github.sha }}
