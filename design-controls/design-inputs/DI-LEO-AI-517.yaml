# -- DI-LEO-AI-517 -- Episode-engine PipelineRun audit event
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-517"
  type: "Functional"
  derived_from: ["UN-LEO-AI-091"]
  requirement: >
    The system SHALL emit a ``:AuditEvent {type:'PipelineRun',
    subtype:'episode_engine'}`` for every episode-engine run (real or
    dry-run) so episode-engine LLM token spend appears in the same
    /admin/billing dashboards as coding extraction and SBAR. The event
    SHALL: (a) link to the patient via ``[:AUDIT_FOR]`` when the
    patient exists; (b) carry ``llm_input_tokens``,
    ``llm_output_tokens``, ``llm_cached_tokens`` and ``llm_cost_usd``
    aggregated across all stage traces; (c) record ``status`` as
    ``completed`` / ``partial`` / ``failed`` derived from per-stage
    ``ok`` flags and the engine ``errors`` array; (d) be best-effort
    so a transient Neo4j failure logs at WARNING and never bubbles
    out of ``persist_trace``; (e) reuse the wire-format defined by
    ``WRITE_SBAR_AUDIT_EVENT`` so the existing
    ``GET_AUDIT_EVENT_SPEND`` query returns these rows with no UI
    change. Additionally, ``GET_PATIENT_LLM_SPEND`` SHALL be extended
    with a UNION over these rows so the per-patient drill-down
    surfaces episode-engine spend.
  rationale: >
    The episode engine already records detailed per-stage cost data on
    the ``:EpisodeEngineTrace`` node, but the platform billing
    dashboards only inspect ``:AuditEvent {type:'PipelineRun'}`` rows.
    Episode-engine spend therefore goes unreported in customer
    invoices and provider-comparison analytics today, so adding a
    ``PipelineRun`` audit event closes a known gap surfaced by the
    llm-cost-telemetry rule audit.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          ``persist_trace(...)`` writes exactly one
          ``:AuditEvent {type:'PipelineRun', subtype:'episode_engine'}``
          per call with the four canonical token / cost properties
          populated.
      - type: "functional"
        spec: >
          When the patient node exists, the audit event has a
          ``[:AUDIT_FOR]`` edge to that ``:Patient``; when the
          patient does not exist, the event is still written.
      - type: "safety"
        spec: >
          Failure to write the audit event MUST NOT raise; the engine
          chain continues with a WARNING log carrying the trace id.
    constraints:
      - type: "performance"
        spec: >
          The additional Cypher write SHALL add no more than 50 ms p95
          to ``persist_trace`` measured against the existing
          regression cohort.
    dependencies: ["DI-LEO-AI-506", "DI-LEO-AI-068"]
    downstream_impacts:
      - "Per-tenant billing dashboards (/admin/billing)"
      - "Per-patient LLM-spend drill-down (LLMSpendPanel)"
      - "Audit trail UI (AuditTrailTab)"
    technical_details:
      language: "Python"
      framework: "neo4j-python-driver, langgraph"
      file_structure:
        - "services/analysis_worker/app/episode_engine/tracing.py"
        - "libs/cypher/model_config_queries.py"
      estimated_loc: 130

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      Pytest cases in ``tests/episode_engine/test_tracing.py`` verify:
      audit event written alongside trace, patient link present when
      patient exists, status reflects stage failure, write failure
      does not raise.
    test_protocol: "VT-LEO-AI-516"

  safety_class: "B"
  risks: ["R-LEO-AI-506"]
  tags:
    - "telemetry"
    - "episode-engine"
    - "audit-event"
