# -- DO-LEO-AI-116 -- Density provider and density-aware primitives
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-116"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-119"]
    user_needs: ["UN-LEO-AI-065", "UN-LEO-AI-068"]
    risks_addressed: ["R-LEO-AI-079"]
    verification_tests: ["VT-LEO-AI-114"]

  specification:
    title: "DensityProvider and density-aware primitive resolution"
    description: |
      - DensityContext exports a React context with value
        'compact' | 'comfortable' | 'spacious' and a setter.
      - DensityProvider decides the initial value using route-match
        (patient-reachable prefixes) + localStorage + default.
      - useDensity() returns the current value; useDensityTokens()
        returns the padding/min-height/font-size map for the
        active tier from theme/tokens.ts DENSITY_MAP.
      - Settings page exposes a Density toggle; writes to
        localStorage 'leo-density' and updates context.
      - Patient-reachable routes (/portal, /mail, /safety-netting,
        /games, /care/wellbeing, /sign-in) force 'spacious'.

    acceptance_criteria:
      - criterion: "Default resolution"
        type: "functional"
        measurement: "Test"
        target: "Patient-reachable route -> spacious; localStorage 'compact' -> compact; no storage -> comfortable"
      - criterion: "Spacious touch target"
        type: "safety"
        measurement: "Test"
        target: "DENSITY_MAP.spacious.minHeightPx >= 44"
      - criterion: "Patient-route override wins"
        type: "safety"
        measurement: "Test"
        target: "localStorage='compact' AND pathname='/portal' -> spacious"
      - criterion: "Setting persists"
        type: "functional"
        measurement: "Test"
        target: "setDensity('compact') writes 'compact' to localStorage"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/ui/src/context/DensityContext.tsx"
        description: "DensityProvider, useDensity, useDensityTokens"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/theme/tokens.ts"
        description: "DENSITY_MAP for compact/comfortable/spacious"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/app/layout.tsx"
        description: "DensityProvider wraps the tree"
        storage_location: "git"
    technical_details:
      language: "TypeScript"
      loc: 180
      key_functions:
        - "DensityProvider"
        - "useDensity"
        - "useDensityTokens"
        - "resolveInitialDensity"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Patient-reachable route density override is safety-critical: it prevents a user who has chosen compact from being dropped into sub-44px controls when reading safety-netting."
    risk_control_measures:
      - "Route override is computed at context level so no component can bypass it."
      - "Test suite enforces minHeightPx >= 44 for spacious."

  verification_status:
    verification_method: "Test"
    verification_complete: false
