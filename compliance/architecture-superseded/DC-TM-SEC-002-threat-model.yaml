      evidence:
        file: "services/api/app/routers/patients.py"
        snippet: "patient_id: str path parameter used directly in Cypher and Terminology API calls"
      impact:
        confidentiality: "None"
        integrity: "Low"
        availability: "Low"
        clinical_safety: "None"
        patient_data_exposure: false
      likelihood: "Low"
      likelihood_rationale: "All Cypher queries use parameterized $pid. Requires authentication. Primarily a defense-in-depth concern."
