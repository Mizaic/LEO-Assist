# -- DI-LEO-AI-230 -- PatientFinder primitive + analytics_api endpoints
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-230"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-081"
  requirement: >
    The platform SHALL provide a shared PatientFinder UI primitive
    and a backing analytics-api router that lets a reviewer pick a
    patient by Search (typeahead by name or NHS number), Filter (an
    extended CohortFilter exposed as a /by-filter endpoint) or Saved
    cohort (the existing :Cohort nodes). Every result row -- across
    every tab -- SHALL render NHS number AND date of birth alongside
    the display name as the primary mitigation for R-LEO-AI-211
    (wrong-patient pick).
  rationale: >
    The original SBAR Playground required reviewers to type a Neo4j
    :Patient.id by hand. Reviewers do not memorise ids and there is
    no safe way to discover one. A shared primitive that respects
    organisational scope, reuses the existing CohortFilter contract
    and shows three independent identifiers per row turns the picker
    into a defensible primary-care/audit workflow tool.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          PatientFinder dialog renders three tabs (Search, Filter,
          Saved cohort). Each tab calls the matching analytics-api
          endpoint -- /patient-finder/search,
          /patient-finder/by-filter, /patient-finder/by-cohort/{id}.
          Search debounces typeahead by 250 ms.
      - type: "safety"
        spec: >
          Every result row in every tab renders NHS number and DOB
          (or a short "missing identifier" badge if either is not
          set on the patient). The display name is never the only
          identifier shown.
      - type: "functional"
        spec: >
          Filter tab exposes age range, sex, IMD decile range,
          encounter count + window months, episode domain /
          subdomain / outcome and "Preview cohort size" using
          POST /cohorts/preview before listing patients.
      - type: "functional"
        spec: >
          Selecting a row emits {id, displayName, dob, nhsNumber}
          to the host component and auto-closes the dialog.
      - type: "safety"
        spec: >
          The analytics-api endpoints scope every Cypher query to
          the caller's CallerScope tenant_id / org_id and return
          403 if the patient is not in scope.
    constraints:
      - type: "safety"
        spec: >
          NHS number / DOB row formatting MUST be enforced by the
          static-source VT (VT-LEO-AI-230) that asserts the
          ListItemText structure of each row.
      - type: "safety"
        spec: >
          The /patient-finder router MUST be mounted under the
          existing analytics-api admin/clinician auth gate. No
          unauthenticated access path.
    dependencies:
      - "DI-LEO-AI-194"
    downstream_impacts:
      - "/admin/ai-summarisation SBAR Playground (consumer)"
      - "Future /cohorts surfaces (consumer)"
      - "Future /care patient navigator (consumer)"
    technical_details:
      language: "TypeScript + Python"
      framework: "Next.js + MUI (UI), FastAPI + Neo4j (backend)"
      file_structure:
        - "services/ui/src/components/sbar-playground/PatientFinder.tsx"
        - "services/ui/src/lib/analyticsApi.ts"
        - "services/analytics_api/app/routers/patient_finder.py"
        - "services/analytics_api/app/routers/cohorts.py"
        - "services/analytics_api/app/main.py"
      estimated_loc: 1100

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-230 covers static-source registration of the
      identifier-row contract, live-render typeahead behaviour, and
      pytest coverage of the /patient-finder router for scope
      enforcement and filter clauses.
    test_protocol: "VT-LEO-AI-230"

  safety_class: "B"
  risks:
    - "R-LEO-AI-211"
  tags:
    - "ui"
    - "patient-finder"
    - "sbar"
    - "playground"
    - "primitive"
