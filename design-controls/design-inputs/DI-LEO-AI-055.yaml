# -- DI-LEO-AI-055 -- GDPR-Isolated Learning Loop and Operations UX

- id: "DI-LEO-AI-055"
  type: "Functional"
  derived_from: ["UN-LEO-AI-027"]
  requirement: >
    The system SHALL split training data into TrainingCandidate and GoldLabel
    nodes, enforce DI-ID validation before persistence, and prevent any patient,
    encounter, tenant, organisation, or user identifier fields in learning-loop
    and knowledge-graph training artifacts. The admin gold-dataset workflow
    SHALL provide a manual duplicate-candidate reduction control based on
    similarity thresholds, with explicit preview before apply.
  rationale: >
    Supports GDPR-safe model training while preserving terminology learning and
    review workflows through anonymised records and system-level provenance only.
  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "TrainingCandidate and GoldLabel contain no patient_id, encounter_id, tenant_id, org_id, source_ref"
      - type: "safety"
        spec: "DI-ID gate blocks persistence on residual PHI patterns"
      - type: "functional"
        spec: "Operations UI presents card-based dashboard and dedicated reviews page"
      - type: "functional"
        spec: "Authorized users can permanently delete a TrainingCandidate and its linked GoldLabel and SurfaceFormTask records by candidate_id"
      - type: "functional"
        spec: "Admin gold-dataset UI provides manual dedupe preview and apply actions for highly similar TrainingCandidate records"
    dependencies:
      - "DI-LEO-AI-054"
  verification:
    method: "Test"
    phase: "OQ"
    test_protocol: "VT-LEO-AI-096"
  safety_class: "B"
  risks:
    - "R-LEO-AI-039"
    - "R-LEO-AI-040"
    - "R-LEO-AI-041"
  tags: ["gdpr", "training-data", "operations-ui", "surface-forms"]
