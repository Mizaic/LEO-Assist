# -- DI-LEO-AI-206 -- Per-document canary metrics + per-encounter weight lookup
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-206"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-086"
  requirement: >
    The model_registry canary gold job SHALL capture per-document
    TP/FP/FN counts and a derived doc_f1 + error_contribution
    (= (fp+fn)/total_errors) for every gold candidate it scores,
    and SHALL include this as metrics.per_document in the canary
    job result. The Knowledge API SHALL expose POST
    /training/per-encounter-weights/lookup that accepts
    [{encounter_id, text}, ...], SHALL de-identify each text,
    SHALL compute candidate_id = sha256(deidentified), SHALL
    look up that candidate_id in the most recent completed canary
    job's per_document block (filtered by version when supplied),
    and SHALL return {weights: {encounter_id: per_document_entry
    or null}, job_id, version, completed_at}. Encounters that did
    not appear in the canary corpus return null so the UI omits
    the badge cleanly.
  rationale: >
    The aggregate per-entity F1 chart already computed inside the
    canary loop discards per-document signal even though it is
    available row-by-row. Surfacing per-document error contribution
    lets the dry-run page tell reviewers which encounters would
    move overall F1 most if fixed -- turning a flat list into a
    directed correction queue. Joining via candidate_id (and not
    encounter_id) keeps the GDPR-isolated training data boundary
    intact: the lookup endpoint is the only place that crosses
    encounter -> candidate, and it does so server-side after
    de-identification.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "_run_canary_gold_job builds a per_document list of {candidate_id, label_id, gold_count, pred_count, tp, fp, fn, doc_f1, error_contribution} alongside the existing tp/fp/fn label aggregates"
      - type: "functional"
        spec: "error_contribution = (fp+fn)/total_errors when total_errors>0 else 0.0; doc_f1 uses the standard 2*p*r/(p+r) formula; per_document is attached to metrics under metrics.per_document and persisted in _canary_jobs alongside metrics.per_label"
      - type: "functional"
        spec: "GET_ALL_GOLD_LABELS_FOR_EXPORT and GET_GOLDEN_SET_LABELS return candidate_id (via coalesce(g.candidate_id, c.candidate_id)) so the canary loop can attribute per-document results back to a candidate"
      - type: "functional"
        spec: "POST /training/per-encounter-weights/lookup accepts {encounters: [{encounter_id, text}], version?}, deidentifies each text via libs.utils.deidentify.deidentify_text(text, ner=True), computes candidate_id=sha256, finds the most recent _canary_jobs entry with status='completed' (filtered by version when supplied) and returns the per_document entry keyed by encounter_id"
      - type: "safety"
        spec: "Encounters with empty or post-de-id-empty text return null in the weights map; missing canary data returns weights:{} with job_id:null"
      - type: "safety"
        spec: "Response only contains candidate_id-scoped metrics (counts + ratios) and job metadata (job_id, version, completed_at); never the de-identified text, never PHI"
      - type: "performance"
        spec: "End-to-end <= 5s for 14 encounters on a warm de-identifier"
    constraints:
      - type: "safety"
        spec: "Both endpoints are gated by get_caller_scope; the lookup endpoint NEVER persists encounter text"
    dependencies:
      - "DI-LEO-AI-198"
    downstream_impacts:
      - "model_registry canary job result schema (additive: metrics.per_document)"
      - "Training Knowledge API surface (new lookup endpoint)"
    technical_details:
      language: "Python"
      framework: "FastAPI + libs.neo4j_client.KnowledgeGraphClient"
      file_structure:
        - "services/api/app/routers/model_registry.py"
        - "services/api/app/routers/training.py"
        - "libs/cypher/gold_label_queries.py"
        - "libs/cypher/golden_set_queries.py"
      estimated_loc: 95

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-195 covers per_document construction (tp/fp/fn,
      doc_f1, error_contribution sum-to-1.0), the lookup endpoint
      mapping encounter_id -> candidate_id via deidentify+sha256,
      the no-canary-data path, and the version filter.
    test_protocol: "VT-LEO-AI-195"

  safety_class: "B"
  risks:
    - "R-LEO-AI-192"
  tags:
    - "model-evaluation"
    - "training-data-quality"
    - "gdpr"
    - "ui-action"
