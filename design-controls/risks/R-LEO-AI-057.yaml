# -- R-LEO-AI-057 -- Unified Coding Agent Miscoding Risk
# ISO 14971 / IEC 62304 Risk

- id: "R-LEO-AI-057"
  title: "LLM coding agent produces incorrect SNOMED codes applied without human review"

  hazard:
    description: >
      The LangGraph coding agent selects an incorrect SNOMED concept, assigns
      a wrong assertion, or omits a safety-critical finding, and the write-back
      gate fails to block the incorrect change from reaching the patient graph.
    category: "clinical_safety"

  hazardous_situation: >
    An encounter note contains a cancer red-flag symptom or safeguarding indicator.
    The agent's search_snomed tool returns a plausible but incorrect concept (e.g.
    benign lesion instead of suspected malignancy). The agent submits with confidence
    >= 0.95. The post-processing tier classifier passes the entity at Tier 1. The
    write-back transaction applies the incorrect code to the patient graph. A
    downstream clinical dashboard shows the patient as lower-risk than they are,
    delaying referral.

  harm:
    description: >
      Delayed referral for suspected cancer or missed safeguarding alert, causing
      patient harm through late diagnosis or failure to protect a vulnerable person.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 3
    rpn: 18
    risk_level: "medium"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        The agent verdict passes through the full 9-layer run_post_processing()
        stack (including disorder gate and scope guard) before write-back. The
        tier classifier requires confidence >= 0.95 for Tier 1 auto-write; lower
        confidence routes to CodingReview queue for human review.
      implemented_by: ["DI-LEO-AI-083"]
      verified_by: ["VT-LEO-AI-083"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        The system prompt contains explicit safety-critical patterns: cancer
        red-flag symptoms (NG12) and safeguarding indicators must be flagged with
        severity: critical. The post-processing disorder gate applies an independent
        LLM verification step for disorder entities.
      implemented_by: ["DI-LEO-AI-083"]
      verified_by: ["VT-LEO-AI-083"]
      effectiveness: "effective"
    - control_type: "design_feature"
      description: >
        Runtime AgentExtractorProvider always invokes with apply=False. The
        existing pipeline persistence layer (not the agent) controls all
        write-back, including HITL routing. This preserves the established
        clinical safety review process for every runtime-extracted entity.
      implemented_by: ["DI-LEO-AI-083"]
      verified_by: ["VT-LEO-AI-083"]
      effectiveness: "effective"
    - control_type: "protective_measure"
      description: >
        Kill switch CODING_AGENT_ENABLED=false immediately falls back to the
        existing LLMExtractor without redeployment. Audit runs use apply=False
        by default (opt-in write-back via --apply flag).
      implemented_by: ["DI-LEO-AI-083"]
      verified_by: ["VT-LEO-AI-083"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Residual probability is low because: (1) the 9-layer post-processing
      stack provides independent verification; (2) Tier 1 auto-write requires
      >= 0.95 confidence; (3) safety-critical entities are explicitly flagged
      in the prompt; (4) runtime path always routes through existing HITL gates.
      The weekly Sonnet audit provides an ongoing quality monitoring signal
      that would detect systematic miscoding within one audit cycle.

  monitoring:
    monitoring_plan: >
      Monitor the weekly audit run for regressions in pct_clean and
      safety-critical miss rate. Alert if pct_clean drops by > 5% week-on-week
      or if critical-severity missing count increases by > 20%.
    metrics:
      - "pct_clean per weekly audit run"
      - "missing_critical count per weekly audit run"
      - "Agent rollback rate (integrity check failures per encounter)"
      - "Bedrock 429 throttle rate"
    review_frequency: "Quarterly"

  metadata:
    identified_by: "design review - adversarial plan review April 2026"
    identified_date: "2026-04-05"
    status: "analyzed"
    tags:
      - "coding-agent"
      - "clinical_safety"
      - "langgraph"
