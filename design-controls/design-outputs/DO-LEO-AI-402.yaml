# -- DO-LEO-AI-402 -- Cancer-care-review restatement guard implementation
# ISO 13485 / IEC 62304 Design Output
#
# NOTE: Created in the 4xx ID range alongside DI-401 / DO-401 / R-401 /
# VT-401 (Pattern N1) to escape the recurring ID collisions in the
# 21x-30x range during the parallel ICD-10 / OPCS-4 work stream.

- id: "DO-LEO-AI-402"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs: ["DI-LEO-AI-402"]
    user_needs: ["UN-LEO-AI-005"]
    risks_addressed: ["R-LEO-AI-402"]
    verification_tests: ["VT-LEO-AI-402"]

  specification:
    title: "Cancer-care-review restatement guard (Pattern N4)"
    description: |
      Two new helpers in ``libs/domains/code_inventories.py`` and
      one additional gate in
      ``services/analysis_worker/app/analyzers/anchor_detector.py``
      that together suppress the emission of ``diagnosis_confirmed``
      anchors on routine cancer-care-review and known-cancer
      narrative encounters that lack any fresh-diagnosis marker.

      Helper 1 -- ``encounter_has_new_episode_marker(text)``:
      regex ``_NEW_EPISODE_MARKER_RX`` matches ``(New Episode)``,
      ``newly diagnosed``, ``new diagnosis of``, ``diagnosis
      confirmed today``, ``first presentation of``, ``new
      presentation of``. This is the fresh-diagnosis exception
      shared by Pattern N4 (and reusable by future N-series
      patterns).

      Helper 2 -- ``encounter_is_cancer_care_review_restatement(text)``:
      returns False if the new-episode marker is present;
      otherwise returns True if either ``_CANCER_CARE_REVIEW_RX``
      ("cancer (care) review") or the existing N1
      ``_KNOWN_CANCER_RESTATEMENT_RX`` (known X cancer / history
      of X carcinoma / PMHx X cancer / post-X recovery review /
      etc.) matches.

      Detector wiring -- in ``_classify_text_encounters``, before
      the ``diagnoses.append`` call inside the
      ``has_cancer and has_confirmed`` branch, an
      ``_dx_cancer_review_blocked = encounter_is_cancer_care_review_restatement(text)``
      gate is added to the existing ``_dx_referral_blocked`` guard
      condition. When True, the diagnosis_confirmed anchor is not
      emitted at all (Pattern K paths -- problem-list-code,
      active-cancer-care-code, hard-evidence-string -- are all
      suppressed for that encounter).

      Pattern N1 (DI-LEO-AI-401) remains in place: its tagging
      and floating-group-rejection behaviour is the safety net
      for any restatement encounter that N4 does not catch
      (e.g. sick-note-only encounters whose problem list still
      carries a malignancy code).
    acceptance_criteria:
      - criterion: "Helper unit-test coverage"
        type: "functional"
        measurement: "Test"
        target: >
          ``encounter_is_cancer_care_review_restatement`` returns
          True for the 5 documented cancer-care-review and
          known-cancer narrative shapes; returns False for the
          7 documented non-restatement / fresh-diagnosis-marker
          / referral / sick-note-only / unrelated cases.
      - criterion: "Anchor-detector suppression"
        type: "safety"
        measurement: "Test"
        target: >
          The canonical patient 4802892365 2025-09-24
          cancer-care-review encounter produces zero
          ``diagnosis_confirmed`` anchors; the fresh-diagnosis
          encounter ("Major: Invasive carcinoma of breast (Ya0ln)
          ... (New Episode). Plan: Refer to breast clinic.")
          continues to emit one ``diagnosis_confirmed``.
      - criterion: "Pattern K precedence"
        type: "safety"
        measurement: "Test"
        target: >
          When N4 fires it suppresses the diagnosis_confirmed
          anchor regardless of which Pattern K path
          (active_cancer_care_code, problem_list_code,
          hard_evidence_string) would otherwise have emitted.
      - criterion: "Cohort wipe-and-rebuild impact"
        type: "performance"
        measurement: "Test"
        target: >
          After wipe-and-rebuild, total EpisodeOfCare count
          drops by at least 1 versus the pre-N4 baseline; the
          phantom 2025-09-24 ``diagnosis_confirmed`` is no
          longer attached to patient 4802892365's real episode
          1ecfb55618c2a6d2.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: >
          ``_CANCER_CARE_REVIEW_RX``, ``_NEW_EPISODE_MARKER_RX``,
          ``encounter_has_new_episode_marker``,
          ``encounter_is_cancer_care_review_restatement``.
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: >
          ``_dx_cancer_review_blocked`` gate added to the
          ``has_cancer and has_confirmed`` branch in
          ``_classify_text_encounters``.
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 95
      key_functions:
        - "encounter_has_new_episode_marker"
        - "encounter_is_cancer_care_review_restatement"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Diagnosis confirmation milestone emission gate"
    risk_control_measures:
      - "Conservative review-template vocabulary -- only the EMIS-aligned 'cancer (care) review' phrase plus the existing N1 known-cancer narrative regex are recognised."
      - "Explicit fresh-diagnosis-marker exception ensures real diagnoses recorded inside review-template encounters are still emitted."
      - "Sick-note-only encounters are deliberately NOT a trigger for N4 -- N1's floating-group filter remains the safety net for those."

  verification_status:
    verification_method: "Test"
    verification_complete: true
