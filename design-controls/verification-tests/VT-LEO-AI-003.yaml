# -- VT-LEO-AI-003 -- SNOMED CT Resolution Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-003"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-004"]
    risks: ["R-LEO-AI-004", "R-LEO-AI-019"]
    user_needs: ["UN-LEO-AI-002", "UN-LEO-AI-023"]

  metadata:
    title: "SNOMED CT Resolution Verification"
    description: >
      Verifies that the terminology service correctly resolves extracted
      clinical entities to SNOMED CT concept codes using exact match, fuzzy
      match, and synonym lookup. Confirms top-1 accuracy meets the required
      threshold against a gold-standard mapping dataset.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_path: "tests/integration/test_snomed_resolution.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 installed with project dependencies"
      - "SNOMED CT terminology index loaded and accessible"
      - "Gold-standard entity-to-SNOMED mapping dataset available"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-003-TC-001"
      case_name: "Exact match resolves correctly"
      priority: "critical"
      preconditions:
        - "Terminology index contains the target SNOMED concepts"
        - "Test entities have known exact-match SNOMED codes"
      test_steps:
        - step_number: 1
          action: "Submit an entity term that has an exact match in the SNOMED index"
          expected_result: "Service returns the correct SNOMED concept ID with match_type='exact'"
          verification_method: "Assert returned concept ID matches the gold-standard code"
        - step_number: 2
          action: "Submit a batch of 50 exact-match terms"
          expected_result: "All 50 terms resolve to the correct SNOMED code"
          verification_method: "Assert 100% match rate for exact-match terms"
      acceptance_criteria:
        - "100% of exact-match terms resolve to the correct SNOMED concept"
        - "Response time per term is under 200ms"

    - case_id: "VT-003-TC-002"
      case_name: "Fuzzy match returns relevant candidates"
      priority: "high"
      preconditions:
        - "Test entities include misspellings and abbreviations"
      test_steps:
        - step_number: 1
          action: "Submit an entity term with a minor spelling variation"
          expected_result: "Service returns a ranked list of candidate SNOMED concepts"
          verification_method: "Assert the correct concept appears in the top 5 candidates"
        - step_number: 2
          action: "Submit a common clinical abbreviation"
          expected_result: "Service resolves the abbreviation to the full SNOMED concept"
          verification_method: "Assert returned concept matches the expected expansion"
      acceptance_criteria:
        - "Correct concept appears in top-5 candidates for >= 90% of fuzzy queries"
        - "Candidate list includes confidence scores"

    - case_id: "VT-003-TC-003"
      case_name: "Top-1 accuracy >= 90%"
      priority: "critical"
      preconditions:
        - "Full gold-standard mapping dataset is loaded"
      test_steps:
        - step_number: 1
          action: "Run SNOMED resolution across all terms in the gold-standard dataset"
          expected_result: "Top-1 accuracy metric computed"
          verification_method: "Assert top-1 accuracy >= 0.90"
        - step_number: 2
          action: "Log per-category accuracy for audit trail"
          expected_result: "Accuracy metrics broken down by entity category are recorded"
          verification_method: "Verify metrics file contains accuracy per category"
      acceptance_criteria:
        - "Overall top-1 accuracy >= 90%"
        - "No individual category has top-1 accuracy below 80%"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-003/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
