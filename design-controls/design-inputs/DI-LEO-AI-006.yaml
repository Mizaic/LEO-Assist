# -- DI-LEO-AI-006 -- LLM Disambiguation Fallback
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-006"
  type: "Functional"
  derived_from: ["UN-LEO-AI-002"]
  requirement: "The system SHALL use LLM inference as a fallback for SNOMED coding disambiguation when NLP pipeline confidence is below a configurable threshold, producing structured JSON output with the selected concept and reasoning"
  rationale: "The NLP pipeline handles high-confidence cases efficiently. For ambiguous cases, LLM inference provides clinical reasoning to select among candidate concepts. LLM is used as fallback only to control cost and latency."

  machine_spec:
    agent_prompt: |
      Implement LLM disambiguation fallback (~200 LOC).

      SINGLE PURPOSE: Use LLM inference to disambiguate SNOMED coding
      when the NLP pipeline confidence is below threshold.

      REQUIREMENTS:
      1. Accept low-confidence entity with candidate concept list
      2. Build disambiguation prompt with clinical context
      3. Call LLM API (OpenAI or Anthropic via factory pattern)
      4. Parse structured JSON response with selected concept and reasoning
      5. Validate LLM output against candidate list
      6. Return disambiguated result with LLM reasoning attached

      METHODS:
      - disambiguate(entity, candidates, context): Run LLM fallback
      - build_prompt(entity, candidates, context): Construct prompt
      - parse_response(llm_output): Extract structured result
      - validate_selection(selection, candidates): Check valid concept

      CODE CLARITY:
      - LLM provider is abstracted via factory pattern
      - Prompt templates are versioned and stored separately
      - LLM reasoning is preserved for audit trail

    acceptance_criteria:
      - type: "test"
        spec: "LLM disambiguation improves overall coding F1 by >= 5% compared to NLP-only"
      - type: "test"
        spec: "LLM output is valid structured JSON with required fields"
      - type: "test"
        spec: "LLM fallback only triggered when confidence < threshold"

    constraints:
      - type: "performance"
        spec: "LLM disambiguation completes in <= 5 seconds per entity"
      - type: "safety"
        spec: "LLM selections validated against known SNOMED concept list"
      - type: "security"
        spec: "No patient-identifiable data sent to external LLM APIs"

    dependencies: []

    downstream_impacts:
      - "services/coding_worker -- disambiguation results feed final coding output"
      - "libs/prompts -- prompt templates consumed by this module"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["openai", "anthropic"]
      file_structure:
        - "services/coding_worker/app/pipeline/llm_extractor.py"
        - "libs/llm_client/factory.py"
        - "libs/prompts/disambiguation_v1.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "LLM disambiguation improves overall coding F1 by >= 5% compared to NLP-only"
    test_protocol: "VT-LEO-AI-006"

  safety_class: "B"
  risks: ["R-LEO-AI-001", "R-LEO-AI-011", "R-LEO-AI-014", "R-LEO-AI-016"]
  tags: ["llm", "disambiguation", "fallback", "coding-pipeline"]
