# -- VT-LEO-AI-077 -- De-identified Evidence Collection Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-077"
  version: "1.1"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-077"]
    risks: ["R-LEO-AI-052"]

  metadata:
    title: "Loop 3 De-identified Evidence Collection and Zero-PII Verification"
    description: >
      Verifies deidentify_with_span sentinel behaviour, evidence_sentence
      storage on DOCUMENTS, zero PII in 500-record sample, and sentinel
      exclusion from export queries. Safety-critical: this is the primary
      control for R-LEO-AI-052 (PII in training corpus) at the point of
      data collection.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_deidentify_evidence.py"
      - "tests/test_deidentify.py"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "libs/utils/deidentify.py with deidentify_with_span implemented"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-077-TC-001"
      case_name: "deidentify_with_span returns correct offsets when span found"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call deidentify_with_span('Patient John has asthma', 'asthma')"
          expected_result: "Returns (deident_sentence, start_idx, start_idx + 6) where span locates 'asthma'"
          verification_method: "automated"
      acceptance_criteria:
        - "start >= 0 and end = start + len(span_text)"
        - "deident_sentence does not contain 'John' (PII removed)"

    - case_id: "VT-077-TC-002"
      case_name: "deidentify_with_span returns -1 sentinel when span not found after de-identification"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Call deidentify_with_span with a sentence where the span overlaps with a PII token (span_text='Smith' if Smith is a patient name)"
          expected_result: "Returns (deident_sentence, -1, -1)"
          verification_method: "automated"
      acceptance_criteria:
        - "evidence_start = -1 and evidence_end = -1"

    - case_id: "VT-077-TC-003"
      case_name: "DOCUMENTS relationship stores evidence_sentence, evidence_start, evidence_end, sentence_index"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Mock write_documents_from_sentences_payload with one sentence and one term"
          expected_result: "Cypher params include evidence_sentence, evidence_start, evidence_end, sentence_index, holdout=false"
          verification_method: "automated"
      acceptance_criteria:
        - "All 5 evidence fields present in Cypher parameters"

    - case_id: "VT-077-TC-004"
      case_name: "Zero PII detected in 500-record random sample (acceptance test)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Generate 500 synthetic de-identified evidence_sentence values using deidentify_with_span"
          expected_result: "detect_phi() returns empty list for all 500 sentences"
          verification_method: "automated"
      acceptance_criteria:
        - "detect_phi(sentence) == [] for all 500 sample records"
        - "Zero PII tokens detected across entire sample"

    - case_id: "VT-077-TC-005"
      case_name: "Records with evidence_start = -1 excluded from export query"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Export query includes WHERE r.evidence_start >= 0; verify -1 records excluded"
          expected_result: "DOCUMENTS relationships with evidence_start = -1 not returned by export query"
          verification_method: "automated"
      acceptance_criteria:
        - "No records with evidence_start < 0 in export query result"

    - case_id: "VT-077-TC-006"
      case_name: "Postcode redaction preserves CTV3 / Read v2 clinical codes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Call deidentify_text on sentences containing 5-character CTV3 / Read v2
            codes that match the compact-form UK postcode regex (e.g. 'B00zz',
            'X78HC', 'Ya03d'); verify the codes survive unchanged and that real
            postcodes (with space, e.g. 'SW1A 1AA') are still redacted.
          expected_result: >
            Read codes preserved verbatim in output; '[POSTCODE]' substituted only
            for tokens that are not 5-char alphanumeric clinical codes; detect_phi()
            does not flag Read codes as 'postcode'.
          verification_method: "automated"
      acceptance_criteria:
        - "Read codes B00zz, X78HC, Ya03d, X00ZA, Y7JQI preserved unchanged"
        - "Real postcode 'SW1A 1AA' is replaced with [POSTCODE]"
        - "detect_phi('Coded as B00zz') does not include 'postcode'"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-077/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_on: "2026-04-18"
      executed_by: "developer"
      result: "pass"
      scope: "VT-077-TC-006 (Read code preservation regression)"
      command: "pytest tests/test_deidentify.py -v"
      summary: >
        152 deidentify tests passed (33 in tests/test_deidentify.py covering the
        new Read code guard, plus existing completeness suite). Postcode regex
        now skips 5-char alphanumeric tokens that match the CTV3 / Read v2 shape
        so clinical codes like B00zz, X78HC, Ya03d are no longer clobbered to
        [POSTCODE]. Real postcodes with the canonical space (SW1A 1AA) and 7-char
        compact postcodes (SW1A1AA, LE114QH) continue to be redacted.
