# -- UN-LEO-AI-066 -- Carer-facing inclusive user experience
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-066"
  title: "Carers acting on behalf of a patient can read safety-netting advice, review pathway status, and complete shared-care tasks without becoming the patient"
  description: |
    Many LEO patients are supported by a carer: a parent for a child
    patient, an adult child for an older parent, a professional carer,
    or a partner. When the carer is the active user of a
    patient-reachable LEO surface, the screen must make clear whose
    data they are looking at, what the carer is permitted to do, and
    how they should escalate concerns safely.

    This is distinct from the patient need because carer-facing copy
    must address "you are reading your mother's safety-netting
    advice", show the patient name and relationship prominently, and
    never imply the carer IS the patient. It also shapes the consent,
    logout, and audit story.

  stakeholder:
    type: "end_user"
    role: "Carer / proxy / parent"
    organization: "Informal and formal carers of LEO patients"

  priority: "SHOULD"

  rationale: |
    A carer reading safety-netting advice for someone else is a
    high-risk clinical moment: the wrong framing ("your symptoms")
    can confuse a carer into applying advice to themselves, and a
    wrong logout can expose the patient's record to the next person
    using the device. An explicit carer persona lets us verify
    relationship labelling, permission scopes, and switch-user
    affordances in every patient-reachable surface.

  benefit: "Safety-netting and portal surfaces are clinically safe when used by proxies. Confusion between carer and patient is ruled out by design."

  use_case: |
    1. A mother reads her 8-year-old's safety-netting advice and sees
       "For your child, Ella Patel (age 8)" as the primary framing.
    2. A son logs in for his father, sees "You are helping Ian Patel
       (your father)" and can switch back to his own account in one
       step.
    3. A professional carer sees explicit scope: "You can read but you
       cannot send messages on behalf of this patient."

  current_solution: "No carer persona exists. All copy assumes 'you' means the person logged in IS the patient."

  pain_points:
    - "No 'You are acting for <patient>' banner on patient-reachable surfaces"
    - "No explicit permission scope rendered to carers"
    - "No quick switch between 'me' and 'the person I am helping' without re-signing in"
    - "Safety-netting wording says 'your symptoms' when the reader is a carer"

  acceptance_criteria:
    - "Every patient-reachable surface renders a 'You are acting for <patient> (<relationship>)' banner when the user is a carer"
    - "Carer-scoped surfaces list the permissions the carer has (read, message, book) with plain-language explanation"
    - "Safety-netting copy addresses the carer in second person about the patient (e.g. 'Ella should see a GP today')"
    - "Carers can return to their own account from any screen in <=2 clicks"
    - "Carer sessions are audit-logged with carer identity and patient identity separately"

  success_metrics:
    - metric: "Carer-misattribution incidents (carer thought the advice was for themselves)"
      target: "0"
      baseline: "Not measured"
    - metric: "Time to switch from carer context to own account"
      target: "<=10 seconds"
      baseline: "Not supported"

  regulatory_impact: "high"
  safety_impact: "high"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "NHS Service Standard Principle 3"
    - "Mental Capacity Act 2005 considerations for proxy access"

  related_standards:
    - "WCAG 2.1 AA"
    - "IEC 62366-1:2015"
    - "IEC 62304:2006"
    - "ISO 13485:2016"

  metadata:
    created_by: "UX redesign programme 2026-04"
    created_date: "2026-04-16"
    status: "draft"

  design_inputs: ["DI-LEO-AI-120"]
  validation_tests: []

  tags: ["carer", "proxy", "accessibility", "inclusive-design", "patient-safety", "ui-redesign"]
