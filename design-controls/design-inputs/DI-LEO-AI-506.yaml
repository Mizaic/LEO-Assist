# -- DI-LEO-AI-506 -- Universal LLM token + cost telemetry for every generation pipeline
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-506"
  type: "Functional"
  derived_from: ["UN-LEO-AI-091"]
  requirement: >
    The system SHALL emit consistent LLM cost telemetry for every
    generation pipeline that calls a large language model, using the
    same wire format already consumed by the dashboard
    LLMSpendPanel and the per-tenant billing subsystem
    (DI-LEO-AI-068). Specifically:

    (a) The shared helper ``libs.llm_client.json_helper.invoke_llm_json``
        SHALL extract input_tokens, output_tokens, cached_tokens,
        latency_ms and the model identifier from the underlying
        provider response (Bedrock or Azure OpenAI) and pass them
        to the registered tracking callback. When extraction is not
        possible (e.g. raw object missing usage_metadata), the
        helper SHALL still fire the callback with ``model_name``,
        ``provider`` and ``latency_ms`` populated and zero token
        counts so callers can detect missing telemetry.

    (b) A new utility ``libs.llm_client.usage_recorder.LLMUsageRecorder``
        SHALL provide a contextvars-based context manager that any
        orchestrator can wrap around a logical run. While active,
        every nested ``invoke_llm_json`` call SHALL be recorded into
        the active recorder. The recorder SHALL expose:
          - ``recorder.usage`` -- an ``LLMUsage`` aggregate
            (input_tokens, output_tokens, cached_tokens, calls,
            latency_ms) keyed by ``(provider, model_name)``;
          - ``recorder.cost_usd(LLMCostConfig)`` -- the rolled-up
            cost-in-pounds-equivalent (USD) for the run;
          - ``recorder.calls`` -- a list of per-call records for
            diagnostic JSON.
        The recorder SHALL be safe across nested ``async`` tasks
        (it MUST use ``contextvars.ContextVar``, not module globals).

    (c) The SBAR orchestrator
        (``services.pipeline_worker.app.services.sbar_orchestrator.SBAROrchestrator``)
        SHALL wrap each LLM-backed stage (Situation, Background,
        Recommendation) in an ``LLMUsageRecorder`` and, on
        finalisation, SHALL:
          (i)  set ``a.llm_usage_json``, ``a.llm_cost_usd``,
               ``a.llm_input_tokens``, ``a.llm_output_tokens``,
               ``a.llm_cached_tokens``, ``a.llm_model_id``,
               ``a.llm_latency_ms`` on the ``:Assessment`` node
               (matching the ``EncounterCandidate.llm_usage_json``
               pattern);
          (ii) write a ``:AuditEvent {type:'PipelineRun'}`` node
               linked to the patient with the same flat
               ``llm_input_tokens``, ``llm_output_tokens``,
               ``llm_cached_tokens``, ``llm_cost_usd``,
               ``total_duration_ms``, ``run_id``, ``patient_id``,
               ``encounter_id``, ``status``, ``step_count`` (=3),
               ``extraction_provider``, ``extraction_model_tier``,
               ``extraction_prompt_name`` and ``extraction_prompt_version``
               fields written by the coding pipeline workflow engine.

    (d) The LLM-spend Cypher query GET_PATIENT_LLM_SPEND in
        ``libs/cypher/model_config_queries.py`` SHALL be extended so
        ``:Assessment`` rows that carry ``llm_usage_json`` are
        returned alongside ``:EncounterCandidate`` rows, identified
        with ``source = 'sbar_assessment'`` so the UI can label them.
        The existing per-encounter coding rows SHALL retain
        ``source = 'coding_extraction'``.

    (e) Telemetry SHALL be emitted on a best-effort basis: a
        failure to write the ``AuditEvent`` or to set the
        ``Assessment`` properties SHALL be logged at WARNING and
        SHALL NOT cause the SBAR run to fail or roll back.

  rationale: >
    Today, ``invoke_llm_json`` calls ``track_llm_usage`` with no
    token counts and no callback registered, so SBAR runs are
    invisible to cost dashboards and to the per-tenant billing
    subsystem. Pinning the recorder to ``contextvars`` keeps the
    contract local to the orchestrator (no module-global state),
    matches the pattern already used by the coding pipeline's
    workflow engine, and means future LLM-backed features get
    cost tracking for free as long as they go through
    ``invoke_llm_json``.

  machine_spec:
    agent_prompt: |
      Wire universal LLM cost telemetry through invoke_llm_json,
      LLMUsageRecorder, and the SBAR orchestrator finalise step.

    acceptance_criteria:
      - type: "functional"
        spec: "invoke_llm_json extracts token counts from a Bedrock-style usage_metadata response and forwards them to the tracking callback"
      - type: "functional"
        spec: "invoke_llm_json forwards latency_ms, model_name, provider, and prompt_name to the callback even when usage_metadata is missing"
      - type: "functional"
        spec: "LLMUsageRecorder accumulates token counts across nested invoke_llm_json calls inside the same async context"
      - type: "functional"
        spec: "LLMUsageRecorder is isolated across concurrent asyncio tasks (recorder A must not see calls from recorder B)"
      - type: "functional"
        spec: "SBAR orchestrator writes a :AuditEvent {type:'PipelineRun'} with non-zero llm_input_tokens/llm_output_tokens/llm_cost_usd for a successful run that calls all three LLM stages"
      - type: "functional"
        spec: "SBAR orchestrator writes a.llm_usage_json on the :Assessment node and the parsed total_cost_usd matches AuditEvent llm_cost_usd within 1e-6"
      - type: "functional"
        spec: "GET_PATIENT_LLM_SPEND returns SBAR Assessment rows with source='sbar_assessment' alongside EncounterCandidate rows"
      - type: "safety"
        spec: "If AuditEvent write fails, the SBAR orchestrator logs a WARNING and still returns the SBARResult with status='completed'"

    constraints:
      - type: "performance"
        spec: "Telemetry write SHALL add no more than 50ms p95 to total SBAR run wall time"
      - type: "data-integrity"
        spec: "llm_cost_usd SHALL be rounded to 6 decimal places and SHALL NOT be negative"
      - type: "compatibility"
        spec: "Wire format for AuditEvent and for /analytics/llm-spend/patient SHALL match the coding pipeline so the UI requires no change"

    dependencies: ["DI-LEO-AI-068"]
    downstream_impacts:
      - "Dashboard LLMSpendPanel will show SBAR runs"
      - "Per-tenant billing (/pricing/orgs) will attribute SBAR cost"
      - "Episode engine and any future LLM-backed feature can opt-in by wrapping its run in LLMUsageRecorder"

    technical_details:
      language: "Python"
      framework: "FastAPI / asyncio"
      libraries: ["langchain_aws", "langchain_openai", "neo4j"]
      file_structure:
        - "libs/llm_client/json_helper.py"
        - "libs/llm_client/token_tracker.py"
        - "libs/llm_client/usage_recorder.py"
        - "libs/cypher/sbar_assessment_queries.py"
        - "libs/cypher/model_config_queries.py"
        - "services/pipeline_worker/app/services/sbar_orchestrator.py"
        - "tests/llm_client/test_invoke_llm_json_token_extraction.py"
        - "tests/llm_client/test_usage_recorder.py"
        - "tests/sbar/test_sbar_orchestrator_cost_telemetry.py"
      estimated_loc: 380

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All pytest cases in the three test files listed above pass.
      Manual review confirms a fresh SBAR run shows up in the
      LLMSpendPanel with non-zero cost.
    test_protocol: "VT-LEO-AI-508"

  safety_class: "B"
  risks: ["R-LEO-AI-506"]
  tags:
    - "observability"
    - "cost-tracking"
    - "sbar"
    - "llm"
    - "audit-event"
