# -- DI-LEO-AI-169 -- Adaptive density preference (Wave E Phase 1)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-169"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    The application SHALL surface a per-practitioner UI density preference
    (compact | comfortable | spacious), default it to "comfortable" so that
    every interactive control stays >= 40px tall, persist the chosen value
    on the Practitioner node, expose a PATCH /auth/session/density endpoint
    that validates the value, return the stored preference on
    GET /auth/session, and offer the user a toggle in /settings/preferences.
    Patient reachable routes (per isPatientReachableRoute) SHALL continue
    to force "spacious" regardless of the saved preference.
  rationale: >
    Wave D shipped a DensityProvider with localStorage only, so the
    preference vanished when a clinician moved to a shared workstation
    or a tablet trolley. UN-LEO-AI-071 calls for adaptive density stored
    on the Practitioner node so power users keep their compact view as
    they roam between devices, while inclusive defaults (comfortable)
    keep every button above the 40px target on first sign-in. A single
    canonical PATCH endpoint protects the value from drifting per device.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "GET /auth/session returns density_preference for authenticated users (string compact|comfortable|spacious or null) and the unauthenticated payload also exposes density_preference: null."
      - type: "functional"
        spec: "PATCH /auth/session/density accepts {\"density\": <tier>}, persists Practitioner.density_preference via libs.auth.density_state.set_density, returns {\"density_preference\": <tier>}, rejects unknown tiers with 400 invalid_density and missing practitioners with 404 practitioner_not_found."
      - type: "functional"
        spec: "DensityProvider in services/ui/src/context/DensityContext.tsx prefers the server preference over localStorage on staff routes, falls back to localStorage when no server preference exists, and forces spacious on patient reachable routes."
      - type: "functional"
        spec: "setDensity() PATCHes /auth/session/density when an authenticated session is present, refetches the session on success, and never blocks the localStorage write so the change is instant."
      - type: "functional"
        spec: "/settings/preferences exposes a single toggle (compact / comfortable / spacious) with plain-language helpers and an explicit notice when the current route forces spacious."
    constraints:
      - type: "safety"
        spec: "Comfortable and spacious tiers MUST keep minHeightPx >= 40 (comfortable) and >= 44 (spacious) so non-compact tiers never breach the WCAG 2.1 AA touch-target size; the compact tier is opt-in only."
      - type: "safety"
        spec: "PATCH /auth/session/density MUST require an authenticated session and MUST NOT trust client-side density values for any other practitioner."
    dependencies:
      - "DI-LEO-AI-129"
    downstream_impacts:
      - "Settings landing page now offers a Preferences card"
      - "DensityContext consumes session.densityPreference"
      - "Practitioner node gains an optional density_preference property"
    technical_details:
      language: "Python + TypeScript"
      framework: "FastAPI, Neo4j, Next.js 16, React 19"
      file_structure:
        - "libs/cypher/density_queries.py"
        - "libs/auth/density_state.py"
        - "services/api/app/routers/auth.py"
        - "services/ui/src/lib/authContext.tsx"
        - "services/ui/src/context/DensityContext.tsx"
        - "services/ui/src/app/settings/page.tsx"
        - "services/ui/src/app/settings/preferences/page.tsx"
      estimated_loc: 360

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-168 covers: pytest on libs.auth.density_state validating
      allowed/disallowed tiers and fail-soft error paths; pytest on
      services/api/app/routers/auth confirming PATCH /auth/session/density
      contract; jest on DensityProvider confirming server-preference
      precedence, patient-route override, PATCH dispatch on authenticated
      change, and no-PATCH on unauthenticated change.
    test_protocol: "VT-LEO-AI-168"

  safety_class: "B"
  risks:
    - "R-LEO-AI-168"
  tags:
    - "knowledge"
    - "design-system"
    - "inclusive-design"
    - "wave-e-phase-1"
