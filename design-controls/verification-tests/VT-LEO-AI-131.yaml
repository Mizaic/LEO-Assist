# -- VT-LEO-AI-131 -- IA merge: /admin/clinical -> /admin/knowledge
# IEC 62304 Verification Test

- id: "VT-LEO-AI-131"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-135"]
    risks: ["R-LEO-AI-093"]

  metadata:
    title: "Knowledge hub consolidation, legacy redirects and URL audit"
    description: >
      Verifies that the 8-tab /admin/knowledge page is the sole admin
      reference hub, that every legacy /admin/clinical* and standalone
      /admin/pathways, /admin/domains, /admin/terminology URL is a
      permanent redirect to the matching /admin/knowledge?tab=<k>, and
      that no source file under src/ carries a hardcoded
      /admin/clinical target.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/admin-url-audit.test.ts"
      - "services/ui/src/__tests__/knowledge-hub-merge.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-131-TC-001"
      case_name: "Knowledge page exposes all 8 tabs in the canonical order"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Render /admin/knowledge and read the tab keys from the
            exported TABS constant in services/ui/src/app/admin/knowledge/page.tsx.
          expected_result: >
            Tabs are exactly [training-data, surface-forms, context-rules,
            ai-instructions, clinical-guidelines, pathways, domains,
            terminology] in that order.
          verification_method: "automated"
      acceptance_criteria:
        - "Tab list length == 8"
        - "Tab order matches DI-LEO-AI-135 spec"

    - case_id: "VT-131-TC-002"
      case_name: "Legacy /admin/clinical URLs redirect permanently to /admin/knowledge"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Import services/ui/next.config.mjs and inspect the redirects
            array for entries matching /admin/clinical, /admin/clinical?
            variants, /admin/pathways, /admin/domains, /admin/terminology.
          expected_result: >
            Every legacy source maps to /admin/knowledge?tab=<k> with
            permanent: true.
          verification_method: "automated"
      acceptance_criteria:
        - "Redirect exists for /admin/clinical"
        - "Redirect exists for /admin/pathways, /admin/domains, /admin/terminology"
        - "permanent flag is true on all merge redirects"

    - case_id: "VT-131-TC-003"
      case_name: "AppShell ADMIN_NAV_ITEMS no longer contains a Clinical item"
      priority: "high"
      test_steps:
        - step_number: 1
          action: >
            Parse services/ui/src/components/AppShell.tsx and locate
            ADMIN_NAV_ITEMS.
          expected_result: >
            No entry has label "Clinical"; the Knowledge entry's
            activePrefix covers /admin/clinical, /admin/pathways,
            /admin/domains, /admin/terminology.
          verification_method: "automated"
      acceptance_criteria:
        - "ADMIN_NAV_ITEMS has 8 entries"
        - "No nav item labelled Clinical"
        - "Knowledge activePrefix covers legacy paths"

    - case_id: "VT-131-TC-004"
      case_name: "Admin URL audit forbids /admin/clinical reintroduction"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Run admin-url-audit.test.ts. DEPRECATED_PATTERNS includes
            '"/admin/clinical"'.
          expected_result: >
            Test reports 0 violations across src/.
          verification_method: "automated"
      acceptance_criteria:
        - "admin-url-audit test passes"
        - "No file in src/ contains a hardcoded /admin/clinical string"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-131/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-131-EXEC-001"
      executed_at: "2026-04-17"
      executed_by: "phase-2-ia-merge"
      environment: "development"
      result: "pass"
      notes: >
        jest src/__tests__/knowledge-hub-merge.test.ts -> 10 passed.
        jest src/__tests__/admin-url-audit.test.ts -> 1 passed (zero
        deprecated-URL violations). Turbopack dev server: GET
        /admin/clinical -> 308 /admin/knowledge; GET
        /admin/clinical?tab=terminology -> 308
        /admin/knowledge?tab=terminology; GET /admin/pathways -> 308
        /admin/knowledge?tab=pathways; GET /admin/domains -> 308
        /admin/knowledge?tab=domains; GET /admin/terminology -> 308
        /admin/knowledge?tab=terminology; GET /admin/knowledge -> 200.
