# -- UN-LEO-AI-092 -- Tunable per-context SBAR Situation framing
# IEC 62366 / ISO 13485 User Need

- id: "UN-LEO-AI-092"
  title: "Platform admins can tune the per-context SBAR Situation framing without engineering"
  description: >
    The SBAR pipeline picks a framing snippet for the Situation prompt
    based on the SummarisationContext the clinician chose (clinic
    appointment prep, ED handover, palliative care MDT, etc.).
    Today those snippets are hardcoded in libs/sbar/events.py and a
    code change + deploy is required to adjust the wording for any
    context. As LEO is rolled out across primary, secondary and
    statutory settings, platform admins need to refine the wording
    iteratively (with QA and clinical input) without an engineering
    round-trip. The snippets MUST be editable through the existing
    /admin/knowledge?tab=ai-instructions surface, with the same audit
    trail and rollback semantics as every other PromptConfig.

  stakeholder: "Platform Administrator (with QA / clinical input)"
  priority: "high"

  rationale: >
    Wording matters for safety. A primary-care MDT framing emphasises
    GP follow-up actions; a cancer MDT framing emphasises stage and
    performance status; an ED handover framing emphasises what the
    admitting team must do next. Engineers should not be the ones
    choosing those words. Letting the admin role tune the snippet at
    runtime closes the iteration loop and keeps the contract surface
    (the SummarisationContext enum and its display labels) stable.

  acceptance_criteria:
    - "Every SummarisationContext value has a PromptConfig node in Neo4j named sbar_situation_context_<value> v1 that an admin can edit at /admin/knowledge?tab=ai-instructions"
    - "Each PromptConfig description carries a [<Group>] prefix (Primary care / Secondary care / Statutory and social / Quality assurance) so the AI Instructions list groups them visibly"
    - "When the orchestrator runs an SBAR for a given context, it resolves the snippet from the matching PromptConfig with the hardcoded events.SUMMARISATION_CONTEXT_PROMPTS dict as a safe fallback"
    - "Edits made via the admin UI persist across SBAR runs (PromptConfig source is set to 'user' so re-seeding does not overwrite)"
    - "The AI Instructions list visually distinguishes 'Summarisation context' rows from 'Extraction', 'Verification', etc."
    - "Page passes WCAG 2.1 AA on the chrome (no new violations introduced)"

  design_inputs:
    - "DI-LEO-AI-507"

  metadata:
    identified_by: "Conversation 2026-04-19 (secondary-care expansion of SBAR contexts)"
    identified_date: "2026-04-19"
    status: "approved"
    tags:
      - "sbar"
      - "ai-instructions"
      - "admin"
      - "summarisation-context"
