- id: "VT-LEO-AI-110"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-110"]
    risks: ["R-LEO-AI-075", "R-LEO-AI-076"]

  metadata:
    title: "Pathway Explorer UI components static verification"
    description: >
      Verifies the Pathway Explorer frontend via static source-file analysis.
      Checks: all component files exist; no algorithm jargon appears in
      user-facing JSX text; MissionCard has ARIA attributes and keyboard
      support; data-gated missions show Coming soon and prevent clicks;
      HeadlineResult has role=status and aria-live=polite; ScopingWizard
      implements three-question structure; ResultsTable has column header
      mapping and export; AppShell includes Pathway Explorer nav item;
      PersonaLensToggle exposes three lenses; MethodExplainer is collapsible.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathway-explorer-static.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "Node.js 20 and project dependencies installed (npm install)"
      - "Jest configured in services/ui/package.json"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-110-TC-001"
      case_name: "All research component files exist"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert each expected file path exists in components/research/ and lib/"
          expected_result: "All 13 listed files exist on disk"
          verification_method: "automated"
      acceptance_criteria:
        - "All 13 source files exist including page.tsx and researchApi.ts"

    - case_id: "VT-110-TC-002"
      case_name: "No algorithm jargon in user-facing JSX text"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Scan JSX text nodes in each user-facing component for banned terms:
            betweenness, centrality, leiden, pagerank, jaccard, cosine, knn,
            wcc, scc, fastrp, graphsage, node2vec
          expected_result: "No banned terms appear in JSX text nodes"
          verification_method: "automated"
      acceptance_criteria:
        - "Zero occurrences of banned algorithm terms in user-facing JSX text"

    - case_id: "VT-110-TC-003"
      case_name: "MissionCard accessibility attributes"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert MissionCard uses aria-label, handles Enter/Space keys, uses aria-disabled"
          expected_result: "All three assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "MissionCard has aria-label"
        - "MissionCard responds to keyboard Enter and Space events"
        - "MissionCard applies aria-disabled for locked/gated missions"

    - case_id: "VT-110-TC-004"
      case_name: "HeadlineResult ARIA live region"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert HeadlineResult has role=status and aria-live=polite, and handles loading/error/unavailable states"
          expected_result: "All five assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - 'role="status" present'
        - 'aria-live="polite" present'
        - "Loading state rendered"
        - "Error state rendered"
        - "Data unavailable state rendered"

    - case_id: "VT-110-TC-005"
      case_name: "Data-gated mission UX shows Coming soon"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert MissionCard renders Coming soon text and prevents click for locked missions"
          expected_result: "Both assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Coming soon text present in component"
        - "Click prevention logic tied to isLocked/data_available"

    - case_id: "VT-110-TC-006"
      case_name: "ScopingWizard three-question structure"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert ScopingWizard references area, time period, and detail level questions"
          expected_result: "All three question types present"
          verification_method: "automated"
      acceptance_criteria:
        - "Area/pathway question present"
        - "Time period question present"
        - "Detail level question present"
        - "MUI Dialog used"
        - "ToggleButtonGroup used for selections"

    - case_id: "VT-110-TC-007"
      case_name: "ResultsTable plain-English column headers and export"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert ResultsTable has column header mapping, export button, and sorting"
          expected_result: "All three assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Column header humanisation/mapping function exists"
        - "Export/download button present"
        - "Sort functionality present"

    - case_id: "VT-110-TC-008"
      case_name: "AppShell includes Pathway Explorer navigation"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Assert AppShell.tsx contains pathway-explorer route and label"
          expected_result: "Both assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "pathway-explorer route present in AppShell"
        - "Pathway Explorer label present"

    - case_id: "VT-110-TC-009"
      case_name: "PersonaLensToggle three lenses"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert PersonaLensToggle references Patients, Pathways, Capacity, and ToggleButtonGroup"
          expected_result: "All four assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Patients lens present"
        - "Pathways lens present"
        - "Capacity lens present"
        - "ToggleButtonGroup used"

    - case_id: "VT-110-TC-010"
      case_name: "MethodExplainer collapsible pattern"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Assert MethodExplainer has toggle button, plain explanation, and technical note"
          expected_result: "All three assertions pass"
          verification_method: "automated"
      acceptance_criteria:
        - "Toggle/expand button present"
        - "Plain explanation text present"
        - "Technical note section present"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-110/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-110-EXEC-001"
      date: "2026-04-15"
      executor: "jest (automated CI)"
      environment: "development"
      result: "pass"
      notes: >
        49 test assertions across 10 test suites, all passing.
        Test file: services/ui/src/__tests__/pathway-explorer-static.test.ts.
        Covers file existence, plain-English compliance (jargon scan across
        8 user-facing components), MissionCard a11y, HeadlineResult ARIA,
        data-gated UX, ScopingWizard structure, ResultsTable, AppShell nav,
        PersonaLensToggle, and MethodExplainer.
      pass_count: 49
      fail_count: 0
