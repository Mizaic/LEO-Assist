# -- VT-LEO-AI-519 -- Drawer encounter search: shared relevance utility + match rationale chips
# IEC 62304 Verification Test

- id: "VT-LEO-AI-519"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs:
      - "DI-LEO-AI-520"
    risks:
      - "R-LEO-AI-063"
      - "R-LEO-AI-174"

  metadata:
    title: "encounterRelevance utility + applyCommonFilters rewire + EncounterCard chip integration"
    description: >
      Static-source verification per ui-testing.mdc. Confirms the
      new shared encounterRelevance.ts module mirrors the server's
      deterministic query understanding (typo + synonym + match
      rationale), that applyCommonFilters delegates to the shared
      expansion helpers instead of doing a bare substring match,
      and that EncounterCard renders the match-rationale chip row
      and feeds synonym hits into the highlighter when the
      reviewer has typed a query that matches at least one
      configured synonym group.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/encounter-search-relevance-chrome.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui jest harness (jest 30 + ts-jest)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-519-TC-001"
      case_name: "encounterRelevance.ts exports the documented surface"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/mission-control/encounterRelevance.ts"
          expected_result: "Source contains `export function expandSearchTerms`, `export function computeMatchRationale`, and `export function hasAnyExpandedHit` and exports the `MatchRationale` interface"
          verification_method: "automated"

    - case_id: "VT-519-TC-002"
      case_name: "Module mirrors the server's TYPO_MAP and SYNONYM_MAP entries"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read encounterRelevance.ts"
          expected_result: "Source declares TYPO_MAP with breat -> breast, wight -> weight, lums -> lumps, tumor -> tumour, AND SYNONYM_MAP entries for breast, lump, weight, loss, cough, bleeding (matching the server's _SYNONYM_MAP)"
          verification_method: "automated"

    - case_id: "VT-519-TC-003"
      case_name: "expandSearchTerms applies typo correction before synonym expansion"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read encounterRelevance.ts"
          expected_result: "normaliseTokens helper applies TYPO_MAP[tok] BEFORE the MIN_TERM_LEN filter, and expandSearchTerms looks up SYNONYM_MAP[tok] AFTER calling normaliseTokens"
          verification_method: "automated"

    - case_id: "VT-519-TC-004"
      case_name: "expandSearchTerms returns empty list for blank query and respects the 12-token / 36-expansion caps"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read encounterRelevance.ts"
          expected_result: "Source has an early-return for empty query (`if (!query) return []`), declares MAX_TERMS = 12 and MAX_EXPANDED = MAX_TERMS * 3, and slices/breaks at MAX_TERMS for input tokens and MAX_EXPANDED for output terms"
          verification_method: "automated"

    - case_id: "VT-519-TC-005"
      case_name: "computeMatchRationale matches the server feature_match_rationale shape and 8-hit cap"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read encounterRelevance.ts"
          expected_result: "computeMatchRationale returns the 3-key MatchRationale shape (termHits / hitTerms / termCoverage), short-circuits to a zeroed result when expandedTerms is empty or text is null, slices hitTerms at 8, and computes termCoverage as hits / max(1, expandedTerms.length)"
          verification_method: "automated"

    - case_id: "VT-519-TC-006"
      case_name: "applyCommonFilters delegates to expandSearchTerms + hasAnyExpandedHit"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/mission-control/encounterFilters.ts"
          expected_result: "Source imports expandSearchTerms and hasAnyExpandedHit from `./encounterRelevance`, computes `const expandedTerms = expandSearchTerms(args.search)`, and uses `hasAnyExpandedHit(e.text, expandedTerms)` instead of a bare `text.toLowerCase().includes(query.toLowerCase())`"
          verification_method: "automated"

    - case_id: "VT-519-TC-007"
      case_name: "EncounterCard wires expanded terms into rationale chips and the highlighter"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/mission-control/EncounterCard.tsx"
          expected_result: "Source imports computeMatchRationale and expandSearchTerms from ./encounterRelevance, computes expandedTerms + matchRationale via useMemo, and calls collectHighlightTerms(search, matchRationale.hitTerms) so the amber highlighter paints synonyms"
          verification_method: "automated"

    - case_id: "VT-519-TC-008"
      case_name: "EncounterCard renders the match-rationale chip row capped at 4 chips"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read EncounterCard.tsx"
          expected_result: "Source declares `showRationaleChips = expandedTerms.length > 0 && matchRationale.hitTerms.length > 0`, conditionally renders a container with data-testid `encounter-card-match-rationale`, and maps `matchRationale.hitTerms.slice(0, 4)` to outlined Chip elements with data-testid `encounter-card-match-rationale-chip`, height 20 and fontSize 0.65rem"
          verification_method: "automated"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-519/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-519-EXEC-001"
      timestamp: "2026-04-19T12:35:00Z"
      executor: "Rob Smith (developer)"
      result: "pass"
      notes: >
        8 cases pass under jest 30 + ts-jest in 0.56s. Wider
        regression sweep across all encounter / mission-control /
        drawer suites: 151 tests across 16 suites, all green.
        Confirms that lifting the deterministic query understanding
        to the drawer (typo + synonym + match rationale) does not
        regress the row template (VT-LEO-AI-512), the timeline
        wrapper (VT-LEO-AI-515), the preview wrapper (VT-LEO-AI-214),
        or the patient-detail scrubber (VT-LEO-AI-173).
