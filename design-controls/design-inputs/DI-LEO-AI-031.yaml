# -- DI-LEO-AI-031 -- FHIR R4 Resource Endpoints
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-031"
  type: "Interface"
  derived_from: ["UN-LEO-AI-022"]
  requirement: "The system SHALL expose FHIR R4 compliant REST endpoints for Measure, MeasureReport, Library, and Device resources supporting CRUD operations and conforming to UK Core profiles"
  rationale: "FHIR R4 is the NHS interoperability standard. Exposing audit programme definitions and results as FHIR resources enables integration with NHS Digital infrastructure and other audit tools."

  machine_spec:
    agent_prompt: |
      Implement FHIR R4 resource endpoints (~250 LOC).

      SINGLE PURPOSE: Expose FHIR R4 compliant REST endpoints
      for Measure, MeasureReport, Library, and Device resources
      with full CRUD support.

      REQUIREMENTS:
      1. Measure endpoint: create, read, update, delete, search
      2. MeasureReport endpoint: create, read, search, export
      3. Library endpoint: create, read, update, search
      4. Device endpoint: create, read, update, search
      5. All resources conform to UK Core FHIR profiles
      6. Standard FHIR search parameters supported per resource
      7. JSON and XML content negotiation

      METHODS:
      - POST /fhir/Measure: Create new Measure resource
      - GET /fhir/Measure/{id}: Read Measure by ID
      - PUT /fhir/Measure/{id}: Update existing Measure
      - DELETE /fhir/Measure/{id}: Delete Measure
      - GET /fhir/Measure?params: Search Measures
      - (Same pattern for MeasureReport, Library, Device)

      CODE CLARITY:
      - Each resource type in its own router module
      - FHIR validation middleware applied to all endpoints
      - OperationOutcome returned for all errors

    acceptance_criteria:
      - type: "test"
        spec: "FHIR endpoints conform to R4 specification"
      - type: "test"
        spec: "UK Core profile validation passes for all resources"
      - type: "test"
        spec: "CRUD operations work correctly for all four resource types"

    constraints:
      - type: "regulatory"
        spec: "Must conform to FHIR R4 and UK Core profiles"
      - type: "code_quality"
        spec: "One router module per resource type"

    dependencies: []

    downstream_impacts:
      - "DI-LEO-AI-032 -- Measure evaluation depends on Measure endpoints"
      - "services/fhir_api -- all FHIR resource endpoints hosted here"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "services/fhir_api/app/routers/measure.py"
        - "services/fhir_api/app/routers/measure_report.py"
        - "services/fhir_api/app/routers/library.py"
        - "services/fhir_api/app/routers/device.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "FHIR endpoints conform to R4 specification; UK Core profile validation passes; CRUD operations work correctly"
    test_protocol: "VT-LEO-AI-031"

  safety_class: "A"
  risks: []
  tags: ["fhir", "interoperability", "api", "nhs-digital"]
