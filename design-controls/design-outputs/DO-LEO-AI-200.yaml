# -- DO-LEO-AI-200 -- Narrative-reference referral guard implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-200"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-202"
    user_needs:
      - "UN-LEO-AI-005"
      - "UN-LEO-AI-006"
    risks_addressed:
      - "R-LEO-AI-192"
    verification_tests:
      - "VT-LEO-AI-195"

  specification:
    title: "Narrative-reference referral guard: suppress text_generic referrals when only commentary about a past referral exists"
    description: |
      Adds two new compiled regex constants in
      anchor_detector.py:

        - _RE_NARRATIVE_REFERRAL_REFERENCE: matches DNA,
          past-tense, and discussion-of-past-referral
          patterns ("previously positive FIT", "had a
          previous 2WW", "did not attend", "DNA'd",
          "explained the 2WW referral", "patient
          declined").

        - _RE_STRUCTURAL_REFERRAL: matches structural
          referral artefacts (XaY59 outbound referral,
          Hospital Fast track referral, PRISM Pathway
          Accessed, "Refer via 2WW", an explicit
          "Fast track referral for suspected" prefix).

      In _classify_text_encounters, the text_generic
      referral fallback is now suppressed when
      _RE_NARRATIVE_REFERRAL_REFERENCE matches AND
      _RE_STRUCTURAL_REFERRAL does not. PRISM, Read-code,
      and rejection subtypes are unaffected.

    acceptance_criteria:
      - criterion: "dna_narrative_does_not_emit_referral"
        type: "safety"
        measurement: "Test"
        target: "Encounter text 'Noted missed 2WW LGI appt due to transport / mobility issues. Repeat FIT test sent & requested 2WW referral again' MUST NOT add a text_generic referral"
      - criterion: "explained_referral_was_rejected_does_not_emit_referral"
        type: "safety"
        measurement: "Test"
        target: "Encounter text 'Explained 2WW referral requested again but got rejected as they needed new FIT test result' MUST NOT add a text_generic referral"
      - criterion: "narrative_with_structural_cue_keeps_referral"
        type: "functional"
        measurement: "Test"
        target: "Encounter text 'Refer via 2WW LGI pathway. Outbound referral (XaY59) PRISM 2WW Lower GI Pathway Accessed.' MUST keep at least one referral anchor"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_NARRATIVE_REFERRAL_REFERENCE, _RE_STRUCTURAL_REFERRAL, suppression logic in _classify_text_encounters (~line 1046)"
      - artifact_type: "test_code"
        location: "tests/test_patient_4643293950_patterns.py"
        description: "TestPatternCDNarrativeReferralGuard"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 50
      key_functions:
        - "_RE_NARRATIVE_REFERRAL_REFERENCE"
        - "_RE_STRUCTURAL_REFERRAL"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Referral subtype classification on uncoded text encounters"
    risk_control_measures:
      - "Structural artefact list is the source of truth -- a referral exists only if a Read code, PRISM stub, or explicit 'Refer via' phrase is present"
      - "PRISM, Read-code, and rejection subtypes are deliberately excluded from suppression (those have their own evidence chain)"

  verification_status:
    verification_method: "Test"
    verification_complete: true
