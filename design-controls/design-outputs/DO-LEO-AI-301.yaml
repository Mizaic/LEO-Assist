  specification:
    title: "NHS ICD-10 5th Edition XML loader, TRUD package wiring, schema, and UI surfacing"
    description: |
      A new loader module ingests the NHS ICD-10 5th Edition XML
      release (TRUD pack 28, item 259) and writes Icd10Code nodes
      with title, chapter, block, age range, sex constraint and
      edition, plus IS_A parent edges for the chapter -> block ->
      category -> code hierarchy. The loader uses the existing
      `BatchWriter` helper, MERGEs on `code`, and is idempotent.

      Surrounding wiring:

        - `file_finder.py` gains an `Icd10Files` class that locates
          the extracted XML in `external_content/trud-nhs-icd10/`
          (date-stamped subdirectories handled by glob).
        - `schema.py` gains an index on `Icd10Code.level` so the
          chapter / block / category / code partitions can be
          queried efficiently.
        - `run_all.py` gains a phase 6 that runs the ICD-10 loader.
        - `trud_sync.py` gains an `icd10` package entry pointing at
          item 259 with phases {6}, plus a freshness comparator
          modelled on the existing SNOMED comparator.
        - `services/api/app/services/trud_sync.py::get_neo4j_counts`
          gains an `icd10_codes` count.
        - `services/api/app/models/neo4j_schema.py` updates the
          three TERMINOLOGY_SEARCH variants to also collect
          `icd.title` so the API returns titled ICD-10 to the UI.
        - `services/ui/src/lib/types.ts` and `lib/api/legacy.ts`
          gain an `icd10_term?: string` field on the term search
          result.
        - `services/ui/src/components/TermSearch.tsx` and
          `services/ui/src/app/settings/surface-forms/page.tsx`
          render the title alongside the bare code when present.
        - `services/ui/src/app/settings/terminology/page.tsx` adds
          the `icd10` package card and the `icd10_codes` stat tile.

    acceptance_criteria:
      - criterion: "Loader is idempotent on rerun"
        type: "functional"
        measurement: "Test"
        target: "Running the loader twice against the same fixture XML produces identical node and edge counts"
      - criterion: "Loader sets titles on bare nodes"
        type: "functional"
        measurement: "Test"
        target: "Pre-seeding the test graph with bare Icd10Code nodes (no title) and running the loader leaves the same node count but with titles set"
      - criterion: "IS_A hierarchy is created"
        type: "functional"
        measurement: "Test"
        target: "Every 4-character code reaches its chapter via two IS_A hops (code -> category -> block -> chapter)"
      - criterion: "TRUD package surfaces in the Settings page"
        type: "functional"
        measurement: "Test"
        target: "Settings -- Terminology page renders an `icd10` PackageCard alongside `snomed` and `dmd`, and renders the `icd10_codes` StatTile"
      - criterion: "TermSearch surfaces the ICD-10 title when present"
        type: "functional"
        measurement: "Test"
        target: "TermSearch row text reads `ICD-10: I50.0 Congestive heart failure` when `icd10_term` is populated, and falls back to `ICD-10: I50.0` when not"

