# -- UN-LEO-AI-067 -- Trainee / junior staff user experience
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-067"
  title: "Junior clinical and coding staff can complete audit, coding review, and pathway tasks on LEO without prior product training by leaning on in-product explanation and guided onboarding"
  description: |
    A large share of real LEO users are new staff: medical students,
    F1/F2 doctors, practice nurses in their first year, trainee coders,
    and apprentices. Their needs are different from experienced
    clinicians. They are efficient if the product explains why they
    are here, what each thing does, and what will happen next. They
    are unsafe if the product assumes mastery.

    Existing user needs assume a "clinical audit lead" or "coding
    specialist" persona. There is no explicit design input anywhere
    requiring explanation patterns, onboarding tours, or progressive
    reveal. This UN creates that requirement.

  stakeholder:
    type: "internal_user"
    role: "Junior clinician / trainee coder / practice apprentice"
    organization: "LEO subscribing primary care organisations"

  priority: "MUST"

  rationale: |
    Junior staff who make coding or safety-netting decisions without
    understanding the tool are a safety risk. Heavy training is not a
    scalable mitigation. In-product explanation is. A dedicated persona
    forces every screen redesign to answer Why am I here, How do I
    work this, What will happen next, and to expose guided tours and a
    glossary without cluttering the experienced user's view.

  benefit: "New staff reach safe-first-use without shadowing. Training burden on senior staff drops. Coding decisions by juniors are as safe as by experienced staff."

  use_case: |
    1. A new trainee opens the Audit page for the first time, sees a
       PageIntro explaining why it exists, a 'Start tour' button, and
       tooltips on every filter.
    2. A junior nurse reviewing a coding candidate can click any
       clinical term and see a plain-language definition inline.
    3. An apprentice coder using the pathway explorer sees coach marks
       the first time they enter, then never again.

  current_solution: "Onboarding happens via shadowing and paper docs. No tours, no inline glossary, no PageIntro, no progressive reveal."

  pain_points:
    - "No PageIntro on any screen; juniors do not know what the screen is for"
    - "No inline glossary for clinical terms"
    - "No coach marks or tours"
    - "Feature-dense screens (e.g. pathways/[id]) overwhelm new users"
    - "No per-persona onboarding tour"
    - "No 'learn more' affordance beside complex controls"

  acceptance_criteria:
    - "Every redesigned screen has a PageIntro component answering Why, How, What"
    - "Every clinical term on a junior-reachable screen has a GlossaryTerm affordance"
    - "Every persona has a first-use onboarding tour (coach marks) that can be replayed from Settings"
    - "Tours are dismissible without loss of data"
    - "Complex screens use ProgressiveReveal so advanced controls are hidden by default"
    - "Onboarding state is persisted per user so tours never repeat unless replayed"

  success_metrics:
    - metric: "Median time for a new staff member to complete their first audit review task"
      target: "<=10 minutes without human assistance"
      baseline: "Not measured"
    - metric: "Percentage of first-time tours completed"
      target: ">=70%"
      baseline: "Not measured"
    - metric: "Help ticket volume from users <30 days tenure"
      target: "25% reduction vs baseline"
      baseline: "Not measured"

  regulatory_impact: "medium"
  safety_impact: "high"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1"
    - "IEC 62366-1:2015 usability engineering file"

  related_standards:
    - "IEC 62366-1:2015"
    - "WCAG 2.1 AA"
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "ISO 14971:2019"

