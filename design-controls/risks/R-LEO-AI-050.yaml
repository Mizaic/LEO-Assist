# -- R-LEO-AI-050 -- Incorrect Surface Form Mapping Propagates to Future Encounters
# ISO 14971 Risk

- id: "R-LEO-AI-050"
  title: "An incorrect reusable surface form mapping is approved by a single reviewer and systematically miscodes all future encounters with the same phrase."

  hazard:
    description: >
      A reviewer resolves a CodingReview with an incorrect concept (perhaps
      a plausible but wrong SNOMED code). If the system immediately creates
      a MAPS_TO relationship from this single decision, every future encounter
      containing the same phrase will be coded with the wrong concept, without
      any further human review.
    category: "clinical_safety"

  hazardous_situation: >
    Reviewer A resolves a CodingReview for phrase "chest tightness" with
    SNOMED code for "anxiety" instead of "angina". The system creates a
    MAPS_TO immediately. All subsequent encounters containing "chest tightness"
    are auto-coded as anxiety. Patients with cardiac symptoms are miscoded
    for weeks until the next audit detects the pattern.

  harm:
    description: >
      Systematic miscoding of a clinical phrase causes incorrect SNOMED codes
      in multiple patient records. Patients with the phrase may receive wrong
      clinical decisions, incorrect pathway routing, or be missed by QOF
      searches for the correct condition.
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 3
    detectability: 3
    rpn: 27
    risk_level: "high"

  mitigation_measures:
    - control_type: "design_feature"
      description: >
        Two-reviewer gate: Stream B creates a pending SurfaceFormTask instead
        of a MAPS_TO relationship. MAPS_TO is only created when a second
        reviewer explicitly approves the SurfaceFormTask via the resolve
        endpoint. No single reviewer can create a reusable mapping.
      implemented_by: ["DI-LEO-AI-075"]
      verified_by: ["VT-LEO-AI-075"]
    - control_type: "design_feature"
      description: >
        Individual record fix is immediate (the CodingReview is resolved for
        that one encounter). Only the reusable mapping waits for second
        approval. This separates single-record correction from system-wide
        dictionary change.
      implemented_by: ["DI-LEO-AI-075"]
      verified_by: ["VT-LEO-AI-075"]
    - control_type: "design_feature"
      description: >
        Surface form revocation endpoint (Loop 2) allows rapid rollback of
        an incorrect approved mapping, with cascade CodingReview for affected
        encounters. use_count tracking shows how many encounters have been
        affected since first_used_at.
      implemented_by: ["DI-LEO-AI-076"]
      verified_by: ["VT-LEO-AI-076"]

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 2
    rpn: 6
    risk_level: "low"
    acceptability: "acceptable"
    justification: >
      Two-reviewer gate eliminates single-point-of-failure in dictionary
      curation. Even if both reviewers agree on an incorrect mapping,
      the weekly audit will detect systematic miscoding within one cycle,
      and the revocation endpoint allows rapid correction with cascade review
      for all affected encounters.

  monitoring:
    monitoring_plan: >
      Track MAPS_TO creation events: confirm all have two reviewer identities.
      Track revocation events monthly. Review surface form task resolution
      time. Audit surface form impact (use_count growth) quarterly.
    metrics:
      - "maps_to_single_reviewer_count: must be zero (audit enforcement)"
      - "surface_form_revocation_count: track monthly; non-zero requires investigation"
      - "mean_surface_form_review_days: target < 5 days from SurfaceFormTask creation"
    review_frequency: "Monthly"

  metadata:
    identified_by: "Three Learning Loops Production Plan v3.0 (CSO-001)"
    identified_date: "2026-04-03"
    status: "analyzed"
    tags: ["loop2", "surface-forms", "two-reviewer-gate", "clinical-safety", "terminology"]
