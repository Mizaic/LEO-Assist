  specification:
    title: "Pathways admin list rebuilt on the design-system"
    description: |
      Wave E Phase 6 splits the previous 815 LOC monolith into
      four sibling modules under
      services/ui/src/app/admin/pathways/:

        - page.tsx -- slim orchestrator with StatHero + SegmentedTabs
          + ToolbarActions chrome and a Stack of PathwayCards.
          Owns all state and dialog handlers.
        - PathwayCard.tsx -- presentational card on the canonical
          12px / 18px / 3px-accent / motion-stagger pattern.
        - dialogs.tsx -- NewPathwayDialog (template picker),
          PublishDialog (with optional version notes),
          DeletePathwayDialog (with type-the-name confirm gate).
        - templates.ts -- PATHWAY_TEMPLATES catalogue (blank,
          extraction-only, extraction-verify-persist,
          training-audit) + PathwayTemplate type.
        - types.ts -- shared PlanDefinition shape.

      The detail-page editor
      (services/ui/src/app/admin/pathways/[id]/page.tsx) is
      explicitly out of scope for this DO and is deferred to a
      dedicated session.
    acceptance_criteria:
      - criterion: "Imports + module split"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-001 passes"
      - criterion: "Legacy custom h5 header removed"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-002 passes"
      - criterion: "FHIR + routing handlers preserved"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-003 passes"
      - criterion: "SegmentedTabs API correctness"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-004 passes"
      - criterion: "Single primary action"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-005 passes"
      - criterion: "Canonical stat tiles"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-006 passes"
      - criterion: "PathwayCard token alignment"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-007 passes"
      - criterion: "Full per-card action surface"
        type: "functional"
        measurement: "Test"
        target: "VT-LEO-AI-151 TC-008 passes"
      - criterion: "Dialog exports + delete-name-gate"
