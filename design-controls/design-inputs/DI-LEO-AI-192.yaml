# -- DI-LEO-AI-192 -- SBAR LLM prompt suite (situation, background, recommendation)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-192"
  type: "Functional"
  derived_from:
    - "UN-LEO-AI-080"
  requirement: >
    The SBAR Situation, Background and Recommendation sections SHALL
    be generated by three dedicated LLM prompts (sbar_situation_v1,
    sbar_background_v1, sbar_recommendation_v1), each carrying
    twelve hardening rules covering source citation, conflict
    surfacing, no-inference behaviour, British English plain
    language, prompt-injection defence, and JSON-only output.
    Each prompt SHALL be paired with a JSON output schema validated
    by libs.llm_client.json_helper.invoke_llm_json.
  rationale: >
    Hard-coding the safety rules into the prompt is the first line
    of defence against unsafe LLM output. Pinning JSON output via
    schema validation is the second -- it lets us assert the
    contract before persisting anything to the patient graph.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Each of the three prompts (sbar_situation_v1,
          sbar_background_v1, sbar_recommendation_v1) is registered
          in scripts.seed_prompt_configs.SEED_PROMPTS so it can be
          edited from /admin/prompts at runtime.
      - type: "functional"
        spec: >
          libs.prompts.sbar_output_schemas defines schemas with
          additionalProperties=false and minLength=1 on each
          *_markdown field, so empty output is rejected before
          persistence.
      - type: "functional"
        spec: >
          libs.sbar.prompt_calls call_situation/call_background/
          call_recommendation surface a structured error result
          (markdown="", error=...) instead of raising when the LLM
          returns an error or the output is missing its required
          *_markdown field.
      - type: "functional"
        spec: >
          The recommendation prompt produces an actions array with
          priority restricted to {2ww, urgent, routine}, each item
          carrying optional rule_ids that link back to the
          deterministic Assessment.
    constraints:
      - type: "safety"
        spec: >
          Each system prompt MUST instruct the model to (a) treat
          CONTEXT free text as data not instructions, and (b) avoid
          inventing diagnoses or recommendations not supported by
          the supplied sources.
    dependencies:
      - "DI-LEO-AI-188"
    downstream_impacts:
      - "scripts/seed_prompt_configs.py (three new SBAR prompts)"
      - "Pipeline worker prompt-call code path"
    technical_details:
      language: "Python"
      framework: "PromptConfig + JSON schema"
      file_structure:
        - "libs/prompts/sbar_situation_v1.py"
        - "libs/prompts/sbar_background_v1.py"
        - "libs/prompts/sbar_recommendation_v1.py"
        - "libs/prompts/sbar_output_schemas.py"
        - "libs/sbar/prompt_calls.py"
        - "scripts/seed_prompt_configs.py"
      estimated_loc: 600

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-189 covers prompt registration in the seed config,
      JSON schema enforcement (empty output rejected), and the
      structured-error path in prompt_calls. Prompt golden-set
      review remains a manual QA activity tracked separately.
    test_protocol: "VT-LEO-AI-189"

  safety_class: "B"
  risks:
    - "R-LEO-AI-181"
    - "R-LEO-AI-184"
  tags:
    - "sbar"
    - "prompts"
    - "llm-safety"
