# -- DO-LEO-AI-501 -- Episode Engine: Segmenter Agent Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-501"
  version: "1.0.0"
  type: "Algorithm"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-501"]
    user_needs: ["UN-LEO-AI-090"]
    risks_addressed: ["R-LEO-AI-501"]
    verification_tests: ["VT-LEO-AI-501"]

  specification:
    title: "Episode Engine Segmenter Agent"
    description: |
      Bedrock Claude Haiku call that splits the patient's
      timeline_text into CandidateWindow records via a forced
      ``submit_windows`` tool. Returned JSON is validated by the
      SegmenterResult Pydantic model; failures raise StageError so
      the chain can fail-soft per patient without corrupting the
      output of other patients in a cohort run.
    acceptance_criteria:
      - criterion: "Forced JSON output"
        type: "functional"
        measurement: "Unit test - tool_config inspection"
        target: "tool_config.toolChoice = {tool: {name: 'submit_windows'}}"
      - criterion: "Schema-violation behaviour"
        type: "safety"
        measurement: "Unit test"
        target: "Bad date / unknown literal raises StageError; chain records failed StageTrace"
      - criterion: "Provider-error behaviour"
        type: "safety"
        measurement: "Unit test"
        target: "RuntimeError from LLMClient.converse wrapped in StageError"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/agents/segmenter.py"
        description: "Segmenter agent run() entry point"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/episode_engine/agents/_common.py"
        description: "build_tool_config, call_stage helpers used by every stage"
        storage_location: "git"
      - artifact_type: "configuration"
        location: "libs/prompts/episode_engine/segmenter_v1.py"
        description: "SYSTEM, USER_TEMPLATE, SCHEMA, VERSION, TOOL_NAME for v1"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 220
      key_functions:
        - "segmenter.run"
        - "_common.call_stage"
        - "_common.build_tool_config"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Forces structured output via tool_config so the model cannot return free-form text the chain would silently accept"
      - "Pydantic validation rejects invented or malformed windows"
    risk_control_measures:
      - "Prompt imports the canonical _shared.py rules-of-the-road"
      - "StageError is the ONLY way a stage can fail - no None returns or empty defaults"

  verification_status:
    verification_method: "Test"
    verification_complete: true
