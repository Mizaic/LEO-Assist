# -- VT-LEO-AI-167 -- Pathway probe surface decomposition + MUI guard verification
# IEC 62304 Verification Test

- id: "VT-LEO-AI-167"
  version: "1.0"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-168"]
    risks: ["R-LEO-AI-167"]

  metadata:
    title: "Phase 6b-vi cleanup: file size limits, dead-file removal, ESLint guard, registry parity"
    description: >
      Static-source verification that the Phase 6b-vi cleanup landed:
      every PortEdge/* and probes/* module is at most 500 LOC, the
      four legacy panel/* files are gone, the ESLint guard for
      pathway/** @mui imports is registered, and the four Phase 6b-v
      subgraphs remain wired in PROBE_STRATEGIES.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/pathway-canvas-cleanup.test.ts"
      - "services/ui/e2e/pathway-editor.spec.ts"

  test_environment:
    environment_type: "development"
    prerequisites:
      - "services/ui workspace dependencies installed (npm install)"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-167-TC-001"
      case_name: "Every PortEdge/* and probes/* module is at most 500 LOC"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read every .ts/.tsx file under services/ui/src/components/pathway/edges/PortEdge/ and services/ui/src/components/pathway/edges/probes/"
          expected_result: "Each file's line count is <= 500"
      verification_method: "automated"
      acceptance_criteria:
        - "No file in either directory exceeds 500 lines of code"

    - case_id: "VT-167-TC-002"
      case_name: "Dead panel/* files are removed"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Probe filesystem for InputsTab.tsx, OverviewTab.tsx, ReviewTab.tsx, TriggerContextPanel.tsx under services/ui/src/components/pathway/panel/"
          expected_result: "None of the four files exist"
      verification_method: "automated"
      acceptance_criteria:
        - "All four legacy panel files are absent from the tree"

    - case_id: "VT-167-TC-003"
      case_name: "ESLint guard for pathway/** @mui imports is registered"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/eslint.config.mjs and assert it contains a no-restricted-imports rule scoped to src/components/pathway/** that targets @mui/*"
          expected_result: "Rule is present"
      verification_method: "automated"
      acceptance_criteria:
        - "eslint.config.mjs registers no-restricted-imports + @mui/* pattern for pathway/**"

    - case_id: "VT-167-TC-004"
      case_name: "PortEdge.tsx remains a thin barrel that re-exports from PortEdge/index"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/edges/PortEdge.tsx and assert it re-exports PortEdge from ./PortEdge/index and is at most 20 LOC"
          expected_result: "Barrel is <=20 LOC and re-exports the symbol"
      verification_method: "automated"
      acceptance_criteria:
        - "PortEdge.tsx exports { PortEdge } from './PortEdge/index'"
        - "PortEdge.tsx total line count is <=20"

    - case_id: "VT-167-TC-005"
      case_name: "probeStrategies.tsx is a thin barrel re-exporting per-domain probes"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read services/ui/src/components/pathway/edges/probeStrategies.tsx and assert it imports each per-domain module from ./probes/ and is at most 200 LOC"
          expected_result: "Barrel is <=200 LOC and imports the six per-domain modules"
      verification_method: "automated"
      acceptance_criteria:
        - "probeStrategies.tsx imports from ./probes/_shared, ./probes/extraction, ./probes/verification, ./probes/persist, ./probes/connectors, ./probes/guidance"
        - "probeStrategies.tsx total line count is <=200"

    - case_id: "VT-167-TC-006"
      case_name: "Phase 6b-v subgraphs remain wired in PROBE_STRATEGIES"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Re-run VT-LEO-AI-158 to confirm encounter_loader, staging_enrichment, human_review_gate, encounter_coding_agent are still registered"
          expected_result: "All four subgraphs are present in PROBE_STRATEGIES"
      verification_method: "automated"
      acceptance_criteria:
        - "All four subgraphs resolve through the new probe modules"

    - case_id: "VT-167-TC-007"
      case_name: "Pathway editor route mounts with zero critical/serious axe violations"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run pathway-editor.spec.ts under @playwright/test against /admin/pathways"
          expected_result: "Page loads, axe baseline reports zero critical/serious violations"
      verification_method: "automated"
      acceptance_criteria:
        - "Axe results filtered to critical/serious are empty"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-167/"
    retention_period: "7 years"
    immutability: true

  execution_history: []
