# -- DI-LEO-AI-175 -- Skin / melanoma inventory completeness
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-175"
  type: "Functional"
  derived_from: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
  requirement: >
    The episode-building text path SHALL recognise the full skin / melanoma
    pathway vocabulary used in primary-care SystmOne records.
    Specifically:
    (a) FAST_TRACK_REFERRAL_READ_CODES SHALL include XaMeA -> "melanoma"
    (Fast track referral for suspected skin cancer);
    (b) SPECIALIST_CLINIC_READ_CODES SHALL include XaPyd -> "melanoma"
    (Seen in fast track suspected skin cancer clinic) so that the
    detector emits a first_seen anchor when this code appears in
    encounter text;
    (c) MALIGNANCY_READ_CODES SHALL include the B32.. family
    (B32..-B32z. malignant melanoma of skin, by anatomical site),
    Xa99Y (Lentigo maligna melanoma), Xa0Di (Malignant melanoma of
    anus), Xa0Dj (Malignant melanoma of rectum), XaCIv (Malignant
    melanoma of back), XaBAw (Malignant blue naevus of skin), and
    Xa0CD (Malignant tumour of skin with pilar differentiation), all
    mapped to "melanoma";
    (d) MALIGNANCY_TERM_PATTERNS SHALL match the histological subtypes
    "lentigo maligna" (with or without "melanoma"), "superficial
    spreading melanoma", "nodular melanoma", "acral lentiginous
    melanoma", and "desmoplastic melanoma", all mapped to "melanoma";
    (e) A new CANCER_TREATMENT_PROCEDURE_CODES inventory SHALL include
    7G055 (Wide excision of skin lesion) and X90PX (Biopsy - action),
    consumed by the existing _RE_TREATMENT path so the wide-excision
    encounter fires a treatment_started anchor when it appears within
    an open skin / melanoma episode window.
  rationale: >
    The 2026-04-17 audit of patient 4921442355 (Mr Harold Allwyn)
    discovered a confirmed pT1a Lentigo maligna melanoma of the
    right cheek that was filed as closed_benign because none of the
    post-referral cancer signals were in our inventories:
    - the 2WW skin referral code XaMeA was not mapped;
    - the specialist clinic code XaPyd was not recognised, so no
      first_seen anchor extended the active window;
    - the diagnosis code Xa99Y (Lentigo maligna melanoma) was not
      in MALIGNANCY_READ_CODES;
    - the entire B32.. family (50+ Read codes for melanoma by
      anatomical site, e.g. B3230 melanoma of cheek, B324. melanoma
      of scalp, B325. melanoma of trunk) was missing from
      MALIGNANCY_READ_CODES;
    - the surgical excision code 7G055 was not tracked as treatment;
    - the histological diagnosis "lentigo maligna melanoma" did not
      match the existing \\bmalignant melanoma\\b regex.
    A repeat search across the full corpus identified at least 3
    closed_benign episodes (a644d1c1586405a6, fb62376ea4b48443,
    42b722eb6082a4b7) carrying explicit Lentigo maligna / Wide
    excision of skin lesion / Skin Cancer Follow Up evidence.
    Skin cancer is the most common cancer in NCDA cohorts, so this
    gap materially undercounts confirmed cancer pathways.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs/domains/code_inventories.py exposes the additional entries
          listed above. find_malignancy_code('B3230') returns 'melanoma'.
          find_malignancy_code('Xa99Y') returns 'melanoma'.
          find_fast_track_referral_site('Fast track referral for
          suspected skin cancer (XaMeA)') returns ('XaMeA', 'melanoma').
      - type: "functional"
        spec: >
          A new CANCER_TREATMENT_PROCEDURE_CODES set contains '7G055'
          and 'X90PX'. The anchor detector treats encounter text
          containing any code in this set as a treatment signal so
          the existing _RE_TREATMENT path fires.
      - type: "functional"
        spec: >
          MALIGNANCY_TERM_PATTERNS matches "Lentigo maligna melanoma"
          on a problem-list line and emits diagnosis_confirmed with
          site_key="melanoma", diagnosis_source="malignancy_term_problem_line",
          confidence=0.85, hitl_required=True.
      - type: "performance"
        spec: >
          On the live patient corpus a full episode rebuild MUST
          reclassify the 3 audit-flagged closed_benign skin/melanoma
          episodes (a644d1c1586405a6, fb62376ea4b48443,
          42b722eb6082a4b7) to status='completed' with
          cancer_type='melanoma' and hitl_flag=true.
    constraints:
      - type: "safety"
        spec: >
          Every B32.. and Xa-prefix code added MUST be sourced verbatim
          from configs/read codes/readcode.md. No codes added from memory.
      - type: "safety"
        spec: >
          The histological subtype patterns MUST only match on
          problem-list lines (Major:/Problem:/Active Problem:/Past
          Problem:) via the existing PROBLEM_LIST_LINE_PREFIX guard so
          they cannot fire on free-prose 2WW referral text.
    dependencies: ["DI-LEO-AI-159", "DI-LEO-AI-171"]
    downstream_impacts:
      - "Confirmed melanoma episodes recovered from closed_benign cohort"
      - "first_seen anchor coverage extended to skin pathway"
      - "Treatment milestone coverage extended to dermatological surgery"
    technical_details:
      language: "Python"
      framework: "analysis_worker + libs"
      file_structure:
        - "libs/domains/code_inventories.py"
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in tests/test_stale_detector_fixes.py classes
      TestSkinMelanomaInventory and TestRegressionHaroldAllwyn pass.
      Live-corpus wipe-and-rebuild reclassifies the 3 audit-flagged
      skin/melanoma closed_benign episodes to completed.
    test_protocol: "VT-LEO-AI-172"

  safety_class: "B"
  risks: ["R-LEO-AI-172"]
  tags:
    - "episode-building"
    - "missed-cancer"
    - "skin-cancer"
    - "melanoma"
    - "ctv3"
