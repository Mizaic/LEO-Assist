# -- VT-LEO-AI-002 -- NLP Entity Extraction Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-002"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-003", "DI-LEO-AI-005"]
    risks: ["R-LEO-AI-001", "R-LEO-AI-002", "R-LEO-AI-003"]
    user_needs: ["UN-LEO-AI-002"]

  metadata:
    title: "NLP Entity Extraction Verification"
    description: >
      Verifies that the NLP pipeline correctly extracts clinical entities from
      free-text encounters, detects negation, classifies context, and meets
      F1 score thresholds against a gold-standard annotated dataset.
    test_level: "integration"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_nlp_entity_extraction.py"
    created_by: "Quality Engineer"
    created_date: "2026-03-01"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12 installed with project dependencies"
      - "NLP model weights available in model cache"
      - "Gold-standard annotated clinical text dataset loaded"
    test_data:
      data_type: "fixture"
      cleanup_required: true

  test_cases:
    - case_id: "VT-002-TC-001"
      case_name: "Entities extracted from free text"
      priority: "critical"
      preconditions:
        - "NLP pipeline initialised with production model weights"
        - "Test corpus of at least 100 annotated clinical notes available"
      test_steps:
        - step_number: 1
          action: "Pass a clinical free-text note containing known entities to the extraction pipeline"
          expected_result: "Pipeline returns a list of extracted entities with spans and types"
          verification_method: "Assert extracted entity spans match gold-standard annotations"
        - step_number: 2
          action: "Verify entity types (condition, medication, procedure) are correctly assigned"
          expected_result: "Each entity has the correct type label"
          verification_method: "Assert entity type matches gold-standard label for each extracted entity"
      acceptance_criteria:
        - "All expected entities are extracted from the test note"
        - "Entity types match the gold-standard labels"

    - case_id: "VT-002-TC-002"
      case_name: "Negation detected correctly"
      priority: "critical"
      preconditions:
        - "Test corpus includes notes with negated clinical findings"
      test_steps:
        - step_number: 1
          action: "Pass clinical text containing negated terms (e.g. 'no chest pain') to the pipeline"
          expected_result: "Negated entities are flagged with negation=true"
          verification_method: "Assert negation flag matches gold-standard annotation"
        - step_number: 2
          action: "Pass clinical text with affirmed findings alongside negated findings"
          expected_result: "Affirmed entities have negation=false, negated entities have negation=true"
          verification_method: "Assert each entity negation status matches the expected value"
      acceptance_criteria:
        - "Negation detection accuracy >= 95% on the test corpus"
        - "No affirmed entity is incorrectly marked as negated"

    - case_id: "VT-002-TC-003"
      case_name: "Context classification correct"
      priority: "high"
      preconditions:
        - "Test corpus includes notes with historical, family, and current context markers"
      test_steps:
        - step_number: 1
          action: "Pass clinical text with mixed temporal contexts to the pipeline"
          expected_result: "Each entity is classified with the correct context (current, historical, family)"
          verification_method: "Assert context label matches gold-standard annotation for each entity"
      acceptance_criteria:
        - "Context classification accuracy >= 90% on the test corpus"
        - "Current-context entities are never misclassified as historical"

    - case_id: "VT-002-TC-004"
      case_name: "F1 >= 0.85 against gold data"
      priority: "critical"
      preconditions:
        - "Full gold-standard annotated dataset is loaded"
      test_steps:
        - step_number: 1
          action: "Run entity extraction across the entire gold-standard dataset"
          expected_result: "Aggregate precision, recall, and F1 scores computed"
          verification_method: "Assert F1 >= 0.85"
        - step_number: 2
          action: "Log per-entity-type metrics for audit trail"
          expected_result: "Metrics broken down by entity type are recorded"
          verification_method: "Verify metrics file contains precision, recall, and F1 per type"
      acceptance_criteria:
        - "Overall F1 score >= 0.85"
        - "No individual entity type has F1 below 0.75"

  pass_fail_criteria:
    pass_threshold: "100% critical, 95% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-002/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-002-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "development"
      result: "pass"
      cases_executed: 9
      cases_passed: 9
      cases_failed: 0
      duration_seconds: 2
      notes: "All 9 test cases passed (pytest VT-LEO-AI-002)"
