# -- DI-LEO-AI-090 -- Stage-at-diagnosis enrichment engine
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-090"
  type: "Functional"
  derived_from: ["UN-LEO-AI-052"]
  requirement: >
    The system SHALL derive and persist cancer stage at diagnosis for each
    EpisodeOfCare with confirmed diagnosis evidence, using a deterministic
    priority cascade: explicit stage string first, then site-specific TNM
    derivation, then text-scan fallback. The system SHALL classify stage as
    early/late/unknown and persist the full staging evidence fields for audit.
  rationale: >
    Cancer audit reporting requires reliable stage-at-diagnosis analytics.
    Stage may be coded directly or implied by TNM combinations and varies by
    cancer site. Deterministic derivation with source/confidence fields reduces
    ambiguity, supports clinical review, and improves downstream KPI validity.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "Rules loader imports site-specific staging rules from configs/staging_rules/*.json"
      - type: "functional"
        spec: "Stage resolution priority is explicit stage > TNM derivation > unknown"
      - type: "functional"
        spec: "EpisodeOfCare stores cancer_stage, cancer_stage_raw, cancer_stage_group, tnm_t, tnm_n, tnm_m, staging_system, staging_source, staging_confidence"
      - type: "functional"
        spec: "Analytics endpoint returns by_stage_group, by_system, by_source, and coverage_pct"
      - type: "functional"
        spec: "Audit UI renders pipeline-derived stage distribution and coverage instead of COSD placeholder"
    constraints:
      - type: "safety"
        spec: "Unknown is returned when evidence is insufficient; no inferred stage without matching rule"
      - type: "safety"
        spec: "Evidence source and confidence are persisted for review traceability"
    dependencies: ["DI-LEO-AI-084", "DI-LEO-AI-088"]
    downstream_impacts:
      - "analysis_worker episode persistence"
      - "pipeline_graph staging enrichment subgraph"
      - "analytics_api cancer stage section"
      - "ui audit cancer stage section"

  technical_details:
    language: "Python/TypeScript"
    framework: "LangGraph/FastAPI/Next.js"
    file_structure:
      - "libs/staging/tnm_parser.py"
      - "libs/staging/engine.py"
      - "libs/pipeline_graph/subgraphs/staging_enrichment.py"
      - "services/analysis_worker/app/analyzers/episode_builder.py"
      - "services/analytics_api/app/routers/audit.py"
      - "services/ui/src/components/audit/CancerStageSection.tsx"
      - "services/ui/src/lib/analyticsApi.ts"
    estimated_loc: 450

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-090 test cases pass for parser, rules engine priority cascade,
      non-TNM stage mapping, and unknown fallback.
    test_protocol: "VT-LEO-AI-090"

  safety_class: "B"
  risks: ["R-LEO-AI-064"]
  tags: ["staging", "episode-detection", "analytics", "audit-ui"]
