  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Pre-save sandbox replay of unsaved appropriateness rules"
      - "Explicit signalling of empty / missing compiled ruleset"
    risk_control_measures:
      - "Single bitmap compiler for production AND sandbox"
      - "Hard refusal of global scope from sandbox compile/delete/TTL paths"
      - "TTL on every sandbox compile so abandoned sandboxes are reaped"
      - "try/finally cleanup of sandbox scope around replay"
      - "Structured not_compiled + recompile_hint payload across evaluate, diagnose and replay"
      - "Loud RulesetNotCompiledBanner with one-click compile (production) or explanation (sandbox)"

