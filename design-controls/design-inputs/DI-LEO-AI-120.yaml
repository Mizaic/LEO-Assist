# -- DI-LEO-AI-120 -- Global inclusive accessibility baseline
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-120"
  type: "Safety"
  derived_from: ["UN-LEO-AI-065", "UN-LEO-AI-066", "UN-LEO-AI-068"]
  requirement: >
    The LEO UI SHALL pass WCAG 2.1 AA conformance at the app-shell
    and on every patient-reachable route, enforced by both static
    analysis (eslint-plugin-jsx-a11y) and runtime testing
    (@axe-core/playwright and jest-axe). The AppShell SHALL
    provide a working skip-link, landmark roles (main, nav,
    complementary, contentinfo) and aria-current='page' on the
    active navigation item in both rail and full drawer modes. The
    logo MUST be a button when it performs navigation. The
    organisation selector MUST have a visible or
    programmatically-associated label. Confirmation dialogs MUST
    set aria-describedby. Status information rendered only in
    colour MUST also be conveyed in shape/icon/label.
  rationale: >
    Current defects in AppShell (no aria-current in rail mode,
    img-as-button on logo, placeholder-only search field,
    unlabelled OrgSelect, no aria-describedby on confirm dialog,
    colour-only status dots) block legal accessibility compliance
    and expose patients and staff with assistive technology to
    navigation confusion and missed information. A single design
    input captures the baseline so every new screen inherits it.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: >
          Every patient-reachable Playwright route returns zero
          critical or serious axe violations.
      - type: "functional"
        spec: >
          AppShell drawer renders aria-current='page' on the
          active item in both rail and full modes.
      - type: "functional"
        spec: >
          The LEO logo in AppShell rail and full mode is an
          HTML button element when clickable, with
          aria-label='Go to home' or the equivalent route
          description.
      - type: "functional"
        spec: >
          The OrgSelect field has aria-label='Select
          organisation' and an associated InputLabel.
      - type: "safety"
        spec: >
          ConfirmDialog exposes aria-labelledby (title) and
          aria-describedby (body).
      - type: "safety"
        spec: >
          StatusDot renders an icon or shape in addition to the
          dot colour, and its aria-label describes the status
          without relying on colour.
      - type: "functional"
        spec: >
          CI runs eslint with eslint-plugin-jsx-a11y enabled
          (recommended rules) and fails the build on any error.
          CI also runs @axe-core/playwright on a representative
          patient-reachable route and fails on any critical or
          serious violation.
    constraints:
      - type: "performance"
        spec: >
          axe Playwright check MUST complete within the existing
          e2e test time budget.
    dependencies: ["DI-LEO-AI-118", "DI-LEO-AI-119"]
    downstream_impacts:
      - "services/ui/src/components/AppShell.tsx"
      - "services/ui/src/components/ConfirmDialog.tsx"
      - "services/ui/src/components/ui/StatusDot.tsx"
      - "services/ui/src/components/TermSearch.tsx"
      - "services/ui/eslint.config.js"
      - "services/ui/e2e/"
    technical_details:
      language: "TypeScript"
      framework: "Next.js + MUI + Playwright + jest-axe"
      file_structure:
        - "services/ui/src/components/AppShell.tsx"
        - "services/ui/src/components/ConfirmDialog.tsx"
        - "services/ui/src/components/ui/StatusDot.tsx"
        - "services/ui/src/components/TermSearch.tsx"
        - "services/ui/e2e/a11y-baseline.spec.ts"
        - "services/ui/src/__tests__/appshell-a11y.test.tsx"
        - "services/ui/eslint.config.js"
      estimated_loc: 240

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-LEO-AI-115 cases pass: AppShell a11y unit tests
      confirm aria-current in rail mode, button-semantics logo,
      labelled OrgSelect, ConfirmDialog aria-describedby, and
      StatusDot non-colour encoding; Playwright axe-core scan of
      the representative patient-reachable route returns zero
      critical/serious violations.

    test_protocol: "VT-LEO-AI-115"

  safety_class: "B"
  risks: ["R-LEO-AI-078", "R-LEO-AI-080"]
  tags:
    - "accessibility"
    - "wcag"
    - "ui-foundation"
    - "patient-safety"
