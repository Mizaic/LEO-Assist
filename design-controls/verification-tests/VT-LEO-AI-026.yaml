# -- VT-LEO-AI-026 -- Coding Verification Consensus Verification
# IEC 62304 Verification Test Protocol
# Schema: design-controls/templates/verification_test_schema.yaml

- id: "VT-LEO-AI-026"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-041"]
    risks: ["R-LEO-AI-001", "R-LEO-AI-026"]
    user_needs: ["UN-LEO-AI-002"]

  metadata:
    title: "Coding Verification Consensus Verification"
    description: "Verifies the verify_coding_consensus function: verdict parsing, correct/incorrect/uncertain results, mode-aware fail behaviour, user message content including SNOMED concept, and encounter text truncation"
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/test_verify_coding_consensus.py"

  test_environment:
    environment_type: "ci_cd"
    prerequisites:
      - "Python 3.12+ with project dependencies installed"
      - "Consensus runner mocked via unittest.mock.patch"
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-026-TC-001"
      case_name: "Verdict parsing accepts valid values"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call _parse_verify_verdict with correct, incorrect, and uncertain JSON"
          expected_result: "Returns the verdict string for each valid value"
          verification_method: "Assert exact return value"
      acceptance_criteria:
        - "All three valid verdicts parsed correctly"

    - case_id: "VT-026-TC-002"
      case_name: "Invalid verdict returns empty string"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call _parse_verify_verdict with invalid verdict value"
          expected_result: "Returns empty string"
          verification_method: "Assert return value == ''"
      acceptance_criteria:
        - "Invalid verdicts are rejected by the parser"

    - case_id: "VT-026-TC-003"
      case_name: "Correct verdict returned on consensus agreement"
      priority: "critical"
      preconditions:
        - "Consensus returns correct with agreed=True"
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus with mocked consensus returning 'correct'"
          expected_result: "Returns 'correct'"
          verification_method: "Assert return value"
      acceptance_criteria:
        - "Verified match passes through as correct"

    - case_id: "VT-026-TC-004"
      case_name: "Incorrect verdict returned on consensus agreement"
      priority: "critical"
      preconditions:
        - "Consensus returns incorrect with agreed=True"
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus with mocked consensus returning 'incorrect'"
          expected_result: "Returns 'incorrect'"
          verification_method: "Assert return value"
      acceptance_criteria:
        - "Mismatched terminology correctly identified"

    - case_id: "VT-026-TC-005"
      case_name: "Autonomous mode fail_verdict is uncertain"
      priority: "critical"
      preconditions:
        - "coding_mode='autonomous'"
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus in autonomous mode and inspect consensus call"
          expected_result: "Consensus called with fail_verdict='uncertain'"
          verification_method: "Assert consensus call_args fail_verdict"
      acceptance_criteria:
        - "Autonomous failures default to uncertain (do not auto-approve)"

    - case_id: "VT-026-TC-006"
      case_name: "HITL mode fail_verdict is correct"
      priority: "critical"
      preconditions:
        - "coding_mode='hitl'"
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus in HITL mode and inspect consensus call"
          expected_result: "Consensus called with fail_verdict='correct'"
          verification_method: "Assert consensus call_args fail_verdict"
      acceptance_criteria:
        - "HITL failures default to correct (let human review)"

    - case_id: "VT-026-TC-007"
      case_name: "User message includes SNOMED concept ID"
      priority: "high"
      preconditions: []
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus and parse the user_msg JSON"
          expected_result: "matched_concept field contains the SNOMED concept ID and term"
          verification_method: "Assert SNOMED ID present in parsed user_msg"
      acceptance_criteria:
        - "LLM receives full concept context for verification"

    - case_id: "VT-026-TC-008"
      case_name: "Encounter text sanitised and capped at 16000 characters"
      priority: "high"
      preconditions:
        - "Encounter text exceeds 16000 characters"
      test_steps:
        - step_number: 1
          action: "Call verify_coding_consensus with 20000-char encounter text"
          expected_result: "User message encounter_text is exactly 16000 characters"
          verification_method: "Parse user_msg JSON and assert length"
      acceptance_criteria:
        - "Full clinical context preserved for encounters up to ~4 A4 pages"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["test_report", "code_coverage"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-026/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-026-EXEC-001"
      date: "2026-03-03"
      executor: "automated_ci"
      environment: "local"
      result: "pass"
      cases_executed: 12
      cases_passed: 12
      cases_failed: 0
      duration_seconds: 1
      notes: "All 12 tests pass (pytest tests/test_verify_coding_consensus.py)"
