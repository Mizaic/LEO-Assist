# -- R-LEO-AI-010 -- Unauthorised Access to Patient Data
# ISO 14971 / IEC 62304 Risk
# Schema: design-controls/templates/risks_schema.yaml

- id: "R-LEO-AI-010"
  title: "Unauthorised user gains access to patient clinical data"

  hazard:
    description: "Insufficient access controls allow unauthorised access to patient data"
    category: "security_breach"

  hazardous_situation: "A user without appropriate authorisation accesses patient encounter data, clinical episodes, or audit results containing identifiable patient information"

  harm:
    description: "Patient data breach with regulatory and reputational consequences"
    severity: "serious"

  initial_risk_estimate:
    severity: 3
    probability: 2
    detectability: 2
    rpn: 12
    risk_level: "medium"

  mitigation_measures:
    - control_type: "protective_measure"
      description: "Azure AD / Entra ID authentication required for all API access"
      implemented_by: ["DI-LEO-AI-020", "DI-LEO-AI-021", "DI-LEO-AI-030"]
      verified_by: ["VT-LEO-AI-012", "VT-LEO-AI-019"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Role-based access control with organisation-scoped tenancy"
      implemented_by: ["DI-LEO-AI-020", "DI-LEO-AI-021", "DI-LEO-AI-030"]
      verified_by: ["VT-LEO-AI-012", "VT-LEO-AI-019"]
      effectiveness: "highly_effective"
    - control_type: "protective_measure"
      description: "Separate Neo4j databases with independent authentication"
      implemented_by: ["DI-LEO-AI-020", "DI-LEO-AI-021", "DI-LEO-AI-030"]
      verified_by: ["VT-LEO-AI-012", "VT-LEO-AI-019"]
      effectiveness: "effective"
    - control_type: "procedural_control"
      description: "Access audit logging and periodic review"
      implemented_by: ["DI-LEO-AI-020", "DI-LEO-AI-021", "DI-LEO-AI-030"]
      verified_by: ["VT-LEO-AI-012", "VT-LEO-AI-019"]
      effectiveness: "effective"

  residual_risk_estimate:
    severity: 3
    probability: 1
    detectability: 1
    rpn: 3
    risk_level: "low"
    acceptability: "acceptable"
    justification: "Multi-layered authentication and authorisation controls with audit logging reduce unauthorised access probability to very low levels"

  monitoring:
    monitoring_plan: "Continuous monitoring of authentication and access patterns"
    metrics: ["Failed authentication attempts", "Access audit anomalies", "Privilege escalation attempts"]
    review_frequency: "Monthly"

  metadata:
    identified_by: "Risk Management Team"
    identified_date: "2026-03-01"
    status: "analyzed"

  tags: ["security", "access-control", "gdpr"]
