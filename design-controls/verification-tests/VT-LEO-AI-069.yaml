# -- VT-LEO-AI-069 -- ModelConfig Create and Delete API Verification
# IEC 62304 Verification Test Protocol

- id: "VT-LEO-AI-069"
  title: "ModelConfig Create and Delete Router Verification"
  design_input: "DI-LEO-AI-069"
  design_output: "DO-LEO-AI-069"
  safety_class: "A"
  phase: "OQ"
  method: "Automated unit tests (pytest) with mocked Neo4j client"
  test_file: "services/api/tests/test_model_configs_router.py"
  status: "pending"

  test_cases:
    - id: "VT-069-001"
      title: "POST /model-configs with valid body creates node and returns 201"
      steps:
        - "Mock CodingGraphClient GET_MODEL_CONFIG to return None (no existing node)"
        - "Mock CREATE_MODEL_CONFIG to succeed"
        - "POST /model-configs with {key:'aws:small', provider:'aws', tier:'small', displayName:'Test', modelId:'test-id', costPer1mInput:1.1, costPer1mCachedInput:0.11, costPer1mOutput:5.5, isActive:true}"
      expected: "HTTP 201, {key:'aws:small', status:'created'}"

    - id: "VT-069-002"
      title: "POST /model-configs with duplicate key returns 409"
      steps:
        - "Mock GET_MODEL_CONFIG to return an existing row"
        - "POST /model-configs with an existing key"
      expected: "HTTP 409"

    - id: "VT-069-003"
      title: "POST /model-configs with missing required field returns 422"
      steps:
        - "POST /model-configs with body missing 'key' field"
      expected: "HTTP 422 (Pydantic validation)"

    - id: "VT-069-004"
      title: "DELETE /model-configs/{key} removes existing node and returns 200"
      steps:
        - "Mock DELETE_MODEL_CONFIG to return {deleted: 1}"
        - "DELETE /model-configs/aws:small"
      expected: "HTTP 200, {key:'aws:small', status:'deleted'}"

    - id: "VT-069-005"
      title: "DELETE /model-configs/{key} returns 404 when key not found"
      steps:
        - "Mock DELETE_MODEL_CONFIG to return {deleted: 0}"
        - "DELETE /model-configs/nonexistent"
      expected: "HTTP 404"

    - id: "VT-069-006"
      title: "GET /model-configs still returns list correctly after add/delete"
      steps:
        - "Mock LIST_MODEL_CONFIGS to return two rows"
        - "GET /model-configs"
      expected: "HTTP 200, modelConfigs array of length 2"
