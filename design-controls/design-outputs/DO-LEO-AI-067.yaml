# -- DO-LEO-AI-067 -- Pathway Version History Implementation
# IEC 62304 / ISO 13485 Design Output

- id: "DO-LEO-AI-067"
  derived_from: "DI-LEO-AI-067"
  type: "Implementation"
  status: "released"

  description: >
    Implementation of pathway version history, draft/publish separation,
    and rollback for FHIR PlanDefinition resources.

  deliverables:

    - file: "services/fhir_api/app/routers/plan_definition.py"
      description: >
        Updated PUT handler creates an immutable PlanDefinitionVersion node
        (linked via HAS_VERSION) whenever status=active. Draft saves skip
        snapshot creation entirely. New GET /_history endpoint returns all
        versions as a FHIR history Bundle with meta.versionId, meta.lastUpdated,
        and meta.versionNotes. New POST /_restore/{vid} fetches a historical
        snapshot and delegates to upsert, creating a new version entry (rollback
        is non-destructive). DELETE endpoint extended to also remove HAS_VERSION
        children. versionNotes extracted from request body before rawJson storage.
      key_functions:
        - "get_plan_definition_history(plan_id)"
        - "restore_plan_definition_version(plan_id, version_id)"
        - "upsert_plan_definition(plan_id, resource) — extended"
        - "delete_plan_definition(plan_id) — extended"

    - file: "services/fhir_api/tests/test_plan_definition_version_history.py"
      description: >
        11 pytest unit tests covering all acceptance criteria from DI-LEO-AI-067.
        KnowledgeGraphClient is mocked; no Neo4j connection required. Tests verify
        version creation on publish, no creation on draft, versionNotes stripping,
        _history bundle structure, _restore 200/404 paths, and deletion of version nodes.
      test_count: 11
      pass_status: "all_passing"

    - file: "services/ui/src/app/admin/pathways/[id]/page.tsx"
      description: >
        Pathway builder toolbar redesigned: status is a read-only Chip (driven by
        Publish/Retire actions, not an editable Select). "Save draft" button
        persists without status change. "Publish" button opens a confirmation
        dialog gated by validation (errors block publish). versionNotes from the
        dialog are sent in the PUT body and stored in the version snapshot.
        Auto-save on wizard "Next" click (background, non-blocking) with a
        "Draft saved ✓" indicator in the dialog header. Version history Drawer
        (right anchor, 380px) fetches GET /_history, lists versions newest-first,
        provides "Restore" button on non-current entries, and shows the next
        version number in the footer note.
      key_additions:
        - "VersionEntry interface"
        - "formatVersionDate() helper"
        - "loadHistory() and openHistory() callbacks"
        - "handleRestore() callback — calls POST /_restore/{vid}"
        - "confirmPublish() — includes versionNotes in PUT payload"
        - "backgroundSave() in ActionConfigurator — auto-save on Next"
        - "Version history Drawer JSX"
        - "Publish confirmation Dialog JSX with validation summary"

    - file: "services/ui/src/app/admin/pathways/page.tsx"
      description: >
        Pathway list page fully redesigned. Pathways grouped into Live / In draft /
        Retired sections. PathwayCard component with colour-accent bar, metadata
        row (step count, trigger event, last updated), and per-card action buttons
        that vary by status: Publish (draft), New draft (active), Reactivate
        (retired), Retire icon (live/draft). Publish from list opens a confirmation
        dialog with versionNotes field.
      key_additions:
        - "PathwayCard component"
        - "Grouped rendering: active / drafts / retired"
        - "patchStatus() — PATCH status via PUT"
        - "handleDuplicate() — POST copy with status=draft"
        - "confirmPublish() — list-page publish with versionNotes"

  neo4j_schema_additions:
    node_labels:
      - label: "PlanDefinitionVersion"
        properties:
          id: "UUID string (unique)"
          planId: "String — parent PlanDefinition.id"
          versionId: "Integer — monotonically increasing per plan"
          status: "String — always 'active'"
          rawJson: "String — full FHIR PlanDefinition JSON snapshot"
          publishedAt: "String — UTC ISO 8601 timestamp"
          versionNotes: "String — operator-provided change description"
    relationships:
      - "(PlanDefinition)-[:HAS_VERSION]->(PlanDefinitionVersion)"

  api_additions:
    - method: "GET"
      path: "/fhir/PlanDefinition/{id}/_history"
      response: "FHIR Bundle (type=history), entries sorted versionId DESC"
    - method: "POST"
      path: "/fhir/PlanDefinition/{id}/_restore/{vid}"
      response: "Updated PlanDefinition resource (status=active)"
