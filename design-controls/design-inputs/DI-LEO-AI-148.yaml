# -- DI-LEO-AI-148 -- Wave E Phase 4: AI Instructions list on @leo/design-system
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-148"
  type: "Functional"
  derived_from: ["UN-LEO-AI-071"]
  requirement: >
    The AI Instructions list page (services/ui/src/app/admin/prompts/page.tsx)
    SHALL be rebuilt onto the shared @leo/design-system chrome
    primitives (StatHero, FilterBar, SegmentedTabs, ToolbarActions)
    and the ReviewListCard body primitive, replacing the bespoke
    PromptCard grid + raw chip-strip filter + raw TextField search
    that shipped before Wave E.
    The page MUST keep its grouped browse mode (one ReviewListCard
    per category section when no filter is active) and switch to a
    single flat ReviewListCard when the user types into search or
    selects a non-"All" category. Existing wiring -- /api/prompts
    fetch, router.push to /admin/prompts/:id and /admin/prompts/new,
    sortByIsoDateDesc ordering -- MUST be preserved without behaviour
    change.
    The detail-page rebuild (PromptEditorCard + few-shot library
    on ReviewListCard for the 1.1k LOC editor at
    services/ui/src/app/admin/prompts/[id]/page.tsx) is explicitly
    out of scope for this DI and is deferred to a dedicated session.
  rationale: >
    The AI Instructions list was the next-worst-offender in the
    Knowledge area after the Phase 3 CRUD sweep: a bespoke
    Card/CardActionArea grid with a hand-rolled chip-strip filter
    and a raw TextField search. It did not share chrome with the
    other Knowledge tabs, breaking UN-LEO-AI-071 AC-001. Moving it
    onto StatHero + FilterBar + SegmentedTabs + ToolbarActions +
    ReviewListCard makes the page feel like the rest of the role-
    first product without disturbing the editor (which is a heavy
    refactor in its own right and benefits from a dedicated PR).

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          AC-001: The page imports StatHero, FilterBar,
          SegmentedTabs, ToolbarActions and ReviewListCard from
          @leo/design-system, plus the type aliases ReviewListItem,
          StatTile and ToolbarAction.
      - type: "functional"
        spec: >
          AC-002: The legacy bespoke chrome is removed --
          specifically: no <Typography variant="h4"> page title
          (KnowledgePageLayout supplies the intro upstream), no
          PromptCard component, no <CardActionArea>, no <TextField>
          (FilterBar supplies search).
      - type: "functional"
        spec: >
          AC-003: All pre-existing handlers stay wired:
          api.get<{ prompts: PromptConfig[] }>("/api/prompts");
          router.push("/admin/prompts/<id>") on row select;
          router.push("/admin/prompts/new") for the primary
          ToolbarAction; sortByIsoDateDesc to order rows by
          updatedAt.
      - type: "functional"
        spec: >
          AC-004: Browse vs filter modes are preserved -- grouped
          ReviewListCards (one per category, with section header)
          when no filter is active (data-testid: prompts-grouped),
          and a single flat ReviewListCard when isFiltering is
          true.
      - type: "functional"
        spec: >
          AC-005: ToolbarActions exposes exactly one primary action
          ('New instructions', id: 'new-instructions',
          variant: 'primary'). No other action has variant
          'primary'.
      - type: "functional"
        spec: >
          AC-006: Loading, empty and no-match states are reachable
          via SkeletonList (data-testid: prompts-skeleton-list),
          and Box stubs with data-testid 'prompts-empty' and
          'prompts-no-match'.
      - type: "functional"
        spec: >
          AC-007: StatHero shows four canonical tiles -- Instruction
          sets, Categories covered, With double-check, With examples
          -- so reviewers see catalogue health at a glance.
      - type: "functional"
        spec: >
          AC-008: SegmentedTabs is wired with the design-system
          API (tabs / value / onChange / aria-label), not the
          legacy items / activeId shape.
    constraints:
      - type: "safety"
        spec: >
          The redesign MUST NOT silently drop the route to
          /admin/prompts/<id> or /admin/prompts/new, since those
          are the only entry points to author or edit AI
          instructions. A regression here would block QA leads from
          fixing a malfunctioning prompt.
      - type: "safety"
        spec: >
          The page MUST continue to render correctly when accessed
          either standalone (legacy /admin/prompts route) or wrapped
          by KnowledgePageLayout via /admin/knowledge?tab=ai-instructions.
          The internal StatHero + FilterBar + ToolbarActions chrome
          is therefore self-contained and does not assume an outer
          intro is present.
    dependencies: ["DI-LEO-AI-142", "DI-LEO-AI-147"]
    downstream_impacts:
      - "services/ui/src/app/admin/prompts/page.tsx"
      - "services/ui/src/app/admin/knowledge/page.tsx (consumer)"
    technical_details:
      language: "TypeScript"
      framework: "React + Next.js + MUI + Framer Motion + @leo/design-system"
      file_structure:
        - "services/ui/src/app/admin/prompts/page.tsx"
      estimated_loc: 470

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-146 passes: 8 test cases covering import
      assertions, legacy-chrome removal, handler preservation,
      grouped vs filter modes, single-primary ToolbarAction,
      reachable loading/empty/no-match states, four stat-tile
      labels, and SegmentedTabs API correctness.
    test_protocol: "VT-LEO-AI-146"

  safety_class: "B"
  risks: ["R-LEO-AI-101"]
  tags:
    - "knowledge"
    - "design-system"
    - "wave-e"
    - "phase-4"
    - "ai-instructions"
