# -- DI-LEO-AI-171 -- Problem-list malignancy term recognition + Read appendix sweep
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-171"
  type: "Functional"
  derived_from: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
  requirement: >
    The episode-building text path SHALL (a) detect malignancy terms in
    problem-list lines (lines beginning Major:, Problem:, Active Problem:,
    Significant Problem:, Past Problem:) using the curated
    MALIGNANCY_TERM_PATTERNS inventory and emit a diagnosis_confirmed
    anchor with diagnosis_source="malignancy_term_problem_line" and the
    term-derived site_key, even when the surrounding Read code is not in
    the inventory; (b) detect active-cancer-care Read codes (e.g. XaIph
    "Cancer confirmed", XaJU6 "MDT meeting", 8BAD0 "Cancer chemotherapy")
    via ACTIVE_CANCER_CARE_CODES and emit diagnosis_confirmed anchors
    with diagnosis_source="active_cancer_care_code" and hitl_required=True;
    (c) recognise personal-history-of-cancer Read codes (ZV10*, B934*,
    XaXGk*, XE0q0*, X71Eu, B937W, 1421-142Z, XM1R8) and free-text
    "H/O cancer", "history of cancer", "personal history of malignant
    neoplasm" markers as a HARD GUARD that prevents any diagnosis or
    benign-closure anchor from firing on the same encounter; and
    (d) extend MALIGNANCY_READ_CODES with the corpus-confirmed missing
    codes from the 2025 closed_benign audit (X78Y6 prostate carcinoma,
    Ya0ln invasive breast carcinoma) plus the comprehensive Xa-prefix
    appendix sweep, while removing the buggy "B5..." -> head_and_neck
    mapping (B5 covers connective tissue and skin in the Read appendix;
    B57.. is the brain sub-prefix and remains).
  rationale: >
    The 2025 closed_benign audit found 6 episodes in a 50-episode sample
    (12% precision miss) where confirmed cancers were silently filed as
    "no cancer" because:
    (1) the GP had typed the diagnosis as a free-text problem-list line
    ("Major: Carcinoma of prostate") but the surrounding Read code was
    not in our curated inventory, so no diagnosis anchor fired;
    (2) the GP had filed an active-cancer-care code ("XaIph Cancer
    confirmed", "XaIyc Cancer review", "XaJU6 MDT meeting") that
    documented the patient was being managed for cancer but our
    detector required a specific malignancy code to be present;
    (3) the previous "B5..." -> head_and_neck mapping was a transcription
    error (Read B5 is connective/skin, not head_and_neck) and silently
    routed sarcomas to the wrong site;
    (4) the codes X78Y6 (Carcinoma of prostate) and Ya0ln (Invasive
    carcinoma of breast) appeared verbatim in the closed_benign corpus
    but were missing from MALIGNANCY_READ_CODES.
    Personal-history codes must be guarded against because problem lines
    like "Major: H/O cancer of breast (B934.)" would otherwise match the
    new "carcinoma of breast" term pattern and falsely promote a survivor
    to a fresh diagnosis.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          libs/domains/code_inventories.py exposes ACTIVE_CANCER_CARE_CODES
          (set), HISTORY_OF_CANCER_CODE_PREFIXES (tuple),
          MALIGNANCY_TERM_PATTERNS (list of (regex, site_key)),
          PROBLEM_LIST_LINE_PREFIX (regex), plus helpers
          find_active_cancer_care_code, find_malignancy_term_in_problem_line,
          is_history_of_cancer_code, text_contains_history_of_cancer.
      - type: "functional"
        spec: >
          MALIGNANCY_READ_CODES contains X78Y6 -> prostate and
          Ya0ln -> breast (corpus-confirmed). The buggy "B5..." entry is
          REMOVED. B57.. -> brain is RETAINED.
      - type: "safety"
        spec: >
          When _classify_text_encounters in
          services/analysis_worker/app/analyzers/anchor_detector.py
          detects history-of-cancer markers in encounter text, it MUST NOT
          emit any diagnosis_confirmed or benign_closure anchor for that
          encounter, regardless of any other malignancy or active-care
          signals present in the same text.
      - type: "functional"
        spec: >
          When the detector finds a malignancy term on a problem-list
          line (and no history-of-cancer guard fires), it emits a
          diagnosis anchor with diagnosis_source="malignancy_term_problem_line",
          diagnosis_term populated, site_key from the matched pattern,
          confidence=0.85, and hitl_required=True.
      - type: "functional"
        spec: >
          When the detector finds an ACTIVE_CANCER_CARE_CODES code in
          encounter text (and no history guard fires), it emits a
          diagnosis anchor with diagnosis_source="active_cancer_care_code",
          diagnosis_code populated, confidence=0.85, hitl_required=True.
          Active-care codes do NOT carry site information, so site_key
          is left to upstream resolution (referral site or surface form).
      - type: "performance"
        spec: >
          On the live patient corpus a full episode rebuild MUST raise
          the 2025 confirmed-cancer count from 24 to >= 28, and the 6
          known-missed episodes (1ecfb55618c2a6d2, d6ed56efd3bc6fcf,
          a6c093d2702d379f, e7c8b99ad0ae77ab, 3eea11cad52c4c58,
          c6e5a430d4e23a88) MUST flip from closed_benign to completed
          or in_progress with diagnosis_confirmed milestones.
    constraints:
      - type: "safety"
        spec: >
          Every entry in ACTIVE_CANCER_CARE_CODES, HISTORY_OF_CANCER_CODE_PREFIXES,
          MALIGNANCY_TERM_PATTERNS and the new MALIGNANCY_READ_CODES
          additions MUST be sourced from configs/read codes/readcode.md or
          from a documented audit observation. No codes added from memory.
      - type: "safety"
        spec: >
          The history-of-cancer guard MUST be evaluated BEFORE any
          diagnosis emission so that it cannot be bypassed by a co-
          occurring malignancy term, malignancy code, or active-care code.
    dependencies: ["DI-LEO-AI-159", "DI-LEO-AI-161"]
    downstream_impacts:
      - "Confirmed-cancer cohort grows by ~6 patients per year"
      - "False-benign rate (closed_benign with hidden cancer signal) drops"
      - "HITL queue grows for active-care and malignancy-term diagnoses"
      - "Survivors with history-of-cancer codes correctly excluded from new diagnoses"
    technical_details:
      language: "Python"
      framework: "analysis_worker + libs"
      file_structure:
        - "libs/domains/code_inventories.py"
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 320

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in tests/test_stale_detector_fixes.py classes
      TestMissedCancerInventories, TestHistoryOfCancerGuard,
      TestActiveCancerCareCode, TestMalignancyTermProblemLine,
      TestB5MappingBugFixed, and TestRegressionMissedCancers pass.
      Live-corpus wipe-and-rebuild lifts 2025 confirmed-cancer count
      from 24 to >= 28 and the 6 known-missed episodes flip status.
    test_protocol: "VT-LEO-AI-170"

  safety_class: "B"
  risks: ["R-LEO-AI-170"]
  tags:
    - "episode-building"
    - "missed-cancer"
    - "problem-list-codes"
    - "active-cancer-care"
    - "history-of-cancer-guard"
    - "ctv3"
