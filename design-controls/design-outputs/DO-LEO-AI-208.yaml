# -- DO-LEO-AI-208 -- Boilerplate lab-report referral guidance suppression (Pattern I)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-208"
  version: "1.0.0"
  type: "Software_Module"
  status: "approved"

  traceability:
    design_inputs:
      - "DI-LEO-AI-211"
    user_needs:
      - "UN-LEO-AI-005"
      - "UN-LEO-AI-006"
    risks_addressed:
      - "R-LEO-AI-199"
    verification_tests:
      - "VT-LEO-AI-203"

  specification:
    title: "Boilerplate lab-report referral guidance + Auto-filed encounter suppression"
    description: |
      Adds two new compiled regex constants in
      anchor_detector.py:

        - _RE_BOILERPLATE_REFERRAL_GUIDANCE: matches conditional
          referral guidance shapes used in standard laboratory
          disclaimer text - "If [PSA|CEA|CA125|FIT|calprotectin|
          value|level|result] [elevated|above|exceeds|raised|
          abnormal|positive|>=] ... refer", "should be referred
          as a 2WW", "Consider 2WW referral if ...", "(please
          note that) referrals made at the time of UTI will be
          rejected".

        - _RE_AUTO_FILED_PREFIX: matches the EMR auto-file
          prefix "<HH:MM> - Surgery: Auto-filed" present on
          every result drop that arrives without a clinician
          keystroke.

      In _classify_text_encounters the text_generic referral
      fallback now also suppresses when:

        (_has_boilerplate AND not _has_structural) OR
        (_is_auto_filed AND not _has_structural)

      alongside the existing C+D narrative suppression and the
      Pattern H family-history suppression. PRISM cancer,
      rejection, and resubmission subtypes remain unaffected.

    acceptance_criteria:
      - criterion: "psa_guidance_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_BOILERPLATE_REFERRAL_GUIDANCE matches 'If the PSA value remains elevated above the age specific threshold, refer as a 2WW'"
      - criterion: "should_be_referred_as_2ww_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_BOILERPLATE_REFERRAL_GUIDANCE matches 'should be referred as a 2WW'"
      - criterion: "auto_filed_prefix_matches"
        type: "functional"
        measurement: "Test"
        target: "_RE_AUTO_FILED_PREFIX matches '11:47 - Surgery: Auto-filed'"
      - criterion: "active_referral_does_not_match_boilerplate"
        type: "safety"
        measurement: "Test"
        target: "_RE_BOILERPLATE_REFERRAL_GUIDANCE does NOT match 'Refer this patient via 2WW today for suspected lung cancer'"
      - criterion: "auto_filed_psa_disclaimer_does_not_emit_referral"
        type: "safety"
        measurement: "Test"
        target: "Auto-filed PSA result with disclaimer 'If the PSA value remains elevated ... refer as a 2WW' MUST NOT add a text_generic referral"
      - criterion: "real_referral_with_lab_disclaimer_still_fires"
        type: "safety"
        measurement: "Test"
        target: "Encounter with 'Outbound referral (XaY59) Fast track referral for suspected prostate cancer. Note: If the PSA value ... refer as a 2WW.' MUST keep at least one referral anchor"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "_RE_BOILERPLATE_REFERRAL_GUIDANCE, _RE_AUTO_FILED_PREFIX, suppression hook in _classify_text_encounters"
      - artifact_type: "test_code"
        location: "tests/test_patient_4842019832_patterns.py"
        description: "TestPatternIBoilerplateLabGuidance (8 cases)"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "_RE_BOILERPLATE_REFERRAL_GUIDANCE"
        - "_RE_AUTO_FILED_PREFIX"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Referral subtype classification on uncoded text encounters"
    risk_control_measures:
      - "Suppression is conditional on the absence of structural referral artefacts (XaY59 / PRISM / Hospital fast-track row / 'Fast track referral for suspected ...' prefix)"
      - "False-positive guard verified: an active referral instruction ('Refer this patient via 2WW today') does NOT match the boilerplate regex"
      - "Real referrals that happen to have a lab disclaimer attached still fire because the structural keep-list overrides suppression"

  verification_status:
    verification_method: "Test"
    verification_complete: true
