# -- DI-LEO-AI-524 -- Episode Engine: Audit Relevance Filter (focus-first)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-524"
  type: "Safety"
  derived_from:
    - "UN-LEO-AI-097"
  requirement: >
    The Episode Engine SHALL focus the milestone-extractor input by
    running an Audit Relevance Filter on every encounter in a
    candidate cancer / multi-site / benign window before invoking
    the milestone extractor. The filter SHALL combine deterministic
    always-keep guards with a cheap Haiku batched relevance triage:

    (1) ALWAYS-KEEP GUARDS -- a pure function SHALL mark an
    encounter as ``kept_by_guard`` (and bypass the LLM) if any of
    the following hold:
      * the encounter is linked to a cancer-coded SNOMED edge in
        the knowledge graph for this patient, OR
      * the encounter was tagged in ANY anchor role by the
        segmenter for this candidate window (referral, first_seen,
        diagnosis_confirmed, treatment_started, treatment_completed,
        benign_closure, first_presentation, place_of_first_
        presentation, outcome_letter, etc.) -- the segmenter
        already classified the encounter as pathway-relevant and
        the LLM SHALL NOT be allowed to drop it, OR
      * the encounter has already been flagged by the existing
        deterministic safety-netting or disruption hint detectors.
    Encounters marked by a guard SHALL appear in the focused set
    regardless of any subsequent LLM judgement.

    (2) HAIKU BATCHED RELEVANCE TRIAGE -- the remaining (un-guarded)
    encounters SHALL be batched in groups of up to 20 and submitted
    to a Bedrock Haiku call with a forced ``submit_relevance`` tool
    that returns, per encounter:
      * ``encounter_id`` (echo of input)
      * ``keep`` (boolean)
      * ``reason`` (one short plain-English sentence, reading age
        9-11, naming why the encounter was kept or dropped)
    The prompt SHALL be supplied with the suspected_site from the
    segmenter and SHALL instruct Haiku to KEEP encounters bearing
    on the suspected cancer or its workup, the suspected anatomical
    site or its synonyms, cancer treatment, cancer safety-netting
    advice, or pathway disruptions; and to DROP routine non-cancer
    care, repeat prescriptions for unrelated conditions, dental /
    eye / ENT / podiatry referrals not in the suspected site, and
    administrative echoes (failed encounter, scheduling SMS, etc.).

    (3) FOCUSED SET ASSEMBLY -- the focused set passed to the
    milestone extractor SHALL be the union of (a) all encounters
    kept by the guards and (b) all encounters with ``keep == true``
    in the LLM triage, preserving original chronological order. The
    chain SHALL record on the EpisodeOfCare audit trace:
      * ``audit_input_encounters`` (count of in-window encounters
        before filtering)
      * ``audit_kept_by_guards`` (count + list of encounter_ids)
      * ``audit_kept_by_llm`` (count + list)
      * ``audit_dropped_by_llm`` (count + sample of up to 10
        ``{encounter_id, reason}`` pairs for transparency)

    (4) FAIL-OPEN ON LLM ERROR -- if the relevance triage Haiku
    call fails (network, throttle, schema parse error), the chain
    SHALL fall back to ``keep_all_unguarded = true`` for that
    batch, log a structured warning, and proceed to the milestone
    extractor with the unfiltered (or partly-filtered) set rather
    than dropping anything. This guarantees the no-encounter-
    silently-dropped invariant survives transient LLM failures.

    (5) LLMUsage CAPTURE -- every relevance triage call SHALL
    record an ``LLMUsage`` node with ``stage =
    audit_relevance_filter``, batch size, latency, token counts,
    and ``LLMCostConfig`` so the cohort run produces a per-patient
    cost breakdown that distinguishes focus from extraction.

  rationale: >
    The original milestone extractor (DI-LEO-AI-503) was given every
    encounter in the candidate window. On record-rich patients the
    long tail of routine non-cancer care and admin echoes diluted
    the signal -- the LLM missed safety-netting notes, missed
    pathway disruptions, and on the largest windows ran into the
    timeline_loader's hard 4000-character per-encounter truncation,
    silently shortening or dropping encounter content. The
    "focus-first" architecture solves both problems at once: (a) the
    common case becomes a smaller, signal-rich prompt that the
    extractor handles in a single Haiku call, and (b) the
    always-keep guards make the no-encounter-silently-dropped
    invariant deterministic for the encounters that matter most
    (cancer-coded, anchor, already-flagged), so the LLM is only
    adjudicating the ambiguous middle. Per-encounter dropped
    reasons are surfaced on the audit trace so a clinician can
    review the focus decisions in one click. The fail-open
    behaviour on LLM error is critical: a transient Bedrock outage
    must never silently turn an encounter into a missing milestone.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: >
          Always-keep guards mark every cancer-coded encounter,
          every encounter the segmenter tagged in any anchor role
          for this window, and every encounter flagged by the
          deterministic safety-netting / disruption detector with
          kept_by_guard = true; these encounters appear in the
          focused set even when the LLM triage returns
          keep == false for the same encounter_id.
      - type: "functional"
        spec: >
          The Haiku relevance triage SHALL be invoked at most
          ceil(non_guarded_count / 20) times per window; each call
          SHALL receive a ``submit_relevance`` tool with
          encounter_id and keep + reason for every input encounter.
      - type: "safety"
        spec: >
          When the Haiku triage call fails or returns an
          unparseable response for a batch, every encounter in
          that batch SHALL flow through to the focused set with
          kept_by_guard = false and kept_by_fallback = true; the
          chain SHALL log a structured warning naming the batch
          size and the error code.
      - type: "safety"
        spec: >
          The focused set SHALL preserve original chronological
          order and SHALL contain no duplicate encounter_ids.
      - type: "safety"
        spec: >
          Each EoC SHALL record audit_input_encounters,
          audit_kept_by_guards, audit_kept_by_llm,
          audit_dropped_by_llm (with up to 10
          {encounter_id, reason} samples), and audit_filter_failed
          (boolean) on its audit trace.
    constraints:
      - type: "safety"
        spec: >
          The relevance triage prompt SHALL NEVER be allowed to
          drop an encounter that the always-keep guards have
          already marked; the guard decision is final.
      - type: "performance"
        spec: >
          Audit Relevance Filter latency for an N-encounter window
          SHALL be no more than ceil(N/20) * single-Haiku-batch
          latency (sequential batched execution by design).
    dependencies:
      - "DI-LEO-AI-500"
      - "DI-LEO-AI-503"
    downstream_impacts:
      - "Milestone extractor receives a focused encounter set"
      - "Window partitioner (DI-LEO-AI-525) operates on the focused set, not the raw window"
      - "EpisodeOfCare audit trace gains audit_input/kept/dropped fields"
      - "LLMUsage cost reporting gains audit_relevance_filter stage"
    technical_details:
      language: "Python"
      framework: "libs.llm_client.factory.LLMClient (Bedrock Haiku) + Pydantic"
      file_structure:
        - "services/analysis_worker/app/episode_engine/agents/audit_relevance_filter.py"
        - "libs/prompts/episode_engine/audit_relevance_filter_v1.py"
        - "services/analysis_worker/app/episode_engine/chain.py"
        - "services/analysis_worker/app/episode_engine/schemas.py"
      estimated_loc: 380

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-522 must pass on all critical and total cases:
      always-keep guard for cancer-coded encounters, anchor
      preservation, batched Haiku call shape, kept/dropped trace
      fields populated, fail-open on Haiku error, no-guard-encounter
      -ever-dropped invariant. The frozen-cohort regression
      (VT-LEO-AI-507) must still yield the SYN-EE-001 milestones
      after the focus filter is wired in.
    test_protocol: "VT-LEO-AI-522"

  safety_class: "B"
  risks:
    - "R-LEO-AI-512"
  tags:
    - "episode-engine"
    - "audit-relevance-filter"
    - "focus"
    - "haiku"
    - "always-keep-guards"
    - "fail-open"
