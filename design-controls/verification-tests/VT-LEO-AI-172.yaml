          action: "After rebuild, count closed_benign episodes with cancer_type in ('skin','melanoma') AND any encounter text containing 'lentigo maligna' OR '7G055' OR 'wide excision of skin lesion' OR 'Skin Cancer Follow Up'."
          expected_result: "Count drops from 3 (baseline) to 0."
          verification_method: "automated"
      acceptance_criteria:
