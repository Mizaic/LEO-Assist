# -- DO-LEO-AI-114 -- Disorder verifier v2 (GATE_FAILED fail-closed)
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-114"
  version: "2.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-116"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-001", "R-LEO-AI-026", "R-LEO-AI-030"]
    verification_tests: ["VT-LEO-AI-115"]

  specification:
    title: "Disorder verifier fail-closed with explicit GATE_FAILED verdict"
    description: |
      - DisorderVerdict enum gains ``GATE_FAILED = "gate_failed"``.
      - ``_fail_verdict_for_mode`` returns ``gate_failed`` in both HITL
        and autonomous modes (and any unknown mode).
      - ``verify_disorder`` writes ``disorder_verdict`` on the entity
        dict for downstream layers and, on GATE_FAILED, sets
        ``__needs_review__=True`` and ``__gate_failed__=True``.
      - The post-processing disorder-gate layer recognises GATE_FAILED
        and routes the entity to review rather than auto-suppress or
        auto-code.

    acceptance_criteria:
      - criterion: "fail_verdict_for_mode is always gate_failed"
        type: "safety"
        measurement: "Test"
        target: "HITL, autonomous, and unknown modes all return 'gate_failed'"
      - criterion: "consensus failure surfaces GATE_FAILED"
        type: "safety"
        measurement: "Test"
        target: "provider exception or unknown verdict -> DisorderVerdict.GATE_FAILED"
      - criterion: "gate-layer marks the entity"
        type: "functional"
        measurement: "Test"
        target: "__needs_review__=True, __gate_failed__=True, disorder_verdict='gate_failed'"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/llm_client/disorder_verifier.py"
        description: "DisorderVerdict.GATE_FAILED; _fail_verdict_for_mode; verify_disorder entity mutations"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/pipeline/post_processing.py"
        description: "Disorder gate layer handles GATE_FAILED"
        storage_location: "git"
    technical_details:
      language: "Python"
      loc: 60
      key_functions:
        - "verify_disorder"
        - "_fail_verdict_for_mode"
        - "_apply_disorder_gate"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Gate failure MUST be surfaced explicitly rather than silently defaulted to active_diagnosis."
    risk_control_measures:
      - "HITL no longer defaults to active_diagnosis on failure -- gate_failed is held for review."
      - "Autonomous fail-safe strengthened: explicit gate_failed replaces generic uncertain default."

  verification_status:
    verification_method: "Test"
    verification_complete: false
