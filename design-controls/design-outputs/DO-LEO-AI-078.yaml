# -- DO-LEO-AI-078 -- Appointment Header Filter + Resolver Normalisation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-078"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-080", "DI-LEO-AI-004"]
    user_needs: ["UN-LEO-AI-002"]
    risks_addressed: ["R-LEO-AI-054"]
    verification_tests: ["VT-LEO-AI-080", "VT-LEO-AI-003"]

  specification:
    title: "Appointment Header Filter and Resolver Input Normalisation"
    description: |
      Two complementary precision improvements to the clinical coding pipeline:

      1. Appointment/admin header filter (DI-LEO-AI-080):
         is_header_sentence(text) detects administrative header lines using
         a conservative regex and filter_header_sentences(chunks) removes
         them from the sentence list before any extractor is called.

      2. Resolver input normalisation (DI-LEO-AI-004 bug fix):
         _normalise_for_resolve(text) strips trailing numeric lab values
         plus SI units (e.g. "1.05 mmol/L") and EMIS local code suffixes
         (e.g. "(X78gA)") from evidence phrases before they are sent to
         /terminology/resolve, preventing the resolver from returning unit
         qualifier concepts instead of the intended lab test concepts.

    acceptance_criteria:
      - criterion: "Header sentences filtered"
        type: "functional"
        measurement: "Test"
        target: "Timestamp-led, 'Entered at:', appointment confirmation, and non-clinical team headers removed"
      - criterion: "Clinical sentences preserved"
        type: "functional"
        measurement: "Test"
        target: "Zero false-positive filtering of clinical content"
      - criterion: "Resolver normalisation"
        type: "functional"
        measurement: "Test"
        target: "Lab strings with numeric values send cleaned term to resolver; result keyed by original term"
      - criterion: "EMIS code stripping"
        type: "functional"
        measurement: "Test"
        target: "Evidence phrases with (XNNNNN) suffix resolve correctly after stripping"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/nlp/sentence_splitter.py"
        description: "is_header_sentence(), filter_header_sentences()"
      - artifact_type: "source_code"
        location: "services/coding_worker/app/pipeline/pipeline_service.py"
        description: "filter_header_sentences() call after sentence split"
      - artifact_type: "source_code"
        location: "libs/terminology/client.py"
        description: "_normalise_for_resolve(), updated resolve() and resolve_raw()"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 80
      key_functions:
        - "is_header_sentence"
        - "filter_header_sentences"
        - "_normalise_for_resolve"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Prevention of administrative text being coded as clinical findings"
      - "Correct SNOMED resolution of lab result strings"
    risk_control_measures:
      - "Conservative header detection (err on side of keeping sentences)"
      - "Original text preserved in Neo4j; normalisation only affects resolver query"
      - "Result re-keying ensures callers receive results keyed by their original terms"

  verification_status:
    verification_method: "Test"
    verification_complete: true
