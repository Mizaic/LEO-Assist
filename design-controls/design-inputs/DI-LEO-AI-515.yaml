# -- DI-LEO-AI-515 -- Sync LLM entry points emit token + cost telemetry
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-515"
  type: "Functional"
  derived_from: ["UN-LEO-AI-091"]
  requirement: >
    DI-LEO-AI-506 wired LLM cost telemetry through the async
    helper ``libs.llm_client.json_helper.invoke_llm_json``.
    The audit performed on 2026-04-18 found that the dominant
    LLM entry point in production is the SYNC helper
    ``libs.llm_client.factory.LLMClient.converse`` (used by
    extractor pipelines, escalation, consensus, label
    verifier, Ask LEO, terminology suggesters, and the
    candidate AI first-pass) plus
    ``libs.llm_client.providers.invoke_with_fallback`` (used
    by the pipeline fix analyzer). Neither helper currently
    fires ``track_llm_usage``, so ~14 production surfaces
    silently drop their cost data.

    The system SHALL extend the cost-telemetry contract so
    every sync LLM entry point reports usage with the same
    fidelity the async helper already does. Specifically:

    (a) ``LLMClient.converse`` (both the Bedrock and Azure
        branches) SHALL fire the registered tracking
        callback ONCE per logical call. The callback SHALL
        receive ``model_name``, ``model_provider`` (one of
        ``"aws"`` / ``"azure"``), ``agent_task``,
        ``patient_id``, ``input_tokens``, ``output_tokens``,
        ``cache_read_input_tokens``,
        ``cache_creation_input_tokens``, ``latency_ms``,
        ``success`` and ``error_message``. The fields
        ``input_tokens``, ``output_tokens`` and
        ``cache_read_input_tokens`` SHALL match the values
        already returned on ``LLMResponse``.

    (b) ``LLMClient.converse`` SHALL accept two new optional
        keyword arguments -- ``agent_task: str = "unknown"``
        and ``patient_id: str = ""`` -- and SHALL forward
        them to the tracking callback unchanged. Existing
        callers that do not pass them SHALL continue to work
        without code change (defaults preserve current
        behaviour).

    (c) The callback SHALL fire on the FAILURE path as well
        as the success path. When ``LLMClient.converse``
        raises, the helper SHALL still emit a tracking event
        with ``success=false``, ``error_message`` truncated
        to <= 400 chars, ``latency_ms`` measured to the point
        of failure, and zero token counts before re-raising
        the original exception.

    (d) ``libs.llm_client.providers.invoke_with_fallback``
        SHALL emit a tracking event for whichever provider
        actually answered (Bedrock primary or Azure
        fallback) using ``extract_token_counts(response,
        provider)`` from the existing token tracker module.

    (e) The active ``LLMUsageRecorder``
        (``libs.llm_client.usage_recorder``) SHALL pick up
        sync ``converse`` calls automatically through the
        same default callback that already routes
        ``invoke_llm_json`` events. No recorder API changes
        are required.

    (f) Telemetry emission SHALL be best-effort: a callback
        exception or a missing/invalid usage object SHALL
        NOT cause ``LLMClient.converse`` to raise. Failures
        in the tracking path SHALL be logged at DEBUG (the
        existing ``track_llm_usage`` swallow behaviour is
        retained).

    (g) Telemetry emission SHALL add no more than 5 ms p95
        per call (a single dict construction plus an
        already-resolved coroutine).

  rationale: >
    The compliance audit against ``.cursor/rules/llm-cost-telemetry.mdc``
    showed that 14 of 14 non-compliant surfaces share a single
    root cause: ``LLMClient.converse`` extracts token counts
    into ``LLMResponse`` (lines 305-332 of factory.py) but
    never forwards them to ``track_llm_usage``. Fixing the
    converse helper is the smallest possible change that
    restores universal observability without touching any
    of the 14 caller files. ``invoke_with_fallback`` is
    fixed at the same time because it is the only other
    sync path that bypasses ``LLMClient``.

  machine_spec:
    agent_prompt: |
      Wire track_llm_usage into LLMClient.converse and
      invoke_with_fallback. Add agent_task / patient_id
      kwargs. Fire on both success and failure paths.
      Best-effort -- never break a caller.

    acceptance_criteria:
      - type: "functional"
        spec: "LLMClient.converse fires track_llm_usage exactly once per call with input_tokens/output_tokens/cached_input_tokens matching the returned LLMResponse for the Bedrock provider"
      - type: "functional"
        spec: "LLMClient.converse fires track_llm_usage exactly once per call for the Azure provider with input_tokens/output_tokens/cached_input_tokens matching the returned LLMResponse"
      - type: "functional"
        spec: "When LLMClient.converse raises, the callback is fired with success=false, error_message truncated to <=400 chars, and zero token counts; the original exception is then re-raised"
      - type: "functional"
        spec: "agent_task and patient_id kwargs are forwarded verbatim to the callback; default values preserve existing behaviour"
      - type: "functional"
        spec: "An active LLMUsageRecorder accumulates input/output/cached tokens from converse calls (default callback path, no recorder API change)"
      - type: "functional"
        spec: "invoke_with_fallback emits exactly one tracking event for whichever provider answered (Bedrock primary OR Azure fallback)"
      - type: "safety"
        spec: "A callback that raises does NOT cause converse to raise; the response is returned unchanged"

    constraints:
      - type: "performance"
        spec: "Telemetry emission SHALL add no more than 5 ms p95 per converse call (measured locally with a no-op callback)"
      - type: "compatibility"
        spec: "Existing callers that do not pass agent_task / patient_id SHALL continue to compile and run without code change"
      - type: "data-integrity"
        spec: "Token counts forwarded to the callback SHALL be int(...) and >= 0"

    dependencies: ["DI-LEO-AI-506"]
    downstream_impacts:
      - "All 14 LLMClient.converse callers (escalation, consensus, label_verifier, candidate_ai_first_pass, llm_extractor, training, _training_askleo, prompts, terminology, encounter_query_understanding, terminology_api/concepts, exclusion_detector, _extractor, plus fix_analyzer via invoke_with_fallback) become observable to LLMSpendPanel and per-tenant billing without touching their source"
      - "LLMUsageRecorder users get spend totals for sync paths automatically"

    technical_details:
      language: "Python"
      framework: "asyncio / boto3 / openai"
      libraries: ["boto3", "openai"]
      file_structure:
        - "libs/llm_client/factory.py"
        - "libs/llm_client/providers.py"
        - "tests/llm_client/test_converse_tracking.py"
        - "tests/llm_client/test_invoke_with_fallback_tracking.py"
      estimated_loc: 180

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All pytest cases in the two test files pass. Manual
      smoke test: trigger an Ask LEO call and confirm the
      LLMSpendPanel shows it.
    test_protocol: "VT-LEO-AI-513"

  safety_class: "B"
  risks: ["R-LEO-AI-506"]
  tags:
    - "observability"
    - "cost-tracking"
    - "llm"
    - "audit-event"
