# -- DI-LEO-AI-106 -- Training Pipeline Quality Capabilities
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-106"
  type: "Functional"
  derived_from: ["UN-LEO-AI-060"]
  requirement: >
    The training pipeline SHALL implement: (1) span realignment that re-derives
    entity start/end from surface text before DocBin creation; (2) assertion
    filtering that excludes negated/hypothetical/family_history/possible entities
    from training data; (3) per-entity F1 surfaced in GET /train/jobs/{id} as
    per_label_f1; (4) warm-start from promoted blob via TRAINING_BASE_MODEL_VERSION;
    (5) frozen golden evaluation set with MODEL_MIN_GOLDEN_F1 gate; (6) active
    learning candidate scoring by token entropy with GET /api/training/candidates/active-learning-queue.

  rationale: >
    Stale entity offsets cause incorrect span boundaries in training data,
    degrading NER accuracy silently. Non-present entities (negated, hypothetical)
    teach the model to detect spans the patient does not have, reducing
    clinical precision. Hidden per-entity F1 prevents targeted improvement.
    Cold-starting discards prior learning. No frozen benchmark means regressions
    go undetected. Arbitrary annotation order wastes reviewer time on
    uninformative examples. All six gaps directly affect clinical coding accuracy.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "_realign_entity() re-derives start/end using find_span(); returns None when surface text not found"
      - type: "functional"
        spec: "Entities with assertion in TRAINING_EXCLUDE_ASSERTIONS are removed before DocBin; count logged"
      - type: "functional"
        spec: "job.to_dict() returns per_label_f1 dict at top level; precision/recall/f1 shortcuts present"
      - type: "functional"
        spec: "TRAINING_BASE_MODEL_VERSION triggers _fetch_warm_start_model(); init_tok2vec_path passed to spacy train"
      - type: "functional"
        spec: "GoldLabel.frozen_golden_set flag settable via PATCH /training/gold-labels/{id}/golden-set"
      - type: "functional"
        spec: "evaluate_model() runs second pass against frozen golden set; fails gate if golden_f1 < MODEL_MIN_GOLDEN_F1"
      - type: "functional"
        spec: "GET /api/training/candidates/active-learning-queue returns pending candidates ordered by uncertainty_score DESC"
      - type: "safety"
        spec: "Span realignment failure logs a warning and drops the entity; it does NOT raise an exception that aborts export"
      - type: "safety"
        spec: "Assertion filter defaults to excluding negated, hypothetical, family_history, possible even if TRAINING_EXCLUDE_ASSERTIONS is not set"
    constraints:
      - type: "safety"
        spec: "Warm-start failure (blob download error) MUST fall back to cold-start and log a warning; it must NOT abort the training job"
      - type: "safety"
        spec: "Golden gate failure MUST set job status=failed and include GOLDEN GATE FAILED in the error message"

  dependencies: []
  downstream_impacts:
    - "Model training accuracy"
    - "NER entity span quality"
    - "Active learning annotation efficiency"
    - "Post-deployment clinical coding precision"

  technical_details:
    language: "Python"
    framework: "spaCy / FastAPI"
    file_structure:
      - "services/training_worker/app/label_exporter.py"
      - "services/training_worker/app/trainer.py"
      - "services/training_worker/app/evaluator.py"
      - "services/training_worker/app/job_store.py"
      - "services/training_worker/app/job_runner.py"
      - "libs/cypher/golden_set_queries.py"
      - "libs/cypher/training_candidate_queries.py"
      - "services/api/app/routers/training.py"
    estimated_loc: 450

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All test cases in VT-LEO-AI-106 pass: span realignment, assertion
      filter, per-label metrics, warm-start fallback, golden gate, and
      active learning queue all behave as specified.
    test_protocol: "VT-LEO-AI-106"

  safety_class: "B"
  risks: ["R-LEO-AI-072"]
  tags: ["training", "span-realign", "assertion-filter", "active-learning", "golden-set", "warm-start"]
