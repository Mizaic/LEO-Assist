# -- DI-LEO-AI-053 -- Semantic Tag Cross-Validation in Coding Pipeline
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-053"
  type: "Safety"
  derived_from: ["UN-LEO-AI-001"]
  requirement: >
    The label verification pipeline SHALL cross-validate the semantic tag
    returned by the terminology resolver against the LLM-extracted entity
    label for every codeable entity.  The terminology API call SHALL be
    unbiased (no expected_tags parameter) so that the ranking reflects the
    best match regardless of the extraction label.  The system SHALL
    inspect the top 3 SNOMED candidates and compare their semantic tags
    (mapped back to NER labels) against the entity label.

    When a mismatch is detected:
      (a) If the score delta between the best differing-tag candidate and
          the best same-tag candidate exceeds 0.40, AND the top candidate
          score >= 0.90, the entity label SHALL be auto-reclassified
          in-place to the suggested label.
      (b) Otherwise, the CodingReview item SHALL be flagged with
          suggested_label and tag_mismatch_delta fields and routed to
          HITL review (decision_tier = 2, tier_reason =
          "semantic_tag_mismatch").

    The CodingReview Neo4j node schema SHALL include suggested_label
    (string) and tag_mismatch_delta (float) properties.  The Operations
    UI SHALL display a visible warning when a semantic tag mismatch is
    present on a review item.

  rationale: >
    Without cross-validation, the terminology resolver may return a
    high-confidence match whose semantic tag disagrees with the
    LLM-extracted entity type (e.g. the LLM labels "pain" as a
    "finding" but the resolver's top candidate is tagged "disorder").
    This mismatch can cause silent miscoding: the entity is coded
    against a concept of the wrong clinical category, leading to
    incorrect SNOMED assignments that may affect clinical coding
    accuracy, quality measures, and patient safety.  Cross-validation
    catches these discrepancies deterministically.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "_resolve_terms_via_api is called without expected_tags — unbiased ranking"
      - type: "safety"
        spec: "_cross_check_semantic_tag inspects top 3 candidates and maps semantic_tag to NER label via _snomed_tag_to_label"
      - type: "safety"
        spec: "Score delta < 0.10 between same-tag and different-tag candidates is ignored (no spurious flags)"
      - type: "safety"
        spec: "Auto-reclassification occurs only when score >= 0.90 AND delta >= 0.40"
      - type: "safety"
        spec: "Non-auto-reclassified mismatches set decision_tier=2 with tier_reason='semantic_tag_mismatch'"
      - type: "data"
        spec: "CodingReview UPSERT persists suggested_label and tag_mismatch_delta to Neo4j"
      - type: "data"
        spec: "GROUP_CODING_REVIEWS_BY_ENTITY, GET_CODING_REVIEW_QUEUE, and GET_CODING_REVIEW_FOR_ENTITY queries return suggested_label and tag_mismatch_delta"
      - type: "ui"
        spec: "ReviewCard displays a 'Tag mismatch' warning chip when suggestedLabel is present"
      - type: "ui"
        spec: "CodingReviewCasesModal displays a semantic tag mismatch Alert with extracted vs suggested label and delta"
      - type: "test"
        spec: "test_semantic_tag_cross_validation.py covers agreement, mismatch detection, small-delta suppression, auto-reclassification, and Cypher query field inclusion"

    constraints:
      - type: "safety"
        spec: >
          The cross-validation thresholds (auto-reclassify score, same-tag
          ceiling, min delta) MUST be configurable via environment variables
          (TAG_XVAL_AUTO_RECLASSIFY_SCORE, TAG_XVAL_SAME_TAG_CEILING,
          TAG_XVAL_MIN_DELTA) to allow tuning without code changes.
      - type: "architecture"
        spec: >
          The cross-validation operates within _check_terminology_coding
          in label_verifier.py.  It does not add a separate API call; it
          reuses the existing unbiased terminology search results.

    dependencies: ["DI-LEO-AI-050"]

    downstream_impacts:
      - "Coding review queue: additional items may appear due to detected mismatches"
      - "Auto-reclassification changes entity labels in-place before coding decision"
      - "UI: reviewers see mismatch warnings and can correct entity types"
      - "Training data quality: prevents silently miscoded entities from entering gold data"

    technical_details:
      language: "Python, TypeScript"
      framework: "FastAPI, React (MUI)"
      file_structure:
        - "services/api/app/services/label_verifier.py"
        - "libs/cypher/coding_review_queries.py"
        - "services/ui/src/components/operations/ReviewCard.tsx"
        - "services/ui/src/components/operations/ReviewSection.tsx"
        - "services/ui/src/components/operations/CodingReviewCasesModal.tsx"
        - "tests/test_semantic_tag_cross_validation.py"
        - "tests/test_hitl_tier_integration.py"
      estimated_loc: 200

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All semantic tag cross-validation tests pass
      (test_semantic_tag_cross_validation.py), confirming agreement
      detection, mismatch flagging, small-delta suppression,
      auto-reclassification thresholds, and Cypher query field
      inclusion.  All existing HITL tier integration tests continue to
      pass (test_hitl_tier_integration.py).
    test_protocol: "VT-LEO-AI-046"

  safety_class: "B"
  risks: ["R-LEO-AI-035", "R-LEO-AI-001"]
  tags:
    - "clinical-safety"
    - "semantic-tag"
    - "cross-validation"
    - "coding-accuracy"
    - "defence-in-depth"
    - "terminology-api"
