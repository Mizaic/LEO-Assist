# -- DO-LEO-AI-150 -- EditRuleDialog and apply_rule_edit service
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-150"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-154"]
    user_needs: ["UN-LEO-AI-028"]
    risks_addressed: ["R-LEO-AI-106"]
    verification_tests: ["VT-LEO-AI-152"]

  specification:
    title: "Editable rule review dialog with versioned write-back"
    description: |
      Two-column centred MUI Dialog (~1100 px) for editing pending
      AppropriatenessRule logic before approval. Reviewers can replace,
      add, or remove SNOMED concepts, change AT_LEAST minimums, edit
      demographic checks, and switch group kinds (AND / OR / NOT /
      AT_LEAST). The right column hosts a debounced /api/terminology/search
      panel bound to the focused chip or "Add concept" target.

      Saving sends action="edit" with an updates payload to the existing
      decision endpoint. The new apply_rule_edit service validates the
      tree (depth, node count, structural rules, SNOMED concept existence),
      writes a brand-new :AppropriatenessRule node with status='active',
      links it to the same Recommendation, supersedes the predecessor
      via [:SUPERSEDES], and writes an immutable GuidanceAuditEvent.

      Removed surfaces (per DI-LEO-AI-154): duplicated NICE recommendation
      block inside the edit surface (replaced with collapsible "View NICE
      source" link), and the redundant plain-English summary in the
      session-approved card (the recommendation_text is now shown
      directly).
    acceptance_criteria:
      - criterion: "logic_tree_validator"
        type: "safety"
        measurement: "Test"
        target: >
          validate_logic_tree raises LogicTreeValidationError on every
          structural defect and returns the deduplicated set of concept
          ids on success.
      - criterion: "version_writeback"
        type: "functional"
        measurement: "Test"
        target: >
          apply_rule_edit creates a new rule node, supersedes the old one,
          and writes a GuidanceAuditEvent in a single call.
      - criterion: "dialog_save_gating"
        type: "functional"
        measurement: "Test"
        target: >
          Save button is disabled until reason >= 3 chars AND
          findValidationError(tree) is null.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/services/guidance_rule_edit.py"
        description: >
          LogicNode/RuleUpdates Pydantic models, validate_logic_tree,
          apply_rule_edit, EditNotApplicable, LogicTreeValidationError.
      - artifact_type: "source_code"
        location: "services/api/app/routers/guidance_rules.py"
        description: >
          Extended RuleDecisionRequest with optional updates field;
          decide_rule dispatches to _decide_rule_with_edits when an edit
          payload is supplied.
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/guidance/EditRuleDialog/index.tsx"
        description: "EditRuleDialog shell -- name, strength, reason, save flow."
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/guidance/EditRuleDialog/LogicTreeEditor.tsx"
        description: "Recursive editable tree view (group + concept + demographic)."
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/guidance/EditRuleDialog/ConceptSearchPanel.tsx"
        description: "Debounced SNOMED search; replace or add a CONCEPT child."
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/guidance/EditRuleDialog/treeOps.ts"
        description: "Pure helpers: applyUpdate, assignNodeIds, stripNodeIds, findValidationError."
    storage_location: "git"
    technical_details:
      language: "Python 3.12 / TypeScript 5"
      loc: 1200
      key_functions:
        - "validate_logic_tree"
        - "apply_rule_edit"
        - "EditRuleDialog"
        - "LogicTreeEditor"
        - "applyUpdate"
        - "findValidationError"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Server-side validation of every reviewer-supplied logic tree"
      - "Predecessor lookup that refuses to edit superseded/rejected rules"
      - "SNOMED concept-existence verification before writing the new rule"
      - "Immutable audit event recording editor, reason, predecessor id"
    risk_control_measures:
      - "Required 'Reason for edit' (>= 3 chars) gating Save"
      - "Server-side depth/node-count caps (6 / 80) defending against pathological trees"
      - "Predecessor preserved (status=superseded), enabling rollback"
      - "[:SUPERSEDES] edge keeps the existing diff endpoint working"

  verification_status:
    verification_method: "Test"
    verification_complete: false
