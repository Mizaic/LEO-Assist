# -- UN-LEO-AI-012 -- Composable Pipeline Architecture
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-012"
  title: "System supports composable pipelines defined as directed workflow graphs"
  description: |
    System administrators need to define audit pipelines as directed
    workflow graphs with support for branching, fan-out/fan-in,
    conditional edges, and cross-pipeline triggers. Pipelines are
    composed from the platform's capability registry and stored as
    workflow definitions in Neo4j. This enables different pipeline
    configurations for different use cases (full audit, quick code,
    screen and alert) without code changes.

  stakeholder:
    type: "technical"
    role: "System Administrator"
    organization: "Platform Operations"

  priority: "MUST"

  rationale: |
    Different audit use cases require different combinations of
    capabilities. A rigid, fixed pipeline would force all patients
    through the same processing regardless of need. Composable pipelines
    enable fit-for-purpose processing, reduce unnecessary computation,
    and allow clinical teams to tailor workflows to their programme
    requirements.

  benefit: "Flexible pipeline composition enables fit-for-purpose audit processing without code changes"

  use_case: |
    1. System administrator opens the pipeline definition interface.
    2. Administrator selects capabilities from the platform registry
       (e.g. shortlisting, coding, episode assembly, quality validation,
       metrics calculation, interpretation).
    3. Administrator arranges capabilities as nodes in a directed acyclic
       graph (DAG).
    4. Administrator defines edges between nodes, including conditional
       edges (e.g. skip interpretation if confidence is above threshold).
    5. Administrator configures fan-out for parallel processing (e.g.
       coding and exclusion detection run in parallel after shortlisting).
    6. Administrator configures fan-in to synchronise parallel branches
       before episode assembly.
    7. Administrator optionally defines cross-pipeline triggers (e.g.
       a screening pipeline triggers a full audit pipeline when alerts
       are raised).
    8. System validates the DAG for cycles, missing dependencies, and
       capability compatibility.
    9. System stores the pipeline definition in Neo4j.
    10. Pipeline is available for execution against patient cohorts.

  current_solution: "Fixed, hard-coded processing pipelines with no configurability"

  pain_points:
    - "All patients processed through identical pipeline regardless of use case"
    - "Adding or removing pipeline steps requires code changes and deployment"
    - "No support for conditional processing or parallel execution paths"
    - "Pipeline changes require full regression testing and regulatory review"

  acceptance_criteria:
    - "System shall support directed acyclic graph (DAG) pipeline definitions"
    - "System shall support branching and conditional edges"
    - "System shall support fan-out and fan-in patterns"
    - "System shall support cross-pipeline triggers"
    - "System shall execute pipeline steps asynchronously via message queue"
    - "System shall track pipeline execution state and enable restart on failure"

  success_metrics:
    - metric: "Pipeline definition time"
      target: "<=1 hour for a new pipeline configuration"
      baseline: "Current: days of development per pipeline"
    - metric: "Pipeline execution reliability"
      target: ">=99.5% successful completion rate"
      baseline: "N/A"
    - metric: "Step failure recovery time"
      target: "<=30 seconds to detect and restart failed step"
      baseline: "N/A"

  regulatory_impact: "medium"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 4.2"
    - "Platform architecture requirements"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-018", "DI-LEO-AI-019"]
  validation_tests: ["VAL-LEO-AI-009"]

  tags: ["pipeline", "workflow", "composable", "cross-cutting", "architecture"]
