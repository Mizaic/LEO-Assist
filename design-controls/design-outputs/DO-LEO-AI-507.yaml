# -- DO-LEO-AI-507 -- Per-context SBAR Situation snippets in PromptConfig
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-507"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-507"]
    user_needs: ["UN-LEO-AI-092"]
    risks_addressed: ["R-LEO-AI-507"]
    verification_tests: ["VT-LEO-AI-509"]

  specification:
    title: "Per-context SBAR Situation snippets seeded as editable PromptConfig nodes"
    description: |
      Each SummarisationContext value gets a :PromptConfig node in
      Neo4j named ``sbar_situation_context_<value>`` (v1). The node
      carries the framing snippet currently held in
      libs.sbar.events.SUMMARISATION_CONTEXT_PROMPTS, plus a
      description that begins with a ``[<Group>]`` prefix
      (Primary care / Secondary care / Statutory and social /
      Quality assurance). The seed script in
      ``scripts/seed_prompt_configs.py`` is extended to upsert one
      entry per value via ``seed_if_missing()``, which already
      preserves any user-edited rows (source='user').

      The runtime resolver (``libs/sbar/source_resolver._resolve_artifact``)
      gains a Neo4j-first fetch for the per-context snippet, with a
      hardcoded-dict fallback if Neo4j returns nothing or raises.
      Per-call caching keeps each SBAR run to a single PromptConfig
      lookup per distinct context.

      The AI Instructions list categoriser
      (``services/ui/src/app/admin/prompts/page.tsx::categorise``)
      is taught to recognise the ``sbar_situation_context_`` name
      prefix and group those rows by the ``[<Group>]`` prefix in the
      description, so platform admins see them grouped by clinical
      setting next to the existing Extraction / Verification rows.
    acceptance_criteria:
      - criterion: "Seed parity"
        type: "functional"
        measurement: "Test"
        target: >
          Every value in libs.sbar.events.SummarisationContext has a
          matching SEED_PROMPTS entry with the correct system_prompt
          and a description that starts with one of the four group
          prefixes.
      - criterion: "Neo4j-first resolver"
        type: "functional"
        measurement: "Test"
        target: >
          When a session returns a row for
          sbar_situation_context_<value>, the resolver returns that
          row's system_prompt as prompt_snippet (not the dict value).
      - criterion: "Fallback on missing / raising session"
        type: "safety"
        measurement: "Test"
        target: >
          When the session is None, returns no row, or raises, the
          resolver returns SUMMARISATION_CONTEXT_PROMPTS[<value>] as
          prompt_snippet so the orchestrator never sees a None.
      - criterion: "Per-call cache"
        type: "performance"
        measurement: "Test"
        target: >
          Resolving two artefacts with the same context_value in one
          call issues at most one PromptConfig lookup against the
          session.
      - criterion: "Categoriser groups by [<Group>] prefix"
        type: "functional"
        measurement: "Test"
        target: >
          For an input PromptConfig named
          'sbar_situation_context_clinic_appointment_prep' with
          description starting '[Primary care]', categorise() returns
          a category whose label is 'Primary care'.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/sbar/events.py"
        description: "SummarisationContext enum (34 members), labels, and prompt fragments"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "libs/sbar/source_resolver.py"
        description: "_resolve_artifact() Neo4j-first lookup with dict fallback + per-call cache"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "scripts/seed_prompt_configs.py"
        description: "Seeds 34 sbar_situation_context_<value> PromptConfig rows"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/prompts/page.tsx"
        description: "categorise() recognises sbar_situation_context_* and groups by description prefix"
        storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 380
      key_functions:
        - "_resolve_artifact"
        - "_get_situation_context_snippet"
        - "categorise"
        - "seed_if_missing"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Per-context Situation framing chosen for the SBAR LLM call"
    risk_control_measures:
      - "Hardcoded fallback dict ensures the orchestrator always
        receives a non-empty framing snippet"
      - "PromptConfig CRUD is admin-only (existing route guards)"
      - "Seed script preserves user-edited rows (source='user')"

  verification_status:
    verification_method: "Test"
    verification_complete: false
