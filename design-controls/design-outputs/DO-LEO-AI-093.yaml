- id: "DO-LEO-AI-093"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-095"]
    user_needs: ["UN-LEO-AI-056"]
    risks_addressed: ["R-LEO-AI-063"]
    verification_tests: ["VT-LEO-AI-095"]

  specification:
    title: "Bulk Reset and Reprocess - Operations Run Flow"
    description: |
      Adds a guarded bulk operations path for admin recovery scenarios.
      Backend endpoint `/pipeline/run-all-patients` supports a preview mode
      that returns impacted patient/encounter counts and an execution mode
      that enforces explicit acknowledgements and typed confirmation before
      resetting patient pipeline artefacts and queueing full pipeline runs.
      UI adds an "All scoped patients" mode with danger warnings, preview
      action, acknowledgements, and typed confirmation.
    acceptance_criteria:
      - criterion: "Preview impact"
        type: "functional"
        measurement: "Test"
        target: "Preview returns patient_count and encounter_count for selected org scope"
      - criterion: "Safety gates"
        type: "safety"
        measurement: "Test"
        target: "Execution is blocked until all acknowledgements and exact confirmation text are provided"
      - criterion: "Queue execution"
        type: "functional"
        measurement: "Test"
        target: "Successful run queues encounter-created jobs on pipeline-jobs and returns progress stream path"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/pipeline.py"
        description: "RunAllPatientsRequest, scope resolver, confirmation validator, run-all-patients endpoint"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/ui/src/app/admin/operations/run/page.tsx"
        description: "All scoped patients mode with preview and multi-step confirmation UI"
        storage_location: "git"
      - artifact_type: "test"
        location: "services/api/tests/test_pipeline_router_runtime.py"
        description: "Preview and confirmation-guard runtime tests"
        storage_location: "git"
    technical_details:
      language: "Python + TypeScript"
      loc: 220
      key_functions:
        - "run_all_patients"
        - "_resolve_scope_patients"
        - "_validate_bulk_run_confirmation"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Bulk reset of patient pipeline artefacts before reprocessing"
      - "Confirmation gating for destructive admin operations"
    risk_control_measures:
      - "Preview-first execution path"
      - "Exact typed confirmation text"
      - "Required acknowledgement flags"
      - "Expected patient count mismatch check (409)"

  verification_status:
    verification_method: "Test"
    verification_complete: false
