# -- UN-LEO-AI-018 -- Screening Programme Support
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-018"
  title: "System identifies eligible patients not engaged with cancer and non-cancer screening programmes"
  description: |
    Quality improvement leads need the system to proactively identify
    eligible patients who have not engaged with cancer and non-cancer
    screening programmes. The system shall cross-reference patient
    demographics (age, sex) and clinical history against screening
    programme eligibility criteria and flag patients with no record of
    screening participation. This supports the Network Contract DES
    requirement for setting out clearer responsibilities for proactively
    identifying and supporting eligible patients to engage with screening
    programmes.

  stakeholder:
    type: "end_user"
    role: "Quality Improvement Lead"
    organization: "NHS Primary Care Network"

  priority: "SHOULD"

  rationale: |
    The updated Network Contract DES (paragraph 28) sets out clearer
    responsibilities for proactively identifying and supporting eligible
    patients to engage with cancer and non-cancer screening programmes.
    Low screening uptake contributes to late-stage diagnosis. Identifying
    non-participants enables targeted outreach and improves population
    health outcomes.

  benefit: "Proactive identification of screening non-participants enables targeted outreach to improve uptake"

  use_case: |
    1. Quality improvement lead configures screening programmes in the
       system (e.g. bowel cancer screening for ages 60-74, breast
       screening for women aged 50-71, cervical screening for women
       aged 25-64).
    2. System cross-references patient demographics against eligibility
       criteria for each configured programme.
    3. System checks patient records for evidence of screening
       participation (invitation accepted, test completed, result
       recorded).
    4. System flags patients with no screening record or whose last
       screening is overdue based on programme intervals.
    5. System generates screening gap reports at practice and PCN level,
       broken down by programme, practice, and demographic group.
    6. Quality improvement lead uses reports to plan targeted outreach
       campaigns for non-participants.
    7. Outreach outcomes are tracked and fed back into the next
       reporting cycle.

  current_solution: "Manual searches in clinical systems using age/sex filters and code queries; spreadsheet-based tracking of non-participants"

  pain_points:
    - "Manual identification is time-consuming and error-prone"
    - "No single view across multiple screening programmes"
    - "Non-participants often not identified until opportunistic contact"
    - "Reporting for DES requires manual data compilation across practices"

  acceptance_criteria:
    - "System shall cross-reference patient demographics against screening eligibility criteria"
    - "System shall detect absence of screening participation records"
    - "System shall generate screening gap reports at practice and PCN level"
    - "System shall support multiple screening programmes (bowel, breast, cervical, lung, AAA)"
    - "System shall flag patients by time since last screening or never-screened status"

  success_metrics:
    - metric: "Eligibility matching accuracy"
      target: ">=95% agreement with manual verification"
      baseline: "Current: manual process, accuracy not measured"
    - metric: "Screening programme coverage"
      target: "100% of configured programmes"
      baseline: "Current: ad-hoc, 2-3 programmes tracked manually"
    - metric: "Report generation time"
      target: "<=60 seconds per practice"
      baseline: "Current: manual compilation, 1-2 days per practice"

  regulatory_impact: "medium"
  safety_impact: "medium"

  derived_from:
    - "Intended Use Statement DC-IU-001"
    - "Network Contract DES Paragraph 28"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "NHS Screening Programmes"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-026"]
  validation_tests: ["VAL-LEO-AI-003"]

  tags: ["screening", "prevention", "des-paragraph-28", "population-health"]
