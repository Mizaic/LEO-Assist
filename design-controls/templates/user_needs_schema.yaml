# ============================================================================
# USER NEEDS SCHEMA - IEC 62304 / FDA 21 CFR Part 820 Compliant
# ============================================================================
# This schema defines the structure for User Needs documentation used in
# the Autonomous eQMS Platform design controls process.
#
# Regulatory References:
# - IEC 62304:2006 Section 5.2.2 (Software Requirements Content)
# - FDA 21 CFR Part 820.30(c) (Design Input)
# - ISO 13485:2016 Section 7.3.3 (Design and Development Inputs)
# - IEC 62366-1:2015 (Usability Engineering - User Needs)
#
# Version: 1.0
# Created: 2025-11-09
# Owner: Quality & Engineering
# ============================================================================

meta:
  schema_version: "1.0"
  schema_name: "User Needs Schema"
  purpose: "Define machine-readable structure for User Needs documentation"
  intended_use: "All user_needs.yaml files in design controls"
  regulatory_compliance:
    - "IEC 62304:2006 - Medical Device Software Lifecycle"
    - "FDA 21 CFR Part 820.30 - Design Controls"
    - "ISO 13485:2016 - Medical Device Quality Management"
    - "IEC 62366-1:2015 - Usability Engineering"
  change_history:
    - version: "1.0"
      date: "2025-11-09"
      change: "Initial schema creation"
      author: "Quality Engineering"

# ============================================================================
# SCHEMA DEFINITION
# ============================================================================

schema:
  user_need:
    description: "A single user need representing a stakeholder requirement"
    required: true
    fields:
      
      # --- IDENTIFICATION ---
      id:
        type: string
        required: true
        format: "UN-{PROJECT}-###"
        description: "Unique user need identifier"
        example: "UN-PLATFORM-001"
        pattern: "^UN-[A-Z]+-\\d{3}$"
        
      title:
        type: string
        required: true
        min_length: 10
        max_length: 200
        description: "Brief, clear statement of the user need"
        example: "System learns and improves autonomously"
        
      description:
        type: string
        required: true
        min_length: 50
        max_length: 5000
        description: "Detailed description of what the user needs and why"
        
      # --- STAKEHOLDER INFORMATION ---
      stakeholder:
        type: object
        required: true
        description: "Who has this need"
        fields:
          type:
            type: enum
            required: true
            values: ["end_user", "customer", "regulatory", "business", "technical", "internal_user", "external_user"]
            description: "Type of stakeholder (end_user=product user, internal_user=Mizaic staff, external_user=customer organization staff)"
            
          role:
            type: string
            required: true
            description: "Specific role of stakeholder"
            example: "Quality Engineer, Quality Manager, Regulatory Affairs Specialist"
            
          organization:
            type: string
            required: false
            description: "Organization type (if applicable)"
            example: "Medical device manufacturer, Pharmaceutical company"
            
      # --- PRIORITY & RATIONALE ---
      priority:
        type: enum
        required: true
        values: ["MUST", "SHOULD", "COULD", "WONT"]
        description: "MoSCoW prioritization"
        definitions:
          MUST: "Critical requirement, system not acceptable without it"
          SHOULD: "Important requirement, should be included if possible"
          COULD: "Desirable but not necessary"
          WONT: "Acknowledged but not planned for this release"
          
      rationale:
        type: string
        required: true
        min_length: 50
        max_length: 2000
        description: "Why this need exists and its business/clinical value"
        
      benefit:
        type: string
        required: true
        description: "Expected benefit of fulfilling this need"
        example: "Reduces manual QMS cycle time from 90 days to 7 days"
        
      # --- CONTEXT ---
      use_case:
        type: string
        required: false
        max_length: 2000
        description: "Concrete use case or scenario demonstrating the need"
        
      current_solution:
        type: string
        required: false
        max_length: 1000
        description: "How this need is currently addressed (if at all)"
        example: "Manual spreadsheet tracking, 90-day cycle time"
        
      pain_points:
        type: array
        required: false
        item_type: string
        description: "Current pain points this need addresses"
        example: ["Manual process error-prone", "Takes 90+ days", "No automation"]
        
      # --- ACCEPTANCE CRITERIA ---
      acceptance_criteria:
        type: array
        required: true
        item_type: string
        min_items: 1
        description: "Observable, testable criteria for need fulfillment"
        example:
          - "System automatically improves auto-approval rate by 10% over 90 days"
          - "Meta-learning operates autonomously without human intervention"
          - "Improvement decisions are auditable and reversible"
        
      success_metrics:
        type: array
        required: false
        item_type: object
        description: "Quantitative metrics for measuring success"
        fields:
          metric:
            type: string
            required: true
            example: "Auto-approval rate improvement"
          target:
            type: string
            required: true
            example: "≥10% increase over 90 days"
          baseline:
            type: string
            required: false
            example: "Current: 50%"
            
      # --- REGULATORY & SAFETY ---
      regulatory_impact:
        type: enum
        required: false
        values: ["none", "low", "medium", "high", "critical"]
        description: "Impact on regulatory compliance"
        
      safety_impact:
        type: enum
        required: false
        values: ["none", "low", "medium", "high", "critical"]
        description: "Potential impact on patient/user safety"
        
      # --- TRACEABILITY ---
      derived_from:
        type: array
        required: false
        item_type: string
        description: "Source documents or higher-level needs"
        example: ["Customer survey 2024", "Market research", "Regulatory requirement"]
        
      related_standards:
        type: array
        required: false
        item_type: string
        description: "Applicable standards or regulations"
        example: ["ISO 14971:2019", "IEC 62304:2006", "FDA 21 CFR Part 820"]
        
      # --- METADATA ---
      metadata:
        type: object
        required: true
        fields:
          created_by:
            type: string
            required: true
            description: "Person/role who documented this need"
            
          created_date:
            type: date
            required: true
            format: "YYYY-MM-DD"
            
          reviewed_by:
            type: string
            required: false
            description: "Reviewer name"
            
          reviewed_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          approved_by:
            type: string
            required: false
            description: "Quality Manager who approved"
            
          approved_date:
            type: date
            required: false
            format: "YYYY-MM-DD"
            
          status:
            type: enum
            required: true
            values: ["draft", "review", "approved", "implemented", "validated", "obsolete"]
            description: "Lifecycle status of user need"
            
          version:
            type: string
            required: false
            format: "semantic versioning"
            description: "Version if user need has been revised"
            
      # --- DOWNSTREAM LINKS ---
      design_inputs:
        type: array
        required: false
        item_type: string
        format: "DI-{PROJECT}-###"
        description: "Design Inputs that implement this user need"
        example: ["DI-PLATFORM-001", "DI-PLATFORM-002"]
        
      validation_tests:
        type: array
        required: false
        item_type: string
        format: "VAL-{PROJECT}-###"
        description: "Validation tests that verify this need is met"
        example: ["VAL-PLATFORM-001"]
        
      # --- CATEGORIZATION ---
      tags:
        type: array
        required: false
        item_type: string
        description: "Tags for categorization and filtering"
        example: ["meta-learning", "automation", "safety-critical"]

# ============================================================================
# VALIDATION RULES
# ============================================================================

validation_rules:
  - rule: "id_format"
    description: "ID must follow pattern UN-{PROJECT}-### with zero-padded number"
    
  - rule: "priority_justification"
    description: "MUST priorities require strong rationale and benefit statement"
    
  - rule: "acceptance_criteria_testable"
    description: "All acceptance criteria must be observable and testable"
    
  - rule: "traceability_forward"
    description: "If status is 'implemented', design_inputs list must be populated"
    
  - rule: "approval_consistency"
    description: "If status is 'approved', approved_by and approved_date must be populated"
    
  - rule: "stakeholder_completeness"
    description: "Stakeholder type and role must both be specified"
    
  - rule: "quantitative_metrics"
    description: "Success metrics should be quantitative where possible"

# ============================================================================
# BEST PRACTICES
# ============================================================================

best_practices:
  writing_user_needs:
    - "Write from user perspective, not system perspective"
    - "Focus on WHAT the user needs, not HOW to implement"
    - "Be specific and measurable"
    - "One user need per stakeholder goal"
    - "Use active voice"
    
  examples:
    good:
      - "Quality Engineer needs to generate production-ready code from Design Inputs in ≤7 days"
      - "System must maintain complete audit trail for all changes per 21 CFR Part 11"
      - "Quality Manager needs to approve/reject Design Outputs with complete risk context"
    bad:
      - "System should have a code generator" # Too vague, system-focused
      - "Database must use Neo4j" # Implementation detail, not user need
      - "Code should be good" # Not measurable
      
  acceptance_criteria_format:
    - "Use 'System shall...' or 'User can...' format"
    - "Include quantitative targets (time, %, count)"
    - "Make criteria independently verifiable"
    - "Each criterion addresses one aspect"

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

examples:
  - example_name: "Meta-Learning User Need"
    file_reference: "user_needs.yaml - UN-PLATFORM-001"
    
  - example_name: "Performance User Need"
    file_reference: "user_needs.yaml - UN-PLATFORM-003"
    
  - example_name: "Safety-Critical User Need"
    file_reference: "user_needs.yaml - UN-PLATFORM-007"

# ============================================================================
# TEMPLATE
# ============================================================================

template: |
  - id: UN-PLATFORM-XXX
    title: "Brief statement of need"
    description: |
      Detailed description explaining what the user needs and why.
      Include context, background, and importance.
    
    stakeholder:
      type: "end_user"
      role: "Quality Engineer"
      
    priority: "MUST"
    
    rationale: |
      Why this need exists. What problem does it solve?
      What value does it provide to users/business?
    
    benefit: "Specific benefit statement with quantitative impact if possible"
    
    use_case: |
      Concrete scenario demonstrating the need:
      1. User logs in...
      2. User navigates to...
      3. User expects to...
    
    current_solution: "How this is done today (if applicable)"
    
    pain_points:
      - "First pain point with current approach"
      - "Second pain point"
    
    acceptance_criteria:
      - "System shall [specific, testable criterion]"
      - "User can [specific action with measurable outcome]"
      - "Performance shall [quantitative target]"
    
    success_metrics:
      - metric: "Metric name"
        target: "Quantitative target"
        baseline: "Current baseline (if known)"
    
    regulatory_impact: "medium"
    safety_impact: "low"
    
    related_standards:
      - "ISO 14971:2019"
      - "IEC 62304:2006"
    
    metadata:
      created_by: "Product Manager"
      created_date: "2025-11-09"
      status: "draft"
    
    tags: ["category1", "category2"]

# ============================================================================
# CHANGE CONTROL
# ============================================================================

change_control:
  user_need_changes:
    minor_changes: "Clarifications, grammar - no approval needed"
    major_changes: "Changes to acceptance criteria, priority - QM approval required"
    new_user_needs: "Must be reviewed and approved before deriving Design Inputs"
    
  lifecycle_states:
    draft: "Initial creation, under development"
    review: "Under review by stakeholders"
    approved: "Approved by Quality Manager, ready for design"
    implemented: "Design Inputs created and implemented"
    validated: "Validation testing completed successfully"
    obsolete: "No longer applicable (with justification required)"
    
  traceability_requirements:
    forward: "Track which Design Inputs implement this need"
    backward: "Track source of need (customer, regulation, etc.)"
    validation: "Link to validation test results"






