# -- DO-LEO-AI-122 -- NCDA interval KPI persistence implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-122"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-125"]
    user_needs: ["UN-LEO-AI-008"]
    risks_addressed: ["R-LEO-AI-085"]
    verification_tests: ["VT-LEO-AI-120"]

  specification:
    title: "kpi_calculator wired into build_episodes with named-property persistence"
    description: |
      Refactors the previously orphaned kpi_calculator module so it is
      called as a terminal post-pass inside build_episodes() for every
      patient/domain. Milestone key sets accept both the canonical
      (diagnosis_confirmed, treatment_started) and legacy (diagnosis,
      treatment) identifiers. KPIs are written with MATCH so unknown
      episode_ids cannot create orphan nodes.
    acceptance_criteria:
      - criterion: "wired into builder"
        type: "functional"
        measurement: "Test"
        target: >
          calculate_kpis is invoked from build_episodes after
          _apply_outcome_inference on every code path.
      - criterion: "milestone-key compatibility"
        type: "functional"
        measurement: "Test"
        target: >
          Both canonical and legacy milestone keys are recognised.
      - criterion: "no orphan nodes"
        type: "safety"
        measurement: "Test"
        target: >
          MATCH-only Cypher; unknown episode_id produces no node.

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/kpi_calculator.py"
        description: "calculate_kpis, _pick_first, _persist_episode_kpis"
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/episode_builder/_builder.py"
        description: "build_episodes terminal call to calculate_kpis"
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 40
      key_functions: ["calculate_kpis", "_persist_episode_kpis", "build_episodes"]

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Persisted interval KPIs are consumed by cancer-pathway dashboards"
    risk_control_measures:
      - "MATCH-only persistence prevents orphan EpisodeOfCare creation"
      - "Legacy+canonical milestone key support avoids silent KPI gaps during migration"

  verification_status:
    verification_method: "Test"
    verification_complete: true
