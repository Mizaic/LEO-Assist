  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Reviewer-facing navigation cue for episode context cross-checks"
    risk_control_measures:
      - "Overlays are read-only presentation; ticks and markers do not mutate encounter data"
      - "Jump handler is the single point of navigation: it clears all filters before scrolling so the target encounter is always visible"
      - "Default brush is always padded by 10 percent so a bit of surrounding context is visible on open"
      - "scrollIntoView is guarded by a function-type check so unit tests cannot crash the tab"
      - "All animation continues to honour prefers-reduced-motion via useMotion()"

  verification_status:
