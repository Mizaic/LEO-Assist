# -- DI-LEO-AI-009 -- Anchor/Milestone Detection
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-009"
  type: "Functional"
  derived_from: ["UN-LEO-AI-005"]
  requirement: "The system SHALL identify clinical milestones (first presentation, referral, specialist visit, investigation, diagnosis, treatment) from coded encounters using programme-defined milestone definitions and SNOMED value sets, assigning dates and confidence scores to each detected milestone"
  rationale: "Milestones define the structure of a clinical episode. Accurate milestone detection is prerequisite for episode building, duration calculation, and pathway quality assessment. Using programme-defined value sets enables different milestone definitions per audit programme."

  machine_spec:
    agent_prompt: |
      Implement anchor/milestone detection (~250 LOC).

      SINGLE PURPOSE: Identify clinical milestones from coded encounters
      using programme-defined milestone definitions and SNOMED value sets.

      REQUIREMENTS:
      1. Load milestone definitions from Neo4j programme configuration
      2. Accept coded encounters with SNOMED concepts and dates
      3. Match encounter codes against milestone SNOMED value sets
      4. Assign milestone type, date, and confidence score
      5. Handle multiple milestones per encounter
      6. Handle ambiguous milestones (same code maps to multiple types)
      7. Support programme-specific milestone definitions

      METHODS:
      - detect_milestones(encounters, programme): Find all milestones
      - load_definitions(programme_id): Fetch milestone value sets
      - match_milestone(encounter, definitions): Check single encounter
      - resolve_ambiguity(candidates): Pick best milestone assignment
      - assign_confidence(milestone, evidence): Score confidence

      CODE CLARITY:
      - Milestone definitions are data, not code
      - Confidence scoring is transparent and auditable
      - Each milestone traces to specific encounter evidence

    acceptance_criteria:
      - type: "test"
        spec: "Milestone detection accuracy >= 90% against gold-standard data"
      - type: "test"
        spec: "All milestones include date, type, and confidence score"
      - type: "test"
        spec: "Programme-specific milestone definitions correctly applied"

    constraints:
      - type: "safety"
        spec: "Missing milestones flagged as gaps -- never silently omitted"
      - type: "code_quality"
        spec: "Milestone definitions are programme data, not hard-coded"

    dependencies: []

    downstream_impacts:
      - "services/analysis_worker -- milestones feed episode building"
      - "services/analysis_worker -- milestones feed duration calculation"
      - "services/ui -- milestones displayed on patient timeline"

    technical_details:
      language: "Python"
      framework: "None"
      libraries: ["neo4j"]
      file_structure:
        - "services/analysis_worker/app/analyzers/anchor_detector.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "Milestone detection accuracy >= 90% against gold-standard data"
    test_protocol: "VT-LEO-AI-009"

  safety_class: "B"
  risks: ["R-LEO-AI-021"]
  tags: ["anchor-detection", "milestone", "episode-building", "analysis"]
