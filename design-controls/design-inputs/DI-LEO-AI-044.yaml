# -- DI-LEO-AI-044 -- Lab Value Diagnostic Inference Prevention
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-044"
  type: "Safety"
  derived_from: ["UN-LEO-AI-001"]
  requirement: >
    The coding pipeline SHALL NOT infer a clinical diagnosis from a lab result
    value. Lab measurements (e.g. eGFR, HbA1c, creatinine, sodium, haemoglobin,
    cholesterol, TSH, troponin, PSA) SHALL be coded only as observable entities
    with their numeric value and unit. A disorder entity SHALL only be generated
    when the encounter text explicitly states a diagnosis.
  rationale: >
    A critical bug was identified where the LLM extraction step inferred
    "Chronic kidney disease stage 1 (disorder)" from an eGFR measurement of
    69 mL/min. The eGFR text included "CKD-EPI" (a formula name) which the
    LLM misinterpreted as a diagnostic abbreviation. Inferring diagnoses from
    lab values is clinically unsafe because: (a) a lab value alone does not
    constitute a diagnosis — clinical judgement is required; (b) the inferred
    diagnosis may be incorrect (eGFR 69 with no kidney damage is not CKD);
    (c) a false diagnosis in the patient record can influence care decisions,
    audit outcomes, and quality measures.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "Extraction prompt explicitly forbids diagnostic inference from lab values"
      - type: "safety"
        spec: "Extraction prompt identifies 'CKD-EPI' as a formula name, not a diagnosis"
      - type: "safety"
        spec: "Extraction prompt includes eGFR example with 'Do NOT also extract chronic kidney disease'"
      - type: "safety"
        spec: "Lab-value guard suppresses disorder entities whose evidence text is a lab result line"
      - type: "safety"
        spec: "Lab-value guard detects CKD-EPI formula name and suppresses CKD/renal inferences"
      - type: "safety"
        spec: "Lab-value guard detects known lab-to-diagnosis inference patterns (eGFR→CKD, HbA1c→diabetes, sodium→hyponatraemia, etc.)"
      - type: "safety"
        spec: "Guard does NOT suppress disorder entities with explicit diagnosis text (e.g. 'Diagnosis: CKD stage 3')"
      - type: "safety"
        spec: "Guard does NOT suppress disorder entities from non-lab sentences"
      - type: "safety"
        spec: "Observable entities are never suppressed by the guard"
      - type: "safety"
        spec: "Precision gates reject 'CKD' entities extracted from CKD-EPI formula context (mining QA path)"
      - type: "safety"
        spec: "Label verifier suppresses lab-value-derived disorders before creating CodingReview nodes (training path)"
      - type: "safety"
        spec: "Escalation LLM prompts (_CANDIDATES_SYSTEM and escalate_coding) contain explicit rule forbidding diagnostic inference from lab values and identifying CKD-EPI as a formula name"
      - type: "safety"
        spec: "ask-leo-smart API endpoint includes deterministic pre-check that short-circuits lab-value disorder cases before the LLM is called"
      - type: "safety"
        spec: "ask-leo-rank API endpoint includes deterministic pre-check, injection guard, input sanitisation, and lab-value rule in its prompt"
      - type: "safety"
        spec: "Disorder verifier prompt contains explicit rule that lab values are observations, not diagnoses, and CKD-EPI is a formula name"

    constraints:
      - type: "safety"
        spec: >
          The system codes what is written, never what is inferred. A numeric
          lab result is an observation. Only a clinician can determine whether
          it constitutes a diagnosis.
      - type: "defence_in_depth"
        spec: >
          The fix is implemented at two layers: (1) extraction prompt rules
          and (2) deterministic post-extraction guard. Both must fail for a
          false diagnosis to reach the user.

    dependencies: ["DI-LEO-AI-035", "DI-LEO-AI-048"]

    downstream_impacts:
      - "Coding pipeline extraction accuracy"
      - "HITL review queue quality"
      - "Autonomous mode coding safety"
      - "Patient record integrity"

    technical_details:
      language: "Python"
      framework: "coding-worker pipeline + label-verifier + mining QA"
      file_structure:
        - "libs/prompts/extraction_v1.py"
        - "libs/ner/lab_value_guard.py"
        - "libs/ner/precision_gates.py"
        - "libs/llm_client/escalation.py"
        - "libs/llm_client/disorder_verifier.py"
        - "services/coding_worker/app/pipeline/pipeline_service.py"
        - "services/api/app/services/label_verifier.py"
        - "services/api/app/routers/training.py"
        - "tests/test_lab_value_guard.py"
        - "tests/test_escalation.py"
        - "tests/test_disorder_verifier.py"
      estimated_loc: 450

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All 27 test cases pass covering: CKD-EPI formula suppression,
      lab-to-diagnosis inference suppression (eGFR, HbA1c, sodium,
      haemoglobin), legitimate disorder preservation, and batch filtering.
    test_protocol: "VT-LEO-AI-037"

  safety_class: "B"
  risks: ["R-LEO-AI-029", "R-LEO-AI-030", "R-LEO-AI-033"]
  tags:
    - "clinical-safety"
    - "lab-value-guard"
    - "false-diagnosis-prevention"
    - "extraction-pipeline"
    - "defence-in-depth"
    - "intended-use-enforcement"
    - "regulatory-classification"
