# -- DI-LEO-AI-063 -- NICE Syndication API Client and Structured Guideline Ingest

- id: "DI-LEO-AI-063"
  type: "Functional"
  derived_from: ["UN-LEO-AI-028"]
  requirement: >
    The system SHALL provide an async client for the NICE Syndication API that fetches
    guideline documents, chapters, and sections as structured JSON, and a searchable
    guideline catalogue cached in Redis. A FastAPI router SHALL expose endpoints for
    catalogue search, ingest job submission (fire-and-track), SSE progress streaming,
    and job status. Ingested content SHALL be stored as Guideline, Recommendation, and
    Section nodes in Neo4j via idempotent MERGE operations. No LLM SHALL be used in
    this pipeline.
  rationale: >
    Authoritative guideline text must enter the system from the official NICE
    Syndication API rather than from PDFs or manual entry. Structured JSON from the
    API is clean enough to store directly without LLM extraction. A Redis-cached
    catalogue lets the admin UI provide a typeahead search so users do not need to
    know NICE codes.

    machine_spec:
    agent_prompt: |
      Implement the NICE Syndication API ingest pipeline (~500 LOC across 3 files).
      No LLM anywhere in this pipeline.

      FILES:
      - services/api/app/services/nice_api_client.py
        - NiceApiClient class using httpx.AsyncClient
        - Methods: get_guidance(code), get_chapters(code), get_sections(chapter_uri),
          get_recommendations(code) -- walks chapter Href/Uri links collecting Items,
          search_index(query) -- hits /services/guidance/index.json (NOTE: the NICE index
            endpoint ignores ?q= filter params; search_index is only used as a cold-cache
            fallback; primary search uses _ranked_search on the Redis catalogue),
          sync_catalogue_from_index() -- fetches full index with pagination to Redis (7d TTL),
          fetch_catalogue() -- returns Redis-cached list,
          add_to_catalogue(code, title, type),
          fetch_taxonomy() -- two-step HATEOAS walk returning a flat list of
            {category_id, category_title, subcategory_id, subcategory_title,
             subcategory_uri, guideline_codes[]}.

        CRITICAL NICE API TAXONOMY SCHEMA (confirmed by live probe 2026-03-08):
          The live newtaxonomy.json uses a self-contained nested tree. No per-subcategory
          HTTP calls are needed. All data is inline:
            taxonomy_root.categories[]          -- top-level areas, field is "name" not "title"
            category.categories[]               -- subcategories, field is "name"
            subcategory.categories[]            -- further nesting (3 levels), field is "name"
            leaf_node.paths[].Uri               -- relative path "/services/guidance/documents/NG12"
          Code is extracted by splitting Uri on "/documents/" and validating against NICE_CODE_RE.
          Helper function _collect_codes(node) recursively collects codes from the entire subtree.
          The taxonomy URL is discovered via HATEOAS from the API root (rel contains "taxonomy").
          All parse failures produce WARNING logs with actual keys received -- no silent fallbacks.

        - NICE API header: "API-Key" (not "apikey" or "Authorization")
        - Azure Key Vault secret: nice-api-key (secret name in KV)
        - Retry: 3 attempts, exponential back-off
        - NICE_CODE_RE regex exported for backend validation

      - services/api/app/services/nice_graph_upserter.py
        - NiceGraphUpserter class using neo4j synchronous driver
        - Methods: upsert_guideline(guidance_json), upsert_recommendation(guideline_id, rec_id, rec),
          upsert_section(guideline_id, section, order),
          upsert_taxonomy(taxonomy_entries: list[dict]) -- creates:
            TaxonomyCategory {id, title, source='nice_api', syncedAt}
            TaxonomySubcategory {id, title, categoryId, niceUri, source='nice_api',
              guidelineCodes=[list of NICE codes], syncedAt}  <-- codes stored as array property
            AuditDomain {id, name, source='nice', niceSubcategoryId}
            CLASSIFIES_GUIDELINE edges (only for Guideline nodes that exist in Neo4j)
        - Idempotent MERGE on all node types
        - AuditDomain never deleted (backend returns 403 on delete attempt)

      - services/api/app/routers/nice_guidance.py
        - FastAPI router (no prefix -- defines own paths)
        - GET /nice/catalogue?q= -- searches Redis-cached catalogue using _ranked_search
            (relevance tiers: exact code > title starts-with > title contains + NG/CG/QS >
             title contains + other type > code starts-with); falls back to live NICE index
            API only when Redis cache is empty
        - GET /nice/taxonomy -- async; queries Neo4j for TaxonomyCategory/TaxonomySubcategory
            hierarchy; enriches each guideline with title from Redis catalogue and loaded status
            from Guideline nodes; returns:
              {available: bool,
               categories: [{id, title,
                 subcategories: [{id, title, guideline_count, loaded_count,
                   guidelines: [{code, title, loaded}]}]}]}
            Returns {available: false} when no TaxonomyCategory nodes exist (triggers auto-sync in UI).
            Falls back gracefully if Redis unavailable (title = code).
        - POST /nice/catalogue/sync -- 202 + {job_id}; background thread runs
            sync_catalogue_from_index() + fetch_taxonomy() + upsert_taxonomy();
            job status includes catalogue_count, taxonomy_categories, taxonomy_subcategories counts
        - POST /nice/ingest -- validates code against NICE_CODE_RE (422 on fail), fires SSE job
        - GET /nice/events?job_id= -- SSE StreamingResponse
        - GET /nice/jobs/{job_id}/status -- NOTE: job store is in-memory (_jobs dict); jobs are
            lost on server restart; UI must handle 404 gracefully by re-checking taxonomy directly
        - GET /nice/jobs
        - All endpoints: Depends(require_admin)

      Integration tests: services/api/tests/test_nice_integration.py (pytest -m integration)
        Requires NICE_API_KEY from Key Vault or environment. Tests run against live NICE API.
        MUST pass before any release touching nice_api_client.py.

      Diagnostic probe: services/api/scripts/probe_nice_taxonomy.py
        Captures raw API responses at each HATEOAS walk step; run from repo root.

    acceptance_criteria:
      - type: "test"
        spec: "NiceApiClient.get_guidance returns structured JSON for a valid code"
      - type: "test"
        spec: "NiceApiClient retries 3 times on transient errors before raising"
      - type: "test"
        spec: "sync_catalogue_from_index populates Redis with 7d TTL and handles pagination"
      - type: "test"
        spec: "fetch_taxonomy returns flat list of entries with correct category_title, subcategory_title, and guideline_codes"
      - type: "test"
        spec: "fetch_taxonomy parses the live NICE API schema: 'name' field, nested 'categories' key, codes from paths[].Uri"
      - type: "test"
        spec: "fetch_taxonomy collects codes from all levels of the nested subtree (not just top-level paths)"
      - type: "test"
        spec: "fetch_taxonomy logs WARNING with actual keys when categories list is empty -- no silent fallback"
      - type: "test"
        spec: "upsert_taxonomy stores guidelineCodes array on TaxonomySubcategory node"
      - type: "test"
        spec: "upsert_taxonomy creates TaxonomyCategory, TaxonomySubcategory, and AuditDomain (source=nice) nodes"
      - type: "test"
        spec: "GET /nice/taxonomy returns {available: false} when no TaxonomyCategory nodes in Neo4j"
      - type: "test"
        spec: "GET /nice/taxonomy returns guidelines list with code, title (from Redis catalogue), and loaded status"
      - type: "test"
        spec: "GET /nice/taxonomy title falls back to code when Redis catalogue is unavailable"
      - type: "test"
        spec: "POST /nice/ingest returns 422 for non-NICE code like CANCER"
      - type: "test"
        spec: "POST /nice/ingest returns 202 with job_id immediately for valid NICE code"
      - type: "test"
        spec: "Non-admin caller receives 403 on all /nice/ endpoints"
      - type: "integration_test"
        spec: "Live NICE API: fetch_taxonomy returns >= 20 subcategories including 'conditions and diseases' category"
      - type: "integration_test"
        spec: "Live NICE API: cancer subcategory contains NG12 (Suspected cancer) in guideline_codes"
      - type: "integration_test"
        spec: "Live NICE API: all taxonomy entries have required fields; all codes match NICE_CODE_RE"

    constraints:
      - type: "safety"
        spec: "No LLM call anywhere in this pipeline -- structured JSON only"
      - type: "performance"
        spec: "GET /nice/catalogue must return within 200ms when Redis cache is warm"
      - type: "performance"
        spec: "GET /nice/taxonomy makes exactly 2 HTTP calls (root + taxonomy doc) -- no per-subcategory calls"
      - type: "traceability"
        spec: "All Guideline nodes store guidanceNumber and source: nice_syndication_api"
      - type: "observability"
        spec: "Every taxonomy parse failure path logs WARNING with actual API response keys -- no silent fallbacks"

    dependencies: []
    downstream_impacts:
      - "DI-LEO-AI-064 reads Recommendation nodes created by this pipeline"
      - "DI-LEO-AI-066 admin UI calls GET /nice/taxonomy for taxonomy browser drawer"
      - "TaxonomySubcategory.guidelineCodes feeds taxonomy browser without extra API calls"
      - "AuditDomain nodes (source=nice) created here appear in /admin/domains and analytics API"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["httpx", "neo4j", "redis", "pydantic"]
      file_structure:
        - "services/api/app/services/nice_api_client.py"
        - "services/api/app/services/nice_graph_upserter.py"
        - "services/api/app/routers/nice_guidance.py"
        - "services/api/app/main.py"
        - "services/api/tests/test_nice_api_client.py"
        - "services/api/tests/test_nice_graph_upserter.py"
        - "services/api/tests/test_nice_guidance_router.py"
        - "services/api/tests/test_nice_integration.py"
        - "services/api/scripts/probe_nice_taxonomy.py"
      estimated_loc: 550

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      Unit tests pass with mocked NICE API and Neo4j.
      Integration tests (pytest -m integration) pass against live NICE API with valid API key.
    test_protocol: "VT-LEO-AI-063"

  safety_class: "B"
  risks: ["R-LEO-AI-042", "R-LEO-AI-043", "R-LEO-AI-044", "R-LEO-AI-046"]
  tags: ["nice", "syndication-api", "neo4j", "ingest", "no-llm", "guidelines", "taxonomy", "domains"]
