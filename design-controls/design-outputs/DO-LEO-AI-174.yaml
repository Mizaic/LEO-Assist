# -- DO-LEO-AI-174 -- Skin / melanoma inventory completeness
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-174"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-175"]
    user_needs: ["UN-LEO-AI-005", "UN-LEO-AI-006"]
    risks_addressed: ["R-LEO-AI-172"]
    verification_tests: ["VT-LEO-AI-172"]

  specification:
    title: "Skin / melanoma inventory completeness for the anchor detector"
    description: |
      Implements DI-LEO-AI-175. Adds the missing skin / melanoma
      vocabulary discovered in the 2026-04-17 audit of patient
      4921442355 (Mr Harold Allwyn):

      1. FAST_TRACK_REFERRAL_READ_CODES gains XaMeA -> "melanoma".
      2. SPECIALIST_CLINIC_READ_CODES gains XaPyd -> "melanoma".
      3. MALIGNANCY_READ_CODES gains the B32.. family (B32.., B320.,
         B321., B322., B3220, B3221, B323., B3230, B3231, B324.,
         B3240, B3241, B325., B3250, B3251, B326., B3260, B3261,
         B327., B3270, B3271, B3280, B3281, B32x.-B32xz, B32y.,
         B32yz, B32z. - all -> "melanoma" / "skin"), Xa99Y, Xa0Di,
         Xa0Dj, XaCIv, XaBAw, Xa0CD.
      4. MALIGNANCY_TERM_PATTERNS gains \\blentigo maligna( melanoma)?\\b,
         \\bsuperficial spreading melanoma\\b, \\bnodular melanoma\\b,
         \\bacral lentiginous melanoma\\b, \\bdesmoplastic melanoma\\b,
         all -> "melanoma".
      5. A new CANCER_TREATMENT_PROCEDURE_CODES set contains 7G055
         (Wide excision of skin lesion) and X90PX (Biopsy - action).
      6. The anchor detector treatment path picks up
         CANCER_TREATMENT_PROCEDURE_CODES so a wide excision fires
         the existing treatment_started milestone.

    acceptance_criteria:
      - criterion: "Inventories extended"
        type: "functional"
        measurement: "Test"
        target: "find_malignancy_code('Xa99Y') == 'melanoma'; find_malignancy_code('B3230') == 'melanoma'; find_fast_track_referral_site for XaMeA returns ('XaMeA','melanoma')."
      - criterion: "Treatment-procedure recognition"
        type: "functional"
        measurement: "Test"
        target: "Encounter text containing '7G055' produces a treatment anchor when in an open skin episode window."
      - criterion: "Lentigo maligna recognition"
        type: "functional"
        measurement: "Test"
        target: "Problem line 'Major: Lentigo maligna melanoma (Xa99Y)' emits diagnosis_confirmed with site_key='melanoma'."
      - criterion: "Live-corpus impact"
        type: "performance"
        measurement: "Live rebuild"
        target: "Episodes a644d1c1586405a6, fb62376ea4b48443, 42b722eb6082a4b7 reclassify to status='completed', cancer_type='melanoma', hitl_flag=true."

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "libs/domains/code_inventories.py"
        description: "Skin / melanoma additions to FAST_TRACK_REFERRAL_READ_CODES, SPECIALIST_CLINIC_READ_CODES, MALIGNANCY_READ_CODES, MALIGNANCY_TERM_PATTERNS; new CANCER_TREATMENT_PROCEDURE_CODES."
      - artifact_type: "source_code"
        location: "services/analysis_worker/app/analyzers/anchor_detector.py"
        description: "Treatment path recognises CANCER_TREATMENT_PROCEDURE_CODES."
    storage_location: "git"
    technical_details:
      language: "Python"
      loc: 180
      key_functions:
        - "find_malignancy_code"
        - "find_fast_track_referral_site"
        - "find_specialist_clinic_site"
        - "_classify_text_encounters"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Confirmed-melanoma cohort identification"
      - "Skin-pathway first_seen and treatment milestone coverage"
    risk_control_measures:
      - "All Read codes sourced verbatim from configs/read codes/readcode.md"
      - "Histological subtype regexes only fire on PROBLEM_LIST_LINE_PREFIX lines"
      - "hitl_required=True on every text-driven diagnosis"

  verification_status:
    verification_method: "Test"
    verification_complete: false
