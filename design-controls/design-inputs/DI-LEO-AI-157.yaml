# -- DI-LEO-AI-157 -- Pathway canvas node primitives (Phase 6b-iii)
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-157"
  type: "Functional"
  derived_from: ["UN-LEO-AI-072"]
  requirement: >
    Every pathway canvas node type (action, condition, rest_connector,
    queue_publish, trigger, parallel, merge, transform, source, output,
    viewer) MUST render through a single shared BaseNode shell, a single
    NodeHandle wrapper for every React Flow Handle, and (where they show
    test-run feedback) a single NodeStatusStrip. Every Handle MUST carry
    an aria-label. The configure interaction MUST be a single click on
    the node body (no double-click for configure on any node type).
  rationale: >
    Today each of the 10 node types ships its own border / status / handle
    code. Border radius drifts (8px on most, 12px nowhere), three nodes
    require double-click while seven require single-click, and zero nodes
    expose aria-labels on their connection handles. This makes the canvas
    inconsistent for sighted users and unusable for screen-reader users.
    A shared BaseNode + NodeHandle + NodeStatusStrip eliminates the drift
    in one pass and gives Phase 6b-iv (configurator) a stable hook point.

  machine_spec:
    acceptance_criteria:
      - type: "functional"
        spec: "services/ui/src/components/pathway/nodes/_base/BaseNode.tsx renders the canonical 12px borderRadius / 2px border / standard 12-16px padding for every node, with selected / running / halted / skipped states managed centrally"
      - type: "functional"
        spec: "services/ui/src/components/pathway/nodes/_base/NodeHandle.tsx wraps every Handle with a Tooltip and a generated aria-label of the form 'input port <id>' / 'output port <id>'"
      - type: "functional"
        spec: "services/ui/src/components/pathway/nodes/_base/NodeStatusStrip.tsx exposes the canonical NodeRunStatus union (idle | queued | running | completed | halted | error | skipped) and replaces the bespoke spinner / dot / label code each node previously rolled its own"
      - type: "functional"
        spec: "All 10 node files (ActionNode, ConditionNode, ConnectorNode, TriggerNode, ParallelNode, MergeNode, TransformNode, SourceNode, OutputNode, MiniHitlNode) import BaseNode + NodeHandle from ./_base and contain zero raw <Handle> JSX"
      - type: "functional"
        spec: "BaseNode binds onActivate to onClick AND to Enter/Space keydown, sets role='button' and tabIndex=0 when interactive, so every node is keyboard-operable"
      - type: "functional"
        spec: "No node binds onDoubleClick to its onConfigure handler; SourceNode / OutputNode / MiniHitlNode all migrate to single-click + matching helper text ('Click to configure')"
      - type: "functional"
        spec: "nodeTypes registry (services/ui/src/components/pathway/nodes/nodeTypes.ts) continues to expose all 11 node-type keys (action, condition, rest_connector, queue_publish, trigger, parallel, merge, transform, source, output, viewer)"
    constraints:
      - type: "safety"
        spec: "Existing data shape on each node's data prop MUST remain backward compatible (subgraphId / sourceType / outputType / triggerEvent / inputs / outputs / branches / rules / defaultPort / connectorType / mode / label / color preserved on the same keys)"
      - type: "safety"
        spec: "ASCII-only copy across every node file (no em-dash, ellipsis, or non-ASCII glyphs)"
      - type: "safety"
        spec: "Each node file stays below the 300 LOC target / 500 LOC hard limit (current largest: ActionNode at <250 LOC after refactor)"
    dependencies: ["DI-LEO-AI-156"]
    downstream_impacts:
      - "Pathway canvas (services/ui/src/components/pathway/nodes)"
      - "Pathway editor page.tsx (consumes nodeTypes)"
    technical_details:
      language: "TypeScript"
      framework: "Next.js / React / @xyflow/react"
      file_structure:
        - "services/ui/src/components/pathway/nodes/_base/BaseNode.tsx"
        - "services/ui/src/components/pathway/nodes/_base/NodeHandle.tsx"
        - "services/ui/src/components/pathway/nodes/_base/NodeHeader.tsx"
        - "services/ui/src/components/pathway/nodes/_base/NodeStatusStrip.tsx"
        - "services/ui/src/components/pathway/nodes/_base/index.ts"
        - "services/ui/src/components/pathway/nodes/ActionNode.tsx"
        - "services/ui/src/components/pathway/nodes/ConditionNode.tsx"
        - "services/ui/src/components/pathway/nodes/ConnectorNode.tsx"
        - "services/ui/src/components/pathway/nodes/TriggerNode.tsx"
        - "services/ui/src/components/pathway/nodes/ParallelNode.tsx"
        - "services/ui/src/components/pathway/nodes/MergeNode.tsx"
        - "services/ui/src/components/pathway/nodes/TransformNode.tsx"
        - "services/ui/src/components/pathway/nodes/SourceNode.tsx"
        - "services/ui/src/components/pathway/nodes/OutputNode.tsx"
        - "services/ui/src/components/pathway/nodes/MiniHitlNode.tsx"
      estimated_loc: 950

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      VT-LEO-AI-155 static-source verification - 15 cases covering:
      _base primitive file existence, barrel re-exports, BaseNode import
      in every node, BaseNode rendered as the wrapper, NodeHandle used
      everywhere (no raw <Handle ... />), aria-label generation in
      NodeHandle, BaseNode keyboard + click activation, no double-click
      configure, every interactive node passes onConfigure -> onActivate,
      canonical 12px / 2px border tokens, NodeStatusStrip canonical
      states union, ActionNode delegates run state to NodeStatusStrip,
      nodeTypes registry parity, file-size discipline, source/output
      definition registries preserved.
    test_protocol: "VT-LEO-AI-155"

  safety_class: "B"
  risks: ["R-LEO-AI-109"]
  tags:
    - "pathways"
    - "design-system"
    - "accessibility"
