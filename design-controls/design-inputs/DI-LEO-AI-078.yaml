# -- DI-LEO-AI-078 -- Loop 3: Holdout Set Integrity
# IEC 62304 / ISO 13485 Design Input

- id: "DI-LEO-AI-078"
  type: "Safety"
  derived_from: ["UN-LEO-AI-050"]
  requirement: >
    The system SHALL maintain a protected holdout set of 500 encounters, marked
    with holdout=true on their DOCUMENTS relationships, guaranteeing a minimum
    of 20 encounters per safety-critical category (cancer, safeguarding, mental
    health crisis), and SHALL enforce that holdout encounters are never included
    in any training data export.
  rationale: >
    Without a holdout set, there is no way to measure whether NER model training
    has improved or degraded coding quality. If holdout encounters leak into
    training data, the evaluation metrics are inflated (the model has already
    seen those examples) and the measurement is invalid. Safety-critical category
    minimums ensure the holdout set can produce statistically meaningful
    per-category F1 scores for cancer, safeguarding, and mental health.

  machine_spec:
    acceptance_criteria:
      - type: "safety"
        spec: "Holdout set contains exactly 500 encounters; minimum 20 per safety-critical category (cancer, safeguarding, mental health crisis, suicide/self-harm)"
      - type: "safety"
        spec: "Training export query always includes WHERE r.holdout IS NULL OR r.holdout = false; holdout encounters never appear in export JSONL"
      - type: "functional"
        spec: "Holdout manifest JSON lists: encounter_ids by domain, category minimums met flag, stratification breakdown"
      - type: "functional"
        spec: "Post-training evaluation runs the new NER model against holdout set; results stored as DriftMetric with metric_type='training_eval'"
      - type: "safety"
        spec: "Holdout encounters selected BEFORE any training data is collected to prevent contamination; encounters in training data may never be added to holdout"
    constraints:
      - type: "safety"
        spec: "Holdout encounter IDs are stored only in the holdout manifest and as graph flags; not in any training export file"
      - type: "safety"
        spec: "Holdout set is immutable after selection; new encounters may not be added once training has started"
    dependencies: ["DI-LEO-AI-077"]
    downstream_impacts:
      - "Training data export (DI-LEO-AI-079)"
      - "NER model evaluation (DriftMetric training_eval)"
    technical_details:
      language: "Python"
      framework: "Neo4j"
      file_structure:
        - "scripts/select_holdout_set.py"
        - "libs/cypher/documents_queries.py"
      estimated_loc: 100

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: >
      All VT-078 test cases pass: holdout encounters never appear in export
      JSONL, category minimums enforced, holdout flag propagates correctly,
      contamination guard prevents adding previously-trained encounters.
    test_protocol: "VT-LEO-AI-078"

  safety_class: "B"
  risks: ["R-LEO-AI-053"]
  tags: ["loop3", "holdout-set", "evaluation", "training-contamination", "ner-training", "cancer", "safeguarding"]
