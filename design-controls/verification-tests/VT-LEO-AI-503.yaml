# -- VT-LEO-AI-503 -- Verification of Episode Engine Milestone Extractor Agent
# IEC 62304 Verification Test

- id: "VT-LEO-AI-503"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-503"]
    risks: ["R-LEO-AI-503"]

  metadata:
    title: "Episode engine milestone extractor agent -- evidence quotes, vocabularies, HITL"
    description: >
      Verifies that the milestone extractor agent (a) parses well-formed
      multi-milestone payloads including treatment_type tags, (b) accepts
      an empty milestone list when needs_human_review=true, (c) rejects
      invented milestone types and treatment_type values via Pydantic,
      and (d) rejects empty evidence_quote (min_length=3). This is the
      stage that prevents anchoring treatment_started on administrative
      tasks like the synthetic SYN-EE-001 'Failed encounter' on
      2025-05-02.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "tests/episode_engine/test_milestone_extractor_agent.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-503-TC-001"
      case_name: "test_milestone_extractor_parses_full_payload"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "FakeLLM returns referral + treatment_started(surgery) milestones; agent runs"
          expected_result: "Both milestones validate; treatment_type='surgery' on the second"
          verification_method: "automated"
      acceptance_criteria:
        - "Stage trace marks ok=True"
    - case_id: "VT-503-TC-002"
      case_name: "test_milestone_extractor_accepts_empty_milestones"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "FakeLLM returns milestones=[] with needs_human_review=true"
          expected_result: "Result validates; HITL flag preserved"
          verification_method: "automated"
      acceptance_criteria:
        - "Engine never forces a milestone when evidence is weak"
    - case_id: "VT-503-TC-003"
      case_name: "test_milestone_extractor_rejects_unknown_milestone_type"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "FakeLLM returns milestone with type='biopsy_taken'"
          expected_result: "StageError raised"
          verification_method: "automated"
      acceptance_criteria:
        - "Closed milestone vocabulary enforced"
    - case_id: "VT-503-TC-004"
      case_name: "test_milestone_extractor_rejects_unknown_treatment_type"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "FakeLLM returns treatment_started with treatment_type='homeopathy'"
          expected_result: "StageError raised"
          verification_method: "automated"
      acceptance_criteria:
        - "Closed treatment_type vocabulary enforced"
    - case_id: "VT-503-TC-005"
      case_name: "test_milestone_extractor_requires_evidence_quote"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "FakeLLM returns milestone with evidence_quote=''"
          expected_result: "StageError raised by Pydantic min_length=3 constraint"
          verification_method: "automated"
      acceptance_criteria:
        - "Every milestone is anchored to an evidence quote"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-503/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - executed_at: "2026-04-18"
      executor: "Quality Engineering"
      result: "pass"
      notes: "All 5 cases pass. The synthetic SYN-EE-001 failure-mode (2025-05-02 Failed encounter mis-anchor) is exercised end-to-end by VT-LEO-AI-507 against the same prompt."
