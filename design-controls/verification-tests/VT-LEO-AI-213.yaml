  test_cases:
    - case_id: "VT-213-TC-001"
      case_name: "GoldLabelDetailDialog is exported for cross-surface reuse"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read GoldDatasetPanel.tsx source"
          expected_result: "Source contains 'export function GoldLabelDetailDialog('"
          verification_method: "automated"

    - case_id: "VT-213-TC-002"
      case_name: "Dialog accepts saveMode/entitySaver/onAfterSave/headerChrome with safe defaults"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read panel source"
          expected_result: "saveMode defaults to 'gold'; entitySaver, onAfterSave, headerChrome are optional; types match GoldDialogSaveMode/GoldDialogEntitySaver/React.ReactNode"
          verification_method: "automated"

    - case_id: "VT-213-TC-003"
      case_name: "persistEntities prefers entitySaver when provided"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Inspect persistEntities body"
          expected_result: "When entitySaver is provided it is awaited; otherwise patchGoldLabelEntities is awaited; onAfterSave fires after both branches"
          verification_method: "automated"

    - case_id: "VT-213-TC-004"
      case_name: "Dual-save warning banner is gated on saveMode='dual' and cites R-LEO-AI-206"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Search for 'data-testid=dual-save-banner'"
          expected_result: "Banner only renders when saveMode==='dual'; copy includes R-LEO-AI-206"
          verification_method: "automated"

    - case_id: "VT-213-TC-005"
      case_name: "Shared barrel re-exports the dialog and dual-save helpers"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read index.ts and GoldLabelEditorDialog.tsx"
          expected_result: "Index exports GoldLabelEditorDialog plus useDualSaveAdapter and the four API helpers"
          verification_method: "automated"

    - case_id: "VT-213-TC-006"
      case_name: "Types module surfaces the shared types"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read types.ts"
          expected_result: "DualSaveEncounterContext.baseline_concept_ids is string[]; GoldLabel sourced from goldDatasetTypes"
          verification_method: "automated"

    - case_id: "VT-213-TC-007"
      case_name: "API helpers target the documented endpoints"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read api.ts"
          expected_result: "URLs include /api/training/gold-labels/, /api/training/candidates/from-dry-run, /api/training/gold-labels/from-encounter, /coded-links/sync-from-gold"
          verification_method: "automated"

    - case_id: "VT-213-TC-008"
      case_name: "useDualSaveAdapter posts and advances the baseline"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Read useDualSaveAdapter.ts"
          expected_result: "expected_baseline_concept_ids comes from baselineRef.current; baselineRef.current is reassigned to result.baseline_concept_ids after sync"
          verification_method: "automated"

