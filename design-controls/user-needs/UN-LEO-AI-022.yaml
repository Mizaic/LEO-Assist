# -- UN-LEO-AI-022 -- FHIR R4 Interoperability
# IEC 62304 / ISO 13485 User Need
# Schema: design-controls/templates/user_needs_schema.yaml

- id: "UN-LEO-AI-022"
  title: "System imports patient records via FHIR R4 and exports audit results as FHIR resources"
  description: |
    System administrators need the system to import patient encounter records
    via FHIR R4 APIs (Encounter, DocumentReference, Patient resources) from
    GP clinical systems. The system must also export audit results as FHIR
    resources including Measure (audit programme definitions), MeasureReport
    (programme results), and Device (system identity). FHIR compliance enables
    integration with NHS Digital infrastructure and interoperability with
    other audit tools.

  stakeholder:
    type: "technical"
    role: "System Administrator"
    organization: "NHS Primary Care Organisation"

  priority: "MUST"

  rationale: |
    NHS Digital mandates FHIR R4 as the interoperability standard for clinical
    data exchange. GP clinical systems (EMIS, SystmOne, Vision) expose patient
    records via FHIR APIs. Using FHIR for both import and export ensures the
    platform integrates with existing NHS infrastructure without custom
    integration work per vendor.

  benefit: "Standards-based interoperability with NHS clinical systems, eliminating vendor-specific integration"

  use_case: |
    1. System administrator configures a FHIR connection to an EMIS Web
       instance for a GP practice, providing the FHIR base URL and
       authentication credentials.
    2. Auditor triggers a pipeline run for a patient cohort.
    3. System sends FHIR R4 requests to retrieve Patient, Encounter, and
       DocumentReference resources for each patient in the cohort.
    4. System validates each retrieved resource against the UK Core FHIR
       profile before processing.
    5. Pipeline processes the imported encounters through shortlisting,
       coding, and analysis stages.
    6. On completion, system generates a FHIR MeasureReport resource
       containing the audit results for the programme.
    7. System administrator exports the MeasureReport and submits it to the
       national audit programme via the NHS Digital FHIR endpoint.

  current_solution: "CSV file exports from GP systems followed by manual data import and format conversion"

  pain_points:
    - "CSV exports require manual column mapping per GP system vendor"
    - "No standardised format means data quality checks must be repeated for each import"
    - "Export results must be manually reformatted to meet national programme submission requirements"
    - "No real-time data access -- exports represent a point-in-time snapshot that may be stale"

  acceptance_criteria:
    - "System shall import patient data via FHIR R4 Encounter, DocumentReference, and Patient resources"
    - "System shall validate FHIR resources against UK Core profiles"
    - "System shall export audit programme definitions as FHIR Measure resources"
    - "System shall export audit results as FHIR MeasureReport resources"
    - "System shall expose FHIR CRUD endpoints for Measure, MeasureReport, Library, and Device"

  success_metrics:
    - metric: "FHIR R4 conformance"
      target: "100% for supported resources"
      baseline: "N/A -- new capability"
    - metric: "Import throughput"
      target: ">=100 patients per minute"
      baseline: "CSV import: 20-30 patients per hour"
    - metric: "Export generation time"
      target: "<=30 seconds per report"
      baseline: "Manual report formatting: 1-2 hours"

  regulatory_impact: "medium"
  safety_impact: "low"

  derived_from:
    - "Intended Use Statement DC-IU-001 Section 2.1"
    - "NHS Digital FHIR R4 interoperability mandate"
    - "UK Core FHIR Implementation Guide"

  related_standards:
    - "IEC 62304:2006"
    - "ISO 13485:2016"
    - "HL7 FHIR R4"
    - "NHS UK Core Profiles"

  metadata:
    created_by: "Quality Engineering"
    created_date: "2026-03-01"
    status: "draft"

  design_inputs: ["DI-LEO-AI-031", "DI-LEO-AI-032"]
  validation_tests: ["VAL-LEO-AI-007"]

  tags: ["fhir", "interoperability", "hl7", "nhs-digital", "integration"]
