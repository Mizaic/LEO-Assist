# -- UN-LEO-AI-089 -- Ground SNOMED-coded findings in ICD-10 and OPCS-4 classifications
# IEC 62304 / ISO 13485 User Need

- id: "UN-LEO-AI-089"
  title: "Coding leads, finance teams, and downstream NHS payers need SNOMED-coded findings to be expressible as ICD-10 diagnoses and OPCS-4 procedures with their full hierarchy and human-readable titles"

  description: |
    The system already extracts SNOMED CT concepts from clinical text
    and stores SNOMED -> ICD-10 map edges via the SNOMED ExtendedMap
    refset. Two gaps remain that block downstream consumers:

      - The Icd10Code nodes created by the SNOMED map loader are bare
        codes with no title, no chapter, no block, and no parent
        hierarchy. UI surfaces that show "ICD-10: I50.0" today have
        nothing to expand that to "Congestive heart failure
        (I50.0) -- Diseases of the circulatory system".
      - There is no representation of OPCS-4 (the UK procedural
        classification used by SUS, HRG grouping, and PbR coding).
        Procedures coded in SNOMED today cannot be expressed as
        OPCS-4 even though TRUD publishes a SNOMED -> OPCS-4 map
        refset that we already have in our SNOMED download.

    Coding teams need both classifications loaded with full
    hierarchy and titles so that:

      - Coded encounters in the UI can show the ICD-10 / OPCS-4
        equivalents alongside the SNOMED concept and the reviewer
        understands what the codes mean.
      - Reports and exports can be produced in the classifications
        that NHS payers, secondary care providers, and downstream
        national datasets actually consume.
      - Coding-revenue and HRG analyses can be run against the same
        knowledge graph rather than against a separate spreadsheet.

  stakeholder: "Clinical coding leads, finance / coding-revenue teams, downstream NHS payers, QA / RA lead"

  priority: "MUST"

  rationale: >
    NHS secondary care still pays on ICD-10 and OPCS-4. Until both
    classifications exist as first-class nodes in the knowledge
    graph (with titles, chapters, and parent hierarchy), the
    SNOMED extraction work cannot be consumed by the people who
    sign off coding income or who run national submissions. The
    SNOMED -> ICD-10 map already lands in the graph but is unusable
    in the UI because the targets have no titles. The SNOMED ->
    OPCS-4 map is published by TRUD inside the same SNOMED archive
    we already download, but is not loaded.

  acceptance_criteria:
    - "ICD-10 code nodes carry title, chapter, block, age range, and sex constraint, and have IS_A edges to their parent category in the chapter hierarchy"
    - "OPCS-4 code nodes carry title, chapter, and block, and have IS_A edges to their parent category in the chapter hierarchy"
    - "SNOMED Concept nodes that map to OPCS-4 carry a MAPS_TO_OPCS4 edge to the matching OpcsCode node"
    - "The Settings -- Terminology page shows distinct Up to date / Update available / Not on disk status cards for the NHS ICD-10 and OPCS-4 packages alongside the existing SNOMED and dm+d cards"
    - "The Settings -- Terminology page shows count tiles for ICD-10 codes loaded, OPCS-4 codes loaded, and SNOMED -> OPCS-4 map edges loaded"
    - "Surfaces that already show the bare ICD-10 code (TermSearch dropdown, surface-forms admin page) show the title alongside the code, and surfaces that show coded findings can also show the OPCS-4 equivalent when one exists"
    - "The two new TRUD packages can be downloaded and loaded by the existing Sync from TRUD button on the Settings -- Terminology page once the user's TRUD subscription includes them"
    - "If the TRUD packages have not been downloaded the UI degrades to the existing bare-code behaviour (no UI crash, no missing-data exception)"

  design_inputs:
    - "DI-LEO-AI-226"
    - "DI-LEO-AI-228"

  metadata:
    identified_by: "Rob Smith - terminology coverage gap surfaced during design-controls review (April 2026)"
    identified_date: "2026-04-18"
    status: "approved"
