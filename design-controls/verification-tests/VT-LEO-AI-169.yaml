# -- VT-LEO-AI-169 -- AI Instructions editor decomposition (Wave E Phase 4b)

- id: "VT-LEO-AI-169"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-174"]
    risks: []

  metadata:
    title: "AI Instructions editor decomposition - static source sweep"
    description: >
      Verifies that the prompts/[id] page has been decomposed into an
      orchestrator plus dedicated tab body components, that none of the
      modules exceed the project 500 LOC hard cap, and that the
      orchestrator imports each tab body from _components rather than
      declaring them inline.
    test_level: "unit"
    test_type: "functional"
    safety_class: "A"
    automation_status: "automated"
    automation_framework: "jest"
    test_file_paths:
      - "services/ui/src/__tests__/prompts-editor-decomposition.test.ts"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "static_source"
      cleanup_required: false

  test_cases:
    - case_id: "VT-169-TC-001"
      case_name: "Required _components modules exist"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Read _components/types.ts, IdentitySection.tsx,
            InstructionsTab.tsx, OutputFormatTab.tsx,
            TeachingExamplesTab.tsx, SandboxTab.tsx,
            SandboxCostTable.tsx, ExampleCard.tsx, InputDisplay.tsx,
            OutputPreview.tsx
          expected_result: "Each file exists and is non-empty"
          verification_method: "automated"
      acceptance_criteria:
        - "All ten extracted modules exist on disk"

    - case_id: "VT-169-TC-002"
      case_name: "Orchestrator + components stay under 500 LOC"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: >
            Count lines for page.tsx and each file under _components/
          expected_result: "Each file has <= 500 LOC"
          verification_method: "automated"
      acceptance_criteria:
        - "Hard cap enforced"

    - case_id: "VT-169-TC-003"
      case_name: "Orchestrator imports tab bodies from _components"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Grep page.tsx for tab body imports"
          expected_result: >
            page.tsx imports IdentitySection, InstructionsTab,
            OutputFormatTab, TeachingExamplesTab and SandboxTab from
            ./_components/.
          verification_method: "automated"
      acceptance_criteria:
        - "All five tab body imports present"

    - case_id: "VT-169-TC-004"
      case_name: "Shared types live in _components/types.ts"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Read _components/types.ts"
          expected_result: >
            Exports CATEGORY_OPTIONS, SCOPE_OPTIONS, TAG_COLORS,
            ASSERTION_COLORS, categoryLabel, categoryColor,
            FewShotExample, PromptConfigData, CostEstimate,
            SandboxResult, PresetItem.
          verification_method: "automated"
      acceptance_criteria:
        - "All shared exports present"

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-169/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - run_id: "VT-169-EXEC-001"
      run_at: "2026-04-16"
      executor: "wave-e-phase-4b-agent"
      result: "pass"
      cases_executed: 4
      cases_passed: 4
      notes: >
        npx jest prompts-editor-decomposition --no-coverage in services/ui:
        4/4 test cases passed in 0.537s. All required _components modules
        exist, all stay <= 500 LOC, page.tsx imports IdentitySection,
        InstructionsTab, OutputFormatTab, TeachingExamplesTab and
        SandboxTab from ./_components/, and types.ts exposes the shared
        taxonomy/colour/type vocabulary.
