# -- DI-LEO-AI-017 -- Programme Configuration Management
# IEC 62304 / ISO 13485 Design Input
# Schema: design-controls/templates/design_inputs_schema.yaml

- id: "DI-LEO-AI-017"
  type: "Functional"
  derived_from: ["UN-LEO-AI-011"]
  requirement: "The system SHALL support creation, validation, and activation of programme configurations including clinical domain definitions, milestone type definitions, guideline rule sets, quality targets, and pipeline workflow definitions, all stored as data in Neo4j"
  rationale: "Programme configurability is the foundation of the platform-agnostic architecture. All programme-specific logic is stored as data, not code, enabling new clinical audit programmes to be deployed through configuration changes only."

  machine_spec:
    agent_prompt: |
      Implement the ProgrammeConfigRegistry class (~250 LOC).

      SINGLE PURPOSE: Manage programme configurations as data in Neo4j,
      supporting creation, validation, and activation lifecycle.

      REQUIREMENTS:
      1. Create new programme configurations with clinical domain definitions,
         milestone types, guideline rules, quality targets, and pipeline
         workflow definitions.
      2. Validate configurations for completeness and internal consistency
         before activation.
      3. Support activation and deactivation of programme configurations.
      4. Store all configuration as graph data in Neo4j, not as code.
      5. Expose configuration management via API endpoints.

      METHODS:
      - create(config): Create a new programme configuration.
      - validate(config_id): Validate a configuration for completeness.
      - activate(config_id): Activate a validated configuration.
      - deactivate(config_id): Deactivate an active configuration.
      - get(config_id): Retrieve a programme configuration.
      - list_active(): List all active programme configurations.

      CODE CLARITY:
      - Use guard clauses to flatten nesting.
      - Keep functions under 30 lines.
      - Use type hints throughout.

    acceptance_criteria:
      - type: "test"
        spec: "New programme configuration can be created, validated, and activated without code changes"
      - type: "test"
        spec: "Validation rejects incomplete or inconsistent configurations"
      - type: "test"
        spec: "Active configuration is used by downstream pipeline and analysis services"
      - type: "test"
        spec: "Deactivated configurations are excluded from pipeline execution"

    constraints:
      - type: "safety"
        spec: "Configuration changes require validation before activation"
      - type: "performance"
        spec: "Configuration retrieval completes in < 200ms"
      - type: "code_quality"
        spec: "Functions <= 30 LOC; cyclomatic complexity <= 10"

    dependencies: []

    downstream_impacts:
      - "pipeline_service"
      - "episode_builder"
      - "kpi_calculator"
      - "quality_checker"

    technical_details:
      language: "Python"
      framework: "FastAPI"
      libraries: ["neo4j"]
      file_structure:
        - "libs/domain_config/registry.py"
        - "services/api/app/routers/operations.py"
      estimated_loc: 250

  verification:
    method: "Test"
    phase: "OQ"
    acceptance: "New programme configuration can be created, validated, and activated without code changes; validation rejects incomplete or inconsistent configurations"
    test_protocol: "VT-LEO-AI-017"

  safety_class: "B"
  risks: ["R-LEO-AI-025"]
  tags: ["programme-config", "configuration", "platform"]
