# -- DO-LEO-AI-074 -- Loop 2: Surface Form Revocation and Cascade Implementation
# ISO 13485 / IEC 62304 Design Output

- id: "DO-LEO-AI-074"
  version: "1.0.0"
  type: "Software_Module"
  status: "draft"

  traceability:
    design_inputs: ["DI-LEO-AI-076"]
    user_needs: ["UN-LEO-AI-049"]
    risks_addressed: ["R-LEO-AI-051"]
    verification_tests: ["VT-LEO-AI-076"]

  specification:
    title: "Surface Form Revoke Endpoint with Cascade CodingReview Creation"
    description: |
      Implements DELETE /training/surface-forms/{normalized}/revoke. Removes
      MAPS_TO, marks SurfaceFormTask as revoked, queries all encounters coded
      after first_used_at with matching provisional source, and creates
      CodingReview nodes with review_type='revocation_cascade' in a single
      transaction. Recently approved terms view with use_count and Revoke button.
    acceptance_criteria:
      - criterion: "Revoke endpoint"
        type: "functional"
        measurement: "Test"
        target: "DELETE removes MAPS_TO, sets SurfaceFormTask.status='revoked', records revoker and timestamp"
      - criterion: "Cascade atomicity"
        type: "safety"
        measurement: "Test"
        target: "All cascade CodingReview nodes created in single transaction; partial writes rolled back"
      - criterion: "Affected encounter scope"
        type: "safety"
        measurement: "Test"
        target: "Cascade queries encounters with DOCUMENTS.source='provisional' AND coded_at >= first_used_at"
      - criterion: "Recently approved terms view"
        type: "functional"
        measurement: "Test"
        target: "View shows term, approved_by, approved_date, use_count, Revoke button"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/api/app/routers/training.py"
        description: "DELETE /training/surface-forms/{normalized}/revoke with cascade query"
      - artifact_type: "source_code"
        location: "libs/cypher/coding_review_queries.py"
        description: "REVOKE_SURFACE_FORM and CREATE_REVOCATION_CASCADE_REVIEWS Cypher queries"
      - artifact_type: "source_code"
        location: "services/ui/src/components/operations/ReviewSection.tsx"
        description: "Recently approved terms view with use_count and Revoke button"
    storage_location: "git"
    technical_details:
      language: "Python / TypeScript"
      loc: 150
      key_functions:
        - "revoke_surface_form"
        - "_create_revocation_cascade"
        - "RecentlyApprovedTermsView"

  safety_characteristics:
    safety_class: "B"
    safety_critical_functions:
      - "Revocation cascade ensures affected encounters are flagged for human review"
      - "Atomic transaction prevents partial cascade leaving some affected records unchecked"
    risk_control_measures:
      - "Historical records are not deleted; CodingReview nodes allow correction or confirmation"
      - "use_count and first_used_at enable reviewers to assess the scope of a bad mapping before revoking"

  verification_status:
    verification_method: "Test"
    verification_complete: false
