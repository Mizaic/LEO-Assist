# -- VT-LEO-AI-164 -- TestPatient persistence + replay diff verification
# IEC 62304 / ISO 13485 Verification Test Protocol

- id: "VT-LEO-AI-164"
  version: "1.0"
  status: "passed"

  traceability:
    design_inputs: ["DI-LEO-AI-165"]
    risks: ["R-LEO-AI-166"]

  metadata:
    title: "TestPatient persistence, content_hash dedup and replay diff bucketing"
    description: >
      Verifies the persistence and replay engine for the reusable test
      patient library: deterministic content_hash, idempotent save,
      EXPECTED_RESULT writes, dry-run branch path walking, diff_replay
      bucketing into pass / regression / unexpected, and replay_scope
      report persistence.
    test_level: "unit"
    test_type: "functional"
    safety_class: "B"
    automation_status: "automated"
    automation_framework: "pytest"
    test_file_paths:
      - "services/api/tests/test_test_patient_service.py"

  test_environment:
    environment_type: "development"
    prerequisites: []
    test_data:
      data_type: "synthetic"
      cleanup_required: false

  test_cases:
    - case_id: "VT-164-TC-001"
      case_name: "content_hash is order-insensitive across permuted codes and case-insensitive sex"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build two PatientPayload values with the same codes in different order and sex 'male' vs 'MALE'; compare content_hash()."
          expected_result: "Both hashes equal."
          verification_method: "automated"
      acceptance_criteria:
        - "Hash is deterministic under permutation and case."

    - case_id: "VT-164-TC-002"
      case_name: "content_hash changes when demographics change"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Build two PatientPayload values that differ only in age (70 vs 71)."
          expected_result: "Hashes differ."
          verification_method: "automated"
      acceptance_criteria:
        - "Hash is sensitive to age changes."

    - case_id: "VT-164-TC-003"
      case_name: "content_hash strips whitespace and dedups in code list"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Compare hash of codes=['1', ' 1 ', ''] against codes=['1']."
          expected_result: "Hashes equal."
          verification_method: "automated"
      acceptance_criteria:
        - "normalised_codes drops whitespace and empty entries."

    - case_id: "VT-164-TC-004"
      case_name: "_walk_satisfied succeeds for AND when all CONCEPT children match"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _walk_satisfied on AND(c1=100, c2=200) with codes={100, 200}; then with codes={100}."
          expected_result: "First call returns True with both children plus root in acc; second returns False."
          verification_method: "automated"
      acceptance_criteria:
        - "AND truth-table preserved."

    - case_id: "VT-164-TC-005"
      case_name: "_walk_satisfied implements AT_LEAST(min=2)"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _walk_satisfied on AT_LEAST(min=2) over three CONCEPTs with two matching codes; then with one matching code."
          expected_result: "True with two; False with one."
          verification_method: "automated"
      acceptance_criteria:
        - "AT_LEAST counting respects min."

    - case_id: "VT-164-TC-006"
      case_name: "_walk_satisfied inverts NOT correctly"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run _walk_satisfied on NOT(CONCEPT=999) with codes={999}; then with codes=set()."
          expected_result: "False then True."
          verification_method: "automated"
      acceptance_criteria:
        - "NOT semantics preserved."

    - case_id: "VT-164-TC-007"
      case_name: "_check_demographic respects age operator and sex equality"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Run _check_demographic for age >= 65 with patient ages 70 and 60; for sex == 'male' with patient sex 'MALE'."
          expected_result: "True / False / True respectively."
          verification_method: "automated"
      acceptance_criteria:
        - "Demographic comparator handles operator vocabulary."

    - case_id: "VT-164-TC-008"
      case_name: "dry_run returns matched_rules and per-rule branch_paths"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub evaluate_against_terminology to return one matched rule, stub list_rules_in_scope to return its logic_json, call dry_run."
          expected_result: "Result includes matched_rules, branch_paths[r1] == ['c1', 'root'] (any order), and ruleset_version 'v42'."
          verification_method: "automated"
      acceptance_criteria:
        - "dry_run merges eval result and tree walk."

    - case_id: "VT-164-TC-009"
      case_name: "dry_run propagates RuntimeError from terminology API"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Stub evaluate_against_terminology to raise RuntimeError; call dry_run."
          expected_result: "RuntimeError surfaces with the same message."
          verification_method: "automated"
      acceptance_criteria:
        - "Caller can map to HTTP 502."

    - case_id: "VT-164-TC-010"
      case_name: "confirm_and_save returns duplicate envelope and writes nothing on hash collision"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub find_existing to return 'tp_existing'; call confirm_and_save with skip_if_exists=True."
          expected_result: "Result is {id: 'tp_existing', created: False, expectations_written: 0, reason: 'duplicate'} and the Cypher client is not called."
          verification_method: "automated"
      acceptance_criteria:
        - "Idempotent skip on duplicate hash."

    - case_id: "VT-164-TC-011"
      case_name: "confirm_and_save writes one CREATE + N expectation rels and ignores empty rule_id"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub find_existing to None; call confirm_and_save with three expectations, one of which has rule_id=''."
          expected_result: "Result {created: True, expectations_written: 2}; client.run called 3 times (1 CREATE + 2 valid expectation writes)."
          verification_method: "automated"
      acceptance_criteria:
        - "Empty rule_id ignored; ruleset_version threaded through."

    - case_id: "VT-164-TC-012"
      case_name: "diff_replay buckets passes / regressions / unexpected_matches"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Run diff_replay with expectations [{r1: True}, {r2: False}, {r3: True}] and current matches [{r1}, {r2}, {r4}]."
          expected_result: "passes ids = {r1}; regressions ids = {r2, r3}; unexpected_matches ids = [r4]; total_assertions = 3."
          verification_method: "automated"
      acceptance_criteria:
        - "Bucketing matches the regression-detection contract."

    - case_id: "VT-164-TC-013"
      case_name: "replay_scope persists a :RulesetReplay node when persist_report=True"
      priority: "critical"
      test_steps:
        - step_number: 1
          action: "Stub list_patients with one patient, evaluate_against_terminology to return the asserted match, _persist_replay_report to capture the report."
          expected_result: "Returned report carries id='rv_test', passes_count=1, regressions_count=0, patient_count=1; persisted ruleset_version='v1'."
          verification_method: "automated"
      acceptance_criteria:
        - "Aggregate counts match per-patient diffs."

    - case_id: "VT-164-TC-014"
      case_name: "replay_scope skips persistence when persist_report=False"
      priority: "high"
      test_steps:
        - step_number: 1
          action: "Stub list_patients to []; spy on _persist_replay_report; call replay_scope(persist_report=False)."
          expected_result: "Report has no 'id' key and _persist_replay_report is never called."
          verification_method: "automated"
      acceptance_criteria:
        - "Caller can opt out of persistence (e.g. preview replays)."

  pass_fail_criteria:
    pass_threshold: "100% critical, 100% all"
    blocking_on_failure: true

  evidence:
    evidence_types: ["automated_test_run"]
    storage_location: "/evidence-bundles/LEO-AI/verification/VT-LEO-AI-164/"
    retention_period: "7 years"
    immutability: true

  execution_history:
    - execution_id: "VT-164-EXEC-001"
      executed_by: "automated_pytest"
      executed_date: "2026-04-17"
      result: "pass"
      command: ".venv/bin/python -m pytest services/api/tests/test_test_patient_service.py -v"
      total_cases: 14
      passed: 14
      failed: 0
      notes: >
        14/14 cases passed. Service-layer tests use unittest.mock.MagicMock
        for the CodingGraphClient and monkeypatch evaluate_against_terminology
        so the suite runs without Neo4j or the terminology API.
