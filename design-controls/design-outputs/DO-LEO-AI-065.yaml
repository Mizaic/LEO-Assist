  specification:
    title: "Bitmap Store, Guideline Compiler, and Evaluator in Terminology API"
    description: |
      Four-file implementation in terminology_api: BitmapStore wraps pyroaring
      BitMap with Redis persistence and deterministic BLAKE2b key scheme;
      GuidelineCompiler reads active AppropriatenessRules from Neo4j and compiles
      them into versioned Roaring bitmaps; GuidelineEvaluator performs microsecond
      reqAll/forbid intersection checks against patient SNOMED codes; FastAPI router
      exposes evaluation, compile, versions, activate, and status endpoints.
    purpose: "Provide fast, deterministic, auditable guideline matching for the inference pipeline"
    technical_approach: "pyroaring + Redis + Neo4j + asyncio.to_thread for CPU-bound compile"
    acceptance_criteria:
      - criterion: "Deterministic bitmap IDs"
        type: "functional"
        measurement: "Test"
        target: "Same int_id set always produces the same BLAKE2b hash key"
      - criterion: "Only active rules compiled"
        type: "safety"
        measurement: "Test"
        target: "GuidelineCompiler Cypher filters status: active; pending_review rules never appear in bitmap"
      - criterion: "Evaluation correctness"
        type: "functional"
        measurement: "Test"
        target: "reqAll satisfied + no forbid intersection -> match; forbid intersection -> no match"

  implementation:
    artifacts:
      - artifact_type: "source_code"
        location: "services/terminology_api/app/services/bitmap_store.py"
        description: "BitmapStore: Redis-backed pyroaring BitMap store"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/terminology_api/app/services/guideline_compiler.py"
        description: "GuidelineCompiler: compiles active rules from Neo4j into Redis bitmaps"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/terminology_api/app/services/guideline_evaluator.py"
        description: "GuidelineEvaluator: evaluates patient codes against active bitmap ruleset"
        storage_location: "git"
      - artifact_type: "source_code"
        location: "services/terminology_api/app/routers/guidelines.py"
        description: "FastAPI router: evaluate, compile, versions, activate, status"
        storage_location: "git"
      - artifact_type: "test"
        location: "services/terminology_api/tests/test_bitmap_store.py"
        storage_location: "git"
      - artifact_type: "test"
        location: "services/terminology_api/tests/test_guideline_compiler.py"
        storage_location: "git"
      - artifact_type: "test"
        location: "services/terminology_api/tests/test_guideline_evaluator.py"
        storage_location: "git"

    technical_details:
